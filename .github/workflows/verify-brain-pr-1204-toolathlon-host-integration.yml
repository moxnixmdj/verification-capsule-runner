name: Verify Brain PR 1204 Toolathlon host integration
on:
  push:
    branches: ["verify-brain-pr-1204-toolathlon-host-integration"]
    paths:
      - "capsules/brain_pr_1204_toolathlon_host_integration/**"
      - ".github/workflows/verify-brain-pr-1204-toolathlon-host-integration.yml"
  pull_request:
    branches: [main]
    paths:
      - "capsules/brain_pr_1204_toolathlon_host_integration/**"
      - ".github/workflows/verify-brain-pr-1204-toolathlon-host-integration.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reuse independently mirrored exact dependencies
        run: |
          set -euo pipefail
          dst=capsules/brain_pr_1204_toolathlon_host_integration/canonical/runtime
          src=capsules/brain_pr_1203_toolathlon_general_substrate_materiality/canonical/runtime
          test "$(git hash-object "$src/toolathlon_brain_owned_selection_adapter_v1.py")" = "64c66a56a681b2919fbfcaf09c325c5db55f5f81"
          test "$(git hash-object "$src/acceptance_capability_source_gate_v2.py")" = "b168b131f6383e158bdc0d931439d14e61f2a5de"
          cp "$src/toolathlon_brain_owned_selection_adapter_v1.py" "$dst/"
          cp "$src/acceptance_capability_source_gate_v2.py" "$dst/"
      - name: Verify exact Brain PR1204 bytes
        run: |
          set -euo pipefail
          cd capsules/brain_pr_1204_toolathlon_host_integration
          test "$(git hash-object canonical/governance/TOOLATHLON_BRAIN_HOST_INTEGRATION_V1.json)" = "60d4663f70ea5545ce0ffeb36f07fe3fe4526764"
          test "$(git hash-object canonical/runtime/toolathlon_brain_host_integration_v1.py)" = "c996ad810fd75446f7b5b61761b5258ebbfaf0bb"
          test "$(git hash-object canonical/tests/test_toolathlon_brain_host_integration_v1.py)" = "92f197b2d4392c2b7ee4c29d2397a02955b6d40a"
          test "$(git hash-object canonical/runtime/toolathlon_brain_owned_selection_adapter_v1.py)" = "64c66a56a681b2919fbfcaf09c325c5db55f5f81"
          test "$(git hash-object canonical/runtime/acceptance_capability_source_gate_v2.py)" = "b168b131f6383e158bdc0d931439d14e61f2a5de"
      - name: Run host integration adversarial tests
        run: |
          set -euo pipefail
          cd capsules/brain_pr_1204_toolathlon_host_integration
          export PYTHONPATH=.
          python -m unittest canonical.tests.test_toolathlon_brain_host_integration_v1 -v
      - name: Promotion preflight source gate
        run: |
          set -euo pipefail
          cd capsules/brain_pr_1204_toolathlon_host_integration
          export PYTHONPATH=.
          python - <<'PY'
          import json
          from canonical.runtime import toolathlon_brain_owned_selection_adapter_v1 as a
          from canonical.runtime import acceptance_capability_source_gate_v2 as g
          gov=json.load(open("canonical/governance/TOOLATHLON_BRAIN_HOST_INTEGRATION_V1.json",encoding="utf-8"))
          blocked=g.evaluate(a.source_gate_v2_candidate_route(
              general_substrate_test_pass=True,
              benchmark_harness_zero_cost=False,
          ))
          assert blocked["pass"] is False
          assert blocked["errors"] == ["HARNESS_ZERO_COST_NOT_PROVEN"], blocked
          hypothetical=g.evaluate(a.source_gate_v2_candidate_route(
              general_substrate_test_pass=True,
              benchmark_harness_zero_cost=True,
          ))
          assert hypothetical["pass"] is True, hypothetical
          assert gov["terminal_results_observed"] == 0
          assert gov["new_reality_units_consumed"] == 0
          assert gov["capability_credit_delta"] == 0 and gov["family_credit_delta"] == 0
          assert gov["execution_authority"] is False and gov["promotion_authority"] is False
          print("Brain PR1204 Toolathlon host integration + promotion preflight: PASS")
          PY

# synchronize verification after PR creation
