name: Preflight Parent Chemistry PubChem Sources

on:
  pull_request:
    branches:
      - main
    paths:
      - ARM_PARENT_CHEMISTRY_PUBCHEM_PREFLIGHT_20260930_V1

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Preflight exact frozen PubChem sources only
        id: preflight
        continue-on-error: true
        run: python preflight_parent_chemistry_pubchem.py
      - name: Upload preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parent-chemistry-pubchem-preflight
          path: parent-chemistry-pubchem-preflight.json
          if-no-files-found: error
      - name: Preserve preflight failure
        if: steps.preflight.outcome != 'success'
        run: exit 1
