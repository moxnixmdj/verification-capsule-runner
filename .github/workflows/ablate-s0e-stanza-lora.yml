name: Ablate Stanza coref LoRA on frozen dev
on:
  pull_request:
    branches: [main]
    paths:
      - 'verification/s0e_stanza_lora_ablation.py'
      - '.github/workflows/ablate-s0e-stanza-lora.yml'
permissions:
  contents: read
jobs:
  ablate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PIP_NO_CACHE_DIR: "1"
      HF_HOME: /tmp/hf
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch
      - run: python -m pip install --no-cache-dir 'stanza==1.14.0' 'transformers>=4.56,<5' peft
      - run: python verification/s0e_stanza_lora_ablation.py
