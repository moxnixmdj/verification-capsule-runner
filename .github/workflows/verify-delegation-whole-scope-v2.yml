name: Verify delegation whole-dimension preflight V2
on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/runtime/delegation_whole_scope_candidate_v2.py'
      - 'canonical/runtime/delegation_whole_scope_proof_v2.py'
      - 'canonical/tests/test_delegation_whole_scope_v2.py'
      - '.github/workflows/verify-delegation-whole-scope-v2.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Bind exact Brain blobs
        run: |
          test "$(git hash-object canonical/runtime/delegation_whole_scope_candidate_v2.py)" = "9f2c3aa42352cba66967afb1f8a3f45357833c41"
          test "$(git hash-object canonical/runtime/delegation_whole_scope_proof_v2.py)" = "5785b07f482e38acdf7916e5414d90c2c0c305b7"
          test "$(git hash-object canonical/tests/test_delegation_whole_scope_v2.py)" = "7052641c539cf179b48f344c6092ab24e6e931ff"
      - name: Run whole-dimension delegation preflight
        run: PYTHONPATH=. python -m unittest -v canonical.tests.test_delegation_whole_scope_v2
