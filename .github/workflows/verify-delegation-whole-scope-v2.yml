name: Verify delegation whole-dimension preflight V2
on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/runtime/delegation_whole_scope_candidate_v2.py'
      - 'canonical/runtime/delegation_whole_scope_proof_v2.py'
      - 'canonical/tests/test_delegation_whole_scope_v2.py'
      - 'canonical/tests/test_delegation_feasible_plan_regression_v1.py'
      - '.github/workflows/verify-delegation-whole-scope-v2.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Bind exact Brain blobs
        run: |
          test "$(git hash-object canonical/runtime/delegation_whole_scope_candidate_v2.py)" = "f1a93ee66d90093de61dc17c6ebf2e24073df522"
          test "$(git hash-object canonical/runtime/delegation_whole_scope_proof_v2.py)" = "928466401b36e4f3b09c517950cc050432a0616f"
          test "$(git hash-object canonical/tests/test_delegation_whole_scope_v2.py)" = "7052641c539cf179b48f344c6092ab24e6e931ff"
      - name: Run whole-dimension delegation preflight
        run: |
          PYTHONPATH=. python -m unittest -v canonical.tests.test_delegation_whole_scope_v2
          PYTHONPATH=. python -m unittest -v canonical.tests.test_delegation_feasible_plan_regression_v1
