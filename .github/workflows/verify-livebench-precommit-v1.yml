name: Verify LiveBench execution precommit v1

on:
  pull_request:
    paths:
      - 'verify_livebench_precommit_v1.py'
      - 'subject/livebench_precommit_v1/**'
      - '.github/workflows/verify-livebench-precommit-v1.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python verify_livebench_precommit_v1.py
