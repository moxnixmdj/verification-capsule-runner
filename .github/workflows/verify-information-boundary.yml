name: Verify continuous OBS information boundary
on:
  pull_request:
    branches: [main]
    paths:
      - 'verification/information_boundary/**'
      - '.github/workflows/verify-information-boundary.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m unittest -v verification.information_boundary.test_information_boundary
