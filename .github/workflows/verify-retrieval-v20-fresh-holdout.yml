name: Verify Retrieval V20 fresh holdout
on:
  push:
    branches:
      - verify/retrieval-v20-fresh-holdout-20261004
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Offline holdout invariants
        run: PYTHONPATH=. python canonical/tests/test_retrieval_fresh_holdout_arena_v20.py
      - name: Fresh live holdout
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: PYTHONPATH=. python verify_retrieval_v20_fresh_holdout.py
