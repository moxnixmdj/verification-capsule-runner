name: Verify current Brain scope-equivalent proof gate
on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/runtime/scope_equivalent_proof_gate.py'
      - 'canonical/tests/test_scope_equivalent_proof_gate.py'
      - '.github/workflows/verify-scope-equivalent-proof-gate-current.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Compile exact gate and tests
        run: python -m py_compile canonical/runtime/scope_equivalent_proof_gate.py canonical/tests/test_scope_equivalent_proof_gate.py
      - name: Run exact current Brain gate tests
        run: PYTHONPATH=. python -m unittest -v canonical.tests.test_scope_equivalent_proof_gate
