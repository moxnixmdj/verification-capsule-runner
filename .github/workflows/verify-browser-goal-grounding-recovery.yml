name: Verify browser goal grounding recovery
on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/runtime/browser_goal_grounding_recovery_proof.py'
      - 'canonical/runtime/browser_goal_grounding_recovery_candidate.py'
      - 'canonical/tests/test_browser_goal_grounding_recovery_proof.py'
      - 'canonical/runtime/consensus_dom_grounding.py'
      - '.github/workflows/verify-browser-goal-grounding-recovery.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact Brain blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object 'canonical/runtime/browser_goal_grounding_recovery_proof.py')" = '3baad00fefc55c6bc58b067e9c844417d27f8ac2'
          test "$(git hash-object 'canonical/runtime/browser_goal_grounding_recovery_candidate.py')" = '8da3077d0f4ff1064f07adcbf5a340096179b267'
          test "$(git hash-object 'canonical/tests/test_browser_goal_grounding_recovery_proof.py')" = 'f37bbe65440735401023e3419d63ac3d797a8b10'
          test "$(git hash-object 'canonical/runtime/consensus_dom_grounding.py')" = '2849a9eea74c6c595709f77eba23fd40a3be8c9a'
      - name: Execute browser grounding recovery tests
        run: python -m unittest -v canonical.tests.test_browser_goal_grounding_recovery_proof
