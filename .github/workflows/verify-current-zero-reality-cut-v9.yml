name: Verify current zero reality cut V9
on:
  pull_request:
    branches: [main]
    paths:
      - "fixtures/current_zero_reality_cut_v9.json"
      - "fixtures/root2_route_inventory_v1.json"
      - "verify_current_zero_reality_cut_v9.py"
      - ".github/workflows/verify-current-zero-reality-cut-v9.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact V9 truth-preserving compression
        run: python verify_current_zero_reality_cut_v9.py
