name: Verify LiveBench legacy semantic-seed composer V1

on:
  push:
    branches:
      - 'verify/livebench-legacy-seed-composer-v1-20261004-sol'
  pull_request:
    paths:
      - 'verification_inputs/canonical/runtime/livebench_legacy_ifeval_prompt_inverter_v1.py'
      - 'verification_inputs/canonical/runtime/livebench_legacy_seed_composer_v1.py'
      - 'verification/verify_livebench_legacy_seed_composer_v1.py'
      - '.github/workflows/verify-livebench-legacy-seed-composer-v1.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned verifier dependencies
        run: python -m pip install --disable-pip-version-check langdetect==1.0.9 nltk==3.9.1 immutabledict==4.2.1
      - name: Checkout pinned LiveBench source
        run: |
          git clone --quiet https://github.com/LiveBench/LiveBench.git /tmp/LiveBench
          git -C /tmp/LiveBench checkout --quiet 8f8e5c381a16e3f24257776edd53471fe86f8091
          test "$(git -C /tmp/LiveBench rev-parse HEAD)" = "8f8e5c381a16e3f24257776edd53471fe86f8091"
      - name: Verify exact upstream checker behavior and seed preservation
        run: python verification/verify_livebench_legacy_seed_composer_v1.py
