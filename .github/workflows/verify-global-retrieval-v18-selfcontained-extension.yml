name: Verify self-contained Retrieval V18 extension
on:
  push:
    branches:
      - verify/global-retrieval-v18-live-extension-20261004
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python verify_global_retrieval_v18_selfcontained_extension.py
