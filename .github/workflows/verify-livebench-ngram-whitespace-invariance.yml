name: Verify LiveBench NGram Whitespace Invariance
on:
  pull_request:
    branches:
      - main
    paths:
      - verify_livebench_ngram_whitespace_invariance.py
      - .github/workflows/verify-livebench-ngram-whitespace-invariance.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prove and construct from pinned public bytes
        run: python verify_livebench_ngram_whitespace_invariance.py
      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livebench-ngram-whitespace-invariance-receipt
          path: livebench_ngram_whitespace_invariance_receipt.json
          if-no-files-found: error
