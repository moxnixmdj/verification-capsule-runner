name: Verify AutomationBench public zero-cost route
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Fetch exact public AutomationBench release
        run: |
          git clone -q https://github.com/zapier/AutomationBench.git /tmp/automationbench
          git -C /tmp/automationbench checkout -q 4a8e1061254004d9dac807054eed33fad7d1ff14
          test "$(git -C /tmp/automationbench rev-parse HEAD)" = "4a8e1061254004d9dac807054eed33fad7d1ff14"
      - name: Install public benchmark and dev tests
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir -e '/tmp/automationbench'
          python -m pip install --disable-pip-version-check --no-cache-dir 'pytest>=9.0.2' 'pytest-asyncio>=1.3.0'
      - name: Run deterministic benchmark test suite
        working-directory: /tmp/automationbench
        run: |
          pytest -q
      - name: Verify six scored public domains and strict assertion metric without task execution
        env:
          AUTOMATIONBENCH_ROOT: /tmp/automationbench
        run: |
          python - <<'PY'
          import ast, json
          from pathlib import Path
          root=Path("/tmp/automationbench")
          domains=["sales","marketing","operations","support","finance","hr"]
          rows=[]
          for d in domains:
              p=root/"automationbench"/"domains"/d/"tasks.py"
              assert p.is_file(), p
              src=p.read_text()
              tree=ast.parse(src)
              # Static source count only: task payloads are not emitted or executed.
              ids=[]
              for node in ast.walk(tree):
                  if isinstance(node, ast.Constant) and isinstance(node.value,str):
                      v=node.value
                      if v.startswith(d+"_") or v.startswith(d+"-"):
                          ids.append(v)
              rows.append({"domain":d,"task_source_sha256":__import__("hashlib").sha256(src.encode()).hexdigest(),"candidate_id_literal_count":len(set(ids))})
          from automationbench.rubric import task_completed_correctly
          import inspect
          metric_src=inspect.getsource(task_completed_correctly)
          assert "all(" in metric_src or "failed" in metric_src.lower() or "1.0" in metric_src
          print("RESULT_JSON="+json.dumps({
            "status":"PASS",
            "pinned_commit":"4a8e1061254004d9dac807054eed33fad7d1ff14",
            "scored_domains":domains,
            "domain_count":6,
            "task_sources":rows,
            "strict_binary_metric_present":True,
            "terminal_task_execution":False,
            "terminal_results_observed":0
          },sort_keys=True))
          PY
      - name: Verify custom base URL is accepted without paid provider dependency
        working-directory: /tmp/automationbench
        run: |
          auto-bench --help >/tmp/auto-help.txt
          grep -q -- '--base-url' /tmp/auto-help.txt
          grep -q -- '--api-key' /tmp/auto-help.txt
          python - <<'PY'
          from pathlib import Path
          s=Path("/tmp/auto-help.txt").read_text()
          assert "--base-url" in s and "--api-key" in s
          print({"custom_base_url_route":"PASS","paid_provider_runtime_required_by_cli":False})
          PY
