name: Verify terminal structural parallelization root
on:
  pull_request:
    paths:
      - 'subject/terminal_structural_parallelization_root_20261004_sol/**'
      - 'verify_terminal_structural_parallelization_root.py'
      - '.github/workflows/verify-terminal-structural-parallelization-root.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python verify_terminal_structural_parallelization_root.py
