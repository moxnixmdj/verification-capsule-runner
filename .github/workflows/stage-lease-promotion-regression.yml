name: Stage lease promotion regression
on:
  push:
    branches: [main]
    paths:
      - 'session_bridge/acceptance_contract.py'
      - 'session_bridge/controller_fast.py'
      - 'verification/test_builder_semantic_success.py'
      - 'verification/test_acceptance_contract.py'
      - 'test_stage_lease_upgrade.py'
      - '.github/workflows/stage-lease-promotion-regression.yml'
  pull_request:
    branches: [main]
    paths:
      - 'session_bridge/acceptance_contract.py'
      - 'session_bridge/controller_fast.py'
      - 'verification/test_acceptance_contract.py'
      - 'test_stage_lease_upgrade.py'
      - '.github/workflows/stage-lease-promotion-regression.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile session_bridge/acceptance_contract.py session_bridge/controller_fast.py
      - run: PYTHONPATH=session_bridge python -m unittest -v verification/test_builder_semantic_success.py
      - run: python -m unittest -v test_stage_lease_upgrade.py
      - run: PYTHONPATH=session_bridge python -m unittest -v verification/test_acceptance_contract.py

  execution-surface-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Prove Debian Python policy and venv escape on exact base
        run: |
          cat > /tmp/Dockerfile.surface <<'EOF'
          FROM ubuntu:24.04
          ENV DEBIAN_FRONTEND=noninteractive
          RUN apt-get update && apt-get install -y --no-install-recommends python3 python3-pip python3-venv ca-certificates && rm -rf /var/lib/apt/lists/*
          WORKDIR /app
          EOF
          docker build -f /tmp/Dockerfile.surface -t brain-surface-parity /tmp
          docker run --rm brain-surface-parity /bin/bash -lc '
            set -eu
            if python3 -m pip install --disable-pip-version-check --no-input packaging >/tmp/system-pip.out 2>/tmp/system-pip.err; then
              echo "SYSTEM_PIP_UNEXPECTEDLY_SUCCEEDED"
              cat /tmp/system-pip.out /tmp/system-pip.err
              exit 1
            fi
            grep -qi "externally-managed-environment\|externally managed" /tmp/system-pip.err
            python3 -m venv /tmp/brain-venv
            /tmp/brain-venv/bin/python -m pip install --disable-pip-version-check --no-input packaging
            /tmp/brain-venv/bin/python -c "import packaging; print(packaging.__version__)"
          '

  freecad-api-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Prove FreeCAD 0.21.2 Vector API and deceptive exit behavior
        run: |
          cat > /tmp/Dockerfile.freecad-api <<'EOF'
          FROM mambaorg/micromamba:1.5
          USER root
          RUN micromamba install -y -n base -c conda-forge python=3.11 'freecad=0.21.2=*py311*' && micromamba clean --all --yes
          ENV PATH=/opt/conda/bin:$PATH
          ENV PYTHONPATH=/opt/conda/lib:/opt/conda/Mod:/opt/conda/share/Mod
          EOF
          docker build -f /tmp/Dockerfile.freecad-api -t brain-freecad-api /tmp
          docker run --rm brain-freecad-api /bin/bash -lc '
            set -eu
            python - <<"PY"
          import FreeCAD as App
          v=App.Vector(1,2,3)
          assert (v.x,v.y,v.z)==(1.0,2.0,3.0)
          assert not hasattr(v,"X")
          assert not hasattr(v,"Y")
          assert not hasattr(v,"Z")
          print("FREECAD_VECTOR_API_CONTRACT_PASS")
          PY
            cat >/tmp/fail.py <<"PY"
          raise RuntimeError("synthetic-freecad-script-failure")
          PY
            set +e
            freecadcmd /tmp/fail.py >/tmp/fail.out 2>/tmp/fail.err
            rc=$?
            set -e
            test "$rc" -eq 0
            grep -q "Exception while processing file" /tmp/fail.err
            echo "FREECADCMD_EXIT_ZERO_ON_SCRIPT_EXCEPTION_CONFIRMED"
          '
