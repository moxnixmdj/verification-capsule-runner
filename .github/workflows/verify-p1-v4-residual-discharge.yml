name: Verify Brain P1 V4 residual discharge

on:
  pull_request:
    paths:
      - "canonical/runtime/p1_v4_scope_safe_residual_discharge_v1.py"
      - "canonical/tests/test_p1_v4_scope_safe_residual_discharge_v1.py"
      - "canonical/runtime/p1_terminal_execution_scope_audit_v1.py"
      - "canonical/runtime/trajectory_failure_typed_ir_candidate_v4.py"
      - "canonical/runtime/trajectory_failure_typed_ir_proof_v4.py"
      - "canonical/verification/TRAJECTORY_TYPED_IR_V4_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json"
      - "canonical/governance/P1_TRAJECTORY_T0_T2_MULTIPLEX_TERMINAL_BINDING_V1.json"
      - "canonical/governance/TERMINAL_PARENT_PORTFOLIO_RUNNER_BINDING_V1.json"
      - "canonical/runtime/terminal_parent_portfolio_runner_v1.py"
      - "canonical/runtime/contract_native_proof_suites.py"
      - ".github/workflows/verify-p1-v4-residual-discharge.yml"
      - "verification-trigger/p1-v4-residual-discharge.txt"
      - "capsules/p1_typed_ir_v5/**"

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile exact live residual
        run: python -m canonical.runtime.p1_v4_scope_safe_residual_discharge_v1
      - name: Run fail-closed mutation tests
        run: python -m unittest canonical.tests.test_p1_v4_scope_safe_residual_discharge_v1 -v

  verify-p1-v5-independent:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Execute exact content-addressed P1 V5 independent verifier
        run: python capsules/p1_typed_ir_v5/verify.py
