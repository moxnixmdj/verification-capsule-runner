name: Verify unquoted exact atom LiveBench V2
on:
  pull_request:
    paths:
      - 'subject/unquoted_exact_atom_v1/**'
      - 'verify_unquoted_exact_atom_livebench_v2.py'
      - '.github/workflows/verify-unquoted-exact-atom-livebench-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact bytes and canonical public synthetic fast path
        run: python verify_unquoted_exact_atom_livebench_v2.py
