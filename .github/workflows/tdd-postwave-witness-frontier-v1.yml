name: TDD postwave witness frontier v1
on:
  pull_request:
    branches: [main]
    paths:
      - 'capsules/postwave_witness_frontier_v1/**'
      - '.github/workflows/tdd-postwave-witness-frontier-v1.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run frontier tests
        run: |
          cd capsules/postwave_witness_frontier_v1
          PYTHONPATH=. python -m unittest canonical.tests.test_postwave_witness_frontier_delta_v1 -v
