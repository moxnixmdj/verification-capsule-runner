name: Verify Root2 synthesis coverage V2 reconciliation
on:
  pull_request:
    paths:
      - 'subject/ROOT2_CLOSURE_CONTROLLER_V2.json'
      - 'subject/root2_closure_controller_v2.py'
      - 'subject/test_root2_closure_controller_v2.py'
      - 'subject/ACTION_INTENT_ROOT2_SYNTHESIS_COVERAGE_V2_RECONCILIATION_20261004.json'
      - 'subject/ROOT2_CLOSURE_V2_CURRENT_FRONTIER_V1.json'
      - 'verify_root2_synthesis_coverage_v2_reconciliation.py'
      - '.github/workflows/verify-root2-synthesis-coverage-v2-reconciliation.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact reconciled bytes and invariants
        run: python verify_root2_synthesis_coverage_v2_reconciliation.py
