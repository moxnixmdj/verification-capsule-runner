name: Reverify global residual compiler on live frontier
on:
  pull_request:
    branches: [main]
    paths:
      - 'capsules/global_residual_live_reverify/**'
      - '.github/workflows/verify-global-residual-live-reverify.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Verify exact Brain blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object capsules/global_residual_live_reverify/canonical/runtime/global_residual_proof_compiler.py)" = "49719238fcaee0ea3cc5dab4a5cd220f440ce2cf"
          test "$(git hash-object capsules/global_residual_live_reverify/canonical/runtime/terminal_proof_supercompiler.py)" = "c7a4b8bc29d041fcc04fbcfa8a79db44fa9fe370"
          test "$(git hash-object capsules/global_residual_live_reverify/canonical/tests/test_global_residual_proof_compiler.py)" = "8d6b063b1c92c03eaf45161ec65fa00b41c1268d"
          test "$(git hash-object capsules/global_residual_live_reverify/canonical/governance/GLOBAL_RESIDUAL_PROOF_COMPILER_LIVE_INPUT_V1.json)" = "f2f6f937b86915267480809a410a4d76ec3a2fff"
      - name: Run compiler regression tests
        working-directory: capsules/global_residual_live_reverify
        run: python -m unittest -v canonical.tests.test_global_residual_proof_compiler
      - name: Compile current live frontier
        working-directory: capsules/global_residual_live_reverify
        shell: bash
        run: |
          set -euo pipefail
          python canonical/runtime/global_residual_proof_compiler.py             canonical/governance/GLOBAL_RESIDUAL_PROOF_COMPILER_LIVE_INPUT_V1.json             > verdict.json
          python - <<'PY'
          import json
          v=json.load(open("verdict.json", encoding="utf-8"))
          assert v["pass"] is True, v
          assert v["status"] == "GLOBAL_RESIDUAL_PARTITION_FOUND", v
          assert v["internally_coverable_obligations"] == ["TRAJECTORY_CRITICAL_FAILURE_LOCALIZATION_001"], v
          assert [x["obligation_id"] for x in v["residual_obligations"]] == [
            "BROWSER_VISUAL_STATE_TO_GROUNDED_ACTION_001",
            "CAD_DRAWING_TO_GLOBAL_SOLID_TOPOLOGY_AND_ENVELOPE_001",
            "ITERATIVE_RESEARCH_EVIDENCE_CONTROL_001",
            "TASK_TO_DELEGATION_GRAPH_001",
            "TOOL_ROUTE_DISCOVERY_AND_SELECTION_001",
          ], v
          assert v["minimum_internal_unblock_cut"]["blocker_ids"] == [
            "P1_SCOPE_EQUIVALENCE",
            "P1_TERMINAL_BINDING",
          ], v
          assert v["minimum_internal_unblock_cut"]["new_reality_units"] == 0, v
          assert v["execution_authority"] is False, v
          assert v["capability_credit_delta"] == 0, v
          print(json.dumps(v, indent=2, sort_keys=True))
          PY
