name: Verify LiveBench output-only threshold prepass v1
on:
  push:
    branches:
      - "verify-livebench-output-prepass-v1"
    paths:
      - "subject/livebench_output_prepass_v1/**"
      - "verify_livebench_output_prepass_v1.py"
      - ".github/workflows/verify-livebench-output-prepass-v1.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python verify_livebench_output_prepass_v1.py
