name: Verify Brain Opus55 calibration v2

on:
  pull_request:
    paths:
      - 'capsules/opus55_calibration_v2/**'
      - '.github/workflows/verify-opus55-calibration-v2.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact mirrored Brain blob identities
        env:
          EXPECTED_JSON: '{"capsules/opus55_calibration_v2/canonical/runtime/opus55_acceptance_calibration_reducer_v2.py":"73b0b27644e0fa0d89ff8fbdb51005c20eae3632","capsules/opus55_calibration_v2/canonical/tests/test_opus55_acceptance_calibration_reducer_v2.py":"140ea97927113a4bbf95c7bda41bc25a33b09336","capsules/opus55_calibration_v2/canonical/governance/OPUS55_ACCEPTANCE_CALIBRATION_V2.json":"5d08347f09f9635715a56422aa8f602b708e1e4d","capsules/opus55_calibration_v2/canonical/capabilities/opus55/OPUS_5_5_USEFUL_CAPABILITY_ENVELOPE_V1.json":"661a57f839101fbf54c7e4edc76166c65ce9327d","capsules/opus55_calibration_v2/canonical/governance/OPUS55_TERMINAL_PROOF_PROTOCOLS_V1.json":"eb4bca0fe6a015d49d2854998fbe046c979c7ea9","capsules/opus55_calibration_v2/canonical/verification/TERMINAL_V3_POSTWAVE_CONTRACT_AND_FAMILY_REDUCTION_20261002_V1.json":"51e3e7578e9adbeee2168d2223b84481fea16a09","capsules/opus55_calibration_v2/canonical/governance/OPUS55_ACCEPTANCE_PROOF_TRANSMUTATION_INPUT_V1.json":"4e6225fb182e10b0ed8d72d03abcba5ad70461d4","capsules/opus55_calibration_v2/canonical/runtime/acceptance_proof_transmuter_v1.py":"0580f9819b5465c9617f0a1e8ff9a96902eedfc6","capsules/opus55_calibration_v2/canonical/verification/TOOL_DISCOVERY_CEILING_TRANSMUTATION_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json":"521d4c665fcb5bf1147ce0fe65ea62c0a1429bdf"}'
        run: |
          python - <<'PY'
          import json,os,subprocess
          expected=json.loads(os.environ["EXPECTED_JSON"])
          bad=[]
          for path,want in expected.items():
              got=subprocess.check_output(["git","hash-object",path],text=True).strip()
              if got!=want: bad.append(f"{path}: {got} != {want}")
          if bad: raise SystemExit("\n".join(bad))
          print(f"EXACT_BLOB_IDENTITY_PASS {len(expected)}/{len(expected)}")
          PY
      - name: Run calibration v2 tests
        env:
          PYTHONPATH: capsules/opus55_calibration_v2
        run: |
          python -m unittest -v canonical.tests.test_opus55_acceptance_calibration_reducer_v2
      - name: Recompute exact calibration result
        env:
          PYTHONPATH: capsules/opus55_calibration_v2
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from canonical.runtime.opus55_acceptance_calibration_reducer_v2 import evaluate
          root=Path("capsules/opus55_calibration_v2")
          def load(p): return json.loads((root/p).read_text())
          out=evaluate(
            load("canonical/capabilities/opus55/OPUS_5_5_USEFUL_CAPABILITY_ENVELOPE_V1.json"),
            load("canonical/governance/OPUS55_TERMINAL_PROOF_PROTOCOLS_V1.json"),
            load("canonical/verification/TERMINAL_V3_POSTWAVE_CONTRACT_AND_FAMILY_REDUCTION_20261002_V1.json"),
            load("canonical/governance/OPUS55_ACCEPTANCE_PROOF_TRANSMUTATION_INPUT_V1.json"),
          )
          assert out["errors"]==[], out
          assert out["behavioral_pass_family_count"]==19, out
          assert out["acceptance_calibrated_family_count"]==3, out
          assert out["acceptance_pending_family_count"]==16, out
          assert out["terminal_goal_acceptance_closed"] is False, out
          expected={"EXACT_SYMBOLIC_COMPUTATION","LONG_HORIZON_MEMORY_AND_CONTINUITY","TOOL_DISCOVERY_SELECTION_AND_LEARNING"}
          assert set(out["acceptance_calibrated_families"])==expected, out
          prior=load("canonical/verification/TOOL_DISCOVERY_CEILING_TRANSMUTATION_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json")
          assert prior["verified"]["closed_family_count"]==3
          assert prior["fresh_acceptance_cases_consumed"]==0
          assert prior["terminal_results_replayed"]==0
          print(json.dumps({"calibrated":out["acceptance_calibrated_families"],"pending":16,"terminal":False},indent=2))
          PY
      - name: Assert frozen protocols and zero-credit governance
        run: |
          python - <<'PY'
          import json
          p="capsules/opus55_calibration_v2/canonical/governance/OPUS55_ACCEPTANCE_CALIBRATION_V2.json"
          d=json.load(open(p,encoding="utf-8"))
          assert "FROZEN_PROTOCOL_DEFINITIONS_ARE_NOT_MUTATED" in d["hard_rules"]
          assert d["capability_credit_delta"]==0
          assert d["family_credit_delta"]==0
          assert d["incremental_spend_usd"]==0
          print("FROZEN_PROTOCOL_ZERO_CREDIT_PASS")
          PY
