name: Verify TB4 CPU carrier assumption

on:
  push:
    paths:
      - ".github/workflows/verify-tb4-cpu-carrier-assumption.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Bind frozen TB4 leaderboard protocol without reading cases
        run: |
          set -euo pipefail
          git clone -q https://github.com/harbor-framework/terminal-bench.git /tmp/tb4
          git -C /tmp/tb4 checkout -q 1dcda8716784493721921c23e4bc7f7d988b4494
          python - <<'PY'
          from pathlib import Path
          s=Path("/tmp/tb4/leaderboard/SUBMIT.md").read_text()
          a=Path("/tmp/tb4/leaderboard/src/leaderboard/ci/static_analysis.py").read_text()
          assert "no resource overrides" in s
          assert "override_cpus" in a and "override_memory_mb" in a and "override_storage_mb" in a
          assert "host_cpus" not in a and "os.cpu_count" not in a and "/proc/cpuinfo" not in a
          print("TB4_LEADERBOARD_HAS_NO_PHYSICAL_HOST_CPU_CHECK")
          PY
      - name: Bind Harbor Docker CPU semantics
        run: |
          set -euo pipefail
          git clone -q https://github.com/harbor-framework/harbor.git /tmp/harbor
          git -C /tmp/harbor checkout -q fd1521a1da6250d9ed8fc7505caa0b7a72f36c4b
          python - <<'PY'
          from pathlib import Path
          d=Path("/tmp/harbor/src/harbor/environments/docker/docker.py").read_text()
          docs=Path("/tmp/harbor/docs-mintlify/core-concepts/tasks/resources.mdx").read_text()
          assert "auto_mode=ResourceMode.LIMIT" in d
          assert "You can override resource values at runtime" in docs
          assert "Hard ceiling only" in docs
          print("HARBOR_DOCKER_AUTO_CPU_IS_LIMIT")
          PY
      - name: Verify 8-CPU hard ceiling does not require 8 physical host CPUs
        run: |
          set -euo pipefail
          HOST_CPUS="$(nproc)"
          test "$HOST_CPUS" -eq 4
          docker run --rm --cpus=8 alpine:3.20 sh -c 'echo CONTAINER_STARTED; grep -E "Cpus_allowed_list" /proc/self/status'
          echo "HOST_CPUS=$HOST_CPUS"
          echo "TB4_EIGHT_CPU_LIMIT_STARTS_ON_FOUR_CPU_PUBLIC_RUNNER"
