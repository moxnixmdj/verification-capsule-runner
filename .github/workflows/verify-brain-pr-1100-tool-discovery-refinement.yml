name: Verify Brain PR 1100 tool-discovery refinement
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/brain_pr_1100_tool_discovery_refinement/**"
      - ".github/workflows/verify-brain-pr-1100-tool-discovery-refinement.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact Brain PR 1100 candidate blob identities
        shell: bash
        run: |
          set -euo pipefail
          cd capsules/brain_pr_1100_tool_discovery_refinement
          test "$(git hash-object canonical/runtime/tool_discovery_dynamic_refinement_v1.py)" = "991c039c0b405bf77508ce7921abc69460f57332"
          test "$(git hash-object canonical/tests/test_tool_discovery_dynamic_refinement_v1.py)" = "3314f7aa4921246c3c4031d7767a657759048b23"
          test "$(git hash-object canonical/governance/TOOL_DISCOVERY_COMPLETE_INTERFACE_CONTRACT_V1.json)" = "49cc878eccc0fbc8fdd83d35e5fbd614c973ffa7"
          test "$(git hash-object canonical/governance/TOOL_DISCOVERY_DYNAMIC_REFINEMENT_V1.json)" = "a09a2ef525fee949d5065329829a465bf97fb8ee"
          test "$(git hash-object canonical/action_intents/2026-10-03_TOOL_DISCOVERY_DYNAMIC_REFINEMENT_V1.json)" = "385c31b5612236801571e9b1abf52dbc5cf6def8"
      - name: Run adversarial refinement tests
        shell: bash
        run: |
          set -euo pipefail
          cd capsules/brain_pr_1100_tool_discovery_refinement
          export PYTHONPATH=.
          python -m unittest canonical.tests.test_tool_discovery_dynamic_refinement_v1 -v
      - name: Execute conditional refinement compiler
        shell: bash
        run: |
          set -euo pipefail
          cd capsules/brain_pr_1100_tool_discovery_refinement
          export PYTHONPATH=.
          python -m canonical.runtime.tool_discovery_dynamic_refinement_v1 > verdict.json
      - name: Enforce truth-preserving verdict
        shell: bash
        run: |
          set -euo pipefail
          cd capsules/brain_pr_1100_tool_discovery_refinement
          python - <<'PY'
          import json
          v=json.load(open("verdict.json",encoding="utf-8"))
          assert v["status"].startswith("PASS__CONDITIONAL_REFINEMENT_OBLIGATIONS_COMPILED"),v
          assert v["source_blob_drift"]==[],v
          assert v["target_preserved"] is True,v
          assert v["conditional_refinement_obligations_pass"] is True,v
          assert v["universal_target_proved"] is False,v
          assert v["dynamic_candidate"]["actions"]==["DISCOVER","ESCALATE","PROBE","SELECT"],v
          assert v["minimum_missing_fact"]=="INDEPENDENT_VERIFIED_COMPLETE_DISCOVERY_INTERFACE_INSTANCE_SATISFYING_TOOL_DISCOVERY_COMPLETE_INTERFACE_CONTRACT_V1",v
          assert v["new_reality_units_consumed"]==0,v
          assert v["terminal_results_replayed"]==0,v
          assert v["capability_credit_delta"]==0 and v["family_credit_delta"]==0,v
          assert v["execution_authority"] is False and v["promotion_authority"] is False,v
          print("tool-discovery conditional refinement: PASS")
          PY
