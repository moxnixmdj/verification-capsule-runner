name: Verify LiveBench successor pre-exposure V3
on:
  pull_request:
    paths:
      - 'subject/livebench_successor_preexposure_v3_20261004_sol/**'
      - 'verify_livebench_successor_preexposure_v3_20261004_sol.py'
      - '.github/workflows/verify-livebench-successor-preexposure-v3-20261004-sol.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python verify_livebench_successor_preexposure_v3_20261004_sol.py
