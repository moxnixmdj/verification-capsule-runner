name: Verify LiveBench local Qwen semantic seed
on:
  push:
    branches: ["verify/livebench-local-qwen-semantic-seed-v1-20261004"]
    paths:
      - "capsules/livebench_local_qwen_semantic_seed_v1/**"
      - ".github/workflows/verify-livebench-local-qwen-semantic-seed.yml"
  pull_request:
    branches: [main]
    paths:
      - "capsules/livebench_local_qwen_semantic_seed_v1/**"
      - ".github/workflows/verify-livebench-local-qwen-semantic-seed.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bind exact Brain PR1742 candidate bytes
        shell: bash
        run: |
          set -euo pipefail
          C=capsules/livebench_local_qwen_semantic_seed_v1
          test "$(git hash-object "$C/canonical/runtime/local_qwen_semantic_seed_v1.py")" = "5240e0c5651da0539ab58773f89d503cd4959c9d"
          test "$(git hash-object "$C/canonical/tests/test_local_qwen_semantic_seed_v1.py")" = "2b9bc7d7966b6fe9ec7450668f46828d5590bf3f"
          test "$(git hash-object "$C/canonical/governance/LIVEBENCH_LOCAL_QWEN_SEMANTIC_SEED_REUSE_V1.json")" = "aaef67365783f591ea633307c85dd1438add9420"
          grep -F 'http://127.0.0.1:8080/v1/chat/completions' "$C/canonical/runtime/local_qwen_semantic_seed_v1.py"
          ! grep -E 'https://|Authorization|Bearer ' "$C/canonical/runtime/local_qwen_semantic_seed_v1.py"

      - name: Run exact candidate unit tests
        shell: bash
        run: |
          set -euo pipefail
          C="$GITHUB_WORKSPACE/capsules/livebench_local_qwen_semantic_seed_v1"
          PYTHONPATH="$C" python -m unittest -v canonical.tests.test_local_qwen_semantic_seed_v1

      - name: Build exact pinned llama.cpp server
        shell: bash
        run: |
          set -euo pipefail
          git init llama.cpp
          git -C llama.cpp remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C llama.cpp fetch --depth 1 origin bec4772f6a2527d371557b5d2032641e5ff7619c
          git -C llama.cpp checkout --detach FETCH_HEAD
          test "$(git -C llama.cpp rev-parse HEAD)" = "bec4772f6a2527d371557b5d2032641e5ff7619c"
          cmake -S llama.cpp -B llama.cpp/build -DGGML_CUDA=OFF -DLLAMA_CURL=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build llama.cpp/build -j 2 --target llama-server

      - name: Download and verify exact pinned Qwen bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p models
          curl -L --fail --retry 3 --retry-delay 3 --silent --show-error             -o models/Qwen3.5-9B-M-TS-Q4_K_M.gguf             'https://huggingface.co/TheStageAI/Qwen3.5-9B-GGUF/resolve/main/Qwen3.5-9B-M-TS-Q4_K_M.gguf?download=true'
          echo 'f41c0a0c0e43bf721fb2da29374cd1a97271bac0bab08a9dc42964525e82350c  models/Qwen3.5-9B-M-TS-Q4_K_M.gguf' | sha256sum -c -
          test "$(stat -c '%s' models/Qwen3.5-9B-M-TS-Q4_K_M.gguf)" = "5060174144"

      - name: Start exact local endpoint
        shell: bash
        run: |
          set -euo pipefail
          EXTRA=()
          if llama.cpp/build/bin/llama-server --help 2>&1 | grep -q -- '--reasoning'; then EXTRA+=(--reasoning off); fi
          nohup llama.cpp/build/bin/llama-server             -m models/Qwen3.5-9B-M-TS-Q4_K_M.gguf             --alias brain-qwen3.5-9b             --host 127.0.0.1 --port 8080 -c 4096 -t 4 --parallel 1             --jinja --no-webui "${EXTRA[@]}"             > LOCAL_QWEN_SERVER.log 2>&1 &
          echo $! > LOCAL_QWEN_SERVER.pid
          ok=0
          for i in $(seq 1 240); do
            if curl -fsS http://127.0.0.1:8080/health > LOCAL_QWEN_HEALTH.json 2>/dev/null; then ok=1; break; fi
            sleep 1
          done
          test "$ok" = 1

      - name: Prove 12 nonterminal semantic contracts
        shell: bash
        run: |
          set -euo pipefail
          C="$GITHUB_WORKSPACE/capsules/livebench_local_qwen_semantic_seed_v1"
          cd "$C"
          PYTHONPATH="$C" python test_semantic_contracts.py | tee "$GITHUB_WORKSPACE/LOCAL_QWEN_SEMANTIC_RESULT.json"

      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livebench-local-qwen-semantic-seed-v1
          path: |
            LOCAL_QWEN_HEALTH.json
            LOCAL_QWEN_SERVER.log
            LOCAL_QWEN_SEMANTIC_RESULT.json
          if-no-files-found: warn
