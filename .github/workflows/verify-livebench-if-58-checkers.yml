name: Verify LiveBench IF 58 checker boundaries
on:
  push:
    branches: [verify-livebench-if-58-checkers-v1]
    paths:
      - verification/livebench_if_58_checker_preflight.py
      - .github/workflows/verify-livebench-if-58-checkers.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned Python dependencies
        run: |
          python -m pip install --no-cache-dir nltk==3.10.3 emoji==2.16.0 syllapy==0.7.2
      - name: Fetch pinned LiveBench verifier source only
        run: |
          git init /tmp/livebench
          git -C /tmp/livebench remote add origin https://github.com/LiveBench/LiveBench.git
          git -C /tmp/livebench fetch --depth=1 origin 8f8e5c381a16e3f24257776edd53471fe86f8091
          git -C /tmp/livebench checkout --detach FETCH_HEAD
      - name: Fetch pinned NLTK data artifacts
        run: |
          git init /tmp/nltk_data_repo
          git -C /tmp/nltk_data_repo remote add origin https://github.com/nltk/nltk_data.git
          git -C /tmp/nltk_data_repo fetch --depth=1 origin 550b6625bcef1f2abff2ff770a5a0d272c9c6b2a
          git -C /tmp/nltk_data_repo checkout --detach FETCH_HEAD
          mkdir -p /tmp/nltk_runtime/tokenizers /tmp/nltk_runtime/corpora /tmp/nltk_runtime/taggers
          unzip -q /tmp/nltk_data_repo/packages/tokenizers/punkt.zip -d /tmp/nltk_runtime/tokenizers
          unzip -q /tmp/nltk_data_repo/packages/tokenizers/punkt_tab.zip -d /tmp/nltk_runtime/tokenizers
          unzip -q /tmp/nltk_data_repo/packages/corpora/stopwords.zip -d /tmp/nltk_runtime/corpora
          unzip -q /tmp/nltk_data_repo/packages/taggers/averaged_perceptron_tagger.zip -d /tmp/nltk_runtime/taggers
          unzip -q /tmp/nltk_data_repo/packages/taggers/averaged_perceptron_tagger_eng.zip -d /tmp/nltk_runtime/taggers
      - name: Run all 58 synthetic good/bad checker boundaries
        env:
          LIVEBENCH_ROOT: /tmp/livebench
          NLTK_DATA: /tmp/nltk_runtime
        run: python verification/livebench_if_58_checker_preflight.py
