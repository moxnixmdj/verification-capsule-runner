name: Verify exact-current authority push V1
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-exact-current-authority-push-v1.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Assert exact current authority closure
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object canonical/runtime/terminal_wave_launch_authority_reducer_v1.py)" = "0b5b5e8229cc3e5ee950169469811e7576c43514"
          test "$(git hash-object canonical/tests/test_terminal_wave_launch_authority_reducer_v1.py)" = "352a01602259011d8d40f5db2d2b84e4c771a713"
          test "$(git hash-object canonical/runtime/terminal_parent_portfolio_launcher_v1.py)" = "d7f20a66f1f534b06ea11782cb350a582c07d985"
          test "$(git hash-object canonical/tests/test_terminal_parent_portfolio_launcher_v1.py)" = "01996bc0cca7246c0dcfea5b1602c4740fa3e45d"
          test "$(git hash-object canonical/governance/TERMINAL_PARENT_LAUNCHER_BINDING_V1.json)" = "e5c8b1721be1482e038982af359e7bd8698619cf"
          test "$(git hash-object canonical/verification/TERMINAL_PARENT_PORTFOLIO_LAUNCHER_SACCR_CORRECTED_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json)" = "6f01c97e220c91ade6ce54d92c402fbc81813e92"
          test "$(git hash-object canonical/governance/TERMINAL_ROUTE_SPECIFIC_EXECUTOR_MANIFEST_V1.json)" = "3ffc4484ab4ac69f60258859d5d6e2a7cc8024a7"
      - name: Run authority and launcher regressions
        run: |
          PYTHONPATH=. python -m unittest -v \
            canonical.tests.test_terminal_wave_launch_authority_reducer_v1 \
            canonical.tests.test_terminal_parent_portfolio_launcher_v1
      - name: Derive authority from exact current state
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python canonical/runtime/terminal_wave_launch_authority_reducer_v1.py . | tee /tmp/verdict.json
          python - <<'PY'
          import json
          v=json.load(open("/tmp/verdict.json"))
          assert v["pass"] is True, v
          assert v["launch_authority"] is True, v
          assert v["execution_authority"] is True, v
          assert v["terminal_results_observed"] == 0, v
          assert v["fresh_terminal_evidence_consumed"] == 0, v
          print("EXACT_CURRENT_AUTHORITY_PASS")
          PY
