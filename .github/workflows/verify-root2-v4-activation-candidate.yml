name: Verify Root2 V4 activation candidate
on:
  pull_request:
    paths:
      - "subject/ROOT2_CLOSURE_V2_CURRENT_FRONTIER_V4_ACTIVATION_V1.json"
      - "subject/ROOT2_CLOSURE_V2_CURRENT_FRONTIER_V4_PUBLIC_RUNNER_VERIFICATION_20261004_V1.json"
      - "verify_root2_v4_activation_candidate.py"
      - ".github/workflows/verify-root2-v4-activation-candidate.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python verify_root2_v4_activation_candidate.py
