name: Verify deleted private bar substitution v1
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/deleted_private_bar_substitution_v1/**"
      - ".github/workflows/verify-deleted-private-bar-substitution-v1.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify route-deletion-safe certificate frontier
        run: |
          cd capsules/deleted_private_bar_substitution_v1
          export PYTHONPATH=.
          python -m py_compile canonical/runtime/terminal_certificate_cut_v1.py
          python canonical/tests/test_deleted_private_bar_substitution_v1.py
