name: Verify mandatory Tool Discovery retrieval authority on 4-of-19 world
on:
  push:
    branches:
      - verify/mandatory-tool-discovery-retrieval-gate-v3-world-20261003
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact Brain subject blobs
        run: |
          python - <<'PY'
          import hashlib, pathlib
          expected={
            "gate_subject/canonical/runtime/tool_discovery_retrieval_authority_gate_v1.py":"9af1bd62048277cc8c4fabab8efe5d217c367bac",
            "gate_subject/canonical/governance/OPUS55_ACCEPTANCE_ACTION_HYPERGRAPH_V2.json":"e29ce3a7c782c7b9ab1097dd3124a917d3fea9d2",
            "gate_subject/canonical/runtime/current_terminal_scheduling_world_v1.py":"9ae2b990578b042dd24074fd5013378b72e64b6b",
            "gate_subject/canonical/tests/test_tool_discovery_retrieval_authority_gate_v1.py":"6f8e38356b0a5bebf1815c7d1c199ddc86b4c9de",
            "gate_subject/canonical/tests/test_current_terminal_scheduling_world_v1.py":"856517ca43bf05cd2888bfeeed5e8aea963c6eed",
            "gate_subject/canonical/governance/CURRENT_TERMINAL_SCHEDULING_WORLD_V3.json":"35b8ccb4879ef7d56087eb5a119c25a8b9c6f183",
            "gate_subject/canonical/governance/CURRENT_TERMINAL_AUTHORITY_V1.json":"2560dbf990a4f39f006884a2c0d1fa7950e15795",
            "gate_subject/canonical/governance/OPUS55_ACCEPTANCE_PREDICATE_EVIDENCE_BINDINGS_V2.json":"0ed075c1efa053fe6e4eb3519d9903cf63fcf163",
          }
          for path,want in expected.items():
              raw=pathlib.Path(path).read_bytes()
              got=hashlib.sha1(b"blob "+str(len(raw)).encode()+b"\0"+raw).hexdigest()
              assert got==want,(path,got,want)
          print("EXACT_4_OF_19_BRAIN_BLOBS_VERIFIED")
          PY
      - name: Run retrieval authority adversarial suite
        env:
          PYTHONPATH: gate_subject
        run: |
          python -m unittest -v             canonical.tests.test_tool_discovery_retrieval_authority_gate_v1             canonical.tests.test_current_terminal_scheduling_world_v1
      - name: Execute live scheduler on Recovery-promoted world
        env:
          PYTHONPATH: gate_subject
        run: |
          python gate_subject/canonical/runtime/current_terminal_scheduling_world_v1.py > scheduler.json
          python - <<'PY'
          import json
          x=json.load(open("scheduler.json"))
          assert x["pass"] is True,x
          assert x["registry_predicate_count"]==38,x
          assert x["proved_predicate_count"]==11,x
          assert x["unresolved_predicate_count"]==27,x
          assert "RECOVERY_TERMINAL_NONINFERIOR" in x["proved_predicates"],x
          assert "TOOL_LEARNING_SUCCESS_ROUTE_NONINFERIOR" in x["unresolved_predicates"],x
          assert x["tool_discovery_retrieval_authority_gate_required"] is True,x
          assert x["tool_discovery_retrieval_authority_gate_pass"] is True,x
          assert x["execution_authority"] is False,x
          print("LIVE_4_OF_19_SCHEDULER_GATE_PASS")
          PY
