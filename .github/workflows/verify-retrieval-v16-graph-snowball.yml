name: Verify Retrieval V16 graph snowball
on:
  push:
    branches:
      - verify/retrieval-v16-graph-snowball-20261004
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact subject blobs
        run: |
          test "$(git hash-object canonical/runtime/retrieval_live_provider_arena_v16.py)" = "28236d84fd783bea7ec53f0b7449d31f2af6f093"
          test "$(git hash-object canonical/tests/test_retrieval_live_provider_arena_v16.py)" = "d9b2c024dc3a2b76fac1542b2e19edb35d6170f7"
          test "$(git hash-object canonical/runtime/retrieval_live_provider_arena_v14.py)" = "fc0327ff562d855280617a6e73748d55146c5c8b"
          test "$(git hash-object canonical/runtime/retrieval_live_provider_arena_v13.py)" = "d36f5f29060db6ad5db5f44b16751099f54873ca"
          test "$(git hash-object canonical/runtime/retrieval_live_provider_arena_v11.py)" = "0e28128d3f67d33ce4058667609e4d513657af55"
      - name: Run deterministic V16 tests
        run: PYTHONPATH=. python canonical/tests/test_retrieval_live_provider_arena_v16.py
      - name: Run live V16 graph recovery
        run: |
          PYTHONPATH=. python canonical/runtime/retrieval_live_provider_arena_v16.py > v16_live.json
          python - <<'PY'
          import json
          x=json.load(open("v16_live.json",encoding="utf-8"))
          assert x["answer_key_identity_used_for_query_generation"] is False
          assert x["answer_key_identity_used_for_graph_ranking"] is False
          assert x["target_hit"] is True
          assert x["v14_plus_v16_union_hits"] == 29
          assert x["v14_plus_v16_union_recall"] == 29/30
          assert x["open_world_completeness_claim"] is False
          print("V16_SUMMARY",json.dumps({
            "episode":x["episode_id"],"target_hit":x["target_hit"],
            "target_rank":x["target_rank"],
            "seed_count":len(x["seed_repositories"]),
            "linked_count":len(x["linked_repositories"]),
            "v14_plus_v16_hits":x["v14_plus_v16_union_hits"],
            "v14_plus_v16_recall":x["v14_plus_v16_union_recall"],
          },sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: retrieval-v16-live-result
          path: v16_live.json
          if-no-files-found: error
