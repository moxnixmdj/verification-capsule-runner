name: Verify repaired Tool Discovery owned universal scope

on:
  push:
    branches:
      - verify/tool-discovery-owned-universal-probe-gated-20261003
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact repaired Brain blob identities
        shell: bash
        run: |
          cd capsules/tool_discovery_owned_universal_probe_gated_20261003
          python - <<'PY'
          import hashlib
          from pathlib import Path
          expected = {
            "canonical/runtime/tool_universe_gateway_v2.py": "bb76780c78ae1a43cb102222fa60f2d19b0ce852",
            "canonical/tests/test_tool_universe_gateway_v2.py": "e9051452592227d5e1f46314e812fadc9ba8c1fa",
            "canonical/runtime/tool_discovery_legacy_v3_transport_v1.py": "fb1510b9dfec8e96c49de2ca228630686195e14b",
            "canonical/tests/test_tool_discovery_legacy_v3_transport_v1.py": "45e272fe3c322a5687b3bb7a2d15406e0e1337c3",
            "canonical/runtime/tool_discovery_v3_owned_gateway_bridge_v1.py": "2ee4bc46f43c2d7cc12f12109648835376126484",
            "canonical/tests/test_tool_discovery_v3_owned_gateway_bridge_v1.py": "9b9e2aaf8eca189715b6377e1d4a47a48c5ad124",
            "canonical/runtime/tool_discovery_dynamic_candidate_v3.py": "bbbee4d6baf8df937543644397abba38a67dce62",
            "canonical/runtime/tool_discovery_information_safe_candidate.py": "64c02edd568d95ec5ed54b7b8122183ce5b82e17",
            "canonical/runtime/tool_discovery_information_safe_proof.py": "2450a9644119c9fdf9c43307a1d115098d6ba592",
            "canonical/runtime/tool_discovery_information_safe_proof_v2.py": "5e8a953864e13ec76768c3e8920644107c65a644",
            "canonical/governance/OPUS55_TERMINAL_PROOF_PROTOCOLS_V1.json": "62394e5b7d221ec9f69c3458f669e40e253a9d09",
            "canonical/governance/OPUS55_ACCEPTANCE_PREDICATE_EVIDENCE_BINDINGS_V2.json": "7885a827b1483bfb38315c1f492848f7e4680285",
            "canonical/verification/TOOL_DISCOVERY_DYNAMIC_REFINEMENT_PUBLIC_RUNNER_VERIFICATION_20261003_V1.json": "5fcdc5ae35f51c40f312edbe5727284c9f6ca3dd",
            "canonical/runtime/tool_discovery_universal_scope_certificate_v1.py": "784fd8d70976b14366cbf561df3fd9808f2bf5fd",
            "canonical/tests/test_tool_discovery_universal_scope_certificate_v1.py": "eb790708222f84959207e6309c0ffc3cb6b2217f",
            "canonical/governance/TOOL_DISCOVERY_UNIVERSAL_SCOPE_CERTIFICATE_V1.json": "a28db020eed1a278a6f9f3ad36f4440f423b4c93",
          }
          for path, want in expected.items():
              data = Path(path).read_bytes()
              got = hashlib.sha1(f"blob {len(data)}\0".encode() + data).hexdigest()
              assert got == want, (path, got, want)
              print(path, got)
          PY
      - name: Run repaired gateway and universal proof regressions
        shell: bash
        run: |
          cd capsules/tool_discovery_owned_universal_probe_gated_20261003
          PYTHONPATH=. python -m unittest -v             canonical.tests.test_tool_universe_gateway_v2             canonical.tests.test_tool_discovery_legacy_v3_transport_v1             canonical.tests.test_tool_discovery_v3_owned_gateway_bridge_v1             canonical.tests.test_tool_discovery_universal_scope_certificate_v1
      - name: Execute universal scope certificate fail-closed
        shell: bash
        run: |
          cd capsules/tool_discovery_owned_universal_probe_gated_20261003
          PYTHONPATH=. python canonical/runtime/tool_discovery_universal_scope_certificate_v1.py > certificate-result.json
          python - <<'PY'
          import json
          from pathlib import Path
          out = json.loads(Path("certificate-result.json").read_text())
          assert out["universal_scope_proved"] is True, out
          assert out["scope_atom_satisfied_candidate"] is True, out
          assert out["basis_kind"] == "UNIVERSAL_FORMAL_SCOPE_PROOF", out
          assert out["uses_empirical_generalization"] is False, out
          assert out["terminal_cases_replayed"] == 0, out
          assert out["new_reality_units_consumed"] == 0, out
          assert out["capability_credit_delta"] == 0, out
          assert out["family_credit_delta"] == 0, out
          assert out["execution_authority"] is False, out
          assert out["promotion_authority"] is False, out
          gov = json.loads(Path("canonical/governance/TOOL_DISCOVERY_UNIVERSAL_SCOPE_CERTIFICATE_V1.json").read_text())
          assert "NO_ACCEPTANCE_OR_FAMILY_CREDIT_FROM_THIS_CANDIDATE" in gov["hard_nonclaims"]
          assert "NO_TERMINAL_CASE_REPLAY" in gov["hard_nonclaims"]
          print(json.dumps(out, indent=2, sort_keys=True))
          PY
