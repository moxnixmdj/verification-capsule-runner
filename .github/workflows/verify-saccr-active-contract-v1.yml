name: Verify SA-CCR active-contract proof
on:
  pull_request:
    branches: [main]
    paths:
      - canonical/runtime/saccr_credit_kernel.py
      - canonical/runtime/saccr_active_contract_proof_v1.py
      - canonical/runtime/saccr_active_contract_candidate_v1.py
      - canonical/tests/test_saccr_active_contract_proof_v1.py
      - .github/workflows/verify-saccr-active-contract-v1.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: PYTHONPATH=. python -m unittest -v canonical.tests.test_saccr_active_contract_proof_v1
