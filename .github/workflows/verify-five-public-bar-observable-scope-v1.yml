name: Verify five public-bar observable scope V1
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/five_public_bar_observable_scope_v1/**"
      - ".github/workflows/verify-five-public-bar-observable-scope-v1.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact Brain blobs and target-conditioned scope closure
        run: python capsules/five_public_bar_observable_scope_v1/verify.py
