name: Verify Retrieval V10 contextual calibration core
on:
  push:
    branches:
      - verify/retrieval-v10-contextual-core-20261003
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact subject blobs
        run: |
          test "$(git hash-object subjects/v10/retrieval_live_event_ledger_v2.py)" = "b0089c2f850104502a7eba0ced3b888cccfbe20f"
          test "$(git hash-object subjects/v10/global_retrieval_controller_v3.py)" = "266122c4e893fbcb34784bc01eb859b390dc2cf4"
          test "$(git hash-object subjects/v10/global_retrieval_entrypoint_v3.py)" = "211c437fcae0b124f09471cac148bc7e7f9d00f8"
          test "$(git hash-object subjects/v10/retrieval_live_provider_epoch_v1.py)" = "36d271a7483b7b86ece42d74216611a2e2da43b9"
          test "$(git hash-object subjects/v10/test_retrieval_contextual_calibration_v10.py)" = "96940380a8066c3bf2f4bdaafd7e2e85fef939c0"
      - name: Install exact V10 subjects into workspace
        run: |
          cp subjects/v10/retrieval_live_event_ledger_v2.py canonical/runtime/retrieval_live_event_ledger_v2.py
          cp subjects/v10/global_retrieval_controller_v3.py canonical/runtime/global_retrieval_controller_v3.py
          cp subjects/v10/global_retrieval_entrypoint_v3.py canonical/runtime/global_retrieval_entrypoint_v3.py
          cp subjects/v10/retrieval_live_provider_epoch_v1.py canonical/runtime/retrieval_live_provider_epoch_v1.py
          cp subjects/v10/test_retrieval_contextual_calibration_v10.py canonical/tests/test_retrieval_contextual_calibration_v10.py
      - run: PYTHONPATH=. python canonical/tests/test_retrieval_contextual_calibration_v10.py
      - run: python -m py_compile canonical/runtime/retrieval_live_event_ledger_v2.py canonical/runtime/global_retrieval_controller_v3.py canonical/runtime/global_retrieval_entrypoint_v3.py canonical/runtime/retrieval_live_provider_epoch_v1.py
