name: Run PR337 Canonical Open-Ended Climate Task A Once

on:
  pull_request:
    branches: [main]
    types: [opened]

permissions:
  contents: read

jobs:
  execute-once:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      ASTRA_DISABLE_MODEL_PLANNER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Execute frozen canonical PR337 open-ended Task A exactly once
        id: parent_task
        continue-on-error: true
        run: python run_pr328_openended_climate_task_a_once.py
      - name: Upload terminal open-ended Task A evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr328-openended-climate-task-a-terminal
          path: pr328-openended-climate-task-a-terminal.json
          if-no-files-found: error
      - name: Preserve semantic failure
        if: steps.parent_task.outcome != 'success'
        run: exit 1
