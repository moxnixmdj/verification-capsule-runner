name: Verify delegation terminal population binding
on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/runtime/delegation_whole_scope_candidate_v2.py'
      - 'canonical/runtime/delegation_whole_scope_proof_v2.py'
      - 'canonical/runtime/delegation_terminal_population_binding_v1.py'
      - 'canonical/tests/test_delegation_terminal_population_binding_v1.py'
      - 'canonical/governance/DELEGATION_SCOPE_EQUIVALENT_PROOF_GATE_V2_INPUT.json'
      - 'canonical/verification/DELEGATION_SCOPE_GATE_V2_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json'
      - 'canonical/governance/GLOBAL_TERMINAL_REPLACEMENT_POPULATION_PROTOCOL_V2.json'
      - 'canonical/governance/DELEGATION_TERMINAL_POPULATION_BINDING_V1.json'
      - '.github/workflows/verify-delegation-terminal-binding.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Bind exact Brain blobs
        run: |
          set -euo pipefail
          test "$(git hash-object canonical/runtime/delegation_whole_scope_candidate_v2.py)" = "9f2c3aa42352cba66967afb1f8a3f45357833c41"
          test "$(git hash-object canonical/runtime/delegation_whole_scope_proof_v2.py)" = "5785b07f482e38acdf7916e5414d90c2c0c305b7"
          test "$(git hash-object canonical/runtime/delegation_terminal_population_binding_v1.py)" = "fae6d0bf2efbcb9b8fe2a2a627900889c5ec6cab"
          test "$(git hash-object canonical/tests/test_delegation_terminal_population_binding_v1.py)" = "e060355aa2cdc800a9b7d0d8af587c3d13a62b03"
          test "$(git hash-object canonical/governance/DELEGATION_SCOPE_EQUIVALENT_PROOF_GATE_V2_INPUT.json)" = "b434c2ad13154f5d4f43a76cfb27d6b492e93e01"
          test "$(git hash-object canonical/verification/DELEGATION_SCOPE_GATE_V2_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json)" = "ab1d8d19217fe683b62682c8f7f2ce7800fcfe57"
          test "$(git hash-object canonical/governance/GLOBAL_TERMINAL_REPLACEMENT_POPULATION_PROTOCOL_V2.json)" = "8d30bb8805be9eef5155f0f31de17dd4bc9e5d1f"
          test "$(git hash-object canonical/governance/DELEGATION_TERMINAL_POPULATION_BINDING_V1.json)" = "bb69379f0c73ac28f0491c74deec25347eaf551c"
      - name: Verify frozen manifest
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("canonical/governance/DELEGATION_TERMINAL_POPULATION_BINDING_V1.json").read_text())
          assert p["behavior_id"]=="TASK_TO_DELEGATION_GRAPH_001"
          assert p["pre_beacon_frozen"] is True
          assert p["population"]["sample_count"]==512
          assert p["population"]["post_freeze_beacon"] is None
          assert p["population"]["adaptive_case_selection"] is False
          assert p["population"]["replay_for_tuning"] is False
          assert p["population"]["case_replacement"] is False
          assert p["acceptance"]["allowed_failed_cases"]==0
          assert p["acceptance"]["require_all_six_case_classes"] is True
          assert p["terminal_results_observed"]==0
          assert p["fresh_terminal_evidence_consumed"]==0
          assert p["execution_authority"] is False
          g=json.loads(Path("canonical/verification/DELEGATION_SCOPE_GATE_V2_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json").read_text())
          assert g["workflow_conclusion"]=="success"
          assert g["verdict"]["admissible"] is True
          assert g["verdict"]["errors"]==[]
          print("DELEGATION_BINDING_MANIFEST_PASS")
          PY
      - name: Run binding regressions
        run: python3 -m unittest canonical.tests.test_delegation_terminal_population_binding_v1 -v
      - name: Fresh independent 512-case pre-beacon population
        run: |
          python3 - <<'PY'
          from canonical.runtime import delegation_terminal_population_binding_v1 as t
          out=t.run_population("INDEPENDENT_DELEGATION_PREFLIGHT_COMMITMENT_20261002","INDEPENDENT_DELEGATION_PREFLIGHT_BEACON_20261002")
          assert out["pass"] is True, out
          assert out["executed_count"]==512
          assert out["failed_slots"]==[]
          assert out["coverage_missing"]==[]
          assert set(out["covered_case_classes"])==t.REQUIRED_CLASSES
          assert out["case_replacement"] is False
          print("DELEGATION_512_EXECUTOR_PREFLIGHT_PASS")
          PY
