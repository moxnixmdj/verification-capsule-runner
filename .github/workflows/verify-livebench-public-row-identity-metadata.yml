name: Verify LiveBench Public Row Identity Metadata

on:
  push:
    branches:
      - verify/livebench-public-row-identity-metadata-v1
    paths:
      - verify_livebench_public_row_identity_metadata.py
      - .github/workflows/verify-livebench-public-row-identity-metadata.yml
  pull_request:
    branches:
      - main
    paths:
      - verify_livebench_public_row_identity_metadata.py
      - .github/workflows/verify-livebench-public-row-identity-metadata.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install metadata reader
        run: python -m pip install --quiet "pyarrow==21.0.0"
      - name: Run metadata-only identity proof
        run: python verify_livebench_public_row_identity_metadata.py
      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livebench-public-row-identity-metadata-receipt
          path: livebench_public_row_identity_metadata_receipt.json
          if-no-files-found: error
