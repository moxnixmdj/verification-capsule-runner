name: Verify Finance weighted lower-bound reducer
on:
  push:
    branches: [verify-finance-weighted-bound-20261003-sol]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: finance_weighted_bound
    steps:
      - uses: actions/checkout@v4
      - name: Run dependency-free assertions
        run: python3 -c "import test_finance_index_weighted_lower_bound_reducer_v1 as t; [getattr(t,n)() for n in sorted(dir(t)) if n.startswith('test_')]; print('FINANCE_WEIGHTED_BOUND_REDUCER_VERIFIED')"
