name: Verify CAD V4 terminal executor
on:
  pull_request:
    branches: [main]
    paths:
      - canonical/runtime/cad_t0_route_specific_terminal_executor_v1.py
      - canonical/tests/test_cad_t0_route_specific_terminal_executor_v1.py
      - canonical/governance/CAD_T0_POST_REFREEZE_BINDING_V4.json
      - .github/workflows/verify-cad-v4-terminal-executor.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify exact current Brain executor blobs
        run: |
          set -euo pipefail
          test "$(git hash-object canonical/runtime/cad_t0_route_specific_terminal_executor_v1.py)" = "00879293f32c66fd01f6747aaf15573b27fde01f"
          test "$(git hash-object canonical/tests/test_cad_t0_route_specific_terminal_executor_v1.py)" = "0919a4e8c7ffd3b856693eb0008ea0ac8e6fbd34"
          test "$(git hash-object canonical/governance/CAD_T0_POST_REFREEZE_BINDING_V4.json)" = "a636d1292e6f92d240fab420a9ee75ced7a05104"
      - run: python -m pip install --disable-pip-version-check --no-input "pydantic>=2,<3" "cadquery==2.6.1"
      - name: Verify V4 executor preflight and global launch guard
        run: PYTHONPATH=.:canonical/runtime python -m unittest -v canonical.tests.test_cad_t0_route_specific_terminal_executor_v1
