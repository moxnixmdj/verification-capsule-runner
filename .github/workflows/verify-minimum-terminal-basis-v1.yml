name: Verify minimum terminal basis v1

on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/minimum_terminal_basis_v1/**"
      - ".github/workflows/verify-minimum-terminal-basis-v1.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact mirrored blobs and adversarial behavior
        run: |
          cd capsules/minimum_terminal_basis_v1
          export PYTHONPATH=.
          python -m py_compile canonical/runtime/minimum_terminal_basis_v1.py
          python canonical/tests/test_minimum_terminal_basis_v1.py
          python verify_independent.py
