name: Verify static SVG diagram mechanics V1
on:
  pull_request:
    branches:
      - main
    paths:
      - "capsules/static_svg_diagram_mechanics_v1/**"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install independent SVG renderer and test runner
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin
          python -m pip install -q pytest
      - name: Verify exact content-addressed Brain mirrors
        run: |
          set -euo pipefail
          cd capsules/static_svg_diagram_mechanics_v1
          python - <<'PY'
          import json, subprocess
          m=json.load(open("manifest.json"))
          for path, expected in m["exact_blobs"].items():
              got=subprocess.check_output(["git","hash-object",path],text=True).strip()
              assert got==expected,(path,expected,got)
          for k in ("new_reality_units_consumed","terminal_cases_consumed","incremental_spend_usd"):
              assert m[k]==0,(k,m[k])
          print("EXACT_STATIC_SVG_INPUT_BLOBS_PASS",len(m["exact_blobs"]))
          PY
      - name: Run committed falsification regressions
        run: |
          set -euo pipefail
          cd capsules/static_svg_diagram_mechanics_v1
          PYTHONPATH=. python -m pytest -q             canonical/tests/test_html_svg_diagram_mechanics_v1.py             canonical/tests/test_svg_diagram_render_oracle_v1.py
      - name: Run independent real-engine and adversarial verification
        run: |
          set -euo pipefail
          cd capsules/static_svg_diagram_mechanics_v1
          PYTHONPATH=. python - <<'PY'
          from canonical.runtime import html_svg_diagram_mechanics_v1 as mech
          from canonical.runtime import svg_diagram_render_oracle_v1 as oracle

          spec={
              "schema":mech.SCHEMA,
              "canvas":{"width":800,"height":480},
              "nodes":[
                  {"id":"source","label":"Evidence <A&B>","shape":"rect","x":40,"y":180,"width":180,"height":80},
                  {"id":"decision","label":"Verified decision","shape":"ellipse","x":560,"y":180,"width":190,"height":80},
              ],
              "edges":[{"id":"supports","source":"source","target":"decision","label":"supports"}],
          }
          renderer=oracle.find_renderer()
          assert renderer is not None, "real SVG renderer missing after pinned infrastructure install"
          out=oracle.verify(spec,renderer=renderer)
          assert out["pass"] is True,out
          assert out["structural"]["node_count"]==2,out
          assert out["structural"]["edge_count"]==1,out
          assert out["render"]["render_dimensions"][0]>=800,out
          assert out["render"]["render_dimensions"][1]>=480,out

          svg=mech.compile_svg(spec)
          assert "Evidence &lt;A&amp;B&gt;" in svg
          tampered=svg.replace('data-target="decision"','data-target="source"')
          bad=mech.validate_svg(tampered,spec)
          assert bad=={"pass":False,"reason":"EDGE_RELATION_MISMATCH","edge":"supports"},bad

          injected=svg.replace('<g id="brain-nodes"','<g onclick="steal()" id="brain-nodes"')
          bad=mech.validate_svg(injected,spec)
          assert bad["pass"] is False and bad["reason"]=="EVENT_ATTRIBUTE",bad

          invalid=dict(spec)
          invalid["nodes"]=[dict(x) for x in spec["nodes"]]
          invalid["nodes"][0]["x"]=-1
          try:
              mech.compile_svg(invalid)
          except mech.DiagramMechanicsError:
              pass
          else:
              raise AssertionError("negative geometry did not fail closed")

          print("INDEPENDENT_STATIC_SVG_REAL_ENGINE_ADVERSARIAL_PASS",renderer[0])
          PY
      - name: Verify zero-credit governance boundary
        run: |
          set -euo pipefail
          cd capsules/static_svg_diagram_mechanics_v1
          python - <<'PY'
          import json
          x=json.load(open("canonical/governance/STATIC_SVG_DIAGRAM_MECHANICS_KERNEL_20261005_V1.json"))
          assert x["schema"]=="PROJECT_BRAIN_STATIC_SVG_DIAGRAM_MECHANICS_KERNEL_V1"
          assert x["independent_verification_required"] is True
          for k in ("scheduling_authority","execution_authority","promotion_authority","fresh_reality_authority"):
              assert x[k] is False,(k,x[k])
          a=x["accounting"]
          for k in ("incremental_spend_usd","new_reality_units_consumed","terminal_cases_consumed","acceptance_credit_delta","family_credit_delta","capability_credit_delta","ownership_credit_delta"):
              assert a[k]==0,(k,a[k])
          print("STATIC_SVG_ZERO_CREDIT_BOUNDARY_PASS")
          PY
