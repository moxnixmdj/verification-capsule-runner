name: Verify LiveBench union25 representative pair map
on:
  push:
    branches:
      - verify/livebench-union25-pair-map-20261005-v1
  pull_request:
    paths:
      - "verify_livebench_union25_pair_map.py"
      - "subject/**"
      - "upstream/**"
      - ".github/workflows/verify-livebench-union25-pair-map.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NLTK_DATA: \${{ github.workspace }}/nltk_data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned evaluator dependencies
        run: |
          python -m pip install --disable-pip-version-check --quiet langdetect==1.0.9 nltk==3.10.3 immutabledict==4.3.1
          python - <<'PY'
          import nltk
          nltk.download("punkt", download_dir="nltk_data", quiet=True)
          nltk.download("punkt_tab", download_dir="nltk_data", quiet=True)
          PY
      - name: Run exact union25 representative pair map
        run: python verify_livebench_union25_pair_map.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livebench-union25-pair-map
          path: livebench_union25_pair_map_receipt.json
          if-no-files-found: error
