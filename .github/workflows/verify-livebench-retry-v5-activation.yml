name: Verify LiveBench retry V5 activation
on:
  pull_request:
    branches: [main]
    paths:
      - "subject/livebench_retry_v5_activation_20261004/**"
      - "verify_livebench_retry_v5_activation.py"
      - ".github/workflows/verify-livebench-retry-v5-activation.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.14"
      - run: python verify_livebench_retry_v5_activation.py
