name: OBS Minimal Broad Routing PR470 Qualification
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - canonical/runtime/bound_capabilities/plain_goal_bound_grounding.py
      - canonical/runtime/bound_capabilities/broad_objective_decompose.py
      - canonical/tests/test_broad_objective_semantic_decomposition.py
      - .github/workflows/qualify-obs-minimal-broad-routing-pr470.yml
permissions:
  contents: read
jobs:
  qualify:
    if: github.head_ref == 'verify/obs-minimal-broad-routing-pr470-20260930-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run exact preserved-input regression
        run: python canonical/tests/test_broad_objective_semantic_decomposition.py
