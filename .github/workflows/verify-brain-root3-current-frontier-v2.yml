name: Verify Brain Root3 current frontier V2
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/root3_current_frontier_v2/**"
      - ".github/workflows/verify-brain-root3-current-frontier-v2.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact Brain blobs
        run: |
          cd capsules/root3_current_frontier_v2
          python - <<'PY'
          import hashlib,json,pathlib
          m=json.load(open("EXPECTED_BRAIN_BLOBS.json"))
          for p,h in m["exact_brain_blobs"].items():
              b=(pathlib.Path("brain")/p).read_bytes()
              got=hashlib.sha1(b"blob "+str(len(b)).encode()+b"\0"+b).hexdigest()
              assert got==h,(p,got,h)
          print("exact Brain blobs PASS")
          PY
      - name: Verify reconciled Root3 frontier
        run: |
          cd capsules/root3_current_frontier_v2
          python verify_independent.py
