name: Verify rank22 exact surface and source boundary
on:
  pull_request:
    branches: [main]
    paths:
      - 'verification/rank22_pre_stagec/**'
      - '.github/workflows/verify-rank22-pre-stagec.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Revalidate exact frozen source boundary
        run: python verification/rank22_pre_stagec/verify_boundary.py
      - name: Build exact pinned task image
        run: docker build -f verification/rank22_pre_stagec/Dockerfile -t rank22-prestagec verification/rank22_pre_stagec
      - name: Probe exact FreeCAD surface without task execution
        run: |
          docker run --name rank22-prestagec-probe rank22-prestagec python /probe_surface.py
          docker cp rank22-prestagec-probe:/app/surface_receipt.json verification/rank22_pre_stagec/surface_receipt.json
          docker rm rank22-prestagec-probe
          cat verification/rank22_pre_stagec/surface_receipt.json
      - name: Upload pre-Stage-C receipts
        uses: actions/upload-artifact@v4
        with:
          name: rank22-pre-stagec-receipts
          path: |
            verification/rank22_pre_stagec/surface_receipt.json
            verification/rank22_pre_stagec/ledger.json
