name: Verify TB-Science Opus55 snapshot identity
on:
  push:
    branches: ["science-snapshot-check-20261003"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact public identity chain
        run: python verification/tb_science_snapshot_identity_v1.py | tee TB_SCIENCE_OPUS55_SNAPSHOT_IDENTITY.json
      - uses: actions/upload-artifact@v4
        with:
          name: tb-science-opus55-snapshot-identity
          path: TB_SCIENCE_OPUS55_SNAPSHOT_IDENTITY.json
