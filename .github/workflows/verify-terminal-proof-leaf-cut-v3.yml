name: Verify terminal proof leaf cut v3

on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/terminal_proof_leaf_cut_v3/**"
      - ".github/workflows/verify-terminal-proof-leaf-cut-v3.yml"

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify exact Brain blob identities
        run: |
          cd capsules/terminal_proof_leaf_cut_v3
          check() { actual="$(git hash-object "$1")"; test "$actual" = "$2" || { echo "$1 expected $2 got $actual"; exit 1; }; }
          check canonical/runtime/terminal_proof_leaf_cut_v1.py 42ddffef9d4fc0d3e6adf5888c1e4d8cbdeac6b5
          check canonical/tests/test_terminal_proof_leaf_cut_v1.py 4aae680889a7a8aa7b0c597a2ae39821c424928d
          check canonical/governance/TERMINAL_CERTIFICATE_REQUIREMENT_LEAF_GRAPH_V3.json dcd41edf3d6472b1242a103713ffae50fe80ed60
          check canonical/tests/test_terminal_certificate_requirement_leaf_graph_v3.py 4b17779a54c3391defa083c2ae0b67de6d28c627
          check canonical/governance/TERMINAL_CERTIFICATE_FRONTIER_V3.json 106139ff69616670993dbc6af324d8686747e8b1
          check canonical/governance/TERMINAL_CERTIFICATE_CUT_ACTIVATION_V3.json 1f2fd63955e097c73235dcf67421a3a2f8b218b8
          check canonical/verification/TERMINAL_INFORMATION_DOMINANCE_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json cec05df1ef3633a10a1635a9a6d8e86f03130390
          check canonical/verification/DELEGATION_SCOPE_GATE_V2_V3_REPAIR_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json eddfe01c81ae9d6e9453c4bc30737f9ddd273a83
          check canonical/verification/COMPOSITION_BEHAVIORAL_BRIDGE_ACTIVATION_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json 11784ce21ea55506559bc6fb8752b2b1b5585af5

      - name: Verify upstream authority and evidence receipts
        run: |
          cd capsules/terminal_proof_leaf_cut_v3
          export PYTHONPATH=.
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path(".")
          def load(p): return json.loads((root/p).read_text())
          a=load("canonical/governance/TERMINAL_CERTIFICATE_CUT_ACTIVATION_V3.json")
          i=load("canonical/verification/TERMINAL_INFORMATION_DOMINANCE_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json")
          d=load("canonical/verification/DELEGATION_SCOPE_GATE_V2_V3_REPAIR_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json")
          c=load("canonical/verification/COMPOSITION_BEHAVIORAL_BRIDGE_ACTIVATION_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json")
          assert a["status"].startswith("ACTIVE_INDEPENDENT_PASS"), a
          assert a["frontier"]["git_blob_sha"]=="106139ff69616670993dbc6af324d8686747e8b1", a
          assert i["status"].startswith("INDEPENDENT_PUBLIC_RUNNER_PASS"), i
          assert d["status"].startswith("INDEPENDENT_PASS"), d
          assert d["verdict"]["admissible"] is True, d
          assert c["status"].startswith("INDEPENDENT_PUBLIC_RUNNER_PASS"), c
          print("PASS upstream V3 authority and bound receipts")
          PY

      - name: Verify historical TB4 receipts from GitHub
        run: |
          test "$(gh api repos/moxnixmdj/verification-capsule-runner/pulls/961 --jq '.merged')" = "true"
          test "$(gh api repos/moxnixmdj/verification-capsule-runner/pulls/961 --jq '.merge_commit_sha')" = "6cb65d79713eaaabb3e465869d4755a78113fdfd"
          test "$(gh api repos/moxnixmdj/verification-capsule-runner/actions/runs/37017018110 --jq '.conclusion')" = "success"
          test "$(gh api repos/moxnixmdj/verification-capsule-runner/pulls/958 --jq '.merged')" = "true"
          test "$(gh api repos/moxnixmdj/verification-capsule-runner/pulls/958 --jq '.merge_commit_sha')" = "3a42052bf0ebe37b2619b07449df35c9d09b9598"
          test "$(gh api repos/moxnixmdj/verification-capsule-runner/actions/runs/37017338018 --jq '.conclusion')" = "success"
          echo "PASS historical TB4 PR/run receipts"

      - name: Compile recursive kernel
        run: |
          cd capsules/terminal_proof_leaf_cut_v3
          python -m py_compile canonical/runtime/terminal_proof_leaf_cut_v1.py

      - name: Run generic and live V3 regressions
        run: |
          cd capsules/terminal_proof_leaf_cut_v3
          export PYTHONPATH=.
          python - <<'PY'
          import importlib
          modules=[
            "canonical.tests.test_terminal_proof_leaf_cut_v1",
            "canonical.tests.test_terminal_certificate_requirement_leaf_graph_v3",
          ]
          count=0
          for name in modules:
            m=importlib.import_module(name)
            for fn in sorted(dir(m)):
              if fn.startswith("test_"):
                getattr(m,fn)()
                count += 1
          print(f"PASS {count} test functions")
          PY

      - name: Recompute exact current V3 leaf frontier
        run: |
          cd capsules/terminal_proof_leaf_cut_v3
          export PYTHONPATH=.
          python - <<'PY'
          import json
          from pathlib import Path
          from canonical.runtime.terminal_proof_leaf_cut_v1 import evaluate
          doc=json.loads(Path("canonical/governance/TERMINAL_CERTIFICATE_REQUIREMENT_LEAF_GRAPH_V3.json").read_text())
          out=evaluate(doc)
          assert out["status"]=="LOWER_BOUND_ONLY_UNKNOWN_COSTS_REMAIN", out
          assert out["nondominated_proof_set_count"]==8, out
          assert len(out["selected_leaf_ids"])==32, out
          assert len(out["selected_unknown_cost_leaf_ids"])==32, out
          assert out["lower_bound_reality_units"]==0, out
          assert out["upper_bound_reality_units"] is None, out
          assert out["optimality_certificate"]["optimality_proved"] is False, out
          assert out["execution_authority"] is False and out["promotion_authority"] is False, out
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
