name: Chartography Qwen3-VL 4B nonterminal qualification V1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/chartography-qwen3vl4b-nonterminal-qualification-v1.yml"
      - "triggers/chartography_qwen3vl4b_nonterminal_qualification_v1.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Capture runner envelope
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out charts
          NPROC="$(nproc)"
          MEM_KIB="$(awk '/MemTotal:/ {print $2}' /proc/meminfo)"
          MEM_GIB="$(awk -v k="$MEM_KIB" 'BEGIN {printf "%.2f", k/1024/1024}')"
          FREE_KIB="$(df -Pk . | awk 'NR==2 {print $4}')"
          FREE_GIB="$(awk -v k="$FREE_KIB" 'BEGIN {printf "%.2f", k/1024/1024}')"
          printf 'nproc=%s\nmem_gib=%s\nfree_disk_gib=%s\n' "$NPROC" "$MEM_GIB" "$FREE_GIB" | tee out/runner.txt
          test "$NPROC" -ge 4
          test "$MEM_KIB" -ge $((14*1024*1024))

      - name: Install exact runtime prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build curl ca-certificates time python3-pil fonts-dejavu-core

      - name: Download exact preflight-proved Qwen subject
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p model
          REV="1cd86afb9a95c410a6038ab3b40d8b578c892266"
          BASE="https://huggingface.co/Qwen/Qwen3-VL-4B-Instruct-GGUF/resolve/$REV"
          curl -fL --retry 5 --retry-all-errors "$BASE/Qwen3VL-4B-Instruct-Q4_K_M.gguf?download=true" -o model/model.gguf
          curl -fL --retry 5 --retry-all-errors "$BASE/mmproj-Qwen3VL-4B-Instruct-Q8_0.gguf?download=true" -o model/mmproj.gguf
          echo "66358cb18bb6b3b1b6675aa412c7a88ef01d228f481184d13668e5201c730a0a  model/model.gguf" | sha256sum -c -
          echo "30ba2c7dd3127a4561b6cba9d13d0f711c91bdb38742e2f56d73c8cb596bd06d  model/mmproj.gguf" | sha256sum -c -

      - name: Build exact pinned llama.cpp mtmd CLI
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/ggml-org/llama.cpp.git llama.cpp
          cd llama.cpp
          git checkout --detach a7fb71fab83b474a0892b9a05aaa3a8ddca2729b
          test "$(git rev-parse HEAD)" = "a7fb71fab83b474a0892b9a05aaa3a8ddca2729b"
          cmake -S . -B build -G Ninja -DGGML_NATIVE=OFF -DGGML_CUDA=OFF -DGGML_BLAS=OFF -DLLAMA_CURL=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target llama-mtmd-cli -j 2

      - name: Generate seven nonterminal synthetic chart reasoning cases
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          from pathlib import Path
          import json, hashlib
          out=Path("charts"); out.mkdir(exist_ok=True)
          W,H=640,440
          try:
              font=ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf",20)
              bold=ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf",22)
              small=ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf",16)
          except Exception:
              font=bold=small=None
          def base(title):
              im=Image.new("RGB",(W,H),"white"); d=ImageDraw.Draw(im)
              d.text((20,12),title,fill="black",font=bold)
              d.line((70,60,70,370),fill="black",width=3)
              d.line((70,370,600,370),fill="black",width=3)
              return im,d
          def save(name,im,prompt,expected,options):
              p=out/f"{name}.bmp"; im.save(p)
              return {"id":name,"image":str(p),"prompt":prompt,"expected":expected,"options":options,
                      "sha256":hashlib.sha256(p.read_bytes()).hexdigest()}
          cases=[]
          # 1 vertical bars: D highest
          im,d=base("Quarterly output")
          labels=["A","B","C","D"]; vals=[110,190,150,240]
          for i,(lab,v) in enumerate(zip(labels,vals)):
              x=120+i*110; d.rectangle((x,370-v,x+55,370),fill=(70,120,190),outline="black")
              d.text((x+18,378),lab,fill="black",font=font)
          cases.append(save("vertical_bars",im,"Which x-axis category has the tallest bar? Respond with one category label only.","D",labels))
          # 2 line: C lowest
          im,d=base("Monthly defect rate")
          pts=[]; labels=["A","B","C","D"]; vals=[210,150,80,170]
          for i,(lab,v) in enumerate(zip(labels,vals)):
              x=125+i*125; y=345-v; pts.append((x,y)); d.text((x-7,378),lab,fill="black",font=font)
          d.line(pts,fill=(30,90,180),width=5)
          for x,y in pts: d.ellipse((x-6,y-6,x+6,y+6),fill=(30,90,180))
          cases.append(save("line_lowest",im,"Which x-axis category has the lowest plotted point? Respond with one category label only.","C",labels))
          # 3 grouped bars: Beta taller at C
          im,d=base("Grouped comparison")
          d.rectangle((430,65,448,83),fill=(40,120,200)); d.text((455,62),"Alpha",fill="black",font=small)
          d.rectangle((520,65,538,83),fill=(220,110,40)); d.text((545,62),"Beta",fill="black",font=small)
          labels=["A","B","C"]; av=[110,190,130]; bv=[160,120,220]
          for i,lab in enumerate(labels):
              x=150+i*150
              d.rectangle((x,370-av[i],x+38,370),fill=(40,120,200),outline="black")
              d.rectangle((x+42,370-bv[i],x+80,370),fill=(220,110,40),outline="black")
              d.text((x+30,378),lab,fill="black",font=font)
          cases.append(save("grouped_bars",im,"At category C, which series has the taller bar? Respond with the series name only.","Beta",["Alpha","Beta"]))
          # 4 stacked totals: C highest
          im,d=base("Stacked totals")
          labels=["A","B","C"]; low=[70,100,130]; high=[55,85,115]
          for i,lab in enumerate(labels):
              x=160+i*150; total=low[i]+high[i]
              d.rectangle((x,370-low[i],x+70,370),fill=(80,150,210),outline="black")
              d.rectangle((x,370-total,x+70,370-low[i]),fill=(230,150,60),outline="black")
              d.text((x+25,378),lab,fill="black",font=font)
          cases.append(save("stacked_bars",im,"Which category has the largest total stacked height? Respond with one category label only.","C",labels))
          # 5 positive scatter
          im,d=base("Scatter relationship")
          pts=[(120,320),(180,290),(240,260),(300,220),(360,205),(420,160),(480,130),(540,95)]
          for x,y in pts: d.ellipse((x-7,y-7,x+7,y+7),fill=(120,60,170))
          cases.append(save("scatter_positive",im,"Is the relationship in this scatter plot positive, negative, or no clear relationship? Respond with one word only.","positive",["positive","negative","none"]))
          # 6 horizontal bars: South longest
          im=Image.new("RGB",(W,H),"white"); d=ImageDraw.Draw(im)
          d.text((20,12),"Regional capacity",fill="black",font=bold)
          labels=["North","South","East","West"]; vals=[230,390,170,310]
          for i,(lab,v) in enumerate(zip(labels,vals)):
              y=90+i*75; d.text((25,y+10),lab,fill="black",font=font); d.rectangle((120,y,120+v,y+42),fill=(60,150,100),outline="black")
          cases.append(save("horizontal_bars",im,"Which region has the longest horizontal bar? Respond with the region name only.","South",labels))
          # 7 dual lines: Beta higher at D
          im,d=base("Two-series trend")
          d.line((430,70,465,70),fill=(30,100,210),width=5); d.text((475,60),"Alpha",fill="black",font=small)
          d.line((525,70,560,70),fill=(220,80,60),width=5); d.text((570,60),"Beta",fill="black",font=small)
          labels=["A","B","C","D"]; av=[230,190,150,100]; bv=[80,120,180,240]
          pa=[]; pb=[]
          for i,lab in enumerate(labels):
              x=125+i*125; pa.append((x,345-av[i])); pb.append((x,345-bv[i])); d.text((x-7,378),lab,fill="black",font=font)
          d.line(pa,fill=(30,100,210),width=5); d.line(pb,fill=(220,80,60),width=5)
          for x,y in pa: d.ellipse((x-5,y-5,x+5,y+5),fill=(30,100,210))
          for x,y in pb: d.ellipse((x-5,y-5,x+5,y+5),fill=(220,80,60))
          cases.append(save("dual_line",im,"At category D, which series is higher? Respond with the series name only.","Beta",["Alpha","Beta"]))
          Path("out/cases.json").write_text(json.dumps(cases,indent=2))
          print(json.dumps(cases,indent=2))
          PY
          sha256sum charts/*.bmp | tee out/chart-hashes.txt

      - name: Execute exact subject on all nonterminal cases
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, subprocess, time, os
          cases=json.loads(pathlib.Path("out/cases.json").read_text())
          root=pathlib.Path("out/inference"); root.mkdir(parents=True,exist_ok=True)
          cmd="./llama.cpp/build/bin/llama-mtmd-cli"
          for c in cases:
              out=root/f"{c['id']}.stdout.txt"; err=root/f"{c['id']}.stderr.txt"
              argv=[cmd,"-m","model/model.gguf","--mmproj","model/mmproj.gguf","--no-mmproj-offload","--image",c["image"],"-p",c["prompt"],"-n","48","-t","4"]
              t=time.time()
              with out.open("w") as fo, err.open("w") as fe:
                  p=subprocess.run(argv,stdout=fo,stderr=fe,text=True,timeout=240)
              if p.returncode != 0:
                  raise SystemExit(f"case {c['id']} exit {p.returncode}")
              c["wall_seconds"]=round(time.time()-t,3)
          pathlib.Path("out/cases-with-runtime.json").write_text(json.dumps(cases,indent=2))
          PY

      - name: Grade deterministic qualification
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, re
          cases=json.loads(pathlib.Path("out/cases-with-runtime.json").read_text())
          rows=[]
          for c in cases:
              text=(pathlib.Path("out/inference")/f"{c['id']}.stdout.txt").read_text(errors="replace")
              norm=re.sub(r"\s+"," ",text).strip()
              found=[]
              for opt in c["options"]:
                  if re.search(r"(?i)(?<![A-Za-z0-9_])"+re.escape(opt)+r"(?![A-Za-z0-9_])",norm):
                      found.append(opt)
              # The final mentioned option is the model's answer when it emits explanation.
              positions=[]
              for opt in c["options"]:
                  ms=list(re.finditer(r"(?i)(?<![A-Za-z0-9_])"+re.escape(opt)+r"(?![A-Za-z0-9_])",norm))
                  if ms: positions.append((ms[-1].start(),opt))
              parsed=max(positions)[1] if positions else None
              ok=(parsed is not None and parsed.lower()==c["expected"].lower())
              rows.append({"id":c["id"],"expected":c["expected"],"parsed":parsed,"pass":ok,
                           "wall_seconds":c["wall_seconds"],"stdout_sha256":__import__("hashlib").sha256(text.encode()).hexdigest()})
          passed=sum(r["pass"] for r in rows)
          result={
            "schema":"PROJECT_BRAIN_CHARTOGRAPHY_QWEN3VL4B_NONTERMINAL_QUALIFICATION_RESULT_V1",
            "subject":{"model_sha256":"66358cb18bb6b3b1b6675aa412c7a88ef01d228f481184d13668e5201c730a0a",
                       "projector_sha256":"30ba2c7dd3127a4561b6cba9d13d0f711c91bdb38742e2f56d73c8cb596bd06d",
                       "llama_cpp_commit":"a7fb71fab83b474a0892b9a05aaa3a8ddca2729b"},
            "case_count":len(rows),"passed":passed,"failed":len(rows)-passed,
            "qualification_pass":passed>=6,
            "minimum_pass_count":6,
            "terminal_cases_consumed":0,
            "external_dataset_cases_consumed":0,
            "incremental_spend_usd":0,
            "rows":rows,
            "hard_nonclaim":"NONTERMINAL_QUALIFICATION_DOES_NOT_PROVE_CHARTOGRAPHY_GE_89"
          }
          pathlib.Path("out/result.json").write_text(json.dumps(result,indent=2))
          print(json.dumps(result,indent=2))
          if not result["qualification_pass"]:
              raise SystemExit(3)
          PY

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chartography-qwen3vl4b-nonterminal-qualification-v1
          path: out/
          if-no-files-found: error
