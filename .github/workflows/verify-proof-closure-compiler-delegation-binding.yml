name: Verify proof closure compiler and delegation binding
on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/runtime/terminal_proof_closure_compiler_v1.py'
      - 'canonical/tests/test_terminal_proof_closure_compiler_v1.py'
      - 'canonical/governance/TERMINAL_PROOF_EVIDENCE_INDEX_V1.json'
      - 'canonical/governance/ACTIVE_TERMINAL_PROOF_BASIS_V1.json'
      - 'canonical/governance/DELEGATION_TERMINAL_POPULATION_BINDING_V1.json'
      - 'canonical/governance/DELEGATION_WHOLE_DIMENSION_PREFLIGHT_V2.json'
      - 'canonical/verification/DELEGATION_SCOPE_GATE_V2_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json'
      - '.github/workflows/verify-proof-closure-compiler-delegation-binding.yml'
permissions:
  contents: read
jobs:
  compiler:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Bind current Brain basis and verify compiler
        run: |
          set -euo pipefail
          test "$(git hash-object canonical/governance/ACTIVE_TERMINAL_PROOF_BASIS_V1.json)" = "7973213210ac41818783f6851d3ac320f49af564"
          python3 canonical/runtime/terminal_proof_closure_compiler_v1.py --self-test
          PYTHONPATH=. python3 -m unittest -v canonical.tests.test_terminal_proof_closure_compiler_v1
          python3 canonical/runtime/terminal_proof_closure_compiler_v1.py --basis canonical/governance/ACTIVE_TERMINAL_PROOF_BASIS_V1.json --index canonical/governance/TERMINAL_PROOF_EVIDENCE_INDEX_V1.json > /tmp/frontier.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/frontier.json'))
          assert x['errors']==[]
          assert x['terminal_ready']==['SA_CCR_CREDIT_EFFECTIVE_NOTIONAL_AND_ADDON_001']
          assert x['mechanical_closure_candidates']==['TASK_TO_DELEGATION_GRAPH_001']
          by={r['behavior_id']:r for r in x['contracts']}
          assert by['TOOL_ROUTE_DISCOVERY_AND_SELECTION_001']['compile_state']=='SEMANTIC_RESIDUAL'
          assert x['execution_authority'] is False
          print('PROOF_CLOSURE_COMPILER_CURRENT_FRONTIER_PASS')
          PY
  delegation-binding:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Verify exact delegation pre-beacon binding
        run: |
          set -euo pipefail
          test "$(git hash-object canonical/runtime/delegation_whole_scope_candidate_v2.py)" = "9f2c3aa42352cba66967afb1f8a3f45357833c41"
          test "$(git hash-object canonical/runtime/delegation_whole_scope_proof_v2.py)" = "5785b07f482e38acdf7916e5414d90c2c0c305b7"
          test "$(git hash-object canonical/governance/DELEGATION_WHOLE_DIMENSION_PREFLIGHT_V2.json)" = "5070ff1cb248095a1ac4396887384dd083979020"
          test "$(git hash-object canonical/verification/DELEGATION_SCOPE_GATE_V2_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json)" = "ab1d8d19217fe683b62682c8f7f2ce7800fcfe57"
          python3 - <<'PY'
          import hashlib,json
          p=json.load(open('canonical/governance/DELEGATION_TERMINAL_POPULATION_BINDING_V1.json'))
          assert p['pre_beacon_frozen'] is True
          assert p['population']['sample_count']==180 and p['population']['class_count']==6 and p['population']['cases_per_class']==30
          assert p['population']['post_freeze_beacon'] is None
          assert p['population']['adaptive_case_selection'] is False and p['population']['case_replacement'] is False and p['population']['replay_for_tuning'] is False
          assert p['acceptance']['allowed_failed_cases']==0 and len(p['acceptance']['frozen_classes'])==6
          assert p['scope_gate']['unresolved_required_dimensions']==[]
          assert p['information_boundary']['candidate_receives_hidden_oracle'] is False
          assert p['information_boundary']['candidate_receives_reference_solution'] is False
          assert p['terminal_results_observed']==0 and p['fresh_terminal_evidence_consumed']==0
          c={'behavior_id':p['behavior_id'],'candidate_blob_sha':p['exact_blobs']['candidate'],'oracle_blob_sha':p['exact_blobs']['independent_oracle'],'preflight_manifest_blob_sha':p['exact_blobs']['preflight_manifest'],'scope_gate_receipt_blob_sha':p['exact_blobs']['scope_gate_receipt'],'sample_count':p['population']['sample_count'],'class_count':p['population']['class_count'],'acceptance_rule':p['acceptance']['rule'],'seed_rule':'GLOBAL_TERMINAL_REPLACEMENT_POPULATION_PROTOCOL_V2','dependency_mode':p['dependency_mode']}
          raw=json.dumps(c,sort_keys=True,separators=(',',':')).encode()
          assert hashlib.sha256(raw).hexdigest()==p['commitment_components_sha256']
          print('DELEGATION_TERMINAL_POPULATION_BINDING_PREFLIGHT_PASS')
          PY
