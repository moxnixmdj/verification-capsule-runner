name: Verify LiveBench V4 replay72 executor
on:
  pull_request:
    branches: [main]
    paths:
      - "execute_livebench_if_replay72_v4_candidate.py"
      - "verify_livebench_v4_replay72_executor_v1.py"
      - ".github/workflows/verify-livebench-v4-replay72-executor-v1.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.14"
      - name: Verify zero-new-case replay executor
        run: python verify_livebench_v4_replay72_executor_v1.py
