name: Verify live 27 information dominance

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/verify-live-27-information-dominance.yml"
      - "capsules/live_27_information_dominance/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Recompute
        run: |
          python - <<'PY'
          import json
          C=json.load(open("capsules/live_27_information_dominance/candidate.json"))
          F=json.load(open("capsules/live_27_information_dominance/frontier.json"))
          E=json.load(open("capsules/live_27_information_dominance/evidence.json"))
          W=json.load(open("capsules/live_27_information_dominance/world.json"))
          states={x["predicate_id"]:x["state"] for x in E["claims"]}
          unresolved={x for x in F["unresolved_predicates"] if states.get(x) not in {"PROVED","REFUTED"}}
          certs=[]
          for raw in F["certificates"]:
              targets=[x for x in raw["target_predicates"] if x in unresolved]
              if targets:
                  certs.append((raw["id"],set(targets),set(raw.get("requires",[])),float(raw.get("new_reality_units",0))))
          def dom(a,b):
              return a[1]>=b[1] and a[2]<=b[2] and a[3]<=b[3] and (a[1]>b[1] or a[2]<b[2] or a[3]<b[3])
          dominated={b[0]:sorted(a[0] for a in certs if a[0]!=b[0] and dom(a,b)) for b in certs}
          dominated={k:v for k,v in dominated.items() if v}
          req=set().union(*(x[2] for x in certs))
          cov=set().union(*(x[1] for x in certs))
          assert W["expected_live_world"]["proved_predicates"]==11
          assert W["expected_live_world"]["unresolved_predicates"]==27
          assert len(unresolved)==27
          assert len(certs)==16
          assert dominated=={}
          top=max(len(x[1]) for x in certs)
          tops=sorted(x[0] for x in certs if len(x[1])==top)
          assert tops==["MATCHED_SCOPE_BINDING_CERTIFICATE"] and top==8
          assert len(req)==19 and cov==unresolved
          assert C["live_world"]["unresolved_predicates"]==27
          assert C["live_world"]["nondominated_certificate_count"]==16
          assert C["live_world"]["unique_zero_reality_requirements"]==19
          assert C["highest_direct_leverage"]["covered_predicates"]==8
          assert set(C["required_propositions"])==req
          assert C["fresh_reality_authority"] is False
          print("LIVE_27_INFORMATION_DOMINANCE_INDEPENDENT_PASS")
          PY
