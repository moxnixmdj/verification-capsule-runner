name: Audit legacy paraphrase inverter Sol v1
on:
  push:
    branches:
      - verify/legacy-paraphrase-inverter-sol-20261004-v1
    paths:
      - "verification/verify_legacy_paraphrase_inverter_public_v1.py"
      - "verification/subjects/livebench_legacy_paraphrase_inverter_v1__brain_3bfedacc.py"
      - ".github/workflows/audit-legacy-paraphrase-inverter-sol-v1.yml"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.14"
      - run: python verification/verify_legacy_paraphrase_inverter_public_v1.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-paraphrase-inverter-public-audit-v1
          path: legacy_paraphrase_inverter_public_audit_v1.json
          if-no-files-found: error
