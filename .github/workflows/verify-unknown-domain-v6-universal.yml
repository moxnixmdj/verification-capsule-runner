name: Verify Unknown-Domain V6 universal repair
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run independent V6 verifier
        run: PYTHONPATH=. python verification/unknown_domain_v6_independent.py
      - name: Upload verification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unknown-domain-v6-independent-receipt
          path: unknown_domain_v6_independent_receipt.json
          if-no-files-found: error
          retention-days: 7
