name: Verify Brain P1 zero-reality exhaustion gate

on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/p1_zero_reality_gate/**"
      - ".github/workflows/verify-p1-zero-reality-gate.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact Brain gate evidence cone
        run: python capsules/p1_zero_reality_gate/verify.py
