name: Verify Composition current authority V5
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/composition_current_authority_v5/**"
      - ".github/workflows/verify-composition-current-authority-v5.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python capsules/composition_current_authority_v5/verify.py
