name: Verify exact callout association
on:
  pull_request:
    branches: [main]
    paths:
      - 'verification/exact_callout_association.py'
      - 'verification/test_exact_callout_association_independent.py'
      - '.github/workflows/verify-exact-callout-association.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Bind exact Brain mechanism
        run: test "$(git hash-object verification/exact_callout_association.py)" = "17f12aa46a4f38cda8027dfe7764762a5e287102"
      - run: cd verification && python -m unittest -v test_exact_callout_association_independent
