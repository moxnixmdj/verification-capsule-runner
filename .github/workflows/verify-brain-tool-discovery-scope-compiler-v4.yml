name: Verify Brain Tool Discovery scope compiler V4
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/tool_discovery_scope_compiler_v4/**"
      - ".github/workflows/verify-brain-tool-discovery-scope-compiler-v4.yml"
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify exact Brain bytes and current residual projection
        run: PYTHONPATH=capsules/tool_discovery_scope_compiler_v4 python capsules/tool_discovery_scope_compiler_v4/verify.py
