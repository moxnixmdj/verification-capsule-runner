name: Verify protocol implication gate refinement v1
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/protocol_implication_gate_refinement_v1/**"
      - ".github/workflows/verify-protocol-implication-gate-refinement-v1.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify fail-closed semantic gate
        run: |
          cd capsules/protocol_implication_gate_refinement_v1
          export PYTHONPATH=.
          python -m py_compile canonical/runtime/acceptance_ir_compiler_v1.py
          python canonical/tests/test_protocol_implication_gate_refinement_v1.py
