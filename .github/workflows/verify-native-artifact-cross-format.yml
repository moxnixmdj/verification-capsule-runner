name: Verify native artifact cross-format structural preflight
on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/runtime/native_artifact_cross_format_candidate_v1.py'
      - 'canonical/runtime/native_artifact_cross_format_proof_v1.py'
      - 'canonical/tests/test_native_artifact_cross_format_preflight_v1.py'
      - 'canonical/runtime/ooxml_package_transaction.py'
      - 'canonical/runtime/pdf_native_edit_transaction.py'
      - '.github/workflows/verify-native-artifact-cross-format.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned deterministic format dependencies
        run: python -m pip install --disable-pip-version-check python-docx==1.2.0 openpyxl==3.1.5 python-pptx==1.0.2 pypdf==6.19.0 pillow==12.3.0
      - name: Bind exact Brain blobs
        run: |
          test "$(git hash-object canonical/runtime/native_artifact_cross_format_candidate_v1.py)" = "f3e5090647dd9029ab9f46efd06dc0c0d0addbc3"
          test "$(git hash-object canonical/runtime/native_artifact_cross_format_proof_v1.py)" = "904eb61171f5ee775ff7824c1be7778d7acc4a23"
          test "$(git hash-object canonical/tests/test_native_artifact_cross_format_preflight_v1.py)" = "4ec2b2b2a17b5478475df2765b200b7395e5786b"
          test "$(git hash-object canonical/runtime/ooxml_package_transaction.py)" = "970be62854c918b306ae3f62989009bfbd0e8fc7"
          test "$(git hash-object canonical/runtime/pdf_native_edit_transaction.py)" = "b9f673ffe0474d00a598089077ad93db40c00dd8"
      - name: Run cross-format structural preservation preflight
        run: PYTHONPATH=. python -m unittest -v canonical.tests.test_native_artifact_cross_format_preflight_v1
