name: Verify hardened T3 research binding
on:
  pull_request:
    branches: [main]
    paths:
      - 'verification/T3_RESEARCH_CONTROL_MULTIPLEX_TERMINAL_BINDING_V1.json'
      - 'verification/verify_t3_research_binding.py'
      - '.github/workflows/verify-t3-research-binding.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python verification/verify_t3_research_binding.py
