name: Verify LiveBench legacy build-description lineage v1

on:
  push:
    branches:
      - verify-livebench-legacy-build-description-lineage-v1-20261004-sol
    paths:
      - verify_livebench_legacy_build_description_lineage_v1.py
      - .github/workflows/verify-livebench-legacy-build-description-lineage-v1.yml
  pull_request:
    branches: [main]
    paths:
      - verify_livebench_legacy_build_description_lineage_v1.py
      - .github/workflows/verify-livebench-legacy-build-description-lineage-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install exact verifier dependencies
        run: |
          python -m pip install --no-cache-dir \
            pyarrow==21.0.0 \
            langdetect==1.0.9 \
            immutabledict==4.3.1 \
            pandas==2.3.3 \
            nltk==3.10.3

      - name: Fetch exact scorer plus deleted generator provenance
        run: |
          set -euo pipefail
          git init /tmp/livebench
          git -C /tmp/livebench remote add origin https://github.com/LiveBench/LiveBench.git
          git -C /tmp/livebench fetch --depth=1 origin 8f8e5c381a16e3f24257776edd53471fe86f8091
          git -C /tmp/livebench checkout --detach FETCH_HEAD
          test "$(git -C /tmp/livebench rev-parse HEAD)" = "8f8e5c381a16e3f24257776edd53471fe86f8091"
          git -C /tmp/livebench fetch --depth=1 origin 262cfc141e65fa9cf80015b9630b54bed2346f43
          test "$(git -C /tmp/livebench hash-object livebench/if_runner/instruction_following_eval/instructions.py)" = "4997bab885a676d92545fd91a9a20b48d234a2b2"
          test "$(git -C /tmp/livebench hash-object livebench/if_runner/instruction_following_eval/instructions_registry.py)" = "903ed738398648c7cfac61d5ffa478c22f1f0891"
          test "$(git -C /tmp/livebench rev-parse 262cfc141e65fa9cf80015b9630b54bed2346f43:livebench/if_runner/live_data.py)" = "6ff390d6885cf90f88d9d36959735cb327613edc"

      - name: Fetch exact frozen LiveBench instruction-following parquet
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors --silent --show-error \
            "https://huggingface.co/datasets/livebench/instruction_following/resolve/0868379c4b5cf62aeacaf8be4f08fced815c81bb/data/test-00000-of-00001.parquet" \
            -o /tmp/instruction_following.parquet
          test "$(stat -c %s /tmp/instruction_following.parquet)" = "537024"
          echo "a9bb97bbaf8788142c310bcb33d50e2f6f5df8cbd8b8c3db677816b06f0f4f25  /tmp/instruction_following.parquet" | sha256sum -c -

      - name: Prove 200-row exact build-description suffix lineage
        env:
          LIVEBENCH_ROOT: /tmp/livebench
          LIVEBENCH_PARQUET: /tmp/instruction_following.parquet
        run: python verify_livebench_legacy_build_description_lineage_v1.py

      - name: Upload aggregate-only receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livebench-legacy-build-description-lineage-v1
          path: livebench_legacy_build_description_lineage_receipt.json
          if-no-files-found: warn
          retention-days: 30
