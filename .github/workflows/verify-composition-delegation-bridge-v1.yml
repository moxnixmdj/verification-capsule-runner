name: Verify Brain current-source composition delegation bridge V1
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/composition_delegation_bridge_v1/**"
      - ".github/workflows/verify-composition-delegation-bridge-v1.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact current Brain delegation bridge and source closure
        run: python capsules/composition_delegation_bridge_v1/verify.py
