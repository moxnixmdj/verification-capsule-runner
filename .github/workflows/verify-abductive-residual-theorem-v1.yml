name: Verify abductive residual theorem v1
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/abductive_residual_theorem_v1/**"
      - ".github/workflows/verify-abductive-residual-theorem-v1.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact Brain blob identities
        run: |
          cd capsules/abductive_residual_theorem_v1
          python - <<'PY'
          import hashlib, json, pathlib
          m=json.load(open("EXPECTED_BRAIN_BLOBS.json",encoding="utf-8"))
          for src, expected in m["exact_brain_blobs"].items():
              rel=src
              data=pathlib.Path(rel).read_bytes()
              actual=hashlib.sha1(f"blob {len(data)}\0".encode()+data).hexdigest()
              assert actual==expected, (src,actual,expected)
          print("exact Brain blob identities: PASS")
          PY
      - name: Verify abductive residual theorem compiler
        run: |
          cd capsules/abductive_residual_theorem_v1
          export PYTHONPATH=.
          python -m py_compile canonical/runtime/abductive_residual_theorem_v1.py
          python -m unittest canonical.tests.test_abductive_residual_theorem_v1 -v
      - name: Verify zero-credit governance
        run: |
          cd capsules/abductive_residual_theorem_v1
          python - <<'PY'
          import json
          d=json.load(open("canonical/governance/ABDUCTIVE_RESIDUAL_THEOREM_COMPILER_V1.json",encoding="utf-8"))
          assert d["capability_credit_delta"]==0
          assert d["family_credit_delta"]==0
          assert d["execution_authority"] is False
          assert d["promotion_authority"] is False
          assert "NO_CIRCULAR_SELF_PROOF" in d["hard_rules"]
          print("zero-credit governance: PASS")
          PY
