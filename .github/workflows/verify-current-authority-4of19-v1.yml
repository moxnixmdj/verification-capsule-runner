name: Verify current authority 4of19 v1
on:
  pull_request:
    branches: [main]
    paths:
      - 'capsules/current_authority_4of19_v1/**'
      - '.github/workflows/verify-current-authority-4of19-v1.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recompute family and atomic authority from exact Brain blobs
        env:
          EXPECTED_JSON: '{"canonical/runtime/opus55_acceptance_calibration_reducer_v2.py":"73b0b27644e0fa0d89ff8fbdb51005c20eae3632","canonical/governance/OPUS55_TERMINAL_PROOF_PROTOCOLS_V1.json":"eb4bca0fe6a015d49d2854998fbe046c979c7ea9","canonical/capabilities/opus55/OPUS_5_5_USEFUL_CAPABILITY_ENVELOPE_V1.json":"661a57f839101fbf54c7e4edc76166c65ce9327d","canonical/verification/TERMINAL_V3_POSTWAVE_CONTRACT_AND_FAMILY_REDUCTION_20261002_V1.json":"51e3e7578e9adbeee2168d2223b84481fea16a09","canonical/governance/OPUS55_ACCEPTANCE_PROOF_TRANSMUTATION_INPUT_V1.json":"96052a6b5178305b37a2526fb25c3f53fa33b9b5","canonical/runtime/acceptance_proof_transmuter_v1.py":"0580f9819b5465c9617f0a1e8ff9a96902eedfc6","canonical/runtime/opus55_acceptance_residual_compiler_v2.py":"cae5bc3bfda9c77d7d7e5151127f55aafddb9522","canonical/governance/OPUS55_ACCEPTANCE_PREDICATE_REGISTRY_V2.json":"562536d9ba3f245a6bd24490a1eb3b30f27e0c3a","canonical/governance/OPUS55_ACCEPTANCE_PREDICATE_EVIDENCE_BINDINGS_V2.json":"f500b56e7349ce8c0f97cfd0bd1db4888ec6887c","canonical/reasoning/2026-10-02_EXACT_OPUS55_ZERO_COST_COMPARATOR_ROUTE_RECONCILIATION_V1.json":"f67e22cee5e6fce1ebfae92ebf0946f78fafcee1","canonical/governance/OPUS55_PUBLIC_BAR_SCORE_READINESS_MATRIX_V1.json":"4e59e30461c9ff1bee1a9474627d5fb4074844b2","canonical/governance/CURRENT_TERMINAL_AUTHORITY_V1.json":"bf3d1128ea2b02b5acee9ee3b227293e82611ca3"}'
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path('capsules/current_authority_4of19_v1')
          expected=json.loads(os.environ['EXPECTED_JSON'])
          for rel,want in sorted(expected.items()):
              data=(root/rel).read_bytes()
              got=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              assert got==want,(rel,got,want)
          print('CURRENT_AUTHORITY_EXACT_12_OF_12_BLOBS_PASS')
          PY
          cd capsules/current_authority_4of19_v1
          PYTHONPATH=. python - <<'PY'
          import json
          from pathlib import Path
          from canonical.runtime.opus55_acceptance_calibration_reducer_v2 import evaluate as calibrate
          from canonical.runtime.opus55_acceptance_residual_compiler_v2 import evaluate as residual
          def load(p):
              return json.loads(Path(p).read_text(encoding='utf-8'))

          c=calibrate(
              load('canonical/capabilities/opus55/OPUS_5_5_USEFUL_CAPABILITY_ENVELOPE_V1.json'),
              load('canonical/governance/OPUS55_TERMINAL_PROOF_PROTOCOLS_V1.json'),
              load('canonical/verification/TERMINAL_V3_POSTWAVE_CONTRACT_AND_FAMILY_REDUCTION_20261002_V1.json'),
              load('canonical/governance/OPUS55_ACCEPTANCE_PROOF_TRANSMUTATION_INPUT_V1.json'),
          )
          expected_families={
              'EXACT_SYMBOLIC_COMPUTATION',
              'LONG_HORIZON_MEMORY_AND_CONTINUITY',
              'TOOL_DISCOVERY_SELECTION_AND_LEARNING',
              'SUBAGENT_DELEGATION_AND_COORDINATION',
          }
          assert c['errors']==[],c
          assert c['behavioral_pass_family_count']==19,c
          assert c['acceptance_calibrated_family_count']==4,c
          assert c['acceptance_pending_family_count']==15,c
          assert set(c['acceptance_calibrated_families'])==expected_families,c
          assert c['terminal_goal_acceptance_closed'] is False,c
          assert c['transmutation_summary']['closed_family_count']==4,c
          assert c['transmutation_summary']['open_family_count']==15,c

          r=residual(
              load('canonical/governance/OPUS55_ACCEPTANCE_PREDICATE_REGISTRY_V2.json'),
              load('canonical/governance/OPUS55_ACCEPTANCE_PREDICATE_EVIDENCE_BINDINGS_V2.json'),
              load('canonical/reasoning/2026-10-02_EXACT_OPUS55_ZERO_COST_COMPARATOR_ROUTE_RECONCILIATION_V1.json'),
              load('canonical/governance/OPUS55_PUBLIC_BAR_SCORE_READINESS_MATRIX_V1.json'),
          )
          assert r['errors']==[],r
          assert r['predicate_count']==38,r
          assert (r['proved_predicate_count'],r['open_predicate_count'],r['blocked_predicate_count'],r['refuted_predicate_count'])==(9,0,29,0),r
          d=next(x for x in r['families'] if x['family']=='SUBAGENT_DELEGATION_AND_COORDINATION')
          assert d['state']=='PROVED' and d['proved']==3 and d['blocked']==0,d
          assert r['terminal_promotion_allowed'] is False,r
          assert r['authorized_actions']==[],r

          stale=load('canonical/governance/CURRENT_TERMINAL_AUTHORITY_V1.json')
          assert stale['truth']['opus55_acceptance']=='3/19_PASS__16/19_OPEN',stale['truth']
          print('CURRENT_AUTHORITY_RECOMPUTE_4_OF_19__9_OF_38_PASS')
          PY
