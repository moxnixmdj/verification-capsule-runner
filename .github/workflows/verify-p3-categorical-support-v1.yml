name: Verify P3 categorical support v1
on:
  push:
    branches: ["verify/p3-categorical-frozen-762fb-v1"]
  pull_request:
    branches: [main]
    paths:
      - "capsules/p3_categorical_support_v1/**"
      - ".github/workflows/verify-p3-categorical-support-v1.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact Brain blob identities
        run: |
          cd capsules/p3_categorical_support_v1
          python - <<'PY'
          import hashlib, json, pathlib
          m=json.load(open("EXPECTED_BRAIN_BLOBS.json",encoding="utf-8"))
          for src, expected in m["exact_brain_blobs"].items():
              data=pathlib.Path(src).read_bytes()
              actual=hashlib.sha1(f"blob {len(data)}\0".encode()+data).hexdigest()
              assert actual==expected,(src,actual,expected)
          print("exact Brain blob identities: PASS")
          PY
      - name: Compile candidate runtimes
        run: |
          cd capsules/p3_categorical_support_v1
          export PYTHONPATH=.
          python -m py_compile \
            canonical/runtime/bounded_explicit_categorical_support_v1.py \
            canonical/runtime/selected_support_truth_certificate_v5.py \
            canonical/runtime/p3_required_claim_grounded_realization_cell_v3.py \
            canonical/runtime/p3_real_context_v3_admission_v6.py
      - name: Replay exact Brain focused tests without pytest
        run: |
          cd capsules/p3_categorical_support_v1
          export PYTHONPATH=.
          python - <<'PY'
          import inspect, runpy
          paths=[
            "canonical/tests/test_bounded_explicit_categorical_support_v1.py",
            "canonical/tests/test_selected_support_truth_certificate_v5.py",
            "canonical/tests/test_p3_required_claim_grounded_realization_cell_v3.py",
            "canonical/tests/test_p3_real_context_v3_admission_v6.py",
          ]
          total=0
          by_file={}
          for path in paths:
              ns=runpy.run_path(path)
              funcs=[
                  (name,fn) for name,fn in ns.items()
                  if name.startswith("test_") and callable(fn)
                  and len(inspect.signature(fn).parameters)==0
              ]
              for name,fn in sorted(funcs):
                  fn()
              by_file[path]=len(funcs)
              total+=len(funcs)
          print({"focused_assertions_passed":total,"by_file":by_file})
          PY
      - name: Run independent categorical and grounded-realization tests
        run: |
          cd capsules/p3_categorical_support_v1
          export PYTHONPATH=.
          python -m unittest verify_p3_categorical_support_v1 -v
