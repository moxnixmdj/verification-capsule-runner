name: Verify Composition Recovery bridge V1
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/composition_recovery_bridge_v1/**"
      - ".github/workflows/verify-composition-recovery-bridge-v1.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python capsules/composition_recovery_bridge_v1/verify.py
