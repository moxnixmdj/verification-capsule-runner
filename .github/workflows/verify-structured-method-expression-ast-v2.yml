name: Verify structured method expression AST V2
on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/runtime/structured_method_expression_ast_candidate_v2.py'
      - 'canonical/runtime/structured_method_expression_ast_proof_v2.py'
      - 'canonical/tests/test_structured_method_expression_ast_v2.py'
      - '.github/workflows/verify-structured-method-expression-ast-v2.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Bind exact Brain blobs
        run: |
          set -euo pipefail
          test "$(git hash-object canonical/runtime/structured_method_expression_ast_candidate_v2.py)" = "699a571b065efaade0bb0cf9f9ac4d7340d4920d"
          test "$(git hash-object canonical/runtime/structured_method_expression_ast_proof_v2.py)" = "19f522501a3f89179f80d90800d0f18b40d23627"
          test "$(git hash-object canonical/tests/test_structured_method_expression_ast_v2.py)" = "46a4d1138af70a9a34ab490a20db56ad019c5fdd"
      - name: Run full AST grammar preflight
        run: PYTHONPATH=. python -m unittest -v canonical.tests.test_structured_method_expression_ast_v2
