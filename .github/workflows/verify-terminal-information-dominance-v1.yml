name: Verify terminal information dominance v1
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/terminal_information_dominance_v1/**"
      - ".github/workflows/verify-terminal-information-dominance-v1.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact Brain blobs and information dominance
        run: |
          cd capsules/terminal_information_dominance_v1
          export PYTHONPATH=.
          python -m py_compile canonical/runtime/terminal_information_dominance_v1.py
          python canonical/tests/test_terminal_information_dominance_v1.py
          python independent_verify.py
