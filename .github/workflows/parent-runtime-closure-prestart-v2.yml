name: Verify Parent Runtime Closure Prestart V2

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-parent-runtime-closure:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify registry-derived runtime closure
        run: python verify_parent_runtime_closure_prestart_v2.py
      - name: Upload closure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parent-runtime-closure-prestart-v2
          path: parent-runtime-closure-prestart-v2-report.json
          if-no-files-found: error
