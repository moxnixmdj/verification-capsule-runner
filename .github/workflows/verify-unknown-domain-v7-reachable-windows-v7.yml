name: Verify Unknown-Domain V7 reachable domain Windows V7 exact-object

on:
  pull_request:
    branches:
      - main
    paths:
      - "verification/unknown_domain_v7_reachable_domain_independent_v3.py"
      - ".github/workflows/verify-unknown-domain-v7-reachable-windows-v7.yml"
      - "canonical/runtime/unknown_domain_direct_candidate_v1.py"
      - "canonical/runtime/unknown_domain_direct_candidate_v2.py"
      - "canonical/runtime/unknown_domain_direct_candidate_v3.py"
      - "canonical/runtime/unknown_domain_direct_hidden_generator_v1.py"
      - "canonical/runtime/unknown_domain_direct_hidden_generator_v2.py"
      - "canonical/runtime/unknown_domain_direct_hidden_generator_v4.py"
      - "canonical/runtime/unknown_domain_direct_hidden_generator_v5.py"
      - "canonical/runtime/unknown_domain_direct_hidden_scorer_v1.py"
      - "canonical/runtime/unknown_domain_direct_execution_harness_v1.py"
      - "canonical/tests/test_unknown_domain_direct_v5.py"
      - "canonical/runtime/unknown_domain_direct_v6_universal_proof_v1.py"
      - "canonical/runtime/unknown_domain_direct_production_once_v1.py"
      - ".github/workflows/unknown-domain-direct-one-use-production.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Python 3.12.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"

      - name: Rematerialize and prove exact Git-object bytes
        shell: pwsh
        run: |
          $env:PYTHONUTF8="1"
          @'
          import hashlib
          import subprocess
          from pathlib import Path

          expected = {
              "canonical/runtime/unknown_domain_direct_candidate_v1.py": "a2a77269a8175ce315b466035049da0f761b8734",
              "canonical/runtime/unknown_domain_direct_candidate_v2.py": "4470716f95a559a700e461262df909ae19a41651",
              "canonical/runtime/unknown_domain_direct_candidate_v3.py": "8df7f13455b710623806a8219174b397a2c3c442",
              "canonical/runtime/unknown_domain_direct_hidden_generator_v1.py": "f974a4594c78e74693c7ba5a19f131dfa481b937",
              "canonical/runtime/unknown_domain_direct_hidden_generator_v2.py": "d077028c9bde534dc4bc6eb0d1f776341f9d59f8",
              "canonical/runtime/unknown_domain_direct_hidden_generator_v4.py": "e52858b9fef2d795f72b45cd3ae82ad04344aa91",
              "canonical/runtime/unknown_domain_direct_hidden_generator_v5.py": "0faa62fce4bc2f2a99c173b0a10a32d5e1c6a244",
              "canonical/runtime/unknown_domain_direct_hidden_scorer_v1.py": "e8cf5d1b5d311644725a751c15e6235958fb587d",
              "canonical/runtime/unknown_domain_direct_execution_harness_v1.py": "04fe06f4eed081c4cb6197b12f2d92bd396aeafd",
              "canonical/tests/test_unknown_domain_direct_v5.py": "1961cff0013ff9f17feca981409d89d01ecf6769",
              "canonical/runtime/unknown_domain_direct_v6_universal_proof_v1.py": "2da564d27a318a99713165208126aaaf36ebc924",
              "canonical/runtime/unknown_domain_direct_production_once_v1.py": "7f05674904a4b3223cb26993a1e2e4b0bac8a0e7",
              ".github/workflows/unknown-domain-direct-one-use-production.yml": "990b4fe712ca509f3e01c8e632c75416a3cd0b98",
              "verification/unknown_domain_v7_reachable_domain_independent_v3.py": "d25d0c4f468bf058675d43b2e1a2e68960e32f5f",
          }

          def blob_sha(data: bytes) -> str:
              return hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()

          for path, want in expected.items():
              data = subprocess.check_output(["git", "cat-file", "blob", f"HEAD:{path}"])
              got_object = blob_sha(data)
              if got_object != want:
                  raise SystemExit(f"GIT_OBJECT_MISMATCH:{path}:{got_object}:{want}")
              Path(path).write_bytes(data)
              got_worktree = blob_sha(Path(path).read_bytes())
              if got_worktree != want:
                  raise SystemExit(f"REMATERIALIZED_BYTE_MISMATCH:{path}:{got_worktree}:{want}")

          print("EXACT_GIT_OBJECT_BYTES_REMATERIALIZED", len(expected))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw "EXACT_OBJECT_REMATERIALIZATION_FAILED" }

      - name: Verify Python 3.12.10 fail-closed
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Stop"
          $env:PYTHONPATH="."
          Remove-Item unknown_domain_v7_reachable_domain_receipt.json -ErrorAction SilentlyContinue
          Remove-Item unknown_domain_v7_reachable_domain_receipt_py312.json -ErrorAction SilentlyContinue
          Remove-Item PY312_V7_PASS -ErrorAction SilentlyContinue
          python --version
          if ($LASTEXITCODE -ne 0) { throw "PY312_VERSION_FAILED" }
          python -m pip install --disable-pip-version-check pytest==8.4.2
          if ($LASTEXITCODE -ne 0) { throw "PY312_PYTEST_INSTALL_FAILED" }
          python verification/unknown_domain_v7_reachable_domain_independent_v3.py
          if ($LASTEXITCODE -ne 0) { throw "PY312_VERIFIER_FAILED" }
          if (!(Test-Path unknown_domain_v7_reachable_domain_receipt.json)) { throw "PY312_RECEIPT_MISSING" }
          python -m pytest -q canonical/tests/test_unknown_domain_direct_v5.py
          if ($LASTEXITCODE -ne 0) { throw "PY312_REGRESSION_FAILED" }
          python -c "import json; d=json.load(open('unknown_domain_v7_reachable_domain_receipt.json')); assert d['schema']=='PROJECT_BRAIN_UNKNOWN_DOMAIN_V7_REACHABLE_DOMAIN_INDEPENDENT_VERIFICATION_V1'; assert d['status']=='PASS__CONTENT_BOUND_FROZEN_LAUNCHER_REACHABLE_TYPE_DOMAIN__CLASS_SPOOF_REJECTED__54_NONPRODUCTION_CASES__ZERO_TERMINAL_REALITY'; assert d['nonproduction_exact_scorer_cases']==54; assert d['launcher_boundary']['production_or_terminal_cases_actually_generated']==0; assert d['acceptance_credit_delta']==d['family_credit_delta']==d['capability_credit_delta']==d['ownership_credit_delta']==0"
          if ($LASTEXITCODE -ne 0) { throw "PY312_RECEIPT_VALIDATION_FAILED" }
          Copy-Item -ErrorAction Stop unknown_domain_v7_reachable_domain_receipt.json unknown_domain_v7_reachable_domain_receipt_py312.json
          New-Item -ItemType File PY312_V7_PASS -ErrorAction Stop | Out-Null

      - name: Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Verify Python 3.13 fail-closed
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Stop"
          $env:PYTHONPATH="."
          Remove-Item unknown_domain_v7_reachable_domain_receipt.json -ErrorAction SilentlyContinue
          Remove-Item unknown_domain_v7_reachable_domain_receipt_py313.json -ErrorAction SilentlyContinue
          Remove-Item PY313_V7_PASS -ErrorAction SilentlyContinue
          python --version
          if ($LASTEXITCODE -ne 0) { throw "PY313_VERSION_FAILED" }
          python -m pip install --disable-pip-version-check pytest==8.4.2
          if ($LASTEXITCODE -ne 0) { throw "PY313_PYTEST_INSTALL_FAILED" }
          python verification/unknown_domain_v7_reachable_domain_independent_v3.py
          if ($LASTEXITCODE -ne 0) { throw "PY313_VERIFIER_FAILED" }
          if (!(Test-Path unknown_domain_v7_reachable_domain_receipt.json)) { throw "PY313_RECEIPT_MISSING" }
          python -m pytest -q canonical/tests/test_unknown_domain_direct_v5.py
          if ($LASTEXITCODE -ne 0) { throw "PY313_REGRESSION_FAILED" }
          python -c "import json; d=json.load(open('unknown_domain_v7_reachable_domain_receipt.json')); assert d['schema']=='PROJECT_BRAIN_UNKNOWN_DOMAIN_V7_REACHABLE_DOMAIN_INDEPENDENT_VERIFICATION_V1'; assert d['status']=='PASS__CONTENT_BOUND_FROZEN_LAUNCHER_REACHABLE_TYPE_DOMAIN__CLASS_SPOOF_REJECTED__54_NONPRODUCTION_CASES__ZERO_TERMINAL_REALITY'; assert d['nonproduction_exact_scorer_cases']==54; assert d['launcher_boundary']['production_or_terminal_cases_actually_generated']==0; assert d['acceptance_credit_delta']==d['family_credit_delta']==d['capability_credit_delta']==d['ownership_credit_delta']==0"
          if ($LASTEXITCODE -ne 0) { throw "PY313_RECEIPT_VALIDATION_FAILED" }
          Copy-Item -ErrorAction Stop unknown_domain_v7_reachable_domain_receipt.json unknown_domain_v7_reachable_domain_receipt_py313.json
          New-Item -ItemType File PY313_V7_PASS -ErrorAction Stop | Out-Null

      - name: Upload both receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unknown-domain-v7-reachable-windows-v7-both-pythons
          path: |
            unknown_domain_v7_reachable_domain_receipt_py312.json
            unknown_domain_v7_reachable_domain_receipt_py313.json
          if-no-files-found: error
          retention-days: 7

      - name: Require both runtimes green
        if: always()
        shell: pwsh
        run: |
          if (!(Test-Path PY312_V7_PASS)) { throw "PY312_V7_NOT_GREEN" }
          if (!(Test-Path PY313_V7_PASS)) { throw "PY313_V7_NOT_GREEN" }
