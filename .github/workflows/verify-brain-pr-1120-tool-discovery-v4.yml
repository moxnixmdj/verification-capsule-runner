name: Verify Brain PR 1120 Tool Discovery V4 soundness
on:
  push:
    branches: [verify-brain-pr-1120-tool-discovery-v4]
    paths:
      - "capsules/brain_pr_1120_tool_discovery_v4_soundness/**"
      - ".github/workflows/verify-brain-pr-1120-tool-discovery-v4.yml"
  pull_request:
    branches: [main]
    paths:
      - "capsules/brain_pr_1120_tool_discovery_v4_soundness/**"
      - ".github/workflows/verify-brain-pr-1120-tool-discovery-v4.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact Brain PR 1120 blob identities
        shell: bash
        run: |
          set -euo pipefail
          cd capsules/brain_pr_1120_tool_discovery_v4_soundness
          test "$(git hash-object canonical/runtime/tool_discovery_dynamic_candidate_v3.py)" = "bbbee4d6baf8df937543644397abba38a67dce62"
          test "$(git hash-object canonical/runtime/tool_discovery_dynamic_candidate_v4.py)" = "9572b25f7bdaee0f35e00cf3a1f25bc0dbd69096"
          test "$(git hash-object canonical/runtime/tool_discovery_v4_soundness_repair_v1.py)" = "739b0a349bf91099d6fa6ea91450ed900211dc87"
          test "$(git hash-object canonical/tests/test_tool_discovery_dynamic_candidate_v4.py)" = "9c0693b131058f18e061c25e2dc3cbe5fee36d28"
          test "$(git hash-object canonical/tests/test_tool_discovery_v4_soundness_repair_v1.py)" = "67420c1f576e18d89ab9ad5538a080fff47681a8"
          test "$(git hash-object canonical/governance/TOOL_DISCOVERY_COMPLETE_INTERFACE_CONTRACT_V2.json)" = "066ae03f40769abf3ce29cbd4e8bbfcb3fdbba92"
          test "$(git hash-object canonical/governance/TOOL_DISCOVERY_DYNAMIC_V3_REFINEMENT_FALSIFICATION_AND_V4_REPAIR_V1.json)" = "66a39a5521930b7f901f01e57eb5be0e74e70a78"
          test "$(git hash-object canonical/runtime/tool_discovery_v4_conditional_program_proof_v1.py)" = "59a0ff6e6c06580b8361d017ec26382e1f111e85"
          test "$(git hash-object canonical/tests/test_tool_discovery_v4_conditional_program_proof_v1.py)" = "3c3301933dd3509e0ea1f110839d414330173c6a"
          test "$(git hash-object canonical/governance/TOOL_DISCOVERY_V4_CONDITIONAL_PROGRAM_PROOF_V1.json)" = "d97f549ad205bbf464a08bee22d3b669f1e2adfd"
          test "$(git hash-object canonical/action_intents/2026-10-03_TOOL_DISCOVERY_V4_SOUNDNESS_REPAIR_V1.json)" = "ebea7c0473823d090aebd235e21093d838e43c5c"
      - name: Run adversarial V3 counterexample and V4 tests
        shell: bash
        run: |
          set -euo pipefail
          cd capsules/brain_pr_1120_tool_discovery_v4_soundness
          export PYTHONPATH=.
          python -m unittest canonical.tests.test_tool_discovery_dynamic_candidate_v4 -v
          python -m unittest canonical.tests.test_tool_discovery_v4_soundness_repair_v1 -v
          python -m unittest canonical.tests.test_tool_discovery_v4_conditional_program_proof_v1 -v
      - name: Execute soundness repair verdict
        shell: bash
        run: |
          set -euo pipefail
          cd capsules/brain_pr_1120_tool_discovery_v4_soundness
          export PYTHONPATH=.
          python -m canonical.runtime.tool_discovery_v4_soundness_repair_v1 > verdict.json
          python -m canonical.runtime.tool_discovery_v4_conditional_program_proof_v1 > program_proof.json
      - name: Enforce fail-closed truth
        shell: bash
        run: |
          set -euo pipefail
          cd capsules/brain_pr_1120_tool_discovery_v4_soundness
          python - <<'PY'
          import json
          v=json.load(open("verdict.json",encoding="utf-8"))
          assert v["status"].startswith("PASS__V3_CONDITIONAL_REFINEMENT_FALSIFIED"),v
          assert v["v3_falsified"] is True,v
          assert v["prior_residual_reduction_to_interface_instance_only_sound"] is False,v
          assert v["counterexample"]["v3_action"]=={"action":"SELECT","tool_id":"EXPENSIVE"},v
          assert v["counterexample"]["v4_action_before_discovery"]=={"action":"DISCOVER","source_id":"S0","query":"CAP_A"},v
          assert v["counterexample"]["v4_action_after_complete_discovery"]=={"action":"SELECT","tool_id":"CHEAP"},v
          assert v["v4_safe_probe_gate_check"]=={"action":"SELECT","tool_id":"SAFE"},v
          assert v["v4_stale_discovery_receipt_check"]=={"action":"DISCOVER","source_id":"S0","query":"CAP_A"},v
          assert v["v4_unauthorized_source_check"]=={"action":"SELECT","tool_id":"SAFE"},v
          assert v["v4_repair_checks_pass"] is True,v
          assert v["universal_target_proved"] is False,v
          assert v["new_reality_units_consumed"]==0 and v["terminal_results_replayed"]==0,v
          assert v["capability_credit_delta"]==0 and v["family_credit_delta"]==0,v
          assert v["execution_authority"] is False and v["promotion_authority"] is False,v
          p=json.load(open("program_proof.json",encoding="utf-8"))
          assert p["status"].startswith("PASS__V4_CONDITIONAL_PROGRAM_SIDE_PROOF"),p
          assert p["source_blob_drift"]==[],p
          assert p["interface_contract_property_set_exact"] is True,p
          assert all(p["structural_induction_obligations"].values()),p
          assert p["exhaustive_dynamic_abstraction"]["pass"] is True,p
          assert p["exhaustive_dynamic_abstraction"]["checked"]>1000,p
          assert all(p["epoch_and_authority_checks"].values()),p
          assert p["predicate_language_semantics"]["pass"] is True,p
          assert p["predicate_language_semantics"]["checked"]>20,p
          assert all(p["route_filter_checks"].values()),p
          assert p["conditional_program_sound_under_v2_contract"] is True,p
          assert p["global_oracle_is_over_complete_tool_set_not_current_visible_subset"] is True,p
          assert p["universal_target_proved"] is False,p
          assert p["external_interface_instance_verified"] is False,p
          assert p["minimum_missing_fact"]=="INDEPENDENT_VERIFIED_COMPLETE_DISCOVERY_INTERFACE_INSTANCE_SATISFYING_TOOL_DISCOVERY_COMPLETE_INTERFACE_CONTRACT_V2",p
          assert p["capability_credit_delta"]==0 and p["family_credit_delta"]==0,p
          print("Brain PR 1120 Tool Discovery V4 soundness + conditional program proof: PASS")
          PY
