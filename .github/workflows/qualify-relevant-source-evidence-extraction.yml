name: Qualify Relevant Source Evidence Extraction
on:
  pull_request:
    branches: [main]
    paths:
      - canonical/runtime/bound_capabilities/relevant_source_evidence_extract.py
      - canonical/runtime/bound_capabilities/first_party_objective_relevance_verify.py
      - canonical/runtime/bound_capabilities/open_research_source_frontend.py
      - canonical/runtime/astra_runtime.py
      - canonical/tests/test_relevant_source_evidence_extract.py
      - canonical/tests/test_relevant_source_evidence_extract_live_qualification.py
      - .github/workflows/qualify-relevant-source-evidence-extraction.yml
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run authored extraction regressions
        run: python canonical/tests/test_relevant_source_evidence_extract.py
      - name: Run independent fresh live cross-domain qualification
        run: python canonical/tests/test_relevant_source_evidence_extract_live_qualification.py
      - name: Verify parent integration markers
        run: |
          grep -q "OPEN_ENDED_RESEARCH_EVIDENCE_EXTRACTED__" canonical/runtime/astra_runtime.py
          grep -q "MODEL_INDEPENDENT_CLAIM_SUPPORT_AND_RELATION_EVALUATION_FROM_EXTRACTED_EVIDENCE_V1" canonical/runtime/bound_capabilities/open_research_source_frontend.py
