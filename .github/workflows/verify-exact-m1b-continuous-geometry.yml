name: Verify exact M1B continuous geometry
on:
  pull_request:
    branches: [main]
    paths:
      - 'verification/m1b_continuous_geometry_compiler.py'
      - 'verification/test_m1b_continuous_geometry_compiler.py'
      - 'verification/cad_partspec.py'
      - 'verification/cad_partspec_generator.py'
      - '.github/workflows/verify-exact-m1b-continuous-geometry.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - name: Verify exact Brain blobs
        run: |
          test "$(git hash-object verification/m1b_continuous_geometry_compiler.py)" = "0c7c6355cde87c961319d6f9948839cb56add092"
          test "$(git hash-object verification/test_m1b_continuous_geometry_compiler.py)" = "f35d4a190047decd3148b5d366ed783a3846a2e3"
          test "$(git hash-object verification/cad_partspec.py)" = "e5b68367cbaaeedb97c6eb8f2d080f19e3a2cdbb"
          test "$(git hash-object verification/cad_partspec_generator.py)" = "89b4250fa85df8d02d51bcb513f035d102625056"
      - run: python -m pip install --disable-pip-version-check --no-input "pydantic>=2,<3" "cadquery==2.6.1"
      - run: cd verification && python -m unittest -v test_m1b_continuous_geometry_compiler
