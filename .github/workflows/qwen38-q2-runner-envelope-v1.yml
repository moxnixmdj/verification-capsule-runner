name: Qwen3.8 Q2 runner envelope V1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qwen38-q2-runner-envelope-v1.yml'

permissions:
  contents: read

jobs:
  envelope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Measure exact free-runner envelope
        shell: bash
        run: |
          set -euo pipefail
          cpu="$(nproc)"
          mem_kb="$(awk '/MemTotal/ {print $2}' /proc/meminfo)"
          disk_b="$(df --output=avail -B1 "$RUNNER_TEMP" | tail -1 | tr -d ' ')"
          echo "cpu_count=$cpu"
          echo "mem_total_kb=$mem_kb"
          echo "disk_available_bytes=$disk_b"
          test "$mem_kb" -ge 14500000
          test "$disk_b" -ge 11000000000
          echo 'qwen38_q2_download_fit_preflight=PASS'
          echo 'incremental_spend_usd=0'
