name: Verify LiveBench V8 atomic launcher
on:
  push:
    branches:
      - diagnose/livebench-v8-structural-refinement-20261004
    paths:
      - "verify_livebench_v8_atomic_launcher.py"
      - "launch_livebench_v8_structural_atomic.py"
      - "diagnose_livebench_replay72_v8_structural.py"
      - ".github/workflows/verify-livebench-v8-atomic-launcher.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: diagnose/livebench-v8-structural-refinement-20261004
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.14"
      - run: python verify_livebench_v8_atomic_launcher.py
