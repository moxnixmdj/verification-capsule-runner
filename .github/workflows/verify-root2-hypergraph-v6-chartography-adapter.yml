name: Verify Root2 hypergraph V6 Chartography adapter
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/root2_v6_chartography_adapter/**"
      - ".github/workflows/verify-root2-hypergraph-v6-chartography-adapter.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          cd capsules/root2_v6_chartography_adapter
          python verify.py
