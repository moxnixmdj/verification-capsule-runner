name: Guarded Verify PR468 Multi-Clause Broad Routing

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ASTRA_DISABLE_MODEL_PLANNER: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Atomically admit exact non-parent qualification once
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python execution_guard/github_actions_guarded_run_live.py --plan guarded_pr468_broad_routing_plan.json --receipt pr468-broad-routing-admission.json

      - name: Preserve guarded qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: guarded-pr468-broad-routing-evidence
          path: |
            pr468-broad-routing-admission.json
            pr468-broad-routing-independent-report.json
            guarded_pr468_broad_routing_plan.json
            pr468_broad_routing_authorization.json
          if-no-files-found: warn
