name: Qualify Open Research Qualified Source Chain
on:
  push:
    branches:
      - qualify/open-research-qualified-source-chain-20260930-v1
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Run qualified source frontend tests
        run: python -m unittest -v canonical.tests.test_qualified_source_frontend
