name: Verify LiveBench Single Checker Public Witnesses
on:
  push:
    branches:
      - verify/livebench-single-checker-public-witness-run-20261004-sol
  pull_request:
    branches:
      - main
    paths:
      - 'verify_livebench_single_checker_public_witness.py'
      - 'subjects/livebench_single_checker_v1/**'
      - '.github/workflows/verify-livebench-single-checker-public-witness.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact-checker runtime dependencies
        run: |
          python -m pip install --disable-pip-version-check "nltk>=3.9,<4" "emoji>=2,<3" "syllapy>=0.7,<1" "spacy>=3.8,<4"
          python -m spacy download en_core_web_sm
      - name: Execute 256 public single-checker rows against exact pinned checker source
        run: python verify_livebench_single_checker_public_witness.py
      - name: Upload diagnostic receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livebench-single-checker-public-witness-receipt
          path: livebench_single_checker_public_witness_receipt.json
          if-no-files-found: error
