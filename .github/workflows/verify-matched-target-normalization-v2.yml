name: Verify matched target normalization v2
on:
  pull_request:
    branches: [main]
    paths:
      - 'capsules/matched_target_normalization_v2/**'
      - '.github/workflows/verify-matched-target-normalization-v2.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact Brain blobs and 13-target normalization
        env:
          EXPECTED_JSON: '{"canonical/governance/OPUS55_TERMINAL_PROOF_PROTOCOLS_V1.json":"eb4bca0fe6a015d49d2854998fbe046c979c7ea9","canonical/governance/OPUS55_ACCEPTANCE_PREDICATE_REGISTRY_V2.json":"562536d9ba3f245a6bd24490a1eb3b30f27e0c3a","canonical/governance/OPUS55_MATCHED_TARGET_NORMALIZATION_CANDIDATE_V2.json":"65978d10375093162f24fa61f5fce6cc1ba4d179","canonical/governance/OPUS55_MATCHED_TARGET_NORMALIZATION_PROVENANCE_V2.json":"c63fa69b3b4c5c677a05319e87fdcc01780e81ec","canonical/runtime/matched_target_normalization_provenance_verifier_v1.py":"9bc7ef820b9a0107dd7672e79f33ab3b77bd9160","canonical/tests/test_matched_target_normalization_provenance_v2.py":"ef9d21fedc467a08890e91d1c221334e65293fc6"}'
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path('capsules/matched_target_normalization_v2')
          expected=json.loads(os.environ['EXPECTED_JSON'])
          for rel,want in sorted(expected.items()):
              data=(root/rel).read_bytes()
              got=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              assert got==want,(rel,got,want)
          print('MATCHED_TARGET_NORMALIZATION_V2_EXACT_6_OF_6_BLOBS_PASS')
          PY
          cd capsules/matched_target_normalization_v2
          PYTHONPATH=. python canonical/tests/test_matched_target_normalization_provenance_v2.py
