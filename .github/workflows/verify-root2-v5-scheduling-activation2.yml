name: Verify Root2 scheduling activation
on:
  pull_request:
    paths:
      - "capsules/root2_v5_sched_activation2/**"
      - "capsules/root2_v6_activation/**"
      - ".github/workflows/verify-root2-v5-scheduling-activation2.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python capsules/root2_v5_sched_activation2/verify.py
      - run: python capsules/root2_v6_activation/verify.py
