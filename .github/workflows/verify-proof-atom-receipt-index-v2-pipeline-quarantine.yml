name: Verify proof atom receipt index v2 pipeline quarantine
on:
  pull_request:
    paths:
      - "capsules/proof_atom_receipt_index_v2_pipeline_quarantine_20261002_v1/**"
      - ".github/workflows/verify-proof-atom-receipt-index-v2-pipeline-quarantine.yml"
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact quarantined Brain receipt-index bytes
        run: python capsules/proof_atom_receipt_index_v2_pipeline_quarantine_20261002_v1/verify.py
