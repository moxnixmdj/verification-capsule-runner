name: Audit Brain compiler on public legacy IFEval
on:
  push:
    branches:
      - "verify/brain-compiler-public-ifeval-frontier-20261004-sol"
  pull_request:
    branches: [main]
    paths:
      - "capsules/brain_compiler_public_ifeval/**"
      - "verify_brain_compiler_public_ifeval_frontier.py"
      - ".github/workflows/verify-brain-compiler-public-ifeval-frontier.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact legacy scorer dependencies
        run: |
          python -m pip install --disable-pip-version-check --quiet \
            "nltk==3.10.3" "emoji==2.16.0" "syllapy==0.7.2" "setuptools==80.9.0" \
            "spacy==3.8.16" \
            "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" \
            "langdetect==1.0.9" "immutabledict==4.3.1" "pandas==2.3.3"
          python - <<'PY'
          import nltk
          for pkg in ("punkt","punkt_tab"):
              try: nltk.download(pkg, quiet=True)
              except Exception: pass
          PY
      - run: python verify_brain_compiler_public_ifeval_frontier.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brain-compiler-public-ifeval-frontier
          path: brain_compiler_public_ifeval_frontier_receipt.json
          if-no-files-found: error
