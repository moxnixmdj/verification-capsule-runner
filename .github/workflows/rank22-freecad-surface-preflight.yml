name: Rank22 exact FreeCAD surface preflight
on:
  pull_request:
    branches: [main]
    paths:
      - 'verification/rank22_surface/**'
      - '.github/workflows/rank22-freecad-surface-preflight.yml'
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: bash verification/rank22_surface/preflight.sh
      - uses: actions/upload-artifact@v4
        with:
          name: rank22-freecad-surface-profile
          path: rank22_freecad_surface_profile.json
