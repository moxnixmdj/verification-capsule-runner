name: Verify Brain Harbor environment transport
on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/runtime/harbor_environment_transport.py'
      - 'canonical/tests/test_harbor_environment_transport.py'
      - '.github/workflows/verify-brain-harbor-environment-transport.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Bind exact Brain blobs
        run: |
          test "$(git hash-object canonical/runtime/harbor_environment_transport.py)" = "3b30f09598854aa5de998b9cea7ead7c21e508c2"
          test "$(git hash-object canonical/tests/test_harbor_environment_transport.py)" = "5654400f1163e0aa8cb0c5eca2ee1c267b44dc85"
      - name: Verify transport unit boundary
        run: PYTHONPATH=. python -m unittest -v canonical.tests.test_harbor_environment_transport
