name: Verify rank19 SATB Stage-B
on:
  pull_request:
    branches: [main]
    paths:
      - 'verification/satb_rank19_stage_b_contract.json'
      - 'verification/satb_rank19_stage_b_source_accounting.json'
      - 'verification/test_satb_rank19_stage_b.py'
      - 'verification/satb_rank19_generic_smoke.py'
      - '.github/workflows/verify-satb-rank19-stage-b.yml'
permissions:
  contents: read
jobs:
  static-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: PYTHONPATH=. python -m unittest -v verification.test_satb_rank19_stage_b

  generic-cpu-feasibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Python 3.12 CPU-only generic mechanisms
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps basic-pitch==0.4.0
          python -m pip install "numpy<2.3" scipy scikit-learn librosa pretty_midi resampy mir_eval typing_extensions onnxruntime music21
      - name: Run synthetic four-voice CPU smoke
        run: python verification/satb_rank19_generic_smoke.py
