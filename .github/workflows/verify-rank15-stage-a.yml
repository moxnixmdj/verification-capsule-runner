name: Verify rank15 Stage A admission
on:
  pull_request:
    branches: [main]
    paths:
      - 'verification/rank15_stage_a/**'
      - '.github/workflows/verify-rank15-stage-a.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run real Stage-A reducer on pinned mirrored Brain evidence
        run: python verification/rank15_stage_a/canonical/runtime/prequalification_stage_a_reducer.py verification/rank15_stage_a
      - name: Run reducer regression tests
        run: |
          cd verification/rank15_stage_a
          python - <<'PY'
          import canonical.runtime.test_prequalification_stage_a_reducer as t
          t.test_all_stage_a_passes()
          t.test_task_specific_search_fails()
          t.test_instruction_exposure_fails_stage_a()
          t.test_missing_mutation_evidence_fails()
          print("4 regression tests passed")
          PY
