name: Verify rank15 Stage A admission
on:
  pull_request:
    branches: [main]
    paths:
      - 'verification/rank15_stage_a_admission.py'
      - 'verification/test_rank15_stage_a_admission.py'
      - '.github/workflows/verify-rank15-stage-a.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: cd verification && python -m unittest -v test_rank15_stage_a_admission.py
