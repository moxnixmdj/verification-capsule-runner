name: Verify canonical proof atom basis v1
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/canonical_proof_atom_basis_v1/**"
      - ".github/workflows/verify-canonical-proof-atom-basis-v1.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact canonical proof atom basis
        run: |
          cd capsules/canonical_proof_atom_basis_v1
          export PYTHONPATH=.
          python -m py_compile canonical/runtime/canonical_proof_atom_basis_v1.py
          python canonical/tests/test_canonical_proof_atom_basis_v1.py
