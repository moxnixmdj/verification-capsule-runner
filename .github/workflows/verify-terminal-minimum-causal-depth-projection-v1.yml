name: verify-terminal-minimum-causal-depth-projection-v1
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python verify_terminal_minimum_causal_depth_projection_v1.py
      - run: python -c "from canonical.tests.test_terminal_minimum_causal_depth_projection_guard_v1 import test_projection_guard; test_projection_guard()"
