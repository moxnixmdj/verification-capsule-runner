name: Chartography official dummy-pack Qwen replay V1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/chartography-official-dummy-qwen-replay-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install prerequisites
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out model
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build curl ca-certificates python3-yaml

      - name: Bind exact public upstream and official dummy pack
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/surge-ai/chartography.git upstream
          cd upstream
          git checkout --detach 3f1bf837232d3918c2cc35c6e2418c9e70d2a57b
          test "$(git rev-parse HEAD)" = "3f1bf837232d3918c2cc35c6e2418c9e70d2a57b"
          git hash-object src/chartography/task.py | tee ../out/upstream-task-blob.txt
          git hash-object src/chartography/dataset.py | tee ../out/upstream-dataset-blob.txt
          git hash-object task_packs/sample_charts/tasks/sample_task_1.yaml | tee ../out/sample1-spec-blob.txt
          git hash-object task_packs/sample_charts/tasks/sample_task_2.yaml | tee ../out/sample2-spec-blob.txt
          test "$(cat ../out/upstream-task-blob.txt)" = "163d910274f06720b601006ef1b6266e7cfd30b6"
          test "$(cat ../out/upstream-dataset-blob.txt)" = "4d1bc311794527a86019f6ed4cf1efbd9bceb9bb"
          test "$(cat ../out/sample1-spec-blob.txt)" = "b74d2fbf789b3a8ea55ce9a9b72204e983489fb0"
          test "$(cat ../out/sample2-spec-blob.txt)" = "fc86b7a9c087d68baf5f7d347437e72117779820"

      - name: Download exact preflight-proved Qwen subject
        shell: bash
        run: |
          set -euo pipefail
          REV="1cd86afb9a95c410a6038ab3b40d8b578c892266"
          BASE="https://huggingface.co/Qwen/Qwen3-VL-4B-Instruct-GGUF/resolve/$REV"
          curl -fL --retry 5 --retry-all-errors "$BASE/Qwen3VL-4B-Instruct-Q4_K_M.gguf?download=true" -o model/model.gguf
          curl -fL --retry 5 --retry-all-errors "$BASE/mmproj-Qwen3VL-4B-Instruct-Q8_0.gguf?download=true" -o model/mmproj.gguf
          echo "66358cb18bb6b3b1b6675aa412c7a88ef01d228f481184d13668e5201c730a0a  model/model.gguf" | sha256sum -c -
          echo "30ba2c7dd3127a4561b6cba9d13d0f711c91bdb38742e2f56d73c8cb596bd06d  model/mmproj.gguf" | sha256sum -c -

      - name: Build exact pinned llama.cpp
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/ggml-org/llama.cpp.git llama.cpp
          cd llama.cpp
          git checkout --detach a7fb71fab83b474a0892b9a05aaa3a8ddca2729b
          test "$(git rev-parse HEAD)" = "a7fb71fab83b474a0892b9a05aaa3a8ddca2729b"
          cmake -S . -B build -G Ninja -DGGML_NATIVE=OFF -DGGML_CUDA=OFF -DGGML_BLAS=OFF -DLLAMA_CURL=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target llama-mtmd-cli -j 2

      - name: Project official samples without golden-answer leakage
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, yaml, hashlib
          root=pathlib.Path("upstream/task_packs/sample_charts")
          manifest=yaml.safe_load((root/"manifest.yaml").read_text())
          rows=[]
          for rel in manifest["tasks"]:
              spec=yaml.safe_load((root/rel).read_text())
              chart=root/spec["chart_path"]
              rows.append({
                  "task_id":str(spec["task_id"]),
                  "prompt":str(spec["prompt"]).strip(),
                  "chart_path":str(chart),
                  "golden_answer_for_grading_only":str(spec["golden_answer"]).strip(),
                  "chart_sha256":hashlib.sha256(chart.read_bytes()).hexdigest(),
              })
          pathlib.Path("out/samples.json").write_text(json.dumps(rows,indent=2))
          print(json.dumps([{k:v for k,v in r.items() if k!="golden_answer_for_grading_only"} for r in rows],indent=2))
          PY

      - name: Run exact subject through official image-plus-prompt contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, subprocess, time, hashlib
          rows=json.loads(pathlib.Path("out/samples.json").read_text())
          od=pathlib.Path("out/inference"); od.mkdir(parents=True,exist_ok=True)
          cli="./llama.cpp/build/bin/llama-mtmd-cli"
          receipts=[]
          for row in rows:
              cmd=[cli,"-m","model/model.gguf","--mmproj","model/mmproj.gguf","--no-mmproj-offload",
                   "--image",row["chart_path"],"-p",row["prompt"],"-n","192","-t","4"]
              # Golden answer is intentionally absent from cmd and prompt.
              assert row["golden_answer_for_grading_only"] not in " ".join(cmd)
              t=time.time()
              p=subprocess.run(cmd,capture_output=True,text=True,timeout=300)
              if p.returncode != 0:
                  raise SystemExit(f"{row['task_id']} nonzero exit {p.returncode}")
              completion=p.stdout.strip()
              if not completion:
                  raise SystemExit(f"{row['task_id']} empty completion")
              (od/f"{row['task_id']}.stdout.txt").write_text(p.stdout)
              (od/f"{row['task_id']}.stderr.txt").write_text(p.stderr)
              receipts.append({
                  "task_id":row["task_id"],
                  "prompt_sha256":hashlib.sha256(row["prompt"].encode()).hexdigest(),
                  "chart_sha256":row["chart_sha256"],
                  "completion_sha256":hashlib.sha256(completion.encode()).hexdigest(),
                  "wall_seconds":round(time.time()-t,3)
              })
          pathlib.Path("out/execution-receipts.json").write_text(json.dumps(receipts,indent=2))
          PY

      - name: Conservative deterministic sample grading
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, re
          rows=json.loads(pathlib.Path("out/samples.json").read_text())
          scored=[]
          for row in rows:
              text=(pathlib.Path("out/inference")/f"{row['task_id']}.stdout.txt").read_text(errors="replace")
              nums=[float(x) for x in re.findall(r"(?<![A-Za-z])[-+]?\d+(?:\.\d+)?",text)]
              gold=row["golden_answer_for_grading_only"]
              m=re.search(r"acceptable range\s+([-+]?\d+(?:\.\d+)?)\s+to\s+([-+]?\d+(?:\.\d+)?)",gold,re.I)
              if not m:
                  passed=False; chosen=None; lo=hi=None
              else:
                  lo,hi=map(float,m.groups())
                  in_range=[x for x in nums if lo<=x<=hi]
                  chosen=in_range[-1] if in_range else (nums[-1] if nums else None)
                  passed=bool(in_range)
              scored.append({"task_id":row["task_id"],"golden_answer":gold,"parsed_number":chosen,
                             "range":[lo,hi] if lo is not None else None,"pass":passed})
          result={
              "schema":"PROJECT_BRAIN_CHARTOGRAPHY_OFFICIAL_DUMMY_QWEN_REPLAY_RESULT_V1",
              "official_upstream_commit":"3f1bf837232d3918c2cc35c6e2418c9e70d2a57b",
              "dummy_sample_count":len(scored),
              "transport_success_count":len(scored),
              "conservative_correct_count":sum(x["pass"] for x in scored),
              "rows":scored,
              "terminal_cases_consumed":0,
              "released_benchmark_cases_consumed":0,
              "incremental_spend_usd":0,
              "adapter_contract_pass":True,
              "hard_nonclaim":"OFFICIAL_DUMMY_PACK_REPLAY_IS_NOT_CHARTOGRAPHY_BENCHMARK_SCORE_OR_GE_89_EVIDENCE"
          }
          pathlib.Path("out/result.json").write_text(json.dumps(result,indent=2))
          print(json.dumps(result,indent=2))
          PY

      - name: Upload official dummy replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chartography-official-dummy-qwen-replay-v1
          path: out/
          if-no-files-found: error
