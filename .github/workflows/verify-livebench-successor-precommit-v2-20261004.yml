name: Verify LiveBench successor precommit V2

on:
  pull_request:
    paths:
      - 'verify_livebench_successor_precommit_v2_20261004.py'
      - 'subject/livebench_successor_precommit_v2_20261004/**'
      - '.github/workflows/verify-livebench-successor-precommit-v2-20261004.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact successor precommit bytes and fail-closed repairs
        run: python verify_livebench_successor_precommit_v2_20261004.py
