name: Verify M0A raw-source diagnostic V2
on:
  push:
    branches:
      - verify/m0a-raw-source-diagnostic-v2-20261002
  pull_request:
    paths:
      - 'canonical/runtime/m0a_raw_source_*'
      - 'canonical/runtime/explicit_compound_requirement_decomposer.py'
      - 'canonical/runtime/source_grounded_coreference.py'
      - 'canonical/tests/test_m0a_raw_source_terminal_suite_v2.py'
      - '.github/workflows/verify-m0a-raw-source-diagnostic-v2.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exact diagnostic tests
        env:
          PROJECT_BRAIN_POST_FREEZE_SEED: '8675309'
        run: python -m unittest -v canonical.tests.test_m0a_raw_source_terminal_suite_v2
