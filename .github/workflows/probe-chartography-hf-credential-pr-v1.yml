name: Chartography HF credential presence PR V1

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/probe-chartography-hf-credential-pr-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
      HUGGING_FACE_HUB_TOKEN: ${{ secrets.HUGGING_FACE_HUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Emit sanitized presence receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import json, os
          names=["HF_TOKEN","HUGGINGFACE_TOKEN","HUGGING_FACE_HUB_TOKEN"]
          presence={name: bool(os.environ.get(name)) for name in names}
          out={
            "schema":"PROJECT_BRAIN_CHARTOGRAPHY_HF_CREDENTIAL_PRESENCE_PR_V1",
            "credential_presence":presence,
            "any_candidate_credential_present":any(presence.values()),
            "network_requests":0,
            "secret_values_emitted":False,
            "incremental_spend_usd":0,
            "terminal_cases_consumed":0,
            "acceptance_credit_delta":0
          }
          open("out/hf-credential-presence.json","w").write(json.dumps(out,indent=2,sort_keys=True)+"\n")
          print(json.dumps(out,sort_keys=True))
          PY
      - name: Probe official Hugging Face git and metadata-byte transport
        shell: bash
        run: |
          set -euo pipefail
          set +e
          git ls-remote https://huggingface.co/datasets/surgeai/chartography >out/ls-remote.txt 2>out/ls-remote.err
          LS_RC=$?
          GIT_LFS_SKIP_SMUDGE=1 git clone --depth 1 https://huggingface.co/datasets/surgeai/chartography hf-chartography >out/clone.txt 2>out/clone.err
          CLONE_RC=$?
          set -e
          echo "git_ls_remote_rc=$LS_RC"
          echo "git_clone_pointer_only_rc=$CLONE_RC"
          if [ "$CLONE_RC" -eq 0 ]; then
            git -C hf-chartography rev-parse HEAD | tee out/hf-head.txt
            set +e
            git -C hf-chartography lfs pull --include="data.parquet" >out/lfs-pull.txt 2>out/lfs-pull.err
            LFS_RC=$?
            set -e
            echo "data_parquet_lfs_pull_rc=$LFS_RC"
            if [ "$LFS_RC" -eq 0 ] && [ -f hf-chartography/data.parquet ]; then
              sha256sum hf-chartography/data.parquet | tee out/data-parquet-sha256.txt
              wc -c hf-chartography/data.parquet | tee out/data-parquet-bytes.txt
            fi
          fi
          python - <<'PY'
          import json, pathlib
          def readint(name,prefix):
              p=pathlib.Path(name)
              if not p.exists(): return None
              for line in p.read_text(errors="replace").splitlines():
                  if line.startswith(prefix):
                      try: return int(line.split("=",1)[1])
                      except: pass
              return None
          # Results are reconstructed from files without exposing dataset contents.
          out={
            "schema":"PROJECT_BRAIN_CHARTOGRAPHY_HF_TRANSPORT_PROBE_PR_V1",
            "hf_head": pathlib.Path("out/hf-head.txt").read_text().strip() if pathlib.Path("out/hf-head.txt").exists() else None,
            "data_parquet_sha256_line": pathlib.Path("out/data-parquet-sha256.txt").read_text().strip() if pathlib.Path("out/data-parquet-sha256.txt").exists() else None,
            "data_parquet_bytes_line": pathlib.Path("out/data-parquet-bytes.txt").read_text().strip() if pathlib.Path("out/data-parquet-bytes.txt").exists() else None,
            "dataset_contents_printed":False,
            "golden_answers_parsed":False,
            "model_calls":0,
            "incremental_spend_usd":0
          }
          pathlib.Path("out/hf-transport-receipt.json").write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
          print(json.dumps(out,sort_keys=True))
          PY

      - name: Probe official Dataset Viewer and first chart byte route
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, pathlib, urllib.parse, urllib.request, urllib.error
          dataset="surgeai/chartography"
          base="https://datasets-server.huggingface.co"
          out={"schema":"PROJECT_BRAIN_CHARTOGRAPHY_DATASET_VIEWER_TRANSPORT_PROBE_V1","dataset":dataset}
          def get(url):
              try:
                  with urllib.request.urlopen(url, timeout=30) as r:
                      return r.status, r.read()
              except urllib.error.HTTPError as e:
                  return e.code, e.read()
              except Exception as e:
                  return -1, type(e).__name__.encode()
          st,b=get(base+"/is-valid?dataset="+urllib.parse.quote(dataset,safe=""))
          out["is_valid_http_status"]=st
          st,b=get(base+"/splits?dataset="+urllib.parse.quote(dataset,safe=""))
          out["splits_http_status"]=st
          if st==200:
              p=json.loads(b); out["splits"]=[{"config":x.get("config"),"split":x.get("split")} for x in p.get("splits",[])]
          st,b=get(base+"/parquet?dataset="+urllib.parse.quote(dataset,safe=""))
          out["parquet_endpoint_http_status"]=st
          parquet_url=None
          if st==200:
              p=json.loads(b)
              files=[x for x in p.get("parquet_files",[]) if x.get("split")=="test"]
              out["parquet_file_count"]=len(files)
              if files:
                  parquet_url=files[0].get("url")
                  out["parquet_url_sha256"]=hashlib.sha256(parquet_url.encode()).hexdigest()
          if parquet_url:
              st,pb=get(parquet_url)
              out["converted_parquet_http_status"]=st
              if st==200:
                  out["converted_parquet_bytes"]=len(pb)
                  out["converted_parquet_sha256"]=hashlib.sha256(pb).hexdigest()
                  pathlib.Path("out/viewer-test.parquet").write_bytes(pb)
          rows_url=base+"/rows?dataset="+urllib.parse.quote(dataset,safe="")+"&config=default&split=test&offset=0&length=1"
          st,b=get(rows_url)
          out["rows_endpoint_http_status"]=st
          if st==200:
              p=json.loads(b)
              rows=p.get("rows",[])
              if rows:
                  row=rows[0].get("row",{})
                  chart_path=str(row.get("chart_path") or "")
                  out["first_chart_path_sha256"]=hashlib.sha256(chart_path.encode()).hexdigest() if chart_path else None
                  out["first_source_type"]=row.get("source_type")
                  if chart_path:
                      raw="https://huggingface.co/datasets/surgeai/chartography/resolve/main/"+urllib.parse.quote(chart_path,safe="/")+"?download=true"
                      st,img=get(raw)
                      out["first_chart_raw_http_status"]=st
                      if st==200:
                          out["first_chart_bytes"]=len(img)
                          out["first_chart_sha256"]=hashlib.sha256(img).hexdigest()
                          pathlib.Path("out/first-chart-probe.bin").write_bytes(img)
          out["golden_answer_used_for_decision"]=False
          out["model_calls"]=0
          out["incremental_spend_usd"]=0
          pathlib.Path("out/dataset-viewer-transport.json").write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
          print(json.dumps(out,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chartography-hf-access-probe-pr-v1
          path: out/
          if-no-files-found: error
