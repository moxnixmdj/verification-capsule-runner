name: Verify structured rule oracle v3
on:
  pull_request:
    branches: [main]
    paths:
      - capsules/structured_rule_oracle_v3/**
      - .github/workflows/verify-structured-rule-oracle-v3.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cd capsules/structured_rule_oracle_v3 && PYTHONPATH=. python -m unittest -v canonical.tests.test_structured_method_normalized_rule_oracle_v3
