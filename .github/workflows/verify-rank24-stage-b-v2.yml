name: Verify rank24 Stage-B contract
on:
  pull_request:
    branches: [main]
    paths:
      - 'verification/rank24_stage_b/**'
      - '.github/workflows/verify-rank24-stage-b-v2.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact frozen Stage-B artifacts
        run: |
          python - <<'PY'
          import json,sys
          from pathlib import Path
          root=Path("verification/rank24_stage_b")
          sys.path.insert(0,str(root))
          from verifier import evaluate
          docs={k:json.loads((root/f"{k}.json").read_text()) for k in ("contract","source","ledger","stage_a","lease")}
          out=evaluate(docs["contract"],docs["source"],docs["ledger"],docs["stage_a"],docs["lease"])
          print(json.dumps(out,indent=2,sort_keys=True))
          assert out["pass"] is True,out
          assert out["stage_c_lease_eligible"] is True,out
          assert out["task_execution_authorized"] is False,out
          assert out["terminal_verifier_authorized"] is False,out
          assert out["fresh_acceptance_cases_consumed"]==0,out
          PY
