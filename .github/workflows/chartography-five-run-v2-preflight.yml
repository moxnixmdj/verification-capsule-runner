name: Chartography five-run V2 preflight

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/chartography-chartverse8b-five-run-heldout-v1.yml"
      - ".github/workflows/chartography-five-run-v2-preflight.yml"
      - "subject/chartography_clean_eval/**"

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Exercise exact no-network Docker isolation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/chartography-docker-smoke
          printf 'print("DOCKER_SANDBOX_OK")\n' > /tmp/chartography-docker-smoke/tool.py
          out="$(docker run --rm --network none --read-only --cap-drop ALL             --security-opt no-new-privileges --pids-limit 64 --memory 256m --cpus 1             --tmpfs /tmp:rw,nosuid,nodev,size=32m             -v /tmp/chartography-docker-smoke:/work:rw -w /work             python:3.12-slim python /work/tool.py)"
          test "$out" = "DOCKER_SANDBOX_OK"
      - name: Static compile and invariant checks
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile subject/chartography_clean_eval/run_epoch.py
          python -m py_compile subject/chartography_clean_eval/chartography_deterministic_lower_bound_scorer_v1.py
          python - <<'PY'
          import pathlib,re
          wf=pathlib.Path(".github/workflows/chartography-chartverse8b-five-run-heldout-v1.yml").read_text()
          py=pathlib.Path("subject/chartography_clean_eval/run_epoch.py").read_text()
          required=[
            "workflow_dispatch:",
            "max-parallel: 20",
            "epoch: [1, 2, 3, 4, 5]",
            "shard: [0, 1, 2, 3]",
            "AUTHORIZED_HF_TOKEN_REQUIRED",
            "actions/cache@v4",
            "llama-server",
            "--jinja",
            "Qwen/Qwen3-VL-8B-Instruct-GGUF",
            "67d1659bfe71b89d50b45a4ad1a9e5b997e5bb16ce5da66a6a6167abd569e9e2",
            "--image-min-tokens 1024",
            "/v1/chat/completions",
            "docker",
            "DOCKER_NETWORK_NONE_READ_ONLY_CAP_DROP_ALL_NO_NEW_PRIVILEGES",
            "EXPECTED_20_SHARDS",
            "NON_100_TASK_EPOCH_AFTER_SHARD_REDUCTION",
            "five_run_mean_lower_bound_percent",
            "ge_89",
          ]
          missing=[x for x in required if x not in wf]
          if missing: raise SystemExit(f"MISSING_WORKFLOW_INVARIANTS {missing}")
          py_required=[
            '"--shard-index"',
            '"--shard-count"',
            '"--server-url"',
            '"image_url"',
            '"max_tokens": 1024',
            '"tools": TOOLS',
            '"tool_choice": "required" if require_tool else "auto"',
            '"parallel_tool_calls": False',
            'def _native_tool_action',
            'def _call_native_model',
            'def _image_part',
            '"role": "tool"',
            '"tool_call_id"',
            '"tool_calls": tool_calls',
            '"python"',
            '"crop"',
            '"docker"',
            '"--network", "none"',
            '"--read-only"',
            '"--cap-drop", "ALL"',
            '"no-new-privileges"',
            "gold_loaded_after_response_seal",
            "gold_present_in_generation_projection",
          ]
          missing=[x for x in py_required if x not in py]
          if missing: raise SystemExit(f"MISSING_RUNTIME_INVARIANTS {missing}")
          if "golden_answer" in py.split("# SCORING PHASE:")[0]:
              raise SystemExit("GOLD_REFERENCE_BEFORE_SCORING_PHASE")
          print("PASS_CHARTOGRAPHY_FIVE_RUN_V2_PREFLIGHT")
          PY
      - name: Verify sound scorer boundary examples
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=subject/chartography_clean_eval python - <<'PY'
          from chartography_deterministic_lower_bound_scorer_v1 import score_lower_bound
          assert score_lower_bound("350C (acceptable range 330C to 370C)", "350C").score == 1
          assert score_lower_bound("350C (acceptable range 330C to 370C)", "400C").score == 0
          assert score_lower_bound("$4.2M", "4.2 million").score == 1
          assert score_lower_bound("31 percentage points", "31 pp").score == 1
          assert score_lower_bound("12", "13").score == 0
          print("PASS_SOUND_SCORER_BOUNDARIES")
          PY
