name: Verify LiveBench Character Trigram Constructor
on:
  pull_request:
    branches:
      - main
    paths:
      - verify_livebench_character_trigram_constructor.py
      - .github/workflows/verify-livebench-character-trigram-constructor.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify pinned scorer theorem and public rows
        run: python verify_livebench_character_trigram_constructor.py
      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livebench-character-trigram-constructor-receipt
          path: livebench_character_trigram_constructor_receipt.json
          if-no-files-found: error
