name: Verify route evidence freshness guard
on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/runtime/terminal_route_evidence_freshness.py'
      - 'canonical/runtime/terminal_route_closure_controller.py'
      - 'canonical/tests/test_terminal_route_closure_controller.py'
      - 'canonical/runtime/delegation_whole_scope_candidate_v2.py'
      - 'canonical/verification/DELEGATION_TERMINAL_POPULATION_BINDING_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json'
      - '.github/workflows/verify-route-evidence-freshness.yml'
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Compile and run freshness regressions
        run: |
          python3 -m py_compile canonical/runtime/terminal_route_evidence_freshness.py canonical/runtime/terminal_route_closure_controller.py
          PYTHONPATH=. python3 -m unittest -v canonical.tests.test_terminal_route_closure_controller
      - name: Detect actual delegation stale receipt
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from canonical.runtime.terminal_route_evidence_freshness import evaluate_row_evidence_freshness
          row={"behavior_id":"TASK_TO_DELEGATION_GRAPH_001","candidate":"canonical/runtime/delegation_whole_scope_candidate_v2.py","population_binding_verification":"canonical/verification/DELEGATION_TERMINAL_POPULATION_BINDING_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json"}
          out=evaluate_row_evidence_freshness(Path('.'),row)
          assert out["stale"], out
          assert any(x["artifact_path"]=="canonical/runtime/delegation_whole_scope_candidate_v2.py" and x["expected_blob_sha"]=="9f2c3aa42352cba66967afb1f8a3f45357833c41" and x["current_blob_sha"]=="f1a93ee66d90093de61dc17c6ebf2e24073df522" for x in out["mismatches"]), out
          print(json.dumps({"status":"ACTUAL_DELEGATION_STALE_EVIDENCE_DETECTED","mismatches":out["mismatches"]},sort_keys=True))
          PY
