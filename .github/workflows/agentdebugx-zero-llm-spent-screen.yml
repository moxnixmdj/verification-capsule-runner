name: AgentDebugX Zero-LLM Spent Screen

on:
  push:
    paths:
      - ".github/workflows/agentdebugx-zero-llm-spent-screen.yml"
      - "agentdebugx_zero_llm_spent/**"

permissions:
  contents: write

jobs:
  screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Execute pinned zero-LLM diagnostic screen
        id: screen
        shell: bash
        run: |
          set +e
          {
            python -m pip install --upgrade pip
            python -m pip install "agentdebugx==0.5.2"
            python -m pip show agentdebugx
            python agentdebugx_zero_llm_spent/probe.py
            cat agentdebugx_zero_llm_spent/result.json
          } > agentdebugx_zero_llm_spent/run.log 2>&1
          rc=$?
          cat agentdebugx_zero_llm_spent/run.log
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentdebugx-zero-llm-spent-screen
          path: |
            agentdebugx_zero_llm_spent/cases.json
            agentdebugx_zero_llm_spent/probe.py
            agentdebugx_zero_llm_spent/result.json
            agentdebugx_zero_llm_spent/run.log
          if-no-files-found: warn
      - name: Persist terminal screen result
        if: always()
        shell: bash
        env:
          SCREEN_OUTCOME: ${{ steps.screen.outcome }}
          SCREEN_RC: ${{ steps.screen.outputs.rc }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path("agentdebugx_zero_llm_spent")
          result_exists=(p/"result.json").exists()
          status={
            "schema":"PROJECT_BRAIN_VISIBLE_EXECUTION_STATUS_V1",
            "probe":"AGENTDEBUGX_ZERO_LLM_SPENT_SCREEN",
            "workflow_run_id":os.environ["GITHUB_RUN_ID"],
            "head_sha":os.environ["GITHUB_SHA"],
            "screen_outcome":os.environ.get("SCREEN_OUTCOME"),
            "screen_rc":os.environ.get("SCREEN_RC"),
            "result_exists":result_exists,
            "terminal_state":"SUCCESS" if os.environ.get("SCREEN_OUTCOME")=="success" and result_exists else "FAILURE",
            "capability_credit_delta":0
          }
          (p/"status.json").write_text(json.dumps(status,indent=2)+"\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agentdebugx_zero_llm_spent/status.json agentdebugx_zero_llm_spent/run.log
          test ! -f agentdebugx_zero_llm_spent/result.json || git add agentdebugx_zero_llm_spent/result.json
          git commit -m "Record AgentDebugX zero-LLM spent screen"
          git pull --rebase origin main
          git push
