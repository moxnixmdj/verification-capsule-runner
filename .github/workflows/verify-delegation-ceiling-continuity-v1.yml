name: Verify delegation ceiling continuity v1
on:
  pull_request:
    branches: [main]
    paths:
      - 'capsules/delegation_ceiling_continuity_v1/**'
      - '.github/workflows/verify-delegation-ceiling-continuity-v1.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run fail-closed lifter regression and live continuity tests
        run: |
          set -euo pipefail
          cd capsules/delegation_ceiling_continuity_v1
          PYTHONPATH=. python -m unittest -v \
            canonical.tests.test_terminal_ceiling_witness_lifter_v1 \
            canonical.tests.test_delegation_terminal_ceiling_continuity_v1
      - name: Emit independent delegation candidate marker
        run: |
          set -euo pipefail
          cd capsules/delegation_ceiling_continuity_v1
          PYTHONPATH=. python - <<'PY'
          import hashlib, json
          from pathlib import Path
          from canonical.runtime.terminal_ceiling_witness_lifter_v1 import evaluate
          root=Path('.')
          def load(p): return json.loads((root/p).read_text())
          def blob(p):
              d=(root/p).read_bytes()
              return hashlib.sha1(b'blob '+str(len(d)).encode()+b'\0'+d).hexdigest()
          spec=load('canonical/governance/DELEGATION_TERMINAL_CEILING_CONTINUITY_INPUT_V1.json')
          bp=spec['binding_path']
          current=blob(bp)
          assert current==spec['current_binding_blob_sha']==spec['terminal_snapshot']['binding_blob_sha']
          terminal=load(spec['terminal_result'])
          out=evaluate(
              family=spec['family'],
              behavior_id=spec['behavior_id'],
              binding_path=bp,
              protocols=load('canonical/governance/OPUS55_TERMINAL_PROOF_PROTOCOLS_V1.json'),
              registry=load('canonical/governance/BEHAVIORAL_CONTRACT_REGISTRY_V1.json'),
              binding=load(bp),
              executor_manifest=load('canonical/governance/TERMINAL_ROUTE_SPECIFIC_EXECUTOR_MANIFEST_V1.json'),
              terminal_result=terminal,
              binding_blob_sha=current,
              terminal_snapshot_binding_blob_sha=spec['terminal_snapshot']['binding_blob_sha'],
              binding_verification=load(spec['current_binding_verification']),
          )
          assert out['pass'] is True, out
          w=out['candidate_witness']
          assert w['family']=='SUBAGENT_DELEGATION_AND_COORDINATION'
          assert w['source_case_count']==132
          assert w['result']=={'direction':'higher','brain_lower_bound':1.0,'theoretical_upper_bound':1.0}
          assert w['verified'] is False and w['independent'] is False
          assert out['promotion_authority'] is False
          print('DELEGATION_TERMINAL_CEILING_CONTINUITY_CANDIDATE_PASS')
          PY
