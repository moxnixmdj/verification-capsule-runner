name: Probe Smaug Mini Q4 zero-cost feasibility

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/probe-smaug-mini-q4-zero-cost-feasibility.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Record runner capacity
        run: |
          set -euo pipefail
          uname -a
          free -h
          df -h /
          nproc
          {
            echo "utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "mem_total_kb=$(awk '/MemTotal/ {print $2}' /proc/meminfo)"
            echo "mem_available_kb=$(awk '/MemAvailable/ {print $2}' /proc/meminfo)"
            echo "disk_available_bytes=$(df -B1 --output=avail / | tail -1 | tr -d ' ')"
            echo "cpu_count=$(nproc)"
          } | tee RUNNER_CAPACITY.txt

      - name: Build exact pinned llama.cpp
        run: |
          set -euo pipefail
          LLAMA_COMMIT=bec4772f6a2527d371557b5d2032641e5ff7619c
          git init llama.cpp
          git -C llama.cpp remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C llama.cpp fetch --depth 1 origin "$LLAMA_COMMIT"
          git -C llama.cpp checkout --detach FETCH_HEAD
          test "$(git -C llama.cpp rev-parse HEAD)" = "$LLAMA_COMMIT"
          cmake -S llama.cpp -B llama.cpp/build -DGGML_CUDA=OFF -DLLAMA_CURL=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build llama.cpp/build -j 2 --target llama-cli
          echo "$LLAMA_COMMIT" > LLAMA_COMMIT.txt

      - name: Resolve and materialize exact Smaug Mini Q4 subject
        run: |
          set -euo pipefail
          REPO='https://huggingface.co/prithivMLmods/Smaug-Mini-GGUF'
          REV="$(git ls-remote "$REPO" HEAD | awk '{print $1}')"
          test -n "$REV"
          echo "$REV" | tee SMAUG_GGUF_REVISION.txt
          FILE='Smaug-Mini.Q4_K_M.gguf'
          URL="$REPO/resolve/$REV/$FILE?download=true"
          mkdir -p models
          START="$(date +%s)"
          curl -L --fail --retry 3 --retry-delay 3 --silent --show-error             -o "models/$FILE" "$URL"
          END="$(date +%s)"
          BYTES="$(stat -c '%s' "models/$FILE")"
          SHA="$(sha256sum "models/$FILE" | awk '{print $1}')"
          {
            echo "repo=prithivMLmods/Smaug-Mini-GGUF"
            echo "revision=$REV"
            echo "file=$FILE"
            echo "bytes=$BYTES"
            echo "sha256=$SHA"
            echo "download_seconds=$((END-START))"
          } | tee SMAUG_Q4_SUBJECT.txt
          test "$BYTES" -gt 16000000000
          test "$BYTES" -lt 18000000000
          df -h /

      - name: Probe exact local one-token inference under hard wall-clock bound
        run: |
          set -euo pipefail
          FILE='models/Smaug-Mini.Q4_K_M.gguf'
          /usr/bin/time -v -o SMAUG_Q4_TIME.txt             timeout 1200             llama.cpp/build/bin/llama-cli               -m "$FILE"               -p 'Reply with exactly the single token OK.'               -n 1               -c 256               -t 4               --no-display-prompt               --no-warmup               > SMAUG_Q4_STDOUT.txt 2> SMAUG_Q4_STDERR.txt
          RC=$?
          echo "$RC" | tee SMAUG_Q4_RETURN_CODE.txt
          test "$RC" = 0
          test -s SMAUG_Q4_STDOUT.txt
          tail -c 4000 SMAUG_Q4_STDOUT.txt
          cat SMAUG_Q4_TIME.txt
          free -h
          df -h /

      - name: Emit machine-readable feasibility receipt
        if: success()
        run: |
          set -euo pipefail
          python - <<'PY' | tee SMAUG_Q4_FEASIBILITY_RESULT.json
          import json, pathlib, re
          subject={}
          for line in pathlib.Path("SMAUG_Q4_SUBJECT.txt").read_text().splitlines():
              if "=" in line:
                  k,v=line.split("=",1); subject[k]=v
          cap={}
          for line in pathlib.Path("RUNNER_CAPACITY.txt").read_text().splitlines():
              if "=" in line:
                  k,v=line.split("=",1); cap[k]=v
          timing=pathlib.Path("SMAUG_Q4_TIME.txt").read_text()
          def take(label):
              m=re.search(r"^\s*"+re.escape(label)+r":\s*(.+)$",timing,re.M)
              return m.group(1).strip() if m else None
          out={
              "schema":"PROJECT_BRAIN_SMAUG_MINI_Q4_ZERO_COST_FEASIBILITY_PROBE_V1",
              "status":"PASS__EXACT_Q4_MATERIALIZED_AND_LOCAL_INFERENCE_COMPLETED",
              "subject":{
                  "repository":subject.get("repo"),
                  "revision":subject.get("revision"),
                  "file":subject.get("file"),
                  "bytes":int(subject["bytes"]),
                  "sha256":subject.get("sha256"),
              },
              "runner":{
                  "surface":"GITHUB_ACTIONS_UBUNTU_24_04_PUBLIC_RUNNER",
                  "mem_total_kb":int(cap["mem_total_kb"]),
                  "disk_available_bytes_before":int(cap["disk_available_bytes"]),
                  "cpu_count":int(cap["cpu_count"]),
              },
              "inference":{
                  "max_resident_set_kbytes":take("Maximum resident set size (kbytes)"),
                  "elapsed_wall_clock":take("Elapsed (wall clock) time (h:mm:ss or m:ss)"),
                  "exit_status":take("Exit status"),
                  "stdout_tail":pathlib.Path("SMAUG_Q4_STDOUT.txt").read_text(errors="replace")[-500:],
              },
              "llama_cpp_commit":pathlib.Path("LLAMA_COMMIT.txt").read_text().strip(),
              "terminal_case_exposure":0,
              "incremental_spend_usd":0,
              "capability_credit":False,
              "hard_nonclaim":"ONE_TOKEN_FEASIBILITY_DOES_NOT_PROVE_LIVEBENCH_SCORE_OR_QUANTIZATION_QUALITY",
          }
          print(json.dumps(out,sort_keys=True))
          PY

      - name: Preserve probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smaug-mini-q4-zero-cost-feasibility
          path: |
            RUNNER_CAPACITY.txt
            LLAMA_COMMIT.txt
            SMAUG_GGUF_REVISION.txt
            SMAUG_Q4_SUBJECT.txt
            SMAUG_Q4_RETURN_CODE.txt
            SMAUG_Q4_STDOUT.txt
            SMAUG_Q4_STDERR.txt
            SMAUG_Q4_TIME.txt
            SMAUG_Q4_FEASIBILITY_RESULT.json
          if-no-files-found: warn
