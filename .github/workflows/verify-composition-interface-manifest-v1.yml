name: Verify composition interface manifest v1

on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/composition_interface_manifest_v1/**"
      - ".github/workflows/verify-composition-interface-manifest-v1.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify literal frozen composition interface extraction
        run: |
          cd capsules/composition_interface_manifest_v1
          export PYTHONPATH=.
          python -m py_compile canonical/runtime/composition_interface_manifest_compiler_v1.py
          python canonical/tests/test_composition_interface_manifest_compiler_v1.py
          python canonical/tests/test_frozen_composition_component_interface_manifest_v1.py
