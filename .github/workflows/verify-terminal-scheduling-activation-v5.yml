name: Verify terminal scheduling activation v5
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/terminal_scheduling_activation_v5/**"
      - ".github/workflows/verify-terminal-scheduling-activation-v5.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact joint scheduling activation
        run: |
          cd capsules/terminal_scheduling_activation_v5
          export PYTHONPATH=.
          python canonical/tests/test_terminal_scheduling_activation_v5.py
