name: Verify TB4 threshold-cut residual V7
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/verify-tb4-threshold-residual-v7.yml'
      - 'candidate/tb4_v7/**'
permissions:
  contents: read
  pull-requests: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Recompute exact residual with threshold cut
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util, json, pathlib
          base=pathlib.Path('candidate/tb4_v6')
          spec=importlib.util.spec_from_file_location('residual',base/'runtime.py')
          mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
          load=lambda p: json.loads(pathlib.Path(p).read_text())
          out=mod.evaluate(
              load(base/'registry.json'),
              load(base/'evidence.json'),
              load(base/'comparator.json'),
              load('candidate/tb4_v7/readiness.json'),
          )
          print(json.dumps(out,indent=2,sort_keys=True))
          assert out['receipt_saturation_complete'] is True, out
          assert out['predicate_count']==38, out
          assert out['proved_predicate_count']==7, out
          assert out['open_predicate_count']==1, out
          assert out['blocked_predicate_count']==30, out
          tb=[x for x in out['predicates'] if x['predicate_id']=='CODING_TB4_GE_66_4']
          assert len(tb)==1 and tb[0]['state']=='OPEN', tb
          aa=[x for x in out.get('authorized_actions',[]) if x.get('predicate_id')=='CODING_TB4_GE_66_4']
          assert len(aa)==1, out.get('authorized_actions')
          assert out['terminal_promotion_allowed'] is False, out
          summary={
            'schema':'PROJECT_BRAIN_TB4_THRESHOLD_CUT_RESIDUAL_V7_PUBLIC_VERIFICATION',
            'proved':out['proved_predicate_count'],
            'open':out['open_predicate_count'],
            'blocked':out['blocked_predicate_count'],
            'tb4_state':tb[0]['state'],
            'tb4_authorized_action':aa[0],
            'terminal_promotion_allowed':out['terminal_promotion_allowed'],
            'fresh_acceptance_cases_consumed':0,
            'incremental_spend_usd':0,
            'capability_credit_delta':0,
            'family_credit_delta':0,
          }
          pathlib.Path('/tmp/result.json').write_text(json.dumps(summary,sort_keys=True))
          pathlib.Path('/tmp/comment.md').write_text('TB4_THRESHOLD_RESIDUAL_V7\n\n```json\n'+json.dumps(summary,sort_keys=True)+'\n```\n')
          PY
          gh pr comment "$PR_NUMBER" --repo moxnixmdj/verification-capsule-runner --body-file /tmp/comment.md
