name: Verify current Brain 12-contract prequalification reducer

on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/runtime/terminal_prequalification_reducer.py'
      - 'verification/test_current_brain_terminal_prequalification_reducer.py'
      - '.github/workflows/verify-current-brain-terminal-prequalification-12.yml'
  push:
    branches: [main]
    paths:
      - 'canonical/runtime/terminal_prequalification_reducer.py'
      - 'verification/test_current_brain_terminal_prequalification_reducer.py'
      - '.github/workflows/verify-current-brain-terminal-prequalification-12.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Bind exact Brain blobs
        run: |
          test "$(git hash-object canonical/runtime/terminal_prequalification_reducer.py)" = "630895084ea958a9097e6f9f8f9cfa593c793110"
          test "$(git hash-object verification/test_current_brain_terminal_prequalification_reducer.py)" = "71d6eb5d8c320f23b22c2fa1e84a1d0e56b010d5"
      - name: Run exact Brain reducer tests
        run: PYTHONPATH=. python verification/test_current_brain_terminal_prequalification_reducer.py
