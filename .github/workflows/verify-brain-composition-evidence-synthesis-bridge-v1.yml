name: Verify Brain Composition Evidence Synthesis bridge V1
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/composition_evidence_synthesis_bridge_v1/**"
      - ".github/workflows/verify-brain-composition-evidence-synthesis-bridge-v1.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact Brain blob identities
        run: |
          cd capsules/composition_evidence_synthesis_bridge_v1
          python - <<'PY'
          import hashlib, json, pathlib
          m=json.load(open("EXPECTED_BRAIN_BLOBS.json",encoding="utf-8"))
          for src,expected in m["exact_brain_blobs"].items():
              raw=pathlib.Path(src).read_bytes()
              got=hashlib.sha1(f"blob {len(raw)}\0".encode()+raw).hexdigest()
              assert got==expected,(src,got,expected)
          print("exact Brain blobs PASS",len(m["exact_brain_blobs"]))
          PY
      - name: Run Brain bridge test
        run: |
          cd capsules/composition_evidence_synthesis_bridge_v1
          python canonical/tests/test_composition_evidence_synthesis_scope_complete_bridge_v1.py
      - name: Independent semantic assertions
        run: |
          cd capsules/composition_evidence_synthesis_bridge_v1
          python - <<'PY'
          import json
          def load(p): return json.load(open(p,encoding="utf-8"))
          b=load("canonical/governance/COMPOSITION_EVIDENCE_SYNTHESIS_SCOPE_COMPLETE_BRIDGE_V1.json")
          p=load("canonical/governance/OPUS55_TERMINAL_PROOF_PROTOCOLS_V1.json")
          m=load("canonical/governance/FROZEN_COMPOSITION_COMPONENT_INTERFACE_MANIFEST_V1.json")
          r=load("canonical/governance/BEHAVIORAL_CONTRACT_REGISTRY_V1.json")
          s=load("canonical/governance/SYNTHESIS_SCOPE_CERTIFICATE_V1.json")
          v=load("canonical/verification/SYNTHESIS_LOSSLESS_SCOPE_DECOMPOSITION_PUBLIC_RUNNER_VERIFICATION_20261004_V1.json")
          comp=next(x for x in p["protocols"] if x["family"]=="MULTI_CAPABILITY_COMPOSITION")
          syn=next(x for x in p["protocols"] if x["family"]=="COMMUNICATION_AND_SYNTHESIS")
          assert comp["task_dimensions"].count("delegation+evidence synthesis+artifact production")==1
          rows=[x for x in m["interfaces"] if x["component_id"]=="evidence synthesis"]
          assert len(rows)==1 and rows[0]["interface_id"]=="delegation+evidence synthesis+artifact production"
          assert r["family_to_residual_contracts"]["COMMUNICATION_AND_SYNTHESIS"]==["EVIDENCE_TO_AUDIENCE_SYNTHESIS_001"]
          assert s["verified"] is True and s["independent"] is True
          assert s["coverage_complete"] is True and s["coverage_relation"]=="EXACT_UNION"
          assert s["scope_relation"]=="PROVEN_STRONGER" and s["coverage_proof_verified"] is True
          assert s["witness_scope_id"]=="scope://brain/EVIDENCE_TO_AUDIENCE_SYNTHESIS_001/T1_T3_TERMINAL"
          assert v["verified"]["exact_dimension_set"] is True and v["verified"]["exact_contract_fragment_witnesses"] is True
          assert v["verified"]["root3_scope_relation_closed"] is True
          assert v["verified"]["acceptance_closed"] is False
          assert len(syn["task_dimensions"])==6 and len(s["children"])==6
          receipt=b["candidate_receipt"]
          assert receipt["component_id"]=="evidence synthesis"
          assert receipt["proved_properties"]==["SCOPED_ACCEPTANCE_PROOF"]
          assert b["expected_effect_after_independent_verification"]["projected_scoped_proved_components_after"]==5
          assert b["expected_effect_after_independent_verification"]["projected_open_components_after"]==7
          assert b["expected_effect_after_independent_verification"]["strict_opus55_acceptance_delta"]==0
          assert b["acceptance_credit_delta"]==0 and b["family_credit_delta"]==0 and b["capability_credit_delta"]==0
          assert b["execution_authority"] is False and b["promotion_authority"] is False and b["fresh_reality_authority"] is False
          print("composition evidence synthesis bridge independent assertions PASS")
          PY
