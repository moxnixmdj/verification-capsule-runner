name: Verify Brain Root2 V3 effective scheduling
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/root2_v3_effective_scheduling/**"
      - ".github/workflows/verify-brain-root2-v3-effective-scheduling.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact V3 scheduling-only transformation
        run: python capsules/root2_v3_effective_scheduling/verify_effective.py
