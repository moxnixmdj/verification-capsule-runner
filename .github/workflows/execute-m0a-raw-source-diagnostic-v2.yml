name: Execute M0A raw-source semantic diagnostic V2

on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/runtime/m0a_raw_source_terminal_suite_v2.py'
      - 'canonical/runtime/m0a_raw_source_brain_candidate_v2.py'
      - 'canonical/tests/test_m0a_raw_source_terminal_suite_v2.py'
      - 'canonical/runtime/bounded_predicate_argument_semantics.py'
      - 'canonical/runtime/explicit_compound_requirement_decomposer.py'
      - 'canonical/runtime/source_grounded_coreference.py'
      - '.github/workflows/execute-m0a-raw-source-diagnostic-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Bind exact Brain candidate and evaluator blobs
        run: |
          test "$(git hash-object canonical/runtime/m0a_raw_source_terminal_suite_v2.py)" = "63b5daacfa5623c38228d41f6a84e548890d252d"
          test "$(git hash-object canonical/runtime/m0a_raw_source_brain_candidate_v2.py)" = "0aac96d27068bdad379703c1b0b8a7a32cacb2e2"
          test "$(git hash-object canonical/tests/test_m0a_raw_source_terminal_suite_v2.py)" = "6c4db6c0baa12d067cd277858fd9534cd794f871"
          test "$(git hash-object canonical/runtime/bounded_predicate_argument_semantics.py)" = "8303231779d6fe8c7fb740e3bbaa492914d4eba9"
          test "$(git hash-object canonical/runtime/explicit_compound_requirement_decomposer.py)" = "06da82ccd7cf5ba37b78d1d664b5638caa4e1956"
          test "$(git hash-object canonical/runtime/source_grounded_coreference.py)" = "3734d79c4d4db5fa78798d8421130090d15fe358"
          test "$(git hash-object canonical/runtime/requirement_acceptance_compiler.py)" = "c306ac6191e2d6f6d84445d7a698eeec8676a0ef"
          test "$(git hash-object canonical/runtime/independent_acceptance_model.py)" = "710298c5d7154b5a3c2a4a1700420c40cb2fa55a"
      - name: Execute clean post-freeze diagnostic
        env:
          PROJECT_BRAIN_POST_FREEZE_SEED: ${{ github.run_id }}
        run: python -m unittest -v canonical.tests.test_m0a_raw_source_terminal_suite_v2
