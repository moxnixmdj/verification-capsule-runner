name: Verify LiveBench direct authority rebind V2
on:
  pull_request:
    paths:
      - 'subject/livebench_direct_rebind_v2/**'
      - 'verify_livebench_direct_authority_rebind_v2.py'
      - '.github/workflows/verify-livebench-direct-authority-rebind-v2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python verify_livebench_direct_authority_rebind_v2.py
