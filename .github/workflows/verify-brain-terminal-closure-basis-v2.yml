name: Verify Brain terminal closure basis v2

on:
  pull_request:
    paths:
      - 'capsules/terminal_closure_basis_v2/**'
      - '.github/workflows/verify-brain-terminal-closure-basis-v2.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact mirrored Brain blob identities
        env:
          EXPECTED_JSON: '{"capsules/terminal_closure_basis_v2/canonical/runtime/terminal_action_coverage_guard_v1.py":"554ab5b928a5f6cf050e43969dae549d887b0845","capsules/terminal_closure_basis_v2/canonical/tests/test_terminal_action_coverage_guard_v1.py":"5de587228da4f022ae20ad55b35ad5c59382139c","capsules/terminal_closure_basis_v2/canonical/governance/TERMINAL_ACTION_COVERAGE_GUARD_V1.json":"d0d74cb6d79ac29b5482733cc0e4256ce7a725a8","capsules/terminal_closure_basis_v2/canonical/runtime/reopened_objective_route_compiler_v1.py":"b33c1adf50093ace19a74f88fec980ef0d66b714","capsules/terminal_closure_basis_v2/canonical/tests/test_reopened_objective_route_compiler_v1.py":"503e82f6630986187f948a48823ff080abc8e8a7","capsules/terminal_closure_basis_v2/canonical/governance/REOPENED_OBJECTIVE_ROUTE_COMPILER_V1.json":"4cac8638d7be5e4f9cc1d26ab7dbd7c33c24253d","capsules/terminal_closure_basis_v2/canonical/governance/OPUS55_REOPENED_OBJECTIVE_ROUTE_RESIDUAL_V1.json":"88fcea48cbf165ad93460cc956f08bb958f2babd","capsules/terminal_closure_basis_v2/canonical/governance/OPUS55_ACCEPTANCE_ACTION_HYPERGRAPH_V1.json":"168f6274a9ce4a6457482817f4ba4a6af01031de","capsules/terminal_closure_basis_v2/canonical/governance/OPUS55_ACCEPTANCE_PREDICATE_EVIDENCE_BINDINGS_V2.json":"f26d250f86e7f2ce18d790e451fe09bbacecb694","capsules/terminal_closure_basis_v2/canonical/governance/OPUS55_ACCEPTANCE_PREDICATE_REGISTRY_V2.json":"562536d9ba3f245a6bd24490a1eb3b30f27e0c3a","capsules/terminal_closure_basis_v2/canonical/verification/CURRENT_OBJECTIVE_BINDINGS_PUBLIC_RUNNER_VERIFICATION_20261002_V2.json":"3aa8168fc7f81581eea4085504e4a70205949af9","capsules/terminal_closure_basis_v2/canonical/runtime/action_hypergraph_open_predicate_guard_v1.py":"449ce8e0beaed333ff616cd110c103a680031a6e"}'
        run: |
          python - <<'PY'
          import json, os, subprocess
          expected=json.loads(os.environ["EXPECTED_JSON"])
          bad=[]
          for path,want in expected.items():
              got=subprocess.check_output(["git","hash-object",path],text=True).strip()
              if got!=want:
                  bad.append(f"{path}: {got} != {want}")
          if bad:
              raise SystemExit("\n".join(bad))
          print(f"EXACT_BLOB_IDENTITY_PASS {len(expected)}/{len(expected)}")
          PY
      - name: Run new compiler unit tests
        env:
          PYTHONPATH: capsules/terminal_closure_basis_v2
        run: |
          python -m unittest -v canonical.tests.test_terminal_action_coverage_guard_v1 canonical.tests.test_reopened_objective_route_compiler_v1
      - name: Verify complete and non-stale action frontier
        env:
          PYTHONPATH: capsules/terminal_closure_basis_v2
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from canonical.runtime.terminal_action_coverage_guard_v1 import evaluate as coverage
          from canonical.runtime.action_hypergraph_open_predicate_guard_v1 import evaluate as open_only
          root=Path("capsules/terminal_closure_basis_v2")
          load=lambda p: json.loads((root/p).read_text())
          registry=load(Path("canonical/governance/OPUS55_ACCEPTANCE_PREDICATE_REGISTRY_V2.json"))
          evidence=load(Path("canonical/governance/OPUS55_ACCEPTANCE_PREDICATE_EVIDENCE_BINDINGS_V2.json"))
          actions=load(Path("canonical/governance/OPUS55_ACCEPTANCE_ACTION_HYPERGRAPH_V1.json"))
          a=coverage(registry,evidence,actions)
          b=open_only(registry,evidence,actions)
          print(json.dumps({"coverage":a,"open_only":b},indent=2,sort_keys=True))
          assert a["pass"], a
          assert b["pass"], b
          assert a["unresolved_predicate_count"]==evidence["saturation"]["unresolved_predicate_count"], a
          assert a["represented_unresolved_predicate_count"]==a["unresolved_predicate_count"], a
          assert a["uncovered_unresolved_predicates"]==[], a
          assert b["terminal_targets"]==[], b
          PY
      - name: Verify reopened comparator frontier
        env:
          PYTHONPATH: capsules/terminal_closure_basis_v2
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from canonical.runtime.reopened_objective_route_compiler_v1 import evaluate
          root=Path("capsules/terminal_closure_basis_v2")
          load=lambda p: json.loads((root/p).read_text())
          evidence=load(Path("canonical/governance/OPUS55_ACCEPTANCE_PREDICATE_EVIDENCE_BINDINGS_V2.json"))
          out=evaluate(
            load(Path("canonical/governance/OPUS55_ACCEPTANCE_PREDICATE_REGISTRY_V2.json")),
            load(Path("canonical/governance/OPUS55_REOPENED_OBJECTIVE_ROUTE_RESIDUAL_V1.json")),
            load(Path("canonical/verification/CURRENT_OBJECTIVE_BINDINGS_PUBLIC_RUNNER_VERIFICATION_20261002_V2.json")),
            evidence,
          )
          print(json.dumps(out,indent=2,sort_keys=True))
          assert out["status"]=="PASS", out
          assert out["candidate_predicates"]==[
            "DELEGATION_TERMINAL_SUCCESS_NONINFERIOR",
            "RECOVERY_CAUSAL_LOCALIZATION_NONINFERIOR",
          ], out
          assert out["full_protocol_replacement_candidate_count"]==2, out
          assert "TOOL_LEARNING_SUCCESS_ROUTE_NONINFERIOR" in out["already_proved_matched_predicates"], out
          assert out["promotion_authority"] is False
          assert out["execution_authority"] is False
          PY
      - name: Preserve TB4 fail-closed state
        run: |
          python - <<'PY'
          import json
          p="capsules/terminal_closure_basis_v2/canonical/governance/OPUS55_ACCEPTANCE_ACTION_HYPERGRAPH_V1.json"
          h=json.load(open(p,encoding="utf-8"))
          cut=h["attainability_cut"]
          assert cut["reality_execution_authorized"] is False
          assert cut["maximum_attainable_successes"]==180
          assert cut["required_successes"]==220
          print("TB4_REVOCATION_PRESERVED")
          PY
