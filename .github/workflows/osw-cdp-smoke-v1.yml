name: OSWorld browser CDP synthetic smoke V1

on:
  push:
    branches: [osw-cdp-smoke-v1]
    paths:
      - '.github/workflows/osw-cdp-smoke-v1.yml'
      - 'capsules/osw_cdp_smoke_v1/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright Python package
        run: python -m pip install --disable-pip-version-check --no-input playwright

      - name: Launch synthetic local Chrome with CDP
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          mkdir -p /tmp/osw-cdp-profile out
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage             --remote-debugging-port=9222             --user-data-dir=/tmp/osw-cdp-profile             about:blank >out/chrome.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:9222/json/version >/dev/null; then exit 0; fi
            sleep 0.25
          done
          exit 1

      - name: Exercise exact candidate against synthetic page
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from http.server import BaseHTTPRequestHandler, HTTPServer
          import threading
          from pathlib import Path
          import sys

          sys.path.insert(0, "capsules/osw_cdp_smoke_v1")
          from osworld_v21_browser_cdp_v1 import BrowserCDP

          class H(BaseHTTPRequestHandler):
              def do_GET(self):
                  body = b"""<html><head><title>Synthetic</title></head><body>
                  <button id='settings' onclick="document.body.dataset.clicked='yes';this.textContent='Opened'">Settings</button>
                  <input id='name' placeholder='Name'>
                  </body></html>"""
                  self.send_response(200)
                  self.send_header("Content-Type","text/html")
                  self.send_header("Content-Length",str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)
              def log_message(self,*args): pass

          server = HTTPServer(("127.0.0.1", 8765), H)
          threading.Thread(target=server.serve_forever, daemon=True).start()

          class Env:
              vm_ip = "127.0.0.1"
              chromium_port = 9222

          c = BrowserCDP()
          c.bind_environment(Env())
          c.act({"type":"NAVIGATE","url":"http://127.0.0.1:8765/"})
          snap1 = c.snapshot()
          assert snap1["page_count"] >= 1
          assert any(e.get("text") == "Settings" for e in snap1["pages"][0]["elements"])
          c.act({"type":"CLICK_TEXT","text":"Settings","exact":True})
          c.act({"type":"FILL","selector":"#name","text":"Brain"})
          snap2 = c.snapshot()
          assert any(e.get("value") == "Brain" for e in snap2["pages"][0]["elements"])
          receipt = {
              "schema":"PROJECT_BRAIN_OSWORLD_V21_BROWSER_CDP_SYNTHETIC_SMOKE_V1",
              "status":"PASS",
              "source_blob_sha":"c9cb6164ee85e58a04ba5d8185c98d8b11f5f524",
              "operations":["NAVIGATE","SNAPSHOT","CLICK_TEXT","FILL","SNAPSHOT"],
              "terminal_cases_consumed":0,
              "incremental_spend_usd":0
          }
          Path("out/receipt.json").write_text(json.dumps(receipt,indent=2,sort_keys=True)+"\n")
          print(json.dumps(receipt,sort_keys=True))
          server.shutdown()
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: osw-cdp-smoke-v1
          path: out/
          if-no-files-found: error
