name: Verify TB-Science rank10 authority v1
on:
  pull_request:
    branches: [main]
    paths:
      - 'capsules/tb_science_rank10_authority_20261007_v1/**'
      - '.github/workflows/verify-tb-science-rank10-authority-20261007-v1.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact rank10 authority and preexposure gates
        run: python capsules/tb_science_rank10_authority_20261007_v1/verify.py
