name: Verify Retrieval V19 route portfolio
on:
  push:
    branches:
      - verify/retrieval-v19-route-portfolio-20261004
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact V19 blobs
        run: |
          test "$(git hash-object canonical/runtime/retrieval_verified_route_portfolio_v1.py)" = "855a6cba59fff8c079f61212acadc254c4e9e736"
          test "$(git hash-object canonical/runtime/global_retrieval_entrypoint_v4.py)" = "2ad2fb952b3c361e74cb083b335d39b04a7c130b"
          test "$(git hash-object canonical/tests/test_retrieval_verified_route_portfolio_v1.py)" = "af8450568e5e754ec933d291d2e34c54962480f4"
      - run: PYTHONPATH=. python canonical/tests/test_retrieval_verified_route_portfolio_v1.py
