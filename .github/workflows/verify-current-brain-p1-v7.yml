name: Verify current Brain P1 V7 exact bytes
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/p1_v7_current_main/**"
      - ".github/workflows/verify-current-brain-p1-v7.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact Brain blob identities
        run: |
          cd capsules/p1_v7_current_main
          python - <<'PY'
          import hashlib,json,pathlib
          m=json.load(open("EXPECTED_BRAIN_BLOBS.json",encoding="utf-8"))
          for src,expected in m["exact_brain_blobs"].items():
              data=pathlib.Path(src).read_bytes()
              got=hashlib.sha1(f"blob {len(data)}\0".encode()+data).hexdigest()
              assert got==expected,(src,got,expected)
          print("exact Brain P1 V7 blobs: PASS")
          PY
      - name: Run exact Brain V7 tests
        run: |
          cd capsules/p1_v7_current_main
          export PYTHONPATH=.
          python -m py_compile canonical/runtime/trajectory_failure_typed_ir_candidate_v7.py
          python -m unittest canonical.tests.test_trajectory_failure_typed_ir_v7 -v
      - name: Verify zero-credit governance
        run: |
          cd capsules/p1_v7_current_main
          python - <<'PY'
          import json
          g=json.load(open("canonical/governance/P1_TYPED_CAUSAL_INTERVENTION_ENVELOPE_V7.json",encoding="utf-8"))
          assert g["capability_credit_delta"]==0 and g["family_credit_delta"]==0
          assert g["execution_authority"] is False and g["promotion_authority"] is False
          print("zero-credit governance: PASS")
          PY
