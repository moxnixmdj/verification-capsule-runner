name: Verify TB4 OMC carrier candidate
on:
  push:
    branches:
      - verify/tb4-omc-carrier-candidate-20261004
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact subject blobs
        run: |
          test "$(git hash-object canonical/governance/TB4_OMC_CLOUD_FREE_TRIAL_CARRIER_CANDIDATE_20261004_V1.json)" = "b26e3c3cb46cca224aeef9de3d965f4507f72c5d"
          test "$(git hash-object canonical/runtime/tb4_omc_cloud_candidate_v1.py)" = "626ef06a8174107fcd08cfa2767b3433ac8b5a4d"
          test "$(git hash-object canonical/tests/test_tb4_omc_cloud_candidate_v1.py)" = "b74527e35fb8d02b9d19871df0c32b01008e0adf"
          test "$(git hash-object canonical/governance/TB4_MINIMUM_CARRIER_RECOVERY_CUT_V1.json)" = "fc5bb61b1b97e6aae46222b9de84e16797510bcc"
      - name: Run fail-closed reducer test
        run: PYTHONPATH=. python canonical/tests/test_tb4_omc_cloud_candidate_v1.py
