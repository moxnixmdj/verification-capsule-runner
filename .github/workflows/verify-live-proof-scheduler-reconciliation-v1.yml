name: Verify live proof scheduler reconciliation v1
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/live_proof_scheduler_reconciliation_v1/**"
      - ".github/workflows/verify-live-proof-scheduler-reconciliation-v1.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify composed live proof scheduler authority
        run: |
          cd capsules/live_proof_scheduler_reconciliation_v1
          export PYTHONPATH=.
          python -m py_compile canonical/runtime/abductive_residual_theorem_v1.py
          python -m py_compile canonical/runtime/acceptance_ir_compiler_v1.py
          python -m py_compile canonical/runtime/terminal_next_action_compiler_v1.py
          python -m py_compile canonical/runtime/terminal_next_action_compiler_v2.py
          python -m unittest canonical.tests.test_live_proof_scheduler_reconciliation_v1 -v
