name: Verify witness target binding totalizer v1
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/witness_target_binding_totalizer_v1/**"
      - ".github/workflows/verify-witness-target-binding-totalizer-v1.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify total binding surface
        run: |
          cd capsules/witness_target_binding_totalizer_v1
          export PYTHONPATH=.
          python -m py_compile canonical/runtime/witness_target_binding_totalizer_v1.py
          python -m unittest canonical.tests.test_witness_target_binding_totalizer_v1 -v
          python canonical/runtime/witness_target_binding_totalizer_v1.py
