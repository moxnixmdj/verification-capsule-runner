name: Verify minimum policy discriminator v1
on:
  pull_request:
    branches: [terminal-execution-v1]
    paths:
      - "capsules/policy_region_minimum_discriminator_v1/**"
      - ".github/workflows/verify-policy-region-minimum-discriminator-v1.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          cd capsules/policy_region_minimum_discriminator_v1
          python -m py_compile canonical/runtime/monotone_semantic_constraint_kernel_v1.py
          python -m py_compile canonical/runtime/policy_region_minimum_discriminator_v1.py
          python verify.py
