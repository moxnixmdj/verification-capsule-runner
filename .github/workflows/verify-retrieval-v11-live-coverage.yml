name: Verify Retrieval V11 live coverage
on:
  push:
    branches:
      - verify/retrieval-v11-live-coverage-20261004
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact V11 arena bytes
        run: |
          test "$(git hash-object canonical/runtime/retrieval_live_provider_arena_v1.py)" = "ae22852836f61dd0f9691bbd89dbb4680aefa917"
          test "$(git hash-object canonical/runtime/retrieval_live_provider_arena_v2.py)" = "8fb64595ba6c8872f6086d2c226758afb4b7e493"
          test "$(git hash-object canonical/runtime/retrieval_live_provider_arena_v7.py)" = "9b630f61544b9da047d44cd748ec6055287e996e"
          test "$(git hash-object canonical/tests/test_retrieval_live_provider_arena_v7.py)" = "70546882a3d30a7f53310a7025e3b7987f573682"
      - run: PYTHONPATH=. python canonical/tests/test_retrieval_live_provider_arena_v7.py
      - name: Execute frozen V11 live provider coverage arena
        run: PYTHONPATH=. python canonical/runtime/retrieval_live_provider_arena_v7.py
