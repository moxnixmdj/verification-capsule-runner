name: Run Open-Ended Mauna Loa Parent Task A Once

on:
  pull_request:
    branches:
      - main
    paths:
      - 'ARM_PARENT_OPEN_ENDED_MAUNA_LOA_TASKA_20260930_V1'

permissions:
  contents: read

jobs:
  execute-once:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ASTRA_DISABLE_MODEL_PLANNER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Refresh Ubuntu package metadata
        run: sudo apt-get update
      - name: Execute frozen objective-only parent Task A exactly once
        id: parent_task
        continue-on-error: true
        run: python run_parent_open_ended_mauna_loa_taska_once.py
      - name: Upload terminal Task A evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parent-open-ended-mauna-loa-taska-terminal
          path: parent-open-ended-mauna-loa-taska-terminal.json
          if-no-files-found: error
      - name: Preserve semantic failure
        if: steps.parent_task.outcome != 'success'
        run: exit 1
