name: Verify acceptance quotient causal V3

on:
  push:
    paths:
      - "capsules/acceptance_quotient_causal_v3_20261005/**"
      - ".github/workflows/verify-acceptance-quotient-causal-v3-20261005.yml"
  pull_request:
    paths:
      - "capsules/acceptance_quotient_causal_v3_20261005/**"
      - ".github/workflows/verify-acceptance-quotient-causal-v3-20261005.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run exact vendored Brain V3 tests
        working-directory: capsules/acceptance_quotient_causal_v3_20261005
        run: python -m unittest -v canonical.tests.test_acceptance_quotient_simulation_v3
      - name: Run independent adversarial causal verifier
        working-directory: capsules/acceptance_quotient_causal_v3_20261005
        run: python verify_causal_quotient_v3.py
