name: Verify JIT engineering reference resolver
on:
  pull_request:
    branches: [main]
    paths:
      - 'verification/engineering_reference_resolver.py'
      - 'verification/test_engineering_reference_jit.py'
      - '.github/workflows/verify-engineering-reference-jit.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Bind exact Brain mechanism
        run: test "$(git hash-object verification/engineering_reference_resolver.py)" = "9c4c3183bad2c4f775d44ce738bd249923ae1a33"
      - name: Checkout exact external knowledge source
        run: |
          git clone --filter=blob:none https://github.com/makenexa/engineering-reference-data.git /tmp/engineering-reference-data
          git -C /tmp/engineering-reference-data checkout --detach dbe1df06c3cb90941f9ef511d74e5f5e8875d558
          test "$(git -C /tmp/engineering-reference-data rev-parse HEAD)" = "dbe1df06c3cb90941f9ef511d74e5f5e8875d558"
      - name: Verify source knowledge tables
        run: python /tmp/engineering-reference-data/tools/verify.py
      - name: Verify Brain JIT resolver on pinned source
        run: cd verification && python -m unittest -v test_engineering_reference_jit
