name: Verify Brain CAD PartSpec substrate
on:
  pull_request:
    branches: [main]
    paths:
      - 'verification/brain_cad_partspec.py'
      - 'verification/donor_cad_partspec.py'
      - 'verification/test_cad_partspec_differential.py'
      - '.github/workflows/verify-cad-partspec.yml'
permissions:
  contents: read
jobs:
  differential:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --quiet "pydantic>=2.0"
      - run: PYTHONPATH=. python -m unittest -v verification.test_cad_partspec_differential
