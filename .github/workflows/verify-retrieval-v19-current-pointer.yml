name: Verify Retrieval V19 current pointer
on:
  push:
    branches:
      - verify/retrieval-v19-current-pointer-20261004
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python verify_retrieval_v19_current_pointer.py
