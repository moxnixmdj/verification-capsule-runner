name: Verify Brain open-predicate action frontier guard v1

on:
  pull_request:
    paths:
      - 'capsules/open_predicate_frontier_guard_v1/**'
      - '.github/workflows/verify-open-predicate-frontier-guard-v1.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact mirrored Brain blob identities
        env:
          EXPECTED_JSON: '{"capsules/open_predicate_frontier_guard_v1/canonical/governance/OPUS55_ACCEPTANCE_ACTION_HYPERGRAPH_V1.json":"83450969ad0a7852789870c6ed7f305a2fd1a146","capsules/open_predicate_frontier_guard_v1/canonical/runtime/action_hypergraph_open_predicate_guard_v1.py":"449ce8e0beaed333ff616cd110c103a680031a6e","capsules/open_predicate_frontier_guard_v1/canonical/tests/test_action_hypergraph_open_predicate_guard_v1.py":"394b34a9a86f4694e49045b040203cbab7efb717","capsules/open_predicate_frontier_guard_v1/canonical/governance/ACTION_HYPERGRAPH_OPEN_PREDICATE_GUARD_V1.json":"4aceda893641a5cfa54cbab2770ce1b3f49c4840","capsules/open_predicate_frontier_guard_v1/canonical/governance/OBJECTIVE_GATE_FRONTIER_RECONCILIATION_20261002_V3.json":"38ce9e539bdfe8b53891b971d6afe91b6c40843d","capsules/open_predicate_frontier_guard_v1/canonical/governance/OPUS55_ACCEPTANCE_PREDICATE_REGISTRY_V2.json":"562536d9ba3f245a6bd24490a1eb3b30f27e0c3a","capsules/open_predicate_frontier_guard_v1/canonical/governance/OPUS55_ACCEPTANCE_PREDICATE_EVIDENCE_BINDINGS_V2.json":"f26d250f86e7f2ce18d790e451fe09bbacecb694","capsules/open_predicate_frontier_guard_v1/canonical/runtime/action_hypergraph_evidence_guard_v1.py":"2ddc7479b8e6cfc9320713983799f31354b3e855","capsules/open_predicate_frontier_guard_v1/canonical/verification/CURRENT_OBJECTIVE_BINDINGS_PUBLIC_RUNNER_VERIFICATION_20261002_V2.json":"3aa8168fc7f81581eea4085504e4a70205949af9","capsules/open_predicate_frontier_guard_v1/canonical/verification/TOOL_LEARNING_ATOMIC_CEILING_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json":"04cb0aa4b202b57062bc2057f7adf8791980e385"}'
        run: |
          python - <<'PY'
          import json,os,subprocess
          expected=json.loads(os.environ["EXPECTED_JSON"])
          bad=[]
          for path,want in expected.items():
              got=subprocess.check_output(["git","hash-object",path],text=True).strip()
              if got!=want: bad.append(f"{path}: {got} != {want}")
          if bad: raise SystemExit("\n".join(bad))
          print(f"EXACT_BLOB_IDENTITY_PASS {len(expected)}/{len(expected)}")
          PY
      - name: Run open-predicate guard tests
        env:
          PYTHONPATH: capsules/open_predicate_frontier_guard_v1
        run: |
          python -m unittest -v canonical.tests.test_action_hypergraph_open_predicate_guard_v1
      - name: Recompute both frontier guards
        env:
          PYTHONPATH: capsules/open_predicate_frontier_guard_v1
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from canonical.runtime.action_hypergraph_open_predicate_guard_v1 import evaluate as open_guard
          from canonical.runtime.action_hypergraph_evidence_guard_v1 import evaluate as evidence_guard
          root=Path("capsules/open_predicate_frontier_guard_v1")
          def load(p): return json.loads((root/p).read_text())
          h=load("canonical/governance/OPUS55_ACCEPTANCE_ACTION_HYPERGRAPH_V1.json")
          r=load("canonical/governance/OPUS55_ACCEPTANCE_PREDICATE_REGISTRY_V2.json")
          e=load("canonical/governance/OPUS55_ACCEPTANCE_PREDICATE_EVIDENCE_BINDINGS_V2.json")
          o=open_guard(r,e,h)
          g=evidence_guard(root,h)
          assert o["pass"] is True, o
          assert g["pass"] is True, g
          targets={p for a in h["actions"] for p in a.get("target_predicates",[])}
          assert "TOOL_LEARNING_SUCCESS_ROUTE_NONINFERIOR" not in targets, targets
          atom=load("canonical/verification/TOOL_LEARNING_ATOMIC_CEILING_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json")
          assert atom["verified"]["proved"]==3
          assert atom["verified"]["family_state"]=="PROVED"
          assert atom["verified"]["global_terminal_promotion_allowed"] is False
          print(json.dumps({"open_guard":o,"evidence_guard":g,"tool_target_present":False},indent=2))
          PY
      - name: Assert zero-credit governance
        run: |
          python - <<'PY'
          import json
          base="capsules/open_predicate_frontier_guard_v1/canonical/governance"
          for name in ["ACTION_HYPERGRAPH_OPEN_PREDICATE_GUARD_V1.json","OBJECTIVE_GATE_FRONTIER_RECONCILIATION_20261002_V3.json","OPUS55_ACCEPTANCE_ACTION_HYPERGRAPH_V1.json"]:
              d=json.load(open(f"{base}/{name}",encoding="utf-8"))
              assert d.get("capability_credit_delta")==0, name
              assert d.get("family_credit_delta")==0, name
              assert d.get("incremental_spend_usd")==0, name
          print("ZERO_CREDIT_GOVERNANCE_PASS")
          PY
