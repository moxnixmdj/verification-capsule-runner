name: Verify execution surface package policy
on:
  pull_request:
    branches: [main]
    paths:
      - 'session_bridge/execution_surface.py'
      - 'session_bridge/controller_fast.py'
      - 'verification/test_execution_surface.py'
      - '.github/workflows/verify-execution-surface-package-policy.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest -v verification/test_execution_surface.py
      - name: End-to-end PEP-668 container probe
        run: |
          docker run -d --name brain-bridge-task python:3.12-slim sh -lc 'trap : TERM INT; while :; do sleep 3600; done'
          docker exec brain-bridge-task sh -lc 'touch "$(python3 -c '"'"'import sysconfig; print(sysconfig.get_path("stdlib") + "/EXTERNALLY-MANAGED")'"'"')"'
          python session_bridge/execution_surface.py --container brain-bridge-task > /tmp/profile.json
          python - <<'PY'
          import json
          p=json.load(open("/tmp/profile.json"))
          assert p["status"]=="PASS", p
          assert p["python"]["externally_managed"] is True, p
          assert p["python"]["venv_usable"] is True, p
          assert p["python_package_policy"]=="VENV_REQUIRED", p
          print(json.dumps(p, indent=2, sort_keys=True))
          PY
          docker rm -f brain-bridge-task
