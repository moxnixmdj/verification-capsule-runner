name: Verify current authority scheduler generation v1
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/current_authority_scheduler_generation_v1/**"
      - ".github/workflows/verify-current-authority-scheduler-generation-v1.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact Brain blob identities
        run: |
          cd capsules/current_authority_scheduler_generation_v1
          python - <<'PY'
          import hashlib, json, pathlib
          m=json.load(open("EXPECTED_BRAIN_BLOBS.json",encoding="utf-8"))
          for src, expected in m["exact_brain_blobs"].items():
              data=pathlib.Path(src).read_bytes()
              actual=hashlib.sha1(f"blob {len(data)}\0".encode()+data).hexdigest()
              assert actual==expected,(src,actual,expected)
          print("exact Brain blob identities: PASS")
          PY
      - name: Verify scheduler generation and synthesis quarantine
        run: |
          cd capsules/current_authority_scheduler_generation_v1
          python - <<'PY'
          import json
          def load(p): return json.load(open(p,encoding="utf-8"))
          a=load("canonical/governance/CURRENT_TERMINAL_AUTHORITY_V1.json")
          s=load("canonical/governance/TERMINAL_SCHEDULING_ACTIVATION_V6.json")
          h=load("canonical/governance/OPUS55_ACCEPTANCE_ACTION_HYPERGRAPH_V2.json")
          p=load("canonical/governance/CANONICAL_PROOF_ATOM_BASIS_ACTIVATION_V1.json")
          assert a["truth"]["achieved"] is False
          assert a["truth"]["opus55_acceptance"]=="2/19_PASS__17/19_OPEN"
          c=a["compiled_next_frontier"]
          assert c["status"].startswith("SUPERSEDED_FOR_EXECUTION")
          assert c["execution_authority"] is False and c["promotion_authority"] is False
          syn=next(x for x in h["actions"] if x["id"]=="DISCHARGE_SYNTHESIS_EXACT_PROOF_DELTA")
          unsat=sorted(x["id"] for x in syn["preconditions"] if x.get("satisfied") is False)
          expected=sorted(["SYNTHESIS_MATCHED_TARGET_SCOPE_DISCHARGE_AVAILABLE","SYNTHESIS_MATCHED_QUALITY_AND_NONINFERIORITY_BINDINGS_INDEPENDENT_PASS"])
          assert unsat==expected,(unsat,expected)
          assert c["invalidation"]["synthesis_action_state"]=="BLOCKED_PRECONDITIONS"
          assert sorted(c["invalidation"]["synthesis_unsatisfied_preconditions"])==expected
          assert s["status"].startswith("ACTIVE_INDEPENDENT_PASS")
          assert s["frontier"]["path"]=="canonical/governance/TERMINAL_CERTIFICATE_FRONTIER_V5.json"
          assert s["action_hypergraph"]["path"]=="canonical/governance/OPUS55_ACCEPTANCE_ACTION_HYPERGRAPH_V2.json"
          assert p["status"].startswith("ACTIVE_INDEPENDENT")
          assert p["expected_projection"]["canonical_leaf_atoms"]==40
          assert "INDEX_EXISTING_CONTENT_ADDRESSED_RECEIPTS_AGAINST_40_CANONICAL_LEAF_PROOF_ATOMS" in a["next"]
          assert "SKIP_EXHAUSTED_SYNTHESIS_PATH_UNLESS_ADMISSIBLE_INPUT_CHANGES" in a["next"]
          print("current authority scheduler generation: PASS")
          PY
