name: Verify trajectory information-safe V2
on:
  pull_request:
    branches: [main]
    paths:
      - canonical/runtime/trajectory_failure_information_safe_proof_v2.py
      - canonical/runtime/trajectory_failure_information_safe_candidate_v2.py
      - canonical/tests/test_trajectory_failure_information_safe_v2.py
      - .github/workflows/verify-trajectory-information-safe-v2.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: PYTHONPATH=. python -m unittest -v canonical.tests.test_trajectory_failure_information_safe_v2
