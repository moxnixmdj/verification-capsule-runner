name: Verify LiveBench legacy15 clean replay V2

on:
  pull_request:
    paths:
      - verification_triggers/livebench_legacy15_clean_replay_v2.txt

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact replay dependencies
        run: python -m pip install --disable-pip-version-check pyarrow==19.0.1 langdetect==1.0.9 immutabledict==4.2.1 nltk==3.9.1
      - name: Install exact NLTK data
        run: python -c "import nltk; nltk.download('punkt', quiet=True); nltk.download('punkt_tab', quiet=True)"
      - name: Run exact clean predecessor replay
        run: python verify_livebench_legacy15_joint_predecessor_v1.py
