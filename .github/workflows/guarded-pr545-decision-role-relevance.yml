name: Guarded PR545 Decision Role Relevance Qualification
on:
  pull_request:
    branches: [main]
    paths:
      - canonical/runtime/bound_capabilities/objective_relevance_bm25.py
      - canonical/runtime/bound_capabilities/objective_claim_operand_binding.py
      - canonical/runtime/bound_capabilities/research_query_focus.py
      - canonical/tests/test_objective_relevance_bm25.py
      - canonical/action_intents/2026-09-30_REPAIR_DECISION_ROLE_RELEVANCE_OPERAND_COVERAGE_V1.json
      - verify_pr545_decision_role_relevance.py
      - generate_guarded_pr545_plan.py
      - .github/workflows/guarded-pr545-decision-role-relevance.yml
permissions:
  contents: write
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Generate exact frozen guard plan
        run: python generate_guarded_pr545_plan.py
      - name: Atomically admit exact non-parent qualification
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python execution_guard/github_actions_guarded_run_live.py --plan guarded_pr545_decision_role_relevance_plan.json --receipt guarded-pr545-admission.json
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: guarded-pr545-decision-role-relevance
          path: |
            guarded-pr545-admission.json
            guarded_pr545_decision_role_relevance_plan.json
            pr545-independent-report.json
          if-no-files-found: warn
