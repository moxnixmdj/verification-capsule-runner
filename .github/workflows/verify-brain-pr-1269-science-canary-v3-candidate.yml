name: Verify Brain PR 1269 Science canary V3 candidate

on:
  push:
    branches: ["verify/brain-pr-1269-science-canary-v3-candidate-20261003-sol"]
    paths:
      - ".github/workflows/verify-brain-pr-1269-science-canary-v3-candidate.yml"
      - "capsules/brain_pr_1269/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/verify-brain-pr-1269-science-canary-v3-candidate.yml"
      - "capsules/brain_pr_1269/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact candidate and first untouched slot
        run: |
          set -euo pipefail
          python - <<'PY' | tee SCIENCE_CANARY_V3_CANDIDATE_VERDICT.json
          import hashlib,json
          from pathlib import Path
          R=Path("capsules/brain_pr_1269")
          def L(p): return json.loads((R/p).read_text())
          def B(p):
              b=(R/p).read_bytes()
              return hashlib.sha1(b"blob "+str(len(b)).encode()+b"\0"+b).hexdigest()
          cp="canonical/governance/TB_SCIENCE_ONE_SLOT_CANARY_CANDIDATE_V3.json"
          op="canonical/governance/TB_SCIENCE_CURRENT_TARGET_EXECUTION_OVERLAY_V2.json"
          ip="canonical/verification/TB_SCIENCE_PATCHED_REAL_HARBOR_INTEGRATION_PUBLIC_RUNNER_VERIFICATION_20261003_V1.json"
          mp="canonical/governance/TB_SCIENCE_TERMINAL_EXECUTION_MANIFEST_V1.json"
          rp="canonical/verification/TB_SCIENCE_CANARY_V2_RESULT_20261003_V1.json"
          xp="canonical/verification/TB_SCIENCE_OPUS55_SNAPSHOT_IDENTITY_PUBLIC_RUNNER_VERIFICATION_20261003_V1.json"
          assert B(cp)=="f80e4b6a0b20cee28c60b844e34a54da01398052"
          assert B(op)=="64c02d44b38066577c7e7866a931bc7aa8ee9fcc"
          assert B(ip)=="4512996a6698463be367052b13a891bd0f647f73"
          assert B(mp)=="6dfa880b1f68881531afbba6ca211681801fd19b"
          assert B(rp)=="0c8661698af57557b2205c43e29610f88f194ed4"
          assert B(xp)=="3bff4c8ec68bba45d0538812101fbbfed7b9b2ec"
          c,o,i,m,r,x=map(L,[cp,op,ip,mp,rp,xp])
          assert i["status"].startswith("INDEPENDENT_PUBLIC_RUNNER_PASS"), i
          assert i["verified"]["terminal_task_content_read"]==0 and i["verified"]["terminal_results_observed"]==0
          assert i["verified"]["planner_blob"]=="fe7c0ce885197217774638df382aeb6f68ff38dd"
          assert i["verified"]["controller_blob"]=="5557efd21f1a433ad16766def3775a79c459784b"
          assert x["effective_current_comparator"]["score_percent"]==133/210*100
          assert o["reduction"]["finalized_failures"]==4
          assert o["reduction"]["failures_remaining_before_fail_lock"]==74
          assert o["reduction"]["successes_remaining_for_pass_lock"]==133
          consumed=set(o["consumed_slots"])
          slots=sorted(m["slots"],key=lambda z:z["schedule_order"])
          first=next(z for z in slots if z["slot_id"] not in consumed)
          assert first["slot_id"]=="terminal-bench-science/virtual-baseline-localization::trial-0", first
          assert first["schedule_order"]==4 and first["task_rank"]==4 and first["attempt_index"]==0, first
          assert first["task_digest"]=="sha256:18e64cb62b351e3861e1995bdc3ba08bba37f0ae3e645ee4b250714b6f0c00ee"
          cc=c["authorized_slot_candidate"]
          assert cc==first, (cc,first)
          assert set(c["permanently_consumed_slots"])==consumed and len(consumed)==4
          assert c["exact_route"]["planner_blob"]=="fe7c0ce885197217774638df382aeb6f68ff38dd"
          assert c["exact_route"]["controller_blob"]=="5557efd21f1a433ad16766def3775a79c459784b"
          assert c["current_target_overlay"]["required_successes"]==133
          assert c["current_target_overlay"]["remaining_failures_before_fail_lock"]==74
          assert c["execution_authority"] is False and c["promotion_authority"] is False
          out={
            "schema":"PROJECT_BRAIN_TB_SCIENCE_ONE_SLOT_CANARY_V3_CANDIDATE_INDEPENDENT_VERIFICATION_V1",
            "status":"INDEPENDENT_PASS__PATCHED_ROUTE__FIRST_UNTOUCHED_SLOT_VIRTUAL_BASELINE_LOCALIZATION_TRIAL_0__133_OF_210_TARGET__ZERO_CREDIT",
            "candidate_blob":"f80e4b6a0b20cee28c60b844e34a54da01398052",
            "overlay_blob":"64c02d44b38066577c7e7866a931bc7aa8ee9fcc",
            "integration_receipt_blob":"4512996a6698463be367052b13a891bd0f647f73",
            "authorized_slot_candidate":first["slot_id"],
            "finalized_failures":4,
            "remaining_failures_before_fail_lock":74,
            "required_successes":133,
            "terminal_task_content_read":0,
            "terminal_results_observed":0,
            "execution_authority":False,
            "promotion_authority":False,
            "incremental_spend_usd":0
          }
          print(json.dumps(out,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: brain-pr-1269-science-canary-v3-candidate
          path: SCIENCE_CANARY_V3_CANDIDATE_VERDICT.json
          if-no-files-found: error
