name: Chartography Brain-native synthetic generalization V1

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/chartography-brain-native-synthetic-v1.yml"
      - "subject/chartography_brain_native/**"

permissions:
  contents: read

jobs:
  generalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install deterministic vision and narrow OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr
          python -m pip install --disable-pip-version-check --no-input pillow numpy opencv-python-headless matplotlib
      - name: Prohibit runtime general-purpose models
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RniE 'llama-server|Qwen|MiniCPM|ChartVerse|anthropic|openai|gemini|transformers|vllm' subject/chartography_brain_native
      - name: Run fresh randomized generalization suite
        run: |
          python subject/chartography_brain_native/synthetic_generalization_v1.py             --out out/synthetic --seed 20261011 --line-cases 20 --phase-cases 20
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chartography-brain-native-synthetic-v1
          path: out/synthetic/synthetic_result.json
          if-no-files-found: error
