name: Verify Root2 hypergraph current rebind v2
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/root2_hypergraph_current_rebind_v2/**"
      - ".github/workflows/verify-root2-hypergraph-current-rebind-v2.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact candidate blobs
        run: |
          test "$(git hash-object capsules/root2_hypergraph_current_rebind_v2/ROOT2_FROZEN_COMPARATOR_VECTOR_V1.json)" = "853270f1f998ab6a3050d442fcaa4b9c512bb74c"
          test "$(git hash-object capsules/root2_hypergraph_current_rebind_v2/ROOT2_PROOF_HYPERGRAPH_CURRENT_REBIND_V2.json)" = "1620716dad27a6ce409d0c2b05f5615584296a69"
          test "$(git hash-object capsules/root2_hypergraph_current_rebind_v2/ROOT2_FIXED_BAR_ROUTE_INVENTORY_V1.json)" = "b273b4313d329e962ac749151d086e2b1e93c5ca"
      - name: Verify current rebind semantics
        run: python capsules/root2_hypergraph_current_rebind_v2/verify.py
