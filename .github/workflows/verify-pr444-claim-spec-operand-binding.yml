name: Verify PR444 Claim Spec Operand Binding
on:
  pull_request:
    branches: [main]
    paths:
      - canonical/runtime/bound_capabilities/objective_claim_operand_binding.py
      - canonical/tests/test_objective_claim_operand_binding.py
      - canonical/runtime/bound_capabilities/generic_evidence_claim_relation.py
      - verify_pr444_claim_spec_operand_binding.py
      - .github/workflows/verify-pr444-claim-spec-operand-binding.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact Brain PR444 and inherited relation blobs
        run: |
          set -euo pipefail
          test "$(git hash-object canonical/runtime/bound_capabilities/objective_claim_operand_binding.py)" = "0039d1faff31391b1f0ee87d79f2626119fd9d23"
          test "$(git hash-object canonical/tests/test_objective_claim_operand_binding.py)" = "a5a3b6623e1a87a5ff75699b44ebe3c0fd8a392a"
          test "$(git hash-object canonical/runtime/bound_capabilities/generic_evidence_claim_relation.py)" = "d66a7eb30774f66160b698d8082947776888293d"
      - name: Run exact candidate regressions
        run: python canonical/tests/test_objective_claim_operand_binding.py
      - name: Run independent fresh cross-domain qualification
        run: python verify_pr444_claim_spec_operand_binding.py
      - name: Upload qualification report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr444-claim-spec-operand-binding-report
          path: pr444-claim-spec-operand-binding-report.json
          if-no-files-found: error
