name: Guarded Brain PR546 Decision Role Relevance Qualification
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  qualify:
    if: github.head_ref == 'qualify/brain-pr546-decision-role-relevance-d6431d5-20260930-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Prestart exact frozen candidate closure
        run: |
          set -euo pipefail
          test "$(git hash-object canonical/runtime/bound_capabilities/objective_relevance_bm25.py)" = "d603a2ec6ff1706a07ec9acdf47b1e61095d46a3"
          test "$(git hash-object canonical/tests/test_objective_relevance_bm25.py)" = "29d2bf47a6d557c668d41605dfaf94a7543eccb1"
          test "$(git hash-object canonical/runtime/bound_capabilities/objective_claim_operand_binding.py)" = "48fd058430d8d361fc75beced567c7b6d1166531"
          test "$(git hash-object canonical/runtime/bound_capabilities/research_query_focus.py)" = "5403e1dc05716fcfc4f9a91b4534f55dc547eb7f"
          test "$(git hash-object pr546_decision_role_relevance_authority.json)" = "b9e791eb91e34be265cde18469488be84a6c4a45"
          test "$(git hash-object verify_brain_pr546_decision_role_relevance.py)" = "60f511889dbc6675a7187ec9542579ad44a399e0"
          test "$(git hash-object generate_brain_pr546_decision_role_relevance_plan.py)" = "64d8260a8180f230680aafcd372adc2d93432e65"
          python -m py_compile canonical/runtime/bound_capabilities/objective_relevance_bm25.py canonical/runtime/bound_capabilities/objective_claim_operand_binding.py canonical/runtime/bound_capabilities/research_query_focus.py canonical/tests/test_objective_relevance_bm25.py verify_brain_pr546_decision_role_relevance.py
      - name: Generate frozen qualification plan
        run: python generate_brain_pr546_decision_role_relevance_plan.py
      - name: Atomically admit and qualify
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python execution_guard/github_actions_guarded_run_live.py --plan brain_pr546_decision_role_relevance_plan.json --receipt brain-pr546-decision-role-guard-receipt.json
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: brain-pr546-decision-role-relevance-qualification
          path: |
            brain-pr546-decision-role-guard-receipt.json
            brain_pr546_decision_role_relevance_plan.json
            pr546-independent-decision-role-report.json
            pr546_decision_role_relevance_authority.json
          if-no-files-found: warn
