name: Guarded Genomics Open-Ended Parent Task B
on:
  pull_request:
    branches: [main]
    paths:
      - guarded_genomics_parent_taskb_plan.json
      - canonical/tasks/PARENT-OPENENDED-GENOMICS-REFERENCE-LENGTH-REAL-TASK-20260930-005.json
      - canonical/astra_runtime/missions/PARENT-OPENENDED-GENOMICS-REFERENCE-LENGTH-REAL-TASK-20260930-005.json
      - canonical/action_intents/2026-09-30_FREEZE_FRESH_GENOMICS_REFERENCE_LENGTH_OPENENDED_PARENT_TASK_A_V1.json
      - canonical/runtime/**
      - .github/workflows/guarded-genomics-parent-taskb.yml
permissions:
  contents: write
jobs:
  execute-once:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ASTRA_DISABLE_MODEL_PLANNER: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Atomically admit once then execute frozen genomics parent Task B
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python execution_guard/github_actions_guarded_run_live.py --plan guarded_genomics_parent_taskb_plan.json --receipt guarded-genomics-parent-taskb-admission.json
      - name: Upload terminal guarded parent evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: guarded-genomics-parent-taskb-terminal
          path: |
            guarded-genomics-parent-taskb-admission.json
            guarded_genomics_parent_taskb_plan.json
            canonical/astra_runtime/state/PARENT-OPENENDED-GENOMICS-REFERENCE-LENGTH-REAL-TASK-20260930-005.json
            canonical/astra_runtime/evidence/PARENT-OPENENDED-GENOMICS-REFERENCE-LENGTH-REAL-TASK-20260930-005*
          if-no-files-found: warn
