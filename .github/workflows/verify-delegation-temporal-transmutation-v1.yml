name: Verify delegation temporal ceiling transmutation v1

on:
  pull_request:
    paths:
      - 'capsules/delegation_temporal_transmutation_v1/**'
      - '.github/workflows/verify-delegation-temporal-transmutation-v1.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify exact mirrored Brain blob identities
        env:
          EXPECTED_JSON: >-
            {"canonical/governance/OPUS55_TERMINAL_PROOF_PROTOCOLS_V1.json":"eb4bca0fe6a015d49d2854998fbe046c979c7ea9","canonical/governance/OPUS55_ACCEPTANCE_PROOF_TRANSMUTATION_INPUT_V1.json":"96052a6b5178305b37a2526fb25c3f53fa33b9b5","canonical/governance/DELEGATION_ACCEPTANCE_CEILING_WITNESS_V1.json":"cb3b7c4b6c4e1f2a0471c6b6be72c4ca9ebddc80","canonical/verification/DELEGATION_TEMPORAL_PROOF_TRANSPORT_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json":"5278abb7fcaa6b97189b67598c75e4df395e1788","canonical/runtime/acceptance_proof_transmuter_v1.py":"0580f9819b5465c9617f0a1e8ff9a96902eedfc6","canonical/tests/test_delegation_temporal_ceiling_transmutation_v1.py":"c486ef7e678a0bb8e0c6d4607c1ac9e2cf2de9bc"}
        run: |
          python - <<'PY'
          import json, os, subprocess
          root="capsules/delegation_temporal_transmutation_v1"
          expected=json.loads(os.environ["EXPECTED_JSON"])
          bad=[]
          for rel,want in expected.items():
              got=subprocess.check_output(["git","hash-object",f"{root}/{rel}"],text=True).strip()
              if got!=want:
                  bad.append(f"{rel}: {got} != {want}")
          if bad:
              raise SystemExit("\n".join(bad))
          print(f"EXACT_BLOB_IDENTITY_PASS {len(expected)}/{len(expected)}")
          PY

      - name: Run exact delegation transmutation tests
        env:
          PYTHONPATH: capsules/delegation_temporal_transmutation_v1
        run: |
          python -m unittest -v canonical.tests.test_delegation_temporal_ceiling_transmutation_v1

      - name: Assert expected four-family transmutation input
        run: |
          python - <<'PY'
          import json
          root="capsules/delegation_temporal_transmutation_v1"
          p=f"{root}/canonical/governance/OPUS55_ACCEPTANCE_PROOF_TRANSMUTATION_INPUT_V1.json"
          d=json.load(open(p,encoding="utf-8"))
          exp=d["expected_compile_result"]
          assert exp["family_count"]==19
          assert exp["closed_family_count"]==4
          assert exp["open_family_count"]==15
          assert "SUBAGENT_DELEGATION_AND_COORDINATION" in exp["newly_closed_families"]
          assert d["incremental_spend_usd"]==0
          print("FOUR_OF_NINETEEN_EXPECTATION_BOUND")
          PY
