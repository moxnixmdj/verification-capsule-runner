name: Verify M0 portfolio multiplex binding
on:
  pull_request:
    paths:
      - 'verification/m0_binding.json'
      - 'verification/verify_m0_binding.py'
      - '.github/workflows/verify-m0-portfolio-multiplex.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python verification/verify_m0_binding.py
