name: Plain Goal Bound Grounding V1
on:
  push:
    branches: [frontier/plain-goal-grounding-v1-20260930]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run model-independent grounding regressions
        shell: bash
        env:
          ASTRA_DISABLE_MODEL_PLANNER: "1"
        run: |
          set -euo pipefail
          python -m unittest -v \
            canonical.tests.test_plain_goal_bound_grounding \
            canonical.tests.test_plain_goal_bound_grounding_gate \
            canonical.tests.test_plain_goal_grounding_runtime_precedence
      - name: Run real grounding acquisition and fresh reuse
        shell: bash
        env:
          ASTRA_DISABLE_MODEL_PLANNER: "1"
        run: |
          set -euo pipefail
          python GROUNDING_REAL_TASK_PROOF.py
      - name: Upload grounding evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: plain-goal-grounding-real-task-evidence
          if-no-files-found: error
          path: GROUNDING_REAL_TASK_EVIDENCE.json
