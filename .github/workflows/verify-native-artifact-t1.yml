name: Verify native artifact T1 multiplex binding
on:
  pull_request:
    paths:
      - 'verification/native_artifact_t1_binding.json'
      - 'verification/verify_native_artifact_t1.py'
      - '.github/workflows/verify-native-artifact-t1.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python verification/verify_native_artifact_t1.py
