name: Verify Root2 V18 LiveBench package closure
on:
  pull_request:
    paths:
      - 'verify_root2_v18_livebench_package_closure.py'
      - 'subject/root2_v18_livebench_package_closure/**'
      - '.github/workflows/verify-root2-v18-livebench-package-closure.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python verify_root2_v18_livebench_package_closure.py
