name: Guarded Materials Parent Task C Once

on:
  pull_request:
    branches: [main]
    paths:
      - canonical/action_intents/2026-09-30_EXECUTE_GUARDED_MATERIALS_TASK_C_V1.json
      - canonical/tasks/PARENT-MATERIALS-THERMAL-CONDUCTIVITY-OPEN-RESEARCH-TASK-C-20260930-003.json
      - canonical/astra_runtime/missions/PARENT-MATERIALS-THERMAL-CONDUCTIVITY-OPEN-RESEARCH-TASK-C-20260930-003.json
      - canonical/runtime/**
      - run_guarded_materials_parent_task_c_once.py
      - generate_guarded_materials_parent_task_c_plan.py
      - .github/workflows/guarded-materials-parent-task-c-once.yml

permissions:
  contents: write

jobs:
  execute-once:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Prepare zero-cost Ubuntu package metadata
        run: sudo apt-get update
      - name: Generate exact frozen guard plan
        run: python generate_guarded_materials_parent_task_c_plan.py
      - name: Atomically admit once then execute frozen parent Task C
        id: guarded
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python execution_guard/github_actions_guarded_run_live.py --plan guarded_materials_parent_task_c_plan.json --receipt guarded-materials-parent-task-c-admission.json
      - name: Upload terminal evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: guarded-materials-parent-task-c-terminal
          path: |
            guarded-materials-parent-task-c-admission.json
            guarded_materials_parent_task_c_plan.json
            materials-parent-task-c-terminal.json
            canonical/astra_runtime/state/PARENT-MATERIALS-THERMAL-CONDUCTIVITY-OPEN-RESEARCH-TASK-C-20260930-003.json
            canonical/astra_runtime/evidence/PARENT-MATERIALS-THERMAL-CONDUCTIVITY-OPEN-RESEARCH-TASK-C-20260930-003*
          if-no-files-found: warn
      - name: Preserve terminal failure
        if: steps.guarded.outcome != 'success'
        run: exit 1
