name: Verify LiveBench 2026 Legacy Scope

on:
  pull_request:
    branches:
      - main
    paths:
      - verify_livebench_2026_legacy_scope.py
      - .github/workflows/verify-livebench-2026-legacy-scope.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recompute LiveBench 2026 legacy scorer scope
        run: python verify_livebench_2026_legacy_scope.py
      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livebench-2026-legacy-scope-receipt
          path: livebench_2026_legacy_scope_receipt.json
          if-no-files-found: error
