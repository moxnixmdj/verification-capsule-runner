name: Verify repaired LiveBench legacy15 predecessor V1

on:
  push:
    paths:
      - '.github/workflows/verify-livebench-legacy15-repaired-predecessor-v1.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: verify/livebench-legacy15-synthetic-v2-20261004
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - run: python -m pip install --disable-pip-version-check 'pyarrow==19.0.1' 'langdetect==1.0.9' 'immutabledict==4.2.1' 'nltk==3.9.1'
      - run: python -c "import nltk; nltk.download('punkt', quiet=True); nltk.download('punkt_tab', quiet=True)"
      - name: Run clean predecessor exact verifier
        run: python verify_livebench_legacy15_repaired_predecessor_v1.py
      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livebench-legacy15-repaired-predecessor-v1
          path: receipts/livebench_legacy15_repaired_predecessor_v1.json
          if-no-files-found: warn
