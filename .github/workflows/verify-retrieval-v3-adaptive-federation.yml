name: Verify retrieval V3 adaptive federation
on:
  push:
    branches:
      - verify/retrieval-v3-adaptive-federation-20261003
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python verify_retrieval_v3_adaptive_federation.py
