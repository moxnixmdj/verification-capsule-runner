name: Verify Brain Composition Tool Discovery bridge V1
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/composition_tool_discovery_bridge_v1/**"
      - ".github/workflows/verify-brain-composition-tool-discovery-bridge-v1.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact Brain blob identities
        run: |
          cd capsules/composition_tool_discovery_bridge_v1
          python - <<'PY'
          import hashlib,json,pathlib
          m=json.load(open("EXPECTED_BRAIN_BLOBS.json",encoding="utf-8"))
          for src,expected in m["exact_brain_blobs"].items():
              raw=pathlib.Path(src).read_bytes()
              got=hashlib.sha1(f"blob {len(raw)}\0".encode()+raw).hexdigest()
              assert got==expected,(src,got,expected)
          print("exact Brain blobs PASS",len(m["exact_brain_blobs"]))
          PY
      - name: Run bridge tests
        run: |
          cd capsules/composition_tool_discovery_bridge_v1
          python canonical/tests/test_composition_tool_discovery_scope_complete_bridge_v1.py
      - name: Independent scope assertions
        run: |
          cd capsules/composition_tool_discovery_bridge_v1
          python - <<'PY'
          import json
          c=json.load(open("canonical/governance/COMPOSITION_TOOL_DISCOVERY_SCOPE_COMPLETE_BRIDGE_V1.json"))
          e=json.load(open("canonical/governance/OPUS55_ACCEPTANCE_PREDICATE_EVIDENCE_BINDINGS_V2.json"))
          row=next(x for x in e["claims"] if x.get("predicate_id")=="TOOL_LEARNING_SUCCESS_ROUTE_NONINFERIOR")
          r=c["candidate_receipt"]
          assert row["state"]=="PROVED",row
          assert row["scope_complete"] is True,row
          assert row["objective_ceiling"] is True,row
          assert r["component_id"]=="tool discovery",r
          assert r["interface_id"]=="coding+debugging+tool discovery",r
          assert r["receipt_id"] != c["quarantine_relation"]["historical_quarantined_receipt"],c
          assert c["quarantine_relation"]["historical_receipt_restored"] is False,c
          assert c["expected_effect_after_independent_verification"]["projected_scoped_proved_components_after"]==4,c
          assert c["expected_effect_after_independent_verification"]["parent_composition_predicate_closed"] is False,c
          assert c["family_credit_delta"]==0 and c["ownership_credit_delta"]==0,c
          assert c["execution_authority"] is False and c["promotion_authority"] is False,c
          print("composition Tool Discovery bridge independent assertions PASS")
          PY
