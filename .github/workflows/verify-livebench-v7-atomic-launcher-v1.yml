name: Verify LiveBench V7 public result
on:
  push:
    branches:
      - "verify/livebench-v7-result-public-20261004"
    paths:
      - ".github/workflows/verify-livebench-v7-atomic-launcher-v1.yml"
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.14"
      - run: python verify_livebench_v7_public_result.py
