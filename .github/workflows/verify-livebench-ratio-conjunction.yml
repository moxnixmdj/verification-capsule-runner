name: Verify LiveBench Ratio Conjunction
on:
  pull_request:
    branches:
      - main
    paths:
      - subject/livebench_ratio_conjunction_20261004/verify.py
      - .github/workflows/verify-livebench-ratio-conjunction.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recompute public full conjunction proof
        run: python subject/livebench_ratio_conjunction_20261004/verify.py
      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livebench-ratio-conjunction-receipt
          path: livebench_ratio_conjunction_receipt.json
          if-no-files-found: error
