name: Verify composition behavioral bridge v1
on:
  push:
    branches:
      - "verify-composition-behavioral-bridge-v1-20261002-1337"
    paths:
      - "capsules/composition_behavioral_bridge_v1/**"
      - ".github/workflows/verify-composition-behavioral-bridge-v1.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact bridge
        run: |
          cd capsules/composition_behavioral_bridge_v1
          export PYTHONPATH=.
          python verify_independent.py
