name: Verify composition behavioral bridge v1
on:
  pull_request:
    paths:
      - "capsules/composition_behavioral_bridge_v1/**"
      - ".github/workflows/verify-composition-behavioral-bridge-v1.yml"
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Independent exact-byte recomputation
        run: python capsules/composition_behavioral_bridge_v1/verify_independent.py
