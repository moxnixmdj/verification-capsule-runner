name: Verify LiveBench NGram Whitespace-Invariant Constructor
on:
  pull_request:
    branches:
      - main
    paths:
      - verify_livebench_ngram_whitespace_invariant_constructor.py
      - .github/workflows/verify-livebench-ngram-whitespace-invariant-constructor.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recompute from pinned public upstream bytes
        run: python verify_livebench_ngram_whitespace_invariant_constructor.py
      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livebench-ngram-whitespace-invariant-constructor-receipt
          path: livebench_ngram_whitespace_invariant_constructor_receipt.json
          if-no-files-found: error
