name: Verify Root2 calibrated settlement scheduler V1
on:
  pull_request:
    branches: [main]
    paths:
      - "subject/root2_calibrated_settlement_scheduler_v1/**"
      - ".github/workflows/verify-root2-calibrated-settlement-scheduler-v1.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.14"
      - name: Verify exact subject blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object subject/root2_calibrated_settlement_scheduler_v1/canonical/runtime/root2_calibrated_settlement_scheduler_v1.py)" = "8c6c093d682f4a3b121be69a86b5def79a206c4b"
          test "$(git hash-object subject/root2_calibrated_settlement_scheduler_v1/canonical/tests/test_root2_calibrated_settlement_scheduler_v1.py)" = "42561094b407d634be744614a5e388830a9ddeee"
      - name: Run isolated focused tests
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/root2-calibrated-settlement
          mkdir -p /tmp/root2-calibrated-settlement/canonical/runtime /tmp/root2-calibrated-settlement/canonical/tests
          touch /tmp/root2-calibrated-settlement/canonical/__init__.py /tmp/root2-calibrated-settlement/canonical/runtime/__init__.py /tmp/root2-calibrated-settlement/canonical/tests/__init__.py
          cp subject/root2_calibrated_settlement_scheduler_v1/canonical/runtime/root2_calibrated_settlement_scheduler_v1.py /tmp/root2-calibrated-settlement/canonical/runtime/
          cp subject/root2_calibrated_settlement_scheduler_v1/canonical/tests/test_root2_calibrated_settlement_scheduler_v1.py /tmp/root2-calibrated-settlement/canonical/tests/
          cd /tmp/root2-calibrated-settlement
          PYTHONPATH=. python -m unittest -v canonical.tests.test_root2_calibrated_settlement_scheduler_v1
