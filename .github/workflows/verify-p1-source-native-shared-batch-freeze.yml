name: Verify P1 source-native shared-batch freeze
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact hardened pre-case freeze
        run: |
          python -m unittest -v canonical.tests.test_p1_shared_failure_semantics_batch_preflight_v1
          python -m canonical.runtime.p1_shared_failure_semantics_batch_preflight_v1
      - name: Verify source-native bridge and dual scorers on spent fixtures
        run: python -m unittest -v canonical.tests.test_p1_shared_failure_semantics_batch_v1
      - name: Verify no terminal execution occurred
        run: bash verification/run.sh
