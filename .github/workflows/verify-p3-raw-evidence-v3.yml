name: Verify P3 raw-evidence V3
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Bind exact Brain proof and candidate
        run: |
          test "$(git hash-object canonical/runtime/p3_information_safe_proof_suite_v3.py)" = "7b4fef2a2ba2c84b3499ded1ed4bbaac6714fa42"
          test "$(git hash-object canonical/runtime/p3_information_safe_candidate_v3.py)" = "54bfc7e5ee205aa328863a5ea1ca6f47f864d85a"
      - run: PYTHONPATH=. python verification/verify_p3_raw_evidence_v3.py
