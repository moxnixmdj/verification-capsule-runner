name: Verify LiveBench language decorator neutrality

on:
  push:
    branches: [main]
    paths:
      - "subject/livebench_language_decorator_20261005/**"
      - "verify_livebench_language_decorator_neutrality_v1.py"
      - ".github/workflows/verify-livebench-language-decorator-neutrality-v1.yml"
  pull_request:
    branches: [main]
    paths:
      - "subject/livebench_language_decorator_20261005/**"
      - "verify_livebench_language_decorator_neutrality_v1.py"
      - ".github/workflows/verify-livebench-language-decorator-neutrality-v1.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"

      - name: Install exact runtime
        run: |
          python -m pip install --disable-pip-version-check --quiet langdetect==1.0.9 nltk==3.10.3

      - name: Checkout exact LiveBench
        run: |
          git clone --quiet --filter=blob:none --no-checkout https://github.com/LiveBench/LiveBench.git /tmp/livebench
          git -C /tmp/livebench fetch --quiet --depth=1 origin 8f8e5c381a16e3f24257776edd53471fe86f8091
          git -C /tmp/livebench checkout --quiet --detach 8f8e5c381a16e3f24257776edd53471fe86f8091
          test "$(git -C /tmp/livebench rev-parse HEAD)" = "8f8e5c381a16e3f24257776edd53471fe86f8091"

      - name: Execute frozen gate plus RNG falsifier
        run: python verify_livebench_language_decorator_neutrality_v1.py

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livebench-language-decorator-neutrality-v1
          path: livebench_language_decorator_neutrality_receipt.json
          if-no-files-found: error
