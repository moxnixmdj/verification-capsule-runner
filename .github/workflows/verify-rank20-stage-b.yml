name: Verify rank20 Stage B contract
on:
  pull_request:
    branches: [main]
    paths:
      - 'verification/rank20_stage_b/**'
      - '.github/workflows/verify-rank20-stage-b.yml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python verification/rank20_stage_b/verify_contract.py
  exact-surface-feasibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build materially exact task runtime and prove package/build route
        run: |
          cat > /tmp/Dockerfile <<'EOF'
          FROM python:3.12-slim
          RUN apt-get update && apt-get install -y --no-install-recommends bash ca-certificates curl nodejs npm sqlite3 && rm -rf /var/lib/apt/lists/*
          RUN python -m venv /tmp/venv && /tmp/venv/bin/pip install --no-cache-dir fastapi==0.115.0 uvicorn==0.30.6
          RUN mkdir -p /tmp/front && cd /tmp/front && npm init -y >/dev/null 2>&1 && npm install --no-audit --no-fund react@18.3.1 react-dom@18.3.1 vite@5.4.8
          RUN /tmp/venv/bin/python - <<'PY'
          import sqlite3
          con=sqlite3.connect('/tmp/smoke.sqlite'); con.execute('create table t(x int)'); con.execute('insert into t values (1)'); con.commit()
          assert con.execute('select x from t').fetchone()[0]==1
          con.execute('begin'); con.execute('insert into t values (2)'); con.rollback()
          assert con.execute('select count(*) from t').fetchone()[0]==1
          import fastapi,uvicorn
          print('backend+sqlite ok',fastapi.__version__,uvicorn.__version__)
          PY
          WORKDIR /tmp/front
          RUN printf '<div id="root"></div><script type="module" src="/src.jsx"></script>' > index.html && printf 'import React from "react"; import {createRoot} from "react-dom/client"; createRoot(document.getElementById("root")).render(React.createElement("div",null,"ready"));' > src.jsx && npx vite build
          EOF
          docker build -f /tmp/Dockerfile -t rank20-surface-smoke /tmp
