name: Verify rank20 Stage B contract
on:
  pull_request:
    branches: [main]
    paths:
      - 'verification/rank20_stage_b/**'
      - '.github/workflows/verify-rank20-stage-b.yml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python verification/rank20_stage_b/verify_contract.py
  exact-surface-feasibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build materially exact task runtime and prove package/build route
        run: |
          cat > /tmp/Dockerfile <<'EOF'
          FROM python:3.12-slim
          RUN apt-get update && apt-get install -y --no-install-recommends bash ca-certificates curl nodejs npm sqlite3 && rm -rf /var/lib/apt/lists/*
          RUN python -m venv /tmp/venv && /tmp/venv/bin/pip install --no-cache-dir fastapi==0.115.0 uvicorn==0.30.6
          RUN mkdir -p /tmp/front && cd /tmp/front && npm init -y >/dev/null 2>&1 && npm install --no-audit --no-fund react@18.3.1 react-dom@18.3.1 vite@5.4.8
          RUN /tmp/venv/bin/python - <<'PY'
          import sqlite3
          con=sqlite3.connect('/tmp/smoke.sqlite'); con.execute('create table t(x int)'); con.execute('insert into t values (1)'); con.commit()
          assert con.execute('select x from t').fetchone()[0]==1
          con.execute('begin'); con.execute('insert into t values (2)'); con.rollback()
          assert con.execute('select count(*) from t').fetchone()[0]==1
          import fastapi,uvicorn
          print('backend+sqlite ok',fastapi.__version__,uvicorn.__version__)
          PY
          WORKDIR /tmp/front
          RUN printf '<div id="root"></div><script type="module" src="/src.jsx"></script>' > index.html && printf 'import React from "react"; import {createRoot} from "react-dom/client"; createRoot(document.getElementById("root")).render(React.createElement("div",null,"ready"));' > src.jsx && npx vite build
          RUN cat > /tmp/app.py <<'PY'
          from fastapi import FastAPI
          app=FastAPI()
          @app.get("/api/health")
          def health(): return {"ok": True}
          PY
          RUN cat > /tmp/start.sh <<'SH'
          #!/bin/sh
          set -eu
          : "${BACKEND_PORT:?}"
          : "${FRONTEND_PORT:?}"
          : "${VITE_BACKEND_URL:?}"
          /tmp/venv/bin/python -m uvicorn app:app --app-dir /tmp --host 0.0.0.0 --port "$BACKEND_PORT" >/tmp/backend.log 2>&1 &
          cd /tmp/front
          npx vite preview --host 0.0.0.0 --port "$FRONTEND_PORT" >/tmp/frontend.log 2>&1 &
          wait
          SH
          RUN chmod +x /tmp/start.sh && command -v node && command -v npm && command -v sqlite3 && command -v curl
          CMD ["/tmp/start.sh"]
          EOF
          docker build -f /tmp/Dockerfile -t rank20-surface-smoke /tmp
          cid="$(docker run -d --cpus=2 --memory=8g \
            -e BACKEND_PORT=18000 -e FRONTEND_PORT=18001 \
            -e VITE_BACKEND_URL=http://127.0.0.1:18000 \
            -p 18000:18000 -p 18001:18001 rank20-surface-smoke)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          deadline=$((SECONDS+30))
          backend_ok=0
          frontend_ok=0
          while [ "$SECONDS" -lt "$deadline" ]; do
            if curl -fsS http://127.0.0.1:18000/api/health >/tmp/health.json; then backend_ok=1; fi
            if curl -fsS http://127.0.0.1:18001/ >/tmp/front.html; then frontend_ok=1; fi
            if [ "$backend_ok" -eq 1 ] && [ "$frontend_ok" -eq 1 ]; then break; fi
            sleep 1
          done
          test "$backend_ok" -eq 1
          test "$frontend_ok" -eq 1
          grep -q '"ok":true' /tmp/health.json
          grep -q 'id="root"' /tmp/front.html
          docker inspect "$cid" --format '{{.HostConfig.NanoCpus}} {{.HostConfig.Memory}}' | grep -q '^2000000000 8589934592$'

