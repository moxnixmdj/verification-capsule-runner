name: Verify synthesis scope activation v1
on:
  pull_request:
    branches: [main]
    paths:
      - "fixtures/synthesis_scope_certificate_v1.json"
      - "fixtures/synthesis_scope_certificate_activation_v1.json"
      - "fixtures/terminal_root_cause_state_for_synthesis_activation_v1.json"
      - "verify_synthesis_scope_activation_v1.py"
      - ".github/workflows/verify-synthesis-scope-activation-v1.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python verify_synthesis_scope_activation_v1.py
