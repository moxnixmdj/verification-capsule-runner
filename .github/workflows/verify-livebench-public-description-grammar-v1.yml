name: Verify LiveBench public description grammar V1

on:
  push:
    branches:
      - 'verify/livebench-public-description-grammar-v1-20261004-sol'
  pull_request:
    paths:
      - 'verification_inputs/ifbench_public_description_grammar_compiler_v1.py'
      - 'verification/verify_livebench_public_description_grammar_v1.py'
      - '.github/workflows/verify-livebench-public-description-grammar-v1.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Independently verify pinned public grammar frontier
        run: python verification/verify_livebench_public_description_grammar_v1.py
