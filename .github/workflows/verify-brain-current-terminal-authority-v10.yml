name: Verify Brain current terminal authority v10

on:
  pull_request:
    paths:
      - 'capsules/current_terminal_authority_v10/**'
      - '.github/workflows/verify-brain-current-terminal-authority-v10.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact mirrored Brain blob identities
        env:
          EXPECTED_JSON: '{"capsules/current_terminal_authority_v10/canonical/governance/CURRENT_TERMINAL_AUTHORITY_V1.json":"3f8705da36009fc444af185de8565f3576493f81","capsules/current_terminal_authority_v10/canonical/verification/OPUS55_ACCEPTANCE_CALIBRATION_AUDIT_20261002_V2.json":"aea96cc8321f6695f027c135bb8b1471ef27c038","capsules/current_terminal_authority_v10/canonical/verification/OPUS55_ACCEPTANCE_RESIDUAL_COMPILER_V2_VERDICT_20261002_V9.json":"b25b0ed71183dc9020687d3f529ff49a85edee14","capsules/current_terminal_authority_v10/canonical/governance/OPUS55_ACCEPTANCE_PREDICATE_EVIDENCE_BINDINGS_V2.json":"f26d250f86e7f2ce18d790e451fe09bbacecb694","capsules/current_terminal_authority_v10/canonical/verification/TB4_ATTAINABILITY_CUT_VERDICT_20261002_V1.json":"a7b0c692251b92819007c581b9fe84b75960cab7","capsules/current_terminal_authority_v10/canonical/governance/OPUS55_ACCEPTANCE_CALIBRATION_V2.json":"5d08347f09f9635715a56422aa8f602b708e1e4d","capsules/current_terminal_authority_v10/canonical/runtime/opus55_acceptance_calibration_reducer_v2.py":"73b0b27644e0fa0d89ff8fbdb51005c20eae3632","capsules/current_terminal_authority_v10/canonical/tests/test_opus55_acceptance_calibration_reducer_v2.py":"140ea97927113a4bbf95c7bda41bc25a33b09336","capsules/current_terminal_authority_v10/canonical/verification/TERMINAL_CLOSURE_BASIS_PUBLIC_RUNNER_VERIFICATION_20261002_V2.json":"07be2b7210ca349a07754755d3e4b93fc82fd424"}'
        run: |
          python - <<'PY'
          import json, os, subprocess
          expected=json.loads(os.environ["EXPECTED_JSON"])
          bad=[]
          for path,want in expected.items():
              got=subprocess.check_output(["git","hash-object",path],text=True).strip()
              if got!=want:
                  bad.append(f"{path}: {got} != {want}")
          if bad:
              raise SystemExit("\n".join(bad))
          print(f"EXACT_BLOB_IDENTITY_PASS {len(expected)}/{len(expected)}")
          PY
      - name: Verify authority agrees with calibration and residual receipts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("capsules/current_terminal_authority_v10")
          load=lambda p: json.loads((root/p).read_text())
          a=load(Path("canonical/governance/CURRENT_TERMINAL_AUTHORITY_V1.json"))
          c=load(Path("canonical/verification/OPUS55_ACCEPTANCE_CALIBRATION_AUDIT_20261002_V2.json"))
          r=load(Path("canonical/verification/OPUS55_ACCEPTANCE_RESIDUAL_COMPILER_V2_VERDICT_20261002_V9.json"))
          e=load(Path("canonical/governance/OPUS55_ACCEPTANCE_PREDICATE_EVIDENCE_BINDINGS_V2.json"))
          b=load(Path("canonical/verification/TERMINAL_CLOSURE_BASIS_PUBLIC_RUNNER_VERIFICATION_20261002_V2.json"))
          assert a["truth"]["opus55_acceptance"]=="3/19_PASS__16/19_OPEN"
          assert a["truth"]["achieved"] is False
          assert c["result"]["acceptance_calibrated_family_count"]==3
          assert c["result"]["acceptance_pending_family_count"]==16
          assert c["result"]["terminal_goal_acceptance_closed"] is False
          assert r["proved_predicate_count"]==8
          assert r["open_predicate_count"]==0
          assert r["blocked_predicate_count"]==30
          assert r["terminal_promotion_allowed"] is False
          assert e["saturation"]["proved_predicate_count"]==8
          assert e["saturation"]["unresolved_predicate_count"]==30
          f=a["atomic_acceptance_frontier"]
          assert (f["proved"],f["open_direct"],f["blocked"],f["total"])==(8,0,30,38)
          assert f["authorized_acceptance_case_actions"]==[]
          assert f["source"]=="canonical/verification/OPUS55_ACCEPTANCE_RESIDUAL_COMPILER_V2_VERDICT_20261002_V9.json"
          assert a["sources"]["acceptance_calibration"]["git_blob_sha"]=="aea96cc8321f6695f027c135bb8b1471ef27c038"
          assert a["sources"]["acceptance_residual_verdict_v9"]["git_blob_sha"]=="b25b0ed71183dc9020687d3f529ff49a85edee14"
          assert "INDEPENDENT_PUBLIC_RUNNER_PASS" in b["status"]
          assert sum(r["blocker_partition"].values())-r["blocker_partition"]["total"]==30
          print("CURRENT_TERMINAL_AUTHORITY_CROSS_RECEIPT_CONSISTENCY_PASS")
          PY
      - name: Verify TB4 remains hard revoked
        run: |
          python - <<'PY'
          import json
          p="capsules/current_terminal_authority_v10/canonical/verification/TB4_ATTAINABILITY_CUT_VERDICT_20261002_V1.json"
          x=json.load(open(p,encoding="utf-8"))["result"]
          assert x["upper_bound_successes"]==180
          assert x["required_successes"]==220
          assert x["attainability_state"]=="IMPOSSIBLE"
          assert x["reality_execution_authorized"] is False
          print("TB4_REVOCATION_PASS")
          PY
      - name: Verify calibration governance expected current result
        run: |
          python - <<'PY'
          import json
          p="capsules/current_terminal_authority_v10/canonical/governance/OPUS55_ACCEPTANCE_CALIBRATION_V2.json"
          x=json.load(open(p,encoding="utf-8"))["expected_current_result"]
          assert x["behavioral_pass_family_count"]==19
          assert x["acceptance_calibrated_family_count"]==3
          assert x["acceptance_pending_family_count"]==16
          assert x["newly_effective_family"]=="TOOL_DISCOVERY_SELECTION_AND_LEARNING"
          assert x["terminal_goal_acceptance_closed"] is False
          print("CALIBRATION_V2_EXPECTED_STATE_PASS")
          PY
