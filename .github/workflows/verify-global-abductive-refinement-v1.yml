name: Verify global abductive residual and target refinement v1
on:
  pull_request:
    paths:
      - "capsules/global_abductive_refinement_v1/**"
      - ".github/workflows/verify-global-abductive-refinement-v1.yml"
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Recompute abductive cut and verify target refinement
        run: python capsules/global_abductive_refinement_v1/verify.py
