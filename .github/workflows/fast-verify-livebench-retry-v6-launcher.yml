name: Fast verify LiveBench retry V6 launcher
on:
  push:
    branches:
      - "verify-fast/livebench-retry-v6-launcher-20261004"
    paths:
      - "VERIFY_LIVEBENCH_RETRY_V6_LAUNCHER"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.14"
      - run: python verify_livebench_retry_v6_launcher.py
