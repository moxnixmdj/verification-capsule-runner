name: Verify exact-current Brain CAD repair v2
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/verify-exact-current-brain-cad-v2.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify exact current Brain candidate blob
        run: test "$(git hash-object canonical/runtime/cad_t0_route_specific_candidate_v1.py)" = "aa32750b220a023617938b7be9476f6b3aac6704"
      - name: Install CAD verification dependencies
        run: python -m pip install --disable-pip-version-check --no-input "pydantic>=2,<3" "cadquery==2.6.1"
      - name: Run full eight-family and render-equivalence suite
        run: PYTHONPATH=.:canonical/runtime python -m unittest -v canonical.tests.test_cad_t0_route_specific_candidate_v1 canonical.tests.test_cad_t0_render_equivalent_antishortcut
