name: Verify Source Authority Binding ROR
on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact PR400 ROR blobs
        run: |
          set -euo pipefail
          test "$(git hash-object canonical/runtime/bound_capabilities/source_authority_binding_ror.py)" = "9396ff7169b274af9bbfbe736e004587631e3b05"
          test "$(git hash-object canonical/tests/test_source_authority_binding_ror.py)" = "91c8c88f5b1972b9324fe8d989a9e3a339580efd"
      - name: Run deterministic ROR regressions
        run: python canonical/tests/test_source_authority_binding_ror.py
      - name: Run fresh live cross-domain ROR qualification
        run: python verify_source_authority_binding_ror.py
      - name: Upload ROR qualification report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-authority-binding-ror-report
          path: source-authority-binding-ror-report.json
          if-no-files-found: error
