name: Qualify PR411 Delete Primary Source Gate
on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact PR411 frontend blob
        run: test "$(git hash-object canonical/runtime/bound_capabilities/open_research_source_frontend.py)" = "45d916650eeed8a5abf00a1934bdfb5b4304f3c4"
      - name: Syntax check exact frontend
        run: python -m py_compile canonical/runtime/bound_capabilities/open_research_source_frontend.py
      - name: Independently verify deletion-first gate semantics
        run: python verify_pr411_delete_primary_source_gate.py
      - name: Upload qualification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr411-delete-primary-source-gate-report
          path: pr411-delete-primary-source-gate-report.json
          if-no-files-found: error
