name: Verify Brain Root2 LiveBench IF Astra Adapter V1
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/root2_livebench_if_astra_adapter_v1/**"
      - "capsules/chartography_matcha_sample_preflight_v1/**"
      - ".github/workflows/verify-brain-root2-livebench-if-astra-adapter-v1.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact bytes and independent boundary semantics
        run: |
          cd capsules/root2_livebench_if_astra_adapter_v1
          python verify_independent.py
  chartography-matcha-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU inference dependencies
        run: python -m pip install torch==2.5.1 transformers==4.47.1 sentencepiece pillow
      - name: Run public sample preflight
        run: python capsules/chartography_matcha_sample_preflight_v1/run.py
