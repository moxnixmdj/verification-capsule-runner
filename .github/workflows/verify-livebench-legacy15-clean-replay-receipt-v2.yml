name: Verify LiveBench legacy15 clean replay receipt V2

on:
  push:
    branches:
      - verify/livebench-legacy15-joint-predecessor-v1
    paths:
      - verify_livebench_legacy15_joint_predecessor_v1.py
      - canonical/runtime/livebench_legacy_visible_constraint_compiler_v1.py
      - canonical/runtime/livebench_legacy_visible_constraint_compiler_v4.py
      - canonical/runtime/livebench_frozen_active_legacy15_v1.py
      - canonical/runtime/livebench_legacy15_composition_partition_v1.py
      - canonical/runtime/livebench_legacy15_joint_candidate_generator_v1.py
      - .github/workflows/verify-livebench-legacy15-clean-replay-receipt-v2.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact replay dependencies
        run: python -m pip install --disable-pip-version-check pyarrow==19.0.1 langdetect==1.0.9 immutabledict==4.2.1 nltk==3.9.1
      - name: Install exact NLTK data
        run: python -c "import nltk; nltk.download('punkt', quiet=True); nltk.download('punkt_tab', quiet=True)"
      - name: Run exact clean predecessor replay and capture output
        id: replay
        shell: bash
        run: |
          set +e
          python verify_livebench_legacy15_joint_predecessor_v1.py > livebench_legacy15_clean_replay_output.txt 2>&1
          code=$?
          cat livebench_legacy15_clean_replay_output.txt
          printf '%s\n' "$code" > livebench_legacy15_clean_replay_exit_code.txt
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Build content-addressed receipt
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          output = Path("livebench_legacy15_clean_replay_output.txt").read_text(encoding="utf-8")
          code = int(Path("livebench_legacy15_clean_replay_exit_code.txt").read_text().strip())
          receipt = {
              "schema": "PROJECT_BRAIN_LIVEBENCH_LEGACY15_CLEAN_PREDECESSOR_REPLAY_RECEIPT_V2",
              "status": "PASS" if code == 0 else "FAIL",
              "workflow_input_head_sha": os.environ["GITHUB_SHA"],
              "verifier_exit_code": code,
              "stdout_sha256": hashlib.sha256(output.encode()).hexdigest(),
              "stdout": output,
              "active_terminal_rows_read": 0,
              "incremental_spend_usd": 0,
              "acceptance_credit_delta": 0,
          }
          p = Path("verification_receipts/LIVEBENCH_LEGACY15_CLEAN_PREDECESSOR_REPLAY_V2.json")
          p.parent.mkdir(parents=True, exist_ok=True)
          p.write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
      - name: Commit verification receipt
        shell: bash
        run: |
          git config user.name "project-brain-verifier"
          git config user.email "project-brain-verifier@users.noreply.github.com"
          git add verification_receipts/LIVEBENCH_LEGACY15_CLEAN_PREDECESSOR_REPLAY_V2.json
          git commit -m "Record clean legacy15 predecessor replay receipt V2"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Enforce replay result
        shell: bash
        run: test "${{ steps.replay.outputs.exit_code }}" = "0"
