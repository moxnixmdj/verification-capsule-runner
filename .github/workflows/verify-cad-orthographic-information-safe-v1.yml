name: Verify information-safe orthographic CAD
on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/runtime/cad_orthographic_information_safe_candidate.py'
      - 'canonical/runtime/cad_orthographic_information_safe_proof.py'
      - 'canonical/tests/test_cad_orthographic_information_safe.py'
      - 'canonical/runtime/orthographic_visual_hull.py'
      - '.github/workflows/verify-cad-orthographic-information-safe-v1.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact Brain blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object canonical/runtime/cad_orthographic_information_safe_candidate.py)" = "4c73574cf1fcd75f154d6d267f11be486a265883"
          test "$(git hash-object canonical/runtime/cad_orthographic_information_safe_proof.py)" = "b6c8edd4fff837d4a5c8237f53d7613fe0e00276"
          test "$(git hash-object canonical/tests/test_cad_orthographic_information_safe.py)" = "d0b908d1552ac580e75f6d33abf928addcdb079f"
          test "$(git hash-object canonical/runtime/orthographic_visual_hull.py)" = "d102226cfde581cf3d7de97ec2e55862edf1c31b"
      - name: Install pinned oracle dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.1.3 scipy==1.14.1
      - name: Run bounded CAD proof
        run: python -m unittest -v canonical.tests.test_cad_orthographic_information_safe
