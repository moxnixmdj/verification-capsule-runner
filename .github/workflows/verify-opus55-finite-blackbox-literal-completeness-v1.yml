name: Verify Opus55 finite-blackbox literal completeness boundary

on:
  pull_request:
    branches: [main]
    paths:
      - "verify_opus55_finite_blackbox_literal_completeness_v1.py"
      - "subject/opus55_finite_blackbox_literal_completeness_v1/**"
      - ".github/workflows/verify-opus55-finite-blackbox-literal-completeness-v1.yml"
  push:
    branches: [main]
    paths:
      - "verify_opus55_finite_blackbox_literal_completeness_v1.py"
      - "subject/opus55_finite_blackbox_literal_completeness_v1/**"
      - ".github/workflows/verify-opus55-finite-blackbox-literal-completeness-v1.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Recompute exact finite-probe non-identifiability boundary
        run: python verify_opus55_finite_blackbox_literal_completeness_v1.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opus55-finite-blackbox-literal-completeness-v1
          path: opus55_finite_blackbox_literal_completeness_v1_receipt.json
          if-no-files-found: error
