name: LiveBench legacy predecessor compiler Sol v1

on:
  push:
    branches:
      - verify/livebench-legacy-predecessor-compiler-20261004-sol-v1
    paths:
      - verification/verify_livebench_legacy_predecessor_compiler_sol_v1.py
      - .github/workflows/verify-livebench-legacy-predecessor-compiler-sol-v1.yml

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parquet reader
        run: python -m pip install --disable-pip-version-check pyarrow
      - name: Independently replay removed predecessor
        run: python verification/verify_livebench_legacy_predecessor_compiler_sol_v1.py
      - name: Upload aggregate receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livebench-legacy-predecessor-compiler-sol-v1
          path: livebench_legacy_predecessor_compiler_replay_sol_v1.json
          if-no-files-found: error
          retention-days: 7
