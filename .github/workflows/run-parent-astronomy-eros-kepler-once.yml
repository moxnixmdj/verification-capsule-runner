name: Run Parent Astronomy Eros Kepler Once

on:
  pull_request:
    branches:
      - main
    paths:
      - ARM_PARENT_ASTRONOMY_EROS_KEPLER_REAL_TASK_20260930_V1

permissions:
  contents: read

jobs:
  execute-once:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Refresh Ubuntu package metadata
        run: sudo apt-get update
      - name: Execute frozen parent astronomy task exactly once
        id: parent_task
        continue-on-error: true
        run: python run_parent_astronomy_eros_kepler_once.py
      - name: Upload terminal parent-task evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parent-astronomy-eros-kepler-terminal-report
          path: parent-astronomy-eros-kepler-report.json
          if-no-files-found: error
      - name: Preserve semantic failure as failed workflow
        if: steps.parent_task.outcome != 'success'
        run: exit 1
