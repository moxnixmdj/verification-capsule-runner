name: Verify terminal V3 donor-deletion cleanroom
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/verify-terminal-v3-donor-deletion-cleanroom.yml'
permissions:
  contents: read
jobs:
  donor-deletion-cleanroom:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact frozen V3 carrier
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          req=json.loads(Path('terminal_runs/terminal_v3_wave/request.json').read_text())
          assert req['schema']=='PROJECT_BRAIN_TERMINAL_V3_ONE_SHOT_EXECUTION_REQUEST_V1'
          assert req['execution_snapshot_commit']=='821712c059b139f3494723dca6e8d0fc82ee59a4'
          assert req['package_commitment']=='5a347e796d124373b557424a51659e8bb69b854d09da0b407a5b30f109d9467a'
          assert req['canonical_beacon']=='36977020853'
          def git_blob(path):
              b=Path(path).read_bytes()
              return hashlib.sha1(b'blob '+str(len(b)).encode()+bytes([0])+b).hexdigest()
          for path,expected in req['closure_blobs'].items():
              assert Path(path).is_file(),('MISSING',path)
              assert git_blob(path)==expected,('DRIFT',path,expected,git_blob(path))
          assert len(req['closure_blobs'])==53
          print('DONOR_CLEANROOM_CARRIER_53_OF_53_EXACT')
          PY
      - name: Install frozen ordinary execution dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input \
            "pydantic>=2,<3" "cadquery==2.6.1" python-docx openpyxl python-pptx pypdf
      - name: Execute donor-denied identical qualification
        env:
          PYTHONPATH: .:canonical/runtime
        run: |
          set -euo pipefail
          mkdir -p donor_deletion_cleanroom/out
          sudo iptables-save > /tmp/iptables.before
          sudo ip6tables-save > /tmp/ip6tables.before || true
          restore_net() {
            sudo iptables-restore < /tmp/iptables.before || true
            if test -s /tmp/ip6tables.before; then sudo ip6tables-restore < /tmp/ip6tables.before || true; fi
          }
          trap restore_net EXIT
          sudo iptables -F OUTPUT
          sudo iptables -A OUTPUT -o lo -j ACCEPT
          sudo iptables -A OUTPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
          sudo iptables -P OUTPUT DROP
          if command -v ip6tables >/dev/null 2>&1; then
            sudo ip6tables -F OUTPUT || true
            sudo ip6tables -A OUTPUT -o lo -j ACCEPT || true
            sudo ip6tables -A OUTPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT || true
            sudo ip6tables -P OUTPUT DROP || true
          fi
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path

          banned = [
            'ANTHROPIC_API_KEY','OPENAI_API_KEY','GOOGLE_API_KEY','GEMINI_API_KEY',
            'GROQ_API_KEY','MISTRAL_API_KEY','COHERE_API_KEY','TOGETHER_API_KEY',
            'HF_TOKEN','HUGGINGFACE_TOKEN','AWS_ACCESS_KEY_ID','AWS_SECRET_ACCESS_KEY',
            'AZURE_OPENAI_API_KEY'
          ]
          present=[k for k in banned if os.environ.get(k)]
          assert not present,('PROVIDER_CREDENTIAL_PRESENT',present)

          from canonical.runtime import terminal_parent_portfolio_launcher_v1 as launcher

          commitment='5a347e796d124373b557424a51659e8bb69b854d09da0b407a5b30f109d9467a'
          beacon='36977020853'
          result=launcher.execute_wave(commitment=commitment,beacon=beacon,root=Path('.'))
          payload=json.dumps(result,sort_keys=True,separators=(',',':')).encode()
          got=hashlib.sha256(payload).hexdigest()
          expected='f4bec690aa0580cb532dbfd5985705bae8d153c9df31ffdf460b02f8b152e0f2'

          assert result.get('pass') is True, result
          assert result.get('terminal_result') is True, result
          assert result.get('no_case_replacement') is True
          assert result.get('no_tuning_replay') is True
          assert result.get('result_to_runtime_feedback_during_wave') is False
          assert got==expected,('DONOR_DELETION_RESULT_DRIFT',expected,got)

          receipt={
            'schema':'PROJECT_BRAIN_TERMINAL_V3_DONOR_DELETION_CLEANROOM_RECEIPT_V1',
            'date':'2026-10-02',
            'status':'PASS__DONOR_DENIED_IDENTICAL_FROZEN_QUALIFICATION__BEHAVIOR_PRESERVED',
            'execution_snapshot_commit':'821712c059b139f3494723dca6e8d0fc82ee59a4',
            'brain_candidate_hash':commitment,
            'donor_identity_and_hash':[],
            'donor_classification':'NO_TARGET_CAPABILITY_DONOR_REACHABLE_IN_FROZEN_TERMINAL_EXECUTION_ROUTE',
            'dependency_manifest':'canonical/governance/PREWAVE_BRAIN_ROUTE_DEPENDENCY_MANIFEST_V2.json',
            'network_denial_or_donor_unavailability_evidence':{
              'outbound_ipv4_policy':'DROP_EXCEPT_LOOPBACK_AND_ESTABLISHED',
              'outbound_ipv6_policy':'DROP_EXCEPT_LOOPBACK_AND_ESTABLISHED_WHEN_AVAILABLE',
              'provider_credentials_present':[],
              'workflow_permissions':'CONTENTS_READ_ONLY'
            },
            'predeletion_result':{
              'source':'canonical/verification/TERMINAL_V3_ONE_SHOT_WAVE_RESULT_20261002_V1.json',
              'full_result_sha256':expected,
              'pass':True
            },
            'postdeletion_result':{
              'full_result_sha256':got,
              'pass':True
            },
            'behavior_preserved':True,
            'byte_identical_terminal_result':True,
            'undeclared_dependency_count':0,
            'terminal_replay_credit_delta':0,
            'capability_credit_delta':0,
            'family_credit_delta':0,
            'incremental_spend_usd':0,
            'rule':'OWNERSHIP_EVIDENCE_ONLY__NO_NEW_TERMINAL_CAPABILITY_CREDIT__PASS_IFF_DONOR_DENIED_IDENTICAL_QUALIFICATION_PRESERVES_EXACT_RESULT_AND_UNDECLARED_DEPENDENCIES_ZERO'
          }
          Path('donor_deletion_cleanroom/out/receipt.json').write_text(json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          print('DONOR_DELETION_CLEANROOM_PASS '+got)
          PY
      - name: Upload donor-deletion cleanroom receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terminal-v3-donor-deletion-cleanroom
          path: donor_deletion_cleanroom/out/
          if-no-files-found: error
          retention-days: 90
