name: Verify tool discovery T2 T3 objective binding
on:
  pull_request:
    branches: [main]
    paths:
      - 'capsules/tool_discovery_t2_t3_objective/**'
      - '.github/workflows/verify-tool-discovery-t2-t3-objective-binding.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Bind exact Brain blobs
        run: |
          set -euo pipefail
          test "$(git hash-object capsules/tool_discovery_t2_t3_objective/canonical/governance/TOOL_DISCOVERY_T2_T3_OBJECTIVE_TERMINAL_BINDING_V1.json)" = "ee2e9c670cec9f2444e0849baa1625597ddd794b"
          test "$(git hash-object capsules/tool_discovery_t2_t3_objective/canonical/runtime/tool_discovery_t2_t3_objective_binding_validator.py)" = "3269341bba873ba241d89ec8f1be5ffbf87d71c2"
          test "$(git hash-object capsules/tool_discovery_t2_t3_objective/canonical/tests/test_tool_discovery_t2_t3_objective_binding_validator.py)" = "4f5cf6472e8f33c1a032fbe84b4fafce80dab278"
          test "$(git hash-object capsules/tool_discovery_t2_t3_objective/canonical/runtime/tool_discovery_information_safe_candidate.py)" = "64c02edd568d95ec5ed54b7b8122183ce5b82e17"
          test "$(git hash-object capsules/tool_discovery_t2_t3_objective/canonical/runtime/tool_discovery_information_safe_proof_v2.py)" = "5e8a953864e13ec76768c3e8920644107c65a644"
          test "$(git hash-object capsules/tool_discovery_t2_t3_objective/canonical/runtime/tool_discovery_information_safe_proof.py)" = "2450a9644119c9fdf9c43307a1d115098d6ba592"
          test "$(git hash-object capsules/tool_discovery_t2_t3_objective/canonical/governance/OUTER_TERMINAL_MULTIPLEX_PORTFOLIOS_V1.json)" = "7c49e3a44dc9a827e84a12b572ea6b8e9b2fa1f5"
          test "$(git hash-object capsules/tool_discovery_t2_t3_objective/canonical/governance/BEHAVIORAL_CONTRACT_REGISTRY_V1.json)" = "afa00109031d638fef32cc3fe10be18786605c39"
          test "$(git hash-object capsules/tool_discovery_t2_t3_objective/canonical/governance/GLOBAL_TERMINAL_SELECTION_KERNEL_V1.json)" = "669afcde50302e76c1b0a1f6b186aaafa8730515"
      - name: Compile exact validator
        run: python -m py_compile capsules/tool_discovery_t2_t3_objective/canonical/runtime/tool_discovery_t2_t3_objective_binding_validator.py
      - name: Verify frozen tool-discovery objective route
        run: cd capsules/tool_discovery_t2_t3_objective/ && PYTHONPATH=. python -m unittest -v canonical.tests.test_tool_discovery_t2_t3_objective_binding_validator
