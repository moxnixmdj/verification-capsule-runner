name: Guarded Brain PR474 Broad Routing Qualification
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - pr474_snapshot/**
      - verify_brain_pr474_independent.py
      - generate_guarded_pr474_broad_routing_plan.py
      - .github/workflows/guarded-brain-pr474-broad-routing-qualification.yml
permissions:
  contents: write
jobs:
  qualify:
    if: github.head_ref == 'verify/brain-pr474-corrected-broad-routing-20260930-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Exact-byte prestart
        run: |
          set -euo pipefail
          test "$(git hash-object pr474_snapshot/canonical/runtime/bound_capabilities/broad_objective_decompose.py)" = "1efaec4ba51ecb5c40072b3190853f4de89d8f77"
          test "$(git hash-object pr474_snapshot/canonical/runtime/bound_capabilities/plain_goal_bound_grounding.py)" = "46e8e7466479ea298c34e5fa682d49c374510ce9"
          test "$(git hash-object pr474_snapshot/canonical/tests/test_broad_objective_semantic_decomposition.py)" = "2df7c6ec85083458a69675f6ff86eca9c00ea278"
          test "$(git hash-object verify_brain_pr474_independent.py)" = "a7962066b657c7ccfc94ba97e6eb520dd0bd1b4c"
          python -m py_compile pr474_snapshot/canonical/runtime/bound_capabilities/broad_objective_decompose.py pr474_snapshot/canonical/runtime/bound_capabilities/plain_goal_bound_grounding.py verify_brain_pr474_independent.py generate_guarded_pr474_broad_routing_plan.py
      - name: Generate frozen guarded plan
        run: python generate_guarded_pr474_broad_routing_plan.py
      - name: Atomically admit and qualify exact PR474 bytes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python execution_guard/github_actions_guarded_run_live.py --plan guarded_pr474_broad_routing_plan.json --receipt guarded-pr474-broad-routing-admission.json
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: guarded-pr474-broad-routing-qualification
          path: |
            guarded-pr474-broad-routing-admission.json
            guarded_pr474_broad_routing_plan.json
            pr474-independent-oracle-report.json
          if-no-files-found: warn
