name: Verify Finance Index floor final activation
on:
  push:
    branches:
      - verify/finance-index-floor-final-20261004-v1
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact Brain inputs
        run: |
          test "$(git hash-object verification_inputs/finance_floor_final_activation.json)" = "84b4f4bd074d36774e7a6703a8e955f9555bfe7b"
          test "$(git hash-object verification_inputs/finance_floor_activation_receipt.json)" = "29954b415f94b4cae9857607326e1a656a63f706"
          test "$(git hash-object verification_inputs/finance_floor_receipt.json)" = "4b34bdca9c990a8bacdca78b2a1c6f9ae0170c3b"
      - name: Verify final Finance floor scheduling activation
        run: python verify_finance_index_floor_final_activation_v1.py
