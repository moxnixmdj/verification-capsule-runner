name: Verify LiveBench official population identity firewall V1
on:
  pull_request:
    branches: [main]
    paths:
      - "subject/livebench_official_population_identity_firewall_v1/**"
      - "verify_livebench_official_population_identity_firewall_v1.py"
      - ".github/workflows/verify-livebench-official-population-identity-firewall-v1.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python verify_livebench_official_population_identity_firewall_v1.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livebench-official-population-identity-firewall-v1-receipt
          path: livebench_official_population_identity_firewall_v1_receipt.json
          if-no-files-found: error
