name: Audit LiveBench legacy pair conjunction solver

on:
  push:
    branches:
      - verify/livebench-legacy-pair-conjunction-sol-20261004
  pull_request:
    paths:
      - verify_livebench_legacy_pair_conjunction.py
      - .github/workflows/verify_livebench_legacy_pair_conjunction.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check langdetect==1.0.9 nltk==3.9.1
      - run: python verify_livebench_legacy_pair_conjunction.py
      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livebench-legacy-pair-conjunction-receipt
          path: livebench_legacy_pair_conjunction_receipt.json
          if-no-files-found: error
