name: Verify global residual proof compiler

on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/runtime/global_residual_proof_compiler.py'
      - 'canonical/runtime/terminal_proof_supercompiler.py'
      - 'canonical/tests/test_global_residual_proof_compiler.py'
      - 'canonical/governance/GLOBAL_RESIDUAL_PROOF_COMPILER_LIVE_INPUT_V1.json'
      - '.github/workflows/verify-global-residual-proof-compiler.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Bind exact Brain blobs
        run: |
          set -euo pipefail
          test "$(git hash-object canonical/runtime/global_residual_proof_compiler.py)" = "49719238fcaee0ea3cc5dab4a5cd220f440ce2cf"
          test "$(git hash-object canonical/runtime/terminal_proof_supercompiler.py)" = "c7a4b8bc29d041fcc04fbcfa8a79db44fa9fe370"
          test "$(git hash-object canonical/tests/test_global_residual_proof_compiler.py)" = "8d6b063b1c92c03eaf45161ec65fa00b41c1268d"
          test "$(git hash-object canonical/governance/GLOBAL_RESIDUAL_PROOF_COMPILER_LIVE_INPUT_V1.json)" = "5584fbcbfb3f3327b3d706a4ef50034d5d5ada5c"
      - name: Compile
        run: |
          python -m py_compile canonical/runtime/global_residual_proof_compiler.py
          python -m py_compile canonical/runtime/terminal_proof_supercompiler.py
      - name: Verify residual partition and fail-closed semantics
        run: PYTHONPATH=. python -m unittest -v canonical.tests.test_global_residual_proof_compiler

      - name: Compile live seven-obligation residual
        run: |
          set -euo pipefail
          python canonical/runtime/global_residual_proof_compiler.py canonical/governance/GLOBAL_RESIDUAL_PROOF_COMPILER_LIVE_INPUT_V1.json > /tmp/global-residual.json
          python - <<'PY'
          import json
          p=json.load(open("/tmp/global-residual.json"))
          assert p["status"] == "GLOBAL_RESIDUAL_PARTITION_FOUND", p
          assert p["internally_coverable_obligations"] == [
              "EVIDENCE_TO_AUDIENCE_SYNTHESIS_001",
              "TRAJECTORY_CRITICAL_FAILURE_LOCALIZATION_001",
          ], p
          cut=p["minimum_internal_unblock_cut"]
          assert cut["blocker_ids"] == [
              "P1_SCOPE_EQUIVALENCE",
              "P1_TERMINAL_BINDING",
              "P3_SCOPE_EQUIVALENCE",
              "P3_TERMINAL_BINDING",
          ], p
          assert cut["new_reality_units"] == 0, p
          assert len(p["residual_obligations"]) == 5, p
          assert p["execution_authority"] is False, p
          assert p["capability_credit_delta"] == 0, p
          PY
