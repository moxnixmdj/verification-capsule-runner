name: Verify global residual proof compiler

on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/runtime/global_residual_proof_compiler.py'
      - 'canonical/runtime/terminal_proof_supercompiler.py'
      - 'canonical/tests/test_global_residual_proof_compiler.py'
      - '.github/workflows/verify-global-residual-proof-compiler.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Bind exact Brain blobs
        run: |
          set -euo pipefail
          test "$(git hash-object canonical/runtime/global_residual_proof_compiler.py)" = "49719238fcaee0ea3cc5dab4a5cd220f440ce2cf"
          test "$(git hash-object canonical/runtime/terminal_proof_supercompiler.py)" = "c7a4b8bc29d041fcc04fbcfa8a79db44fa9fe370"
          test "$(git hash-object canonical/tests/test_global_residual_proof_compiler.py)" = "8d6b063b1c92c03eaf45161ec65fa00b41c1268d"
      - name: Compile
        run: |
          python -m py_compile canonical/runtime/global_residual_proof_compiler.py
          python -m py_compile canonical/runtime/terminal_proof_supercompiler.py
      - name: Verify residual partition and fail-closed semantics
        run: PYTHONPATH=. python -m unittest -v canonical.tests.test_global_residual_proof_compiler
