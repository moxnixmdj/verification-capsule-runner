name: Verify Chartography Brain Inspect adapter V1
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/chartography_brain_inspect_adapter_v1/**"
      - ".github/workflows/verify-chartography-brain-inspect-adapter-v1.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Inspect
        run: python -m pip install --disable-pip-version-check --no-cache-dir "inspect-ai==0.3.276"
      - name: Verify adapter
        run: |
          cd capsules/chartography_brain_inspect_adapter_v1
          python verify.py
