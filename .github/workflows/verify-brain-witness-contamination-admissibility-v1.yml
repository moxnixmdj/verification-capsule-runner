name: Verify Brain witness contamination admissibility v1

on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/brain_witness_contamination_admissibility_v1/**"
      - ".github/workflows/verify-brain-witness-contamination-admissibility-v1.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact contamination-admissibility dependency cone
        run: |
          cd capsules/brain_witness_contamination_admissibility_v1
          export PYTHONPATH=.
          python -m py_compile canonical/runtime/brain_witness_contamination_admissibility_v1.py
          python -m unittest canonical.tests.test_brain_witness_contamination_admissibility_v1 -v
          python canonical/runtime/brain_witness_contamination_admissibility_v1.py
