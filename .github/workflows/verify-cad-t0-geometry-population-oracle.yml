name: Verify CAD T0 geometry population and oracle
on:
  pull_request:
    branches: [main]
    paths:
      - 'independent/cad_t0_geometry_population.py'
      - 'independent/cad_t0_oracle_adapter.py'
      - 'test_cad_t0_geometry_population_and_oracle.py'
      - '.github/workflows/verify-cad-t0-geometry-population-oracle.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Bind exact Brain blobs
        run: |
          set -euo pipefail
          test "$(git hash-object independent/cad_t0_geometry_population.py)" = "64ca276410e2c1dbcd55cfad057e3eec0709790a"
          test "$(git hash-object independent/cad_t0_oracle_adapter.py)" = "a6e76e1865b9bd9829dbbcf38886486636f76e8a"
          test "$(git hash-object test_cad_t0_geometry_population_and_oracle.py)" = "ea98ceda53c8e4a09d72b19bcb4aaaf5874098a5"
      - name: Compile
        run: |
          python -m py_compile independent/cad_t0_geometry_population.py
          python -m py_compile independent/cad_t0_oracle_adapter.py
          python -m py_compile test_cad_t0_geometry_population_and_oracle.py
      - name: Run independent fail-closed tests
        run: PYTHONPATH=independent python -m unittest -v test_cad_t0_geometry_population_and_oracle.py
