name: Verify GDPval-AA v2.1 public reproducibility boundary

on:
  push:
    paths:
      - ".github/workflows/verify-gdpval-aa-v21-public-boundary.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Verify Artificial Analysis primary methodology
        run: |
          python - <<'PY'
          import urllib.request
          def get(url):
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
              return " ".join(urllib.request.urlopen(req,timeout=30).read().decode("utf-8","ignore").split())
          t=get("https://artificialanalysis.ai/methodology/intelligence-benchmarking")
          e=get("https://artificialanalysis.ai/evaluations/gdpval-aa")
          low=t.lower()
          elow=e.lower()
          required=[
            "gdpval-aa v2.1",
            "220 tasks",
            "pairwise comparison",
            "crowd-bt",
            "deepseek v4.1 flash",
            "1600",
            "stirrup",
          ]
          missing=[x for x in required if x not in low]
          assert not missing, missing
          assert "all evaluations are conducted independently by artificial analysis" in elow
          assert "judge sampled from a panel of three" in low
          assert "fitted on past gdpval-aa judgements" in low or "fitted on past gdpval-aa judgments" in low
          print("GDPVAL_AA_V21_PRIMARY_BOUNDARY_PASS")
          PY
      - name: Verify Stirrup is public harness source
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/ArtificialAnalysis/Stirrup.git /tmp/stirrup
          git -C /tmp/stirrup rev-parse HEAD
          test -s /tmp/stirrup/README.md
          echo GDPVAL_STIRRUP_PUBLIC_HARNESS_PRESENT
