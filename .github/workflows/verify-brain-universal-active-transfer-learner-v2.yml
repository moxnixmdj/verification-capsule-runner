name: Verify Brain universal active transfer learner V2
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/universal_active_transfer_learner_v2/**"
      - ".github/workflows/verify-brain-universal-active-transfer-learner-v2.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile V2 kernel
        run: |
          cd capsules/universal_active_transfer_learner_v2
          python -m py_compile canonical/runtime/universal_active_transfer_learner_v2.py
      - name: Run copied Brain V2 tests
        run: |
          cd capsules/universal_active_transfer_learner_v2
          export PYTHONPATH=.
          python -m unittest canonical.tests.test_universal_active_transfer_learner_v2 -v
      - name: Run independent adversarial verifier
        run: |
          cd capsules/universal_active_transfer_learner_v2
          export PYTHONPATH=.
          python verify_v2.py
