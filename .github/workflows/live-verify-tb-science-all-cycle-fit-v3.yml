name: Live verify TB-Science all-cycle fit V3

on:
  push:
    branches: ["repair/tb-science-all-cycle-fit-20261009-v1"]
    paths:
      - ".github/workflows/live-verify-tb-science-all-cycle-fit-v3.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      C: capsules/tb_science_rank15_20261009_v1
      MODEL_FILE: Qwen3.5-9B-M-TS-Q4_K_M.gguf
      MODEL_SHA256: f41c0a0c0e43bf721fb2da29374cd1a97271bac0bab08a9dc42964525e82350c
      LLAMA_CPP_REV: bec4772f6a2527d371557b5d2032641e5ff7619c
      RELEASE_TAG: brain-capability-qwen35-9b-m-exact-v1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bind exact V3 bytes and zero-exposure scope
        run: |
          set -euo pipefail
          test "$(git hash-object "$C/canonical/runtime/harbor_science_planner_v3.py")" = "fb5c12ff1607b45f2ccd7060b41308ba560cc554"
          test "$(git hash-object "$C/canonical/runtime/harbor_science_agent_v3.py")" = "66ff927e9e0c69b1904411d7f5533ca866f8a1d9"
          test ! -e "$C/ACTIVATE_RANK15_V3_PR.json"
          test ! -e "$C/ACTIVATE_RANK15_V2_PR.json"

      - name: Clean-build exact llama.cpp on this runner
        run: |
          set -euo pipefail
          rm -rf llama.cpp
          git init llama.cpp
          git -C llama.cpp remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C llama.cpp fetch --depth 1 origin "$LLAMA_CPP_REV"
          git -C llama.cpp checkout --detach FETCH_HEAD
          test "$(git -C llama.cpp rev-parse HEAD)" = "$LLAMA_CPP_REV"
          cmake -S llama.cpp -B llama.cpp/build -DGGML_CUDA=OFF -DLLAMA_CURL=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build llama.cpp/build -j 2 --target llama-server
          test -x llama.cpp/build/bin/llama-server

      - name: Restore exact Qwen model cache
        uses: actions/cache/restore@v4
        with:
          path: models/Qwen3.5-9B-M-TS-Q4_K_M.gguf
          key: brain-qwen35-9b-f41c0a0c0e43bf721fb2da29374cd1a97271bac0bab08a9dc42964525e82350c

      - name: Restore exact Qwen bytes on cache miss or corruption
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MODEL="models/$MODEL_FILE"
          mkdir -p models
          if [ -f "$MODEL" ] && echo "$MODEL_SHA256  $MODEL" | sha256sum -c - >/dev/null 2>&1; then
            :
          else
            rm -f "$MODEL"
            rm -rf model-parts
            mkdir -p model-parts
            gh release download "$RELEASE_TAG"               --repo "$GITHUB_REPOSITORY"               --dir model-parts               --pattern "$MODEL_FILE.part*of03"
            cat               "model-parts/$MODEL_FILE.part01of03"               "model-parts/$MODEL_FILE.part02of03"               "model-parts/$MODEL_FILE.part03of03" > "$MODEL"
          fi
          echo "$MODEL_SHA256  $MODEL" | sha256sum -c -

      - name: Start exact 16K local cognition endpoint
        run: |
          set -euo pipefail
          EXTRA=()
          if llama.cpp/build/bin/llama-server --help 2>&1 | grep -q -- '--reasoning'; then EXTRA+=(--reasoning off); fi
          nohup llama.cpp/build/bin/llama-server             -m "models/$MODEL_FILE" --alias brain-qwen3.5-9b             --host 127.0.0.1 --port 8080 -c 16384 -t 4 --parallel 1 --jinja --no-webui             "${EXTRA[@]}" > LOCAL_QWEN_SERVER.log 2>&1 &
          echo $! > LOCAL_QWEN_SERVER.pid
          ok=0
          for i in $(seq 1 240); do
            if curl -fsS http://127.0.0.1:8080/health > LOCAL_QWEN_HEALTH.json 2>/dev/null; then ok=1; break; fi
            if ! kill -0 "$(cat LOCAL_QWEN_SERVER.pid)" 2>/dev/null; then
              cat LOCAL_QWEN_SERVER.log
              exit 1
            fi
            sleep 1
          done
          test "$ok" = 1
          grep -Eq "n_ctx_slot = 16384|n_ctx_slot = 16[0-9]{3}" LOCAL_QWEN_SERVER.log

      - name: Exact-token maximal-state and dynamic evidence qualification
        env:
          PYTHONPATH: ${{ github.workspace }}/capsules/tb_science_rank15_20261009_v1
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,pathlib,time
          from canonical.runtime import harbor_science_agent_v3 as agent
          from canonical.runtime import harbor_science_planner_v3 as planner

          logical="a"*64
          goal="Synthetic zero-benchmark all-cycle context qualification. No benchmark task exists."
          summary={"ordered_manifest_sha256":"b"*64}
          requirements=[]
          for i in range(agent.MAX_REQUIREMENTS):
              prefix=f"REQ{i:02d}."
              requirements.append(prefix+"X"*(64-len(prefix)))

          catalog=[]
          for i in range(128):
              catalog.append({
                  "ref":hashlib.sha256(f"synthetic-evidence-{i}".encode()).hexdigest(),
                  "kind":"K"*64,
                  "cycle":i%agent.MAX_CYCLES,
                  "action_id":("A"+str(i).zfill(15))[-agent.EVIDENCE_ACTION_ID_PREVIEW_CHARS:],
                  "returncode":255,
                  "coverage_promoted":bool(i%2),
              })

          store={}
          maximal_prompt,maximal=agent.build_fitting_science_planner_prompt(
              goal=goal,
              requirements=requirements,
              unresolved=requirements,
              raw_task_prompt_summary=summary,
              declared_inputs=[],
              brain_deliverables={},
              evidence_store=store,
              evidence_catalog=catalog,
              requested_refs=[],
              logical_attempt_id=logical,
              cycle=agent.MAX_CYCLES-1,
          )
          conservative=maximal["input_tokens"]+2304
          assert conservative <= planner.SERVER_CONTEXT_TOKENS-planner.MAX_TOOL_COMPLETION_TOKENS, (maximal,conservative)

          small=agent._put_evidence(store,{"kind":"small","text":"synthetic-ok"})
          huge=agent._put_evidence(store,{"kind":"huge","text":"Z"*40000})
          packed_prompt,packed=agent.build_fitting_science_planner_prompt(
              goal=goal,
              requirements=requirements,
              unresolved=requirements,
              raw_task_prompt_summary=summary,
              declared_inputs=[],
              brain_deliverables={},
              evidence_store=store,
              evidence_catalog=catalog,
              requested_refs=[small,huge],
              logical_attempt_id=logical,
              cycle=agent.MAX_CYCLES-1,
          )
          assert packed["input_tokens"] <= packed["maximum_input_tokens"], packed
          assert small in packed["included_evidence_refs"], packed
          assert huge in packed["deferred_evidence_refs"], packed

          started=time.monotonic()
          out=planner.plan(
              maximal_prompt,
              logical_attempt_id=logical,
              cycle=agent.MAX_CYCLES-1,
              timeout_s=300,
          )
          proposal=planner.extract_json_object(out["text"])
          assert isinstance(proposal.get("material_requirements"),list),proposal
          receipt={
              "schema":"PROJECT_BRAIN_TB_SCIENCE_ALL_CYCLE_FIT_V3_LIVE_VERIFICATION",
              "status":"PASS__EXACT_16K_TOKENIZER_MAXIMAL_FIXED_STATE__DYNAMIC_EVIDENCE_DEFER__LIVE_V3_TOOL_CALL__ZERO_EXPOSURE",
              "maximal_fixed_state_input_tokens":maximal["input_tokens"],
              "structural_token_variance_reserve":2304,
              "conservative_fixed_state_tokens":conservative,
              "reserved_completion_tokens":planner.MAX_TOOL_COMPLETION_TOKENS,
              "server_context_tokens":planner.SERVER_CONTEXT_TOKENS,
              "packed_dynamic_input_tokens":packed["input_tokens"],
              "included_small_evidence":small in packed["included_evidence_refs"],
              "deferred_oversize_evidence":huge in packed["deferred_evidence_refs"],
              "live_planner_input_tokens":out["input_tokens"],
              "live_planner_context_headroom_tokens":out["context_headroom_tokens"],
              "live_planner_duration_s":out["duration_s"],
              "wall_duration_s":round(time.monotonic()-started,3),
              "payload_sha256":out["payload_sha256"],
              "request_identity_sha256":out["request_identity_sha256"],
              "benchmark_task_exposure":0,
              "benchmark_trials_executed":0,
              "execution_authority":False,
              "incremental_spend_usd":0,
              "terminal_credit_delta":0,
          }
          pathlib.Path("ALL_CYCLE_FIT_V3_LIVE_VERIFY.json").write_text(json.dumps(receipt,indent=2,sort_keys=True)+"\n")
          print(json.dumps(receipt,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tb-science-all-cycle-fit-v3-live
          path: |
            ALL_CYCLE_FIT_V3_LIVE_VERIFY.json
            LOCAL_QWEN_HEALTH.json
            LOCAL_QWEN_SERVER.log
          if-no-files-found: warn
          retention-days: 7
