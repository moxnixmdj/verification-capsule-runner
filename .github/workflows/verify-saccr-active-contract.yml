name: Verify SA-CCR active-contract route
on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/runtime/saccr_active_contract_proof_v1.py'
      - 'canonical/runtime/saccr_active_contract_candidate_v1.py'
      - 'canonical/runtime/saccr_credit_kernel.py'
      - 'canonical/tests/test_saccr_active_contract_proof_v1.py'
      - '.github/workflows/verify-saccr-active-contract.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run frozen preflight tests
        run: PYTHONPATH=. python -m unittest -v canonical.tests.test_saccr_active_contract_proof_v1
      - name: Run fresh 2048-case intermediate-lineage grid
        env:
          PROJECT_BRAIN_POST_FREEZE_SEED: ${{ github.run_id }}
        run: |
          PYTHONPATH=. python - <<'PY'
          import os, random
          from canonical.runtime.saccr_active_contract_proof_v1 import generate_case, public_task, score_case
          from canonical.runtime.saccr_active_contract_candidate_v1 import solve
          root=int(os.environ["PROJECT_BRAIN_POST_FREEZE_SEED"])
          rng=random.Random(root)
          failures=[]
          for i in range(2048):
              seed=rng.randrange(1,2**31)
              case=generate_case(seed)
              public=public_task(case)
              if "_oracle" in public:
                  failures.append((i,seed,"ORACLE_LEAK"))
                  continue
              out=solve(public)
              verdict=score_case(case,out)
              if not verdict.get("pass"):
                  failures.append((i,seed,verdict))
          print({"root_seed":root,"cases":2048,"failure_count":len(failures),"failures":failures[:20]})
          if failures:
              raise SystemExit(1)
          PY
