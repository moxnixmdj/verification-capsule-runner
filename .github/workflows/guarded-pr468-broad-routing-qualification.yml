name: Guarded PR468 Broad Research Routing Qualification
# synchronization trigger: exact qualification bytes unchanged
on:
  pull_request:
    branches: [main]
    paths:
      - canonical/runtime/bound_capabilities/broad_objective_decompose.py
      - canonical/runtime/bound_capabilities/plain_goal_bound_grounding.py
      - canonical/tests/test_broad_objective_semantic_decomposition.py
      - verify_pr468_broad_objective_routing.py
      - pr468_broad_routing_qualification_authorization.json
      - guarded_pr468_broad_routing_plan.json
      - .github/workflows/guarded-pr468-broad-routing-qualification.yml
permissions:
  contents: write
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Atomically admit once, then qualify exact generic routing bytes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python execution_guard/github_actions_guarded_run_live.py --plan guarded_pr468_broad_routing_plan.json --receipt guarded-pr468-broad-routing-admission.json
      - name: Upload guarded routing qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: guarded-pr468-broad-routing-qualification
          path: |
            guarded-pr468-broad-routing-admission.json
            guarded_pr468_broad_routing_plan.json
            pr468_broad_routing_qualification_authorization.json
            pr468-broad-routing-independent-report.json
          if-no-files-found: warn
