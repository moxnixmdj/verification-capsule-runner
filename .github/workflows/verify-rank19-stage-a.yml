name: Verify rank19 Stage A admission
on:
  pull_request:
    branches: [main]
    paths:
      - 'verification/rank19_stage_a/**'
      - '.github/workflows/verify-rank19-stage-a.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run exact Brain Stage-A reducer on pinned rank19 evidence
        run: |
          python verification/rank19_stage_a/canonical/runtime/prequalification_stage_a_reducer_v2.py verification/rank19_stage_a \
            --task satb-audio-transcription --rank 19 \
            --ledger canonical/capabilities/opus55/SATB_AUDIO_TRANSCRIPTION_RANK19_CONTAMINATION_LEDGER_V1.json
      - name: Negative instruction exposure mutation must fail closed
        run: |
          python - <<'PY'
          import json,pathlib,subprocess,tempfile,shutil
          src=pathlib.Path("verification/rank19_stage_a")
          with tempfile.TemporaryDirectory() as d:
              dst=pathlib.Path(d)/"bundle"; shutil.copytree(src,dst)
              p=dst/"canonical/capabilities/opus55/SATB_AUDIO_TRANSCRIPTION_RANK19_CONTAMINATION_LEDGER_V1.json"
              o=json.loads(p.read_text()); o["instruction_read"]=True; o["state"]="INSTRUCTION_EXPOSED"
              p.write_text(json.dumps(o))
              cp=subprocess.run(["python",str(dst/"canonical/runtime/prequalification_stage_a_reducer_v2.py"),str(dst),
                  "--task","satb-audio-transcription","--rank","19",
                  "--ledger","canonical/capabilities/opus55/SATB_AUDIO_TRANSCRIPTION_RANK19_CONTAMINATION_LEDGER_V1.json"])
              if cp.returncode==0: raise SystemExit("contaminated rank19 ledger incorrectly passed")
          print("negative instruction exposure rejected")
          PY
