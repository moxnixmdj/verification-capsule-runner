name: Verify TB-Science rank14 V11 runtime closure
on:
  push:
    branches:
      - verify-tbscience-r14-planner-manifest-summary-v1
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recompute exact transitive closure
        env:
          C: capsules/tb_science_rank14_20261009_v1
        run: |
          set -euo pipefail
          test "$(git hash-object "$C/canonical/runtime/harbor_science_agent_v1.py")" = "d397324f411d002bdbdca348aaad708b5b40c9c2"
          python "$C/canonical/runtime/python_transitive_runtime_closure_v1.py" --repo-root "$C" --carrier-root "$C" \
            --root canonical/runtime/harbor_science_agent_v1.py \
            --root canonical/runtime/harbor_science_planner_v1.py \
            --root canonical/runtime/lossless_raw_task_contract_v1.py \
            --root canonical/runtime/raw_task_acceptance_residual_localizer_v1.py > V11_CLOSURE_RAW.json
          python - <<'PY'
          import json,hashlib,pathlib
          raw=json.load(open("V11_CLOSURE_RAW.json"))
          assert raw["pass"] is True,raw
          c=raw["closure"]
          assert c["closure_file_count"]==15,c
          assert c["missing_paths"]==[],c
          assert c["mismatched_paths"]==[],c
          assert c["unresolved_dynamic_imports"]==[],c
          rows=c["closure"]
          by={x["path"]:x["git_blob_sha"] for x in rows}
          assert by["canonical/runtime/harbor_science_agent_v1.py"]=="d397324f411d002bdbdca348aaad708b5b40c9c2"
          out={
            "schema":"PROJECT_BRAIN_TB_SCIENCE_TRANSITIVE_RUNTIME_CLOSURE_V11_PUBLIC_VERIFY_V1",
            "status":"PASS__V11_15_FILE_TRANSITIVE_CLOSURE_EXACT__PLANNER_MANIFEST_SUMMARY_REPAIR__ZERO_EXPOSURE",
            "pass":True,
            "closure_file_count":15,
            "agent_blob":"d397324f411d002bdbdca348aaad708b5b40c9c2",
            "missing_paths":0,
            "mismatched_paths":0,
            "unresolved_dynamic_imports":0,
            "closure_rows":rows,
            "benchmark_task_exposure":0,
            "benchmark_trials_executed":0,
            "acceptance_credit_delta":0,
            "terminal_credit_delta":0
          }
          pathlib.Path("V11_CLOSURE_VERIFY.json").write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
          print(json.dumps(out,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tbscience-rank14-v11-closure
          path: |
            V11_CLOSURE_RAW.json
            V11_CLOSURE_VERIFY.json
          retention-days: 2
