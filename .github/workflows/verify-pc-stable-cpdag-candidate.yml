name: Verify Brain PC-Stable CPDAG candidate
on:
  pull_request:
    branches: [main]
    paths:
      - 'verification/pc_stable_cpdag_candidate.py'
      - 'verification/brain_pc_stable_skeleton_reference.py'
      - 'verification/test_pc_stable_cpdag_candidate.py'
      - '.github/workflows/verify-pc-stable-cpdag-candidate.yml'
permissions:
  contents: read
jobs:
  differential:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install verification dependencies and pinned donor
        run: |
          python -m pip install --disable-pip-version-check --quiet numpy networkx pandas scipy scikit-learn matplotlib
          python -m pip install --disable-pip-version-check --quiet "git+https://github.com/benovamurat/causal-discovery-pc.git@efc99e13dcc4a0f1e731ba46f5a0a20d75f4937b"
      - name: Syntax check
        run: python -m py_compile verification/pc_stable_cpdag_candidate.py verification/brain_pc_stable_skeleton_reference.py
      - name: Run fresh differential
        run: python -m unittest -v verification.test_pc_stable_cpdag_candidate
