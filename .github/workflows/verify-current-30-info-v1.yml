name: Verify current 30-predicate information dominance v1

on:
  push:
    branches: ["verify/current-30-info-v1-20261003-sol"]
    paths:
      - ".github/workflows/verify-current-30-info-v1.yml"
      - "capsules/current_30_info_v1/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/verify-current-30-info-v1.yml"
      - "capsules/current_30_info_v1/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bind exact Brain bytes
        run: |
          set -euo pipefail
          C=capsules/current_30_info_v1
          test "$(git hash-object "$C/canonical/runtime/current_terminal_information_dominance_v1.py")" = "ca26bec475d66a73bded1e51ea681a9823ea9e18"
          test "$(git hash-object "$C/canonical/tests/test_current_terminal_information_dominance_v1.py")" = "e7e0e98d96b33e9148a5f6e87860ab5a9bd484ff"
          test "$(git hash-object "$C/canonical/governance/CURRENT_TERMINAL_INFORMATION_DOMINANCE_V1.json")" = "701a1c6a26e30b1217ccc73c7e8c516f3a87a628"
          test "$(git hash-object "$C/canonical/runtime/current_terminal_scheduling_world_v1.py")" = "d07f6777a7b6a0fa932f2003df2de86960a5134e"
          test "$(git hash-object "$C/canonical/runtime/terminal_information_dominance_v1.py")" = "f10986bd09a7cc64a1fae3c6ea8e69b5655f2199"
          test "$(git hash-object "$C/canonical/governance/CURRENT_TERMINAL_AUTHORITY_V1.json")" = "69f0a58efed28b44c708d13f30c701caaa7fd7b4"
          test "$(git hash-object "$C/canonical/governance/OPUS55_ACCEPTANCE_PREDICATE_REGISTRY_V2.json")" = "562536d9ba3f245a6bd24490a1eb3b30f27e0c3a"
          test "$(git hash-object "$C/canonical/governance/OPUS55_ACCEPTANCE_PREDICATE_EVIDENCE_BINDINGS_V2.json")" = "7885a827b1483bfb38315c1f492848f7e4680285"
          test "$(git hash-object "$C/canonical/governance/TERMINAL_CERTIFICATE_FRONTIER_V5.json")" = "4b5517dbd12978f8ffe481fb775e85592c7790c8"
          test "$(git hash-object "$C/canonical/governance/OPUS55_ACCEPTANCE_ACTION_HYPERGRAPH_V2.json")" = "ec0ca144939a19234f1c53378cc76af2014a6179"
          test "$(git hash-object "$C/canonical/governance/TERMINAL_SCHEDULING_ACTIVATION_V6.json")" = "e56719b8c63078273a6974104d413aa1b643da3b"

      - name: Run current-world tests
        run: |
          set -euo pipefail
          C="$GITHUB_WORKSPACE/capsules/current_30_info_v1"
          PYTHONPATH="$C" python -m unittest -v canonical.tests.test_current_terminal_information_dominance_v1

      - name: Compute exact current dominance
        run: |
          set -euo pipefail
          C="$GITHUB_WORKSPACE/capsules/current_30_info_v1"
          PYTHONPATH="$C" python -m canonical.runtime.current_terminal_information_dominance_v1 > CURRENT_30_INFO_RESULT.json

      - name: Independently adjudicate
        run: |
          set -euo pipefail
          python - <<'PY' | tee CURRENT_30_INFO_VERDICT.json
          import json
          x=json.load(open("CURRENT_30_INFO_RESULT.json"))
          assert x["pass"] is True,x
          s=x["live_world_summary"]; d=x["dominance"]
          assert s["frozen_predicates"]==38 and s["proved_predicates"]==8 and s["unresolved_predicates"]==30,x
          assert s["live_action_coverage_count"]==30,x
          assert d["status"]=="EXACT_INFORMATION_DOMINANCE_COMPUTED",x
          assert d["unresolved_predicate_count"]==30,x
          assert d["certificate_count"]<=20,x
          assert d["best_full_frontier_bundle"]["covered_predicate_count"]==30,x
          all_ids=set(d["nondominated_certificate_ids"])|set(d["dominated_certificate_ids"])
          assert "DELEGATION_PROTOCOL_SCOPE_COMPLETENESS_CERTIFICATE" not in all_ids,x
          covered={p for row in d["single_certificate_structural_front"] for p in row["covered_predicates"]}
          assert "DELEGATION_TERMINAL_SUCCESS_NONINFERIOR" not in covered,x
          assert "TOOL_LEARNING_SUCCESS_ROUTE_NONINFERIOR" in covered,x
          assert x["new_reality_units_consumed"]==0 and x["execution_authority"] is False and x["promotion_authority"] is False,x
          out={
            "schema":"PROJECT_BRAIN_CURRENT_30_INFORMATION_DOMINANCE_PUBLIC_RUNNER_VERIFICATION",
            "status":"INDEPENDENT_PASS__EXACT_LIVE_30_INFORMATION_DOMINANCE__ZERO_REALITY__ZERO_CREDIT",
            "unresolved_predicates":30,
            "certificate_count":d["certificate_count"],
            "nondominated_certificate_ids":d["nondominated_certificate_ids"],
            "dominated_certificate_ids":d["dominated_certificate_ids"],
            "highest_direct_coverage_count":d["highest_direct_coverage_count"],
            "highest_direct_coverage_certificate_ids":d["highest_direct_coverage_certificate_ids"],
            "best_full_frontier_bundle":d["best_full_frontier_bundle"],
            "top_synergy_bundles":d["synergy_bundles"][:10],
            "new_reality_units_consumed":0,
            "execution_authority":False,
            "promotion_authority":False
          }
          print(json.dumps(out,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: current-30-information-dominance-v1
          path: |
            CURRENT_30_INFO_RESULT.json
            CURRENT_30_INFO_VERDICT.json
          if-no-files-found: error

  verify-live27-independent:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Independently recompute post-Recovery live-27 frontier
        run: python verification/live27_info/verify_live27_info.py

