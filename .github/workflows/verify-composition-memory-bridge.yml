name: Verify Brain composition memory owned-family bridge
on:
  pull_request:
    paths:
      - "capsules/composition_memory_bridge/**"
      - ".github/workflows/verify-composition-memory-bridge.yml"
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact Brain bridge and source relation
        run: python capsules/composition_memory_bridge/verify.py
