name: Verify LiveBench Union25 extension cut V1

on:
  pull_request:
    branches: [main]
    paths:
      - "subject/livebench_union25_extension_cut_v1_20261005/**"
      - "verify_livebench_union25_extension_cut_v1.py"
      - ".github/workflows/verify-livebench-union25-extension-cut-v1.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
      - name: Install exact import dependencies
        run: |
          python -m pip install --disable-pip-version-check nltk==3.10.3 langdetect==1.0.9 immutabledict==4.2.2
      - name: Checkout exact frozen LiveBench
        run: |
          set -euo pipefail
          rm -rf /tmp/LiveBench
          git init /tmp/LiveBench
          git -C /tmp/LiveBench remote add origin https://github.com/LiveBench/LiveBench.git
          git -C /tmp/LiveBench fetch --depth 1 origin 8f8e5c381a16e3f24257776edd53471fe86f8091
          git -C /tmp/LiveBench checkout --detach FETCH_HEAD
      - name: Verify exact conflict graph and quotient
        run: python verify_livebench_union25_extension_cut_v1.py
      - name: Print receipt
        if: always()
        run: |
          if test -f livebench_union25_extension_cut_v1_verification.json; then
            cat livebench_union25_extension_cut_v1_verification.json
          fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livebench-union25-extension-cut-v1
          path: livebench_union25_extension_cut_v1_verification.json
          if-no-files-found: error
