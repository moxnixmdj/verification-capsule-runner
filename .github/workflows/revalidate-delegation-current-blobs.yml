name: Revalidate current delegation candidate and oracle
on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/runtime/delegation_whole_scope_candidate_v2.py'
      - 'canonical/runtime/delegation_whole_scope_proof_v2.py'
      - '.github/workflows/revalidate-delegation-current-blobs.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact current Brain blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object 'canonical/runtime/delegation_whole_scope_candidate_v2.py')" = 'f1a93ee66d90093de61dc17c6ebf2e24073df522'
          test "$(git hash-object 'canonical/runtime/delegation_whole_scope_proof_v2.py')" = '928466401b36e4f3b09c517950cc050432a0616f'
      - name: Run unchanged whole-scope delegation regression
        run: python -m unittest -v canonical.tests.test_delegation_whole_scope_v2
