name: Verify global Retrieval planner V4
on:
  push:
    branches:
      - verify/global-retrieval-v4-planner-20261004
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Exact V4 blobs
        run: |
          test "$(git hash-object canonical/runtime/global_retrieval_controller_v4.py)" = "f7b6ad66f5b256eb5166b25971dfc97445834dc8"
          test "$(git hash-object canonical/runtime/global_retrieval_entrypoint_v4.py)" = "e9e457099b13a1eb30c0c52bbedcc6348aef7373"
          test "$(git hash-object canonical/tests/test_global_retrieval_controller_v4.py)" = "141c268b43d70eac5d21dcbb7d02c73f706027f5"
      - run: PYTHONPATH=. python canonical/tests/test_global_retrieval_controller_v4.py
      - run: PYTHONPATH=. python canonical/runtime/global_retrieval_entrypoint_v4.py > retrieval-v4-plan.json
