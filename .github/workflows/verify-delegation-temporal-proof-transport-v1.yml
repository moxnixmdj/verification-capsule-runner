name: Verify delegation temporal proof transport v1

on:
  pull_request:
    paths:
      - 'capsules/delegation_temporal_transport_v1/**'
      - '.github/workflows/verify-delegation-temporal-proof-transport-v1.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify exact mirrored Brain blob identities
        env:
          CURRENT_JSON: >-
            {"canonical/runtime/temporal_proof_transport_v1.py":"4cf9827e3aa61a95798b3553ddb06dc84ee35b56","canonical/tests/test_temporal_proof_transport_v1.py":"4a39176973290312a5902197d1f697aa55e8ff62","canonical/governance/DELEGATION_TEMPORAL_PROOF_TRANSPORT_V1.json":"b6d03ac87d8cd9d308f127e4e525e48be0d0a971","canonical/governance/OPUS55_TERMINAL_PROOF_PROTOCOLS_V1.json":"eb4bca0fe6a015d49d2854998fbe046c979c7ea9","canonical/governance/BEHAVIORAL_CONTRACT_REGISTRY_V1.json":"ee187f611a0e82b2de495ee377682f39bc31dd31","canonical/governance/DELEGATION_T2_OBJECTIVE_TERMINAL_BINDING_V1.json":"a1e441567b132d71713ed55dfc51f01d8de112d1","canonical/verification/CURRENT_OBJECTIVE_BINDINGS_PUBLIC_RUNNER_VERIFICATION_20261002_V2.json":"3aa8168fc7f81581eea4085504e4a70205949af9","canonical/governance/DELEGATION_SCOPE_EQUIVALENCE_RELATION_V1.json":"52392515cd4de672f82f8afac82a41d3ce442656","canonical/verification/DELEGATION_SCOPE_GATE_V2_V3_REPAIR_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json":"eddfe01c81ae9d6e9453c4bc30737f9ddd273a83","canonical/governance/TERMINAL_ROUTE_SPECIFIC_EXECUTOR_MANIFEST_V1.json":"c61882d69a66f61b4ea1ce6ad14f86fcefd1f76a","canonical/verification/TERMINAL_V3_ONE_SHOT_WAVE_RESULT_20261002_V1.json":"bd86b4c53992b47a4a60b64a60ba03db9a442cfc","canonical/runtime/delegation_whole_scope_candidate_v2.py":"f1a93ee66d90093de61dc17c6ebf2e24073df522","canonical/runtime/delegation_whole_scope_proof_v2.py":"928466401b36e4f3b09c517950cc050432a0616f","canonical/runtime/delegation_structural_variety_proof_v3.py":"f5e1f45519278ed2cafa27d23b8602b0a362a492","canonical/runtime/direct_route_terminal_executors_v1.py":"28ef55db77ac81e78bd5c67e4d2b39fef131b505","canonical/tests/test_direct_route_terminal_executors_v1.py":"17c5c2c6828c89fd5a2cfdd5c3eda6110ab0fb03"}
          HISTORICAL_JSON: >-
            {"canonical/governance/DELEGATION_T2_OBJECTIVE_TERMINAL_BINDING_V1.json":"a1e441567b132d71713ed55dfc51f01d8de112d1","canonical/governance/DELEGATION_SCOPE_EQUIVALENCE_RELATION_V1.json":"52392515cd4de672f82f8afac82a41d3ce442656","canonical/governance/OPUS55_TERMINAL_PROOF_PROTOCOLS_V1.json":"eb4bca0fe6a015d49d2854998fbe046c979c7ea9","canonical/governance/BEHAVIORAL_CONTRACT_REGISTRY_V1.json":"afa00109031d638fef32cc3fe10be18786605c39","canonical/runtime/delegation_whole_scope_candidate_v2.py":"f1a93ee66d90093de61dc17c6ebf2e24073df522","canonical/runtime/delegation_whole_scope_proof_v2.py":"928466401b36e4f3b09c517950cc050432a0616f","canonical/runtime/delegation_structural_variety_proof_v3.py":"f5e1f45519278ed2cafa27d23b8602b0a362a492","canonical/governance/TERMINAL_ROUTE_SPECIFIC_EXECUTOR_MANIFEST_V1.json":"cd2dabd11fd169ad9b972e976ad474be51cc9e35","canonical/runtime/direct_route_terminal_executors_v1.py":"28ef55db77ac81e78bd5c67e4d2b39fef131b505","canonical/tests/test_direct_route_terminal_executors_v1.py":"17c5c2c6828c89fd5a2cfdd5c3eda6110ab0fb03"}
        run: |
          python - <<'PY'
          import json, os, subprocess
          root="capsules/delegation_temporal_transport_v1"
          cur=json.loads(os.environ["CURRENT_JSON"])
          hist=json.loads(os.environ["HISTORICAL_JSON"])
          bad=[]
          for rel,want in cur.items():
              path=f"{root}/{rel}"
              got=subprocess.check_output(["git","hash-object",path],text=True).strip()
              if got!=want: bad.append(f"CURRENT {rel}: {got} != {want}")
          for rel,want in hist.items():
              path=f"{root}/historical/{rel}"
              got=subprocess.check_output(["git","hash-object",path],text=True).strip()
              if got!=want: bad.append(f"HISTORICAL {rel}: {got} != {want}")
          if bad:
              raise SystemExit("\n".join(bad))
          print(f"EXACT_BLOB_IDENTITY_PASS current={len(cur)} historical={len(hist)}")
          PY

      - name: Verify historical to current semantic transport cone
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root=Path("capsules/delegation_temporal_transport_v1")
          hist=root/"historical"
          behavior="TASK_TO_DELEGATION_GRAPH_001"
          family="SUBAGENT_DELEGATION_AND_COORDINATION"

          def load(p):
              return json.loads(p.read_text(encoding="utf-8"))

          old_reg=load(hist/"canonical/governance/BEHAVIORAL_CONTRACT_REGISTRY_V1.json")
          cur_reg=load(root/"canonical/governance/BEHAVIORAL_CONTRACT_REGISTRY_V1.json")
          assert old_reg["family_to_residual_contracts"][family] == [behavior]
          assert cur_reg["family_to_residual_contracts"][family] == [behavior]

          def contract_row(doc):
              rows=[r for r in doc["active_contracted_residuals"] if r.get("behavior_id")==behavior]
              assert len(rows)==1
              return rows[0]
          assert contract_row(old_reg) == contract_row(cur_reg)

          old_man=load(hist/"canonical/governance/TERMINAL_ROUTE_SPECIFIC_EXECUTOR_MANIFEST_V1.json")
          cur_man=load(root/"canonical/governance/TERMINAL_ROUTE_SPECIFIC_EXECUTOR_MANIFEST_V1.json")
          def ex(doc):
              rows=doc.get("executors") or doc.get("routes") or doc.get("bindings")
              found=[r for r in rows if r.get("behavior_id")==behavior]
              assert len(found)==1
              return found[0]
          old_ex,cur_ex=ex(old_man),ex(cur_man)
          stable=[
              "frozen_route","proof_mode","independent_verification","executor_status",
              "legacy_global_executor_allowed","executor","tests","brain_ci",
              "independent_executor_verification","executor_blob_sha",
              "executor_test_blob_sha","selector_reconciliation",
          ]
          for k in stable:
              assert old_ex.get(k)==cur_ex.get(k),(k,old_ex.get(k),cur_ex.get(k))
          assert old_ex.get("terminal_result_status")=="NOT_EXECUTED"
          assert cur_ex.get("terminal_result_status")=="CONSUMED_IN_TERMINAL_V3_WAVE"
          assert cur_ex.get("rerun_allowed") is False

          t=load(root/"canonical/governance/DELEGATION_TEMPORAL_PROOF_TRANSPORT_V1.json")
          assert t["terminal_execution_snapshot_commit"]=="821712c059b139f3494723dca6e8d0fc82ee59a4"
          assert t["history_identity"]["historical_binding_blob_sha"]==t["history_identity"]["current_binding_blob_sha"]=="a1e441567b132d71713ed55dfc51f01d8de112d1"
          assert t["history_identity"]["historical_scope_relation_blob_sha"]==t["history_identity"]["current_scope_relation_blob_sha"]=="52392515cd4de672f82f8afac82a41d3ce442656"
          print("SEMANTIC_TRANSPORT_CONE_PASS")
          PY

      - name: Run transport tests
        env:
          PYTHONPATH: capsules/delegation_temporal_transport_v1
        run: |
          python -m unittest -v canonical.tests.test_temporal_proof_transport_v1

      - name: Assert candidate-only zero-credit and no replay
        run: |
          python - <<'PY'
          import json
          p="capsules/delegation_temporal_transport_v1/canonical/governance/DELEGATION_TEMPORAL_PROOF_TRANSPORT_V1.json"
          d=json.load(open(p,encoding="utf-8"))
          assert d["capability_credit_delta"]==0
          assert d["family_credit_delta"]==0
          assert d["incremental_spend_usd"]==0
          assert d["fresh_terminal_evidence_consumed"]==0
          assert d["terminal_replay_count"]==0
          assert d["execution_authority"] is False
          assert d["promotion_authority"] is False
          print("ZERO_CREDIT_NO_REPLAY_PASS")
          PY
