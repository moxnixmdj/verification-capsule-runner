name: Verify proof obligation delta compiler v1

on:
  pull_request:
    branches: [main]
    paths:
      - "canonical/runtime/proof_obligation_delta_compiler_v1.py"
      - "canonical/tests/test_proof_obligation_delta_compiler_v1.py"
      - ".github/workflows/verify-proof-obligation-delta-compiler-v1.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact Brain blob identities
        shell: bash
        run: |
          test "$(git hash-object canonical/runtime/proof_obligation_delta_compiler_v1.py)" = "dea41dc780c92efdd7c8b4b8551129197ab8cca8"
          test "$(git hash-object canonical/tests/test_proof_obligation_delta_compiler_v1.py)" = "75eebd1ac6f50073bfef6dbe63433ec4ae7df096"
      - name: Run exact compiler tests
        run: python -m unittest -v canonical.tests.test_proof_obligation_delta_compiler_v1
