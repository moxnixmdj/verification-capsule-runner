name: Independently verify terminal progress delta gate V1

on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/terminal_progress_delta_gate_v1/**"
      - ".github/workflows/verify-terminal-progress-delta-gate-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
      - run: python capsules/terminal_progress_delta_gate_v1/verify.py
