name: Verify TB-Science verification authority V3

on:
  push:
    branches:
      - verify/tb-science-verification-authority-v3-20261007
    paths:
      - '.github/workflows/verify-tb-science-verification-authority-v3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          repository: moxnixmdj/brain
          ref: repair/tb-science-shell-truncation-taint-20261007
          path: brain
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replay exact patched unit suites
        shell: bash
        run: |
          set -euo pipefail
          cd brain
          python -m unittest -v             canonical.tests.test_harbor_science_agent_v1             canonical.tests.test_harbor_science_planner_v1
      - name: Bind exact subject blobs
        shell: bash
        run: |
          set -euo pipefail
          cd brain
          test "$(git hash-object canonical/runtime/harbor_science_agent_v1.py)" = "f891c3a3f728db9cdcdfa9ad3c0b5db9e64accf8"
          test "$(git hash-object canonical/runtime/harbor_science_planner_v1.py)" = "c3e36eba57c450f325c8a9476ee048c841bbdbc8"
          test "$(git hash-object canonical/tests/test_harbor_science_agent_v1.py)" = "dcd1ab69e921301f5bbdd15fbd154ebe1031eff7"
          test "$(git hash-object canonical/tests/test_harbor_science_planner_v1.py)" = "d59f7b452e647c7cf8527276820603d9fbe2dd5e"
