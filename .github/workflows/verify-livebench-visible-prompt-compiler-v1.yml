name: Verify LiveBench visible prompt compiler V1

on:
  pull_request:
    branches: [main]
    paths:
      - "subject/livebench_visible_prompt_compiler_v1_20261005/**"
      - "verify_livebench_visible_prompt_compiler_v1.py"
      - ".github/workflows/verify-livebench-visible-prompt-compiler-v1.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"

      - name: Install exact import dependencies
        run: |
          python -m pip install --disable-pip-version-check --quiet \
            nltk==3.10.3 langdetect==1.0.9 immutabledict==4.3.1

      - name: Checkout pinned LiveBench scorer and historical generator objects
        run: |
          set -euo pipefail
          rm -rf /tmp/LiveBench
          git init /tmp/LiveBench
          git -C /tmp/LiveBench remote add origin https://github.com/LiveBench/LiveBench.git
          git -C /tmp/LiveBench fetch --depth 1 origin 8f8e5c381a16e3f24257776edd53471fe86f8091
          git -C /tmp/LiveBench checkout --detach FETCH_HEAD
          git -C /tmp/LiveBench fetch --depth 1 origin 686be1e78a0ba8036d7e355bc406e1a265da5292

      - name: Verify exact visible grammar compiler
        run: python verify_livebench_visible_prompt_compiler_v1.py

      - name: Print receipt
        if: always()
        run: |
          if test -f livebench_visible_prompt_compiler_verification.json; then
            cat livebench_visible_prompt_compiler_verification.json
          fi

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livebench-visible-prompt-compiler-v1
          path: livebench_visible_prompt_compiler_verification.json
          if-no-files-found: error
