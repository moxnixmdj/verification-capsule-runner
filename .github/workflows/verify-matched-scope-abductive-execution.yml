name: Verify matched-scope abductive residual execution
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run regression
        run: python canonical/tests/test_matched_scope_abductive_residual_execution_v1.py
      - name: Execute exact abductive cut
        run: |
          python canonical/runtime/matched_scope_abductive_residual_execution_v1.py > /tmp/out.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/out.json'))
          assert d['target_count']==11,d
          assert d['verified_rule_count']==11,d
          assert len(d['primitive_residual_facts'])==22,d
          assert d['minimum_joint_residual_size']==22,d
          assert d['shared_residual_groups']==[],d
          assert len(d['minimum_joint_residual_sets'])==1,d
          assert len(d['minimum_joint_residual_sets'][0])==22,d
          assert d['new_reality_units_consumed']==0,d
          assert d['capability_credit_delta']==0 and d['family_credit_delta']==0,d
          assert d['execution_authority'] is False and d['promotion_authority'] is False,d
          print('MATCHED_SCOPE_ABDUCTIVE_EXECUTION_PASS')
          PY
