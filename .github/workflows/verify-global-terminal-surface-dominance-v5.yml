name: Verify global terminal surface dominance V5

on:
  pull_request:
    branches: [main]
    paths:
      - 'verification/GLOBAL_TERMINAL_SURFACE_DOMINANCE_INPUT_V5.json'
      - 'verification/test_global_terminal_surface_dominance_v5.py'
      - 'canonical/runtime/proof_route_dominance.py'
      - '.github/workflows/verify-global-terminal-surface-dominance-v5.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Bind exact Brain-equivalent blobs
        run: |
          test "$(git hash-object canonical/runtime/proof_route_dominance.py)" = "78f4dc70846a773a420da9dc5cf8f76bee5e154b"
          test "$(git hash-object verification/GLOBAL_TERMINAL_SURFACE_DOMINANCE_INPUT_V5.json)" = "fb1e333b19e8fbd2c35dcaf1a128313631da92ae"
          test "$(git hash-object verification/test_global_terminal_surface_dominance_v5.py)" = "673c5b7b9f3a6bdacd278f7f871a3e8a7bd255b5"
      - name: Verify complete V5 dominance
        run: PYTHONPATH=. python -m pytest -q verification/test_global_terminal_surface_dominance_v5.py
