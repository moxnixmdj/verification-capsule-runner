name: Verify P1 public recovery execution result V1

on:
  push:
    branches: ["verify/p1-public-recovery-result-adjudication-v1-20261003-sol"]
    paths:
      - ".github/workflows/verify-p1-public-recovery-result-adjudication-v1.yml"
      - "capsules/p1_public_recovery_result_adjudication_v1/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/verify-p1-public-recovery-result-adjudication-v1.yml"
      - "capsules/p1_public_recovery_result_adjudication_v1/**"

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Bind exact authority cut and execution carrier
        run: |
          set -euo pipefail
          test "$(git hash-object capsules/p1_public_recovery_result_adjudication_v1/brain_active_authority.json)" = "365c098d4763ddfacf660f77457cbac08f5ac72e"
          test "$(git hash-object capsules/p1_public_recovery_result_adjudication_v1/minimum_reality_cut.json)" = "cbcb2faff8404623846e77e19fcc5b0ad00e81d9"
          test "$(git hash-object .github/workflows/execute-p1-public-recovery-carrier-v1.yml)" = "547f57f43a71f289b006602c1067a962171f38d4"
          C=capsules/p1_one_use_authority_v1
          test "$(git hash-object "$C/canonical/runtime/p1_shared_failure_semantics_batch_v1.py")" = "695cfe3f283723a52bafb6299236a2d0378dc79e"
          test "$(git hash-object "$C/canonical/runtime/trajectory_failure_typed_ir_candidate_v7.py")" = "28940387bd6c11671035ad9201e37bba13fd9bc9"
          test "$(git hash-object "$C/canonical/runtime/trajectory_failure_typed_ir_proof_v6.py")" = "0f41a36e6ad16722ce05b180e036fb921a2ef886"

      - name: Fetch authenticated run metadata and immutable execution artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p evidence/artifact
          gh api /repos/moxnixmdj/verification-capsule-runner/actions/runs/37108111537 > evidence/run.json
          gh api /repos/moxnixmdj/verification-capsule-runner/actions/runs/37108111537/jobs > evidence/jobs.json
          gh api /repos/moxnixmdj/verification-capsule-runner/actions/runs/37108111537/artifacts > evidence/artifacts.json
          gh api /repos/moxnixmdj/verification-capsule-runner/actions/artifacts/11268841992/zip > evidence/result.zip
          echo 'e25bcf3fcab61b1fa00882c202a00714ecb81772378005e4934edc712a22d038  evidence/result.zip' | sha256sum -c -
          unzip -q evidence/result.zip -d evidence/artifact
          echo '768fa639b7e4c5e611945362a3ceddc43dc272f1d882629cba7b688709850a1f  evidence/artifact/P1_RAW_BATCH_RESULT.json' | sha256sum -c -
          echo '24eec602e4f8bc2762b7c48f1652b97149ba0c995ee8448d3a59b41ed9fcee4f  evidence/artifact/P1_PUBLIC_RECOVERY_AUTHORIZED_RESULT.json' | sha256sum -c -
          echo '11b0166d68bbf219ca6df6c60246350a541a599eab46b79fe37613b7c193a800  evidence/artifact/P1_SPENT_PREFLIGHT.json' | sha256sum -c -

      - name: Independently adjudicate transport and minimum-reality discharge
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from collections import Counter, defaultdict
          from pathlib import Path

          root=Path("evidence")
          run=json.loads((root/"run.json").read_text())
          jobs=json.loads((root/"jobs.json").read_text())
          arts=json.loads((root/"artifacts.json").read_text())
          auth=json.loads(Path("capsules/p1_public_recovery_result_adjudication_v1/brain_active_authority.json").read_text())
          cut=json.loads(Path("capsules/p1_public_recovery_result_adjudication_v1/minimum_reality_cut.json").read_text())
          raw=json.loads((root/"artifact/P1_RAW_BATCH_RESULT.json").read_text())
          out=json.loads((root/"artifact/P1_PUBLIC_RECOVERY_AUTHORIZED_RESULT.json").read_text())
          pre=json.loads((root/"artifact/P1_SPENT_PREFLIGHT.json").read_text())

          assert run["id"]==37108111537 and run["event"]=="push" and run["run_attempt"]==1
          assert run["head_sha"]=="e489b191363c52c838b720cd759c99f638170c67"
          assert run["status"]=="completed" and run["conclusion"]=="success"
          assert jobs["total_count"]==1
          job=jobs["jobs"][0]
          assert job["id"]==111160509570 and job["conclusion"]=="success"
          assert int(job["runner_id"])>0 and job["runner_name"]
          steps={s["name"]:s for s in job["steps"]}
          for name in (
            "Enforce distinct first-attempt recovery carrier",
            "Re-run spent preflight only",
            "Consume exactly one authorized fresh P1 reality unit",
            "Preserve one-use public recovery evidence",
          ):
            assert steps[name]["conclusion"]=="success", (name,steps[name])
          assert arts["total_count"]==1
          art=arts["artifacts"][0]
          assert art["id"]==11268841992
          assert art["digest"]=="sha256:e25bcf3fcab61b1fa00882c202a00714ecb81772378005e4934edc712a22d038"

          assert auth["execution_authority"] is True
          assert auth["promotion_authority"] is False
          assert auth["fresh_reality_units_authorized"]==1
          assert auth["fresh_reality_units_consumed"]==0
          assert auth["exact_recovery_carrier"]["workflow_git_blob_sha"]=="547f57f43a71f289b006602c1067a962171f38d4"

          beacon=(
            "P1_PUBLIC_RECOVERY_CARRIER_V1;"
            "REPO=moxnixmdj/verification-capsule-runner;"
            "RUN_ID=37108111537;ATTEMPT=1;"
            "HEAD=e489b191363c52c838b720cd759c99f638170c67"
          )
          beacon_sha=hashlib.sha256(beacon.encode()).hexdigest()
          assert beacon_sha=="887b0f45d7651eaeb0ff1be8872352f12ee32e212a3607c2a205810a15dfa83d"
          assert raw["beacon_sha256"]==out["beacon_sha256"]==beacon_sha

          assert pre["pass"] is True and pre["new_reality_units_consumed"]==0
          assert raw["pass"] is True and raw["status"]=="PASS__BATCH_SHAPE"
          assert raw["cases"]==192 and raw["passes"]==192 and raw["failures"]==0
          assert raw["terminal_v3_replayed"]==0 and raw["incremental_spend_usd"]==0
          assert out["cases"]==192 and out["passes"]==192 and out["failures"]==0
          assert out["fresh_reality_units_consumed"]==1
          assert out["execution_authority_consumed"] is True
          assert out["rerun_credit"] is False and out["promotion_authority"] is False
          assert out["execution_workflow_blob"]=="547f57f43a71f289b006602c1067a962171f38d4"

          rows=raw["case_receipts"]
          assert len(rows)==192
          surfaces=set(raw["by_surface"])
          assert surfaces=={
            "T0/FRONTIERCODE_V1_1::P1_CAUSAL_FAILURE_LOCALIZATION_DIRECT_PROOF",
            "T0/CURSORBENCH_4_0::P1_CAUSAL_FAILURE_LOCALIZATION_DIRECT_PROOF",
            "T2/RECOVERY_SCOPE_COMPOSITION::P1_CAUSAL_FAILURE_LOCALIZATION_DIRECT_PROOF",
          }
          seen=set()
          counts=Counter()
          for row in rows:
            key=(row["surface_id"],row["case_index"])
            assert key not in seen
            seen.add(key); counts[row["surface_id"]]+=1
            assert row["pass"] is True
            assert row["v7_intervention_scorer_pass"] is True
            assert row["source_native_rescue_scorer_pass"] is True
            assert row["source_native_rescue_pass"] is True
            assert row["semantics_counts"]["DIRECT_CONTRACT"]>=1
            assert row["semantics_counts"]["DERIVED_UPSTREAM"]>=1
            assert isinstance(row["source_observation_receipt"],str) and row["source_observation_receipt"].startswith("sha256:")
            assert row["semantic_binding_basis"]=="FROZEN_PUBLIC_SOURCE_STATE_AND_INVARIANT_RESULT_ONLY__HIDDEN_ORACLE_INPUT_FORBIDDEN"
          assert all(counts[s]==64 for s in surfaces)
          for s in surfaces:
            assert {i for ss,i in seen if ss==s}==set(range(64))
            assert raw["by_surface"][s]["all_pass"] is True
            assert raw["by_surface"][s]["both_semantics_classes_present_every_case"] is True
            assert raw["by_surface"][s]["passes"]==64

          req=set(cut["requirements"])
          shared=next(x for x in cut["observations"] if x["id"]=="P1_SHARED_SOURCE_BOUND_FAILURE_SEMANTICS_BATCH")
          assert set(shared["covers"])==req and shared["cost"]==1
          assert req=={
            "P1_FAILURE_SEMANTICS_TRANSPORT_FRONTIERCODE",
            "P1_FAILURE_SEMANTICS_TRANSPORT_CURSORBENCH",
            "P1_FAILURE_SEMANTICS_TRANSPORT_RECOVERY_SCOPE_COMPOSITION",
          }
          assert cut["fresh_reality_units_consumed_so_far"]==0

          receipt={
            "schema":"PROJECT_BRAIN_P1_PUBLIC_RECOVERY_RESULT_INDEPENDENT_ADJUDICATION_V1",
            "status":"INDEPENDENT_PUBLIC_RUNNER_PASS__ONE_FRESH_P1_REALITY_UNIT__192_OF_192_DUAL_SCORER_PASS__THREE_FAILURE_SEMANTICS_TRANSPORT_REQUIREMENTS_DISCHARGED",
            "execution_run_id":37108111537,
            "execution_job_id":111160509570,
            "execution_head_sha":run["head_sha"],
            "execution_artifact_id":11268841992,
            "execution_artifact_digest":art["digest"],
            "execution_workflow_blob":"547f57f43a71f289b006602c1067a962171f38d4",
            "active_authority_blob":"365c098d4763ddfacf660f77457cbac08f5ac72e",
            "minimum_reality_cut_blob":"cbcb2faff8404623846e77e19fcc5b0ad00e81d9",
            "beacon_sha256":beacon_sha,
            "cases":192,
            "passes":192,
            "failures":0,
            "surface_count":3,
            "passes_per_surface":64,
            "both_failure_semantics_classes_present_every_case":True,
            "v7_intervention_scorer_all_pass":True,
            "source_native_rescue_scorer_all_pass":True,
            "transport_requirements_discharged":sorted(req),
            "p1_failure_semantics_transport_pass":True,
            "fresh_reality_units_consumed":1,
            "terminal_v3_replayed":0,
            "incremental_spend_usd":0,
            "execution_authority_consumed":True,
            "p1_quarantine_lifted":False,
            "next":"SEPARATE_SCOPE_RESTORATION_REDUCTION_BINDING_THIS_RECEIPT_WITH_PRIOR_V7_PROVENANCE_SCOPE_AND_MUTATION_PROOFS",
            "capability_credit_delta":0,
            "family_credit_delta":0,
            "promotion_authority":False,
          }
          (root/"P1_PUBLIC_RECOVERY_RESULT_ADJUDICATION.json").write_text(json.dumps(receipt,indent=2,sort_keys=True)+"\n")
          print(json.dumps(receipt,sort_keys=True))
          PY

      - name: Preserve independent adjudication
        uses: actions/upload-artifact@v4
        with:
          name: p1-public-recovery-result-adjudication-v1
          path: |
            evidence/run.json
            evidence/jobs.json
            evidence/artifacts.json
            evidence/P1_PUBLIC_RECOVERY_RESULT_ADJUDICATION.json
          if-no-files-found: error
