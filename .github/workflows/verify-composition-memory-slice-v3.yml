name: Verify Brain composition memory slice V3
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/composition_memory_slice_v3/**"
      - ".github/workflows/verify-composition-memory-slice-v3.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run exact Brain slicer and enforce one-of-twelve reduction
        run: python capsules/composition_memory_slice_v3/verify.py
