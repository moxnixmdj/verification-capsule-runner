name: Qualify Typed Quantity Candidates
on:
  pull_request:
    branches: [main]
    paths:
      - canonical/runtime/bound_capabilities/extracted_evidence_typed_quantity.py
      - canonical/runtime/bound_capabilities/open_research_source_frontend.py
      - canonical/runtime/astra_runtime.py
      - canonical/tests/test_extracted_evidence_typed_quantity.py
      - canonical/tests/test_typed_quantity_independent_qualification.py
      - .github/workflows/qualify-typed-quantity-candidates.yml
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install independent quantity oracle
        run: python -m pip install --disable-pip-version-check quantulum3==0.10.0
      - name: Run authored fail-closed regressions
        run: python canonical/tests/test_extracted_evidence_typed_quantity.py
      - name: Run independent quantity extraction qualification
        run: python canonical/tests/test_typed_quantity_independent_qualification.py
      - name: Verify parent integration markers
        run: |
          grep -q "OPEN_ENDED_RESEARCH_TYPED_QUANTITIES_READY__" canonical/runtime/astra_runtime.py
          grep -q "MODEL_INDEPENDENT_RELATION_OPERAND_BINDING_FROM_TYPED_EVIDENCE_V1" canonical/runtime/bound_capabilities/open_research_source_frontend.py
