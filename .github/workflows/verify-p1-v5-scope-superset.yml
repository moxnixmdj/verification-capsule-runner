name: Verify P1 V5 direct-surface scope superset
on:
  pull_request:
    paths:
      - "capsules/p1_v5_scope_superset/**"
      - ".github/workflows/verify-p1-v5-scope-superset.yml"
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact Brain blobs and P1 V5 scope-superset gate
        run: python capsules/p1_v5_scope_superset/verify.py
