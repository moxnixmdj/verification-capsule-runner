name: Root1 acquisition fastlane

on:
  push:
    branches:
      - fastlane/root1-acquisition-20261004-v1
    paths:
      - "fastlane_qwen38_q2_preflight.py"
      - "fastlane_smaug_delta_probe.py"
      - ".github/workflows/root1-acquisition-fastlane.yml"

permissions:
  contents: read

jobs:
  acquisition-cut:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Q2 exact identity and runner fit preflight
        run: python fastlane_qwen38_q2_preflight.py
      - name: Install numeric dependency for Smaug delta probe
        run: python -m pip install --quiet "numpy==2.3.3"
      - name: Smaug delta singular-spectrum probe
        run: python fastlane_smaug_delta_probe.py
      - name: Upload receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: root1-acquisition-fastlane
          path: |
            qwen38_q2_standard_runner_preflight_receipt.json
            smaug_lora_delta_range_probe_v1.json
          if-no-files-found: warn
