name: Verify CAD T0 terminal executor v1
on:
  pull_request:
    branches: [main]
    paths:
      - canonical/runtime/cad_t0_route_specific_terminal_executor_v1.py
      - canonical/tests/test_cad_t0_route_specific_terminal_executor_v1.py
      - canonical/governance/CAD_ACTIVE_CONTRACT_END_TO_END_PROOF_ROUTE_V1.json
      - canonical/governance/CAD_T0_POST_REFREEZE_BINDING_V4.json
      - canonical/governance/TERMINAL_WAVE_EXECUTION_AUTHORITY_V1.json
      - canonical/governance/TERMINAL_ROUTE_SPECIFIC_EXECUTOR_MANIFEST_V1.json
      - .github/workflows/verify-cad-t0-terminal-executor-v1.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify exact Brain blob identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object canonical/runtime/cad_t0_route_specific_terminal_executor_v1.py)" = "00879293f32c66fd01f6747aaf15573b27fde01f"
          test "$(git hash-object canonical/tests/test_cad_t0_route_specific_terminal_executor_v1.py)" = "49e911745bca7c3b36a7af5e726910d942d538ab"
          test "$(git hash-object canonical/governance/CAD_ACTIVE_CONTRACT_END_TO_END_PROOF_ROUTE_V1.json)" = "c0f55a55091186c5ab785b670f935bbc6a2f9432"
          test "$(git hash-object canonical/governance/CAD_T0_POST_REFREEZE_BINDING_V4.json)" = "a636d1292e6f92d240fab420a9ee75ced7a05104"
          test "$(git hash-object canonical/runtime/cad_t0_route_specific_candidate_v1.py)" = "aa32750b220a023617938b7be9476f6b3aac6704"
      - run: python -m pip install --disable-pip-version-check --no-input "pydantic>=2,<3" "cadquery==2.6.1"
      - run: PYTHONPATH=.:canonical/runtime python -m unittest -v canonical.tests.test_cad_t0_route_specific_terminal_executor_v1
