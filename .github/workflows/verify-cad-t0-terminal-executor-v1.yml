name: Verify CAD T0 terminal executor v1
on:
  pull_request:
    branches: [main]
    paths:
      - canonical/runtime/cad_t0_route_specific_terminal_executor_v1.py
      - canonical/tests/test_cad_t0_route_specific_terminal_executor_v1.py
      - canonical/governance/CAD_ACTIVE_CONTRACT_END_TO_END_PROOF_ROUTE_V1.json
      - .github/workflows/verify-cad-t0-terminal-executor-v1.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify exact Brain blob identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object canonical/runtime/cad_t0_route_specific_terminal_executor_v1.py)" = "573efab38cbf7ab25e63b564f0eb1599d755b7d2"
          test "$(git hash-object canonical/tests/test_cad_t0_route_specific_terminal_executor_v1.py)" = "af1a7e63548fefd503def4091e04488a75e227c4"
          test "$(git hash-object canonical/governance/CAD_ACTIVE_CONTRACT_END_TO_END_PROOF_ROUTE_V1.json)" = "c0f55a55091186c5ab785b670f935bbc6a2f9432"
      - run: python -m pip install --disable-pip-version-check --no-input "pydantic>=2,<3" "cadquery==2.6.1"
      - run: PYTHONPATH=.:canonical/runtime python -m unittest -v canonical.tests.test_cad_t0_route_specific_terminal_executor_v1
