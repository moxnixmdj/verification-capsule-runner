name: Verify LiveBench threshold-root authority transport V1
on:
  pull_request:
    paths:
      - 'subject/livebench_threshold_root_transport_v1/**'
      - 'verify_livebench_threshold_root_transport_v1.py'
      - '.github/workflows/verify-livebench-threshold-root-transport-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python verify_livebench_threshold_root_transport_v1.py
