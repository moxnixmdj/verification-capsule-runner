name: Verify LiveBench Ratio Full Row Composition
on:
  pull_request:
    branches:
      - main
    paths:
      - verify_livebench_ratio_overlap_full_row_composition.py
      - .github/workflows/verify-livebench-ratio-full-row-composition.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recompute prompt-only full-row witnesses
        run: python verify_livebench_ratio_overlap_full_row_composition.py
      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livebench-ratio-overlap-full-row-composition-receipt
          path: livebench_ratio_overlap_full_row_composition_receipt.json
          if-no-files-found: error
