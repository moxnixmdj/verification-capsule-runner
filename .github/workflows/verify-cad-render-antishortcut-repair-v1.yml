name: Verify CAD render antishortcut repair v1
on:
  pull_request:
    branches: [main]
    paths:
      - canonical/runtime/cad_t0_route_specific_candidate_v1.py
      - canonical/tests/test_cad_render_antishortcut_repair_v1.py
      - .github/workflows/verify-cad-render-antishortcut-repair-v1.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check --no-input "pydantic>=2,<3" "cadquery==2.6.1"
      - name: Bind exact repaired Brain candidate
        run: test "$(git hash-object canonical/runtime/cad_t0_route_specific_candidate_v1.py)" = "badbce2b330cd4a8e1c64e2f0fa88f79123a94f2"
      - name: Run anti-shortcut repair regression
        run: PYTHONPATH=. python -m unittest -v canonical.tests.test_cad_render_antishortcut_repair_v1 canonical.tests.test_cad_t0_route_specific_candidate_v1
