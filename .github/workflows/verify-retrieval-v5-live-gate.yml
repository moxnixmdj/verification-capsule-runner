name: Verify Retrieval V5 live gate
on:
  push:
    branches:
      - verify/retrieval-v5-live-gate-20261003
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python verify_retrieval_v5_live_gate.py
