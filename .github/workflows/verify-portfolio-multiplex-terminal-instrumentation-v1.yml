name: Verify portfolio multiplex terminal instrumentation
on:
  pull_request:
    branches: [main]
    paths:
      - canonical/runtime/portfolio_multiplex_terminal_instrumentation_v1.py
      - canonical/tests/test_portfolio_multiplex_terminal_instrumentation_v1.py
      - .github/workflows/verify-portfolio-multiplex-terminal-instrumentation-v1.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Bind exact current Brain blobs
        run: |
          set -euo pipefail
          test "$(git hash-object canonical/runtime/portfolio_multiplex_terminal_instrumentation_v1.py)" = "c8fd67ab29286b1c536ffdc9d8a05afcde1d00c6"
          test "$(git hash-object canonical/tests/test_portfolio_multiplex_terminal_instrumentation_v1.py)" = "4f8690c5d3d8136f8659e34555282ac93845bb4c"
      - run: python -m unittest -v canonical.tests.test_portfolio_multiplex_terminal_instrumentation_v1
