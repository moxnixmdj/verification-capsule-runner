name: Verify portfolio multiplex terminal instrumentation v1
on:
  pull_request:
    branches: [main]
    paths:
      - 'capsules/portfolio_multiplex_terminal_instrumentation_v1/**'
      - '.github/workflows/verify-portfolio-multiplex-terminal-instrumentation-v1.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Bind exact Brain blobs
        run: |
          set -euo pipefail
          test "$(git hash-object capsules/portfolio_multiplex_terminal_instrumentation_v1/canonical/runtime/portfolio_multiplex_terminal_instrumentation_v1.py)" = "42a6d9fe1a5d5db1ecc95809cbd0eaeec456ba03"
          test "$(git hash-object capsules/portfolio_multiplex_terminal_instrumentation_v1/canonical/tests/test_portfolio_multiplex_terminal_instrumentation_v1.py)" = "7f2aef43c54d373233ca6b78face434d92d9af65"
      - name: Run multiplex executor regressions
        run: cd capsules/portfolio_multiplex_terminal_instrumentation_v1/ && PYTHONPATH=. python -m unittest -v canonical.tests.test_portfolio_multiplex_terminal_instrumentation_v1
