name: Verify PR421 Claim Relation
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact PR421 blobs
        run: |
          set -euo pipefail
          test "$(git hash-object canonical/runtime/bound_capabilities/extracted_evidence_claim_relation.py)" = "f4ee15d0be0235fceeb12dea3c1a64fa88bef532"
          test "$(git hash-object canonical/tests/test_extracted_evidence_claim_relation.py)" = "3da7df056faa87e26528a2874860073b5489f1eb"
      - name: Run deterministic regressions
        run: python canonical/tests/test_extracted_evidence_claim_relation.py
      - name: Run fresh cross-domain qualification and independent oracle
        run: python verify_pr421_claim_relation.py
      - name: Upload qualification report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr421-claim-relation-report
          path: pr421-claim-relation-report.json
          if-no-files-found: error
