name: Verify Retrieval V20 route executor
on:
  push:
    branches:
      - verify/retrieval-v20-route-executor-20261004
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact V20 blobs
        run: |
          test "$(git hash-object canonical/runtime/retrieval_verified_route_executor_v1.py)" = "cf5fd2675548a0fb926dfe2ea498749f93499dd0"
          test "$(git hash-object canonical/tests/test_retrieval_verified_route_executor_v1.py)" = "5c67e976b0a06149f7b885dff4f005b1a492ac4f"
          test "$(git hash-object canonical/runtime/retrieval_verified_route_executor_live_probe_v1.py)" = "ac4f54861ce475ce20ce75d4875c0331de04e6af"
      - name: Unit tests
        run: PYTHONPATH=. python canonical/tests/test_retrieval_verified_route_executor_v1.py
      - name: Live generic executor probe
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          PYTHONPATH=. python canonical/runtime/retrieval_verified_route_executor_live_probe_v1.py | tee retrieval-v20-live-result.json
      - uses: actions/upload-artifact@v4
        with:
          name: retrieval-v20-live-result
          path: retrieval-v20-live-result.json
          retention-days: 90
