name: Verify LiveBench minimal transitive runtime closure

on:
  push:
    branches: [main]
    paths:
      - 'diagnose_livebench_public_inference_capsule_20261004.py'
      - 'subject/livebench_zero_case_resource_fit_20261004/astra_runtime.py'
      - 'subject/livebench_zero_case_resource_fit_20261004/goal_compiler.py'
      - 'subject/livebench_zero_case_resource_fit_20261004/root2_livebench_if_astra_inference_adapter_v1.py'
      - '.github/workflows/diagnose-livebench-public-inference-capsule-20261004.yml'
  pull_request:
    paths:
      - 'diagnose_livebench_public_inference_capsule_20261004.py'
      - 'subject/livebench_zero_case_resource_fit_20261004/astra_runtime.py'
      - 'subject/livebench_zero_case_resource_fit_20261004/goal_compiler.py'
      - 'subject/livebench_zero_case_resource_fit_20261004/root2_livebench_if_astra_inference_adapter_v1.py'
      - '.github/workflows/diagnose-livebench-public-inference-capsule-20261004.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute isolated minimal closure proof
        run: python diagnose_livebench_public_inference_capsule_20261004.py
