name: Verify structured method terminal binding v1
on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/governance/STRUCTURED_METHOD_TERMINAL_POPULATION_BINDING_V1.json'
      - 'canonical/runtime/structured_method_normalized_rule_graph_v3.py'
      - 'canonical/runtime/structured_method_normalized_rule_oracle_v3.py'
      - 'canonical/runtime/structured_method_terminal_population_v1.py'
      - 'canonical/governance/BEHAVIORAL_CONTRACT_REGISTRY_V1.json'
      - 'canonical/governance/GLOBAL_TERMINAL_REPLACEMENT_POPULATION_PROTOCOL_V2.json'
      - 'canonical/verification/STRUCTURED_METHOD_SCOPE_GATE_V2_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json'
      - 'canonical/verification/STRUCTURED_METHOD_NORMALIZED_RULE_V3_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json'
      - '.github/workflows/verify-structured-method-terminal-binding-v1.yml'
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Verify frozen binding and fresh prewave sample
        run: |
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          from canonical.runtime.structured_method_normalized_rule_graph_v3 import compile_graph
          from canonical.runtime.structured_method_normalized_rule_oracle_v3 import score
          from canonical.runtime.structured_method_terminal_population_v1 import generate_population
          root=Path(".")
          b=json.loads((root/"canonical/governance/STRUCTURED_METHOD_TERMINAL_POPULATION_BINDING_V1.json").read_text())
          reg=json.loads((root/"canonical/governance/BEHAVIORAL_CONTRACT_REGISTRY_V1.json").read_text())
          sg=json.loads((root/"canonical/verification/STRUCTURED_METHOD_SCOPE_GATE_V2_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json").read_text())
          nv=json.loads((root/"canonical/verification/STRUCTURED_METHOD_NORMALIZED_RULE_V3_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json").read_text())
          assert b["proof_mode"] in reg["terminal_acceptance_proof_modes"]
          assert b["acceptance"]["terminal_acceptance_proof_mode"]==b["proof_mode"]
          assert b["population"]["sample_count"]==2000
          assert b["population"]["post_freeze_beacon"] is None
          assert b["population"]["adaptive_case_selection"] is False
          assert b["population"]["case_replacement"] is False
          assert b["population"]["replay_for_tuning"] is False
          assert b["acceptance"]["allowed_failed_cases"]==0
          assert b["execution_authority"] is False and b["terminal_results_observed"]==0
          assert sg["workflow_conclusion"]=="success" and sg["verdict"]["admissible"] is True
          assert nv["workflow_conclusion"]=="success"
          rows=generate_population(0x20261002,256)
          failures=[]
          for i,case in enumerate(rows):
              out=compile_graph(case)
              v=score(case,out)
              if not v["pass"]: failures.append((i,v))
          assert not failures, failures[:5]
          print(json.dumps({"status":"PASS","fresh_prewave_cases":len(rows),"proof_mode":b["proof_mode"]},sort_keys=True))
          PY
