name: Verify AutomationBench free planner transport V1
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/verify-automationbench-free-planner-transport-v1.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Probe free proposal transport with synthetic tool contract
        run: |
          python - <<'PY'
          import json, urllib.request, time
          endpoint='https://text.pollinations.ai/'
          contract={
            'instruction':'Return exactly one JSON object: {"type":"tool","name":"crm_update","arguments":{"id":"7","status":"closed"}}. No markdown.',
            'allowed_tools':[{'name':'crm_update','parameters':{'type':'object','properties':{'id':{'type':'string'},'status':{'type':'string','enum':['open','closed']}},'required':['id','status'],'additionalProperties':False}}],
            'conversation':[{'role':'user','content':'Close lead 7.'}],
          }
          errors=[]
          passed=None
          for model in ('openai-fast','openai','mistral'):
              body=json.dumps({'messages':[{'role':'user','content':json.dumps(contract,separators=(',',':'))}],'model':model,'jsonMode':True}).encode()
              req=urllib.request.Request(endpoint,data=body,headers={'Content-Type':'application/json','User-Agent':'ProjectBrain-AutomationBench-Smoke/1.0'},method='POST')
              t=time.monotonic()
              try:
                  with urllib.request.urlopen(req,timeout=60) as r:
                      raw=r.read(30000).decode('utf-8','replace').strip()
                  try:
                      obj=json.loads(raw)
                  except Exception:
                      a,b=raw.find('{'),raw.rfind('}')
                      obj=json.loads(raw[a:b+1])
                  ok=(obj.get('type')=='tool' and obj.get('name')=='crm_update' and obj.get('arguments')=={'id':'7','status':'closed'})
                  if ok:
                      passed={'model':model,'duration_s':round(time.monotonic()-t,3),'proposal':obj}
                      break
                  errors.append({'model':model,'error':'CONTRACT_MISMATCH','raw_prefix':raw[:400]})
              except Exception as e:
                  errors.append({'model':model,'error':type(e).__name__+':'+str(e)[:300]})
          out={
            'schema':'PROJECT_BRAIN_AUTOMATIONBENCH_FREE_PLANNER_TRANSPORT_SMOKE_V1',
            'pass':passed is not None,
            'passed':passed,
            'errors':errors,
            'benchmark_cases_read':0,
            'benchmark_cases_executed':0,
            'incremental_spend_usd':0,
          }
          print(json.dumps(out,indent=2,sort_keys=True))
          assert out['pass'], out
          PY
