name: Execute Frozen Parent Astronomy Once

on:
  push:
    branches:
      - verify/numeric-relation-jq-reuse-20260930-v1
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Refresh Ubuntu package metadata
        run: sudo apt-get update
      - name: Run deterministic compiler regressions
        run: python canonical/tests/test_numeric_relation_jq_reuse.py
      - name: Execute frozen parent astronomy task exactly once
        run: python execute_parent_astronomy_once.py
      - name: Upload terminal and oracle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parent-astronomy-eros-kepler-real-task-v1
          path: |
            PARENT_ASTRONOMY_TERMINAL.json
            PARENT_ASTRONOMY_ORACLE.json
            canonical/astra_runtime/tmp/PARENT_ASTRONOMY_EROS_KEPLER_RESULT.json
            canonical/astra_runtime/evidence/
          if-no-files-found: warn
