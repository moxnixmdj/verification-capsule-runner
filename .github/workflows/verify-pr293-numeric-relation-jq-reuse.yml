name: Preflight Corrected Frozen Parent Astronomy

on:
  push:
    branches:
      - verify/numeric-relation-jq-reuse-20260930-v1
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Refresh Ubuntu package metadata
        run: sudo apt-get update
      - name: Run deterministic compiler regressions
        run: python canonical/tests/test_numeric_relation_jq_reuse.py
      - name: Preflight corrected frozen NASA JPL task paths
        run: python verify_parent_astronomy_jpl_preflight_v2.py
      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parent-astronomy-jpl-preflight-v2
          path: parent-astronomy-jpl-preflight-v2.json
          if-no-files-found: error
