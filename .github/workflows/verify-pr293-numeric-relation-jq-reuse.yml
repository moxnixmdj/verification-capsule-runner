name: Verify PR293 Numeric Relation JQ Reuse

on:
  push:
    branches:
      - verify/numeric-relation-jq-reuse-20260930-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Refresh Ubuntu package metadata
        run: sudo apt-get update
      - name: Run deterministic compiler regressions
        run: python canonical/tests/test_numeric_relation_jq_reuse.py
      - name: Run fresh cross-domain numeric relation task and independent oracle
        run: python verify_numeric_relation_jq_reuse.py
      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr293-numeric-relation-jq-reuse-report
          path: numeric-relation-fresh-report.json
          if-no-files-found: error
