name: Verify Parent Runtime Closure Prestart Gate

on:
  push:
    branches:
      - verify/numeric-relation-jq-reuse-20260930-v1
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Refresh Ubuntu package metadata
        run: sudo apt-get update
      - name: Run deterministic compiler regressions
        run: python canonical/tests/test_numeric_relation_jq_reuse.py
      - name: Verify complete parent runtime path before any one-shot task
        run: python verify_parent_runtime_closure_prestart.py
      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parent-runtime-closure-prestart-report
          path: parent-runtime-closure-prestart-report.json
          if-no-files-found: error
