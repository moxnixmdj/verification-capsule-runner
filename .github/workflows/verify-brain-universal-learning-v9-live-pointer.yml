name: Verify Brain Universal Learning V9 Live Pointer

on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/universal_learning_v9_live_pointer/**"
      - ".github/workflows/verify-brain-universal-learning-v9-live-pointer.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact pointer blob identities
        run: |
          cd capsules/universal_learning_v9_live_pointer
          python - <<'PY'
          import hashlib,json,pathlib
          m=json.load(open("EXPECTED_BRAIN_BLOBS.json",encoding="utf-8"))
          for rel,expected in m["exact_brain_blobs"].items():
              data=pathlib.Path(rel).read_bytes()
              got=hashlib.sha1(f"blob {len(data)}\0".encode()+data).hexdigest()
              assert got==expected,(rel,got,expected)
          print("exact pointer blobs: PASS")
          PY
      - name: Verify V9 live pointer chain and truth preservation
        run: |
          cd capsules/universal_learning_v9_live_pointer
          python - <<'PY'
          import hashlib,json,pathlib
          def read(p): return json.load(open(p,encoding="utf-8"))
          def blob(p):
              data=pathlib.Path(p).read_bytes()
              return hashlib.sha1(f"blob {len(data)}\0".encode()+data).hexdigest()

          m=read("EXPECTED_BRAIN_BLOBS.json"); exp=m["expected"]
          root3p="canonical/governance/ROOT3_RESIDUAL_COMPRESSION_V1.json"
          cutp="canonical/governance/CURRENT_ZERO_REALITY_MINIMUM_CUT_V8.json"
          frontierp="canonical/governance/ROOT2_ROOT3_MINIMUM_EXECUTION_FRONTIER_V1.json"
          termp="canonical/governance/CURRENT_TERMINAL_AUTHORITY_V1.json"
          actp="canonical/governance/UNIVERSAL_LEARNING_META_POLICY_V9_ACTIVATION_V1.json"
          root3=read(root3p); cut=read(cutp); frontier=read(frontierp); term=read(termp); act=read(actp)
          root3_sha=blob(root3p); cut_sha=blob(cutp); frontier_sha=blob(frontierp)

          rows=[x for x in root3["compressed_residuals"] if x.get("predicate_id")=="UNKNOWN_DOMAIN_UNCOVERED_TRANSFER_AUDIT"]
          assert len(rows)==1,rows
          u=rows[0]
          assert u["operative_learning_overlay"]=="UNIVERSAL_LEARNING_META_POLICY_V9",u
          assert u["load_bearing_learning_authority"]=="UNIVERSAL_LEARNING_PROOF_PROGRAM_V7",u
          assert u["planning_compression_predecessor"]=="UNIVERSAL_LEARNING_EQUIVALENCE_BASIS_V8",u
          assert u["frozen_direct_leaf_ids"]==[
              "CROSS_DOMAIN_TRANSFER_OUTSIDE_MYSTERYMECHANISM_TASK_STRUCTURE",
              "CALIBRATED_UNKNOWN_OR_ABSTENTION_ON_NONIDENTIFIABLE_OR_UNDERSPECIFIED_VARIANTS",
          ],u
          assert "TWO_FROZEN_INFORMATION_SAFE_DIRECT_ORACLE_LEAVES" in u["current_residual"],u

          v8=root3["authority"]["universal_learning_v8_overlay"]
          v9=root3["authority"]["universal_learning_v9_overlay"]
          assert v8["governance_git_blob_sha"]==exp["v8_governance_sha"],v8
          assert v8["independent_verifier_merge_commit"]==exp["v8_verifier_commit"],v8
          assert v9["governance_git_blob_sha"]==exp["v9_governance_sha"],v9
          assert v9["activation_git_blob_sha"]==exp["v9_activation_sha"],v9
          assert v9["mechanism_verifier_merge_commit"]==exp["v9_mechanism_verifier_commit"],v9
          assert v9["activation_verifier_merge_commit"]==exp["v9_activation_verifier_commit"],v9

          assert cut["authority"]["root3_compression"]["git_blob_sha"]==root3_sha,cut["authority"]["root3_compression"]
          assert frontier["authority"]["root3_residual_compression"]["git_blob_sha"]==root3_sha,frontier["authority"]["root3_residual_compression"]

          src=term["sources"]
          assert src["root3_residual_compression_v1"]["git_blob_sha"]==root3_sha,src["root3_residual_compression_v1"]
          assert src["current_zero_reality_minimum_cut_v8"]["git_blob_sha"]==cut_sha,src["current_zero_reality_minimum_cut_v8"]
          assert src["root2_root3_minimum_execution_frontier_v1"]["git_blob_sha"]==frontier_sha,src["root2_root3_minimum_execution_frontier_v1"]

          tv8=src["universal_learning_equivalence_basis_v8"]
          tv9=src["universal_learning_meta_policy_v9"]
          assert tv8["governance_git_blob_sha"]==exp["v8_governance_sha"],tv8
          assert tv9["governance_git_blob_sha"]==exp["v9_governance_sha"],tv9
          assert tv9["activation_git_blob_sha"]==exp["v9_activation_sha"],tv9
          assert tv9["load_bearing_authority"]=="UNIVERSAL_LEARNING_PROOF_PROGRAM_V7",tv9

          assert act["hard_rules"][0]=="V7_REMAINS_LOAD_BEARING_TRUST_EXECUTION_AND_EMPIRICAL_ACTION_AUTHORITY",act
          assert term["truth"]["opus55_acceptance"]=="5/19_PASS__14/19_OPEN",term["truth"]
          assert term["truth"]["opus55_verified_owned"]=="5/19_VERIFIED_OWNED_EQUAL_OR_BETTER__14/19_ACCEPTANCE_OPEN",term["truth"]
          assert term["truth"]["achieved"] is False,term["truth"]

          for obj in (root3,cut,frontier):
              assert obj["acceptance_credit_delta"]==0,obj.get("schema")
              assert obj["ownership_credit_delta"]==0,obj.get("schema")
              assert obj["fresh_reality_authority"] is False,obj.get("schema")
              assert obj["promotion_authority"] is False,obj.get("schema")

          print("V9 live pointer chain and truth preservation: PASS")
          PY
