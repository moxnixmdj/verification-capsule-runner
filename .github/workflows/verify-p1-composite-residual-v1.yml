name: Verify P1 composite residual v1

on:
  pull_request:
    paths:
      - "capsules/p1_composite_residual_v1/**"
      - ".github/workflows/verify-p1-composite-residual-v1.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact mirrored Brain blobs
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          root=Path("capsules/p1_composite_residual_v1")
          expected={
            "canonical/runtime/p1_composite_proof_residual_compiler_v1.py":"b93fd4674319982a5037827b077be958fac24fe4",
            "canonical/tests/test_p1_composite_proof_residual_compiler_v1.py":"31f2a7cce17bb678a419261887ae1558af004a50",
            "canonical/governance/P1_TRAJECTORY_T0_T2_MULTIPLEX_TERMINAL_BINDING_V1.json":"8703c6aa08227467a619a7ae90d0d61f8e54da39",
            "canonical/governance/P1_COMPOSITE_PROOF_ROLE_RECONCILIATION_V1.json":"700381c22715dbd058370bddc07f99888a9bc97a",
            "canonical/verification/TRAJECTORY_TYPED_IR_V4_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json":"ee69a93c45a2b16676c49bfb0a01749a5c4ea1e2",
            "canonical/runtime/trajectory_failure_typed_ir_candidate_v4.py":"0c386e6b78a8e97e9c1944e63600047bc4e2849b",
            "canonical/runtime/trajectory_failure_typed_ir_proof_v4.py":"6e1dfaa6b63fc629d55d07b2361bf625f11a5ce3",
            "canonical/tests/test_trajectory_failure_typed_ir_v4.py":"70a224fec7341775e46bb1bfb8bd2d33b3c355b3",
            "canonical/runtime/p1_terminal_execution_scope_audit_v1.py":"6793cc98fa8ef767cb6ec8fdd33d8e7d50b2833d",
            "canonical/governance/TERMINAL_PARENT_PORTFOLIO_RUNNER_BINDING_V1.json":"a1630299d29ea9c07e55b4314c07ddb3228c3287",
            "canonical/runtime/terminal_parent_portfolio_runner_v1.py":"431b62e503a6a179f19339ae5e0ab6948424a650",
            "canonical/runtime/contract_native_proof_suites.py":"0210790c7dd705ef328e1b55d529a30c5c6c3337",
          }
          for rel,want in expected.items():
            data=(root/rel).read_bytes()
            got=hashlib.sha1(b"blob "+str(len(data)).encode()+b"\0"+data).hexdigest()
            assert got==want,(rel,got,want)
          print("exact mirrored blobs:",len(expected))
          PY
      - name: Run P1 residual compiler tests
        working-directory: capsules/p1_composite_residual_v1
        run: python -m unittest canonical.tests.test_p1_composite_proof_residual_compiler_v1 -v
