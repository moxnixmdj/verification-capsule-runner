name: Verify Finance Index transform overlay projection
on:
  pull_request:
    paths:
      - "subject/FINANCE_INDEX_PUBLIC_TRANSFORM_ROUTE_SATURATION_20261004_V1.json"
      - "subject/FINANCE_INDEX_PUBLIC_TRANSFORM_ROUTE_SATURATION_PUBLIC_RUNNER_VERIFICATION_20261004_V1.json"
      - "subject/FINANCE_INDEX_PUBLIC_TRANSFORM_ROUTE_SATURATION_ACTIVATION_V1.json"
      - "subject/CURRENT_TERMINAL_AUTHORITY_V1.json"
      - "subject/TERMINAL_ROOT_CAUSE_STATE_V1.json"
      - "subject/ROOT2_MEASUREMENT_BRIDGE_CURRENT_V1.json"
      - "verify_finance_index_transform_overlay_projection.py"
      - ".github/workflows/verify-finance-index-transform-overlay-projection.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python verify_finance_index_transform_overlay_projection.py
