name: Verify live terminal authorization fetch
on:
  pull_request:
    branches: [main]
    paths:
      - 'session_bridge/controller.py'
      - 'verification/test_live_terminal_authorization_fetch.py'
      - '.github/workflows/verify-live-terminal-authorization-fetch.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pytest -q verification/test_live_terminal_authorization_fetch.py
