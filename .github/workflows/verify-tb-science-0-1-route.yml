name: Verify Terminal-Bench-Science 0.1 zero-case route
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/verify-tb-science-0-1-route.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Freeze Terminal-Bench-Science v0.1.0 source identity
        run: |
          git clone -q --branch v0.1.0 --single-branch https://github.com/harbor-framework/terminal-bench-science.git /tmp/tbs
          test "$(git -C /tmp/tbs hash-object CITATION.cff)" = "7a899ac093cc66b7d25e95106b38b20fe99f17ed"
          grep -q '^version: v0.1.0$' /tmp/tbs/CITATION.cff
          echo "SOURCE_COMMIT=$(git -C /tmp/tbs rev-parse HEAD)"
      - name: Verify zero-cost local Docker Harbor carrier
        run: |
          python -m pip install --disable-pip-version-check -q 'harbor==0.23.0'
          harbor --version
          harbor run --help >/dev/null
          harbor version show --help >/dev/null
          docker version >/dev/null
          docker info >/tmp/docker-info.txt
          grep -q 'Server Version' /tmp/docker-info.txt
      - name: Resolve exact public dataset metadata without task content
        run: |
          set -e
          if harbor version show terminal-bench-science/terminal-bench-science@0.1.0 --json > /tmp/tbs01.json 2>/tmp/tbs01.err; then
            TAG_USED=0.1.0
          elif harbor version show terminal-bench-science/terminal-bench-science@v0.1.0 --json > /tmp/tbs01.json 2>/tmp/tbs01.err; then
            TAG_USED=v0.1.0
          else
            cat /tmp/tbs01.err
            exit 1
          fi
          export TAG_USED
          python - <<'PY'
          import json, os
          p=json.load(open('/tmp/tbs01.json'))
          assert p['package']=='terminal-bench-science/terminal-bench-science', p
          assert p['type']=='dataset', p
          assert p['visibility']=='public', p
          tags={str(x) for x in p.get('tags',[])}
          assert {'0.1.0','v0.1.0'} & tags or os.environ['TAG_USED'] in {'0.1.0','v0.1.0'}, p
          h=str(p.get('content_hash',''))
          assert h.startswith('sha256:') and len(h)>20, p
          assert 'files' not in p and 'tasks' not in p, p
          print(json.dumps({
            'schema':'PROJECT_BRAIN_TB_SCIENCE_0_1_ZERO_CASE_PREFLIGHT_V1',
            'status':'PASS',
            'package':p['package'],
            'revision':p.get('revision'),
            'content_hash':h,
            'tags':sorted(tags),
            'harbor_tag_used':os.environ['TAG_USED'],
            'visibility':p['visibility'],
            'terminal_case_content_read':0,
            'incremental_spend_usd':0
          },sort_keys=True))
          PY
