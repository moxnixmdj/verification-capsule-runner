name: Verify LiveBench Visible Implication Breakthrough V1

on:
  push:
    branches:
      - verify/livebench-visible-implication-breakthrough-v1-20261004
    paths:
      - verification/livebench_visible_implication_breakthrough_v1.py
      - .github/workflows/verify-livebench-visible-implication-breakthrough-v1.yml

permissions:
  contents: read

concurrency:
  group: livebench-visible-implication-breakthrough-v1
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run public-only verifier
        run: python3 verification/livebench_visible_implication_breakthrough_v1.py
      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livebench-visible-implication-breakthrough-v1
          path: livebench_visible_implication_breakthrough_v1_receipt.json
          if-no-files-found: error
          retention-days: 7
