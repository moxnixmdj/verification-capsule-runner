name: Smoke Arena Opus 5.5 Direct guest route
on:
  pull_request:
    branches: [main]
    paths:
      - 'verification/arena_opus55_direct_smoke.py'
      - '.github/workflows/smoke-arena-opus55-direct.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --no-cache-dir playwright
      - run: python -m playwright install --with-deps chromium
      - run: python verification/arena_opus55_direct_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arena-opus55-direct-smoke
          path: arena_smoke.png
          if-no-files-found: ignore
