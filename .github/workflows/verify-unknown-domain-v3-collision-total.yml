name: Verify Unknown-Domain V3 collision-total universal proof

on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/runtime/unknown_domain_direct_hidden_generator_v3.py'
      - 'canonical/runtime/unknown_domain_direct_v3_universal_proof_v1.py'
      - 'canonical/governance/UNKNOWN_DOMAIN_V3_COLLISION_TOTAL_UNIVERSAL_PROOF_CANDIDATE_20261005_V1.json'
      - 'verify_unknown_domain_v3_collision_total.py'
      - '.github/workflows/verify-unknown-domain-v3-collision-total.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independent collision-total universal verification
        run: python verify_unknown_domain_v3_collision_total.py
