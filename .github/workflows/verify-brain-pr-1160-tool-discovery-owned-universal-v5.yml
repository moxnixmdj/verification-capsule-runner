name: Verify Brain PR 1160 Tool Discovery owned-universal V5
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/brain_pr_1160_tool_discovery_owned_universal_v5/**"
      - ".github/workflows/verify-brain-pr-1160-tool-discovery-owned-universal-v5.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact mirrored Brain blobs
        working-directory: capsules/brain_pr_1160_tool_discovery_owned_universal_v5
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          manifest=json.load(open("manifest.json"))
          for path,want in manifest["exact_brain_blobs"].items():
              data=Path(path).read_bytes()
              got=hashlib.sha1(b"blob "+str(len(data)).encode()+b"\0"+data).hexdigest()
              assert got==want,(path,want,got)
          print("EXACT_BRAIN_BLOBS_PASS")
          PY
      - name: Run candidate adversarial and finite-world suite
        working-directory: capsules/brain_pr_1160_tool_discovery_owned_universal_v5
        env:
          PYTHONPATH: .
        run: python -m unittest canonical.tests.test_tool_discovery_owned_universal_v5 -v
      - name: Run independent target-preservation and exhaustive oracle
        working-directory: capsules/brain_pr_1160_tool_discovery_owned_universal_v5
        env:
          PYTHONPATH: .
        run: python verify.py
