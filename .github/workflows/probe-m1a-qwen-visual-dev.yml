name: Probe M1A Qwen visual dev signal
on:
  pull_request:
    branches: [main]
    paths:
      - 'verification/m1a_qwen_visual_dev.py'
      - 'verification/m1a_visual_dev.json'
      - '.github/workflows/probe-m1a-qwen-visual-dev.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      HF_HOME: /tmp/hf
      PIP_NO_CACHE_DIR: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch torchvision
      - run: python -m pip install --no-cache-dir 'transformers>=4.57,<5' huggingface_hub accelerate safetensors pillow
      - run: cd verification && python m1a_qwen_visual_dev.py
