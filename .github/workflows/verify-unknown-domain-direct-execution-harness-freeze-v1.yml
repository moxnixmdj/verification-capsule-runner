name: Verify Unknown-Domain direct execution harness freeze V1

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact frozen harness and hidden-data firewall
        run: python verify_unknown_domain_direct_execution_harness_freeze_v1.py
