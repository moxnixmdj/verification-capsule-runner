name: Verify LiveBench Union25 extension quotient V1
on:
  pull_request:
    branches: [main]
    paths:
      - "verify_livebench_union25_extension_quotient_v1.py"
      - ".github/workflows/verify-livebench-union25-extension-quotient-v1.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
      - name: Install exact public checker dependencies
        run: python -m pip install --disable-pip-version-check nltk==3.10.3 langdetect==1.0.9 immutabledict==4.2.2
      - name: Checkout exact frozen LiveBench
        run: |
          git clone --filter=blob:none https://github.com/LiveBench/LiveBench.git /tmp/LiveBench
          git -C /tmp/LiveBench checkout 8f8e5c381a16e3f24257776edd53471fe86f8091
      - name: Enumerate exact Union25 extension quotient
        run: python verify_livebench_union25_extension_quotient_v1.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livebench-union25-extension-quotient-v1
          path: livebench_union25_extension_quotient_v1.json
          if-no-files-found: error
