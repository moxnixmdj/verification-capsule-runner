name: Verify P1 pre-case carrier failure

on:
  push:
    branches: ["verify/p1-precase-carrier-failure-20261003-sol"]
    paths:
      - ".github/workflows/verify-p1-precase-carrier-failure.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify mirrored authenticated GitHub metadata and current Brain reconciliation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          cp capsules/p1_precase_carrier_failure_20261003/brain_observation.json evidence/brain_observation.json
          cp capsules/p1_precase_carrier_failure_20261003/brain_authority.json evidence/brain_authority.json
          cp capsules/p1_precase_carrier_failure_20261003/github_run.json evidence/run.json
          cp capsules/p1_precase_carrier_failure_20261003/github_jobs.json evidence/jobs.json
          cp capsules/p1_precase_carrier_failure_20261003/github_artifacts.json evidence/artifacts.json
          python - <<'PY'
          import datetime as dt, hashlib, json
          from pathlib import Path
          obs=json.loads(Path("evidence/brain_observation.json").read_text())
          auth=json.loads(Path("evidence/brain_authority.json").read_text())
          r=json.loads(Path("evidence/run.json").read_text())
          js=json.loads(Path("evidence/jobs.json").read_text())
          ar=json.loads(Path("evidence/artifacts.json").read_text())
          assert obs["source"]["workflow_run_id"]==37106776756
          assert obs["source"]["workflow_job_id"]==111156743001
          assert obs["source"]["head_sha"]=="b12723d5a3116d00edd438d389c8282b47b52016"
          assert obs["source"]["runner_id"]==0
          assert obs["source"]["steps"]==[]
          assert obs["interpretation"]["user_code_executed"] is False
          assert obs["interpretation"]["case_generation_began"] is False
          assert obs["interpretation"]["fresh_reality_units_consumed"]==0
          assert auth["execution_authority"] is False
          assert auth["failed_first_trigger"]["workflow_run_id"]==37106776756
          assert auth["failed_first_trigger"]["runner_id"]==0
          assert auth["failed_first_trigger"]["steps_executed"]==0
          assert auth["failed_first_trigger"]["case_generation_began"] is False
          assert auth["failed_first_trigger"]["fresh_reality_units_consumed"]==0
          assert r["head_sha"]=="b12723d5a3116d00edd438d389c8282b47b52016"
          assert r["run_attempt"]==1 and r["event"]=="push"
          assert r["status"]=="completed" and r["conclusion"]=="failure"
          assert js["total_count"]==1
          j=js["jobs"][0]
          assert j["id"]==111156743001 and j["name"]=="execute"
          assert j["status"]=="completed" and j["conclusion"]=="failure"
          assert j["runner_id"]==0 and j.get("steps")==[]
          assert ar["total_count"]==0 and ar.get("artifacts")==[]
          started=dt.datetime.fromisoformat(j["started_at"].replace("Z","+00:00"))
          ended=dt.datetime.fromisoformat(j["completed_at"].replace("Z","+00:00"))
          assert (ended-started).total_seconds() <= 10
          receipt={
            "schema":"PROJECT_BRAIN_P1_PRECASE_CARRIER_FAILURE_INDEPENDENT_VERIFICATION_20261003_V1",
            "status":"INDEPENDENT_RUNNER_PASS__MIRRORED_AUTHENTICATED_GITHUB_METADATA__RUNNER_ZERO__ZERO_STEPS__ZERO_ARTIFACTS__PRECASE_INFRASTRUCTURE_FAILURE",
            "failed_run_id":37106776756,
            "failed_job_id":111156743001,
            "activation_head_sha":r["head_sha"],
            "runner_id":j["runner_id"],
            "observed_steps":0,
            "artifact_count":0,
            "case_generation_established":False,
            "fresh_reality_consumption_established":False,
            "p1_quarantine_lifted":False,
            "retry_of_failed_workflow_authorized":False,
            "reissue_new_one_use_authority_eligible":True,
            "incremental_spend_usd":0,
            "capability_credit_delta":0,
            "family_credit_delta":0,
            "promotion_authority":False,
            "evidence_sha256":{
              n:hashlib.sha256(Path("evidence/"+n).read_bytes()).hexdigest()
              for n in ["brain_observation.json","brain_authority.json","run.json","jobs.json","artifacts.json"]
            }
          }
          Path("evidence/receipt.json").write_text(json.dumps(receipt,indent=2,sort_keys=True)+"\n")
          print(json.dumps(receipt,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p1-precase-carrier-failure-verification
          path: evidence/
          if-no-files-found: error
