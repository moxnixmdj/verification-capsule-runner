name: Verify Retrieval V10 Brain live calibration state
on:
  push:
    branches:
      - verify/retrieval-v10-brain-state-20261003
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact Brain subject blobs
        run: |
          test "$(git hash-object subjects/v10final/retrieval_live_event_ledger_v3.py)" = "5008c5d804a511014a803522b713259b6bb16f7d"
          test "$(git hash-object subjects/v10final/global_retrieval_controller_v3.py)" = "266122c4e893fbcb34784bc01eb859b390dc2cf4"
          test "$(git hash-object subjects/v10final/global_retrieval_entrypoint_v4.py)" = "b1fd8b92f1aa931b283f242bde7612a3d29b5501"
          test "$(git hash-object subjects/v10final/retrieval_live_events_v3.jsonl)" = "1d9c1bdf6b7722c07a081eefa00f40b6ee968fc5"
          test "$(git hash-object subjects/v10final/retrieval_v10_live_state_derivation.json)" = "fcf3db361e26142f5bb1c67913d6fb58dbcde67b"
          test "$(git hash-object subjects/v10final/core_receipt.json)" = "77fc818f6b6ea9bb35dffd449d529fb9a507b8ce"
          test "$(git hash-object subjects/v10final/live_receipt.json)" = "2c47dc835efd0142248b08cefc8438370fcbf1f3"
      - name: Install exact V10 runtime/state
        run: |
          cp subjects/v10final/retrieval_live_event_ledger_v3.py canonical/runtime/retrieval_live_event_ledger_v3.py
          cp subjects/v10final/global_retrieval_controller_v3.py canonical/runtime/global_retrieval_controller_v3.py
          cp subjects/v10final/global_retrieval_entrypoint_v4.py canonical/runtime/global_retrieval_entrypoint_v4.py
          cp subjects/v10final/retrieval_live_events_v3.jsonl canonical/state/retrieval_live_events_v3.jsonl
      - name: Verify contextual calibration and route ordering
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          from pathlib import Path
          from canonical.runtime import retrieval_live_event_ledger_v3 as ledger
          from canonical.runtime import global_retrieval_controller_v3 as ctl
          root=Path(".")
          events=ledger.load_jsonl(root/"canonical/state/retrieval_live_events_v3.jsonl")
          cal=ledger.aggregate(events)
          assert cal["event_count"]==31
          assert cal["episode_count"]==13
          assert cal["task_class_count"]==7
          assert cal["task_class_source_stats"]["CODE_REPOSITORY"]["GITHUB"]["sufficient_witness_actions"]==2
          assert cal["task_class_source_stats"]["CODE_REPOSITORY"]["CODEBERG"]["failures"]==2
          assert cal["task_class_source_stats"]["MODEL_HUB"]["HUGGINGFACE"]["sufficient_witness_actions"]==1
          assert cal["task_class_source_stats"]["SCHOLARLY_WORK"]["OPENALEX"]["sufficient_witness_actions"]==2
          assert cal["task_class_source_stats"]["SCHOLARLY_WORK"]["CROSSREF"]["sufficient_witness_actions"]==1
          scholarly=cal["task_class_pairwise_candidate_overlap"]["SCHOLARLY_WORK"]
          pair=next(x for x in scholarly if {x["source_a"],x["source_b"]}=={"CROSSREF","OPENALEX"})
          assert pair["intersection_entity_observations"]>=1
          suff=[e for e in events if e["verified_sufficient_candidate_ids"]]
          assert len(suff)==7
          assert all(e["independent_receipt"]=="canonical/verification/RETRIEVAL_V10_CONTEXTUAL_LIVE_PROVIDER_EPOCH_PUBLIC_RUNNER_VERIFICATION_20261003_V1.json" for e in suff)
          def rank(tc,sources):
            acts=[{"action_id":tc+":"+s,"source_id":s,"upstream_group":s+"_PUBLIC_API","task_class":tc} for s in sources]
            return ctl.rank_actions_contextual(acts,live_calibration=cal,default_task_class=tc)
          code=rank("CODE_REPOSITORY",["GITHUB","GITLAB","CODEBERG"])
          assert code[0]["source_id"]=="GITHUB",code
          model=rank("MODEL_HUB",["HUGGINGFACE","GITHUB"])
          assert model[0]["source_id"]=="HUGGINGFACE",model
          scholarly_rank=rank("SCHOLARLY_WORK",["CROSSREF","OPENALEX"])
          assert scholarly_rank[0]["source_id"]=="CROSSREF",scholarly_rank
          core=json.load(open("subjects/v10final/core_receipt.json"))
          live=json.load(open("subjects/v10final/live_receipt.json"))
          deriv=json.load(open("subjects/v10final/retrieval_v10_live_state_derivation.json"))
          assert core["independent_runner"]["conclusion"]=="success"
          assert live["status"].startswith("INDEPENDENT_PUBLIC_RUNNER_PASS")
          assert deriv["derived_state"]["state_sha256"]=="cc4168d8c63e03a9aa0ccd4ba4bfab1f22cf941e97afe2b2703d1b8f75e39124"
          assert deriv["corrections"][0]=="TITLE_ONLY_SCHOLARLY_SUFFICIENCY_REMOVED"
          print("event_count",cal["event_count"])
          print("code_first",code[0]["source_id"])
          print("model_first",model[0]["source_id"])
          print("scholarly_first",scholarly_rank[0]["source_id"])
          PY
