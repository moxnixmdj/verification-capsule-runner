name: Execute TB-Science rank10 v1 one-shot isolated

on:
  pull_request:
    branches: [terminal-execution-v1]
    paths:
      - "capsules/tb_science_rank10_20261007_v1/ACTIVATE_RANK10_PR.json"

permissions:
  contents: read

concurrency:
  group: tb-science-rank10-v1-one-shot
  cancel-in-progress: false

jobs:
  terminal-slot:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pre-exposure exact authority, lease, transport, and carrier gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$GITHUB_EVENT_NAME" = "pull_request"
          test "$GITHUB_BASE_REF" = "terminal-execution-v1"
          test "$GITHUB_HEAD_REF" = "execute/tb-science-rank10-20261007-v1"
          C=capsules/tb_science_rank10_20261007_v1
          test "$(git hash-object "$C/TB_SCIENCE_RANK10_ONE_SLOT_EXECUTION_AUTHORITY_20261007_V1.json")" = "7b4d8c2555d102b30e02673c95675403ae947629"
          test "$(git hash-object "$C/ACTION_INTENT_TB_SCIENCE_RANK10_ONE_SHOT_20261007_V1.json")" = "e65720a36d7c09a3be5a33246f3ab54e20612915"
          test "$(git hash-object "$C/TB_SCIENCE_CURRENT_SLOT_LEDGER_RECONCILIATION_20261007_V8.json")" = "eb869db71db99a77912c0051ff12f162d616b1a1"
          test "$(git hash-object "$C/TB_SCIENCE_CURRENT_SLOT_LEDGER_RECONCILIATION_20261007_V7.json")" = "d3ff32dd833dfb5fcdce58e134185bfaf19e95ae"
          test "$(git hash-object "$C/TB_SCIENCE_TERMINAL_EXECUTION_MANIFEST_V1.json")" = "6dfa880b1f68881531afbba6ca211681801fd19b"
          test "$(git hash-object "$C/TB_SCIENCE_PLANNER_TRANSPORT_REPAIR_LIVE_VERIFICATION_20261007_V1.json")" = "877e5ddf815c1958f4ab41f8462ad54af87f0c87"
          test "$(git hash-object "$C/TB_SCIENCE_TRANSITIVE_RUNTIME_CLOSURE_MANIFEST_20261007_V2.json")" = "31656d35034338dfcb699672bcd4788b283b83c9"
          test "$(git hash-object "$C/TB_SCIENCE_REPAIRED_TRANSITIVE_CARRIER_CLOSURE_PUBLIC_VERIFICATION_20261007_V1.json")" = "61495f5977ea745e63ca14136875b97e3e95cd45"
          test "$(git hash-object "$C/python_transitive_runtime_closure_v1.py")" = "43d502c621c219632fa0f9a19632dfc0228e4847"
          test "$(git hash-object "$C/RANK10_EPOCH_V1.json")" = "8d0bc7999769a32147eab08acb31436e7abe743c"
          test "$(git hash-object "$C/RANK10_EXECUTION_CLAIM_V1.json")" = "f9199b6fc08383acccdddd86b8c8bd243b048fad"

          python - <<'PY'
          import json, pathlib, subprocess, urllib.request, os
          C=pathlib.Path("capsules/tb_science_rank10_20261007_v1")
          a=json.loads((C/"TB_SCIENCE_RANK10_ONE_SLOT_EXECUTION_AUTHORITY_20261007_V1.json").read_text())
          i=json.loads((C/"ACTION_INTENT_TB_SCIENCE_RANK10_ONE_SHOT_20261007_V1.json").read_text())
          l8=json.loads((C/"TB_SCIENCE_CURRENT_SLOT_LEDGER_RECONCILIATION_20261007_V8.json").read_text())
          l7=json.loads((C/"TB_SCIENCE_CURRENT_SLOT_LEDGER_RECONCILIATION_20261007_V7.json").read_text())
          tm=json.loads((C/"TB_SCIENCE_TERMINAL_EXECUTION_MANIFEST_V1.json").read_text())
          tv=json.loads((C/"TB_SCIENCE_PLANNER_TRANSPORT_REPAIR_LIVE_VERIFICATION_20261007_V1.json").read_text())
          cm=json.loads((C/"TB_SCIENCE_TRANSITIVE_RUNTIME_CLOSURE_MANIFEST_20261007_V2.json").read_text())
          cv=json.loads((C/"TB_SCIENCE_REPAIRED_TRANSITIVE_CARRIER_CLOSURE_PUBLIC_VERIFICATION_20261007_V1.json").read_text())
          e=json.loads((C/"RANK10_EPOCH_V1.json").read_text())
          claim=json.loads((C/"RANK10_EXECUTION_CLAIM_V1.json").read_text())
          slot="terminal-bench-science/rdkit-ic-constraints::trial-0"
          task="terminal-bench-science/rdkit-ic-constraints"
          digest="sha256:17e356ab255088712c7dfa9765bf077b33a3da221f4a03d4770576857f9c0b6f"

          assert a["status"].startswith("ACTIVE__")
          assert a["slot"]=={"id":slot,"rank":10,"digest":digest}
          assert a["exact_route"]["planner"]=="01d859c8f27b317893027e693c9aa49e833a256f"
          assert a["exact_route"]["transitive_runtime_file_count"]==14
          assert a["controls"]["exact_slot_count"]==1
          assert a["controls"]["attempts"]==1 and a["controls"]["retries"]==0
          assert a["controls"]["replacement_allowed"] is False
          assert a["controls"]["incremental_spend_usd_max"]==0
          assert a["controls"]["precheck_failure_consumes_slot"] is False
          assert a["current_truth"]["task_started"] is False and a["current_truth"]["result_present"] is False
          assert i["slot"]=={"id":slot,"digest":digest,"rank":10}
          assert i["controls"]["attempts"]==1 and i["controls"]["retries"]==0
          assert l8["current_counts"]["consumed_slots"]==9
          assert l8["current_counts"]["next_untouched_slot"]=={"schedule_rank":10,"slot_id":slot,"task_digest":digest}
          assert l7["truth_repair"]["next_untouched_slot"]["slot_id"]==slot
          assert len(l7["truth_repair"]["consumed_slots"])==9
          rows=[x for x in tm["task_metadata"] if x.get("name")==task]
          assert len(rows)==1 and rows[0]["digest"]==digest
          assert tm["execution_rules"]["retries_per_slot"]==0
          assert tm["execution_rules"]["carrier_failure_credit"]==0
          assert tm["execution_rules"]["timeout_credit"]==0
          assert tv["status"].startswith("INDEPENDENT_LIVE_LLAMA_CPP_TRANSPORT_PASS")
          assert tv["verified"]["live_tool_schema_and_decode_probe_passed"] is True
          assert cv["status"].startswith("INDEPENDENT_PUBLIC_RUNNER_PASS")
          assert cv["verified"]["complete_exact_carrier_closure_gate_pass"] is True
          assert len(cm["closure"])==14
          assert e["status"]=="CURRENT__ONE_USE_PREEXPOSURE_GATE"
          assert e["slot_id"]==slot and e["task_digest"]==digest and e["schedule_rank"]==10
          assert claim["status"]=="ACTIVE_SINGLE_EXECUTION_LEASE"
          assert claim["slot_id"]==slot and claim["task_digest"]==digest
          assert claim["execution_branch"]=="execute/tb-science-rank10-20261007-v1"
          assert claim["authority_git_blob_sha"]=="7b4d8c2555d102b30e02673c95675403ae947629"
          assert claim["authority_verification_run_id"]==37628333729
          assert claim["attempts_authorized"]==1 and claim["retries_authorized"]==0

          for row in cm["closure"]:
              p=C/row["path"]
              assert p.is_file(), row["path"]
              actual=subprocess.check_output(["git","hash-object",str(p)],text=True).strip()
              assert actual==row["git_blob_sha"], (row["path"],actual,row["git_blob_sha"])

          headers={"Accept":"application/vnd.github+json","User-Agent":"brain-rank10-execution-gate"}
          token=os.environ.get("GH_TOKEN","")
          if token: headers["Authorization"]="Bearer "+token
          req=urllib.request.Request(
              "https://api.github.com/repos/moxnixmdj/verification-capsule-runner/actions/runs/37628333729",
              headers=headers)
          with urllib.request.urlopen(req,timeout=30) as resp: vr=json.load(resp)
          assert vr["status"]=="completed" and vr["conclusion"]=="success"
          assert vr["head_sha"]=="5ae36890449b929bb28d3b05134d771b15cb50a0"
          assert vr["run_attempt"]==1
          PY

          python "$C/python_transitive_runtime_closure_v1.py" --repo-root "$C" --carrier-root "$C"             --root canonical/runtime/harbor_science_agent_v1.py             --root canonical/runtime/harbor_science_planner_v1.py             --root canonical/runtime/lossless_raw_task_contract_v1.py             --root canonical/runtime/raw_task_acceptance_residual_localizer_v1.py > RANK10_CARRIER_CLOSURE.json

          PYTHONPATH="$C" python - <<'PY'
          from canonical.runtime.harbor_science_agent_v1 import HarborScienceAgent
          import canonical.runtime.harbor_science_planner_v1 as planner
          assert HarborScienceAgent.name()=="project-brain-science"
          assert planner.MODEL=="brain-qwen3.5-9b"
          assert "maxLength" not in planner.TOOL["function"]["parameters"]["properties"]["candidates"]["items"]["properties"]["command"]
          assert "maxLength" not in planner.TOOL["function"]["parameters"]["properties"]["candidates"]["items"]["properties"]["verify_command"]
          PY

          epoch_sha="$(curl -fsSL -H 'Accept: application/vnd.github+json'             "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/capsules/tb_science_rank10_20261007_v1/RANK10_EPOCH_V1.json?ref=terminal-execution-v1"             | python -c 'import json,sys; print(json.load(sys.stdin)["sha"])')"
          test "$epoch_sha" = "8d0bc7999769a32147eab08acb31436e7abe743c"
          claim_sha="$(curl -fsSL -H 'Accept: application/vnd.github+json'             "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/capsules/tb_science_rank10_20261007_v1/RANK10_EXECUTION_CLAIM_V1.json?ref=terminal-execution-v1"             | python -c 'import json,sys; print(json.load(sys.stdin)["sha"])')"
          test "$claim_sha" = "f9199b6fc08383acccdddd86b8c8bd243b048fad"
          test "$(nproc)" -ge 4
          awk '/MemTotal/{exit !($2 >= 12000000)}' /proc/meminfo
          df -Pk "$GITHUB_WORKSPACE" | awk 'NR==2{exit !($4 >= 12000000)}'
          docker version >/dev/null
          docker info >/dev/null

      - name: Install exact Harbor
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir -q 'harbor==0.23.0'
          python - <<'PY'
          import importlib.metadata
          assert importlib.metadata.version("harbor")=="0.23.0"
          PY

      - name: Clean-build exact llama.cpp
        run: |
          set -euo pipefail
          rm -rf llama.cpp
          git init llama.cpp
          git -C llama.cpp remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C llama.cpp fetch --depth 1 origin bec4772f6a2527d371557b5d2032641e5ff7619c
          git -C llama.cpp checkout --detach FETCH_HEAD
          test "$(git -C llama.cpp rev-parse HEAD)" = "bec4772f6a2527d371557b5d2032641e5ff7619c"
          cmake -S llama.cpp -B llama.cpp/build -DGGML_CUDA=OFF -DLLAMA_CURL=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build llama.cpp/build -j 2 --target llama-server

      - name: Restore exact Qwen model cache
        uses: actions/cache@v4
        with:
          path: models/Qwen3.5-9B-M-TS-Q4_K_M.gguf
          key: brain-qwen35-9b-f41c0a0c0e43bf721fb2da29374cd1a97271bac0bab08a9dc42964525e82350c

      - name: Acquire and verify exact Qwen model if cache misses
        run: |
          set -euo pipefail
          mkdir -p models
          if [ ! -f models/Qwen3.5-9B-M-TS-Q4_K_M.gguf ]; then
            curl -L --fail --retry 3 --retry-delay 3 --silent --show-error               -o models/Qwen3.5-9B-M-TS-Q4_K_M.gguf               'https://huggingface.co/TheStageAI/Qwen3.5-9B-GGUF/resolve/main/Qwen3.5-9B-M-TS-Q4_K_M.gguf?download=true'
          fi
          echo 'f41c0a0c0e43bf721fb2da29374cd1a97271bac0bab08a9dc42964525e82350c  models/Qwen3.5-9B-M-TS-Q4_K_M.gguf' | sha256sum -c -

      - name: Start exact local cognition endpoint
        run: |
          set -euo pipefail
          EXTRA=()
          if llama.cpp/build/bin/llama-server --help 2>&1 | grep -q -- '--reasoning'; then EXTRA+=(--reasoning off); fi
          nohup llama.cpp/build/bin/llama-server             -m models/Qwen3.5-9B-M-TS-Q4_K_M.gguf             --alias brain-qwen3.5-9b --host 127.0.0.1 --port 8080             -c 8192 -t 4 --parallel 1 --jinja --no-webui "${EXTRA[@]}"             > LOCAL_QWEN_SERVER.log 2>&1 &
          ok=0
          for i in $(seq 1 240); do
            if curl -fsS http://127.0.0.1:8080/health > LOCAL_QWEN_HEALTH.json 2>/dev/null; then ok=1; break; fi
            sleep 1
          done
          test "$ok" = 1

      - name: Immediate live epoch, lease, and authority-verifier gate before irreversible exposure
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          epoch_sha="$(curl -fsSL -H 'Accept: application/vnd.github+json'             "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/capsules/tb_science_rank10_20261007_v1/RANK10_EPOCH_V1.json?ref=terminal-execution-v1"             | python -c 'import json,sys; print(json.load(sys.stdin)["sha"])')"
          test "$epoch_sha" = "8d0bc7999769a32147eab08acb31436e7abe743c"
          claim_sha="$(curl -fsSL -H 'Accept: application/vnd.github+json'             "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/capsules/tb_science_rank10_20261007_v1/RANK10_EXECUTION_CLAIM_V1.json?ref=terminal-execution-v1"             | python -c 'import json,sys; print(json.load(sys.stdin)["sha"])')"
          test "$claim_sha" = "f9199b6fc08383acccdddd86b8c8bd243b048fad"
          curl -fsSL -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN"             "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/37628333729"             | python -c 'import json,sys; x=json.load(sys.stdin); assert x["status"]=="completed" and x["conclusion"]=="success" and x["head_sha"]=="5ae36890449b929bb28d3b05134d771b15cb50a0"'
          C="$GITHUB_WORKSPACE/capsules/tb_science_rank10_20261007_v1"
          PYTHONPATH="$C" python - <<'PY'
          from canonical.runtime.harbor_science_agent_v1 import HarborScienceAgent
          import canonical.runtime.harbor_science_planner_v1 as planner
          assert HarborScienceAgent.name()=="project-brain-science"
          assert planner.MODEL=="brain-qwen3.5-9b"
          PY

      - name: Execute exactly frozen rank10 slot
        id: execute
        continue-on-error: true
        env:
          TASK_NAME: terminal-bench-science/rdkit-ic-constraints
          SAFE_ID: rdkit-ic-constraints-trial-0
        run: |
          set -uo pipefail
          C="$GITHUB_WORKSPACE/capsules/tb_science_rank10_20261007_v1"
          export PYTHONPATH="$C"
          mkdir -p "$GITHUB_WORKSPACE/jobs/$SAFE_ID"
          harbor run             -d terminal-bench-science/terminal-bench-science@0.1.0             -i "$TASK_NAME"             -a canonical.runtime.harbor_science_agent_v1:HarborScienceAgent             -k 1 -n 1 -r 0             --agent-timeout-multiplier 0.48             --environment-build-timeout-multiplier 1.0             --verifier-timeout-multiplier 1.0             --job-name "$SAFE_ID"             --jobs-dir "$GITHUB_WORKSPACE/jobs/$SAFE_ID"
          echo "harbor_exit=$?" >> "$GITHUB_OUTPUT"

      - name: Finalize irreversible conservative rank10 receipt
        if: always()
        env:
          SLOT_ID: terminal-bench-science/rdkit-ic-constraints::trial-0
          TASK_NAME: terminal-bench-science/rdkit-ic-constraints
          SAFE_ID: rdkit-ic-constraints-trial-0
          HARBOR_OUTCOME: ${{ steps.execute.outcome }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          base=root/"jobs"/os.environ["SAFE_ID"]
          results=[]
          for p in base.rglob("result.json") if base.exists() else []:
              try: obj=json.loads(p.read_text())
              except Exception: continue
              results.append((p,obj))
          scored=[]
          exception_info=[]
          for p,obj in results:
              vr=obj.get("verifier_result")
              if isinstance(vr,dict) and isinstance(vr.get("rewards"),dict):
                  scored.append((p,obj))
              ex=obj.get("exception_info")
              if isinstance(ex,dict):
                  exception_info.append({
                      "path":str(p.relative_to(root)),
                      "exception_type":ex.get("exception_type"),
                      "exception_message":ex.get("exception_message"),
                  })
          reward=None; errors=[]
          if len(scored)==1:
              raw=scored[0][1]["verifier_result"]["rewards"].get("reward")
              if isinstance(raw,(int,float)) and not isinstance(raw,bool):
                  reward=float(raw)
              else: errors.append("REWARD_MISSING_OR_NONNUMERIC")
          elif not scored:
              errors.append("NO_TRIAL_RESULT_WITH_VERIFIER_REWARD")
          else:
              errors.append("MULTIPLE_TRIAL_RESULTS_WITH_VERIFIER_REWARD")
          success=(reward is not None and reward>=1.0 and not errors)
          hashes={
              str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
              for p,_ in results
          }
          receipt={
            "schema":"PROJECT_BRAIN_TB_SCIENCE_TERMINAL_SLOT_RECEIPT_RANK10_V1",
            "slot_id":os.environ["SLOT_ID"],
            "task_name":os.environ["TASK_NAME"],
            "task_digest":"sha256:17e356ab255088712c7dfa9765bf077b33a3da221f4a03d4770576857f9c0b6f",
            "status":"SUCCESS" if success else "FINAL_ZERO",
            "reward":reward if reward is not None else 0.0,
            "errors":errors,
            "exception_info":exception_info,
            "harbor_step_outcome":os.environ.get("HARBOR_OUTCOME"),
            "authority_blob":"7b4d8c2555d102b30e02673c95675403ae947629",
            "intent_blob":"e65720a36d7c09a3be5a33246f3ab54e20612915",
            "ledger_v8_blob":"eb869db71db99a77912c0051ff12f162d616b1a1",
            "ledger_v7_blob":"d3ff32dd833dfb5fcdce58e134185bfaf19e95ae",
            "transport_verification_blob":"877e5ddf815c1958f4ab41f8462ad54af87f0c87",
            "closure_manifest_blob":"31656d35034338dfcb699672bcd4788b283b83c9",
            "closure_verification_blob":"61495f5977ea745e63ca14136875b97e3e95cd45",
            "epoch_blob":"8d0bc7999769a32147eab08acb31436e7abe743c",
            "execution_claim_blob":"f9199b6fc08383acccdddd86b8c8bd243b048fad",
            "canonical_authority_verification_run_id":37628333729,
            "canonical_authority_verification_head":"5ae36890449b929bb28d3b05134d771b15cb50a0",
            "agent_timeout_multiplier":0.48,
            "verifier_timeout_multiplier":1.0,
            "strict_timeout_semantics":"SUCCESS_IS_EXACT_POSITIVE_EVIDENCE__ANY_FINAL_NON_SUCCESS_COUNTS_ZERO",
            "github_run_id":os.environ["GITHUB_RUN_ID"],
            "github_run_attempt":os.environ["GITHUB_RUN_ATTEMPT"],
            "github_sha":os.environ["GITHUB_SHA"],
            "result_hashes":hashes,
            "execution_authority_consumed":True,
            "rerun_credit":False,
            "incremental_spend_usd":0,
            "promotion_authority":False,
          }
          pathlib.Path("rdkit-ic-constraints-trial-0__SLOT_RECEIPT.json").write_text(
              json.dumps(receipt,indent=2,sort_keys=True)+"\n")
          print(json.dumps(receipt,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tb-science-rdkit-ic-constraints-trial-0-rank10-v1
          path: |
            rdkit-ic-constraints-trial-0__SLOT_RECEIPT.json
            RANK10_CARRIER_CLOSURE.json
            jobs/rdkit-ic-constraints-trial-0/
            LOCAL_QWEN_HEALTH.json
            LOCAL_QWEN_SERVER.log
          if-no-files-found: warn
          retention-days: 7
