name: Execute TB-Science rank10 v1 one-shot

on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/tb_science_rank10_20261007_v1/ACTIVATE_RANK10_PR.json"

permissions:
  contents: read

concurrency:
  group: tb-science-rank10-v1-one-shot
  cancel-in-progress: false

jobs:
  terminal-slot:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pre-exposure authority, verifier, carrier and epoch gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$GITHUB_EVENT_NAME" = "pull_request"
          test "$GITHUB_BASE_REF" = "main"
          test "$GITHUB_HEAD_REF" = "execute/tb-science-rank10-20261007-v1"
          C=capsules/tb_science_rank10_20261007_v1
          A="$C/TB_SCIENCE_RANK10_ONE_SLOT_EXECUTION_AUTHORITY_20261007_V1.json"
          I="$C/ACTION_INTENT_TB_SCIENCE_RANK10_ONE_SHOT_20261007_V1.json"
          L="$C/TB_SCIENCE_CURRENT_SLOT_LEDGER_RECONCILIATION_20261007_V8.json"
          M="$C/TB_SCIENCE_TRANSITIVE_RUNTIME_CLOSURE_MANIFEST_20261007_V2.json"
          E="$C/RANK10_EPOCH_V1.json"
          AV="$C/TB_SCIENCE_RANK10_AUTHORITY_PUBLIC_VERIFICATION_20261007_V1.json"
          X="$C/ACTIVATE_RANK10_PR.json"

          test "$(git hash-object "$A")" = "7b4d8c2555d102b30e02673c95675403ae947629"
          test "$(git hash-object "$I")" = "e65720a36d7c09a3be5a33246f3ab54e20612915"
          test "$(git hash-object "$L")" = "eb869db71db99a77912c0051ff12f162d616b1a1"
          test "$(git hash-object "$M")" = "31656d35034338dfcb699672bcd4788b283b83c9"
          test "$(git hash-object "$E")" = "8d0bc7999769a32147eab08acb31436e7abe743c"
          test "$(git hash-object "$AV")" = "81bc75163be8376f407d3efac716d34cb30720c0"
          test "$(git hash-object capsules/tb_science_canary_v3_execution/canonical/governance/TB_SCIENCE_TERMINAL_EXECUTION_MANIFEST_V1.json)" = "6dfa880b1f68881531afbba6ca211681801fd19b"

          export EXECUTION_WORKFLOW_BLOB="$(git hash-object .github/workflows/execute-tb-science-rank10-20261007-v1.yml)"
          export ACTIVATION_BLOB="$(git hash-object "$X")"
          echo "EXECUTION_WORKFLOW_BLOB=$EXECUTION_WORKFLOW_BLOB" >> "$GITHUB_ENV"
          echo "ACTIVATION_BLOB=$ACTIVATION_BLOB" >> "$GITHUB_ENV"

          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess, urllib.request
          C=pathlib.Path("capsules/tb_science_rank10_20261007_v1")
          a=json.loads((C/"TB_SCIENCE_RANK10_ONE_SLOT_EXECUTION_AUTHORITY_20261007_V1.json").read_text())
          i=json.loads((C/"ACTION_INTENT_TB_SCIENCE_RANK10_ONE_SHOT_20261007_V1.json").read_text())
          l=json.loads((C/"TB_SCIENCE_CURRENT_SLOT_LEDGER_RECONCILIATION_20261007_V8.json").read_text())
          m=json.loads((C/"TB_SCIENCE_TRANSITIVE_RUNTIME_CLOSURE_MANIFEST_20261007_V2.json").read_text())
          e=json.loads((C/"RANK10_EPOCH_V1.json").read_text())
          av=json.loads((C/"TB_SCIENCE_RANK10_AUTHORITY_PUBLIC_VERIFICATION_20261007_V1.json").read_text())
          x=json.loads((C/"ACTIVATE_RANK10_PR.json").read_text())
          slot="terminal-bench-science/rdkit-ic-constraints::trial-0"
          digest="sha256:17e356ab255088712c7dfa9765bf077b33a3da221f4a03d4770576857f9c0b6f"

          assert a["status"].startswith("ACTIVE__LIVE_EPOCH_RECHECK_REQUIRED")
          assert a["slot"]=={"id":slot,"rank":10,"digest":digest}
          assert a["current_truth"]["task_started"] is False and a["current_truth"]["result_present"] is False
          assert i["status"]=="READY_AFTER_EXACT_CURRENT_EPOCH_RECHECK__ONE_SHOT__ZERO_SPEND"
          assert i["slot"]=={"id":slot,"digest":digest,"rank":10}
          assert l["status"].startswith("ACTIVE_TRUTH__NINE_CONSUMED_SLOTS__RANK10_ONE_USE_AUTHORIZED__TASK_UNSTARTED")
          assert l["current_counts"]["next_untouched_slot"]=={"schedule_rank":10,"slot_id":slot,"task_digest":digest}
          assert l["current_counts"]["consumed_slots"]==9 and l["current_counts"]["consumed_final_failures"]==9
          assert l["current_counts"]["pass_still_mathematically_reachable"] is True
          assert e["status"]=="CURRENT__ONE_USE_PREEXPOSURE_GATE"
          assert e["slot_id"]==slot and e["task_digest"]==digest and e["schedule_rank"]==10
          assert e["prior_consumed_slots"]==9 and e["run_attempts_authorized_by_epoch"]==0
          assert av["status"].startswith("INDEPENDENT_PUBLIC_RUNNER_PASS")
          assert av["subject"]["authority_git_blob_sha"]=="7b4d8c2555d102b30e02673c95675403ae947629"
          assert av["verified"]["benchmark_task_exposure"]==0

          assert len(m["closure"])==14
          for row in m["closure"]:
              p=C/row["path"]
              assert p.is_file(), row["path"]
              actual=subprocess.check_output(["git","hash-object",str(p)],text=True).strip()
              assert actual==row["git_blob_sha"], (row["path"],actual,row["git_blob_sha"])

          assert x["status"]=="ARMED_AFTER_AUTHORITY_AND_CARRIER_VERIFICATION"
          assert x["slot_id"]==slot and x["task_digest"]==digest and x["schedule_rank"]==10
          assert x["authority_blob"]=="7b4d8c2555d102b30e02673c95675403ae947629"
          assert x["authority_verification_blob"]=="81bc75163be8376f407d3efac716d34cb30720c0"
          assert x["ledger_blob"]=="eb869db71db99a77912c0051ff12f162d616b1a1"
          assert x["epoch_blob"]=="8d0bc7999769a32147eab08acb31436e7abe743c"
          assert x["closure_manifest_blob"]=="31656d35034338dfcb699672bcd4788b283b83c9"
          assert x["execution_workflow_blob"]==os.environ["EXECUTION_WORKFLOW_BLOB"]
          assert x["run_attempt_required"]==1 and x["retries"]==0 and x["replacement"] is False
          assert x["incremental_spend_usd_max"]==0

          token=os.environ.get("GH_TOKEN","")
          headers={"Accept":"application/vnd.github+json","User-Agent":"brain-rank10-executor"}
          if token: headers["Authorization"]="Bearer "+token
          def get(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as resp: return json.load(resp)

          auth_run=get("https://api.github.com/repos/moxnixmdj/verification-capsule-runner/actions/runs/37628333729")
          assert auth_run["status"]=="completed" and auth_run["conclusion"]=="success"
          assert auth_run["head_sha"]=="5ae36890449b929bb28d3b05134d771b15cb50a0"
          assert auth_run["run_attempt"]==1

          carrier_id=int(x["carrier_verification_run_id"])
          carrier=get(f"https://api.github.com/repos/moxnixmdj/verification-capsule-runner/actions/runs/{carrier_id}")
          assert carrier["status"]=="completed" and carrier["conclusion"]=="success"
          assert carrier["name"]=="Verify TB-Science rank10 carrier v1"
          assert carrier["head_sha"]==x["carrier_verification_head_sha"]
          assert carrier["run_attempt"]==1
          arts=get(f"https://api.github.com/repos/moxnixmdj/verification-capsule-runner/actions/runs/{carrier_id}/artifacts")
          matched=[z for z in arts.get("artifacts",[]) if z.get("name")=="tb-science-rank10-carrier-verification-v1"]
          assert len(matched)==1
          art=matched[0]
          assert str(art["id"])==str(x["carrier_verification_artifact_id"])
          assert art.get("digest")==x["carrier_verification_artifact_digest"]
          PY

          PYTHONPATH="$C" python - <<'PY'
          from canonical.runtime.harbor_science_agent_v1 import HarborScienceAgent
          import canonical.runtime.harbor_science_planner_v1 as planner
          assert HarborScienceAgent.name()=="project-brain-science"
          assert planner.MODEL=="brain-qwen3.5-9b"
          PY

          git fetch --quiet --depth=1 origin main
          for spec in             "$C/RANK10_EPOCH_V1.json:8d0bc7999769a32147eab08acb31436e7abe743c"             "$C/TB_SCIENCE_RANK10_ONE_SLOT_EXECUTION_AUTHORITY_20261007_V1.json:7b4d8c2555d102b30e02673c95675403ae947629"             "$C/TB_SCIENCE_CURRENT_SLOT_LEDGER_RECONCILIATION_20261007_V8.json:eb869db71db99a77912c0051ff12f162d616b1a1"; do
            p="${spec%%:*}"; want="${spec##*:}"
            got="$(git show FETCH_HEAD:"$p" | git hash-object --stdin)"
            test "$got" = "$want"
          done

          vis="$(curl -fsSL -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY" | python -c 'import json,sys; print(json.load(sys.stdin)["visibility"])')"
          test "$vis" = "public"
          test "$(nproc)" -ge 4
          awk '/MemTotal/{exit !($2 >= 12000000)}' /proc/meminfo
          df -Pk "$GITHUB_WORKSPACE" | awk 'NR==2{exit !($4 >= 12000000)}'
          docker version >/dev/null
          docker info >/dev/null

      - name: Install exact Harbor
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir -q 'harbor==0.23.0'
          python - <<'PY'
          import importlib.metadata
          assert importlib.metadata.version("harbor")=="0.23.0"
          PY

      - name: Clean-build exact llama.cpp
        run: |
          set -euo pipefail
          rm -rf llama.cpp
          git init llama.cpp
          git -C llama.cpp remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C llama.cpp fetch --depth 1 origin bec4772f6a2527d371557b5d2032641e5ff7619c
          git -C llama.cpp checkout --detach FETCH_HEAD
          test "$(git -C llama.cpp rev-parse HEAD)" = "bec4772f6a2527d371557b5d2032641e5ff7619c"
          cmake -S llama.cpp -B llama.cpp/build -DGGML_CUDA=OFF -DLLAMA_CURL=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build llama.cpp/build -j 2 --target llama-server

      - name: Restore exact Qwen model cache
        uses: actions/cache@v4
        with:
          path: models/Qwen3.5-9B-M-TS-Q4_K_M.gguf
          key: brain-qwen35-9b-f41c0a0c0e43bf721fb2da29374cd1a97271bac0bab08a9dc42964525e82350c

      - name: Acquire and verify exact Qwen model if cache misses
        run: |
          set -euo pipefail
          mkdir -p models
          if [ ! -f models/Qwen3.5-9B-M-TS-Q4_K_M.gguf ]; then
            curl -L --fail --retry 3 --retry-delay 3 --silent --show-error -o models/Qwen3.5-9B-M-TS-Q4_K_M.gguf 'https://huggingface.co/TheStageAI/Qwen3.5-9B-GGUF/resolve/main/Qwen3.5-9B-M-TS-Q4_K_M.gguf?download=true'
          fi
          echo 'f41c0a0c0e43bf721fb2da29374cd1a97271bac0bab08a9dc42964525e82350c  models/Qwen3.5-9B-M-TS-Q4_K_M.gguf' | sha256sum -c -

      - name: Start exact local cognition endpoint
        run: |
          set -euo pipefail
          EXTRA=()
          if llama.cpp/build/bin/llama-server --help 2>&1 | grep -q -- '--reasoning'; then EXTRA+=(--reasoning off); fi
          nohup llama.cpp/build/bin/llama-server -m models/Qwen3.5-9B-M-TS-Q4_K_M.gguf --alias brain-qwen3.5-9b --host 127.0.0.1 --port 8080 -c 8192 -t 4 --parallel 1 --jinja --no-webui "${EXTRA[@]}" > LOCAL_QWEN_SERVER.log 2>&1 &
          ok=0
          for i in $(seq 1 240); do
            if curl -fsS http://127.0.0.1:8080/health > LOCAL_QWEN_HEALTH.json 2>/dev/null; then ok=1; break; fi
            sleep 1
          done
          test "$ok" = 1

      - name: Immediate live-epoch gate before irreversible task exposure
        run: |
          set -euo pipefail
          C=capsules/tb_science_rank10_20261007_v1
          epoch_sha="$(curl -fsSL -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/$C/RANK10_EPOCH_V1.json?ref=main" | python -c 'import json,sys; print(json.load(sys.stdin)["sha"])')"
          test "$epoch_sha" = "8d0bc7999769a32147eab08acb31436e7abe743c"
          PYTHONPATH="$C" python - <<'PY'
          from canonical.runtime.harbor_science_agent_v1 import HarborScienceAgent
          assert HarborScienceAgent.name()=="project-brain-science"
          PY

      - name: Execute exactly frozen rank10 slot
        id: execute
        continue-on-error: true
        env:
          TASK_NAME: terminal-bench-science/rdkit-ic-constraints
          SAFE_ID: rdkit-ic-constraints-trial-0
        run: |
          set -uo pipefail
          C="$GITHUB_WORKSPACE/capsules/tb_science_rank10_20261007_v1"
          export PYTHONPATH="$C"
          mkdir -p "$GITHUB_WORKSPACE/jobs/$SAFE_ID"
          harbor run -d terminal-bench-science/terminal-bench-science@0.1.0 -i "$TASK_NAME" -a canonical.runtime.harbor_science_agent_v1:HarborScienceAgent -k 1 -n 1 -r 0 --agent-timeout-multiplier 0.60 --environment-build-timeout-multiplier 1.0 --verifier-timeout-multiplier 1.0 --job-name "$SAFE_ID" --jobs-dir "$GITHUB_WORKSPACE/jobs/$SAFE_ID"
          echo "harbor_exit=$?" >> "$GITHUB_OUTPUT"

      - name: Finalize irreversible conservative rank10 receipt
        if: always()
        env:
          SLOT_ID: terminal-bench-science/rdkit-ic-constraints::trial-0
          TASK_NAME: terminal-bench-science/rdkit-ic-constraints
          SAFE_ID: rdkit-ic-constraints-trial-0
          HARBOR_OUTCOME: ${{ steps.execute.outcome }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          base=root/"jobs"/os.environ["SAFE_ID"]
          results=[]
          for p in base.rglob("result.json") if base.exists() else []:
              try: obj=json.loads(p.read_text())
              except Exception: continue
              results.append((p,obj))
          scored=[]; exception_info=[]
          for p,obj in results:
              vr=obj.get("verifier_result")
              if isinstance(vr,dict) and isinstance(vr.get("rewards"),dict):
                  scored.append((p,obj))
              ex=obj.get("exception_info")
              if isinstance(ex,dict):
                  exception_info.append({"path":str(p.relative_to(root)),"exception_type":ex.get("exception_type"),"exception_message":ex.get("exception_message")})
          reward=None; errors=[]
          if len(scored)==1:
              raw=scored[0][1]["verifier_result"]["rewards"].get("reward")
              if isinstance(raw,(int,float)) and not isinstance(raw,bool): reward=float(raw)
              else: errors.append("REWARD_MISSING_OR_NONNUMERIC")
          elif not scored: errors.append("NO_TRIAL_RESULT_WITH_VERIFIER_REWARD")
          else: errors.append("MULTIPLE_TRIAL_RESULTS_WITH_VERIFIER_REWARD")
          success=(reward is not None and reward>=1.0 and not errors)
          hashes={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p,_ in results}
          receipt={
            "schema":"PROJECT_BRAIN_TB_SCIENCE_TERMINAL_SLOT_RECEIPT_RANK10_V1",
            "slot_id":os.environ["SLOT_ID"],"task_name":os.environ["TASK_NAME"],
            "status":"SUCCESS" if success else "FINAL_ZERO","reward":reward if reward is not None else 0.0,
            "errors":errors,"exception_info":exception_info,"harbor_step_outcome":os.environ.get("HARBOR_OUTCOME"),
            "authority_blob":"7b4d8c2555d102b30e02673c95675403ae947629",
            "intent_blob":"e65720a36d7c09a3be5a33246f3ab54e20612915",
            "ledger_blob":"eb869db71db99a77912c0051ff12f162d616b1a1",
            "closure_manifest_blob":"31656d35034338dfcb699672bcd4788b283b83c9",
            "authority_verification_blob":"81bc75163be8376f407d3efac716d34cb30720c0",
            "epoch_blob":"8d0bc7999769a32147eab08acb31436e7abe743c",
            "execution_workflow_blob":os.environ.get("EXECUTION_WORKFLOW_BLOB"),
            "activation_blob":os.environ.get("ACTIVATION_BLOB"),
            "planner_blob":"01d859c8f27b317893027e693c9aa49e833a256f",
            "controller_blob":"5bc8ebac26bb7c809d4698f535eff43b667b30df",
            "github_run_id":os.environ["GITHUB_RUN_ID"],"github_run_attempt":os.environ["GITHUB_RUN_ATTEMPT"],"github_sha":os.environ["GITHUB_SHA"],
            "result_hashes":hashes,"execution_authority_consumed":True,"rerun_credit":False,"incremental_spend_usd":0,"promotion_authority":False
          }
          pathlib.Path("rdkit-ic-constraints-trial-0__SLOT_RECEIPT.json").write_text(json.dumps(receipt,indent=2,sort_keys=True)+"\n")
          print(json.dumps(receipt,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tb-science-rdkit-ic-constraints-trial-0-rank10-v1
          path: |
            rdkit-ic-constraints-trial-0__SLOT_RECEIPT.json
            jobs/rdkit-ic-constraints-trial-0/
            LOCAL_QWEN_HEALTH.json
            LOCAL_QWEN_SERVER.log
          if-no-files-found: warn
          retention-days: 90
