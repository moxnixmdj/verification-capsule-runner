name: Verify LiveBench langdetect witnesses

on:
  pull_request:
    branches: [main]
    paths:
      - "verify_livebench_langdetect_witnesses_v1.py"
      - "verify_livebench_language_exception_carrier_v1.py"
      - "subject/livebench_language_exception_carrier_20261005/**"
      - ".github/workflows/verify-livebench-langdetect-witnesses-v1.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
      - name: Install exact detector and checker dependencies
        run: python -m pip install --disable-pip-version-check langdetect==1.0.9 nltk==3.10.3 immutabledict==4.2.2
      - name: Checkout exact frozen LiveBench scorer
        run: |
          set -euo pipefail
          rm -rf /tmp/LiveBench
          git init /tmp/LiveBench
          git -C /tmp/LiveBench remote add origin https://github.com/LiveBench/LiveBench.git
          git -C /tmp/LiveBench fetch --depth 1 origin 8f8e5c381a16e3f24257776edd53471fe86f8091
          git -C /tmp/LiveBench checkout --detach FETCH_HEAD
      - name: Reverify all 30 public LiveBench language witnesses
        run: python verify_livebench_langdetect_witnesses_v1.py
      - name: Verify exception carrier against exact scorer
        run: python verify_livebench_language_exception_carrier_v1.py
      - name: Print compact receipts
        if: always()
        run: |
          test ! -f livebench_langdetect_witnesses_v1.json || python -c "import json; j=json.load(open('livebench_langdetect_witnesses_v1.json')); print(j['status'], j['base_classification_pass_count'], len(j['envelope_failures']))"
          test ! -f livebench_language_exception_carrier_verification_v1.json || python -c "import json; j=json.load(open('livebench_language_exception_carrier_verification_v1.json')); print(j['status'], j['response_language_checker']['pass_count'])"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livebench-langdetect-witnesses-v1
          path: livebench_langdetect_witnesses_v1.json
          if-no-files-found: error
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livebench-language-exception-carrier-v1
          path: livebench_language_exception_carrier_verification_v1.json
          if-no-files-found: error
