name: Verify LiveBench langdetect witnesses

on:
  pull_request:
    branches: [main]
    paths:
      - "verify_livebench_langdetect_witnesses_v1.py"
      - ".github/workflows/verify-livebench-langdetect-witnesses-v1.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
      - name: Install exact detector
        run: python -m pip install --disable-pip-version-check langdetect==1.0.9
      - name: Synthesize and verify all 30 public LiveBench language witnesses
        run: python verify_livebench_langdetect_witnesses_v1.py
      - name: Print compact receipt
        if: always()
        run: test ! -f livebench_langdetect_witnesses_v1.json || python -c "import json; j=json.load(open('livebench_langdetect_witnesses_v1.json')); print(j['status'], j['base_classification_pass_count'], len(j['envelope_failures']))"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livebench-langdetect-witnesses-v1
          path: livebench_langdetect_witnesses_v1.json
          if-no-files-found: error
