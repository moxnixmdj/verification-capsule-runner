name: Verify LiveBench language email carrier V1
on:
  pull_request:
    branches: [main]
    paths:
      - "verify_livebench_language_email_carrier_v1.py"
      - ".github/workflows/verify-livebench-language-email-carrier-v1.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
      - name: Install exact checker dependencies
        run: python -m pip install --disable-pip-version-check nltk==3.10.3 langdetect==1.0.9 immutabledict==4.2.2
      - name: Checkout exact frozen LiveBench and Punkt data
        run: |
          rm -rf /tmp/LiveBench /tmp/nltk_data_repo /tmp/nltk_data
          git clone --filter=blob:none https://github.com/LiveBench/LiveBench.git /tmp/LiveBench
          git -C /tmp/LiveBench checkout 8f8e5c381a16e3f24257776edd53471fe86f8091
          git clone --filter=blob:none --no-checkout https://github.com/nltk/nltk_data.git /tmp/nltk_data_repo
          git -C /tmp/nltk_data_repo checkout 550b6625bcef1f2abff2ff770a5a0d272c9c6b2a -- packages/tokenizers/punkt.zip packages/tokenizers/punkt_tab.zip
          mkdir -p /tmp/nltk_data/tokenizers
          unzip -q /tmp/nltk_data_repo/packages/tokenizers/punkt.zip -d /tmp/nltk_data/tokenizers
          unzip -q /tmp/nltk_data_repo/packages/tokenizers/punkt_tab.zip -d /tmp/nltk_data/tokenizers
      - name: Run exact language-carrier verification
        env:
          NLTK_DATA: /tmp/nltk_data
        run: python verify_livebench_language_email_carrier_v1.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livebench-language-email-carrier-v1
          path: livebench_language_email_carrier_v1.json
          if-no-files-found: error
