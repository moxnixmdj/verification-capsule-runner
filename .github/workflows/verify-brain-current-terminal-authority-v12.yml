name: Verify Brain current terminal authority v12 delegation

on:
  pull_request:
    paths:
      - 'capsules/current_terminal_authority_v12/**'
      - '.github/workflows/verify-brain-current-terminal-authority-v12.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact mirrored Brain blob identities
        env:
          EXPECTED_JSON: '{"capsules/current_terminal_authority_v12/canonical/capabilities/opus55/OPUS_5_5_USEFUL_CAPABILITY_ENVELOPE_V1.json":"661a57f839101fbf54c7e4edc76166c65ce9327d","capsules/current_terminal_authority_v12/canonical/governance/OPUS55_TERMINAL_PROOF_PROTOCOLS_V1.json":"eb4bca0fe6a015d49d2854998fbe046c979c7ea9","capsules/current_terminal_authority_v12/canonical/verification/TERMINAL_V3_POSTWAVE_CONTRACT_AND_FAMILY_REDUCTION_20261002_V1.json":"51e3e7578e9adbeee2168d2223b84481fea16a09","capsules/current_terminal_authority_v12/canonical/governance/OPUS55_ACCEPTANCE_PROOF_TRANSMUTATION_INPUT_V1.json":"96052a6b5178305b37a2526fb25c3f53fa33b9b5","capsules/current_terminal_authority_v12/canonical/runtime/acceptance_proof_transmuter_v1.py":"0580f9819b5465c9617f0a1e8ff9a96902eedfc6","capsules/current_terminal_authority_v12/canonical/runtime/opus55_acceptance_calibration_reducer_v2.py":"73b0b27644e0fa0d89ff8fbdb51005c20eae3632","capsules/current_terminal_authority_v12/canonical/governance/OPUS55_ACCEPTANCE_PREDICATE_REGISTRY_V2.json":"562536d9ba3f245a6bd24490a1eb3b30f27e0c3a","capsules/current_terminal_authority_v12/canonical/governance/OPUS55_ACCEPTANCE_PREDICATE_EVIDENCE_BINDINGS_V2.json":"f500b56e7349ce8c0f97cfd0bd1db4888ec6887c","capsules/current_terminal_authority_v12/canonical/reasoning/2026-10-02_EXACT_OPUS55_ZERO_COST_COMPARATOR_ROUTE_RECONCILIATION_V1.json":"f67e22cee5e6fce1ebfae92ebf0946f78fafcee1","capsules/current_terminal_authority_v12/canonical/governance/OPUS55_PUBLIC_BAR_SCORE_READINESS_MATRIX_V1.json":"4e59e30461c9ff1bee1a9474627d5fb4074844b2","capsules/current_terminal_authority_v12/canonical/runtime/opus55_acceptance_residual_compiler_v2.py":"cae5bc3bfda9c77d7d7e5151127f55aafddb9522","capsules/current_terminal_authority_v12/canonical/governance/DELEGATION_ACCEPTANCE_CEILING_WITNESS_V1.json":"cb3b7c4b6c4e1f2a0471c6b6be72c4ca9ebddc80","capsules/current_terminal_authority_v12/canonical/verification/DELEGATION_TEMPORAL_PROOF_TRANSPORT_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json":"5278abb7fcaa6b97189b67598c75e4df395e1788","capsules/current_terminal_authority_v12/canonical/verification/DELEGATION_TEMPORAL_CEILING_TRANSMUTATION_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json":"5023cc222a44f99b57785f5954cc95a29b739193"}'
        run: |
          python - <<'PY'
          import json, os, subprocess
          expected=json.loads(os.environ["EXPECTED_JSON"])
          bad=[]
          for path,want in expected.items():
              got=subprocess.check_output(["git","hash-object",path],text=True).strip()
              if got!=want:
                  bad.append(f"{path}: {got} != {want}")
          if bad:
              raise SystemExit("\n".join(bad))
          print(f"EXACT_BLOB_IDENTITY_PASS {len(expected)}/{len(expected)}")
          PY
      - name: Recompute Opus55 acceptance calibration
        env:
          PYTHONPATH: capsules/current_terminal_authority_v12
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from canonical.runtime.opus55_acceptance_calibration_reducer_v2 import evaluate
          root=Path("capsules/current_terminal_authority_v12")
          load=lambda p: json.loads((root/p).read_text(encoding="utf-8"))
          out=evaluate(
            load("canonical/capabilities/opus55/OPUS_5_5_USEFUL_CAPABILITY_ENVELOPE_V1.json"),
            load("canonical/governance/OPUS55_TERMINAL_PROOF_PROTOCOLS_V1.json"),
            load("canonical/verification/TERMINAL_V3_POSTWAVE_CONTRACT_AND_FAMILY_REDUCTION_20261002_V1.json"),
            load("canonical/governance/OPUS55_ACCEPTANCE_PROOF_TRANSMUTATION_INPUT_V1.json"),
          )
          expected={
            "EXACT_SYMBOLIC_COMPUTATION",
            "LONG_HORIZON_MEMORY_AND_CONTINUITY",
            "TOOL_DISCOVERY_SELECTION_AND_LEARNING",
            "SUBAGENT_DELEGATION_AND_COORDINATION",
          }
          assert out["errors"]==[], out
          assert out["acceptance_calibrated_family_count"]==4, out
          assert out["acceptance_pending_family_count"]==15, out
          assert set(out["acceptance_calibrated_families"])==expected, out
          assert out["terminal_goal_acceptance_closed"] is False, out
          row=next(r for r in out["families"] if r["family"]=="SUBAGENT_DELEGATION_AND_COORDINATION")
          assert row["effective_protocol_status"]=="PASS", row
          assert row["effective_closure_mode"]=="ABSOLUTE_DOMINANCE", row
          assert row["effective_witness_id"]=="DELEGATION_TEMPORAL_TERMINAL_CEILING_ABSOLUTE_DOMINANCE_20261002_V1", row
          print("CALIBRATION_PASS 4/19")
          PY
      - name: Recompute atomic residual frontier
        env:
          PYTHONPATH: capsules/current_terminal_authority_v12
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from canonical.runtime.opus55_acceptance_residual_compiler_v2 import evaluate
          root=Path("capsules/current_terminal_authority_v12")
          load=lambda p: json.loads((root/p).read_text(encoding="utf-8"))
          out=evaluate(
            load("canonical/governance/OPUS55_ACCEPTANCE_PREDICATE_REGISTRY_V2.json"),
            load("canonical/governance/OPUS55_ACCEPTANCE_PREDICATE_EVIDENCE_BINDINGS_V2.json"),
            load("canonical/reasoning/2026-10-02_EXACT_OPUS55_ZERO_COST_COMPARATOR_ROUTE_RECONCILIATION_V1.json"),
            load("canonical/governance/OPUS55_PUBLIC_BAR_SCORE_READINESS_MATRIX_V1.json"),
          )
          assert out["errors"]==[], out
          assert out["predicate_count"]==38, out
          assert out["proved_predicate_count"]==9, out
          assert out["open_predicate_count"]==0, out
          assert out["blocked_predicate_count"]==29, out
          assert out["refuted_predicate_count"]==0, out
          assert out["authorized_actions"]==[], out
          assert out["terminal_promotion_allowed"] is False, out
          fam=next(r for r in out["families"] if r["family"]=="SUBAGENT_DELEGATION_AND_COORDINATION")
          assert fam["state"]=="PROVED", fam
          assert fam["predicate_count"]==3 and fam["proved"]==3, fam
          pred=next(r for r in out["predicates"] if r["predicate_id"]=="DELEGATION_TERMINAL_SUCCESS_NONINFERIOR")
          assert pred["state"]=="PROVED", pred
          print("RESIDUAL_PASS 9/38 proved 29 blocked")
          PY
      - name: Verify delegation witness authority boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("capsules/current_terminal_authority_v12")
          load=lambda p: json.loads((root/p).read_text(encoding="utf-8"))
          w=load("canonical/governance/DELEGATION_ACCEPTANCE_CEILING_WITNESS_V1.json")
          t=load("canonical/verification/DELEGATION_TEMPORAL_PROOF_TRANSPORT_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json")
          x=load("canonical/verification/DELEGATION_TEMPORAL_CEILING_TRANSMUTATION_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json")
          assert w["verified"] is True and w["independent"] is True and w["closes_entire_protocol"] is True
          assert w["promotion_authority"] is False
          assert t["public_verifier"]["conclusion"]=="success"
          assert x["public_verifier"]["conclusion"]=="success"
          assert t["terminal_results_replayed"]==0 and x["terminal_results_replayed"]==0
          assert t["family_credit_delta"]==0 and x["family_credit_delta"]==0
          print("DELEGATION_AUTHORITY_BOUNDARY_PASS")
          PY
