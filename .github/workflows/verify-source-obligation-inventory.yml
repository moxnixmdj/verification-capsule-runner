name: Verify Brain source-obligation inventory
on:
  pull_request:
    branches: [main]
    paths:
      - 'verification/source_obligation_inventory.py'
      - 'verification/spent_acceptance_sources.py'
      - 'verification/test_source_obligation_inventory.py'
      - '.github/workflows/verify-source-obligation-inventory.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: PYTHONPATH=. python -m unittest -v verification.test_source_obligation_inventory
