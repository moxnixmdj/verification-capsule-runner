name: Verify SA-CCR terminal acceptance mode v1
on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/governance/SA_CCR_TERMINAL_POPULATION_BINDING_V1.json'
      - 'canonical/governance/BEHAVIORAL_CONTRACT_REGISTRY_V1.json'
      - 'canonical/governance/GLOBAL_TERMINAL_REPLACEMENT_POPULATION_PROTOCOL_V2.json'
      - 'canonical/verification/SA_CCR_TERMINAL_POPULATION_BINDING_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json'
      - '.github/workflows/verify-saccr-terminal-acceptance-mode-v1.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Bind exact Brain blobs
        run: |
          test "$(git hash-object canonical/governance/SA_CCR_TERMINAL_POPULATION_BINDING_V1.json)" = "d8059952cdf358f3e682cd8177be4a7a0b2801ed"
          test "$(git hash-object canonical/governance/BEHAVIORAL_CONTRACT_REGISTRY_V1.json)" = "771a50d2b12f36c953903e0ec4cbe4a95cd24f84"
          test "$(git hash-object canonical/governance/GLOBAL_TERMINAL_REPLACEMENT_POPULATION_PROTOCOL_V2.json)" = "baf43825cafd30cb1db63a4f60509f619885d5a5"
          test "$(git hash-object canonical/verification/SA_CCR_TERMINAL_POPULATION_BINDING_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json)" = "f5aa4fbee35a512cceda855036a15e72fb5f58d4"
      - name: Verify registry terminal acceptance semantics
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path(".")
          binding=json.loads((root/"canonical/governance/SA_CCR_TERMINAL_POPULATION_BINDING_V1.json").read_text())
          registry=json.loads((root/"canonical/governance/BEHAVIORAL_CONTRACT_REGISTRY_V1.json").read_text())
          protocol=json.loads((root/"canonical/governance/GLOBAL_TERMINAL_REPLACEMENT_POPULATION_PROTOCOL_V2.json").read_text())
          prior=json.loads((root/"canonical/verification/SA_CCR_TERMINAL_POPULATION_BINDING_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json").read_text())
          mode=binding["proof_mode"]
          assert mode in registry["terminal_acceptance_proof_modes"], (mode,registry["terminal_acceptance_proof_modes"])
          assert binding["proof_mode_basis"]=="THEORETICAL_CEILING"
          assert binding["acceptance"]["terminal_acceptance_proof_mode"]==mode
          assert binding["acceptance"]["allowed_failed_cases"]==0
          assert binding["population"]["sample_count"]==2000
          assert binding["population"]["post_freeze_beacon"] is None
          assert binding["population"]["adaptive_case_selection"] is False
          assert binding["population"]["case_replacement"] is False
          assert binding["population"]["replay_for_tuning"] is False
          assert binding["terminal_results_observed"]==0
          assert binding["execution_authority"] is False
          assert binding["incremental_spend_usd"]==0
          assert binding["scope_gate"]["unresolved_required_dimensions"]==[]
          assert prior["workflow_conclusion"]=="success"
          assert "ZERO_ALLOWED_FAILED_CASES" in prior["verified"]
          assert protocol["route_specific_requirements"]["acceptance"].startswith("MUST_USE_ONE_OF_THE_REGISTRY_TERMINAL_ACCEPTANCE_PROOF_MODES")
          print({"status":"PASS","proof_mode":mode,"sample_count":binding["population"]["sample_count"]})
          PY
