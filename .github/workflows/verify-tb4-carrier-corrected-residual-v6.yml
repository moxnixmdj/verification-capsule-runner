name: Verify TB4 carrier-corrected residual V6
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/verify-tb4-carrier-corrected-residual-v6.yml'
      - 'candidate/tb4_v6/**'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Recompute exact corrected residual
        run: |
          python - <<'PY'
          import importlib.util, json, pathlib
          root=pathlib.Path('candidate/tb4_v6')
          spec=importlib.util.spec_from_file_location('residual', root/'runtime.py')
          mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
          load=lambda n: json.loads((root/n).read_text())
          out=mod.evaluate(load('registry.json'),load('evidence.json'),load('comparator.json'),load('readiness.json'))
          print(json.dumps(out,indent=2,sort_keys=True))
          assert out['receipt_saturation_complete'] is True, out
          assert out['proved_predicate_count']==7, out
          assert out['open_predicate_count']==0, out
          assert out['blocked_predicate_count']==31, out
          assert out['authorized_actions']==[], out
          tb=[x for x in out['predicates'] if x['predicate_id']=='CODING_TB4_GE_66_4']
          assert len(tb)==1 and tb[0]['state']=='EXTERNAL_BLOCKED', tb
          assert out['terminal_promotion_allowed'] is False, out
          PY
