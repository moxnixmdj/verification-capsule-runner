name: Verify Brain PR 1180 P1 one-batch freeze

on:
  pull_request:
    paths:
      - "capsules/brain_pr_1180_p1_one_batch_freeze/**"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact Brain PR1180 candidate blobs
        working-directory: capsules/brain_pr_1180_p1_one_batch_freeze
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          expected = {
              "canonical/runtime/p1_shared_failure_semantics_batch_v1.py": "ca82ce925f26442f48d00d39eed0b5b8abf3558e",
              "canonical/runtime/p1_shared_failure_semantics_batch_freeze_verifier_v1.py": "b3ad903943215821d2bc64fb300e445acfb3de67",
              "canonical/tests/test_p1_shared_failure_semantics_batch_v1.py": "ef98b0f20691aa985fc8e41790ee271f9c8b0b33",
              "canonical/governance/P1_SHARED_FAILURE_SEMANTICS_BATCH_FREEZE_V1.json": "f5815ccfeadb28171e5261a839b7f37f358684e4",
              "canonical/action_intents/2026-10-03_P1_ONE_SHARED_FAILURE_SEMANTICS_BATCH_FREEZE_V1.json": "78cad989e566f177367aaa4999c8757a2364f21f",
          }
          for path,want in expected.items():
              data=Path(path).read_bytes()
              got=hashlib.sha1(f"blob {len(data)}\0".encode()+data).hexdigest()
              assert got==want,(path,got,want)
              print(path,got)
          PY
      - name: Run adversarial freeze tests
        working-directory: capsules/brain_pr_1180_p1_one_batch_freeze
        run: |
          export PYTHONPATH=.
          python -m unittest canonical.tests.test_p1_shared_failure_semantics_batch_v1 -v
      - name: Run fail-closed freeze verifier
        working-directory: capsules/brain_pr_1180_p1_one_batch_freeze
        run: |
          export PYTHONPATH=.
          python canonical/runtime/p1_shared_failure_semantics_batch_freeze_verifier_v1.py
