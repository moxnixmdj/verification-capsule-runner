name: Verify Retrieval V4 federation epoch gate
on:
  push:
    branches:
      - verify/retrieval-v4-federation-20261003
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python verify_retrieval_v4_federation_epoch_gate.py
