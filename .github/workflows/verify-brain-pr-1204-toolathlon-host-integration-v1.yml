name: Verify Brain PR 1204 Toolathlon host integration V1
on:
  push:
    branches: ["verify-brain-pr-1204-toolathlon-host-integration-v1"]
    paths:
      - "capsules/brain_pr_1204_toolathlon_host_integration_v1/**"
      - ".github/workflows/verify-brain-pr-1204-toolathlon-host-integration-v1.yml"
  pull_request:
    branches: [main]
    paths:
      - "capsules/brain_pr_1204_toolathlon_host_integration_v1/**"
      - ".github/workflows/verify-brain-pr-1204-toolathlon-host-integration-v1.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact Brain and Toolathlon blobs
        run: |
          set -euo pipefail
          cd capsules/brain_pr_1204_toolathlon_host_integration_v1
          test "$(git hash-object canonical/runtime/toolathlon_brain_host_integration_v1.py)" = "c996ad810fd75446f7b5b61761b5258ebbfaf0bb"
          test "$(git hash-object canonical/tests/test_toolathlon_brain_host_integration_v1.py)" = "92f197b2d4392c2b7ee4c29d2397a02955b6d40a"
          test "$(git hash-object canonical/governance/TOOLATHLON_BRAIN_HOST_INTEGRATION_V1.json)" = "60d4663f70ea5545ce0ffeb36f07fe3fe4526764"
          test "$(git hash-object canonical/runtime/toolathlon_brain_owned_selection_adapter_v1.py)" = "64c66a56a681b2919fbfcaf09c325c5db55f5f81"
          test "$(git hash-object frozen_toolathlon/container_tool_gateway.py)" = "130628187647fdcacf2d3cf59934a2b310014a81"
      - name: Run Brain candidate tests
        run: |
          set -euo pipefail
          cd capsules/brain_pr_1204_toolathlon_host_integration_v1
          export PYTHONPATH=.
          python -m unittest canonical.tests.test_toolathlon_brain_host_integration_v1 -v
      - name: Run independent frozen-wire adversarial tests
        run: |
          set -euo pipefail
          cd capsules/brain_pr_1204_toolathlon_host_integration_v1
          export PYTHONPATH=.
          python independent_test.py -v
      - name: Enforce zero-credit scope
        run: |
          set -euo pipefail
          cd capsules/brain_pr_1204_toolathlon_host_integration_v1
          python - <<'PY'
          import json
          g=json.load(open("canonical/governance/TOOLATHLON_BRAIN_HOST_INTEGRATION_V1.json"))
          assert g["frozen_toolathlon_contract"]["gateway_git_blob_sha"]=="130628187647fdcacf2d3cf59934a2b310014a81"
          assert g["expected_effect_if_independently_verified"]=="CLOSE_REAL_TOOLATHLON_DECOUPLED_HOST_INTEGRATION_BINDS_GATEWAY_TO_THIS_ADAPTER_PRECONDITION_ONLY"
          assert g["terminal_results_observed"]==0
          assert g["new_reality_units_consumed"]==0
          assert g["capability_credit_delta"]==0 and g["family_credit_delta"]==0
          assert g["execution_authority"] is False
          print("Brain PR1204 exact Toolathlon host integration: PASS")
          PY
