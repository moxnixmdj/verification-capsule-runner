name: Verify P1 restoration current authority v4

on:
  push:
    paths:
      - "verify_p1_restoration_current_authority_v4.py"
      - "canonical/governance/CURRENT_TERMINAL_AUTHORITY_V1.json"
      - "canonical/governance/TERMINAL_PROJECTION_CONSISTENCY_V1.json"
      - "canonical/governance/TERMINAL_CLOSURE_MANIFEST_V1.json"
      - "canonical/capabilities/opus55/OPUS_5_5_CAPABILITY_OWNERSHIP_MATRIX_V1.json"
      - "canonical/governance/P1_COMPOSITE_PROOF_RESTORATION_ACTIVATION_V3.json"
      - "canonical/verification/P1_COMPOSITE_PROOF_RESTORATION_PUBLIC_RUNNER_VERIFICATION_20261002_V2.json"
      - "canonical/governance/OPUS55_SYNTHESIS_ZERO_REALITY_DISCHARGE_EXHAUSTION_V1.json"
      - "canonical/tests/test_p1_scope_restoration_projection_v3.py"
      - "canonical/governance/MATCHED_SCOPE_HIERARCHICAL_REFINEMENT_ACTIVATION_V1.json"
      - "canonical/verification/MATCHED_SCOPE_HIERARCHICAL_REFINEMENT_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json"
      - ".github/workflows/verify-p1-restoration-current-authority-v4.yml"
  pull_request:
    paths:
      - "verify_p1_restoration_current_authority_v4.py"
      - "canonical/governance/CURRENT_TERMINAL_AUTHORITY_V1.json"
      - "canonical/governance/TERMINAL_PROJECTION_CONSISTENCY_V1.json"
      - "canonical/governance/TERMINAL_CLOSURE_MANIFEST_V1.json"
      - "canonical/capabilities/opus55/OPUS_5_5_CAPABILITY_OWNERSHIP_MATRIX_V1.json"
      - "canonical/governance/P1_COMPOSITE_PROOF_RESTORATION_ACTIVATION_V3.json"
      - "canonical/verification/P1_COMPOSITE_PROOF_RESTORATION_PUBLIC_RUNNER_VERIFICATION_20261002_V2.json"
      - "canonical/governance/OPUS55_SYNTHESIS_ZERO_REALITY_DISCHARGE_EXHAUSTION_V1.json"
      - "canonical/tests/test_p1_scope_restoration_projection_v3.py"
      - "canonical/governance/MATCHED_SCOPE_HIERARCHICAL_REFINEMENT_ACTIVATION_V1.json"
      - "canonical/verification/MATCHED_SCOPE_HIERARCHICAL_REFINEMENT_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json"
      - ".github/workflows/verify-p1-restoration-current-authority-v4.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact combined Brain authority
        run: python verify_p1_restoration_current_authority_v4.py
