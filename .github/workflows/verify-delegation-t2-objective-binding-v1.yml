name: Verify delegation T2 objective binding v1
on:
  pull_request:
    branches: [main]
    paths:
      - 'capsules/delegation_t2_objective_binding/**'
      - '.github/workflows/verify-delegation-t2-objective-binding-v1.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact Brain capsule identities
        working-directory: capsules/delegation_t2_objective_binding
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object canonical/governance/DELEGATION_T2_OBJECTIVE_TERMINAL_BINDING_V1.json)" = "a1e441567b132d71713ed55dfc51f01d8de112d1"
          test "$(git hash-object canonical/runtime/delegation_t2_objective_binding_validator.py)" = "f92ba723631776fcd59caa17d448c1a53446cc40"
          test "$(git hash-object canonical/tests/test_delegation_t2_objective_binding_validator.py)" = "59d40c4bb2684b161d98970617add5ca100d482c"
          test "$(git hash-object canonical/runtime/delegation_whole_scope_candidate_v2.py)" = "f1a93ee66d90093de61dc17c6ebf2e24073df522"
          test "$(git hash-object canonical/runtime/delegation_whole_scope_proof_v2.py)" = "928466401b36e4f3b09c517950cc050432a0616f"
          test "$(git hash-object canonical/runtime/delegation_structural_variety_proof_v3.py)" = "f5e1f45519278ed2cafa27d23b8602b0a362a492"
          test "$(git hash-object canonical/governance/GLOBAL_TERMINAL_REPLACEMENT_POPULATION_PROTOCOL_V2.json)" = "4abe1e530a8bd24c8ebecf7abf96cd95898ca37e"
          test "$(git hash-object canonical/governance/OUTER_TERMINAL_MULTIPLEX_PORTFOLIOS_V1.json)" = "7c49e3a44dc9a827e84a12b572ea6b8e9b2fa1f5"
          test "$(git hash-object canonical/governance/BEHAVIORAL_CONTRACT_REGISTRY_V1.json)" = "afa00109031d638fef32cc3fe10be18786605c39"
          test "$(git hash-object canonical/verification/DELEGATION_SCOPE_GATE_V2_V3_REPAIR_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json)" = "eddfe01c81ae9d6e9453c4bc30737f9ddd273a83"
      - name: Run fail-closed regression tests
        working-directory: capsules/delegation_t2_objective_binding
        run: PYTHONPATH=. python -m unittest -v canonical.tests.test_delegation_t2_objective_binding_validator
      - name: Validate frozen direct objective binding
        working-directory: capsules/delegation_t2_objective_binding
        run: PYTHONPATH=. python canonical/runtime/delegation_t2_objective_binding_validator.py .
