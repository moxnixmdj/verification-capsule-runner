name: Independently verify matched success causal V3

on:
  pull_request:
    branches: [main]
    paths:
      - "vendor/brain/canonical/runtime/matched_success_semantic_coupling_contract_v3.py"
      - "vendor/brain/canonical/governance/MATCHED_SUCCESS_SEMANTIC_COUPLING_CONTRACT_V3.json"
      - "vendor/brain/canonical/runtime/matched_success_integrated_extension_v1.py"
      - "vendor/brain/canonical/runtime/matched_success_public_projection_v1.py"
      - "vendor/brain/canonical/runtime/matched_success_integrated_causal_harness_v3.py"
      - "vendor/brain/canonical/governance/MATCHED_SUCCESS_INTEGRATED_CAUSAL_HARNESS_V3.json"
      - "verify_matched_success_causal_v3.py"
      - ".github/workflows/verify-matched-success-causal-v3.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
      - run: python verify_matched_success_causal_v3.py
