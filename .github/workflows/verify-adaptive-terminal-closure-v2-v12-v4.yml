name: Verify adaptive terminal closure V2 V12 V4

on:
  push:
    branches: ["verify/adaptive-terminal-closure-v2-v12-v4-20261003-sol"]
    paths:
      - ".github/workflows/verify-adaptive-terminal-closure-v2-v12-v4.yml"
      - "capsules/adaptive_terminal_closure_v2/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/verify-adaptive-terminal-closure-v2-v12-v4.yml"
      - "capsules/adaptive_terminal_closure_v2/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify V2 exact subjects and execution
        working-directory: capsules/adaptive_terminal_closure_v2
        run: |
          set -euo pipefail
          test "$(git hash-object canonical/runtime/adaptive_terminal_closure_controller_v2.py)" = "3d3c3c788593a5bf55e76b6e5f15f61f886e641b"
          test "$(git hash-object canonical/tests/test_adaptive_terminal_closure_controller_v2.py)" = "9ec7c9eedb42a92b6b4a0646b24e0d40b60b987a"
          test "$(git hash-object canonical/governance/ADAPTIVE_TERMINAL_CLOSURE_ACTIVATION_V2.json)" = "5701eac93b0017c55f8db9d6adbf4fc9eae00752"
          test "$(git hash-object canonical/governance/TERMINAL_SCHEDULING_CURRENT_AUTHORITY_V1.json)" = "bc578e6db4eedcefbed61f6860e1cc5192cf05f4"
          PYTHONPATH=. python -m unittest canonical.tests.test_adaptive_terminal_closure_controller_v2 -v
          PYTHONPATH=. python canonical/runtime/adaptive_terminal_closure_controller_v2.py > /tmp/v2.json
          cat /tmp/v2.json
          python - <<'PY'
          import json
          x=json.load(open("/tmp/v2.json"))
          assert x["pass"] is True,x
          assert x["live_world"]["nondominated_certificates"]==14,x
          assert x["live_world"]["verified_zero_reality_requirements"]==17,x
          assert x["action_refinement"]["primitive_acceptance_work_units"]==31,x
          assert len(x["first_resource_priority_work_unit_ids"])==16,x
          assert len(x["ownership_reconciliation_work_units"])==2,x
          assert len(x["direct_reality_blocked_work_units"])==2,x
          assert x["execution_policy"]["tool_discovery_v4_over_v3_v2_gate_mandatory"] is True,x
          assert x["fresh_reality_authority"] is False,x
          print("ADAPTIVE_TERMINAL_CLOSURE_V2_V12_V4_PASS")
          PY
