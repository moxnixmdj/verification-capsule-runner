name: Verify LiveBench legacy duplicate input V1
on:
  push:
    branches:
      - verify/livebench-legacy-duplicate-input-v1
  pull_request:
    paths:
      - verify_livebench_legacy_duplicate_input_v1.py
      - .github/workflows/verify-livebench-legacy-duplicate-input-v1.yml

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python verify_livebench_legacy_duplicate_input_v1.py
