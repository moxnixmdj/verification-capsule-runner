name: Verify rank22 Stage-B contract and surface
on:
  pull_request:
    branches: [main]
    paths:
      - 'verification/rank22_stage_b/**'
      - '.github/workflows/verify-rank22-stage-b.yml'
permissions:
  contents: read
jobs:
  verify-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m unittest -v verification.rank22_stage_b.test_stage_b
      - run: python -m pip install --disable-pip-version-check pytest
      - run: python -m pytest -q verification/rank22_stage_b/test_contract.py
  verify-surface:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: docker build -t rank22-stageb-surface -f verification/rank22_stage_b/Dockerfile verification/rank22_stage_b
      - run: docker run --rm -v "$PWD/verification/rank22_stage_b/surface_probe.py:/tmp/surface_probe.py:ro" rank22-stageb-surface python /tmp/surface_probe.py
