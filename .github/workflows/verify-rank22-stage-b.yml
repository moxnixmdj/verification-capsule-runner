name: Verify rank22 Stage-B contract and exact surface
on:
  pull_request:
    branches: [main]
    paths:
      - 'verification/rank22_stage_b/**'
      - '.github/workflows/verify-rank22-stage-b.yml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Fetch exact allowlisted authoritative sources
        run: |
          set -euo pipefail
          mkdir -p /tmp/rank22src
          base='https://raw.githubusercontent.com/harbor-framework/terminal-bench/452bf305c6daa62fc59061d22133a7cbc7c1572e/tasks/freecad-spring-clip'
          curl --fail --location --silent --show-error "$base/instruction.md" -o /tmp/rank22src/instruction.md
          curl --fail --location --silent --show-error "$base/task.toml" -o /tmp/rank22src/task.toml
          curl --fail --location --silent --show-error "$base/environment/Dockerfile" -o /tmp/rank22src/Dockerfile
          test "$(git hash-object /tmp/rank22src/instruction.md)" = '4d80d20b8d6404e68728efda4dfd79d315a9d20d'
          test "$(git hash-object /tmp/rank22src/task.toml)" = '4fa89d7788a5d56f3d073ce54d46dcdad0a7b012'
          test "$(git hash-object /tmp/rank22src/Dockerfile)" = '1bb433cd0994aa4f88e4e9d52040fd880e59b919'
      - name: Static candidate syntax
        run: python -m py_compile verification/rank22_stage_b/candidate_answer.py
      - name: Independent contract falsification
        run: python verification/rank22_stage_b/test_stage_b.py /tmp/rank22src
  exact-surface:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Fetch exact allowlisted Dockerfile
        run: |
          set -euo pipefail
          mkdir -p /tmp/rank22env
          curl --fail --location --silent --show-error 'https://raw.githubusercontent.com/harbor-framework/terminal-bench/452bf305c6daa62fc59061d22133a7cbc7c1572e/tasks/freecad-spring-clip/environment/Dockerfile' -o /tmp/rank22env/Dockerfile
          test "$(git hash-object /tmp/rank22env/Dockerfile)" = '1bb433cd0994aa4f88e4e9d52040fd880e59b919'
      - name: Build exact task image
        run: docker build -t rank22-stageb-surface /tmp/rank22env
      - name: Synthetic FreeCAD API and persistence smoke
        run: |
          docker run --rm -v "$PWD/verification/rank22_stage_b:/preflight:ro" rank22-stageb-surface             freecadcmd /preflight/preflight_smoke.py
