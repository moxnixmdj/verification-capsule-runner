name: Verify P2 professional-quality T1 multiplex binding
on:
  pull_request:
    branches: [main]
    paths:
      - capsules/p2_professional_quality_t1_v1/**
      - .github/workflows/verify-p2-professional-quality-t1-v1.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cd capsules/p2_professional_quality_t1_v1 && PYTHONPATH=. python -m unittest -v canonical.tests.test_p2_professional_quality_t1_multiplex_preflight
