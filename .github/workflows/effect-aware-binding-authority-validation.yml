name: Effect-Aware Binding Authority Repair Validation

on:
  push:
    branches:
      - verify/effect-aware-binding-authority-20260930
    paths:
      - 'ARM_EFFECT_AWARE_BINDING_AUTHORITY_V3_20260930'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Verify exact candidate blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object canonical/runtime/goal_compiler.py)" = "ed01427a2b9a055b5fa3fcd337e68e8f4ea8a643"
          test "$(git hash-object canonical/tests/test_goal_compiler_effect_binding_authority.py)" = "b4d4e74f33d1bc83745166d6771d7dcdd2b4dbb9"
          test "$(git hash-object canonical/runtime/astra_runtime.py)" = "ee0f40d2980115d40c15a6d7322c64d6cac998b6"
          test "$(git hash-object canonical/runtime/bound_capabilities/grounded_executable_composition.py)" = "8328e12804f64cab1c0d9509966cb1d2d8fb1f82"
          test "$(git hash-object canonical/tasks/COMPOSITION_REQUAL_CANONICAL_AUTHORITY_20260930.json)" = "496363bf99d3f7c16d99288aed027534a71d796d"

      - name: Run generic compiler regression
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest canonical.tests.test_goal_compiler_effect_binding_authority -v

      - name: Validate spent input routes through grounded composition
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util,json,pathlib,sys
          root=pathlib.Path(".").resolve()
          spec=importlib.util.spec_from_file_location("repair_validation_runtime",root/"canonical/runtime/astra_runtime.py")
          runtime=importlib.util.module_from_spec(spec)
          sys.modules[spec.name]=runtime
          spec.loader.exec_module(runtime)

          input_path="canonical/tasks/COMPOSITION_REQUAL_CANONICAL_AUTHORITY_20260930.json"
          output_path="canonical/astra_runtime/tmp/BINDING_REPAIR_REGRESSION_OUTPUT.json"
          goal=(
            "Using typed decision evidence at "+input_path+
            ", synthesize the decision to "+output_path+
            ". Then independently verify the decision result at "+output_path+"."
          )
          mission={"mission_id":"BINDING-AUTHORITY-REPAIR-REGRESSION-20260930","goal":goal}
          step={
            "adapter":"goal",
            "goal_ref":"goal",
            "verified_initial_facts":["structured.decision_evidence.available"],
            "max_controller_actions":8,
          }
          result=runtime.run_goal(step,mission)
          assert result.get("controller_mode")=="MODEL_INDEPENDENT_ACTION_PLAN",result
          assert result.get("composition_mode")=="MODEL_INDEPENDENT_GROUNDED_CAPABILITY_GRAPH",result
          assert result.get("model_dependency_count")==0,result
          assert result.get("planning_mode")!="DETERMINISTIC_COMPOUND_ACTION_PLAN",result

          trace=result.get("trace") or []
          invoked=[x.get("result") for x in trace if isinstance(x,dict) and isinstance(x.get("result"),dict)]
          producer=[x for x in invoked if x.get("adapter")=="evidence_decision_synthesis"]
          verifier=[x for x in invoked if x.get("adapter")=="evidence_decision_verify"]
          assert len(producer)==1,producer
          assert len(verifier)==1,verifier
          assert producer[0]["input_path"]==input_path,producer
          assert producer[0]["output_path"]==output_path,producer
          assert verifier[0]["verified"] is True,verifier
          assert verifier[0]["reason"]=="VERIFIED",verifier
          assert verifier[0]["selected_alternative"]=="PRIVATE_GITHUB_MAIN",verifier

          evidence={
            "schema":"PROJECT_BRAIN_EFFECT_AWARE_BINDING_REPAIR_VALIDATION_V1",
            "progress_credit":False,
            "spent_task_regression_only":True,
            "composition_mode":result.get("composition_mode"),
            "planning_mode":result.get("planning_mode"),
            "model_dependency_count":result.get("model_dependency_count"),
            "producer_result":producer[0],
            "verifier_result":verifier[0],
            "grounding_evidence_path":result.get("grounding_evidence_path"),
            "composition_evidence_path":result.get("composition_evidence_path"),
          }
          pathlib.Path("EFFECT_AWARE_BINDING_REPAIR_VALIDATION.json").write_text(
            json.dumps(evidence,indent=2,sort_keys=True)+"\n"
          )
          print(json.dumps(evidence,sort_keys=True))
          PY

      - name: Upload repair validation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: effect-aware-binding-authority-repair-validation
          if-no-files-found: warn
          path: |
            EFFECT_AWARE_BINDING_REPAIR_VALIDATION.json
            canonical/astra_runtime/evidence/
