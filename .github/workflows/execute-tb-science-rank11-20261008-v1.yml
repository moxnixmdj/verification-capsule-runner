name: Execute TB-Science rank11 v1 one-shot isolated

on:
  pull_request:
    branches: [terminal-execution-v1]
    paths:
      - "capsules/tb_science_rank11_20261008_v1/ACTIVATE_RANK11_PR.json"

permissions:
  contents: read

concurrency:
  group: tb-science-rank11-v1-one-shot
  cancel-in-progress: false

jobs:
  terminal-slot:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pre-exposure exact authority, lease, repair, and carrier gate
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$GITHUB_EVENT_NAME" = "pull_request"
          test "$GITHUB_BASE_REF" = "terminal-execution-v1"
          test "$GITHUB_HEAD_REF" = "execute/tb-science-rank11-20261008-v1"
          C=capsules/tb_science_rank11_20261008_v1
          test "$(git hash-object "$C/TB_SCIENCE_RANK11_ONE_SLOT_EXECUTION_AUTHORITY_20261008_V1.json")" = "cdb7d5c6fe7fa028b557077a694346e64bafc434"
          test "$(git hash-object "$C/ACTION_INTENT_TB_SCIENCE_RANK11_ONE_SHOT_20261008_V1.json")" = "91d29a0de0df505af85b8a0d3050cb3fce1e9dc1"
          test "$(git hash-object "$C/TB_SCIENCE_CURRENT_SLOT_LEDGER_RECONCILIATION_20261007_V9.json")" = "82edae7eeb3e5ea5e30fc9f239c1d95faf9d089d"
          test "$(git hash-object "$C/TB_SCIENCE_TERMINAL_EXECUTION_MANIFEST_V1.json")" = "6dfa880b1f68881531afbba6ca211681801fd19b"
          test "$(git hash-object "$C/TB_SCIENCE_TRANSITIVE_RUNTIME_CLOSURE_MANIFEST_20261008_V3.json")" = "5c03f885c747e921265da4934783cf107d7de641"
          test "$(git hash-object "$C/TB_SCIENCE_TIMEOUT300_CURRENT_CLOSURE_SPRITE_VERIFICATION_20261008_V1.json")" = "72218ad1f50d8b29a273d7f32118ffb1d9cfb2b5"
          test "$(git hash-object "$C/TB_SCIENCE_RANK11_ACTIVE_AUTHORITY_SPRITE_VERIFICATION_20261008_V1.json")" = "4f3fcd9df21b793bcf719de8db709b6dad829324"
          test "$(git hash-object "$C/CURRENT_TERMINAL_AUTHORITY.json")" = "27d179c9bb28274bcc6dbc14215caee22bfedb6c"
          test "$(git hash-object "$C/python_transitive_runtime_closure_v1.py")" = "43d502c621c219632fa0f9a19632dfc0228e4847"
          test "$(git hash-object "$C/RANK11_EPOCH_V1.json")" = "659b11f3ffe42c5c24025727145baf3c220719e8"
          test "$(git hash-object "$C/RANK11_EXECUTION_CLAIM_V1.json")" = "60b63e712e16843e4f22242522c9b5fe032d0e8b"

          python - <<'PY'
          import json, pathlib, subprocess
          C=pathlib.Path("capsules/tb_science_rank11_20261008_v1")
          a=json.loads((C/"TB_SCIENCE_RANK11_ONE_SLOT_EXECUTION_AUTHORITY_20261008_V1.json").read_text())
          i=json.loads((C/"ACTION_INTENT_TB_SCIENCE_RANK11_ONE_SHOT_20261008_V1.json").read_text())
          l=json.loads((C/"TB_SCIENCE_CURRENT_SLOT_LEDGER_RECONCILIATION_20261007_V9.json").read_text())
          tm=json.loads((C/"TB_SCIENCE_TERMINAL_EXECUTION_MANIFEST_V1.json").read_text())
          cm=json.loads((C/"TB_SCIENCE_TRANSITIVE_RUNTIME_CLOSURE_MANIFEST_20261008_V3.json").read_text())
          rv=json.loads((C/"TB_SCIENCE_TIMEOUT300_CURRENT_CLOSURE_SPRITE_VERIFICATION_20261008_V1.json").read_text())
          av=json.loads((C/"TB_SCIENCE_RANK11_ACTIVE_AUTHORITY_SPRITE_VERIFICATION_20261008_V1.json").read_text())
          ta=json.loads((C/"CURRENT_TERMINAL_AUTHORITY.json").read_text())
          e=json.loads((C/"RANK11_EPOCH_V1.json").read_text())
          claim=json.loads((C/"RANK11_EXECUTION_CLAIM_V1.json").read_text())
          slot="terminal-bench-science/supraglacial-lake-classification::trial-0"
          task="terminal-bench-science/supraglacial-lake-classification"
          digest="sha256:4a57227f84340ff6e245c3f2efeb8dfb6fb44a89713223d8742433dd569f9e3a"

          assert a["status"].startswith("ACTIVE__")
          assert a["slot"]=={"id":slot,"rank":11,"digest":digest}
          assert a["exact_route"]["agent"]=="99d6ba6edcfad425e4cb940e5b7b2ccd99f6cdab"
          assert a["exact_route"]["planner"]=="01d859c8f27b317893027e693c9aa49e833a256f"
          assert a["exact_route"]["transitive_runtime_file_count"]==14
          assert a["controls"]["exact_slot_count"]==1
          assert a["controls"]["attempts"]==1 and a["controls"]["retries"]==0
          assert a["controls"]["replacement_allowed"] is False
          assert a["controls"]["incremental_spend_usd_max"]==0
          assert a["controls"]["precheck_failure_consumes_slot"] is False
          assert a["controls"]["timeout300_repair_receipt_required"] is True
          assert a["current_truth"]["task_started"] is False and a["current_truth"]["result_present"] is False

          assert i["slot"]=={"id":slot,"digest":digest,"rank":11}
          assert i["exact_route"]["agent"]=="99d6ba6edcfad425e4cb940e5b7b2ccd99f6cdab"
          assert i["controls"]["attempts"]==1 and i["controls"]["retries"]==0

          nxt=l["current_counts"]["next_untouched_slot"]
          assert nxt["ledger_schedule_rank"]==11 and nxt["slot_id"]==slot and nxt["task_digest"]==digest
          assert l["current_counts"]["consumed_slots"]==10
          assert l["current_counts"]["consumed_final_failures"]==10
          assert l["rank11"]["task_started"] is False and l["rank11"]["result_present"] is False
          assert l["current_counts"]["pass_still_mathematically_reachable"] is True

          rows=[x for x in tm["task_metadata"] if x.get("name")==task]
          assert len(rows)==1 and rows[0]["digest"]==digest
          assert tm["execution_rules"]["retries_per_slot"]==0
          assert tm["execution_rules"]["carrier_failure_credit"]==0
          assert tm["execution_rules"]["timeout_credit"]==0

          assert rv["status"].startswith("INDEPENDENT_SPRITE_PASS")
          assert rv["verification"]["current_runtime_closure_all_exact"] is True
          assert rv["verification"]["controller_test_suite_passed"]==15
          assert rv["verification"]["benchmark_task_exposure"]==0

          assert av["status"].startswith("INDEPENDENT_SPRITE_PASS")
          assert av["verified"]["slot_id"]==slot
          assert av["verified"]["rank11_task_started"] is False
          assert av["verified"]["benchmark_task_exposure"]==0

          assert ta["terminal_objective"]=="PERMANENTLY_INTERNALIZE_CONFIGURE_VERIFY_AND_OWN_ALL_USEFUL_OPUS_5_5_CAPABILITIES_AT_EQUAL_OR_BETTER_LEVEL__KNOWLEDGE_EXTERNAL_JIT_ONLY"

          assert len(cm["closure"])==14
          for row in cm["closure"]:
              p=C/row["path"]
              assert p.is_file(), row["path"]
              actual=subprocess.check_output(["git","hash-object",str(p)],text=True).strip()
              assert actual==row["git_blob_sha"], (row["path"],actual,row["git_blob_sha"])

          assert e["status"]=="CURRENT__ONE_USE_PREEXPOSURE_GATE"
          assert e["slot_id"]==slot and e["task_digest"]==digest and e["schedule_rank"]==11
          assert e["run_attempts_authorized_by_epoch"]==0

          assert claim["status"]=="ACTIVE_SINGLE_EXECUTION_LEASE"
          assert claim["slot_id"]==slot and claim["task_digest"]==digest
          assert claim["execution_branch"]=="execute/tb-science-rank11-20261008-v1"
          assert claim["authority_git_blob_sha"]=="cdb7d5c6fe7fa028b557077a694346e64bafc434"
          assert claim["authority_verification_git_blob_sha"]=="4f3fcd9df21b793bcf719de8db709b6dad829324"
          assert claim["attempts_authorized"]==1 and claim["retries_authorized"]==0
          assert claim["consumed"] is False
          PY

          python "$C/python_transitive_runtime_closure_v1.py" --repo-root "$C" --carrier-root "$C"             --root canonical/runtime/harbor_science_agent_v1.py             --root canonical/runtime/harbor_science_planner_v1.py             --root canonical/runtime/lossless_raw_task_contract_v1.py             --root canonical/runtime/raw_task_acceptance_residual_localizer_v1.py > RANK11_CARRIER_CLOSURE.json

          PYTHONPATH="$C" python - <<'PY'
          from canonical.runtime.harbor_science_agent_v1 import HarborScienceAgent, PLANNER_TIMEOUT_S
          import canonical.runtime.harbor_science_planner_v1 as planner
          assert HarborScienceAgent.name()=="project-brain-science"
          assert PLANNER_TIMEOUT_S==300
          assert planner.MODEL=="brain-qwen3.5-9b"
          PY

          epoch_sha="$(curl -fsSL -H 'Accept: application/vnd.github+json'             "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/capsules/tb_science_rank11_20261008_v1/RANK11_EPOCH_V1.json?ref=terminal-execution-v1"             | python -c 'import json,sys; print(json.load(sys.stdin)["sha"])')"
          test "$epoch_sha" = "659b11f3ffe42c5c24025727145baf3c220719e8"
          claim_sha="$(curl -fsSL -H 'Accept: application/vnd.github+json'             "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/capsules/tb_science_rank11_20261008_v1/RANK11_EXECUTION_CLAIM_V1.json?ref=terminal-execution-v1"             | python -c 'import json,sys; print(json.load(sys.stdin)["sha"])')"
          test "$claim_sha" = "60b63e712e16843e4f22242522c9b5fe032d0e8b"

          test "$(nproc)" -ge 4
          awk '/MemTotal/{exit !($2 >= 12000000)}' /proc/meminfo
          df -Pk "$GITHUB_WORKSPACE" | awk 'NR==2{exit !($4 >= 12000000)}'
          docker version >/dev/null
          docker info >/dev/null

      - name: Install exact Harbor
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir -q 'harbor==0.23.0'
          python - <<'PY'
          import importlib.metadata
          assert importlib.metadata.version("harbor")=="0.23.0"
          PY

      - name: Clean-build exact llama.cpp
        run: |
          set -euo pipefail
          rm -rf llama.cpp
          git init llama.cpp
          git -C llama.cpp remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C llama.cpp fetch --depth 1 origin bec4772f6a2527d371557b5d2032641e5ff7619c
          git -C llama.cpp checkout --detach FETCH_HEAD
          test "$(git -C llama.cpp rev-parse HEAD)" = "bec4772f6a2527d371557b5d2032641e5ff7619c"
          cmake -S llama.cpp -B llama.cpp/build -DGGML_CUDA=OFF -DLLAMA_CURL=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build llama.cpp/build -j 2 --target llama-server

      - name: Restore exact Qwen model cache
        uses: actions/cache@v4
        with:
          path: models/Qwen3.5-9B-M-TS-Q4_K_M.gguf
          key: brain-qwen35-9b-f41c0a0c0e43bf721fb2da29374cd1a97271bac0bab08a9dc42964525e82350c

      - name: Acquire and verify exact Qwen model if cache misses
        run: |
          set -euo pipefail
          mkdir -p models
          if [ ! -f models/Qwen3.5-9B-M-TS-Q4_K_M.gguf ]; then
            curl -L --fail --retry 3 --retry-delay 3 --silent --show-error               -o models/Qwen3.5-9B-M-TS-Q4_K_M.gguf               'https://huggingface.co/TheStageAI/Qwen3.5-9B-GGUF/resolve/main/Qwen3.5-9B-M-TS-Q4_K_M.gguf?download=true'
          fi
          echo 'f41c0a0c0e43bf721fb2da29374cd1a97271bac0bab08a9dc42964525e82350c  models/Qwen3.5-9B-M-TS-Q4_K_M.gguf' | sha256sum -c -

      - name: Start exact local cognition endpoint
        run: |
          set -euo pipefail
          EXTRA=()
          if llama.cpp/build/bin/llama-server --help 2>&1 | grep -q -- '--reasoning'; then EXTRA+=(--reasoning off); fi
          nohup llama.cpp/build/bin/llama-server             -m models/Qwen3.5-9B-M-TS-Q4_K_M.gguf             --alias brain-qwen3.5-9b --host 127.0.0.1 --port 8080             -c 8192 -t 4 --parallel 1 --jinja --no-webui "${EXTRA[@]}"             > LOCAL_QWEN_SERVER.log 2>&1 &
          ok=0
          for i in $(seq 1 240); do
            if curl -fsS http://127.0.0.1:8080/health > LOCAL_QWEN_HEALTH.json 2>/dev/null; then ok=1; break; fi
            sleep 1
          done
          test "$ok" = 1

      - name: Immediate live epoch and lease gate before irreversible task exposure
        run: |
          set -euo pipefail
          epoch_sha="$(curl -fsSL -H 'Accept: application/vnd.github+json'             "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/capsules/tb_science_rank11_20261008_v1/RANK11_EPOCH_V1.json?ref=terminal-execution-v1"             | python -c 'import json,sys; print(json.load(sys.stdin)["sha"])')"
          test "$epoch_sha" = "659b11f3ffe42c5c24025727145baf3c220719e8"
          claim_sha="$(curl -fsSL -H 'Accept: application/vnd.github+json'             "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/capsules/tb_science_rank11_20261008_v1/RANK11_EXECUTION_CLAIM_V1.json?ref=terminal-execution-v1"             | python -c 'import json,sys; print(json.load(sys.stdin)["sha"])')"
          test "$claim_sha" = "60b63e712e16843e4f22242522c9b5fe032d0e8b"
          C="$GITHUB_WORKSPACE/capsules/tb_science_rank11_20261008_v1"
          PYTHONPATH="$C" python - <<'PY'
          from canonical.runtime.harbor_science_agent_v1 import HarborScienceAgent, PLANNER_TIMEOUT_S
          import canonical.runtime.harbor_science_planner_v1 as planner
          assert HarborScienceAgent.name()=="project-brain-science"
          assert PLANNER_TIMEOUT_S==300
          assert planner.MODEL=="brain-qwen3.5-9b"
          PY

      - name: Execute exactly frozen rank11 slot
        id: execute
        continue-on-error: true
        env:
          TASK_NAME: terminal-bench-science/supraglacial-lake-classification
          SAFE_ID: supraglacial-lake-classification-trial-0
        run: |
          set -uo pipefail
          C="$GITHUB_WORKSPACE/capsules/tb_science_rank11_20261008_v1"
          export PYTHONPATH="$C"
          mkdir -p "$GITHUB_WORKSPACE/jobs/$SAFE_ID"
          harbor run             -d terminal-bench-science/terminal-bench-science@0.1.0             -i "$TASK_NAME"             -a canonical.runtime.harbor_science_agent_v1:HarborScienceAgent             -k 1 -n 1 -r 0             --agent-timeout-multiplier 0.48             --environment-build-timeout-multiplier 1.0             --verifier-timeout-multiplier 1.0             --job-name "$SAFE_ID"             --jobs-dir "$GITHUB_WORKSPACE/jobs/$SAFE_ID"
          echo "harbor_exit=$?" >> "$GITHUB_OUTPUT"

      - name: Finalize irreversible conservative rank11 receipt
        if: always()
        env:
          SLOT_ID: terminal-bench-science/supraglacial-lake-classification::trial-0
          TASK_NAME: terminal-bench-science/supraglacial-lake-classification
          SAFE_ID: supraglacial-lake-classification-trial-0
          HARBOR_OUTCOME: ${{ steps.execute.outcome }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          base=root/"jobs"/os.environ["SAFE_ID"]
          results=[]
          for p in base.rglob("result.json") if base.exists() else []:
              try: obj=json.loads(p.read_text())
              except Exception: continue
              results.append((p,obj))
          scored=[]; exception_info=[]
          for p,obj in results:
              vr=obj.get("verifier_result")
              if isinstance(vr,dict) and isinstance(vr.get("rewards"),dict):
                  scored.append((p,obj))
              ex=obj.get("exception_info")
              if isinstance(ex,dict):
                  exception_info.append({
                      "path":str(p.relative_to(root)),
                      "exception_type":ex.get("exception_type"),
                      "exception_message":ex.get("exception_message"),
                  })
          reward=None; errors=[]
          if len(scored)==1:
              raw=scored[0][1]["verifier_result"]["rewards"].get("reward")
              if isinstance(raw,(int,float)) and not isinstance(raw,bool):
                  reward=float(raw)
              else: errors.append("REWARD_MISSING_OR_NONNUMERIC")
          elif not scored:
              errors.append("NO_TRIAL_RESULT_WITH_VERIFIER_REWARD")
          else:
              errors.append("MULTIPLE_TRIAL_RESULTS_WITH_VERIFIER_REWARD")
          success=(reward is not None and reward>=1.0 and not errors)
          hashes={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p,_ in results}
          receipt={
            "schema":"PROJECT_BRAIN_TB_SCIENCE_TERMINAL_SLOT_RECEIPT_RANK11_V1",
            "slot_id":os.environ["SLOT_ID"],
            "task_name":os.environ["TASK_NAME"],
            "task_digest":"sha256:4a57227f84340ff6e245c3f2efeb8dfb6fb44a89713223d8742433dd569f9e3a",
            "status":"SUCCESS" if success else "FINAL_ZERO",
            "reward":reward if reward is not None else 0.0,
            "errors":errors,
            "exception_info":exception_info,
            "harbor_step_outcome":os.environ.get("HARBOR_OUTCOME"),
            "authority_blob":"cdb7d5c6fe7fa028b557077a694346e64bafc434",
            "intent_blob":"91d29a0de0df505af85b8a0d3050cb3fce1e9dc1",
            "ledger_v9_blob":"82edae7eeb3e5ea5e30fc9f239c1d95faf9d089d",
            "closure_manifest_blob":"5c03f885c747e921265da4934783cf107d7de641",
            "timeout300_verification_blob":"72218ad1f50d8b29a273d7f32118ffb1d9cfb2b5",
            "authority_verification_blob":"4f3fcd9df21b793bcf719de8db709b6dad829324",
            "epoch_blob":"659b11f3ffe42c5c24025727145baf3c220719e8",
            "execution_claim_blob":"60b63e712e16843e4f22242522c9b5fe032d0e8b",
            "agent_blob":"99d6ba6edcfad425e4cb940e5b7b2ccd99f6cdab",
            "planner_blob":"01d859c8f27b317893027e693c9aa49e833a256f",
            "planner_timeout_s":300,
            "agent_timeout_multiplier":0.48,
            "verifier_timeout_multiplier":1.0,
            "strict_timeout_semantics":"SUCCESS_IS_EXACT_POSITIVE_EVIDENCE__ANY_FINAL_NON_SUCCESS_COUNTS_ZERO",
            "github_run_id":os.environ["GITHUB_RUN_ID"],
            "github_run_attempt":os.environ["GITHUB_RUN_ATTEMPT"],
            "github_sha":os.environ["GITHUB_SHA"],
            "result_hashes":hashes,
            "execution_authority_consumed":True,
            "rerun_credit":False,
            "incremental_spend_usd":0,
            "promotion_authority":False,
          }
          pathlib.Path("supraglacial-lake-classification-trial-0__SLOT_RECEIPT.json").write_text(
              json.dumps(receipt,indent=2,sort_keys=True)+"\n")
          print(json.dumps(receipt,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tb-science-supraglacial-lake-classification-trial-0-rank11-v1
          path: |
            supraglacial-lake-classification-trial-0__SLOT_RECEIPT.json
            RANK11_CARRIER_CLOSURE.json
            jobs/supraglacial-lake-classification-trial-0/
            LOCAL_QWEN_HEALTH.json
            LOCAL_QWEN_SERVER.log
          if-no-files-found: warn
          retention-days: 7
