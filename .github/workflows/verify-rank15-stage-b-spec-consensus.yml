name: Verify rank15 Stage B specification consensus
on:
  pull_request:
    branches: [main]
    paths:
      - 'verification/rank15_stage_b/verify_spec_consensus.py'
      - '.github/workflows/verify-rank15-stage-b-spec-consensus.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Fetch exact official instruction only
        run: |
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/harbor-framework/terminal-bench/452bf305c6daa62fc59061d22133a7cbc7c1572e/tasks/wdm-design/instruction.md \
            -o /tmp/wdm-instruction.md
          test "$(git hash-object /tmp/wdm-instruction.md)" = "ab7255e9b4cf9597e965e2fe385447e502c4e8f9"
      - name: Run independent dual-route extraction consensus and source accounting
        run: python verification/rank15_stage_b/verify_spec_consensus.py /tmp/wdm-instruction.md
