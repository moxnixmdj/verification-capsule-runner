name: Verify information-safe trajectory failure

on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/runtime/trajectory_failure_information_safe_proof.py'
      - 'canonical/runtime/trajectory_failure_information_safe_candidate.py'
      - 'canonical/tests/test_trajectory_failure_information_safe.py'
      - '.github/workflows/verify-trajectory-information-safe.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Bind exact Brain bytes
        run: |
          test "$(git hash-object canonical/runtime/trajectory_failure_information_safe_proof.py)" = "3bc29023ea04d2dfb4dd0474efff2e267e0f7e8d"
          test "$(git hash-object canonical/runtime/trajectory_failure_information_safe_candidate.py)" = "9ede7fdeaf82d9a8c59fb9eca1aa99fff2a5cd87"
          test "$(git hash-object canonical/tests/test_trajectory_failure_information_safe.py)" = "8fff062484df34afcb89f1ae0e5a046a0d7d641e"
      - run: PYTHONPATH=. python -m unittest -v canonical.tests.test_trajectory_failure_information_safe
