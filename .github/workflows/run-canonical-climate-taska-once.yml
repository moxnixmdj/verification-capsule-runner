name: Run Canonical Climate Task A Once
on:
  pull_request:
    branches: [main]
    paths:
      - ARM_CANONICAL_CLIMATE_TASK_A_CA16_20260930_V1
permissions:
  contents: read
jobs:
  execute-once:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      ASTRA_DISABLE_MODEL_PLANNER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Execute canonical open-ended climate Task A exactly once
        id: parent_task
        continue-on-error: true
        run: python run_canonical_climate_taska_once.py
      - name: Upload terminal Task A evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-climate-taska-terminal
          path: canonical-climate-taska-terminal.json
          if-no-files-found: error
      - name: Preserve semantic failure
        if: steps.parent_task.outcome != 'success'
        run: exit 1
