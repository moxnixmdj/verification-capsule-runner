name: Direct Compiler Fresh Reuse - Artifact Integrity
on:
  push:
    branches:
      - verify/direct-compiler-fresh-reuse-artifact-integrity-20260930
    paths:
      - '.github/workflows/direct-compiler-fresh-reuse-artifact-integrity.yml'
permissions:
  contents: read
jobs:
  fresh-reuse:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact current Brain execution bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object canonical/runtime/astra_runtime.py)" = "85642a89a0d99c5e6cafa2e116ffdc24f04de32c"
          test "$(git hash-object canonical/runtime/BOUND_CAPABILITY_REGISTRY_V1.json)" = "b0fb5ccaf73552230dba24f914821d437b1a043d"
          test "$(git hash-object canonical/runtime/goal_compiler.py)" = "902008041849ee7e8686dacc2580a3b9b3393933"
          test "$(git hash-object canonical/runtime/capability_planner.py)" = "64ff65cb184f50d3336326f33cccfcc0a53301a8"
          test "$(git hash-object canonical/runtime/capability_proposal_generators.py)" = "71f2bbfda66a65d8d75e035b9ae073671ebd56e2"
          test "$(git hash-object canonical/runtime/bound_capabilities/evidence_decision_synthesis.py)" = "d7c73c24d2038c40bfb38ea6f10749a15a2d5415"
          test "$(git hash-object canonical/runtime/bound_capabilities/evidence_decision_verify.py)" = "63cf325320c7b91bf48ea2f2769c999c5a090929"
          test "$(git hash-object canonical/tasks/DIRECT_COMPILER_FRESH_REUSE_ARTIFACT_INTEGRITY_20260930.json)" = "4d2f733bcb22a0be717690ab3e96e564f3fac046"
      - name: Execute fresh real direct-compiler reuse once
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util,json,pathlib,sys
          root=pathlib.Path(".").resolve()
          spec=importlib.util.spec_from_file_location(
              "direct_compiler_fresh_reuse_runtime",
              root/"canonical/runtime/astra_runtime.py",
          )
          runtime=importlib.util.module_from_spec(spec)
          sys.modules[spec.name]=runtime
          spec.loader.exec_module(runtime)

          input_path="canonical/tasks/DIRECT_COMPILER_FRESH_REUSE_ARTIFACT_INTEGRITY_20260930.json"
          output_path="canonical/astra_runtime/tmp/DIRECT_COMPILER_FRESH_REUSE_ARTIFACT_INTEGRITY_OUTPUT.json"
          goal=(
            "Using typed decision evidence at "+input_path+
            ", synthesize the decision to "+output_path+
            ". Then independently verify the decision result at "+output_path+"."
          )
          mission={
            "mission_id":"DIRECT-COMPILER-FRESH-REUSE-ARTIFACT-INTEGRITY-20260930",
            "goal":goal,
          }
          step={
            "adapter":"goal",
            "goal_ref":"goal",
            "verified_initial_facts":["structured.decision_evidence.available"],
            "max_controller_actions":8,
          }
          result=runtime.run_goal(step,mission)
          assert result.get("controller_mode")=="MODEL_INDEPENDENT_ACTION_PLAN",result
          assert result.get("planner_model_last") is None,result
          assert result.get("planning_mode")=="DETERMINISTIC_COMPOUND_ACTION_PLAN",result
          assert result.get("model_dependency_count")==0,result

          gc=result.get("goal_compilation") or {}
          parts=gc.get("compiled_parts") or []
          assert [x.get("selected_capability") for x in parts]==[
            "decision.synthesis.typed.stdlib",
            "decision.synthesis.verify.stdlib",
          ],parts

          verifier_inputs=parts[1]["inputs"]
          assert verifier_inputs["input_path"]=={
            "$result":{"cycle":0,"field":"input_path"}
          },verifier_inputs
          assert verifier_inputs["result_path"]=={
            "$result":{"cycle":0,"field":"output_path"}
          },verifier_inputs
          assert verifier_inputs["input_path"]!=verifier_inputs["result_path"],verifier_inputs

          trace=result.get("trace") or []
          invoked=[
            x.get("result") for x in trace
            if isinstance(x,dict) and isinstance(x.get("result"),dict)
          ]
          producer=[x for x in invoked if x.get("adapter")=="evidence_decision_synthesis"]
          verifier=[x for x in invoked if x.get("adapter")=="evidence_decision_verify"]
          assert len(producer)==1,producer
          assert len(verifier)==1,verifier
          assert producer[0]["status"]=="DECIDED",producer
          assert producer[0]["selected_alternative"]=="LOCAL_SHA256_REHASH",producer
          assert producer[0]["input_path"]==input_path,producer
          assert producer[0]["output_path"]==output_path,producer
          assert verifier[0]["verified"] is True,verifier
          assert verifier[0]["selected_alternative"]=="LOCAL_SHA256_REHASH",verifier

          evidence={
            "schema":"PROJECT_BRAIN_DIRECT_COMPILER_FRESH_REUSE_ARTIFACT_INTEGRITY_V1",
            "goal":goal,
            "result":result,
            "producer_result":producer[0],
            "verifier_result":verifier[0],
            "causal_source_ref":verifier_inputs["input_path"],
            "causal_result_ref":verifier_inputs["result_path"],
            "model_dependency_count":0,
            "incremental_spend_usd":0,
          }
          pathlib.Path("DIRECT_COMPILER_FRESH_REUSE_ARTIFACT_INTEGRITY_RESULT.json").write_text(
            json.dumps(evidence,indent=2,sort_keys=True)+"\n",encoding="utf-8"
          )
          print("DIRECT_COMPILER_FRESH_REUSE_EXECUTION_PASS")
          PY
      - name: Independently recompute decision
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,pathlib
          task_path=pathlib.Path("canonical/tasks/DIRECT_COMPILER_FRESH_REUSE_ARTIFACT_INTEGRITY_20260930.json")
          task=json.loads(task_path.read_text(encoding="utf-8"))
          output_path=pathlib.Path("canonical/astra_runtime/tmp/DIRECT_COMPILER_FRESH_REUSE_ARTIFACT_INTEGRITY_OUTPUT.json")
          result=json.loads(output_path.read_text(encoding="utf-8"))
          wrapper_path=pathlib.Path("DIRECT_COMPILER_FRESH_REUSE_ARTIFACT_INTEGRITY_RESULT.json")
          wrapper=json.loads(wrapper_path.read_text(encoding="utf-8"))

          states={}
          for alt in [x["id"] for x in task["alternatives"]]:
              req=[c for c in task["constraints"] if c["alternative"]==alt and c.get("required",True)]
              if any(c["state"]=="VIOLATED" for c in req):
                  states[alt]="DISQUALIFIED"
              elif any(c["state"]=="UNKNOWN" for c in req):
                  states[alt]="UNRESOLVED"
              else:
                  states[alt]="ADMISSIBLE"

          support={}
          contradiction={}
          groups={}
          for e in task["evidence"]:
              alt=e["alternative"]
              weight=float(e["confidence"])*float(e.get("strength",1))
              key=(alt,e["independence_group"])
              dest=support if e["relation"]=="SUPPORTS" else contradiction
              dest[key]=max(dest.get(key,0.0),weight)
              if e["relation"]=="SUPPORTS" and weight>0:
                  groups.setdefault(alt,set()).add(e["independence_group"])

          eligible=[]
          policy=task["policy"]
          for alt,state in states.items():
              s=sum(v for (a,_),v in support.items() if a==alt)
              c=sum(v for (a,_),v in contradiction.items() if a==alt)
              total=s+c
              ratio=s/total if total else 0.0
              conflict=2*min(s,c)/total if total else 0.0
              if (
                  state=="ADMISSIBLE"
                  and total>0
                  and len(groups.get(alt,set()))>=policy["minimum_independent_support_groups"]
                  and ratio>=policy["minimum_support_ratio"]
                  and conflict<=policy["maximum_conflict_ratio"]
              ):
                  eligible.append((s-c,ratio,alt))
          eligible.sort(key=lambda x:(-x[0],-x[1],x[2]))
          assert eligible and eligible[0][2]=="LOCAL_SHA256_REHASH",eligible
          assert result["status"]=="DECIDED",result
          assert result["selected_alternative"]=="LOCAL_SHA256_REHASH",result
          assert result["model_dependency_count"]==0,result
          assert wrapper["verifier_result"]["verified"] is True,wrapper
          assert wrapper["causal_source_ref"]["$result"]["field"]=="input_path",wrapper
          assert wrapper["causal_result_ref"]["$result"]["field"]=="output_path",wrapper

          wrapper["independent_final_oracle"]={
              "verified":True,
              "selected_alternative":"LOCAL_SHA256_REHASH",
              "recomputed_without_producer_or_verifier_import":True,
              "input_sha256":hashlib.sha256(task_path.read_bytes()).hexdigest(),
              "output_sha256":hashlib.sha256(output_path.read_bytes()).hexdigest(),
          }
          wrapper_path.write_text(json.dumps(wrapper,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          print("DIRECT_COMPILER_FRESH_REUSE_INDEPENDENT_ORACLE_PASS")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: direct-compiler-fresh-reuse-artifact-integrity
          path: |
            DIRECT_COMPILER_FRESH_REUSE_ARTIFACT_INTEGRITY_RESULT.json
            canonical/astra_runtime/tmp/DIRECT_COMPILER_FRESH_REUSE_ARTIFACT_INTEGRITY_OUTPUT.json
