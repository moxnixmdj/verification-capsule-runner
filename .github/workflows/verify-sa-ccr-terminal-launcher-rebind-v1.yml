name: Verify SA-CCR terminal launcher rebind V1
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/sa_ccr_terminal_launcher_rebind_v1/**"
      - ".github/workflows/verify-sa-ccr-terminal-launcher-rebind-v1.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify exact frozen bytes and build overlay
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,shutil
          from pathlib import Path
          root=Path(".")
          cap=root/"capsules/sa_ccr_terminal_launcher_rebind_v1"
          m=json.loads((cap/"manifest.json").read_text())
          def blob(p):
              data=Path(p).read_bytes()
              return hashlib.sha1(b"blob "+str(len(data)).encode()+bytes([0])+data).hexdigest()
          for rel,expected in m["exact_unchanged_dependencies"].items():
              actual=blob(root/rel)
              assert actual==expected,(rel,expected,actual)
          for rel,expected in m["exact_replacements"].items():
              actual=blob(cap/rel)
              assert actual==expected,(rel,expected,actual)
          dst=Path("/tmp/sa_ccr_launcher_verify")
          if dst.exists(): shutil.rmtree(dst)
          shutil.copytree(root,dst,ignore=shutil.ignore_patterns(".git"))
          for rel in m["exact_replacements"]:
              target=dst/rel
              target.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(cap/rel,target)
          print("exact SA-CCR launcher overlay frozen")
          PY
      - name: Run corrected launcher regressions
        working-directory: /tmp/sa_ccr_launcher_verify
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m unittest -v canonical.tests.test_terminal_parent_portfolio_launcher_v1
          python - <<'PY'
          import ast
          from pathlib import Path
          src=Path("canonical/runtime/terminal_parent_portfolio_launcher_v1.py").read_text()
          assert "saccr.execute_terminal" in src
          assert "elif behavior_id == SA_CCR_ID" in src
          assert "candidate_package_commitment=commitment" in src
          assert "post_freeze_beacon=beacon" in src
          print("SA_CCR_ROUTE_SPECIFIC_EXECUTOR_BINDING=PASS")
          PY
