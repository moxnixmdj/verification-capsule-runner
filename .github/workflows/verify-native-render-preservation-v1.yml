name: Verify native artifact render preservation v1
on:
  pull_request:
    branches: [main]
    paths:
      - capsules/native_render_preservation_v1/**
      - .github/workflows/verify-native-render-preservation-v1.yml
  push:
    branches: [verify-native-render-preservation-v1-20261002]
    paths:
      - capsules/native_render_preservation_v1/**
      - .github/workflows/verify-native-render-preservation-v1.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install render dependencies
        run: |
          if ! command -v libreoffice >/dev/null 2>&1 || ! command -v pdftoppm >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y libreoffice-writer libreoffice-calc libreoffice-impress poppler-utils
          fi
          python -m pip install --disable-pip-version-check --no-input python-docx==1.2.0 openpyxl==3.1.5 python-pptx==1.0.2 pypdf==6.19.0 Pillow==12.3.0
      - name: Run exact mirrored tests
        run: cd capsules/native_render_preservation_v1 && PYTHONPATH=. python -m unittest -v canonical.tests.test_native_artifact_render_preservation_v1
      - name: Produce exact V7 R3 realization witness
        run: cd capsules/native_render_preservation_v1 && PYTHONPATH=. python professional_r3_v7_witness.py
