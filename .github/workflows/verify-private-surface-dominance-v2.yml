name: Verify private-surface dominance V2

on:
  pull_request:
    branches: [main]
    paths:
      - 'verification/PRIVATE_SURFACE_DOMINANCE_INPUT_V2.json'
      - 'verification/test_private_surface_dominance_v2.py'
      - 'canonical/runtime/proof_route_dominance.py'
      - '.github/workflows/verify-private-surface-dominance-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Bind exact Brain input and compiler
        run: |
          test "$(git hash-object verification/PRIVATE_SURFACE_DOMINANCE_INPUT_V2.json)" = "d651a9af9ba4ac16c4a0c1271fb4933ff3e9f277"
          test "$(git hash-object canonical/runtime/proof_route_dominance.py)" = "64efeaad5d4295d5bd1a3bd53feae5170c22a8a4"
      - run: PYTHONPATH=. python verification/test_private_surface_dominance_v2.py
