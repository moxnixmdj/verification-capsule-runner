name: Verify Agent V13 identity V2 repair

on:
  push:
    branches:
      - verify-agent-v13-identity-v2

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile repaired identity path
        run: |
          python3 -m py_compile             execution_guard/logical_attempt_identity_v2.py             capsules/tb_science_rank15_20261009_v1/canonical/runtime/harbor_science_agent_v13.py             capsules/tb_science_rank19_20261010_v1/verify_agent_v13_identity_v2_repair.py
      - name: Run no-task identity verification
        env:
          PYTHONPATH: ".:capsules/tb_science_rank15_20261009_v1"
        run: python3 capsules/tb_science_rank19_20261010_v1/verify_agent_v13_identity_v2_repair.py
