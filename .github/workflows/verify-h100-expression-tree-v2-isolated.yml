name: Isolated H100 expression-tree V2 verifier

on:
  push:
    branches:
      - verify/h100-expression-tree-v2-isolated-20261005-sol
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.10"
      - name: Compile exact V2
        run: python -m py_compile canonical/runtime/h100_zero_learned_mechanism_synthesizer_v2.py
      - name: V1 regression
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python canonical/tests/test_h100_zero_learned_mechanism_synthesizer_v1.py
      - name: V2 falsification
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python canonical/tests/test_h100_zero_learned_mechanism_synthesizer_v2.py
