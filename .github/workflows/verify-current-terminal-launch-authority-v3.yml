name: Verify current terminal launch authority V3
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/current_terminal_launch_authority_v3/**"
      - ".github/workflows/verify-current-terminal-launch-authority-v3.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build immutable V3 overlay
        run: |
          set -euo pipefail
          rm -rf /tmp/current_terminal_launch_authority_v3
          cp -a capsules/current_terminal_launch_authority_v2 /tmp/current_terminal_launch_authority_v3
          cp capsules/current_terminal_launch_authority_v3/TERMINAL_ROUTE_SPECIFIC_EXECUTOR_MANIFEST_V1.json \
            /tmp/current_terminal_launch_authority_v3/canonical/governance/TERMINAL_ROUTE_SPECIFIC_EXECUTOR_MANIFEST_V1.json
      - name: Verify frozen base and exact replacement
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          base=Path("capsules/current_terminal_launch_authority_v2")
          v3=Path("capsules/current_terminal_launch_authority_v3")
          d=json.loads((v3/"snapshot_manifest.json").read_text())
          m=json.loads((base/"snapshot_manifest.json").read_text())
          replaced=d["replacement"]["path"]
          for rel,expected in sorted(m["brain_snapshot_blobs"].items()):
              if rel == replaced:
                  continue
              data=(base/rel).read_bytes()
              actual=hashlib.sha1(b"blob "+str(len(data)).encode()+bytes([0])+data).hexdigest()
              assert actual == expected,(rel,expected,actual)
          data=(v3/"TERMINAL_ROUTE_SPECIFIC_EXECUTOR_MANIFEST_V1.json").read_bytes()
          actual=hashlib.sha1(b"blob "+str(len(data)).encode()+bytes([0])+data).hexdigest()
          assert actual == d["replacement"]["brain_blob_sha"],(actual,d["replacement"])
          print("V3 exact overlay verified")
          PY
      - name: Recompute prequalification and launch authority
        working-directory: /tmp/current_terminal_launch_authority_v3
        run: |
          set -euo pipefail
          touch canonical/__init__.py canonical/runtime/__init__.py canonical/tests/__init__.py
          PYTHONPATH=. python -m unittest -v \
            canonical.tests.test_terminal_prequalification_reducer \
            canonical.tests.test_terminal_wave_launch_authority_reducer_v1
          PYTHONPATH=. python canonical/runtime/terminal_prequalification_reducer.py . > /tmp/prequal-v3.json
          PYTHONPATH=. python canonical/runtime/terminal_wave_launch_authority_reducer_v1.py . > /tmp/authority-v3.json
          cat /tmp/authority-v3.json
          python - <<'PY'
          import json
          d=json.load(open("$GITHUB_WORKSPACE/capsules/current_terminal_launch_authority_v3/snapshot_manifest.json"))
          p=json.load(open("/tmp/prequal-v3.json"))
          a=json.load(open("/tmp/authority-v3.json"))
          e=d["expected_verdict"]
          assert p["pass"] is e["prequalification_pass"],p
          assert a["launch_authority"] is e["launch_authority"],a
          assert a["execution_authority"] is e["execution_authority"],a
          assert a["route_count"] == e["route_count"],a
          assert a["failed_predicates"] == e["failed_predicates"],a
          assert a["terminal_results_observed"] == 0,a
          assert a["fresh_terminal_evidence_consumed"] == 0,a
          print("CURRENT_TERMINAL_LAUNCH_AUTHORITY_V3=PASS")
          PY
