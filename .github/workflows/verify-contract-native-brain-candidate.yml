name: Verify Brain contract-native candidate
on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/runtime/contract_native_brain_candidate.py'
      - 'canonical/runtime/contract_native_proof_suites.py'
      - 'canonical/tests/test_contract_native_brain_candidate.py'
      - '.github/workflows/verify-contract-native-brain-candidate.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run candidate against fresh deterministic proof grid
        run: PYTHONPATH=. python -m unittest -v canonical.tests.test_contract_native_brain_candidate
