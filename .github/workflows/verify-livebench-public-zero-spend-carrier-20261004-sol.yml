name: Verify LiveBench public zero-spend carrier
on:
  pull_request:
    paths:
      - 'subject/livebench_public_zero_spend_carrier_20261004_sol/**'
      - 'verify_livebench_public_zero_spend_carrier_20261004_sol.py'
      - '.github/workflows/verify-livebench-public-zero-spend-carrier-20261004-sol.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python verify_livebench_public_zero_spend_carrier_20261004_sol.py
