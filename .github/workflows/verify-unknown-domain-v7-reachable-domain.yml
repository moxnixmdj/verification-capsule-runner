name: Verify Unknown-Domain V7 reachable domain

on:
  pull_request:
    branches: [main]
    paths:
      - "verification/unknown_domain_v7_reachable_domain_independent.py"
      - ".github/workflows/verify-unknown-domain-v7-reachable-domain.yml"
      - "canonical/runtime/unknown_domain_direct_hidden_generator_v5.py"
      - "canonical/tests/test_unknown_domain_direct_v5.py"
      - "canonical/runtime/unknown_domain_direct_v6_universal_proof_v1.py"

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12.10","3.13"]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Run reachable-domain verifier
        run: PYTHONPATH=. python verification/unknown_domain_v7_reachable_domain_independent.py
      - name: Run repaired regression suite
        run: PYTHONPATH=. python -m pytest -q canonical/tests/test_unknown_domain_direct_v5.py
      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unknown-domain-v7-reachable-domain-${{ matrix.python }}
          path: unknown_domain_v7_reachable_domain_receipt.json
          if-no-files-found: error
          retention-days: 7
