name: Verify LiveBench Question ID Hash Lineage
on:
  pull_request:
    branches: [main]
    paths:
      - "verify_livebench_question_id_hash_lineage.py"
      - ".github/workflows/verify-livebench-question-id-hash-lineage.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet "pyarrow==21.0.0"
      - run: python verify_livebench_question_id_hash_lineage.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livebench-question-id-hash-lineage
          path: livebench_question_id_hash_lineage_receipt.json
          if-no-files-found: error
