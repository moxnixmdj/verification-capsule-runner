name: Verify current trajectory binding v2
on:
  pull_request:
    branches: [main]
    paths:
      - 'capsules/p1_trajectory_t0_t2/**'
      - '.github/workflows/verify-current-trajectory-binding-v2.yml'
permissions:
  contents: read
  pull-requests: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Bind exact current Brain trajectory bytes
        working-directory: capsules/p1_trajectory_t0_t2
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object canonical/governance/P1_TRAJECTORY_T0_T2_MULTIPLEX_TERMINAL_BINDING_V1.json)" = "8703c6aa08227467a619a7ae90d0d61f8e54da39"
          test "$(git hash-object canonical/runtime/p1_trajectory_t0_t2_multiplex_preflight.py)" = "d2f8135b62cb6593f3fb1b1ee9d8f0b92ad31f46"
          test "$(git hash-object canonical/tests/test_p1_trajectory_t0_t2_multiplex_preflight.py)" = "5742ec1f6ee3ff3a0edee7d511c9523f0d2a68e3"
          test "$(git hash-object canonical/runtime/trajectory_failure_typed_ir_candidate_v4.py)" = "0c386e6b78a8e97e9c1944e63600047bc4e2849b"
          test "$(git hash-object canonical/runtime/trajectory_failure_typed_ir_proof_v4.py)" = "6e1dfaa6b63fc629d55d07b2361bf625f11a5ce3"
          test "$(git hash-object canonical/tests/test_trajectory_failure_typed_ir_v4.py)" = "70a224fec7341775e46bb1bfb8bd2d33b3c355b3"
          test "$(git hash-object canonical/verification/TRAJECTORY_TYPED_IR_V4_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json)" = "ee69a93c45a2b16676c49bfb0a01749a5c4ea1e2"
      - name: Run fail-closed current binding and typed-V4 tests
        working-directory: capsules/p1_trajectory_t0_t2
        run: |
          PYTHONPATH=. python -m unittest -v canonical.tests.test_p1_trajectory_t0_t2_multiplex_preflight
          PYTHONPATH=. python -m unittest -v canonical.tests.test_trajectory_failure_typed_ir_v4
      - name: Record pass
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR_NUMBER" --repo moxnixmdj/verification-capsule-runner --body "CURRENT_TRAJECTORY_BINDING_V2_PASS: exact binding 8703c6aa08227467a619a7ae90d0d61f8e54da39 plus typed-V4 dependency cone passed fail-closed prewave tests; zero terminal results and zero capability/family credit."
