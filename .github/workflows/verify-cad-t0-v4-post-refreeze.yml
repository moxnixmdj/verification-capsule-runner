name: Verify CAD T0 V4 post-refreeze binding

on:
  pull_request:
    branches: [main]
    paths:
      - 'capsules/cad_t0_v4_post_refreeze/**'
      - '.github/workflows/verify-cad-t0-v4-post-refreeze.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run canonical V4 validator
        working-directory: capsules/cad_t0_v4_post_refreeze
        run: PYTHONPATH=. python -m unittest -v canonical.tests.test_cad_t0_post_refreeze_binding_v4_validator
