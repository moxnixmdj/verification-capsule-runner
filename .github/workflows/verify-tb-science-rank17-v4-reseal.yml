name: Verify TB-Science Rank17 V4 repaired-runtime reseal

on:
  pull_request:
    branches: [terminal-execution-v1]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Require zero-exposure V4 staging state
        shell: bash
        run: |
          set -euo pipefail
          test ! -e capsules/tb_science_rank17_20261009_v4/ACTIVATE_RANK17_V4_PR.json
          test ! -e capsules/tb_science_rank17_20261009_v3/ACTIVATE_RANK17_V3_PR.json
          python capsules/tb_science_rank17_20261009_v4/rank17_v4_zero_exposure_reseal_tests.py

      - name: Verify proof-carrying execution admission without activation
        shell: bash
        run: |
          set -euo pipefail
          python execution_guard/terminal_execution_admission_v3.py \
            --workflow ".github/workflows/execute-tb-science-rank17-20261009-v4.yml" \
            --slot "terminal-bench-science/variable-star-vetting::trial-0" \
            --task-digest "sha256:51bf2b9d8e87a428772d92c6765d83ad3edc7c24283d2ff75af5f050aaee0c67" \
            --require-execution-authority

      - name: Verify V4 preflight composition in staged mode
        shell: bash
        run: |
          set -euo pipefail
          python capsules/tb_science_rank17_20261009_v4/rank17_execution_preflight_v6.py --allow-staged

      - name: Verify raw-task punctuation coverage and structured-index alignment
        shell: bash
        run: |
          set -euo pipefail
          C="$GITHUB_WORKSPACE/capsules/tb_science_rank15_20261009_v1"
          export PYTHONPATH="$GITHUB_WORKSPACE:$C"
          python "$C/canonical/tests/test_lossless_raw_task_punctuation_coverage_v1.py"

      - name: Compile exact V4 control plane
        shell: bash
        run: |
          set -euo pipefail
          C="capsules/tb_science_rank17_20261009_v4"
          R="capsules/tb_science_rank15_20261009_v1"
          python -m py_compile \
            "$C/rank17_prestart_token_guard_v4.py" \
            "$C/rank17_execution_preflight_v6.py" \
            "$C/rank17_start_cas_v6.py" \
            "$C/rank17_v6_status_journal_runner.py" \
            "$C/rank17_finalize_receipt_v6.py" \
            "$R/canonical/runtime/lossless_raw_task_contract_v1.py" \
            "$R/canonical/runtime/explicit_requirement_index_v2.py"

      - name: Prove canonical repaired blobs are exact
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object capsules/tb_science_rank15_20261009_v1/canonical/runtime/lossless_raw_task_contract_v1.py)" = "53a440fccf91aa08f18abfff4f283e5fd18d9fcd"
          test "$(git hash-object capsules/tb_science_rank15_20261009_v1/canonical/runtime/explicit_requirement_index_v2.py)" = "525fac941302254a47710aaae30b0174fab2cb40"
          test "$(git hash-object capsules/tb_science_rank15_20261009_v1/canonical/tests/test_lossless_raw_task_punctuation_coverage_v1.py)" = "1ed5160a49f9d8942ae840cb277ad26dd9cef099"
          echo "PASS__RANK17_V4_REPAIRED_RUNTIME_RESEAL"
