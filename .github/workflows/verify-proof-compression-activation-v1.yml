name: Verify proof compression activation v1
on:
  pull_request:
    branches: [main]
    paths:
      - 'capsules/proof_compression_activation_v1/**'
      - '.github/workflows/verify-proof-compression-activation-v1.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact Brain activation and fail-closed wiring
        env:
          EXPECTED_JSON: '{"canonical/runtime/epistemic_closure_kernel_v1.py":"6c4672e8fbee098f76f02766d2197fa46968bda0","canonical/tests/test_epistemic_closure_kernel_v1.py":"e91848488501508cadd71d1edbd0f750c1002552","canonical/runtime/composition_component_proof_slicer_v1.py":"0e5028d8547bc3e17e7128b6311f734ac30a16d8","canonical/tests/test_composition_component_proof_slicer_v1.py":"0965e8386b7d07f1eebd575b3e8f28d216dde8f8","canonical/runtime/protocol_implication_scope_algebra_v1.py":"bee693051d043a5438571fd3435733e4878d0002","canonical/tests/test_protocol_implication_scope_algebra_v1.py":"87a501a94600e2367b025101ef63132ef1cc3f6c","canonical/governance/PROOF_COMPRESSION_KERNELS_V1.json":"35fa253b2fff9fea586e1e8cd94dd6c549044e1b","canonical/verification/PROOF_COMPRESSION_KERNELS_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json":"fff1315869a8f33a9d6576cd2b2a461996b351e5","canonical/governance/PROOF_COMPRESSION_KERNELS_ACTIVATION_V1.json":"83da0c8df87834513ab084013e4f215b2d14bf0c","canonical/governance/EXECUTION_FIRST_SELF_PROVING_OPTIMIZER_V1.json":"7ed105e8cdce24732fa6522d3c8cba1eada19a60","canonical/governance/OPUS55_ACCEPTANCE_ACTION_HYPERGRAPH_V1.json":"755a3291d8271acb3eb3a9f5db0857235fa0efd9","canonical/governance/OPUS55_ACCEPTANCE_PREDICATE_EVIDENCE_BINDINGS_V2.json":"f500b56e7349ce8c0f97cfd0bd1db4888ec6887c","canonical/tests/test_proof_compression_activation_v1.py":"a5f855914b31267effaff03a8264799e9c9f8600"}'
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path('capsules/proof_compression_activation_v1')
          expected=json.loads(os.environ['EXPECTED_JSON'])
          for rel,want in sorted(expected.items()):
              data=(root/rel).read_bytes()
              got=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              assert got==want,(rel,got,want)
          print('PROOF_COMPRESSION_ACTIVATION_EXACT_13_OF_13_BLOBS_PASS')
          PY
          cd capsules/proof_compression_activation_v1
          PYTHONPATH=. python canonical/tests/test_proof_compression_activation_v1.py
