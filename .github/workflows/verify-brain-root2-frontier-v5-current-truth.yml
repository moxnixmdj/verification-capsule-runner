name: Verify Brain Root2 Frontier V5 current truth

on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/root2_frontier_v5_current_truth/**"
      - ".github/workflows/verify-brain-root2-frontier-v5-current-truth.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify Root2 V5 current truth
        run: python capsules/root2_frontier_v5_current_truth/verify_v5.py
