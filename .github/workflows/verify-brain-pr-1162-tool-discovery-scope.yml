name: Verify Brain PR 1162 Tool Discovery common-authority scope

on:
  push:
    branches:
      - "verify-brain-pr1162-tool-discovery-common-authority"
    paths:
      - "capsules/brain_pr_1162_tool_discovery_scope/**"
      - ".github/workflows/verify-brain-pr-1162-tool-discovery-scope.yml"
  pull_request:
    branches: [main]
    paths:
      - "capsules/brain_pr_1162_tool_discovery_scope/**"
      - ".github/workflows/verify-brain-pr-1162-tool-discovery-scope.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify exact Brain proof-cone identities
        shell: bash
        run: |
          set -euo pipefail
          cd capsules/brain_pr_1162_tool_discovery_scope
          test "$(git hash-object canonical/runtime/tool_discovery_dynamic_candidate_v4.py)" = "e614d0bed8e291e31f57189cd6f0f75aa39b0f74"
          test "$(git hash-object canonical/tests/test_tool_discovery_dynamic_v4.py)" = "23f0add178ca0c731d15e0645ee9b8841317efee"
          test "$(git hash-object canonical/governance/TOOL_DISCOVERY_DYNAMIC_V4_REPAIR_ACTIVATION_V1.json)" = "36a7a97f3d68066337bb2cf45778d4100c22c185"
          test "$(git hash-object canonical/verification/TOOL_DISCOVERY_DYNAMIC_V4_PUBLIC_RUNNER_VERIFICATION_20261003_V1.json)" = "10cb18355d247a05177230d0dd345e161e84111d"
          test "$(git hash-object canonical/runtime/tool_discovery_common_authority_interface_v1.py)" = "1c86903fed59790672de2285c9e7b3f6f46dff25"
          test "$(git hash-object canonical/tests/test_tool_discovery_common_authority_interface_v1.py)" = "d54a447e19b32b2daa4b4f9b1855142b34671f39"
          test "$(git hash-object canonical/governance/TOOL_DISCOVERY_COMMON_AUTHORITY_SCOPE_RELATION_V1.json)" = "4c890bc23e37f7c845a56affa9e0b175653f6271"
          test "$(git hash-object canonical/governance/BEHAVIORAL_CONTRACT_REGISTRY_V1.json)" = "ee187f611a0e82b2de495ee377682f39bc31dd31"
          test "$(git hash-object canonical/governance/OPUS55_TERMINAL_PROOF_PROTOCOLS_V1.json)" = "62394e5b7d221ec9f69c3458f669e40e253a9d09"
          test "$(git hash-object canonical/governance/UNBARRED_FAMILY_MATCHED_PARITY_PROTOCOL_V1.json)" = "49181a12362ba3d640fc18d0251901dd49dce929"
          test "$(git hash-object canonical/governance/OPUS55_MATCHED_COMPARATOR_SUPERPORTFOLIO_V1.json)" = "d9ac894594ebcd2883520f7b7977a3548420541c"
          test "$(git hash-object canonical/governance/ABSOLUTE_DOMINANCE_SCOPE_COMPLETENESS_RECONCILIATION_V1.json)" = "ec2d931860e7cd7d9f73a658706f8c33fca3a10d"
          test "$(git hash-object canonical/governance/TOOL_DISCOVERY_UNIVERSAL_SCOPE_FORMALISM_CUT_V1.json)" = "e485b9729e8aea6bee2d75453167912023167fe8"
          test "$(git hash-object canonical/runtime/tool_discovery_universal_scope_certificate_v2.py)" = "f562de098c1420e7b78d0da69c5155acb17bb629"
          test "$(git hash-object canonical/tests/test_tool_discovery_universal_scope_certificate_v2.py)" = "d38ae4c41b14851eebe6330f2bf344ef3ac5befa"
          test "$(git hash-object canonical/governance/TOOL_DISCOVERY_UNIVERSAL_SCOPE_CERTIFICATE_V2.json)" = "a3547707eaf47a285131007a945a07896410c487"

      - name: Run interface completeness and universal-certificate tests
        shell: bash
        run: |
          set -euo pipefail
          cd capsules/brain_pr_1162_tool_discovery_scope
          export PYTHONPATH=.
          python -m unittest             canonical.tests.test_tool_discovery_common_authority_interface_v1             canonical.tests.test_tool_discovery_universal_scope_certificate_v2 -v

      - name: Execute universal scope certificate
        shell: bash
        run: |
          set -euo pipefail
          cd capsules/brain_pr_1162_tool_discovery_scope
          export PYTHONPATH=.
          python canonical/runtime/tool_discovery_universal_scope_certificate_v2.py | tee /tmp/tool_scope.json
          python - <<'PY'
          import json
          out=json.load(open("/tmp/tool_scope.json"))
          assert out["universal_scope_proved"] is True, out
          assert out["scope_atom_satisfied_candidate"] is True, out
          assert out["basis_kind"]=="UNIVERSAL_FORMAL_SCOPE_PROOF", out
          assert out["uses_empirical_generalization"] is False, out
          assert out["terminal_cases_replayed"]==0, out
          assert out["new_reality_units_consumed"]==0, out
          assert out["capability_credit_delta"]==0, out
          assert out["family_credit_delta"]==0, out
          assert out["promotion_authority"] is False, out
          print("universal scope candidate: PASS")
          PY

      - name: Independently reconstruct common-authority counterfactual cut
        shell: bash
        run: |
          set -euo pipefail
          cd capsules/brain_pr_1162_tool_discovery_scope
          export PYTHONPATH=.
          python - <<'PY'
          import json
          from canonical.runtime.tool_discovery_common_authority_interface_v1 import (
              build_complete_interface, validate_complete_interface, tool_invocable,
          )

          authority=[
            {"tool_id":"EXPENSIVE","cost":10.0,"available":True,"authorized":True,"epoch":0,
             "meta":{"region":"X"},"capabilities":{"CAP_A":True}},
            {"tool_id":"CHEAP","cost":1.0,"available":True,"authorized":True,"epoch":0,
             "meta":{"region":"X"},"capabilities":{"CAP_A":True}},
            {"tool_id":"WRONG","cost":0.1,"available":True,"authorized":True,"epoch":0,
             "meta":{"region":"X"},"capabilities":{"CAP_A":False}},
          ]
          interface=build_complete_interface(authority, source_count=2, initially_visible_ids=[])
          verdict=validate_complete_interface(interface)
          assert verdict["valid"] is True, verdict
          assert verdict["common_authority_ids"]==verdict["discovery_union_ids"], verdict
          assert interface["public"]["visible_tools"]==[]
          assert verdict["capability_truth_candidate_visible"] is False
          assert tool_invocable("CHEAP", interface) is True
          assert tool_invocable("HYPOTHETICAL_OUTSIDE", interface) is False

          # Omission must destroy scope completeness.
          sid=interface["public"]["discovery_sources"][0]["source_id"]
          interface["oracle"]["source_results"][sid].pop()
          broken=validate_complete_interface(interface)
          assert broken["valid"] is False, broken
          assert any("DISCOVERY_UNION_NOT_COMMON_AUTHORITY" in e for e in broken["errors"]), broken

          matched=json.load(open("canonical/governance/UNBARRED_FAMILY_MATCHED_PARITY_PROTOCOL_V1.json"))
          he=matched["harness_equivalence"]
          assert he["same_visible_information"] is True
          assert he["same_tool_classes"] is True
          assert he["same_external_action_authority"] is True

          superp=json.load(open("canonical/governance/OPUS55_MATCHED_COMPARATOR_SUPERPORTFOLIO_V1.json"))
          assert any("IDENTICAL_CASE_PAYLOADS_AND_TOOL_BOUNDARIES" in x
                     for x in superp["execution_semantics"])
          print("common matched authority and omission counterexample: PASS")
          PY

      - name: Enforce zero-credit boundary
        shell: bash
        run: |
          set -euo pipefail
          cd capsules/brain_pr_1162_tool_discovery_scope
          python - <<'PY'
          import json
          for p in [
            "canonical/governance/TOOL_DISCOVERY_COMMON_AUTHORITY_SCOPE_RELATION_V1.json",
            "canonical/governance/TOOL_DISCOVERY_UNIVERSAL_SCOPE_CERTIFICATE_V2.json",
          ]:
              d=json.load(open(p))
              assert d["new_reality_units_consumed"]==0
              assert d["terminal_results_replayed"]==0
              assert d["capability_credit_delta"]==0
              assert d["family_credit_delta"]==0
              assert d["execution_authority"] is False
              assert d["promotion_authority"] is False
          print("zero-credit boundary: PASS")
          PY
