name: Verify relative Elo nontransport theorem
on:
  pull_request:
    paths:
      - 'subject/relative_elo_nontransport_20261004_sol/**'
      - 'verify_relative_elo_nontransport.py'
      - '.github/workflows/verify-relative-elo-nontransport.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python verify_relative_elo_nontransport.py
