name: Verify Brain PR1278 Science V3 reconciliation

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/verify-brain-pr-1278-science-v3-reconciliation.yml"
      - "capsules/brain_pr_1278/**"
  push:
    branches: ["verify/science-v3-reconciliation-1278-20261003"]
    paths:
      - ".github/workflows/verify-brain-pr-1278-science-v3-reconciliation.yml"
      - "capsules/brain_pr_1278/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bind exact Brain PR1278 bytes
        run: |
          set -euo pipefail
          C=capsules/brain_pr_1278
          test "$(git hash-object "$C/canonical/governance/CURRENT_TERMINAL_AUTHORITY_V1.json")" = "ad482ff264d5cdd6286aaf2ffd32db47acd447f0"
          test "$(git hash-object "$C/canonical/governance/ACTIVE_GOAL_HIERARCHY_V1.json")" = "440bd073242a5402c4093b69f1056ec2b32b1306"
          test "$(git hash-object "$C/canonical/CANONICAL_POINTER.json")" = "ca783dc275796de525d76c41de0db67179b1b5a7"
          test "$(git hash-object "$C/canonical/governance/REAL_OUTPUT_SCOREBOARD_V1.json")" = "214c4b6c824db6ba1db6dd3351e9e09a8344c3e0"
          test "$(git hash-object "$C/canonical/capabilities/frontier/OPUS_5_5_USEFUL_CAPABILITY_OWNERSHIP_V1.json")" = "78a8afb9675408ba52305e5603823409eddc8bcd"
          test "$(git hash-object "$C/canonical/governance/TB_SCIENCE_CANARY_V3_FINAL_ZERO_RECONCILIATION_V1.json")" = "e532210e793e0bb2036d72d7eafc24bfc7a93e5f"
          test "$(git hash-object "$C/canonical/verification/TB_SCIENCE_CANARY_V3_FINAL_ZERO_PUBLIC_RUNNER_VERIFICATION_20261003_V1.json")" = "6f888ed85eff5acb42b472c852eb8ee0aa49669e"

      - name: Verify frontier mirrors derive from current terminal authority
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re
          from pathlib import Path
          C=Path("capsules/brain_pr_1278")
          L=lambda p: json.loads((C/p).read_text())
          t=L("canonical/governance/CURRENT_TERMINAL_AUTHORITY_V1.json")
          h=L("canonical/governance/ACTIVE_GOAL_HIERARCHY_V1.json")
          p=L("canonical/CANONICAL_POINTER.json")
          s=L("canonical/governance/REAL_OUTPUT_SCOREBOARD_V1.json")
          o=L("canonical/capabilities/frontier/OPUS_5_5_USEFUL_CAPABILITY_OWNERSHIP_V1.json")

          assert t["truth"]["achieved"] is False
          assert t["truth"]["contracts"].startswith("12/12_WHOLE_SCOPE_PASS")
          assert t["truth"]["behavioral_families"].startswith("19/19_PROVISIONAL_BEHAVIORAL_PASS")
          m=re.fullmatch(r"(\d+)/(\d+)_PASS__(\d+)/(\d+)_OPEN",t["truth"]["opus55_acceptance"])
          assert m and m.group(2)==m.group(4)
          accepted,total,open_count=map(int,(m.group(1),m.group(2),m.group(3)))
          proved=int(t["atomic_acceptance_frontier"]["proved"])
          unresolved=int(t["atomic_acceptance_frontier"]["unresolved"])
          atom_total=int(t["atomic_acceptance_frontier"]["total"])
          assert (accepted,total,open_count)==(3,19,16)
          assert (proved,unresolved,atom_total)==(8,30,38)

          b=f"TERMINAL_FALSE__{open_count}_OF_{total}_FAMILIES_OPEN__{unresolved}_OF_{atom_total}_ATOMIC_PREDICATES_UNRESOLVED__SEE_CURRENT_TERMINAL_AUTHORITY_NEXT_FOR_EXACT_ACTIVE_ROUTE"
          e="CURRENT_TERMINAL_AUTHORITY_NEXT_PASS_OR_FALSIFICATION__OR_ANOTHER_CAUSALLY_BOUND_ZERO_REALITY_DELTA__NO_TERMINAL_PROMOTION_WITHOUT_SEPARATE_INDEPENDENT_REDUCTION"
          n="VERIFY_TB_SCIENCE_LOCAL_SUBSTRATE_CPU_PORTABILITY_REPAIR_V1__NO_NEW_SCIENCE_TERMINAL_SLOT_AUTHORITY_UNTIL_INDEPENDENT_PASS"
          assert t["next"]==n and t["next_terminal_action"]==n
          assert h["current_parent_blocker"]==b
          assert h["next_required_action_class"]==n
          assert h["next_progress_event_target"]==e
          assert p["current_frontier"]["critical_blocker"]==b
          assert p["current_frontier"]["highest_leverage_capability_gap"]==b
          assert p["current_frontier"]["next_step"]==n
          af=s["active_frontier_accounting"]
          assert af["residual_gap"]==b and af["current_parent_blocker"]==b and af["next_required_action"]==n
          assert s["next_required_action"]==n and s["next_progress_event_target"]==e
          assert o["residual_gap"]==b and o["current_atomic_blocker"]==b
          assert o["next_action"]==n and o["current_atomic_next_action"]==n and o["next_progress_event_target"]==e
          PY

      - name: Verify Science V3 is spent and CPU repair is fail-closed
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          C=Path("capsules/brain_pr_1278")
          L=lambda p: json.loads((C/p).read_text())
          t=L("canonical/governance/CURRENT_TERMINAL_AUTHORITY_V1.json")
          z=L("canonical/governance/TB_SCIENCE_CANARY_V3_FINAL_ZERO_RECONCILIATION_V1.json")
          v=L("canonical/verification/TB_SCIENCE_CANARY_V3_FINAL_ZERO_PUBLIC_RUNNER_VERIFICATION_20261003_V1.json")
          a=t["authorities"]["tb_science_one_slot_canary_v3_active_candidate"]
          cpu=t["authorities"]["tb_science_local_substrate_cpu_portability_repair"]
          assert a["execution_authority"] is False and a["promotion_authority"] is False
          assert a["authorized_slot_count"]==0
          assert "FINALIZED_AND_REVOKED" in a["status"]
          assert z["artifact"]["slot_receipt"]["status"]=="FINAL_ZERO"
          assert z["artifact"]["slot_receipt"]["execution_authority_consumed"] is True
          assert z["observed_failure"]["terminal_task_content_read"]==0
          assert z["observed_failure"]["harbor_terminal_task_started"] is False
          assert z["accounting"]["finalized_failures_after_v3"]==5
          assert z["accounting"]["remaining_failures_before_fail_lock"]==73
          assert v["independent_runner"]["workflow_run_id"]==37111302253
          assert v["independent_runner"]["workflow_job_id"]==111169584840
          assert v["independent_runner"]["conclusion"]=="success"
          assert v["verified"]["rerun_allowed"] is False
          assert cpu["execution_authority"] is False and cpu["promotion_authority"] is False
          assert cpu["verifier_pull_request"]==1267
          print("BRAIN_PR1278_SCIENCE_V3_RECONCILIATION_PASS")
          PY
