name: Verify global terminal surface dominance V3

on:
  push:
    branches: [main]
    paths:
      - 'verification/GLOBAL_TERMINAL_SURFACE_DOMINANCE_INPUT_V3.json'
      - 'verification/test_global_terminal_surface_dominance_v3.py'
      - 'canonical/runtime/proof_route_dominance.py'
      - '.github/workflows/verify-global-terminal-surface-dominance-v3.yml'
  pull_request:
    branches: [main]
    paths:
      - 'verification/GLOBAL_TERMINAL_SURFACE_DOMINANCE_INPUT_V3.json'
      - 'verification/test_global_terminal_surface_dominance_v3.py'
      - 'canonical/runtime/proof_route_dominance.py'
      - '.github/workflows/verify-global-terminal-surface-dominance-v3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Bind exact Brain input and compiler
        run: |
          test "$(git hash-object verification/GLOBAL_TERMINAL_SURFACE_DOMINANCE_INPUT_V3.json)" = "931bdd17e6351477281dd81492521f9337de5121"
          test "$(git hash-object canonical/runtime/proof_route_dominance.py)" = "64efeaad5d4295d5bd1a3bd53feae5170c22a8a4"
      - run: PYTHONPATH=. python verification/test_global_terminal_surface_dominance_v3.py
