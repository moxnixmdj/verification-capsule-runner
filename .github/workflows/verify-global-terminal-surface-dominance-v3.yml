name: Verify global terminal surface dominance V3
on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/runtime/proof_route_dominance.py'
      - 'canonical/governance/GLOBAL_TERMINAL_SURFACE_DOMINANCE_INPUT_V3.json'
      - 'canonical/tests/test_global_terminal_surface_dominance_v3.py'
      - '.github/workflows/verify-global-terminal-surface-dominance-v3.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m py_compile canonical/runtime/proof_route_dominance.py canonical/tests/test_global_terminal_surface_dominance_v3.py
      - name: Verify V3 nonweakening dominance
        run: PYTHONPATH=. python -m unittest -v canonical.tests.test_global_terminal_surface_dominance_v3
