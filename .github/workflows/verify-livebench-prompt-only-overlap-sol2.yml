name: Verify LiveBench prompt-only overlap SOL2
on:
  pull_request:
    branches: [main]
    paths:
      - "subject/livebench_prompt_only_overlap_20261004/**"
      - ".github/workflows/verify-livebench-prompt-only-overlap-sol2.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bind exact subject
        run: |
          set -euo pipefail
          test "$(git hash-object subject/livebench_prompt_only_overlap_20261004/subject.py)" = "6c2ffb2752932e4aca3d6dae4a18b3f40e3d3d66"
      - name: Fetch exact pinned public sources
        run: |
          set -euo pipefail
          git init /tmp/IFBench
          git -C /tmp/IFBench remote add origin https://github.com/allenai/IFBench.git
          git -C /tmp/IFBench fetch --depth 1 origin 1c40f0c10d9b5c5c2f10a175a28007ebb64f7f4d
          git -C /tmp/IFBench checkout --detach FETCH_HEAD
          test "$(git -C /tmp/IFBench hash-object data/IFBench_test.jsonl)" = "a8e343ed928d8b4e649b9dba651fed7757ccacc3"

          git init /tmp/LiveBench
          git -C /tmp/LiveBench remote add origin https://github.com/LiveBench/LiveBench.git
          git -C /tmp/LiveBench fetch --depth 1 origin 8f8e5c381a16e3f24257776edd53471fe86f8091
          git -C /tmp/LiveBench checkout --detach FETCH_HEAD
          test "$(git -C /tmp/LiveBench hash-object livebench/if_runner/ifbench/instructions.py)" = "02b2dfeb50f036b89bec3df34522c73f756d8f44"
          test "$(git -C /tmp/LiveBench hash-object livebench/if_runner/ifbench/instructions_util.py)" = "21b13c7fcfc2c2de01e80c9e7dd222b9bca81342"
          grep -F "ngrams = set(nltk.ngrams(value, n))" /tmp/LiveBench/livebench/if_runner/ifbench/instructions.py
          grep -F "sentences = instructions_util.split_into_sentences(value)" /tmp/LiveBench/livebench/if_runner/ifbench/instructions.py
      - name: Install minimal frozen-helper dependency
        run: python -m pip install --quiet "nltk==3.9.2"
      - name: Independent recomputation
        run: python subject/livebench_prompt_only_overlap_20261004/verify.py
      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livebench-prompt-only-overlap-sol2-receipt
          path: livebench_prompt_only_overlap_receipt.json
          if-no-files-found: error
