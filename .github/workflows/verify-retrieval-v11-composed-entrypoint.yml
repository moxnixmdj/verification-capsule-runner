name: Verify Retrieval V11 composed entrypoint
on:
  push:
    branches:
      - verify/retrieval-v11-composed-entrypoint-20261003
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact composed retrieval blobs
        run: |
          test "$(git hash-object canonical/runtime/global_retrieval_entrypoint_v4.py)" = "c1c6059ce3af8d7857e04896e74c204b1fef8010"
          test "$(git hash-object canonical/tests/test_global_retrieval_entrypoint_v4.py)" = "caa96510f65c198004ca8eb01c3a49140ce43bec"
          test "$(git hash-object canonical/runtime/retrieval_live_instrumented_executor_v1.py)" = "a63a4991daa3dca147f373b7890151f07afd3f4e"
          test "$(git hash-object canonical/runtime/global_retrieval_entrypoint_v3.py)" = "bc964cdb6ff684ad9be79aa0752822ce85a26f66"
          test "$(git hash-object canonical/runtime/retrieval_source_universe_v1.py)" = "e0e627233d28118db916d68031d37d524f2315d9"
          test "$(git hash-object canonical/governance/GLOBAL_RETRIEVAL_SOURCE_UNIVERSE_V1.json)" = "4f3009eeaa9c5e00dd0ffe3b3400a40b6c0a9224"
          test "$(git hash-object canonical/state/retrieval_live_events_v1.jsonl)" = "675bcaa2127e5175655b137ca2614fbf97849ec9"
      - run: PYTHONPATH=. python canonical/tests/test_global_retrieval_entrypoint_v4.py
      - run: PYTHONPATH=. python canonical/tests/test_retrieval_live_instrumented_executor_v1.py
      - run: PYTHONPATH=. python canonical/runtime/global_retrieval_entrypoint_v4.py
