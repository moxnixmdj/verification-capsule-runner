name: Verify terminal shadow reality V1

on:
  pull_request:
    paths:
      - 'verify_terminal_shadow_reality_v1_20261004.py'
      - 'subject/terminal_shadow_reality_v1_20261004/**'
      - '.github/workflows/verify-terminal-shadow-reality-v1-20261004.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run independent verifier
        run: python verify_terminal_shadow_reality_v1_20261004.py
