name: Verify deterministic decision primitives
on:
  pull_request:
    branches: [main]
    paths:
      - 'verification/deterministic_decision_primitives.py'
      - 'verification/test_deterministic_decision_primitives.py'
      - '.github/workflows/verify-deterministic-decision-primitives.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: cd verification && python -m unittest -v test_deterministic_decision_primitives.py
