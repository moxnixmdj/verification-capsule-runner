name: Verify Brain PR 1262 P1 reduction

on:
  push:
    branches: ["verify/brain-pr-1262-p1-reduction-20261003-sol"]
    paths:
      - ".github/workflows/verify-brain-pr-1262-p1-reduction.yml"
      - "capsules/brain_pr_1262/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/verify-brain-pr-1262-p1-reduction.yml"
      - "capsules/brain_pr_1262/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Recompute exact P1 minimum-cut discharge
        run: |
          set -euo pipefail
          python - <<'PY' | tee P1_REDUCTION_VERDICT.json
          import hashlib, json
          from pathlib import Path
          R=Path("capsules/brain_pr_1262")
          def load(p): return json.loads((R/p).read_text())
          def blob(p):
              b=(R/p).read_bytes()
              return hashlib.sha1(b"blob "+str(len(b)).encode()+b"\0"+b).hexdigest()

          cutp="canonical/governance/P1_MINIMUM_REALITY_CUT_INPUT_V1.json"
          freezep="canonical/governance/P1_SHARED_FAILURE_SEMANTICS_BATCH_FREEZE_V1.json"
          recp="canonical/verification/P1_PUBLIC_RECOVERY_RESULT_INDEPENDENT_ADJUDICATION_20261003_V1.json"
          redp="canonical/governance/P1_PUBLIC_RECOVERY_ACCEPTANCE_REDUCTION_V1.json"
          cut,freeze,rec,red=map(load,[cutp,freezep,recp,redp])

          assert blob(cutp)=="cbcb2faff8404623846e77e19fcc5b0ad00e81d9"
          assert blob(freezep)=="6a4b606a759d5479bb5ddbdf29426b1a1808b007"
          assert blob(recp)=="0caab58b4eeabe01f21f8f29853d6a3b45380722"
          assert blob(redp)=="0c65ee9afb4d0071735a4ba5ded6bb357f451a55"

          req=set(cut["requirements"])
          expected={
            "P1_FAILURE_SEMANTICS_TRANSPORT_FRONTIERCODE",
            "P1_FAILURE_SEMANTICS_TRANSPORT_CURSORBENCH",
            "P1_FAILURE_SEMANTICS_TRANSPORT_RECOVERY_SCOPE_COMPOSITION",
          }
          assert req==expected and cut["already_resolved"]==[], cut
          obs=[x for x in cut["observations"] if x["id"]=="P1_SHARED_SOURCE_BOUND_FAILURE_SEMANTICS_BATCH"]
          assert len(obs)==1 and set(obs[0]["covers"])==req and obs[0]["cost"]==1, obs

          assert freeze["selected_observation"]=="P1_SHARED_SOURCE_BOUND_FAILURE_SEMANTICS_BATCH", freeze
          assert set(freeze["frozen_direct_surfaces"])=={
            "T0/FRONTIERCODE_V1_1::P1_CAUSAL_FAILURE_LOCALIZATION_DIRECT_PROOF",
            "T0/CURSORBENCH_4_0::P1_CAUSAL_FAILURE_LOCALIZATION_DIRECT_PROOF",
            "T2/RECOVERY_SCOPE_COMPOSITION::P1_CAUSAL_FAILURE_LOCALIZATION_DIRECT_PROOF",
          }
          assert freeze["shared_batch_contract"]["both_failure_semantics_classes_required_per_admitted_case"] is True
          assert freeze["admission_boundary"]["separate_independent_transport_adjudication_required_after_batch"] is True
          assert freeze["admission_boundary"]["separate_acceptance_reduction_required_after_transport_adjudication"] is True

          assert rec["status"].startswith("INDEPENDENT_PASS__192_OF_192"), rec
          rr=rec["result"]
          assert (rr["cases"],rr["passes"],rr["failures"])==(192,192,0), rr
          assert rr["surfaces"]==3 and rr["cases_per_surface"]==64, rr
          assert rr["both_semantics_classes_present_every_case"] is True, rr
          assert rr["transport_fact_adjudicated"] is True, rr
          assert rr["fresh_reality_units_consumed"]==1, rr
          assert rr["terminal_v3_replayed"]==0 and rr["incremental_spend_usd"]==0, rr

          assert set(red["exact_requirements"])==req, red
          assert red["discharge"]["observation"]==obs[0]["id"], red
          assert red["discharge"]["covers_all_three"] is True
          assert red["discharge"]["independently_adjudicated"] is True
          assert red["derived"]["all_minimum_cut_requirements_discharged"] is True
          assert red["derived"]["remaining_p1_failure_semantics_information_residual"]==0
          assert red["derived"]["p1_scope_quarantine_lift_eligible"] is True

          out={
            "schema":"PROJECT_BRAIN_P1_PUBLIC_RECOVERY_ACCEPTANCE_REDUCTION_INDEPENDENT_VERIFICATION_V1",
            "status":"INDEPENDENT_PASS__EXACT_THREE_OF_THREE_MINIMUM_CUT_REQUIREMENTS_DISCHARGED__P1_QUARANTINE_LIFT_ELIGIBLE",
            "requirements_total":3,
            "requirements_discharged":3,
            "remaining_failure_semantics_information_residual":0,
            "source_cases":192,
            "source_passes":192,
            "source_failures":0,
            "fresh_reality_units_consumed":1,
            "terminal_v3_replayed":0,
            "incremental_spend_usd":0,
            "quarantine_lift_eligible":True,
            "promotion_authority":False,
            "next":"BIND_RECEIPT_TO_BRAIN__RECOMPUTE_CURRENT_P1_SCOPE_AND_PROPAGATION__DO_NOT_INFER_UNRELATED_OPUS55_ATOMIC_PREDICATE_CREDIT"
          }
          print(json.dumps(out,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: brain-pr-1262-p1-reduction-verdict
          path: P1_REDUCTION_VERDICT.json
          if-no-files-found: error
