name: Verify P1 V6 execution rescue
on:
  pull_request:
    paths:
      - "capsules/p1_v6_execution_rescue_20261002_v1/**"
      - ".github/workflows/verify-p1-v6-execution-rescue.yml"
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact Brain V6 execution replay
        run: python capsules/p1_v6_execution_rescue_20261002_v1/verify.py
