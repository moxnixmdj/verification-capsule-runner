name: Verify current Opus55 4-of-19 and 9-of-38 v1

on:
  pull_request:
    branches: [main]
    paths:
      - 'capsules/current_opus55_reconciliation_v1/**'
      - '.github/workflows/verify-current-opus55-4of19-9of38-v1.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Decode exact mirrored Brain governance blobs
        run: |
          set -euo pipefail
          ROOT="capsules/current_opus55_reconciliation_v1"
          mkdir -p "$ROOT/canonical/governance" "$ROOT/canonical/reasoning"
          base64 -d "$ROOT/encoded/OPUS55_ACCEPTANCE_PREDICATE_REGISTRY_V2.json.b64" > "$ROOT/canonical/governance/OPUS55_ACCEPTANCE_PREDICATE_REGISTRY_V2.json"
          base64 -d "$ROOT/encoded/OPUS55_ACCEPTANCE_PREDICATE_EVIDENCE_BINDINGS_V2.json.b64" > "$ROOT/canonical/governance/OPUS55_ACCEPTANCE_PREDICATE_EVIDENCE_BINDINGS_V2.json"
          base64 -d "$ROOT/encoded/EXACT_OPUS55_ZERO_COST_COMPARATOR_ROUTE_RECONCILIATION_V1.json.b64" > "$ROOT/canonical/reasoning/2026-10-02_EXACT_OPUS55_ZERO_COST_COMPARATOR_ROUTE_RECONCILIATION_V1.json"
          base64 -d "$ROOT/encoded/OPUS55_PUBLIC_BAR_SCORE_READINESS_MATRIX_V1.json.b64" > "$ROOT/canonical/governance/OPUS55_PUBLIC_BAR_SCORE_READINESS_MATRIX_V1.json"

      - name: Verify exact 11 Brain blob identities
        env:
          EXPECTED_JSON: >-
            {"canonical/runtime/acceptance_proof_transmuter_v1.py":"0580f9819b5465c9617f0a1e8ff9a96902eedfc6","canonical/runtime/opus55_acceptance_calibration_reducer_v2.py":"73b0b27644e0fa0d89ff8fbdb51005c20eae3632","canonical/runtime/opus55_acceptance_residual_compiler_v2.py":"cae5bc3bfda9c77d7d7e5151127f55aafddb9522","canonical/governance/OPUS55_TERMINAL_PROOF_PROTOCOLS_V1.json":"eb4bca0fe6a015d49d2854998fbe046c979c7ea9","canonical/governance/OPUS55_ACCEPTANCE_PROOF_TRANSMUTATION_INPUT_V1.json":"96052a6b5178305b37a2526fb25c3f53fa33b9b5","canonical/capabilities/opus55/OPUS_5_5_USEFUL_CAPABILITY_ENVELOPE_V1.json":"661a57f839101fbf54c7e4edc76166c65ce9327d","canonical/verification/TERMINAL_V3_POSTWAVE_CONTRACT_AND_FAMILY_REDUCTION_20261002_V1.json":"51e3e7578e9adbeee2168d2223b84481fea16a09","canonical/governance/OPUS55_ACCEPTANCE_PREDICATE_REGISTRY_V2.json":"562536d9ba3f245a6bd24490a1eb3b30f27e0c3a","canonical/governance/OPUS55_ACCEPTANCE_PREDICATE_EVIDENCE_BINDINGS_V2.json":"f500b56e7349ce8c0f97cfd0bd1db4888ec6887c","canonical/reasoning/2026-10-02_EXACT_OPUS55_ZERO_COST_COMPARATOR_ROUTE_RECONCILIATION_V1.json":"f67e22cee5e6fce1ebfae92ebf0946f78fafcee1","canonical/governance/OPUS55_PUBLIC_BAR_SCORE_READINESS_MATRIX_V1.json":"4e59e30461c9ff1bee1a9474627d5fb4074844b2"}
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path("capsules/current_opus55_reconciliation_v1")
          expected=json.loads(os.environ["EXPECTED_JSON"])
          for rel,want in sorted(expected.items()):
              data=(root/rel).read_bytes()
              got=hashlib.sha1(b"blob "+str(len(data)).encode()+b"\0"+data).hexdigest()
              assert got==want,(rel,got,want)
          print("EXACT_11_BRAIN_BLOBS_PASS")
          PY

      - name: Independently recompute acceptance and atomic residual
        env:
          PYTHONPATH: capsules/current_opus55_reconciliation_v1
        run: |
          python - <<'PY'
          import copy,json
          from pathlib import Path
          from canonical.runtime.opus55_acceptance_calibration_reducer_v2 import evaluate as calibrate
          from canonical.runtime.opus55_acceptance_residual_compiler_v2 import evaluate as residual

          root=Path("capsules/current_opus55_reconciliation_v1")
          load=lambda p: json.loads((root/p).read_text(encoding="utf-8"))

          envelope=load("canonical/capabilities/opus55/OPUS_5_5_USEFUL_CAPABILITY_ENVELOPE_V1.json")
          protocols=load("canonical/governance/OPUS55_TERMINAL_PROOF_PROTOCOLS_V1.json")
          reduction=load("canonical/verification/TERMINAL_V3_POSTWAVE_CONTRACT_AND_FAMILY_REDUCTION_20261002_V1.json")
          trans=load("canonical/governance/OPUS55_ACCEPTANCE_PROOF_TRANSMUTATION_INPUT_V1.json")

          c=calibrate(envelope,protocols,reduction,trans)
          expected_closed={
              "EXACT_SYMBOLIC_COMPUTATION",
              "LONG_HORIZON_MEMORY_AND_CONTINUITY",
              "TOOL_DISCOVERY_SELECTION_AND_LEARNING",
              "SUBAGENT_DELEGATION_AND_COORDINATION",
          }
          assert c["errors"]==[],c
          assert c["behavioral_pass_family_count"]==19,c
          assert c["acceptance_calibrated_family_count"]==4,c
          assert c["acceptance_pending_family_count"]==15,c
          assert set(c["acceptance_calibrated_families"])==expected_closed,c

          trans_without_delegation=copy.deepcopy(trans)
          trans_without_delegation["evidence"]=[
              e for e in trans_without_delegation["evidence"]
              if e.get("family")!="SUBAGENT_DELEGATION_AND_COORDINATION"
          ]
          c0=calibrate(envelope,protocols,reduction,trans_without_delegation)
          assert c0["acceptance_calibrated_family_count"]==3,c0
          assert c0["acceptance_pending_family_count"]==16,c0

          registry=load("canonical/governance/OPUS55_ACCEPTANCE_PREDICATE_REGISTRY_V2.json")
          evidence=load("canonical/governance/OPUS55_ACCEPTANCE_PREDICATE_EVIDENCE_BINDINGS_V2.json")
          comparator=load("canonical/reasoning/2026-10-02_EXACT_OPUS55_ZERO_COST_COMPARATOR_ROUTE_RECONCILIATION_V1.json")
          readiness=load("canonical/governance/OPUS55_PUBLIC_BAR_SCORE_READINESS_MATRIX_V1.json")

          r=residual(registry,evidence,comparator,readiness)
          assert r["errors"]==[],r
          assert r["receipt_saturation_complete"] is True,r
          assert (r["predicate_count"],r["proved_predicate_count"],r["open_predicate_count"],r["blocked_predicate_count"],r["refuted_predicate_count"])==(38,9,0,29,0),r
          assert r["authorized_actions"]==[],r
          d=next(x for x in r["families"] if x["family"]=="SUBAGENT_DELEGATION_AND_COORDINATION")
          assert d["state"]=="PROVED" and d["proved"]==d["predicate_count"],d

          evidence_without_delegation=copy.deepcopy(evidence)
          evidence_without_delegation["claims"]=[
              x for x in evidence_without_delegation["claims"]
              if x.get("predicate_id")!="DELEGATION_TERMINAL_SUCCESS_NONINFERIOR"
          ]
          r0=residual(registry,evidence_without_delegation,comparator,readiness)
          assert r0["proved_predicate_count"]==8,r0
          assert r0["blocked_predicate_count"]==30,r0

          tb=next(x for x in readiness["rows"] if x["surface"]=="Terminal-Bench 4.0")
          assert tb["maximum_attainable_successes"]==180,tb
          assert tb["attainability_required_successes"]==220,tb
          assert tb["score_producing_route_ready"] is False,tb

          print(json.dumps({
              "status":"INDEPENDENT_RECOMPUTE_PASS",
              "acceptance":{"calibrated":4,"pending":15},
              "atomic":{"proved":9,"open":0,"blocked":29,"total":38},
              "delegation_counterfactual":{"without_witness_calibrated":3,"without_atomic_claim_proved":8},
              "tb4":{"maximum_attainable_successes":180,"required_successes":220,"execution_ready":False},
              "authorized_acceptance_case_actions":0,
              "terminal_goal_achieved":False,
              "capability_credit_delta":0,
              "family_credit_delta":0
          },indent=2,sort_keys=True))
          PY
