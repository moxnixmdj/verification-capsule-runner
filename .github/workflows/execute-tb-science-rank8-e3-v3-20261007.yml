name: Execute TB-Science rank8 E3 V3 one-shot

on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/tb_science_rank8_e3_v3_20261007/ACTIVATE_RANK8_E3_V3.json"

permissions:
  contents: read

concurrency:
  group: tb-science-rank8-e3-v3-one-shot
  cancel-in-progress: false

jobs:
  terminal-slot:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Exact authority, route, carrier, and zero-spend precheck
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$GITHUB_EVENT_NAME" = "pull_request"
          test "$GITHUB_BASE_REF" = "main"
          test "$GITHUB_HEAD_REF" = "activate/tb-science-rank8-e3-v3-20261007"
          test "$GITHUB_REPOSITORY" = "moxnixmdj/verification-capsule-runner"

          C=capsules/tb_science_rank8_e3_v3_20261007
          O="$C/overlay/canonical/runtime"
          R=capsules/tb_science_canary_v3_execution

          test "$(git hash-object "$C/TB_SCIENCE_RANK8_ONE_SLOT_EXECUTION_AUTHORITY_20261007_V3.json")" = "16698c0125075213387e3cd662082d71a68471e3"
          test "$(git hash-object "$C/TB_SCIENCE_CURRENT_SLOT_LEDGER_RECONCILIATION_20261007_V5.json")" = "651a800d1e9f43f15be3447546b2807e1365b42d"
          test "$(git hash-object "$C/ACTION_INTENT_TB_SCIENCE_RANK8_ONE_SHOT_20261007_V3.json")" = "e1c663ccd0090c7d3b3b3e201d1d4e9112496ee1"
          test "$(git hash-object "$C/TB_SCIENCE_RANK8_REACTIVATION_PUBLIC_REPLAY_20261007_V1.json")" = "be73ef34aece4d1f9e5622a006568653ab2f5c5d"

          test "$(git hash-object "$O/harbor_science_agent_v1.py")" = "5bc8ebac26bb7c809d4698f535eff43b667b30df"
          test "$(git hash-object "$O/harbor_science_planner_v1.py")" = "c3e36eba57c450f325c8a9476ee048c841bbdbc8"
          test "$(git hash-object "$O/lossless_raw_task_contract_v1.py")" = "d54d5a2f7efa76b653d288f4f53da4883644baa6"
          test "$(git hash-object "$O/raw_task_acceptance_residual_localizer_v1.py")" = "f29616cf7726959aa28db4ed6541a9fc0bc2ac76"
          test "$(git hash-object "$O/explicit_requirement_index_v2.py")" = "30629b10fdbf3c337eb3252c043ec13123ca66a1"
          test "$(git hash-object "$O/instruction_constraint_compiler_v1.py")" = "a4a3f87f827bd6f0f85fe70c77a1de5aa3237c6f"
          test "$(git hash-object "$O/source_aligned_acceptance_program_v1.py")" = "742c183cccc2ec4bb5f94e88048590e2991dacd4"
          test "$(git hash-object "$O/source_contract_compiler.py")" = "ba53b1f1a3c1d8e63c906eb4952c7e9b6aef1231"
          test "$(git hash-object "$O/typed_acceptance_program_v1.py")" = "7fd2e575bd2d5c36f48c713f15177d5b0d7e68c5"
          test "$(git hash-object "$O/acceptance_capability_source_gate_v2.py")" = "b168b131f6383e158bdc0d931439d14e61f2a5de"

          test "$(git hash-object "$R/canonical/runtime/harbor_command_policy.py")" = "a525773417291c7a4841bf35e1baff5370350d0d"
          test "$(git hash-object "$R/canonical/runtime/harbor_environment_transport.py")" = "ec46f648214a37bb16025d5ef2593efdf59f0d79"
          test "$(git hash-object "$R/canonical/runtime/tb_science_conservative_censoring_reducer_v1.py")" = "3b48ea534d606cf47a8321b56427353066393577"
          test "$(git hash-object "$R/canonical/governance/TB_SCIENCE_TERMINAL_EXECUTION_MANIFEST_V1.json")" = "6dfa880b1f68881531afbba6ca211681801fd19b"

          export EXECUTION_WORKFLOW_BLOB="$(git hash-object .github/workflows/execute-tb-science-rank8-e3-v3-20261007.yml)"
          test -f "$C/ACTIVATE_RANK8_E3_V3.json"

          python - <<'PY'
          import json, os
          C="capsules/tb_science_rank8_e3_v3_20261007"
          auth=json.load(open(C+"/TB_SCIENCE_RANK8_ONE_SLOT_EXECUTION_AUTHORITY_20261007_V3.json"))
          ledger=json.load(open(C+"/TB_SCIENCE_CURRENT_SLOT_LEDGER_RECONCILIATION_20261007_V5.json"))
          intent=json.load(open(C+"/ACTION_INTENT_TB_SCIENCE_RANK8_ONE_SHOT_20261007_V3.json"))
          replay=json.load(open(C+"/TB_SCIENCE_RANK8_REACTIVATION_PUBLIC_REPLAY_20261007_V1.json"))
          activation=json.load(open(C+"/ACTIVATE_RANK8_E3_V3.json"))
          slot="terminal-bench-science/linked-cell-suppression::trial-0"
          digest="sha256:34d92f30b75011c93d55caced3a4a58c6f68a7bebdbb601b36cb6561ef4069c0"
          expected_route={
              "agent":"5bc8ebac26bb7c809d4698f535eff43b667b30df",
              "planner":"c3e36eba57c450f325c8a9476ee048c841bbdbc8",
              "raw_task_contract":"d54d5a2f7efa76b653d288f4f53da4883644baa6",
              "raw_task_localizer":"f29616cf7726959aa28db4ed6541a9fc0bc2ac76",
          }
          assert auth["schema"]=="PROJECT_BRAIN_TB_SCIENCE_RANK8_ONE_SLOT_AUTHORITY_V3"
          assert auth["status"].startswith("ACTIVE__LIVE_PUBLIC_EPOCH_PRECHECK_REQUIRED")
          assert auth["slot"]["id"]==slot and auth["slot"]["digest"]==digest and auth["slot"]["rank"]==8
          assert auth["exact_route"]==expected_route
          assert auth["live_epoch"]["git_blob_sha"]=="f95f513b0ad57b8b3398fcabba44beae6fd805f4"
          assert auth["live_epoch"]["epoch_id"]=="TBSCI-RANK8-20261007-E3"
          assert auth["controls"]["attempts"]==1 and auth["controls"]["retries"]==0
          assert auth["controls"]["replacement_allowed"] is False
          assert auth["controls"]["incremental_spend_usd_max"]==0
          consumed=set(ledger["truth_repair"]["consumed_slots"])
          assert len(consumed)==7 and slot not in consumed
          assert ledger["truth_repair"]["next_untouched_slot"]["slot_id"]==slot
          assert ledger["truth_repair"]["next_untouched_slot"]["task_digest"]==digest
          assert intent["slot"]["id"]==slot and intent["slot"]["digest"]==digest
          assert intent["exact_route"]==expected_route
          assert intent["public_epoch"]["git_blob_sha"]=="f95f513b0ad57b8b3398fcabba44beae6fd805f4"
          assert replay["reactivation_prerequisites"]["rank8_still_unexposed"] is True
          assert replay["accounting"]["incremental_spend_usd"]==0
          assert activation["schema"]=="PROJECT_BRAIN_TB_SCIENCE_RANK8_E3_V3_ACTIVATION"
          assert activation["authorized_slot"]==slot
          assert activation["authority_blob"]=="16698c0125075213387e3cd662082d71a68471e3"
          assert activation["ledger_blob"]=="651a800d1e9f43f15be3447546b2807e1365b42d"
          assert activation["epoch_blob"]=="f95f513b0ad57b8b3398fcabba44beae6fd805f4"
          assert activation["workflow_blob"]==os.environ["EXECUTION_WORKFLOW_BLOB"]
          assert activation["attempts"]==1 and activation["retries"]==0
          assert activation["replacement_allowed"] is False
          assert activation["incremental_spend_usd_max"]==0
          PY

          vis="$(curl -fsSL -H 'Accept: application/vnd.github+json' -H 'User-Agent: project-brain-rank8' "https://api.github.com/repos/$GITHUB_REPOSITORY" | python -c 'import json,sys; print(json.load(sys.stdin)["visibility"])')"
          test "$vis" = "public"
          test "$(nproc)" -ge 4
          awk '/MemTotal/{exit !($2 >= 12000000)}' /proc/meminfo
          df -Pk "$GITHUB_WORKSPACE" | awk 'NR==2{exit !($4 >= 12000000)}'
          docker version >/dev/null
          docker info >/dev/null

      - name: Install exact Harbor
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir -q 'harbor==0.23.0'
          python - <<'PY'
          import importlib.metadata
          assert importlib.metadata.version("harbor")=="0.23.0"
          PY

      - name: Clean-build exact llama.cpp
        run: |
          set -euo pipefail
          rm -rf llama.cpp
          git init llama.cpp
          git -C llama.cpp remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C llama.cpp fetch --depth 1 origin bec4772f6a2527d371557b5d2032641e5ff7619c
          git -C llama.cpp checkout --detach FETCH_HEAD
          test "$(git -C llama.cpp rev-parse HEAD)" = "bec4772f6a2527d371557b5d2032641e5ff7619c"
          cmake -S llama.cpp -B llama.cpp/build -DGGML_CUDA=OFF -DLLAMA_CURL=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build llama.cpp/build -j 2 --target llama-server

      - name: Restore exact Qwen model cache
        uses: actions/cache@v4
        with:
          path: models/Qwen3.5-9B-M-TS-Q4_K_M.gguf
          key: brain-qwen35-9b-f41c0a0c0e43bf721fb2da29374cd1a97271bac0bab08a9dc42964525e82350c

      - name: Acquire and verify exact Qwen model if cache misses
        run: |
          set -euo pipefail
          mkdir -p models
          if [ ! -f models/Qwen3.5-9B-M-TS-Q4_K_M.gguf ]; then
            curl -L --fail --retry 3 --retry-delay 3 --silent --show-error -o models/Qwen3.5-9B-M-TS-Q4_K_M.gguf 'https://huggingface.co/TheStageAI/Qwen3.5-9B-GGUF/resolve/main/Qwen3.5-9B-M-TS-Q4_K_M.gguf?download=true'
          fi
          echo 'f41c0a0c0e43bf721fb2da29374cd1a97271bac0bab08a9dc42964525e82350c  models/Qwen3.5-9B-M-TS-Q4_K_M.gguf' | sha256sum -c -

      - name: Assemble exact current Brain science route
        run: |
          set -euo pipefail
          rm -rf active_route
          cp -a capsules/tb_science_canary_v3_execution active_route
          cp capsules/tb_science_rank8_e3_v3_20261007/overlay/canonical/runtime/*.py active_route/canonical/runtime/
          test "$(git hash-object active_route/canonical/runtime/harbor_science_agent_v1.py)" = "5bc8ebac26bb7c809d4698f535eff43b667b30df"
          test "$(git hash-object active_route/canonical/runtime/harbor_science_planner_v1.py)" = "c3e36eba57c450f325c8a9476ee048c841bbdbc8"
          test "$(git hash-object active_route/canonical/runtime/lossless_raw_task_contract_v1.py)" = "d54d5a2f7efa76b653d288f4f53da4883644baa6"
          test "$(git hash-object active_route/canonical/runtime/raw_task_acceptance_residual_localizer_v1.py)" = "f29616cf7726959aa28db4ed6541a9fc0bc2ac76"

      - name: Start exact local cognition endpoint
        run: |
          set -euo pipefail
          EXTRA=()
          if llama.cpp/build/bin/llama-server --help 2>&1 | grep -q -- '--reasoning'; then EXTRA+=(--reasoning off); fi
          nohup llama.cpp/build/bin/llama-server -m models/Qwen3.5-9B-M-TS-Q4_K_M.gguf --alias brain-qwen3.5-9b --host 127.0.0.1 --port 8080 -c 8192 -t 4 --parallel 1 --jinja --no-webui "${EXTRA[@]}" > LOCAL_QWEN_SERVER.log 2>&1 &
          ok=0
          for i in $(seq 1 240); do
            if curl -fsS http://127.0.0.1:8080/health > LOCAL_QWEN_HEALTH.json 2>/dev/null; then ok=1; break; fi
            sleep 1
          done
          test "$ok" = 1

      - name: Live epoch check then execute exact frozen rank8 slot
        id: execute
        continue-on-error: true
        env:
          TASK_NAME: terminal-bench-science/linked-cell-suppression
          SAFE_ID: linked-cell-suppression-trial-0
        run: |
          set -uo pipefail

          curl -fsSL             -H 'Accept: application/vnd.github+json'             -H 'User-Agent: project-brain-rank8'             'https://api.github.com/repos/moxnixmdj/verification-capsule-runner/contents/capsules/tb_science_rank8_20261007_v1/RANK8_EPOCH_V3.json?ref=main'             > LIVE_RANK8_EPOCH_API.json

          python - <<'PY'
          import base64,json
          obj=json.load(open("LIVE_RANK8_EPOCH_API.json"))
          assert obj["sha"]=="f95f513b0ad57b8b3398fcabba44beae6fd805f4"
          payload=json.loads(base64.b64decode(obj["content"]).decode("utf-8"))
          assert payload["schema"]=="PROJECT_BRAIN_TB_SCIENCE_RANK8_EPOCH_V3"
          assert payload["epoch_id"]=="TBSCI-RANK8-20261007-E3"
          assert payload["status"]=="CURRENT"
          assert payload["slot_id"]=="terminal-bench-science/linked-cell-suppression::trial-0"
          assert payload["task_digest"]=="sha256:34d92f30b75011c93d55caced3a4a58c6f68a7bebdbb601b36cb6561ef4069c0"
          assert payload["attempts"]==1 and payload["retries"]==0
          assert payload["incremental_spend_usd_max"]==0
          PY

          printf '%s\n' "TBSCI-RANK8-20261007-E3" > RANK8_TASK_START.marker
          R="$GITHUB_WORKSPACE/active_route"
          export PYTHONPATH="$R"
          mkdir -p "$GITHUB_WORKSPACE/jobs/$SAFE_ID"
          harbor run -d terminal-bench-science/terminal-bench-science@0.1.0 -i "$TASK_NAME" -a canonical.runtime.harbor_science_agent_v1:HarborScienceAgent -k 1 -n 1 -r 0 --agent-timeout-multiplier 0.60 --environment-build-timeout-multiplier 1.0 --verifier-timeout-multiplier 1.0 --job-name "$SAFE_ID" --jobs-dir "$GITHUB_WORKSPACE/jobs/$SAFE_ID"
          rc=$?
          echo "harbor_exit=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Finalize rank8 receipt without laundering precheck failures
        if: always()
        env:
          SLOT_ID: terminal-bench-science/linked-cell-suppression::trial-0
          TASK_NAME: terminal-bench-science/linked-cell-suppression
          SAFE_ID: linked-cell-suppression-trial-0
          HARBOR_OUTCOME: ${{ steps.execute.outcome }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          started=(root/"RANK8_TASK_START.marker").is_file()
          base=root/"jobs"/os.environ["SAFE_ID"]
          results=[]
          for p in base.rglob("result.json") if base.exists() else []:
              try: obj=json.loads(p.read_text())
              except Exception: continue
              results.append((p,obj))
          scored=[]
          exception_info=[]
          for p,obj in results:
              vr=obj.get("verifier_result")
              if isinstance(vr,dict) and isinstance(vr.get("rewards"),dict):
                  scored.append((p,obj))
              ex=obj.get("exception_info")
              if isinstance(ex,dict):
                  exception_info.append({
                      "path":str(p.relative_to(root)),
                      "exception_type":ex.get("exception_type"),
                      "exception_message":ex.get("exception_message"),
                  })
          reward=None
          errors=[]
          if started:
              if len(scored)==1:
                  _,obj=scored[0]
                  raw=obj["verifier_result"]["rewards"].get("reward")
                  if isinstance(raw,(int,float)) and not isinstance(raw,bool):
                      reward=float(raw)
                  else:
                      errors.append("REWARD_MISSING_OR_NONNUMERIC")
              elif not scored:
                  errors.append("NO_TRIAL_RESULT_WITH_VERIFIER_REWARD")
              else:
                  errors.append("MULTIPLE_TRIAL_RESULTS_WITH_VERIFIER_REWARD")
              success=(reward is not None and reward>=1.0 and not errors)
              status="SUCCESS" if success else "FINAL_ZERO"
              consumed=True
          else:
              status="PRECHECK_ABORTED_NOT_CONSUMED"
              consumed=False
              errors.append("TASK_START_MARKER_ABSENT")
          hashes={}
          for p,_ in results:
              hashes[str(p.relative_to(root))]=hashlib.sha256(p.read_bytes()).hexdigest()
          receipt={
              "schema":"PROJECT_BRAIN_TB_SCIENCE_TERMINAL_SLOT_RECEIPT_RANK8_E3_V3",
              "slot_id":os.environ["SLOT_ID"],
              "task_name":os.environ["TASK_NAME"],
              "public_epoch_id":"TBSCI-RANK8-20261007-E3",
              "public_epoch_blob":"f95f513b0ad57b8b3398fcabba44beae6fd805f4",
              "status":status,
              "reward":reward if reward is not None else 0.0,
              "errors":errors,
              "exception_info":exception_info,
              "harbor_step_outcome":os.environ.get("HARBOR_OUTCOME"),
              "authority_blob":"16698c0125075213387e3cd662082d71a68471e3",
              "ledger_blob":"651a800d1e9f43f15be3447546b2807e1365b42d",
              "agent_blob":"5bc8ebac26bb7c809d4698f535eff43b667b30df",
              "planner_blob":"c3e36eba57c450f325c8a9476ee048c841bbdbc8",
              "raw_task_contract_blob":"d54d5a2f7efa76b653d288f4f53da4883644baa6",
              "raw_task_localizer_blob":"f29616cf7726959aa28db4ed6541a9fc0bc2ac76",
              "github_run_id":os.environ["GITHUB_RUN_ID"],
              "github_run_attempt":os.environ["GITHUB_RUN_ATTEMPT"],
              "github_sha":os.environ["GITHUB_SHA"],
              "result_hashes":hashes,
              "task_start_marker_present":started,
              "execution_authority_consumed":consumed,
              "rerun_credit":False,
              "incremental_spend_usd":0,
              "promotion_authority":False,
          }
          out=root/"linked-cell-suppression-trial-0__SLOT_RECEIPT_RANK8_E3_V3.json"
          out.write_text(json.dumps(receipt,indent=2,sort_keys=True)+"\n")
          print(json.dumps(receipt,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tb-science-linked-cell-suppression-trial-0-rank8-e3-v3
          path: |
            linked-cell-suppression-trial-0__SLOT_RECEIPT_RANK8_E3_V3.json
            jobs/linked-cell-suppression-trial-0/
            LIVE_RANK8_EPOCH_API.json
            RANK8_TASK_START.marker
            LOCAL_QWEN_HEALTH.json
            LOCAL_QWEN_SERVER.log
          if-no-files-found: warn
