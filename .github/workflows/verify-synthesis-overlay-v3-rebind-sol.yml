name: Verify synthesis overlay V3 rebind

on:
  push:
    branches: ["verify/synthesis-overlay-v3-rebind-20261003-sol"]
    paths:
      - ".github/workflows/verify-synthesis-overlay-v3-rebind-sol.yml"
      - "capsules/synthesis_overlay_v3_rebind/brain/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact bytes and lossless V1 to V3 synthesis transport
        run: |
          set -euo pipefail
          ROOT=capsules/synthesis_overlay_v3_rebind/brain
          test "$(git hash-object "$ROOT/canonical/governance/SYNTHESIS_OVERLAY_V3_REBIND_CANDIDATE_V1.json")" = "65c68de4a95ebdfd2ba3649c642748b0f9d8f2c7"
          test "$(git hash-object "$ROOT/canonical/governance/OPUS55_SYNTHESIS_IMPLICATION_RESIDUAL_INPUT_V2.json")" = "4e5b944c86b8745083cc9d97fe186aa4b1322747"
          test "$(git hash-object "$ROOT/canonical/verification/OPUS55_SYNTHESIS_IMPLICATION_RESIDUAL_PUBLIC_RUNNER_VERIFICATION_20261002_V2.json")" = "c9a3046dd5a409379d675051861600919c3017fb"
          test "$(git hash-object "$ROOT/canonical/verification/OPUS55_SYNTHESIS_WITNESS_TARGET_BINDING_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json")" = "64ad40c1c10bd01e4c0f4418fac29efafea838fc"
          test "$(git hash-object "$ROOT/canonical/governance/OPUS55_MATCHED_TARGET_NORMALIZATION_PROVENANCE_V1.json")" = "0910ce3a2351fc439e03a1fa2ae708fb3c6463ef"
          test "$(git hash-object "$ROOT/canonical/governance/OPUS55_MATCHED_TARGET_NORMALIZATION_PROVENANCE_V3.json")" = "72a5cd689f55df84de73693371264f02ef4e7226"
          test "$(git hash-object "$ROOT/canonical/verification/OPUS55_MATCHED_TARGET_NORMALIZATION_V3_PUBLIC_RUNNER_VERIFICATION_20261003_V1.json")" = "b5192b1903dc603e75efe92b9a00ced0b2722f8c"
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("capsules/synthesis_overlay_v3_rebind/brain")
          def load(rel): return json.loads((root/rel).read_text())
          c=load("canonical/governance/SYNTHESIS_OVERLAY_V3_REBIND_CANDIDATE_V1.json")
          r=load("canonical/governance/OPUS55_SYNTHESIS_IMPLICATION_RESIDUAL_INPUT_V2.json")
          rv=load("canonical/verification/OPUS55_SYNTHESIS_IMPLICATION_RESIDUAL_PUBLIC_RUNNER_VERIFICATION_20261002_V2.json")
          wv=load("canonical/verification/OPUS55_SYNTHESIS_WITNESS_TARGET_BINDING_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json")
          o=load("canonical/governance/OPUS55_MATCHED_TARGET_NORMALIZATION_PROVENANCE_V1.json")
          n=load("canonical/governance/OPUS55_MATCHED_TARGET_NORMALIZATION_PROVENANCE_V3.json")
          nv=load("canonical/verification/OPUS55_MATCHED_TARGET_NORMALIZATION_V3_PUBLIC_RUNNER_VERIFICATION_20261003_V1.json")
          pid="SYNTHESIS_MATCHED_QUALITY_COVERAGE_NONINFERIOR"
          assert str(rv["status"]).startswith("INDEPENDENT_PUBLIC_RUNNER_PASS"), rv["status"]
          assert str(wv["status"]).startswith("INDEPENDENT_PUBLIC_RUNNER_PASS"), wv["status"]
          assert str(nv["status"]).startswith("INDEPENDENT_PUBLIC_RUNNER_PASS"), nv["status"]
          old=next(x for x in o["targets"] if x["predicate_id"]==pid)
          new=next(x for x in n["targets"] if x["predicate_id"]==pid)
          keys=("predicate_id","family","atom_sources","metric_requirement_sources")
          assert {k:old[k] for k in keys} == {k:new[k] for k in keys}, (old,new)
          assert rv["result"]["proved_atom_count"]==7
          assert rv["result"]["missing_scope_relation"] is True
          assert rv["result"]["missing_atoms"]==["metric:matched_quality"]
          assert rv["result"]["missing_metric_bounds"]==["matched_quality_noninferiority","required_claim_coverage_noninferiority"]
          assert rv["result"]["implies_target"] is False
          p=c["preserved_if_transport_verified"]
          assert p["proved_atom_count"]==rv["result"]["proved_atom_count"]
          assert p["missing_scope_relation"]==rv["result"]["missing_scope_relation"]
          assert p["missing_atoms"]==rv["result"]["missing_atoms"]
          assert p["missing_metric_bounds"]==rv["result"]["missing_metric_bounds"]
          assert p["implies_target"] is False
          assert r["expected_residual"]["missing_scope_relation"] is True
          assert r["expected_residual"]["missing_atoms"]==["metric:matched_quality"]
          assert r["expected_residual"]["missing_metric_bounds"]==["matched_quality_noninferiority","required_claim_coverage_noninferiority"]
          assert c["acceptance_credit_delta"]==0 and c["family_credit_delta"]==0
          assert c["fresh_reality_authority"] is False
          print("SYNTHESIS_OVERLAY_V3_REBIND_PASS")
          PY
