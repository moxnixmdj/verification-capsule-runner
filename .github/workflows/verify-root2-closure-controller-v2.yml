name: Verify Root2 Closure Controller V2
on:
  pull_request:
    paths:
      - 'subject/**'
      - 'verify_root2_closure_controller_v2.py'
      - '.github/workflows/verify-root2-closure-controller-v2.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python verify_root2_closure_controller_v2.py
