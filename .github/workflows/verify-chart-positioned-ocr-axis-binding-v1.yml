name: Verify Chartography Brain-native positioned OCR axis binding V1

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/verify-chart-positioned-ocr-axis-binding-v1.yml"
      - "canonical/runtime/bound_capabilities/chart_positioned_ocr_axis_binding_v1.py"
      - "canonical/runtime/bound_capabilities/image_ocr_tesseract_positioned.py"
      - "canonical/runtime/bound_capabilities/image_ocr_tesseract.py"
      - "canonical/runtime/bound_capabilities/chart_raster_scene_graph_v1.py"
      - "canonical/tests/test_chart_positioned_ocr_axis_binding_v1.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Bind exact Brain blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object canonical/runtime/bound_capabilities/chart_positioned_ocr_axis_binding_v1.py)" = "1ccab094a14ae261a01912ad6e573ffc09fa8b35"
          test "$(git hash-object canonical/tests/test_chart_positioned_ocr_axis_binding_v1.py)" = "f3d7655c1912ded1ef172dcaaa75a3684e9dd729"
          test "$(git hash-object canonical/runtime/bound_capabilities/image_ocr_tesseract_positioned.py)" = "19f3087489ce7f6f935fc7baaebdc8cd672f4b62"
          test "$(git hash-object canonical/runtime/bound_capabilities/image_ocr_tesseract.py)" = "45714d7a0160802d986042910da1c4c6462676e5"
          test "$(git hash-object canonical/runtime/bound_capabilities/chart_raster_scene_graph_v1.py)" = "258999b07287287db2037af777973d5bbb39116d"
          echo EXACT_BRAIN_BLOBS_BOUND
      - name: Install focused dependency
        run: python -m pip install --disable-pip-version-check --no-input "pillow>=10,<13"
      - name: Compile exact capability bytes
        run: |
          python -m py_compile canonical/runtime/bound_capabilities/chart_positioned_ocr_axis_binding_v1.py
          python -m py_compile canonical/runtime/bound_capabilities/image_ocr_tesseract_positioned.py
          python -m py_compile canonical/runtime/bound_capabilities/image_ocr_tesseract.py
          python -m py_compile canonical/runtime/bound_capabilities/chart_raster_scene_graph_v1.py
      - name: Focused independent tests
        run: python -m unittest -v canonical.tests.test_chart_positioned_ocr_axis_binding_v1
      - name: Ownership and nonclaim invariants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib
          p=pathlib.Path("canonical/runtime/bound_capabilities/chart_positioned_ocr_axis_binding_v1.py").read_text()
          required=[
            '"cognition_dependency_class": "MODEL_INDEPENDENT"',
            '"general_purpose_model_dependency_count": 0',
            '"external_general_purpose_model_runtime_dependency_count": 0',
            '"donor_general_purpose_model_runtime_dependency_count": 0',
            '"benchmark_score_authority": False',
            '"NO_GENERAL_CHARTOGRAPHY_SCORE_CREDIT"',
          ]
          missing=[x for x in required if x not in p]
          if missing: raise SystemExit("MISSING_INVARIANTS:"+repr(missing))
          forbidden=["Qwen","MiniCPM","Claude","Gemini","openai","anthropic"]
          found=[x for x in forbidden if x.lower() in p.lower()]
          if found: raise SystemExit("GENERAL_PURPOSE_MODEL_REFERENCE_IN_PRODUCER:"+repr(found))
          print("PASS_ZERO_MODEL_BRAIN_CREDIT_INVARIANTS")
          PY
      - name: Emit verification receipt
        if: success()
        shell: bash
        run: |
          mkdir -p out
          python - <<'PY'
          import json,pathlib,subprocess
          files={
            "runtime":"canonical/runtime/bound_capabilities/chart_positioned_ocr_axis_binding_v1.py",
            "tests":"canonical/tests/test_chart_positioned_ocr_axis_binding_v1.py",
            "positioned_ocr":"canonical/runtime/bound_capabilities/image_ocr_tesseract_positioned.py",
            "base_ocr":"canonical/runtime/bound_capabilities/image_ocr_tesseract.py",
            "scene_graph":"canonical/runtime/bound_capabilities/chart_raster_scene_graph_v1.py",
          }
          receipt={
            "schema":"PROJECT_BRAIN_CHART_POSITIONED_OCR_AXIS_BINDING_PUBLIC_VERIFY_V1",
            "status":"PASS__EXACT_BRAIN_BLOBS__FOCUSED_INDEPENDENT_TESTS",
            "brain_repository":"moxnixmdj/brain",
            "brain_pr":4598,
            "brain_head_commit":"28e8a5b080e64bac02281e81f0337453f24cab0e",
            "blobs":{k:subprocess.check_output(["git","hash-object",v],text=True).strip() for k,v in files.items()},
            "focused_test_count":5,
            "heldout_chartography_cases_consumed":0,
            "external_general_purpose_model_runtime_dependency_count":0,
            "donor_general_purpose_model_runtime_dependency_count":0,
            "incremental_spend_usd":0,
            "benchmark_score_credit_delta":0,
            "terminal_credit_delta":0,
            "hard_nonclaims":["NO_CHARTOGRAPHY_GE_89_SCORE","NO_GENERAL_CHART_SEMANTIC_AUTHORITY","NO_HELDOUT_COVERAGE_CLAIM"]
          }
          pathlib.Path("out/receipt.json").write_text(json.dumps(receipt,indent=2,sort_keys=True)+"\n")
          print(json.dumps(receipt,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chart-positioned-ocr-axis-binding-v1-verification
          path: out/receipt.json
          if-no-files-found: warn
