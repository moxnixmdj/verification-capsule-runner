name: Execute TB-Science rank7 one-shot

on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/tb_science_rank7_20261007_v1/ACTIVATE_RANK7_PR.json"

permissions:
  contents: read

concurrency:
  group: tb-science-rank7-one-shot
  cancel-in-progress: true

jobs:
  stale-rank7-cancel-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse consumed rank7 execution
        run: |
          echo "Rank7 is already irreversibly consumed in canonical Brain main."
          echo "This run exists only to cancel any stale in-progress rank7 execution sharing the concurrency group."
          exit 0
