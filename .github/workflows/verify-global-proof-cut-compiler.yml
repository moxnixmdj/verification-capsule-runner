name: Verify frozen-universe global proof cut compiler
on:
  pull_request:
    branches: [main]
    paths:
      - 'independent/global_proof_cut_compiler.py'
      - 'test_global_proof_cut_compiler.py'
      - '.github/workflows/verify-global-proof-cut-compiler.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m py_compile independent/global_proof_cut_compiler.py
      - run: PYTHONPATH=independent python -m unittest -v test_global_proof_cut_compiler.py
