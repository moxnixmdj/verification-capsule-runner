name: Guarded Brain PR511 Query Focus Qualification
on:
  pull_request:
    branches: [main]
    types: [opened]
permissions:
  contents: write
jobs:
  qualify:
    if: github.head_ref == 'qualify/brain-pr511-query-focus-20260930-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Prestart exact candidate byte lock
        run: |
          set -euo pipefail
          test "$(git hash-object canonical/runtime/bound_capabilities/open_web_source_candidate_discovery.py)" = "a3ae22718c82569fdc954f979cb347189d6edfcd"
          test "$(git hash-object canonical/tests/test_open_web_source_candidate_discovery.py)" = "d93e1c3a4b689884a10c474d049bd1e4aad830a2"
          test "$(git hash-object pr511_query_focus_authority.json)" = "ee9bf174610d94bed1fd3c70293e1a4db160acec"
          test "$(git hash-object verify_brain_pr511_query_focus.py)" = "6fc007d25beff20f62a0508b28e1a837266d185f"
          python -m py_compile canonical/runtime/bound_capabilities/open_web_source_candidate_discovery.py verify_brain_pr511_query_focus.py
      - name: Generate guarded qualification plan
        run: python generate_brain_pr511_query_focus_plan.py
      - name: Atomically admit exact-byte qualification
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python execution_guard/github_actions_guarded_run_live.py --plan brain_pr511_query_focus_plan.json --receipt brain-pr511-query-focus-guard-receipt.json
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: brain-pr511-query-focus-qualification
          path: |
            brain-pr511-query-focus-guard-receipt.json
            pr511-independent-query-focus-report.json
            brain_pr511_query_focus_plan.json
          if-no-files-found: warn
