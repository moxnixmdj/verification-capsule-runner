name: Verify LiveBench Shadow V2 root projection
on:
  pull_request:
    paths:
      - 'subject/livebench_shadow_v2_root_projection_20261004_sol/**'
      - 'verify_livebench_shadow_v2_root_projection_20261004_sol.py'
      - '.github/workflows/verify-livebench-shadow-v2-root-projection-20261004-sol.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python verify_livebench_shadow_v2_root_projection_20261004_sol.py
