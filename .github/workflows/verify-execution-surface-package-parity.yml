name: Verify execution-surface package parity
on:
  pull_request:
    branches: [main]
    paths:
      - 'verification/execution_surface_package_parity.py'
      - 'verification/test_execution_surface_package_parity.py'
      - '.github/workflows/verify-execution-surface-package-parity.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: cd verification && python -m unittest -v test_execution_surface_package_parity.py
