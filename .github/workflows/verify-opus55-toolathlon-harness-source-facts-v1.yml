name: Verify Opus55 Toolathlon harness comparability source facts
on:
  push:
    branches: ["verify-opus55-toolathlon-harness-comparability-cut-20261003"]
    paths:
      - "verify_opus55_toolathlon_harness_source_facts_v1.py"
      - ".github/workflows/verify-opus55-toolathlon-harness-source-facts-v1.yml"
  pull_request:
    branches: [main]
    paths:
      - "verify_opus55_toolathlon_harness_source_facts_v1.py"
      - ".github/workflows/verify-opus55-toolathlon-harness-source-facts-v1.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check --quiet pypdf==6.1.1
      - run: python verify_opus55_toolathlon_harness_source_facts_v1.py
      - name: Enforce fail-closed comparison boundary
        run: |
          python - <<'PY'
          import json
          j=json.load(open("OPUS55_TOOLATHLON_HARNESS_SOURCE_FACTS_V1.json"))
          f=j["facts"]
          assert f["source_calls_results_internal_harness"] is True
          assert f["source_discloses_environment_specific_setup_patches"] is True
          assert f["source_discloses_container_image_pinning"] is True
          assert f["source_discloses_public_vs_internal_score_shift_for_reference_models"] is True
          assert f["source_claims_exact_harness_identity"] is False
          assert j["deduction_boundary"]["first_party_source_proves_exact_internal_vs_public_harness_byte_identity"] is False
          assert j["deduction_boundary"]["first_party_source_supports_treating_77_8_as_same_harness_public_service_score_without_additional_proof"] is False
          assert j["family_credit_delta"]==0
          print("FAIL_CLOSED_HARNESS_COMPARABILITY_CUT_PASS")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: opus55-toolathlon-harness-source-facts-v1
          path: OPUS55_TOOLATHLON_HARNESS_SOURCE_FACTS_V1.json
