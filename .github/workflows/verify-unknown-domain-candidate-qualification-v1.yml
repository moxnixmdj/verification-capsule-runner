name: Verify Unknown-Domain candidate qualification V1

on:
  pull_request:
    paths:
      - 'canonical/runtime/unknown_domain_direct_candidate_v1.py'
      - 'canonical/tests/test_unknown_domain_direct_candidate_v1.py'
      - 'canonical/governance/UNKNOWN_DOMAIN_DIRECT_CANDIDATE_QUALIFICATION_V1.json'
      - 'verify_unknown_domain_candidate_qualification_v1.py'
      - '.github/workflows/verify-unknown-domain-candidate-qualification-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact-byte and fresh-beacon qualification
        run: python verify_unknown_domain_candidate_qualification_v1.py
