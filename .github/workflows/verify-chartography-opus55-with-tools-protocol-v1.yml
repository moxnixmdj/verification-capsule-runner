name: Verify Chartography Opus55 with-tools protocol V1
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/chartography_opus55_with_tools_protocol_v1/**"
      - ".github/workflows/verify-chartography-opus55-with-tools-protocol-v1.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check --quiet "pypdf==6.1.1"
      - run: |
          cd capsules/chartography_opus55_with_tools_protocol_v1
          python verify.py
