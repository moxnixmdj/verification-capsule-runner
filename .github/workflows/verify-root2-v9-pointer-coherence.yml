name: Verify Root2 V9 pointer coherence
on:
  push:
    branches:
      - verify/root2-v9-pointer-coherence-20261004
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact subject blobs
        run: |
          test "$(git hash-object verification_inputs/v9_root_state.json)" = "56c423d11e830a8add5b175f1aae499214a49d54"
          test "$(git hash-object verification_inputs/v9_measurement_bridge.json)" = "dacba225a0cdda7d0eecddc1125fb65acab65d5b"
          test "$(git hash-object verification_inputs/v9_terminal_authority.json)" = "6a5ff4b903cb45f58eb58c59b8cfd85e5cf8fb8e"
          test "$(git hash-object verification_inputs/v9_frontier.json)" = "5894eb38bdb72e922bed2d1e54f16a38a7adec11"
          test "$(git hash-object verification_inputs/v9_activation.json)" = "5e786f3eeab6c11782bd7529d0e8c75560777f81"
          test "$(git hash-object verification_inputs/v9_verification.json)" = "eceaf7cec5906558b2672b9ff6240551c8822f07"
      - name: Verify pointer coherence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          load=lambda p: json.loads(Path(p).read_text())
          root=load("verification_inputs/v9_root_state.json")
          bridge=load("verification_inputs/v9_measurement_bridge.json")
          terminal=load("verification_inputs/v9_terminal_authority.json")
          v9=load("verification_inputs/v9_frontier.json")
          act=load("verification_inputs/v9_activation.json")
          ver=load("verification_inputs/v9_verification.json")
          F="canonical/governance/ROOT2_CLOSURE_V2_CURRENT_FRONTIER_V9.json"; FS="5894eb38bdb72e922bed2d1e54f16a38a7adec11"
          V="canonical/verification/ROOT2_V9_OMC_PROJECTION_PUBLIC_RUNNER_VERIFICATION_20261004_V1.json"; VS="eceaf7cec5906558b2672b9ff6240551c8822f07"
          A="canonical/governance/ROOT2_FRONTIER_V9_ACTIVATION_V1.json"; AS="5e786f3eeab6c11782bd7529d0e8c75560777f81"
          rc=root["roots"]["root_2_measurement_or_comparator"]["active_closure_controller"]
          assert (rc["current_frontier_path"],rc["current_frontier_git_blob_sha"])==(F,FS)
          assert (rc["current_frontier_verification_path"],rc["current_frontier_verification_git_blob_sha"])==(V,VS)
          assert (rc["current_frontier_activation_path"],rc["current_frontier_activation_git_blob_sha"])==(A,AS)
          bc=bridge["root2_closure_controller_v2"]
          assert (bc["frontier_path"],bc["frontier_git_blob_sha"])==(F,FS)
          assert (bc["frontier_verification_path"],bc["frontier_verification_git_blob_sha"])==(V,VS)
          assert (bc["frontier_activation_path"],bc["frontier_activation_git_blob_sha"])==(A,AS)
          tc=terminal["sources"]["root2_closure_v2_current_frontier"]
          assert (tc["path"],tc["git_blob_sha"])==(F,FS)
          assert (tc["verification"],tc["verification_git_blob_sha"])==(V,VS)
          assert (tc["activation"],tc["activation_git_blob_sha"])==(A,AS)
          assert act["frontier"]["git_blob_sha"]==FS and act["verification"]["git_blob_sha"]==VS
          assert ver["subject"]["git_blob_sha"]==FS
          assert v9["exact_state"]["accepted_families"]==5
          assert v9["exact_state"]["proved_atomic"]==12
          assert v9["exact_state"]["unresolved_atomic"]==26
          assert v9["execution_authority"] is False and v9["promotion_authority"] is False and v9["fresh_reality_authority"] is False
          print("ROOT2_V9_POINTER_COHERENCE: PASS")
          PY
