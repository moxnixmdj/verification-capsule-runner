name: Verify PR296 Typed Scalar SymPy

on:
  push:
    branches:
      - verify/typed-scalar-expression-sympy-20260930-v1

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify exact PR298 candidate bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object canonical/runtime/BOUND_CAPABILITY_REGISTRY_V1.json)" = "23f7b79fca15593eb563bdcdba17c8b972f006db"
          test "$(git hash-object canonical/runtime/bound_capabilities/numeric_expression_sympy.py)" = "443e3386f11156e55635556b6e8f8ad7d7733592"
          test "$(git hash-object canonical/runtime/goal_compiler.py)" = "4d7f94219893400344a258552e1d808b2dc963dd"
          test "$(git hash-object canonical/tests/test_numeric_expression_sympy_binding.py)" = "12ff8c9feb266f9253cea13a8d7ce34f14cb5841"
      - name: Run compiler and safety regressions
        run: python canonical/tests/test_numeric_expression_sympy_binding.py
      - name: Run fresh non-astronomy qualification and independent oracle
        run: python verify_typed_scalar_expression_sympy.py
      - name: Upload qualification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr296-typed-scalar-expression-qualification
          path: typed-scalar-expression-qualification.json
          if-no-files-found: error
