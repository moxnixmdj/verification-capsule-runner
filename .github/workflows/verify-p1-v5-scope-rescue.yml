name: Verify P1 V5 scope rescue

on:
  pull_request:
    paths:
      - "canonical/runtime/trajectory_failure_typed_ir_candidate_v5.py"
      - "canonical/runtime/trajectory_failure_typed_ir_proof_v5.py"
      - "canonical/tests/test_trajectory_failure_typed_ir_v5.py"
      - "canonical/governance/P1_TYPED_TRAJECTORY_V5_SCOPE_RESCUE_CANDIDATE_V1.json"
      - ".github/workflows/verify-p1-v5-scope-rescue.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact Brain blob identities
        shell: bash
        run: |
          test "$(git hash-object canonical/runtime/trajectory_failure_typed_ir_candidate_v5.py)" = "aabac3cc36684862f5fb2388a9a281daa30c24a6"
          test "$(git hash-object canonical/runtime/trajectory_failure_typed_ir_proof_v5.py)" = "bfc0421bd39796d0e0a7434e475fd1d0d7f17774"
          test "$(git hash-object canonical/tests/test_trajectory_failure_typed_ir_v5.py)" = "7ad1c7fc2e7e5a083501ce8b9034899bce581ee4"
          test "$(git hash-object canonical/governance/P1_TYPED_TRAJECTORY_V5_SCOPE_RESCUE_CANDIDATE_V1.json)" = "f1d82765760e5ffe8a016e1fc6e943a9467bfc64"
      - name: Run adversarial V5 tests
        run: python -m unittest canonical.tests.test_trajectory_failure_typed_ir_v5 -v
      - name: Independently recompute scope and rescue matrix
        run: |
          python - <<'PY'
          import inspect
          from canonical.runtime import trajectory_failure_typed_ir_candidate_v5 as c
          from canonical.runtime import trajectory_failure_typed_ir_proof_v5 as p

          cases = p.suite_cases()
          assert len(cases) == 192
          rescue = 0
          delayed_rescue = 0
          interaction_rescue = 0
          scope_primary = 0
          scope_delayed = 0
          scope_interaction = 0

          for case in cases:
              public = p.public_task(case)
              assert "_oracle" not in public
              out = c.solve(public)
              verdict = p.score_case(case, out)
              assert verdict["pass"], (case["seed"], case["_oracle"], out, verdict)
              pattern = case["_oracle"]["status"]
              primary_kind = case["_oracle"]["mechanisms"][case["_oracle"]["roots"][0]][0]
              if primary_kind == "SCOPE":
                  scope_primary += 1
                  if pattern == "IDENTIFIED" and len(case["task"]["trajectory"]) == 6:
                      scope_delayed += 1
                  if pattern == "INTERACTION":
                      scope_interaction += 1
              if pattern != "AMBIGUOUS":
                  assert verdict["post_intervention_terminal_rescue"] is True
                  rescue += 1
                  if pattern == "IDENTIFIED" and len(case["task"]["trajectory"]) == 6:
                      delayed_rescue += 1
                  if pattern == "INTERACTION":
                      assert verdict["interaction_strict_subsets_rejected"] is True
                      interaction_rescue += 1

          src = inspect.getsource(c)
          assert "_oracle" not in src
          assert "trajectory_failure_typed_ir_proof_v5" not in src
          assert "SCOPE" in c.ALLOWED_KINDS
          assert set(p.KINDS) == set(c.ALLOWED_KINDS)
          assert rescue == 144
          assert interaction_rescue == 48
          assert scope_primary == 24
          assert scope_delayed == 6
          assert scope_interaction == 6
          print({
              "case_count": len(cases),
              "machine_checked_rescues": rescue,
              "interaction_joint_rescues": interaction_rescue,
              "primary_scope_cases": scope_primary,
              "scope_delayed_cases": scope_delayed,
              "scope_interaction_cases": scope_interaction,
          })
          PY
