name: Verify rank24 Stage-B contract
on:
  pull_request:
    branches: [main]
    paths:
      - 'verification/rank24_stage_b/**'
      - '.github/workflows/verify-rank24-stage-b.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Verify exact mirrored Brain blobs and run fail-closed tests
        working-directory: verification/rank24_stage_b
        run: |
          python - <<'PY'
          import hashlib, pathlib
          expected = {
            "canonical/runtime/rs_archive_clone_stage_b_verifier_v1.py":"a17df2ac6faf48b2fa2fb019248e2ec19b7e8c2e",
            "canonical/tests/test_rs_archive_clone_stage_b_verifier_v1.py":"737c3d769ec6569ffcdd19f52f04d65ffcd680e7",
            "canonical/capabilities/opus55/RS_ARCHIVE_CLONE_RANK24_STAGE_B_CONTRACT_V1.json":"bf2188ca2d91de7fcac73a25bfc61b79e4474419",
            "canonical/capabilities/opus55/RS_ARCHIVE_CLONE_RANK24_STAGE_B_SOURCE_ACCOUNTING_V1.json":"509c20394ba731d94c54ce4169a1fbad1cf4e051",
            "canonical/capabilities/opus55/RS_ARCHIVE_CLONE_RANK24_CONTAMINATION_LEDGER_V1.json":"a686f406eac1d9f6e55007705c4c7adfacb035fd",
            "canonical/capabilities/opus55/RS_ARCHIVE_CLONE_RANK24_STAGE_A_ADMISSION_V1.json":"3998009402a4a1eaa9bc51fe9501d6e8671759c3",
            "canonical/governance/LEASE_RS_ARCHIVE_CLONE_TB4_STAGE_B_EXPOSURE_20261002_V1.json":"c8e6a1cb39c53ef2d99e56c47e7dc7a11ee0f837",
          }
          for p, want in expected.items():
              data=pathlib.Path(p).read_bytes()
              got=hashlib.sha1(b"blob "+str(len(data)).encode()+b"\0"+data).hexdigest()
              assert got==want,(p,got,want)
          PY
          python -m pytest -q canonical/tests/test_rs_archive_clone_stage_b_verifier_v1.py
