name: Verify Research T3 objective binding
on:
  pull_request:
    branches: [main]
    paths:
      - 'capsules/research_t3_objective_v1/**'
      - '.github/workflows/verify-research-t3-objective-binding-v1.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify Research T3 objective binding
        working-directory: capsules/research_t3_objective_v1
        run: |
          PYTHONPATH=. python -m unittest -v canonical.tests.test_research_t3_objective_binding_validator
          PYTHONPATH=. python canonical/runtime/research_t3_objective_binding_validator.py .
