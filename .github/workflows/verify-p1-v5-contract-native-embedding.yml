name: Verify P1 V5 contract-native population embedding
on:
  pull_request:
    paths:
      - "capsules/p1_v5_contract_native_embedding_v1/**"
      - ".github/workflows/verify-p1-v5-contract-native-embedding.yml"
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact Brain P1 V5 embedding blobs and relation claims
        run: python capsules/p1_v5_contract_native_embedding_v1/verify.py
