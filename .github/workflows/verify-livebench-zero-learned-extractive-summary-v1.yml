name: Verify LiveBench zero-learned extractive summary V1

on:
  pull_request:
    branches: [main]
    paths:
      - 'subject/canonical/governance/LIVEBENCH_ZERO_LEARNED_EXTRACTIVE_SUMMARY_PREEXPOSURE_V1.json'
      - 'subject/canonical/governance/LIVEBENCH_ZERO_LEARNED_EXTRACTIVE_SUMMARY_CANDIDATE_V1.json'
      - 'subject/canonical/runtime/zero_learned_extractive_summary_v1.py'
      - 'subject/canonical/tests/test_zero_learned_extractive_summary_v1.py'
      - 'verify_livebench_zero_learned_extractive_summary_v1.py'
      - '.github/workflows/verify-livebench-zero-learned-extractive-summary-v1.yml'
  push:
    branches:
      - verify/livebench-zero-learned-extractive-summary-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact copied subject tests
        working-directory: subject
        run: python -m unittest canonical.tests.test_zero_learned_extractive_summary_v1 -v
      - name: Run independent fresh challenges and blob checks
        run: python verify_livebench_zero_learned_extractive_summary_v1.py
      - name: Upload verification result
        uses: actions/upload-artifact@v4
        with:
          name: livebench-zero-learned-extractive-summary-v1
          path: verification_result.json
