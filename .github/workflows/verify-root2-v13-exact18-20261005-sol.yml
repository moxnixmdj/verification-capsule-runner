name: Verify Root2 V13 exact18 20261005
on:
  pull_request:
    paths:
      - 'subject/root2_v13_exact18_20261005_sol/**'
      - 'verify_root2_v13_exact18_20261005_sol.py'
      - '.github/workflows/verify-root2-v13-exact18-20261005-sol.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python verify_root2_v13_exact18_20261005_sol.py
