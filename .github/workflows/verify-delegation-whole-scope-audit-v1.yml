name: Verify delegation whole-scope audit v1
on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/governance/TASK_TO_DELEGATION_WHOLE_SCOPE_AUDIT_V1.json'
      - 'canonical/tests/test_task_to_delegation_whole_scope_audit_v1.py'
      - 'canonical/governance/BEHAVIORAL_CONTRACT_REGISTRY_V1.json'
      - 'canonical/runtime/delegation_dynamic_reassignment_proof.py'
      - '.github/workflows/verify-delegation-whole-scope-audit-v1.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Bind exact Brain blobs
        run: |
          test "$(git hash-object canonical/governance/TASK_TO_DELEGATION_WHOLE_SCOPE_AUDIT_V1.json)" = "1e7d62f1e1e87346211720b81d8e3ea2e1558cfb"
          test "$(git hash-object canonical/tests/test_task_to_delegation_whole_scope_audit_v1.py)" = "c373d0495922ec837d4af44038d9d98416e90621"
          test "$(git hash-object canonical/governance/BEHAVIORAL_CONTRACT_REGISTRY_V1.json)" = "771a50d2b12f36c953903e0ec4cbe4a95cd24f84"
          test "$(git hash-object canonical/runtime/delegation_dynamic_reassignment_proof.py)" = "22c895badc21dc7a3a226117ff45a8418c58dd53"
      - name: Run delegation whole-scope audit tests
        run: PYTHONPATH=. python3 -m unittest -v canonical.tests.test_task_to_delegation_whole_scope_audit_v1
