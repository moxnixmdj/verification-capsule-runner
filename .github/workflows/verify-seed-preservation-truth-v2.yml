name: Verify seed preservation truth V2
on:
  pull_request:
    branches: [main]
    paths:
      - "subject/seed_preservation_truth_v2/**"
      - "verify_seed_preservation_truth_v2.py"
      - ".github/workflows/verify-seed-preservation-truth-v2.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python verify_seed_preservation_truth_v2.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seed-preservation-truth-v2-receipt
          path: seed_preservation_truth_v2_receipt.json
          if-no-files-found: error
