name: Verify terminal scheduling V12 post-dual V4

on:
  push:
    branches: ["verify/scheduling-v12-post-dual-v4-20261003-sol"]
    paths:
      - ".github/workflows/verify-terminal-scheduling-v12-post-dual-v4.yml"
      - "capsules/terminal_scheduling_v12_post_dual_v4/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/verify-terminal-scheduling-v12-post-dual-v4.yml"
      - "capsules/terminal_scheduling_v12_post_dual_v4/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify V12 post-dual V4 scheduling
        working-directory: capsules/terminal_scheduling_v12_post_dual_v4
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m canonical.runtime.verify_terminal_scheduling_v12_candidate_v1 > /tmp/v12.json
          python - <<'PY'
          import json
          x=json.load(open("/tmp/v12.json"))
          assert x["pass"] is True, x
          assert x["active_zero_reality_requirements"] == 17
          assert x["active_nondominated_certificates"] == 14
          assert x["zero_reality_covered_predicates"] == 25
          assert x["primitive_zero_reality_work_units"] == 31
          assert x["tool_discovery_retrieval_authority"] == "V4_OVER_VERIFIED_V3_OVER_VERIFIED_V2_BASE"
          assert x["fresh_reality_authority"] is False
          print("TERMINAL_SCHEDULING_V12_POST_DUAL_V4_PASS")
          PY
          PYTHONPATH=. python - <<'PY'
          from canonical.tests.test_terminal_scheduling_v12_candidate_v1 import test_v12_exact_current_world
          test_v12_exact_current_world()
          print("TERMINAL_SCHEDULING_V12_TEST_PASS")
          PY
