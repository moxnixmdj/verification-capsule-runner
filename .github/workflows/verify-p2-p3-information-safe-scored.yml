name: Verify P2 P3 information-safe scored grid
on:
  pull_request:
    branches: [main]
    paths:
      - canonical/runtime/p2_p3_information_safe_proof_suites_v2.py
      - canonical/runtime/p2_p3_information_safe_candidate_v2.py
      - canonical/tests/test_p2_p3_information_safe_proof_v2.py
      - .github/workflows/verify-p2-p3-information-safe-scored.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: PYTHONPATH=. python -m unittest -v canonical.tests.test_p2_p3_information_safe_proof_v2
      - name: Run fresh scored grid
        env:
          PROJECT_BRAIN_PREFLIGHT_SEED: ${{ github.run_id }}
        run: |
          PYTHONPATH=. python - <<'PY'
          import json, os
          from canonical.runtime import p2_p3_information_safe_proof_suites_v2 as s
          from canonical.runtime import p2_p3_information_safe_candidate_v2 as c
          base=int(os.environ["PROJECT_BRAIN_PREFLIGHT_SEED"])
          rows=[]
          for contract in s.CONTRACTS:
              ok=0; total=0; reasons={}
              for difficulty in range(1,6):
                  for i in range(40):
                      seed=base ^ (difficulty<<20) ^ (i<<4) ^ (0 if contract==s.P2 else 7)
                      case=s.generate_case(contract,seed,difficulty)
                      out=c.solve(s.public_task(case))
                      v=s.score_case(case,out)
                      total+=1; ok+=int(v.get("pass") is True)
                      reasons[v.get("reason","?")]=reasons.get(v.get("reason","?"),0)+1
              rows.append({"contract":contract,"pass":ok,"total":total,"reasons":reasons})
          result={"rows":rows,"all_pass":all(x["pass"]==x["total"] for x in rows)}
          print("PROJECT_BRAIN_P2_P3_SCORED_RESULT "+json.dumps(result,sort_keys=True))
          if not result["all_pass"]: raise SystemExit(1)
          PY
