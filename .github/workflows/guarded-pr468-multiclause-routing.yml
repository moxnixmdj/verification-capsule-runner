name: Guarded Qualify Brain PR468 Multi-Clause Routing

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  qualify:
    if: github.head_ref == 'qualify/pr468-multiclause-routing-20260930-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Atomically admit and qualify exact PR468 bytes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python execution_guard/github_actions_guarded_run_live.py --plan guarded_pr468_multiclause_routing_plan.json --receipt guarded-pr468-multiclause-routing-admission.json
      - name: Preserve guarded qualification receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: guarded-pr468-multiclause-routing
          path: |
            guarded-pr468-multiclause-routing-admission.json
            guarded_pr468_multiclause_routing_plan.json
            verify_pr468_multiclause_broad_routing.py
          if-no-files-found: warn
