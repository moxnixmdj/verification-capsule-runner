name: Qualify Canonical Mission Path PyPI Canary

on:
  pull_request:
    branches: [main]
    types: [opened]

permissions:
  contents: read

jobs:
  qualify:
    if: github.head_ref == 'qualify/canonical-mission-path-canary-20260930-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ASTRA_DISABLE_MODEL_PLANNER: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Execute frozen non-parent canary once
        id: canary
        continue-on-error: true
        run: python run_canonical_mission_path_pypi_canary.py
      - name: Upload terminal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-mission-path-pypi-canary-terminal
          path: canonical-mission-path-pypi-canary-terminal.json
          if-no-files-found: error
      - name: Preserve semantic failure
        if: steps.canary.outcome != 'success'
        run: exit 1
