name: verify-arena-public-semantics-truth-repair-v1
on:
  push:
    branches:
      - verify/arena-public-semantics-truth-repair-v1
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python verify_arena_public_semantics_truth_repair_v1.py
      - run: python -c "from canonical.tests.test_arena_public_semantics_truth_repair_guard_v1 import test_arena_truth_repair; test_arena_truth_repair()"
