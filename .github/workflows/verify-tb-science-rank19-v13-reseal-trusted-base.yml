name: Verify TB-Science Rank19 V13 reseal from trusted base

on:
  pull_request:
    branches: [terminal-execution-v1]
    paths:
      - ".github/workflows/execute-tb-science-rank19-20261010-v1.yml"
      - ".github/workflows/verify-tb-science-rank19-v13-reseal-trusted-base.yml"
      - "execution_guard/**"
      - "capsules/tb_science_rank19_20261010_v1/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify proof-carrying inert Rank19 surface
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import py_compile
          import subprocess
          import sys
          from pathlib import Path

          root = Path(".").resolve()
          surface_path = root / "execution_guard/CURRENT_TERMINAL_EXECUTION_SURFACE_V1.json"
          surface = json.loads(surface_path.read_text(encoding="utf-8"))

          def blob(rel):
              p = root / rel
              raw = p.read_bytes()
              return hashlib.sha1(b"blob " + str(len(raw)).encode() + b"\0" + raw).hexdigest()

          def bound(row, label):
              assert isinstance(row, dict), (label, row)
              rel = row.get("path")
              sha = row.get("git_blob_sha")
              assert isinstance(rel, str) and isinstance(sha, str), (label, row)
              assert (root / rel).is_file(), (label, rel)
              assert blob(rel) == sha, (label, rel, blob(rel), sha)
              return rel

          assert surface["schema"] == "PROJECT_BRAIN_CURRENT_TERMINAL_EXECUTION_SURFACE_V1"
          assert surface["family"] == "TB_SCIENCE"
          assert surface["active"] is True
          staged = surface["execution_authority"] is False and surface["task_read_authority"] is False
          promoted = surface["execution_authority"] is True and surface["task_read_authority"] is True
          assert staged or promoted, (surface["execution_authority"], surface["task_read_authority"])
          assert surface["task_read_history"] is False
          assert surface["task_started"] is False
          assert surface["benchmark_trials_consumed"] == 0
          assert surface["terminal_credit_delta"] == 0
          activation = root / surface["activation_path"]
          assert not activation.exists(), activation

          for key in (
              "behavior", "authority", "ledger", "invariant_registry",
              "admission_guard", "epoch", "execution_claim", "preflight", "finalizer"
          ):
              bound(surface[key], "surface." + key)
          if "logical_attempt_claim_binding" in surface:
              bound(surface["logical_attempt_claim_binding"], "surface.logical_attempt_claim_binding")

          behavior = json.loads((root / surface["behavior"]["path"]).read_text(encoding="utf-8"))
          assert behavior["slot_id"] == surface["slot_id"]
          assert behavior["task_digest"] == surface["task_digest"]
          assert behavior["workflow_path"] == surface["workflow_path"]

          runtime = behavior.get("runtime_bindings")
          assert isinstance(runtime, dict)
          for key, row in runtime.items():
              rel = bound(row, "runtime." + key)
              if rel.endswith(".py"):
                  py_compile.compile(str(root / rel), doraise=True)

          zero = runtime.get("zero_exposure_tests")
          assert isinstance(zero, dict)
          if staged:
              subprocess.check_call([sys.executable, str(root / zero["path"])])
          else:
              promotion = surface.get("promotion_verification")
              rel = bound(promotion, "surface.promotion_verification")
              py_compile.compile(str(root / rel), doraise=True)
              subprocess.check_call([sys.executable, str(root / rel)])

          admission = surface["admission_guard"]["path"]
          subprocess.check_call([
              sys.executable, str(root / admission),
              "--workflow", surface["workflow_path"],
              "--slot", surface["slot_id"],
              "--task-digest", surface["task_digest"],
          ])

          preflight = surface["preflight"]["path"]
          preflight_args = [sys.executable, str(root / preflight)]
          if staged:
              preflight_args.append("--allow-staged")
          subprocess.check_call(preflight_args)

          surface_after = json.loads(surface_path.read_text(encoding="utf-8"))
          assert surface_after == surface
          assert not activation.exists()
          print("PASS__PROOF_CARRYING_TRUSTED_RANK19_ZERO_EXPOSURE_SURFACE")
          PY
