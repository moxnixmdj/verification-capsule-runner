name: Verify LiveBench legacy25 prompt contract compiler

on:
  pull_request:
    branches: [main]
    paths:
      - "subject/livebench_legacy25_contract_20261004/**"
      - "verify_livebench_legacy25_contract.py"
      - ".github/workflows/verify-livebench-legacy25-contract.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned legacy evaluator dependencies
        run: |
          python -m pip install --disable-pip-version-check --quiet \
            nltk==3.10.3 langdetect==1.0.9 immutabledict==4.3.1
          python - <<'PY'
          import nltk
          assert nltk.download("punkt", quiet=True)
          try:
              nltk.download("punkt_tab", quiet=True)
          except Exception:
              pass
          PY
      - name: Verify source-generated 25-of-25 inversion and witnesses
        run: python verify_livebench_legacy25_contract.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livebench-legacy25-contract-verification
          path: livebench_legacy25_contract_verification.json
          if-no-files-found: error
