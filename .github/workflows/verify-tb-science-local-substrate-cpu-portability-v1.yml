name: Verify TB-Science local substrate CPU portability V1

on:
  push:
    branches: ["verify/science-cpu-portability-v1-20261003"]
    paths:
      - ".github/workflows/verify-tb-science-local-substrate-cpu-portability-v1.yml"
      - "capsules/tb_science_cpu_portability_v1/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/verify-tb-science-local-substrate-cpu-portability-v1.yml"
      - "capsules/tb_science_cpu_portability_v1/**"

permissions:
  contents: read

concurrency:
  group: tb-science-cpu-portability-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Bind exact Brain repair contract
        run: |
          set -euo pipefail
          C=capsules/tb_science_cpu_portability_v1/TB_SCIENCE_LOCAL_SUBSTRATE_CPU_PORTABILITY_REPAIR_V1.json
          test "$(git hash-object "$C")" = "7e44ab43908860703a478df2ec8646246620260a"
          python - <<'PY'
          import json
          p="capsules/tb_science_cpu_portability_v1/TB_SCIENCE_LOCAL_SUBSTRATE_CPU_PORTABILITY_REPAIR_V1.json"
          x=json.load(open(p))
          assert x["causal_failure"]["execution_run_id"]==37110691405
          assert x["causal_failure"]["terminal_task_step_started"] is False
          assert x["repair_contract"]["cache_compiled_build_directory"] is False
          assert x["repair_contract"]["delete_build_directory_before_configure"] is True
          assert x["repair_contract"]["terminal_benchmark_dataset_forbidden"] is True
          assert x["execution_authority"] is False
          PY

      - name: Checkout exact llama.cpp source with no compiled cache
        run: |
          set -euo pipefail
          rm -rf llama.cpp
          git init llama.cpp
          git -C llama.cpp remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C llama.cpp fetch --depth 1 origin bec4772f6a2527d371557b5d2032641e5ff7619c
          git -C llama.cpp checkout --detach FETCH_HEAD
          test "$(git -C llama.cpp rev-parse HEAD)" = "bec4772f6a2527d371557b5d2032641e5ff7619c"
          test ! -e llama.cpp/build

      - name: Build llama-server on this exact runner
        run: |
          set -euo pipefail
          rm -rf llama.cpp/build
          cmake -S llama.cpp -B llama.cpp/build -DGGML_CUDA=OFF -DLLAMA_CURL=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build llama.cpp/build -j 2 --target llama-server
          test -x llama.cpp/build/bin/llama-server
          file llama.cpp/build/bin/llama-server | tee LLAMA_SERVER_FILE.txt
          lscpu | tee LSCPU.txt

      - name: Restore exact model cache only
        uses: actions/cache@v4
        with:
          path: models/Qwen3.5-9B-M-TS-Q4_K_M.gguf
          key: brain-qwen35-9b-f41c0a0c0e43bf721fb2da29374cd1a97271bac0bab08a9dc42964525e82350c

      - name: Acquire and verify exact Qwen model
        run: |
          set -euo pipefail
          mkdir -p models
          if [ ! -f models/Qwen3.5-9B-M-TS-Q4_K_M.gguf ]; then
            curl -L --fail --retry 3 --retry-delay 3 --silent --show-error               -o models/Qwen3.5-9B-M-TS-Q4_K_M.gguf               'https://huggingface.co/TheStageAI/Qwen3.5-9B-GGUF/resolve/main/Qwen3.5-9B-M-TS-Q4_K_M.gguf?download=true'
          fi
          echo 'f41c0a0c0e43bf721fb2da29374cd1a97271bac0bab08a9dc42964525e82350c  models/Qwen3.5-9B-M-TS-Q4_K_M.gguf' | sha256sum -c -

      - name: Start local endpoint and require health
        run: |
          set -euo pipefail
          EXTRA=()
          if llama.cpp/build/bin/llama-server --help 2>&1 | grep -q -- '--reasoning'; then EXTRA+=(--reasoning off); fi
          nohup llama.cpp/build/bin/llama-server             -m models/Qwen3.5-9B-M-TS-Q4_K_M.gguf             --alias brain-qwen3.5-9b             --host 127.0.0.1 --port 8080             -c 8192 -t 4 --parallel 1 --jinja --no-webui "${EXTRA[@]}"             > LOCAL_QWEN_SERVER.log 2>&1 &
          echo $! > LOCAL_QWEN_SERVER.pid
          ok=0
          for i in $(seq 1 300); do
            if curl -fsS http://127.0.0.1:8080/health > LOCAL_QWEN_HEALTH.json 2>/dev/null; then ok=1; break; fi
            if ! kill -0 "$(cat LOCAL_QWEN_SERVER.pid)" 2>/dev/null; then
              cat LOCAL_QWEN_SERVER.log
              exit 1
            fi
            sleep 1
          done
          test "$ok" = 1

      - name: Run zero-terminal synthetic completion
        run: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:8080/v1/chat/completions             -H 'Content-Type: application/json'             -d '{"model":"brain-qwen3.5-9b","messages":[{"role":"user","content":"Return exactly the token READY."}],"temperature":0,"max_tokens":16}'             > SYNTHETIC_COMPLETION.json
          python - <<'PY'
          import json
          x=json.load(open("SYNTHETIC_COMPLETION.json"))
          c=x["choices"][0]["message"]["content"]
          assert "READY" in c, c
          out={
            "schema":"PROJECT_BRAIN_TB_SCIENCE_LOCAL_SUBSTRATE_CPU_PORTABILITY_VERIFICATION_V1",
            "status":"INDEPENDENT_PASS__CLEAN_CURRENT_RUNNER_BUILD__HEALTH_AND_SYNTHETIC_COMPLETION_PASS__ZERO_TERMINAL",
            "brain_contract_git_blob_sha":"7e44ab43908860703a478df2ec8646246620260a",
            "llama_cpp_commit":"bec4772f6a2527d371557b5d2032641e5ff7619c",
            "qwen_sha256":"f41c0a0c0e43bf721fb2da29374cd1a97271bac0bab08a9dc42964525e82350c",
            "compiled_build_cache_reused":False,
            "health_pass":True,
            "synthetic_completion_contains_READY":True,
            "terminal_task_content_read":0,
            "terminal_results_observed":0,
            "incremental_spend_usd":0,
            "execution_authority":False,
            "promotion_authority":False,
          }
          open("CPU_PORTABILITY_VERIFICATION.json","w").write(json.dumps(out,indent=2,sort_keys=True)+"\n")
          print(json.dumps(out,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tb-science-local-substrate-cpu-portability-v1
          path: |
            CPU_PORTABILITY_VERIFICATION.json
            LOCAL_QWEN_HEALTH.json
            LOCAL_QWEN_SERVER.log
            SYNTHETIC_COMPLETION.json
            LLAMA_SERVER_FILE.txt
            LSCPU.txt
          if-no-files-found: warn
