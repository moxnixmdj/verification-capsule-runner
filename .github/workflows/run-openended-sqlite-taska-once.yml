name: Run Genuine Open-Ended SQLite Task A Once

on:
  pull_request:
    branches: [main]
    paths:
      - ARM_OPENENDED_SQLITE_TASKA_20260930_V1

permissions:
  contents: read

jobs:
  execute-once:
    if: github.head_ref == 'execute/openended-sqlite-taska-once-20260930-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ASTRA_DISABLE_MODEL_PLANNER: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout exact PR head, never merge ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Refresh Ubuntu package metadata
        run: sudo apt-get update
      - name: Execute frozen genuine open-ended Task A exactly once
        id: task
        continue-on-error: true
        run: PYTHONPATH=. python run_openended_sqlite_taska_once.py
      - name: Upload terminal Task A evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openended-sqlite-taska-terminal
          path: |
            openended-sqlite-taska-terminal.json
            canonical/astra_runtime/state/PARENT-OPENENDED-SQLITE-BACKUP-CONSISTENCY-REAL-TASK-20260930-001.json
            canonical/astra_runtime/evidence/PARENT-OPENENDED-SQLITE-BACKUP-CONSISTENCY-REAL-TASK-20260930-001*
          if-no-files-found: warn
      - name: Preserve semantic failure
        if: steps.task.outcome != 'success'
        run: exit 1
