name: Verify white-box semantic text core V1
on:
  pull_request:
    paths:
      - 'subject/whitebox_semantic_text_core_v1/**'
      - 'verify_whitebox_semantic_text_core_v1.py'
      - '.github/workflows/verify-whitebox-semantic-text-core-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Verify exact subject and fresh bounded semantic challenges
        run: python verify_whitebox_semantic_text_core_v1.py
