name: Verify Brain Composition Artifact Creation bridge V1
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/composition_artifact_creation_bridge_v1/**"
      - ".github/workflows/verify-brain-composition-artifact-creation-bridge-v1.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact Brain blob identities
        run: |
          cd capsules/composition_artifact_creation_bridge_v1
          python - <<'PY'
          import hashlib,json,pathlib
          m=json.load(open("EXPECTED_BRAIN_BLOBS.json",encoding="utf-8"))
          for src,expected in m["exact_brain_blobs"].items():
              raw=pathlib.Path(src).read_bytes()
              got=hashlib.sha1(f"blob {len(raw)}\0".encode()+raw).hexdigest()
              assert got==expected,(src,got,expected)
          print("exact Brain blobs PASS",len(m["exact_brain_blobs"]))
          PY
      - name: Run Brain bridge test
        run: |
          cd capsules/composition_artifact_creation_bridge_v1
          python canonical/tests/test_composition_artifact_creation_scope_complete_bridge_v1.py
      - name: Independent semantic assertions
        run: |
          cd capsules/composition_artifact_creation_bridge_v1
          python - <<'PY'
          import json
          def load(p): return json.load(open(p,encoding="utf-8"))
          b=load("canonical/governance/COMPOSITION_ARTIFACT_CREATION_SCOPE_COMPLETE_BRIDGE_V1.json")
          p=load("canonical/governance/OPUS55_TERMINAL_PROOF_PROTOCOLS_V1.json")
          m=load("canonical/governance/FROZEN_COMPOSITION_COMPONENT_INTERFACE_MANIFEST_V1.json")
          r=load("canonical/governance/BEHAVIORAL_CONTRACT_REGISTRY_V1.json")
          q=load("canonical/verification/ARTIFACT_UNCOVERED_SCOPE_PARTITION_PROOF_20261002_V1.json")
          e=load("canonical/governance/OPUS55_ACCEPTANCE_PREDICATE_EVIDENCE_BINDINGS_V2.json")
          rows=[x for x in m["interfaces"] if x["component_id"]=="artifact creation"]
          assert len(rows)==1 and rows[0]["interface_id"]=="research+tool use+artifact creation"
          assert rows[0]["component_id"].upper().replace(" ","_")=="ARTIFACT_CREATION"
          fam=set(r["family_to_residual_contracts"]["ARTIFACT_CREATION"])
          part={x["contract"] for x in q["frozen_contract_partition"]}
          assert fam==part=={"NATIVE_ARTIFACT_STRUCTURED_EDIT_PRESERVATION_001","PROFESSIONAL_ARTIFACT_PLAN_AND_QUALITY_JUDGMENT_001"}
          assert q["no_uncovered_contracted_leaf"] is True
          row=next(x for x in e["claims"] if x.get("predicate_id")=="ARTIFACT_UNCOVERED_FORMAT_SCOPE_AUDIT")
          assert row["state"]=="PROVED" and row["scope_complete"] is True and row["independent_or_objective"] is True
          receipt=b["candidate_receipt"]
          assert receipt["component_id"]=="artifact creation"
          assert receipt["proved_properties"]==["SCOPED_ACCEPTANCE_PROOF"]
          assert b["expected_effect_after_independent_verification"]["projected_scoped_proved_components_after"]==5
          assert b["expected_effect_after_independent_verification"]["projected_open_components_after"]==7
          assert b["expected_effect_after_independent_verification"]["strict_opus55_acceptance_delta"]==0
          assert b["acceptance_credit_delta"]==0 and b["family_credit_delta"]==0 and b["capability_credit_delta"]==0
          assert b["execution_authority"] is False and b["promotion_authority"] is False and b["fresh_reality_authority"] is False
          print("composition artifact creation bridge independent assertions PASS")
          PY
