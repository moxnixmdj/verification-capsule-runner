name: Verify Brain PR 1182 Tool Discovery V8
on:
  push:
    branches: [critical/td8-isolated-20261003]
    paths:
      - "capsules/brain_pr_1182_tool_discovery_v8/**"
      - ".github/workflows/verify-brain-pr-1182-tool-discovery-v8.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pin exact Brain blobs
        shell: bash
        run: |
          set -euo pipefail
          cd capsules/brain_pr_1182_tool_discovery_v8
          test "$(git hash-object canonical/runtime/tool_discovery_dynamic_candidate_v5.py)" = "42d096ef93e8ad06c4d1d5dfe730881bf45a2a72"
          test "$(git hash-object canonical/runtime/tool_discovery_dynamic_candidate_v7.py)" = "e29328dfe5aff5650c1b938472ccf5ecf826831a"
          test "$(git hash-object canonical/runtime/tool_discovery_dynamic_candidate_v8.py)" = "b43443ef8b0387ed88bb5a852de01323276ad2aa"
          test "$(git hash-object canonical/tests/test_tool_discovery_dynamic_candidate_v8.py)" = "1beef6c6054b744f666294cb58a3a466a8c27ed1"
          test "$(git hash-object canonical/governance/TOOL_DISCOVERY_V8_AUTHORITY_SOUNDNESS_REPAIR_V1.json)" = "6191a3414cea3c9a6888102c76db1248f92f6850"
      - name: Run adversarial predecessor counterexamples
        shell: bash
        run: |
          set -euo pipefail
          cd capsules/brain_pr_1182_tool_discovery_v8
          export PYTHONPATH=.
          python -m unittest canonical.tests.test_tool_discovery_dynamic_candidate_v8 -v
      - name: Exhaust small hidden-capability worlds against global least-cost oracle
        shell: bash
        run: |
          set -euo pipefail
          cd capsules/brain_pr_1182_tool_discovery_v8
          export PYTHONPATH=.
          python - <<'PY'
          import itertools
          from canonical.runtime import tool_discovery_dynamic_candidate_v5 as v5
          from canonical.runtime import tool_discovery_dynamic_candidate_v8 as v8

          CAPS=("A","B")
          tools=[
            {"tool_id":f"T{i}","epoch":0,"cost":float(i+1),"available":True,"authorized":True,
             "safe_probe_capabilities":list(CAPS)}
            for i in range(3)
          ]
          source={
            "source_id":"S0","cost":0.0,"available":True,"authorized":True,"authoritative":True,
            "source_epoch":0,"source_digest":v5._tools_digest(tools),
            "catalog_query":"__FULL_AUTHORITY_CATALOG__",
          }
          authority_epoch=7
          source_set=v8._source_set_digest([source],authority_epoch=authority_epoch)

          checked=0
          for bits in itertools.product((False,True),repeat=len(tools)*len(CAPS)):
            truth={}
            k=0
            for t in tools:
              for cap in CAPS:
                truth[(t["tool_id"],cap)]=bits[k]; k+=1
            state={
              "required_capabilities":list(CAPS),
              "decision_epoch":99,
              "authority_epoch":authority_epoch,
              "constraint":None,
              "visible_tools":[],
              "discovery_sources":[source],
              "discovery_receipts":[{
                "kind":"DISCOVERY_RESULT","source_id":"S0","complete":True,
                "authority_epoch":authority_epoch,"source_epoch":0,
                "source_digest":source["source_digest"],"source_set_digest":source_set,
                "query":source["catalog_query"],"tools":tools,
              }],
              "prior_probe_receipts":[],
              "version_events":[],
            }
            terminal=None
            for _ in range(20):
              a=v8.next_action(state)
              if a["action"]=="PROBE":
                tid,cap=a["tool_id"],a["capability"]
                state["prior_probe_receipts"].append({
                  "kind":"SAFE_CAPABILITY_PROBE","tool_id":tid,"capability":cap,
                  "epoch":0,"authority_epoch":authority_epoch,
                  "supported":truth[(tid,cap)],
                })
                continue
              terminal=a
              break
            assert terminal is not None, (bits,state)
            feasible=[
              t for t in tools
              if all(truth[(t["tool_id"],cap)] for cap in CAPS)
            ]
            if feasible:
              expected=min(feasible,key=lambda t:(t["cost"],t["tool_id"]))["tool_id"]
              assert terminal=={"action":"SELECT","tool_id":expected}, (bits,expected,terminal)
            else:
              assert terminal["action"]=="ESCALATE", (bits,terminal)
              assert terminal["reason"]=="NO_VERIFIED_ADMISSIBLE_TOOL_AFTER_COMPLETE_DISCOVERY", terminal
            checked+=1

          assert checked==64
          print("GLOBAL_ORACLE_ABSTRACT_WORLDS_PASS",checked)
          PY
      - name: Enforce governance nonclaims
        shell: bash
        run: |
          set -euo pipefail
          cd capsules/brain_pr_1182_tool_discovery_v8
          python - <<'PY'
          import json
          g=json.load(open("canonical/governance/TOOL_DISCOVERY_V8_AUTHORITY_SOUNDNESS_REPAIR_V1.json"))
          assert g["universal_target_proved"] is False
          assert g["common_authority_scope_proved"] is False
          assert g["acceptance_credit_delta"]==0
          assert g["capability_credit_delta"]==0
          assert g["family_credit_delta"]==0
          assert g["new_reality_units_consumed"]==0
          assert g["terminal_results_replayed"]==0
          assert g["execution_authority"] is False
          assert g["promotion_authority"] is False
          print("ZERO_CREDIT_FAIL_CLOSED_PASS")
          PY
