name: Verify M1B continuous geometry and tolerance
on:
  pull_request:
    branches: [main]
    paths:
      - 'verification/m1b_continuous_geometry_compiler.py'
      - 'verification/cad_partspec.py'
      - 'verification/cad_partspec_generator.py'
      - 'verification/test_m1b_continuous_geometry.py'
      - '.github/workflows/verify-m1b-continuous-geometry.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --no-cache-dir 'cadquery==2.8.0' 'pydantic>=2,<3'
      - run: cd verification && python -m unittest -v test_m1b_continuous_geometry.py
