name: Verify structured-method normalized graph v3
on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/runtime/structured_method_normalized_graph_candidate_v3.py'
      - 'canonical/runtime/structured_method_normalized_graph_proof_v3.py'
      - 'canonical/tests/test_structured_method_normalized_graph_v3.py'
      - '.github/workflows/verify-structured-method-normalized-graph-v3.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Bind exact Brain branch blobs
        run: |
          test "$(git hash-object canonical/runtime/structured_method_normalized_graph_candidate_v3.py)" = "7ee731e123bca0f42860535bcdfe06504f23a3ec"
          test "$(git hash-object canonical/runtime/structured_method_normalized_graph_proof_v3.py)" = "3f123fd781c85a7f73ffba5a33efebeea0c4a22f"
          test "$(git hash-object canonical/tests/test_structured_method_normalized_graph_v3.py)" = "1e5fa9a0d6fa43d4478fe2e7ec7821d9b42c4275"
      - name: Run v3 hidden-oracle tests
        run: PYTHONPATH=. python -m unittest canonical.tests.test_structured_method_normalized_graph_v3 -v
