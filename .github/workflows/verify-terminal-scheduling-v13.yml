name: Verify terminal scheduling V13
on:
  push:
    branches:
      - verify/scheduling-v13-v5-20261003-sol
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python verify_terminal_scheduling_v13.py
