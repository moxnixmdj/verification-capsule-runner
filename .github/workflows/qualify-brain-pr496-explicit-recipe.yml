name: Guarded Qualify Brain PR496 Explicit Recipe Fail-Closed
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - canonical/runtime/bound_capabilities/broad_objective_decompose.py
      - canonical/runtime/bound_capabilities/plain_goal_bound_grounding.py
      - canonical/tests/test_broad_objective_semantic_decomposition.py
      - canonical/action_intents/2026-09-30_REPAIR_BROAD_EXPLICIT_RECIPE_FAILCLOSED_V2.json
      - qualification/pr496/**
      - .github/workflows/qualify-brain-pr496-explicit-recipe.yml
permissions:
  contents: write
jobs:
  qualify:
    if: github.head_ref == 'qualify/brain-pr496-explicit-recipe-v2-20260930-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Generate frozen qualification plan
        run: python qualification/pr496/generate_plan.py
      - name: Guard and qualify exact PR496 bytes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python execution_guard/github_actions_guarded_run_live.py --plan qualification/pr496/guarded_plan.json --receipt qualification/pr496/admission.json
      - name: Upload PR496 qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr496-explicit-recipe-failclosed-qualification
          path: |
            qualification/pr496/admission.json
            qualification/pr496/guarded_plan.json
            qualification/pr496/pr496-independent-report.json
          if-no-files-found: warn
