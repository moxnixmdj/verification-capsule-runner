name: Qualify Brain PR496 Explicit Recipe Fail-Closed
on:
  pull_request:
    branches: [main]
    paths:
      - 'qualification/pr496/**'
      - '.github/workflows/qualify-brain-pr496-explicit-recipe.yml'

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Atomically admit exact PR496 adversarial qualification
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python execution_guard/github_actions_guarded_run_live.py --plan qualification/pr496/guarded_plan.json --receipt qualification/pr496/admission.json
      - name: Upload guarded evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: brain-pr496-explicit-recipe-qualification
          path: |
            qualification/pr496/admission.json
            qualification/pr496/guarded_plan.json
            qualification/pr496/authorization.json
          if-no-files-found: warn
