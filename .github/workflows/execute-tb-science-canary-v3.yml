name: Execute TB-Science one-slot canary V3
on:
  push:
    branches: ["execute-tb-science-canary-v3b-20261003"]
    paths:
      - "capsules/tb_science_canary_execution_v2/ARM_CANARY_V3.json"
permissions:
  contents: read
jobs:
  terminal-canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact armed capsule and one-use authority
        run: |
          set -euo pipefail
          C=capsules/tb_science_canary_execution_v2
          test "$(git hash-object "$C/canonical/governance/TB_SCIENCE_ONE_SLOT_CANARY_AUTHORITY_V3.json")" = "ae5bc607b828e8f55092e80e0a806d5a496eb54b"
          test "$(git hash-object "$C/canonical/governance/TB_SCIENCE_TERMINAL_EXECUTION_MANIFEST_V1.json")" = "6dfa880b1f68881531afbba6ca211681801fd19b"
          test "$(git hash-object "$C/canonical/runtime/harbor_science_agent_v1.py")" = "5557efd21f1a433ad16766def3775a79c459784b"
          test "$(git hash-object "$C/canonical/runtime/harbor_science_planner_v1.py")" = "fe7c0ce885197217774638df382aeb6f68ff38dd"
          test "$(git hash-object "$C/canonical/runtime/harbor_command_policy.py")" = "a525773417291c7a4841bf35e1baff5370350d0d"
          test "$(git hash-object "$C/canonical/runtime/harbor_environment_transport.py")" = "ec46f648214a37bb16025d5ef2593efdf59f0d79"
          test "$(git hash-object "$C/canonical/runtime/acceptance_capability_source_gate_v2.py")" = "b168b131f6383e158bdc0d931439d14e61f2a5de"
          python - <<'PY'
          import json,subprocess
          p="capsules/tb_science_canary_execution_v2/ARM_CANARY_V3.json"
          a=json.load(open(p))
          assert a["schema"]=="PROJECT_BRAIN_TB_SCIENCE_CANARY_ARM_V3"
          assert a["status"]=="ARMED"
          assert a["execution_authority"] is True
          assert a["authority_blob"]=="ae5bc607b828e8f55092e80e0a806d5a496eb54b"
          assert a["authorized_slot_id"]=="terminal-bench-science/virtual-baseline-localization::trial-0"
          assert a["task_name"]=="terminal-bench-science/virtual-baseline-localization"
          assert a["retries"]==0 and a["replacement"] is False
          assert a["preflight_conclusion"]=="success"
          wf=subprocess.check_output(["git","hash-object",".github/workflows/execute-tb-science-canary-v3.yml"],text=True).strip()
          assert wf==a["execution_workflow_blob"],(wf,a["execution_workflow_blob"])
          PY
      - name: Install exact Harbor
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir -q 'harbor==0.23.0'
          python - <<'PY'
          import importlib.metadata
          assert importlib.metadata.version("harbor")=="0.23.0"
          PY
          docker version >/dev/null
          docker info >/dev/null
      - name: Restore pinned llama.cpp build cache
        uses: actions/cache@v4
        with:
          path: llama.cpp
          key: brain-llama-cpp-bec4772f6a2527d371557b5d2032641e5ff7619c-ubuntu2404
      - name: Ensure exact pinned llama.cpp server
        run: |
          set -euo pipefail
          if [ ! -d llama.cpp/.git ]; then
            rm -rf llama.cpp
            git init llama.cpp
            git -C llama.cpp remote add origin https://github.com/ggml-org/llama.cpp.git
            git -C llama.cpp fetch --depth 1 origin bec4772f6a2527d371557b5d2032641e5ff7619c
            git -C llama.cpp checkout --detach FETCH_HEAD
          fi
          test "$(git -C llama.cpp rev-parse HEAD)" = "bec4772f6a2527d371557b5d2032641e5ff7619c"
          cmake -S llama.cpp -B llama.cpp/build -DGGML_CUDA=OFF -DLLAMA_CURL=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build llama.cpp/build -j 2 --target llama-server
      - name: Restore pinned Qwen model cache
        uses: actions/cache@v4
        with:
          path: models/Qwen3.5-9B-M-TS-Q4_K_M.gguf
          key: brain-qwen35-9b-f41c0a0c0e43bf721fb2da29374cd1a97271bac0bab08a9dc42964525e82350c
      - name: Acquire and verify exact Qwen bytes
        run: |
          set -euo pipefail
          mkdir -p models
          if [ ! -f models/Qwen3.5-9B-M-TS-Q4_K_M.gguf ]; then
            curl -L --fail --retry 3 --retry-delay 3 --silent --show-error               -o models/Qwen3.5-9B-M-TS-Q4_K_M.gguf               'https://huggingface.co/TheStageAI/Qwen3.5-9B-GGUF/resolve/main/Qwen3.5-9B-M-TS-Q4_K_M.gguf?download=true'
          fi
          echo 'f41c0a0c0e43bf721fb2da29374cd1a97271bac0bab08a9dc42964525e82350c  models/Qwen3.5-9B-M-TS-Q4_K_M.gguf' | sha256sum -c -
          test "$(stat -c '%s' models/Qwen3.5-9B-M-TS-Q4_K_M.gguf)" = "5060174144"
      - name: Start exact local proposal endpoint
        run: |
          set -euo pipefail
          EXTRA=()
          if llama.cpp/build/bin/llama-server --help 2>&1 | grep -q -- '--reasoning'; then EXTRA+=(--reasoning off); fi
          nohup llama.cpp/build/bin/llama-server             -m models/Qwen3.5-9B-M-TS-Q4_K_M.gguf             --alias brain-qwen3.5-9b             --host 127.0.0.1 --port 8080 -c 8192 -t 4 --parallel 1             --jinja --no-webui "${EXTRA[@]}" > LOCAL_QWEN_SERVER.log 2>&1 &
          ok=0
          for i in $(seq 1 240); do
            if curl -fsS http://127.0.0.1:8080/health > LOCAL_QWEN_HEALTH.json 2>/dev/null; then ok=1; break; fi
            sleep 1
          done
          test "$ok" = 1
      - name: Execute exactly the authorized untouched slot
        id: execute
        continue-on-error: true
        env:
          TASK_NAME: terminal-bench-science/virtual-baseline-localization
          SAFE_ID: virtual-baseline-localization-trial-0
        run: |
          set -uo pipefail
          C="$GITHUB_WORKSPACE/capsules/tb_science_canary_execution_v2"
          export PYTHONPATH="$C"
          mkdir -p "$GITHUB_WORKSPACE/jobs/$SAFE_ID"
          harbor run             -d terminal-bench-science/terminal-bench-science@0.1.0             -i "$TASK_NAME"             -a canonical.runtime.harbor_science_agent_v1:HarborScienceAgent             -k 1 -n 1 -r 0             --agent-timeout-multiplier 0.60             --environment-build-timeout-multiplier 1.0             --verifier-timeout-multiplier 1.0             --job-name "$SAFE_ID"             --jobs-dir "$GITHUB_WORKSPACE/jobs/$SAFE_ID"
          echo "harbor_exit=$?" >> "$GITHUB_OUTPUT"
      - name: Finalize conservative one-use receipt
        if: always()
        env:
          SLOT_ID: terminal-bench-science/virtual-baseline-localization::trial-0
          TASK_NAME: terminal-bench-science/virtual-baseline-localization
          SAFE_ID: virtual-baseline-localization-trial-0
          HARBOR_OUTCOME: ${{ steps.execute.outcome }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          base=root/"jobs"/os.environ["SAFE_ID"]
          candidates=[]
          for p in base.rglob("result.json") if base.exists() else []:
              try: obj=json.loads(p.read_text())
              except Exception: continue
              vr=obj.get("verifier_result")
              if isinstance(vr,dict) and isinstance(vr.get("rewards"),dict):
                  candidates.append((p,obj))
          reward=None; selected=None; errors=[]
          if len(candidates)==1:
              selected,obj=candidates[0]
              raw=obj["verifier_result"]["rewards"].get("reward")
              if isinstance(raw,(int,float)) and not isinstance(raw,bool): reward=float(raw)
              else: errors.append("REWARD_MISSING_OR_NONNUMERIC")
          elif not candidates: errors.append("NO_TRIAL_RESULT_WITH_VERIFIER_REWARD")
          else: errors.append("MULTIPLE_TRIAL_RESULTS_FOR_ONE_SLOT")
          success=(reward is not None and reward>=1.0 and not errors)
          hashes={}
          if selected is not None:
              hashes[str(selected.relative_to(root))]=hashlib.sha256(selected.read_bytes()).hexdigest()
          receipt={
            "schema":"PROJECT_BRAIN_TB_SCIENCE_CANARY_TERMINAL_SLOT_RECEIPT_V3",
            "slot_id":os.environ["SLOT_ID"],
            "task_name":os.environ["TASK_NAME"],
            "status":"SUCCESS" if success else "FINAL_ZERO",
            "reward":reward if reward is not None else 0.0,
            "errors":errors,
            "harbor_step_outcome":os.environ.get("HARBOR_OUTCOME"),
            "authority_blob":"ae5bc607b828e8f55092e80e0a806d5a496eb54b",
            "manifest_blob":"6dfa880b1f68881531afbba6ca211681801fd19b",
            "controller_blob":"5557efd21f1a433ad16766def3775a79c459784b",
            "planner_blob":"fe7c0ce885197217774638df382aeb6f68ff38dd",
            "source_gate_blob":"b168b131f6383e158bdc0d931439d14e61f2a5de",
            "llama_cpp_commit":"bec4772f6a2527d371557b5d2032641e5ff7619c",
            "qwen_sha256":"f41c0a0c0e43bf721fb2da29374cd1a97271bac0bab08a9dc42964525e82350c",
            "github_run_id":os.environ["GITHUB_RUN_ID"],
            "github_run_attempt":os.environ["GITHUB_RUN_ATTEMPT"],
            "github_sha":os.environ["GITHUB_SHA"],
            "result_hashes":hashes,
            "retries":0,
            "replacement":False,
            "incremental_spend_usd":0
          }
          out=root/"TB_SCIENCE_CANARY_V3_SLOT_RECEIPT.json"
          out.write_text(json.dumps(receipt,indent=2,sort_keys=True)+"\n")
          print(json.dumps(receipt,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tb-science-canary-v3-result
          path: |
            TB_SCIENCE_CANARY_V3_SLOT_RECEIPT.json
            LOCAL_QWEN_HEALTH.json
            LOCAL_QWEN_SERVER.log
            jobs/virtual-baseline-localization-trial-0/
          if-no-files-found: error
