name: Verify LiveBench V10 wrapper and atomic launcher
on:
  push:
    branches:
      - "verify/livebench-v10-formal-routing-20261004"
    paths:
      - ".github/workflows/verify-livebench-v10-atomic-launcher.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: "verify/livebench-v10-formal-routing-20261004"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.14"
      - run: python verify_livebench_v10_atomic_launcher.py
