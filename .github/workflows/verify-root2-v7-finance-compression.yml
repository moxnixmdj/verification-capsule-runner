name: Verify Root2 V7 finance compression

on:
  push:
    branches:
      - verify-root2-v7-finance-compression

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python verify_root2_v7_finance_compression.py
