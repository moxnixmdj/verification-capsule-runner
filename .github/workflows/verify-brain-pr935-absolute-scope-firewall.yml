name: Verify Brain PR935 absolute scope firewall

on:
  pull_request:
    branches: [main]
    paths:
      - 'capsules/brain_pr935_scope_firewall/**'
      - '.github/workflows/verify-brain-pr935-absolute-scope-firewall.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact Brain blob identities
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          root=Path("capsules/brain_pr935_scope_firewall")
          expected={
            "canonical/runtime/acceptance_proof_transmuter_v1.py":"39b5611e53485674b29e2a05da91b89801bc5aa6",
            "canonical/tests/test_acceptance_proof_transmuter_v1.py":"0ee24ebcde11679f468bb1ba653ddbb16fa27834",
            "canonical/governance/OPUS55_TERMINAL_PROOF_PROTOCOLS_V1.json":"eb4bca0fe6a015d49d2854998fbe046c979c7ea9",
            "canonical/governance/OPUS55_ACCEPTANCE_PROOF_TRANSMUTATION_INPUT_V1.json":"96052a6b5178305b37a2526fb25c3f53fa33b9b5",
            "canonical/governance/TOOL_DISCOVERY_T2_T3_OBJECTIVE_TERMINAL_BINDING_V1.json":"6bcabc0a7d0525532ce7b80e132278f7c99caa43",
            "canonical/governance/ABSOLUTE_DOMINANCE_SCOPE_COMPLETENESS_RECONCILIATION_V1.json":"7a28630e59975746459b5ad0beaa5dcacd5df548",
          }
          for rel,want in expected.items():
              b=(root/rel).read_bytes()
              got=hashlib.sha1(b"blob "+str(len(b)).encode()+b"\0"+b).hexdigest()
              assert got==want,(rel,got,want)
          print("EXACT_BLOB_IDENTITY_PASS",len(expected))
          PY
      - name: Run fail-closed transmuter tests
        env:
          PYTHONPATH: capsules/brain_pr935_scope_firewall
        run: python -m unittest -v canonical.tests.test_acceptance_proof_transmuter_v1
      - name: Recompute current typed evidence
        env:
          PYTHONPATH: capsules/brain_pr935_scope_firewall
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from canonical.runtime.acceptance_proof_transmuter_v1 import evaluate
          root=Path("capsules/brain_pr935_scope_firewall")
          p=json.loads((root/"canonical/governance/OPUS55_TERMINAL_PROOF_PROTOCOLS_V1.json").read_text())
          e=json.loads((root/"canonical/governance/OPUS55_ACCEPTANCE_PROOF_TRANSMUTATION_INPUT_V1.json").read_text())
          out=evaluate(p,e)
          assert (out["family_count"],out["closed_family_count"],out["open_family_count"])==(19,2,17),out
          rows={x["family"]:x for x in out["families"]}
          for fam in ["TOOL_DISCOVERY_SELECTION_AND_LEARNING","SUBAGENT_DELEGATION_AND_COORDINATION"]:
              assert rows[fam]["result_status"]=="DEFINED_RESULT_OPEN",rows[fam]
              assert any("ABSOLUTE_SCOPE_COMPLETENESS_MISSING" in r["reasons"] for r in rows[fam]["rejections"]),rows[fam]
          bind=json.loads((root/"canonical/governance/TOOL_DISCOVERY_T2_T3_OBJECTIVE_TERMINAL_BINDING_V1.json").read_text())
          assert bind["source_pool"]["terminal_scope_claim"]=="DIRECT_OBJECTIVE_INSTRUMENTATION_INSIDE_T2_T3__NOT_EXHAUSTIVE_PROOF_OF_ALL_OPEN_DOMAIN_TOOL_ECOSYSTEMS"
          print("RESULT_JSON="+json.dumps({
            "status":"INDEPENDENT_PUBLIC_RUNNER_PASS",
            "family_count":19,
            "closed_family_count":2,
            "open_family_count":17,
            "reopened_pending_scope_completeness":["TOOL_DISCOVERY_SELECTION_AND_LEARNING","SUBAGENT_DELEGATION_AND_COORDINATION"],
            "tool_discovery_source_explicitly_non_exhaustive":True,
            "new_reality_units":0,
            "terminal_replay":0,
            "incremental_spend_usd":0
          },sort_keys=True))
          PY
