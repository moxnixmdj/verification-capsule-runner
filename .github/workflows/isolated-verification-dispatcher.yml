name: Isolated verification dispatcher
on:
  pull_request:
    branches:
      - 'verify-base/**'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run isolated verification capsule
        run: |
          set -euo pipefail
          test -f verification/run.sh
          bash verification/run.sh
