name: Verify non-circular terminal prequalification
on:
  pull_request:
    paths:
      - 'capsules/noncircular_prequalification/**'
      - '.github/workflows/verify-noncircular-prequalification-v1.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Bind exact Brain blobs
        run: |
          set -euo pipefail
          test "$(git hash-object capsules/noncircular_prequalification/canonical/runtime/terminal_prequalification_reducer.py)" = "da929015fafabed2b5a134a2e95b6bff2f47349c"
          test "$(git hash-object capsules/noncircular_prequalification/canonical/tests/test_terminal_prequalification_reducer.py)" = "9b09e96c9bf0340d174b4a752148c0807be9043e"
          test "$(git hash-object capsules/noncircular_prequalification/canonical/governance/EXACT_FOUR_PORTFOLIO_PREQUALIFICATION_V1.json)" = "c8114d038b1ff5168960950cd76ebd39be27d820"
          test "$(git hash-object capsules/noncircular_prequalification/canonical/governance/BEHAVIORAL_CONTRACT_REGISTRY_V1.json)" = "afa00109031d638fef32cc3fe10be18786605c39"
          test "$(git hash-object capsules/noncircular_prequalification/canonical/governance/ACTIVE_TERMINAL_PROOF_BASIS_V1.json)" = "2ba39428f0065f0d8739c43935f7026ba6eedcfb"
          test "$(git hash-object capsules/noncircular_prequalification/canonical/governance/GLOBAL_TERMINAL_REPLACEMENT_POPULATION_PROTOCOL_V2.json)" = "432f1f9122a0a136f71a89eae5c8fb81692e4071"
      - name: Run reducer regressions
        working-directory: capsules/noncircular_prequalification
        run: PYTHONPATH=. python -m unittest -v canonical.tests.test_terminal_prequalification_reducer
      - name: Run live 12-of-12 prequalification decision
        working-directory: capsules/noncircular_prequalification
        run: |
          set -euo pipefail
          PYTHONPATH=. python canonical/runtime/terminal_prequalification_reducer.py . > /tmp/prequal.json
          cat /tmp/prequal.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/prequal.json'))
          assert p['pass'] is True, p
          assert p['execution_authority'] is True, p
          assert p['authorization']=='T0_T1_T2_T3_PARALLEL_TERMINAL_WAVE', p
          assert p['failed_predicates']==[], p
          PY
