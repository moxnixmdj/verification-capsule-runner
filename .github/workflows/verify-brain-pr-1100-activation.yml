name: Verify Brain PR 1100 activation
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/brain_pr_1100_activation/**"
      - ".github/workflows/verify-brain-pr-1100-activation.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact activation blob identities
        shell: bash
        run: |
          set -euo pipefail
          cd capsules/brain_pr_1100_activation
          test "$(git hash-object canonical/governance/CURRENT_TERMINAL_AUTHORITY_V1.json)" = "69771b26860fa700ce03fcbed5e8e484e61a1433"
          test "$(git hash-object canonical/governance/TOOL_DISCOVERY_DYNAMIC_REFINEMENT_ACTIVATION_V1.json)" = "44faeb24bdc2d9189b7c0de1b1e2be9b1210aeeb"
          test "$(git hash-object canonical/verification/TOOL_DISCOVERY_DYNAMIC_REFINEMENT_PUBLIC_RUNNER_VERIFICATION_20261003_V1.json)" = "5fcdc5ae35f51c40f312edbe5727284c9f6ca3dd"
      - name: Verify truth-preserving authority integration
        shell: bash
        run: |
          set -euo pipefail
          cd capsules/brain_pr_1100_activation
          python - <<'PY'
          import json
          a=json.load(open("canonical/governance/CURRENT_TERMINAL_AUTHORITY_V1.json"))
          x=json.load(open("canonical/governance/TOOL_DISCOVERY_DYNAMIC_REFINEMENT_ACTIVATION_V1.json"))
          v=json.load(open("canonical/verification/TOOL_DISCOVERY_DYNAMIC_REFINEMENT_PUBLIC_RUNNER_VERIFICATION_20261003_V1.json"))
          assert a["truth"]["opus55_acceptance"]=="3/19_PASS__16/19_OPEN",a["truth"]
          assert a["truth"]["achieved"] is False,a["truth"]
          assert a["atomic_acceptance_frontier"]["proved"]==8
          assert a["atomic_acceptance_frontier"]["unresolved"]==30
          assert "INDEPENDENT_VERIFIED_COMPLETE_DISCOVERY_INTERFACE_INSTANCE_SATISFYING_TOOL_DISCOVERY_COMPLETE_INTERFACE_CONTRACT_V1" in a["next"]
          assert x["current_acceptance_preserved"]=="3_OF_19__8_OF_38"
          assert x["universal_target_proved"] is False
          assert x["capability_credit_delta"]==0 and x["family_credit_delta"]==0
          assert v["public_runner"]["workflow_run_id"]==37086170038
          assert v["public_runner"]["workflow_job_id"]==111096827396
          assert v["universal_target_proved"] is False
          assert v["capability_credit_delta"]==0 and v["family_credit_delta"]==0
          print("Brain PR 1100 activation integration: PASS")
          PY
