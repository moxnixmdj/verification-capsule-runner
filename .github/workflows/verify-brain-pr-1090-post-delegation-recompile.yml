name: Verify Brain PR 1090 post delegation recompile
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/brain_pr_1090_post_delegation_recompile/**"
      - ".github/workflows/verify-brain-pr-1090-post-delegation-recompile.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact Brain blob identities
        run: |
          cd capsules/brain_pr_1090_post_delegation_recompile
          python - <<'PY'
          import hashlib,json,pathlib
          m=json.load(open("EXPECTED_BRAIN_BLOBS.json",encoding="utf-8"))
          for src,expected in m["exact_brain_blobs"].items():
              data=pathlib.Path(src).read_bytes()
              got=hashlib.sha1(f"blob {len(data)}\0".encode()+data).hexdigest()
              assert got==expected,(src,got,expected)
          print("exact Brain PR 1090 blobs: PASS")
          PY
      - name: Run post delegation recompile tests
        run: |
          cd capsules/brain_pr_1090_post_delegation_recompile
          export PYTHONPATH=.
          python -m py_compile canonical/runtime/post_delegation_frontier_recompile_v1.py
          python -m unittest canonical.tests.test_post_delegation_frontier_recompile_v1 -v
      - name: Verify exact recompute output
        run: |
          cd capsules/brain_pr_1090_post_delegation_recompile
          python - <<'PY'
          import json
          from canonical.runtime.post_delegation_frontier_recompile_v1 import compile_post_delegation
          F=json.load(open("canonical/governance/TERMINAL_CERTIFICATE_FRONTIER_V5.json"))
          H=json.load(open("canonical/governance/OPUS55_ACCEPTANCE_ACTION_HYPERGRAPH_V2.json"))
          O=json.load(open("canonical/governance/PROOF_ATOM_REFINEMENT_OVERLAY_V1.json"))
          out=compile_post_delegation(F,H,O)
          assert out["status"].startswith("PASS")
          assert out["before"]=={"unresolved_predicates":31,"certificates":17,"actions":22}
          assert out["after"]["unresolved_predicates"]==30
          assert out["after"]["certificates"]==16
          assert out["after"]["actions"]==21
          assert out["after"]["leaf_requirement_occurrences"]==39
          assert out["after"]["canonical_leaf_atoms"]==39
          assert out["after"]["exact_duplicate_savings"]==0
          assert out["capability_credit_delta"]==0 and out["family_credit_delta"]==0
          assert out["execution_authority"] is False and out["promotion_authority"] is False
          print("post delegation exact recompile: PASS")
          PY
