name: Verify Brain terminal ceiling witness lifter v1

on:
  pull_request:
    paths:
      - 'capsules/ceiling_witness_lifter_v1/**'
      - '.github/workflows/verify-brain-ceiling-witness-lifter-v1.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact mirrored Brain blob identities
        env:
          EXPECTED_JSON: '{"capsules/ceiling_witness_lifter_v1/canonical/runtime/terminal_ceiling_witness_lifter_v1.py":"ec98010166db350db81ed01ffc70590805c536a8","capsules/ceiling_witness_lifter_v1/canonical/tests/test_terminal_ceiling_witness_lifter_v1.py":"fb73b07792a19ada2ab899cbd96a15420e315e86","capsules/ceiling_witness_lifter_v1/canonical/governance/TERMINAL_CEILING_WITNESS_LIFTER_ACTIVATION_V1.json":"2777a763df1b922bed23b7fa2525df137f15deea","capsules/ceiling_witness_lifter_v1/canonical/governance/OPUS55_TERMINAL_PROOF_PROTOCOLS_V1.json":"eb4bca0fe6a015d49d2854998fbe046c979c7ea9","capsules/ceiling_witness_lifter_v1/canonical/governance/BEHAVIORAL_CONTRACT_REGISTRY_V1.json":"ee187f611a0e82b2de495ee377682f39bc31dd31","capsules/ceiling_witness_lifter_v1/canonical/governance/TOOL_DISCOVERY_T2_T3_OBJECTIVE_TERMINAL_BINDING_V1.json":"6bcabc0a7d0525532ce7b80e132278f7c99caa43","capsules/ceiling_witness_lifter_v1/canonical/governance/TERMINAL_ROUTE_SPECIFIC_EXECUTOR_MANIFEST_V1.json":"c61882d69a66f61b4ea1ce6ad14f86fcefd1f76a","capsules/ceiling_witness_lifter_v1/canonical/verification/TERMINAL_V3_ONE_SHOT_WAVE_RESULT_20261002_V1.json":"bd86b4c53992b47a4a60b64a60ba03db9a442cfc"}'
        run: |
          python - <<'PY'
          import json, os, subprocess
          expected=json.loads(os.environ["EXPECTED_JSON"])
          bad=[]
          for path,want in expected.items():
              got=subprocess.check_output(["git","hash-object",path],text=True).strip()
              if got!=want:
                  bad.append(f"{path}: {got} != {want}")
          if bad:
              raise SystemExit("\n".join(bad))
          print(f"EXACT_BLOB_IDENTITY_PASS {len(expected)}/{len(expected)}")
          PY
      - name: Run ceiling-witness lifter tests
        env:
          PYTHONPATH: capsules/ceiling_witness_lifter_v1
        run: |
          python -m unittest -v canonical.tests.test_terminal_ceiling_witness_lifter_v1
      - name: Assert candidate-only zero-credit governance
        run: |
          python - <<'PY'
          import json
          p="capsules/ceiling_witness_lifter_v1/canonical/governance/TERMINAL_CEILING_WITNESS_LIFTER_ACTIVATION_V1.json"
          d=json.load(open(p,encoding="utf-8"))
          assert d["capability_credit_delta"]==0
          assert d["family_credit_delta"]==0
          assert d["incremental_spend_usd"]==0
          assert "ZERO_PROMOTION_AUTHORITY" in d["status"]
          print("ZERO_CREDIT_CANDIDATE_ONLY_PASS")
          PY
