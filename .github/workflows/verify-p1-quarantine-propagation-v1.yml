name: Verify P1 quarantine propagation v1

on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/p1_quarantine_propagation_v1/**"
      - ".github/workflows/verify-p1-quarantine-propagation-v1.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact P1 quarantine propagation
        run: |
          cd capsules/p1_quarantine_propagation_v1
          export PYTHONPATH=.
          python -m unittest canonical.tests.test_terminal_scope_quarantine_propagation_v1 -v
          python canonical/runtime/terminal_scope_quarantine_propagation_v1.py
