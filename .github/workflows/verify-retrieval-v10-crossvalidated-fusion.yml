name: Verify Retrieval V10 crossvalidated fusion
on:
  push:
    branches:
      - verify/retrieval-v10-crossvalidated-fusion-20261003
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact V10 fusion blobs
        run: |
          test "$(git hash-object canonical/runtime/retrieval_real_hidden_witness_fusion_v2.py)" = "e294d458cdaf7d04a70c559c594eacb3c7587cc0"
          test "$(git hash-object canonical/tests/test_retrieval_real_hidden_witness_fusion_v2.py)" = "13c29e9b32471e4354b8e432e2549c3c9b61e7ed"
          test "$(git hash-object canonical/runtime/retrieval_real_hidden_witness_arena_v1.py)" = "155028296a78fd02dfa7aae6a9e9c74c9e4bc901"
          test "$(git hash-object canonical/governance/RETRIEVAL_REAL_HIDDEN_WITNESS_CATALOG_V1.json)" = "dd7bea1661257a38abcfcb8300795757103b6a63"
          test "$(git hash-object canonical/governance/RETRIEVAL_REAL_TREE_FINGERPRINTS_V1.json)" = "9244a59ad820e25076f09f3e394a60cba1376ac1"
          test "$(git hash-object canonical/governance/RETRIEVAL_REAL_CONTENT_FINGERPRINTS_V1.json)" = "653756e90508fac5f43e087728fd6357609be4cb"
      - run: PYTHONPATH=. python canonical/tests/test_retrieval_real_hidden_witness_fusion_v2.py
      - run: PYTHONPATH=. python canonical/runtime/retrieval_real_hidden_witness_fusion_v2.py | tee fusion-result.json
      - uses: actions/upload-artifact@v4
        with:
          name: retrieval-v10-fusion-result
          path: fusion-result.json
