name: Preflight TB-Science Brain agent on real Harbor
on:
  push:
    branches: ["preflight-tb-science-harbor-agent-v1-20261003"]
    paths:
      - ".github/workflows/preflight-tb-science-brain-agent-real-harbor-v1.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/preflight-tb-science-brain-agent-real-harbor-v1.yml"
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact Harbor release
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir -q 'harbor==0.23.0'
          python - <<'PY'
          import importlib.metadata
          assert importlib.metadata.version("harbor")=="0.23.0"
          PY
      - name: Verify exact merged Brain controller bytes
        run: |
          set -euo pipefail
          C=capsules/brain_pr_1212_tb_science_route
          test "$(git hash-object "$C/canonical/runtime/harbor_science_agent_v1.py")" = "5d6685d66ca04cec5e332993329e997f6e9fe272"
          test "$(git hash-object "$C/canonical/runtime/harbor_command_policy.py")" = "a525773417291c7a4841bf35e1baff5370350d0d"
          test "$(git hash-object "$C/canonical/runtime/harbor_environment_transport.py")" = "ec46f648214a37bb16025d5ef2593efdf59f0d79"
      - name: Bind custom Brain agent to real Harbor API
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/capsules/brain_pr_1212_tb_science_route"
          python - <<'PY'
          from pathlib import Path
          from canonical.runtime import harbor_science_agent_v1 as s
          assert getattr(s.BaseAgent,"__module__","").startswith("harbor."), "FALLBACK_BASE_AGENT_ACTIVE"
          assert getattr(s.AgentCapabilities,"__module__","").startswith("harbor."), "FALLBACK_CAPABILITIES_ACTIVE"
          assert issubclass(s.HarborScienceAgent,s.BaseAgent)
          assert s.HarborScienceAgent.name()=="project-brain-science"
          assert s.HarborScienceAgent(None if False else Path("/tmp/brain-science-logs")).version()=="1.0.0"
          print({
            "status":"PASS",
            "base_agent_module":s.BaseAgent.__module__,
            "custom_agent":f"{s.HarborScienceAgent.__module__}:{s.HarborScienceAgent.__name__}",
          })
          PY
      - name: Resolve exact TB-Science metadata without task content
        run: |
          set -euo pipefail
          if harbor version show terminal-bench-science/terminal-bench-science@0.1.0 --json > /tmp/tbs.json 2>/tmp/tbs.err; then
            :
          elif harbor version show terminal-bench-science/terminal-bench-science@v0.1.0 --json > /tmp/tbs.json 2>/tmp/tbs.err; then
            :
          else
            cat /tmp/tbs.err
            exit 1
          fi
          python - <<'PY'
          import json
          p=json.load(open("/tmp/tbs.json"))
          assert p["package"]=="terminal-bench-science/terminal-bench-science", p
          assert p["type"]=="dataset", p
          assert p["visibility"]=="public", p
          assert p["content_hash"]=="sha256:91531bf50016a7c64f6cc60794a17c64c6b2c14858a8ae0de39ca16f2abd611a", p
          assert "files" not in p and "tasks" not in p, p
          print({
            "schema":"PROJECT_BRAIN_TB_SCIENCE_BRAIN_AGENT_REAL_HARBOR_PREFLIGHT_V1",
            "status":"PASS",
            "package":p["package"],
            "content_hash":p["content_hash"],
            "terminal_case_content_read":0,
            "terminal_results_observed":0,
            "incremental_spend_usd":0,
          })
          PY
      - name: Verify zero-cost Docker carrier and run surface
        run: |
          set -euo pipefail
          docker version >/dev/null
          docker info >/dev/null
          harbor run --help >/tmp/run-help.txt
          grep -qi 'agent' /tmp/run-help.txt
          grep -qi 'dataset' /tmp/run-help.txt
