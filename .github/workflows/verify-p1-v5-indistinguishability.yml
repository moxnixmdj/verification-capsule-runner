name: Verify P1 V5 indistinguishability counterexample
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/p1_v5_indistinguishability/**"
      - ".github/workflows/verify-p1-v5-indistinguishability.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact Brain bytes and information-theoretic counterexample
        run: python capsules/p1_v5_indistinguishability/verify.py
