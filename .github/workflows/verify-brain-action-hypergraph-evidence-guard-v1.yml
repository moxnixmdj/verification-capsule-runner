name: Verify Brain action hypergraph evidence guard v1

on:
  pull_request:
    paths:
      - 'capsules/action_hypergraph_evidence_guard_v1/**'
      - '.github/workflows/verify-brain-action-hypergraph-evidence-guard-v1.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact mirrored Brain blob identities
        env:
          EXPECTED_JSON: '{"capsules/action_hypergraph_evidence_guard_v1/canonical/runtime/action_hypergraph_evidence_guard_v1.py":"2ddc7479b8e6cfc9320713983799f31354b3e855","capsules/action_hypergraph_evidence_guard_v1/canonical/tests/test_action_hypergraph_evidence_guard_v1.py":"b1320448bb23df8cfdc1c14a6943a4cfd61dd048","capsules/action_hypergraph_evidence_guard_v1/canonical/governance/ACTION_HYPERGRAPH_EVIDENCE_GUARD_V1.json":"9301692a1864d4c6612a78e5ee296865fdc7d62b","capsules/action_hypergraph_evidence_guard_v1/canonical/governance/OPUS55_ACCEPTANCE_ACTION_HYPERGRAPH_V1.json":"02090dad6a9a26f4a58c43e99ecfed540e8c7093","capsules/action_hypergraph_evidence_guard_v1/canonical/governance/OBJECTIVE_GATE_FRONTIER_RECONCILIATION_20261002_V2.json":"7ffd14f6ef917fd8d8afc28e9a113946b342374a","capsules/action_hypergraph_evidence_guard_v1/canonical/verification/CURRENT_OBJECTIVE_BINDINGS_PUBLIC_RUNNER_VERIFICATION_20261002_V2.json":"3aa8168fc7f81581eea4085504e4a70205949af9"}'
        run: |
          python - <<'PY'
          import json, os, subprocess
          expected=json.loads(os.environ["EXPECTED_JSON"])
          failures=[]
          for path,want in expected.items():
              got=subprocess.check_output(["git","hash-object",path],text=True).strip()
              if got!=want:
                  failures.append(f"{path}: {got} != {want}")
          if failures:
              raise SystemExit("\n".join(failures))
          print(f"EXACT_BLOB_IDENTITY_PASS {len(expected)}/{len(expected)}")
          PY
      - name: Run evidence guard unit tests
        env:
          PYTHONPATH: capsules/action_hypergraph_evidence_guard_v1
        run: |
          python -m unittest -v canonical.tests.test_action_hypergraph_evidence_guard_v1
      - name: Verify mirrored live hypergraph against exact receipt
        env:
          PYTHONPATH: capsules/action_hypergraph_evidence_guard_v1
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from canonical.runtime.action_hypergraph_evidence_guard_v1 import evaluate
          root=Path("capsules/action_hypergraph_evidence_guard_v1")
          doc=json.loads((root/"canonical/governance/OPUS55_ACCEPTANCE_ACTION_HYPERGRAPH_V1.json").read_text())
          out=evaluate(root,doc)
          print(json.dumps(out,indent=2,sort_keys=True))
          assert out["pass"], out
          assert out["checked"] >= 1, out
          PY
      - name: Assert zero-credit and TB4 remains revoked
        run: |
          python - <<'PY'
          import json
          base="capsules/action_hypergraph_evidence_guard_v1/canonical"
          g=json.load(open(f"{base}/governance/ACTION_HYPERGRAPH_EVIDENCE_GUARD_V1.json",encoding="utf-8"))
          r=json.load(open(f"{base}/governance/OBJECTIVE_GATE_FRONTIER_RECONCILIATION_20261002_V2.json",encoding="utf-8"))
          h=json.load(open(f"{base}/governance/OPUS55_ACCEPTANCE_ACTION_HYPERGRAPH_V1.json",encoding="utf-8"))
          for d in (g,r):
              assert d.get("capability_credit_delta",0)==0
              assert d.get("family_credit_delta",0)==0
              assert d.get("incremental_spend_usd",0)==0
          assert r["decision"]["tb4_stage_c_execution_authorized"] is False
          assert h["attainability_cut"]["reality_execution_authorized"] is False
          assert h["attainability_cut"]["maximum_attainable_successes"]==180
          assert h["attainability_cut"]["required_successes"]==220
          print("ZERO_CREDIT_AND_TB4_REVOCATION_PASS")
          PY
