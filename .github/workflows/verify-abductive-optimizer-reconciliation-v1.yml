name: Verify abductive optimizer reconciliation v1
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/abductive_optimizer_reconciliation_v1/**"
      - ".github/workflows/verify-abductive-optimizer-reconciliation-v1.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact Brain reconciliation blob identities
        run: |
          cd capsules/abductive_optimizer_reconciliation_v1
          python - <<'PY'
          import hashlib,json,pathlib
          m=json.load(open("EXPECTED_BRAIN_BLOBS.json",encoding="utf-8"))
          for src,expected in m["exact_brain_blobs"].items():
              data=pathlib.Path(src).read_bytes()
              actual=hashlib.sha1(f"blob {len(data)}\0".encode()+data).hexdigest()
              assert actual==expected,(src,actual,expected)
          print("exact reconciliation blob identities: PASS")
          PY
      - name: Verify optimizer wiring and unchanged authority
        run: |
          cd capsules/abductive_optimizer_reconciliation_v1
          python - <<'PY'
          import json
          opt=json.load(open("canonical/governance/EXECUTION_FIRST_SELF_PROVING_OPTIMIZER_V1.json",encoding="utf-8"))
          act=json.load(open("canonical/governance/ABDUCTIVE_RESIDUAL_THEOREM_ACTIVATION_V1.json",encoding="utf-8"))
          auth=json.load(open("canonical/governance/CURRENT_TERMINAL_AUTHORITY_V1.json",encoding="utf-8"))
          ver=json.load(open("canonical/verification/ABDUCTIVE_RESIDUAL_THEOREM_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json",encoding="utf-8"))
          marker="ABDUCTIVE_WEAKEST_SUFFICIENT_RESIDUAL_COMPILATION"
          assert opt["execution_ladder"].count(marker)==1
          i=opt["execution_ladder"].index(marker)
          assert i>0 and opt["execution_ladder"][i-1]=="NORMALIZED_PROTOCOL_IMPLICATION_SCOPE_ALGEBRA"
          p=opt["proof_compression_kernels"]
          assert p["abductive_residual_theorem_activation"]=="canonical/governance/ABDUCTIVE_RESIDUAL_THEOREM_ACTIVATION_V1.json"
          assert p["abductive_residual_theorem_runtime"]=="canonical/runtime/abductive_residual_theorem_v1.py"
          assert p["abductive_residual_theorem_verification"]=="canonical/verification/ABDUCTIVE_RESIDUAL_THEOREM_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json"
          assert opt["reality_query_admission"]["abductive_residual_theorem_required_when_verified_finite_implication_graph_available"] is True
          assert act["status"].startswith("ACTIVE_INDEPENDENT_PUBLIC_RUNNER_PASS")
          assert ver["status"].startswith("INDEPENDENT_PUBLIC_RUNNER_PASS")
          assert act["capability_credit_delta"]==0 and act["family_credit_delta"]==0
          assert act["execution_authority"] is False and act["promotion_authority"] is False
          assert auth["truth"]["opus55_acceptance"]=="2/19_PASS__17/19_OPEN"
          assert auth["truth"]["achieved"] is False
          assert auth["atomic_acceptance_frontier"]["proved"]==7
          assert auth["atomic_acceptance_frontier"]["unresolved"]==31
          print("optimizer reconciliation semantics: PASS")
          PY
