name: Verify repaired structured-method AST v2
on:
  pull_request:
    paths:
      - 'verification/structured_ast/**'
      - '.github/workflows/verify-structured-ast-v2-repaired.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python verification/structured_ast/verify.py
