name: Verify delegation acceptance transmutation v1

on:
  pull_request:
    paths:
      - 'capsules/delegation_transmutation_v1/**'
      - '.github/workflows/verify-delegation-acceptance-transmutation-v1.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify exact mirrored Brain blob identities
        run: |
          python - <<'PY'
          import subprocess
          root="capsules/delegation_transmutation_v1"
          exact={
            "canonical/runtime/acceptance_proof_transmuter_v1.py":"0580f9819b5465c9617f0a1e8ff9a96902eedfc6",
            "canonical/governance/OPUS55_TERMINAL_PROOF_PROTOCOLS_V1.json":"eb4bca0fe6a015d49d2854998fbe046c979c7ea9",
            "canonical/governance/OPUS55_ACCEPTANCE_PROOF_TRANSMUTATION_INPUT_V1.json":"96052a6b5178305b37a2526fb25c3f53fa33b9b5",
            "canonical/governance/DELEGATION_ACCEPTANCE_CEILING_WITNESS_V1.json":"cb3b7c4b6c4e1f2a0471c6b6be72c4ca9ebddc80",
            "canonical/verification/DELEGATION_TEMPORAL_PROOF_TRANSPORT_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json":"5278abb7fcaa6b97189b67598c75e4df395e1788",
            "canonical/tests/test_delegation_temporal_ceiling_transmutation_v1.py":"c486ef7e678a0bb8e0c6d4607c1ac9e2cf2de9bc",
          }
          bad=[]
          for rel,want in exact.items():
            p=f"{root}/{rel}"
            got=subprocess.check_output(["git","hash-object",p],text=True).strip()
            if got!=want:
              bad.append(f"{rel}: {got} != {want}")
          if bad:
            raise SystemExit("\n".join(bad))
          print("EXACT_6_BRAIN_BLOBS_PASS")
          PY

      - name: Run exact Brain integration tests
        env:
          PYTHONPATH: capsules/delegation_transmutation_v1
        run: |
          python -m unittest -v canonical.tests.test_delegation_temporal_ceiling_transmutation_v1

      - name: Recompute exact stronger-proof acceptance state
        env:
          PYTHONPATH: capsules/delegation_transmutation_v1
        run: |
          python - <<'PY'
          import json
          from canonical.runtime.acceptance_proof_transmuter_v1 import evaluate
          root="capsules/delegation_transmutation_v1"
          load=lambda p: json.load(open(f"{root}/{p}",encoding="utf-8"))
          protocols=load("canonical/governance/OPUS55_TERMINAL_PROOF_PROTOCOLS_V1.json")
          inp=load("canonical/governance/OPUS55_ACCEPTANCE_PROOF_TRANSMUTATION_INPUT_V1.json")
          witness=load("canonical/governance/DELEGATION_ACCEPTANCE_CEILING_WITNESS_V1.json")
          transport=load("canonical/verification/DELEGATION_TEMPORAL_PROOF_TRANSPORT_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json")
          assert witness["verified"] is True
          assert witness["independent"] is True
          assert transport["public_verifier"]["conclusion"]=="success"
          out=evaluate(protocols,inp)
          assert out["status"]=="PASS", out
          assert out["family_count"]==19, out
          assert out["closed_family_count"]==4, out
          assert out["open_family_count"]==15, out
          closed={r["family"] for r in out["families"] if r["result_status"]=="PASS"}
          assert closed=={
            "EXACT_SYMBOLIC_COMPUTATION",
            "LONG_HORIZON_MEMORY_AND_CONTINUITY",
            "TOOL_DISCOVERY_SELECTION_AND_LEARNING",
            "SUBAGENT_DELEGATION_AND_COORDINATION",
          }, closed
          d=next(r for r in out["families"] if r["family"]=="SUBAGENT_DELEGATION_AND_COORDINATION")
          assert d["closure_mode"]=="ABSOLUTE_DOMINANCE", d
          assert d["witness_id"]=="DELEGATION_TEMPORAL_TERMINAL_CEILING_ABSOLUTE_DOMINANCE_20261002_V1", d
          assert d["witness_reason"]=="THEORETICAL_CEILING_DOMINANCE", d
          assert out["promotion_authority"] is False
          assert out["capability_credit_delta"]==0
          assert out["family_credit_delta"]==0
          print(json.dumps({
            "status":"INDEPENDENT_RECOMPUTE_PASS",
            "family_count":19,
            "closed_family_count":4,
            "open_family_count":15,
            "delegation":d,
          },indent=2,sort_keys=True))
          PY
