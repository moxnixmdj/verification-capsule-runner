name: Probe LiveBench language neutral carriers V1
on:
  pull_request:
    branches: [main]
    paths:
      - verify_livebench_language_carriers_v1.py
      - .github/workflows/probe-livebench-language-carriers-v1.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
      - run: python -m pip install --disable-pip-version-check langdetect==1.0.9
      - run: python verify_livebench_language_carriers_v1.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livebench-language-carriers-v1
          path: livebench_language_carriers_v1.json
          if-no-files-found: error
