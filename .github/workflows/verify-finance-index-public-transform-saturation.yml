name: Verify Finance Index public transform saturation
on:
  pull_request:
    paths:
      - "subject/FINANCE_INDEX_PUBLIC_TRANSFORM_ROUTE_SATURATION_20261004_V1.json"
      - "subject/FINANCE_INDEX_COMPONENT_FLOOR_BOUNDARY_20261004_V1.json"
      - "subject/ROOT2_OWNER_CHANNEL_FANOUT_V2.json"
      - "verify_finance_index_public_transform_saturation.py"
      - ".github/workflows/verify-finance-index-public-transform-saturation.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python verify_finance_index_public_transform_saturation.py
