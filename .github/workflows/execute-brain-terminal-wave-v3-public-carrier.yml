name: Execute Brain terminal wave V3 public carrier
on:
  pull_request:
    branches: [main]
    paths:
      - 'terminal_runs/v3/request.json'
permissions:
  contents: read
jobs:
  terminal-wave:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify frozen load-bearing bytes before any terminal case generation
        env:
          EXPECTED_HASHES: '{"canonical/governance/TERMINAL_WAVE_EXECUTION_AUTHORITY_V1.json":"a4d6ff87c934ad674e10679badca308c8df8ef76","canonical/governance/TERMINAL_ROUTE_SPECIFIC_EXECUTOR_MANIFEST_V1.json":"cd2dabd11fd169ad9b972e976ad474be51cc9e35","canonical/governance/TERMINAL_PARENT_CASE_PRODUCER_MANIFEST_V1.json":"5ff24e390056ba8e980ad3b88116149869ee85ce","canonical/governance/TERMINAL_PARENT_PORTFOLIO_RUNNER_BINDING_V1.json":"5212f5996dbc83e87a308b8c9d9d1d9ed3da5aab","canonical/governance/TERMINAL_PARENT_LAUNCHER_BINDING_V1.json":"8a40fd5139830650adaacd984a9133258292398c","canonical/governance/ACTIVE_TERMINAL_PROOF_BASIS_V1.json":"9c60356ab509a16df5104777f360b9fb18255842","canonical/governance/BEHAVIORAL_CONTRACT_REGISTRY_V1.json":"afa00109031d638fef32cc3fe10be18786605c39","canonical/governance/GLOBAL_TERMINAL_REPLACEMENT_POPULATION_PROTOCOL_V2.json":"d1dc7f28738ba24a3ca5919755e03190fbf30939","canonical/governance/GLOBAL_TERMINAL_SELECTION_KERNEL_V1.json":"669afcde50302e76c1b0a1f6b186aaafa8730515","canonical/verification/TERMINAL_WAVE_LAUNCH_AUTHORITY_HARDENED_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json":"d48a9037b49f309b7c2cdbad7acc77ecf722a2bf","canonical/verification/TERMINAL_PARENT_LAUNCHER_SA_CCR_REBIND_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json":"db27f7965259d5e53b23924791e891fb78f45c4b","canonical/runtime/terminal_parent_portfolio_launcher_v1.py":"d7f20a66f1f534b06ea11782cb350a582c07d985","canonical/runtime/terminal_parent_portfolio_runner_v1.py":"05c9adf60b76a8b2e0ccd139a90c4c7fd9d34449","canonical/runtime/terminal_wave_launch_authority_reducer_v1.py":"0b5b5e8229cc3e5ee950169469811e7576c43514","canonical/runtime/terminal_prequalification_reducer.py":"da929015fafabed2b5a134a2e95b6bff2f47349c","canonical/runtime/direct_route_terminal_executors_v1.py":"28ef55db77ac81e78bd5c67e4d2b39fef131b505","canonical/runtime/cad_t0_route_specific_terminal_executor_v1.py":"72586ea16289fbfc51460bc8abbb0cd9fee652a1","canonical/runtime/saccr_route_specific_terminal_executor_v1.py":"9810e3f9a2dd94dc372b6b9a865510795d0262fd","canonical/runtime/portfolio_multiplex_terminal_instrumentation_v1.py":"dd8fba0f27691002babbc7ad1fc6b65d7bb57282","canonical/runtime/saccr_credit_information_safe_proof.py":"8eb94b8e8b00e3ace662e7fac2e8b6a8f7bb2200","canonical/runtime/saccr_credit_information_safe_candidate.py":"ff2fa256738ffbe5b15bb813a11c82046692b5e8","canonical/runtime/browser_state_information_safe_proof.py":"3723d3233d6058f0a43491e4654a21490f992d1e","canonical/runtime/browser_state_information_safe_candidate.py":"8acf61f21a15a0d3b3e0e5735ebb80e20393e405","canonical/runtime/delegation_whole_scope_proof_v2.py":"928466401b36e4f3b09c517950cc050432a0616f","canonical/runtime/delegation_structural_variety_proof_v3.py":"f5e1f45519278ed2cafa27d23b8602b0a362a492","canonical/runtime/delegation_whole_scope_candidate_v2.py":"f1a93ee66d90093de61dc17c6ebf2e24073df522","canonical/runtime/tool_discovery_information_safe_proof_v2.py":"5e8a953864e13ec76768c3e8920644107c65a644","canonical/runtime/tool_discovery_information_safe_candidate.py":"64c02edd568d95ec5ed54b7b8122183ce5b82e17","canonical/runtime/research_control_information_safe_proof.py":"16c47efee0e0e38f479163d1285d7079798efdaf","canonical/runtime/research_control_information_safe_candidate.py":"cd6bf6e4163bbba64878b856766b1af4372d68bc","canonical/runtime/contract_native_brain_candidate.py":"afc18af1d1da6f25166c6cc57dcbc0cd3070bb85","canonical/runtime/contract_native_proof_suites.py":"0210790c7dd705ef328e1b55d529a30c5c6c3337","canonical/runtime/m0a_raw_source_brain_candidate_v2.py":"0aac96d27068bdad379703c1b0b8a7a32cacb2e2","canonical/runtime/m0a_raw_source_terminal_suite_v2.py":"63b5daacfa5623c38228d41f6a84e548890d252d","canonical/runtime/native_artifact_cross_format_candidate_v1.py":"f3e5090647dd9029ab9f46efd06dc0c0d0addbc3","canonical/runtime/native_artifact_cross_format_proof_v1.py":"904eb61171f5ee775ff7824c1be7778d7acc4a23"}'
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          hashes=json.loads(os.environ['EXPECTED_HASHES'])
          def git_blob(p):
              b=Path(p).read_bytes()
              return hashlib.sha1(b'blob '+str(len(b)).encode()+bytes([0])+b).hexdigest()
          for p,e in sorted(hashes.items()):
              a=git_blob(p)
              assert a==e,(p,e,a)
          req=json.load(open('terminal_runs/v3/request.json'))
          assert req['schema']=='PROJECT_BRAIN_TERMINAL_WAVE_EXECUTION_REQUEST_V3'
          assert req['execution_snapshot_commit']=='821712c059b139f3494723dca6e8d0fc82ee59a4'
          assert req['package_commitment']=='5a347e796d124373b557424a51659e8bb69b854d09da0b407a5b30f109d9467a'
          assert req['post_freeze_beacon']=='36977020853'
          assert req['allow_replay'] is False
          print('FROZEN_LOAD_BEARING_BYTES_PASS')
          PY
      - name: Install verified runtime dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            "pydantic>=2,<3" "cadquery==2.6.1" \
            python-docx openpyxl python-pptx pypdf
      - name: Static preflight without terminal case generation
        run: |
          set -euo pipefail
          PYTHONPATH=.:canonical/runtime python - <<'PY'
          from pathlib import Path
          from canonical.runtime import terminal_parent_portfolio_launcher_v1 as launcher
          from canonical.runtime import terminal_parent_portfolio_runner_v1 as parent
          from canonical.runtime import cad_t0_route_specific_terminal_executor_v1 as cad
          from canonical.runtime import saccr_route_specific_terminal_executor_v1 as saccr
          from canonical.runtime import terminal_wave_launch_authority_reducer_v1 as auth
          checks={
            'launcher':launcher.static_route_preflight(),
            'parent':parent.static_preflight(),
            'cad':cad.static_dependency_preflight(Path('.')),
            'saccr':saccr.static_preflight(Path('.')),
            'authority':auth.evaluate(Path('.')),
          }
          for k,v in checks.items():
              ok=v.get('pass') is True if k!='authority' else v.get('launch_authority') is True
              assert ok,(k,v)
          print('ALL_PRETERMINAL_STATIC_PREFLIGHTS_PASS')
          PY
      - name: Execute immutable one-shot terminal wave
        id: execute
        continue-on-error: true
        env:
          PROJECT_BRAIN_PACKAGE_COMMITMENT: '5a347e796d124373b557424a51659e8bb69b854d09da0b407a5b30f109d9467a'
          PROJECT_BRAIN_POST_FREEZE_BEACON: '36977020853'
        run: |
          set -euo pipefail
          PYTHONPATH=.:canonical/runtime python - <<'PY'
          import json,os
          from pathlib import Path
          from canonical.runtime import terminal_parent_portfolio_launcher_v1 as launcher
          c=os.environ['PROJECT_BRAIN_PACKAGE_COMMITMENT']
          b=os.environ['PROJECT_BRAIN_POST_FREEZE_BEACON']
          out=launcher.execute_wave(commitment=c,beacon=b,root=Path('.'))
          out['frozen_brain_snapshot_commit']='821712c059b139f3494723dca6e8d0fc82ee59a4'
          out['package_commitment']=c
          out['post_freeze_beacon']=b
          out['public_terminal_carrier_run_id']=os.environ.get('GITHUB_RUN_ID')
          Path('terminal_wave_v3_result.json').write_text(json.dumps(out,indent=2,sort_keys=True))
          print(json.dumps(out,sort_keys=True))
          raise SystemExit(0 if out.get('pass') is True else 2)
          PY
      - name: Upload immutable terminal result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brain-terminal-wave-v3-result
          path: terminal_wave_v3_result.json
          if-no-files-found: error
          retention-days: 90
      - name: Enforce immutable terminal verdict
        if: always()
        run: |
          python - <<'PY'
          import json
          d=json.load(open('terminal_wave_v3_result.json'))
          assert d['package_commitment']=='5a347e796d124373b557424a51659e8bb69b854d09da0b407a5b30f109d9467a'
          assert d['post_freeze_beacon']=='36977020853'
          assert d['no_case_replacement'] is True
          assert d['no_tuning_replay'] is True
          assert d['result_to_runtime_feedback_during_wave'] is False
          assert d['terminal_result'] is True
          assert d['pass'] is True,d
          print('BRAIN_TERMINAL_WAVE_V3_PASS')
          PY
