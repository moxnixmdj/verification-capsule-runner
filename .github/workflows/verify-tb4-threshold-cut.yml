name: Verify TB4 conservative threshold cut
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/verify-tb4-threshold-cut.yml'
permissions:
  contents: read
  pull-requests: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify frozen TB4 metric and conservative carrier cut
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git clone -q https://github.com/harbor-framework/terminal-bench.git /tmp/tb4
          git -C /tmp/tb4 checkout -q 1dcda8716784493721921c23e4bc7f7d988b4494
          test "$(git -C /tmp/tb4 rev-parse HEAD)" = "1dcda8716784493721921c23e4bc7f7d988b4494"
          python - <<'PY'
          import hashlib, json, math, os, pathlib, re, shutil, subprocess, tomllib

          root=pathlib.Path('/tmp/tb4')
          metrics=root/'leaderboard/src/leaderboard/core/metrics.py'
          static=root/'leaderboard/src/leaderboard/ci/static_analysis.py'

          def git_blob_sha(path):
              data=path.read_bytes()
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()

          assert git_blob_sha(metrics)=='1b8d56f9e9beb9294c1f78ef3cdc5e8829014f9e'
          assert git_blob_sha(static)=='91e2402e7360ac8a5c5219fe17f027cf2e38a509'

          msrc=metrics.read_text()
          ssrc=static.read_text()
          # Exact frozen metric semantics: a trial succeeds iff reward > 0 and
          # headline accuracy is successful trials / all trials.
          assert 'return bool(reward) and float(reward) > 0' in msrc
          assert 'accuracy = 100.0 * successful / total if total else 0.0' in msrc
          n_tasks=int(re.search(r'^EXPECTED_TASK_COUNT\s*=\s*(\d+)\s*$',ssrc,re.M).group(1))
          min_trials=int(re.search(r'^MIN_TRIALS_PER_TASK\s*=\s*(\d+)\s*$',ssrc,re.M).group(1))
          assert n_tasks==66 and min_trials==5

          host_cpus=os.cpu_count() or 0
          mem_kib=0
          for line in pathlib.Path('/proc/meminfo').read_text().splitlines():
              if line.startswith('MemTotal:'):
                  mem_kib=int(line.split()[1]); break
          host_mem=mem_kib//1024
          host_storage=shutil.disk_usage('/').free//(1024*1024)
          docker_ok=subprocess.run(['docker','version'],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode==0
          compose_ok=subprocess.run(['docker','compose','version'],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode==0
          assert docker_ok and compose_ok

          rows=[]
          for p in sorted((root/'tasks').glob('*/task.toml')):
              d=tomllib.loads(p.read_text())
              env=d.get('environment') or {}
              row={
                  'task':p.parent.name,
                  'cpus':float(env.get('cpus') or 0),
                  'memory_mb':int(env.get('memory_mb') or 0),
                  'storage_mb':int(env.get('storage_mb') or 0),
                  'gpus':int(env.get('gpus') or 0),
              }
              row['compatible']=(row['gpus']==0 and row['cpus']<=host_cpus and row['memory_mb']<=host_mem and row['storage_mb']<=host_storage)
              rows.append(row)
          assert len(rows)==n_tasks

          compatible=[r for r in rows if r['compatible']]
          incompatible=[r for r in rows if not r['compatible']]
          rank24=next(r for r in rows if r['task']=='rs-archive-clone')
          assert rank24['compatible'] is True

          total_slots=n_tasks*min_trials
          target_milli=664
          required_successes=(target_milli*total_slots + 999)//1000
          compatible_slots=len(compatible)*min_trials
          route_feasible=compatible_slots>=required_successes
          assert route_feasible

          # Soundness of the cut: all unexecuted/incompatible slots receive
          # zero success credit. PASS locks only at >= required_successes.
          assert (required_successes-1)/total_slots*100 < 66.4
          assert required_successes/total_slots*100 >= 66.4

          out={
            'schema':'PROJECT_BRAIN_TB4_CONSERVATIVE_THRESHOLD_CUT_PUBLIC_VERIFICATION_V1',
            'frozen_tb4_commit':'1dcda8716784493721921c23e4bc7f7d988b4494',
            'metrics_blob':'1b8d56f9e9beb9294c1f78ef3cdc5e8829014f9e',
            'static_analysis_blob':'91e2402e7360ac8a5c5219fe17f027cf2e38a509',
            'task_count':n_tasks,
            'minimum_trials_per_task':min_trials,
            'full_population_trial_slots':total_slots,
            'target_percent':66.4,
            'required_successes':required_successes,
            'compatible_task_count':len(compatible),
            'compatible_trial_capacity':compatible_slots,
            'incompatible_task_count':len(incompatible),
            'incompatible_tasks':[r['task'] for r in incompatible],
            'rank24_resource_compatible':True,
            'host':{'cpus':host_cpus,'memory_mb':host_mem,'free_storage_mb':host_storage},
            'route_feasible_under_worst_case_zero_for_all_unrun_slots':route_feasible,
            'pass_lock_rule':f'successes >= {required_successes}',
            'fail_lock_rule':f'successes + remaining_executable_slots < {required_successes}',
            'cross_trial_rule':'FIVE_PRECOMMITTED_RESULT_BLIND_TRIALS_PER_TASK__FROZEN_CONFIGURATION__NO_CROSS_TRIAL_TUNING_OR_TASK_SPECIFIC_LEARNING',
            'official_leaderboard_submission_claimed':False,
            'fresh_acceptance_case_executions':0,
            'incremental_spend_usd':0,
            'capability_credit_delta':0,
            'family_credit_delta':0,
          }
          pathlib.Path('/tmp/tb4-threshold-cut.json').write_text(json.dumps(out,sort_keys=True))
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
          python - <<'PY'
          import pathlib
          body=pathlib.Path('/tmp/tb4-threshold-cut.json').read_text()
          pathlib.Path('/tmp/tb4-threshold-cut-comment.md').write_text(
              'TB4_THRESHOLD_CUT_RESULT\n\n```json\n'+body+'\n```\n'
          )
          PY
          gh pr comment "$PR_NUMBER" --repo moxnixmdj/verification-capsule-runner --body-file /tmp/tb4-threshold-cut-comment.md
