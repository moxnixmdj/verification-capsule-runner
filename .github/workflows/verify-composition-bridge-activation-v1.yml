name: Verify composition bridge activation v1
on:
  push:
    branches:
      - "verify-composition-bridge-activation-v1-20261002-1341"
    paths:
      - "capsules/composition_bridge_activation_v1/**"
      - ".github/workflows/verify-composition-bridge-activation-v1.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact activation
        run: |
          cd capsules/composition_bridge_activation_v1
          export PYTHONPATH=.
          python verify_independent.py
