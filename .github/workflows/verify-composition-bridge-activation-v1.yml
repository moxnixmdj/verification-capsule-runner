name: Verify composition bridge activation v1
on:
  pull_request:
    branches: [main]
    paths:
      - 'capsules/composition_bridge_activation_v1/**'
      - '.github/workflows/verify-composition-bridge-activation-v1.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact Brain blobs and activation
        env:
          EXPECTED_JSON: '{"canonical/governance/BEHAVIORAL_CONTRACT_REGISTRY_V1.json":"ee187f611a0e82b2de495ee377682f39bc31dd31","canonical/governance/OPUS55_ACCEPTANCE_PROOF_TRANSMUTATION_INPUT_V1.json":"96052a6b5178305b37a2526fb25c3f53fa33b9b5","canonical/governance/FROZEN_COMPOSITION_COMPONENT_INTERFACE_MANIFEST_V1.json":"9efbf3e81e67fbd15e34be2fcd86fbfc626b246d","canonical/governance/COMPOSITION_BEHAVIORAL_BRIDGE_V1.json":"d6cb17f548493e64ca3d200d51b049412a939ef7","canonical/verification/COMPOSITION_BEHAVIORAL_BRIDGE_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json":"bb9ecf9b34e3a41d8cd9a387fe70d9376accbccc","canonical/governance/COMPOSITION_COMPONENT_PROOF_SLICE_INPUT_V1.json":"adc7db65b20361be54fa26935e36aa88babf373d","canonical/governance/COMPOSITION_BEHAVIORAL_BRIDGE_ACTIVATION_V1.json":"59504f4608f9490022c1aa58214e34191fb0b6e9","canonical/runtime/composition_behavioral_bridge_verifier_v1.py":"d6bfd80bab2742332ceb3c4105e535202ae00b20","canonical/runtime/composition_component_proof_slicer_v1.py":"0e5028d8547bc3e17e7128b6311f734ac30a16d8","canonical/runtime/composition_behavioral_bridge_activation_v1.py":"c1e6f02bcb2e5d4f154e4bf5543d1dab11512c35","canonical/runtime/composition_behavioral_bridge_activation_verifier_v1.py":"55278d01e3815b308b3007885971a4e129d42ed2","canonical/tests/test_composition_behavioral_bridge_activation_v1.py":"7003a2e8c53129af39937f517a4d0c8c14d4e7d1"}'
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path('capsules/composition_bridge_activation_v1')
          expected=json.loads(os.environ['EXPECTED_JSON'])
          for rel,want in sorted(expected.items()):
              data=(root/rel).read_bytes()
              got=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              assert got==want,(rel,got,want)
          print('COMPOSITION_BRIDGE_ACTIVATION_EXACT_BLOBS_PASS',len(expected))
          PY
          cd capsules/composition_bridge_activation_v1
          PYTHONPATH=. python canonical/tests/test_composition_behavioral_bridge_activation_v1.py
          PYTHONPATH=. python canonical/runtime/composition_behavioral_bridge_activation_verifier_v1.py
