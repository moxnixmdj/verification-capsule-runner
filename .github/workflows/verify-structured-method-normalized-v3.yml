name: Verify normalized structured-method v3
on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/runtime/structured_method_normalized_rule_graph_v3.py'
      - 'canonical/runtime/structured_method_normalized_rule_oracle_v3.py'
      - 'canonical/tests/test_structured_method_normalized_rule_oracle_v3.py'
      - '.github/workflows/verify-structured-method-normalized-v3.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Bind exact Brain blobs
        run: |
          test "$(git hash-object canonical/runtime/structured_method_normalized_rule_graph_v3.py)" = "79d3896818b03223348f05adf4fdcd574f6f355e"
          test "$(git hash-object canonical/runtime/structured_method_normalized_rule_oracle_v3.py)" = "5d92b1360fbb1bb27baacc8a04adb3744abf690c"
          test "$(git hash-object canonical/tests/test_structured_method_normalized_rule_oracle_v3.py)" = "f48657d8637eb03b3a0bbc02566d54871b800687"
      - name: Run independent normalized structured-method suite
        run: python -m unittest -v canonical.tests.test_structured_method_normalized_rule_oracle_v3
