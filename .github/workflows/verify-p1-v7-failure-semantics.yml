name: Verify Brain P1 V7 failure semantics
on:
  pull_request:
    paths:
      - "capsules/p1_v7_failure_semantics/**"
      - ".github/workflows/verify-p1-v7-failure-semantics.yml"
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact Brain V7 bytes and V6 counterexample repair
        run: python capsules/p1_v7_failure_semantics/verify.py
