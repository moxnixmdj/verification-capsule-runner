name: Verify Root2 Chartography guard hypergraph v5
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/root2_chartguard_hypergraph_v5/**"
      - ".github/workflows/verify-root2-chartguard-hypergraph-v5.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact candidate blobs
        run: |
          test "$(git hash-object capsules/root2_chartguard_hypergraph_v5/CHARTOGRAPHY_ZERO_SPEND_GUARD_V1.json)" = "567c10202bb94a116ef5dcc396608d1eb15747cd"
          test "$(git hash-object capsules/root2_chartguard_hypergraph_v5/CHARTOGRAPHY_ZERO_SPEND_GUARD_PUBLIC_RUNNER_VERIFICATION_20261004_V1.json)" = "d2eb956d6534bd4748010ee3fec8b12d93795793"
          test "$(git hash-object capsules/root2_chartguard_hypergraph_v5/CHARTOGRAPHY_ZERO_SPEND_GUARD_ACTIVATION_V1.json)" = "43eabccd6c5533b76834ad96d5b9947c03df1c52"
          test "$(git hash-object capsules/root2_chartguard_hypergraph_v5/ROOT2_FIXED_BAR_ROUTE_INVENTORY_V1.json)" = "9f93503d6ee0ac95c63fc7a4dafc1f75f2e48294"
          test "$(git hash-object capsules/root2_chartguard_hypergraph_v5/ROOT2_FROZEN_COMPARATOR_VECTOR_V1.json)" = "b28af5176550aba9e44ffd8ac9fde4fa7ba388bf"
          test "$(git hash-object capsules/root2_chartguard_hypergraph_v5/ROOT2_PROOF_HYPERGRAPH_CURRENT_REBIND_V4.json)" = "8d3f20c8b8379b282f9b03fc73ba82f6f8946fa5"
          test "$(git hash-object capsules/root2_chartguard_hypergraph_v5/CURRENT_ZERO_REALITY_MINIMUM_CUT_V8.json)" = "c6c8353e740cbcde9649512c5b922148617d934a"
          test "$(git hash-object capsules/root2_chartguard_hypergraph_v5/ROOT2_ROOT3_MINIMUM_EXECUTION_FRONTIER_V1.json)" = "dbe0bf4984d9e3ddaa8de52ed2ebb5ccfee55141"
          test "$(git hash-object capsules/root2_chartguard_hypergraph_v5/CURRENT_TERMINAL_AUTHORITY_V1.json)" = "d568125d8fe03641c3ba654a12fb1f1b2bccf42a"
      - name: Verify semantics
        run: python capsules/root2_chartguard_hypergraph_v5/verify.py
