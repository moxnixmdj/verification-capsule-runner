name: Verify Brain Root1 capability acquisition controller v1

on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/root1_capability_acquisition_controller_v1/**"
      - ".github/workflows/verify-brain-root1-capability-acquisition-controller-v1.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile copied Brain Root1 controller
        run: |
          cd capsules/root1_capability_acquisition_controller_v1
          python -m py_compile             canonical/runtime/structural_transfer_v3.py             canonical/runtime/root1_capability_acquisition_controller_v1.py
      - name: Run copied Brain Root1 tests
        run: |
          cd capsules/root1_capability_acquisition_controller_v1
          export PYTHONPATH=.
          python -m unittest canonical.tests.test_root1_capability_acquisition_controller_v1 -v
      - name: Run independent adversarial verifier
        run: |
          cd capsules/root1_capability_acquisition_controller_v1
          export PYTHONPATH=.
          python verify_root1.py
