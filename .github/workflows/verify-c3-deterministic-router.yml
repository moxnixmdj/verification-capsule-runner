name: Verify C3 Deterministic-First Tool Router

on:
  push:
    paths:
      - ".github/workflows/verify-c3-deterministic-router.yml"
      - "cognitive_c3_filtered_probe/**"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify canonical byte identity and contract
        id: verify
        shell: bash
        run: |
          set +e
          {
            set -euo pipefail
            test "$(git hash-object cognitive_c3_filtered_probe/cognitive_tool_router.py)" = "e947d086225aa165895dc5addd4847fb686b3454"
            test "$(git hash-object cognitive_c3_filtered_probe/test_cognitive_tool_router.py)" = "3627d7cf4aea718e6b56edab7f9b84ab04dbb208"
            python cognitive_c3_filtered_probe/test_cognitive_tool_router.py
          } > cognitive_c3_filtered_probe/verify.log 2>&1
          rc=$?
          cat cognitive_c3_filtered_probe/verify.log
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit $rc
      - name: Persist terminal verification receipt
        if: always()
        shell: bash
        env:
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          VERIFY_RC: ${{ steps.verify.outputs.rc }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path("cognitive_c3_filtered_probe")
          status={
            "schema":"PROJECT_BRAIN_C3_TOOL_ROUTER_VERIFICATION_STATUS_V1",
            "workflow_run_id":os.environ["GITHUB_RUN_ID"],
            "head_sha":os.environ["GITHUB_SHA"],
            "verify_outcome":os.environ.get("VERIFY_OUTCOME"),
            "verify_rc":os.environ.get("VERIFY_RC"),
            "terminal_state":"SUCCESS" if os.environ.get("VERIFY_OUTCOME")=="success" else "FAILURE",
            "capability_credit_delta":0
          }
          (p/"verification_status.json").write_text(json.dumps(status,indent=2)+"\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cognitive_c3_filtered_probe/verification_status.json cognitive_c3_filtered_probe/verify.log
          git commit -m "Record C3 router verification status"
          git pull --rebase origin main
          git push
