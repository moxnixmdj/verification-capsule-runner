name: Verify hardened proof atom receipt index v2
on:
  pull_request:
    paths:
      - "capsules/proof_atom_receipt_index_v2_hardened/**"
      - ".github/workflows/verify-proof-atom-receipt-index-v2-hardened.yml"
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact hardened Brain V2 receipt index
        run: python capsules/proof_atom_receipt_index_v2_hardened/verify.py
