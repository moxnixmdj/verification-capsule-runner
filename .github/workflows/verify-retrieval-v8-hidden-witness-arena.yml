name: Verify Retrieval V8 hidden witness arena
on:
  push:
    branches:
      - verify/retrieval-v8-hidden-witness-arena-20261003
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact subject blobs
        run: |
          test "$(git hash-object canonical/governance/RETRIEVAL_REAL_HIDDEN_WITNESS_CATALOG_V1.json)" = "dd7bea1661257a38abcfcb8300795757103b6a63"\n          test "$(git hash-object canonical/governance/RETRIEVAL_REAL_TREE_FINGERPRINTS_V1.json)" = "9244a59ad820e25076f09f3e394a60cba1376ac1"
          test "$(git hash-object canonical/runtime/retrieval_real_hidden_witness_arena_v1.py)" = "d5c88ffd75f6cad6050e9fa3d82f8c42eda155ad"
          test "$(git hash-object canonical/runtime/retrieval_empirical_calibration_v1.py)" = "1e013e2fb01b7eb79a9909f92bed7e25abfef1c3"
          test "$(git hash-object canonical/tests/test_retrieval_real_hidden_witness_arena_v1.py)" = "96d0d215b1443304553a360012e48989d1319397"
      - name: Run arena tests
        run: PYTHONPATH=. python canonical/tests/test_retrieval_real_hidden_witness_arena_v1.py
      - name: Measure real target arena
        run: PYTHONPATH=. python canonical/runtime/retrieval_real_hidden_witness_arena_v1.py > /tmp/arena.json
      - name: Measure empirical calibration
        run: PYTHONPATH=. python canonical/runtime/retrieval_empirical_calibration_v1.py > /tmp/calibration.json
      - name: Print compact metrics
        run: |
          python - <<'PY'
          import json
          a=json.load(open('/tmp/arena.json'))
          c=json.load(open('/tmp/calibration.json'))
          print("ARENA_METRICS="+json.dumps({
            "targets":a["catalog_target_count"],
            "cases":a["case_count"],
            "metrics":a["metrics"],
            "profile_metrics":a["profile_metrics"],
            "conditional_top1_recovery":a["conditional_top1_recovery"],
            "route_top1_correlation":a["route_top1_correlation"],
            "hybrid_top1_misses":a["hybrid_top1_misses"],
            "hybrid_top3_misses":a["hybrid_top3_misses"],
            "worst_hybrid_cases":a["worst_hybrid_cases"][:10]
          },sort_keys=True))
          print("CALIBRATION="+json.dumps(c["calibration"],sort_keys=True))
          PY
