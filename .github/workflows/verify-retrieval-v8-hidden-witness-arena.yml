name: Verify Retrieval V8 hidden witness arena
on:
  push:
    branches:
      - verify/retrieval-v8-hidden-witness-arena-20261003
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact subject blobs
        run: |
          test "$(git hash-object canonical/governance/RETRIEVAL_REAL_HIDDEN_WITNESS_CATALOG_V1.json)" = "dd7bea1661257a38abcfcb8300795757103b6a63"
          test "$(git hash-object canonical/governance/RETRIEVAL_REAL_TREE_FINGERPRINTS_V1.json)" = "9244a59ad820e25076f09f3e394a60cba1376ac1"
          test "$(git hash-object canonical/governance/RETRIEVAL_REAL_CONTENT_FINGERPRINTS_V1.json)" = "653756e90508fac5f43e087728fd6357609be4cb"
          test "$(git hash-object canonical/runtime/retrieval_real_hidden_witness_arena_v1.py)" = "155028296a78fd02dfa7aae6a9e9c74c9e4bc901"
          test "$(git hash-object canonical/runtime/retrieval_empirical_calibration_v1.py)" = "cab6406ab0c85042042ec69f0cf4f6351b6ce12e"
          test "$(git hash-object canonical/tests/test_retrieval_real_hidden_witness_arena_v1.py)" = "208c3665ec8cc46ae2ea0a8e682608c12a615d72"
      - name: Run arena tests
        run: PYTHONPATH=. python canonical/tests/test_retrieval_real_hidden_witness_arena_v1.py
      - name: Measure real target arena
        run: PYTHONPATH=. python canonical/runtime/retrieval_real_hidden_witness_arena_v1.py > /tmp/arena.json
      - name: Measure empirical calibration
        run: PYTHONPATH=. python canonical/runtime/retrieval_empirical_calibration_v1.py > /tmp/calibration.json
      - name: Print compact metrics
        run: |
          python - <<'PY'
          import json
          a=json.load(open('/tmp/arena.json'))
          c=json.load(open('/tmp/calibration.json'))
          print("ARENA_METRICS="+json.dumps({
            "targets":a["catalog_target_count"],
            "cases":a["case_count"],
            "tree_fingerprints":a["query_independent_tree_fingerprint_count"],
            "content_fingerprints":a["bounded_full_content_fingerprint_count"],
            "metrics":a["metrics"],
            "profile_metrics":a["profile_metrics"],
            "monotonic_pooled_candidate_metrics":a["monotonic_pooled_candidate_metrics"],
            "conditional_top1_recovery":a["conditional_top1_recovery"],
            "route_top1_correlation":a["route_top1_correlation"],
            "hybrid_top1_misses":a["hybrid_top1_misses"],
            "hybrid_top3_misses":a["hybrid_top3_misses"],
            "worst_hybrid_cases":a["worst_hybrid_cases"][:10]
          },sort_keys=True))
          print("CALIBRATION="+json.dumps(c["calibration"],sort_keys=True))
          PY
