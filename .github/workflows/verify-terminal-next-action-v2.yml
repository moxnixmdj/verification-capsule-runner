name: Verify terminal next-action compiler v2
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/terminal_next_action_v2/**"
      - ".github/workflows/verify-terminal-next-action-v2.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify terminal next-action v2
        run: |
          cd capsules/terminal_next_action_v2
          export PYTHONPATH=.
          python -m py_compile canonical/runtime/acceptance_ir_compiler_v1.py
          python -m py_compile canonical/runtime/terminal_next_action_compiler_v1.py
          python -m py_compile canonical/runtime/terminal_next_action_compiler_v2.py
          python -m unittest canonical.tests.test_terminal_next_action_compiler_v2 -v
