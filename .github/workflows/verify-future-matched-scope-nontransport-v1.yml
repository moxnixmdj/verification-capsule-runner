name: Verify future matched scope nontransport v1
on:
  pull_request:
    branches: [main]
    paths:
      - 'capsules/future_matched_scope_nontransport_v1/**'
      - '.github/workflows/verify-future-matched-scope-nontransport-v1.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact Brain snapshot and nontransport theorem
        env:
          EXPECTED_JSON: '{"canonical/governance/OPUS55_MATCHED_COMPARATOR_SUPERPORTFOLIO_V1.json":"d9ac894594ebcd2883520f7b7977a3548420541c","canonical/runtime/future_matched_scope_nontransport_v1.py":"8d51b440805b931c2db2bd2df9aed6d917aaac62","canonical/tests/test_future_matched_scope_nontransport_v1.py":"78486c0d366138febca459e0f1c23904f8a08aec"}'
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path('capsules/future_matched_scope_nontransport_v1')
          expected=json.loads(os.environ['EXPECTED_JSON'])
          for rel,want in sorted(expected.items()):
              data=(root/rel).read_bytes()
              got=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              assert got==want,(rel,got,want)
          print('FUTURE_MATCHED_SCOPE_NONTRANSPORT_EXACT_3_OF_3_BLOBS_PASS')
          PY
          cd capsules/future_matched_scope_nontransport_v1
          PYTHONPATH=. python -m unittest canonical.tests.test_future_matched_scope_nontransport_v1 -v
          PYTHONPATH=. python canonical/runtime/future_matched_scope_nontransport_v1.py
