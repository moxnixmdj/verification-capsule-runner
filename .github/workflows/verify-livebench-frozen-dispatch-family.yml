name: Verify LiveBench Frozen Dispatch Family

on:
  pull_request:
    branches:
      - main
    paths:
      - verify_livebench_frozen_dataset_dispatch_family.py
      - .github/workflows/verify-livebench-frozen-dispatch-family.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install footer parser
        run: python -m pip install --disable-pip-version-check --quiet pyarrow==19.0.1
      - name: Verify frozen dispatch family without decoding rows
        run: python verify_livebench_frozen_dataset_dispatch_family.py
      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livebench-frozen-dataset-dispatch-family-receipt
          path: livebench_frozen_dataset_dispatch_family_receipt.json
          if-no-files-found: error
