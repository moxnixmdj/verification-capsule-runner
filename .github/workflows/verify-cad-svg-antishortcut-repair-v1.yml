name: Verify CAD SVG anti-shortcut repair v1

on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/runtime/cad_t0_route_specific_candidate_v1.py'
      - 'canonical/tests/test_cad_t0_source_structure_antishortcut_repair_v1.py'
      - '.github/workflows/verify-cad-svg-antishortcut-repair-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Bind exact repaired Brain blobs
        run: |
          test "$(git hash-object canonical/runtime/cad_t0_route_specific_candidate_v1.py)" = "aa32750b220a023617938b7be9476f6b3aac6704"
          test "$(git hash-object canonical/tests/test_cad_t0_source_structure_antishortcut_repair_v1.py)" = "50a3eeed9b4b0c141f7019e3c569d233d4840b95"
      - name: Re-run exact falsifying render-equivalent mutation
        run: PYTHONPATH=. python canonical/tests/test_cad_t0_source_structure_antishortcut_repair_v1.py
# rerun: exact-current-cad-repair
