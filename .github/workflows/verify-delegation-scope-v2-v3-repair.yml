name: Verify repaired delegation scope Gate V2
on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/governance/TASK_TO_DELEGATION_SCOPE_RELATION_V1.json'
      - 'canonical/governance/TASK_TO_DELEGATION_SCOPE_EQUIVALENT_PROOF_GATE_V2_INPUT.json'
      - 'canonical/tests/test_task_to_delegation_scope_gate_v2.py'
      - '.github/workflows/verify-delegation-scope-v2-v3-repair.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact Brain blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object 'canonical/runtime/scope_equivalent_proof_gate_v2.py')" = '2d05172becfc559de3ff1e4e5623c5180028be1b'
          test "$(git hash-object 'canonical/runtime/delegation_whole_scope_candidate_v2.py')" = '9f2c3aa42352cba66967afb1f8a3f45357833c41'
          test "$(git hash-object 'canonical/runtime/delegation_whole_scope_proof_v2.py')" = '5785b07f482e38acdf7916e5414d90c2c0c305b7'
          test "$(git hash-object 'canonical/runtime/delegation_structural_variety_proof_v3.py')" = 'f5e1f45519278ed2cafa27d23b8602b0a362a492'
          test "$(git hash-object 'canonical/governance/BEHAVIORAL_CONTRACT_REGISTRY_V1.json')" = '771a50d2b12f36c953903e0ec4cbe4a95cd24f84'
          test "$(git hash-object 'canonical/governance/TASK_TO_DELEGATION_SCOPE_RELATION_V1.json')" = 'b4c85f46550be2a5c80161bb2908c7adab5e112a'
          test "$(git hash-object 'canonical/governance/TASK_TO_DELEGATION_SCOPE_EQUIVALENT_PROOF_GATE_V2_INPUT.json')" = 'fed1fcd1d1c7da7842a7daa0f0879e52334942a8'
          test "$(git hash-object 'canonical/tests/test_task_to_delegation_scope_gate_v2.py')" = 'a21904e484b71bb958d0c36d74a80c44acfcfa4f'
      - name: Execute repaired Gate V2 input
        run: python canonical/runtime/scope_equivalent_proof_gate_v2.py canonical/governance/TASK_TO_DELEGATION_SCOPE_EQUIVALENT_PROOF_GATE_V2_INPUT.json
      - name: Execute repaired scope regressions
        run: python -m unittest -v canonical.tests.test_task_to_delegation_scope_gate_v2
