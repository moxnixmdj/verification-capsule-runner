name: Verify Finance Agent zero-spend runtime guard V1

on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/finance_agent_zero_spend_runtime_guard_v1/**"
      - ".github/workflows/verify-finance-agent-zero-spend-runtime-guard-v1.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile copied guard
        run: |
          cd capsules/finance_agent_zero_spend_runtime_guard_v1
          python -m py_compile canonical/runtime/zero_spend_provider_guard_v1.py
      - name: Run copied guard tests
        run: |
          cd capsules/finance_agent_zero_spend_runtime_guard_v1
          export PYTHONPATH=.
          python -m unittest canonical.tests.test_zero_spend_provider_guard_v1 -v
      - name: Run independent adversarial verification
        run: |
          cd capsules/finance_agent_zero_spend_runtime_guard_v1
          export PYTHONPATH=.
          python verify_guard.py
