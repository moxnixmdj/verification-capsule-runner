name: Verify Brain Opus55 residual V9 replay

on:
  pull_request:
    paths:
      - 'capsules/opus55_residual_v9/**'
      - '.github/workflows/verify-brain-opus55-residual-v9.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact mirrored Brain blob identities
        env:
          EXPECTED_JSON: '{"capsules/opus55_residual_v9/canonical/runtime/opus55_acceptance_residual_compiler_v2.py":"cae5bc3bfda9c77d7d7e5151127f55aafddb9522","capsules/opus55_residual_v9/canonical/governance/OPUS55_ACCEPTANCE_PREDICATE_REGISTRY_V2.json":"562536d9ba3f245a6bd24490a1eb3b30f27e0c3a","capsules/opus55_residual_v9/canonical/governance/OPUS55_ACCEPTANCE_PREDICATE_EVIDENCE_BINDINGS_V2.json":"f26d250f86e7f2ce18d790e451fe09bbacecb694","capsules/opus55_residual_v9/canonical/reasoning/2026-10-02_EXACT_OPUS55_ZERO_COST_COMPARATOR_ROUTE_RECONCILIATION_V1.json":"f67e22cee5e6fce1ebfae92ebf0946f78fafcee1","capsules/opus55_residual_v9/canonical/governance/OPUS55_PUBLIC_BAR_SCORE_READINESS_MATRIX_V1.json":"4e59e30461c9ff1bee1a9474627d5fb4074844b2","capsules/opus55_residual_v9/canonical/verification/TB4_ATTAINABILITY_CUT_VERDICT_20261002_V1.json":"a7b0c692251b92819007c581b9fe84b75960cab7"}'
        run: |
          python - <<'PY'
          import json, os, subprocess
          expected=json.loads(os.environ["EXPECTED_JSON"])
          bad=[]
          for path,want in expected.items():
              got=subprocess.check_output(["git","hash-object",path],text=True).strip()
              if got!=want:
                  bad.append(f"{path}: {got} != {want}")
          if bad:
              raise SystemExit("\n".join(bad))
          print(f"EXACT_BLOB_IDENTITY_PASS {len(expected)}/{len(expected)}")
          PY
      - name: Recompute residual from exact current inputs
        env:
          PYTHONPATH: capsules/opus55_residual_v9
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from canonical.runtime.opus55_acceptance_residual_compiler_v2 import evaluate
          root=Path("capsules/opus55_residual_v9")
          load=lambda p: json.loads((root/p).read_text())
          out=evaluate(
            load(Path("canonical/governance/OPUS55_ACCEPTANCE_PREDICATE_REGISTRY_V2.json")),
            load(Path("canonical/governance/OPUS55_ACCEPTANCE_PREDICATE_EVIDENCE_BINDINGS_V2.json")),
            load(Path("canonical/reasoning/2026-10-02_EXACT_OPUS55_ZERO_COST_COMPARATOR_ROUTE_RECONCILIATION_V1.json")),
            load(Path("canonical/governance/OPUS55_PUBLIC_BAR_SCORE_READINESS_MATRIX_V1.json")),
          )
          print(json.dumps(out,indent=2,sort_keys=True))
          assert out["errors"]==[], out
          assert out["receipt_saturation_complete"] is True
          assert out["predicate_count"]==38
          assert out["family_count"]==17
          assert out["proved_predicate_count"]==8
          assert out["open_predicate_count"]==0
          assert out["blocked_predicate_count"]==30
          assert out["refuted_predicate_count"]==0
          assert out["authorized_actions"]==[]
          assert out["terminal_promotion_allowed"] is False
          assert sum(x["state"]=="PROVED" for x in out["families"])==1
          PY
      - name: Preserve TB4 attainability revocation
        run: |
          python - <<'PY'
          import json
          p="capsules/opus55_residual_v9/canonical/verification/TB4_ATTAINABILITY_CUT_VERDICT_20261002_V1.json"
          x=json.load(open(p,encoding="utf-8"))["result"]
          assert x["attainability_state"]=="IMPOSSIBLE"
          assert x["upper_bound_successes"]==180
          assert x["required_successes"]==220
          assert x["reality_execution_authorized"] is False
          print("TB4_180_LT_220_REVOCATION_PASS")
          PY
