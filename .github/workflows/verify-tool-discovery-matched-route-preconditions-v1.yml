name: Verify Tool Discovery matched-route precondition reduction

on:
  pull_request:
    paths:
      - 'capsules/tool_discovery_matched_route_20261003/**'
      - '.github/workflows/verify-tool-discovery-matched-route-preconditions-v1.yml'
  push:
    branches: [main]
    paths:
      - 'capsules/tool_discovery_matched_route_20261003/**'
      - '.github/workflows/verify-tool-discovery-matched-route-preconditions-v1.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact Brain blob identities
        working-directory: capsules/tool_discovery_matched_route_20261003
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          expected = {
            "canonical/governance/TOOLATHLON_VERIFIED_TOOL_DISCOVERY_ROUTE_FREEZE_V1.json": "f55ae78014e1dc6f92f2696d33b7249251047f1c",
            "canonical/governance/OPUS55_TERMINAL_PROOF_PROTOCOLS_V1.json": "62394e5b7d221ec9f69c3458f669e40e253a9d09",
            "canonical/verification/TOOL_DISCOVERY_INFORMATION_SAFE_V2_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json": "d4ce5641e564f330bff32f6ffb7f184e87d8495d",
            "canonical/governance/TOOL_DISCOVERY_MATCHED_ROUTE_PRECONDITION_REDUCTION_V1.json": "b4c1b7b81e162af2d4d9db692a7251e12e526e3f",
            "canonical/runtime/tool_discovery_matched_route_precondition_reducer_v1.py": "b2e5807ecb905e74c1de4c5a6c1fb443a0a0f071",
            "canonical/tests/test_tool_discovery_matched_route_precondition_reducer_v1.py": "e7ba98e37e3493163f96b73e994117f11f521b12",
          }
          for path, want in expected.items():
              data=Path(path).read_bytes()
              got=hashlib.sha1(f"blob {len(data)}\0".encode()+data).hexdigest()
              assert got == want, (path, got, want)
              print(path, got)
          PY
      - name: Run precondition-reduction mutation tests
        working-directory: capsules/tool_discovery_matched_route_20261003
        run: python -m unittest canonical.tests.test_tool_discovery_matched_route_precondition_reducer_v1 -v
      - name: Emit and validate zero-credit reduction verdict
        working-directory: capsules/tool_discovery_matched_route_20261003
        run: |
          python canonical/runtime/tool_discovery_matched_route_precondition_reducer_v1.py > TOOL_DISCOVERY_MATCHED_ROUTE_PRECONDITION_REDUCTION_VERDICT.json
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path("TOOL_DISCOVERY_MATCHED_ROUTE_PRECONDITION_REDUCTION_VERDICT.json").read_text())
          assert j["precondition_reduction_proved"] is True
          assert j["closed_precondition_count"] == 3
          assert j["remaining_precondition_count"] == 3
          assert j["toolathlon_result_observed"] is False
          assert j["tool_discovery_acceptance_granted"] is False
          assert j["new_reality_units_consumed"] == 0
          assert j["capability_credit_delta"] == 0
          assert j["family_credit_delta"] == 0
          assert j["execution_authority"] is False
          assert j["promotion_authority"] is False
          print(json.dumps(j, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tool-discovery-matched-route-precondition-reduction-verdict
          path: capsules/tool_discovery_matched_route_20261003/TOOL_DISCOVERY_MATCHED_ROUTE_PRECONDITION_REDUCTION_VERDICT.json
