name: Verify current executable frontier v2
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/current_executable_frontier_v2/**"
      - ".github/workflows/verify-current-executable-frontier-v2.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify current executable frontier v2
        run: |
          cd capsules/current_executable_frontier_v2
          export PYTHONPATH=.
          python -m py_compile canonical/runtime/abductive_residual_theorem_v1.py
          python -m py_compile canonical/runtime/acceptance_ir_compiler_v1.py
          python -m py_compile canonical/runtime/terminal_next_action_compiler_v1.py
          python -m py_compile canonical/runtime/terminal_next_action_compiler_v2.py
          python -m unittest canonical.tests.test_current_executable_frontier_v2 -v
