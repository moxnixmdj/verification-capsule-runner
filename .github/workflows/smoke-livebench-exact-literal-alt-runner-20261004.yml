name: Smoke LiveBench exact-literal inference on alternate standard runner

on:
  pull_request:
    paths:
      - 'diagnose_livebench_public_inference_capsule_20261004.py'
      - 'subject/livebench_zero_case_resource_fit_20261004/goal_compiler.py'
      - '.github/workflows/smoke-livebench-exact-literal-alt-runner-20261004.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact synthetic inference with standard library only
        run: python diagnose_livebench_public_inference_capsule_20261004.py
