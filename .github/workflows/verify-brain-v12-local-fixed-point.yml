name: Verify Brain V12 local fixed-point activation
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/brain_v12_local_fixed_point/**"
      - ".github/workflows/verify-brain-v12-local-fixed-point.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          cd capsules/brain_v12_local_fixed_point
          python verify_v12.py
