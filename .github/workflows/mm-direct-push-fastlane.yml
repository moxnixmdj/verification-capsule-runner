name: MM direct push fast lane

on:
  push:
    branches:
      - mm-direct-fastlane-v1-20261005
    paths:
      - "subject/mm_sparse_adapter_v1/**"
      - "verify_mm_sparse_adapter_v1.py"
      - ".github/workflows/mm-direct-push-fastlane.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify frozen MM sparse and separable route
        run: python verify_mm_sparse_adapter_v1.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mm-direct-fastlane-verification
          path: mm_sparse_adapter_v1_verification.json
          if-no-files-found: error
