name: Verify matched abductive residual v1
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/matched_abductive_residual_v1/**"
      - ".github/workflows/verify-matched-abductive-residual-v1.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify matched abductive residual
        run: |
          cd capsules/matched_abductive_residual_v1
          export PYTHONPATH=.
          python -m py_compile canonical/runtime/abductive_residual_theorem_v1.py
          python canonical/tests/test_matched_scope_abductive_residual_v1.py
