name: Verify scope-equivalent proof gate
on:
  pull_request:
    branches: [main]
    paths:
      - 'verification/scope_equivalent_proof_gate.py'
      - 'verification/test_scope_equivalent_proof_gate_independent.py'
      - '.github/workflows/verify-scope-equivalent-proof-gate.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Bind exact Brain runtime blob
        run: test "$(git hash-object verification/scope_equivalent_proof_gate.py)" = "a4a60c5d5d967292c84917019e0fb2629ff1c27e"
      - name: Compile
        run: python -m py_compile verification/scope_equivalent_proof_gate.py verification/test_scope_equivalent_proof_gate_independent.py
      - name: Independent tests
        run: cd verification && python -m unittest -v test_scope_equivalent_proof_gate_independent
