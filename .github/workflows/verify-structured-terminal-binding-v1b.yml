name: Verify structured method terminal binding v1b
on:
  pull_request:
    paths:
      - 'verification/structured_terminal_binding.json'
      - 'verification/verify_structured_terminal_binding.py'
      - '.github/workflows/verify-structured-terminal-binding-v1b.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python verification/verify_structured_terminal_binding.py
