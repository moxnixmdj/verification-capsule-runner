name: Verify Brain prewave direct proof preflight
on:
  pull_request:
    branches: [main]
    paths:
      - brain/prewave_direct_proof_preflight.py
      - brain/test_prewave_direct_proof_preflight.py
      - .github/workflows/verify-prewave-direct-proof-preflight.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: cd brain && python -m unittest -v test_prewave_direct_proof_preflight.py
