name: Recompile current Opus55 residual V5
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Recompile exact current residual
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from canonical.runtime.opus55_acceptance_residual_compiler_v3 import evaluate
          def load(p): return json.loads(Path(p).read_text())
          out=evaluate(
            load("canonical/governance/OPUS55_ACCEPTANCE_PREDICATE_REGISTRY_V2.json"),
            load("canonical/governance/OPUS55_ACCEPTANCE_PREDICATE_EVIDENCE_BINDINGS_V2.json"),
            load("canonical/reasoning/2026-10-02_EXACT_OPUS55_ZERO_COST_COMPARATOR_ROUTE_RECONCILIATION_V1.json"),
            load("canonical/governance/OPUS55_PUBLIC_BAR_SCORE_READINESS_MATRIX_V1.json"),
          )
          print(json.dumps(out,indent=2,sort_keys=True))
          assert out["errors"]==[],out
          assert out["receipt_saturation_complete"] is True,out
          assert out["proved_predicate_count"]==11,out
          assert out["open_predicate_count"]+out["blocked_predicate_count"]==27,out
          tb=[a for a in out["authorized_actions"] if a.get("predicate_id")=="CODING_TB4_GE_66_4"]
          assert len(tb)==1,tb
          assert tb[0]["action_class"]=="RUN_PUBLIC_FIXED_BAR",tb
          assert tb[0]["execution_authorized"] is True,tb
          assert not any(b.get("predicate_id")=="CODING_TB4_GE_66_4" for b in out["blocker_certificates"]),out
          row=next(r for r in out["predicates"] if r["predicate_id"]=="CODING_TB4_GE_66_4")
          assert row["state"]=="OPEN",row
          assert out["terminal_promotion_allowed"] is False,out
          assert out["capability_credit_delta"]==0 and out["family_credit_delta"]==0,out
          PY
