name: Verify P1 V5 intervention replay falsification

on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/p1_v5_intervention_replay_falsification/**"
      - ".github/workflows/verify-p1-v5-intervention-replay-falsification.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reproduce exact Brain counterexample
        run: python capsules/p1_v5_intervention_replay_falsification/verify.py
