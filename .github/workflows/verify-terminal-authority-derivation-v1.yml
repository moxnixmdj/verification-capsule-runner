name: Verify terminal authority derivation v1
on:
  pull_request:
    branches: [main]
    paths:
      - 'capsules/terminal_authority_derivation_v1/**'
      - '.github/workflows/verify-terminal-authority-derivation-v1.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Bind exact Brain blobs
        run: |
          set -euo pipefail
          test "$(git hash-object capsules/terminal_authority_derivation_v1/canonical/runtime/terminal_prequalification_reducer.py)" = "7d9a6a3abfc070bb5fa229611f713313905bc838"
          test "$(git hash-object capsules/terminal_authority_derivation_v1/canonical/tests/test_terminal_prequalification_reducer.py)" = "549726d049054ca3a87dcb40820d70720e8642f1"
          test "$(git hash-object capsules/terminal_authority_derivation_v1/canonical/governance/EXACT_FOUR_PORTFOLIO_PREQUALIFICATION_V1.json)" = "a8599fda864d775cb8b892646885b9899bfd8189"
          test "$(git hash-object capsules/terminal_authority_derivation_v1/canonical/governance/BEHAVIORAL_CONTRACT_REGISTRY_V1.json)" = "afa00109031d638fef32cc3fe10be18786605c39"
          test "$(git hash-object capsules/terminal_authority_derivation_v1/canonical/governance/ACTIVE_TERMINAL_PROOF_BASIS_V1.json)" = "411f054140f25c4b0c71dc7287c48893ff550082"
          test "$(git hash-object capsules/terminal_authority_derivation_v1/canonical/governance/GLOBAL_TERMINAL_REPLACEMENT_POPULATION_PROTOCOL_V2.json)" = "026bb89de41938d9a7d40bc0f6c9ff83cd61b8d8"
      - name: Run reducer regressions
        run: cd capsules/terminal_authority_derivation_v1/ && PYTHONPATH=. python -m unittest -v canonical.tests.test_terminal_prequalification_reducer
      - name: Derive live execution authority
        run: cd capsules/terminal_authority_derivation_v1/ && PYTHONPATH=. python -m unittest -v test_live_terminal_authority
