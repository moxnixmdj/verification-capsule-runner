name: Verify terminal authority derivation v1
on:
  pull_request:
    branches: [main]
    paths:
      - 'capsules/terminal_authority_derivation_v1/**'
      - '.github/workflows/verify-terminal-authority-derivation-v1.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Bind exact current Brain blobs
        run: |
          set -euo pipefail
          test "$(git hash-object capsules/terminal_authority_derivation_v1/canonical/runtime/terminal_prequalification_reducer.py)" = "da929015fafabed2b5a134a2e95b6bff2f47349c"
          test "$(git hash-object capsules/terminal_authority_derivation_v1/canonical/tests/test_terminal_prequalification_reducer.py)" = "9b09e96c9bf0340d174b4a752148c0807be9043e"
          test "$(git hash-object capsules/terminal_authority_derivation_v1/canonical/governance/EXACT_FOUR_PORTFOLIO_PREQUALIFICATION_V1.json)" = "d85f90df76db4b6b1650fe40279f33d6a7d9e7b5"
          test "$(git hash-object capsules/terminal_authority_derivation_v1/canonical/governance/BEHAVIORAL_CONTRACT_REGISTRY_V1.json)" = "afa00109031d638fef32cc3fe10be18786605c39"
          test "$(git hash-object capsules/terminal_authority_derivation_v1/canonical/governance/ACTIVE_TERMINAL_PROOF_BASIS_V1.json)" = "2ba39428f0065f0d8739c43935f7026ba6eedcfb"
          test "$(git hash-object capsules/terminal_authority_derivation_v1/canonical/governance/GLOBAL_TERMINAL_REPLACEMENT_POPULATION_PROTOCOL_V2.json)" = "432f1f9122a0a136f71a89eae5c8fb81692e4071"
      - name: Run reducer regressions
        run: cd capsules/terminal_authority_derivation_v1 && PYTHONPATH=. python -m unittest -v canonical.tests.test_terminal_prequalification_reducer
      - name: Derive live execution authority
        run: cd capsules/terminal_authority_derivation_v1 && PYTHONPATH=. python -m unittest -v test_live_terminal_authority
