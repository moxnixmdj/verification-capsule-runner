name: Verify Retrieval V10 source universe and live calibration
on:
  push:
    branches:
      - verify/retrieval-v10-source-universe-live-calibration-20261003
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact V10 source/calibration blobs
        run: |
          test "$(git hash-object canonical/reasoning/2026-10-03_GLOBAL_RETRIEVAL_PUBLIC_SOURCE_CAPABILITY_EVIDENCE_V1.json)" = "ed596ce27d6a3dafb04e2464781495330f185133"
          test "$(git hash-object canonical/governance/GLOBAL_RETRIEVAL_SOURCE_UNIVERSE_V1.json)" = "4f3009eeaa9c5e00dd0ffe3b3400a40b6c0a9224"
          test "$(git hash-object canonical/runtime/retrieval_source_universe_v1.py)" = "e0e627233d28118db916d68031d37d524f2315d9"
          test "$(git hash-object canonical/runtime/global_retrieval_entrypoint_v3.py)" = "bc964cdb6ff684ad9be79aa0752822ce85a26f66"
          test "$(git hash-object canonical/state/retrieval_live_events_v1.jsonl)" = "675bcaa2127e5175655b137ca2614fbf97849ec9"
          test "$(git hash-object canonical/reasoning/2026-10-03_RETRIEVAL_LIVE_CALIBRATION_EPISODES_V2.json)" = "caba71e62bd872374d400b4d2a296aedbdb19316"
          test "$(git hash-object canonical/tests/test_retrieval_source_universe_v1.py)" = "33fb59a3e3fa03d9fcba143c97243df1365c42a9"
          test "$(git hash-object canonical/tests/test_retrieval_live_calibration_v2.py)" = "d8c958e3120c1bb29286e2131c64a199a34e668b"
      - run: PYTHONPATH=. python canonical/tests/test_retrieval_source_universe_v1.py
      - run: PYTHONPATH=. python canonical/tests/test_retrieval_live_calibration_v2.py
      - run: PYTHONPATH=. python canonical/runtime/retrieval_live_event_ledger_v1.py | tee live-calibration-result.json
      - run: PYTHONPATH=. python canonical/runtime/global_retrieval_entrypoint_v3.py | tee entrypoint-v3-result.json
      - uses: actions/upload-artifact@v4
        with:
          name: retrieval-v10-source-live-results
          path: |
            live-calibration-result.json
            entrypoint-v3-result.json
