name: Verify current 27 zero reality frontier V2

on:
  push:
    branches: ["verify/current-27-zero-reality-frontier-v2-20261003-sol"]
    paths:
      - ".github/workflows/verify-current-27-zero-reality-frontier-v2.yml"
      - "capsules/current_27_zero_reality_frontier_v2/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/verify-current-27-zero-reality-frontier-v2.yml"
      - "capsules/current_27_zero_reality_frontier_v2/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact 19 to 17 requirement reduction
        working-directory: capsules/current_27_zero_reality_frontier_v2
        run: |
          set -euo pipefail
          test "$(git hash-object canonical/governance/CURRENT_27_ZERO_REALITY_FRONTIER_V2.json)" = "bab3876a1c4bd6a065d20d42b320df4b4b3fa519"
          test "$(git hash-object canonical/runtime/current_27_zero_reality_frontier_v2.py)" = "6f6183e18f211371deae81ed65ba531fdc1d28c6"
          PYTHONPATH=. python -m canonical.runtime.current_27_zero_reality_frontier_v2 > /tmp/verdict.json
          python - <<'PY'
          import json
          x=json.load(open("/tmp/verdict.json"))
          assert x["pass"] is True, x
          assert x["active_requirement_count"] == 17
          assert x["active_certificate_count"] == 14
          assert x["unresolved_predicates"] == 27
          assert x["acceptance_predicate_delta"] == 0
          assert x["fresh_reality_authority"] is False
          print("CURRENT_27_ZERO_REALITY_FRONTIER_V2_PASS")
          PY
