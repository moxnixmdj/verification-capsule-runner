name: Verify synthesis claim coverage ceiling V2
on:
  pull_request:
    branches: [main]
    paths:
      - "fixtures/synthesis_claim_coverage_ceiling_v2/**"
      - "verify_synthesis_claim_coverage_ceiling_v2.py"
      - ".github/workflows/verify-synthesis-claim-coverage-ceiling-v2.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python verify_synthesis_claim_coverage_ceiling_v2.py
