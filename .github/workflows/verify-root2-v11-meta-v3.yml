name: Verify Root2 V11 adaptive V3 package
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/root2_v11_meta/**"
      - ".github/workflows/verify-root2-v11-meta-v3.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python capsules/root2_v11_meta/verify.py
