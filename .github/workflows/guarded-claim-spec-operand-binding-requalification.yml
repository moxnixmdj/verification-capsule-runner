name: Guarded Claim Spec Operand Binding Requalification
on:
  pull_request:
    branches: [main]
    paths:
      - canonical/runtime/bound_capabilities/objective_claim_operand_binding.py
      - canonical/tests/test_objective_claim_operand_binding.py
      - canonical/runtime/bound_capabilities/generic_evidence_claim_relation.py
      - verify_pr447_claim_spec_operand_binding.py
      - guarded_claim_spec_operand_binding_plan.json
      - .github/workflows/guarded-claim-spec-operand-binding-requalification.yml
permissions:
  contents: write
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Admit once, then run exact authored and independent qualification
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python execution_guard/github_actions_guarded_run_live.py --plan guarded_claim_spec_operand_binding_plan.json --receipt guarded-claim-spec-admission.json
      - name: Upload guarded qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: guarded-claim-spec-operand-binding-evidence
          path: |
            guarded-claim-spec-admission.json
            pr447-claim-spec-operand-binding-report.json
            guarded_claim_spec_operand_binding_plan.json
          if-no-files-found: warn
