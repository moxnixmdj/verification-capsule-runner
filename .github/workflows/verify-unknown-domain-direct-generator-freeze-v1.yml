name: Verify Unknown-Domain direct generator freeze V1

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact generator freeze and zero production boundary
        run: python verify_unknown_domain_direct_generator_freeze_v1.py
