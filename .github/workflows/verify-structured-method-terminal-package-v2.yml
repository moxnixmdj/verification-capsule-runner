name: Verify structured method terminal package V2
on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/runtime/structured_method_normalized_rule_graph_v3.py'
      - 'canonical/runtime/structured_method_normalized_rule_oracle_v3.py'
      - 'canonical/runtime/structured_method_terminal_population_v1.py'
      - 'canonical/governance/STRUCTURED_METHOD_TERMINAL_POPULATION_BINDING_V2.json'
      - 'canonical/governance/STRUCTURED_METHOD_PORTFOLIO_MULTIPLEX_TERMINAL_BINDING_V1.json'
      - 'canonical/runtime/verify_structured_method_terminal_binding_v2.py'
      - 'canonical/runtime/verify_structured_method_multiplex_binding_v1.py'
      - 'canonical/tests/test_structured_method_terminal_binding_v2.py'
      - 'canonical/tests/test_structured_method_terminal_population_v1.py'
      - 'canonical/tests/test_structured_method_multiplex_binding_v1.py'
      - '.github/workflows/verify-structured-method-terminal-package-v2.yml'
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Compile exact package
        run: python3 -m py_compile canonical/runtime/structured_method_normalized_rule_graph_v3.py canonical/runtime/structured_method_normalized_rule_oracle_v3.py canonical/runtime/structured_method_terminal_population_v1.py canonical/runtime/verify_structured_method_terminal_binding_v2.py canonical/runtime/verify_structured_method_multiplex_binding_v1.py
      - name: Verify population, binding, and multiplex
        run: PYTHONPATH=. python3 -m unittest -v canonical.tests.test_structured_method_terminal_population_v1 canonical.tests.test_structured_method_terminal_binding_v2 canonical.tests.test_structured_method_multiplex_binding_v1
      - name: Emit fail-closed package verdict
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from canonical.runtime.verify_structured_method_terminal_binding_v2 import verify
          from canonical.runtime.verify_structured_method_multiplex_binding_v1 import evaluate
          a=verify(Path('.')); b=evaluate(Path('.'))
          assert a['status']=='PASS',a
          assert b['pass'] is True,b
          print(json.dumps({'status':'STRUCTURED_METHOD_PREWAVE_PACKAGE_V2_PASS','terminal_binding':a,'multiplex_binding':b},sort_keys=True))
          PY
