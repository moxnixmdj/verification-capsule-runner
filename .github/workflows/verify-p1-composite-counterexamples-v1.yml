name: Verify P1 composite counterexamples v1

on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/p1_composite_counterexamples_v1/**"
      - ".github/workflows/verify-p1-composite-counterexamples-v1.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reproduce counterexamples independently
        run: |
          cd capsules/p1_composite_counterexamples_v1
          export PYTHONPATH=.
          python -m py_compile canonical/runtime/p1_composite_proof_counterexample_audit_v1.py
          python -m unittest canonical.tests.test_p1_composite_proof_counterexample_audit_v1 -v
          python verify_independent.py
