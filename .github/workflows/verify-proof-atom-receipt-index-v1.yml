name: Verify proof atom receipt index v1
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/proof_atom_receipt_index_v1/**"
      - ".github/workflows/verify-proof-atom-receipt-index-v1.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact Brain blob identities
        run: |
          cd capsules/proof_atom_receipt_index_v1
          python - <<'PY'
          import hashlib,json,pathlib
          m=json.load(open("EXPECTED_BRAIN_BLOBS.json",encoding="utf-8"))
          for src,expected in m["exact_brain_blobs"].items():
              data=pathlib.Path(src).read_bytes()
              actual=hashlib.sha1(f"blob {len(data)}\0".encode()+data).hexdigest()
              assert actual==expected,(src,actual,expected)
          print("exact Brain blob identities: PASS")
          PY
      - name: Verify indexer and adversarial tests
        run: |
          cd capsules/proof_atom_receipt_index_v1
          export PYTHONPATH=.
          python -m py_compile canonical/runtime/canonical_proof_atom_basis_v1.py canonical/runtime/proof_atom_receipt_index_v1.py
          python -m unittest canonical.tests.test_proof_atom_receipt_index_v1 -v
      - name: Execute capsule canonical 40-atom index
        run: |
          cd capsules/proof_atom_receipt_index_v1
          export PYTHONPATH=.
          python canonical/runtime/proof_atom_receipt_index_v1.py > index.json
          python - <<'PY'
          import json
          p=json.load(open("index.json"))
          assert p["status"].startswith("PASS")
          assert p["canonical_atom_count"]==40
          assert p["capability_credit_delta"]==0
          assert p["family_credit_delta"]==0
          assert p["execution_authority"] is False
          assert p["promotion_authority"] is False
          print(json.dumps({
            "canonical_atom_count":p["canonical_atom_count"],
            "scanned_file_count":p["scanned_file_count"],
            "candidate_match_count":p["candidate_match_count"]
          },indent=2))
          PY
