name: Verify current P1 counterexample residual
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run adversarial residual tests
        run: python -m unittest -v canonical.tests.test_p1_current_counterexample_residual_reconciliation_v1
      - name: Run current residual reducer
        run: python canonical/runtime/p1_current_counterexample_residual_reconciliation_v1.py
