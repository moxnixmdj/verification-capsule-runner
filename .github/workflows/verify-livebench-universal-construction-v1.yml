name: Verify LiveBench universal pointwise gate

on:
  push:
    branches:
      - "verify/livebench-universal-construction-20261005-v1"
  pull_request:
    branches: [main]
    paths:
      - "subject/livebench_universal_construction_20261005/**"
      - "verify_livebench_universal_construction_v1.py"
      - ".github/workflows/verify-livebench-universal-construction-v1.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
      - name: Install exact scorer dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check nltk==3.10.3 langdetect==1.0.9 immutabledict==4.2.2
      - name: Checkout exact frozen LiveBench sources and Punkt data
        run: |
          set -euo pipefail
          rm -rf /tmp/LiveBench /tmp/LiveBenchGenerator /tmp/nltk_data_repo /tmp/nltk_data

          git init /tmp/LiveBench
          git -C /tmp/LiveBench remote add origin https://github.com/LiveBench/LiveBench.git
          git -C /tmp/LiveBench fetch --depth 1 origin 8f8e5c381a16e3f24257776edd53471fe86f8091
          git -C /tmp/LiveBench checkout --detach FETCH_HEAD

          git init /tmp/LiveBenchGenerator
          git -C /tmp/LiveBenchGenerator remote add origin https://github.com/LiveBench/LiveBench.git
          git -C /tmp/LiveBenchGenerator fetch --depth 1 origin 686be1e78a0ba8036d7e355bc406e1a265da5292
          git -C /tmp/LiveBenchGenerator checkout --detach FETCH_HEAD

          git clone --filter=blob:none --no-checkout https://github.com/nltk/nltk_data.git /tmp/nltk_data_repo
          git -C /tmp/nltk_data_repo checkout 550b6625bcef1f2abff2ff770a5a0d272c9c6b2a -- packages/tokenizers/punkt.zip packages/tokenizers/punkt_tab.zip
          mkdir -p /tmp/nltk_data/tokenizers
          unzip -q /tmp/nltk_data_repo/packages/tokenizers/punkt.zip -d /tmp/nltk_data/tokenizers
          unzip -q /tmp/nltk_data_repo/packages/tokenizers/punkt_tab.zip -d /tmp/nltk_data/tokenizers
      - name: Re-run independent numeric and discrete exact-checker envelope
        env:
          NLTK_DATA: /tmp/nltk_data
        run: python verify_livebench_composer_v2.py
      - name: Run frozen 356352-state universal pointwise gate
        env:
          NLTK_DATA: /tmp/nltk_data
        run: python verify_livebench_universal_construction_v1.py
      - name: Print receipt
        if: always()
        run: |
          if test -f livebench_universal_construction_verification.json; then
            cat livebench_universal_construction_verification.json
          fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livebench-universal-pointwise-gate
          path: livebench_universal_construction_verification.json
          if-no-files-found: error
