name: Verify Chartography Brain-native legend style binding V1

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/verify-chart-legend-style-binding-v1.yml"
      - "canonical/runtime/bound_capabilities/chart_legend_style_binding_v1.py"
      - "canonical/runtime/bound_capabilities/chart_raster_scene_graph_v1.py"
      - "canonical/runtime/bound_capabilities/image_ocr_tesseract_positioned.py"
      - "canonical/runtime/bound_capabilities/image_ocr_tesseract.py"
      - "canonical/tests/test_chart_legend_style_binding_v1.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Bind exact Brain blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object canonical/runtime/bound_capabilities/chart_legend_style_binding_v1.py)" = "aeed8dc4dc231d1d1a794188974930e9457c7ecb"
          test "$(git hash-object canonical/tests/test_chart_legend_style_binding_v1.py)" = "d517466f2b5319246a4116c0c85c9f4f3598b5cf"
          test "$(git hash-object canonical/runtime/bound_capabilities/chart_raster_scene_graph_v1.py)" = "258999b07287287db2037af777973d5bbb39116d"
          test "$(git hash-object canonical/runtime/bound_capabilities/image_ocr_tesseract_positioned.py)" = "19f3087489ce7f6f935fc7baaebdc8cd672f4b62"
          test "$(git hash-object canonical/runtime/bound_capabilities/image_ocr_tesseract.py)" = "45714d7a0160802d986042910da1c4c6462676e5"
          echo EXACT_BRAIN_BLOBS_BOUND
      - name: Install focused dependency
        run: python -m pip install --disable-pip-version-check --no-input "pillow>=10,<13"
      - name: Compile exact bytes
        run: |
          python -m py_compile canonical/runtime/bound_capabilities/chart_legend_style_binding_v1.py
          python -m py_compile canonical/runtime/bound_capabilities/chart_raster_scene_graph_v1.py
      - name: Focused independent tests
        run: python -m unittest -v canonical.tests.test_chart_legend_style_binding_v1
      - name: Ownership and nonclaim invariants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib
          p=pathlib.Path("canonical/runtime/bound_capabilities/chart_legend_style_binding_v1.py").read_text()
          required=[
            'CAPABILITY_ID = "chart.raster.legend_style_binding.v1"',
            '"external_general_purpose_model_runtime_dependency_count":0',
            '"benchmark_score_authority":False',
            '"NO_SERIES_VALUE_OR_DOMAIN_SEMANTIC_AUTHORITY"',
            '"NO_CHARTOGRAPHY_SCORE_CREDIT"',
          ]
          missing=[x for x in required if x not in p]
          if missing: raise SystemExit("MISSING_INVARIANTS:"+repr(missing))
          forbidden=["Qwen","MiniCPM","Claude","Gemini","openai","anthropic"]
          found=[x for x in forbidden if x.lower() in p.lower()]
          if found: raise SystemExit("GENERAL_PURPOSE_MODEL_REFERENCE_IN_PRODUCER:"+repr(found))
          print("PASS_ZERO_MODEL_LEGEND_STYLE_BINDING_INVARIANTS")
          PY
      - name: Emit receipt
        if: success()
        shell: bash
        run: |
          mkdir -p out
          python - <<'PY'
          import json,pathlib,subprocess
          files={
            "runtime":"canonical/runtime/bound_capabilities/chart_legend_style_binding_v1.py",
            "tests":"canonical/tests/test_chart_legend_style_binding_v1.py",
            "scene_graph":"canonical/runtime/bound_capabilities/chart_raster_scene_graph_v1.py",
            "positioned_ocr":"canonical/runtime/bound_capabilities/image_ocr_tesseract_positioned.py",
          }
          receipt={
            "schema":"PROJECT_BRAIN_CHART_LEGEND_STYLE_BINDING_PUBLIC_VERIFY_V1",
            "status":"PASS__EXACT_BRAIN_BLOBS__FOCUSED_INDEPENDENT_TESTS",
            "brain_pr":4618,
            "brain_head_commit":"ed84b96ac080c8178fc12c646d4745ce615f6fe2",
            "blobs":{k:subprocess.check_output(["git","hash-object",v],text=True).strip() for k,v in files.items()},
            "focused_test_count":7,
            "heldout_chartography_cases_consumed":0,
            "proved":["OUTSIDE_LEGEND_BINDING_WITH_PLOT_STYLE_EVIDENCE","INSIDE_LEGEND_BINDING_WITH_INDEPENDENT_PLOT_STYLE_EVIDENCE","AMBIGUOUS_SWATCH_FAIL_CLOSED","NUMERIC_LABEL_FAIL_CLOSED","NO_PLOT_COUNTERPART_FAIL_CLOSED","LOW_CONFIDENCE_FAIL_CLOSED","ZERO_MODEL_NO_DOMAIN_AUTHORITY"],
            "external_general_purpose_model_runtime_dependency_count":0,
            "incremental_spend_usd":0,
            "chartography_score_credit_delta":0,
            "terminal_credit_delta":0,
            "hard_nonclaims":["NO_SERIES_VALUE_OR_DOMAIN_SEMANTIC_AUTHORITY","NO_PATTERN_OR_DASH_STYLE_BINDING","NO_ROTATED_LABEL_AUTHORITY","NO_CHARTOGRAPHY_SCORE"]
          }
          pathlib.Path("out/receipt.json").write_text(json.dumps(receipt,indent=2,sort_keys=True)+"\n")
          print(json.dumps(receipt,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chart-legend-style-binding-v1-verification
          path: out/receipt.json
          if-no-files-found: warn
