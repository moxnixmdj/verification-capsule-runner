name: Verify synthesis implication residual v1

on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/synthesis_implication_residual_v1/**"
      - ".github/workflows/verify-synthesis-implication-residual-v1.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Recompute exact synthesis implication residual
        run: |
          cd capsules/synthesis_implication_residual_v1
          export PYTHONPATH=.
          python -m py_compile canonical/runtime/protocol_implication_scope_algebra_v1.py
          python -m py_compile canonical/runtime/synthesis_implication_residual_verifier_v1.py
          python canonical/tests/test_synthesis_implication_residual_v1.py
          python canonical/runtime/synthesis_implication_residual_verifier_v1.py
