name: Verify Science planner latency bound

on:
  push:
    branches: ["verify/science-planner-latency-bound-20261003-sol"]
    paths:
      - ".github/workflows/verify-science-planner-latency-bound.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch and bind exact Brain PR1247 bytes
        run: |
          set -euo pipefail
          C=capsules/science_planner_latency_20261003
          test "$(git hash-object "$C/canonical/runtime/harbor_science_planner_v1.py")" = "fe7c0ce885197217774638df382aeb6f68ff38dd"
          test "$(git hash-object "$C/canonical/tests/test_harbor_science_planner_v1.py")" = "b550fc2921eb740ea75579357fd94ed6a4e90862"
          test "$(git hash-object "$C/canonical/governance/TB_SCIENCE_PLANNER_LATENCY_REPAIR_V1.json")" = "fda7fa4c3b611fd0b3e51cf391c8dba2f50e5f47"
          touch "$C/canonical/__init__.py" "$C/canonical/runtime/__init__.py" "$C/canonical/tests/__init__.py"
          python - <<'PY'
          import json
          x=json.load(open("capsules/science_planner_latency_20261003/canonical/governance/TB_SCIENCE_PLANNER_LATENCY_REPAIR_V1.json"))
          assert x["causal_evidence"]["workflow_run_id"]==37106127198
          assert x["causal_evidence"]["exception_message"]=="SCIENCE_PLANNER_LOCAL_ROUTE_FAILED:TimeoutError:timed out"
          assert x["causal_evidence"]["timeout_s"]==180
          assert x["repair"]["candidate_max_items"]==1
          assert x["repair"]["max_tokens"]==384
          assert x["repair"]["benchmark_task_replay"] is False
          assert x["execution_authority"] is False
          PY

      - name: Run exact planner regression tests
        env:
          PYTHONPATH: ${{ github.workspace }}/capsules/science_planner_latency_20261003
        run: python -m unittest -v canonical.tests.test_harbor_science_planner_v1

      - name: Restore exact pinned llama.cpp build
        uses: actions/cache@v4
        with:
          path: llama.cpp
          key: brain-llama-cpp-bec4772f6a2527d371557b5d2032641e5ff7619c-ubuntu2404

      - name: Ensure exact pinned llama.cpp server
        run: |
          set -euo pipefail
          if [ ! -d llama.cpp/.git ]; then
            rm -rf llama.cpp
            git init llama.cpp
            git -C llama.cpp remote add origin https://github.com/ggml-org/llama.cpp.git
            git -C llama.cpp fetch --depth 1 origin bec4772f6a2527d371557b5d2032641e5ff7619c
            git -C llama.cpp checkout --detach FETCH_HEAD
          fi
          test "$(git -C llama.cpp rev-parse HEAD)" = "bec4772f6a2527d371557b5d2032641e5ff7619c"
          cmake -S llama.cpp -B llama.cpp/build -DGGML_CUDA=OFF -DLLAMA_CURL=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build llama.cpp/build -j 2 --target llama-server

      - name: Restore exact pinned Qwen model
        uses: actions/cache@v4
        with:
          path: models/Qwen3.5-9B-M-TS-Q4_K_M.gguf
          key: brain-qwen35-9b-f41c0a0c0e43bf721fb2da29374cd1a97271bac0bab08a9dc42964525e82350c

      - name: Acquire and verify exact Qwen bytes
        run: |
          set -euo pipefail
          mkdir -p models
          if [ ! -f models/Qwen3.5-9B-M-TS-Q4_K_M.gguf ]; then
            curl -L --fail --retry 3 --retry-delay 3 --silent --show-error \
              -o models/Qwen3.5-9B-M-TS-Q4_K_M.gguf \
              'https://huggingface.co/TheStageAI/Qwen3.5-9B-GGUF/resolve/main/Qwen3.5-9B-M-TS-Q4_K_M.gguf?download=true'
          fi
          echo 'f41c0a0c0e43bf721fb2da29374cd1a97271bac0bab08a9dc42964525e82350c  models/Qwen3.5-9B-M-TS-Q4_K_M.gguf' | sha256sum -c -

      - name: Start exact local proposal endpoint
        run: |
          set -euo pipefail
          EXTRA=()
          if llama.cpp/build/bin/llama-server --help 2>&1 | grep -q -- '--reasoning'; then EXTRA+=(--reasoning off); fi
          nohup llama.cpp/build/bin/llama-server \
            -m models/Qwen3.5-9B-M-TS-Q4_K_M.gguf \
            --alias brain-qwen3.5-9b \
            --host 127.0.0.1 --port 8080 -c 8192 -t 4 --parallel 1 \
            --jinja --no-webui "${EXTRA[@]}" > LOCAL_QWEN_SERVER.log 2>&1 &
          ok=0
          for i in $(seq 1 240); do
            if curl -fsS http://127.0.0.1:8080/health > LOCAL_QWEN_HEALTH.json 2>/dev/null; then ok=1; break; fi
            sleep 1
          done
          test "$ok" = 1

      - name: Prove bounded planner completes two conservative synthetic envelopes under unchanged 180s budget
        env:
          PYTHONPATH: ${{ github.workspace }}/capsules/science_planner_latency_20261003
          PROJECT_BRAIN_LOCAL_QWEN_URL: http://127.0.0.1:8080/v1/chat/completions
          PROJECT_BRAIN_LOCAL_QWEN_MODEL: brain-qwen3.5-9b
        run: |
          set -euo pipefail
          mkdir -p evidence
          python - <<'PY' | tee evidence/latency.json
          import json,time
          from canonical.runtime import harbor_science_planner_v1 as p
          prompts=[
            ("long",("Synthetic calibration context. alpha beta gamma delta epsilon zeta eta theta. "*260)+
             "Propose exactly one safe local action using printf to /tmp/sci_probe_a and test -s verification. "
             "Use short requirement IDs. Do not use network, packages, secrets, benchmark data, or claim finish authority."),
            ("complex",("Synthetic research context with independent constraints R01 R02 R03 R04 R05 R06. "
              "Evidence must remain local, deterministic, auditable, and fail-closed. "*190)+
             "Propose exactly one candidate that writes a tiny JSON object to /tmp/sci_probe_b using python stdlib, "
             "then verifies the file parses and contains the required key. No network, packages, secrets, benchmark content, or finish claim.")
          ]
          rows=[]
          for name,prompt in prompts:
            t=time.monotonic()
            out=p.plan(prompt,timeout_s=180)
            elapsed=time.monotonic()-t
            raw=p.normalize_proposal_object(p.extract_json_object(out["text"]))
            assert raw.get("material_requirements"), raw
            cs=raw.get("candidates")
            assert isinstance(cs,list) and len(cs)==1, raw
            assert elapsed < 180, elapsed
            rows.append({"name":name,"elapsed_s":round(elapsed,3),"chars":len(prompt),"proposal_chars":len(out["text"]),"candidate_count":len(cs)})
          receipt={
            "schema":"PROJECT_BRAIN_TB_SCIENCE_PLANNER_LATENCY_BOUND_INDEPENDENT_VERIFICATION_20261003_V1",
            "status":"INDEPENDENT_ZERO_TERMINAL_CONTENT_PASS__TWO_CONSERVATIVE_SYNTHETIC_ENVELOPES_UNDER_180S",
            "brain_pr":1247,
            "brain_head":"04b11ecefad876a9bbdac1089ffa7677b52e1f89",
            "planner_blob":"fe7c0ce885197217774638df382aeb6f68ff38dd",
            "test_blob":"b550fc2921eb740ea75579357fd94ed6a4e90862",
            "repair_blob":"fda7fa4c3b611fd0b3e51cf391c8dba2f50e5f47",
            "cases":rows,
            "terminal_case_content_read":0,
            "terminal_slots_executed":0,
            "incremental_spend_usd":0,
            "execution_authority":False,
            "promotion_authority":False,
            "capability_credit_delta":0,
            "family_credit_delta":0
          }
          print(json.dumps(receipt,sort_keys=True))
          open("evidence/receipt.json","w").write(json.dumps(receipt,indent=2,sort_keys=True)+"\n")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: science-planner-latency-bound-verification
          path: |
            evidence/
            LOCAL_QWEN_HEALTH.json
            LOCAL_QWEN_SERVER.log
          if-no-files-found: warn
