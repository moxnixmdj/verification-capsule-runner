name: Chartography Qwen3-VL 4B GGUF zero-case preflight
# Gap-B observable verification trigger: 2026-10-10 sync-1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/chartography-qwen3vl4b-gguf-zero-case-preflight.yml"
      - "subject/chartography_qwen3vl4b_gguf_fastlane/**"
      - "triggers/chartography_qwen3vl4b_zero_case.txt"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/chartography-qwen3vl4b-gguf-zero-case-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Capture runner envelope and enforce minimums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          NPROC="$(nproc)"
          MEM_KIB="$(awk '/MemTotal:/ {print $2}' /proc/meminfo)"
          MEM_GIB="$(awk -v k="$MEM_KIB" 'BEGIN {printf "%.2f", k/1024/1024}')"
          FREE_KIB="$(df -Pk . | awk 'NR==2 {print $4}')"
          FREE_GIB="$(awk -v k="$FREE_KIB" 'BEGIN {printf "%.2f", k/1024/1024}')"
          printf 'nproc=%s\nmem_gib=%s\nfree_disk_gib=%s\n' "$NPROC" "$MEM_GIB" "$FREE_GIB" | tee out/runner.txt
          test "$NPROC" -ge 4
          test "$MEM_KIB" -ge $((14*1024*1024))

      - name: Install build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build curl ca-certificates time

      - name: Download exact pinned model and projector
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p model out
          REV="594171a9fa4ab2a90f017aa69a323b270cd8d24f"
          BASE="https://huggingface.co/Qwen/Qwen3-VL-4B-Instruct-GGUF/resolve/$REV"
          curl -fL --retry 5 --retry-all-errors "$BASE/Qwen3VL-4B-Instruct-Q4_K_M.gguf?download=true" -o model/model.gguf
          curl -fL --retry 5 --retry-all-errors "$BASE/mmproj-Qwen3VL-4B-Instruct-Q8_0.gguf?download=true" -o model/mmproj.gguf
          echo "ce6a2eac86eeb49ffacb19d580ddd26c0d42cd0a0386b311158a5bf4a6996ffe  model/model.gguf" | sha256sum -c -
          echo "30ba2c7dd3127a4561b6cba9d13d0f711c91bdb38742e2f56d73c8cb596bd06d  model/mmproj.gguf" | sha256sum -c -
          stat -c '%n %s bytes' model/*.gguf | tee out/artifacts.txt
          df -h . | tee -a out/artifacts.txt

      - name: Build exact pinned llama.cpp mtmd CLI
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/ggml-org/llama.cpp.git llama.cpp
          cd llama.cpp
          git checkout --detach a7fb71fab83b474a0892b9a05aaa3a8ddca2729b
          test "$(git rev-parse HEAD)" = "a7fb71fab83b474a0892b9a05aaa3a8ddca2729b"
          cmake -S . -B build -G Ninja -DGGML_NATIVE=OFF -DGGML_CUDA=OFF -DGGML_BLAS=OFF -DLLAMA_CURL=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target llama-mtmd-cli -j 2
          ./build/bin/llama-mtmd-cli --help > ../out/mtmd-help.txt 2>&1

      - name: Generate synthetic image
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import struct
          w=h=64
          row_pad=(4-(w*3)%4)%4
          rows=[]
          for y in range(h):
              row=bytearray()
              for x in range(w):
                  blue_center = 16 <= x < 48 and 16 <= y < 48
                  b,g,r = (255,0,0) if blue_center else (0,0,255)
                  row.extend((b,g,r))
              row.extend(b"\x00"*row_pad)
              rows.append(bytes(row))
          pixels=b"".join(reversed(rows))
          off=54
          size=off+len(pixels)
          hdr=b"BM"+struct.pack("<IHHI",size,0,0,off)
          dib=struct.pack("<IIIHHIIIIII",40,w,h,1,24,0,len(pixels),2835,2835,0,0)
          open("synthetic.bmp","wb").write(hdr+dib+pixels)
          PY
          file synthetic.bmp | tee out/synthetic.txt
          sha256sum synthetic.bmp | tee -a out/synthetic.txt

      - name: Run zero-terminal-case multimodal smoke
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -v ./llama.cpp/build/bin/llama-mtmd-cli \
            -m model/model.gguf \
            --mmproj model/mmproj.gguf \
            --no-mmproj-offload \
            --image synthetic.bmp \
            -p "Describe the image briefly. Mention the two visible colors." \
            -n 48 \
            -t 4 \
            > out/inference.stdout.txt 2> out/inference.stderr.txt
          test -s out/inference.stdout.txt
          cat out/inference.stdout.txt
          grep -Ei 'red|blue' out/inference.stdout.txt
          grep -E 'Maximum resident set size|Elapsed \(wall clock\) time' out/inference.stderr.txt | tee out/resource-summary.txt
          df -h . | tee -a out/resource-summary.txt

      - name: Write machine-readable result
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib, re
          root=pathlib.Path("out")
          result={
            "schema":"PROJECT_BRAIN_CHARTOGRAPHY_QWEN3_VL4B_GGUF_ZERO_CASE_PREFLIGHT_RESULT_V1",
            "terminal_cases_consumed":0,
            "incremental_spend_usd":0,
            "runner":(root/"runner.txt").read_text(errors="replace") if (root/"runner.txt").exists() else None,
            "artifacts":(root/"artifacts.txt").read_text(errors="replace") if (root/"artifacts.txt").exists() else None,
            "stdout":(root/"inference.stdout.txt").read_text(errors="replace") if (root/"inference.stdout.txt").exists() else None,
            "resource_summary":(root/"resource-summary.txt").read_text(errors="replace") if (root/"resource-summary.txt").exists() else None,
          }
          (root/"result.json").write_text(json.dumps(result,indent=2))
          PY

      - name: Upload preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chartography-qwen3vl4b-zero-case-preflight
          path: out/
          if-no-files-found: error
