name: Verify exact current terminal launcher and authority v3
on:
  pull_request:
    branches: [main]
    paths:
      - canonical/**
      - .github/workflows/verify-terminal-parent-portfolio-launcher-v1.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify exact current Brain launch closure blobs
        run: |
          set -euo pipefail
          test "$(git hash-object canonical/runtime/terminal_parent_portfolio_launcher_v1.py)" = "d7f20a66f1f534b06ea11782cb350a582c07d985"
          test "$(git hash-object canonical/tests/test_terminal_parent_portfolio_launcher_v1.py)" = "01996bc0cca7246c0dcfea5b1602c4740fa3e45d"
          test "$(git hash-object canonical/runtime/terminal_wave_launch_authority_reducer_v1.py)" = "0b5b5e8229cc3e5ee950169469811e7576c43514"
          test "$(git hash-object canonical/tests/test_terminal_wave_launch_authority_reducer_v1.py)" = "352a01602259011d8d40f5db2d2b84e4c771a713"
          test "$(git hash-object canonical/runtime/terminal_prequalification_reducer.py)" = "da929015fafabed2b5a134a2e95b6bff2f47349c"
          test "$(git hash-object canonical/tests/test_terminal_prequalification_reducer.py)" = "9b09e96c9bf0340d174b4a752148c0807be9043e"
          test "$(git hash-object canonical/governance/EXACT_FOUR_PORTFOLIO_PREQUALIFICATION_V1.json)" = "5d20073180fdcfd6e36145f4c820271eb1ee275f"
          test "$(git hash-object canonical/governance/BEHAVIORAL_CONTRACT_REGISTRY_V1.json)" = "afa00109031d638fef32cc3fe10be18786605c39"
          test "$(git hash-object canonical/governance/ACTIVE_TERMINAL_PROOF_BASIS_V1.json)" = "9c60356ab509a16df5104777f360b9fb18255842"
          test "$(git hash-object canonical/governance/GLOBAL_TERMINAL_REPLACEMENT_POPULATION_PROTOCOL_V2.json)" = "d1dc7f28738ba24a3ca5919755e03190fbf30939"
          test "$(git hash-object canonical/governance/TERMINAL_ROUTE_SPECIFIC_EXECUTOR_MANIFEST_V1.json)" = "3ffc4484ab4ac69f60258859d5d6e2a7cc8024a7"
          test "$(git hash-object canonical/governance/TERMINAL_PARENT_CASE_PRODUCER_MANIFEST_V1.json)" = "5ff24e390056ba8e980ad3b88116149869ee85ce"
          test "$(git hash-object canonical/governance/TERMINAL_PARENT_LAUNCHER_BINDING_V1.json)" = "e5c8b1721be1482e038982af359e7bd8698619cf"
          test "$(git hash-object canonical/verification/TERMINAL_PARENT_LAUNCHER_SA_CCR_REBIND_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json)" = "db27f7965259d5e53b23924791e891fb78f45c4b"
          test "$(git hash-object canonical/runtime/direct_route_terminal_executors_v1.py)" = "28ef55db77ac81e78bd5c67e4d2b39fef131b505"
          test "$(git hash-object canonical/runtime/saccr_route_specific_terminal_executor_v1.py)" = "9810e3f9a2dd94dc372b6b9a865510795d0262fd"
          test "$(git hash-object canonical/runtime/cad_t0_route_specific_terminal_executor_v1.py)" = "72586ea16289fbfc51460bc8abbb0cd9fee652a1"
          test "$(git hash-object canonical/runtime/portfolio_multiplex_terminal_instrumentation_v1.py)" = "dd8fba0f27691002babbc7ad1fc6b65d7bb57282"
          test "$(git hash-object canonical/runtime/terminal_parent_portfolio_runner_v1.py)" = "05c9adf60b76a8b2e0ccd139a90c4c7fd9d34449"
      - name: Run launcher and authority regressions
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m unittest -v \
            canonical.tests.test_terminal_parent_portfolio_launcher_v1 \
            canonical.tests.test_terminal_wave_launch_authority_reducer_v1 \
            canonical.tests.test_terminal_prequalification_reducer
      - name: Derive exact current prequalification and launch authority
        run: |
          set -euo pipefail
          PYTHONPATH=. python canonical/runtime/terminal_prequalification_reducer.py . > /tmp/preq.json
          PYTHONPATH=. python canonical/runtime/terminal_wave_launch_authority_reducer_v1.py . > /tmp/auth.json
          python - <<'PY'
          import json
          p=json.load(open("/tmp/preq.json"))
          a=json.load(open("/tmp/auth.json"))
          assert p["pass"] is True and p["execution_authority"] is True and p["failed_predicates"] == [], p
          assert a["pass"] is True and a["launch_authority"] is True and a["execution_authority"] is True, a
          assert a["route_count"] == 12 and a["failed_predicates"] == [], a
          assert a["terminal_results_observed"] == 0 and a["fresh_terminal_evidence_consumed"] == 0, a
          print(a["authorization"])
          PY
