name: Verify terminal parent portfolio launcher v1
on:
  pull_request:
    branches: [main]
    paths:
      - canonical/runtime/terminal_parent_portfolio_launcher_v1.py
      - canonical/tests/test_terminal_parent_portfolio_launcher_v1.py
      - .github/workflows/verify-terminal-parent-portfolio-launcher-v1.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify exact Brain launcher blobs
        run: |
          set -euo pipefail
          test "$(git hash-object canonical/runtime/terminal_parent_portfolio_launcher_v1.py)" = "2c4428dd6f4b3cfb2292f4aa629fb7e4e8c8ddd8"
          test "$(git hash-object canonical/tests/test_terminal_parent_portfolio_launcher_v1.py)" = "ce582aebc1aa9ecb36fbe51a004963701ed44e78"
          test "$(git hash-object canonical/runtime/direct_route_terminal_executors_v1.py)" = "28ef55db77ac81e78bd5c67e4d2b39fef131b505"
          test "$(git hash-object canonical/runtime/portfolio_multiplex_terminal_instrumentation_v1.py)" = "dd8fba0f27691002babbc7ad1fc6b65d7bb57282"
          test "$(git hash-object canonical/runtime/cad_t0_route_specific_terminal_executor_v1.py)" = "4a90d2e6838a6b5fd4a8411de3a3dd654e84ec1c"
      - run: PYTHONPATH=. python -m unittest -v canonical.tests.test_terminal_parent_portfolio_launcher_v1
