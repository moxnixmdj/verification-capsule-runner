name: Validate SQLite Parent Carrier Repair

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: read

jobs:
  validate-carrier:
    if: github.head_ref == 'repair/sqlite-parent-carrier-closure-20260930-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact repair head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify exact closure without executing parent task
        run: |
          set -euo pipefail
          test "$(git hash-object canonical/runtime/node_codec_runner.js)" = "2fcda55c8537051315a0d2a939c865f2442e1279"
          test "$(git hash-object canonical/runtime/independent_npm_codec_verifier.py)" = "06fe2fbd7d5169e2cf455868747ac7077466c221"
          test "$(git hash-object canonical/runtime/python_codec_probe.py)" = "fc8b5005a9888422e3cb61f6cf0bd147c740ec84"
          test "$(git hash-object canonical/runtime/verify_pending_cli_binding.py)" = "a6b028c25d79d2dff59c87e3b3ad91d9fe934dae"
          test "$(git hash-object canonical/runtime/promote_pending_binding.py)" = "f100c0d1ce5a4b07af0175035c3122d816459b0b"
          test "$(git hash-object canonical/tasks/PARENT_OPENENDED_SQLITE_BACKUP_CONSISTENCY_REAL_TASK_20260930_001.json)" = "5d09c9eebcb09612525836e7926bdf297f4bad32"
          test "$(git hash-object canonical/astra_runtime/missions/PARENT_OPENENDED_SQLITE_BACKUP_CONSISTENCY_REAL_TASK_20260930_001.json)" = "28eddc71a72a8a9db95ef4b59c49a43246414577"
          node --check canonical/runtime/node_codec_runner.js
          python -m py_compile run_openended_sqlite_taska_once.py
          PYTHONPATH=canonical/runtime python - <<'PY'
          import independent_npm_codec_verifier
          import python_codec_probe
          import verify_pending_cli_binding
          import promote_pending_binding
          print("VERIFIER_CLOSURE_IMPORT_OK")
          PY
          python - <<'PY'
          import json, pathlib
          root=pathlib.Path(".")
          task=json.loads((root/"canonical/tasks/PARENT_OPENENDED_SQLITE_BACKUP_CONSISTENCY_REAL_TASK_20260930_001.json").read_text())
          mission=json.loads((root/"canonical/astra_runtime/missions/PARENT_OPENENDED_SQLITE_BACKUP_CONSISTENCY_REAL_TASK_20260930_001.json").read_text())
          harness=(root/"run_openended_sqlite_taska_once.py").read_text()
          assert mission["mission_id"]==task["task_id"]
          assert mission["goal"]==task["goal_text"]
          assert "runtime.run_goal" not in harness
          assert "canonical/runtime/astra_runtime.py" in harness
          assert "execution_count\":1" in harness
          print("CANONICAL_CLI_PARENT_CARRIER_OK")
          PY
