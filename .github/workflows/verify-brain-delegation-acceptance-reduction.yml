name: Verify Brain delegation acceptance reduction
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/delegation_acceptance_reduction/**"
      - ".github/workflows/verify-brain-delegation-acceptance-reduction.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact Brain blobs
        run: |
          cd capsules/delegation_acceptance_reduction
          python - <<'PY'
          import hashlib,json,pathlib
          m=json.load(open("EXPECTED_BRAIN_BLOBS.json",encoding="utf-8"))
          for src,want in m["exact_brain_blobs"].items():
              b=pathlib.Path(src).read_bytes()
              got=hashlib.sha1(f"blob {len(b)}\0".encode()+b).hexdigest()
              assert got==want,(src,got,want)
          print("exact blobs: PASS")
          PY
      - name: Run hardened acceptance reduction
        run: |
          cd capsules/delegation_acceptance_reduction
          export PYTHONPATH=.
          python canonical/runtime/acceptance_proof_transmuter_v1.py \
            canonical/governance/OPUS55_TERMINAL_PROOF_PROTOCOLS_V1.json \
            --evidence canonical/governance/OPUS55_DELEGATION_SCOPE_COMPLETE_ACCEPTANCE_INPUT_V1.json \
            > delegation-acceptance-verdict.json
      - name: Enforce exact 3-of-19 delta
        run: |
          cd capsules/delegation_acceptance_reduction
          python - <<'PY'
          import json
          v=json.load(open("delegation-acceptance-verdict.json"))
          assert v["status"]=="PASS",v
          assert v["family_count"]==19,v
          assert v["closed_family_count"]==3,v
          assert v["open_family_count"]==16,v
          rows={x["family"]:x for x in v["families"]}
          assert rows["SUBAGENT_DELEGATION_AND_COORDINATION"]["result_status"]=="PASS",rows["SUBAGENT_DELEGATION_AND_COORDINATION"]
          assert rows["SUBAGENT_DELEGATION_AND_COORDINATION"]["closure_mode"]=="ABSOLUTE_DOMINANCE"
          assert rows["SUBAGENT_DELEGATION_AND_COORDINATION"]["witness_reason"]=="THEORETICAL_CEILING_DOMINANCE"
          assert rows["EXACT_SYMBOLIC_COMPUTATION"]["result_status"]=="PASS"
          assert rows["LONG_HORIZON_MEMORY_AND_CONTINUITY"]["result_status"]=="PASS"
          closed={k for k,x in rows.items() if x["result_status"]=="PASS"}
          assert closed=={"EXACT_SYMBOLIC_COMPUTATION","LONG_HORIZON_MEMORY_AND_CONTINUITY","SUBAGENT_DELEGATION_AND_COORDINATION"},closed
          assert v["capability_credit_delta"]==0 and v["family_credit_delta"]==0
          assert v["execution_authority"] is False and v["promotion_authority"] is False
          inp=json.load(open("canonical/governance/OPUS55_DELEGATION_SCOPE_COMPLETE_ACCEPTANCE_INPUT_V1.json"))
          sc=inp["evidence"][0]["scope_completeness"]
          assert sc["basis"]=="UNIVERSAL_FORMAL_SCOPE_PROOF"
          assert sc["verified"] is True and sc["independent"] is True
          assert sc["all_admissible_target_inputs_proved"] is True and sc["formal_completeness"] is True
          prior=json.load(open("canonical/governance/OPUS55_ACCEPTANCE_PREDICATE_EVIDENCE_BINDINGS_V2.json"))
          row=next(x for x in prior["claims"] if x["predicate_id"]=="DELEGATION_TERMINAL_SUCCESS_NONINFERIOR")
          assert row["state"]=="EXTERNAL_BLOCKED"
          assert row["blocker"]=="ABSOLUTE_SCOPE_COMPLETENESS_MISSING"
          print("delegation acceptance reduction 2/19 -> 3/19: PASS")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: delegation-acceptance-verdict
          path: capsules/delegation_acceptance_reduction/delegation-acceptance-verdict.json
