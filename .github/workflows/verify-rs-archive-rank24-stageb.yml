name: Verify rs-archive rank24 Stage-B contract
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run fail-closed Stage-B tests
        run: python -m unittest -v canonical.tests.test_rs_archive_clone_stage_b_verifier_v1
      - name: Evaluate exact frozen artifacts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from canonical.runtime.rs_archive_clone_stage_b_verifier_v1 import evaluate
          def load(p): return json.loads(Path(p).read_text())
          out=evaluate(
            load("canonical/capabilities/opus55/RS_ARCHIVE_CLONE_RANK24_STAGE_B_CONTRACT_V1.json"),
            load("canonical/capabilities/opus55/RS_ARCHIVE_CLONE_RANK24_STAGE_B_SOURCE_ACCOUNTING_V1.json"),
            load("canonical/capabilities/opus55/RS_ARCHIVE_CLONE_RANK24_CONTAMINATION_LEDGER_V1.json"),
            load("canonical/capabilities/opus55/RS_ARCHIVE_CLONE_RANK24_STAGE_A_ADMISSION_V1.json"),
            load("canonical/governance/LEASE_RS_ARCHIVE_CLONE_TB4_STAGE_B_EXPOSURE_20261002_V1.json"),
          )
          print(json.dumps(out,indent=2,sort_keys=True))
          assert out["pass"] is True,out
          assert out["stage_c_lease_eligible"] is True,out
          assert out["task_execution_authorized"] is False,out
          assert out["terminal_verifier_authorized"] is False,out
          assert out["fresh_acceptance_cases_consumed"]==0,out
          PY
