name: Run PR335 Open-Ended SQLite Task A Once
on:
  pull_request:
    branches: [main]
    paths:
      - ARM_PR335_PARENT_OPENENDED_SQLITE_TASKA_20260930_V1
permissions:
  contents: read
jobs:
  execute-once:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      ASTRA_DISABLE_MODEL_PLANNER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Execute frozen PR335 open-ended parent Task A exactly once
        id: parent_task
        continue-on-error: true
        run: python run_pr335_parent_openended_sqlite_taska_once.py
      - name: Upload terminal Task A evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr335-parent-openended-sqlite-taska-terminal
          path: pr335-parent-sqlite-taska-terminal.json
          if-no-files-found: error
      - name: Preserve semantic failure
        if: steps.parent_task.outcome != 'success'
        run: exit 1
