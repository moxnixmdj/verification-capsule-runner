name: Verify shadow crypto escrow v1
on:
  pull_request:
    paths:
      - 'subject/shadow_crypto_escrow_v1/**'
      - 'verify_shadow_crypto_escrow_v1.py'
      - '.github/workflows/verify-shadow-crypto-escrow-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python verify_shadow_crypto_escrow_v1.py
