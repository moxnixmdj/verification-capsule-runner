name: Inventory Arena Opus 5.5 guest routes
on:
  pull_request:
    branches: [main]
    paths:
      - 'verification/arena_opus55_mode_inventory.py'
      - '.github/workflows/inventory-arena-opus55-modes.yml'
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --no-cache-dir playwright
      - run: python -m playwright install --with-deps chromium
      - run: python verification/arena_opus55_mode_inventory.py
