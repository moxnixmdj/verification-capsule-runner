name: Verify delegation structural variety V3
on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/runtime/delegation_whole_scope_candidate_v2.py'
      - 'canonical/runtime/delegation_whole_scope_proof_v2.py'
      - 'canonical/runtime/delegation_structural_variety_proof_v3.py'
      - 'canonical/tests/test_delegation_structural_variety_v3.py'
      - '.github/workflows/verify-delegation-structural-v3.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact Brain blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object 'canonical/runtime/delegation_whole_scope_candidate_v2.py')" = '9f2c3aa42352cba66967afb1f8a3f45357833c41'
          test "$(git hash-object 'canonical/runtime/delegation_whole_scope_proof_v2.py')" = '5785b07f482e38acdf7916e5414d90c2c0c305b7'
          test "$(git hash-object 'canonical/runtime/delegation_structural_variety_proof_v3.py')" = 'f5e1f45519278ed2cafa27d23b8602b0a362a492'
          test "$(git hash-object 'canonical/tests/test_delegation_structural_variety_v3.py')" = 'f9b4e51348547907d03cb7041ebf6cfd5de1323d'
      - name: Execute delegation structural-variety tests
        run: python -m unittest -v canonical.tests.test_delegation_structural_variety_v3
