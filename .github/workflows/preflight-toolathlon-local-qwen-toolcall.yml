name: Preflight Toolathlon local Qwen tool-call compatibility
on:
  push:
    branches: ["preflight-toolathlon-local-qwen-toolcall-20261003-v1"]
    paths:
      - "capsules/toolathlon_local_qwen_toolcall_preflight_v1/**"
      - ".github/workflows/preflight-toolathlon-local-qwen-toolcall.yml"
  pull_request:
    branches: [main]
    paths:
      - "capsules/toolathlon_local_qwen_toolcall_preflight_v1/**"
      - ".github/workflows/preflight-toolathlon-local-qwen-toolcall.yml"
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build exact pinned llama.cpp server
        shell: bash
        run: |
          set -euo pipefail
          git init llama.cpp
          git -C llama.cpp remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C llama.cpp fetch --depth 1 origin bec4772f6a2527d371557b5d2032641e5ff7619c
          git -C llama.cpp checkout --detach FETCH_HEAD
          test "$(git -C llama.cpp rev-parse HEAD)" = "bec4772f6a2527d371557b5d2032641e5ff7619c"
          cmake -S llama.cpp -B llama.cpp/build -DGGML_CUDA=OFF -DLLAMA_CURL=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build llama.cpp/build -j 2 --target llama-server
      - name: Download and verify exact pinned Qwen bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p models
          curl -L --fail --retry 3 --retry-delay 3 --silent --show-error             -o models/Qwen3.5-9B-M-TS-Q4_K_M.gguf             'https://huggingface.co/TheStageAI/Qwen3.5-9B-GGUF/resolve/main/Qwen3.5-9B-M-TS-Q4_K_M.gguf?download=true'
          echo 'f41c0a0c0e43bf721fb2da29374cd1a97271bac0bab08a9dc42964525e82350c  models/Qwen3.5-9B-M-TS-Q4_K_M.gguf' | sha256sum -c -
          test "$(stat -c '%s' models/Qwen3.5-9B-M-TS-Q4_K_M.gguf)" = "5060174144"
      - name: Start exact local endpoint
        shell: bash
        run: |
          set -euo pipefail
          EXTRA=()
          if llama.cpp/build/bin/llama-server --help 2>&1 | grep -q -- '--reasoning'; then EXTRA+=(--reasoning off); fi
          nohup llama.cpp/build/bin/llama-server             -m models/Qwen3.5-9B-M-TS-Q4_K_M.gguf             --alias brain-qwen3.5-9b             --host 127.0.0.1 --port 8080 -c 4096 -t 4 --parallel 1             --jinja --no-webui "${EXTRA[@]}"             > LLAMA_SERVER.log 2>&1 &
          echo $! > LLAMA_SERVER.pid
          ok=0
          for i in $(seq 1 180); do
            if curl -fsS http://127.0.0.1:8080/health > LLAMA_HEALTH.json 2>/dev/null; then ok=1; break; fi
            sleep 1
          done
          test "$ok" = 1
      - name: Prove OpenAI tool-call contract on synthetic request
        shell: bash
        run: |
          set -euo pipefail
          python capsules/toolathlon_local_qwen_toolcall_preflight_v1/test_toolcall.py | tee TOOLCALL_RESULT.json
      - name: Preserve nonterminal preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toolathlon-local-qwen-toolcall-preflight-v1
          path: |
            TOOLCALL_RESULT.json
            LLAMA_HEALTH.json
            LLAMA_SERVER.log
