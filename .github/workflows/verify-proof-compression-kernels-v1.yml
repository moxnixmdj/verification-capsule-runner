name: Verify proof compression kernels v1
on:
  pull_request:
    branches: [main]
    paths:
      - 'capsules/proof_compression_kernels_v1/**'
      - '.github/workflows/verify-proof-compression-kernels-v1.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact Brain blobs and deterministic kernels
        env:
          EXPECTED_JSON: '{"canonical/runtime/epistemic_closure_kernel_v1.py":"6c4672e8fbee098f76f02766d2197fa46968bda0","canonical/tests/test_epistemic_closure_kernel_v1.py":"e91848488501508cadd71d1edbd0f750c1002552","canonical/runtime/composition_component_proof_slicer_v1.py":"0e5028d8547bc3e17e7128b6311f734ac30a16d8","canonical/tests/test_composition_component_proof_slicer_v1.py":"0965e8386b7d07f1eebd575b3e8f28d216dde8f8","canonical/runtime/protocol_implication_scope_algebra_v1.py":"bee693051d043a5438571fd3435733e4878d0002","canonical/tests/test_protocol_implication_scope_algebra_v1.py":"87a501a94600e2367b025101ef63132ef1cc3f6c","canonical/governance/PROOF_COMPRESSION_KERNELS_V1.json":"35fa253b2fff9fea586e1e8cd94dd6c549044e1b"}'
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path('capsules/proof_compression_kernels_v1')
          expected=json.loads(os.environ['EXPECTED_JSON'])
          for rel,want in sorted(expected.items()):
              data=(root/rel).read_bytes()
              got=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              assert got==want,(rel,got,want)
          print('PROOF_COMPRESSION_EXACT_7_OF_7_BLOBS_PASS')
          PY
          cd capsules/proof_compression_kernels_v1
          PYTHONPATH=. python canonical/tests/test_epistemic_closure_kernel_v1.py
          PYTHONPATH=. python canonical/tests/test_composition_component_proof_slicer_v1.py
          PYTHONPATH=. python canonical/tests/test_protocol_implication_scope_algebra_v1.py
          python - <<'PY'
          import json
          from pathlib import Path
          g=json.loads(Path('canonical/governance/PROOF_COMPRESSION_KERNELS_V1.json').read_text())
          assert g['status'].startswith('IMPLEMENTED_CANDIDATE')
          assert g['capability_credit_delta']==0
          assert g['family_credit_delta']==0
          assert g['new_reality_units_consumed']==0
          print('PROOF_COMPRESSION_ZERO_CREDIT_GOVERNANCE_PASS')
          PY
