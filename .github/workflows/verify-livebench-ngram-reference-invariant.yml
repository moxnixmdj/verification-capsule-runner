name: Verify LiveBench NGram Reference Invariant
on:
  pull_request:
    branches:
      - main
    paths:
      - verify_livebench_ngram_reference_invariant.py
      - .github/workflows/verify-livebench-ngram-reference-invariant.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify invariant construction against pinned public rows
        run: python verify_livebench_ngram_reference_invariant.py
      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livebench-ngram-reference-invariant-receipt
          path: livebench_ngram_reference_invariant_receipt.json
          if-no-files-found: error
