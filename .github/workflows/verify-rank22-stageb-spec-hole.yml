name: Verify rank22 Stage-B specification hole
on:
  pull_request:
    branches: [main]
    paths:
      - 'verification/rank22_stage_b_spec_hole/**'
      - '.github/workflows/verify-rank22-stageb-spec-hole.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify source bytes and semantic non-uniqueness
        run: |
          python verification/rank22_stage_b_spec_hole/test_spec_hole.py
