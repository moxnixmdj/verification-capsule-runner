name: Verify LiveBench V7 environment delta
on:
  push:
    branches: ['verify-fast/livebench-v7-env-delta-20261004']
  pull_request:
    paths:
      - 'verify_livebench_v7_env_delta_20261004.py'
      - 'subject/livebench_v7_env_delta_20261004/**'
      - '.github/workflows/verify-livebench-v7-env-delta-20261004.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python verify_livebench_v7_env_delta_20261004.py
