name: Guarded Brain PR550 Threshold Safe Decision Role Qualification
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  qualify:
    if: github.head_ref == 'qualify/brain-pr550-threshold-safe-decision-role-20260930-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Prestart exact frozen candidate closure
        run: |
          set -euo pipefail
          test "$(git hash-object canonical/runtime/bound_capabilities/decision_role_relevance_admission.py)" = "3036734a9f63945a7b76a5ca7cac86618fbc3677"
          test "$(git hash-object canonical/runtime/bound_capabilities/objective_relevance_bm25.py)" = "0abb5225fe9fba2443f2df46b2e41bd1c7dd7436"
          test "$(git hash-object canonical/tests/test_decision_role_relevance_admission.py)" = "dcfd4bf6da7a7ef01d1f21dff541d9b79b3c8f26"
          test "$(git hash-object canonical/runtime/bound_capabilities/objective_claim_operand_binding.py)" = "48fd058430d8d361fc75beced567c7b6d1166531"
          test "$(git hash-object canonical/runtime/bound_capabilities/research_query_focus.py)" = "5403e1dc05716fcfc4f9a91b4534f55dc547eb7f"
          test "$(git hash-object canonical/tests/test_objective_relevance_bm25.py)" = "a4736194a063d05d60f0fc3ca13314956cb5e3de"
          test "$(git hash-object pr550_decision_role_relevance_authority.json)" = "5c9737540e4085dd60f8e967dc7f25475a4d7291"
          test "$(git hash-object verify_brain_pr550_decision_role_relevance.py)" = "dd83ad952e930a9cafdb4477a2f7e4be279b81e0"
          test "$(git hash-object generate_brain_pr550_decision_role_relevance_plan.py)" = "99a6e79e031b47ac9b0c169dfc5aaa9e367b8492"
          python -m py_compile canonical/runtime/bound_capabilities/*.py canonical/tests/test_decision_role_relevance_admission.py canonical/tests/test_objective_relevance_bm25.py verify_brain_pr550_decision_role_relevance.py
      - name: Generate frozen qualification plan
        run: python generate_brain_pr550_decision_role_relevance_plan.py
      - name: Atomically admit and qualify
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python execution_guard/github_actions_guarded_run_live.py --plan brain_pr550_decision_role_relevance_plan.json --receipt brain-pr550-decision-role-guard-receipt.json
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: brain-pr550-threshold-safe-decision-role-qualification
          path: |
            brain-pr550-decision-role-guard-receipt.json
            brain_pr550_decision_role_relevance_plan.json
            pr550-independent-decision-role-report.json
            pr550_decision_role_relevance_authority.json
          if-no-files-found: warn
