name: Verify Unknown-Domain V6 total string route

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - ud-v6-total-string-independent-20261005

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bind immutable event SHA
        run: |
          python - <<'PY'
          import os, subprocess
          head=subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()
          assert head==os.environ["GITHUB_SHA"],(head,os.environ["GITHUB_SHA"])
          print("immutable V6 subject PASS",head)
          PY
      - name: Run independent V6 verifier
        run: PYTHONPATH=. python verification/unknown_domain_v6_total_string_independent.py
      - name: Upload verification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unknown-domain-v6-total-string-receipt
          path: unknown_domain_v6_total_string_receipt.json
          if-no-files-found: error
          retention-days: 7
