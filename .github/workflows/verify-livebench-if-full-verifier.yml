name: Verify LiveBench IF full verifier preflight

on:
  push:
    branches:
      - verify/livebench-if-full-verifier-v1
  pull_request:
    paths:
      - 'capsules/livebench_if_full_verifier/**'
      - '.github/workflows/verify-livebench-if-full-verifier.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-verifier-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NLTK_DATA: /tmp/nltk_data
      LIVEBENCH_ROOT: /tmp/LiveBench
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'

      - name: Pin and verify upstream LiveBench source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$LIVEBENCH_ROOT"
          git clone --filter=blob:none --no-checkout https://github.com/LiveBench/LiveBench.git "$LIVEBENCH_ROOT"
          cd "$LIVEBENCH_ROOT"
          git checkout 8f8e5c381a16e3f24257776edd53471fe86f8091 --             livebench/if_runner/ifbench/evaluation_lib.py             livebench/if_runner/ifbench/instructions.py             livebench/if_runner/ifbench/instructions_registry.py             livebench/if_runner/ifbench/instructions_util.py
          test "$(git hash-object livebench/if_runner/ifbench/evaluation_lib.py)" = "2c7bd1290031dbe4ae0f016c53255f4af0ec645b"
          test "$(git hash-object livebench/if_runner/ifbench/instructions.py)" = "02b2dfeb50f036b89bec3df34522c73f756d8f44"
          test "$(git hash-object livebench/if_runner/ifbench/instructions_registry.py)" = "adfed4832877566e62970257b50c6fa32c302fb2"
          test "$(git hash-object livebench/if_runner/ifbench/instructions_util.py)" = "21b13c7fcfc2c2de01e80c9e7dd222b9bca81342"

      - name: Download and verify frozen primary wheels
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/wheels
          python -m pip download --no-deps --only-binary=:all: -d /tmp/wheels nltk==3.10.3 emoji==2.16.0 syllapy==0.7.2 setuptools==80.9.0 click==8.5.0 cloudpickle==3.1.2 defusedxml==0.7.1 joblib==1.6.0 regex==2026.9.29 tqdm==4.70.1
          echo "ff9598a8e20518ee0d557745890cc4435b9578489e2dcbc69c4f81fa060caf7c  /tmp/wheels/nltk-3.10.3-py3-none-any.whl" | sha256sum -c -
          echo "c4230d80640def9071599ff56b1b5950fe13a2a94c0da98c5deab12431b24330  /tmp/wheels/emoji-2.16.0-py3-none-any.whl" | sha256sum -c -
          echo "198a7413033c32d7b31e21962efb3f284bcea80d3346e954b938ca1ebe6bee20  /tmp/wheels/syllapy-0.7.2-py3-none-any.whl" | sha256sum -c -
          echo "062d34222ad13e0cc312a4c02d73f059e86a4acbfbdea8f8f76b28c99f306922  /tmp/wheels/setuptools-80.9.0-py3-none-any.whl" | sha256sum -c -
          echo "255bc9599cf7748b4b1a446ccc735421bd08a2ae529a8b88597d3de5664ee360  /tmp/wheels/click-8.5.0-py3-none-any.whl" | sha256sum -c -
          echo "9acb47f6afd73f60dc1df93bb801b472f05ff42fa6c84167d25cb206be1fbf4a  /tmp/wheels/cloudpickle-3.1.2-py3-none-any.whl" | sha256sum -c -
          echo "a352e7e428770286cc899e2542b6cdaedb2b4953ff269a210103ec58f6198a61  /tmp/wheels/defusedxml-0.7.1-py2.py3-none-any.whl" | sha256sum -c -
          echo "3dbbf9f6e4b592a2357b854608e980fe6390d131d7a82f011a377ef2ebef7aba  /tmp/wheels/joblib-1.6.0-py3-none-any.whl" | sha256sum -c -
          echo "39ab5894d971f9ac68baa6eca5c50387db579cfcacf36ae8df3feceb1815e6d0  /tmp/wheels/regex-2026.9.29-cp312-cp312-manylinux2014_x86_64.manylinux_2_17_x86_64.manylinux_2_28_x86_64.whl" | sha256sum -c -
          echo "c293e525e6fef9c20e8728fd4612df02a0aa31bb5fe91ecd93e123b1b7bffa73  /tmp/wheels/tqdm-4.70.1-py3-none-any.whl" | sha256sum -c -
          python -m pip install --no-index --find-links=/tmp/wheels /tmp/wheels/nltk-3.10.3-py3-none-any.whl /tmp/wheels/emoji-2.16.0-py3-none-any.whl /tmp/wheels/syllapy-0.7.2-py3-none-any.whl /tmp/wheels/setuptools-80.9.0-py3-none-any.whl

      - name: Materialize frozen NLTK data
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/nltk_data_repo "$NLTK_DATA"
          git clone --filter=blob:none --no-checkout https://github.com/nltk/nltk_data.git /tmp/nltk_data_repo
          cd /tmp/nltk_data_repo
          git checkout 550b6625bcef1f2abff2ff770a5a0d272c9c6b2a --             packages/tokenizers/punkt.zip             packages/tokenizers/punkt_tab.zip             packages/corpora/stopwords.zip             packages/taggers/averaged_perceptron_tagger.zip             packages/taggers/averaged_perceptron_tagger_eng.zip
          test "$(git hash-object packages/tokenizers/punkt.zip)" = "da7ffbd1e6fd6cc5c2f6879c2d4da23c7691944c"
          test "$(git hash-object packages/tokenizers/punkt_tab.zip)" = "5e5ff6137d5ee6025e400d1c3a7b21914c48b635"
          test "$(git hash-object packages/corpora/stopwords.zip)" = "56d35b5d204d64480f71edc0f5f82aebce6730b6"
          test "$(git hash-object packages/taggers/averaged_perceptron_tagger.zip)" = "d5bfb6852aa5d288c8f33b3f0ef0fde343afa405"
          test "$(git hash-object packages/taggers/averaged_perceptron_tagger_eng.zip)" = "b792e19546a5711218a05f4029ef17c8d62cd839"
          mkdir -p "$NLTK_DATA/tokenizers" "$NLTK_DATA/corpora" "$NLTK_DATA/taggers"
          unzip -q packages/tokenizers/punkt.zip -d "$NLTK_DATA/tokenizers"
          unzip -q packages/tokenizers/punkt_tab.zip -d "$NLTK_DATA/tokenizers"
          unzip -q packages/corpora/stopwords.zip -d "$NLTK_DATA/corpora"
          unzip -q packages/taggers/averaged_perceptron_tagger.zip -d "$NLTK_DATA/taggers"
          unzip -q packages/taggers/averaged_perceptron_tagger_eng.zip -d "$NLTK_DATA/taggers"

      - name: Run all 58 synthetic checker mutations
        shell: bash
        run: |
          set -euo pipefail
          python capsules/livebench_if_full_verifier/test_full_verifier.py

      - name: Emit resolved non-terminal environment
        if: always()
        shell: bash
        run: |
          python -m pip freeze | sort
