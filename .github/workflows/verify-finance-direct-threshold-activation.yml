name: Verify Finance direct threshold activation
on:
  pull_request:
    paths:
      - "subject/FINANCE_INDEX_DIRECT_THRESHOLD_ACTIVATION_V1.json"
      - "subject/FINANCE_INDEX_DIRECT_THRESHOLD_THEOREM_V1.json"
      - "subject/FINANCE_INDEX_DIRECT_THRESHOLD_PUBLIC_RUNNER_VERIFICATION_20261004_V1.json"
      - "subject/FINANCE_INDEX_COMPONENTWISE_RESIDUAL_VECTOR_V1.json"
      - "subject/ROOT2_CLOSURE_V2_CURRENT_FRONTIER_V5.json"
      - "subject/TERMINAL_ROOT_CAUSE_STATE_V1.json"
      - "verify_finance_direct_threshold_activation.py"
      - ".github/workflows/verify-finance-direct-threshold-activation.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python verify_finance_direct_threshold_activation.py
