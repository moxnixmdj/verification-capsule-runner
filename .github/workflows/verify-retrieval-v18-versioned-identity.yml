name: Verify Retrieval V18 versioned identity
on:
  push:
    branches:
      - verify/retrieval-v18-versioned-identity-20261004
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact V18 blobs
        run: |
          test "$(git hash-object canonical/runtime/retrieval_live_provider_arena_v18.py)" = "0e43a977dabe967b2df35ca97e9dd3e5144001c5"
          test "$(git hash-object canonical/tests/test_retrieval_live_provider_arena_v18.py)" = "9dddceae094fe401d7bfd31762a6062afbec1764"
      - name: Unit tests
        run: PYTHONPATH=. python canonical/tests/test_retrieval_live_provider_arena_v18.py
      - name: Live V18 probe
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          PYTHONPATH=. python canonical/runtime/retrieval_live_provider_arena_v18.py | tee retrieval-v18-live-result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retrieval-v18-live-result
          path: retrieval-v18-live-result.json
          retention-days: 90
