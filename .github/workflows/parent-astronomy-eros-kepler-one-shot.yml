name: Parent Astronomy Eros Kepler One Shot
on:
  push:
    branches:
      - verify/parent-astronomy-eros-kepler-20260930-v1
permissions:
  contents: read
jobs:
  task:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact current Brain execution bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object canonical/runtime/astra_runtime.py)" = "85642a89a0d99c5e6cafa2e116ffdc24f04de32c"
          test "$(git hash-object canonical/runtime/goal_compiler.py)" = "b446257ca01ee858ada2fb52d0c7925f2ea4391f"
          test "$(git hash-object canonical/runtime/bound_capabilities/jq_query.py)" = "f0b644274c1ffbff7ea5adb81e07e00435d2ac4c"
          test "$(git hash-object canonical/runtime/BOUND_CAPABILITY_REGISTRY_V1.json)" = "b0fb5ccaf73552230dba24f914821d437b1a043d"
          test "$(git hash-object canonical/tasks/PARENT_ASTRONOMY_EROS_KEPLER_REAL_TASK_20260930_001.json)" = "4cb0fbb4f46cf3c7302688197117cbaffe2d3943"
      - name: Execute frozen parent task exactly once
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p canonical/astra_runtime/tmp
          python - <<'PY'
          import importlib.util,json,pathlib,sys,traceback
          root=pathlib.Path(".").resolve()
          task=json.loads((root/"canonical/tasks/PARENT_ASTRONOMY_EROS_KEPLER_REAL_TASK_20260930_001.json").read_text())
          runtime_path=root/"canonical/runtime/astra_runtime.py"
          spec=importlib.util.spec_from_file_location("parent_astronomy_runtime",runtime_path)
          runtime=importlib.util.module_from_spec(spec)
          sys.modules[spec.name]=runtime
          spec.loader.exec_module(runtime)

          mission={"mission_id":task["task_id"],"goal":task["goal_text"]}
          step={
              "adapter":"goal",
              "goal_ref":"goal",
              "verified_initial_facts":["network.http.available"],
              "max_controller_actions":16,
          }
          report={
              "schema":"PROJECT_BRAIN_PARENT_ASTRONOMY_EROS_ONE_SHOT_V1",
              "task_id":task["task_id"],
              "task_sha":"4cb0fbb4f46cf3c7302688197117cbaffe2d3943",
              "model_dependency_count":0,
              "incremental_spend_usd":0,
              "execution_count":1,
          }
          try:
              result=runtime.run_goal(step,mission)
              report["producer_status"]="COMPLETED"
              report["result"]=result
          except Exception as exc:
              report["producer_status"]="BLOCKED"
              report["first_causal_blocker"]=type(exc).__name__+":"+str(exc)
              report["traceback_tail"]=traceback.format_exc().splitlines()[-18:]
          pathlib.Path("PARENT_ASTRONOMY_EROS_ONE_SHOT.json").write_text(
              json.dumps(report,indent=2,sort_keys=True)+"\n",encoding="utf-8"
          )
          PY
      - name: Independent oracle if producer completed
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,math,pathlib,urllib.request,hashlib
          rp=pathlib.Path("PARENT_ASTRONOMY_EROS_ONE_SHOT.json")
          report=json.loads(rp.read_text())
          if report.get("producer_status")!="COMPLETED":
              report["independent_oracle"]={"executed":False,"reason":"PRODUCER_BLOCKED"}
              rp.write_text(json.dumps(report,indent=2,sort_keys=True)+"\n")
              raise SystemExit(0)

          task=json.loads(pathlib.Path("canonical/tasks/PARENT_ASTRONOMY_EROS_KEPLER_REAL_TASK_20260930_001.json").read_text())
          url=task["source"]["url"]
          req=urllib.request.Request(url,headers={"User-Agent":"ProjectBrain-Astronomy-Oracle/1"})
          with urllib.request.urlopen(req,timeout=30) as r:
              data=json.loads(r.read().decode("utf-8"))
          elements=data["orbit"]["elements"]
          named={str(e.get("name") or "").lower():e for e in elements}
          a=float(named["a"]["value"])
          p=float(named["per"]["value"])
          pred=365.2568983*(a**1.5)
          delta=abs(pred-p)
          agreement=delta<=2.0
          out_path=pathlib.Path(task["required_output"]["output_path"])
          if not out_path.is_file():
              report["independent_oracle"]={
                  "executed":True,
                  "verified":False,
                  "failure":"REQUIRED_OUTPUT_MISSING",
                  "a":a,"jpl_period_days":p,"predicted_period_days":pred,
                  "absolute_period_delta_days":delta,"agreement":agreement
              }
          else:
              produced=json.loads(out_path.read_text())
              checks={
                  "semimajor_axis_au": abs(float(produced["semimajor_axis_au"])-a) <= 1e-12,
                  "jpl_period_days": abs(float(produced["jpl_period_days"])-p) <= 1e-9,
                  "predicted_period_days": abs(float(produced["predicted_period_days"])-pred) <= 1e-9,
                  "absolute_period_delta_days": abs(float(produced["absolute_period_delta_days"])-delta) <= 1e-9,
                  "agreement": bool(produced["agreement"]) == bool(agreement),
                  "model_dependency_count": int(produced["model_dependency_count"]) == 0,
              }
              report["independent_oracle"]={
                  "executed":True,
                  "verified":all(checks.values()),
                  "checks":checks,
                  "output_sha256":hashlib.sha256(out_path.read_bytes()).hexdigest(),
              }
          rp.write_text(json.dumps(report,indent=2,sort_keys=True)+"\n")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: parent-astronomy-eros-one-shot
          path: |
            PARENT_ASTRONOMY_EROS_ONE_SHOT.json
            canonical/astra_runtime/tmp/PARENT_ASTRONOMY_EROS_KEPLER_RESULT.json
            canonical/astra_runtime/tmp/PARENT_ASTRONOMY_EROS_A.json
            canonical/astra_runtime/tmp/PARENT_ASTRONOMY_EROS_PERIOD.json
          if-no-files-found: ignore
      - name: Fail closed if blocked or oracle failed
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open("PARENT_ASTRONOMY_EROS_ONE_SHOT.json"))
          assert r.get("producer_status")=="COMPLETED",r
          assert (r.get("independent_oracle") or {}).get("verified") is True,r
          print("PARENT_ASTRONOMY_EROS_ONE_SHOT_VERIFIED")
          PY
