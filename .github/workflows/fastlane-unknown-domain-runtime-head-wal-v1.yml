          assert 'current_git_head()' in launcher
          assert 'PRODUCTION_SANITIZED_RESULT_WRITE_AHEAD' in launcher
          assert 'result_sha256' in launcher
          assert 'put_result(' in launcher
          assert launcher.index('PRODUCTION_SANITIZED_RESULT_WRITE_AHEAD') < launcher.rindex('put_result(')
          print("immutable event SHA + runtime HEAD + write-ahead result invariants PASS")
          PY
