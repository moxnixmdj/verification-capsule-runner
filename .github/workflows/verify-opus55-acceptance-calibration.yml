name: Verify Opus 5.5 acceptance calibration
on:
  pull_request:
    branches: [main]
    paths:
      - 'verification/opus55_acceptance_calibration/**'
      - '.github/workflows/verify-opus55-acceptance-calibration.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: cd verification/opus55_acceptance_calibration && python -m unittest -v test_acceptance_calibration.py
# trigger exact current Recovery promotion verification
