name: Probe Qwen3VL2B zero-cost feasibility
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/probe-qwen3vl2b-zero-cost-feasibility.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      HF_HOME: /tmp/hf
      PIP_NO_CACHE_DIR: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Record runner capacity
        run: |
          free -h
          df -h /
          python - <<'PY'
          import os
          print("cpu_count", os.cpu_count())
          PY
      - name: Check preinstalled torch
        run: python -c "import torch; print('torch', torch.__version__)"
      - name: Install model tooling
        run: python -m pip install --no-cache-dir 'transformers>=4.57,<5' huggingface_hub accelerate safetensors psutil pillow
      - name: Materialize and run pinned-resolved Qwen3-VL 2B
        run: |
          python - <<'PY'
          import json, resource, time
          from pathlib import Path
          from huggingface_hub import model_info, snapshot_download

          repo="Qwen/Qwen3-VL-2B-Instruct"
          t0=time.time()
          info=model_info(repo)
          resolved=info.sha
          print("resolved_hf_sha",resolved,flush=True)
          path=snapshot_download(
              repo_id=repo,
              revision=resolved,
              local_dir="/tmp/qwen3vl2b",
              allow_patterns=["*.json","*.txt","*.safetensors","*.model"],
          )
          materialize_s=time.time()-t0
          size=sum(p.stat().st_size for p in Path(path).rglob("*") if p.is_file())
          print("materialized_bytes",size,flush=True)
          print("materialize_seconds",round(materialize_s,3),flush=True)

          import torch
          from PIL import Image, ImageDraw
          from transformers import AutoProcessor, Qwen3VLForConditionalGeneration

          load0=time.time()
          processor=AutoProcessor.from_pretrained(path,local_files_only=True)
          model=Qwen3VLForConditionalGeneration.from_pretrained(
              path,
              local_files_only=True,
              dtype="auto",
              low_cpu_mem_usage=True,
              device_map={"":"cpu"},
          )
          load_s=time.time()-load0

          image=Image.new("RGB",(64,64),"white")
          draw=ImageDraw.Draw(image)
          draw.rectangle((12,18,52,46),outline="black",width=3)
          messages=[{
              "role":"user",
              "content":[
                  {"type":"image","image":image},
                  {"type":"text","text":"Name the simple visible shape."},
              ],
          }]
          inputs=processor.apply_chat_template(
              messages,
              tokenize=True,
              add_generation_prompt=True,
              return_dict=True,
              return_tensors="pt",
          )
          gen0=time.time()
          with torch.inference_mode():
              out=model.generate(**inputs,max_new_tokens=1,do_sample=False)
          gen_s=time.time()-gen0
          generated=out[0][inputs["input_ids"].shape[-1]:]
          text_out=processor.decode(generated,skip_special_tokens=True,clean_up_tokenization_spaces=False)
          rss_kb=resource.getrusage(resource.RUSAGE_SELF).ru_maxrss
          result={
              "schema":"BRAIN_QWEN3VL2B_ZERO_COST_FEASIBILITY_PROBE_V1",
              "repo":repo,
              "resolved_hf_sha":resolved,
              "materialized_bytes":size,
              "materialize_seconds":materialize_s,
              "load_seconds":load_s,
              "one_token_seconds":gen_s,
              "peak_rss_kb":rss_kb,
              "generated_text":text_out,
              "torch_version":torch.__version__,
              "incremental_spend_usd":0,
              "capability_credit":False,
          }
          print("RESULT_JSON="+json.dumps(result,sort_keys=True),flush=True)
          PY
