name: Verify semantic identifiability gate
on:
  pull_request:
    branches: [main]
    paths:
      - 'verification/semantic_identifiability_gate.py'
      - 'verification/test_semantic_identifiability_gate_independent.py'
      - '.github/workflows/verify-semantic-identifiability-gate.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Bind exact Brain source blob
        run: test "$(git hash-object verification/semantic_identifiability_gate.py)" = "74facea74f6590bed57a916a9f6cebc10d6d614a"
      - run: cd verification && python -m unittest -v test_semantic_identifiability_gate_independent
