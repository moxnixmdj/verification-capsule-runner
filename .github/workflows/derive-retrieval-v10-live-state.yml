name: Derive Retrieval V10 corrected live state
on:
  push:
    branches:
      - verify/retrieval-v10-derived-live-state-20261003
permissions:
  contents: write
  actions: read
jobs:
  derive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: retrieval-v10-live-epoch-v2
          path: input
          github-token: ${{ github.token }}
          run-id: 37157325986
      - name: Verify exact ledger subject
        run: test "$(git hash-object subjects/v10e/retrieval_live_event_ledger_v3.py)" = "5008c5d804a511014a803522b713259b6bb16f7d"
      - name: Derive corrected entity-resolved state
        run: python derive_retrieval_v10_live_state.py
      - name: Commit derived state
        run: |
          git config user.name "Project Brain Verifier"
          git config user.email "actions@users.noreply.github.com"
          git add subjects/v10e/retrieval_live_events_v3.jsonl subjects/v10e/retrieval_v10_live_state_manifest.json
          git commit -m "[skip ci] Materialize corrected Retrieval V10 live state"
          git push origin HEAD:verify/retrieval-v10-derived-live-state-20261003
