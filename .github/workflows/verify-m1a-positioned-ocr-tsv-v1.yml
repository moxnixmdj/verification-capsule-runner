name: Verify M1A positioned OCR TSV bridge

on:
  pull_request:
    branches: [main]
    paths:
      - 'capsules/m1a_positioned_ocr_tsv_v1/**'
      - '.github/workflows/verify-m1a-positioned-ocr-tsv-v1.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact Brain blobs and positioned OCR bridge tests
        run: |
          set -euo pipefail
          cd capsules/m1a_positioned_ocr_tsv_v1
          PYTHONPATH=. python -m unittest -v canonical.tests.test_image_ocr_tesseract_positioned test_brain_blob_binding
