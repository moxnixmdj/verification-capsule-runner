name: Verify TB-Science Opus55 snapshot identity
on:
  push:
    branches: ["verify/tb-science-opus55-snapshot-identity-20261003"]
    paths:
      - "capsules/tb_science_opus55_snapshot_identity/**"
      - ".github/workflows/verify-tb-science-opus55-snapshot-identity.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact Brain source receipts
        run: |
          set -euo pipefail
          C=capsules/tb_science_opus55_snapshot_identity
          test "$(git hash-object "$C/prequalification.json")" = "5e9b246dee5c47238c851c3720b288aec623599a"
          test "$(git hash-object "$C/freshness.json")" = "8d3464dea4baedc7540f63f4e6f21df6f14b2d57"
      - name: Prove current comparator snapshot identity and threshold
        run: |
          set -euo pipefail
          python capsules/tb_science_opus55_snapshot_identity/verify_snapshot_identity.py | tee SNAPSHOT_IDENTITY_RECEIPT.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tb-science-opus55-snapshot-identity-v1
          path: SNAPSHOT_IDENTITY_RECEIPT.json
          if-no-files-found: warn
