name: Verify delegation ceiling acceptance v1
on:
  pull_request:
    branches: [main]
    paths:
      - 'capsules/delegation_ceiling_acceptance_v1/**'
      - '.github/workflows/verify-delegation-ceiling-acceptance-v1.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact Brain blobs and integrated acceptance reduction
        env:
          EXPECTED_JSON: '{"canonical/runtime/acceptance_proof_transmuter_v1.py":"0580f9819b5465c9617f0a1e8ff9a96902eedfc6","canonical/runtime/opus55_acceptance_residual_compiler_v2.py":"cae5bc3bfda9c77d7d7e5151127f55aafddb9522","canonical/tests/test_delegation_ceiling_acceptance_integration_v1.py":"34610fd73a8f2a59f8712592f7f02b570e02f453","canonical/governance/OPUS55_TERMINAL_PROOF_PROTOCOLS_V1.json":"eb4bca0fe6a015d49d2854998fbe046c979c7ea9","canonical/governance/OPUS55_ACCEPTANCE_PROOF_TRANSMUTATION_INPUT_V1.json":"e684a4040ef55b9410a0a86e55192f2f04896b9e","canonical/governance/DELEGATION_ACCEPTANCE_CEILING_WITNESS_V1.json":"344a501c22b898a2a1aaba8847892b442a5a2aa3","canonical/verification/DELEGATION_TERMINAL_CEILING_CONTINUITY_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json":"68adff4a382a6f3e2b025345d2c8c15b4a302957","canonical/governance/OPUS55_ACCEPTANCE_PREDICATE_REGISTRY_V2.json":"562536d9ba3f245a6bd24490a1eb3b30f27e0c3a","canonical/governance/OPUS55_ACCEPTANCE_PREDICATE_EVIDENCE_BINDINGS_V2.json":"3acb614ca9526a4a540bd4457753e09324651ae7","canonical/reasoning/2026-10-02_EXACT_OPUS55_ZERO_COST_COMPARATOR_ROUTE_RECONCILIATION_V1.json":"f67e22cee5e6fce1ebfae92ebf0946f78fafcee1","canonical/governance/OPUS55_PUBLIC_BAR_SCORE_READINESS_MATRIX_V1.json":"4e59e30461c9ff1bee1a9474627d5fb4074844b2"}'
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path('capsules/delegation_ceiling_acceptance_v1')
          expected=json.loads(os.environ['EXPECTED_JSON'])
          for rel,want in sorted(expected.items()):
              data=(root/rel).read_bytes()
              got=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              assert got==want,(rel,got,want)
          print('DELEGATION_ACCEPTANCE_EXACT_11_OF_11_BLOBS_PASS')
          PY
          cd capsules/delegation_ceiling_acceptance_v1
          PYTHONPATH=. python -m unittest -v canonical.tests.test_delegation_ceiling_acceptance_integration_v1
          PYTHONPATH=. python - <<'PY'
          import json
          from pathlib import Path
          from canonical.runtime.acceptance_proof_transmuter_v1 import evaluate as transmute
          from canonical.runtime.opus55_acceptance_residual_compiler_v2 import evaluate as residual
          root=Path('.')
          def load(p): return json.loads((root/p).read_text())
          t=transmute(
              load('canonical/governance/OPUS55_TERMINAL_PROOF_PROTOCOLS_V1.json'),
              load('canonical/governance/OPUS55_ACCEPTANCE_PROOF_TRANSMUTATION_INPUT_V1.json'),
          )
          assert (t['family_count'],t['closed_family_count'],t['open_family_count'])==(19,4,15),t
          r=residual(
              load('canonical/governance/OPUS55_ACCEPTANCE_PREDICATE_REGISTRY_V2.json'),
              load('canonical/governance/OPUS55_ACCEPTANCE_PREDICATE_EVIDENCE_BINDINGS_V2.json'),
              load('canonical/reasoning/2026-10-02_EXACT_OPUS55_ZERO_COST_COMPARATOR_ROUTE_RECONCILIATION_V1.json'),
              load('canonical/governance/OPUS55_PUBLIC_BAR_SCORE_READINESS_MATRIX_V1.json'),
          )
          assert (r['proved_predicate_count'],r['open_predicate_count'],r['blocked_predicate_count'])==(9,0,29),r
          d=next(x for x in r['families'] if x['family']=='SUBAGENT_DELEGATION_AND_COORDINATION')
          assert d['state']=='PROVED' and d['proved']==3 and d['blocked']==0,d
          assert r['terminal_promotion_allowed'] is False
          print('DELEGATION_ACCEPTANCE_4_OF_19_AND_9_OF_38_PASS')
          PY
