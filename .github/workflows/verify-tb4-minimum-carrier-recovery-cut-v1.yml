name: Verify TB4 minimum carrier recovery cut v1

on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/tb4_minimum_carrier_recovery_cut_v1/**"
      - ".github/workflows/verify-tb4-minimum-carrier-recovery-cut-v1.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout verifier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Checkout exact frozen Terminal-Bench source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: harbor-framework/terminal-bench
          ref: 1dcda8716784493721921c23e4bc7f7d988b4494
          path: tb4-source
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Independently reproduce resource metadata and minimum cut
        env:
          TB4_SOURCE_ROOT: ../../tb4-source
        run: |
          cd capsules/tb4_minimum_carrier_recovery_cut_v1
          export PYTHONPATH=.
          python -m py_compile canonical/runtime/tb4_minimum_carrier_recovery_independent_verifier_v1.py
          python -m unittest canonical.tests.test_tb4_minimum_carrier_recovery_independent_v1 -v
          python canonical/runtime/tb4_minimum_carrier_recovery_independent_verifier_v1.py
