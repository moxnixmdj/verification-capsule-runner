name: Execute LiveBench V10 formal-routing replay72
on:
  push:
    branches:
      - verify/livebench-formal-routing-v2-20261004
    paths:
      - ".github/workflows/execute-livebench-v10-formal-routing.yml"

permissions:
  contents: write

jobs:
  execute:
    runs-on: ubuntu-24.04
    env:
      REPOSITORY_PRIVATE: "false"
      LIVEBENCH_V10_ACTIVATION_BLOB: "38296a76cc45f3c01d1794b24b167afe1a324c80"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: verify/livebench-formal-routing-v2-20261004
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.14"
      - name: Verify exact V10 subjects
        run: |
          set -euo pipefail
          python verify_livebench_v10_formal_routing.py
      - name: Atomic claim and replay exposed prefix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python launch_livebench_v10_formal_routing_atomic.py | tee LIVEBENCH_V10_RESULT.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: livebench-v10-formal-routing-replay72
          path: LIVEBENCH_V10_RESULT.log
          retention-days: 90
