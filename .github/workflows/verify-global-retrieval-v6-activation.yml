name: Verify global Retrieval V6 activation
on:
  push:
    branches:
      - verify/global-retrieval-v6-activation-20261003
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python verify_global_retrieval_v6_activation.py
