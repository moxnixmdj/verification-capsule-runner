name: Fastlane sealed Unknown-Domain exact-byte verification V1
on:
  pull_request:
    branches: [main]
    paths:
      - 'fastlane/unknown-domain-sealed-v1/trigger.json'

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact sealed subject bytes
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          expected={
            "canonical/governance/UNKNOWN_DOMAIN_DIRECT_EXECUTION_LEASE_V1.json":"8ecdd481f3c87729618ea9d17cfae33e8328ed94",
            ".github/workflows/unknown-domain-direct-one-use-production.yml":"990b4fe712ca509f3e01c8e632c75416a3cd0b98",
            "verify_unknown_domain_execution_lease.py":"8b1a3253afacb369b063c37a7e122a49bbd1e623",
            "canonical/tests/test_unknown_domain_direct_production_once_v1.py":"a376c69bed5681407554814c96369f7fee22638e",
          }
          def blob(path):
            b=Path(path).read_bytes()
            return hashlib.sha1(b"blob "+str(len(b)).encode()+b"\0"+b).hexdigest()
          for p,e in expected.items():
            g=blob(p)
            assert g==e,(p,g,e)
          raw=Path("canonical/governance/UNKNOWN_DOMAIN_DIRECT_EXECUTION_LEASE_V1.json").read_bytes()
          lease=json.loads(raw)
          digest=hashlib.sha256(raw).hexdigest()
          assert lease["entrypoint_repair"]["event_sha_checkout_repair"]["independent_verification_required"] is True
          assert lease["exact_components"][".github/workflows/unknown-domain-direct-one-use-production.yml"]==expected[".github/workflows/unknown-domain-direct-one-use-production.yml"]
          assert lease["exact_components"]["canonical/runtime/unknown_domain_direct_hidden_generator_v1.py"]=="f974a4594c78e74693c7ba5a19f131dfa481b937"
          Path("fastlane_result.json").write_text(json.dumps({
            "status":"POSTSEAL_EVENT_SHA_EXACT_BYTES_PASS",
            "lease_sha256":digest,
            "lease_git_blob_sha":expected["canonical/governance/UNKNOWN_DOMAIN_DIRECT_EXECUTION_LEASE_V1.json"],
            "production_workflow_git_blob_sha":expected[".github/workflows/unknown-domain-direct-one-use-production.yml"],
            "production_cases_generated":0
          },indent=2,sort_keys=True)+"\n")
          print("lease_sha256="+digest)
          PY
      - name: Run independent execution-lease verifier
        run: python verify_unknown_domain_execution_lease.py
      - name: Run frozen launcher unit tests
        run: python -m unittest canonical.tests.test_unknown_domain_direct_production_once_v1 -v
      - name: Verify immutable create-event checkout
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path(".github/workflows/unknown-domain-direct-one-use-production.yml").read_text()
          assert "ref: ${{ github.sha }}" in p
          assert "ref: ${{ github.ref }}" not in p
          assert "python -m canonical.runtime.unknown_domain_direct_production_once_v1" in p
          print("immutable create-event worktree PASS")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fastlane-unknown-domain-sealed-v1
          path: fastlane_result.json
          if-no-files-found: error
