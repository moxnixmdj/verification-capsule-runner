name: Verify CAD post-refreeze composition V2
on:
  pull_request:
    branches: [main]
    paths:
      - 'capsules/cad_t0_post_refreeze_composition_v2/**'
      - '.github/workflows/verify-cad-post-refreeze-composition-v2.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact Brain CAD composition guard V2
        run: |
          set -euo pipefail
          cd capsules/cad_t0_post_refreeze_composition_v2
          PYTHONPATH=. python -m unittest -v canonical.tests.test_cad_t0_post_refreeze_composition_guard_v2 test_brain_blob_binding
