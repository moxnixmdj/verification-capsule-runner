name: Verify shared residual reuse binding V1
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/shared_residual_reuse_binding_v1/**"
      - ".github/workflows/verify-shared-residual-reuse-binding-v1.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact Brain blobs and deductive binding
        run: |
          cd capsules/shared_residual_reuse_binding_v1
          python - <<'PY'
          import hashlib, json, pathlib
          expected=json.load(open("EXPECTED_BRAIN_BLOBS.json",encoding="utf-8"))
          for src,exp in expected["exact_brain_blobs"].items():
              raw=pathlib.Path(src).read_bytes()
              got=hashlib.sha1(f"blob {len(raw)}\0".encode()+raw).hexdigest()
              assert got==exp,(src,got,exp)
          def load(p): return json.load(open(p,encoding="utf-8"))
          bind=load("canonical/governance/SHARED_RESIDUAL_ACCEPTED_FAMILY_REUSE_BINDING_20261005_V1.json")
          cut=load("canonical/governance/FIVE_FAMILY_SHARED_RESIDUAL_SCOPE_CLOSURE_CUT_20261005_V1.json")
          reg=load("canonical/governance/BEHAVIORAL_CONTRACT_REGISTRY_V1.json")
          rc=load("canonical/governance/RECOVERY_OPUS55_ZERO_REALITY_ACCEPTANCE_CANDIDATE_V1.json")
          rv=load("canonical/verification/RECOVERY_OPUS55_ZERO_REALITY_PUBLIC_RUNNER_VERIFICATION_20261003_V2.json")
          tw=load("canonical/governance/TOOL_DISCOVERY_ACCEPTANCE_CEILING_WITNESS_V1.json")
          ts=load("canonical/verification/TOOL_DISCOVERY_UNIVERSAL_SCOPE_PUBLIC_RUNNER_VERIFICATION_20261003_V1.json")
          own=load("canonical/verification/ACCEPTED_THREE_OWNERSHIP_PROMOTION_PROOF_20261003_V1.json")
          traj="TRAJECTORY_CRITICAL_FAILURE_LOCALIZATION_001"
          tool="TOOL_ROUTE_DISCOVERY_AND_SELECTION_001"
          assert reg["family_to_residual_contracts"]["SELF_VERIFICATION_DEBUGGING_AND_RECOVERY"]==[traj]
          assert reg["family_to_residual_contracts"]["TOOL_DISCOVERY_SELECTION_AND_LEARNING"]==[tool]
          assert "SELF_VERIFICATION_DEBUGGING_AND_RECOVERY_HAS_EXACTLY_ONE_ACTIVE_RESIDUAL_BEHAVIORAL_CONTRACT" in rc["proof_basis"]
          assert rv["verified"]["scope_complete"] is True and rv["verified"]["objective_ceiling_or_floor"] is True
          assert tw["source_behavior_id"]==tool and tw["verified"] is True and tw["independent"] is True
          assert tw["result"]["brain_lower_bound"]==1 and tw["result"]["theoretical_upper_bound"]==1
          assert ts["verified"]["universal_scope_proved"] is True and ts["verified"]["uses_empirical_generalization"] is False
          fam={x["family"]:x for x in own["families"]}
          rf=fam["SELF_VERIFICATION_DEBUGGING_AND_RECOVERY"]; tf=fam["TOOL_DISCOVERY_SELECTION_AND_LEARNING"]
          assert rf["promotion"]=="VERIFIED_OWNED_EQUAL_OR_BETTER"
          assert tf["promotion"]=="VERIFIED_OWNED_EQUAL_OR_BETTER"
          def blob(p):
              raw=pathlib.Path(p).read_bytes()
              return hashlib.sha1(f"blob {len(raw)}\0".encode()+raw).hexdigest()
          assert blob("canonical/runtime/trajectory_failure_typed_ir_candidate_v7.py")==rf["operative_artifact"]["git_blob_sha"]
          assert blob("canonical/runtime/tool_discovery_information_safe_candidate.py")==tf["operative_artifact"]["git_blob_sha"]
          bindings={x["contract"]:x for x in bind["bindings"]}
          assert bindings[traj]["binding_state"]=="PROVED_REUSABLE_ON_IDENTICAL_FROZEN_CONTRACT_SCOPE"
          assert bindings[tool]["binding_state"]=="PROVED_REUSABLE_ON_IDENTICAL_FROZEN_CONTRACT_SCOPE"
          assert bind["consequence"]["five_family_unique_residual_contracts_before_reuse"]==10
          assert bind["consequence"]["shared_residual_contracts_discharged_by_existing_accepted_evidence"]==2
          assert bind["consequence"]["novel_unique_residual_contracts_remaining"]==8
          slots=sum(len(v) for v in cut["family_to_residual_contracts"].values())
          unique=set(x for v in cut["family_to_residual_contracts"].values() for x in v)
          assert slots==16 and len(unique)==10 and traj in unique and tool in unique
          assert bind["accounting"]["new_reality_units_consumed"]==0
          assert bind["accounting"]["acceptance_credit_delta"]==0
          assert bind["accounting"]["family_credit_delta"]==0
          assert bind["accounting"]["capability_credit_delta"]==0
          assert bind["promotion_authority"] is False
          print("shared residual reuse binding: PASS")
          print("novel unique residual burden: 10 -> 8")
          PY
      - name: Verify V7 Recovery domain invariance
        run: |
          cd capsules/shared_residual_reuse_binding_v1
          PYTHONPATH=. python canonical/runtime/recovery_typed_ir_domain_invariance_v1.py
          PYTHONPATH=. python - <<'PY'
          import copy
          from canonical.runtime.recovery_typed_ir_domain_invariance_v1 import CONDITIONS,_rename_resources,serial_direct_cofault_case
          from canonical.runtime import trajectory_failure_typed_ir_candidate_v7 as candidate
          from canonical.runtime import trajectory_failure_typed_ir_proof_v6 as proof
          case=proof.generate_case(2001,pattern="SINGLE",domain="RESEARCH",kind="DEPENDENCY")
          public=proof.public_task(case)
          baseline=candidate.solve(copy.deepcopy(public))
          mutated=_rename_resources(public,CONDITIONS[0])
          mutated["task"]["terminal_failed_resources"]=["missing-resource"]
          assert candidate.solve(mutated)!=baseline
          serial=serial_direct_cofault_case()
          direct=candidate.solve(copy.deepcopy(serial))
          altered=copy.deepcopy(serial)
          for row in altered["task"]["trajectory"]:
              for item in row["checks"]:
                  if item["pass"] is False:
                      item["failure_semantics"]="DERIVED_UPSTREAM"
          assert candidate.solve(altered)!=direct
          print("V7 Recovery domain invariance negative controls: PASS")
          PY
