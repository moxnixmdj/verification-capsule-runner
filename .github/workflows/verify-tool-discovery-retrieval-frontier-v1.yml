name: Verify Tool Discovery retrieval frontier V1

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify content-addressed retrieval frontier
        run: python capsules/tool_discovery_retrieval_frontier_v1/verify.py
