name: Verify tool route and selection kernel
on:
  pull_request:
    paths:
      - 'verification/selection_kernel_route_rebinds/**'
      - '.github/workflows/verify-tool-route-selection-kernel-v1.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python verification/selection_kernel_route_rebinds/verify_tool_and_kernel.py
      - run: python verification/selection_kernel_route_rebinds/verify_delegation_rebind.py
