name: Verify rank23 Stage-B contract
on:
  pull_request:
    branches: [main]
    paths:
      - 'verification/rank23_contract.json'
      - 'verification/rank23_source_accounting.json'
      - 'verification/rank23_sources/**'
      - 'verification/test_rank23_stage_b.py'
      - '.github/workflows/verify-rank23-stage-b.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: cd verification && python -m unittest -v test_rank23_stage_b.py
