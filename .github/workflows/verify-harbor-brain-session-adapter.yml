name: Verify Harbor Brain session adapter
on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/runtime/harbor_brain_session_agent.py'
      - 'canonical/runtime/harbor_environment_transport.py'
      - 'harbor_brain_session/commands/**'
      - 'test_harbor_brain_session_adapter.py'
      - '.github/workflows/verify-harbor-brain-session-adapter.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install exact Harbor release
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir 'harbor==0.23.0'
          python - <<'PY'
          import importlib.metadata
          assert importlib.metadata.version('harbor') == '0.23.0'
          PY
      - name: Bind exact current Brain blobs
        run: |
          test "$(git hash-object canonical/runtime/harbor_brain_session_agent.py)" = "a32d01a95e40708f33a98bd89633db86292948ad"
          test "$(git hash-object canonical/runtime/harbor_environment_transport.py)" = "ec46f648214a37bb16025d5ef2593efdf59f0d79"
      - name: Bind exact Harbor v0.23.0 interface source
        run: |
          git clone -q https://github.com/harbor-framework/harbor.git /tmp/harbor-src
          git -C /tmp/harbor-src checkout -q 1e5c5c6db929a10a140d05e606882c671ae20729
          test "$(git -C /tmp/harbor-src hash-object src/harbor/agents/base.py)" = "a3bcc11299c1de3a551fb07552db12eaf53ca340"
          test "$(git -C /tmp/harbor-src hash-object src/harbor/environments/base.py)" = "74c18b6f272cd83cd6efc89ee5fd91bc09a806ed"
          grep -q 'return_code: int' /tmp/harbor-src/src/harbor/environments/base.py
      - name: Compile exact adapter
        run: |
          PYTHONPATH=. python -m py_compile \
            canonical/runtime/harbor_environment_transport.py \
            canonical/runtime/harbor_brain_session_agent.py \
            test_harbor_brain_session_adapter.py
      - name: Run synthetic Git-backed adapter protocol
        env:
          PYTHONPATH: .
        run: python -m unittest -v test_harbor_brain_session_adapter
      - name: Assert no terminal benchmark case paths were staged
        run: |
          test ! -d tasks
          test ! -d solution
          test ! -d tests
          echo '{"status":"PASS","terminal_case_content_read":0,"terminal_results_observed":0}'
