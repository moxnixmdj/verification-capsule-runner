name: Verify matched scope hierarchical refinement v1
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/matched_scope_hierarchical_refinement_v1/**"
      - ".github/workflows/verify-matched-scope-hierarchical-refinement-v1.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify lossless 11-target hierarchical refinement
        run: |
          cd capsules/matched_scope_hierarchical_refinement_v1
          export PYTHONPATH=.
          python -m py_compile canonical/runtime/terminal_certificate_cut_v1.py canonical/runtime/terminal_information_dominance_v1.py
          python canonical/tests/test_matched_scope_hierarchical_refinement_v1.py
