name: Verify Brain prewave closure wave
on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/runtime/residual_dependency_eliminator.py'
      - 'canonical/tests/test_residual_dependency_eliminator.py'
      - 'canonical/runtime/contract_native_proof_suites.py'
      - 'canonical/tests/test_contract_native_proof_suites.py'
      - 'canonical/runtime/livebench_if_response_adapter.py'
      - 'canonical/tests/test_livebench_if_response_adapter.py'
      - 'canonical/runtime/global_terminal_universe.py'
      - 'canonical/tests/test_global_terminal_universe.py'
      - 'canonical/governance/**'
      - '.github/workflows/verify-prewave-closure-wave.yml'
permissions:
  contents: read
jobs:
  residual-eliminator:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet pytest
      - run: PYTHONPATH=. python -m pytest -q canonical/tests/test_residual_dependency_eliminator.py
  contract-native-proofs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: PYTHONPATH=. python -m unittest -v canonical.tests.test_contract_native_proof_suites
  livebench-adapter:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: PYTHONPATH=. python -m unittest -v canonical.tests.test_livebench_if_response_adapter
  terminal-universe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: PYTHONPATH=. python canonical/tests/test_global_terminal_universe.py
