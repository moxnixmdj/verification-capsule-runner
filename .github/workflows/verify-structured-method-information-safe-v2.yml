name: Verify structured method information-safe v2
on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/runtime/structured_method_information_safe_candidate_v2.py'
      - 'canonical/runtime/structured_method_information_safe_proof_v2.py'
      - 'canonical/tests/test_structured_method_information_safe_v2.py'
      - '.github/workflows/verify-structured-method-information-safe-v2.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact Brain blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object 'canonical/runtime/structured_method_information_safe_candidate_v2.py')" = '0c0507f5315d3392f484572fb1f14f3c327c65f3'
          test "$(git hash-object 'canonical/runtime/structured_method_information_safe_proof_v2.py')" = 'd5a288b27a2dad6662993c74b7939812c91bf6d5'
          test "$(git hash-object 'canonical/tests/test_structured_method_information_safe_v2.py')" = '3b73f246c0e53463b7221c49d60f8e4dde596c48'
      - name: Execute structured-method information-safe v2 tests
        run: python -m unittest -v canonical.tests.test_structured_method_information_safe_v2
