name: Verify four direct proof mutation preflights
on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/runtime/prewave_direct_proof_preflight.py'
      - 'canonical/tests/test_prewave_direct_proof_preflight.py'
      - '.github/workflows/verify-four-direct-proof-preflight.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Bind exact Brain blobs
        run: |
          test "$(git hash-object canonical/runtime/prewave_direct_proof_preflight.py)" = "a6a4133ff429b768b47e2e49cd3f046d5b402477"
          test "$(git hash-object canonical/tests/test_prewave_direct_proof_preflight.py)" = "e0af38fb07f3727dc49e00ff99fa7c543a4260b6"
      - name: Run mutation preflight tests
        run: PYTHONPATH=. python -m unittest -v canonical.tests.test_prewave_direct_proof_preflight
      - name: Emit deterministic preflight receipt
        run: PYTHONPATH=. python canonical/runtime/prewave_direct_proof_preflight.py
