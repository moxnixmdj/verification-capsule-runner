name: Verify Brain GD&T reference lookup
on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/runtime/gdt_reference.py'
      - 'canonical/capabilities/internalized/engineering_reference_data/dbe1df06/**'
      - 'verification/test_gdt_reference.py'
      - '.github/workflows/verify-gdt-reference.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: PYTHONPATH=. python -m unittest -v verification/test_gdt_reference.py
