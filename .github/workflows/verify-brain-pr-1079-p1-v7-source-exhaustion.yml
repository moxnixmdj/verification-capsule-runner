name: Verify Brain PR 1079 P1 V7 zero-reality source exhaustion
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/brain_pr_1079_p1_v7_source_exhaustion/**"
      - ".github/workflows/verify-brain-pr-1079-p1-v7-source-exhaustion.yml"
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact copied Brain blobs
        run: |
          cd capsules/brain_pr_1079_p1_v7_source_exhaustion
          python - <<'PY'
          import hashlib,pathlib
          expected={
            "canonical/governance/P1_V7_FAILURE_SEMANTICS_ZERO_REALITY_SOURCE_AUDIT_V1.json":"1bfe22efbb4ca6cca7ec43e092497cf94afab15e",
            "canonical/governance/P1_TRAJECTORY_T0_T2_MULTIPLEX_TERMINAL_BINDING_V1.json":"8703c6aa08227467a619a7ae90d0d61f8e54da39",
            "canonical/governance/TERMINAL_PORTFOLIO_BINDING_MANIFESTS_V1.json":"8b439403a05b4a912f06a8866db25f6e53b52473",
            "canonical/governance/CONTRACT_NATIVE_PRIVATE_SURFACE_PROOF_ROUTES_V1.json":"75cd1ad0ec0739ebd894cf6075af5837b93d83f8",
            "canonical/governance/FOUR_UNCOVERED_BEHAVIORAL_PROOF_CONTRACTS_V1.json":"8c7ffe3d9ff789eddd286496f6de3ce84472c909",
            "canonical/verification/TERMINAL_V3_ONE_SHOT_WAVE_RESULT_20261002_V1.json":"bd86b4c53992b47a4a60b64a60ba03db9a442cfc",
          }
          for p,e in expected.items():
            b=pathlib.Path(p).read_bytes()
            got=hashlib.sha1(f"blob {len(b)}\0".encode()+b).hexdigest()
            assert got==e,(p,got,e)
          print("exact Brain source blobs: PASS")
          PY
      - name: Verify frozen surface sources lack V7 semantic discriminator
        run: |
          cd capsules/brain_pr_1079_p1_v7_source_exhaustion
          python - <<'PY'
          from pathlib import Path
          files=[
            "canonical/governance/P1_TRAJECTORY_T0_T2_MULTIPLEX_TERMINAL_BINDING_V1.json",
            "canonical/governance/TERMINAL_PORTFOLIO_BINDING_MANIFESTS_V1.json",
            "canonical/governance/CONTRACT_NATIVE_PRIVATE_SURFACE_PROOF_ROUTES_V1.json",
            "canonical/governance/FOUR_UNCOVERED_BEHAVIORAL_PROOF_CONTRACTS_V1.json",
          ]
          needles=("failure_semantics","DIRECT_CONTRACT","DERIVED_UPSTREAM")
          for p in files:
            t=Path(p).read_text(encoding="utf-8")
            for n in needles:
              assert n not in t,(p,n)
          print("frozen surface semantic-discriminator absence: PASS")
          PY
      - name: Download immutable Terminal V3 artifact
        run: |
          cd capsules/brain_pr_1079_p1_v7_source_exhaustion
          gh api repos/moxnixmdj/verification-capsule-runner/actions/artifacts/11214610934/zip > terminal-v3.zip
          mkdir artifact
          unzip -q terminal-v3.zip -d artifact
          test -f artifact/full_result.json
          test -f artifact/summary.json
      - name: Verify immutable artifact hashes and P1 payload exhaustion
        run: |
          cd capsules/brain_pr_1079_p1_v7_source_exhaustion
          python - <<'PY'
          import hashlib,json,pathlib
          full=pathlib.Path("artifact/full_result.json")
          summary=pathlib.Path("artifact/summary.json")
          assert hashlib.sha256(full.read_bytes()).hexdigest()=="f4bec690aa0580cb532dbfd5985705bae8d153c9df31ffdf460b02f8b152e0f2"
          assert hashlib.sha256(summary.read_bytes()).hexdigest()=="d460316947d66cf29295387fc44b638ab4a755df3fb190510f4fc9f182050f64"
          text=full.read_text(encoding="utf-8")
          for n in ("failure_semantics","DIRECT_CONTRACT","DERIVED_UPSTREAM"):
            assert n not in text,n
          x=json.loads(text)
          hits=[]
          def walk(v):
            if isinstance(v,dict):
              if v.get("behavior_id")=="TRAJECTORY_CRITICAL_FAILURE_LOCALIZATION_001":
                hits.append(v)
              for z in v.values(): walk(z)
            elif isinstance(v,list):
              for z in v: walk(z)
          walk(x)
          assert hits
          parent=[h for h in hits if h.get("case_id","").startswith(("T0::","T2::")) and "candidate_visible_keys" in h]
          assert len(parent)==2,parent
          assert all(h["candidate_visible_keys"]==["PUBLIC_TASK_PAYLOAD_ONLY"] for h in parent)
          print("immutable terminal P1 aggregate payload exhaustion: PASS")
          PY
      - name: Verify audit classification and zero credit
        run: |
          cd capsules/brain_pr_1079_p1_v7_source_exhaustion
          python - <<'PY'
          import json
          a=json.load(open("canonical/governance/P1_V7_FAILURE_SEMANTICS_ZERO_REALITY_SOURCE_AUDIT_V1.json"))
          assert a["conclusion"]=="NO_CURRENTLY_PRESERVED_ADMISSIBLE_ZERO_REALITY_SOURCE_DISCHARGES_V7_FAILURE_SEMANTICS_TRANSPORT",a
          assert a["classification"]=="SPECIFICATION_OR_INFORMATION_RESIDUAL",a
          assert a["terminal_results_replayed"]==0
          assert a["new_reality_units_consumed"]==0
          assert a["capability_credit_delta"]==0
          assert a["family_credit_delta"]==0
          assert a["execution_authority"] is False
          assert a["promotion_authority"] is False
          print("source-exhaustion classification: PASS")
          PY
