name: Verify LiveBench Frozen Dispatch Reachability
on:
  pull_request:
    branches: [main]
    paths:
      - verify_livebench_frozen_dispatch_reachability.py
      - .github/workflows/verify-livebench-frozen-dispatch-reachability.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned parquet reader
        run: python -m pip install --disable-pip-version-check pyarrow==18.1.0
      - name: Prove exact frozen scorer reachability
        run: python verify_livebench_frozen_dispatch_reachability.py
      - name: Upload sanitized receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livebench-frozen-dispatch-reachability-receipt
          path: livebench_frozen_dispatch_reachability_receipt.json
          if-no-files-found: error
