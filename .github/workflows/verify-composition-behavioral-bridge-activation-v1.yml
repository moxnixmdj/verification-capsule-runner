name: Verify composition behavioral bridge activation v1

on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/composition_behavioral_bridge_activation_v1/**"
      - ".github/workflows/verify-composition-behavioral-bridge-activation-v1.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact activation and 2-proved/10-open slice
        run: |
          cd capsules/composition_behavioral_bridge_activation_v1
          export PYTHONPATH=.
          python -m py_compile canonical/runtime/composition_behavioral_bridge_activation_verifier_v1.py
          python -m unittest canonical.tests.test_composition_behavioral_bridge_activation_v1 -v
          python canonical/runtime/composition_behavioral_bridge_activation_verifier_v1.py
