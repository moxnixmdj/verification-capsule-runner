name: Verify Root2 clean LiveBench 18 rebind V1

on:
  push:
    branches: [main]
    paths:
      - "verify_root2_clean_livebench_18_rebind_v1.py"
      - "subject/root2_clean_livebench_18/**"
      - ".github/workflows/verify-root2-clean-livebench-18-rebind-v1.yml"
  pull_request:
    branches: [main]
    paths:
      - "verify_root2_clean_livebench_18_rebind_v1.py"
      - "subject/root2_clean_livebench_18/**"
      - ".github/workflows/verify-root2-clean-livebench-18-rebind-v1.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15-intel
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact 18 predicate rebind
        run: python verify_root2_clean_livebench_18_rebind_v1.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: root2-clean-livebench-18-rebind-v1
          path: root2_clean_livebench_18_rebind_receipt.json
          if-no-files-found: error
