name: Chartography frozen five-run heldout V2

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DATASET_REPO: surgeai/chartography
  OFFICIAL_HARNESS_COMMIT: 3f1bf837232d3918c2cc35c6e2418c9e70d2a57b
  MODEL_REPO: mradermacher/ChartVerse-8B-GGUF
  MODEL_REVISION: 02926a8255ad68f66cad965e3faf4fd6f6515259
  MODEL_FILE: ChartVerse-8B.Q4_K_M.gguf
  MODEL_SHA256: 97eebc1d3d8a2f8482205a986305bdbcd5553b8c2131073dc47c553badaa9d15
  MMPROJ_FILE: ChartVerse-8B.mmproj-Q8_0.gguf
  MMPROJ_SHA256: 0df4b5c847587984c93e6712f0851abb2227ecabfe94b8d60ccac90a12b654f0
  LLAMA_CPP_COMMIT: a7fb71fab83b474a0892b9a05aaa3a8ddca2729b
  SUBJECT_CACHE_KEY: chartography-subject-97eebc1d-0df4b5c8-a7fb71fa-v2

jobs:
  bind:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    outputs:
      dataset_rev: ${{ steps.rev.outputs.dataset_rev }}
    steps:
      - uses: actions/checkout@v4
      - name: Install authorized dataset client
        run: python -m pip install --disable-pip-version-check --no-input "huggingface_hub>=0.27,<2"
      - id: rev
        name: Bind exact authorized official dataset revision
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HF_TOKEN:-}" || { echo "::error::AUTHORIZED_HF_TOKEN_REQUIRED"; exit 42; }
          REV="$(python - <<'PY'
          import os
          from huggingface_hub import HfApi
          print(HfApi(token=os.environ["HF_TOKEN"]).repo_info("surgeai/chartography", repo_type="dataset").sha)
          PY
          )"
          test -n "$REV"
          echo "dataset_rev=$REV" >> "$GITHUB_OUTPUT"
      - name: Bind official harness authority
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/surge-ai/chartography.git official
          cd official
          git checkout --detach "$OFFICIAL_HARNESS_COMMIT"
          test "$(git rev-parse HEAD)" = "$OFFICIAL_HARNESS_COMMIT"
          test "$(git hash-object src/chartography/dataset.py)" = "4d1bc311794527a86019f6ed4cf1efbd9bceb9bb"
          test "$(git hash-object src/chartography/scorer.py)" = "11cffaa92dff3bed126247990d41f1509574040e"

  prepare_subject:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Restore or create frozen subject cache
        id: subject-cache
        uses: actions/cache@v4
        with:
          path: |
            model
            llama.cpp/build/bin
            tool-image.tar
          key: ${{ env.SUBJECT_CACHE_KEY }}
      - name: Install build prerequisites
        if: steps.subject-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build curl ca-certificates
      - name: Download exact frozen subject
        if: steps.subject-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p model
          BASE="https://huggingface.co/${MODEL_REPO}/resolve/${MODEL_REVISION}"
          curl -fL --retry 5 --retry-all-errors "$BASE/${MODEL_FILE}?download=true" -o model/model.gguf
          curl -fL --retry 5 --retry-all-errors "$BASE/${MMPROJ_FILE}?download=true" -o model/mmproj.gguf
          echo "${MODEL_SHA256}  model/model.gguf" | sha256sum -c -
          echo "${MMPROJ_SHA256}  model/mmproj.gguf" | sha256sum -c -
      - name: Build frozen visual CLI
        if: steps.subject-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/ggml-org/llama.cpp.git llama.cpp
          cd llama.cpp
          git checkout --detach "$LLAMA_CPP_COMMIT"
          test "$(git rev-parse HEAD)" = "$LLAMA_CPP_COMMIT"
          cmake -S . -B build -G Ninja -DGGML_NATIVE=OFF -DGGML_CUDA=OFF -DGGML_BLAS=OFF -DLLAMA_CURL=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target llama-mtmd-cli -j 2
      - name: Build isolated chart code tool image
        if: steps.subject-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/Dockerfile.chartography <<'EOF'
          FROM python:3.12-slim
          RUN pip install --no-cache-dir pillow numpy scipy matplotlib opencv-python-headless
          WORKDIR /work
          EOF
          docker build -f /tmp/Dockerfile.chartography -t brain-chartography-tool-v1 /tmp
          docker save brain-chartography-tool-v1 -o tool-image.tar
          docker image rm -f brain-chartography-tool-v1 || true
          docker system prune -af || true
          find llama.cpp/build -mindepth 1 -maxdepth 1 ! -name bin -exec rm -rf {} +
          find llama.cpp -mindepth 1 -maxdepth 1 ! -name build -exec rm -rf {} +
      - name: Verify cached subject identity
        shell: bash
        run: |
          set -euo pipefail
          echo "${MODEL_SHA256}  model/model.gguf" | sha256sum -c -
          echo "${MMPROJ_SHA256}  model/mmproj.gguf" | sha256sum -c -
          test -x llama.cpp/build/bin/llama-mtmd-cli
          test -s tool-image.tar

  shard:
    needs: [bind, prepare_subject]
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        epoch: [1, 2, 3, 4, 5]
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - name: Restore frozen subject
        id: subject-cache
        uses: actions/cache@v4
        with:
          path: |
            model
            llama.cpp/build/bin
            tool-image.tar
          key: ${{ env.SUBJECT_CACHE_KEY }}
      - name: Enforce frozen subject cache
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.subject-cache.outputs.cache-hit }}" = "true"
          echo "${MODEL_SHA256}  model/model.gguf" | sha256sum -c -
          echo "${MMPROJ_SHA256}  model/mmproj.gguf" | sha256sum -c -
          test -x llama.cpp/build/bin/llama-mtmd-cli
      - name: Install exact evaluation runtime and load isolated tool image
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input             "pillow>=10,<13" "pyarrow>=17,<23" "huggingface_hub>=0.27,<2"
          docker load -i tool-image.tar
          docker image inspect brain-chartography-tool-v1 >/dev/null
          rm -f tool-image.tar
          mkdir -p "out/epoch-${{ matrix.epoch }}-shard-${{ matrix.shard }}"
      - name: Run one sealed heldout shard
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python subject/chartography_clean_eval/run_epoch.py             --epoch "${{ matrix.epoch }}"             --shard-index "${{ matrix.shard }}"             --shard-count 4             --dataset-repo "$DATASET_REPO"             --dataset-rev "${{ needs.bind.outputs.dataset_rev }}"             --model model/model.gguf             --mmproj model/mmproj.gguf             --cli llama.cpp/build/bin/llama-mtmd-cli             --out "out/epoch-${{ matrix.epoch }}-shard-${{ matrix.shard }}"             --max-crops 5             --timeout-seconds 300
      - name: Emit shard manifest
        env:
          EPOCH: ${{ matrix.epoch }}
          SHARD: ${{ matrix.shard }}
          DATASET_REV: ${{ needs.bind.outputs.dataset_rev }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,pathlib
          epoch=int(os.environ["EPOCH"]); shard=int(os.environ["SHARD"])
          p=pathlib.Path("out")/f"epoch-{epoch}-shard-{shard}"
          def h(q): return hashlib.sha256(q.read_bytes()).hexdigest()
          m={
            "schema":"PROJECT_BRAIN_CHARTOGRAPHY_CLEAN_SHARD_MANIFEST_V2",
            "epoch":epoch,"shard_index":shard,"shard_count":4,
            "dataset_revision":os.environ["DATASET_REV"],
            "model_repository":os.environ["MODEL_REPO"],
            "model_revision":os.environ["MODEL_REVISION"],
            "model_sha256":os.environ["MODEL_SHA256"],
            "mmproj_sha256":os.environ["MMPROJ_SHA256"],
            "llama_cpp_commit":os.environ["LLAMA_CPP_COMMIT"],
            "responses_sha256":h(p/"responses.json"),
            "score_sha256":h(p/"score.json"),
            "gold_generation_separation":True,
            "python_tool_sandbox":"DOCKER_NETWORK_NONE_READ_ONLY_CAP_DROP_ALL_NO_NEW_PRIVILEGES",
            "heldout_tuning_performed":False,
            "incremental_spend_usd":0
          }
          (p/"manifest.json").write_text(json.dumps(m,indent=2,sort_keys=True)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: chartography-epoch-${{ matrix.epoch }}-shard-${{ matrix.shard }}
          path: |
            out/epoch-${{ matrix.epoch }}-shard-${{ matrix.shard }}/responses.json
            out/epoch-${{ matrix.epoch }}-shard-${{ matrix.shard }}/score.json
            out/epoch-${{ matrix.epoch }}-shard-${{ matrix.shard }}/manifest.json
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: [bind, shard]
    if: always() && needs.bind.result == 'success' && needs.shard.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: chartography-epoch-*-shard-*
          path: results
      - name: Compile five-run lower-bound certificate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p aggregate
          python - <<'PY'
          import collections,glob,hashlib,json,pathlib
          score_paths=sorted(glob.glob("results/**/score.json",recursive=True))
          manifest_paths=sorted(glob.glob("results/**/manifest.json",recursive=True))
          if len(score_paths)!=20 or len(manifest_paths)!=20:
              raise SystemExit(f"EXPECTED_20_SHARDS scores={len(score_paths)} manifests={len(manifest_paths)}")
          scores=[json.load(open(p)) for p in score_paths]
          manifests=[json.load(open(p)) for p in manifest_paths]
          revs={x["dataset_revision"] for x in manifests}
          models={(x["model_revision"],x["model_sha256"],x["mmproj_sha256"]) for x in manifests}
          if len(revs)!=1 or len(models)!=1:
              raise SystemExit("CROSS_SHARD_IDENTITY_MISMATCH")
          seen={(x["epoch"],x["shard_index"]) for x in manifests}
          expected={(e,s) for e in range(1,6) for s in range(4)}
          if seen!=expected:
              raise SystemExit(f"BAD_SHARD_SET missing={sorted(expected-seen)} extra={sorted(seen-expected)}")
          by_epoch=collections.defaultdict(lambda:[0,0])
          all_task_sets=collections.defaultdict(set)
          for x in scores:
              e=x["epoch"]; sh=x["shard_index"]
              by_epoch[e][0]+=x["correct_lower_bound"]; by_epoch[e][1]+=x["total"]
              for row in x["score_rows"]:
                  key=row["task_id"]
                  if key in all_task_sets[e]:
                      raise SystemExit(f"DUPLICATE_TASK epoch={e} task={key}")
                  all_task_sets[e].add(key)
          if any(by_epoch[e][1]!=100 or len(all_task_sets[e])!=100 for e in range(1,6)):
              raise SystemExit("NON_100_TASK_EPOCH_AFTER_SHARD_REDUCTION")
          correct=sum(v[0] for v in by_epoch.values())
          total=sum(v[1] for v in by_epoch.values())
          pct=100.0*correct/total
          epoch_pct=[100.0*by_epoch[e][0]/by_epoch[e][1] for e in range(1,6)]
          receipt_material="\n".join(sorted(x["responses_sha256"] for x in manifests)).encode()
          out={
            "schema":"PROJECT_BRAIN_CHARTOGRAPHY_CLEAN_FIVE_RUN_LOWER_BOUND_RESULT_V2",
            "dataset_revision":next(iter(revs)),
            "model_identity":list(next(iter(models))),
            "epochs":[1,2,3,4,5],
            "shards_per_epoch":4,
            "epoch_lower_bound_percent":epoch_pct,
            "correct_lower_bound":correct,
            "total":total,
            "five_run_mean_lower_bound_percent":pct,
            "ge_89":pct>=89.0,
            "response_set_commitment_sha256":hashlib.sha256(receipt_material).hexdigest(),
            "gold_generation_separation":True,
            "heldout_tuning_performed":False,
            "incremental_spend_usd":0,
            "tool_surface":["isolated_python_scientific_stack","crop"],
            "scorer_role":"SOUND_FAIL_CLOSED_LOWER_BOUND_UNDER_PUBLISHED_SURGE_RULES"
          }
          pathlib.Path("aggregate/result.json").write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
          print(json.dumps(out,sort_keys=True))
          raise SystemExit(0 if out["ge_89"] else 1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chartography-five-run-aggregate-v2
          path: aggregate/result.json
          if-no-files-found: error
          retention-days: 90
