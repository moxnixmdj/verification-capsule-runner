name: Verify synthesis singleton scope falsification v1
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/synthesis_root3_scope_relation_v1/**"
      - "verify_synthesis_singleton_scope_falsification_v1.py"
      - ".github/workflows/verify-synthesis-singleton-scope-falsification-v1.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python verify_synthesis_singleton_scope_falsification_v1.py
