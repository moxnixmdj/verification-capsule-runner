name: Audit exact TB4 carrier compatibility
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/audit-tb4-carrier-compatibility.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Freeze exact Terminal-Bench 4.0 source
        run: |
          git clone -q https://github.com/harbor-framework/terminal-bench.git /tmp/tb4
          git -C /tmp/tb4 checkout -q 1dcda8716784493721921c23e4bc7f7d988b4494
          test "$(git -C /tmp/tb4 rev-parse HEAD)" = "1dcda8716784493721921c23e4bc7f7d988b4494"
      - name: Audit resource metadata without reading task instructions
        shell: bash
        run: |
          python - <<'PY'
          import json, os, pathlib, shutil, subprocess, tomllib

          root=pathlib.Path('/tmp/tb4/tasks')
          tomls=sorted(root.glob('*/task.toml'))
          assert tomls, 'NO_TASK_TOMLS'

          host_cpus=os.cpu_count() or 0
          mem_kib=0
          with open('/proc/meminfo','r',encoding='utf-8') as fh:
              for line in fh:
                  if line.startswith('MemTotal:'):
                      mem_kib=int(line.split()[1]); break
          host_memory_mb=mem_kib//1024
          usage=shutil.disk_usage('/')
          host_storage_mb=usage.free//(1024*1024)
          docker_ok=subprocess.run(['docker','version'],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode==0
          compose_ok=subprocess.run(['docker','compose','version'],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode==0

          rows=[]
          gpu_tasks=[]
          resource_exceeds=[]
          compose_tasks=[]
          verifier_separate=0
          for p in tomls:
              data=tomllib.loads(p.read_text(encoding='utf-8'))
              env=data.get('environment') or {}
              cpus=float(env.get('cpus') or 0)
              memory_mb=int(env.get('memory_mb') or 0)
              storage_mb=int(env.get('storage_mb') or 0)
              gpus=int(env.get('gpus') or 0)
              name=(data.get('task') or {}).get('name') or p.parent.name
              if gpus>0:
                  gpu_tasks.append(name)
              if cpus>host_cpus or memory_mb>host_memory_mb or storage_mb>host_storage_mb:
                  resource_exceeds.append({
                      'task':name,'cpus':cpus,'memory_mb':memory_mb,'storage_mb':storage_mb
                  })
              if (data.get('verifier') or {}).get('environment_mode')=='separate':
                  verifier_separate += 1
              has_compose=any((p.parent/'environment'/x).exists() for x in ('docker-compose.yml','compose.yml','compose.yaml'))
              if has_compose:
                  compose_tasks.append(name)
              rows.append({
                  'task':name,'cpus':cpus,'memory_mb':memory_mb,'storage_mb':storage_mb,'gpus':gpus,
                  'separate_verifier':(data.get('verifier') or {}).get('environment_mode')=='separate',
                  'compose_metadata':has_compose,
              })

          if gpu_tasks:
              verdict='STANDARD_GITHUB_RUNNER_INCOMPATIBLE_GPU_REQUIRED'
          elif resource_exceeds:
              verdict='STANDARD_GITHUB_RUNNER_INCOMPATIBLE_RESOURCE_REQUEST'
          elif compose_tasks and not compose_ok:
              verdict='STANDARD_GITHUB_RUNNER_INCOMPATIBLE_COMPOSE_UNAVAILABLE'
          else:
              verdict='RESOURCE_METADATA_COMPATIBLE__FULL_RUNTIME_COMPARABILITY_NOT_YET_PROVEN'

          out={
              'schema':'PROJECT_BRAIN_TB4_CARRIER_COMPATIBILITY_AUDIT_V1',
              'source_commit':'1dcda8716784493721921c23e4bc7f7d988b4494',
              'task_count':len(rows),
              'host':{
                  'cpus':host_cpus,'memory_mb':host_memory_mb,'free_storage_mb':host_storage_mb,
                  'docker':docker_ok,'docker_compose':compose_ok,
              },
              'max_task':{
                  'cpus':max(x['cpus'] for x in rows),
                  'memory_mb':max(x['memory_mb'] for x in rows),
                  'storage_mb':max(x['storage_mb'] for x in rows),
                  'gpus':max(x['gpus'] for x in rows),
              },
              'gpu_task_count':len(gpu_tasks),
              'gpu_tasks':gpu_tasks,
              'resource_exceed_count':len(resource_exceeds),
              'resource_exceeds':resource_exceeds,
              'compose_task_count':len(compose_tasks),
              'compose_tasks':compose_tasks,
              'separate_verifier_task_count':verifier_separate,
              'verdict':verdict,
              'task_instruction_files_read':0,
              'solution_files_read':0,
              'fresh_acceptance_case_executions':0,
              'incremental_spend_usd':0,
          }
          print(json.dumps(out,indent=2,sort_keys=True))
          pathlib.Path('/tmp/tb4-carrier-audit.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          assert docker_ok, out
          PY
