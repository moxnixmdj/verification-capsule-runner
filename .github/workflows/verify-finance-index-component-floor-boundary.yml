name: Verify Finance Index component floor boundary
on:
  push:
    branches:
      - verify/finance-index-component-floor-boundary-20261004-v1
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact Brain inputs
        run: |
          test "$(git hash-object verification_inputs/finance_index_component_floor_boundary_v1.json)" = "277feb222baaa87526a17ac846d16413b31df44a"
          test "$(git hash-object verification_inputs/finance_index_direct_threshold_theorem_v1.json)" = "37f47143f62fe2f59e56d8eca4a64bae18a1ce8b"
          test "$(git hash-object verification_inputs/finance_index_monotone_aggregation_receipt_v1.json)" = "ebe67fc336d905b347790db8499b143c28d08345"
      - name: Replay first-party public scoring semantics
        run: python verify_finance_index_component_floor_boundary_v1.py
