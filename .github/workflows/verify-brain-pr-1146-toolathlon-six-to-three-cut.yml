name: Verify Brain PR 1146 Toolathlon six-to-three cut
on:
  push:
    branches:
      - "verify-brain-pr-1146-toolathlon-six-to-three-cut"
    paths:
      - "capsules/brain_pr_1146_toolathlon_six_to_three_cut/**"
      - ".github/workflows/verify-brain-pr-1146-toolathlon-six-to-three-cut.yml"
  pull_request:
    branches: [main]
    paths:
      - "capsules/brain_pr_1146_toolathlon_six_to_three_cut/**"
      - ".github/workflows/verify-brain-pr-1146-toolathlon-six-to-three-cut.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact Brain blob identities
        shell: bash
        run: |
          set -euo pipefail
          cd capsules/brain_pr_1146_toolathlon_six_to_three_cut
          test "$(git hash-object canonical/governance/TOOLATHLON_MATCHED_ROUTE_PRECONDITION_CUT_V1.json)" = "b55f596bc8dbaacfcc0b2486ff52bda1fecc6d02"
          test "$(git hash-object canonical/runtime/toolathlon_matched_route_precondition_cut_v1.py)" = "42e9a1d9e96f889fed6dc13e2a7bf861cf7c888d"
          test "$(git hash-object canonical/tests/test_toolathlon_matched_route_precondition_cut_v1.py)" = "b31774f5c0197b2ace8a8927663f6ac833c1388e"
          test "$(git hash-object canonical/action_intents/2026-10-03_TOOLATHLON_MATCHED_ROUTE_PRECONDITION_CUT_V1.json)" = "c0beb7f4df2c92af1f73c9feddc545021f347475"
          test "$(git hash-object canonical/governance/TOOLATHLON_VERIFIED_TOOL_DISCOVERY_ROUTE_FREEZE_V1.json)" = "f55ae78014e1dc6f92f2696d33b7249251047f1c"
          test "$(git hash-object canonical/governance/OPUS55_ACCEPTANCE_PREDICATE_EVIDENCE_BINDINGS_V2.json)" = "7885a827b1483bfb38315c1f492848f7e4680285"
      - name: Run fail-closed mutation tests
        shell: bash
        run: |
          set -euo pipefail
          cd capsules/brain_pr_1146_toolathlon_six_to_three_cut
          export PYTHONPATH=.
          python -m unittest canonical.tests.test_toolathlon_matched_route_precondition_cut_v1 -v
      - name: Execute precondition cut compiler
        shell: bash
        run: |
          set -euo pipefail
          cd capsules/brain_pr_1146_toolathlon_six_to_three_cut
          export PYTHONPATH=.
          python -m canonical.runtime.toolathlon_matched_route_precondition_cut_v1 > verdict.json
      - name: Enforce zero-credit truth-preserving verdict
        shell: bash
        run: |
          set -euo pipefail
          cd capsules/brain_pr_1146_toolathlon_six_to_three_cut
          python - <<'PY'
          import json
          v=json.load(open("verdict.json",encoding="utf-8"))
          assert v["status"]=="PASS__SIX_TO_THREE_PRECONDITION_CUT__ZERO_REALITY__ZERO_CREDIT",v
          assert v["original_open_preconditions"]==6,v
          assert v["closed_zero_reality_count"]==2,v
          assert v["absorbed_original_precondition_count"]==2,v
          assert v["minimum_remaining_fact_count"]==3,v
          assert v["minimum_remaining_facts"]==[
            "TOOLATHLON_MATCHED_SCOPE_COMPOSITION_CERTIFICATE",
            "TOOLATHLON_ZERO_INCREMENTAL_SPEND_EXECUTION_CARRIER",
            "OPUS55_TOOLATHLON_77_8_DURABLE_FIRST_PARTY_BYTE_BINDING",
          ],v
          assert v["checker_and_task_population_frozen"] is True,v
          assert v["proved_existing_atomic_inputs"] is True,v
          assert v["terminal_selector_frozen"] is True,v
          assert v["terminal_execution_authorized"] is False,v
          assert v["terminal_goal_achieved"] is False,v
          assert v["terminal_results_observed"]==0,v
          assert v["new_reality_units_consumed"]==0,v
          assert v["incremental_spend_usd"]==0,v
          assert v["capability_credit_delta"]==0 and v["family_credit_delta"]==0,v
          assert v["execution_authority"] is False and v["promotion_authority"] is False,v
          print("Brain PR 1146 Toolathlon six-to-three cut: PASS")
          PY
