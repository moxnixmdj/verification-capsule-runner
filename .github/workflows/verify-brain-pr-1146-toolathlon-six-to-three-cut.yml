name: Verify Brain PR 1146 Toolathlon six-to-three cut
on:
  push:
    branches:
      - "verify/toolathlon-six-to-three-isolated-20261003-sol"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact ownership-hardened Brain blob identities
        shell: bash
        run: |
          set -euo pipefail
          cd capsules/brain_pr_1146_toolathlon_six_to_three_cut
          test "$(git hash-object canonical/governance/TOOLATHLON_MATCHED_ROUTE_PRECONDITION_CUT_V1.json)" = "30324c9aca11633030360eeab17c47283842ed55"
          test "$(git hash-object canonical/runtime/toolathlon_matched_route_precondition_cut_v1.py)" = "083c7e91c167f4be4f51eededf5aa1aa9134bf9f"
          test "$(git hash-object canonical/tests/test_toolathlon_matched_route_precondition_cut_v1.py)" = "2c54f33e950dea69af52278fa00507564cc02cd1"
          test "$(git hash-object canonical/action_intents/2026-10-03_TOOLATHLON_MATCHED_ROUTE_PRECONDITION_CUT_V1.json)" = "0a276217cd8f3e87bbddbb6905086f79441f0523"
          test "$(git hash-object canonical/governance/TOOLATHLON_VERIFIED_TOOL_DISCOVERY_ROUTE_FREEZE_V1.json)" = "f55ae78014e1dc6f92f2696d33b7249251047f1c"
          test "$(git hash-object canonical/governance/OPUS55_ACCEPTANCE_PREDICATE_EVIDENCE_BINDINGS_V2.json)" = "7885a827b1483bfb38315c1f492848f7e4680285"
      - name: Run current fail-closed mutation tests
        shell: bash
        run: |
          set -euo pipefail
          cd capsules/brain_pr_1146_toolathlon_six_to_three_cut
          export PYTHONPATH=.
          python -m unittest canonical.tests.test_toolathlon_matched_route_precondition_cut_v1 -v
      - name: Execute current ownership-hardened cut
        shell: bash
        run: |
          set -euo pipefail
          cd capsules/brain_pr_1146_toolathlon_six_to_three_cut
          export PYTHONPATH=.
          python -m canonical.runtime.toolathlon_matched_route_precondition_cut_v1 > verdict.json
          python - <<'PY'
          import json
          v=json.load(open("verdict.json",encoding="utf-8"))
          assert str(v["status"]).startswith("PASS__"),v
          assert v["original_open_preconditions"]==6,v
          assert v["closed_zero_reality_count"]==2,v
          assert v["absorbed_original_precondition_count"]==2,v
          assert v["minimum_remaining_fact_count"]==3,v
          assert v["minimum_remaining_facts"]==[
            "TOOLATHLON_MATCHED_SCOPE_COMPOSITION_CERTIFICATE",
            "TOOLATHLON_ZERO_INCREMENTAL_SPEND_EXECUTION_CARRIER",
            "OPUS55_TOOLATHLON_MATCHED_REFERENCE_BAR",
          ],v
          assert v["terminal_execution_authorized"] is False,v
          assert v["terminal_goal_achieved"] is False,v
          assert v["terminal_results_observed"]==0,v
          assert v["new_reality_units_consumed"]==0,v
          assert v["incremental_spend_usd"]==0,v
          assert v["capability_credit_delta"]==0 and v["family_credit_delta"]==0,v
          assert v["execution_authority"] is False and v["promotion_authority"] is False,v
          print("CURRENT_TOOLATHLON_SIX_TO_THREE_CUT_PASS")
          PY
