name: Formal Argumentation Model-Independent Preflight

on:
  push:
    paths:
      - '.github/workflows/formal-argumentation-preflight.yml'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify pinned wheel and core argumentation semantics
        shell: bash
        run: |
          set -euo pipefail
          python -m pip download --no-deps --only-binary=:all: formal-argumentation==0.3.0 -d /tmp/fa
          WHEEL="$(find /tmp/fa -maxdepth 1 -name 'formal_argumentation-0.3.0-*.whl' -print -quit)"
          test -n "$WHEEL"
          ACTUAL="$(sha256sum "$WHEEL" | awk '{print $1}')"
          EXPECTED="4b0a242b4bf006cd58c5cbfb313b5b20d2a2895a22ea2b4ddbc4706e8cd56bc8"
          test "$ACTUAL" = "$EXPECTED"
          python -m pip install --no-deps "$WHEEL"
          python - <<'PY'
          import json
          from argumentation.core.dung import ArgumentationFramework, grounded_extension, preferred_extensions
          from argumentation.core.bipolar import BipolarArgumentationFramework, cayrol_derived_defeats

          af = ArgumentationFramework(
              arguments=frozenset({"evidence_for", "evidence_against"}),
              defeats=frozenset({("evidence_for", "evidence_against")}),
          )
          grounded = sorted(grounded_extension(af))
          preferred = [sorted(x) for x in preferred_extensions(af)]
          assert grounded == ["evidence_for"], grounded
          assert preferred == [["evidence_for"]], preferred

          baf = BipolarArgumentationFramework(
              arguments=frozenset({"source", "claim", "counter"}),
              defeats=frozenset({("claim", "counter")}),
              supports=frozenset({("source", "claim")}),
          )
          derived = sorted([list(x) for x in cayrol_derived_defeats(baf.defeats, baf.supports)])
          assert ["source", "counter"] in derived, derived

          print(json.dumps({
              "status":"PASS",
              "package":"formal-argumentation",
              "version":"0.3.0",
              "wheel_sha256":"4b0a242b4bf006cd58c5cbfb313b5b20d2a2895a22ea2b4ddbc4706e8cd56bc8",
              "python":"3.12",
              "grounded":grounded,
              "preferred":preferred,
              "derived_defeats":derived,
              "model_dependency":False
          }, sort_keys=True))
          PY
