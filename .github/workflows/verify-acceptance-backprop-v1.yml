name: Verify acceptance backprop v1
on:
  push:
    branches: [critical/acceptance-backprop-isolated-20261003]
    paths:
      - 'canonical/runtime/acceptance_backprop_compiler_v1.py'
      - 'canonical/tests/test_acceptance_backprop_compiler_v1.py'
      - '.github/workflows/verify-acceptance-backprop-v1.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Bind exact Brain blobs
        run: |
          set -euo pipefail
          test "$(git hash-object canonical/runtime/acceptance_backprop_compiler_v1.py)" = "b63c18a5a66eeb978780d2560f0f741ad255ad68"
          test "$(git hash-object canonical/tests/test_acceptance_backprop_compiler_v1.py)" = "3f9b121aec301c549a4a872f73d51f0e919901bc"
      - name: Compile exact runtime and tests
        run: |
          python -m py_compile canonical/runtime/acceptance_backprop_compiler_v1.py
          python -m py_compile canonical/tests/test_acceptance_backprop_compiler_v1.py
      - name: Run adversarial unit tests
        run: PYTHONPATH=. python -m unittest -v canonical.tests.test_acceptance_backprop_compiler_v1
