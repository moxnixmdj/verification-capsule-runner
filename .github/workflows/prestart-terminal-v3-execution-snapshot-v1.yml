name: Prestart terminal V3 execution snapshot V2
on:
  push:
    branches:
      - terminal-v3-execution-snapshot-20261002-v1
    paths:
      - '.github/workflows/prestart-terminal-v3-execution-snapshot-v1.yml'
permissions:
  contents: read
jobs:
  prestart:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact zero-cost runtime dependencies
        run: >-
          python -m pip install --disable-pip-version-check --no-input
          "pydantic>=2,<3" "cadquery==2.6.1"
          python-docx openpyxl python-pptx pypdf
      - name: Activate exact V3 snapshot assertions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, shutil
          from pathlib import Path
          r=Path("capsules/terminal-v3-snapshot")
          cap=json.loads((r/"TERMINAL_ATOMIC_CLOSURE_CAPSULE_V3.json").read_text())
          assert cap["execution_snapshot"]["commit_sha"]=="821712c059b139f3494723dca6e8d0fc82ee59a4"
          for rel in cap["snapshot_blob_assertions"]:
              src=r/"snapshot"/rel
              dst=Path(rel)
              assert src.is_file(), ("missing snapshot mirror",rel)
              dst.parent.mkdir(parents=True,exist_ok=True)
              shutil.copyfile(src,dst)
          print("ACTIVATED",len(cap["snapshot_blob_assertions"]),"EXACT_SNAPSHOT_ASSERTIONS")
          PY
      - name: Verify frozen snapshot authority
        env:
          PYTHONPATH: ".:canonical/runtime"
        shell: bash
        run: |
          set -euo pipefail
          python canonical/runtime/terminal_wave_launch_authority_reducer_v1.py . | tee /tmp/authority.json
          python - <<'PY'
          import json
          v=json.load(open("/tmp/authority.json"))
          assert v["pass"] is True, v
          assert v["launch_authority"] is True and v["execution_authority"] is True, v
          assert v["route_count"] == 12, v
          assert v["terminal_results_observed"] == 0 and v["fresh_terminal_evidence_consumed"] == 0, v
          PY
      - name: Verify frozen runtime closure without terminal execution
        env:
          PYTHONPATH: ".:canonical/runtime"
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from canonical.runtime import terminal_parent_portfolio_launcher_v1 as L
          from canonical.runtime import terminal_parent_portfolio_runner_v1 as R
          from canonical.runtime import cad_t0_route_specific_terminal_executor_v1 as C
          from canonical.runtime import saccr_route_specific_terminal_executor_v1 as S
          from canonical.runtime import direct_route_terminal_executors_v1 as D

          plan=L.build_launch_plan()
          assert plan["pass"] is True, plan
          assert plan["preflight"]["active_contract_count"] == 12, plan
          assert plan["direct_route_execution_count"] == 6, plan
          assert plan["post_freeze_beacon_required"] is True, plan

          rp=R.static_preflight()
          assert rp["pass"] is True, rp
          rehearsal=R.rehearse_all_portfolios()
          assert rehearsal["pass"] is True, rehearsal
          assert rehearsal["terminal_result"] is False, rehearsal
          assert rehearsal["fresh_terminal_evidence_consumed"] == 0, rehearsal

          cp=C.static_dependency_preflight()
          assert cp["pass"] is True, cp
          sp=S.static_preflight()
          assert sp["pass"] is True, sp

          assert set(D.bound_behavior_ids()) == {
            D.BROWSER_ID,D.DELEGATION_ID,D.TOOL_ID,D.RESEARCH_ID
          }, D.bound_behavior_ids()
          print("ZERO_TERMINAL_EVIDENCE_RUNTIME_CLOSURE_PASS")
          PY
      - name: Run positive frozen regression subset
        env:
          PYTHONPATH: ".:canonical/runtime"
        run: |
          python -m unittest -v \
            canonical.tests.test_terminal_wave_launch_authority_reducer_v1.TerminalWaveLaunchAuthorityReducerTests.test_complete_current_state_authorizes \
            canonical.tests.test_terminal_parent_portfolio_launcher_v1.TerminalParentPortfolioLauncherTests.test_static_route_algebra_is_exact_twelve \
            canonical.tests.test_terminal_parent_portfolio_launcher_v1.TerminalParentPortfolioLauncherTests.test_plan_deduplicates_shared_tool_route \
            canonical.tests.test_terminal_parent_portfolio_launcher_v1.TerminalParentPortfolioLauncherTests.test_zero_terminal_rehearsal_full_wave_passes_with_stubbed_runners \
            canonical.tests.test_terminal_parent_portfolio_runner_v1.TerminalParentPortfolioRunnerTests.test_all_four_parent_portfolios_pass_nonterminal_rehearsal \
            canonical.tests.test_cad_t0_route_specific_terminal_executor_v1.CadT0RouteSpecificTerminalExecutorTests.test_static_dependency_preflight_passes_on_current_v4_binding \
            canonical.tests.test_cad_t0_route_specific_terminal_executor_v1.CadT0RouteSpecificTerminalExecutorTests.test_all_eight_families_execute_information_safely \
            canonical.tests.test_saccr_route_specific_terminal_executor_v1.SaccrRouteSpecificTerminalExecutorTests.test_nonterminal_self_check_passes
