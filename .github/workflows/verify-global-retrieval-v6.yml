name: Verify global retrieval V6
on:
  push:
    branches:
      - verify/global-retrieval-v6-20261003
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact subject blobs
        run: |
          test "$(git hash-object canonical/runtime/global_retrieval_controller_v1.py)" = "211a34f2bc22f531b895b0c7a26187b176875e9f"
          test "$(git hash-object canonical/runtime/retrieval_torture_universe_v2.py)" = "c00abb33c1a9269f06187c369987aa9736077b43"
          test "$(git hash-object canonical/tests/test_global_retrieval_controller_v1.py)" = "1fcb55a3c8ba792d93b05fbae5918dcb030fb7da"
          test "$(git hash-object canonical/tests/test_retrieval_torture_universe_v2.py)" = "35b6e0132d21149844f8842528f4cfc9bf9795da"
      - name: Run controller tests
        run: PYTHONPATH=. python canonical/tests/test_global_retrieval_controller_v1.py
      - name: Run torture-universe tests
        run: PYTHONPATH=. python canonical/tests/test_retrieval_torture_universe_v2.py
      - name: Run finite benchmark
        run: PYTHONPATH=. python canonical/runtime/retrieval_torture_universe_v2.py
