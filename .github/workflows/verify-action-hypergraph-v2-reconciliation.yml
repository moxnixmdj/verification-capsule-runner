name: Verify action hypergraph v2 reconciliation
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/action_hypergraph_v2_reconciliation/**"
      - ".github/workflows/verify-action-hypergraph-v2-reconciliation.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify 31-predicate action coverage and deleted-route safety
        run: |
          cd capsules/action_hypergraph_v2_reconciliation
          export PYTHONPATH=.
          python canonical/tests/test_action_hypergraph_v2_reconciliation.py
