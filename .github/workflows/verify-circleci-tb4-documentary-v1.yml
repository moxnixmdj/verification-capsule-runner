name: Verify CircleCI TB4 documentary reduction v1
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/tb4_circleci_documentary_v1/**"
      - ".github/workflows/verify-circleci-tb4-documentary-v1.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python capsules/tb4_circleci_documentary_v1/verify.py
