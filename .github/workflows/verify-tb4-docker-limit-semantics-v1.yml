name: Verify TB4 Docker limit semantics

on:
  pull_request:
    paths:
      - ".github/workflows/verify-tb4-docker-limit-semantics-v1.yml"
      - "capsules/tb4_docker_limit_semantics_v1/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prove Docker accepts task limits above physical host capacity
        shell: bash
        run: |
          set -euo pipefail
          host_cpus="$(nproc)"
          host_mem_mb="$(( $(awk '/MemTotal:/ {print $2}' /proc/meminfo) / 1024 ))"
          echo "HOST_CPUS=$host_cpus"
          echo "HOST_MEM_MB=$host_mem_mb"
          test "$host_cpus" -lt 8
          test "$host_mem_mb" -lt 16384

          docker pull alpine:3.20
          docker image inspect alpine:3.20 --format 'IMAGE_DIGEST={{index .RepoDigests 0}}'

          docker_out="$(docker run --rm --cpus=8 --memory=16384m alpine:3.20 sh -ec '
            printf "CPU_MAX="
            cat /sys/fs/cgroup/cpu.max
            printf "MEMORY_MAX="
            cat /sys/fs/cgroup/memory.max
          ')"
          printf '%s\n' "$docker_out"

          cpu_line="$(printf '%s\n' "$docker_out" | sed -n 's/^CPU_MAX=//p')"
          quota="$(printf '%s' "$cpu_line" | awk '{print $1}')"
          period="$(printf '%s' "$cpu_line" | awk '{print $2}')"
          memory_max="$(printf '%s\n' "$docker_out" | sed -n 's/^MEMORY_MAX=//p')"
          test "$quota" -eq $((8 * period))
          test "$memory_max" -eq $((16384 * 1024 * 1024))

          cat > /tmp/tb4-limit-compose.yml <<'YAML'
          services:
            main:
              image: alpine:3.20
              command: ["sh", "-c", "sleep 30"]
              cpus: 8.0
              mem_limit: 16384m
          YAML

          docker compose -f /tmp/tb4-limit-compose.yml up -d
          cid="$(docker compose -f /tmp/tb4-limit-compose.yml ps -q main)"
          nano_cpus="$(docker inspect "$cid" --format '{{.HostConfig.NanoCpus}}')"
          memory_bytes="$(docker inspect "$cid" --format '{{.HostConfig.Memory}}')"
          echo "COMPOSE_NANO_CPUS=$nano_cpus"
          echo "COMPOSE_MEMORY_BYTES=$memory_bytes"
          test "$nano_cpus" -eq 8000000000
          test "$memory_bytes" -eq $((16384 * 1024 * 1024))
          docker compose -f /tmp/tb4-limit-compose.yml down -v

      - name: Bind Harbor and frozen leaderboard semantics
        shell: bash
        env:
          TB_REF: 1dcda8716784493721921c23e4bc7f7d988b4494
          HARBOR_REF: fd1521a1da6250d9ed8fc7505caa0b7a72f36c4b
        run: |
          set -euo pipefail
          mkdir -p /tmp/semantic-bindings
          curl -fsSL "https://raw.githubusercontent.com/harbor-framework/terminal-bench/$TB_REF/leaderboard/src/leaderboard/ci/static_analysis.py" -o /tmp/semantic-bindings/static_analysis.py
          curl -fsSL "https://raw.githubusercontent.com/harbor-framework/harbor/$HARBOR_REF/src/harbor/environments/docker/docker.py" -o /tmp/semantic-bindings/docker.py
          curl -fsSL "https://raw.githubusercontent.com/harbor-framework/harbor/$HARBOR_REF/src/harbor/environments/docker/__init__.py" -o /tmp/semantic-bindings/docker_init.py
          curl -fsSL "https://raw.githubusercontent.com/harbor-framework/harbor/$HARBOR_REF/docs-mintlify/core-concepts/tasks/resources.mdx" -o /tmp/semantic-bindings/resources.mdx

          python - <<'PY'
          from pathlib import Path
          import re

          static = Path("/tmp/semantic-bindings/static_analysis.py").read_text()
          docker = Path("/tmp/semantic-bindings/docker.py").read_text()
          docker_init = Path("/tmp/semantic-bindings/docker_init.py").read_text()
          docs = Path("/tmp/semantic-bindings/resources.mdx").read_text()

          m = re.search(r"_ENV_OVERRIDES\s*=\s*\((.*?)\)", static, re.S)
          assert m, "frozen leaderboard environment override tuple missing"
          env_override_body = m.group(1)
          for name in ("override_cpus", "override_memory_mb", "override_storage_mb", "override_gpus"):
              assert name in env_override_body
          assert "cpu_enforcement_policy" not in env_override_body
          assert "memory_enforcement_policy" not in env_override_body

          assert "auto_mode=ResourceMode.LIMIT" in docker
          assert 'main["cpus"] = float(cpu_limit)' in docker_init
          assert 'main["mem_limit"] = f"{memory_limit_mb}m"' in docker_init
          assert "Hard ceiling only" in docs
          assert "Reservation only, no ceiling" in docs

          print("SEMANTIC_BINDING_PASS=1")
          print("TB_REF=1dcda8716784493721921c23e4bc7f7d988b4494")
          print("HARBOR_REF=fd1521a1da6250d9ed8fc7505caa0b7a72f36c4b")
          PY

      - name: Emit fail-closed conclusion
        shell: bash
        run: |
          cat <<'EOF'
          RESULT=PASS_ZERO_CASE_DOCKER_LIMIT_COUNTEREXAMPLE
          INTERPRETATION=CPU_AND_MEMORY_DECLARATIONS_ARE_ENFORCED_AS_LIMITS_NOT_HOST_RESERVATIONS_IN_DOCKER_AUTO_MODE
          CONSEQUENCE=HOST_CPU_LT_DECLARED_CPU_DOES_NOT_BY_ITSELF_PROVE_TASK_UNRUNNABLE
          NON_CLAIM=NO_TB4_TASK_WAS_EXECUTED
          NON_CLAIM=NO_ACCEPTANCE_CREDIT_GRANTED
          NON_CLAIM=NO_TASK_SUCCESS_WAS_PROVED
          EOF
