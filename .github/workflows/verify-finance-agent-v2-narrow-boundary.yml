name: Verify Finance Agent v2 narrow boundary
on:
  pull_request:
    paths:
      - "capsules/finance_agent_v2_narrow_boundary_v1/**"
      - ".github/workflows/verify-finance-agent-v2-narrow-boundary.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python capsules/finance_agent_v2_narrow_boundary_v1/verify.py
