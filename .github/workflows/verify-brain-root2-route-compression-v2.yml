name: Verify Brain Root2 route compression V2

on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/root2_route_compression_v2/**"
      - ".github/workflows/verify-brain-root2-route-compression-v2.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify Root2 route compression V2
        run: python capsules/root2_route_compression_v2/verify.py
