name: Verify Brain Root3 V4 current cut
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/root3_root_cause_v4/**"
      - ".github/workflows/verify-brain-root3-v4.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Independently verify Root3 V4
        run: |
          cd capsules/root3_root_cause_v4
          python independent_verify.py | tee verdict.json
      - uses: actions/upload-artifact@v4
        with:
          name: root3-v4-verdict
          path: capsules/root3_root_cause_v4/verdict.json
          if-no-files-found: error
