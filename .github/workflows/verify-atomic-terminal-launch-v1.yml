name: Verify atomic V2 terminal launch capsule
on:
  pull_request:
    branches: [main]
    paths:
      - capsules/atomic_terminal_launch_v1/**
      - .github/workflows/verify-atomic-terminal-launch-v1.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify exact Brain bytes and fail-closed atomic launch semantics
        run: python capsules/atomic_terminal_launch_v1/verify.py
