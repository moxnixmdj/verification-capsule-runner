name: Verify clean Active15 LiveBench promotion

on:
  pull_request:
    branches: [main]
    paths:
      - "verify_livebench_clean_active15_promotion_v1.py"
      - ".github/workflows/verify-livebench-clean-active15-promotion-v1.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"

      - name: Install exact public runtime dependencies
        run: python -m pip install --disable-pip-version-check nltk==3.10.3 langdetect==1.0.9 immutabledict==4.2.2

      - name: Checkout exact frozen LiveBench source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/LiveBench
          git init /tmp/LiveBench
          git -C /tmp/LiveBench remote add origin https://github.com/LiveBench/LiveBench.git
          git -C /tmp/LiveBench fetch --depth 1 origin 8f8e5c381a16e3f24257776edd53471fe86f8091
          git -C /tmp/LiveBench checkout --detach FETCH_HEAD

      - name: Independently compose clean Active15 predicate proof
        run: python verify_livebench_clean_active15_promotion_v1.py

      - name: Print receipt
        if: always()
        run: |
          if test -f livebench_clean_active15_promotion_v1.json; then
            cat livebench_clean_active15_promotion_v1.json
          fi

      - name: Upload immutable receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livebench-clean-active15-promotion-v1
          path: livebench_clean_active15_promotion_v1.json
          if-no-files-found: error
