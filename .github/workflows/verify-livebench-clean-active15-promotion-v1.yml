name: Verify LiveBench clean Active15 predicate promotion
on:
  push:
    branches: ["verify/livebench-clean-active15-promotion-20261005-sol"]
    paths:
      - "verify_livebench_clean_active15_promotion_v1.py"
      - "subject/livebench_clean_active15_promotion_20261005/**"
      - ".github/workflows/verify-livebench-clean-active15-promotion-v1.yml"
  pull_request:
    branches: [main]
    paths:
      - "verify_livebench_clean_active15_promotion_v1.py"
      - "subject/livebench_clean_active15_promotion_20261005/**"
      - ".github/workflows/verify-livebench-clean-active15-promotion-v1.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify frozen clean composition gate
        run: python verify_livebench_clean_active15_promotion_v1.py
      - name: Print receipt
        if: always()
        run: cat livebench_clean_active15_promotion_verification.json || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livebench-clean-active15-promotion-verification
          path: livebench_clean_active15_promotion_verification.json
          if-no-files-found: error
