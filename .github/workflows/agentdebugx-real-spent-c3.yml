name: AgentDebugX Real Spent C3 Trace Screen
on:
  push:
    paths:
      - ".github/workflows/agentdebugx-real-spent-c3.yml"
      - "agentdebugx_real_spent_c3/**"
permissions:
  contents: write
jobs:
  screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run zero-LLM debugger on real spent C3 failures
        id: screen
        shell: bash
        run: |
          set +e
          {
            python -m pip install --upgrade pip
            python -m pip install "agentdebugx==0.5.2"
            python agentdebugx_real_spent_c3/probe.py
            cat agentdebugx_real_spent_c3/result.json
          } > agentdebugx_real_spent_c3/run.log 2>&1
          rc=$?
          cat agentdebugx_real_spent_c3/run.log
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"
      - name: Persist result
        if: always()
        shell: bash
        env:
          OUTCOME: ${{ steps.screen.outcome }}
          RC: ${{ steps.screen.outputs.rc }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path("agentdebugx_real_spent_c3")
          ex=(p/"result.json").exists()
          (p/"status.json").write_text(json.dumps({
            "schema":"PROJECT_BRAIN_VISIBLE_EXECUTION_STATUS_V1",
            "probe":"AGENTDEBUGX_REAL_SPENT_C3_TRACE_SCREEN",
            "workflow_run_id":os.environ["GITHUB_RUN_ID"],
            "head_sha":os.environ["GITHUB_SHA"],
            "outcome":os.environ.get("OUTCOME"),
            "rc":os.environ.get("RC"),
            "result_exists":ex,
            "terminal_state":"SUCCESS" if os.environ.get("OUTCOME")=="success" and ex else "FAILURE",
            "capability_credit_delta":0
          },indent=2)+"\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agentdebugx_real_spent_c3/status.json agentdebugx_real_spent_c3/run.log
          test ! -f agentdebugx_real_spent_c3/result.json || git add agentdebugx_real_spent_c3/result.json
          git commit -m "Record AgentDebugX real spent C3 trace screen"
          git pull --rebase origin main
          git push
