name: Inspect exact allowlisted rank21 inputs
on:
  pull_request:
    branches: [main]
    paths:
      - 'verification/rank21_allowlisted_input_dump.py'
      - '.github/workflows/inspect-rank21-allowlisted-inputs.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check xlrd==2.0.1 pypdf==6.1.1
      - name: Fetch exact allowlisted official task inputs only
        run: |
          mkdir -p /tmp/rank21
          base='https://raw.githubusercontent.com/harbor-framework/terminal-bench/452bf305c6daa62fc59061d22133a7cbc7c1572e/tasks/foodstuff-beta-activity/environment/data'
          curl -fL "$base/measurement%20data.xls" -o "/tmp/rank21/measurement data.xls"
          curl -fL "$base/sample.xls" -o "/tmp/rank21/sample.xls"
          curl -fL "$base/Sr-90_tables.pdf" -o "/tmp/rank21/Sr-90_tables.pdf"
          printf '%s  %s\n' '77ebde66abfe83423f89586de9e2b5a499228154' "expected-git-blob measurement data.xls"
          printf '%s  %s\n' '4c62b8be6b1a96c390012f775f596476ebe017bd' "expected-git-blob sample.xls"
          printf '%s  %s\n' '2d1705dc43d36628ce98884b7531a023a839ecad' "expected-git-blob Sr-90_tables.pdf"
      - run: python verification/rank21_allowlisted_input_dump.py
