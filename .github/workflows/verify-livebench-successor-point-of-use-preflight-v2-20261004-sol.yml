name: Verify LiveBench successor point-of-use preflight V2
on:
  pull_request:
    paths:
      - 'subject/livebench_successor_point_of_use_preflight_v2_20261004_sol/**'
      - 'verify_livebench_successor_point_of_use_preflight_v2_20261004_sol.py'
      - '.github/workflows/verify-livebench-successor-point-of-use-preflight-v2-20261004-sol.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python verify_livebench_successor_point_of_use_preflight_v2_20261004_sol.py
