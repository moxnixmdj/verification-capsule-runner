name: Verify Unknown-Domain V2 Universal Proof V1

on:
  push:
    branches:
      - verify/unknown-domain-v2-universal-proof-20261005
    paths:
      - verification/unknown_domain_v2_universal_proof_v1.py
      - .github/workflows/verify-unknown-domain-v2-universal-proof-v1.yml

permissions:
  contents: read

concurrency:
  group: unknown-domain-v2-universal-proof-v1
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run independent content-bound universal verifier
        run: python3 verification/unknown_domain_v2_universal_proof_v1.py
      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unknown-domain-v2-universal-proof-v1
          path: unknown_domain_v2_universal_proof_receipt.json
          if-no-files-found: error
          retention-days: 7
