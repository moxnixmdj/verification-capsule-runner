name: Verify CAD T0 post-refreeze V2
on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/governance/CAD_T0_CANDIDATE_FREEZE_V2.json'
      - 'canonical/governance/CAD_T0_POST_REFREEZE_BINDING_V2.json'
      - 'canonical/runtime/cad_t0_post_refreeze_guard_v2.py'
      - 'canonical/runtime/cad_t0_post_refreeze_binding_validator.py'
      - 'canonical/tests/test_cad_t0_post_refreeze_guard_v2.py'
      - 'canonical/tests/test_cad_t0_post_refreeze_binding_validator.py'
      - 'canonical/verification/CAD_T0_POPULATION_ORACLE_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json'
      - 'canonical/verification/M1A_POSITIONED_OCR_TSV_BRIDGE_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json'
      - '.github/workflows/verify-cad-t0-post-refreeze-v2.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Bind exact Brain V2 proof blobs
        run: |
          set -euo pipefail
          test "$(git hash-object canonical/governance/CAD_T0_CANDIDATE_FREEZE_V2.json)" = "039056ad65c1721d871d378ff0497fc461ab4df2"
          test "$(git hash-object canonical/governance/CAD_T0_POST_REFREEZE_BINDING_V2.json)" = "7a6f04e08587ff5471ab406c04ab8acd76cc16eb"
          test "$(git hash-object canonical/runtime/cad_t0_post_refreeze_guard_v2.py)" = "02f8e226aae21805f41f6d157404d3f8b83e49fb"
          test "$(git hash-object canonical/runtime/cad_t0_post_refreeze_binding_validator.py)" = "6b5b53317ca46b331fe4095ed99e48698e2b73b9"
          test "$(git hash-object canonical/tests/test_cad_t0_post_refreeze_guard_v2.py)" = "1f02e2aabf5fa0eea6dc34ca4dfbb0a2e46a2c2a"
          test "$(git hash-object canonical/tests/test_cad_t0_post_refreeze_binding_validator.py)" = "01045d73982ea3b7be381c6e64521b2ff26649b5"
          test "$(git hash-object canonical/verification/CAD_T0_POPULATION_ORACLE_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json)" = "d27aece637d10e46bff72b762f5743d5048c7af0"
          test "$(git hash-object canonical/verification/M1A_POSITIONED_OCR_TSV_BRIDGE_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json)" = "949612638affa5891fe74517ad6b83371a783f69"
      - name: Compile validators
        run: python -m py_compile canonical/runtime/cad_t0_post_refreeze_guard_v2.py canonical/runtime/cad_t0_post_refreeze_binding_validator.py
      - name: Verify exact V2 dependency cone and information boundaries
        run: PYTHONPATH=. python -m unittest -v canonical.tests.test_cad_t0_post_refreeze_guard_v2 canonical.tests.test_cad_t0_post_refreeze_binding_validator

# sync-trigger-2
