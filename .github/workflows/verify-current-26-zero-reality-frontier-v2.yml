name: Verify current 26 zero reality frontier V2
on:
  push:
    branches:
      - verify/current-26-zero-reality-frontier-v2-20261003-sol
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python verify_current_26_zero_reality_frontier_v2.py
