name: Verify Qwen3.8-4B Root1 semantic seed
on:
  push:
    branches: ['verify/qwen38-4b-root1-semantic-seed-20261004']
    paths:
      - 'verify_qwen38_4b_root1_semantic_seed_v1.py'
      - '.github/workflows/verify_qwen38_4b_root1_semantic_seed_v1.yml'
  pull_request:
    paths:
      - 'verify_qwen38_4b_root1_semantic_seed_v1.py'
      - '.github/workflows/verify_qwen38_4b_root1_semantic_seed_v1.yml'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: verify/qwen38-4b-root1-semantic-seed-20261004
      - name: Build pinned llama.cpp server
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/ggml-org/llama.cpp.git
          cd llama.cpp
          git checkout 0504396140d1c882f5f6ee34466a42db7ae90114
          cmake -B build -DGGML_NATIVE=OFF -DLLAMA_CURL=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target llama-server -j2
      - name: Download exact content-addressed Qwen3.8-4B Q4 subject
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 --retry-all-errors \
            -o Qwen3.8-4B-Q4_K_M.gguf \
            https://huggingface.co/empero-ai/Qwen3.8-4B-Distill-GGUF/resolve/391fc7d103e3942a408def3e4f51c2f85d464417/Qwen3.8-4B-Q4_K_M.gguf
      - name: Run frozen nonterminal semantic seed qualification
        id: semantic
        shell: bash
        env:
          MODEL_PATH: Qwen3.8-4B-Q4_K_M.gguf
          LLAMA_SERVER: llama.cpp/build/bin/llama-server
        run: |
          set +e
          python verify_qwen38_4b_root1_semantic_seed_v1.py
          rc=$?
          set -e
          echo "$rc" > qwen38_4b_semantic_seed_exit_code.txt
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
      - name: Commit immutable-style result receipt to verification branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "project-brain-verifier"
          git config user.email "actions@users.noreply.github.com"
          git add qwen38_4b_semantic_seed_result.json qwen38_4b_semantic_seed_exit_code.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No result receipt produced"
          else
            git commit -m "Record Qwen3.8-4B Root1 semantic seed receipt"
            git push origin HEAD:verify/qwen38-4b-root1-semantic-seed-20261004
          fi
      - name: Enforce suite verdict
        if: always()
        shell: bash
        run: |
          rc="${{ steps.semantic.outputs.rc }}"
          test -n "$rc"
          test "$rc" -eq 0
