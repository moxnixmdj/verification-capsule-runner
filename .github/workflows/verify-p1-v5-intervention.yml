name: Verify Brain P1 V5 typed intervention envelope
on:
  pull_request:
    paths:
      - "capsules/p1_v5_intervention/**"
      - ".github/workflows/verify-p1-v5-intervention.yml"
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact Brain P1 V5 blobs and behavior
        run: python capsules/p1_v5_intervention/verify.py
