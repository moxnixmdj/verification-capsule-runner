name: Verify residual minimum reality cut V5
on:
  pull_request:
    branches: [main]
    paths:
      - 'verification/minimum_reality_cut.py'
      - 'verification/residual_cut_input_v5.json'
      - 'verification/verify_residual_cut_v5.py'
      - '.github/workflows/verify-residual-cut-v5.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: cd verification && python minimum_reality_cut.py --self-test
      - run: cd verification && python verify_residual_cut_v5.py
