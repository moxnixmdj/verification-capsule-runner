name: Verify terminal certificate cut v1
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/terminal_certificate_cut_v1/**"
      - ".github/workflows/verify-terminal-certificate-cut-v1.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact terminal certificate quotient
        run: |
          cd capsules/terminal_certificate_cut_v1
          export PYTHONPATH=.
          python -m py_compile canonical/runtime/terminal_certificate_cut_v1.py
          python canonical/tests/test_terminal_certificate_cut_v1.py
