name: Verify residual witness retrieval V1

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact copied Brain retrieval bytes
        run: python capsules/residual_witness_retrieval_v1/verify.py
