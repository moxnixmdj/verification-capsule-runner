name: Verify TB-Science tranche1 authority V1
on:
  push:
    branches: ["verify/tb-science-tranche1-authority-v1-20261003"]
    paths:
      - "capsules/tb_science_tranche1_authority_v1/**"
      - ".github/workflows/verify-tb-science-tranche1-authority-v1.yml"
  pull_request:
    branches: [main]
    paths:
      - "capsules/tb_science_tranche1_authority_v1/**"
      - ".github/workflows/verify-tb-science-tranche1-authority-v1.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact authority and carrier binding
        run: |
          set -euo pipefail
          A=capsules/tb_science_tranche1_authority_v1/canonical/governance/TB_SCIENCE_TRANCHE1_EXECUTION_AUTHORITY_V1.json
          R=capsules/tb_science_tranche1_authority_v1/canonical/governance/TERMINAL_BENCH_SCIENCE_ROUTE_ACTIVATION_V1.json
          test "$(git hash-object "$A")" = "14227eba31de060cab3b7906dd15466486e4842c"
          test "$(git hash-object "$R")" = "49be2c7d91a2ed444acf2b9a2c178403f5f8005c"
          test "$(git hash-object .github/workflows/execute-tb-science-tranche1-v1.yml)" = "bf79ac405b0d88d6926383db2e67e513a95f77d3"
          test "$(git hash-object capsules/tb_science_execution_v1/canonical/governance/TB_SCIENCE_TERMINAL_EXECUTION_MANIFEST_V1.json)" = "6dfa880b1f68881531afbba6ca211681801fd19b"
          test "$(git hash-object capsules/tb_science_execution_v1/canonical/runtime/harbor_science_agent_v1.py)" = "8ab8287fdb6a9b63b9fe2d2addde731486c89d1e"
          test "$(git hash-object capsules/tb_science_execution_v1/canonical/runtime/harbor_science_planner_v1.py)" = "17472fd2b01b164fbb180aecfc04385b55b11499"
          test ! -e capsules/tb_science_execution_v1/ARM_TRANCHE1.json
          python - <<'PY'
          import json
          a=json.load(open("capsules/tb_science_tranche1_authority_v1/canonical/governance/TB_SCIENCE_TRANCHE1_EXECUTION_AUTHORITY_V1.json"))
          m=json.load(open("capsules/tb_science_execution_v1/canonical/governance/TB_SCIENCE_TERMINAL_EXECUTION_MANIFEST_V1.json"))
          expected=[x["slot_id"] for x in m["slots"][:3]]
          assert len(expected)==3 and len(set(expected))==3
          assert a["authorized_slot_ids"]==expected,(a["authorized_slot_ids"],expected)
          assert a["exact_inputs"]["manifest_blob"]=="6dfa880b1f68881531afbba6ca211681801fd19b"
          assert a["exact_inputs"]["controller_blob"]=="8ab8287fdb6a9b63b9fe2d2addde731486c89d1e"
          assert a["exact_inputs"]["planner_blob"]=="17472fd2b01b164fbb180aecfc04385b55b11499"
          assert a["exact_inputs"]["execution_workflow_blob"]=="bf79ac405b0d88d6926383db2e67e513a95f77d3"
          assert a["exact_inputs"]["execution_capsule_merge_sha"]=="32248ceb1e6965abb3ec56b61210590ef6da0a8d"
          assert a["exact_inputs"]["preflight_run_id"]==37101487121
          assert a["carrier"]["harbor_max_retries"]==0
          assert a["carrier"]["agent_timeout_multiplier"]==0.60
          assert a["result_semantics"]["every_other_final_state"]=="ZERO"
          assert a["result_semantics"]["denominator"]=="FIXED_210"
          assert a["auto_revoke_after_all_authorized_slots_finalized"] is True
          assert a["execution_authority"] is False
          assert a["promotion_authority"] is False
          print(json.dumps({"schema":"PROJECT_BRAIN_TB_SCIENCE_TRANCHE1_AUTHORITY_VERIFICATION_V1","status":"PASS","authorized_slots":expected,"terminal_trials_executed":0,"incremental_spend_usd":0},sort_keys=True))
          PY
