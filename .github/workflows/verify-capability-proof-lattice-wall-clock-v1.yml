name: Verify capability proof lattice wall-clock reconciliation

on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/capability_proof_lattice_wall_clock_v1/**"
      - ".github/workflows/verify-capability-proof-lattice-wall-clock-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bind exact Brain blobs
        run: |
          test "$(git hash-object capsules/capability_proof_lattice_wall_clock_v1/canonical/runtime/capability_proof_compression_optimizer_v1.py)" = "c40f8c7d98605e26c0c99c4f9c210d2c7f107d4d"
          test "$(git hash-object capsules/capability_proof_lattice_wall_clock_v1/canonical/tests/test_capability_proof_compression_optimizer_v1.py)" = "719da0a0a44ca67e0383ce83c638e2cf362aa08c"
          test "$(git hash-object capsules/capability_proof_lattice_wall_clock_v1/canonical/governance/CURRENT_CAPABILITY_COMPARISON_LEDGER.json)" = "a15527ce879b6eecef12bdb151e3f4b4eea2c14f"
          test "$(git hash-object capsules/capability_proof_lattice_wall_clock_v1/canonical/governance/CURRENT_BRANDED_BENCHMARK_RECEIPT_LEDGER.json)" = "a3ce0022815d911fcb0b4cf88a0b49383e5f37f4"
          test "$(git hash-object capsules/capability_proof_lattice_wall_clock_v1/canonical/governance/CURRENT_BENCHMARK_CAPABILITY_DOMINANCE_FRONTIER.json)" = "3454a9bbe724409d229ff855c5d4427ace18c15d"
          test "$(git hash-object capsules/capability_proof_lattice_wall_clock_v1/canonical/laws/BENCHMARK_MEASUREMENT_VS_CAPABILITY_PROOF_LAW_V2.md)" = "cf2b8f056112bcefdba2ac3f8c0d2feb925e236f"
          test "$(git hash-object capsules/capability_proof_lattice_wall_clock_v1/canonical/tests/test_capability_proof_lattice_wall_clock_reconciliation_v1.py)" = "22b266f12f4fd323b7bc616144ee0aecbfb3fca8"
      - name: Compile optimizer
        run: python -m py_compile capsules/capability_proof_lattice_wall_clock_v1/canonical/runtime/capability_proof_compression_optimizer_v1.py
      - name: Run exact focused tests
        env:
          PYTHONPATH: capsules/capability_proof_lattice_wall_clock_v1
        run: |
          python -m unittest -v \
            canonical.tests.test_capability_proof_compression_optimizer_v1 \
            canonical.tests.test_capability_proof_lattice_wall_clock_reconciliation_v1
