name: Verify current Brain prewave controller composition
on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/runtime/astra_runtime.py'
      - 'canonical/runtime/m4_research_control.py'
      - 'canonical/runtime/shared_decision_primitives.py'
      - 'canonical/runtime/bound_capabilities/research_query_focus.py'
      - 'canonical/runtime/bound_capabilities/open_web_source_candidate_discovery.py'
      - 'canonical/runtime/bound_capabilities/objective_relevance_bm25.py'
      - 'canonical/tests/test_astra_runtime_model_independence.py'
      - 'canonical/tests/test_astra_runtime_verification.py'
      - 'canonical/tests/test_m4_research_control.py'
      - 'canonical/tests/test_open_research_query_focus_relevance.py'
      - '.github/workflows/verify-prewave-controller-composition-current.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Run exact current Brain controller composition regressions
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m unittest -v \
            canonical.tests.test_astra_runtime_model_independence \
            canonical.tests.test_astra_runtime_verification \
            canonical.tests.test_m4_research_control \
            canonical.tests.test_open_research_query_focus_relevance
