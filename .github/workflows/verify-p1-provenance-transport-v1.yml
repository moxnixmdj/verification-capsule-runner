name: Verify P1 provenance transport v1

on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/p1_provenance_transport_v1/**"
      - ".github/workflows/verify-p1-provenance-transport-v1.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Independently reproduce corrected-P1 provenance counterexample
        run: python capsules/p1_provenance_transport_v1/verify_independent.py
