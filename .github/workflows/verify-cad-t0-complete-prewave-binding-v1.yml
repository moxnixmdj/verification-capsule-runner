name: Verify CAD T0 complete prewave binding
on:
  pull_request:
    branches: [main]
    paths:
      - 'capsules/cad_t0_complete_prewave_binding_v1/**'
      - '.github/workflows/verify-cad-t0-complete-prewave-binding-v1.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact Brain blobs
        shell: bash
        run: |
          set -euo pipefail
          cd capsules/cad_t0_complete_prewave_binding_v1
          test "$(git hash-object canonical/governance/CAD_T0_GEOMETRY_SOURCE_POOL_V1.json)" = "baa6c9c1b8a59b3cd28523c18fe8f5e8ef05051b"
          test "$(git hash-object canonical/governance/CAD_T0_CANDIDATE_FREEZE_V1.json)" = "5d1933a210e748d5cc28992cdfdafa6c019d5cce"
          test "$(git hash-object canonical/governance/CAD_T0_MULTIPLEX_TERMINAL_BINDING_V1.json)" = "b196acadd2f735a7db2d802b5f8f24c01d2445a3"
          test "$(git hash-object canonical/governance/CAD_T0_EVALUATOR_OBSERVATION_SCHEMA_V1.json)" = "2bc87504a54c76003f715be9a52c6e635c8991a6"
          test "$(git hash-object canonical/runtime/cad_t0_geometry_population.py)" = "64ca276410e2c1dbcd55cfad057e3eec0709790a"
          test "$(git hash-object canonical/runtime/cad_t0_oracle_adapter.py)" = "a6e76e1865b9bd9829dbbcf38886486636f76e8a"
          test "$(git hash-object canonical/runtime/cad_t0_multiplex_scorer.py)" = "89833581dc4ac67498753feb94e2ff69bad3b7f1"
          test "$(git hash-object canonical/runtime/cad_t0_prewave_binding_guard.py)" = "6936b397141fe519f53aee5e8481c56ef7442b6f"
          test "$(git hash-object canonical/tests/test_cad_t0_geometry_population_and_oracle.py)" = "ea98ceda53c8e4a09d72b19bcb4aaaf5874098a5"
          test "$(git hash-object canonical/tests/test_cad_t0_prewave_binding_guard.py)" = "0330370db74484c7a7df4fb3245b3b0f6fc2ccc1"
      - name: Compile exact bound runtime
        run: |
          cd capsules/cad_t0_complete_prewave_binding_v1
          python -m py_compile canonical/runtime/cad_t0_geometry_population.py canonical/runtime/cad_t0_oracle_adapter.py canonical/runtime/cad_t0_multiplex_scorer.py canonical/runtime/cad_t0_prewave_binding_guard.py
      - name: Run CAD population oracle and prewave guard regressions
        run: |
          cd capsules/cad_t0_complete_prewave_binding_v1
          PYTHONPATH=. python -m unittest -v canonical.tests.test_cad_t0_geometry_population_and_oracle canonical.tests.test_cad_t0_prewave_binding_guard
      - name: Evaluate live capsule prewave guard
        run: |
          cd capsules/cad_t0_complete_prewave_binding_v1
          PYTHONPATH=. python canonical/runtime/cad_t0_prewave_binding_guard.py .
