name: Guarded Brain PR544 Comparative Multisource Qualification
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  qualify:
    if: github.head_ref == 'guard-qualify/comparative-operand-multisource-v1-20260930'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Verify exact candidate closure
        run: |
          set -euo pipefail
          test "$(git hash-object canonical/runtime/bound_capabilities/open_research_source_frontend.py)" = "f04bbf9182f75ea0b0442e2bc1eca7ce39dcbbfb"
          test "$(git hash-object canonical/runtime/bound_capabilities/objective_claim_operand_binding.py)" = "48fd058430d8d361fc75beced567c7b6d1166531"
          test "$(git hash-object canonical/runtime/bound_capabilities/generic_evidence_claim_relation.py)" = "1da4cca5d8f24892527e496d69d6e0d854220659"
          test "$(git hash-object canonical/tests/test_comparative_operand_multisource_retrieval.py)" = "5eaa4473633d88c2b9d6d24dbaf9606429995aea"
          test "$(git hash-object pr544_comparative_multisource_authority.json)" = "9f15887e53eb981120fe5011073317dd806998ea"
      - name: Generate frozen guarded plan
        run: python generate_brain_pr544_comparative_multisource_plan.py
      - name: Atomically admit and qualify PR544
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python execution_guard/github_actions_guarded_run_live.py --plan brain_pr544_comparative_multisource_plan.json --receipt brain-pr544-comparative-multisource-guard-receipt.json
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: brain-pr544-comparative-multisource-qualification
          path: |
            brain-pr544-comparative-multisource-guard-receipt.json
            brain_pr544_comparative_multisource_plan.json
            pr544_comparative_multisource_authority.json
          if-no-files-found: warn
