name: Verify LiveBench IF thin adapter residual
on:
  pull_request:
    paths:
      - 'subject/livebench_if_thin_adapter_20261004_sol/**'
      - 'verify_livebench_if_thin_adapter_20261004_sol.py'
      - '.github/workflows/verify-livebench-if-thin-adapter-20261004-sol.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python verify_livebench_if_thin_adapter_20261004_sol.py
