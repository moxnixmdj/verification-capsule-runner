name: Verify structured-method normalized graph v3 scope
on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/governance/STRUCTURED_METHOD_NORMALIZED_GRAPH_SCOPE_EQUIVALENCE_RELATION_V1.json'
      - 'canonical/governance/STRUCTURED_METHOD_NORMALIZED_GRAPH_SCOPE_GATE_V2_INPUT.json'
      - 'canonical/verification/STRUCTURED_METHOD_NORMALIZED_GRAPH_V3_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json'
      - '.github/workflows/verify-structured-method-normalized-graph-v3-scope.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Bind exact scope artifacts
        run: |
          test "$(git hash-object canonical/runtime/scope_equivalent_proof_gate_v2.py)" = "2d05172becfc559de3ff1e4e5623c5180028be1b"
          test "$(git hash-object canonical/runtime/structured_method_normalized_graph_candidate_v3.py)" = "7ee731e123bca0f42860535bcdfe06504f23a3ec"
          test "$(git hash-object canonical/runtime/structured_method_normalized_graph_proof_v3.py)" = "3f123fd781c85a7f73ffba5a33efebeea0c4a22f"
          test "$(git hash-object canonical/governance/STRUCTURED_METHOD_NORMALIZED_GRAPH_SCOPE_EQUIVALENCE_RELATION_V1.json)" = "91e53b4f24341968a27a20049ccb38b87f246dad"
          test "$(git hash-object canonical/governance/STRUCTURED_METHOD_NORMALIZED_GRAPH_SCOPE_GATE_V2_INPUT.json)" = "5e13bd6499d0d441649460d9218bf1419078e34e"
          test "$(git hash-object canonical/verification/STRUCTURED_METHOD_NORMALIZED_GRAPH_V3_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json)" = "457dd9ee249d4d9e8a218599d6df98a0dae53936"
      - name: Execute exact scope gate
        run: python canonical/runtime/scope_equivalent_proof_gate_v2.py canonical/governance/STRUCTURED_METHOD_NORMALIZED_GRAPH_SCOPE_GATE_V2_INPUT.json
