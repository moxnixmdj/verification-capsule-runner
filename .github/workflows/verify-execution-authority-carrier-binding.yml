name: Verify carrier-bound execution authority reducer
on:
  pull_request:
    branches: [main]
    paths:
      - 'verification/execution_authority_reducer.py'
      - 'verification/test_execution_authority_reducer.py'
      - '.github/workflows/verify-execution-authority-carrier-binding.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: cd verification && python -m pytest -q test_execution_authority_reducer.py
