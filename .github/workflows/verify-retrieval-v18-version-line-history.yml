name: Verify Retrieval V18 version-line history
on:
  push:
    branches:
      - verify/retrieval-v18-version-line-history-20261004
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact V18 blobs
        run: |
          test "$(git hash-object canonical/runtime/retrieval_live_provider_arena_v18.py)" = "6609d186d2928de689758ff268fa3892ef3248f4"
          test "$(git hash-object canonical/tests/test_retrieval_live_provider_arena_v18.py)" = "7f856645ba1cb2d141c291d0e1d6c098af87c0f6"
      - name: Unit tests
        run: PYTHONPATH=. python canonical/tests/test_retrieval_live_provider_arena_v18.py
      - name: Live V18 probe
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: PYTHONPATH=. python canonical/runtime/retrieval_live_provider_arena_v18.py | tee retrieval-v18-live-result.json
      - uses: actions/upload-artifact@v4
        with:
          name: retrieval-v18-live-result
          path: retrieval-v18-live-result.json
          retention-days: 90
