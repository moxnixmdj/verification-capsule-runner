name: Verify terminal counterexample envelope compiler
on:
  pull_request:
    paths:
      - 'verification/terminal_counterexample_envelope_compiler.py'
      - 'verification/verify_terminal_counterexample_envelope_compiler.py'
      - '.github/workflows/verify-terminal-envelope-compiler-v1.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python verification/verify_terminal_counterexample_envelope_compiler.py
