name: Verify Brain Tool Discovery universal scope V1
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/tool_discovery_universal_scope_v1/**"
      - ".github/workflows/verify-brain-tool-discovery-universal-scope-v1.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact Brain blob identities
        run: |
          cd capsules/tool_discovery_universal_scope_v1
          python - <<'PY'
          import hashlib,json,pathlib
          m=json.load(open("EXPECTED_BRAIN_BLOBS.json",encoding="utf-8"))
          for src,expected in m["exact_brain_blobs"].items():
              raw=pathlib.Path(src).read_bytes()
              got=hashlib.sha1(f"blob {len(raw)}\0".encode()+raw).hexdigest()
              assert got==expected,(src,got,expected)
          print("exact Brain blobs: PASS",len(m["exact_brain_blobs"]))
          PY
      - name: Compile theorem
        run: |
          cd capsules/tool_discovery_universal_scope_v1
          python -m py_compile canonical/runtime/tool_discovery_universal_scope_certificate_v1.py
      - name: Run theorem and adversarial mutation tests
        run: |
          cd capsules/tool_discovery_universal_scope_v1
          export PYTHONPATH=.
          python -m unittest canonical.tests.test_tool_discovery_universal_scope_certificate_v1 -v
      - name: Execute universal scope certificate
        run: |
          cd capsules/tool_discovery_universal_scope_v1
          export PYTHONPATH=.
          python - <<'PY'
          from canonical.runtime.tool_discovery_universal_scope_certificate_v1 import verify
          out=verify()
          assert out["universal_scope_proved"] is True,out
          assert out["basis_kind"]=="UNIVERSAL_FORMAL_SCOPE_PROOF",out
          assert out["target_predicate"]=="TOOL_LEARNING_SUCCESS_ROUTE_NONINFERIOR",out
          assert out["uses_empirical_generalization"] is False,out
          assert out["source_180_of_180_load_bearing"] is False,out
          assert out["internet_wide_tool_identity_completeness_claim"] is False,out
          assert out["acceptance_credit_delta"]==0,out
          assert out["promotion_authority"] is False,out
          print("Tool Discovery universal formal scope proof: PASS")
          PY
