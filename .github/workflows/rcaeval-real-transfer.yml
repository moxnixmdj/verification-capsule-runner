name: RCAEval Real Trace Transfer Pilot
on:
  push:
    branches: ["probe/rcaeval-real-transfer-20261001-v1"]
    paths:
      - ".github/workflows/rcaeval-real-transfer.yml"

jobs:
  pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          python -m pip install "numpy>=2,<3" "pandas>=2,<4" "scikit-learn>=1.5,<2" "scipy>=1.13,<2" "networkx>=3,<4" "causal-learn>=0.1.4" "huggingface_hub>=0.25" "pyarrow>=17"
          python -m pip install --no-deps "git+https://github.com/phamquiluan/RCAEval.git@259ea4167160256a74ad30004aa3d96a998c846e"
      - name: Run pilot
        run: |
          cd atomic_cause_ranking
          python rcaeval_real_transfer.py
