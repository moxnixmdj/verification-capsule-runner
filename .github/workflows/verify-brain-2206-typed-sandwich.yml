name: Verify Brain 2206 typed sandwich bridge

on:
  pull_request:
    paths:
      - "capsules/brain_2206/**"
      - ".github/workflows/verify-brain-2206-typed-sandwich.yml"
  push:
    branches:
      - "verify/typed-sandwich-bridge-2206"
    paths:
      - "capsules/brain_2206/**"
      - ".github/workflows/verify-brain-2206-typed-sandwich.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: capsules/brain_2206
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
      - name: Run vendored candidate regressions
        run: python -m unittest canonical.tests.test_opus55_typed_coverage_dominance_bridge_v1 -v
      - name: Run independent exhaustive verifier
        run: python independent_verify.py
