name: Verify coding substrate materiality counterfactual
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest -v canonical.tests.test_coding_substrate_materiality_counterfactual_v1
      - run: python canonical/runtime/coding_substrate_materiality_counterfactual_v1.py
