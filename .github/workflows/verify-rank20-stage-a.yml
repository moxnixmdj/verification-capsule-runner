name: Verify TB4 Stage A admissions
on:
  pull_request:
    branches: [main]
    paths:
      - 'verification/rank20_stage_a/**'
      - 'verification/rank21_stage_a/**'
      - '.github/workflows/verify-rank20-stage-a.yml'
permissions:
  contents: read
jobs:
  reject-rank20-contaminated:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: |
          if python verification/rank20_stage_a/canonical/runtime/prequalification_stage_a_generic.py verification/rank20_stage_a \
            --ledger canonical/capabilities/opus55/VBA_USERFORM_PORT_RANK20_CONTAMINATION_LEDGER_V1.json \
            --task vba-userform-port --rank 20 \
            --identity-sha256 6f6bf1cdce331bdd86e9ce3c0e67a04452243a7b85b0ada73540a28773ed05bb; then
            echo "contaminated rank20 unexpectedly passed"; exit 1
          fi
  reject-rank21-contaminated:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: |
          if python verification/rank21_stage_a/canonical/runtime/prequalification_stage_a_generic.py verification/rank21_stage_a \
            --ledger canonical/capabilities/opus55/FOODSTUFF_BETA_ACTIVITY_RANK21_CONTAMINATION_LEDGER_V1.json \
            --task foodstuff-beta-activity --rank 21 \
            --identity-sha256 739de05acf999b15937939b58320c3eb42e030780cd630a5e8209bc25615756b; then
            echo "contaminated rank21 unexpectedly passed"; exit 1
          fi
  accept-rank22-clean:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: |
          python verification/rank21_stage_a/canonical/runtime/prequalification_stage_a_generic.py verification/rank21_stage_a \
            --ledger canonical/capabilities/opus55/FREECAD_SPRING_CLIP_RANK22_CONTAMINATION_LEDGER_V1.json \
            --task freecad-spring-clip --rank 22 \
            --identity-sha256 7742f7fe0593f2403d523041412f269c9457299dd2e21ada6032aa2d20451aed
