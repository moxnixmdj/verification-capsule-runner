name: Verify rank20 Stage A admission
on:
  pull_request:
    branches: [main]
    paths:
      - 'verification/rank20_stage_a/**'
      - '.github/workflows/verify-rank20-stage-a.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run exact Brain Stage-A reducer on rank20 evidence
        run: |
          python verification/rank20_stage_a/canonical/runtime/prequalification_stage_a_generic.py verification/rank20_stage_a \
            --ledger canonical/capabilities/opus55/VBA_USERFORM_PORT_RANK20_CONTAMINATION_LEDGER_V1.json \
            --task vba-userform-port --rank 20 \
            --identity-sha256 6f6bf1cdce331bdd86e9ce3c0e67a04452243a7b85b0ada73540a28773ed05bb
