name: Verify M0A M1A hardening candidates
on:
  pull_request:
    branches: [main]
    paths:
      - 'verification/drawing_perspective_rectification.py'
      - 'verification/drawing_robust_preprocess.py'
      - 'verification/gdt_feature_control_parser.py'
      - 'verification/explicit_definition_reference_graph.py'
      - 'verification/test_m0a_m1a_hardening_independent.py'
      - 'verification/M0A_M1A_HARDENING_SOURCE_V1.json'
      - '.github/workflows/verify-m0a-m1a-hardening.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check numpy opencv-python-headless
      - name: Verify exact Brain source blobs
        run: |
          test "$(git hash-object verification/drawing_perspective_rectification.py)" = "cceb48f7d971e13b9ac3a5d9c8c3cf94e0eb632c"
          test "$(git hash-object verification/drawing_robust_preprocess.py)" = "8e95ffffbf5b0c8a37ccd7505b447eedbdcc4c8c"
          test "$(git hash-object verification/gdt_feature_control_parser.py)" = "de02499836fb41883cb0feadcaa9554604a260e3"
          test "$(git hash-object verification/explicit_definition_reference_graph.py)" = "b6d4676aa88b936f11fc088afa64cf57c066ed9e"
      - run: cd verification && python -m unittest -v test_m0a_m1a_hardening_independent
