name: Verify LiveBench IF 58-checker preflight
on:
  pull_request:
    branches: [main]
    paths:
      - 'livebench/if_runner/ifbench/**'
      - 'verification/test_livebench_58_checker_preflight.py'
      - '.github/workflows/verify-livebench-58-checker-preflight.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      NLTK_DATA: ${{ runner.temp }}/nltk_data
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Download and verify frozen semantic dependency wheels
        run: |
          set -euo pipefail
          mkdir -p /tmp/wheels
          python -m pip download --no-deps --dest /tmp/wheels             nltk==3.10.3 emoji==2.16.0 syllapy==0.7.2
          cd /tmp/wheels
          echo "ff9598a8e20518ee0d557745890cc4435b9578489e2dcbc69c4f81fa060caf7c  nltk-3.10.3-py3-none-any.whl" | sha256sum -c -
          echo "c4230d80640def9071599ff56b1b5950fe13a2a94c0da98c5deab12431b24330  emoji-2.16.0-py3-none-any.whl" | sha256sum -c -
          echo "198a7413033c32d7b31e21962efb3f284bcea80d3346e954b938ca1ebe6bee20  syllapy-0.7.2-py3-none-any.whl" | sha256sum -c -
          python -m pip install ./nltk-3.10.3-py3-none-any.whl ./emoji-2.16.0-py3-none-any.whl ./syllapy-0.7.2-py3-none-any.whl absl-py
      - name: Materialize and verify frozen NLTK data blobs
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP}/nltk_data_repo"
          mkdir -p "$work" "$NLTK_DATA/tokenizers" "$NLTK_DATA/corpora" "$NLTK_DATA/taggers"
          git -C "$work" init -q
          git -C "$work" remote add origin https://github.com/nltk/nltk_data.git
          git -C "$work" fetch -q --depth=1 origin 550b6625bcef1f2abff2ff770a5a0d272c9c6b2a
          git -C "$work" checkout -q FETCH_HEAD --             packages/tokenizers/punkt.zip             packages/tokenizers/punkt_tab.zip             packages/corpora/stopwords.zip             packages/taggers/averaged_perceptron_tagger.zip             packages/taggers/averaged_perceptron_tagger_eng.zip
          test "$(git -C "$work" hash-object packages/tokenizers/punkt.zip)" = "da7ffbd1e6fd6cc5c2f6879c2d4da23c7691944c"
          test "$(git -C "$work" hash-object packages/tokenizers/punkt_tab.zip)" = "5e5ff6137d5ee6025e400d1c3a7b21914c48b635"
          test "$(git -C "$work" hash-object packages/corpora/stopwords.zip)" = "56d35b5d204d64480f71edc0f5f82aebce6730b6"
          test "$(git -C "$work" hash-object packages/taggers/averaged_perceptron_tagger.zip)" = "d5bfb6852aa5d288c8f33b3f0ef0fde343afa405"
          test "$(git -C "$work" hash-object packages/taggers/averaged_perceptron_tagger_eng.zip)" = "b792e19546a5711218a05f4029ef17c8d62cd839"
          unzip -q "$work/packages/tokenizers/punkt.zip" -d "$NLTK_DATA/tokenizers"
          unzip -q "$work/packages/tokenizers/punkt_tab.zip" -d "$NLTK_DATA/tokenizers"
          unzip -q "$work/packages/corpora/stopwords.zip" -d "$NLTK_DATA/corpora"
          unzip -q "$work/packages/taggers/averaged_perceptron_tagger.zip" -d "$NLTK_DATA/taggers"
          unzip -q "$work/packages/taggers/averaged_perceptron_tagger_eng.zip" -d "$NLTK_DATA/taggers"
      - name: Assert vendored verifier has no runtime download hook
        run: |
          set -euo pipefail
          ! grep -R "nltk.download" livebench/if_runner/ifbench
          ! grep -R "import spacy\|from spacy" livebench/if_runner/ifbench
      - name: Run exact 58-checker directional preflight
        run: |
          set -euo pipefail
          PYTHONPATH=. python verification/test_livebench_58_checker_preflight.py
      - name: Capture runtime lock candidates
        if: always()
        run: python -m pip freeze | sort
