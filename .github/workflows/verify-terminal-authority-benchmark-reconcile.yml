name: Verify terminal authority benchmark reconciliation
on:
  push:
    branches: ["verify/terminal-authority-benchmark-reconcile-20261003-sol"]
    paths:
      - ".github/workflows/verify-terminal-authority-benchmark-reconcile.yml"
      - "capsules/terminal_authority_benchmark_reconcile/brain/**"
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact authority bytes and current truth
        run: |
          set -euo pipefail
          ROOT=capsules/terminal_authority_benchmark_reconcile/brain
          test "$(git hash-object "$ROOT/canonical/governance/CURRENT_TERMINAL_AUTHORITY_V1.json")" = "c50066cbaa5fa537bfd273c81467ca9ce7c25e61"
          test "$(git hash-object "$ROOT/canonical/governance/EXTERNAL_BENCHMARK_DOMINANCE_GATE_V1.json")" = "d5eba104f28f6ba0bb400967057dc02029e2353e"
          test "$(git hash-object "$ROOT/canonical/governance/CURRENT_26_ZERO_REALITY_FRONTIER_V3_ACTIVATION.json")" = "5a407551b05eae1622b17b6898924985a2d926f5"
          python - <<'PY'
          import json
          root="capsules/terminal_authority_benchmark_reconcile/brain/canonical/governance/"
          a=json.load(open(root+"CURRENT_TERMINAL_AUTHORITY_V1.json"))
          assert a["truth"]["opus55_acceptance"]=="5/19_PASS__14/19_OPEN",a["truth"]
          assert a["truth"]["achieved"] is False
          assert "CURRENT_ACCEPTANCE_IS_5_OF_19_AND_12_OF_38_ATOMIC" in a["rule"]
          assert "CURRENT_ACCEPTANCE_IS_3_OF_19_AND_8_OF_38_ATOMIC" not in a["rule"]
          assert a["next_terminal_action"]=="BENCHMARK_DOMINANCE_PRECEDENCE__SATURATE_EXISTING_RECEIPTS_ON_CURRENT_12_OF_38_STATE__RECOMPUTE_FIXED_POINT__NO_FRESH_REALITY"
          assert a["sources"]["external_benchmark_dominance_gate"]["git_blob_sha"]=="d5eba104f28f6ba0bb400967057dc02029e2353e"
          assert a["sources"]["current_26_zero_reality_frontier_v3"]["activation_git_blob_sha"]=="5a407551b05eae1622b17b6898924985a2d926f5"
          assert a["authorities"]["external_benchmark_dominance_gate_v1"]["status"].startswith("ACTIVE_INDEPENDENT_PUBLIC_RUNNER_PASS")
          assert a["authorities"]["current_26_zero_reality_frontier_v3"]["status"].startswith("ACTIVE_INDEPENDENT_PUBLIC_RUNNER_PASS")
          g=json.load(open(root+"EXTERNAL_BENCHMARK_DOMINANCE_GATE_V1.json"))
          v=json.load(open(root+"CURRENT_26_ZERO_REALITY_FRONTIER_V3_ACTIVATION.json"))
          assert g["fresh_reality_authority"] is False
          assert v["fresh_reality_authority"] is False
          assert v["active_counts"]=={"accepted_families":5,"open_families":14,"proved_predicates":12,"unresolved_predicates":26,"primitive_zero_reality_work_units":30}
          print("TERMINAL_AUTHORITY_BENCHMARK_RECONCILIATION_PASS")
          PY
