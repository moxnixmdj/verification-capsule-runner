name: Verify exact Brain LiveBench bytes V1
# RETRIGGER_V1

on:
  push:
    branches: [verify-livebench-exact-brain-bytes-20261004-sol]
    paths:
      - 'canonical/runtime/livebench_legacy_visible_constraint_compiler_v1.py'
      - 'canonical/runtime/livebench_legacy_visible_constraint_compiler_v4.py'
      - 'canonical/runtime/livebench_frozen_active_legacy15_v1.py'
      - 'canonical/runtime/livebench_legacy15_joint_witness_v1.py'
      - 'verify_livebench_exact_brain_bytes_v1.py'
      - '.github/workflows/verify-livebench-exact-brain-bytes-v1.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact Brain Git blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object canonical/runtime/livebench_legacy_visible_constraint_compiler_v1.py)" = "e986035ff68b53c0dc7a7eb478f6e3d8882214aa"
          test "$(git hash-object canonical/runtime/livebench_legacy_visible_constraint_compiler_v4.py)" = "721207ba39d502e3f610289578e9d5bab78b1fcc"
          test "$(git hash-object canonical/runtime/livebench_frozen_active_legacy15_v1.py)" = "34440ee69322e9d519cbe656cb03c55683a8b9c6"
          test "$(git hash-object canonical/runtime/livebench_legacy15_joint_witness_v1.py)" = "029d6018fd705fa5d1a53c88c4c3dd60764d8489"
      - name: Install exact scorer dependencies
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check pyarrow==21.0.0 nltk==3.10.3 langdetect==1.0.9 immutabledict==4.2.2
      - name: Checkout exact frozen legacy scorer and NLTK assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/LiveBench /tmp/nltk_data_repo /tmp/nltk_data
          git init /tmp/LiveBench
          git -C /tmp/LiveBench remote add origin https://github.com/LiveBench/LiveBench.git
          git -C /tmp/LiveBench fetch --depth 1 origin 8f8e5c381a16e3f24257776edd53471fe86f8091
          git -C /tmp/LiveBench checkout --detach FETCH_HEAD
          test "$(git -C /tmp/LiveBench rev-parse HEAD)" = "8f8e5c381a16e3f24257776edd53471fe86f8091"
          test "$(git -C /tmp/LiveBench hash-object livebench/if_runner/instruction_following_eval/instructions.py)" = "4997bab885a676d92545fd91a9a20b48d234a2b2"
          test "$(git -C /tmp/LiveBench hash-object livebench/if_runner/instruction_following_eval/instructions_registry.py)" = "903ed738398648c7cfac61d5ffa478c22f1f0891"
          test "$(git -C /tmp/LiveBench hash-object livebench/if_runner/instruction_following_eval/instructions_util.py)" = "1f0dc0eaa05bd0f72f82f8183b90276ea4d2a87b"
          git clone --filter=blob:none --no-checkout https://github.com/nltk/nltk_data.git /tmp/nltk_data_repo
          git -C /tmp/nltk_data_repo checkout 550b6625bcef1f2abff2ff770a5a0d272c9c6b2a -- packages/tokenizers/punkt.zip packages/tokenizers/punkt_tab.zip
          mkdir -p /tmp/nltk_data/tokenizers
          unzip -q /tmp/nltk_data_repo/packages/tokenizers/punkt.zip -d /tmp/nltk_data/tokenizers
          unzip -q /tmp/nltk_data_repo/packages/tokenizers/punkt_tab.zip -d /tmp/nltk_data/tokenizers
      - name: Download exact public 200-case population
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 6 --retry-delay 2 --retry-all-errors "https://huggingface.co/datasets/livebench/instruction_following/resolve/0868379c4b5cf62aeacaf8be4f08fced815c81bb/data/test-00000-of-00001.parquet" -o /tmp/instruction_following.parquet
          .venv/bin/python - <<'PY'
          import hashlib
          from pathlib import Path
          p=Path("/tmp/instruction_following.parquet")
          assert p.stat().st_size == 537024
          assert hashlib.sha256(p.read_bytes()).hexdigest() == "a9bb97bbaf8788142c310bcb33d50e2f6f5df8cbd8b8c3db677816b06f0f4f25"
          PY
      - name: Execute exact Brain bytes
        env:
          NLTK_DATA: /tmp/nltk_data
        run: |
          set -euo pipefail
          .venv/bin/python verify_livebench_exact_brain_bytes_v1.py
      - name: Print receipt
        if: always()
        run: |
          test ! -f legacy15_joint_public_exact_receipt.json || cat legacy15_joint_public_exact_receipt.json
      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livebench-exact-brain-bytes-v1
          path: legacy15_joint_public_exact_receipt.json
          if-no-files-found: warn
      - name: Commit receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f legacy15_joint_public_exact_receipt.json || exit 0
          mkdir -p receipts
          cp legacy15_joint_public_exact_receipt.json receipts/livebench_exact_brain_bytes_v1.json
          git config user.name "project-brain-verifier"
          git config user.email "project-brain-verifier@users.noreply.github.com"
          git add receipts/livebench_exact_brain_bytes_v1.json
          git diff --cached --quiet && exit 0
          git commit -m "Record exact Brain-byte LiveBench receipt"
          git push origin HEAD:verify-livebench-exact-brain-bytes-20261004-sol
