name: Diagnose Spent Composition Requalification V2

on:
  push:
    branches: [verify/composition-requal-canonical-authority-v2-20260930]
    paths:
      - 'ARM_DIAGNOSE_SPENT_COMPOSITION_REQUAL_V2_20260930'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Static compile and pure decision diagnosis only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util,json,pathlib,sys,hashlib,traceback
          root=pathlib.Path(".").resolve()
          def load(name,path):
              spec=importlib.util.spec_from_file_location(name,root/path)
              mod=importlib.util.module_from_spec(spec); sys.modules[name]=mod; spec.loader.exec_module(mod); return mod
          compiler=load("diag_compiler","canonical/runtime/goal_compiler.py")
          grounder=load("diag_grounder","canonical/runtime/bound_capabilities/plain_goal_bound_grounding.py")
          composer=load("diag_composer","canonical/runtime/bound_capabilities/grounded_executable_composition.py")
          planner=load("diag_planner","canonical/runtime/capability_planner.py")
          proposal=load("diag_proposal","canonical/runtime/capability_proposal_generators.py")
          producer=load("diag_producer","canonical/runtime/bound_capabilities/evidence_decision_synthesis.py")
          verifier=load("diag_verifier","canonical/runtime/bound_capabilities/evidence_decision_verify.py")
          registry=json.loads((root/"canonical/runtime/BOUND_CAPABILITY_REGISTRY_V1.json").read_text())["capabilities"]
          registry=compiler._platform_admissible_registry(registry)

          input_path="canonical/tasks/COMPOSITION_REQUAL_CANONICAL_AUTHORITY_20260930.json"
          output_path="canonical/astra_runtime/tmp/COMPOSITION_REQUAL_CANONICAL_AUTHORITY_OUTPUT.json"
          goal=(
            "Using typed decision evidence at "+input_path+
            ", synthesize the decision to "+output_path+
            ". Then independently verify the decision result at "+output_path+"."
          )

          # 1. Pure producer/verifier semantics first. This must survive any later
          # compiler/composer diagnostic failure.
          problem=json.loads((root/input_path).read_text())
          synthesized=producer.synthesize(problem)
          direct_ok,direct_reason=verifier.verify(problem,synthesized)

          # 2. Inspect the direct compound compiler path without executing it.
          compile_error=None
          compiled=None
          compiled_actions=[]
          try:
              compiled=compiler.compile_goal(goal,registry,root)
              compiled_actions=[
                  x for x in (compiled.get("controller_actions") or [])
                  if isinstance(x,dict) and x.get("type")!="finish"
              ]
          except Exception as exc:
              compile_error={"type":type(exc).__name__,"message":str(exc)}

          # 3. Inspect the grounded-composition path separately. Ambiguity here
          # must not erase the direct semantic/binding evidence above.
          grounding_error=None
          composition_error=None
          grounding=None
          composition=None
          planned_actions=[]
          try:
              grounding=grounder.ground(
                  goal,registry,compiler=compiler,proposal_binder=proposal,root=root,
                  enforce_bindability=True,
              )
              try:
                  composition=composer.compose(
                      goal,grounding,registry,compiler,root,
                      verified_initial_facts=["structured.decision_evidence.available"],
                  )
                  planned=planner.plan_actions(composition["problem"])
                  planned_actions=[x for x in planned["actions"] if x.get("type")!="finish"]
              except Exception as exc:
                  composition_error={"type":type(exc).__name__,"message":str(exc)}
          except Exception as exc:
              grounding_error={"type":type(exc).__name__,"message":str(exc)}

          def binding_summary(actions):
              rows=[]
              for i,a in enumerate(actions):
                  if not isinstance(a,dict):
                      continue
                  args=a.get("args") if isinstance(a.get("args"),dict) else {}
                  cid=args.get("capability_id")
                  if cid in {"decision.synthesis.typed.stdlib","decision.synthesis.verify.stdlib"}:
                      rows.append({
                          "index":i,
                          "capability_id":cid,
                          "input_path":args.get("input_path"),
                          "result_path":args.get("result_path"),
                          "output_path":args.get("output_path"),
                      })
              return rows

          direct_bindings=binding_summary(compiled_actions)
          grounded_bindings=binding_summary(planned_actions)

          classification="UNRESOLVED"
          if not direct_ok:
              classification="PRODUCER_VERIFIER_SEMANTIC_MISMATCH"
          elif direct_ok and direct_bindings:
              verifier_rows=[x for x in direct_bindings if x["capability_id"]=="decision.synthesis.verify.stdlib"]
              if verifier_rows:
                  vr=verifier_rows[-1]
                  if vr.get("input_path")!=input_path or vr.get("result_path")!=output_path:
                      classification="DIRECT_COMPOUND_COMPILER_BINDING_MISMATCH"
                  elif composition_error:
                      classification="GROUNDED_COMPOSITION_DIAGNOSTIC_AMBIGUITY_AFTER_DIRECT_PATH_PROVEN_CORRECT"
                  else:
                      classification="DIRECT_AND_GROUNDED_BINDINGS_REQUIRE_FURTHER_DIAGNOSIS"

          report={
            "schema":"PROJECT_BRAIN_SPENT_REQUAL_STATIC_DIAGNOSTIC_V2",
            "non_crediting":True,
            "no_controller_execution":True,
            "spent_run_id":36656793034,
            "classification":classification,
            "direct_pure_verify":{"ok":direct_ok,"reason":direct_reason},
            "direct_selected":synthesized.get("selected_alternative"),
            "direct_status":synthesized.get("status"),
            "input_hash_in_result":synthesized.get("input_sha256"),
            "input_hash_direct":hashlib.sha256(json.dumps(problem,sort_keys=True,separators=(",",":"),ensure_ascii=False).encode()).hexdigest(),
            "direct_compile_error":compile_error,
            "direct_compiler_bindings":direct_bindings,
            "grounding_error":grounding_error,
            "grounding_unresolved":None if grounding is None else grounding.get("unresolved_clause_indexes"),
            "composition_error":composition_error,
            "composition_ready":None if composition is None else composition.get("composition_ready"),
            "grounded_planned_bindings":grounded_bindings,
          }
          pathlib.Path("SPENT_COMPOSITION_REQUAL_STATIC_DIAGNOSTIC.json").write_text(
              json.dumps(report,indent=2,sort_keys=True)+"\n"
          )
          print(json.dumps(report,sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: spent-composition-requal-static-diagnostic
          path: SPENT_COMPOSITION_REQUAL_STATIC_DIAGNOSTIC.json
