name: Verify Unknown-Domain V2 final activation
on:
  pull_request:
    branches: [main]
    paths:
      - 'verify_unknown_domain_v2_final_activation.py'
      - 'canonical/governance/UNKNOWN_DOMAIN_DIRECT_PREDICATE_LOCAL_ACTIVATION_V1.json'
      - 'canonical/verification/UNKNOWN_DOMAIN_V2_ACTIVATION_CANDIDATE_PUBLIC_RUNNER_VERIFICATION_20261004_V1.json'
      - '.github/workflows/verify-unknown-domain-v2-final-activation.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python verify_unknown_domain_v2_final_activation.py
