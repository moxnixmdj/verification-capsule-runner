name: Verify professional V7 12-of-12 composition
on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/**'
      - '.github/workflows/verify-professional-v7-12of12-composition.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Bind exact Brain composition blobs
        run: |
          set -euo pipefail
          test "$(git hash-object 'canonical/governance/PROFESSIONAL_QUALITY_P1_V7_SAME_SUBJECT_ROOT_BINDING_WORKLIST_20261010_V18.json')" = "0d6efbd19f1b7d30853234a0e1f2633b52539f76"
          test "$(git hash-object 'canonical/runtime/professional_quality_root_binding_compat_v1.py')" = "21bcd114cd031823fb929a7be50a6efa00f898d7"
          test "$(git hash-object 'canonical/tests/test_professional_quality_root_binding_compat_v1.py')" = "9bc59e66b87821c11f34f0ad2aabe37c278d1577"
          test "$(git hash-object 'canonical/runtime/professional_quality_v7_real_12of12_composition_verify_v1.py')" = "07c64c87dea89cab346ed4c0ae1146f2250a4c73"
          test "$(git hash-object 'canonical/tests/test_professional_quality_v7_real_12of12_composition_verify_v1.py')" = "d75c2a7476ed9bdd66af1d0dbc7c0fc2429006e9"
          test "$(git hash-object 'canonical/governance/PROFESSIONAL_QUALITY_R3_ROOT_SUBJECT_BINDING_20261010_V1.json')" = "c49c120a61620d400e372884266b63ec34a054d2"
          test "$(git hash-object 'canonical/verification/PROFESSIONAL_QUALITY_R3_V7_ROOT_SUBJECT_BINDING_VERIFY_20261010_V1.json')" = "92cacbd5f7b37cb515db9ebbc3685c961fc9e34e"
          test "$(git hash-object 'canonical/governance/PROFESSIONAL_QUALITY_SCOPED_EVIDENCE_REGISTRY_20261010_V1.json')" = "b9ddf7cbe7fbfad0e81fe068a0c19b48703b5aba"
          test "$(git hash-object 'canonical/verification/PROFESSIONAL_QUALITY_R4_SEMANTIC_SCOPED_INTEGRATION_VERIFY_20261010_V1.json')" = "664c22bfdfc51ea4058e4e2d3c3efe9d8def907b"
          test "$(git hash-object 'canonical/runtime/professional_quality_same_subject_composition_gate_v3.py')" = "ddbe6ec92fef405b8909a161ef9acd685ec7317b"
          test "$(git hash-object 'canonical/verification/PROFESSIONAL_QUALITY_SAME_SUBJECT_GATE_V3_RECEIPT_ADAPTER_PUBLIC_VERIFY_20261010_V1.json')" = "79910bf40700ddf000630a7169566fef91e6c939"
          test "$(git hash-object 'canonical/verification/PROFESSIONAL_QUALITY_R12_V7_ROOT_SUBJECT_BINDING_PUBLIC_VERIFY_20261010_V1.json')" = "174bc362ff1f1b7935925c8d17e55d36288bdbad"
          test "$(git hash-object 'canonical/governance/PROFESSIONAL_QUALITY_CLOSURE_NORMAL_FORM_20261009_V1.json')" = "ebcfe5a48efce9df7fbc69a3817ac2f9adb1ff93"
      - name: Run root-binding compatibility tests
        run: python3 -m unittest canonical.tests.test_professional_quality_root_binding_compat_v1 -v
      - name: Run real 12-of-12 composition verifier
        run: |
          python3 -m canonical.runtime.professional_quality_v7_real_12of12_composition_verify_v1 | tee /tmp/composition.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/composition.json'))
          assert x.get('pass') is True, x
          assert x.get('composition_admissible') is True, x
          assert x.get('professional_quality_closed') is False, x
          assert x.get('terminal_authority') is False, x
          PY
      - name: Run composition adversarial tests
        run: python3 -m unittest canonical.tests.test_professional_quality_v7_real_12of12_composition_verify_v1 -v
