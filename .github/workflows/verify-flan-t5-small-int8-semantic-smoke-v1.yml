name: Verify FLAN T5 Small INT8 Semantic Smoke V1

on:
  push:
    branches:
      - "verify/flan-t5-small-int8-semantic-smoke-20261004"
    paths:
      - "verify_flan_t5_small_int8_public_smoke_v1.py"
      - ".github/workflows/verify-flan-t5-small-int8-semantic-smoke-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        run: |
          python -m pip install --disable-pip-version-check onnxruntime sentencepiece numpy
      - name: Verify exact bytes and offline semantic smoke
        run: python verify_flan_t5_small_int8_public_smoke_v1.py
      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flan-t5-small-int8-public-smoke-receipt
          path: flan_t5_small_int8_public_smoke_receipt.json
          if-no-files-found: warn
