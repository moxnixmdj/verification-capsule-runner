name: Verify shadow lease V2 two-phase repair

on:
  pull_request:
    paths:
      - 'verify_shadow_lease_v2_20261004.py'
      - 'subject/shadow_lease_v2_20261004/**'
      - '.github/workflows/verify-shadow-lease-v2-20261004.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run independent V2 verifier
        run: python verify_shadow_lease_v2_20261004.py
