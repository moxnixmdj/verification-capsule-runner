name: Verify retrieval V20 fresh V4 holdout
on:
  push:
    branches:
      - verify/v20-holdout-20261004
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: test "$(git hash-object canonical/runtime/retrieval_fresh_v4_holdout_v20.py)" = "dcd6099f491a6ed9e8bfb0261b64caa5ea0b6f5d"
      - run: test "$(git hash-object canonical/tests/test_retrieval_fresh_v4_holdout_v20.py)" = "4dd712fb239a9f4a09a40536f49cfe5327c965cb"
      - run: PYTHONPATH=. python canonical/tests/test_retrieval_fresh_v4_holdout_v20.py
      - run: PYTHONPATH=. python canonical/runtime/retrieval_fresh_v4_holdout_v20.py
