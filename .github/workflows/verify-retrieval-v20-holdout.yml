name: Verify retrieval V20 fresh V4 holdout
on:
  push:
    branches:
      - verify/v20-holdout-20261004
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: test "$(git hash-object canonical/runtime/retrieval_fresh_v4_holdout_v20.py)" = "bc16dcb63ed882005cb8e836f4fad4c47e19d3de"
      - run: test "$(git hash-object canonical/tests/test_retrieval_fresh_v4_holdout_v20.py)" = "cbd75bf9142c3a24bb49e389f1d594b1a2e590cc"
      - run: PYTHONPATH=. python canonical/tests/test_retrieval_fresh_v4_holdout_v20.py
      - run: PYTHONPATH=. python canonical/runtime/retrieval_fresh_v4_holdout_v20.py
