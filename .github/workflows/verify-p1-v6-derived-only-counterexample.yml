name: Verify Brain P1 V6 derived-only counterexample
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/p1_v6_derived_only_counterexample/**"
      - ".github/workflows/verify-p1-v6-derived-only-counterexample.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact V6 counterexample
        run: python capsules/p1_v6_derived_only_counterexample/verify.py
