name: Verify prequalification proof primitives

on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/runtime/proof_route_dominance.py'
      - 'canonical/tests/test_proof_route_dominance.py'
      - 'canonical/runtime/finite_population_proof.py'
      - 'canonical/tests/test_finite_population_proof.py'
      - '.github/workflows/verify-prequal-proof-primitives.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof-route-dominance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Bind exact Brain proof-route source and tests
        run: |
          test "$(git hash-object canonical/runtime/proof_route_dominance.py)" = "64efeaad5d4295d5bd1a3bd53feae5170c22a8a4"
          test "$(git hash-object canonical/tests/test_proof_route_dominance.py)" = "836b3285a44d2f345e0b0088abe5f6e17a80020b"
      - run: PYTHONPATH=. python -m unittest -v canonical.tests.test_proof_route_dominance

  finite-population-proof:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Bind exact Brain finite-population source and tests
        run: |
          test "$(git hash-object canonical/runtime/finite_population_proof.py)" = "20980ac7ddb4cab713c847ac03e5a6fa40748154"
          test "$(git hash-object canonical/tests/test_finite_population_proof.py)" = "50e790b52e5b5158b3b1a6b4b0fd4c98c69bf3d8"
      - run: PYTHONPATH=. python -m unittest -v canonical.tests.test_finite_population_proof
