name: Verify Brain Root2 TB-Science inference adapter v1
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/root2_tb_science_inference_adapter_v1/**"
      - ".github/workflows/verify-brain-root2-tb-science-inference-adapter-v1.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile exact copied Brain runtime
        run: |
          cd capsules/root2_tb_science_inference_adapter_v1
          python -m py_compile canonical/runtime/root2_tb_science_inference_adapter_v1.py canonical/runtime/harbor_science_agent_v1.py canonical/runtime/harbor_science_planner_v1.py canonical/runtime/harbor_command_policy.py canonical/runtime/harbor_environment_transport.py
      - name: Run copied Brain adapter tests
        run: |
          cd capsules/root2_tb_science_inference_adapter_v1
          export PYTHONPATH=.
          python -m unittest canonical.tests.test_root2_tb_science_inference_adapter_v1 -v
      - name: Run independent adversarial verifier
        run: |
          cd capsules/root2_tb_science_inference_adapter_v1
          export PYTHONPATH=.
          python verify_adapter.py
