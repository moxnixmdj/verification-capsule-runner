name: Verify synthesis semantic bridge v1

on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/synthesis_semantic_bridge_v1/**"
      - ".github/workflows/verify-synthesis-semantic-bridge-v1.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Independent synthesis semantic bridge verification
        run: |
          cd capsules/synthesis_semantic_bridge_v1
          export PYTHONPATH=.
          python -m unittest canonical.tests.test_synthesis_semantic_bridge_v1 -v
          python canonical/runtime/synthesis_semantic_bridge_verifier_v1.py
