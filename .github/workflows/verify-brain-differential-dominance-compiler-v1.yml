name: Verify Brain differential dominance compiler v1

on:
  pull_request:
    branches: [main]
    paths:
      - 'capsules/differential_dominance_compiler_v1/**'
      - '.github/workflows/verify-brain-differential-dominance-compiler-v1.yml'

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact Brain blob identities
        env:
          EXPECTED_JSON: >-
            {"canonical/runtime/differential_dominance_compiler_v1.py":"9a5499131ad22e556a4c10bc4847dff033124e2e","canonical/tests/test_differential_dominance_compiler_v1.py":"78b092d8b8a72b67eb0a6927fdefbf9598d2cf4c","canonical/governance/DIFFERENTIAL_DOMINANCE_COMPILER_V1.json":"1b7007fb469bf5c666c43bfb2fe871e1e10b16c6",".github/workflows/verify-differential-dominance-compiler-v1.yml":"ea2a0d3b955134a162c3d742465d2aaf4215782b"}
        run: |
          python - <<'PY'
          import json, os, subprocess
          root="capsules/differential_dominance_compiler_v1"
          expected=json.loads(os.environ["EXPECTED_JSON"])
          for rel,want in sorted(expected.items()):
              got=subprocess.check_output(["git","hash-object",f"{root}/{rel}"],text=True).strip()
              assert got==want,(rel,got,want)
          print("EXACT_4_BRAIN_BLOBS_PASS")
          PY
      - name: Run adversarial compiler tests
        env:
          PYTHONPATH: capsules/differential_dominance_compiler_v1
        working-directory: capsules/differential_dominance_compiler_v1
        run: python -m unittest canonical.tests.test_differential_dominance_compiler_v1 -v
      - name: Assert zero-credit governance
        run: |
          python - <<'PY'
          import json
          p="capsules/differential_dominance_compiler_v1/canonical/governance/DIFFERENTIAL_DOMINANCE_COMPILER_V1.json"
          d=json.load(open(p,encoding="utf-8"))
          assert d["fresh_terminal_evidence_consumed"]==0
          assert d["new_reality_units_consumed"]==0
          assert d["capability_credit_delta"]==0
          assert d["family_credit_delta"]==0
          assert d["execution_authority"] is False
          assert d["promotion_authority"] is False
          print("ZERO_CREDIT_GOVERNANCE_PASS")
          PY
