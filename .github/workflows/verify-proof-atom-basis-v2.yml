name: Verify canonical proof atom basis v2
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact partition and live projection regressions
        run: python canonical/tests/test_canonical_proof_atom_basis_v2.py
      - name: Recompute live refined basis
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from canonical.runtime.canonical_proof_atom_basis_v2 import compile_basis
          f=json.loads(Path("canonical/governance/TERMINAL_CERTIFICATE_FRONTIER_V5.json").read_text())
          o=json.loads(Path("canonical/governance/PROOF_ATOM_REFINEMENT_OVERLAY_V1.json").read_text())
          g=json.loads(Path("canonical/governance/CANONICAL_PROOF_ATOM_BASIS_V2.json").read_text())
          out=compile_basis(f,o)
          exp=g["expected_projection"]
          assert out["status"].startswith("PASS"),out
          assert out["global_unresolved_predicate_count"]==exp["global_unresolved_predicates"]==31,out
          assert out["global_certificate_count"]==exp["global_certificates"]==17,out
          assert out["refined_parent_count"]==exp["refined_parent_count"]==3,out
          assert out["leaf_requirement_occurrence_count"]==exp["leaf_requirement_occurrences"]==40,out
          assert out["leaf_atom_count"]==exp["canonical_leaf_atoms"]==40,out
          assert out["exact_duplicate_savings"]==exp["exact_duplicate_savings"]==0,out
          assert out["max_structural_target_fanout"]==exp["max_structural_target_fanout"]==3,out
          assert out["new_reality_units_consumed"]==0
          assert out["capability_credit_delta"]==0 and out["family_credit_delta"]==0
          assert out["execution_authority"] is False and out["promotion_authority"] is False
          print(json.dumps({k:out[k] for k in [
            "global_unresolved_predicate_count","global_certificate_count","refined_parent_count",
            "leaf_requirement_occurrence_count","leaf_atom_count","exact_duplicate_savings",
            "max_structural_target_fanout"
          ]},sort_keys=True))
          PY
