name: Verify proof atom basis v2
on:
  pull_request:
    paths:
      - "capsules/proof_atom_basis_v2/**"
      - ".github/workflows/verify-proof-atom-basis-v2.yml"
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify generic refined proof atom basis
        run: python capsules/proof_atom_basis_v2/verify.py
