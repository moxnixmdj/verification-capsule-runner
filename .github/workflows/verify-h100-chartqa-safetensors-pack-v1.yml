name: Verify H100 ChartQA safetensors mixed pack

on:
  pull_request:
    branches: [main]
    paths:
      - 'h100_chartqa_safetensors_pack_v1.py'
      - 'test_h100_chartqa_safetensors_pack_v1.py'
      - '.github/workflows/verify-h100-chartqa-safetensors-pack-v1.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check --no-cache-dir numpy==2.0.2
      - run: python -m unittest test_h100_chartqa_safetensors_pack_v1 -v

      - name: Download exact verified-conversion ChartQA safetensors
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cq
          URL='https://huggingface.co/ahmed-masry/unichart-chartqa-960/resolve/499d8f9c9c8b712f2c44e0997f366f4f749c77f8/model.safetensors?download=true'
          curl -fL --retry 3 --retry-delay 2 --max-filesize 820000000 "$URL" -o /tmp/cq/model.safetensors
          test "$(stat -c%s /tmp/cq/model.safetensors)" -eq 809095376
          echo '0d06f1b1036b4e1d23dfcbb805bfb1b10ed11a4b3fb9d12912e3ce28e88e6231  /tmp/cq/model.safetensors' | sha256sum -c -

      - name: Create real mixed checkpoint
        run: |
          python h100_chartqa_safetensors_pack_v1.py --source /tmp/cq/model.safetensors --output /tmp/cq/model.h100cq --receipt /tmp/cq/pack.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/cq/pack.json'))
          assert d['status']=='PASS__REAL_CHARTQA_W4_W3_PACK_CREATED',d
          assert d['source_manifest_sha256']=='8b32480b8f7981f3c8413941e522034f3779bef1187374f2ca836bc29af314c5',d
          assert d['packed_bytes'] <= 100000000,d
          print(json.dumps(d,indent=2,sort_keys=True))
          PY

      - name: Build complete runtime bundle
        shell: bash
        run: |
          set -euo pipefail
          REV='499d8f9c9c8b712f2c44e0997f366f4f749c77f8'
          BASE="https://huggingface.co/ahmed-masry/unichart-chartqa-960/resolve/$REV"
          B=/tmp/cq/bundle; mkdir -p "$B"; cp /tmp/cq/model.h100cq "$B/model.h100cq"
          for f in .gitattributes README.md added_tokens.json config.json generation_config.json preprocessor_config.json sentencepiece.bpe.model special_tokens_map.json tokenizer.json tokenizer_config.json; do
            curl -fL --retry 3 --retry-delay 1 "$BASE/$f?download=true" -o "$B/$f"
          done
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -cf /tmp/cq/bundle.tar -C /tmp/cq bundle
          test "$(stat -c%s /tmp/cq/bundle.tar)" -le 100000000

      - name: Emit small durable receipt
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('/tmp/cq'); pack=json.load(open(root/'pack.json')); bundle=root/'bundle.tar'
          def sha(p):
            h=hashlib.sha256()
            with open(p,'rb') as f:
              for b in iter(lambda:f.read(8*1024*1024),b''): h.update(b)
            return h.hexdigest()
          anc=[]
          for p in sorted((root/'bundle').iterdir()):
            if p.name=='model.h100cq': continue
            anc.append({'name':p.name,'bytes':p.stat().st_size,'sha256':sha(p)})
          out={
            'schema':'PROJECT_BRAIN_H100_CHARTQA_SAFETENSORS_REAL_PACK_RECEIPT_V1',
            'status':'PASS__REAL_CHARTQA_W4_W3_COMPLETE_BUNDLE_UNDER_H100',
            'source':{
              'model':'ahmed-masry/unichart-chartqa-960',
              'official_parent_revision':'e5eb1e52c1d775e0f3febaddc7fc3559e80cb989',
              'safetensors_conversion_revision':'499d8f9c9c8b712f2c44e0997f366f4f749c77f8',
              'safetensors_sha256':'0d06f1b1036b4e1d23dfcbb805bfb1b10ed11a4b3fb9d12912e3ce28e88e6231',
              'safetensors_bytes':809095376,
              'conversion_statement':'HUGGINGFACE_SAFETENSORS_CONVERT_PR_STATES_EQUIVALENT_TO_pytorch_model.bin'
            },
            'pack':pack,
            'complete_bundle':{'bytes':bundle.stat().st_size,'sha256':sha(bundle),'budget':100000000,'margin':100000000-bundle.stat().st_size,'ancillary_total':sum(x['bytes'] for x in anc),'ancillary':anc},
            'hard_nonclaims':['NO_CAPABILITY_PRESERVATION_CLAIM','NO_CHARTOGRAPHY_THRESHOLD_CREDIT','NO_H100_TERMINAL_CREDIT','LARGE_BINARY_DELETED_AFTER_HASH'],
            'accounting':{'incremental_spend_usd':0,'terminal_cases_consumed':0,'h100_credit_delta':0,'acceptance_credit_delta':0}
          }
          assert out['complete_bundle']['bytes']<=100000000,out
          pathlib.Path('h100_chartqa_real_pack_receipt.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps({'status':out['status'],'packed_bytes':pack['packed_bytes'],'bundle_bytes':out['complete_bundle']['bytes'],'bundle_margin':out['complete_bundle']['margin'],'bundle_sha256':out['complete_bundle']['sha256'],'pack_sha256':pack['packed_sha256']},indent=2,sort_keys=True))
          PY
      - if: always()
        run: rm -rf /tmp/cq/model.safetensors /tmp/cq/model.h100cq /tmp/cq/bundle.tar /tmp/cq/bundle || true
      - uses: actions/upload-artifact@v4
        with:
          name: h100-chartqa-real-pack-receipt-v1
          path: h100_chartqa_real_pack_receipt.json
          if-no-files-found: error
          retention-days: 1
