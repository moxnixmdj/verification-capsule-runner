name: Verify AutomationBench Brain gateway V1
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/verify-automationbench-brain-gateway-v1.yml'
      - 'candidate/automationbench_gateway_v1/**'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact gateway and source gate
        run: |
          set -euo pipefail
          mkdir -p canonical/runtime canonical/tests
          cp candidate/automationbench_gateway_v1/runtime.py canonical/runtime/automationbench_brain_gateway_v1.py
          cp candidate/automationbench_gateway_v1/tests.py canonical/tests/test_automationbench_brain_gateway_v1.py
          touch canonical/__init__.py canonical/runtime/__init__.py canonical/tests/__init__.py
          python -m pip install -q pytest
          python -m pytest -q canonical/tests/test_automationbench_brain_gateway_v1.py
          python - <<'PY'
          import importlib.util, json, pathlib
          spec=importlib.util.spec_from_file_location('gate','candidate/automationbench_gateway_v1/source_gate.py')
          mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
          route={
            'benchmark_harness_zero_cost': True,
            'scorer_frozen': True,
            'brain_candidate_bound': True,
            'brain_owned_operative_configuration': True,
            'configuration_materially_constrains_execution': True,
            'capability_package_contains_configuration': True,
            'promotion_evaluates_brain_configured_system': True,
            'external_hidden_target_capability_provider': False,
            'ownership_claim_relies_on_model_standalone_superiority': False,
            'future_use_requires_capability_rediscovery': False,
            'incremental_spend_usd': 0,
            'model_role': 'GENERAL_COGNITION_SUBSTRATE',
            'model_dependency_count': 1,
            'model_dependencies_declared': True,
            'general_substrate_test_pass': True,
          }
          out=mod.evaluate(route)
          print(json.dumps(out,indent=2,sort_keys=True))
          assert out['pass'] is True, out
          assert out['clean_case_execution_authority'] is True, out
          manifest=json.loads(pathlib.Path('candidate/automationbench_gateway_v1/manifest.json').read_text())
          assert manifest['ownership_boundary']['brain_owns_configuration'] is True
          assert manifest['ownership_boundary']['model_role']=='GENERAL_COGNITION_SUBSTRATE'
          PY
