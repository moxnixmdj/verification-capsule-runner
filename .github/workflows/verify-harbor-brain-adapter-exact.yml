name: Verify Harbor Brain adapter exact

on:
  pull_request:
    branches: [main]
    paths:
      - 'verification/harbor_brain_agent_exact.py'
      - 'verification/harbor_environment_transport_exact.py'
      - 'verification/test_harbor_brain_adapter_exact.py'
      - '.github/workflows/verify-harbor-brain-adapter-exact.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Install exact Harbor prequalification release
        run: python -m pip install --disable-pip-version-check -q 'harbor==0.23.0'
      - name: Bind exact Brain adapter and transport blobs
        run: |
          test "$(git hash-object verification/harbor_brain_agent_exact.py)" = "2de1d66d6c99636b72fe16e624044d1f7c464468"
          test "$(git hash-object verification/harbor_environment_transport_exact.py)" = "3b30f09598854aa5de998b9cea7ead7c21e508c2"
      - name: Run synthetic zero-case adapter verification
        run: PYTHONPATH=. python -m unittest -v verification.test_harbor_brain_adapter_exact
