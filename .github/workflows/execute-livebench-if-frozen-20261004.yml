name: Execute frozen LiveBench IF 2026-06-25
on:
  push:
    branches: ["execute/livebench-if-frozen-20261004"]
    paths: ["EXECUTE_LIVEBENCH_IF_FROZEN_20261004"]
permissions:
  contents: read
jobs:
  execute:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.14"
      - name: Install exact frozen execution environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check             nltk==3.10.3 emoji==2.16.0 syllapy==0.7.2 setuptools==80.9.0             spacy==3.8.16 pyarrow==21.0.0
          python -m pip install --disable-pip-version-check             https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl
      - name: Execute exact frozen 200-case LiveBench IF population
        shell: bash
        run: python execute_livebench_if_frozen_20261004.py --output livebench_if_frozen_20261004_result.json
      - name: Hash immutable result receipt
        shell: bash
        run: sha256sum livebench_if_frozen_20261004_result.json
      - uses: actions/upload-artifact@v4
        with:
          name: livebench-if-frozen-20261004-result
          path: livebench_if_frozen_20261004_result.json
          if-no-files-found: error
          retention-days: 90
