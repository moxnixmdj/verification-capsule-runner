name: Probe OLMo1B zero-cost feasibility
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/probe-olmo1b-zero-cost-feasibility.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      HF_HOME: /tmp/hf
      PIP_NO_CACHE_DIR: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Record runner capacity
        run: |
          free -h
          df -h /
          python - <<'PY'
          import os
          print("cpu_count", os.cpu_count())
          PY
      - name: Check preinstalled torch
        run: python -c "import torch; print('torch', torch.__version__)"
      - name: Install lightweight model tooling
        run: python -m pip install --no-cache-dir 'transformers>=4.56,<5' huggingface_hub accelerate safetensors psutil
      - name: Materialize and run pinned-resolved OLMo 1B
        run: |
          python - <<'PY'
          import json, os, resource, time
          from pathlib import Path
          from huggingface_hub import model_info, snapshot_download

          repo="allenai/OLMo-2-0425-1B"
          t0=time.time()
          info=model_info(repo)
          resolved=info.sha
          print("resolved_hf_sha", resolved, flush=True)
          path=snapshot_download(
              repo_id=repo,
              revision=resolved,
              local_dir="/tmp/olmo2_1b",
              allow_patterns=["*.json","*.txt","*.model","*.safetensors"],
          )
          materialize_s=time.time()-t0
          size=sum(p.stat().st_size for p in Path(path).rglob("*") if p.is_file())
          print("materialized_bytes", size, flush=True)
          print("materialize_seconds", round(materialize_s,3), flush=True)

          import torch
          from transformers import AutoModelForCausalLM, AutoTokenizer

          load0=time.time()
          tok=AutoTokenizer.from_pretrained(path, local_files_only=True)
          model=AutoModelForCausalLM.from_pretrained(
              path,
              local_files_only=True,
              dtype="auto",
              low_cpu_mem_usage=True,
              device_map={"":"cpu"},
          )
          load_s=time.time()-load0
          prompt="Requirement A is defined as keeping the audit log immutable. Later, A shall remain true."
          inputs=tok(prompt, return_tensors="pt")
          gen0=time.time()
          with torch.inference_mode():
              out=model.generate(**inputs,max_new_tokens=1,do_sample=False)
          gen_s=time.time()-gen0
          text=tok.decode(out[0][inputs["input_ids"].shape[-1]:],skip_special_tokens=True)
          rss_kb=resource.getrusage(resource.RUSAGE_SELF).ru_maxrss
          result={
              "schema":"BRAIN_OLMO1B_ZERO_COST_FEASIBILITY_PROBE_V1",
              "repo":repo,
              "resolved_hf_sha":resolved,
              "materialized_bytes":size,
              "materialize_seconds":materialize_s,
              "load_seconds":load_s,
              "one_token_seconds":gen_s,
              "peak_rss_kb":rss_kb,
              "generated_text":text,
              "torch_version":torch.__version__,
              "incremental_spend_usd":0,
              "capability_credit":False,
          }
          print("RESULT_JSON="+json.dumps(result,sort_keys=True),flush=True)
          PY
