name: Verify information-safe trajectory causal localization
on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/runtime/trajectory_failure_information_safe_proof.py'
      - 'canonical/runtime/trajectory_failure_information_safe_candidate.py'
      - 'canonical/tests/test_trajectory_failure_information_safe.py'
      - '.github/workflows/verify-trajectory-info-safe.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run frozen preflight tests
        run: PYTHONPATH=. python -m unittest -v canonical.tests.test_trajectory_failure_information_safe
      - name: Run fresh 400-case rescue grid
        env:
          PROJECT_BRAIN_POST_FREEZE_SEED: ${{ github.run_id }}
        run: |
          PYTHONPATH=. python - <<'PY'
          import os, random
          from canonical.runtime.trajectory_failure_information_safe_proof import generate_case, public_task, score_case, verify_candidate_rescue
          from canonical.runtime.trajectory_failure_information_safe_candidate import solve
          root=int(os.environ["PROJECT_BRAIN_POST_FREEZE_SEED"])
          rng=random.Random(root)
          failures=[]
          for i in range(400):
              seed=rng.randrange(1,2**31)
              ambiguous=(i%4==0)
              case=generate_case(seed,ambiguous=ambiguous)
              public=public_task(case)
              if "_oracle" in public:
                  failures.append((i,seed,"ORACLE_LEAK"))
                  continue
              out=solve(public)
              verdict=score_case(case,out)
              if not verdict.get("pass") or not verify_candidate_rescue(case,out):
                  failures.append((i,seed,verdict,out))
          print({"root_seed":root,"cases":400,"failures":failures[:20],"failure_count":len(failures)})
          if failures:
              raise SystemExit(1)
          PY
