name: Verify terminal atomic closure capsule V2
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/terminal_atomic_closure_v2/**"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Recompute exact snapshot and semantic commitment
        working-directory: capsules/terminal_atomic_closure_v2
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          c=json.load(open("TERMINAL_ATOMIC_CLOSURE_CAPSULE_V2.json",encoding="utf-8"))
          assert c["schema"]=="PROJECT_BRAIN_TERMINAL_ATOMIC_CLOSURE_CAPSULE_V2"
          assert c["execution_snapshot"]["commit_sha"]=="329e317e59f058b9f82affb8d8f220cd343a1b6c"
          assert c["prebeacon_invariants"]["post_freeze_beacon"] is None
          assert c["prebeacon_invariants"]["terminal_results_observed"]==0
          assert c["prebeacon_invariants"]["fresh_terminal_evidence_consumed"]==0
          def git_blob(path):
              data=Path(path).read_bytes()
              return hashlib.sha1(b"blob "+str(len(data)).encode()+bytes([0])+data).hexdigest()
          for rel, expected in sorted(c["snapshot_blob_assertions"].items()):
              actual=git_blob(rel)
              assert actual==expected,(rel,expected,actual)
          order=c["commitment_encoding"]["ordered_components"]
          payload=[]
          for name in order:
              raw=json.dumps(c[name],sort_keys=True,separators=(",",":"),ensure_ascii=False).encode()
              got=hashlib.sha256(raw).hexdigest()
              assert got==c["component_sha256"][name],(name,got,c["component_sha256"][name])
              payload.append(raw)
          commitment=hashlib.sha256(b"".join(payload)).hexdigest()
          assert commitment==c["package_commitment"],(commitment,c["package_commitment"])
          auth=json.load(open("canonical/governance/TERMINAL_WAVE_EXECUTION_AUTHORITY_V1.json"))
          manifest=json.load(open("canonical/governance/TERMINAL_ROUTE_SPECIFIC_EXECUTOR_MANIFEST_V1.json"))
          kernel=json.load(open("canonical/governance/GLOBAL_TERMINAL_SELECTION_KERNEL_V1.json"))
          assert auth["execution_authority"] is True
          assert auth["terminal_results_observed"]==0 and auth["fresh_terminal_evidence_consumed"]==0
          assert manifest["launch_authority"] is True
          assert manifest["bound_executor_count"]==12 and manifest["implemented_executor_count"]==12
          assert manifest["terminal_results_observed"]==0 and manifest["fresh_terminal_evidence_consumed"]==0
          assert kernel["seed_policy"]["beacon_known_before_freeze"] is False
          assert "FIRST_AUTHORIZED_TERMINAL_WAVE_PUBLIC_RUNNER_ID" in kernel["seed_policy"]["post_freeze_beacon"]
          print("CAPSULE_V2_PASS",commitment)
          PY
