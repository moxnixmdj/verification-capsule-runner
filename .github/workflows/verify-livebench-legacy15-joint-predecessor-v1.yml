name: Verify LiveBench legacy15 joint predecessor V1
on:
  push:
    branches:
      - verify/livebench-legacy15-joint-predecessor-v1
  pull_request:
    paths:
      - verify_livebench_legacy15_joint_predecessor_v1.py
      - canonical/runtime/livebench_legacy_visible_constraint_compiler_v1.py
      - canonical/runtime/livebench_legacy_visible_constraint_compiler_v2.py
      - canonical/runtime/livebench_frozen_active_legacy15_v1.py
      - canonical/runtime/livebench_legacy15_joint_witness_v1.py
      - .github/workflows/verify-livebench-legacy15-joint-predecessor-v1.yml

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pyarrow==19.0.1 langdetect==1.0.9 immutabledict==4.2.1 nltk==3.9.1
      - run: python - <<'PY'
          import nltk
          nltk.download('punkt', quiet=True)
          try:
              nltk.download('punkt_tab', quiet=True)
          except Exception:
              pass
          PY
      - run: python verify_livebench_legacy15_joint_predecessor_v1.py
