name: Verify LiveBench legacy15 joint predecessor v1

on:
  push:
    branches:
      - verify-livebench-legacy15-joint-predecessor-v1-20261004-sol
    paths:
      - verify_livebench_legacy15_joint_predecessor_v1.py
      - subject/livebench_legacy15_joint_predecessor_v1/**
      - .github/workflows/verify-livebench-legacy15-joint-predecessor-v1.yml
  pull_request:
    branches: [main]
    paths:
      - verify_livebench_legacy15_joint_predecessor_v1.py
      - subject/livebench_legacy15_joint_predecessor_v1/**
      - .github/workflows/verify-livebench-legacy15-joint-predecessor-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned verifier dependencies
        run: |
          python -m pip install --no-cache-dir             pyarrow==21.0.0             langdetect==1.0.9             immutabledict==4.3.1             nltk==3.10.3

      - name: Fetch exact frozen legacy scorer source
        run: |
          set -euo pipefail
          git init /tmp/livebench
          git -C /tmp/livebench remote add origin https://github.com/LiveBench/LiveBench.git
          git -C /tmp/livebench fetch --depth=1 origin 8f8e5c381a16e3f24257776edd53471fe86f8091
          git -C /tmp/livebench checkout --detach FETCH_HEAD
          test "$(git -C /tmp/livebench rev-parse HEAD)" = "8f8e5c381a16e3f24257776edd53471fe86f8091"
          test "$(git -C /tmp/livebench rev-parse HEAD:livebench/if_runner/instruction_following_eval/instructions.py)" = "4997bab885a676d92545fd91a9a20b48d234a2b2"
          test "$(git -C /tmp/livebench rev-parse HEAD:livebench/if_runner/instruction_following_eval/instructions_registry.py)" = "903ed738398648c7cfac61d5ffa478c22f1f0891"

      - name: Fetch exact NLTK sentence tokenizer data
        run: |
          set -euo pipefail
          git init /tmp/nltk_data_repo
          git -C /tmp/nltk_data_repo remote add origin https://github.com/nltk/nltk_data.git
          git -C /tmp/nltk_data_repo fetch --depth=1 origin 550b6625bcef1f2abff2ff770a5a0d272c9c6b2a
          git -C /tmp/nltk_data_repo checkout --detach FETCH_HEAD
          mkdir -p /tmp/nltk_runtime/tokenizers
          unzip -q /tmp/nltk_data_repo/packages/tokenizers/punkt.zip -d /tmp/nltk_runtime/tokenizers
          unzip -q /tmp/nltk_data_repo/packages/tokenizers/punkt_tab.zip -d /tmp/nltk_runtime/tokenizers

      - name: Fetch exact removed 200-row predecessor
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors --silent --show-error             "https://huggingface.co/datasets/livebench/instruction_following/resolve/4f7ab12f0d47848da31de92bd7cc3d7d4acfe695/data/test-00000-of-00001.parquet"             -o /tmp/livebench_predecessor.parquet
          test "$(stat -c %s /tmp/livebench_predecessor.parquet)" = "277319"
          echo "57cbc3a738f7a95b234125965929247e7781ce6c5216bdea1d18548f4b10e98c  /tmp/livebench_predecessor.parquet" | sha256sum -c -

      - name: Run exact nonterminal joint-witness replay
        env:
          LIVEBENCH_ROOT: /tmp/livebench
          LIVEBENCH_PREDECESSOR_PARQUET: /tmp/livebench_predecessor.parquet
          NLTK_DATA: /tmp/nltk_runtime
        run: python verify_livebench_legacy15_joint_predecessor_v1.py

      - name: Upload aggregate receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livebench-legacy15-joint-predecessor-v1
          path: livebench_legacy15_joint_predecessor_receipt.json
          if-no-files-found: warn
          retention-days: 30
