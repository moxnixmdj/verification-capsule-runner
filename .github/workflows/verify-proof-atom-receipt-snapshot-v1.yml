name: Verify sealed proof atom receipt snapshot v1
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/proof_atom_receipt_snapshot_v1/**"
      - ".github/workflows/verify-proof-atom-receipt-snapshot-v1.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact Brain sealed-snapshot runner bytes and fail-closed behavior
        run: python capsules/proof_atom_receipt_snapshot_v1/verify.py
