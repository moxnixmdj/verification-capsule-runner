name: Verify LiveBench legacy15 clean replay SOL V1
on:
  push:
    branches:
      - 'verify/livebench-legacy15-clean-replay-sol-v1'

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen verifier dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir pyarrow==19.0.1 langdetect==1.0.9 immutabledict==4.2.1 nltk==3.9.1
          python - <<'PY'
          import nltk
          for name in ["punkt", "punkt_tab"]:
              nltk.download(name, quiet=True)
          PY
      - name: Run clean predecessor falsifier
        shell: bash
        run: |
          set -euo pipefail
          python verify_livebench_legacy15_joint_predecessor_v1.py | tee livebench_legacy15_clean_replay_sol_v1.log
      - name: Upload falsification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livebench-legacy15-clean-replay-sol-v1
          path: livebench_legacy15_clean_replay_sol_v1.log
          if-no-files-found: error
