name: LiveBench clean equivalent development V1

on:
  push:
    branches: [verify-livebench-clean-dev-v1-20261004-sol]
    paths:
      - 'canonical/runtime/livebench_legacy25_clean_witness_v1.py'
      - 'canonical/runtime/livebench_legacy_visible_constraint_compiler_v1.py'
      - 'canonical/runtime/livebench_legacy_visible_constraint_compiler_v4.py'
      - 'livebench_clean_dev_precommit_v1.json'
      - 'verify_livebench_clean_dev_v1.py'
      - '.github/workflows/livebench-clean-dev-v1.yml'

permissions:
  contents: write

jobs:
  develop:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONHASHSEED: '0'
      NLTK_DATA: /tmp/nltk_data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify precommitted Brain bytes
        run: |
          set -euo pipefail
          test "$(git hash-object canonical/runtime/livebench_legacy25_clean_witness_v1.py)" = "261ba2902e5406b373b4ec4bba14a90f6bc0c142"
          test "$(git hash-object canonical/runtime/livebench_legacy_visible_constraint_compiler_v1.py)" = "e986035ff68b53c0dc7a7eb478f6e3d8882214aa"
          test "$(git hash-object canonical/runtime/livebench_legacy_visible_constraint_compiler_v4.py)" = "721207ba39d502e3f610289578e9d5bab78b1fcc"
          test "$(git hash-object livebench_clean_dev_precommit_v1.json)" = "5cbd02a16a496181eab7f4928158ca4c526ee98f"
          python -m py_compile canonical/runtime/livebench_legacy25_clean_witness_v1.py
      - name: Install pinned runtime
        run: |
          set -euo pipefail
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check numpy==2.3.3 nltk==3.10.3 langdetect==1.0.9
      - name: Fetch exact public checker and historical generator sources
        run: |
          set -euo pipefail
          rm -rf /tmp/LiveBench /tmp/nltk_data_repo /tmp/nltk_data
          git init /tmp/LiveBench
          git -C /tmp/LiveBench remote add origin https://github.com/LiveBench/LiveBench.git
          git -C /tmp/LiveBench fetch --depth 1 origin 8f8e5c381a16e3f24257776edd53471fe86f8091
          git -C /tmp/LiveBench checkout --detach FETCH_HEAD
          test "$(git -C /tmp/LiveBench hash-object livebench/if_runner/instruction_following_eval/instructions.py)" = "4997bab885a676d92545fd91a9a20b48d234a2b2"
          test "$(git -C /tmp/LiveBench hash-object livebench/if_runner/instruction_following_eval/instructions_registry.py)" = "903ed738398648c7cfac61d5ffa478c22f1f0891"
          test "$(git -C /tmp/LiveBench hash-object livebench/if_runner/instruction_following_eval/instructions_util.py)" = "1f0dc0eaa05bd0f72f82f8183b90276ea4d2a87b"
          git -C /tmp/LiveBench fetch --depth 1 origin 686be1e78a0ba8036d7e355bc406e1a265da5292
          test "$(git -C /tmp/LiveBench show 686be1e78a0ba8036d7e355bc406e1a265da5292:livebench/if_runner/live_data.py | git hash-object --stdin)" = "6ff390d6885cf90f88d9d36959735cb327613edc"
          git clone --filter=blob:none --no-checkout https://github.com/nltk/nltk_data.git /tmp/nltk_data_repo
          git -C /tmp/nltk_data_repo checkout 550b6625bcef1f2abff2ff770a5a0d272c9c6b2a -- packages/tokenizers/punkt.zip packages/tokenizers/punkt_tab.zip
          mkdir -p /tmp/nltk_data/tokenizers
          unzip -q /tmp/nltk_data_repo/packages/tokenizers/punkt.zip -d /tmp/nltk_data/tokenizers
          unzip -q /tmp/nltk_data_repo/packages/tokenizers/punkt_tab.zip -d /tmp/nltk_data/tokenizers
      - name: Generate clean development population after precommit and score
        run: .venv/bin/python verify_livebench_clean_dev_v1.py
      - name: Print compact receipt
        if: always()
        run: |
          test ! -f livebench_clean_dev_v1_receipt.json || python - <<'PY'
          import json
          x=json.load(open("livebench_clean_dev_v1_receipt.json"))
          print({k:x[k] for k in ["status","mean_score","strict_full_case_pass_count","candidate_error_counts","instruction_failed_counts"]})
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: livebench-clean-dev-v1
          path: livebench_clean_dev_v1_receipt.json
          if-no-files-found: warn
      - name: Persist development receipt
        if: always()
        run: |
          set -euo pipefail
          test -f livebench_clean_dev_v1_receipt.json || exit 0
          mkdir -p receipts
          cp livebench_clean_dev_v1_receipt.json receipts/livebench_clean_dev_v1_receipt.json
          git config user.name "project-brain-verifier"
          git config user.email "project-brain-verifier@users.noreply.github.com"
          git add receipts/livebench_clean_dev_v1_receipt.json
          git diff --cached --quiet && exit 0
          git commit -m "Record clean LiveBench development V1 receipt"
          git push origin HEAD:verify-livebench-clean-dev-v1-20261004-sol
