name: Verify Brain current-source composition memory bridge V2
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/composition_memory_bridge_v2/**"
      - ".github/workflows/verify-composition-memory-bridge-v2.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact current Brain bridge and source relation
        run: python capsules/composition_memory_bridge_v2/verify.py
