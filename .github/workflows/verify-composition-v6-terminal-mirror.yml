name: Verify Composition V6 terminal mirror
on:
  pull_request:
    branches: [main]
    paths:
      - 'capsules/composition_v6_terminal_mirror/**'
      - '.github/workflows/verify-composition-v6-terminal-mirror.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python capsules/composition_v6_terminal_mirror/verify.py
