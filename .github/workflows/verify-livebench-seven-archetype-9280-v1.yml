name: Verify LiveBench seven-archetype 9280 V1

on:
  push:
    branches:
      - verify/livebench-seven-archetype-9280-v1-20261005
  pull_request:
    paths:
      - "canonical/runtime/livebench_legacy_visible_constraint_compiler_v1.py"
      - "canonical/runtime/livebench_legacy_visible_constraint_compiler_v4.py"
      - "canonical/runtime/livebench_frozen_active_legacy15_v1.py"
      - "canonical/runtime/livebench_legacy15_composition_archetypes_v1.py"
      - "canonical/runtime/livebench_legacy15_general_composer_v1.py"
      - "canonical/runtime/livebench_legacy15_joint_witness_v1.py"
      - "canonical/runtime/livebench_legacy15_joint_router_v2.py"
      - "canonical/runtime/livebench_legacy15_end2end_exact_synthetic_audit_v2.py"
      - ".github/workflows/verify-livebench-seven-archetype-9280-v1.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact legacy checker dependencies
        run: |
          python -m pip install --disable-pip-version-check nltk==3.9.2 langdetect==1.0.9 immutabledict==4.2.1
          python - <<'PY'
          import nltk
          for name in ["punkt", "punkt_tab"]:
              nltk.download(name, quiet=True)
          PY
      - name: Checkout frozen LiveBench source
        run: |
          git clone --filter=blob:none https://github.com/LiveBench/LiveBench.git /tmp/livebench
          git -C /tmp/livebench checkout 8f8e5c381a16e3f24257776edd53471fe86f8091
      - name: Run exact 9280-case seven-archetype audit
        env:
          PYTHONPATH: .
        run: |
          mkdir -p /tmp/receipt
          python canonical/runtime/livebench_legacy15_end2end_exact_synthetic_audit_v2.py \
            --livebench-root /tmp/livebench \
            --output /tmp/receipt/livebench-seven-archetype-9280-v1.json
      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livebench-seven-archetype-9280-v1
          path: /tmp/receipt/livebench-seven-archetype-9280-v1.json
          if-no-files-found: error
