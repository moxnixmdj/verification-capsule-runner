name: Verify FrontierCode CursorBench owner route boundary
on:
  pull_request:
    paths:
      - "verify_frontiercode_cursorbench_owner_route_boundary.py"
      - ".github/workflows/verify-frontiercode-cursorbench-owner-route-boundary.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify first-party owner-route boundaries without benchmark cases
        run: python verify_frontiercode_cursorbench_owner_route_boundary.py
