name: Verify delegation objective dominance v1
on:
  pull_request:
    branches: [main]
    paths:
      - 'capsules/delegation_objective_dominance/**'
      - '.github/workflows/verify-delegation-objective-dominance-v1.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Verify exact Brain identities
        working-directory: capsules/delegation_objective_dominance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object canonical/runtime/delegation_objective_dominance_reconciler.py)" = "aa2427fdc45010bfe21f7f83594b83c2ace63bf2"
          test "$(git hash-object canonical/tests/test_delegation_objective_dominance_reconciler.py)" = "3d00730f21ab9930f5603bdd1c81d8ef88bb0455"
          test "$(git hash-object canonical/runtime/objective_oracle_dominance_compiler.py)" = "c00d59dd0ab7df6ffb0ba5c26a1cb2a5cd82203c"
          test "$(git hash-object canonical/governance/OBJECTIVE_ORACLE_DOMINANCE_LIVE_INPUT_V1.json)" = "9efaad8a74b7126938d60d0f2ede3820a71741fa"
          test "$(git hash-object canonical/governance/DELEGATION_T2_OBJECTIVE_TERMINAL_BINDING_V1.json)" = "f77623dc1b91fdd0256c390e729579312378a615"
          test "$(git hash-object canonical/verification/DELEGATION_T2_OBJECTIVE_BINDING_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json)" = "5d3c4a8f55d35936951929d8fbcdb44565b35230"
          test "$(git hash-object verified_source/DELEGATION_T2_OBJECTIVE_TERMINAL_BINDING_V1.json)" = "65cf321cb1d08c06a236cd4d818dfdec3eb77c95"
      - name: Verify source-to-promoted binding mutation is metadata-only
        working-directory: capsules/delegation_objective_dominance
        run: |
          python - <<'PY'
          import copy,json
          old=json.load(open('verified_source/DELEGATION_T2_OBJECTIVE_TERMINAL_BINDING_V1.json'))
          cur=json.load(open('canonical/governance/DELEGATION_T2_OBJECTIVE_TERMINAL_BINDING_V1.json'))
          assert old['status']=='FROZEN_PREWAVE_BINDING__INDEPENDENT_VERIFICATION_PENDING__ZERO_TERMINAL_RESULTS'
          assert cur['status']=='FROZEN_PREWAVE_BINDING__INDEPENDENT_PUBLIC_RUNNER_PASS__ZERO_TERMINAL_RESULTS'
          assert old['route_gates']['independent_verification_pass'] is False
          assert cur['route_gates']['independent_verification_pass'] is True
          assert old['prewave_admissible'] is False and cur['prewave_admissible'] is True
          assert cur['independent_verification']=='canonical/verification/DELEGATION_T2_OBJECTIVE_BINDING_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json'
          x=copy.deepcopy(cur)
          x['status']=old['status']
          x['route_gates']['independent_verification_pass']=False
          x['prewave_admissible']=False
          x.pop('independent_verification',None)
          assert x==old
          print('VERIFICATION_DERIVED_METADATA_ONLY_DELTA_PASS')
          PY
      - name: Run reconciliation regressions
        working-directory: capsules/delegation_objective_dominance
        run: PYTHONPATH=. python -m unittest -v canonical.tests.test_delegation_objective_dominance_reconciler
      - name: Compile comparator deletion reconciliation
        working-directory: capsules/delegation_objective_dominance
        run: PYTHONPATH=. python canonical/runtime/delegation_objective_dominance_reconciler.py .
