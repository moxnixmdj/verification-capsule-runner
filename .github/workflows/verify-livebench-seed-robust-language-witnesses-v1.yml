name: Discover seed-robust LiveBench language witnesses

on:
  pull_request:
    branches: [main]
    paths:
      - "verify_livebench_seed_robust_language_witnesses_v1.py"
      - ".github/workflows/verify-livebench-seed-robust-language-witnesses-v1.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
      - name: Install exact detector
        run: python -m pip install --disable-pip-version-check --no-cache-dir "langdetect==1.0.9"
      - name: Synthesize strict ngram-dominance witnesses
        run: python verify_livebench_seed_robust_language_witnesses_v1.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livebench-seed-robust-language-witnesses-v1
          path: livebench_seed_robust_language_witnesses_v1.json
          if-no-files-found: error
