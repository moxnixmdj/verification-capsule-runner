name: Verify current 26 frontier v3
on:
  push:
    branches: ["verify/current-26-frontier-v3-20261003-sol"]
    paths:
      - ".github/workflows/verify-current-26-frontier-v3.yml"
      - "capsules/current_26_frontier_v3/brain/**"
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Bind exact Brain capsule
        run: |
          set -euo pipefail
          ROOT=capsules/current_26_frontier_v3/brain
          test "$(git hash-object "$ROOT/canonical/governance/CURRENT_26_ZERO_REALITY_FRONTIER_V3.json")" = "f052083c867f16d19cb04a1fe52e71fb813d396d"
          test "$(git hash-object "$ROOT/canonical/runtime/current_26_zero_reality_frontier_v3.py")" = "4a105a7cac9bc1ffda8ebe1fcb662d19b00a142b"
          test "$(git hash-object "$ROOT/canonical/tests/test_current_26_zero_reality_frontier_v3.py")" = "a523cab3c1091c5bbb917fc70c080ddc7674c51f"
          test "$(git hash-object "$ROOT/canonical/governance/CURRENT_26_ZERO_REALITY_FRONTIER_V2.json")" = "352fe17467a8335a348949ce2f2b6fdb6235e9ac"
          test "$(git hash-object "$ROOT/canonical/governance/EXTERNAL_BENCHMARK_DOMINANCE_GATE_V1.json")" = "d5eba104f28f6ba0bb400967057dc02029e2353e"
          test "$(git hash-object "$ROOT/canonical/verification/EXTERNAL_BENCHMARK_DOMINANCE_V1_PUBLIC_RUNNER_VERIFICATION_20261003_V1.json")" = "9fcad9359ad75d1dfa9b5fd672a2a081128d5001"
          test "$(git hash-object "$ROOT/canonical/governance/LIVEBENCH_IF_COMPARATOR_ROUTE_RECONCILIATION_V2.json")" = "7067a849585d9020f3d78aa374c0eeecb5078c8b"
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --quiet pytest
      - name: Verify exact unchanged cut and precedence
        run: |
          cd capsules/current_26_frontier_v3/brain
          python -m pytest -q canonical/tests/test_current_26_zero_reality_frontier_v3.py
          python canonical/runtime/current_26_zero_reality_frontier_v3.py > /tmp/result.json
          python - <<'PY'
          import json
          x=json.load(open("/tmp/result.json"))
          assert x["pass"] is True,x
          assert x["exact_state"]["proved_predicates"]==12,x
          assert x["exact_state"]["unresolved_predicates"]==26,x
          assert x["exact_state"]["primitive_zero_reality_work_units"]==30,x
          assert x["delta"]=={"zero_reality_requirement_delta":0,"primitive_work_unit_delta":0,"acceptance_predicate_delta":0,"family_delta":0},x
          assert x["fresh_reality_authority"] is False,x
          print("CURRENT_26_FRONTIER_V3_VERIFIED")
          PY
