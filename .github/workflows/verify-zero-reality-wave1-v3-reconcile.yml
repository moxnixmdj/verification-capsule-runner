name: Verify zero reality wave1 v3 reconciliation
on:
  push:
    branches: ["verify/zero-reality-wave1-v3-reconcile-20261003-sol"]
    paths:
      - ".github/workflows/verify-zero-reality-wave1-v3-reconcile.yml"
      - "capsules/zero_reality_wave1_v3/brain/**"
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact bytes and current zero-reality invariants
        run: |
          set -euo pipefail
          ROOT=capsules/zero_reality_wave1_v3/brain
          test "$(git hash-object "$ROOT/canonical/governance/TERMINAL_ROOT_CAUSE_STATE_V1.json")" = "458a01f6a4b4f172c04785a3cdb4911086875f7c"
          test "$(git hash-object "$ROOT/canonical/governance/ROOT2_FIXED_BAR_ROUTE_INVENTORY_V1.json")" = "a0ad666e43c4dd5121d6f235f87962dd2bf17004"
          test "$(git hash-object "$ROOT/canonical/governance/ROOT3_RESIDUAL_COMPRESSION_V1.json")" = "a5726e4d17e41120bece55191222b6039ef9e0a5"
          test "$(git hash-object "$ROOT/canonical/governance/ROOT2_ROOT3_MINIMUM_EXECUTION_FRONTIER_V1.json")" = "471496219ef8bea258334cbd563e2f22c69e3b5f"
          test "$(git hash-object "$ROOT/canonical/governance/CURRENT_TERMINAL_AUTHORITY_V1.json")" = "4d49ddcdf244f5b1508b0933223d27bfe29944bf"
          test "$(git hash-object "$ROOT/canonical/governance/SYNTHESIS_OVERLAY_V3_REBIND_ACTIVATION_V1.json")" = "6c71e496e01a111d5cef9431034d90e3f1af8acb"
          test "$(git hash-object "$ROOT/canonical/verification/SYNTHESIS_OVERLAY_V3_REBIND_PUBLIC_RUNNER_VERIFICATION_20261003_V1.json")" = "57b7fc8df4fd820e3eda426f121b56acfce37a15"
          test "$(git hash-object "$ROOT/canonical/verification/CURRENT_WITNESS_TARGET_TOTALIZATION_V2_PUBLIC_RUNNER_VERIFICATION_20261003_V1.json")" = "48c2318aaffffec67855199523235e6943289fc6"
          test "$(git hash-object "$ROOT/canonical/governance/OPUS55_ACCEPTANCE_PREDICATE_EVIDENCE_BINDINGS_V2.json")" = "bc420c6d1a6caaab7a6d5c257640d3f5797170f5"
          python - <<'PY'
          import json
          from pathlib import Path
          r=Path("capsules/zero_reality_wave1_v3/brain")
          def load(p): return json.loads((r/p).read_text())
          root=load("canonical/governance/TERMINAL_ROOT_CAUSE_STATE_V1.json")
          route=load("canonical/governance/ROOT2_FIXED_BAR_ROUTE_INVENTORY_V1.json")
          r3=load("canonical/governance/ROOT3_RESIDUAL_COMPRESSION_V1.json")
          front=load("canonical/governance/ROOT2_ROOT3_MINIMUM_EXECUTION_FRONTIER_V1.json")
          auth=load("canonical/governance/CURRENT_TERMINAL_AUTHORITY_V1.json")
          synth=load("canonical/governance/SYNTHESIS_OVERLAY_V3_REBIND_ACTIVATION_V1.json")
          total=load("canonical/verification/CURRENT_WITNESS_TARGET_TOTALIZATION_V2_PUBLIC_RUNNER_VERIFICATION_20261003_V1.json")
          assert root["current_acceptance"]=={"accepted_families":5,"open_families":14,"proved_atomic":12,"unresolved_atomic":26,"total_families":19,"total_atomic":38,"terminal":False}
          assert root["current_residual_root_partition"]["evidence"]["git_blob_sha"]=="bc420c6d1a6caaab7a6d5c257640d3f5797170f5"
          assert root["current_residual_root_partition"]["root1_positive_gap_count"]==0
          assert route["deduplication"]["root2_only_predicate_count"]==15
          assert route["deduplication"]["unique_benchmark_surface_count"]==14
          aa=next(x for x in route["routes"] if x["surface"]=="AA-Briefcase v1.1")
          assert aa["comparator_provenance"]["frozen_score"]==1822
          assert aa["comparator_provenance"]["live_reference_score"]==1808
          assert total["verified"]["target_count"]==8 and total["verified"]["witness_count"]==12 and total["verified"]["pair_count"]==96
          assert total["verified"]["closed_target_count"]==0 and total["verified"]["residual_target_count"]==8
          assert front["minimum_execution_sequence"][0]["status"]=="COMPLETE__INDEPENDENT_PUBLIC_RUNNER_PASS"
          s=next(x for x in r3["compressed_residuals"] if x["predicate_id"]=="SYNTHESIS_MATCHED_QUALITY_COVERAGE_NONINFERIOR")
          assert s["current_rebind_required"] is False
          assert s["current_residual"]=={"missing_scope_relation":True,"missing_atoms":["metric:matched_quality"],"missing_metric_bounds":["matched_quality_noninferiority","required_claim_coverage_noninferiority"]}
          assert synth["current_residual"]["proved_atom_count"]==7
          assert synth["current_residual"]["implies_target"] is False
          assert auth["truth"]["opus55_acceptance"]=="5/19_PASS__14/19_OPEN"
          assert auth["truth"]["achieved"] is False
          assert auth["sources"]["root2_root3_minimum_execution_frontier_v1"]["git_blob_sha"]=="471496219ef8bea258334cbd563e2f22c69e3b5f"
          assert auth["sources"]["root2_fixed_bar_route_inventory_v1"]["git_blob_sha"]=="a0ad666e43c4dd5121d6f235f87962dd2bf17004"
          assert auth["sources"]["terminal_root_cause_state"]["git_blob_sha"]=="458a01f6a4b4f172c04785a3cdb4911086875f7c"
          assert "NO_FRESH_REALITY" in auth["next_terminal_action"]
          assert front["fresh_reality_authority"] is False and synth["fresh_reality_authority"] is False
          print("ZERO_REALITY_WAVE1_V3_RECONCILIATION_PASS")
          PY
