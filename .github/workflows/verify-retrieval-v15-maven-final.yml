name: Verify Retrieval V15 Maven final residual
on:
  push:
    branches:
      - verify/retrieval-v15-maven-final-20261004
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact subject blobs
        run: |
          test "$(git hash-object canonical/runtime/retrieval_live_provider_arena_v15.py)" = "e32b955fa2355a61e6ae585b435a75143dc1bce8"
          test "$(git hash-object canonical/tests/test_retrieval_live_provider_arena_v15.py)" = "ef4a88cbfa1efe08a2437962ea7fc164a1ef94aa"
          test "$(git hash-object canonical/runtime/retrieval_live_provider_arena_v14.py)" = "fc0327ff562d855280617a6e73748d55146c5c8b"
          test "$(git hash-object canonical/runtime/retrieval_live_provider_arena_v13.py)" = "d36f5f29060db6ad5db5f44b16751099f54873ca"
          test "$(git hash-object canonical/runtime/retrieval_live_provider_arena_v11.py)" = "0e28128d3f67d33ce4058667609e4d513657af55"
      - name: Run deterministic V15 tests
        run: PYTHONPATH=. python canonical/tests/test_retrieval_live_provider_arena_v15.py
      - name: Run live V15 final residual arena
        run: |
          PYTHONPATH=. python canonical/runtime/retrieval_live_provider_arena_v15.py > v15_live.json
          python - <<'PY'
          import json
          x=json.load(open("v15_live.json",encoding="utf-8"))
          assert x["answer_key_identity_used_for_query_generation"] is False
          assert x["successful_case_count"] == 2
          assert x["retryable_failure_count"] == 0
          assert x["recovered_count"] == 2
          assert x["remaining_miss_count"] == 0
          assert x["union_hits"] == 30
          assert x["union_recall"] == 1.0
          assert x["open_world_completeness_claim"] is False
          print("V15_SUMMARY",json.dumps({
            "cases":x["case_count"],"successful":x["successful_case_count"],
            "recovered":x["recovered_count"],"remaining":x["remaining_miss_count"],
            "prior_hits":x["prior_union_hits"],"prior_recall":x["prior_union_recall"],
            "union_hits":x["union_hits"],"union_recall":x["union_recall"],
            "recovered_ids":x["recovered_episode_ids"],
            "remaining_ids":x["remaining_miss_episode_ids"],
            "failed_ids":x["failed_episode_ids"],
          },sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: retrieval-v15-live-result
          path: v15_live.json
          if-no-files-found: error
