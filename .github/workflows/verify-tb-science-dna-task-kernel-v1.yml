name: Verify TB-Science DNA task kernel v1

on:
  pull_request:
    branches: [verify/tb-science-dna-task-kernel-isolated-base-20261011]
    paths:
      - "capsules/tb_science_dna_task_kernel_capability_v1/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact Brain DNA codec and task-kernel blobs
        env:
          C: capsules/tb_science_dna_task_kernel_capability_v1
        run: |
          set -euo pipefail
          test "$(git hash-object "$C/canonical/runtime/dna_storage_codec_v1.py")" = "3734ad7c4674d9ebe77dbaf0592ea10d0a6cb451"
          test "$(git hash-object "$C/canonical/tests/test_dna_storage_codec_v1.py")" = "cc4e9aadabb8ba4b146f2a5ace14fcb62488fca8"
          test "$(git hash-object "$C/canonical/runtime/dna_storage_task_kernel_v1.py")" = "575e265b5ccc005093c2616c449b7b26dee74005"
          test "$(git hash-object "$C/canonical/tests/test_dna_storage_task_kernel_v1.py")" = "6aecf9876552d068d4b7b0ae3d4989c9a573f9b3"
          export PYTHONPATH="$GITHUB_WORKSPACE/$C"
          python -m py_compile             "$C/canonical/runtime/dna_storage_codec_v1.py"             "$C/canonical/runtime/dna_storage_task_kernel_v1.py"             "$C/canonical/tests/test_dna_storage_codec_v1.py"             "$C/canonical/tests/test_dna_storage_task_kernel_v1.py"
          python -m unittest -v             canonical.tests.test_dna_storage_codec_v1             canonical.tests.test_dna_storage_task_kernel_v1
