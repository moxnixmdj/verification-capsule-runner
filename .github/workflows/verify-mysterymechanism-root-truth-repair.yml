name: Verify MysteryMechanism root truth repair

on:
  create:

permissions:
  contents: read

jobs:
  verify:
    if: github.ref_type == 'branch' && startsWith(github.ref_name, 'mystery-root-truth-repair/')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bind immutable event SHA
        run: |
          python - <<'PY'
          import os, subprocess
          head=subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()
          assert head==os.environ["GITHUB_SHA"],(head,os.environ["GITHUB_SHA"])
          assert os.environ["GITHUB_REF_NAME"].startswith("mystery-root-truth-repair/")
          print("immutable truth-repair subject PASS",head)
          PY
      - name: Independently verify target-preserving reclassification
        run: python verification/verify_mysterymechanism_root_truth_repair.py
      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mysterymechanism-root-truth-repair
          path: mysterymechanism_root_truth_repair_receipt.json
          if-no-files-found: error
          retention-days: 30
