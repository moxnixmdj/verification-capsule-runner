name: Verify LiveBench V6 replay72 result
on:
  pull_request:
    branches: [main]
    paths:
      - "verify_livebench_v6_replay72_result.py"
      - ".github/workflows/verify-livebench-v6-replay72-result.yml"
permissions:
  actions: read
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.14"
      - name: Fetch immutable execution evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/${GITHUB_REPOSITORY}/actions/runs/37191913947 > livebench_v6_run.json
          gh api 'repos/${GITHUB_REPOSITORY}/actions/runs/37191913947/jobs?per_page=100' > livebench_v6_jobs.json
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/jobs/111405727774/logs"             -o livebench_v6_job.log
      - name: Independently reduce replay result
        run: python verify_livebench_v6_replay72_result.py
