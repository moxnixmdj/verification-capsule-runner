name: Verify CAD render-equivalent source repair
on:
  pull_request:
    branches: [main]
    paths:
      - canonical/runtime/cad_t0_route_specific_candidate_v1.py
      - canonical/tests/test_cad_t0_source_structure_antishortcut_repair_v1.py
      - .github/workflows/verify-cad-render-equivalent-repair-v1.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Verify exact repaired Brain candidate blob
        run: test "$(git rev-parse HEAD:canonical/runtime/cad_t0_route_specific_candidate_v1.py)" = "339ccc871754fe69ee901549d14ee367ca01ee4f"
      - name: Run render-equivalent antishortcut repair regression
        run: python -m unittest -v canonical.tests.test_cad_t0_source_structure_antishortcut_repair_v1
