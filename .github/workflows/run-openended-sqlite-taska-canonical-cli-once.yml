name: Run SQLite Open-Ended Task A Canonical CLI Once

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: read

jobs:
  execute-once:
    if: github.head_ref == 'execute/sqlite-openended-taska-canonical-cli-20260930-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ASTRA_DISABLE_MODEL_PLANNER: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify frozen task and runtime closure
        run: |
          set -euo pipefail
          test "$(git hash-object canonical/tasks/PARENT_OPENENDED_SQLITE_BACKUP_CONSISTENCY_REAL_TASK_20260930_001.json)" = "5d09c9eebcb09612525836e7926bdf297f4bad32"
          test "$(git hash-object canonical/runtime/astra_runtime.py)" = "6cb668bcc5a00665ea541fc5b6adf494f37ad1c9"
          test "$(git hash-object canonical/runtime/goal_compiler.py)" = "4b61fe911471854ec15c7900816f61e9e55f602e"
          test "$(git hash-object canonical/runtime/BOUND_CAPABILITY_REGISTRY_V1.json)" = "a22761070ba4d45d3eae7b684d5c66cfb0601669"
          test "$(git hash-object canonical/runtime/python_codec_probe.py)" = "fc8b5005a9888422e3cb61f6cf0bd147c740ec84"
          test "$(git hash-object canonical/runtime/verify_pending_cli_binding.py)" = "a6b028c25d79d2dff59c87e3b3ad91d9fe934dae"
          test "$(git hash-object canonical/runtime/promote_pending_binding.py)" = "f100c0d1ce5a4b07af0175035c3122d816459b0b"
      - name: Refresh Ubuntu package metadata
        run: sudo apt-get update
      - name: Execute frozen parent task exactly once through canonical CLI
        id: producer
        continue-on-error: true
        run: python canonical/runtime/astra_runtime.py canonical/astra_runtime/missions/PARENT_OPENENDED_SQLITE_BACKUP_CONSISTENCY_REAL_TASK_20260930_001.json
      - name: Materialize terminal evidence snapshot
        if: always()
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('.')
          mid='PARENT-OPENENDED-SQLITE-BACKUP-CONSISTENCY-REAL-TASK-20260930-001'
          state_path=root/'canonical/astra_runtime/state'/f'{mid}.json'
          evid_dir=root/'canonical/astra_runtime/evidence'
          def readj(p):
              try: return json.loads(p.read_text(encoding='utf-8'))
              except Exception: return None
          state=readj(state_path) if state_path.is_file() else None
          evidence=[]
          if evid_dir.is_dir():
              for p in sorted(evid_dir.glob(mid+'*')):
                  if p.is_file():
                      raw=p.read_bytes()
                      evidence.append({
                          'path':str(p),
                          'sha256':hashlib.sha256(raw).hexdigest(),
                          'json':readj(p),
                          'text_tail':raw.decode('utf-8','replace')[-12000:],
                      })
          out={
              'schema':'PROJECT_BRAIN_CANONICAL_CLI_PARENT_TASK_A_TERMINAL_V1',
              'task_id':mid,
              'task_blob_sha':'5d09c9eebcb09612525836e7926bdf297f4bad32',
              'task_executed':True,
              'execution_count':1,
              'source_task_replay':False,
              'canonical_cli':True,
              'mission_path':'canonical/astra_runtime/missions/PARENT_OPENENDED_SQLITE_BACKUP_CONSISTENCY_REAL_TASK_20260930_001.json',
              'runtime_state':state,
              'evidence':evidence,
              'incremental_spend_usd':0,
              'model_planner_disabled':True,
          }
          pathlib.Path('openended-sqlite-taska-canonical-cli-terminal.json').write_text(
              json.dumps(out,indent=2,sort_keys=True,default=str)+'\n',encoding='utf-8'
          )
          print(json.dumps({'state_status':(state or {}).get('status'),'evidence_count':len(evidence)},sort_keys=True))
          PY
      - name: Upload terminal Task A evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openended-sqlite-taska-canonical-cli-terminal
          path: |
            openended-sqlite-taska-canonical-cli-terminal.json
            canonical/astra_runtime/state/PARENT-OPENENDED-SQLITE-BACKUP-CONSISTENCY-REAL-TASK-20260930-001.json
            canonical/astra_runtime/evidence/PARENT-OPENENDED-SQLITE-BACKUP-CONSISTENCY-REAL-TASK-20260930-001*
          if-no-files-found: error
      - name: Preserve producer terminal failure
        if: steps.producer.outcome != 'success'
        run: exit 1
