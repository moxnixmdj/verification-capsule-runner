name: Verify LiveBench Root1 SmolLM2 semantic core V1

on:
  pull_request:
    paths:
      - "verify_livebench_root1_smollm2_semantic_core_v1.py"
      - ".github/workflows/verify-livebench-root1-smollm2-semantic-core-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Build pinned llama.cpp
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/ggml-org/llama.cpp.git /tmp/llama.cpp
          git -C /tmp/llama.cpp checkout 0504396140d1c882f5f6ee34466a42db7ae90114
          cmake -S /tmp/llama.cpp -B /tmp/llama.cpp/build -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF -DLLAMA_CURL=OFF
          cmake --build /tmp/llama.cpp/build --config Release -j2 --target llama-cli
          /tmp/llama.cpp/build/bin/llama-cli --version

      - name: Fetch and verify pinned sub-100MB learned artifact
        shell: bash
        run: |
          set -euo pipefail
          MODEL=/tmp/SmolLM2-135M-Instruct-IQ4_XS.gguf
          curl --fail --location --retry 3 --output "$MODEL"             "https://huggingface.co/bartowski/SmolLM2-135M-Instruct-GGUF/resolve/a8a1f0e5962e87caf134245b7796b15cd4563d6f/SmolLM2-135M-Instruct-IQ4_XS.gguf?download=true"
          echo "d766661c2e39c3da78d8eddf15287af263dce1eedc1c9c8093ed8e54eb067dbc  $MODEL" | sha256sum -c -
          SIZE="$(stat -c '%s' "$MODEL")"
          test "$SIZE" -le 100000000
          printf 'model_bytes=%s\n' "$SIZE"

      - name: Run frozen four-effect semantic preflight
        id: semantic
        continue-on-error: true
        shell: bash
        run: |
          python verify_livebench_root1_smollm2_semantic_core_v1.py             --llama-cli /tmp/llama.cpp/build/bin/llama-cli             --model /tmp/SmolLM2-135M-Instruct-IQ4_XS.gguf             --result semantic-core-result.json

      - name: Upload exact preflight result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livebench-root1-smollm2-semantic-core-v1
          path: semantic-core-result.json
          if-no-files-found: error

      - name: Enforce candidate gate
        if: always()
        shell: bash
        run: |
          test "${{ steps.semantic.outcome }}" = "success"
