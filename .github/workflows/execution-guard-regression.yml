name: Execution Guard Regression
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile live guard
        run: python -m py_compile execution_guard/actions_admission.py execution_guard/github_ref_store_live.py execution_guard/github_actions_guarded_run_live.py execution_guard/launcher_audit.py
      - name: Reject direct scientific launch bypasses
        run: python execution_guard/launcher_audit.py .
