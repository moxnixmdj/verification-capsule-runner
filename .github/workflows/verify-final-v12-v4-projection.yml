name: Verify final Root2 V12 adaptive V4 projection
on:
  pull_request:
    paths:
      - 'subject/final_v12_v4_projection_20261004_sol/**'
      - 'verify_final_v12_v4_projection.py'
      - '.github/workflows/verify-final-v12-v4-projection.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python verify_final_v12_v4_projection.py
