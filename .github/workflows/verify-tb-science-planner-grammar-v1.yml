name: Verify TB-Science planner grammar repair v1

on:
  pull_request:
    branches: [terminal-execution-v1]
    paths:
      - "capsules/tb_science_planner_grammar_v1/ACTIVATE.json"

permissions:
  contents: read

concurrency:
  group: verify-tb-science-planner-grammar-v1
  cancel-in-progress: true

jobs:
  live-transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Exact candidate and zero-exposure gate
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "pull_request"
          test "$GITHUB_BASE_REF" = "terminal-execution-v1"
          test "$GITHUB_HEAD_REF" = "verify/tb-science-planner-grammar-v1-20261007"
          C=capsules/tb_science_planner_grammar_v1
          test "$(git hash-object "$C/canonical/runtime/harbor_science_planner_v1.py")" = "01d859c8f27b317893027e693c9aa49e833a256f"
          test "$(git hash-object "$C/canonical/runtime/harbor_command_policy.py")" = "a525773417291c7a4841bf35e1baff5370350d0d"
          test "$(git hash-object "$C/canonical/tests/test_harbor_science_planner_v1.py")" = "3020cc54412c158efe38180025d066b5c2028165"
          python - <<'PY'
          import json
          x=json.load(open("capsules/tb_science_planner_grammar_v1/ACTIVATE.json"))
          assert x["terminal_case_exposure"] is False
          assert x["benchmark_task_content_read"] is False
          assert x["incremental_spend_usd"] == 0
          PY

      - name: Unit regression
        env:
          PYTHONPATH: capsules/tb_science_planner_grammar_v1
        run: python -m unittest -v canonical.tests.test_harbor_science_planner_v1

      - name: Clean-build exact llama.cpp
        run: |
          set -euo pipefail
          rm -rf llama.cpp
          git init llama.cpp
          git -C llama.cpp remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C llama.cpp fetch --depth 1 origin bec4772f6a2527d371557b5d2032641e5ff7619c
          git -C llama.cpp checkout --detach FETCH_HEAD
          test "$(git -C llama.cpp rev-parse HEAD)" = "bec4772f6a2527d371557b5d2032641e5ff7619c"
          cmake -S llama.cpp -B llama.cpp/build -DGGML_CUDA=OFF -DLLAMA_CURL=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build llama.cpp/build -j 2 --target llama-server

      - name: Restore exact Qwen model cache
        uses: actions/cache@v4
        with:
          path: models/Qwen3.5-9B-M-TS-Q4_K_M.gguf
          key: brain-qwen35-9b-f41c0a0c0e43bf721fb2da29374cd1a97271bac0bab08a9dc42964525e82350c

      - name: Acquire and verify exact Qwen model if cache misses
        run: |
          set -euo pipefail
          mkdir -p models
          if [ ! -f models/Qwen3.5-9B-M-TS-Q4_K_M.gguf ]; then
            curl -L --fail --retry 3 --retry-delay 3 --silent --show-error -o models/Qwen3.5-9B-M-TS-Q4_K_M.gguf 'https://huggingface.co/TheStageAI/Qwen3.5-9B-GGUF/resolve/main/Qwen3.5-9B-M-TS-Q4_K_M.gguf?download=true'
          fi
          echo 'f41c0a0c0e43bf721fb2da29374cd1a97271bac0bab08a9dc42964525e82350c  models/Qwen3.5-9B-M-TS-Q4_K_M.gguf' | sha256sum -c -

      - name: Start exact local endpoint
        run: |
          set -euo pipefail
          EXTRA=()
          if llama.cpp/build/bin/llama-server --help 2>&1 | grep -q -- '--reasoning'; then EXTRA+=(--reasoning off); fi
          nohup llama.cpp/build/bin/llama-server -m models/Qwen3.5-9B-M-TS-Q4_K_M.gguf --alias brain-qwen3.5-9b --host 127.0.0.1 --port 8080 -c 8192 -t 4 --parallel 1 --jinja --no-webui "${EXTRA[@]}" > LIVE_TRANSPORT_SERVER.log 2>&1 &
          ok=0
          for i in $(seq 1 240); do
            if curl -fsS http://127.0.0.1:8080/health > LIVE_TRANSPORT_HEALTH.json 2>/dev/null; then ok=1; break; fi
            sleep 1
          done
          test "$ok" = 1

      - name: Live repaired planner probe
        env:
          PYTHONPATH: capsules/tb_science_planner_grammar_v1
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from canonical.runtime import harbor_science_planner_v1 as p
          out=p.plan(
              "Synthetic transport-only probe. Use submit_science_proposal exactly once. "
              "Set material_requirements to [\"R1\"]. Return one candidate with action_id A1, "
              "covers [\"R1\"], command \"printf ok\", and verify_command \"test true\". "
              "This is not a benchmark task and has no terminal authority.",
              timeout_s=180,
          )
          obj=p.extract_json_object(out["text"])
          assert obj["material_requirements"] == ["R1"], obj
          assert len(obj.get("candidates") or []) == 1, obj
          c=obj["candidates"][0]
          assert isinstance(c["command"],str) and 0 < len(c["command"]) <= p.MAX_COMMAND_CHARS
          assert isinstance(c["verify_command"],str) and 0 < len(c["verify_command"]) <= p.MAX_COMMAND_CHARS
          receipt={
              "schema":"PROJECT_BRAIN_TB_SCIENCE_PLANNER_GRAMMAR_LIVE_TRANSPORT_PROBE_V1",
              "pass":True,
              "transport":out["transport"],
              "model":out["model"],
              "terminal_case_exposure":False,
              "benchmark_task_content_read":False,
              "incremental_spend_usd":0,
              "acceptance_credit_delta":0,
              "terminal_credit_delta":0,
          }
          open("LIVE_TRANSPORT_RECEIPT.json","w").write(json.dumps(receipt,indent=2,sort_keys=True)+"\n")
          print(json.dumps(receipt,sort_keys=True))
          PY
          if grep -q "number of repetitions exceeds sane defaults" LIVE_TRANSPORT_SERVER.log; then
            echo "old grammar failure signature survived" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tb-science-planner-grammar-live-transport-v1
          path: |
            LIVE_TRANSPORT_RECEIPT.json
            LIVE_TRANSPORT_HEALTH.json
            LIVE_TRANSPORT_SERVER.log
          if-no-files-found: warn
          retention-days: 1
