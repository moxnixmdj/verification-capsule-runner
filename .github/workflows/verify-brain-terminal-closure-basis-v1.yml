name: Verify Brain terminal closure basis v1

on:
  pull_request:
    paths:
      - 'capsules/terminal_closure_basis_v1/**'
      - '.github/workflows/verify-brain-terminal-closure-basis-v1.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact mirrored Brain blob identities
        env:
          EXPECTED_JSON: '{"capsules/terminal_closure_basis_v1/canonical/runtime/terminal_action_coverage_guard_v1.py":"554ab5b928a5f6cf050e43969dae549d887b0845","capsules/terminal_closure_basis_v1/canonical/tests/test_terminal_action_coverage_guard_v1.py":"5de587228da4f022ae20ad55b35ad5c59382139c","capsules/terminal_closure_basis_v1/canonical/governance/TERMINAL_ACTION_COVERAGE_GUARD_V1.json":"d0d74cb6d79ac29b5482733cc0e4256ce7a725a8","capsules/terminal_closure_basis_v1/canonical/runtime/reopened_objective_route_compiler_v1.py":"cf1071330095c8408340d457ded27432292a7614","capsules/terminal_closure_basis_v1/canonical/tests/test_reopened_objective_route_compiler_v1.py":"56ef1f0a126b671fc2d04ab754ed906003d0f368","capsules/terminal_closure_basis_v1/canonical/governance/REOPENED_OBJECTIVE_ROUTE_COMPILER_V1.json":"4cac8638d7be5e4f9cc1d26ab7dbd7c33c24253d","capsules/terminal_closure_basis_v1/canonical/governance/OPUS55_REOPENED_OBJECTIVE_ROUTE_RESIDUAL_V1.json":"88fcea48cbf165ad93460cc956f08bb958f2babd","capsules/terminal_closure_basis_v1/canonical/governance/OPUS55_ACCEPTANCE_ACTION_HYPERGRAPH_V1.json":"9089f3c31bac1fc3d5c9eff1d078e6b865dc874b","capsules/terminal_closure_basis_v1/canonical/governance/OPUS55_ACCEPTANCE_PREDICATE_REGISTRY_V2.json":"562536d9ba3f245a6bd24490a1eb3b30f27e0c3a","capsules/terminal_closure_basis_v1/canonical/governance/OPUS55_ACCEPTANCE_PREDICATE_EVIDENCE_BINDINGS_V2.json":"cd15b26246771cc0fa7a38fddfa267b05795add0","capsules/terminal_closure_basis_v1/canonical/verification/CURRENT_OBJECTIVE_BINDINGS_PUBLIC_RUNNER_VERIFICATION_20261002_V2.json":"3aa8168fc7f81581eea4085504e4a70205949af9"}'
        run: |
          python - <<'PY'
          import json, os, subprocess
          expected=json.loads(os.environ["EXPECTED_JSON"])
          failures=[]
          for path,want in expected.items():
              got=subprocess.check_output(["git","hash-object",path],text=True).strip()
              if got!=want:
                  failures.append(f"{path}: {got} != {want}")
          if failures:
              raise SystemExit("\n".join(failures))
          print(f"EXACT_BLOB_IDENTITY_PASS {len(expected)}/{len(expected)}")
          PY
      - name: Run unit tests
        env:
          PYTHONPATH: capsules/terminal_closure_basis_v1
        run: |
          python -m unittest -v canonical.tests.test_terminal_action_coverage_guard_v1 canonical.tests.test_reopened_objective_route_compiler_v1
      - name: Verify live unresolved action coverage
        env:
          PYTHONPATH: capsules/terminal_closure_basis_v1
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from canonical.runtime.terminal_action_coverage_guard_v1 import evaluate
          root=Path("capsules/terminal_closure_basis_v1")
          load=lambda p: json.loads((root/p).read_text())
          out=evaluate(
            load(Path("canonical/governance/OPUS55_ACCEPTANCE_PREDICATE_REGISTRY_V2.json")),
            load(Path("canonical/governance/OPUS55_ACCEPTANCE_PREDICATE_EVIDENCE_BINDINGS_V2.json")),
            load(Path("canonical/governance/OPUS55_ACCEPTANCE_ACTION_HYPERGRAPH_V1.json")),
          )
          print(json.dumps(out,indent=2,sort_keys=True))
          assert out["pass"], out
          assert out["unresolved_predicate_count"]==31, out
          assert out["represented_unresolved_predicate_count"]==31, out
          assert out["uncovered_unresolved_predicates"]==[], out
          PY
      - name: Verify reopened objective route residual
        env:
          PYTHONPATH: capsules/terminal_closure_basis_v1
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from canonical.runtime.reopened_objective_route_compiler_v1 import evaluate
          root=Path("capsules/terminal_closure_basis_v1")
          load=lambda p: json.loads((root/p).read_text())
          out=evaluate(
            load(Path("canonical/governance/OPUS55_ACCEPTANCE_PREDICATE_REGISTRY_V2.json")),
            load(Path("canonical/governance/OPUS55_REOPENED_OBJECTIVE_ROUTE_RESIDUAL_V1.json")),
            load(Path("canonical/verification/CURRENT_OBJECTIVE_BINDINGS_PUBLIC_RUNNER_VERIFICATION_20261002_V2.json")),
          )
          print(json.dumps(out,indent=2,sort_keys=True))
          assert out["status"]=="PASS", out
          assert out["candidate_predicates"]==[
            "DELEGATION_TERMINAL_SUCCESS_NONINFERIOR",
            "RECOVERY_CAUSAL_LOCALIZATION_NONINFERIOR",
            "TOOL_LEARNING_SUCCESS_ROUTE_NONINFERIOR",
          ], out
          assert out["full_protocol_replacement_candidate_count"]==3, out
          assert out["promotion_authority"] is False
          assert out["execution_authority"] is False
          PY
      - name: Assert TB4 remains revoked and zero credit
        run: |
          python - <<'PY'
          import json
          base="capsules/terminal_closure_basis_v1/canonical"
          h=json.load(open(f"{base}/governance/OPUS55_ACCEPTANCE_ACTION_HYPERGRAPH_V1.json",encoding="utf-8"))
          r=json.load(open(f"{base}/governance/OPUS55_REOPENED_OBJECTIVE_ROUTE_RESIDUAL_V1.json",encoding="utf-8"))
          assert h["attainability_cut"]["reality_execution_authorized"] is False
          assert h["attainability_cut"]["maximum_attainable_successes"]==180
          assert h["attainability_cut"]["required_successes"]==220
          for d in (h,r):
              assert d.get("capability_credit_delta",0)==0
              assert d.get("family_credit_delta",0)==0
              assert d.get("incremental_spend_usd",0)==0
          print("ZERO_CREDIT_AND_TB4_REVOCATION_PASS")
          PY
