name: Verify Unknown-Domain V3 universal zero-reality proof
on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/runtime/unknown_domain_direct_candidate_v3.py'
      - 'canonical/runtime/unknown_domain_direct_v3_universal_proof_v1.py'
      - 'canonical/tests/test_unknown_domain_direct_candidate_v3.py'
      - 'canonical/tests/test_unknown_domain_direct_v3_universal_proof_v1.py'
      - 'canonical/governance/UNKNOWN_DOMAIN_DIRECT_V3_UNIVERSAL_PROOF_CANDIDATE_20261005_V1.json'
      - 'verify_unknown_domain_v3_universal_zero_reality_v1.py'
      - '.github/workflows/verify-unknown-domain-v3-universal-zero-reality-v1.yml'

permissions:
  contents: read

concurrency:
  group: unknown-domain-v3-universal-zero-reality
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run copied Brain regression tests
        run: |
          python -m pytest canonical/tests/test_unknown_domain_direct_candidate_v3.py -q
          python -m pytest canonical/tests/test_unknown_domain_direct_v3_universal_proof_v1.py -q
      - name: Independent symbolic derivation and verifier-only falsification
        run: python verify_unknown_domain_v3_universal_zero_reality_v1.py
