name: Guarded HTTP2 Open-Ended Parent Task A

on:
  push:
    branches:
      - guarded/http2-parent-task-a-once-20260930-v1

permissions:
  contents: write

jobs:
  guarded-parent-task:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Atomic guarded admission and one-shot parent execution
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python execution_guard/github_actions_guarded_run_live.py \
            --plan guarded_http2_parent_task_a_plan.json \
            --receipt guarded-http2-parent-task-a-launch-receipt.json
      - name: Upload guarded parent evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: guarded-http2-parent-task-a
          path: |
            guarded-http2-parent-task-a-launch-receipt.json
            canonical/astra_runtime/evidence/PARENT-OPENENDED-HTTP2-FLOW-CONTROL-LIMITS-REAL-TASK-20260930-003*
            canonical/astra_runtime/state/PARENT-OPENENDED-HTTP2-FLOW-CONTROL-LIMITS-REAL-TASK-20260930-003*
            canonical/astra_runtime/tmp/*
          if-no-files-found: warn
