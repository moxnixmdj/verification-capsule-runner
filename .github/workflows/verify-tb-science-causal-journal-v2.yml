name: Verify TB-Science causal journal V2 closure

on:
  pull_request:
    branches: [terminal-execution-v1]
    paths:
      - "execution_guard/terminal_causal_journal_v2.py"
      - "execution_guard/terminal_causal_journal_filebridge_v2.py"
      - "execution_guard/test_terminal_causal_journal_v2.py"
      - "capsules/tb_science_rank15_20261009_v1/canonical/runtime/harbor_science_agent_v10.py"
      - ".github/workflows/verify-tb-science-causal-journal-v2.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile closure
        run: |
          python -m py_compile             execution_guard/terminal_causal_journal_v2.py             execution_guard/terminal_causal_journal_filebridge_v2.py             capsules/tb_science_rank15_20261009_v1/canonical/runtime/harbor_science_agent_v10.py
      - name: Verify new event kinds and bridge
        run: |
          python -m pip install --disable-pip-version-check -q pytest
          export PYTHONPATH="$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/capsules/tb_science_rank15_20261009_v1"
          python -m pytest -q execution_guard/test_terminal_causal_journal_v2.py
