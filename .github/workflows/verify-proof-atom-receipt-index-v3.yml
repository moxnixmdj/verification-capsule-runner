name: Verify proof atom receipt index v3
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/proof_atom_receipt_index_v3/**"
      - ".github/workflows/verify-proof-atom-receipt-index-v3.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact Brain blob identities
        run: |
          cd capsules/proof_atom_receipt_index_v3
          python - <<'PY'
          import hashlib, json, pathlib
          m=json.load(open("EXPECTED_BRAIN_BLOBS.json",encoding="utf-8"))
          for src,expected in m["exact_brain_blobs"].items():
              data=pathlib.Path(src).read_bytes()
              actual=hashlib.sha1(f"blob {len(data)}\0".encode()+data).hexdigest()
              assert actual==expected,(src,actual,expected)
          print("exact Brain blob identities: PASS")
          PY
      - name: Verify V3 adversarial semantics
        run: |
          cd capsules/proof_atom_receipt_index_v3
          export PYTHONPATH=.
          python -m py_compile canonical/runtime/canonical_proof_atom_basis_v2.py canonical/runtime/proof_atom_receipt_index_v3.py
          python -m unittest canonical.tests.test_proof_atom_receipt_index_v3 -v
      - name: Execute exact 40-atom V3 index
        run: |
          cd capsules/proof_atom_receipt_index_v3
          export PYTHONPATH=.
          python -m canonical.runtime.proof_atom_receipt_index_v3 > index.json
          python - <<'PY'
          import json
          p=json.load(open("index.json",encoding="utf-8"))
          assert p["status"].startswith("PASS"),p["status"]
          assert p["canonical_atom_count"]==40,p["canonical_atom_count"]
          assert len(p["basis_manifest_sha256"])==64
          assert len(p["scanned_corpus_manifest_sha256"])==64
          assert len(p["scan_policy_sha256"])==64
          assert len(p["index_fingerprint_sha256"])==64
          assert p["review_queue_length"]==p["atoms_with_candidate_matches"]
          assert p["new_reality_units_consumed"]==0
          assert p["capability_credit_delta"]==0
          assert p["family_credit_delta"]==0
          assert p["execution_authority"] is False
          assert p["promotion_authority"] is False
          print(json.dumps({
            "canonical_atom_count":p["canonical_atom_count"],
            "scanned_file_count":p["scanned_file_count"],
            "candidate_match_count":p["candidate_match_count"],
            "atoms_with_candidate_matches":p["atoms_with_candidate_matches"],
            "atoms_without_candidate_matches":p["atoms_without_candidate_matches"],
            "review_queue_length":p["review_queue_length"],
            "basis_manifest_sha256":p["basis_manifest_sha256"],
            "scanned_corpus_manifest_sha256":p["scanned_corpus_manifest_sha256"],
            "scan_policy_sha256":p["scan_policy_sha256"],
            "index_fingerprint_sha256":p["index_fingerprint_sha256"]
          },indent=2,sort_keys=True))
          PY
