name: Guarded Genomics Parent Task B Carrier

on:
  pull_request:
    branches: [main]
    paths:
      - ARM_GUARDED_GENOMICS_PARENT_TASK_B_20260930_005

permissions:
  contents: write

jobs:
  execute-once:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'

      - name: Verify frozen carrier entry bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object canonical/tasks/PARENT-OPENENDED-GENOMICS-REFERENCE-LENGTH-REAL-TASK-20260930-005.json)" = "5f1a8fea0d29c2a60dcc7a038ecd557829e602e7"
          test "$(git hash-object canonical/astra_runtime/missions/PARENT-OPENENDED-GENOMICS-REFERENCE-LENGTH-REAL-TASK-20260930-005.json)" = "03e718a9c779c26d26e7af140f2f65549c1a7f6e"
          test "$(git hash-object canonical/action_intents/2026-09-30_EXECUTE_GUARDED_GENOMICS_PARENT_TASK_B_V2.json)" = "2cefd24591faf06ae307d7a4ece412e7b7836a6b"
          test "$(git hash-object canonical/runtime/astra_runtime.py)" = "426ffe58e405dc4f1ba2eb4e838e03a1df771964"
          test "$(git hash-object generate_guarded_genomics_parent_plan.py)" = "0ff404cb7c15e3f07d49bb77d0fac2586265cad6"
          test "$(git hash-object run_guarded_genomics_parent_task_once.py)" = "bb2931c5386facb8e8fb96227773cd79f5b30442"
          test "$(git hash-object execution_guard/github_actions_guarded_run_live.py)" = "30ea2fd2cc548444477c7b234a59129ff8386235"
          test "$(git hash-object execution_guard/actions_admission.py)" = "6c46abef66c036f5382d5792b11a82a289b4dd94"
          test "$(git hash-object execution_guard/github_ref_store_live.py)" = "a8b0cf3facd91f4d4248bd4d2ed53f72f7d480c3"
          echo FROZEN_CARRIER_ENTRY_BYTES_OK

      - name: Generate complete exact runtime guard plan
        run: python generate_guarded_genomics_parent_plan.py

      - name: Atomically admit once then execute frozen parent Task B
        id: guarded
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python execution_guard/github_actions_guarded_run_live.py --plan guarded_genomics_parent_task_b_plan.json --receipt guarded-genomics-parent-admission.json

      - name: Upload terminal evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: guarded-genomics-parent-task-b-terminal
          path: |
            guarded-genomics-parent-admission.json
            guarded_genomics_parent_task_b_plan.json
            genomics-parent-task-terminal.json
          if-no-files-found: warn

      - name: Preserve terminal failure
        if: steps.guarded.outcome != 'success'
        run: exit 1
