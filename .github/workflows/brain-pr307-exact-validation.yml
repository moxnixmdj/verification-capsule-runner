name: Validate Brain PR307 Exact Authority Logic
on:
  pull_request:
    branches:
      - main
    paths:
      - ARM_BRAIN_PR307_EXACT_VALIDATION_20260930_V1
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate exact mirrored PR307 authority logic
        id: validation
        continue-on-error: true
        run: python pr307_validation/run_validation.py
      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brain-pr307-exact-validation
          path: pr307_validation/pr307-validation-report.json
          if-no-files-found: error
      - name: Preserve failure
        if: steps.validation.outcome != 'success'
        run: exit 1
