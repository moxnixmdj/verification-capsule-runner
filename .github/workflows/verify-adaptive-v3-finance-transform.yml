name: Verify Adaptive V3 Finance transform deletion
on:
  pull_request:
    paths:
      - "subject/TERMINAL_ADAPTIVE_MINIMUM_ACTION_POLICY_V2.json"
      - "subject/TERMINAL_ADAPTIVE_MINIMUM_ACTION_POLICY_V3.json"
      - "subject/FINANCE_INDEX_PUBLIC_TRANSFORM_ROUTE_SATURATION_PUBLIC_RUNNER_VERIFICATION_20261004_V1.json"
      - "subject/FINANCE_INDEX_PUBLIC_TRANSFORM_ROUTE_SATURATION_20261004_V1.json"
      - "subject/TERMINAL_ROOT_CAUSE_STATE_V1.json"
      - "subject/ROOT2_CLOSURE_V2_CURRENT_FRONTIER_V10.json"
      - "subject/ROOT3_MINIMUM_ACTION_CUT_V2.json"
      - "subject/GLOBAL_RETRIEVAL_CURRENT_AUTHORITY_V1.json"
      - "verify_adaptive_v3_finance_transform.py"
      - ".github/workflows/verify-adaptive-v3-finance-transform.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python verify_adaptive_v3_finance_transform.py
