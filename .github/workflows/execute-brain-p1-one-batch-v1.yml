name: Execute frozen Brain P1 one-batch reality cut V1

on:
  pull_request:
    paths:
      - "capsules/brain_p1_one_batch_execution_v1/**"
  workflow_dispatch:

jobs:
  execute:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify frozen execution inputs
        working-directory: capsules/brain_p1_one_batch_execution_v1
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          expected = {
              "canonical/runtime/p1_shared_failure_semantics_batch_v1.py": "ca82ce925f26442f48d00d39eed0b5b8abf3558e",
              "canonical/governance/P1_SHARED_FAILURE_SEMANTICS_BATCH_FREEZE_V1.json": "f5815ccfeadb28171e5261a839b7f37f358684e4",
              "canonical/runtime/contract_native_proof_suites.py": "0210790c7dd705ef328e1b55d529a30c5c6c3337",
              "canonical/runtime/trajectory_failure_typed_ir_candidate_v7.py": "28940387bd6c11671035ad9201e37bba13fd9bc9",
          }
          for path,want in expected.items():
              data=Path(path).read_bytes()
              got=hashlib.sha1(f"blob {len(data)}\0".encode()+data).hexdigest()
              assert got==want,(path,got,want)
          anchor=json.loads(Path("freeze_anchor.json").read_text())
          assert anchor["brain_pull_request"]==1180
          assert isinstance(anchor["freeze_merge_sha"],str) and len(anchor["freeze_merge_sha"])==40
          assert isinstance(anchor["freeze_merge_committer_unix"],int)
          assert anchor["freeze_merge_committer_unix"]>1692803367
          assert anchor["freeze_verification_run_id"]==37088297978
          print(json.dumps(anchor,sort_keys=True))
          PY
      - name: Fetch post-freeze drand beacon and execute exactly one shared batch
        working-directory: capsules/brain_p1_one_batch_execution_v1
        run: |
          export PYTHONPATH=.
          python - <<'PY'
          import hashlib, json, time, urllib.request
          from pathlib import Path
          from canonical.runtime.p1_shared_failure_semantics_batch_v1 import execute_batch

          CHAIN="52db9ba70e0cc0f6eaf7803dd07447a1f5477735fd3f661792ba94600c84e971"
          GENESIS=1692803367
          PERIOD=3
          anchor=json.loads(Path("freeze_anchor.json").read_text())
          t=anchor["freeze_merge_committer_unix"]
          round_id=((t-GENESIS)//PERIOD)+2
          nominal_start=GENESIS+(round_id-1)*PERIOD
          assert nominal_start>t

          relays=[
              "https://api.drand.sh",
              "https://api2.drand.sh",
              "https://drand.cloudflare.com",
          ]
          rows=[]
          for base in relays:
              url=f"{base}/{CHAIN}/public/{round_id}"
              last=None
              for attempt in range(5):
                  try:
                      with urllib.request.urlopen(url,timeout=20) as resp:
                          last=json.loads(resp.read().decode("utf-8"))
                      break
                  except Exception:
                      if attempt==4: raise
                      time.sleep(2)
              assert last["round"]==round_id,(url,last)
              rows.append(last)

          sigs={row["signature"] for row in rows}
          rands={row["randomness"] for row in rows}
          assert len(sigs)==1 and len(rands)==1,(sigs,rands)
          signature=next(iter(sigs))
          randomness=next(iter(rands))
          assert hashlib.sha256(bytes.fromhex(signature)).hexdigest()==randomness

          result=execute_batch(randomness,round_id)
          envelope={
              "schema":"PROJECT_BRAIN_P1_SHARED_FAILURE_SEMANTICS_BATCH_EXECUTION_RESULT_V1",
              "freeze_anchor":anchor,
              "drand":{
                  "chain_hash":CHAIN,
                  "round":round_id,
                  "nominal_start_unix":nominal_start,
                  "relay_count":len(relays),
                  "relays":relays,
                  "signature":signature,
                  "randomness":randomness,
                  "signature_sha256_matches_randomness":True,
              },
              "batch_result":result,
          }
          Path("p1_batch_result.json").write_text(json.dumps(envelope,indent=2,sort_keys=True)+"\n")
          print("P1_BATCH_RESULT_JSON="+json.dumps(envelope,sort_keys=True,separators=(",",":")))
          assert result["pass"] is True,result
          assert result["case_count"]==15
          assert result["all_three_surfaces_covered"] is True
          assert result["fresh_reality_units_consumed"]==1
          assert result["terminal_v3_results_replayed"]==0
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p1-one-batch-result-v1
          path: capsules/brain_p1_one_batch_execution_v1/p1_batch_result.json
          if-no-files-found: error
          retention-days: 90
