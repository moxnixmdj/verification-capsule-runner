name: Verify Recovery Opus55 zero-reality acceptance
on:
  push:
    branches: [verify/recovery-opus55-zero-reality-v1-20261003-sol]
    paths:
      - "capsules/recovery_opus55_zero_reality_v1/**"
      - ".github/workflows/verify-recovery-opus55-zero-reality-v1.yml"
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact mirrored blobs
        run: |
          set -euo pipefail
          cd capsules/recovery_opus55_zero_reality_v1
          python - <<'PY'
          import json, subprocess
          m=json.load(open("manifest.json"))
          for p,sha in m["source_files"].items():
              got=subprocess.check_output(["git","hash-object",p],text=True).strip()
              assert got==sha,(p,sha,got)
          print("EXACT_BLOBS_PASS",len(m["source_files"]))
          PY
      - name: Run isolated Recovery reducer tests
        run: |
          set -euo pipefail
          cd capsules/recovery_opus55_zero_reality_v1
          export PYTHONPATH=.
          python -m unittest -v canonical.tests.test_recovery_opus55_zero_reality_acceptance_reduction_v1
      - name: Enforce non-circular strict eligibility
        run: |
          set -euo pipefail
          cd capsules/recovery_opus55_zero_reality_v1
          export PYTHONPATH=.
          python - <<'PY'
          from canonical.runtime import recovery_opus55_zero_reality_acceptance_reduction_v1 as r
          o=r.evaluate()
          assert o["pass"] is True,o
          assert o["proposed_atomic_acceptance_delta"]==3,o
          assert o["proposed_family_acceptance_delta"]==1,o
          assert o["promotion_eligible"] is True,o
          assert o["new_reality_units_consumed"]==0,o
          assert o["terminal_results_replayed"]==0,o
          assert o["stronger_proof_basis"]["scope_complete"] is True,o
          assert o["stronger_proof_basis"]["objective_ceiling_or_floor"] is True,o
          assert o["stronger_proof_basis"]["historical_narrow_terminal_run_used_as_proof"] is False,o
          assert o["stronger_proof_basis"]["historical_relation_observed_bound_used_as_proof"] is False,o
          assert o["stronger_proof_basis"]["universal_achieved_bounds"]=={"causal_localization":1,"terminal_recovery":1,"critical_fail_closed_misses":0},o
          assert o["stronger_proof_basis"]["quarantined_public_recovery_run_used_as_proof"] is False,o
          assert o["promotion_authority"] is False,o
          print("RECOVERY_STRICT_ELIGIBILITY_PASS")
          PY
