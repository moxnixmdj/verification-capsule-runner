name: Verify terminal atomic closure V4
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/terminal_atomic_closure_v4/**"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python verifiers/verify_terminal_atomic_closure_v4.py
