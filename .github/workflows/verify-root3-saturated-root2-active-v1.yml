name: Verify Root3 saturated Root2 active V1
on:
  push:
    branches: ["verify/root3-saturated-root2-active-v1-20261003-sol"]
    paths:
      - ".github/workflows/verify-root3-saturated-root2-active-v1.yml"
      - "capsules/root3_saturated_root2_active_v1/brain/**"
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact current cut
        run: |
          set -euo pipefail
          ROOT=capsules/root3_saturated_root2_active_v1/brain
          test "$(git hash-object "$ROOT/canonical/governance/TERMINAL_ROOT_CAUSE_STATE_V1.json")" = "815038c358d31b8b0abade1352bb09d8096a51e5"
          test "$(git hash-object "$ROOT/canonical/governance/ROOT2_FIXED_BAR_ROUTE_INVENTORY_V1.json")" = "5e7eca8956eb4453858525bc50c4d63d0de12e02"
          test "$(git hash-object "$ROOT/canonical/governance/ROOT2_ROOT3_MINIMUM_EXECUTION_FRONTIER_V1.json")" = "98f878ecf0227284ab37aedc176432f6b1b6051c"
          test "$(git hash-object "$ROOT/canonical/governance/CURRENT_TERMINAL_AUTHORITY_V1.json")" = "66464155ac5960a227ecc8e81afdbfcf2752ff30"
          test "$(git hash-object "$ROOT/canonical/governance/CURRENT_ROOT3_ZERO_REALITY_STRONGER_PROOF_SATURATION_V1.json")" = "bdc78fdc147a014e5d77d5daafb5434b1a4e878f"
          test "$(git hash-object "$ROOT/canonical/governance/ROOT3_RESIDUAL_COMPRESSION_V1.json")" = "a9d3e6ebf05032d30fc20ac785e88e6823474601"
          test "$(git hash-object "$ROOT/canonical/verification/CURRENT_WITNESS_TARGET_TOTALIZATION_V2_PUBLIC_RUNNER_VERIFICATION_20261003_V1.json")" = "48c2318aaffffec67855199523235e6943289fc6"
          test "$(git hash-object "$ROOT/canonical/verification/SYNTHESIS_OVERLAY_V3_REBIND_PUBLIC_RUNNER_VERIFICATION_20261003_V1.json")" = "1a67bc568944212c4d235a463c8bd7bea21b3993"
          test "$(git hash-object "$ROOT/canonical/governance/OPUS55_ACCEPTANCE_PREDICATE_EVIDENCE_BINDINGS_V2.json")" = "bc420c6d1a6caaab7a6d5c257640d3f5797170f5"
          python - <<'PY'
          import json
          from pathlib import Path
          r=Path("capsules/root3_saturated_root2_active_v1/brain")
          def L(p): return json.loads((r/p).read_text())
          root=L("canonical/governance/TERMINAL_ROOT_CAUSE_STATE_V1.json")
          route=L("canonical/governance/ROOT2_FIXED_BAR_ROUTE_INVENTORY_V1.json")
          front=L("canonical/governance/ROOT2_ROOT3_MINIMUM_EXECUTION_FRONTIER_V1.json")
          auth=L("canonical/governance/CURRENT_TERMINAL_AUTHORITY_V1.json")
          sat=L("canonical/governance/CURRENT_ROOT3_ZERO_REALITY_STRONGER_PROOF_SATURATION_V1.json")
          r3=L("canonical/governance/ROOT3_RESIDUAL_COMPRESSION_V1.json")
          total=L("canonical/verification/CURRENT_WITNESS_TARGET_TOTALIZATION_V2_PUBLIC_RUNNER_VERIFICATION_20261003_V1.json")
          synth=L("canonical/verification/SYNTHESIS_OVERLAY_V3_REBIND_PUBLIC_RUNNER_VERIFICATION_20261003_V1.json")
          assert root["current_residual_root_partition"]["evidence"]["git_blob_sha"]=="bc420c6d1a6caaab7a6d5c257640d3f5797170f5"
          assert root["current_residual_root_partition"]["root1_positive_gap_count"]==0
          assert route["deduplication"]["root2_only_predicate_count"]==15
          assert route["deduplication"]["unique_benchmark_surface_count"]==14
          assert total["verified"]["closed_target_count"]==0 and total["verified"]["residual_target_count"]==8
          assert synth["verified"]["transported_proved_atom_count"]==7
          assert sat["status"].startswith("SATURATED_CURRENT_BOUND_ROOT3_STRONGER_PROOF_INPUTS")
          assert sat["other_live_root3_target_result"]["current_full_protocol_transmutation_witness_count"]==0
          assert sat["other_live_root3_target_result"]["current_normalized_direct_reuse_closure_count"]==0
          assert front["minimum_execution_sequence"][0]["status"].startswith("DISCHARGED")
          assert front["minimum_execution_sequence"][1]["status"]=="SATURATED_CURRENT_BOUND_EVIDENCE__NO_ADDITIONAL_CLOSURE"
          assert front["current_active_steps"]==[3,4,5]
          assert front["fresh_reality_authority"] is False
          assert auth["truth"]["opus55_acceptance"]=="5/19_PASS__14/19_OPEN" and auth["truth"]["achieved"] is False
          assert auth["sources"]["root2_root3_minimum_execution_frontier_v1"]["git_blob_sha"]=="98f878ecf0227284ab37aedc176432f6b1b6051c"
          assert auth["sources"]["root3_stronger_proof_saturation_v1"]["git_blob_sha"]=="bdc78fdc147a014e5d77d5daafb5434b1a4e878f"
          assert "NO_GENERIC_ROOT3_SEARCH" in auth["next_terminal_action"]
          assert "NO_FRESH_REALITY" in auth["next_terminal_action"]
          print("ROOT3_SATURATED_ROOT2_ACTIVE_V1_PASS")
          PY
