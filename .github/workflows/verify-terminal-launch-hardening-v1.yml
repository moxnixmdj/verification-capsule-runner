name: Verify sealed terminal launch hardening V1
on:
  pull_request:
    branches: [main]
    paths:
      - canonical/runtime/terminal_parent_portfolio_runner_v1.py
      - canonical/tests/test_terminal_parent_portfolio_runner_v1.py
      - canonical/runtime/terminal_parent_portfolio_launcher_v1.py
      - canonical/tests/test_terminal_parent_portfolio_launcher_v1.py
      - canonical/runtime/terminal_wave_launch_authority_reducer_v1.py
      - canonical/tests/test_terminal_wave_launch_authority_reducer_v1.py
      - canonical/governance/TERMINAL_PARENT_PORTFOLIO_RUNNER_BINDING_V1.json
      - .github/workflows/verify-terminal-launch-hardening-v1.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify exact hardened Brain closure
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object 'canonical/runtime/terminal_parent_portfolio_runner_v1.py')" = "05c9adf60b76a8b2e0ccd139a90c4c7fd9d34449"
          test "$(git hash-object 'canonical/tests/test_terminal_parent_portfolio_runner_v1.py')" = "7735a0851c87463b1a19bd9ffcfbee44812296f0"
          test "$(git hash-object 'canonical/runtime/terminal_parent_portfolio_launcher_v1.py')" = "d7f20a66f1f534b06ea11782cb350a582c07d985"
          test "$(git hash-object 'canonical/tests/test_terminal_parent_portfolio_launcher_v1.py')" = "01996bc0cca7246c0dcfea5b1602c4740fa3e45d"
          test "$(git hash-object 'canonical/runtime/terminal_wave_launch_authority_reducer_v1.py')" = "0b5b5e8229cc3e5ee950169469811e7576c43514"
          test "$(git hash-object 'canonical/tests/test_terminal_wave_launch_authority_reducer_v1.py')" = "352a01602259011d8d40f5db2d2b84e4c771a713"
          test "$(git hash-object 'canonical/governance/TERMINAL_PARENT_PORTFOLIO_RUNNER_BINDING_V1.json')" = "5212f5996dbc83e87a308b8c9d9d1d9ed3da5aab"
          test "$(git hash-object 'canonical/runtime/m0a_raw_source_terminal_suite_v2.py')" = "63b5daacfa5623c38228d41f6a84e548890d252d"
          test "$(git hash-object 'canonical/runtime/m0a_raw_source_brain_candidate_v2.py')" = "0aac96d27068bdad379703c1b0b8a7a32cacb2e2"
          test "$(git hash-object 'canonical/runtime/native_artifact_cross_format_proof_v1.py')" = "904eb61171f5ee775ff7824c1be7778d7acc4a23"
          test "$(git hash-object 'canonical/runtime/native_artifact_cross_format_candidate_v1.py')" = "f3e5090647dd9029ab9f46efd06dc0c0d0addbc3"
          test "$(git hash-object 'canonical/runtime/contract_native_proof_suites.py')" = "0210790c7dd705ef328e1b55d529a30c5c6c3337"
          test "$(git hash-object 'canonical/runtime/contract_native_brain_candidate.py')" = "afc18af1d1da6f25166c6cc57dcbc0cd3070bb85"
          test "$(git hash-object 'canonical/runtime/portfolio_multiplex_terminal_instrumentation_v1.py')" = "dd8fba0f27691002babbc7ad1fc6b65d7bb57282"
      - name: Install native artifact verifier dependencies
        run: python -m pip install --disable-pip-version-check --no-input python-docx openpyxl python-pptx pypdf
      - name: Verify real parent producer hardening
        run: PYTHONPATH=. python -m unittest -v canonical.tests.test_terminal_parent_portfolio_runner_v1
      - name: Verify sealed canonical launcher integration
        run: PYTHONPATH=. python -m unittest -v canonical.tests.test_terminal_parent_portfolio_launcher_v1
      - name: Verify authority dependency cone hardening
        run: PYTHONPATH=. python -m unittest -v canonical.tests.test_terminal_wave_launch_authority_reducer_v1
      - name: Rehearse all four parent portfolios with sentinel-only nonterminal seeds
        run: PYTHONPATH=. python canonical/runtime/terminal_parent_portfolio_runner_v1.py
