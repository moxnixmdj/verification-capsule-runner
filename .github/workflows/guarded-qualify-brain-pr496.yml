name: Guard qualify Brain PR496 explicit-recipe failclosed v2

on:
  pull_request:
    branches: [main]
    types: [opened]

permissions:
  contents: write

jobs:
  qualify:
    if: github.head_ref == 'qualify/brain-pr496-explicit-recipe-v2-20260930-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Non-spending syntax preflight
        run: |
          set -euo pipefail
          python -m py_compile \
            canonical/runtime/bound_capabilities/broad_objective_decompose.py \
            canonical/runtime/bound_capabilities/plain_goal_bound_grounding.py \
            canonical/tests/test_broad_objective_semantic_decomposition.py \
            qualification/pr496/independent_oracle.py

      - name: Atomically admit exact qualification
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p _terminal
          python execution_guard/github_actions_guarded_run_live.py \
            --plan qualification/pr496/guarded_plan.json \
            --receipt _terminal/execution-guard-launch-receipt.json \
            2>&1 | tee _terminal/qualification.log

      - name: Preserve qualification evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p _terminal/snapshot
          cp qualification/pr496/guarded_plan.json _terminal/snapshot/
          cp qualification/pr496/authorization.json _terminal/snapshot/
          cp qualification/pr496/independent_oracle.py _terminal/snapshot/
          cp canonical/runtime/bound_capabilities/broad_objective_decompose.py _terminal/snapshot/
          cp canonical/runtime/bound_capabilities/plain_goal_bound_grounding.py _terminal/snapshot/
          cp canonical/tests/test_broad_objective_semantic_decomposition.py _terminal/snapshot/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: brain-pr496-exact-guarded-qualification
          path: _terminal/
          if-no-files-found: error
