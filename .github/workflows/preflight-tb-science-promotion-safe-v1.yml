name: Preflight TB-Science promotion-safe execution
on:
  push:
    branches: [main, "tb-science-promotion-preflight-20261003-v1"]
    paths:
      - ".github/workflows/preflight-tb-science-promotion-safe-v1.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/preflight-tb-science-promotion-safe-v1.yml"
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Freeze exact TB-Science v0.1.0 metadata-only population
        run: |
          set -euo pipefail
          git clone -q https://github.com/harbor-framework/terminal-bench-science.git /tmp/tbs
          cd /tmp/tbs
          git checkout -q f81afac4f11048e77a15dfc8fb1dbfb897fea0ce
          test "$(git hash-object tasks/dataset.toml)" = "b506a7777d2dd5ae3e70c590366ceac4ee59ae28"
          test "$(git hash-object CONTRIBUTING.md)" = "18db4573bdb1d21dd512dfeaaec9ac43cb00a8fe"
          test "$(git hash-object TASK_REVIEW_AUTOMATION.md)" = "591cb5733df434f8c27759ac960d83624b316d15"
          python - <<'PY'
          import json, pathlib, tomllib
          root=pathlib.Path("/tmp/tbs")
          dataset=tomllib.loads((root/"tasks/dataset.toml").read_text())
          listed=dataset.get("tasks",[])
          assert len(listed)==70, len(listed)
          manifests=list(root.glob("tasks/*/*/*/task.toml"))
          assert len(manifests)==70, len(manifests)
          by_name={}
          rows=[]
          for p in manifests:
              d=tomllib.loads(p.read_text())
              name=d["task"]["name"]
              env=d.get("environment",{})
              row={
                  "name":name,
                  "path":str(p.relative_to(root)),
                  "cpus":float(env.get("cpus",1)),
                  "memory_mb":int(env.get("memory_mb",2048)),
                  "storage_mb":int(env.get("storage_mb",10240)),
                  "gpus":int(env.get("gpus",0)),
                  "gpu_types":env.get("gpu_types",[]),
                  "validate_env":str(env.get("validate_env","docker")),
                  "agent_timeout_sec":float(d.get("agent",{}).get("timeout_sec",1800)),
                  "verifier_timeout_sec":float(d.get("verifier",{}).get("timeout_sec",120)),
                  "build_timeout_sec":float(env.get("build_timeout_sec",600)),
              }
              by_name[name]=row
              rows.append(row)
          listed_names={x["name"] for x in listed}
          assert listed_names==set(by_name), (sorted(listed_names-set(by_name))[:5],sorted(set(by_name)-listed_names)[:5])
          # GitHub standard public ubuntu-24.04: 4 CPU, 16 GB RAM, 14 GB SSD.
          # GitHub-hosted job execution ceiling: 6 hours. We fail closed on any
          # task whose declared envelope cannot fit those published limits.
          GH_CPU=4
          GH_MEMORY_MB=16384
          GH_STORAGE_MB=14000
          GH_JOB_SECONDS=21600
          for r in rows:
              r["declared_max_job_seconds"]=r["build_timeout_sec"]+r["agent_timeout_sec"]+r["verifier_timeout_sec"]
              reasons=[]
              if r["gpus"]>0: reasons.append("GPU_REQUIRED")
              if r["cpus"]>GH_CPU: reasons.append("CPU_GT_4")
              if r["memory_mb"]>GH_MEMORY_MB: reasons.append("MEMORY_GT_16GB")
              if r["storage_mb"]>GH_STORAGE_MB: reasons.append("STORAGE_GT_14GB")
              if r["validate_env"].lower()!="docker": reasons.append("NON_DOCKER_VALIDATE_ENV")
              if r["declared_max_job_seconds"]>GH_JOB_SECONDS: reasons.append("DECLARED_JOB_ENVELOPE_GT_6H")
              r["standard_public_runner_incompatibility_reasons"]=reasons
          explicit_incompat=[r for r in rows if r["standard_public_runner_incompatibility_reasons"]]
          out={
              "schema":"PROJECT_BRAIN_TB_SCIENCE_METADATA_CARRIER_CUT_V1",
              "source_commit":"f81afac4f11048e77a15dfc8fb1dbfb897fea0ce",
              "dataset_manifest_blob":"b506a7777d2dd5ae3e70c590366ceac4ee59ae28",
              "task_count":len(rows),
              "all_dataset_entries_have_task_manifest":True,
              "explicit_standard_runner_incompatibility_count":len(explicit_incompat),
              "explicit_standard_runner_incompatibilities":explicit_incompat,
              "max_cpus":max(r["cpus"] for r in rows),
              "max_memory_mb":max(r["memory_mb"] for r in rows),
              "max_storage_mb":max(r["storage_mb"] for r in rows),
              "runner_limit_source":"GITHUB_DOCS_STANDARD_PUBLIC_UBUNTU_24_04_AND_JOB_LIMITS__4CPU_16GB_14GB_SSD_6H",
              "runner_limits":{"cpus":GH_CPU,"memory_mb":GH_MEMORY_MB,"storage_mb":GH_STORAGE_MB,"job_seconds":GH_JOB_SECONDS},
              "max_agent_timeout_sec":max(r["agent_timeout_sec"] for r in rows),
              "max_verifier_timeout_sec":max(r["verifier_timeout_sec"] for r in rows),
              "max_build_timeout_sec":max(r["build_timeout_sec"] for r in rows),
              "max_declared_job_seconds":max(r["declared_max_job_seconds"] for r in rows),
              "task_instruction_files_read":0,
              "solution_files_read":0,
              "terminal_trials_executed":0,
          }
          pathlib.Path("/tmp/tb-science-metadata-cut.json").write_text(json.dumps(out,sort_keys=True,indent=2)+"\n")
          print(json.dumps(out,sort_keys=True))
          PY
      - name: Verify frozen binary reward semantics without task instructions
        run: |
          set -euo pipefail
          cd /tmp/tbs
          grep -Fq 'Your verifier must write a binary reward' CONTRIBUTING.md
          grep -Fq 'Harbor scores a trial as passed at `reward >= 1.0`' CONTRIBUTING.md
          grep -Fq 'check-binary-reward' TASK_REVIEW_AUTOMATION.md
          python - <<'PY'
          import json
          print(json.dumps({
            "schema":"PROJECT_BRAIN_TB_SCIENCE_SCORER_SEMANTICS_CUT_V1",
            "binary_reward":"EXACT_0_OR_1",
            "trial_pass_condition":"reward >= 1.0",
            "source_commit":"f81afac4f11048e77a15dfc8fb1dbfb897fea0ce",
            "task_instruction_files_read":0,
            "terminal_trials_executed":0
          },sort_keys=True))
          PY
      - name: Preflight repaired Brain controller against live zero-spend planner on synthetic contracts only
        run: |
          set -euo pipefail
          C=capsules/tb_science_deterministic_terminalization_v1/harbor_science_agent_v1.py
          test "$(git hash-object "$C")" = "8627b0a0a886ed4df60d5839370b4bb2b4e76f1a"
          python - <<'PY'
          import asyncio, importlib.util, json, pathlib, sys, time, types, urllib.request

          # Load the exact repaired Brain controller while stubbing only its transport dependencies.
          canonical=types.ModuleType("canonical")
          runtime=types.ModuleType("canonical.runtime")
          astra=types.ModuleType("canonical.runtime.astra_runtime")
          policy=types.ModuleType("canonical.runtime.harbor_command_policy")
          transport=types.ModuleType("canonical.runtime.harbor_environment_transport")
          def safe_command(v):
              if not isinstance(v,str) or not v.strip():
                  raise ValueError("BAD_COMMAND")
              return v.strip()
          policy.validate_environment_command=safe_command
          class FakeTransport:
              def __init__(self, env):
                  self.env=env
              async def exec(self, command, timeout_sec=None, **kwargs):
                  return await self.env.exec(command, timeout_sec=timeout_sec, **kwargs)
          transport.HarborEnvironmentTransport=FakeTransport
          runtime.astra_runtime=astra
          sys.modules["canonical"]=canonical
          sys.modules["canonical.runtime"]=runtime
          sys.modules["canonical.runtime.astra_runtime"]=astra
          sys.modules["canonical.runtime.harbor_command_policy"]=policy
          sys.modules["canonical.runtime.harbor_environment_transport"]=transport
          spec=importlib.util.spec_from_file_location(
              "tb_science_repaired",
              "capsules/tb_science_deterministic_terminalization_v1/harbor_science_agent_v1.py",
          )
          mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)

          # Pure fail-closed alias checks.
          alias_obj={
              "material_requirements":["R1"],
              "candidate_actions":[{"action_id":"A1","covers":["R1"],"command":"printf ok","verify_command":"test 1 -eq 1"}],
          }
          req,cands,summary=mod._extract_contract(alias_obj,None)
          assert req==["R1"] and cands[0]["action_id"]=="A1" and summary is None

          both_same=dict(alias_obj)
          both_same["candidates"]=alias_obj["candidate_actions"]
          req,cands,_=mod._extract_contract(both_same,None)
          assert cands[0]["action_id"]=="A1"

          conflict=dict(alias_obj)
          conflict["candidates"]=[{"action_id":"B1","covers":["R1"],"command":"printf no","verify_command":"test 1 -eq 1"}]
          try:
              mod._extract_contract(conflict,None)
          except RuntimeError as e:
              assert "SCIENCE_CANDIDATE_ALIAS_CONFLICT" in str(e)
          else:
              raise AssertionError("CONFLICT_DID_NOT_FAIL_CLOSED")

          endpoint="https://text.pollinations.ai/"
          prompt=(
            'Return one JSON object only with material_requirements ["R1"] and exactly one '
            'candidate action {"action_id":"A1","covers":["R1"],"command":"printf ok",'
            '"verify_command":"test 1 -eq 1"}. No prose.'
          )
          results=[]
          for i in range(6):
              model="openai-fast"
              body=json.dumps({"messages":[{"role":"user","content":prompt}],"model":model,"jsonMode":True}).encode()
              req=urllib.request.Request(endpoint,data=body,headers={"Content-Type":"application/json","User-Agent":"ProjectBrain-TBScience-Preflight/2"},method="POST")
              t=time.monotonic()
              with urllib.request.urlopen(req,timeout=20) as resp:
                  raw=resp.read(30000).decode("utf-8","replace")
              a=raw.find("{"); b=raw.rfind("}")
              obj=json.loads(raw[a:b+1])
              frozen,cands,finish=mod._extract_contract(obj,None)
              assert frozen==["R1"], obj
              assert len(cands)==1 and cands[0]["action_id"]=="A1", obj
              assert cands[0]["covers"]==["R1"], obj
              results.append({"attempt":i+1,"ok":True,"model_alias":model,"latency_s":round(time.monotonic()-t,3),"observed_candidate_key":"candidates" if "candidates" in obj else "candidate_actions" if "candidate_actions" in obj else "none"})
          # Verify deterministic Brain-owned terminalization independently of the
          # live planner transport. A premature substrate finish request must not
          # suppress an admissible action, and no second planner turn is allowed.
          class Receipt:
              def __init__(self, returncode=0, stdout="", stderr=""):
                  self.returncode=returncode; self.stdout=stdout; self.stderr=stderr
          class Env:
              def __init__(self): self.commands=[]
              async def exec(self, command, timeout_sec=None, **kwargs):
                  self.commands.append(command)
                  return Receipt(0,"ok","")
          astra._extract_json_object=lambda text: json.loads(text)
          calls={"n":0}
          def deterministic_planner(prompt, timeout_s=20):
              calls["n"]+=1
              if calls["n"]>1:
                  raise AssertionError("SECOND_PLANNER_TURN_FORBIDDEN_AFTER_VERIFIED_COVERAGE")
              return {
                  "text":json.dumps({
                      "material_requirements":["R1"],
                      "candidate_actions":[
                          {"action_id":"A1","covers":["R1"],"command":"printf ok","verify_command":"test 1 -eq 1"}
                      ],
                      "finish_summary":"premature-substrate-finish"
                  }),
                  "model":"synthetic-fixed-substrate"
              }
          astra._planner_post=deterministic_planner
          env=Env()
          terminal=asyncio.run(mod.run_science_goal("synthetic goal",env,max_cycles=2))
          assert terminal["status"]=="FINISHED", terminal
          assert terminal["finish_authority"]=="BRAIN_VERIFIED_STATE", terminal
          assert terminal["model_has_terminal_authority"] is False, terminal
          assert terminal["cycles"]==1, terminal
          assert terminal["resolved_requirements"]==["R1"], terminal
          assert terminal["summary"]!="premature-substrate-finish", terminal
          assert calls["n"]==1, calls
          assert env.commands==["printf ok","test 1 -eq 1"], env.commands
          assert terminal["trace"][0]["kind"]=="FINISH_REJECTED", terminal["trace"]

          out={
            "schema":"PROJECT_BRAIN_TB_SCIENCE_DETERMINISTIC_TERMINALIZATION_PREFLIGHT_V1",
            "controller_blob":"8627b0a0a886ed4df60d5839370b4bb2b4e76f1a",
            "endpoint":endpoint,
            "model_alias":"openai-fast",
            "synthetic_attempts":len(results),
            "synthetic_contract_passes":len(results),
            "all_pass":len(results)==6,
            "alias_conflict_fail_closed":True,
            "brain_deterministic_terminalization_pass":True,
            "planner_turns_after_verified_coverage":0,
            "terminal_task_content_read":0,
            "terminal_trials_executed":0,
            "incremental_spend_usd":0,
            "results":results,
          }
          print(json.dumps(out,sort_keys=True))
          PY
      - name: Freeze conservative 70x3 acceptance arithmetic
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, math
          tasks=70; trials_per_task=3; n=tasks*trials_per_task; bar=0.587
          required=math.ceil(bar*n)
          fail_lock=n-required+1
          assert required==124 and fail_lock==87
          print(json.dumps({
            "schema":"PROJECT_BRAIN_TB_SCIENCE_THRESHOLD_ARITHMETIC_V1",
            "tasks":tasks,
            "trials_per_task":trials_per_task,
            "trial_slots":n,
            "frozen_bar_percent":58.7,
            "required_successes":required,
            "irreversible_fail_failures":fail_lock,
            "raw_rate_at_required_successes":required/n,
            "raw_rate_one_success_below":(required-1)/n,
            "early_stop_pass":"successes>=124",
            "early_stop_fail":"failures>=87",
            "terminal_trials_executed":0
          },sort_keys=True))
          PY

# trigger-v1: no semantic change

# main-trigger-v1: no semantic change

# observable-pr-trigger-v2: no semantic change

# deterministic-terminalization-verifier-v1: exact Brain blob 8627b0a0a886ed4df60d5839370b4bb2b4e76f1a
