name: Verify Brain Root2 Frontier V3 effective activation

on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/root2_frontier_v3_effective_activation/**"
      - ".github/workflows/verify-brain-root2-frontier-v3-effective-activation.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify Root2 V3 effective activation
        run: python capsules/root2_frontier_v3_effective_activation/verify_activation.py
