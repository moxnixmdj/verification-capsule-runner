name: Verify Typed Scalar SymPy Child
on:
  push:
    branches:
      - verify/typed-scalar-sympy-v1-20260930
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact candidate bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object canonical/runtime/astra_runtime.py)" = "85642a89a0d99c5e6cafa2e116ffdc24f04de32c"
          test "$(git hash-object canonical/runtime/goal_compiler.py)" = "39a9b2e64c4b41b37af330d5dff5c0846ff9c483"
          test "$(git hash-object canonical/runtime/BOUND_CAPABILITY_REGISTRY_V1.json)" = "0b52f097867732e858ec5cd2a8946cb506ce8fca"
          test "$(git hash-object canonical/runtime/bound_capabilities/numeric_expression_sympy.py)" = "6a48cbf92c76dc8ee0672667f997ea4f89936f06"
          test "$(git hash-object canonical/tests/test_typed_scalar_numeric_expression.py)" = "3641d4897c53aa2db39164f90b00f3a38b64264a"
      - name: Run compiler regressions
        shell: bash
        run: |
          set -euo pipefail
          python canonical/tests/test_typed_scalar_numeric_expression.py
          python canonical/tests/test_numeric_relation_jq_reuse.py
      - name: Execute fresh non-astronomy live expression
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util,json,math,pathlib,sys,urllib.request
          root=pathlib.Path(".").resolve()
          rp=root/"canonical/runtime/astra_runtime.py"
          spec=importlib.util.spec_from_file_location("typed_scalar_sympy_runtime",rp)
          runtime=importlib.util.module_from_spec(spec)
          sys.modules[spec.name]=runtime
          spec.loader.exec_module(runtime)

          url="https://api.github.com/repos/pallets/click"
          goal=(
            f"Using the authoritative JSON source {url}, extract JSON path stargazers_count as stars "
            "and save the knowledge evidence to canonical/astra_runtime/tmp/TYPED_SYMPY_STARS.json. "
            f"Using the authoritative JSON source {url}, extract JSON path forks_count as forks "
            "and save the knowledge evidence to canonical/astra_runtime/tmp/TYPED_SYMPY_FORKS.json. "
            "Calculate repository score using score = stars * (forks ** 0.5). "
            "Determine whether score and stars differ by at most 100000."
          )
          mission={"mission_id":"TYPED-SCALAR-SYMPY-FRESH-GITHUB-001","goal":goal}
          step={"adapter":"goal","goal_ref":"goal","verified_initial_facts":["network.http.available"],"max_controller_actions":12}
          result=runtime.run_goal(step,mission)
          assert result.get("controller_mode")=="MODEL_INDEPENDENT_ACTION_PLAN",result
          assert result.get("planner_model_last") is None,result
          assert result.get("model_dependency_count")==0,result

          trace=result.get("trace") or []
          numeric=[
            x["result"] for x in trace
            if isinstance(x,dict) and isinstance(x.get("result"),dict)
            and x["result"].get("capability_id")=="numeric.expression.sympy.typed"
          ]
          assert len(numeric)==1,numeric
          num=numeric[0]
          assert num["verified"] is True
          assert num["sympy_version"]=="1.14.0"
          assert num["variable_names"]==["forks","stars"]
          jq=[
            x["result"] for x in trace
            if isinstance(x,dict) and isinstance(x.get("result"),dict)
            and x["result"].get("capability_id")=="json.query.jq"
          ]
          assert len(jq)==1,jq
          relation=json.loads(pathlib.Path(jq[0]["output_path"]).read_text())

          req=urllib.request.Request(url,headers={"User-Agent":"ProjectBrain-TypedScalar-Independent/1","Accept":"application/vnd.github+json"})
          with urllib.request.urlopen(req,timeout=30) as r:
            live=json.loads(r.read().decode("utf-8"))
          stars=float(live["stargazers_count"])
          forks=float(live["forks_count"])
          expected=stars*math.sqrt(forks)
          assert math.isclose(float(num["value"]),expected,rel_tol=1e-12,abs_tol=1e-9),(num,expected)
          expected_delta=abs(expected-stars)
          assert math.isclose(float(relation["absolute_difference"]),expected_delta,rel_tol=1e-12,abs_tol=1e-9),relation
          assert bool(relation["predicate"])==(expected_delta<=100000),relation

          report={
            "schema":"PROJECT_BRAIN_TYPED_SCALAR_SYMPY_FRESH_QUALIFICATION_V1",
            "domain":"SOFTWARE_REPOSITORY_LIVE_METADATA",
            "source_url":url,
            "expression":"stars * (forks ** 0.5)",
            "producer_value":num["value"],
            "independent_value":expected,
            "relation":relation,
            "independent_relation_predicate":expected_delta<=100000,
            "model_dependency_count":0,
            "incremental_spend_usd":0,
            "sympy_version":num["sympy_version"],
            "verified":True,
          }
          pathlib.Path("TYPED_SCALAR_SYMPY_FRESH_QUALIFICATION.json").write_text(
            json.dumps(report,indent=2,sort_keys=True)+"\n",encoding="utf-8"
          )
          PY
      - name: Adversarial adapter rejection cases
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util,pathlib
          root=pathlib.Path(".").resolve()
          p=root/"canonical/runtime/bound_capabilities/numeric_expression_sympy.py"
          spec=importlib.util.spec_from_file_location("typed_numeric_adapter_reject",p)
          m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          cases=[
            ({"expression":"sqrt(x)","variables":{"x":4}},"SYNTAX_REJECTED"),
            ({"expression":"x.real","variables":{"x":4}},"SYNTAX_REJECTED"),
            ({"expression":"x[0]","variables":{"x":4}},"SYNTAX_REJECTED"),
            ({"expression":"1/0","variables":{}},"DIVISION_BY_ZERO"),
            ({"expression":"x ** 101","variables":{"x":2}},"EXPONENT_OUT_OF_BOUNDS"),
            ({"expression":"x+y","variables":{"x":2}},"UNKNOWN_VARIABLE:y"),
            ({"expression":"x+1","variables":{"x":True}},"BOOL_REJECTED:x"),
          ]
          for args,needle in cases:
            try:
              m.run(args,root)
            except Exception as exc:
              assert needle in str(exc),(args,exc)
            else:
              raise AssertionError(("REJECTION_CASE_UNEXPECTEDLY_PASSED",args))
          print("ALL_ADVERSARIAL_REJECTIONS_PASS")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: typed-scalar-sympy-fresh-qualification
          path: TYPED_SCALAR_SYMPY_FRESH_QUALIFICATION.json
