name: Verify Brain Composition slice V6
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/composition_slice_v6/**"
      - ".github/workflows/verify-brain-composition-slice-v6.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact Brain blob identities
        run: |
          cd capsules/composition_slice_v6
          python - <<'PY'
          import hashlib,json,pathlib
          m=json.load(open("EXPECTED_BRAIN_BLOBS.json",encoding="utf-8"))
          for src,expected in m["exact_brain_blobs"].items():
              raw=pathlib.Path(src).read_bytes()
              got=hashlib.sha1(f"blob {len(raw)}\0".encode()+raw).hexdigest()
              assert got==expected,(src,got,expected)
          print("exact Brain blobs PASS",len(m["exact_brain_blobs"]))
          PY
      - name: Run exact V6 slicer test
        run: |
          cd capsules/composition_slice_v6
          export PYTHONPATH=.
          python canonical/tests/test_composition_component_proof_slice_v6.py
      - name: Independent receipt and projection assertions
        run: |
          cd capsules/composition_slice_v6
          export PYTHONPATH=.
          python - <<'PY'
          import json
          from canonical.runtime.composition_component_proof_slicer_v1 import evaluate
          inp=json.load(open("canonical/governance/COMPOSITION_COMPONENT_PROOF_SLICE_INPUT_V6.json"))
          out=evaluate(inp)
          assert len(inp["receipts"])==4,inp
          ids={x["receipt_id"] for x in inp["receipts"]}
          assert "COMPOSITION_BRIDGE::TOOL_ROUTE_DISCOVERY_AND_SELECTION_001::tool_discovery" not in ids,ids
          proved=sorted(x["component_id"] for x in out["interfaces"] if x["state"]=="SCOPED_PROVED")
          assert proved==["delegation","memory","recovery","tool discovery"],proved
          assert sum(x["state"]=="OPEN" for x in out["interfaces"])==8,out
          assert out["all_used_component_interfaces_scoped_proved"] is False,out
          for p in inp["receipt_verifications"]:
              v=json.load(open(p))
              assert str(v["status"]).startswith("INDEPENDENT_PUBLIC_RUNNER_PASS"),(p,v["status"])
          print("composition V6 four-current-receipt projection PASS")
          PY
