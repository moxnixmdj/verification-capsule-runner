name: Verify shadow reality lease v1

on:
  pull_request:
    paths:
      - 'verify_shadow_reality_lease_20261004.py'
      - 'subject/lease_v1_20261004/**'
      - '.github/workflows/verify-shadow-reality-lease-20261004.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run independent verifier
        run: python verify_shadow_reality_lease_20261004.py
