name: Verify Root2 frontier V4 truth repair
on:
  pull_request:
    paths:
      - "subject/**"
      - "verify_root2_frontier_v4_truth_repair.py"
      - ".github/workflows/verify-root2-frontier-v4-truth-repair.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python verify_root2_frontier_v4_truth_repair.py
