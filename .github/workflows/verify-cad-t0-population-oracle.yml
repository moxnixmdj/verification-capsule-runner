name: Verify CAD T0 population and native oracle
on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/runtime/cad_t0_geometry_population.py'
      - 'canonical/runtime/cad_t0_oracle_adapter.py'
      - 'canonical/runtime/m1b_smooth_surface_compiler.py'
      - 'canonical/runtime/m1b_continuous_geometry_compiler.py'
      - 'canonical/runtime/cad_partspec.py'
      - 'canonical/runtime/cad_partspec_generator.py'
      - 'canonical/tests/test_cad_t0_geometry_population_and_oracle.py'
      - 'test_cad_t0_native_reference_oracle.py'
      - '.github/workflows/verify-cad-t0-population-oracle.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Bind exact Brain blobs
        run: |
          set -euo pipefail
          test "$(git hash-object canonical/runtime/cad_t0_geometry_population.py)" = "64ca276410e2c1dbcd55cfad057e3eec0709790a"
          test "$(git hash-object canonical/runtime/cad_t0_oracle_adapter.py)" = "a6e76e1865b9bd9829dbbcf38886486636f76e8a"
          test "$(git hash-object canonical/runtime/m1b_smooth_surface_compiler.py)" = "bd3824847f400e8088dc25a83674579f99345a30"
          test "$(git hash-object canonical/runtime/m1b_continuous_geometry_compiler.py)" = "0c7c6355cde87c961319d6f9948839cb56add092"
          test "$(git hash-object canonical/runtime/cad_partspec.py)" = "e5b68367cbaaeedb97c6eb8f2d080f19e3a2cdbb"
          test "$(git hash-object canonical/runtime/cad_partspec_generator.py)" = "89b4250fa85df8d02d51bcb513f035d102625056"
          test "$(git hash-object canonical/tests/test_cad_t0_geometry_population_and_oracle.py)" = "ea98ceda53c8e4a09d72b19bcb4aaaf5874098a5"
      - name: Install frozen CAD kernel
        run: python -m pip install --disable-pip-version-check --no-input "pydantic>=2,<3" "cadquery==2.6.1"
      - name: Compile exact glue
        run: python -m py_compile canonical/runtime/cad_t0_geometry_population.py canonical/runtime/cad_t0_oracle_adapter.py
      - name: Run Brain glue tests
        run: PYTHONPATH=canonical/runtime:. python -m unittest -v canonical.tests.test_cad_t0_geometry_population_and_oracle
      - name: Run native reference-oracle composition test
        run: PYTHONPATH=canonical/runtime:. python -m unittest -v test_cad_t0_native_reference_oracle.py
