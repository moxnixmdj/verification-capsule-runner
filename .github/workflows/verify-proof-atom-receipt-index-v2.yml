name: Verify proof atom receipt index v2
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/proof_atom_receipt_index_v2/**"
      - ".github/workflows/verify-proof-atom-receipt-index-v2.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact Brain V2 receipt-index blobs and behavior
        run: python capsules/proof_atom_receipt_index_v2/verify.py
