name: Verify Root2 19-predicate reactivation
on:
  pull_request:
    paths:
      - "subject/root2_19_reactivation_20261004_sol/**"
      - "verify_root2_19_reactivation_projection.py"
      - ".github/workflows/verify-root2-19-reactivation-projection.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python verify_root2_19_reactivation_projection.py
