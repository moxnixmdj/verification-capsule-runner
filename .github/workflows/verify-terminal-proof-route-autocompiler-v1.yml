name: Verify terminal proof route autocompiler v1
on:
  pull_request:
    branches: [main]
    paths:
      - 'capsules/terminal_proof_route_autocompiler/**'
      - '.github/workflows/verify-terminal-proof-route-autocompiler-v1.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact Brain capsule identities
        working-directory: capsules/terminal_proof_route_autocompiler
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object canonical/runtime/terminal_proof_route_autocompiler.py)" = "2eea4d81bc5444f8f7e055cbbbd0cd8edf5a5dcf"
          test "$(git hash-object canonical/tests/test_terminal_proof_route_autocompiler.py)" = "d7e664a1e01177874c8014250938cf33434e0ae7"
          test "$(git hash-object canonical/governance/TERMINAL_PROOF_ROUTE_AUTOCOMPILER_ACTIVATION_V1.json)" = "dd085590298709b02b6ec9e898de4af0644639c5"
          test "$(git hash-object canonical/governance/OBJECTIVE_ORACLE_DOMINANCE_LIVE_INPUT_V1.json)" = "9efaad8a74b7126938d60d0f2ede3820a71741fa"
      - name: Run fail-closed regression tests
        working-directory: capsules/terminal_proof_route_autocompiler
        run: PYTHONPATH=. python -m unittest -v canonical.tests.test_terminal_proof_route_autocompiler
      - name: Compile current zero-reality route plan
        working-directory: capsules/terminal_proof_route_autocompiler
        run: PYTHONPATH=. python canonical/runtime/terminal_proof_route_autocompiler.py canonical/governance/OBJECTIVE_ORACLE_DOMINANCE_LIVE_INPUT_V1.json
