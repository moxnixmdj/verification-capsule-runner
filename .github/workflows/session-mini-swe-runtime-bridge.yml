name: Session mini-SWE runtime bridge

on:
  pull_request:
    branches: [main]
    types: [opened]

permissions:
  contents: write

jobs:
  bridge:
    if: startsWith(github.head_ref, 'bridge/session-mini-swe-')
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout exact session head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Run isolated runtime bridge
        env:
          GITHUB_HEAD_REF: ${{ github.head_ref }}
        run: python session_bridge/controller.py --session-config session_bridge/session.json

      - name: Upload terminal evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: session-mini-swe-${{ github.event.pull_request.number }}
          path: /tmp/bridge-evidence/
          if-no-files-found: warn
