name: Verify verified binding overlay activation v1
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/verified_binding_overlay_activation_v1/**"
      - ".github/workflows/verify-verified-binding-overlay-activation-v1.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact activation transaction
        run: |
          cd capsules/verified_binding_overlay_activation_v1
          export PYTHONPATH=.
          python canonical/tests/test_verified_witness_target_overlay_activation_v1.py
          python independent_verify.py
