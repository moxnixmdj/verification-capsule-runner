name: Verify Retrieval V6 live gate full
on:
  push:
    branches:
      - verify/retrieval-v6-live-gate-full-20261003
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: PYTHONPATH=v6root python -m unittest discover -s v6root/canonical/tests -p 'test_*v6*.py' -v
      - run: PYTHONPATH=v6root python -m unittest v6root.canonical.tests.test_tool_discovery_retrieval_authority_gate_v2 -v
      - run: PYTHONPATH=v6root python v6root/canonical/runtime/tool_discovery_retrieval_authority_gate_v2.py
