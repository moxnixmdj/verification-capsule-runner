name: Verify LiveBench V9 formal-routing replay wrapper
on:
  push:
    branches:
      - verify/livebench-formal-routing-v2-20261004
    paths:
      - ".github/workflows/verify-livebench-v9-formal-routing.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: verify/livebench-formal-routing-v2-20261004
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.14"
      - run: python verify_livebench_v9_formal_routing.py
