name: Verify LiveBench Root1 Qwen3.8 4B Semantic Seed
on:
  pull_request:
    branches: [main]
    paths:
      - verify_livebench_root1_qwen38_4b_semantic_seed.py
      - .github/workflows/verify-livebench-root1-qwen38-4b-semantic-seed.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Freeze runner resource state
        run: |
          uname -a
          nproc
          free -h
          df -h .
      - name: Build pinned llama.cpp server
        run: |
          git clone https://github.com/ggml-org/llama.cpp.git /tmp/llama.cpp
          cd /tmp/llama.cpp
          git checkout 0504396140d1c882f5f6ee34466a42db7ae90114
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF
          cmake --build build --config Release -j 4 --target llama-server
          /tmp/llama.cpp/build/bin/llama-server --version
      - name: Download exact precommitted model subject
        run: |
          curl -L --fail --retry 4 --retry-delay 5 \
            -o /tmp/Qwen3.8-4B-Q4_K_M.gguf \
            "https://huggingface.co/empero-ai/Qwen3.8-4B-Distill-GGUF/resolve/391fc7d103e3942a408def3e4f51c2f85d464417/Qwen3.8-4B-Q4_K_M.gguf?download=true"
          test "$(stat -c %s /tmp/Qwen3.8-4B-Q4_K_M.gguf)" = "2783446304"
          echo "dec96e8cf2e11b613bb46513dec485377f9ca5a351e71712ee0e244f287c6790  /tmp/Qwen3.8-4B-Q4_K_M.gguf" | sha256sum -c -
      - name: Run one-shot frozen semantic-seed qualification
        run: |
          python3 verify_livebench_root1_qwen38_4b_semantic_seed.py \
            --model /tmp/Qwen3.8-4B-Q4_K_M.gguf \
            --server /tmp/llama.cpp/build/bin/llama-server
      - name: Upload receipt and server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livebench-root1-qwen38-4b-semantic-seed-receipt
          path: |
            livebench_root1_qwen38_4b_semantic_seed_receipt.json
            llama_server_semantic_seed.log
          if-no-files-found: warn
