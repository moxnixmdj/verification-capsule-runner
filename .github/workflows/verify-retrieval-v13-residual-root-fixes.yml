name: Verify Retrieval V13 residual-root fixes
on:
  push:
    branches:
      - verify/retrieval-v13-residual-root-fixes-20261004
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact subject blobs
        run: |
          test "$(git hash-object canonical/runtime/retrieval_live_provider_arena_v13.py)" = "d36f5f29060db6ad5db5f44b16751099f54873ca"
          test "$(git hash-object canonical/tests/test_retrieval_live_provider_arena_v13.py)" = "e66aa1720ced512549315a6c8f3783d925cef2d9"
          test "$(git hash-object canonical/runtime/retrieval_live_provider_arena_v11.py)" = "0e28128d3f67d33ce4058667609e4d513657af55"
          test "$(git hash-object canonical/runtime/retrieval_live_provider_arena_v1.py)" = "ae22852836f61dd0f9691bbd89dbb4680aefa917"
          test "$(git hash-object canonical/runtime/retrieval_live_provider_arena_v2.py)" = "8fb64595ba6c8872f6086d2c226758afb4b7e493"
      - name: Run deterministic tests
        run: PYTHONPATH=. python canonical/tests/test_retrieval_live_provider_arena_v13.py
      - name: Run live V13 residual-root arena
        run: |
          PYTHONPATH=. python canonical/runtime/retrieval_live_provider_arena_v13.py > v13_live.json
          python - <<'PY'
          import json
          x=json.load(open("v13_live.json",encoding="utf-8"))
          assert x["answer_key_identity_used_for_query_generation"] is False
          assert x["successful_case_count"] > 0
          assert x["recovered_count"] > 0
          assert x["v11_v12_v13_union_recall"] > x["prior_v11_v12_union_recall"]
          assert x["open_world_completeness_claim"] is False
          print("V13_SUMMARY",json.dumps({
            "residual_cases":x["residual_case_count"],
            "successful":x["successful_case_count"],
            "recovered":x["recovered_count"],
            "remaining":x["remaining_true_miss_count"],
            "retryable_failures":x["retryable_failure_count"],
            "prior_union_hits":x["prior_v11_v12_union_hits"],
            "prior_union_recall":x["prior_v11_v12_union_recall"],
            "union_hits":x["v11_v12_v13_union_hits"],
            "union_recall":x["v11_v12_v13_union_recall"],
            "recovered_ids":x["recovered_episode_ids"],
            "remaining_ids":x["remaining_miss_episode_ids"],
            "failed_ids":x["failed_episode_ids"],
          },sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: retrieval-v13-live-result
          path: v13_live.json
          if-no-files-found: error
