name: Verify stochastic outcome frontier countermodel V1

on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/outcome_frontier_stochastic_countermodel_v1/**"
      - ".github/workflows/verify-outcome-frontier-stochastic-countermodel-v1.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
      - run: python -m py_compile capsules/outcome_frontier_stochastic_countermodel_v1/countermodel.py capsules/outcome_frontier_stochastic_countermodel_v1/candidate_kernel.py capsules/outcome_frontier_stochastic_countermodel_v1/verify.py
      - run: python capsules/outcome_frontier_stochastic_countermodel_v1/verify.py
