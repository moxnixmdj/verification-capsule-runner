name: Verify Retrieval V6 open-world hardening
on:
  push:
    branches:
      - verify/retrieval-v6-open-world-hardening-20261003
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python verify_retrieval_v6_open_world_hardening.py
