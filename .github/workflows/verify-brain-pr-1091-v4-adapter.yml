name: Verify Brain PR 1091 V4 adapter
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/brain_pr_1091_v4_adapter/**"
      - ".github/workflows/verify-brain-pr-1091-v4-adapter.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact Brain blob identities
        run: |
          cd capsules/brain_pr_1091_v4_adapter
          python - <<'PY'
          import hashlib,json,pathlib
          m=json.load(open("EXPECTED_BRAIN_BLOBS.json"))
          for src,expected in m["exact_brain_blobs"].items():
              data=pathlib.Path(src).read_bytes()
              got=hashlib.sha1(f"blob {len(data)}\0".encode()+data).hexdigest()
              assert got==expected,(src,got,expected)
          print("exact Brain PR 1091 blobs: PASS")
          PY
      - name: Run adapter tests
        run: |
          cd capsules/brain_pr_1091_v4_adapter
          export PYTHONPATH=.
          python -m py_compile canonical/runtime/post_delegation_v4_index_adapter_v1.py
          python -m unittest canonical.tests.test_post_delegation_v4_index_adapter_v1 -v
      - name: Verify current projection
        run: |
          cd capsules/brain_pr_1091_v4_adapter
          export PYTHONPATH=.
          python - <<'PY'
          import json
          from canonical.runtime.post_delegation_v4_index_adapter_v1 import current_frontier_projection
          F=json.load(open("canonical/governance/TERMINAL_CERTIFICATE_FRONTIER_V5.json"))
          H=json.load(open("canonical/governance/OPUS55_ACCEPTANCE_ACTION_HYPERGRAPH_V2.json"))
          O=json.load(open("canonical/governance/PROOF_ATOM_REFINEMENT_OVERLAY_V1.json"))
          out=current_frontier_projection(F,H,O)
          assert out["status"].startswith("PASS")
          assert len(out["frontier_projection"]["unresolved_predicates"])==30
          assert out["proof_atom_basis"]["leaf_atom_count"]==39
          assert out["proof_atom_basis"]["exact_duplicate_savings"]==0
          props={x["proposition"] for x in out["proof_atom_basis"]["atoms"]}
          assert "INDEPENDENT_EXACT_COMPLETE_TARGET_CASE_UNIVERSE_OR_EXHAUSTIVE_FINITE_SUPERSET_OR_UNIVERSAL_FORMAL_SCOPE_PROOF_FOR_DELEGATION_PROTOCOL" not in props
          assert out["capability_credit_delta"]==0 and out["family_credit_delta"]==0
          print("39-atom post-delegation V4 adapter: PASS")
          PY
