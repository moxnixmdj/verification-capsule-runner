name: Verify acceptance fixed-point closure v1

on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/acceptance_fixed_point_v1/**"
      - ".github/workflows/verify-acceptance-fixed-point-v1.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify mirrored Brain closure engine
        run: |
          cd capsules/acceptance_fixed_point_v1
          export PYTHONPATH=.
          python -m py_compile canonical/runtime/acceptance_ir_compiler_v1.py
          python -m py_compile canonical/runtime/proof_fixed_point_saturator_v1.py
          python -m py_compile canonical/runtime/minimum_terminal_cut_solver_v1.py
          python canonical/tests/test_acceptance_ir_compiler_v1.py
          python canonical/tests/test_proof_fixed_point_saturator_v1.py
          python canonical/tests/test_minimum_terminal_cut_solver_v1.py
