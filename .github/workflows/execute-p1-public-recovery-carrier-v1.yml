name: Execute P1 public recovery carrier V1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/execute-p1-public-recovery-carrier-v1.yml"

permissions:
  contents: read

concurrency:
  group: p1-public-recovery-carrier-v1
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Enforce distinct first-attempt recovery carrier
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$GITHUB_REF" = "refs/heads/main"
          C=capsules/p1_one_use_authority_v1
          test "$(git hash-object "$C/canonical/governance/P1_SHARED_FAILURE_SEMANTICS_BATCH_FREEZE_V1.json")" = "6a4b606a759d5479bb5ddbdf29426b1a1808b007"
          test "$(git hash-object "$C/canonical/runtime/p1_shared_failure_semantics_batch_preflight_v1.py")" = "13c33adda55f58d1eac913e63daa7f6ae1eb6a63"
          test "$(git hash-object "$C/canonical/runtime/p1_shared_failure_semantics_batch_v1.py")" = "695cfe3f283723a52bafb6299236a2d0378dc79e"
          test "$(git hash-object "$C/canonical/runtime/p1_shared_failure_semantics_normalizer_v1.py")" = "b6ba06fc6a35fa132eb19389ee256e74a63a4849"
          test "$(git hash-object "$C/canonical/runtime/contract_native_proof_suites.py")" = "0210790c7dd705ef328e1b55d529a30c5c6c3337"
          test "$(git hash-object "$C/canonical/runtime/trajectory_failure_typed_ir_candidate_v7.py")" = "28940387bd6c11671035ad9201e37bba13fd9bc9"
          test "$(git hash-object "$C/canonical/runtime/trajectory_failure_typed_ir_proof_v6.py")" = "0f41a36e6ad16722ce05b180e036fb921a2ef886"
          test "$(git hash-object "$C/canonical/tests/test_p1_shared_failure_semantics_batch_v1.py")" = "7512a920c72d7bdeb2b072788e4c4bc8d2ff2d08"
          test "$(git hash-object "$C/canonical/tests/test_p1_shared_failure_semantics_batch_preflight_v1.py")" = "2b0b7a8b3fe7017e1be0fa85bed0f10b72802337"

      - name: Re-run spent preflight only
        run: |
          set -euo pipefail
          C="$GITHUB_WORKSPACE/capsules/p1_one_use_authority_v1"
          PYTHONPATH="$C" python -m unittest -v \
            canonical.tests.test_p1_shared_failure_semantics_batch_preflight_v1 \
            canonical.tests.test_p1_shared_failure_semantics_batch_v1
          PYTHONPATH="$C" python -m canonical.runtime.p1_shared_failure_semantics_batch_preflight_v1 > P1_SPENT_PREFLIGHT.json
          python - <<'PY'
          import json
          x=json.load(open("P1_SPENT_PREFLIGHT.json"))
          assert x["pass"] is True, x
          assert x["new_reality_units_consumed"]==0, x
          assert x["execution_authority"] is False, x
          assert x["promotion_authority"] is False, x
          PY

      - name: Consume exactly one authorized fresh P1 reality unit
        run: |
          set -euo pipefail
          C="$GITHUB_WORKSPACE/capsules/p1_one_use_authority_v1"
          BEACON="P1_PUBLIC_RECOVERY_CARRIER_V1;REPO=${GITHUB_REPOSITORY};RUN_ID=${GITHUB_RUN_ID};ATTEMPT=${GITHUB_RUN_ATTEMPT};HEAD=${GITHUB_SHA}"
          PYTHONPATH="$C" python -m canonical.runtime.p1_shared_failure_semantics_batch_v1 --beacon "$BEACON" > P1_RAW_BATCH_RESULT.json
          python - <<'PY'
          import json, os
          raw=json.load(open("P1_RAW_BATCH_RESULT.json"))
          assert raw["cases"]==192, raw
          assert raw["passes"]+raw["failures"]==192, raw
          assert raw["terminal_v3_replayed"]==0, raw
          assert raw["incremental_spend_usd"]==0, raw
          assert raw["fresh_reality_units_consumed"]==0, raw
          assert raw["reality_unit_candidate_if_separately_authorized_and_independently_adjudicated"]==1, raw
          out={
            "schema":"PROJECT_BRAIN_P1_PUBLIC_RECOVERY_CARRIER_EXECUTION_RESULT_V1",
            "status":"FINALIZED_EVIDENCE_ONLY__INDEPENDENT_POST_EXECUTION_ADJUDICATION_REQUIRED",
            "authorized_observation":"P1_SHARED_SOURCE_BOUND_FAILURE_SEMANTICS_BATCH",
            "carrier":"MOXNIXMDJ_VERIFICATION_CAPSULE_RUNNER_PUBLIC_GITHUB_ACTIONS",
            "prior_private_pre_case_failure_run_id":37106776756,
            "github_repository":os.environ["GITHUB_REPOSITORY"],
            "github_run_id":int(os.environ["GITHUB_RUN_ID"]),
            "github_run_attempt":int(os.environ["GITHUB_RUN_ATTEMPT"]),
            "github_head_sha":os.environ["GITHUB_SHA"],
            "execution_workflow_blob":os.popen("git hash-object .github/workflows/execute-p1-public-recovery-carrier-v1.yml").read().strip(),
            "beacon_sha256":raw["beacon_sha256"],
            "cases":raw["cases"],
            "passes":raw["passes"],
            "failures":raw["failures"],
            "wilson_95_lower_all":raw["wilson_95_lower_all"],
            "by_surface":raw["by_surface"],
            "fresh_reality_units_consumed":1,
            "terminal_v3_replayed":0,
            "incremental_spend_usd":0,
            "execution_authority_consumed":True,
            "rerun_credit":False,
            "capability_credit_delta":0,
            "family_credit_delta":0,
            "promotion_authority":False,
            "raw_result_path":"P1_RAW_BATCH_RESULT.json"
          }
          open("P1_PUBLIC_RECOVERY_AUTHORIZED_RESULT.json","w").write(json.dumps(out,indent=2,sort_keys=True)+"\n")
          PY

      - name: Preserve one-use public recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-public-recovery-carrier-v1
          path: |
            P1_SPENT_PREFLIGHT.json
            P1_RAW_BATCH_RESULT.json
            P1_PUBLIC_RECOVERY_AUTHORIZED_RESULT.json
          if-no-files-found: warn
