name: Verify Brain universal learning active router V2
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/universal_learning_active_router_v2/**"
      - ".github/workflows/verify-brain-universal-learning-active-router-v2.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile router and dependencies
        run: |
          cd capsules/universal_learning_active_router_v2
          python -m py_compile \
            canonical/runtime/universal_learning_contract_v1.py \
            canonical/runtime/universal_active_transfer_learner_v2.py \
            canonical/runtime/universal_learning_active_router_v2.py
      - name: Run copied Brain router tests
        run: |
          cd capsules/universal_learning_active_router_v2
          export PYTHONPATH=.
          python -m unittest canonical.tests.test_universal_learning_active_router_v2 -v
      - name: Run independent adversarial router verifier
        run: |
          cd capsules/universal_learning_active_router_v2
          export PYTHONPATH=.
          python verify_router.py
