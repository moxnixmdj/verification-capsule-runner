name: Verify terminal structural breakthrough V1

on:
  push:
    branches:
      - 'verify/terminal-structural-breakthrough-v1-20261004-sol'
  pull_request:
    paths:
      - 'capsules/terminal_structural_breakthrough_v1/**'
      - '.github/workflows/verify-terminal-structural-breakthrough-v1.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run independent verifier
        run: python capsules/terminal_structural_breakthrough_v1/verify.py
