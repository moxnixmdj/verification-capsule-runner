name: Discover Ubuntu 24.04 OpenCV dependency surface
on:
  pull_request:
    branches: [main]
    paths: [".github/workflows/discover-opencv-ubuntu2404.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Probe exact package and runtime surface
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          apt-cache policy python3-opencv libopencv-core406 | tee /tmp/policy.txt
          cd /tmp
          apt-get download python3-opencv libopencv-core406 >/tmp/download.log 2>&1
          sha256sum python3-opencv_*.deb libopencv-core406_*.deb | tee /tmp/archive_sha256.txt
          sudo apt-get install -y -qq python3-opencv >/tmp/install.log
          /usr/bin/python3 - <<'PY'
          import cv2, json, platform
          info={
            "cv2_version":cv2.__version__,
            "python":platform.python_version(),
            "build_information_head":cv2.getBuildInformation().splitlines()[:40],
          }
          print(json.dumps(info,indent=2,sort_keys=True))
          PY
          dpkg-query -W -f='${Package}=${Version}\n' python3-opencv libopencv-core406
