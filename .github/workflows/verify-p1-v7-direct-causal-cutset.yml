name: Verify P1 V7 direct causal cutset
on:
  pull_request:
    paths:
      - "capsules/p1_v7_direct_causal_cutset/**"
      - ".github/workflows/verify-p1-v7-direct-causal-cutset.yml"
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact Brain P1 V7 blobs
        run: python capsules/p1_v7_direct_causal_cutset/verify.py
