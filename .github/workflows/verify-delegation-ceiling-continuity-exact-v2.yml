name: Verify delegation ceiling continuity exact blobs v2
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/verify-delegation-ceiling-continuity-exact-v2.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact mirrored Brain blob identities and rerun proof
        env:
          EXPECTED_JSON: '{"canonical/runtime/terminal_ceiling_witness_lifter_v1.py":"10dadbe629f8e728b51bd0f5e5e8ec6e2cfabf6f","canonical/tests/test_terminal_ceiling_witness_lifter_v1.py":"74349d8be5cdc4378fefa106389d86d47df5c9da","canonical/tests/test_delegation_terminal_ceiling_continuity_v1.py":"3dc298ef9be699d6474aec7e34a92b897eb52af4","canonical/governance/DELEGATION_TERMINAL_CEILING_CONTINUITY_INPUT_V1.json":"d49f98744bf8b9da1f7cd8c82564c5407cbe78ce","canonical/governance/DELEGATION_T2_OBJECTIVE_TERMINAL_BINDING_V1.json":"a1e441567b132d71713ed55dfc51f01d8de112d1","canonical/governance/OPUS55_TERMINAL_PROOF_PROTOCOLS_V1.json":"eb4bca0fe6a015d49d2854998fbe046c979c7ea9","canonical/governance/BEHAVIORAL_CONTRACT_REGISTRY_V1.json":"ee187f611a0e82b2de495ee377682f39bc31dd31","canonical/governance/TERMINAL_ROUTE_SPECIFIC_EXECUTOR_MANIFEST_V1.json":"c61882d69a66f61b4ea1ce6ad14f86fcefd1f76a","canonical/governance/TOOL_DISCOVERY_T2_T3_OBJECTIVE_TERMINAL_BINDING_V1.json":"6bcabc0a7d0525532ce7b80e132278f7c99caa43","canonical/verification/CURRENT_OBJECTIVE_BINDINGS_PUBLIC_RUNNER_VERIFICATION_20261002_V2.json":"3aa8168fc7f81581eea4085504e4a70205949af9","canonical/verification/TERMINAL_V3_ONE_SHOT_WAVE_RESULT_20261002_V1.json":"bd86b4c53992b47a4a60b64a60ba03db9a442cfc"}'
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, subprocess, sys
          from pathlib import Path
          root=Path('capsules/delegation_ceiling_continuity_v1')
          expected=json.loads(os.environ['EXPECTED_JSON'])
          for rel,want in sorted(expected.items()):
              data=(root/rel).read_bytes()
              got=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              assert got==want,(rel,got,want)
          print('EXACT_11_OF_11_BRAIN_BLOBS_PASS')
          PY
          cd capsules/delegation_ceiling_continuity_v1
          PYTHONPATH=. python -m unittest -v \
            canonical.tests.test_terminal_ceiling_witness_lifter_v1 \
            canonical.tests.test_delegation_terminal_ceiling_continuity_v1
          PYTHONPATH=. python - <<'PY'
          import hashlib,json
          from pathlib import Path
          from canonical.runtime.terminal_ceiling_witness_lifter_v1 import evaluate
          root=Path('.')
          def load(p): return json.loads((root/p).read_text())
          def blob(p):
              d=(root/p).read_bytes()
              return hashlib.sha1(b'blob '+str(len(d)).encode()+b'\0'+d).hexdigest()
          spec=load('canonical/governance/DELEGATION_TERMINAL_CEILING_CONTINUITY_INPUT_V1.json')
          bp=spec['binding_path']; current=blob(bp)
          out=evaluate(
            family=spec['family'], behavior_id=spec['behavior_id'], binding_path=bp,
            protocols=load('canonical/governance/OPUS55_TERMINAL_PROOF_PROTOCOLS_V1.json'),
            registry=load('canonical/governance/BEHAVIORAL_CONTRACT_REGISTRY_V1.json'),
            binding=load(bp),
            executor_manifest=load('canonical/governance/TERMINAL_ROUTE_SPECIFIC_EXECUTOR_MANIFEST_V1.json'),
            terminal_result=load(spec['terminal_result']),
            binding_blob_sha=current,
            terminal_snapshot_binding_blob_sha=spec['terminal_snapshot']['binding_blob_sha'],
            binding_verification=load(spec['current_binding_verification']),
          )
          assert out['pass'] is True,out
          w=out['candidate_witness']
          assert w['source_case_count']==132
          assert w['result']['brain_lower_bound']==1.0==w['result']['theoretical_upper_bound']
          assert out['promotion_authority'] is False
          print('DELEGATION_CEILING_CONTINUITY_EXACT_V2_PASS')
          PY
