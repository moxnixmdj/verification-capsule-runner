name: Verify remaining six Brain terminal bindings
on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/runtime/remaining_behavior_proof_suites.py'
      - 'canonical/runtime/remaining_behavior_brain_candidate.py'
      - 'canonical/tests/test_remaining_behavior_brain_candidate.py'
      - '.github/workflows/verify-remaining-six-brain-bindings.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run remaining six bindings across fresh generated grid
        run: PYTHONPATH=. python -m unittest -v canonical.tests.test_remaining_behavior_brain_candidate
