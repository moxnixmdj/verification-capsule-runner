name: Verify Root2 V10 activation routing
on:
  pull_request:
    paths:
      - "subject/root2_v10_activation_routing_20261004_sol/**"
      - "verify_root2_v10_activation_routing.py"
      - ".github/workflows/verify-root2-v10-activation-routing.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python verify_root2_v10_activation_routing.py
