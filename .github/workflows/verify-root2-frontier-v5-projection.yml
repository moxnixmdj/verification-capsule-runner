name: Verify Root2 frontier V5 projection
on:
  pull_request:
    paths:
      - "subject/ROOT2_CLOSURE_V2_CURRENT_FRONTIER_V5.json"
      - "subject/ROOT2_V5_COMPONENT_TRUTH_PUBLIC_RUNNER_VERIFICATION_20261004_V1.json"
      - "subject/CURRENT_MAIN_ROOT2_CLOSURE_V2_CURRENT_FRONTIER_V4.json"
      - "verify_root2_frontier_v5_projection.py"
      - ".github/workflows/verify-root2-frontier-v5-projection.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python verify_root2_frontier_v5_projection.py
