name: Verify Brain PR 1086 causal cut gate v2
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/brain_pr_1086_causal_cut_gate_v2/**"
      - ".github/workflows/verify-brain-pr-1086-causal-cut-gate-v2.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact Brain blob identities
        run: |
          cd capsules/brain_pr_1086_causal_cut_gate_v2
          python - <<'PY'
          import hashlib,json,pathlib
          m=json.load(open("EXPECTED_BRAIN_BLOBS.json",encoding="utf-8"))
          for src,expected in m["exact_brain_blobs"].items():
              data=pathlib.Path(src).read_bytes()
              got=hashlib.sha1(f"blob {len(data)}\0".encode()+data).hexdigest()
              assert got==expected,(src,got,expected)
          print("exact Brain PR 1086 blobs: PASS")
          PY
      - name: Run causal cut gate tests
        run: |
          cd capsules/brain_pr_1086_causal_cut_gate_v2
          export PYTHONPATH=.
          python -m py_compile canonical/runtime/causal_cut_admission_gate_v2.py
          python -m unittest canonical.tests.test_causal_cut_admission_gate_v2 -v
      - name: Verify causal-cut governance invariants
        run: |
          cd capsules/brain_pr_1086_causal_cut_gate_v2
          python - <<'PY'
          import json
          g=json.load(open("canonical/governance/CAUSAL_CUT_ADMISSION_GATE_V2.json",encoding="utf-8"))
          assert g["status"].startswith("CANDIDATE__FAIL_CLOSED_CAUSAL_CUT_ARCHITECTURE_ADMISSION_GATE")
          assert "UNRELATED_OWNED_DOMAIN_EXPANSION" in g["hard_rejections"]
          assert "PRIMITIVE_TERMINAL_CUT_REDUCTION_WITHOUT_VERIFIED_BINDING" in g["hard_rejections"]
          assert g["current_authority_context"]["atomic_acceptance"]=="7_OF_38_PROVED__31_UNRESOLVED"
          assert g["current_authority_context"]["primitive_residual_cut"]=="40_FACTS__CURRENT_VERIFIED_EDGE_GRAPH"
          assert g["capability_credit_delta"]==0 and g["family_credit_delta"]==0
          assert g["execution_authority"] is False and g["promotion_authority"] is False
          print("causal-cut governance invariants: PASS")
          PY
