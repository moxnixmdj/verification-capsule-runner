name: Verify Root2 V10 composition
on:
  push:
    branches:
      - verify/root2-v10-compose-20261004
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python verify_root2_v10_composition.py
