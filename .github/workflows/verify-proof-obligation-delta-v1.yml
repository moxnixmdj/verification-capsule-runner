name: Verify proof obligation delta v1
# force current exact-snapshot verification

on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/proof_obligation_delta_v1/**"
      - ".github/workflows/verify-proof-obligation-delta-v1.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact blobs, fail-closed algebra, and live synthesis residual
        run: |
          cd capsules/proof_obligation_delta_v1
          export PYTHONPATH=.
          python -m py_compile canonical/runtime/proof_obligation_delta_compiler_v1.py
          python -m unittest canonical.tests.test_proof_obligation_delta_compiler_v1 -v
          python -m unittest canonical.tests.test_synthesis_delta_application_v1 -v
          python -m unittest test_brain_blob_binding -v
