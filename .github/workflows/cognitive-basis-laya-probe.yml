name: Cognitive Basis Laya Typed Decisions Probe

on:
  push:
    paths:
      - ".github/workflows/cognitive-basis-laya-probe.yml"
      - "cognitive_basis_probe/**"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout execution capsule
        uses: actions/checkout@v4

      - name: Record capsule provenance
        run: |
          set -euo pipefail
          cat cognitive_basis_probe/MANIFEST.json
          git rev-parse HEAD

      - name: Fetch pinned Simple Jev
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o simple-jev.tar.gz             https://github.com/featherless-ai/simple-jev/archive/146d3a65cc6e52926bf136e2e29cd2d9d7108e39.tar.gz
          mkdir simple-jev
          tar -xzf simple-jev.tar.gz -C simple-jev --strip-components=1

      - name: Install pinned Simple Jev Laya backend
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install -e './simple-jev/hf-server[laya]'

      - name: Start pinned Laya typed-decisions server
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          set -euo pipefail
          python3 simple-jev/hf-server/hf_server.py             --backend laya             --model convaiinnovations/laya-typed-decisions             --revision 1a793eb568e6718f15941d08f85432581df534e3             --device cpu             --max-model-len 1024             --port 8000             > laya.log 2>&1 &
          echo $! > laya.pid
          for i in $(seq 1 300); do
            if curl -fsS http://127.0.0.1:8000/health > laya_health.json; then
              cat laya_health.json
              exit 0
            fi
            if ! kill -0 "$(cat laya.pid)" 2>/dev/null; then
              echo "Laya server exited before health became ready"
              cat laya.log || true
              exit 1
            fi
            sleep 2
          done
          echo "Timed out waiting for Laya health"
          cat laya.log || true
          exit 1

      - name: Run identical Brain pointwise probe
        run: |
          set -euo pipefail
          python3 cognitive_basis_probe/pointwise_jev_probe.py             --cases cognitive_basis_probe/cases.jsonl             --endpoint http://127.0.0.1:8000/v1/systemone             --model convaiinnovations/laya-typed-decisions             --output cognitive_basis_laya_result.json             --confidence-gate 0.80
          cat cognitive_basis_laya_result.json

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cognitive-basis-laya-typed-decisions-probe
          path: |
            cognitive_basis_laya_result.json
            laya.log
            laya_health.json
            cognitive_basis_probe/MANIFEST.json
          if-no-files-found: warn
