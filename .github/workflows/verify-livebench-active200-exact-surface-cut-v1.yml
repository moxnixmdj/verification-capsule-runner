name: Verify LiveBench active200 exact checker surface cut

on:
  push:
    branches:
      - verify/livebench-active200-exact-surface-cut-v1-20261004-sol
    paths:
      - verify_livebench_active200_exact_surface_cut_v1.py
      - verify_livebench_active200_exact_surface_cut_v1.cpp
      - .github/workflows/verify-livebench-active200-exact-surface-cut-v1.yml
  pull_request:
    branches:
      - main
    paths:
      - verify_livebench_active200_exact_surface_cut_v1.py
      - verify_livebench_active200_exact_surface_cut_v1.cpp
      - .github/workflows/verify-livebench-active200-exact-surface-cut-v1.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install metadata reader
        run: python -m pip install --quiet "pyarrow==21.0.0"
      - name: Solve exact active-200 checker surface cut
        run: python verify_livebench_active200_exact_surface_cut_v1.py
      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livebench-active200-exact-surface-cut-receipt
          path: livebench_active200_exact_surface_cut_receipt.json
          if-no-files-found: error
