name: Verify Brain witness normalization V2
on:
  push:
    branches:
      - verify/brain-witness-normalization-v2-20261003-sol
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python verify_brain_witness_normalization_v2.py
