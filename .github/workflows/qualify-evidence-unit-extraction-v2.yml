name: Qualify Evidence Unit Extraction V2
on:
  push:
    branches:
      - qualify/evidence-unit-extraction-v2-20260930
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Verify exact RED test blob
        run: test "$(git hash-object canonical/tests/test_objective_evidence_unit_extract_v2.py)" = "81bd70c3b30ac8a83a2f781dd130858e2a5ba7de"
      - name: Run evidence extraction contract tests
        run: python -m unittest -v canonical.tests.test_objective_evidence_unit_extract_v2
