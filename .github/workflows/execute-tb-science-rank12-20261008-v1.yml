name: Execute TB-Science rank12 v1 one-shot isolated

on:
  pull_request:
    branches: [terminal-execution-v1]
    paths:
      - "capsules/tb_science_rank12_20261008_v1/ACTIVATE_RANK12_PR.json"

permissions:
  contents: read

concurrency:
  group: tb-science-rank12-v1-one-shot
  cancel-in-progress: false

jobs:
  terminal-slot:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pre-exposure exact authority, lease, preflights, and carrier gate
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$GITHUB_EVENT_NAME" = "pull_request"
          test "$GITHUB_BASE_REF" = "terminal-execution-v1"
          test "$GITHUB_HEAD_REF" = "execute/tb-science-rank12-20261008-v1"
          C=capsules/tb_science_rank12_20261008_v1

          test "$(git hash-object "$C/TB_SCIENCE_RANK12_ONE_SLOT_EXECUTION_AUTHORITY_20261008_V1.json")" = "732b00c707a1e5b1ef6cf39ed85c5bd1abb557a9"
          test "$(git hash-object "$C/ACTION_INTENT_TB_SCIENCE_RANK12_ONE_SHOT_20261008_V1.json")" = "fb808faaa65cab15434349522052de84d27f4376"
          test "$(git hash-object "$C/TB_SCIENCE_RANK12_ACTIVE_AUTHORITY_VERIFICATION_20261008_V1.json")" = "14adffc894a3ca953a8596e5cbe5c6d122efeae6"
          test "$(git hash-object "$C/TB_SCIENCE_CURRENT_SLOT_LEDGER_RECONCILIATION_20261008_V12.json")" = "35456bbbeb8e80708a5e413b28b4ee2ab43c2a16"
          test "$(git hash-object "$C/TB_SCIENCE_TERMINAL_EXECUTION_MANIFEST_V1.json")" = "6dfa880b1f68881531afbba6ca211681801fd19b"
          test "$(git hash-object "$C/TB_SCIENCE_TRANSITIVE_RUNTIME_CLOSURE_MANIFEST_20261008_V4.json")" = "cf9cc9fb8830eda991c71381a523b8f67caedaa7"
          test "$(git hash-object "$C/TB_SCIENCE_EXPLICIT_OUTPUT_DIRECTIVE_REPAIR_INDEPENDENT_VERIFICATION_20261008_V1.json")" = "7a11ec5b0b7d7506f17f1d22f5b04b6e96d354c5"
          test "$(git hash-object "$C/TB_SCIENCE_LIVE_OUTPUT_PREFLIGHT_20261008_V1.json")" = "d8de49aa3f8fd7d1ffbf39e16505e62241652722"
          test "$(git hash-object "$C/TB_SCIENCE_RANK12_STORAGE_HEADROOM_VERIFICATION_20261008_V1.json")" = "9dfdbd1cf6988f5585fd4ff18e59b7a2d9f87cf3"
          test "$(git hash-object "$C/CURRENT_TERMINAL_AUTHORITY.json")" = "599e00957e690bd7bd108f3a95d1d4fdc33a26aa"
          test "$(git hash-object "$C/python_transitive_runtime_closure_v1.py")" = "43d502c621c219632fa0f9a19632dfc0228e4847"
          test "$(git hash-object "$C/RANK12_EPOCH_V1.json")" = "5426f9db570cfa83d5f96859d2087d11cd6b813a"
          test "$(git hash-object "$C/RANK12_EXECUTION_CLAIM_V1.json")" = "73f44f8a06d355693d954d8af828fe81fa7d08e7"

          python - <<'PY'
          import json,pathlib,subprocess
          C=pathlib.Path("capsules/tb_science_rank12_20261008_v1")
          a=json.loads((C/"TB_SCIENCE_RANK12_ONE_SLOT_EXECUTION_AUTHORITY_20261008_V1.json").read_text())
          i=json.loads((C/"ACTION_INTENT_TB_SCIENCE_RANK12_ONE_SHOT_20261008_V1.json").read_text())
          av=json.loads((C/"TB_SCIENCE_RANK12_ACTIVE_AUTHORITY_VERIFICATION_20261008_V1.json").read_text())
          l=json.loads((C/"TB_SCIENCE_CURRENT_SLOT_LEDGER_RECONCILIATION_20261008_V12.json").read_text())
          tm=json.loads((C/"TB_SCIENCE_TERMINAL_EXECUTION_MANIFEST_V1.json").read_text())
          cm=json.loads((C/"TB_SCIENCE_TRANSITIVE_RUNTIME_CLOSURE_MANIFEST_20261008_V4.json").read_text())
          rp=json.loads((C/"TB_SCIENCE_EXPLICIT_OUTPUT_DIRECTIVE_REPAIR_INDEPENDENT_VERIFICATION_20261008_V1.json").read_text())
          lp=json.loads((C/"TB_SCIENCE_LIVE_OUTPUT_PREFLIGHT_20261008_V1.json").read_text())
          sp=json.loads((C/"TB_SCIENCE_RANK12_STORAGE_HEADROOM_VERIFICATION_20261008_V1.json").read_text())
          e=json.loads((C/"RANK12_EPOCH_V1.json").read_text())
          claim=json.loads((C/"RANK12_EXECUTION_CLAIM_V1.json").read_text())
          slot="terminal-bench-science/clinical-metadata-recovery::trial-0"
          task="terminal-bench-science/clinical-metadata-recovery"
          digest="sha256:5ba8f9cb6fb5da7afa90e83b7a34917de4baedb07fdeaec016fed27e48d551e8"

          assert a["execution_authority"] is True
          assert a["slot"]=={"id":slot,"schedule_rank":12,"digest":digest}
          assert a["exact_route"]["agent"]=="7ce3fd53df4577929bfc046dc397fe0f12bce5c0"
          assert a["exact_route"]["planner"]=="01d859c8f27b317893027e693c9aa49e833a256f"
          assert a["exact_route"]["carrier_closure_blob"]=="cf9cc9fb8830eda991c71381a523b8f67caedaa7"
          assert a["controls"]["attempts_authorized"]==1 and a["controls"]["retries_authorized"]==0
          assert a["controls"]["replacement_allowed"] is False
          assert a["controls"]["precheck_failure_consumes_slot"] is False
          assert a["state"]["task_started"] is False and a["state"]["result_present"] is False

          assert i["slot_id"]==slot and i["task_digest"]==digest and i["schedule_rank"]==12
          assert l["next"]=={"rank":12,"slot":slot,"digest":digest}
          assert l["counts"]["consumed"]==11 and l["counts"]["failures"]==11
          assert l["state"]["claim_active"] is False and l["state"]["task_started"] is False

          assert av["subject"]["authority_blob"]=="732b00c707a1e5b1ef6cf39ed85c5bd1abb557a9"
          assert av["verified_state"]["benchmark_task_exposure_from_preflights"]==0
          assert lp["status"].startswith("PASS__REAL_LOCAL_QWEN")
          assert lp["observed"]["output_present"] is True
          assert rp["verification"]["independent_carrier"]["tests_passed"]==17
          assert sp["exact_measurement"]["declared_task_storage_plus_2GiB_headroom_fits"] is True

          rows=[x for x in tm["task_metadata"] if x.get("name")==task]
          assert len(rows)==1 and rows[0]["digest"]==digest
          assert tm["execution_rules"]["retries_per_slot"]==0
          assert tm["execution_rules"]["duplicate_slot_credit"] is False

          assert len(cm["closure"])==14
          for row in cm["closure"]:
              p=C/row["path"]
              assert p.is_file(),row["path"]
              actual=subprocess.check_output(["git","hash-object",str(p)],text=True).strip()
              assert actual==row["git_blob_sha"],(row["path"],actual,row["git_blob_sha"])

          assert e["slot_id"]==slot and e["task_digest"]==digest and e["schedule_rank"]==12
          assert e["run_attempts_authorized_by_epoch"]==0
          assert claim["slot_id"]==slot and claim["task_digest"]==digest and claim["schedule_rank"]==12
          assert claim["execution_branch"]=="execute/tb-science-rank12-20261008-v1"
          assert claim["authority_git_blob_sha"]=="732b00c707a1e5b1ef6cf39ed85c5bd1abb557a9"
          assert claim["attempts_authorized"]==1 and claim["retries_authorized"]==0
          assert claim["consumed"] is False
          PY

          python "$C/python_transitive_runtime_closure_v1.py" --repo-root "$C" --carrier-root "$C"             --root canonical/runtime/harbor_science_agent_v1.py             --root canonical/runtime/harbor_science_planner_v1.py             --root canonical/runtime/lossless_raw_task_contract_v1.py             --root canonical/runtime/raw_task_acceptance_residual_localizer_v1.py > RANK12_CARRIER_CLOSURE.json

          PYTHONPATH="$C" python - <<'PY'
          from canonical.runtime.harbor_science_agent_v1 import HarborScienceAgent,PLANNER_TIMEOUT_S
          import canonical.runtime.harbor_science_planner_v1 as planner
          assert HarborScienceAgent.name()=="project-brain-science"
          assert PLANNER_TIMEOUT_S==300
          assert planner.MODEL=="brain-qwen3.5-9b"
          PY

          epoch_sha="$(curl -fsSL -H 'Accept: application/vnd.github+json'             "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/capsules/tb_science_rank12_20261008_v1/RANK12_EPOCH_V1.json?ref=terminal-execution-v1"             | python -c 'import json,sys; print(json.load(sys.stdin)["sha"])')"
          test "$epoch_sha" = "5426f9db570cfa83d5f96859d2087d11cd6b813a"
          claim_sha="$(curl -fsSL -H 'Accept: application/vnd.github+json'             "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/capsules/tb_science_rank12_20261008_v1/RANK12_EXECUTION_CLAIM_V1.json?ref=terminal-execution-v1"             | python -c 'import json,sys; print(json.load(sys.stdin)["sha"])')"
          test "$claim_sha" = "73f44f8a06d355693d954d8af828fe81fa7d08e7"

          test "$(nproc)" -ge 4
          awk '/MemTotal/{exit !($2 >= 12000000)}' /proc/meminfo
          docker version >/dev/null
          docker info >/dev/null

      - name: Install exact Harbor
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir -q 'harbor==0.23.0'
          python - <<'PY'
          import importlib.metadata
          assert importlib.metadata.version("harbor")=="0.23.0"
          PY

      - name: Clean-build exact llama.cpp
        run: |
          set -euo pipefail
          rm -rf llama.cpp
          git init llama.cpp
          git -C llama.cpp remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C llama.cpp fetch --depth 1 origin bec4772f6a2527d371557b5d2032641e5ff7619c
          git -C llama.cpp checkout --detach FETCH_HEAD
          test "$(git -C llama.cpp rev-parse HEAD)" = "bec4772f6a2527d371557b5d2032641e5ff7619c"
          cmake -S llama.cpp -B llama.cpp/build -DGGML_CUDA=OFF -DLLAMA_CURL=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build llama.cpp/build -j 2 --target llama-server

      - name: Restore exact Qwen model cache
        uses: actions/cache@v4
        with:
          path: models/Qwen3.5-9B-M-TS-Q4_K_M.gguf
          key: brain-qwen35-9b-f41c0a0c0e43bf721fb2da29374cd1a97271bac0bab08a9dc42964525e82350c

      - name: Acquire and verify exact Qwen model if cache misses
        run: |
          set -euo pipefail
          mkdir -p models
          if [ ! -f models/Qwen3.5-9B-M-TS-Q4_K_M.gguf ]; then
            curl -L --fail --retry 3 --retry-delay 3 --silent --show-error               -o models/Qwen3.5-9B-M-TS-Q4_K_M.gguf               'https://huggingface.co/TheStageAI/Qwen3.5-9B-GGUF/resolve/main/Qwen3.5-9B-M-TS-Q4_K_M.gguf?download=true'
          fi
          echo 'f41c0a0c0e43bf721fb2da29374cd1a97271bac0bab08a9dc42964525e82350c  models/Qwen3.5-9B-M-TS-Q4_K_M.gguf' | sha256sum -c -

      - name: Start exact local cognition endpoint
        run: |
          set -euo pipefail
          EXTRA=()
          if llama.cpp/build/bin/llama-server --help 2>&1 | grep -q -- '--reasoning'; then EXTRA+=(--reasoning off); fi
          nohup llama.cpp/build/bin/llama-server             -m models/Qwen3.5-9B-M-TS-Q4_K_M.gguf             --alias brain-qwen3.5-9b --host 127.0.0.1 --port 8080             -c 8192 -t 4 --parallel 1 --jinja --no-webui "${EXTRA[@]}"             > LOCAL_QWEN_SERVER.log 2>&1 &
          ok=0
          for i in $(seq 1 240); do
            if curl -fsS http://127.0.0.1:8080/health > LOCAL_QWEN_HEALTH.json 2>/dev/null; then ok=1; break; fi
            sleep 1
          done
          test "$ok" = 1

      - name: Post-model storage and immediate live epoch/lease gate
        run: |
          set -euo pipefail
          free_bytes="$(df -B1 "$GITHUB_WORKSPACE" | awk 'NR==2{print $4}')"
          test "$free_bytes" -ge 12884901888

          epoch_sha="$(curl -fsSL -H 'Accept: application/vnd.github+json'             "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/capsules/tb_science_rank12_20261008_v1/RANK12_EPOCH_V1.json?ref=terminal-execution-v1"             | python -c 'import json,sys; print(json.load(sys.stdin)["sha"])')"
          test "$epoch_sha" = "5426f9db570cfa83d5f96859d2087d11cd6b813a"
          claim_sha="$(curl -fsSL -H 'Accept: application/vnd.github+json'             "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/capsules/tb_science_rank12_20261008_v1/RANK12_EXECUTION_CLAIM_V1.json?ref=terminal-execution-v1"             | python -c 'import json,sys; print(json.load(sys.stdin)["sha"])')"
          test "$claim_sha" = "73f44f8a06d355693d954d8af828fe81fa7d08e7"

          C="$GITHUB_WORKSPACE/capsules/tb_science_rank12_20261008_v1"
          PYTHONPATH="$C" python - <<'PY'
          from canonical.runtime.harbor_science_agent_v1 import HarborScienceAgent,PLANNER_TIMEOUT_S
          import canonical.runtime.harbor_science_planner_v1 as planner
          assert HarborScienceAgent.name()=="project-brain-science"
          assert PLANNER_TIMEOUT_S==300
          assert planner.MODEL=="brain-qwen3.5-9b"
          PY

      - name: Execute exactly frozen rank12 slot
        id: execute
        continue-on-error: true
        env:
          TASK_NAME: terminal-bench-science/clinical-metadata-recovery
          SAFE_ID: clinical-metadata-recovery-trial-0
        run: |
          set -uo pipefail
          C="$GITHUB_WORKSPACE/capsules/tb_science_rank12_20261008_v1"
          export PYTHONPATH="$C"
          mkdir -p "$GITHUB_WORKSPACE/jobs/$SAFE_ID"
          harbor run             -d terminal-bench-science/terminal-bench-science@0.1.0             -i "$TASK_NAME"             -a canonical.runtime.harbor_science_agent_v1:HarborScienceAgent             -k 1 -n 1 -r 0             --agent-timeout-multiplier 0.48             --environment-build-timeout-multiplier 1.0             --verifier-timeout-multiplier 1.0             --job-name "$SAFE_ID"             --jobs-dir "$GITHUB_WORKSPACE/jobs/$SAFE_ID"
          echo "harbor_exit=$?" >> "$GITHUB_OUTPUT"

      - name: Finalize irreversible conservative rank12 receipt
        if: always()
        env:
          SLOT_ID: terminal-bench-science/clinical-metadata-recovery::trial-0
          TASK_NAME: terminal-bench-science/clinical-metadata-recovery
          SAFE_ID: clinical-metadata-recovery-trial-0
          HARBOR_OUTCOME: ${{ steps.execute.outcome }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          base=root/"jobs"/os.environ["SAFE_ID"]
          results=[]
          for p in base.rglob("result.json") if base.exists() else []:
              try: obj=json.loads(p.read_text())
              except Exception: continue
              results.append((p,obj))
          scored=[]; exception_info=[]
          for p,obj in results:
              vr=obj.get("verifier_result")
              if isinstance(vr,dict) and isinstance(vr.get("rewards"),dict):
                  scored.append((p,obj))
              ex=obj.get("exception_info")
              if isinstance(ex,dict):
                  exception_info.append({
                      "path":str(p.relative_to(root)),
                      "exception_type":ex.get("exception_type"),
                      "exception_message":ex.get("exception_message"),
                  })
          reward=None; errors=[]
          if len(scored)==1:
              raw=scored[0][1]["verifier_result"]["rewards"].get("reward")
              if isinstance(raw,(int,float)) and not isinstance(raw,bool):
                  reward=float(raw)
              else: errors.append("REWARD_MISSING_OR_NONNUMERIC")
          elif not scored:
              errors.append("NO_TRIAL_RESULT_WITH_VERIFIER_REWARD")
          else:
              errors.append("MULTIPLE_TRIAL_RESULTS_WITH_VERIFIER_REWARD")
          success=(reward is not None and reward>=1.0 and not errors)
          hashes={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p,_ in results}
          receipt={
            "schema":"PROJECT_BRAIN_TB_SCIENCE_TERMINAL_SLOT_RECEIPT_RANK12_V1",
            "slot_id":os.environ["SLOT_ID"],
            "task_name":os.environ["TASK_NAME"],
            "task_digest":"sha256:5ba8f9cb6fb5da7afa90e83b7a34917de4baedb07fdeaec016fed27e48d551e8",
            "status":"SUCCESS" if success else "FINAL_ZERO",
            "reward":reward if reward is not None else 0.0,
            "errors":errors,
            "exception_info":exception_info,
            "harbor_step_outcome":os.environ.get("HARBOR_OUTCOME"),
            "authority_blob":"732b00c707a1e5b1ef6cf39ed85c5bd1abb557a9",
            "intent_blob":"fb808faaa65cab15434349522052de84d27f4376",
            "ledger_v12_blob":"35456bbbeb8e80708a5e413b28b4ee2ab43c2a16",
            "closure_manifest_blob":"cf9cc9fb8830eda991c71381a523b8f67caedaa7",
            "repair_verification_blob":"7a11ec5b0b7d7506f17f1d22f5b04b6e96d354c5",
            "live_output_preflight_blob":"d8de49aa3f8fd7d1ffbf39e16505e62241652722",
            "storage_preflight_blob":"9dfdbd1cf6988f5585fd4ff18e59b7a2d9f87cf3",
            "authority_verification_blob":"14adffc894a3ca953a8596e5cbe5c6d122efeae6",
            "epoch_blob":"5426f9db570cfa83d5f96859d2087d11cd6b813a",
            "execution_claim_blob":"73f44f8a06d355693d954d8af828fe81fa7d08e7",
            "agent_blob":"7ce3fd53df4577929bfc046dc397fe0f12bce5c0",
            "planner_blob":"01d859c8f27b317893027e693c9aa49e833a256f",
            "planner_timeout_s":300,
            "agent_timeout_multiplier":0.48,
            "strict_timeout_semantics":"SUCCESS_IS_EXACT_POSITIVE_EVIDENCE__ANY_FINAL_NON_SUCCESS_COUNTS_ZERO",
            "github_run_id":os.environ["GITHUB_RUN_ID"],
            "github_run_attempt":os.environ["GITHUB_RUN_ATTEMPT"],
            "github_sha":os.environ["GITHUB_SHA"],
            "result_hashes":hashes,
            "execution_authority_consumed":True,
            "rerun_credit":False,
            "incremental_spend_usd":0,
            "promotion_authority":False,
          }
          pathlib.Path("clinical-metadata-recovery-trial-0__SLOT_RECEIPT.json").write_text(
              json.dumps(receipt,indent=2,sort_keys=True)+"\n")
          print(json.dumps(receipt,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tb-science-clinical-metadata-recovery-trial-0-rank12-v1
          path: |
            clinical-metadata-recovery-trial-0__SLOT_RECEIPT.json
            RANK12_CARRIER_CLOSURE.json
            jobs/clinical-metadata-recovery-trial-0/
            LOCAL_QWEN_HEALTH.json
            LOCAL_QWEN_SERVER.log
          if-no-files-found: warn
          retention-days: 7
