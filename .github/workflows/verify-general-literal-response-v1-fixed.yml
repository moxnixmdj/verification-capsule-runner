name: Verify general literal response V1 fixed
on:
  pull_request:
    paths:
      - 'verify_general_literal_response_v1_fixed.py'
      - 'subject/general_literal_response_v1/**'
      - '.github/workflows/verify-general-literal-response-v1-fixed.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python verify_general_literal_response_v1_fixed.py
