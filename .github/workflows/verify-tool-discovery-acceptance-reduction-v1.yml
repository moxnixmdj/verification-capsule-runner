name: Verify Tool Discovery acceptance reduction V1
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/tool_discovery_acceptance_reduction_v1/**"
      - ".github/workflows/verify-tool-discovery-acceptance-reduction-v1.yml"
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify exact Brain blobs
        shell: bash
        run: |
          set -euo pipefail
          cd capsules/tool_discovery_acceptance_reduction_v1
          test "$(git hash-object canonical/runtime/acceptance_proof_transmuter_v1.py)" = "39b5611e53485674b29e2a05da91b89801bc5aa6"
          test "$(git hash-object canonical/governance/OPUS55_TERMINAL_PROOF_PROTOCOLS_V1.json)" = "62394e5b7d221ec9f69c3458f669e40e253a9d09"
          test "$(git hash-object canonical/governance/OPUS55_TOOL_DISCOVERY_SCOPE_COMPLETE_ACCEPTANCE_INPUT_V1.json)" = "4c7d170418bb95828a23538709aa304a00db6746"
          test "$(git hash-object canonical/verification/TOOL_DISCOVERY_FROZEN_SCOPE_COMPLETENESS_PUBLIC_RUNNER_VERIFICATION_20261003_V1.json)" = "c9adf25c2e63f9e8b111f1d022acda264d6571f5"
          test "$(git hash-object canonical/governance/TOOL_DISCOVERY_ACCEPTANCE_CEILING_WITNESS_V1.json)" = "60a7c1139cad315d977bf5ed97e708cc5ec3fcc7"
          test "$(git hash-object canonical/verification/TERMINAL_CEILING_WITNESS_LIFTER_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json)" = "a1c702c79d2b29bfc9c4d5a238f9c260bc204770"

      - name: Prove the repaired evidence is old witness plus exact scope receipt only
        shell: bash
        run: |
          set -euo pipefail
          cd capsules/tool_discovery_acceptance_reduction_v1
          export PYTHONPATH=.
          python - <<'PY'
          import copy,json
          old=json.load(open("canonical/governance/TOOL_DISCOVERY_ACCEPTANCE_CEILING_WITNESS_V1.json",encoding="utf-8"))
          inp=json.load(open("canonical/governance/OPUS55_TOOL_DISCOVERY_SCOPE_COMPLETE_ACCEPTANCE_INPUT_V1.json",encoding="utf-8"))
          scope=json.load(open("canonical/verification/TOOL_DISCOVERY_FROZEN_SCOPE_COMPLETENESS_PUBLIC_RUNNER_VERIFICATION_20261003_V1.json",encoding="utf-8"))
          lifter=json.load(open("canonical/verification/TERMINAL_CEILING_WITNESS_LIFTER_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json",encoding="utf-8"))
          assert len(inp["evidence"])==1,inp
          repaired=copy.deepcopy(inp["evidence"][0])
          attached=repaired.pop("scope_completeness")
          assert repaired==old,(repaired,old)
          assert scope["status"].startswith("INDEPENDENT_PUBLIC_RUNNER_PASS__"),scope
          assert scope["scope_semantics_discharged"] is True,scope
          assert scope["complete_target_case_set"] is True,scope
          assert scope["basis_kind"]=="EXACT_COMPLETE_TARGET_CASE_UNIVERSE",scope
          assert scope["public_runner"]["conclusion"]=="success",scope
          assert attached=={
            "verified":True,
            "independent":True,
            "basis":"EXACT_COMPLETE_TARGET_CASE_UNIVERSE",
            "complete_target_case_set":True,
            "receipt":"canonical/verification/TOOL_DISCOVERY_FROZEN_SCOPE_COMPLETENESS_PUBLIC_RUNNER_VERIFICATION_20261003_V1.json",
          },attached
          assert old["independent_verification"]=="canonical/verification/TERMINAL_CEILING_WITNESS_LIFTER_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json"
          assert lifter["status"].startswith("INDEPENDENT_PUBLIC_RUNNER_PASS__"),lifter
          assert old["verified"] is True and old["independent"] is True and old["contamination_clean"] is True
          assert old["binds_frozen_protocol"] is True and old["closes_entire_protocol"] is True
          assert old["mode"]=="ABSOLUTE_DOMINANCE"
          assert old["result"]=={"direction":"higher","brain_lower_bound":1,"theoretical_upper_bound":1}
          print("evidence delta and provenance: PASS")
          PY

      - name: Execute fail-closed acceptance transmuter
        shell: bash
        run: |
          set -euo pipefail
          cd capsules/tool_discovery_acceptance_reduction_v1
          export PYTHONPATH=.
          python canonical/runtime/acceptance_proof_transmuter_v1.py             canonical/governance/OPUS55_TERMINAL_PROOF_PROTOCOLS_V1.json             --evidence canonical/governance/OPUS55_TOOL_DISCOVERY_SCOPE_COMPLETE_ACCEPTANCE_INPUT_V1.json             > reduction.json
          cat reduction.json
          python - <<'PY'
          import json
          protocols=json.load(open("canonical/governance/OPUS55_TERMINAL_PROOF_PROTOCOLS_V1.json",encoding="utf-8"))
          out=json.load(open("reduction.json",encoding="utf-8"))
          assert out["status"]=="PASS",out
          assert out["errors"]==[],out
          assert out["family_count"]==19,out
          assert out["closed_family_count"]==4,out
          assert out["open_family_count"]==15,out
          rows={x["family"]:x for x in out["families"]}
          pre={x["family"]:x["status"] for x in protocols["protocols"]}
          expected_already={
            "EXACT_SYMBOLIC_COMPUTATION",
            "LONG_HORIZON_MEMORY_AND_CONTINUITY",
            "SUBAGENT_DELEGATION_AND_COORDINATION",
          }
          assert {f for f,s in pre.items() if s=="PASS"}==expected_already,pre
          td=rows["TOOL_DISCOVERY_SELECTION_AND_LEARNING"]
          assert td["input_status"]=="DEFINED_RESULT_OPEN",td
          assert td["result_status"]=="PASS",td
          assert td["closure_mode"]=="ABSOLUTE_DOMINANCE",td
          assert td["witness_id"]=="TOOL_DISCOVERY_TERMINAL_CEILING_ABSOLUTE_DOMINANCE_20261002_V1",td
          assert td["witness_reason"]=="THEORETICAL_CEILING_DOMINANCE",td
          assert td["rejections"]==[],td
          newly={f for f,r in rows.items() if pre[f]!="PASS" and r["result_status"]=="PASS"}
          assert newly=={"TOOL_DISCOVERY_SELECTION_AND_LEARNING"},newly
          preserved={f for f in expected_already if rows[f]["result_status"]=="PASS"}
          assert preserved==expected_already,preserved
          assert out["capability_credit_delta"]==0 and out["family_credit_delta"]==0,out
          assert out["execution_authority"] is False and out["promotion_authority"] is False,out
          print("acceptance reduction: PASS 3/19 -> 4/19 candidate result")
          PY

      - name: Falsification mutations must reopen Tool Discovery
        shell: bash
        run: |
          set -euo pipefail
          cd capsules/tool_discovery_acceptance_reduction_v1
          export PYTHONPATH=.
          python - <<'PY'
          import copy,json
          from canonical.runtime.acceptance_proof_transmuter_v1 import evaluate
          p=json.load(open("canonical/governance/OPUS55_TERMINAL_PROOF_PROTOCOLS_V1.json",encoding="utf-8"))
          e=json.load(open("canonical/governance/OPUS55_TOOL_DISCOVERY_SCOPE_COMPLETE_ACCEPTANCE_INPUT_V1.json",encoding="utf-8"))
          def td(doc):
              out=evaluate(p,doc)
              return next(x for x in out["families"] if x["family"]=="TOOL_DISCOVERY_SELECTION_AND_LEARNING")
          mutations=[]
          a=copy.deepcopy(e); a["evidence"][0].pop("scope_completeness"); mutations.append(a)
          a=copy.deepcopy(e); a["evidence"][0]["scope_completeness"]["verified"]=False; mutations.append(a)
          a=copy.deepcopy(e); a["evidence"][0]["scope_completeness"]["independent"]=False; mutations.append(a)
          a=copy.deepcopy(e); a["evidence"][0]["scope_completeness"]["complete_target_case_set"]=False; mutations.append(a)
          a=copy.deepcopy(e); a["evidence"][0]["scope_completeness"]["basis"]="SAMPLED_POPULATION"; mutations.append(a)
          a=copy.deepcopy(e); a["evidence"][0]["result"]["brain_lower_bound"]=0.99; mutations.append(a)
          for i,m in enumerate(mutations):
              row=td(m)
              assert row["result_status"]!="PASS",(i,row)
              assert row["rejections"],(i,row)
          print("falsification mutations:",len(mutations),"PASS")
          PY

      - name: Verify zero-reality and exact expected delta contract
        shell: bash
        run: |
          set -euo pipefail
          cd capsules/tool_discovery_acceptance_reduction_v1
          python - <<'PY'
          import json
          x=json.load(open("canonical/governance/OPUS55_TOOL_DISCOVERY_SCOPE_COMPLETE_ACCEPTANCE_INPUT_V1.json",encoding="utf-8"))
          exp=x["expected_compile_result"]
          assert exp["family_count"]==19
          assert exp["closed_family_count"]==4
          assert exp["open_family_count"]==15
          assert exp["newly_closed_families"]==["TOOL_DISCOVERY_SELECTION_AND_LEARNING"]
          assert set(exp["preserved_closed_families"])=={
            "EXACT_SYMBOLIC_COMPUTATION",
            "LONG_HORIZON_MEMORY_AND_CONTINUITY",
            "SUBAGENT_DELEGATION_AND_COORDINATION",
          }
          assert x["new_reality_units_consumed"]==0
          assert x["terminal_results_replayed"]==0
          assert x["incremental_spend_usd"]==0
          assert x["capability_credit_delta"]==0 and x["family_credit_delta"]==0
          assert x["execution_authority"] is False and x["promotion_authority"] is False
          print("zero-reality firewall: PASS")
          PY
