name: Verify Brain composition memory terminal reconciliation
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/composition_memory_terminal_reconcile_v1/**"
      - ".github/workflows/verify-composition-memory-terminal-reconcile-v1.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact allowed terminal-authority diff
        run: python capsules/composition_memory_terminal_reconcile_v1/verify.py
