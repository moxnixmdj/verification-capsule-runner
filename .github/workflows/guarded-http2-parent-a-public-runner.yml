name: Guarded HTTP2 Parent A Public Runner
on:
  pull_request:
    branches: [main]
    types: [opened]
permissions:
  contents: write
jobs:
  execute-once:
    if: github.head_ref == 'execute/guarded-http2-parent-a-public-runner-20260930-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Fail-closed exact snapshot prestart
        run: |
          set -euo pipefail
          mkdir -p _terminal
          BASE='b1d5ada6b827098e24d795c41c02545c12fd8fc1'
          test "$(git merge-base HEAD "$BASE")" = "$BASE"
          test "$(find brain_snapshot/canonical/runtime -type f | wc -l | tr -d ' ')" = "96"
          test "$(git hash-object brain_snapshot/canonical/tasks/PARENT-OPENENDED-HTTP2-FLOW-CONTROL-LIMITS-REAL-TASK-20260930-003.json)" = "539cadd30e7e8ac548638157b7f36a1814b97dcd"
          test "$(git hash-object brain_snapshot/canonical/astra_runtime/missions/PARENT-OPENENDED-HTTP2-FLOW-CONTROL-LIMITS-REAL-TASK-20260930-003.json)" = "fac316bc6d273bf84e06843a6850d358fd3a2e56"
          test "$(git hash-object brain_snapshot/canonical/runtime/astra_runtime.py)" = "e60345e3814deacc5b79ffd7fcf713febfee0425"
          test "$(git hash-object brain_snapshot/canonical/action_intents/2026-09-30_EXECUTE_GUARDED_HTTP2_PARENT_TASK_A_V1.json)" = "0fd94d0b522053161a99da66265d375da5a3aa6c"
          grep -Fq '"exactly_one_execution": true' brain_snapshot/canonical/tasks/PARENT-OPENENDED-HTTP2-FLOW-CONTROL-LIMITS-REAL-TASK-20260930-003.json
          grep -Fq '"no_same_task_replay": true' brain_snapshot/canonical/astra_runtime/missions/PARENT-OPENENDED-HTTP2-FLOW-CONTROL-LIMITS-REAL-TASK-20260930-003.json
          grep -Fq '"model_planner_disabled": true' brain_snapshot/canonical/astra_runtime/missions/PARENT-OPENENDED-HTTP2-FLOW-CONTROL-LIMITS-REAL-TASK-20260930-003.json
          grep -Fq 'evidence.claim_spec.bind.explicit_comparison.stdlib' brain_snapshot/canonical/runtime/BOUND_CAPABILITY_REGISTRY_V1.json
          python -m py_compile brain_snapshot/canonical/runtime/astra_runtime.py brain_snapshot/canonical/runtime/bound_capabilities/broad_objective_decompose.py brain_snapshot/canonical/runtime/bound_capabilities/open_research_source_frontend.py brain_snapshot/canonical/runtime/bound_capabilities/objective_claim_operand_binding.py brain_snapshot/canonical/runtime/bound_capabilities/generic_evidence_claim_relation.py
          echo PUBLIC_RUNNER_SNAPSHOT_PRESTART_QUALIFIED | tee _terminal/prestart_report.txt
      - name: Atomically admit and execute frozen parent once
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python execution_guard/github_actions_guarded_run_live.py --plan guarded_http2_parent_a_public_runner_plan.json --receipt _terminal/guarded-http2-admission.json
      - name: Preserve terminal evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p _terminal/snapshot
          cp brain_snapshot/canonical/tasks/PARENT-OPENENDED-HTTP2-FLOW-CONTROL-LIMITS-REAL-TASK-20260930-003.json _terminal/snapshot/task.json
          cp brain_snapshot/canonical/astra_runtime/missions/PARENT-OPENENDED-HTTP2-FLOW-CONTROL-LIMITS-REAL-TASK-20260930-003.json _terminal/snapshot/mission.json
          cp brain_snapshot/canonical/action_intents/2026-09-30_EXECUTE_GUARDED_HTTP2_PARENT_TASK_A_V1.json _terminal/snapshot/action_intent.json
          cp guarded_http2_parent_a_public_runner_plan.json _terminal/snapshot/guarded_plan.json
          if [ -d brain_snapshot/canonical/astra_runtime/evidence ]; then cp -R brain_snapshot/canonical/astra_runtime/evidence _terminal/snapshot/evidence; fi
          if [ -d brain_snapshot/canonical/astra_runtime/state ]; then cp -R brain_snapshot/canonical/astra_runtime/state _terminal/snapshot/state; fi
          if [ -f _terminal/producer.log ]; then grep -E -m30 'PROJECT_BRAIN_ASTRA_RUNTIME_BLOCKER_V1|Blocker:|CAPABILITY_ACQUISITION_REQUIRED|OPEN_ENDED_RESEARCH_|COMPOUND_GOAL_COMPLETE' _terminal/producer.log > _terminal/first_signals.txt || true; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: guarded-http2-parent-a-public-runner-terminal
          path: _terminal/
          if-no-files-found: error
