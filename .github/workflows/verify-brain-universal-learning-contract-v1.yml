name: Verify Brain universal learning contract V1
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/universal_learning_contract_v1/**"
      - ".github/workflows/verify-brain-universal-learning-contract-v1.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact Brain blob identities
        run: |
          cd capsules/universal_learning_contract_v1
          python - <<'PY'
          import hashlib,json,pathlib
          m=json.load(open("EXPECTED_BRAIN_BLOBS.json",encoding="utf-8"))
          for src,expected in m["exact_brain_blobs"].items():
              data=pathlib.Path(src).read_bytes()
              got=hashlib.sha1(f"blob {len(data)}\0".encode()+data).hexdigest()
              assert got==expected,(src,got,expected)
          print("exact Brain blobs: PASS",len(m["exact_brain_blobs"]))
          PY
      - name: Compile universal learning kernels
        run: |
          cd capsules/universal_learning_contract_v1
          python -m py_compile             canonical/runtime/universal_learning_contract_v1.py             canonical/runtime/universal_learning_acceptance_reducer_v1.py
      - name: Run universal learning theorem tests
        run: |
          cd capsules/universal_learning_contract_v1
          export PYTHONPATH=.
          python -m unittest canonical.tests.test_universal_learning_contract_v1 -v
          python -m unittest canonical.tests.test_universal_learning_acceptance_reducer_v1 -v
          python -m unittest canonical.tests.test_universal_learning_contract_binding_v1 -v
      - name: Execute control theorem
        run: |
          cd capsules/universal_learning_contract_v1
          export PYTHONPATH=.
          python - <<'PY'
          from canonical.runtime.universal_learning_contract_v1 import prove_control_invariants
          out=prove_control_invariants()
          assert out["pass"] is True,out
          assert out["proved"]["unknown_capture_total_over_declared_coverage_input"] is True,out
          assert out["proved"]["only_verified_coverage_uses_known_route"] is True,out
          assert out["proved"]["candidate_requires_verification_before_trust"] is True,out
          assert out["proved"]["promotion_requires_verified_state"] is True,out
          assert out["proved"]["environment_change_invalidates_to_unknown"] is True,out
          assert out["semantic_success_rate_proved"] is False,out
          assert out["tool_learning_noninferiority_proved"] is False,out
          assert out["acceptance_credit_delta"]==0,out
          print("universal learning control theorem: PASS")
          PY
      - name: Independently reduce acceptance residual
        run: |
          cd capsules/universal_learning_contract_v1
          export PYTHONPATH=.
          python - <<'PY'
          import json
          from canonical.runtime.universal_learning_acceptance_reducer_v1 import reduce
          bindings=json.load(open("canonical/governance/OPUS55_ACCEPTANCE_PREDICATE_EVIDENCE_BINDINGS_V2.json",encoding="utf-8"))
          verification={
            "independent_runner":{"conclusion":"success"},
            "verified":{
              "unknown_capture_total":True,
              "only_verified_coverage_uses_known_route":True,
              "learning_channels_complete":True,
              "candidate_requires_verification_before_trust":True,
              "promotion_requires_verified_state":True,
              "environment_change_invalidates_to_unknown":True,
              "finite_control_product_exhaustively_checked":True,
              "actual_component_bindings_exact":True
            }
          }
          out=reduce(contract_verification=verification,evidence_bindings=bindings)
          assert out["pass"] is True,out
          assert out["structural_novelty_scope_closed_candidate"] is True,out
          assert out["separate_environment_enumeration_required"] is False,out
          assert out["remaining_residuals"]==["MATCHED_EMPIRICAL_LEARNING_EFFECTIVENESS_NONINFERIORITY"],out
          assert out["target_predicate_discharge_candidate"] is False,out
          assert out["acceptance_credit_delta"]==0,out
          print("acceptance residual reduction: PASS")
          PY
