name: Probe Toolathlon public service nonterminal
on:
  push:
    branches: ["probe-toolathlon-public-service-20261003-v1"]
    paths:
      - "capsules/toolathlon_public_service_nonterminal_preflight_v1/**"
      - ".github/workflows/probe-toolathlon-public-service-nonterminal.yml"
  pull_request:
    branches: [main]
    paths:
      - "capsules/toolathlon_public_service_nonterminal_preflight_v1/**"
      - ".github/workflows/probe-toolathlon-public-service-nonterminal.yml"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe official status endpoint only
        run: python capsules/toolathlon_public_service_nonterminal_preflight_v1/probe.py | tee probe-result.json
      - uses: actions/upload-artifact@v4
        with:
          name: toolathlon-public-service-nonterminal-preflight-v1
          path: probe-result.json
