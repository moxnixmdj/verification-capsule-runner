name: Revalidate direct executors delegation selector

on:
  pull_request:
    branches: [main]
    paths:
      - 'capsules/direct_route_selector_revalidation_v1/**'
      - '.github/workflows/revalidate-direct-executors-delegation-selector.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact current Brain blobs
        shell: bash
        run: |
          set -euo pipefail
          C=capsules/direct_route_selector_revalidation_v1
          test "$(git hash-object $C/canonical/runtime/direct_route_terminal_executors_v1.py)" = "28ef55db77ac81e78bd5c67e4d2b39fef131b505"
          test "$(git hash-object $C/canonical/tests/test_direct_route_terminal_executors_v1.py)" = "17c5c2c6828c89fd5a2cfdd5c3eda6110ab0fb03"
          test "$(git hash-object $C/canonical/governance/DELEGATION_T2_OBJECTIVE_TERMINAL_BINDING_V1.json)" = "a1e441567b132d71713ed55dfc51f01d8de112d1"
          test "$(git hash-object $C/canonical/governance/GLOBAL_TERMINAL_SELECTION_KERNEL_V1.json)" = "669afcde50302e76c1b0a1f6b186aaafa8730515"
      - name: Verify selector authority semantics
        run: |
          python - <<'PY'
          import json, pathlib
          root=pathlib.Path("capsules/direct_route_selector_revalidation_v1")
          b=json.loads((root/"canonical/governance/DELEGATION_T2_OBJECTIVE_TERMINAL_BINDING_V1.json").read_text())
          k=json.loads((root/"canonical/governance/GLOBAL_TERMINAL_SELECTION_KERNEL_V1.json").read_text())
          assert b["behavior_id"]=="TASK_TO_DELEGATION_GRAPH_001"
          assert b["source_pool"]["terminal_sample_count"]==132
          assert len(b["source_pool"]["class_cycle"])==11
          assert b["exact_bound_blobs"]["selection_kernel"]["blob_sha"]=="669afcde50302e76c1b0a1f6b186aaafa8730515"
          assert b["selection_semantics"]["kernel_blob_sha"]=="669afcde50302e76c1b0a1f6b186aaafa8730515"
          assert b["selector"]["case_replacement"] is False
          assert b["selector"]["tuning_replay"] is False
          assert b["selector"]["adaptive_case_selection"] is False
          assert k["seed_policy"]["case_id_rule"]=="<behavior_id>::<route_population_version>::slot::<index>"
          assert k["seed_policy"]["seed_rule"].startswith("uint64_be(first_8_bytes(SHA256('PROJECT_BRAIN_TERMINAL_V2")
          PY
      - name: Run current direct executor regression suite against previously verified dependency cone
        shell: bash
        run: |
          set -euo pipefail
          BASE=capsules/direct_route_terminal_executors_v1
          NEW=capsules/direct_route_selector_revalidation_v1
          cp "$NEW/canonical/runtime/direct_route_terminal_executors_v1.py" "$BASE/canonical/runtime/direct_route_terminal_executors_v1.py"
          cp "$NEW/canonical/tests/test_direct_route_terminal_executors_v1.py" "$BASE/canonical/tests/test_direct_route_terminal_executors_v1.py"
          cd "$BASE"
          PYTHONPATH=. python -m unittest -v canonical.tests.test_direct_route_terminal_executors_v1
