name: Verify P1 typed trajectory causal route V4
on:
  pull_request:
    branches: [main]
    paths:
      - 'capsules/p1_typed_ir_v4/**'
      - '.github/workflows/verify-p1-typed-ir-v4.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -q pytest
      - run: cd capsules/p1_typed_ir_v4 && pytest -q canonical/tests/test_trajectory_failure_typed_ir_v4.py
