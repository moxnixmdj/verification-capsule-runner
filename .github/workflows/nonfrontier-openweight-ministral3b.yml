name: Local Open-Weight 3B Reasoning Planner Qualification

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/nonfrontier-openweight-ministral3b.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install llama.cpp
        shell: bash
        run: |
          set -euo pipefail
          curl -LsSf https://llama.app/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run exact 3B reasoning planner
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          MODEL='mistralai/Ministral-3-3B-Reasoning-2512-GGUF:Q4_K_M'
          PROMPT='You are a bounded research planner. Goal: determine the mass of a local file named evidence.json. Allowed actions: read_file, list_tree, search_text, finish. You have not observed evidence.json. Return exactly one JSON object: {"type":"...","args":{},"why":"..."}. Choose the next action.'
          START=$(date +%s)
          llama cli -hf "$MODEL" -p "$PROMPT" -n 192 --temp 0 --no-display-prompt > planner3b.txt 2> planner3b.stderr
          END=$(date +%s)
          python - <<'PY'
          import json,re,hashlib,pathlib,os
          out=pathlib.Path('planner3b.txt').read_text(errors='replace')
          err=pathlib.Path('planner3b.stderr').read_text(errors='replace')
          parsed=None
          # accept a single JSON object even if surrounded by reasoning markers
          for m in re.finditer(r'\{(?:[^{}]|\{[^{}]*\})*\}',out,re.S):
              try:
                  x=json.loads(m.group(0))
                  if isinstance(x,dict) and x.get('type') in {'read_file','list_tree','search_text','finish'}:
                      parsed=x; break
              except Exception: pass
          result={
            "schema":"PROJECT_BRAIN_LOCAL_OPENWEIGHT_PLANNER_QUALIFICATION_V1",
            "model":"mistralai/Ministral-3-3B-Reasoning-2512-GGUF:Q4_K_M",
            "model_publisher":"Mistral AI",
            "license":"Apache-2.0",
            "frontier_target_supplier":False,
            "incremental_spend_usd":0,
            "valid_allowed_action":parsed is not None,
            "parsed_action":parsed,
            "output_sha256":hashlib.sha256(out.encode()).hexdigest(),
            "output_excerpt":out[-4000:],
            "stderr_excerpt":err[-4000:]
          }
          pathlib.Path('LOCAL_OPENWEIGHT_3B_PLANNER_QUALIFICATION.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          print(json.dumps(result,indent=2,sort_keys=True))
          if parsed is None: raise SystemExit(2)
          PY
      - name: Upload exact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-openweight-3b-planner-qualification
          path: |
            LOCAL_OPENWEIGHT_3B_PLANNER_QUALIFICATION.json
            planner3b.stderr
