name: Verify Root2 V10 terminal bridge coherence
on:
  push:
    branches:
      - verify/root2-v10-terminal-bridge-coherence-20261004-v1
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact Brain blobs
        run: |
          test "$(git hash-object verification_inputs/root2_v10_terminal_active.json)" = "f6d28bf4e0bd7abc04fc1b2a91209be8016beeec"
          test "$(git hash-object verification_inputs/root2_v10_bridge_active.json)" = "4187565726007664ab2133089937b1fffe2d4a04"
          test "$(git hash-object verification_inputs/root2_v10_root_state_active.json)" = "59711b491e5f4c94661f78401e66ea1f546f96c7"
          test "$(git hash-object verification_inputs/root2_v10_final_activation.json)" = "f5eda02fcc104bc8a5e13a82bfc8ec3d9515dcb2"
          test "$(git hash-object verification_inputs/root2_v10_frontier.json)" = "2012926814d0d06405da56da64e589b06fef1756"
          test "$(git hash-object verification_inputs/root2_v10_composition_receipt.json)" = "226832c5e9d5f4121f26d93bd645ed51dce474fe"
          test "$(git hash-object verification_inputs/root2_v10_pointer_projection_receipt.json)" = "73fce958517f0467666bc9e70f8411fa618b5210"
          test "$(git hash-object verification_inputs/root2_v10_routing_activation.json)" = "400cf1fa6516d384b8781201841c3359851b070b"
          test "$(git hash-object verification_inputs/root2_v10_routing_receipt.json)" = "5e5bf1082a8d7ce5b1fcd2c7b16a4d9d8acdc76d"
          test "$(git hash-object verification_inputs/root2_primary_source_deletions_receipt.json)" = "80c9767429671e72c58d000c8c2b3c5650d9b3ce"
      - name: Verify V10 coherence and zero-credit invariants
        run: python verify_root2_v10_terminal_bridge_coherence.py
