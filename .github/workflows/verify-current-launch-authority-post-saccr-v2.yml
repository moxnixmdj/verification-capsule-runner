name: Verify current launch authority post SA-CCR V2
on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/**'
      - '.github/workflows/verify-current-launch-authority-post-saccr-v2.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Derive authority from exact mirrored Brain state
        run: |
          set -euo pipefail
          PYTHONPATH=. python canonical/runtime/terminal_wave_launch_authority_reducer_v1.py . | tee /tmp/authority.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/authority.json'))
          assert d['pass'] is True, d
          assert d['launch_authority'] is True, d
          assert d['execution_authority'] is True, d
          assert d['route_count'] == 12, d
          assert d['failed_predicates'] == [], d
          assert d['terminal_results_observed'] == 0, d
          assert d['fresh_terminal_evidence_consumed'] == 0, d
          print('CURRENT_LAUNCH_AUTHORITY_PASS')
          PY
