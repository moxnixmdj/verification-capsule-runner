name: Verify delegation terminal binding V2
on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/runtime/delegation_whole_scope_candidate_v2.py'
      - 'canonical/runtime/delegation_whole_scope_proof_v2.py'
      - 'canonical/runtime/delegation_structural_variety_proof_v3.py'
      - 'canonical/runtime/delegation_terminal_population_binding_v2.py'
      - 'canonical/tests/test_delegation_terminal_population_binding_v2.py'
      - 'canonical/governance/DELEGATION_TERMINAL_POPULATION_BINDING_V2.json'
      - 'canonical/governance/BEHAVIORAL_CONTRACT_REGISTRY_V1.json'
      - '.github/workflows/verify-delegation-terminal-binding-v2.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Bind exact repaired Brain snapshot
        run: |
          set -euo pipefail
          test "$(git hash-object canonical/runtime/delegation_whole_scope_candidate_v2.py)" = "f1a93ee66d90093de61dc17c6ebf2e24073df522"
          test "$(git hash-object canonical/runtime/delegation_whole_scope_proof_v2.py)" = "928466401b36e4f3b09c517950cc050432a0616f"
          test "$(git hash-object canonical/runtime/delegation_structural_variety_proof_v3.py)" = "f5e1f45519278ed2cafa27d23b8602b0a362a492"
          test "$(git hash-object canonical/runtime/delegation_terminal_population_binding_v2.py)" = "478b708f0380e6990d19c49d089023bbadf61545"
          test "$(git hash-object canonical/tests/test_delegation_terminal_population_binding_v2.py)" = "7f93ad694568e7249a1689e4746bd9242d6d2473"
          test "$(git hash-object canonical/governance/DELEGATION_TERMINAL_POPULATION_BINDING_V2.json)" = "a396986a81519448bde53f5f0f0d0943fac9c503"
          test "$(git hash-object canonical/governance/BEHAVIORAL_CONTRACT_REGISTRY_V1.json)" = "afa00109031d638fef32cc3fe10be18786605c39"
          test "$(git hash-object canonical/governance/GLOBAL_TERMINAL_REPLACEMENT_POPULATION_PROTOCOL_V2.json)" = "18d5fbecd779e7e571842146599a10f031ccccf3"
          test "$(git hash-object canonical/governance/DELEGATION_SCOPE_EQUIVALENCE_RELATION_V1.json)" = "52392515cd4de672f82f8afac82a41d3ce442656"
          test "$(git hash-object canonical/governance/DELEGATION_SCOPE_EQUIVALENT_PROOF_GATE_V2_INPUT.json)" = "b434c2ad13154f5d4f43a76cfb27d6b492e93e01"
          test "$(git hash-object canonical/verification/DELEGATION_SCOPE_GATE_V2_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json)" = "ab1d8d19217fe683b62682c8f7f2ce7800fcfe57"
          test "$(git hash-object canonical/verification/DELEGATION_WHOLE_DIMENSION_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json)" = "ae24117149e6acdcc8c4db977f8460b89480f0b2"
          test "$(git hash-object canonical/verification/DELEGATION_STRUCTURAL_VARIETY_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json)" = "c99c1fba7f006e065937b4a272d346efbbe2cb49"
      - name: Verify pre-beacon registry and scope state
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('.')
          p=json.loads((root/'canonical/governance/DELEGATION_TERMINAL_POPULATION_BINDING_V2.json').read_text())
          reg=json.loads((root/'canonical/governance/BEHAVIORAL_CONTRACT_REGISTRY_V1.json').read_text())
          gate=json.loads((root/'canonical/governance/DELEGATION_SCOPE_EQUIVALENT_PROOF_GATE_V2_INPUT.json').read_text())
          receipt=json.loads((root/'canonical/verification/DELEGATION_SCOPE_GATE_V2_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json').read_text())
          assert p['behavior_id']=='TASK_TO_DELEGATION_GRAPH_001'
          assert p['proof_mode'] in reg['terminal_acceptance_proof_modes']
          assert p['population']['sample_count']==512
          assert p['population']['interaction_case_count']==256
          assert p['population']['structural_case_count']==256
          assert p['population']['post_freeze_beacon'] is None
          assert p['population']['adaptive_case_selection'] is False
          assert p['population']['replay_for_tuning'] is False
          assert p['population']['case_replacement'] is False
          assert p['acceptance']['allowed_failed_cases']==0
          assert p['pre_beacon_frozen'] is True
          assert p['execution_authority'] is False
          assert p['terminal_results_observed']==0
          assert p['fresh_terminal_evidence_consumed']==0
          assert gate['unresolved_required_dimensions']==[]
          assert gate['candidate_visible_derived_or_oracle_ids']==[]
          assert gate['target_weakened'] is False
          verdict=receipt.get('verdict',{})
          assert verdict.get('admissible') is True
          assert verdict.get('errors')==[]
          print('DELEGATION_V2_PREBEACON_BINDING_PASS')
          PY
      - name: Run repaired combined population smoke
        run: |
          PYTHONPATH=. python -m unittest -v canonical.tests.test_delegation_feasible_plan_regression_v1
          PYTHONPATH=. python -m unittest -v canonical.tests.test_delegation_terminal_population_binding_v2
