name: Verify delegation terminal binding V2
on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/runtime/delegation_whole_scope_candidate_v2.py'
      - 'canonical/runtime/delegation_whole_scope_proof_v2.py'
      - 'canonical/runtime/delegation_structural_variety_proof_v3.py'
      - 'canonical/runtime/delegation_terminal_population_binding_v2.py'
      - 'canonical/tests/test_delegation_terminal_population_binding_v2.py'
      - 'canonical/governance/DELEGATION_TERMINAL_POPULATION_BINDING_V2.json'
      - 'canonical/governance/BEHAVIORAL_CONTRACT_REGISTRY_V1.json'
      - '.github/workflows/verify-delegation-terminal-binding-v2.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Bind exact Brain blobs
        run: |
          test "$(git hash-object canonical/runtime/delegation_whole_scope_candidate_v2.py)" = "9f2c3aa42352cba66967afb1f8a3f45357833c41"
          test "$(git hash-object canonical/runtime/delegation_whole_scope_proof_v2.py)" = "5785b07f482e38acdf7916e5414d90c2c0c305b7"
          test "$(git hash-object canonical/runtime/delegation_structural_variety_proof_v3.py)" = "f5e1f45519278ed2cafa27d23b8602b0a362a492"
          test "$(git hash-object canonical/runtime/delegation_terminal_population_binding_v2.py)" = "ad332ac188644d32aa543934638bceab89a13d6c"
          test "$(git hash-object canonical/tests/test_delegation_terminal_population_binding_v2.py)" = "7227911fecf3086436f091ee7e7f01901cdc456d"
          test "$(git hash-object canonical/governance/DELEGATION_TERMINAL_POPULATION_BINDING_V2.json)" = "2cf9657d59e7014be2f3aefd534e86f183dfc901"
          test "$(git hash-object canonical/governance/BEHAVIORAL_CONTRACT_REGISTRY_V1.json)" = "771a50d2b12f36c953903e0ec4cbe4a95cd24f84"
          test "$(git hash-object canonical/governance/GLOBAL_TERMINAL_REPLACEMENT_POPULATION_PROTOCOL_V2.json)" = "8d30bb8805be9eef5155f0f31de17dd4bc9e5d1f"
          test "$(git hash-object canonical/governance/DELEGATION_SCOPE_EQUIVALENCE_RELATION_V1.json)" = "52392515cd4de672f82f8afac82a41d3ce442656"
          test "$(git hash-object canonical/governance/DELEGATION_SCOPE_EQUIVALENT_PROOF_GATE_V2_INPUT.json)" = "b434c2ad13154f5d4f43a76cfb27d6b492e93e01"
          test "$(git hash-object canonical/verification/DELEGATION_SCOPE_GATE_V2_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json)" = "ab1d8d19217fe683b62682c8f7f2ce7800fcfe57"
          test "$(git hash-object canonical/verification/DELEGATION_WHOLE_DIMENSION_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json)" = "ae24117149e6acdcc8c4db977f8460b89480f0b2"
          test "$(git hash-object canonical/verification/DELEGATION_STRUCTURAL_VARIETY_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json)" = "c99c1fba7f006e065937b4a272d346efbbe2cb49"
      - name: Verify commitment registry mode and pre-beacon state
        run: python -c "import json,hashlib,pathlib; root=pathlib.Path('.'); p=json.loads((root/'canonical/governance/DELEGATION_TERMINAL_POPULATION_BINDING_V2.json').read_text()); reg=json.loads((root/'canonical/governance/BEHAVIORAL_CONTRACT_REGISTRY_V1.json').read_text()); c=json.dumps(p['commitment_components'],sort_keys=True,separators=(',',':'),ensure_ascii=False); assert hashlib.sha256(c.encode()).hexdigest()==p['commitment_components_sha256']; assert p['proof_mode'] in reg['terminal_acceptance_proof_modes']; assert p['population']['post_freeze_beacon'] is None; assert p['pre_beacon_frozen'] is True; assert p['execution_authority'] is False; assert p['terminal_results_observed']==0; assert p['fresh_terminal_evidence_consumed']==0"
      - name: Run combined pre-beacon development smoke
        run: PYTHONPATH=. python -m unittest -v canonical.tests.test_delegation_terminal_population_binding_v2
