name: Verify Brain Root3 zero-floor V1
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/root3_zero_floor_v1/**"
      - ".github/workflows/verify-brain-root3-zero-floor-v1.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact Brain blobs
        run: |
          cd capsules/root3_zero_floor_v1
          python - <<'PY'
          import hashlib,json,pathlib
          m=json.load(open("EXPECTED_BRAIN_BLOBS.json"))
          for p,h in m["exact_brain_blobs"].items():
              b=(pathlib.Path("brain")/p).read_bytes()
              got=hashlib.sha1(b"blob "+str(len(b)).encode()+b"\\0"+b).hexdigest()
              assert got==h,(p,got,h)
          print("exact Brain blobs PASS")
          PY
      - name: Run Brain reducer tests
        run: |
          cd capsules/root3_zero_floor_v1/brain
          export PYTHONPATH=.
          python -m pytest -q canonical/tests/test_atomic_predicate_theoretical_floor_reducer_v1.py
      - name: Run independent theorem and binding assertions
        run: |
          cd capsules/root3_zero_floor_v1
          python verify_independent.py
