name: Verify global surface dominance V4
on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/runtime/proof_route_dominance.py'
      - 'canonical/governance/GLOBAL_TERMINAL_SURFACE_DOMINANCE_INPUT_V4.json'
      - 'canonical/tests/test_global_surface_dominance_v4.py'
      - '.github/workflows/verify-global-surface-dominance-v4.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: PYTHONPATH=. python -m unittest -v canonical.tests.test_global_surface_dominance_v4
