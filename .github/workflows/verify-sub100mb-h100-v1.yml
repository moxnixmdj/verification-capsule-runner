name: Verify H100 sub-100MB guard V1

on:
  pull_request:
    paths:
      - 'subject/sub100mb_h100_v1_20261004_sol/**'
      - 'verify_sub100mb_h100_v1.py'
      - '.github/workflows/verify-sub100mb-h100-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python verify_sub100mb_h100_v1.py
