name: Verify finance inline-XBRL two-hop v1

on:
  pull_request:
    branches:
      - terminal-execution-v1
    paths:
      - 'capsules/finance_inline_xbrl_two_hop_20261009_v1/**'
      - '.github/workflows/verify-finance-inline-xbrl-two-hop-v1.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile exact candidate runtime
        working-directory: capsules/finance_inline_xbrl_two_hop_20261009_v1
        run: |
          python -m py_compile canonical/runtime/bound_capabilities/sec_inline_xbrl_fact_anchor_v1.py
          python -m py_compile canonical/runtime/sec_inline_xbrl_fact_anchor_verify_v1.py
          python -m py_compile canonical/runtime/sec_inline_xbrl_fasb_release_metadata_v1.py
          python -m py_compile canonical/runtime/sec_inline_xbrl_fasb_release_metadata_verify_v1.py
      - name: Run stacked adversarial suites
        working-directory: capsules/finance_inline_xbrl_two_hop_20261009_v1
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q             canonical/tests/test_sec_inline_xbrl_fact_anchor_v1.py             canonical/tests/test_sec_inline_xbrl_fasb_release_metadata_v1.py
