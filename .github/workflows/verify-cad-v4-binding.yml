name: Verify CAD T0 V4 post-refreeze binding
on:
  pull_request:
    branches: [main]
    paths:
      - canonical/governance/CAD_T0_CANDIDATE_FREEZE_V4.json
      - canonical/governance/CAD_T0_POST_REFREEZE_BINDING_V4.json
      - canonical/runtime/cad_t0_post_refreeze_binding_v4_validator.py
      - canonical/tests/test_cad_t0_post_refreeze_binding_v4_validator.py
      - .github/workflows/verify-cad-v4-binding.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate exact V4 dependency cone
        run: PYTHONPATH=.:canonical/runtime python canonical/runtime/cad_t0_post_refreeze_binding_v4_validator.py
      - name: Run V4 binding tests
        run: PYTHONPATH=.:canonical/runtime python -m unittest -v canonical.tests.test_cad_t0_post_refreeze_binding_v4_validator
