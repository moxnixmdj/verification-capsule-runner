name: Verify H100 tool-trace normalizer V1

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run copied subject tests
        run: python -m unittest canonical.tests.test_h100_zero_learned_tool_trace_normalizer_v1 -v
      - name: Verify exact blobs and fresh trace challenges
        run: python verify_h100_tool_trace_normalizer_v1.py
