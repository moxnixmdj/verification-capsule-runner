name: Verify LiveBench Terminal Dispatch Collapse
on:
  pull_request:
    branches:
      - main
    paths:
      - verify_livebench_terminal_dispatch_collapse.py
      - .github/workflows/verify-livebench-terminal-dispatch-collapse.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact parquet reader
        run: python -m pip install --disable-pip-version-check --quiet pyarrow==19.0.1
      - name: Recompute frozen terminal dispatch theorem
        run: python verify_livebench_terminal_dispatch_collapse.py
      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livebench-terminal-dispatch-collapse-receipt
          path: livebench_terminal_dispatch_collapse_receipt.json
          if-no-files-found: error
