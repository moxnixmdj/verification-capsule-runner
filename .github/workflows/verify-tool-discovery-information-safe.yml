name: Verify information-safe tool discovery
on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/runtime/tool_discovery_information_safe_proof.py'
      - 'canonical/runtime/tool_discovery_information_safe_candidate.py'
      - 'canonical/tests/test_tool_discovery_information_safe_proof.py'
      - '.github/workflows/verify-tool-discovery-information-safe.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact Brain blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object 'canonical/runtime/tool_discovery_information_safe_proof.py')" = '2450a9644119c9fdf9c43307a1d115098d6ba592'
          test "$(git hash-object 'canonical/runtime/tool_discovery_information_safe_candidate.py')" = '64c02edd568d95ec5ed54b7b8122183ce5b82e17'
          test "$(git hash-object 'canonical/tests/test_tool_discovery_information_safe_proof.py')" = '6719e8f2e26dfb16a0aa79cf4c5a7777a669bc4d'
      - name: Execute hidden-capability tool discovery tests
        run: python -m unittest -v canonical.tests.test_tool_discovery_information_safe_proof
