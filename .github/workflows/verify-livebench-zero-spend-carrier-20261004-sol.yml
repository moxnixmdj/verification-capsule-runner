name: Verify LiveBench zero-spend public carrier
on:
  pull_request:
    paths:
      - 'subject/livebench_zero_spend_carrier_20261004_sol/**'
      - 'verify_livebench_zero_spend_carrier_20261004_sol.py'
      - '.github/workflows/verify-livebench-zero-spend-carrier-20261004-sol.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      RUNNER_ENVIRONMENT: "${{ runner.environment }}"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python verify_livebench_zero_spend_carrier_20261004_sol.py
