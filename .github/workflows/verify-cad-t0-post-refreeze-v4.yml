name: Verify CAD T0 post-refreeze binding V4
on:
  pull_request:
    paths:
      - "capsules/cad_t0_post_refreeze_v4/**"
      - ".github/workflows/verify-cad-t0-post-refreeze-v4.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bind exact Brain blobs
        run: |
          set -euo pipefail
          test "$(git hash-object capsules/cad_t0_post_refreeze_v4/canonical/governance/CAD_T0_CANDIDATE_FREEZE_V4.json)" = "37b4286ddd927da316b59c764f65f542f8a774b9"
          test "$(git hash-object capsules/cad_t0_post_refreeze_v4/canonical/governance/CAD_T0_POST_REFREEZE_BINDING_V4.json)" = "c83d6472af9c623c260054f7f039242df93188cd"
          test "$(git hash-object capsules/cad_t0_post_refreeze_v4/canonical/runtime/cad_t0_post_refreeze_binding_v4_validator.py)" = "85337648de81884da3c94408e45de60a8fbfb2c5"
          test "$(git hash-object capsules/cad_t0_post_refreeze_v4/canonical/tests/test_cad_t0_post_refreeze_binding_v4_validator.py)" = "54e8fee3801d7697dcf43d6bdc88644524ffa7a7"
          test "$(git hash-object capsules/cad_t0_post_refreeze_v4/canonical/runtime/cad_t0_route_specific_candidate_v1.py)" = "aa32750b220a023617938b7be9476f6b3aac6704"
          test "$(git hash-object capsules/cad_t0_post_refreeze_v4/canonical/tests/test_cad_t0_route_specific_candidate_v1.py)" = "6fa98b0fd04f86097cbd77f8657ba472e5d6b6dd"
          test "$(git hash-object capsules/cad_t0_post_refreeze_v4/canonical/tests/test_cad_t0_source_structure_antishortcut_repair_v1.py)" = "8222cf83a7476cd453e06865b8e3aaff8a70b5db"
          test "$(git hash-object capsules/cad_t0_post_refreeze_v4/canonical/verification/CURRENT_EXECUTOR_SNAPSHOT_V3_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json)" = "f8aac465750ab4b2618e470e163207ddcc6ac272"
          test "$(git hash-object capsules/cad_t0_post_refreeze_v4/canonical/runtime/m1b_continuous_geometry_compiler.py)" = "0c7c6355cde87c961319d6f9948839cb56add092"
          test "$(git hash-object capsules/cad_t0_post_refreeze_v4/canonical/runtime/m1b_smooth_surface_compiler.py)" = "bd3824847f400e8088dc25a83674579f99345a30"
          test "$(git hash-object capsules/cad_t0_post_refreeze_v4/canonical/runtime/cad_partspec_generator.py)" = "89b4250fa85df8d02d51bcb513f035d102625056"
          test "$(git hash-object capsules/cad_t0_post_refreeze_v4/canonical/runtime/cad_t0_geometry_population.py)" = "64ca276410e2c1dbcd55cfad057e3eec0709790a"
          test "$(git hash-object capsules/cad_t0_post_refreeze_v4/canonical/runtime/cad_t0_oracle_adapter.py)" = "a6e76e1865b9bd9829dbbcf38886486636f76e8a"
          test "$(git hash-object capsules/cad_t0_post_refreeze_v4/canonical/runtime/cad_t0_multiplex_scorer.py)" = "89833581dc4ac67498753feb94e2ff69bad3b7f1"
          test "$(git hash-object capsules/cad_t0_post_refreeze_v4/canonical/governance/CAD_ACTIVE_CONTRACT_END_TO_END_PROOF_ROUTE_V1.json)" = "c0f55a55091186c5ab785b670f935bbc6a2f9432"
          test "$(git hash-object capsules/cad_t0_post_refreeze_v4/canonical/governance/CAD_T0_EVALUATOR_OBSERVATION_SCHEMA_V1.json)" = "2bc87504a54c76003f715be9a52c6e635c8991a6"
      - name: Validate exact V4 binding
        working-directory: capsules/cad_t0_post_refreeze_v4
        run: |
          set -euo pipefail
          touch canonical/__init__.py canonical/runtime/__init__.py canonical/tests/__init__.py
          PYTHONPATH=. python -m unittest -v canonical.tests.test_cad_t0_post_refreeze_binding_v4_validator
          python canonical/runtime/cad_t0_post_refreeze_binding_v4_validator.py .
