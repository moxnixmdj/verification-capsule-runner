name: Verify SA-CCR information-safe terminal proof
on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/runtime/saccr_credit_information_safe_candidate.py'
      - 'canonical/runtime/saccr_credit_information_safe_proof.py'
      - 'canonical/tests/test_saccr_credit_information_safe.py'
      - '.github/workflows/verify-saccr-credit-information-safe.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact information boundary, independent lineage oracle, and 2000-case grid
        run: PYTHONPATH=. python -m unittest -v canonical.tests.test_saccr_credit_information_safe
