name: Verify TB4 attainability cut V1
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/verify-tb4-attainability-cut-v1.yml'
      - 'candidate/tb4_attainability_v1/**'
permissions:
  contents: read
  pull-requests: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Replay attainability cut and residual
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util,json,pathlib
          root=pathlib.Path('candidate/tb4_attainability_v1')
          spec=importlib.util.spec_from_file_location('cut',root/'runtime.py')
          cut=importlib.util.module_from_spec(spec); spec.loader.exec_module(cut)
          manifest=json.loads((root/'manifest.json').read_text())
          out=cut.evaluate(manifest)
          assert out['pass'] is True,out
          assert out['hardware_incompatible_task_count']==12,out
          assert out['irreversibly_zero_hardware_compatible_task_count']==18,out
          assert out['remaining_creditable_task_count']==36,out
          assert out['upper_bound_successes']==180,out
          assert out['required_successes']==220,out
          assert out['attainability_state']=='IMPOSSIBLE',out
          assert out['reality_execution_authorized'] is False,out

          base=pathlib.Path('candidate/tb4_v6')
          spec2=importlib.util.spec_from_file_location('residual',base/'runtime.py')
          residual=importlib.util.module_from_spec(spec2); spec2.loader.exec_module(residual)
          load=lambda p:json.loads(pathlib.Path(p).read_text())
          rout=residual.evaluate(load(base/'registry.json'),load(base/'evidence.json'),load(base/'comparator.json'),load(root/'readiness.json'))
          assert rout['receipt_saturation_complete'] is True,rout
          assert rout['predicate_count']==38,rout
          assert rout['proved_predicate_count']==7,rout
          assert rout['open_predicate_count']==0,rout
          assert rout['blocked_predicate_count']==31,rout
          tb=[x for x in rout['predicates'] if x['predicate_id']=='CODING_TB4_GE_66_4']
          assert len(tb)==1 and tb[0]['state']=='EXTERNAL_BLOCKED',tb
          assert not [a for a in rout.get('authorized_actions',[]) if a.get('predicate_id')=='CODING_TB4_GE_66_4'],rout.get('authorized_actions')

          summary={'schema':'PROJECT_BRAIN_TB4_ATTAINABILITY_CUT_PUBLIC_VERIFICATION_V1','upper_bound_successes':180,'required_successes':220,'attainability_state':'IMPOSSIBLE','proved':7,'open':0,'blocked':31,'tb4_state':'EXTERNAL_BLOCKED','tb4_execution_authorized':False,'fresh_acceptance_cases_consumed':0,'incremental_spend_usd':0}
          pathlib.Path('/tmp/comment.md').write_text('TB4_ATTAINABILITY_CUT_V1\n\n```json\n'+json.dumps(summary,sort_keys=True)+'\n```\n')
          print(json.dumps(summary,indent=2,sort_keys=True))
          PY
          gh pr comment "$PR_NUMBER" --repo moxnixmdj/verification-capsule-runner --body-file /tmp/comment.md
