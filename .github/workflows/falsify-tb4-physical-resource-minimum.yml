name: Audit TB4 Docker resource-limit semantics

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/falsify-tb4-physical-resource-minimum.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Freeze exact public sources
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/harbor-framework/terminal-bench.git /tmp/tb4
          git -C /tmp/tb4 checkout -q 1dcda8716784493721921c23e4bc7f7d988b4494
          test "$(git -C /tmp/tb4 rev-parse HEAD)" = "1dcda8716784493721921c23e4bc7f7d988b4494"
          git clone -q https://github.com/harbor-framework/harbor.git /tmp/harbor
          git -C /tmp/harbor checkout -q v0.20.0
          git -C /tmp/harbor rev-parse HEAD > /tmp/harbor-head.txt

      - name: Verify Harbor v0.20.0 limit semantics and exact TB4 resource rows
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, tomllib
          harbor = pathlib.Path('/tmp/harbor/src/harbor/environments/docker/docker.py').read_text(encoding='utf-8')
          base = pathlib.Path('/tmp/harbor/src/harbor/environments/base.py').read_text(encoding='utf-8')
          for literal in (
              'EnvironmentResourceCapabilities(cpu_limit=True, memory_limit=True)',
              'cpu_limit=self._resource_limit_value("cpu", auto_mode=ResourceMode.LIMIT)',
              '"memory", auto_mode=ResourceMode.LIMIT',
          ):
              assert literal in harbor, literal
          assert 'if self._resource_mode(resource) == ResourceMode.IGNORE:' in base
          assert 'return None' in base

          expected = {
              'distributed-dedup': (8,16384,15000,0),
              'formal-crypto': (8,4096,10240,0),
              'fp8-rmsnorm-gemm': (4,16384,30720,1),
              'jax-speedrun-gpu': (16,32768,1024000,1),
              'lake-temp-glm': (8,8192,20480,0),
              'live-database-cutover': (16,16384,20480,0),
              'math-eval-grader': (8,16384,30720,1),
              'medical-claims-processing': (2,16384,20480,0),
              'shadow-relay': (8,4096,10240,0),
              'takens-embedding-lean': (4,16384,51200,0),
              'uefi-bootkit': (2,16384,10240,0),
              'wdm-design': (8,16384,10240,0),
          }
          rows={}
          for task, exp in expected.items():
              p=pathlib.Path('/tmp/tb4/tasks')/task/'task.toml'
              data=tomllib.loads(p.read_text(encoding='utf-8'))
              env=data.get('environment') or {}
              got=(int(env.get('cpus') or 0),int(env.get('memory_mb') or 0),
                   int(env.get('storage_mb') or 0),int(env.get('gpus') or 0))
              assert got==exp,(task,got,exp)
              rows[task]={'cpus':got[0],'memory_mb':got[1],'storage_mb':got[2],'gpus':got[3]}
          out={
              'schema':'PROJECT_BRAIN_TB4_DOCKER_RESOURCE_LIMIT_SEMANTICS_AUDIT_V2',
              'tb4_commit':'1dcda8716784493721921c23e4bc7f7d988b4494',
              'harbor_tag':'v0.20.0',
              'harbor_commit':pathlib.Path('/tmp/harbor-head.txt').read_text().strip(),
              'harbor_docker_semantics':{'cpu':'LIMIT','memory':'LIMIT','ignore_mode_omits_value':True},
              'resource_rows':rows,
              'task_instruction_files_read':0,
              'solution_files_read':0,
              'verifier_files_read':0,
              'fresh_acceptance_case_executions':0,
              'acceptance_credit_delta':0,
              'family_credit_delta':0,
              'execution_authority':False,
          }
          pathlib.Path('/tmp/audit.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          PY

      - name: Probe CPU and memory limits independently
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            docker rm -f pb-cpu-over pb-memory-over >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker pull -q alpine:3.21 >/dev/null

          HOST_CPUS="$(nproc)"
          HOST_MEM_MIB="$(awk '/MemTotal:/ {print int($2/1024)}' /proc/meminfo)"
          HOST_FREE_MIB="$(df -Pm / | awk 'NR==2 {print $4}')"

          set +e
          CPU_ERR="$(docker create --name pb-cpu-over --cpus=8 --memory=4096m alpine:3.21 sh -c 'sleep 60' 2>&1)"
          CPU_RC=$?
          set -e
          docker rm -f pb-cpu-over >/dev/null 2>&1 || true

          set +e
          MEM_ERR="$(docker create --name pb-memory-over --cpus=4 --memory=16384m alpine:3.21 sh -c 'sleep 60' 2>&1)"
          MEM_RC=$?
          set -e

          MEM_STARTED=false
          MEM_BYTES=0
          if [ "$MEM_RC" -eq 0 ]; then
            MEM_BYTES="$(docker inspect -f '{{.HostConfig.Memory}}' pb-memory-over)"
            docker start pb-memory-over >/dev/null
            sleep 1
            if [ "$(docker inspect -f '{{.State.Running}}' pb-memory-over)" = "true" ]; then
              MEM_STARTED=true
            fi
          fi

          HOST_CPUS="$HOST_CPUS" HOST_MEM_MIB="$HOST_MEM_MIB" HOST_FREE_MIB="$HOST_FREE_MIB"           CPU_RC="$CPU_RC" CPU_ERR="$CPU_ERR" MEM_RC="$MEM_RC" MEM_ERR="$MEM_ERR"           MEM_STARTED="$MEM_STARTED" MEM_BYTES="$MEM_BYTES" python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path('/tmp/audit.json'); d=json.loads(p.read_text())
          d['observed_host']={
              'physical_cpus':int(os.environ['HOST_CPUS']),
              'mem_total_mib':int(os.environ['HOST_MEM_MIB']),
              'free_storage_mib':int(os.environ['HOST_FREE_MIB']),
          }
          d['docker_probes']={
              'cpu_limit_8_on_4cpu_host':{
                  'returncode':int(os.environ['CPU_RC']),
                  'accepted':int(os.environ['CPU_RC'])==0,
                  'stderr':os.environ['CPU_ERR'][-500:],
              },
              'memory_limit_16384m_with_cpu4':{
                  'returncode':int(os.environ['MEM_RC']),
                  'accepted':int(os.environ['MEM_RC'])==0,
                  'container_started':os.environ['MEM_STARTED']=='true',
                  'docker_memory_bytes':int(os.environ['MEM_BYTES']),
                  'stderr':os.environ['MEM_ERR'][-500:],
              },
          }
          assert d['observed_host']['physical_cpus']==4,d
          assert d['docker_probes']['cpu_limit_8_on_4cpu_host']['accepted'] is False,d
          memory_ok=d['docker_probes']['memory_limit_16384m_with_cpu4']['accepted'] and d['docker_probes']['memory_limit_16384m_with_cpu4']['container_started']
          d['conclusions']={
              'cpu_limit_above_host_is_constructible':False,
              'old_cpu_resource_exceed_inference_falsified':False,
              'memory_limit_16384m_above_reported_memtotal_is_constructible':memory_ok,
              'strictly_lower_resource_override_remains_to_be_adjudicated_for_protocol_comparability':True,
          }
          cpu_blocked=[k for k,v in d['resource_rows'].items() if v['gpus']==0 and v['cpus']>4]
          memory_only=[k for k,v in d['resource_rows'].items() if v['gpus']==0 and v['cpus']<=4 and v['memory_mb']>d['observed_host']['mem_total_mib']]
          d['classification']={
              'cpu_limit_blocked_non_gpu_tasks':sorted(cpu_blocked),
              'memory_only_metadata_exceed_tasks':sorted(memory_only),
              'memory_only_environment_constructibility': 'GENERIC_LIMIT_ACCEPTED__EXACT_TASK_BOOT_STILL_REQUIRED' if memory_ok else 'GENERIC_LIMIT_REJECTED',
              'gpu_tasks':sorted(k for k,v in d['resource_rows'].items() if v['gpus']>0),
          }
          p.write_text(json.dumps(d,indent=2,sort_keys=True)+'\n')
          print(json.dumps(d,indent=2,sort_keys=True))
          PY

      - name: Assert zero-exposure result
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/audit.json'))
          assert d['task_instruction_files_read']==0
          assert d['solution_files_read']==0
          assert d['verifier_files_read']==0
          assert d['fresh_acceptance_case_executions']==0
          assert d['acceptance_credit_delta']==0
          assert d['execution_authority'] is False
          print('PASS__TB4_DOCKER_RESOURCE_LIMIT_SEMANTICS_AUDITED__ZERO_CASES')
          PY
