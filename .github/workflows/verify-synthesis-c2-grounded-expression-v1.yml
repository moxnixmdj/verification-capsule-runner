name: Verify synthesis C2 grounded expression V1
on:
  pull_request:
    branches:
      - main
    paths:
      - "capsules/synthesis_c2_grounded_expression_v1/**"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact content-addressed mirrors
        run: |
          set -euo pipefail
          cd capsules/synthesis_c2_grounded_expression_v1
          python - <<'PY'
          import json, subprocess
          m=json.load(open("manifest.json"))
          for path, expected in m["exact_blobs"].items():
              got=subprocess.check_output(["git","hash-object",path],text=True).strip()
              assert got==expected,(path,expected,got)
          assert m["new_reality_units_consumed"]==0
          assert m["terminal_cases_consumed"]==0
          print("EXACT_C2_INPUT_BLOBS_PASS",len(m["exact_blobs"]))
          PY
      - name: Run committed adversarial C2 tests
        run: |
          set -euo pipefail
          cd capsules/synthesis_c2_grounded_expression_v1
          PYTHONPATH=. python -m unittest -v canonical.tests.test_synthesis_grounded_expression_ir_v1
      - name: Verify governance zero-credit boundary
        run: |
          set -euo pipefail
          cd capsules/synthesis_c2_grounded_expression_v1
          python - <<'PY'
          import json
          p="canonical/governance/SYNTHESIS_C2_GROUNDED_EXPRESSION_BOUNDED_ROUTE_20261005_V1.json"
          x=json.load(open(p))
          a=x["accounting"]
          for k in (
              "incremental_spend_usd","new_reality_units_consumed","terminal_cases_consumed",
              "acceptance_credit_delta","family_credit_delta","capability_credit_delta","ownership_credit_delta"
          ):
              assert a[k]==0,(k,a[k])
          assert x["scheduling_authority"] is False
          assert x["execution_authority"] is False
          assert x["promotion_authority"] is False
          assert x["fresh_reality_authority"] is False
          assert x["independent_verification_required"] is True
          print("C2_ZERO_CREDIT_BOUNDARY_PASS")
          PY
