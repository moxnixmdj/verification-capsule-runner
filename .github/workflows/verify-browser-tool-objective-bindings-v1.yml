name: Verify Browser and Tool objective bindings
on:
  pull_request:
    branches: [main]
    paths:
      - 'capsules/browser_tool_objective_v1/**'
      - '.github/workflows/verify-browser-tool-objective-bindings-v1.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify Browser T2 objective binding
        working-directory: capsules/browser_tool_objective_v1
        run: |
          PYTHONPATH=. python -m unittest -v canonical.tests.test_browser_t2_objective_binding_validator
          PYTHONPATH=. python canonical/runtime/browser_t2_objective_binding_validator.py .
      - name: Verify Tool Discovery T2 T3 objective binding
        working-directory: capsules/browser_tool_objective_v1
        run: |
          PYTHONPATH=. python -m unittest -v canonical.tests.test_tool_discovery_t2_t3_objective_binding_validator
          PYTHONPATH=. python canonical/runtime/tool_discovery_t2_t3_objective_binding_validator.py .
