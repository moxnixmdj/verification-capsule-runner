name: Verify Brain frontier reconciliation 1078
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/brain_frontier_reconciliation_1078/**"
      - ".github/workflows/verify-brain-frontier-reconciliation-1078.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Verify exact reconciliation and invariants
        run: |
          cd capsules/brain_frontier_reconciliation_1078
          python - <<'PY'
          import hashlib,json,pathlib
          L=lambda p: json.loads(pathlib.Path(p).read_text())
          m=L("EXPECTED_BLOBS.json")
          for src,expected in m["exact_blobs"].items():
              data=pathlib.Path(src).read_bytes()
              got=hashlib.sha1(f"blob {len(data)}\0".encode()+data).hexdigest()
              assert got==expected,(src,got,expected)
          h=L("canonical/governance/ACTIVE_GOAL_HIERARCHY_V1.json")
          u=L("canonical/governance/RESIDUAL_ACTION_UNIVERSE_V2.json")
          p=L("canonical/CANONICAL_POINTER.json")
          s=L("canonical/governance/REAL_OUTPUT_SCOREBOARD_V1.json")
          q=L("canonical/capabilities/FRONTIER_CAPABILITY_OBSOLESCENCE_QUEUE_V1.json")
          t=L("canonical/capabilities/frontier/OPUS_5_5_USEFUL_CAPABILITY_OWNERSHIP_V1.json")
          i=L("canonical/action_intents/2026-10-02_RECONCILE_CURRENT_TERMINAL_PROOF_FRONTIER_V2.json")
          v=L("canonical/governance/RESIDUAL_MINIMUM_REALITY_CUT_VERDICT_V6.json")
          b=h["current_parent_blocker"]; n=h["next_required_action_class"]; prog=h["next_progress_event_target"]; target=h["active_capability_target"]; program=h["active_program"]
          af=s["active_frontier_accounting"]; ru=h["residual_action_universe_v2"]
          assert p["current_frontier"]["active_capability_target"]==target
          assert p["current_frontier"]["critical_blocker"]==b and p["current_frontier"]["highest_leverage_capability_gap"]==b and p["current_frontier"]["next_step"]==n and p["current_frontier"]["program"]==program
          assert af["parent_frontier_capability"]==target and af["residual_gap"]==b and af["current_parent_blocker"]==b and af["next_required_action"]==n
          assert s["next_required_action"]==n and s["next_progress_event_target"]==prog
          assert q["immediate_frontier"]["selected_capability"]==target and q["immediate_frontier"]["exact_blocker"]==b and q["immediate_frontier"]["next_action"]==n
          assert t["capability_id"]==target and t["residual_gap"]==b and t["next_action"]==n
          assert t["acceptance_truth"]=={"accepted_families":2,"total_families":19,"proved_atomic_predicates":7,"unresolved_atomic_predicates":31,"total_atomic_predicates":38,"achieved":False}
          assert ru["status"]==u["status"] and ru["exact_cut_ready"]==u["exact_cut_ready"] and ru["blocking_obligations"]==u["blocking_obligations"]==[]
          assert ru["exact_cut_ready"] is True
          assert h["execution_latency_control"]["status"]=="ACTIVE" and p["boot_requirements"]["atomic_frontier_transaction_required"] is True
          assert v["status"].startswith("VERIFIED_EXACT_MINIMUM") and v["observation_count"]==2 and v["total_cost"]==2
          assert i["canonical_base_commit"]=="856ffbaf125381c57d0dff22ecdfa605026de749"
          assert i["action_kind"]=="RECONCILE_FRONTIER" and i["highest_leverage_now"] is True and i["weakens_existing_guard"] is False
          assert i["capability_target"]==target and i["terminal_objective"]==h["terminal_objective"] and i["active_program"]==program
          assert i["recursive_obs"]["route_frontier"]["discovery_required"] is False
          print("FRONTIER_RECONCILIATION_1078_EXACT_PASS")
          PY
