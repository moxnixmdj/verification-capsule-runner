name: Verify public source federation executor V1
on:
  push:
    branches:
      - verify/public-source-federation-executor-v1-20261003
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python verify_public_source_federation_executor_v1.py
