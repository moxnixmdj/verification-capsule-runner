name: Verify Unknown-Domain V3 successor V1
on:
  push:
    branches:
      - 'verify/unknown-domain-v3-successor-20261005-sol'
    paths:
      - 'capsules/unknown-domain-v3/**'
      - 'verify_unknown_domain_v3_successor_v1.py'
      - '.github/workflows/verify-unknown-domain-v3-successor-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact bytes and static information boundary
        run: python verify_unknown_domain_v3_successor_v1.py
      - name: Run V3 falsification suite
        env:
          PYTHONPATH: capsules/unknown-domain-v3
        run: python -m unittest canonical.tests.test_unknown_domain_direct_v3_successor -v
