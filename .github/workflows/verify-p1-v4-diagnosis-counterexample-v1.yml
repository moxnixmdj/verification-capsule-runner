name: Verify P1 V4 diagnosis counterexample v1

on:
  pull_request:
    paths:
      - "capsules/p1_v4_diagnosis_counterexample_v1/**"
      - ".github/workflows/verify-p1-v4-diagnosis-counterexample-v1.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact Brain blobs
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          root=Path("capsules/p1_v4_diagnosis_counterexample_v1")
          expected={
            "canonical/runtime/p1_composite_proof_role_verifier_v1.py":"8c19c94413ac4a4fbabaabc4253c2ff53275dd18",
            "canonical/tests/test_p1_composite_proof_role_verifier_v1.py":"b7a03a08cbba9086ec3cf7ca2936680fe4bb1358",
            "canonical/governance/P1_COMPOSITE_PROOF_ROLE_RECONCILIATION_V1.json":"1da223b8133e83d3ba1b238012593b39dcae91f9",
            "canonical/governance/P1_TRAJECTORY_T0_T2_MULTIPLEX_TERMINAL_BINDING_V1.json":"8703c6aa08227467a619a7ae90d0d61f8e54da39",
            "canonical/verification/TRAJECTORY_TYPED_IR_V4_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json":"ee69a93c45a2b16676c49bfb0a01749a5c4ea1e2",
            "canonical/runtime/trajectory_failure_typed_ir_candidate_v4.py":"0c386e6b78a8e97e9c1944e63600047bc4e2849b",
            "canonical/runtime/trajectory_failure_typed_ir_proof_v4.py":"6e1dfaa6b63fc629d55d07b2361bf625f11a5ce3",
            "canonical/tests/test_trajectory_failure_typed_ir_v4.py":"70a224fec7341775e46bb1bfb8bd2d33b3c355b3",
            "canonical/runtime/p1_terminal_execution_scope_audit_v1.py":"6793cc98fa8ef767cb6ec8fdd33d8e7d50b2833d",
            "canonical/governance/TERMINAL_PARENT_PORTFOLIO_RUNNER_BINDING_V1.json":"a1630299d29ea9c07e55b4314c07ddb3228c3287",
            "canonical/runtime/terminal_parent_portfolio_runner_v1.py":"431b62e503a6a179f19339ae5e0ab6948424a650",
            "canonical/runtime/contract_native_proof_suites.py":"0210790c7dd705ef328e1b55d529a30c5c6c3337",
            "canonical/verification/TERMINAL_V3_ONE_SHOT_WAVE_RESULT_20261002_V1.json":"bd86b4c53992b47a4a60b64a60ba03db9a442cfc",
            "canonical/governance/P1_TERMINAL_EXECUTION_SCOPE_MISMATCH_QUARANTINE_V1.json":"f4fe68c78ccdf5392b5e24519ae9a57e620221a7",
          }
          for rel,want in expected.items():
            data=(root/rel).read_bytes()
            got=hashlib.sha1(b"blob "+str(len(data)).encode()+b"\0"+data).hexdigest()
            assert got==want,(rel,got,want)
          print("exact mirrored blobs:",len(expected))
          PY
      - name: Run fail-closed P1 composite verifier tests
        working-directory: capsules/p1_v4_diagnosis_counterexample_v1
        run: python -m unittest canonical.tests.test_p1_composite_proof_role_verifier_v1 -v
