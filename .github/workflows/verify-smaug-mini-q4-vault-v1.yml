name: Verify Smaug Mini Q4 Vault V1

on:
  workflow_run:
    workflows: ["Internalize Smaug Mini Q4 V1"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: brain-capability-vault-smaug-mini-q4-verify-v1
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: brain-capability-smaug-mini-q4-k-m-v1
      EXPECTED_SOURCE_REPO: prithivMLmods/Smaug-Mini-GGUF
      EXPECTED_SOURCE_REV: 72e19c6d6302bbb3610e966d58eb2ddcbd62c524
      EXPECTED_SOURCE_FILE: Smaug-Mini.Q4_K_M.gguf
      EXPECTED_SHA256: 2fa6ef34b67820d21ce0819a8dc66c80f8fb1f33d6d8b9fca3c9bb84e39d8ac1
      EXPECTED_BYTES: '16547400480'
    steps:
      - uses: actions/checkout@v4

      - name: Independent streamed reconstruction verification
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          export work
          trap 'rm -rf "$work"' EXIT

          gh release view "$TAG" --json tagName,isDraft,url,assets > "$work/release.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          j=json.loads((Path(os.environ["work"])/"release.json").read_text())
          assert j["tagName"] == os.environ["TAG"]
          assert j["isDraft"] is False
          PY

          gh release download "$TAG" --pattern SOURCE_MANIFEST.txt --pattern CHUNKS_SHA256.tsv --dir "$work"

          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess

          root=pathlib.Path(os.environ["work"])
          tag=os.environ["TAG"]
          repo=os.environ["GITHUB_REPOSITORY"]

          manifest={}
          for raw in (root/"SOURCE_MANIFEST.txt").read_text(encoding="utf-8").splitlines():
              if "=" in raw:
                  k,v=raw.split("=",1)
                  manifest[k.strip()]=v.strip()

          expected={
              "source_repository": os.environ["EXPECTED_SOURCE_REPO"],
              "source_revision": os.environ["EXPECTED_SOURCE_REV"],
              "source_file": os.environ["EXPECTED_SOURCE_FILE"],
              "source_sha256": os.environ["EXPECTED_SHA256"],
              "source_bytes": os.environ["EXPECTED_BYTES"],
              "quantization": "Q4_K_M",
              "incremental_spend_usd": "0",
              "acceptance_credit": "0",
              "capability_credit": "0",
          }
          for k,v in expected.items():
              if manifest.get(k) != v:
                  raise SystemExit(f"MANIFEST_BINDING_MISMATCH:{k}:{manifest.get(k)!r}!={v!r}")

          rows=[]
          for line in (root/"CHUNKS_SHA256.tsv").read_text(encoding="utf-8").splitlines():
              if not line.strip():
                  continue
              parts=line.split("\t")
              if len(parts) != 3:
                  raise SystemExit(f"INVALID_CHUNK_MANIFEST_ROW:{line!r}")
              name,size,sha=parts
              rows.append((name,int(size),sha.lower()))

          if not rows:
              raise SystemExit("EMPTY_CHUNK_MANIFEST")
          names=[r[0] for r in rows]
          if names != sorted(names):
              raise SystemExit("CHUNK_ORDER_NOT_LEXICAL")
          if len(names) != len(set(names)):
              raise SystemExit("DUPLICATE_CHUNK_NAME")

          whole=hashlib.sha256()
          total=0
          verified=[]
          for name,expected_size,expected_sha in rows:
              target=root/name
              subprocess.run(
                  ["gh","release","download",tag,"--repo",repo,"--pattern",name,"--dir",str(root)],
                  check=True,
              )
              if not target.is_file():
                  raise SystemExit(f"CHUNK_MISSING:{name}")
              observed_size=target.stat().st_size
              if observed_size != expected_size:
                  raise SystemExit(f"CHUNK_SIZE_MISMATCH:{name}:{observed_size}!={expected_size}")
              chunk_hash=hashlib.sha256()
              with target.open("rb") as f:
                  for block in iter(lambda:f.read(8*1024*1024),b""):
                      chunk_hash.update(block)
                      whole.update(block)
                      total += len(block)
              observed_sha=chunk_hash.hexdigest()
              if observed_sha != expected_sha:
                  raise SystemExit(f"CHUNK_SHA256_MISMATCH:{name}:{observed_sha}!={expected_sha}")
              verified.append({"name":name,"bytes":observed_size,"sha256":observed_sha})
              target.unlink()

          whole_sha=whole.hexdigest()
          if total != int(os.environ["EXPECTED_BYTES"]):
              raise SystemExit(f"WHOLE_SIZE_MISMATCH:{total}!={os.environ['EXPECTED_BYTES']}")
          if whole_sha != os.environ["EXPECTED_SHA256"]:
              raise SystemExit(f"WHOLE_SHA256_MISMATCH:{whole_sha}!={os.environ['EXPECTED_SHA256']}")

          receipt={
              "schema":"PROJECT_BRAIN_SMAUG_MINI_Q4_VAULT_INDEPENDENT_RECONSTRUCTION_RECEIPT_V1",
              "status":"PASS",
              "carrier_repository":repo,
              "release_tag":tag,
              "source_repository":os.environ["EXPECTED_SOURCE_REPO"],
              "source_revision":os.environ["EXPECTED_SOURCE_REV"],
              "source_file":os.environ["EXPECTED_SOURCE_FILE"],
              "source_bytes":total,
              "source_sha256":whole_sha,
              "verified_chunk_count":len(verified),
              "chunk_hashes_exact":True,
              "whole_reconstruction_hash_exact":True,
              "streaming_verification":True,
              "full_source_never_required_on_disk":True,
              "incremental_spend_usd":0,
              "acceptance_credit_delta":0,
              "capability_credit_delta":0,
              "ownership_statement":"EXACT_Q4_CAPABILITY_BYTES_ARE_DURABLY_RECONSTRUCTABLE_FROM_BRAIN_CONTROLLED_RELEASE_ASSETS_IF_THIS_RECEIPT_IS_PRESENT_ON_THE_PUBLISHED_RELEASE",
              "hard_nonclaim":"BYTE_OWNERSHIP_DOES_NOT_PROVE_THE_Q4_EXECUTION_SUBJECT_PRESERVES_SMAUG_MINI_SEMANTIC_OR_BENCHMARK_PERFORMANCE",
          }
          out=root/"SMAUG_MINI_Q4_VAULT_INDEPENDENT_VERIFY_RECEIPT_V1.json"
          out.write_text(json.dumps(receipt,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          print(json.dumps(receipt,indent=2,sort_keys=True))
          PY

          gh release upload "$TAG" "$work/SMAUG_MINI_Q4_VAULT_INDEPENDENT_VERIFY_RECEIPT_V1.json" --clobber

      - name: Re-fetch receipt from release
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          gh release download "$TAG" --pattern SMAUG_MINI_Q4_VAULT_INDEPENDENT_VERIFY_RECEIPT_V1.json --dir "$work"
          python - "$work/SMAUG_MINI_Q4_VAULT_INDEPENDENT_VERIFY_RECEIPT_V1.json" <<'PY'
          import json,sys
          j=json.load(open(sys.argv[1],encoding="utf-8"))
          assert j["status"] == "PASS"
          assert j["chunk_hashes_exact"] is True
          assert j["whole_reconstruction_hash_exact"] is True
          print("independent_q4_vault_reconstruction=PASS")
          print("semantic_qualification=pending")
          PY
