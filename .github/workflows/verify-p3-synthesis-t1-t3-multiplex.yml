name: Verify P3 synthesis T1 T3 multiplex binding
on:
  pull_request:
    branches: [main]
    paths:
      - capsules/p3_synthesis_t1_t3/**
      - .github/workflows/verify-p3-synthesis-t1-t3-multiplex.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: cd capsules/p3_synthesis_t1_t3 && PYTHONPATH=. python -m unittest -v canonical.tests.test_p3_synthesis_t1_t3_multiplex_preflight test_brain_blob_binding
