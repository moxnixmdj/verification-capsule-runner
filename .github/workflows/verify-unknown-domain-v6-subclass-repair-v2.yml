name: Verify Unknown-Domain V6 subclass repair V2

on:
  pull_request:
    branches: [main]
    paths:
      - "subject/unknown_domain_v6_subclass_repair_v2_20261005/**"
      - "verify_unknown_domain_v6_subclass_repair_v1.py"
      - ".github/workflows/verify-unknown-domain-v6-subclass-repair-v2.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install verifier dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run exact vendored regression suite
        run: |
          python -m pytest -q subject/unknown_domain_v6_subclass_repair_v2_20261005/canonical/tests/test_unknown_domain_direct_v5.py
      - name: Run independent subclass-totality verifier
        run: python verify_unknown_domain_v6_subclass_repair_v1.py
      - name: Print receipt
        if: always()
        run: |
          if test -f unknown_domain_v6_subclass_repair_v1_verification.json; then
            cat unknown_domain_v6_subclass_repair_v1_verification.json
          fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unknown-domain-v6-subclass-repair-v2-py${{ matrix.python-version }}
          path: unknown_domain_v6_subclass_repair_v1_verification.json
          if-no-files-found: error
