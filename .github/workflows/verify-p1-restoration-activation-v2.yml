name: Verify P1 restoration activation v2

on:
  push:
    paths:
      - "verify_p1_restoration_activation_v2.py"
      - "canonical/governance/P1_COMPOSITE_PROOF_RESTORATION_ACTIVATION_V2.json"
      - "canonical/verification/P1_COMPOSITE_PROOF_READJUDICATION_PUBLIC_RUNNER_VERIFICATION_20261002_V2.json"
      - "canonical/tests/test_p1_composite_proof_restoration_activation_v2.py"
      - ".github/workflows/verify-p1-restoration-activation-v2.yml"
  pull_request:
    paths:
      - "verify_p1_restoration_activation_v2.py"
      - "canonical/governance/P1_COMPOSITE_PROOF_RESTORATION_ACTIVATION_V2.json"
      - "canonical/verification/P1_COMPOSITE_PROOF_READJUDICATION_PUBLIC_RUNNER_VERIFICATION_20261002_V2.json"
      - "canonical/tests/test_p1_composite_proof_restoration_activation_v2.py"
      - ".github/workflows/verify-p1-restoration-activation-v2.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact whole-P1 restoration proof join
        run: python verify_p1_restoration_activation_v2.py
