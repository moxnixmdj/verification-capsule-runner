name: Verify five direct route terminal executors

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Unit contract checks
        run: PYTHONPATH=. python -m unittest -v canonical.tests.test_direct_route_terminal_executors_v1
      - name: Full nonterminal population preflight
        run: PYTHONPATH=. python verification/verify_five_direct_route_terminal_executors_full.py
