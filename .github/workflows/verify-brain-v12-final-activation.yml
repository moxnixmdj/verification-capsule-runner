name: Verify Brain V12 final activation edge
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/brain_v12_final_activation/**"
      - ".github/workflows/verify-brain-v12-final-activation.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          cd capsules/brain_v12_final_activation
          python verify_final_activation.py
