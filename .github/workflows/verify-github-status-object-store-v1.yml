name: Verify GitHub status object store v1

on:
  pull_request:
    branches: [repair/rank15-v5-durable-journal-20261009]
    paths:
      - "execution_guard/github_status_object_store_v1.py"
      - "execution_guard/tests/test_github_status_object_store_v1.py"
      - ".github/workflows/verify-github-status-object-store-v1.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: |
          set -euo pipefail
          python -m py_compile \
            execution_guard/github_status_object_store_v1.py \
            execution_guard/tests/test_github_status_object_store_v1.py
      - name: Run adversarial tests
        run: |
          set -euo pipefail
          python -m unittest -v execution_guard.tests.test_github_status_object_store_v1
