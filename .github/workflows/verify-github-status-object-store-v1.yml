name: Verify GitHub status object store v1

on:
  pull_request:
    branches: [repair/rank15-v5-durable-journal-20261009]
    paths:
      - "execution_guard/github_status_object_store_v1.py"
      - "execution_guard/tests/test_github_status_object_store_v1.py"
      - "execution_guard/terminal_slot_start_cas_v2.py"
      - "execution_guard/tests/test_terminal_slot_start_status_backend_v1.py"
      - "capsules/tb_science_rank15_20261009_v1/rank15_start_cas_v5.py"
      - ".github/workflows/verify-github-status-object-store-v1.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: |
          set -euo pipefail
          python -m py_compile \
            execution_guard/github_status_object_store_v1.py \
            execution_guard/tests/test_github_status_object_store_v1.py \
            execution_guard/terminal_slot_start_cas_v2.py \
            execution_guard/tests/test_terminal_slot_start_status_backend_v1.py \
            capsules/tb_science_rank15_20261009_v1/rank15_start_cas_v5.py
      - name: Run adversarial tests
        run: |
          set -euo pipefail
          python -m unittest -v \
            execution_guard.tests.test_github_status_object_store_v1 \
            execution_guard.tests.test_terminal_slot_start_status_backend_v1
