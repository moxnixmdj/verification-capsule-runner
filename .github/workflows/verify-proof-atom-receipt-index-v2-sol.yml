name: Verify proof atom receipt index v2 sol
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/proof_atom_receipt_index_v2/**"
      - ".github/workflows/verify-proof-atom-receipt-index-v2-sol.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact Brain blob identities
        run: |
          cd capsules/proof_atom_receipt_index_v2
          python - <<'PY'
          import hashlib,json,pathlib
          m=json.load(open("EXPECTED_BRAIN_BLOBS.json",encoding="utf-8"))
          for src,expected in m["exact_brain_blobs"].items():
              data=pathlib.Path(src).read_bytes()
              actual=hashlib.sha1(f"blob {len(data)}\0".encode()+data).hexdigest()
              assert actual==expected,(src,actual,expected)
          print("exact Brain blob identities: PASS")
          PY
      - name: Verify V2 indexer and adversarial completeness tests
        run: |
          cd capsules/proof_atom_receipt_index_v2
          export PYTHONPATH=.
          python -m py_compile canonical/runtime/canonical_proof_atom_basis_v2.py canonical/runtime/proof_atom_receipt_index_v2.py
          python -m unittest canonical.tests.test_proof_atom_receipt_index_v2 -v
      - name: Replay canonical 40-atom V2 index kernel
        run: |
          cd capsules/proof_atom_receipt_index_v2
          export PYTHONPATH=.
          python canonical/runtime/proof_atom_receipt_index_v2.py > index.json
          python - <<'PY'
          import json
          p=json.load(open("index.json"))
          assert p["status"].startswith("PASS"),p
          assert p["canonical_atom_count"]==40,p["canonical_atom_count"]
          assert isinstance(p["canonical_atom_manifest_sha256"],str) and len(p["canonical_atom_manifest_sha256"])==64
          assert isinstance(p["scanned_corpus_manifest_sha256"],str) and len(p["scanned_corpus_manifest_sha256"])==64
          assert p["capability_credit_delta"]==0
          assert p["family_credit_delta"]==0
          assert p["execution_authority"] is False
          assert p["promotion_authority"] is False
          print(json.dumps({
            "canonical_atom_count":p["canonical_atom_count"],
            "canonical_atom_manifest_sha256":p["canonical_atom_manifest_sha256"],
            "scanned_file_count":p["scanned_file_count"],
            "scanned_corpus_manifest_sha256":p["scanned_corpus_manifest_sha256"],
            "candidate_match_count":p["candidate_match_count"],
            "atoms_with_truncated_candidate_lists":p["atoms_with_truncated_candidate_lists"]
          },indent=2,sort_keys=True))
          PY
