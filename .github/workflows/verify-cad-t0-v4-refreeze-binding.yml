name: Verify CAD T0 V4 refreeze binding

on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/governance/CAD_T0_CANDIDATE_FREEZE_V4.json'
      - 'canonical/governance/CAD_T0_POST_REFREEZE_BINDING_V4.json'
      - 'canonical/runtime/cad_t0_post_refreeze_binding_v4_validator.py'
      - 'canonical/tests/test_cad_t0_post_refreeze_binding_v4_validator.py'
      - '.github/workflows/verify-cad-t0-v4-refreeze-binding.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Bind exact Brain V4 blobs
        run: |
          test "$(git hash-object canonical/governance/CAD_T0_CANDIDATE_FREEZE_V4.json)" = "37b4286ddd927da316b59c764f65f542f8a774b9"
          test "$(git hash-object canonical/governance/CAD_T0_POST_REFREEZE_BINDING_V4.json)" = "c83d6472af9c623c260054f7f039242df93188cd"
          test "$(git hash-object canonical/runtime/cad_t0_post_refreeze_binding_v4_validator.py)" = "85337648de81884da3c94408e45de60a8fbfb2c5"
          test "$(git hash-object canonical/tests/test_cad_t0_post_refreeze_binding_v4_validator.py)" = "54e8fee3801d7697dcf43d6bdc88644524ffa7a7"
      - name: Validate exact frozen cone
        run: PYTHONPATH=. python -m unittest -v canonical.tests.test_cad_t0_post_refreeze_binding_v4_validator
