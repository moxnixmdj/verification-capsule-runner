name: Verify contract-native proof suites

on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/runtime/contract_native_proof_suites.py'
      - 'canonical/tests/test_contract_native_proof_suites.py'
      - '.github/workflows/verify-contract-native-proof-suites.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Bind exact Brain source and tests
        run: |
          test "$(git hash-object canonical/runtime/contract_native_proof_suites.py)" = "0210790c7dd705ef328e1b55d529a30c5c6c3337"
          test "$(git hash-object canonical/tests/test_contract_native_proof_suites.py)" = "b1cdc1506530e1078dc2259c7ae9f5b5e4ce2bf2"
      - run: PYTHONPATH=. python -m unittest -v canonical.tests.test_contract_native_proof_suites
