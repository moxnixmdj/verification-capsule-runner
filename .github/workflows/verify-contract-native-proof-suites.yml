name: Verify contract-native proof suites independently
on:
  pull_request:
    branches: [main]
    paths:
      - 'verification/contract_native_proof_suites.py'
      - 'verification/test_contract_native_proof_suites_independent.py'
      - '.github/workflows/verify-contract-native-proof-suites.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Bind exact Brain source blob
        run: test "$(git hash-object verification/contract_native_proof_suites.py)" = "0210790c7dd705ef328e1b55d529a30c5c6c3337"
      - name: Run independent generated-case and mutation tests
        run: cd verification && python -m unittest -v test_contract_native_proof_suites_independent
