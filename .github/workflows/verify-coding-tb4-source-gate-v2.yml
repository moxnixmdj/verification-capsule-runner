name: Verify coding TB4 source gate V2 admission
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Evaluate exact admission
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from canonical.runtime.acceptance_capability_source_gate_v2 import evaluate
          x=json.loads(Path("canonical/governance/CODING_TB4_SOURCE_GATE_V2_ADMISSION_V1.json").read_text())
          out=evaluate(x["route"])
          print(json.dumps(out,indent=2,sort_keys=True))
          assert out["pass"] is True,out
          assert out["clean_case_execution_authority"] is True,out
          assert out["capability_credit_delta"]==0 and out["family_credit_delta"]==0,out
          PY
