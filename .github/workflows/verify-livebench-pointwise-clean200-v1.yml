name: Verify LiveBench pointwise clean200 V1
on:
  pull_request:
    branches: [main]
    paths:
      - 'verify_livebench_pointwise_clean200_v1.py'
      - 'subject/livebench_pointwise_clean200_v1/**'
      - '.github/workflows/verify-livebench-pointwise-clean200-v1.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONHASHSEED: '0'
      NLTK_DATA: /tmp/nltk_data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir numpy==2.1.3 nltk==3.9.2 langdetect==1.0.9 immutabledict==4.2.1 requests==2.32.5
      - name: Checkout frozen scorer and historical generator
        run: |
          set -euo pipefail
          git init /tmp/livebench
          git -C /tmp/livebench remote add origin https://github.com/LiveBench/LiveBench.git
          git -C /tmp/livebench fetch --depth 1 origin 8f8e5c381a16e3f24257776edd53471fe86f8091
          git -C /tmp/livebench checkout --detach FETCH_HEAD
          git init /tmp/livebench-gen
          git -C /tmp/livebench-gen remote add origin https://github.com/LiveBench/LiveBench.git
          git -C /tmp/livebench-gen fetch --depth 1 origin 686be1e78a0ba8036d7e355bc406e1a265da5292
          git -C /tmp/livebench-gen checkout --detach FETCH_HEAD
          git clone --filter=blob:none --no-checkout https://github.com/nltk/nltk_data.git /tmp/nltk_data_repo
          git -C /tmp/nltk_data_repo checkout 550b6625bcef1f2abff2ff770a5a0d272c9c6b2a -- packages/tokenizers/punkt.zip packages/tokenizers/punkt_tab.zip
          mkdir -p /tmp/nltk_data/tokenizers
          unzip -q /tmp/nltk_data_repo/packages/tokenizers/punkt.zip -d /tmp/nltk_data/tokenizers
          unzip -q /tmp/nltk_data_repo/packages/tokenizers/punkt_tab.zip -d /tmp/nltk_data/tokenizers
      - name: Execute clean post-freeze pointwise evaluation
        run: python verify_livebench_pointwise_clean200_v1.py
      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livebench-pointwise-clean200-v1
          path: livebench_pointwise_clean200_v1_receipt.json
          if-no-files-found: error
