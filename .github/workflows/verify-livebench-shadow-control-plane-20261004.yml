name: Verify LiveBench shadow control plane

on:
  pull_request:
    paths:
      - 'verify_livebench_shadow_control_plane_20261004.py'
      - 'verify_git_ref_create_once_20261004.sh'
      - 'subject/livebench_shadow_control_plane_20261004/**'
      - '.github/workflows/verify-livebench-shadow-control-plane-20261004.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact bytes and fail-closed preflight
        run: python verify_livebench_shadow_control_plane_20261004.py
      - name: Verify durable create-once Git-ref claim primitive
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash verify_git_ref_create_once_20261004.sh
