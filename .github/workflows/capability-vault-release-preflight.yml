name: Capability Vault Release Preflight
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/capability-vault-release-preflight.yml'
permissions:
  contents: write
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: brain-capability-vault-preflight-20261004-v1
      ASSET: brain-capability-vault-preflight.txt
    steps:
      - uses: actions/checkout@v4
      - name: Create deterministic content-addressed probe
        run: |
          set -euo pipefail
          printf '%s\n' 'PROJECT_BRAIN_CAPABILITY_VAULT_PREFLIGHT_V1' 'date=2026-10-04' 'incremental_spend_usd=0' > "$ASSET"
          sha256sum "$ASSET" | tee "$ASSET.sha256"
      - name: Create release and upload probe
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Brain capability vault preflight" --notes "Zero-cost release-asset storage preflight. No capability credit."
          fi
          gh release upload "$TAG" "$ASSET" "$ASSET.sha256" --clobber
      - name: Verify remote asset metadata
        run: |
          set -euo pipefail
          gh release view "$TAG" --json tagName,assets,url
