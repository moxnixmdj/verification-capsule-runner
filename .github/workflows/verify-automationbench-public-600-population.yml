name: Verify AutomationBench public population
on:
  push:
    branches: ["verify-ab-rows-v1"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install frozen AutomationBench
        run: python -m pip install --disable-pip-version-check --quiet "git+https://github.com/zapier/AutomationBench.git@4a8e1061254004d9dac807054eed33fad7d1ff14"
      - name: Verify population
        run: python verify_automationbench_public_600_population_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: automationbench-public-600-population-binding-v1
          path: AUTOMATIONBENCH_PUBLIC_600_POPULATION_BINDING_V1.json
