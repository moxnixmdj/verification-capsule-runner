name: Verify Root2 frontier V6 projection
on:
  pull_request:
    paths:
      - "subject/root2_v6_20261004_sol/**"
      - "verify_root2_frontier_v6_projection.py"
      - ".github/workflows/verify-root2-frontier-v6-projection.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python verify_root2_frontier_v6_projection.py
