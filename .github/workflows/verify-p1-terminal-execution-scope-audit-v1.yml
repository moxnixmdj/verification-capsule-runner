name: Verify P1 terminal execution scope audit v1

on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/p1_terminal_execution_scope_audit_v1/**"
      - ".github/workflows/verify-p1-terminal-execution-scope-audit-v1.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Independently verify executed P1 scope
        run: |
          cd capsules/p1_terminal_execution_scope_audit_v1
          export PYTHONPATH=.
          python canonical/runtime/p1_terminal_execution_scope_audit_v1.py
          python -m unittest canonical.tests.test_p1_terminal_execution_scope_audit_v1 -v
