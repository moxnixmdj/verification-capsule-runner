name: Verify LiveBench Active Legacy15 Opening
on:
  push:
    branches: [verify/livebench-active-legacy15-opening-20261004]
    paths:
      - verify_livebench_active_legacy15_opening.py
      - .github/workflows/verify-livebench-active-legacy15-opening.yml
  pull_request:
    branches: [main]
    paths:
      - verify_livebench_active_legacy15_opening.py
      - .github/workflows/verify-livebench-active-legacy15-opening.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python verify_livebench_active_legacy15_opening.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livebench-active-legacy15-opening-receipt
          path: livebench_active_legacy15_opening_receipt.json
          if-no-files-found: error
