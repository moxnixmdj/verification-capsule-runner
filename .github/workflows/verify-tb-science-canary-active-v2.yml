name: Verify TB-Science canary active authority V2
on:
  push:
    branches: ["verify-science-canary-active-v2-sol-20261003"]
    paths:
      - "capsules/tb_science_canary_active_v2/**"
      - ".github/workflows/verify-tb-science-canary-active-v2.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python capsules/tb_science_canary_active_v2/verify.py
