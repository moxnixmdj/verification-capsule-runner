name: Screen Qwen3.5-9B Q4 semantic seed capability
on:
  pull_request:
    branches: [main]
    paths:
      - "experiments/qwen35_9b_q4_semantic_screen_20261004.py"
      - ".github/workflows/screen-qwen35-9b-q4-semantic-20261004.yml"
permissions:
  contents: read
jobs:
  screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build exact pinned llama.cpp server
        shell: bash
        run: |
          set -euo pipefail
          git init llama.cpp
          git -C llama.cpp remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C llama.cpp fetch --depth 1 origin bec4772f6a2527d371557b5d2032641e5ff7619c
          git -C llama.cpp checkout --detach FETCH_HEAD
          test "$(git -C llama.cpp rev-parse HEAD)" = "bec4772f6a2527d371557b5d2032641e5ff7619c"
          cmake -S llama.cpp -B llama.cpp/build -DGGML_CUDA=OFF -DLLAMA_CURL=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build llama.cpp/build -j 2 --target llama-server
      - name: Download and verify exact pinned Qwen bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p models
          curl -L --fail --retry 3 --retry-delay 3 --silent --show-error             -o models/Qwen3.5-9B-M-TS-Q4_K_M.gguf             'https://huggingface.co/TheStageAI/Qwen3.5-9B-GGUF/resolve/main/Qwen3.5-9B-M-TS-Q4_K_M.gguf?download=true'
          echo 'f41c0a0c0e43bf721fb2da29374cd1a97271bac0bab08a9dc42964525e82350c  models/Qwen3.5-9B-M-TS-Q4_K_M.gguf' | sha256sum -c -
          test "$(stat -c '%s' models/Qwen3.5-9B-M-TS-Q4_K_M.gguf)" = "5060174144"
      - name: Start exact local endpoint
        shell: bash
        run: |
          set -euo pipefail
          EXTRA=()
          if llama.cpp/build/bin/llama-server --help 2>&1 | grep -q -- '--reasoning'; then EXTRA+=(--reasoning off); fi
          nohup llama.cpp/build/bin/llama-server             -m models/Qwen3.5-9B-M-TS-Q4_K_M.gguf             --alias brain-qwen3.5-9b             --host 127.0.0.1 --port 8080 -c 8192 -t 4 --parallel 1             --jinja --no-webui "${EXTRA[@]}" > QWEN_SERVER.log 2>&1 &
          echo $! > QWEN_SERVER.pid
          ok=0
          for i in $(seq 1 240); do
            if curl -fsS http://127.0.0.1:8080/health > QWEN_HEALTH.json 2>/dev/null; then ok=1; break; fi
            sleep 1
          done
          test "$ok" = 1
      - name: Run public nonterminal semantic screen
        run: python experiments/qwen35_9b_q4_semantic_screen_20261004.py
      - name: Upload screening evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen35-9b-q4-semantic-screen
          path: |
            qwen35_9b_q4_semantic_screen_receipt.json
            QWEN_HEALTH.json
            QWEN_SERVER.log
          if-no-files-found: warn
