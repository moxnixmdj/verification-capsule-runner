name: Verify Brain Opus55 acceptance V4 after scope firewall

on:
  pull_request:
    branches: [main]
    paths:
      - 'capsules/acceptance_v4/**'
      - '.github/workflows/verify-brain-acceptance-v4.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact Brain blob identities
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          root=Path("capsules/acceptance_v4")
          expected={
            "canonical/capabilities/opus55/OPUS_5_5_USEFUL_CAPABILITY_ENVELOPE_V1.json":"661a57f839101fbf54c7e4edc76166c65ce9327d",
            "canonical/runtime/opus55_acceptance_calibration_reducer_v2.py":"73b0b27644e0fa0d89ff8fbdb51005c20eae3632",
            "canonical/runtime/acceptance_proof_transmuter_v1.py":"39b5611e53485674b29e2a05da91b89801bc5aa6",
            "canonical/governance/OPUS55_TERMINAL_PROOF_PROTOCOLS_V1.json":"eb4bca0fe6a015d49d2854998fbe046c979c7ea9",
            "canonical/verification/TERMINAL_V3_POSTWAVE_CONTRACT_AND_FAMILY_REDUCTION_20261002_V1.json":"51e3e7578e9adbeee2168d2223b84481fea16a09",
            "canonical/governance/OPUS55_ACCEPTANCE_PROOF_TRANSMUTATION_INPUT_V1.json":"96052a6b5178305b37a2526fb25c3f53fa33b9b5",
            "canonical/governance/OPUS55_ACCEPTANCE_CALIBRATION_V2.json":"d55c90c2ba938edb8b89ea2e9af4510f0c5a2c3d",
            "canonical/tests/test_opus55_acceptance_calibration_reducer_v2.py":"74c1ec7c0b95921ba1c564ae0f2d62f27d289c3f",
          }
          for rel,want in expected.items():
              b=(root/rel).read_bytes()
              got=hashlib.sha1(b"blob "+str(len(b)).encode()+b"\0"+b).hexdigest()
              assert got==want,(rel,got,want)
          print("EXACT_BLOB_IDENTITY_PASS",len(expected))
          PY
      - name: Run V4 calibration regression suite
        env:
          PYTHONPATH: capsules/acceptance_v4
        run: python -m unittest -v canonical.tests.test_opus55_acceptance_calibration_reducer_v2
      - name: Independently recompute V4 acceptance
        env:
          PYTHONPATH: capsules/acceptance_v4
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from canonical.runtime.opus55_acceptance_calibration_reducer_v2 import evaluate
          root=Path("capsules/acceptance_v4")
          def load(rel): return json.loads((root/rel).read_text())
          out=evaluate(
            load("canonical/capabilities/opus55/OPUS_5_5_USEFUL_CAPABILITY_ENVELOPE_V1.json"),
            load("canonical/governance/OPUS55_TERMINAL_PROOF_PROTOCOLS_V1.json"),
            load("canonical/verification/TERMINAL_V3_POSTWAVE_CONTRACT_AND_FAMILY_REDUCTION_20261002_V1.json"),
            load("canonical/governance/OPUS55_ACCEPTANCE_PROOF_TRANSMUTATION_INPUT_V1.json"),
          )
          assert out["errors"]==[],out
          assert out["behavioral_pass_family_count"]==19,out
          assert out["acceptance_calibrated_family_count"]==2,out
          assert out["acceptance_pending_family_count"]==17,out
          assert set(out["acceptance_calibrated_families"])=={
            "EXACT_SYMBOLIC_COMPUTATION","LONG_HORIZON_MEMORY_AND_CONTINUITY"
          },out
          rows={r["family"]:r for r in out["families"]}
          for fam in ("TOOL_DISCOVERY_SELECTION_AND_LEARNING","SUBAGENT_DELEGATION_AND_COORDINATION"):
              assert rows[fam]["effective_protocol_status"]=="DEFINED_RESULT_OPEN",rows[fam]
              assert rows[fam]["opus_acceptance_calibrated"] is False,rows[fam]
          assert out["terminal_goal_acceptance_closed"] is False
          print("RESULT_JSON="+json.dumps({
            "status":"INDEPENDENT_PUBLIC_RUNNER_PASS",
            "target_family_count":19,
            "behavioral_pass_family_count":19,
            "acceptance_calibrated_family_count":2,
            "acceptance_pending_family_count":17,
            "acceptance_calibrated_families":sorted(out["acceptance_calibrated_families"]),
            "reopened_pending_families":["TOOL_DISCOVERY_SELECTION_AND_LEARNING","SUBAGENT_DELEGATION_AND_COORDINATION"],
            "terminal_goal_acceptance_closed":False,
            "terminal_replay":0,
            "fresh_acceptance_cases":0,
            "incremental_spend_usd":0
          },sort_keys=True))
          PY
