name: Guarded Brain PR548 Decision Role Relevance Qualification
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  qualify:
    if: github.head_ref == 'qualify/brain-pr548-decision-role-relevance-20260930-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Verify exact frozen closure
        run: |
          set -euo pipefail
          test "$(git hash-object canonical/runtime/bound_capabilities/decision_role_relevance_admission.py)" = "4a0d49386c3c1410a09d847fddd9772545ba0095"
          test "$(git hash-object canonical/runtime/bound_capabilities/objective_relevance_bm25.py)" = "0abb5225fe9fba2443f2df46b2e41bd1c7dd7436"
          test "$(git hash-object canonical/runtime/bound_capabilities/objective_claim_operand_binding.py)" = "48fd058430d8d361fc75beced567c7b6d1166531"
          test "$(git hash-object canonical/runtime/bound_capabilities/research_query_focus.py)" = "5403e1dc05716fcfc4f9a91b4534f55dc547eb7f"
          test "$(git hash-object canonical/tests/test_decision_role_relevance_admission.py)" = "2deabf08cad9476afd3467edcf7db5224927488b"
          test "$(git hash-object canonical/action_intents/2026-09-30_REPAIR_DECISION_ROLE_RELEVANCE_ADMISSION_V1.json)" = "253bfc3c9673da3ebef31779f38ee656055c67a3"
          test "$(git hash-object verify_brain_pr548_decision_role_relevance.py)" = "68fcd31d12289f831389acff7de366e972819c1b"
          test "$(git hash-object pr548_decision_role_authority.json)" = "6bcd4917a144be4f267939fd0cb70e3d80cdd68c"
          python -m py_compile canonical/runtime/bound_capabilities/decision_role_relevance_admission.py canonical/runtime/bound_capabilities/objective_relevance_bm25.py canonical/runtime/bound_capabilities/objective_claim_operand_binding.py canonical/runtime/bound_capabilities/research_query_focus.py canonical/tests/test_decision_role_relevance_admission.py verify_brain_pr548_decision_role_relevance.py
      - name: Generate immutable plan
        run: python generate_brain_pr548_guarded_plan.py
      - name: Prepare receipt directory
        run: mkdir -p _terminal
      - name: Atomically admit and qualify
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python execution_guard/github_actions_guarded_run_live.py --plan brain_pr548_guarded_plan.json --receipt _terminal/guarded-admission.json
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: brain-pr548-decision-role-relevance-qualification
          path: |
            _terminal/
            pr548-independent-report.json
            brain_pr548_guarded_plan.json
            pr548_decision_role_authority.json
          if-no-files-found: warn
