name: Verify Unknown-Domain V6 total exact
# isolated-v2-run

on:
  push:
    branches:
      - verify/unknown-domain-v6-v2-isolated-20261005
  pull_request:
    branches:
      - main
      - verification-isolation/ud-v6-subclass-safe-20261005
    paths:
      - "subject/unknown_domain_v6_20261005/**"
      - "verify_unknown_domain_v6_total_exact.py"
      - ".github/workflows/verify-unknown-domain-v6-total-exact.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Independently verify frozen Unknown-Domain V6
        run: python verify_unknown_domain_v6_total_exact.py
      - name: Upload exact verification receipt
        uses: actions/upload-artifact@v4
        with:
          name: unknown-domain-v6-total-exact-verification
          path: unknown_domain_v6_total_exact_verification.json
          if-no-files-found: error
      - name: Publish fail-closed success receipt
        if: success()
        run: |
          mkdir -p receipts
          cp unknown_domain_v6_total_exact_verification.json receipts/UNKNOWN_DOMAIN_V6_SUBCLASS_REPAIR_INDEPENDENT_VERIFICATION_20261005_V1.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add receipts/UNKNOWN_DOMAIN_V6_SUBCLASS_REPAIR_INDEPENDENT_VERIFICATION_20261005_V1.json
          git diff --cached --quiet || git commit -m "publish Unknown-Domain V6 V2 independent receipt"
          git push origin HEAD
