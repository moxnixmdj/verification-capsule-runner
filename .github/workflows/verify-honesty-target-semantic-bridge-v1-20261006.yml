name: Verify honesty target semantic bridge V1

on:
  push:
    paths:
      - "capsules/honesty_target_semantic_bridge_20261006/**"
      - ".github/workflows/verify-honesty-target-semantic-bridge-v1-20261006.yml"
  pull_request:
    paths:
      - "capsules/honesty_target_semantic_bridge_20261006/**"
      - ".github/workflows/verify-honesty-target-semantic-bridge-v1-20261006.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run exact vendored Brain adversarial tests
        working-directory: capsules/honesty_target_semantic_bridge_20261006
        run: python -m canonical.tests.test_honesty_target_semantic_bridge_verifier_v1
      - name: Run independent semantic checker
        working-directory: capsules/honesty_target_semantic_bridge_20261006
        run: python verify_independent.py
