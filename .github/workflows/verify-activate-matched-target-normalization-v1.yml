name: Verify matched target normalization activation v1

on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/activate_matched_target_normalization_v1/**"
      - ".github/workflows/verify-activate-matched-target-normalization-v1.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify fail-closed matched target normalization scheduler state
        run: |
          cd capsules/activate_matched_target_normalization_v1
          export PYTHONPATH=.
          python -m py_compile canonical/runtime/acceptance_ir_compiler_v1.py
          python -m py_compile canonical/runtime/minimum_terminal_cut_solver_v1.py
          python canonical/tests/test_matched_target_normalization_activation_v1.py
