name: Execute LiveBench V9 static replay72

on:
  push:
    branches:
      - diagnose/livebench-v8-structural-refinement-20261004
    paths:
      - ".github/workflows/execute-livebench-v9-static-replay72.yml"
      - "subject/livebench_v9_preacquisition_retry2_activation.json"
      - "diagnose_livebench_replay72_v9_preacquisition.py"
      - "launch_livebench_v9_preacquisition_retry2_atomic.py"
      - "execute_livebench_if_replay72_v4_candidate.py"

permissions:
  contents: write

concurrency:
  group: livebench-v9-static-replay72
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      LIVEBENCH_V9_RETRY2_ACTIVATION_BLOB: "424531d02dfc2e8098a81d57fb46140fc999db12"
      REPOSITORY_PRIVATE: "false"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify exact V9 replay-only bindings
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object subject/livebench_v9_preacquisition_retry2_activation.json)" = "424531d02dfc2e8098a81d57fb46140fc999db12"
          test "$(git hash-object diagnose_livebench_replay72_v9_preacquisition.py)" = "8542abc83acbec30c9c7f1d3bbdbaeee9e658008"
          test "$(git hash-object launch_livebench_v9_preacquisition_retry2_atomic.py)" = "0a9db8623a87b39d86f82c0542c55c359c4e3855"
          test "$(git hash-object execute_livebench_if_replay72_v4_candidate.py)" = "2a57ce896ddbd6819246aab8b44d17a00f36b61e"
          python - <<'PY'
          import json
          a=json.load(open("subject/livebench_v9_preacquisition_retry2_activation.json"))
          assert a["scope"]["replay_prefix_limit"]==72
          assert a["scope"]["already_exposed_prefix_only"] is True
          assert a["scope"]["new_case_exposure"] is False
          assert a["scope"]["case_73_or_later"] is False
          assert a["authority"]["new_case_exposure"] is False
          assert a["authority"]["promotion"] is False
          assert a["authority"]["acceptance_credit"] is False
          print("LIVEBENCH_V9_BINDING_VERIFIED")
          PY

      - name: Synthetic zero-case V9 child probe
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util,json,os,pathlib,shutil,subprocess,sys,tempfile,re
          root=pathlib.Path(".").resolve()
          spec=importlib.util.spec_from_file_location("v9diag",root/"diagnose_livebench_replay72_v9_preacquisition.py")
          d=importlib.util.module_from_spec(spec);spec.loader.exec_module(d)
          b=d.load_base()
          with tempfile.TemporaryDirectory(prefix="v9-synth-") as td:
              base=pathlib.Path(td)
              template=d.build_template(base,b)
              case=base/"case"
              shutil.copytree(template,case,dirs_exist_ok=True)
              env=os.environ.copy();env["PYTHONPATH"]=str(case)
              req={"benchmark_id":b.BENCHMARK_ID,"task_id":"SYNTHETIC_ZERO_CASE","task_payload":{"instruction":"Reply with exactly SYNTHETIC_OK."},"allowed_tools":[]}
              cp=subprocess.run([sys.executable,"-c",d.CASE_DRIVER],input=json.dumps(req),text=True,capture_output=True,cwd=case,env=env,timeout=45)
              known=("ModuleNotFoundError","ImportError","FileNotFoundError","PermissionError","NameError","AttributeError","TypeError","ValueError","KeyError","RuntimeError","SystemExit","MemoryError","TimeoutError","SyntaxError")
              typ=next((x for x in known if x in (cp.stderr or "")),"OTHER")
              sign="NEG" if cp.returncode<0 else "POS"
              print("V9_SYNTH_CHILD_RETURN="+sign+"_"+str(abs(cp.returncode)))
              print("V9_SYNTH_CHILD_EXCEPTION_TYPE="+typ)
              print("V9_SYNTH_CHILD_STDOUT_JSON="+str(bool((cp.stdout or "").lstrip().startswith("{"))).lower())
          PY

      - name: Execute one-use V9 sanitized static replay
        shell: bash
        run: |
          set -euo pipefail
          python launch_livebench_v9_preacquisition_retry2_atomic.py 2>&1 | tee /tmp/livebench-v9.log

      - name: Build V9 sanitized receipt
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json,pathlib,os
          log=pathlib.Path("/tmp/livebench-v9.log").read_text(errors="replace") if pathlib.Path("/tmp/livebench-v9.log").exists() else ""
          claim=None;result=None
          for line in log.splitlines():
              if line.startswith("LIVEBENCH_V9_RETRY2_ATOMIC_CLAIM="):
                  claim=json.loads(line.split("=",1)[1])
              if line.startswith("LIVEBENCH_V9_STATIC_REFINEMENT="):
                  result=json.loads(line.split("=",1)[1])
          receipt={
            "schema":"PROJECT_BRAIN_LIVEBENCH_V9_PREACQUISITION_STATIC_RETRY2_EXECUTION_RECEIPT_V1",
            "activation_blob_sha":"424531d02dfc2e8098a81d57fb46140fc999db12",
            "workflow_run_id":os.environ.get("GITHUB_RUN_ID"),
            "workflow_sha":os.environ.get("GITHUB_SHA"),
            "claim":claim,
            "result":result,
            "new_case_exposure":False,
            "case_73_or_later":False,
            "acceptance_credit_delta":0,
            "promotion_authority":False,
          }
          if result is not None:
              assert result.get("replay_prefix_limit")==72
              assert result.get("replayed_already_exposed_cases")==72
              assert result.get("new_case_exposure") is False
              assert result.get("case_ids_emitted") is False
              assert result.get("prompt_text_emitted") is False
              assert result.get("response_text_emitted") is False
              assert result.get("raw_exception_text_emitted") is False
          pathlib.Path("evidence").mkdir(exist_ok=True)
          pathlib.Path("evidence/LIVEBENCH_V9_PREACQUISITION_STATIC_RETRY2_EXECUTION_RECEIPT.json").write_text(
              json.dumps(receipt,indent=2,sort_keys=True)+"\n"
          )
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: livebench-v9-retry2-static-replay72-receipt
          path: evidence/LIVEBENCH_V9_PREACQUISITION_STATIC_RETRY2_EXECUTION_RECEIPT.json
          if-no-files-found: error

      - name: Persist V9 sanitized receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Project Brain LiveBench V9"
          git config user.email "project-brain-livebench-v9@users.noreply.github.com"
          git add evidence/LIVEBENCH_V9_PREACQUISITION_STATIC_RETRY2_EXECUTION_RECEIPT.json
          if ! git diff --cached --quiet; then
            git commit -m "Persist repaired LiveBench V9 static replay72 receipt"
            git push origin HEAD:diagnose/livebench-v8-structural-refinement-20261004
          fi
