name: Execute LiveBench V9 static replay72

on:
  push:
    branches:
      - diagnose/livebench-v8-structural-refinement-20261004
    paths:
      - ".github/workflows/execute-livebench-v9-static-replay72.yml"
      - "subject/livebench_v9_preacquisition_activation.json"
      - "diagnose_livebench_replay72_v9_preacquisition.py"
      - "launch_livebench_v9_preacquisition_atomic.py"
      - "execute_livebench_if_replay72_v4_candidate.py"

permissions:
  contents: write

concurrency:
  group: livebench-v9-static-replay72
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      LIVEBENCH_V9_ACTIVATION_BLOB: "93457b91a91c96befcc0c5f2dcf2eaa55a0529e3"
      REPOSITORY_PRIVATE: "false"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify exact V9 replay-only bindings
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object subject/livebench_v9_preacquisition_activation.json)" = "93457b91a91c96befcc0c5f2dcf2eaa55a0529e3"
          test "$(git hash-object diagnose_livebench_replay72_v9_preacquisition.py)" = "d383f6b609ab8c16c4dca3457af3008771243280"
          test "$(git hash-object launch_livebench_v9_preacquisition_atomic.py)" = "5a77925535a1c393e1a3ac695757b28eae115d32"
          test "$(git hash-object execute_livebench_if_replay72_v4_candidate.py)" = "2a57ce896ddbd6819246aab8b44d17a00f36b61e"
          python - <<'PY'
          import json
          a=json.load(open("subject/livebench_v9_preacquisition_activation.json"))
          assert a["scope"]["replay_prefix_limit"]==72
          assert a["scope"]["already_exposed_prefix_only"] is True
          assert a["scope"]["new_case_exposure"] is False
          assert a["scope"]["case_73_or_later"] is False
          assert a["authority"]["new_case_exposure"] is False
          assert a["authority"]["promotion"] is False
          assert a["authority"]["acceptance_credit"] is False
          print("LIVEBENCH_V9_BINDING_VERIFIED")
          PY

      - name: Execute one-use V9 sanitized static replay
        shell: bash
        run: |
          set -euo pipefail
          python launch_livebench_v9_preacquisition_atomic.py 2>&1 | tee /tmp/livebench-v9.log

      - name: Build V9 sanitized receipt
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json,pathlib,os
          log=pathlib.Path("/tmp/livebench-v9.log").read_text(errors="replace") if pathlib.Path("/tmp/livebench-v9.log").exists() else ""
          claim=None;result=None
          for line in log.splitlines():
              if line.startswith("LIVEBENCH_V9_ATOMIC_CLAIM="):
                  claim=json.loads(line.split("=",1)[1])
              if line.startswith("LIVEBENCH_V9_STATIC_REFINEMENT="):
                  result=json.loads(line.split("=",1)[1])
          receipt={
            "schema":"PROJECT_BRAIN_LIVEBENCH_V9_PREACQUISITION_STATIC_EXECUTION_RECEIPT_V1",
            "activation_blob_sha":"93457b91a91c96befcc0c5f2dcf2eaa55a0529e3",
            "workflow_run_id":os.environ.get("GITHUB_RUN_ID"),
            "workflow_sha":os.environ.get("GITHUB_SHA"),
            "claim":claim,
            "result":result,
            "new_case_exposure":False,
            "case_73_or_later":False,
            "acceptance_credit_delta":0,
            "promotion_authority":False,
          }
          if result is not None:
              assert result.get("replay_prefix_limit")==72
              assert result.get("replayed_already_exposed_cases")==72
              assert result.get("new_case_exposure") is False
              assert result.get("case_ids_emitted") is False
              assert result.get("prompt_text_emitted") is False
              assert result.get("response_text_emitted") is False
              assert result.get("raw_exception_text_emitted") is False
          pathlib.Path("evidence").mkdir(exist_ok=True)
          pathlib.Path("evidence/LIVEBENCH_V9_PREACQUISITION_STATIC_EXECUTION_RECEIPT.json").write_text(
              json.dumps(receipt,indent=2,sort_keys=True)+"\n"
          )
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: livebench-v9-static-replay72-receipt
          path: evidence/LIVEBENCH_V9_PREACQUISITION_STATIC_EXECUTION_RECEIPT.json
          if-no-files-found: error

      - name: Persist V9 sanitized receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Project Brain LiveBench V9"
          git config user.email "project-brain-livebench-v9@users.noreply.github.com"
          git add evidence/LIVEBENCH_V9_PREACQUISITION_STATIC_EXECUTION_RECEIPT.json
          if ! git diff --cached --quiet; then
            git commit -m "Persist LiveBench V9 static replay72 receipt"
            git push origin HEAD:diagnose/livebench-v8-structural-refinement-20261004
          fi
