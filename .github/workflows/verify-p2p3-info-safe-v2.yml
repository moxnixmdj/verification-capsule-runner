name: Verify P2 P3 information-safe capsule
on:
  pull_request:
    branches: [main]
    paths:
      - capsules/p2p3_info_safe_v2/**
      - .github/workflows/verify-p2p3-info-safe-v2.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cd capsules/p2p3_info_safe_v2 && PYTHONPATH=. python -m unittest -v canonical.tests.test_p2_p3_information_safe_proof_v2
