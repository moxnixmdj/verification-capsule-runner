name: Verify planar perspective registration
on:
  pull_request:
    branches: [main]
    paths:
      - 'verification/drawing_view_registration.py'
      - 'verification/raw_drawing_primitives.py'
      - 'verification/test_planar_perspective_registration.py'
      - '.github/workflows/verify-planar-perspective-registration.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy opencv-python-headless
      - run: cd verification && python -m unittest -v test_planar_perspective_registration.py
