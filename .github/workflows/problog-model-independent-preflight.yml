name: ProbLog Model-Independent Preflight

on:
  push:
    paths:
      - '.github/workflows/problog-model-independent-preflight.yml'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify pinned ProbLog 2.3.0 Linux wheel and exact inference
        shell: bash
        run: |
          set -euo pipefail
          python -m pip download --quiet --no-deps --only-binary=:all: problog==2.3.0 -d /tmp/problog-wheel
          WHEEL="$(find /tmp/problog-wheel -maxdepth 1 -name 'problog-2.3.0-py3-none-manylinux_2_28_x86_64.whl' -print -quit)"
          test -n "$WHEEL"
          ACTUAL="$(sha256sum "$WHEEL" | awk '{print $1}')"
          EXPECTED="8d18beae480bce9f54037dfa9cf8c058da874524c118d8ffae96fd210b68e71e"
          test "$ACTUAL" = "$EXPECTED"
          python -m pip install --quiet --no-deps "$WHEEL"
          python - <<'PY'
          import json
          import importlib.metadata
          from problog import get_evaluatable
          from problog.program import PrologString

          assert importlib.metadata.version("problog") == "2.3.0"

          model = """
          0.8::source_a.
          0.3::source_b.
          claim :- source_a.
          claim :- source_b.
          query(claim).
          """
          result = get_evaluatable().create_from(PrologString(model)).evaluate()
          observed = {str(k): float(v) for k, v in result.items()}
          expected = 1.0 - (1.0 - 0.8) * (1.0 - 0.3)
          assert abs(observed["claim"] - expected) < 1e-12, (observed, expected)

          conditioned = """
          0.8::source_a.
          0.3::source_b.
          claim :- source_a.
          claim :- source_b.
          evidence(source_a,true).
          query(claim).
          """
          result2 = get_evaluatable().create_from(PrologString(conditioned)).evaluate()
          observed2 = {str(k): float(v) for k, v in result2.items()}
          assert abs(observed2["claim"] - 1.0) < 1e-12, observed2

          print(json.dumps({
              "status":"PASS",
              "distribution":"problog",
              "version":"2.3.0",
              "wheel_filename":"problog-2.3.0-py3-none-manylinux_2_28_x86_64.whl",
              "wheel_sha256":"8d18beae480bce9f54037dfa9cf8c058da874524c118d8ffae96fd210b68e71e",
              "license":"Apache-2.0",
              "python":"3.12",
              "unconditioned_claim_probability":observed["claim"],
              "conditioned_claim_probability":observed2["claim"],
              "model_dependency":False
          }, sort_keys=True))
          PY
