name: ProbLog Model-Independent Preflight

on:
  push:
    paths:
      - '.github/workflows/problog-model-independent-preflight.yml'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify pinned ProbLog source and exact inference
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/ML-KULeuven/problog.git /tmp/problog
          git -C /tmp/problog checkout --quiet a294fa24c3cfb4bae3a2acea3a128386113889f4
          test "$(git -C /tmp/problog rev-parse HEAD)" = "a294fa24c3cfb4bae3a2acea3a128386113889f4"
          grep -q 'license = "Apache-2.0"' /tmp/problog/pyproject.toml
          grep -q 'dependencies = \[\]' /tmp/problog/pyproject.toml
          PYTHONPATH=/tmp/problog python - <<'PY'
          import json
          from problog import get_evaluatable
          from problog.program import PrologString

          model = """
          0.8::source_a.
          0.3::source_b.
          claim :- source_a.
          claim :- source_b.
          query(claim).
          """
          result = get_evaluatable().create_from(PrologString(model)).evaluate()
          observed = {str(k): float(v) for k, v in result.items()}
          expected = 1.0 - (1.0 - 0.8) * (1.0 - 0.3)
          assert abs(observed["claim"] - expected) < 1e-12, (observed, expected)

          conditioned = """
          0.8::source_a.
          0.3::source_b.
          claim :- source_a.
          claim :- source_b.
          evidence(source_a,true).
          query(claim).
          """
          result2 = get_evaluatable().create_from(PrologString(conditioned)).evaluate()
          observed2 = {str(k): float(v) for k, v in result2.items()}
          assert abs(observed2["claim"] - 1.0) < 1e-12, observed2

          print(json.dumps({
              "status":"PASS",
              "source_commit":"a294fa24c3cfb4bae3a2acea3a128386113889f4",
              "license":"Apache-2.0",
              "mandatory_python_dependencies":0,
              "python":"3.12",
              "unconditioned_claim_probability":observed["claim"],
              "conditioned_claim_probability":observed2["claim"],
              "model_dependency":False
          }, sort_keys=True))
          PY
