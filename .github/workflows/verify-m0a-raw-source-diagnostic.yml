name: Verify M0A raw-source semantic diagnostic
on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/runtime/m0a_raw_source_terminal_suite_v2.py'
      - 'canonical/runtime/m0a_raw_source_brain_candidate_v2.py'
      - 'canonical/runtime/bounded_predicate_argument_semantics.py'
      - 'canonical/runtime/explicit_compound_requirement_decomposer.py'
      - 'canonical/runtime/source_grounded_coreference.py'
      - 'canonical/runtime/requirement_acceptance_compiler.py'
      - 'canonical/runtime/independent_acceptance_model.py'
      - 'canonical/tests/test_m0a_raw_source_terminal_suite_v2.py'
      - '.github/workflows/verify-m0a-raw-source-diagnostic.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run information-boundary tests
        run: PYTHONPATH=. python -m unittest -v canonical.tests.test_m0a_raw_source_terminal_suite_v2
      - name: Run fresh 96-case independent semantic diagnostic
        env:
          PROJECT_BRAIN_POST_FREEZE_SEED: ${{ github.run_id }}
        run: |
          PYTHONPATH=. python - <<'PY'
          import json, os
          from canonical.runtime import m0a_raw_source_terminal_suite_v2 as suite
          from canonical.runtime import m0a_raw_source_brain_candidate_v2 as candidate
          seed=int(os.environ["PROJECT_BRAIN_POST_FREEZE_SEED"])
          out=suite.run_batch(seed,96,candidate.solve)
          print("PROJECT_BRAIN_M0A_FRESH_RESULT "+json.dumps(out,sort_keys=True))
          if not out.get("all_pass"):
              raise SystemExit(1)
          PY
