name: Verify LiveBench Ratio Overlap Visible Witness
on:
  pull_request:
    branches:
      - main
    paths:
      - verify_livebench_ratio_overlap_visible_witness.py
      - .github/workflows/verify-livebench-ratio-overlap-visible-witness.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recompute visible-only witnesses against pinned public ground truth
        run: python verify_livebench_ratio_overlap_visible_witness.py
      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livebench-ratio-overlap-visible-witness-receipt
          path: livebench_ratio_overlap_visible_witness_receipt.json
          if-no-files-found: error
