name: Execute TB-Science rank15 v3 all-cycle durable-start one-shot

on:
  pull_request:
    branches: [terminal-execution-v1]
    paths:
      - "capsules/tb_science_rank15_20261009_v1/ACTIVATE_RANK15_V3_PR.json"

permissions:
  contents: write

concurrency:
  group: tb-science-rank15-v3-durable-start-one-shot
  cancel-in-progress: false

jobs:
  terminal-slot:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      C: capsules/tb_science_rank15_20261009_v1
      SAFE_ID: protein-active-learning-trial-0
      LLAMA_CPP_REV: bec4772f6a2527d371557b5d2032641e5ff7619c
      MODEL_FILE: Qwen3.5-9B-M-TS-Q4_K_M.gguf
      MODEL_SHA256: f41c0a0c0e43bf721fb2da29374cd1a97271bac0bab08a9dc42964525e82350c
      RELEASE_TAG: brain-capability-qwen35-9b-m-exact-v1

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fail closed unless exact current V3 execution surface is active
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$GITHUB_EVENT_NAME" = "pull_request"
          test "$GITHUB_BASE_REF" = "terminal-execution-v1"
          test "$GITHUB_HEAD_REF" = "execute/tb-science-rank15-20261009-v3"
          test "$(git diff --name-only HEAD^1 HEAD^2)" = "$C/ACTIVATE_RANK15_V3_PR.json"
          python execution_guard/terminal_execution_admission_v2.py \
            --workflow ".github/workflows/execute-tb-science-rank15-20261009-v3.yml" \
            --slot "terminal-bench-science/protein-active-learning::trial-0" \
            --task-digest "sha256:d7e16b7c468551b468364cf2a86dba2383b007f3f2f01c6d2ce01d99ff30d48f" \
            --require-activation \
            --require-execution-authority

      - name: Install exact Harbor
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir -q 'harbor==0.23.0'
          python - <<'PY'
          import importlib.metadata
          assert importlib.metadata.version("harbor") == "0.23.0"
          PY

      - name: Clean-build exact llama.cpp on this runner
        run: |
          set -euo pipefail
          rm -rf llama.cpp
          git init llama.cpp
          git -C llama.cpp remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C llama.cpp fetch --depth 1 origin "$LLAMA_CPP_REV"
          git -C llama.cpp checkout --detach FETCH_HEAD
          test "$(git -C llama.cpp rev-parse HEAD)" = "$LLAMA_CPP_REV"
          rm -rf llama.cpp/build
          cmake -S llama.cpp -B llama.cpp/build -DGGML_CUDA=OFF -DLLAMA_CURL=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build llama.cpp/build -j 2 --target llama-server
          test -x llama.cpp/build/bin/llama-server

      - name: Restore exact Qwen model cache only
        id: qwen
        uses: actions/cache/restore@v4
        with:
          path: models/Qwen3.5-9B-M-TS-Q4_K_M.gguf
          key: brain-qwen35-9b-f41c0a0c0e43bf721fb2da29374cd1a97271bac0bab08a9dc42964525e82350c

      - name: Reassemble exact Qwen model if cache misses, then verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p models model-parts
          if [ ! -f "models/$MODEL_FILE" ]; then
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir model-parts --pattern "$MODEL_FILE.part*of03"
            cat "model-parts/$MODEL_FILE.part01of03" "model-parts/$MODEL_FILE.part02of03" "model-parts/$MODEL_FILE.part03of03" > "models/$MODEL_FILE"
          fi
          echo "$MODEL_SHA256  models/$MODEL_FILE" | sha256sum -c -

      - name: Qualify cognition carrier before any task read
        id: carrier
        run: |
          set -euo pipefail
          EXTRA=()
          if llama.cpp/build/bin/llama-server --help 2>&1 | grep -q -- '--reasoning'; then EXTRA+=(--reasoning off); fi
          nohup llama.cpp/build/bin/llama-server \
            -m "models/$MODEL_FILE" --alias brain-qwen3.5-9b \
            --host 127.0.0.1 --port 8080 -c 16384 -t 4 --parallel 1 --jinja --no-webui \
            "${EXTRA[@]}" > LOCAL_QWEN_SERVER.log 2>&1 &
          echo $! > LOCAL_QWEN_SERVER.pid

          ok=0
          for i in $(seq 1 240); do
            if curl -fsS http://127.0.0.1:8080/health > LOCAL_QWEN_HEALTH.json 2>/dev/null; then
              ok=1
              break
            fi
            if ! kill -0 "$(cat LOCAL_QWEN_SERVER.pid)" 2>/dev/null; then
              cat LOCAL_QWEN_SERVER.log
              exit 1
            fi
            sleep 1
          done
          test "$ok" = 1
          grep -Eq "n_ctx_slot = 16384|n_ctx_slot = 16[0-9]{3}" LOCAL_QWEN_SERVER.log

          curl -fsS http://127.0.0.1:8080/v1/chat/completions \
            -H 'Content-Type: application/json' \
            -d '{"model":"brain-qwen3.5-9b","messages":[{"role":"user","content":"Return exactly the token READY."}],"temperature":0,"max_tokens":16}' \
            > SYNTHETIC_COMPLETION.json
          python - <<'PY'
          import json
          x=json.load(open("SYNTHETIC_COMPLETION.json"))
          assert "READY" in x["choices"][0]["message"]["content"]
          PY

          free_bytes="$(df -B1 "$GITHUB_WORKSPACE" | awk 'NR==2{print $4}')"
          test "$free_bytes" -ge 12884901888
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Read exact rank15 task and enforce V3 all-cycle prestart envelope
        id: prestart
        if: steps.carrier.outputs.ready == 'true'
        run: |
          set -euo pipefail
          export PYTHONPATH="$C"
          python "$C/rank15_prestart_token_guard_v3.py"
          cat RANK15_PRESTART_GUARD.json

      - name: Build exact durable task-start intent
        id: start_intent
        if: steps.carrier.outputs.ready == 'true' && steps.prestart.outputs.guard_pass == 'true'
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,pathlib

          root=pathlib.Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          C=root/os.environ["C"]
          workflow=root/".github/workflows/execute-tb-science-rank15-20261009-v3.yml"
          surface_path=root/"execution_guard/CURRENT_TERMINAL_EXECUTION_SURFACE_V1.json"
          behavior_path=root/"execution_guard/TB_SCIENCE_RANK15_EXECUTION_BEHAVIOR_V3.json"
          guard_path=root/"RANK15_PRESTART_GUARD.json"
          surface=json.loads(surface_path.read_text())
          behavior=json.loads(behavior_path.read_text())
          guard=json.loads(guard_path.read_text())

          def git_blob(path):
              raw=path.read_bytes()
              return hashlib.sha1(b"blob "+str(len(raw)).encode()+b"\0"+raw).hexdigest()

          def sha256(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          assert guard["pass"] is True
          assert guard["task_started"] is False
          assert surface["workflow_path"]==str(workflow.relative_to(root))
          assert git_blob(workflow)==surface["workflow_git_blob_sha"]
          assert surface["slot_id"]=="terminal-bench-science/protein-active-learning::trial-0"
          assert surface["task_digest"]=="sha256:d7e16b7c468551b468364cf2a86dba2383b007f3f2f01c6d2ce01d99ff30d48f"
          assert surface["execution_authority"] is True
          assert surface["behavior"]["path"]==str(behavior_path.relative_to(root))
          assert git_blob(behavior_path)==surface["behavior"]["git_blob_sha"]
          activation=root/surface["activation_path"]
          assert activation==C/"ACTIVATE_RANK15_V3_PR.json"
          authority=root/surface["authority"]["path"]
          assert git_blob(authority)==surface["authority"]["git_blob_sha"]

          runtime_material={
              "behavior_git_blob_sha":git_blob(behavior_path),
              "planner_git_blob_sha":git_blob(C/"canonical/runtime/harbor_science_planner_v3.py"),
              "agent_git_blob_sha":git_blob(C/"canonical/runtime/harbor_science_agent_v3.py"),
              "prestart_guard_git_blob_sha":git_blob(C/"rank15_prestart_token_guard_v3.py"),
              "transport_git_blob_sha":git_blob(C/"canonical/runtime/harbor_environment_transport.py"),
              "start_cas_git_blob_sha":git_blob(root/"execution_guard/terminal_slot_start_cas_v1.py"),
              "model_sha256":os.environ["MODEL_SHA256"],
              "llama_cpp_commit":os.environ["LLAMA_CPP_REV"],
              "harbor_version":"0.23.0",
              "server_context_tokens":16384,
              "reserved_completion_tokens":4096,
          }
          runtime_identity=hashlib.sha256(
              json.dumps(runtime_material,sort_keys=True,separators=(",",":")).encode()
          ).hexdigest()

          intent={
              "slot_id":surface["slot_id"],
              "task_digest":surface["task_digest"],
              "logical_attempt_id":guard["logical_attempt_id"],
              "workflow_git_blob_sha":git_blob(workflow),
              "authority_git_blob_sha":git_blob(authority),
              "activation_git_blob_sha":git_blob(activation),
              "runtime_identity_sha256":runtime_identity,
              "prestart_receipt_sha256":sha256(guard_path),
              "github_run_id":os.environ["GITHUB_RUN_ID"],
              "github_sha":os.environ["GITHUB_SHA"],
          }
          pathlib.Path("RANK15_START_INTENT.json").write_text(
              json.dumps(intent,indent=2,sort_keys=True)+"\n"
          )
          print(json.dumps(intent,sort_keys=True))
          PY

      - name: Commit create-once durable task-start intent
        id: start_cas
        if: steps.carrier.outputs.ready == 'true' && steps.prestart.outputs.guard_pass == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python execution_guard/terminal_slot_start_cas_v1.py \
            --intent RANK15_START_INTENT.json \
            --receipt TERMINAL_SLOT_START_CAS_RECEIPT.json
          python - <<'PY'
          import json
          x=json.load(open("TERMINAL_SLOT_START_CAS_RECEIPT.json"))
          assert x["status"]=="TASK_START_INTENT_COMMITTED"
          assert x["replay_authority"] is False
          assert x["replacement_carrier_authority"] is False
          PY

      - name: Execute exactly frozen rank15 slot after durable start commit
        id: execute
        if: steps.carrier.outputs.ready == 'true' && steps.prestart.outputs.guard_pass == 'true' && steps.start_cas.outcome == 'success'
        continue-on-error: true
        env:
          TASK_PATH: ${{ steps.prestart.outputs.task_path }}
        run: |
          set -uo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/$C"
          mkdir -p "$GITHUB_WORKSPACE/jobs/$SAFE_ID"
          harbor run \
            -p "$TASK_PATH" \
            -a canonical.runtime.harbor_science_agent_v3:HarborScienceAgent \
            -k 1 -n 1 -r 0 \
            --agent-timeout-multiplier 0.48 \
            --environment-build-timeout-multiplier 1.0 \
            --verifier-timeout-multiplier 1.0 \
            --job-name "$SAFE_ID" \
            --jobs-dir "$GITHUB_WORKSPACE/jobs/$SAFE_ID"
          echo "harbor_exit=$?" >> "$GITHUB_OUTPUT"

      - name: Finalize conservative rank15 V3 receipt
        if: always()
        env:
          CARRIER_READY: ${{ steps.carrier.outputs.ready }}
          HARBOR_OUTCOME: ${{ steps.execute.outcome }}
        run: |
          python "$C/rank15_finalize_receipt_v3.py"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tb-science-protein-active-learning-trial-0-rank15-v3
          path: |
            protein-active-learning-trial-0__SLOT_RECEIPT_V3.json
            TERMINAL_EXECUTION_ADMISSION.json
            RANK15_PRESTART_GUARD.json
            RANK15_START_INTENT.json
            TERMINAL_SLOT_START_CAS_RECEIPT.json
            LOCAL_QWEN_HEALTH.json
            LOCAL_QWEN_SERVER.log
            SYNTHETIC_COMPLETION.json
            jobs/protein-active-learning-trial-0/
          if-no-files-found: warn
          retention-days: 7
