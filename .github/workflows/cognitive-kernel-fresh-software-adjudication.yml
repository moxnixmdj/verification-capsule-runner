name: Cognitive Kernel Fresh Software Adjudication

on:
  push:
    paths:
      - ".github/workflows/cognitive-kernel-fresh-software-adjudication.yml"

permissions:
  contents: read

jobs:
  adjudicate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout frozen task and kernel
        uses: actions/checkout@v4

      - name: Download rebound jevos-v2 runtime and fixed model
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o jev-linux-x64.tar.gz             https://github.com/feder-cr/jev/releases/download/jevos-v2/jev-linux-x64.tar.gz
          curl -fL --retry 3 -o jevos-v2-openvino-int8.zip             https://github.com/feder-cr/jev/releases/download/jevos-v2/jevos-v2-openvino-int8.zip
          echo "719540869b8fc019c237894bf481346b0f534b50ba9be01d9496dd8f07ee21c4  jev-linux-x64.tar.gz" | sha256sum -c -
          echo "adb0057720a00b5c49aaeee68e4552a7a2cd52dc5fd33919e9787b0a97ed1570  jevos-v2-openvino-int8.zip" | sha256sum -c -

      - name: Start local jevos-v2
        run: |
          set -euo pipefail
          mkdir jev-dist
          tar -xzf jev-linux-x64.tar.gz -C jev-dist --strip-components=1
          unzip -q jevos-v2-openvino-int8.zip -d jev-dist
          cd jev-dist
          chmod +x ./jev
          ./jev serve --host 127.0.0.1 --port 8017 > ../fresh_task_jev.log 2>&1 &
          echo $! > ../fresh_task_jev.pid
          cd ..
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8017/health > fresh_task_health.json; then
              cat fresh_task_health.json
              exit 0
            fi
            sleep 1
          done
          cat fresh_task_jev.log || true
          exit 1

      - name: Run frozen fresh executable adjudication task
        run: |
          set -euo pipefail
          python3 cognitive_kernel_real_task/run_experiment.py             --task cognitive_kernel_real_task/task.json             --kernel cognitive_kernel_verify/cognitive_decision_kernel.py             --endpoint http://127.0.0.1:8017/v1/systemone             --model jev-latest             --output cognitive_kernel_fresh_task_result.json
          cat cognitive_kernel_fresh_task_result.json

      - name: Upload independent evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cognitive-kernel-fresh-software-adjudication
          path: |
            cognitive_kernel_fresh_task_result.json
            fresh_task_jev.log
            fresh_task_health.json
            cognitive_kernel_real_task/task.json
          if-no-files-found: warn
