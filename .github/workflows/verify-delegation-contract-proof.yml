name: Verify Brain delegation contract direct proof
on:
  pull_request:
    branches: [main]
    paths:
      - brain/delegation_contract_proof_suite.py
      - brain/test_delegation_contract_proof_suite.py
      - .github/workflows/verify-delegation-contract-proof.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: cd brain && python -m unittest -v test_delegation_contract_proof_suite.py
