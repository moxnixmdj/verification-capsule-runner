name: Verify Brain PR307 Post-303 Firewall
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify exact Brain PR307 fail-closed invariants
        run: python verify_pr307.py
      - uses: actions/upload-artifact@v4
        with:
          name: brain-pr307-post303-firewall-verification
          path: verify-pr307-report.json
          if-no-files-found: error
