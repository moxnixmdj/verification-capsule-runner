name: Verify LiveBench Punkt nonempty UNSAT lemma

on:
  pull_request:
    branches: [main]
    paths:
      - 'subject/livebench_punkt_nonempty_unsat_20261005/**'
      - 'verify_livebench_punkt_nonempty_unsat_20261005.py'
      - '.github/workflows/verify-livebench-punkt-nonempty-unsat-20261005.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact checker dependency
        run: python -m pip install --disable-pip-version-check nltk==3.10.3 langdetect==1.0.9 immutabledict==4.2.2
      - name: Checkout pinned public sources and Punkt data
        run: |
          set -euo pipefail
          rm -rf /tmp/LiveBench /tmp/nltk-src /tmp/nltk_data_repo /tmp/nltk_data
          git init /tmp/LiveBench
          git -C /tmp/LiveBench remote add origin https://github.com/LiveBench/LiveBench.git
          git -C /tmp/LiveBench fetch --depth 1 origin 8f8e5c381a16e3f24257776edd53471fe86f8091
          git -C /tmp/LiveBench checkout --detach FETCH_HEAD
          git init /tmp/nltk-src
          git -C /tmp/nltk-src remote add origin https://github.com/nltk/nltk.git
          git -C /tmp/nltk-src fetch --depth 1 origin refs/tags/v3.10.3
          git -C /tmp/nltk-src checkout --detach FETCH_HEAD
          git clone --filter=blob:none --no-checkout https://github.com/nltk/nltk_data.git /tmp/nltk_data_repo
          git -C /tmp/nltk_data_repo checkout 550b6625bcef1f2abff2ff770a5a0d272c9c6b2a -- packages/tokenizers/punkt.zip packages/tokenizers/punkt_tab.zip
          mkdir -p /tmp/nltk_data/tokenizers
          unzip -q /tmp/nltk_data_repo/packages/tokenizers/punkt.zip -d /tmp/nltk_data/tokenizers
          unzip -q /tmp/nltk_data_repo/packages/tokenizers/punkt_tab.zip -d /tmp/nltk_data/tokenizers
      - name: Verify general Punkt nonempty UNSAT lemma
        env:
          NLTK_DATA: /tmp/nltk_data
        run: python verify_livebench_punkt_nonempty_unsat_20261005.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livebench-punkt-nonempty-unsat-verification
          path: livebench_punkt_nonempty_unsat_verification.json
          if-no-files-found: error
