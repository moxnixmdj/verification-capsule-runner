name: Verify global terminal surface dominance V4

on:
  push:
    branches: [main]
    paths:
      - 'verification/GLOBAL_TERMINAL_SURFACE_DOMINANCE_INPUT_V4.json'
      - 'verification/test_global_terminal_surface_dominance_v4.py'
      - 'canonical/runtime/proof_route_dominance.py'
      - '.github/workflows/verify-global-terminal-surface-dominance-v4.yml'
  pull_request:
    branches: [main]
    paths:
      - 'verification/GLOBAL_TERMINAL_SURFACE_DOMINANCE_INPUT_V4.json'
      - 'verification/test_global_terminal_surface_dominance_v4.py'
      - 'canonical/runtime/proof_route_dominance.py'
      - '.github/workflows/verify-global-terminal-surface-dominance-v4.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Bind exact current Brain blobs
        run: |
          test "$(git hash-object canonical/runtime/proof_route_dominance.py)" = "78f4dc70846a773a420da9dc5cf8f76bee5e154b"
          test "$(git hash-object verification/GLOBAL_TERMINAL_SURFACE_DOMINANCE_INPUT_V4.json)" = "41341491fb2a8857e998bbf3c9360b58e24675fe"
      - name: Verify current fail-closed V4 state
        run: PYTHONPATH=. python verification/test_global_terminal_surface_dominance_v4.py
