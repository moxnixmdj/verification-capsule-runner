name: Probe Vals credential presence for Brain
# merged-pr-trigger: 2026-10-07-v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-brain-vals-credential-presence.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      VALS_API_KEY: ${{ secrets.VALS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record sanitized zero-spend presence receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p receipts
          python3 - <<'PY'
          import json, os
          present = bool(os.environ.get("VALS_API_KEY"))
          out = {
            "schema": "PROJECT_BRAIN_VALS_CREDENTIAL_PRESENCE_INDEPENDENT_RUNNER_V1",
            "date": "2026-10-07",
            "status": "VALS_API_KEY_PRESENT" if present else "VALS_API_KEY_ABSENT",
            "credential_present": present,
            "network_requests_to_vals": 0,
            "model_or_benchmark_requests": 0,
            "purchases_or_topups": 0,
            "secret_values_emitted": False,
            "incremental_spend_usd": 0,
            "terminal_credit_delta": 0
          }
          with open("receipts/brain_vals_credential_presence_20261007_v1.json","w",encoding="utf-8") as f:
            json.dump(out,f,indent=2,sort_keys=True)
            f.write("\n")
          print(out["status"])
          PY

      - name: Upload sanitized receipt
        uses: actions/upload-artifact@v4
        with:
          name: brain-vals-credential-presence
          path: receipts/brain_vals_credential_presence_20261007_v1.json
          if-no-files-found: error
          retention-days: 1

      - name: Commit sanitized receipt
        shell: bash
        run: |
          set -euo pipefail
          OUT=receipts/brain_vals_credential_presence_20261007_v1.json
          git config user.name "Project Brain Independent Vals Probe"
          git config user.email "project-brain-vals-probe@users.noreply.github.com"
          git add "$OUT"
          git diff --cached --quiet && exit 0
          git commit -m "Record Brain Vals credential presence"
          git push origin HEAD:main
