name: verify-qwen38-27b-q2-zero-spend-load-v1

on:
  pull_request:
    paths:
      - "verify_qwen38_27b_q2_zero_spend_load_v1.py"
      - ".github/workflows/verify-qwen38-27b-q2-zero-spend-load-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Record zero-spend runner envelope
        run: |
          set -euxo pipefail
          uname -a
          nproc
          free -h
          df -h /

      - name: Reclaim preinstalled runner disk
        run: |
          set -euxo pipefail
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean
          df -h /

      - name: Build pinned llama.cpp CPU runtime
        run: |
          set -euxo pipefail
          git clone --filter=blob:none --depth 1 --branch v0.5.0 https://github.com/ggml-org/llama.cpp.git
          cmake -S llama.cpp -B llama.cpp/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_NATIVE=OFF \
            -DGGML_CPU=ON \
            -DGGML_BLAS=OFF \
            -DLLAMA_CURL=OFF
          cmake --build llama.cpp/build --config Release -j 4 --target llama-cli
          ./llama.cpp/build/bin/llama-cli --version
          df -h /

      - name: Download exact content-addressed Qwen3.8-27B Q2_K_XL
        env:
          MODEL_URL: https://huggingface.co/unsloth/Qwen3.8-27B-GGUF/resolve/main/Qwen3.8-27B-UD-Q2_K_XL.gguf
          EXPECTED_SHA256: fd4730dd8aad070517978752b63d530aeb1740d2283cab9fa24f1e404032ddb0
        run: |
          set -euxo pipefail
          curl -L --fail --retry 5 --retry-delay 3 -o model.gguf "$MODEL_URL"
          echo "$EXPECTED_SHA256  model.gguf" | sha256sum -c -
          ls -lh model.gguf
          free -h
          df -h /

      - name: Prove exact bytes load and generate on free standard runner
        env:
          MODEL_PATH: model.gguf
          LLAMA_CLI: llama.cpp/build/bin/llama-cli
        run: |
          set -euxo pipefail
          /usr/bin/time -v python3 verify_qwen38_27b_q2_zero_spend_load_v1.py
          cat qwen38_q2_probe_result.json
          free -h
          df -h /

      - name: Upload compact verification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen38-q2-zero-spend-load-v1
          path: qwen38_q2_probe_result.json
          if-no-files-found: warn
