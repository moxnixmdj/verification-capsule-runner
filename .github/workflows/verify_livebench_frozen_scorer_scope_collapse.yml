name: Verify LiveBench frozen scorer scope collapse
on:
  push:
    branches:
      - verify/livebench-legacy-scope-collapse-20261004
  pull_request:
    paths:
      - verify_livebench_frozen_scorer_scope_collapse.py
      - .github/workflows/verify_livebench_frozen_scorer_scope_collapse.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pyarrow==19.0.1
      - run: python verify_livebench_frozen_scorer_scope_collapse.py
