name: Verify Unknown-Domain V2 universal zero-reality proof
on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/governance/UNKNOWN_DOMAIN_DIRECT_V2_UNIVERSAL_PROOF_CANDIDATE_20261005_V1.json'
      - 'canonical/runtime/unknown_domain_direct_v2_universal_proof_v1.py'
      - 'canonical/tests/test_unknown_domain_direct_v2_universal_proof_v1.py'
      - 'verify_unknown_domain_v2_universal_zero_reality_v1.py'
      - '.github/workflows/verify-unknown-domain-v2-universal-zero-reality-v1.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independent structural proof and falsification
        run: python verify_unknown_domain_v2_universal_zero_reality_v1.py
