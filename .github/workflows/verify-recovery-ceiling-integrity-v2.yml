name: Verify recovery ceiling integrity v2

on:
  pull_request:
    paths:
      - "capsules/recovery_ceiling_integrity_v2/**"
      - ".github/workflows/verify-recovery-ceiling-integrity-v2.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact mirrored Brain blobs
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path

          root = Path("capsules/recovery_ceiling_integrity_v2")
          expected = {
              "canonical/governance/OPUS55_TERMINAL_PROOF_PROTOCOLS_V1.json": "eb4bca0fe6a015d49d2854998fbe046c979c7ea9",
              "canonical/governance/BEHAVIORAL_CONTRACT_REGISTRY_V1.json": "ee187f611a0e82b2de495ee377682f39bc31dd31",
              "canonical/governance/OPUS55_ACCEPTANCE_PREDICATE_REGISTRY_V2.json": "562536d9ba3f245a6bd24490a1eb3b30f27e0c3a",
              "canonical/governance/ACTIVE_TERMINAL_PROOF_BASIS_V1.json": "9c60356ab509a16df5104777f360b9fb18255842",
              "canonical/governance/P1_TRAJECTORY_T0_T2_MULTIPLEX_TERMINAL_BINDING_V1.json": "8703c6aa08227467a619a7ae90d0d61f8e54da39",
              "canonical/governance/RECOVERY_T0_T2_ACCEPTANCE_SCOPE_RELATION_V1.json": "2a830a237f7732f1bc208ba167c84e4399f9478a",
              "canonical/verification/TERMINAL_V3_ONE_SHOT_WAVE_RESULT_20261002_V1.json": "bd86b4c53992b47a4a60b64a60ba03db9a442cfc",
              "canonical/runtime/recovery_t0_t2_acceptance_ceiling_lifter_v1.py": "f8329dd7670d55df5eb61596078776ff4ef7e9dc",
              "canonical/tests/test_recovery_t0_t2_acceptance_ceiling_lifter_v1.py": "70a9512d99d06aa36c226d8c94ec96cb47f8b56d",
          }
          for rel, want in expected.items():
              data = (root / rel).read_bytes()
              got = hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()
              assert got == want, (rel, got, want)
          print(f"exact mirrored blobs: {len(expected)}/{len(expected)}")
          PY
      - name: Run fail-closed recovery ceiling verification
        working-directory: capsules/recovery_ceiling_integrity_v2
        run: python -m unittest canonical.tests.test_recovery_t0_t2_acceptance_ceiling_lifter_v1 -v
