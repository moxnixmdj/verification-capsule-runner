name: Verify LiveBench zero-spend carrier v1
on:
  pull_request:
    paths:
      - "verify_livebench_zero_spend_carrier_v1.py"
      - ".github/workflows/verify-livebench-zero-spend-carrier-v1.yml"
      - "capsules/root2_livebench_astra_adapter_v1/**"
      - "canonical/runtime/goal_compiler.py"
      - "canonical/runtime/capability_planner.py"
      - "canonical/runtime/capability_proposal_generators.py"
      - "canonical/runtime/BOUND_CAPABILITY_REGISTRY_V1.json"
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact zero-reality carrier path
        run: python verify_livebench_zero_spend_carrier_v1.py
