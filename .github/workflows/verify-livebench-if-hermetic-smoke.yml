name: Verify LiveBench IF hermetic 58-checker smoke

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/verify-livebench-if-hermetic-smoke.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-livebench-if-hermetic-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Fetch exact pinned verifier sources
        run: |
          git clone -q https://github.com/LiveBench/LiveBench.git /tmp/livebench
          git -C /tmp/livebench checkout -q 8f8e5c381a16e3f24257776edd53471fe86f8091
          test "$(git -C /tmp/livebench hash-object livebench/if_runner/ifbench/evaluation_lib.py)" = "2c7bd1290031dbe4ae0f016c53255f4af0ec645b"
          test "$(git -C /tmp/livebench hash-object livebench/if_runner/ifbench/instructions.py)" = "02b2dfeb50f036b89bec3df34522c73f756d8f44"
          test "$(git -C /tmp/livebench hash-object livebench/if_runner/ifbench/instructions_registry.py)" = "adfed4832877566e62970257b50c6fa32c302fb2"
          test "$(git -C /tmp/livebench hash-object livebench/if_runner/ifbench/instructions_util.py)" = "21b13c7fcfc2c2de01e80c9e7dd222b9bca81342"
      - name: Install exact Python dependencies
        run: |
          python -m pip install --disable-pip-version-check -q 'nltk==3.10.3' 'emoji==2.16.0' 'syllapy==0.7.2'
      - name: Bind exact NLTK data revision
        run: |
          git clone -q https://github.com/nltk/nltk_data.git /tmp/nltk_data_repo
          git -C /tmp/nltk_data_repo checkout -q 550b6625bcef1f2abff2ff770a5a0d272c9c6b2a
          mkdir -p /tmp/nltk_data/tokenizers /tmp/nltk_data/corpora /tmp/nltk_data/taggers
          unzip -q /tmp/nltk_data_repo/packages/tokenizers/punkt.zip -d /tmp/nltk_data/tokenizers
          unzip -q /tmp/nltk_data_repo/packages/tokenizers/punkt_tab.zip -d /tmp/nltk_data/tokenizers
          unzip -q /tmp/nltk_data_repo/packages/corpora/stopwords.zip -d /tmp/nltk_data/corpora
          unzip -q /tmp/nltk_data_repo/packages/taggers/averaged_perceptron_tagger.zip -d /tmp/nltk_data/taggers
          unzip -q /tmp/nltk_data_repo/packages/taggers/averaged_perceptron_tagger_eng.zip -d /tmp/nltk_data/taggers
      - name: Delete statically dead spaCy bootstrap from scorer cone
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/livebench/livebench/if_runner/ifbench/instructions.py')
          s=p.read_text()
          s=s.replace('from spacy.cli import download\n','')
          s=s.replace('import spacy\n','')
          s=s.replace('if not spacy.util.is_package("en_core_web_sm"):\n\tdownload(\'en_core_web_sm\')\n','')
          p.write_text(s)
          assert 'spacy' not in s.lower()
          PY
      - name: Run all 58 checker runtime smoke paths without terminal cases
        env:
          PYTHONPATH: /tmp/livebench
          NLTK_DATA: /tmp/nltk_data
        run: |
          python - <<'PY'
          import random
          from livebench.if_runner.ifbench import instructions_registry, evaluation_lib
          random.seed(0)
          registry=instructions_registry.INSTRUCTION_DICT
          assert len(registry)==58, len(registry)
          rows=[]
          for i,(instruction_id, cls) in enumerate(registry.items()):
              inst=cls(instruction_id)
              desc=inst.build_description()
              assert isinstance(desc,str) and desc
              args=inst.get_instruction_args() or {}
              assert isinstance(args,dict)
              probe="alpha beta gamma."
              direct=inst.check_following(probe)
              assert isinstance(direct,bool), (instruction_id,type(direct),direct)
              inp=evaluation_lib.InputExample(
                  key=i,
                  instruction_id_list=[instruction_id],
                  prompt="Synthetic prequalification prompt only.",
                  kwargs=[dict(args)],
              )
              strict=evaluation_lib.test_instruction_following_strict(inp,probe)
              loose=evaluation_lib.test_instruction_following_loose(inp,probe)
              assert len(strict.follow_instruction_list)==1
              assert len(loose.follow_instruction_list)==1
              assert isinstance(strict.follow_instruction_list[0],bool)
              assert isinstance(loose.follow_instruction_list[0],bool)
              rows.append(instruction_id)
          print({"status":"PASS","checker_count":len(rows),"terminal_case_content_read":0})
          PY
