name: Verify LiveBench IF hermetic runtime smoke
on:
  pull_request:
    branches: [main]
    paths:
      - 'verification/livebench_if_hermetic_smoke.py'
      - '.github/workflows/verify-livebench-if-hermetic-smoke.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Fetch exact pinned LiveBench source
        run: |
          git init /tmp/livebench_src
          git -C /tmp/livebench_src remote add origin https://github.com/LiveBench/LiveBench.git
          git -C /tmp/livebench_src fetch --depth 1 origin 8f8e5c381a16e3f24257776edd53471fe86f8091
          git -C /tmp/livebench_src checkout --detach FETCH_HEAD
          test "$(git -C /tmp/livebench_src rev-parse HEAD)" = "8f8e5c381a16e3f24257776edd53471fe86f8091"
          test "$(git -C /tmp/livebench_src hash-object livebench/if_runner/ifbench/evaluation_lib.py)" = "2c7bd1290031dbe4ae0f016c53255f4af0ec645b"
          test "$(git -C /tmp/livebench_src hash-object livebench/if_runner/ifbench/instructions.py)" = "02b2dfeb50f036b89bec3df34522c73f756d8f44"
          test "$(git -C /tmp/livebench_src hash-object livebench/if_runner/ifbench/instructions_registry.py)" = "adfed4832877566e62970257b50c6fa32c302fb2"
          test "$(git -C /tmp/livebench_src hash-object livebench/if_runner/ifbench/instructions_util.py)" = "21b13c7fcfc2c2de01e80c9e7dd222b9bca81342"
      - name: Fetch exact pinned NLTK data
        run: |
          git init /tmp/nltk_data_repo
          git -C /tmp/nltk_data_repo remote add origin https://github.com/nltk/nltk_data.git
          git -C /tmp/nltk_data_repo fetch --depth 1 origin 550b6625bcef1f2abff2ff770a5a0d272c9c6b2a
          git -C /tmp/nltk_data_repo checkout --detach FETCH_HEAD
          test "$(git -C /tmp/nltk_data_repo rev-parse HEAD)" = "550b6625bcef1f2abff2ff770a5a0d272c9c6b2a"
          mkdir -p /tmp/nltk_data/tokenizers /tmp/nltk_data/corpora /tmp/nltk_data/taggers
          unzip -q /tmp/nltk_data_repo/packages/tokenizers/punkt.zip -d /tmp/nltk_data/tokenizers
          unzip -q /tmp/nltk_data_repo/packages/tokenizers/punkt_tab.zip -d /tmp/nltk_data/tokenizers
          unzip -q /tmp/nltk_data_repo/packages/corpora/stopwords.zip -d /tmp/nltk_data/corpora
          unzip -q /tmp/nltk_data_repo/packages/taggers/averaged_perceptron_tagger.zip -d /tmp/nltk_data/taggers
          unzip -q /tmp/nltk_data_repo/packages/taggers/averaged_perceptron_tagger_eng.zip -d /tmp/nltk_data/taggers
      - name: Install pinned Python dependencies
        run: python -m pip install --no-cache-dir 'nltk==3.10.3' 'emoji==2.16.0' 'syllapy==0.7.2'
      - name: Run hermetic 58-checker call smoke
        env:
          NLTK_DATA: /tmp/nltk_data
        run: python verification/livebench_if_hermetic_smoke.py
