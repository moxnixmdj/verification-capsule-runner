name: Verify independent acceptance gate
on:
  pull_request:
    branches: [main]
    paths:
      - 'session_bridge/acceptance_contract.py'
      - 'session_bridge/controller_fast.py'
      - 'verification/test_acceptance_contract.py'
      - '.github/workflows/verify-acceptance-contract-gate.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m py_compile session_bridge/acceptance_contract.py session_bridge/controller_fast.py
      - run: PYTHONPATH=session_bridge python -m unittest -v verification/test_acceptance_contract.py
