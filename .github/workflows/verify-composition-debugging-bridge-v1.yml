name: Verify Composition debugging bridge V1
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/composition_debugging_bridge_v1/**"
      - ".github/workflows/verify-composition-debugging-bridge-v1.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python capsules/composition_debugging_bridge_v1/verify.py
