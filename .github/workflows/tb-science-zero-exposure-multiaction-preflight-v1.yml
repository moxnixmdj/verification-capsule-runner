name: TB-Science zero-exposure multi-action preflight v1

on:
  pull_request:
    branches: [terminal-execution-v1]
    paths:
      - "capsules/tb_science_zero_exposure_multiaction_v1/ACTIVATE_PREFLIGHT.json"

permissions:
  contents: read

concurrency:
  group: tb-science-zero-exposure-multiaction-preflight-v1
  cancel-in-progress: false

jobs:
  zero-exposure-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Verify zero-exposure activation and exact Brain bytes
        run: |
          set -euo pipefail
          C=capsules/tb_science_zero_exposure_multiaction_v1
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$GITHUB_EVENT_NAME" = "pull_request"
          test "$GITHUB_BASE_REF" = "terminal-execution-v1"
          test "$(git hash-object "$C/canonical/runtime/harbor_science_planner_v1.py")" = "715aee168f02cb4abff961849b2b26709eef2e64"
          test "$(git hash-object "$C/canonical/runtime/harbor_command_policy.py")" = "a525773417291c7a4841bf35e1baff5370350d0d"
          test "$(git hash-object "$C/canonical/runtime/tb_science_zero_exposure_multi_action_preflight_v1.py")" = "a1d641e74cfcc331e8340e253744506aec09f0b8"
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path("capsules/tb_science_zero_exposure_multiaction_v1/ACTIVATE_PREFLIGHT.json")
          x=json.loads(p.read_text())
          assert x["benchmark_task_exposure_authorized"]==0
          assert x["benchmark_trials_authorized"]==0
          assert x["acceptance_credit_delta"]==0
          assert x["terminal_credit_delta"]==0
          assert x["exact_route"]["llama_cpp_commit"]=="bec4772f6a2527d371557b5d2032641e5ff7619c"
          assert x["exact_route"]["qwen_model_sha256"]=="f41c0a0c0e43bf721fb2da29374cd1a97271bac0bab08a9dc42964525e82350c"
          PY

      - name: Clean-build exact llama.cpp
        run: |
          set -euo pipefail
          rm -rf llama.cpp
          git init llama.cpp
          git -C llama.cpp remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C llama.cpp fetch --depth 1 origin bec4772f6a2527d371557b5d2032641e5ff7619c
          git -C llama.cpp checkout --detach FETCH_HEAD
          test "$(git -C llama.cpp rev-parse HEAD)" = "bec4772f6a2527d371557b5d2032641e5ff7619c"
          grep -q '/v1/chat/completions/input_tokens' llama.cpp/tools/server/README.md
          cmake -S llama.cpp -B llama.cpp/build -DGGML_CUDA=OFF -DLLAMA_CURL=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build llama.cpp/build -j 2 --target llama-server

      - name: Restore exact Qwen model cache
        uses: actions/cache@v4
        with:
          path: models/Qwen3.5-9B-M-TS-Q4_K_M.gguf
          key: brain-qwen35-9b-f41c0a0c0e43bf721fb2da29374cd1a97271bac0bab08a9dc42964525e82350c

      - name: Acquire and verify exact Qwen model if cache misses
        run: |
          set -euo pipefail
          mkdir -p models
          if [ ! -f models/Qwen3.5-9B-M-TS-Q4_K_M.gguf ]; then
            curl -L --fail --retry 3 --retry-delay 3 --silent --show-error \
              -o models/Qwen3.5-9B-M-TS-Q4_K_M.gguf \
              'https://huggingface.co/TheStageAI/Qwen3.5-9B-GGUF/resolve/main/Qwen3.5-9B-M-TS-Q4_K_M.gguf?download=true'
          fi
          echo 'f41c0a0c0e43bf721fb2da29374cd1a97271bac0bab08a9dc42964525e82350c  models/Qwen3.5-9B-M-TS-Q4_K_M.gguf' | sha256sum -c -

      - name: Start exact rank12-class local cognition endpoint
        run: |
          set -euo pipefail
          EXTRA=()
          if llama.cpp/build/bin/llama-server --help 2>&1 | grep -q -- '--reasoning'; then EXTRA+=(--reasoning off); fi
          nohup llama.cpp/build/bin/llama-server \
            -m models/Qwen3.5-9B-M-TS-Q4_K_M.gguf \
            --alias brain-qwen3.5-9b --host 127.0.0.1 --port 8080 \
            -c 8192 -t 4 --parallel 1 --jinja --no-webui "${EXTRA[@]}" \
            > LOCAL_QWEN_SERVER.log 2>&1 &
          ok=0
          for i in $(seq 1 240); do
            if curl -fsS http://127.0.0.1:8080/health > LOCAL_QWEN_HEALTH.json 2>/dev/null; then ok=1; break; fi
            sleep 1
          done
          test "$ok" = 1

      - name: Run zero-benchmark-exposure multi-action long-prompt preflight
        run: |
          set -euo pipefail
          C="$GITHUB_WORKSPACE/capsules/tb_science_zero_exposure_multiaction_v1"
          export PYTHONPATH="$C"
          python -m canonical.runtime.tb_science_zero_exposure_multi_action_preflight_v1 > PREFLIGHT_RECEIPT.json
          python - <<'PY'
          import json
          x=json.load(open("PREFLIGHT_RECEIPT.json"))
          assert x["pass"] is True, x
          assert x["benchmark_task_exposure"]==0, x
          assert x["benchmark_trials_executed"]==0, x
          assert 7200 <= x["observed_input_tokens"] <= 7600, x
          assert x["selected_input_tokens"]==x["observed_input_tokens"], x
          assert x["effective_timeout_s"] >= 660, x
          assert x["proposal_candidate_count"]==3, x\n          assert x["dependency_edge_verified"] is True, x
          assert x["acceptance_credit_delta"]==0, x
          assert x["terminal_credit_delta"]==0, x
          PY
          cat PREFLIGHT_RECEIPT.json

      - name: Upload preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tb-science-zero-exposure-multiaction-preflight-v1
          path: |
            PREFLIGHT_RECEIPT.json
            LOCAL_QWEN_HEALTH.json
            LOCAL_QWEN_SERVER.log
          if-no-files-found: warn
