name: Verify tool-discovery V4 universal-closure candidate

on:
  pull_request:
    paths:
      - 'capsules/tool_discovery_v4_20261003/**'
      - '.github/workflows/verify-tool-discovery-v4-universal-closure.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact Brain blob identities
        working-directory: capsules/tool_discovery_v4_20261003
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          expected = {
            "canonical/runtime/tool_discovery_dynamic_candidate_v3.py": "bbbee4d6baf8df937543644397abba38a67dce62",
            "canonical/runtime/tool_discovery_dynamic_candidate_v4.py": "e614d0bed8e291e31f57189cd6f0f75aa39b0f74",
            "canonical/tests/test_tool_discovery_dynamic_v4.py": "23f0add178ca0c731d15e0645ee9b8841317efee",
          }
          for path, want in expected.items():
              data = Path(path).read_bytes()
              got = hashlib.sha1(f"blob {len(data)}\\0".encode() + data).hexdigest()
              assert got == want, (path, got, want)
              print(path, got)
          PY
      - name: Run adversarial V3 counterexample and V4 regression suite
        working-directory: capsules/tool_discovery_v4_20261003
        run: python -m unittest canonical.tests.test_tool_discovery_dynamic_v4 -v
