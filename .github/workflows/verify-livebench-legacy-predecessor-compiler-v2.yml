name: Verify LiveBench legacy predecessor compiler V2

on:
  push:
    branches:
      - "verify/livebench-legacy-predecessor-compiler-v2-20261004-sol"
    paths:
      - "capsules/livebench_legacy_predecessor_v2/**"
      - ".github/workflows/verify-livebench-legacy-predecessor-compiler-v2.yml"
  pull_request:
    branches: [main]
    paths:
      - "capsules/livebench_legacy_predecessor_v2/**"
      - ".github/workflows/verify-livebench-legacy-predecessor-compiler-v2.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact parquet reader
        run: python -m pip install --quiet "pyarrow==21.0.0"
      - name: Replay compiler on exact historical predecessor
        env:
          RECEIPT_PATH: livebench_legacy_predecessor_v2_receipt.json
        run: python capsules/livebench_legacy_predecessor_v2/verify.py
      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livebench-legacy-predecessor-v2-receipt
          path: livebench_legacy_predecessor_v2_receipt.json
          if-no-files-found: error
