name: Verify P1 typed intervention V5
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/p1_typed_intervention_v5/**"
      - ".github/workflows/verify-p1-typed-intervention-v5.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact Brain P1 V5 blobs and behavior
        run: python capsules/p1_typed_intervention_v5/verify.py
