name: Verify P1 typed intervention envelope V5
on:
  pull_request:
    paths:
      - "capsules/p1_typed_intervention_v5/**"
      - ".github/workflows/verify-p1-typed-intervention-v5.yml"
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact P1 V5 Brain blobs and adversarial envelope
        run: python capsules/p1_typed_intervention_v5/verify.py
