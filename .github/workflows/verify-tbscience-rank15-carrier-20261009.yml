name: Verify TB-Science rank15 zero-exposure carrier
on:
  pull_request:
    branches: [terminal-execution-v1]
    paths:
      - "capsules/tb_science_rank15_20261009_v1/**"
      - ".github/workflows/verify-tbscience-rank15-carrier-20261009.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Exact zero-exposure carrier proof
        env:
          C: capsules/tb_science_rank15_20261009_v1
        run: |
          set -euo pipefail
          test "$(git hash-object "$C/TB_SCIENCE_RANK15_ONE_SLOT_EXECUTION_AUTHORITY_20261009_V1.json")" = "61629b854f4be1e940a3f68d1a676e40b4e61ebf"
          test "$(git hash-object "$C/ACTION_INTENT_TB_SCIENCE_RANK15_20261009_V1.json")" = "ce2c7aeb17c450e17b02a3b616ce8a8374edabe4"
          test "$(git hash-object "$C/TB_SCIENCE_RANK15_AUTHORITY_CANDIDATE_PUBLIC_VERIFICATION_20261009_V1.json")" = "75f2ca9b52e256e13551977e99784dca868c11a7"
          test "$(git hash-object "$C/TB_SCIENCE_CURRENT_SLOT_LEDGER_RECONCILIATION_20261009_V19.json")" = "c9b887ac4fb57046be666492748d25ca96056378"
          test "$(git hash-object "$C/TB_SCIENCE_TRANSITIVE_RUNTIME_CLOSURE_MANIFEST_20261009_V12.json")" = "8008b1e2382c1235e3b788e0f8d4ab9a48487409"
          test "$(git hash-object "$C/SCIENCE_FROZEN_REQUIREMENTS_REPAIR_VERIFY_20261009_V1.json")" = "d60c84676de7dfa090810b3b65132d324ac49f38"
          test "$(git hash-object "$C/RANK15_EPOCH_V1.json")" = "ad0c76996163e5ee75553af7a9c00276dbe607c9"
          test "$(git hash-object "$C/RANK15_EXECUTION_CLAIM_V1.json")" = "a37da97fbc06ffdbb937996eaf1615dd56af1c0d"
          test "$(git hash-object "$C/rank15_prestart_token_guard_v1.py")" = "0139a20070cd1a51866c309bac1976b27ce7ac0d"
          test "$(git hash-object "$C/canonical/runtime/harbor_science_agent_v1.py")" = "e7e258f567499bd7356c0276d6293aa30dbd338c"
          python - <<'PY'
          import json,os,pathlib,subprocess
          C=pathlib.Path(os.environ["C"])
          a=json.loads((C/"TB_SCIENCE_RANK15_ONE_SLOT_EXECUTION_AUTHORITY_20261009_V1.json").read_text())
          l=json.loads((C/"TB_SCIENCE_CURRENT_SLOT_LEDGER_RECONCILIATION_20261009_V19.json").read_text())
          e=json.loads((C/"RANK15_EPOCH_V1.json").read_text())
          q=json.loads((C/"RANK15_EXECUTION_CLAIM_V1.json").read_text())
          cm=json.loads((C/"TB_SCIENCE_TRANSITIVE_RUNTIME_CLOSURE_MANIFEST_20261009_V12.json").read_text())
          assert a["execution_authority"] is True
          assert a["state"]["task_started"] is False and a["state"]["authority_consumed"] is False
          assert l["current_counts"]["consumed_slots"]==14
          assert l["current_counts"]["next_unconsumed_slot"]["slot_id"]=="terminal-bench-science/protein-active-learning::trial-0"
          assert e["execution_authority"] is False and e["run_attempts_authorized_by_epoch"]==0
          assert q["consumed"] is False and q["attempts_authorized"]==1 and q["retries_authorized"]==0
          assert cm["closure_file_count"]==15
          for row in cm["closure"]:
              p=C/row["path"]; assert p.is_file(),row["path"]
              actual=subprocess.check_output(["git","hash-object",str(p)],text=True).strip()
              assert actual==row["git_blob_sha"]
          print("PASS__RANK15_ZERO_EXPOSURE_CARRIER_EXACT__15_OF_15")
          PY
          python -m py_compile "$C"/canonical/runtime/*.py "$C"/rank15_prestart_token_guard_v1.py
