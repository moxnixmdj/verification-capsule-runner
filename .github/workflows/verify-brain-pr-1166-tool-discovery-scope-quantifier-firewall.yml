name: Verify Brain PR 1166 Tool Discovery scope quantifier firewall

on:
  pull_request:
    paths:
      - "capsules/brain_pr_1166_tool_discovery_scope_quantifier_firewall/**"
      - ".github/workflows/verify-brain-pr-1166-tool-discovery-scope-quantifier-firewall.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify exact Brain blob identities
        working-directory: capsules/brain_pr_1166_tool_discovery_scope_quantifier_firewall
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          expected={
  "canonical/runtime/tool_discovery_scope_quantifier_firewall_v1.py": "a2d4fe48f4e136529bf212bac43658277d7fdf9c",
  "canonical/tests/test_tool_discovery_scope_quantifier_firewall_v1.py": "55d5d2d8cbb7f2bdc87711450b4d6f893aded710",
  "canonical/governance/TOOL_DISCOVERY_SCOPE_QUANTIFIER_TRUTH_REPAIR_V1.json": "d474f9b72fcb6e9eb160f57b5a9b9a30b3bce973",
  "canonical/action_intents/2026-10-03_TOOL_DISCOVERY_SCOPE_QUANTIFIER_TRUTH_REPAIR_V1.json": "7ed241ca8c9cf2f593147a570514181f4abcad10",
  "canonical/verification/TOOL_DISCOVERY_FROZEN_SCOPE_COMPLETENESS_PUBLIC_RUNNER_VERIFICATION_20261003_V1.json": "c9adf25c2e63f9e8b111f1d022acda264d6571f5",
  "canonical/governance/TOOL_DISCOVERY_T2_T3_OBJECTIVE_TERMINAL_BINDING_V1.json": "6bcabc0a7d0525532ce7b80e132278f7c99caa43",
  "canonical/governance/OPUS55_TOOL_DISCOVERY_SCOPE_COMPLETE_ACCEPTANCE_INPUT_V1.json": "4c7d170418bb95828a23538709aa304a00db6746",
  "canonical/governance/OPUS55_TERMINAL_PROOF_PROTOCOLS_V1.json": "62394e5b7d221ec9f69c3458f669e40e253a9d09"
}
          for path,want in expected.items():
              data=Path(path).read_bytes()
              got=hashlib.sha1(b"blob "+str(len(data)).encode()+b"\0"+data).hexdigest()
              assert got==want,(path,got,want)
              print(path,got)
          PY

      - name: Run candidate adversarial tests
        working-directory: capsules/brain_pr_1166_tool_discovery_scope_quantifier_firewall
        run: python -m unittest canonical.tests.test_tool_discovery_scope_quantifier_firewall_v1 -v

      - name: Execute candidate firewall
        working-directory: capsules/brain_pr_1166_tool_discovery_scope_quantifier_firewall
        run: |
          python -m canonical.runtime.tool_discovery_scope_quantifier_firewall_v1 > verdict.json
          python - <<'PY'
          import json
          v=json.load(open("verdict.json"))
          assert v["status"]=="FAIL_CLOSED__IDENTITY_COMPLETENESS_IS_NOT_PROTOCOL_POPULATION_COMPLETENESS",v
          assert v["identity_universe_complete_within_bound_case"] is True,v
          assert v["protocol_population_complete"] is False,v
          assert v["quantifier_mismatch"] is True,v
          assert v["tool_discovery_acceptance_promotion_allowed"] is False,v
          assert v["current_acceptance_must_remain"]=="3_OF_19__8_OF_38",v
          assert v["new_reality_units_consumed"]==0,v
          assert v["terminal_results_replayed"]==0,v
          assert v["capability_credit_delta"]==0 and v["family_credit_delta"]==0,v
          print("candidate firewall: PASS")
          PY

      - name: Independently reconstruct quantifier mismatch
        working-directory: capsules/brain_pr_1166_tool_discovery_scope_quantifier_firewall
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def load(p):
              return json.loads(Path(p).read_text())

          scope=load("canonical/verification/TOOL_DISCOVERY_FROZEN_SCOPE_COMPLETENESS_PUBLIC_RUNNER_VERIFICATION_20261003_V1.json")
          binding=load("canonical/governance/TOOL_DISCOVERY_T2_T3_OBJECTIVE_TERMINAL_BINDING_V1.json")
          acceptance=load("canonical/governance/OPUS55_TOOL_DISCOVERY_SCOPE_COMPLETE_ACCEPTANCE_INPUT_V1.json")
          protocols=load("canonical/governance/OPUS55_TERMINAL_PROOF_PROTOCOLS_V1.json")

          identity_facts={
              "V1_PUBLIC_EXPOSES_COMPLETE_CASE_TOOL_IDENTITY_LIST",
              "V1_ORACLE_RANGES_OVER_EXACT_SAME_CASE_TOOL_LIST",
              "V2_INHERITS_V1_GENERATED_IDENTITY_UNIVERSE",
              "V2_DOES_NOT_REPLACE_GENERATED_TOOL_IDENTITY_UNIVERSE",
          }
          population_facts={
              "ALL_ADMISSIBLE_PROTOCOL_CASES_PROVED",
              "EXHAUSTIVE_FINITE_PROTOCOL_POPULATION_PROVED",
              "UNIVERSAL_FORMAL_PROTOCOL_SCOPE_PROVED",
          }

          verified=set(scope["verified"])
          assert identity_facts <= verified
          assert not (population_facts & verified)
          assert scope["complete_target_case_set"] is True

          pool=binding["source_pool"]
          assert pool["terminal_sample_count"]==180
          assert "NOT_EXHAUSTIVE" in pool["terminal_scope_claim"]

          row=next(x for x in protocols["protocols"] if x["family"]=="TOOL_DISCOVERY_SELECTION_AND_LEARNING")
          assert "unknown tool discovery" in row["task_dimensions"]
          assert row["status"]=="DEFINED_RESULT_OPEN"

          e=next(x for x in acceptance["evidence"] if x["family"]=="TOOL_DISCOVERY_SELECTION_AND_LEARNING")
          assert e["scope_completeness"]["basis"]=="EXACT_COMPLETE_TARGET_CASE_UNIVERSE"
          assert e["scope_completeness"]["complete_target_case_set"] is True

          print("INDEPENDENT_QUANTIFIER_AUDIT_PASS=1")
          print("PROVED=PER_CASE_TOOL_IDENTITY_COMPLETENESS")
          print("UNPROVED=WHOLE_PROTOCOL_CASE_POPULATION_COMPLETENESS")
          print("REQUIRED_ACTION=PRESERVE_3_OF_19_AND_8_OF_38")
          PY
