name: Verify global Retrieval V7 current pointer final
on:
  push:
    branches:
      - verify/global-retrieval-v7-current-pointer-final-20261003
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python verify_global_retrieval_v7_current_pointer_final.py
      - run: PYTHONPATH=. python canonical/tests/test_global_retrieval_authority_guard_v1.py
      - run: PYTHONPATH=. python canonical/runtime/global_retrieval_authority_guard_v1.py
