name: Verify LiveBench Ratio Reference-Free Constructor
on:
  pull_request:
    branches:
      - main
    paths:
      - subject/livebench_ratio_reference_free_constructor_v1.py
      - verify_livebench_ratio_reference_free_constructor.py
      - .github/workflows/verify-livebench-ratio-reference-free.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned public IFBench
        run: python -m pip install "git+https://github.com/allenai/IFBench@1c40f0c10d9b5c5c2f10a175a28007ebb64f7f4d"
      - name: Verify exact Brain subject against pinned public scorer and population
        run: python verify_livebench_ratio_reference_free_constructor.py
      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livebench-ratio-reference-free-receipt
          path: livebench_ratio_reference_free_receipt.json
          if-no-files-found: error
