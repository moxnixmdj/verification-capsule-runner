name: Verify synthesis overlay V3 rebind
on:
  push:
    branches:
      - verify/synthesis-overlay-v3-rebind-20261003-sol
    paths:
      - ".github/workflows/verify-synthesis-overlay-v3-rebind.yml"
      - "capsules/synthesis_overlay_v3_rebind/brain/**"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Bind exact Brain subjects
        run: |
          set -euo pipefail
          ROOT=capsules/synthesis_overlay_v3_rebind/brain
          test "$(git hash-object "$ROOT/canonical/governance/SYNTHESIS_OVERLAY_V3_REBIND_CANDIDATE_V1.json")" = "65c68de4a95ebdfd2ba3649c642748b0f9d8f2c7"
          test "$(git hash-object "$ROOT/canonical/governance/OPUS55_SYNTHESIS_IMPLICATION_RESIDUAL_INPUT_V2.json")" = "4e5b944c86b8745083cc9d97fe186aa4b1322747"
          test "$(git hash-object "$ROOT/canonical/verification/OPUS55_SYNTHESIS_IMPLICATION_RESIDUAL_PUBLIC_RUNNER_VERIFICATION_20261002_V2.json")" = "c9a3046dd5a409379d675051861600919c3017fb"
          test "$(git hash-object "$ROOT/canonical/verification/OPUS55_SYNTHESIS_WITNESS_TARGET_BINDING_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json")" = "64ad40c1c10bd01e4c0f4418fac29efafea838fc"
          test "$(git hash-object "$ROOT/canonical/governance/OPUS55_MATCHED_TARGET_NORMALIZATION_PROVENANCE_V1.json")" = "0910ce3a2351fc439e03a1fa2ae708fb3c6463ef"
          test "$(git hash-object "$ROOT/canonical/governance/OPUS55_MATCHED_TARGET_NORMALIZATION_PROVENANCE_V3.json")" = "72a5cd689f55df84de73693371264f02ef4e7226"
          test "$(git hash-object "$ROOT/canonical/verification/OPUS55_MATCHED_TARGET_NORMALIZATION_V3_PUBLIC_RUNNER_VERIFICATION_20261003_V1.json")" = "b5192b1903dc603e75efe92b9a00ced0b2722f8c"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact V1-to-V3 transport and residual preservation
        run: |
          set -euo pipefail
          cd capsules/synthesis_overlay_v3_rebind/brain
          python - <<'PY'
          import json
          from pathlib import Path

          def L(p):
              return json.loads(Path(p).read_text())

          pred="SYNTHESIS_MATCHED_QUALITY_COVERAGE_NONINFERIOR"
          c=L("canonical/governance/SYNTHESIS_OVERLAY_V3_REBIND_CANDIDATE_V1.json")
          residual=L("canonical/governance/OPUS55_SYNTHESIS_IMPLICATION_RESIDUAL_INPUT_V2.json")
          residual_v=L("canonical/verification/OPUS55_SYNTHESIS_IMPLICATION_RESIDUAL_PUBLIC_RUNNER_VERIFICATION_20261002_V2.json")
          bind_v=L("canonical/verification/OPUS55_SYNTHESIS_WITNESS_TARGET_BINDING_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json")
          old=L("canonical/governance/OPUS55_MATCHED_TARGET_NORMALIZATION_PROVENANCE_V1.json")
          new=L("canonical/governance/OPUS55_MATCHED_TARGET_NORMALIZATION_PROVENANCE_V3.json")
          new_v=L("canonical/verification/OPUS55_MATCHED_TARGET_NORMALIZATION_V3_PUBLIC_RUNNER_VERIFICATION_20261003_V1.json")

          def row(doc):
              xs=[x for x in doc["targets"] if x["predicate_id"]==pred]
              assert len(xs)==1, xs
              return xs[0]

          o,n=row(old),row(new)
          for key in ("predicate_id","family","atom_sources","metric_requirement_sources"):
              assert o[key]==n[key], (key,o[key],n[key])

          assert c["target_predicate_id"]==pred
          assert c["transport"]["direct_exact_row_comparison"].startswith("PASS__")
          assert new_v["independent_runner"]["conclusion"]=="success"
          assert new_v["verified"]["current_live_target_set_exact"] is True
          assert residual_v["public_runner"]["conclusion"]=="success"
          assert bind_v["public_runner"]["conclusion"]=="success"

          target_atoms={x["atom"] for x in n["atom_sources"]}
          proved=set(residual["algebra_input"]["witness"]["proved_atoms"])
          assert len(proved)==7, proved
          assert proved <= target_atoms, (proved,target_atoms)
          assert target_atoms-proved=={"metric:matched_quality"}, target_atoms-proved
          assert residual["algebra_input"]["witness"]["metric_bounds"]=={}
          assert residual["algebra_input"]["verified_scope_relations"]==[]
          assert residual["expected_residual"]["missing_scope_relation"] is True
          assert residual["expected_residual"]["missing_atoms"]==["metric:matched_quality"]
          assert residual["expected_residual"]["missing_metric_bounds"]==[
              "matched_quality_noninferiority",
              "required_claim_coverage_noninferiority",
          ]
          assert residual["expected_residual"]["implies_target"] is False

          p=c["preserved_if_transport_verified"]
          assert p["proved_atom_count"]==7
          assert p["missing_scope_relation"] is True
          assert p["missing_atoms"]==["metric:matched_quality"]
          assert p["missing_metric_bounds"]==[
              "matched_quality_noninferiority",
              "required_claim_coverage_noninferiority",
          ]
          assert p["implies_target"] is False

          for k in ("acceptance_credit_delta","family_credit_delta","capability_credit_delta","ownership_credit_delta"):
              assert c[k]==0, (k,c[k])
          assert c["fresh_reality_authority"] is False
          assert c["execution_authority"] is False
          assert c["promotion_authority"] is False

          print("SYNTHESIS_OVERLAY_V3_REBIND_VERIFIED")
          PY
