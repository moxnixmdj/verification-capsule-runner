name: Verify Brain-owned RE2-OB causal transfer
on:
  pull_request:
    branches: [main]
    paths:
      - 'verification/brain_pc_stable_cpdag.py'
      - 'verification/brain_causal_residual_ranker.py'
      - 'verification/test_brain_owned_re2ob_transfer.py'
      - '.github/workflows/verify-brain-re2ob-transfer.yml'
permissions:
  contents: read
jobs:
  transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install bounded data dependencies
        run: python -m pip install --disable-pip-version-check --quiet numpy pandas pyarrow huggingface_hub fsspec
      - name: Run precommitted fresh transfer
        run: python verification/test_brain_owned_re2ob_transfer.py
      - name: Upload transfer result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: brain-re2ob-transfer
          path: verification/re2ob_transfer_result.json
          if-no-files-found: warn
