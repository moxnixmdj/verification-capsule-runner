name: Verify tool-discovery ceiling residual v1

on:
  pull_request:
    paths:
      - 'capsules/tool_discovery_ceiling_residual_v1/**'
      - '.github/workflows/verify-tool-discovery-ceiling-residual-v1.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact mirrored Brain blob identities
        env:
          EXPECTED_JSON: '{"capsules/tool_discovery_ceiling_residual_v1/canonical/runtime/opus55_acceptance_residual_compiler_v2.py":"cae5bc3bfda9c77d7d7e5151127f55aafddb9522","capsules/tool_discovery_ceiling_residual_v1/canonical/governance/OPUS55_ACCEPTANCE_PREDICATE_REGISTRY_V2.json":"562536d9ba3f245a6bd24490a1eb3b30f27e0c3a","capsules/tool_discovery_ceiling_residual_v1/canonical/governance/OPUS55_ACCEPTANCE_PREDICATE_EVIDENCE_BINDINGS_V2.json":"f26d250f86e7f2ce18d790e451fe09bbacecb694","capsules/tool_discovery_ceiling_residual_v1/canonical/reasoning/2026-10-02_EXACT_OPUS55_ZERO_COST_COMPARATOR_ROUTE_RECONCILIATION_V1.json":"f67e22cee5e6fce1ebfae92ebf0946f78fafcee1","capsules/tool_discovery_ceiling_residual_v1/canonical/governance/OPUS55_PUBLIC_BAR_SCORE_READINESS_MATRIX_V1.json":"4e59e30461c9ff1bee1a9474627d5fb4074844b2","capsules/tool_discovery_ceiling_residual_v1/canonical/tests/test_terminal_ceiling_witness_residual_v1.py":"6f1ef3449d22b7c048d07116ba8e97042e7aafb8","capsules/tool_discovery_ceiling_residual_v1/canonical/governance/TOOL_DISCOVERY_ACCEPTANCE_CEILING_WITNESS_V1.json":"60a7c1139cad315d977bf5ed97e708cc5ec3fcc7","capsules/tool_discovery_ceiling_residual_v1/canonical/verification/TERMINAL_CEILING_WITNESS_LIFTER_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json":"a1c702c79d2b29bfc9c4d5a238f9c260bc204770"}'
        run: |
          python - <<'PY'
          import json, os, subprocess
          expected=json.loads(os.environ["EXPECTED_JSON"])
          failures=[]
          for path,want in expected.items():
              got=subprocess.check_output(["git","hash-object",path],text=True).strip()
              if got!=want:
                  failures.append(f"{path}: {got} != {want}")
          if failures:
              raise SystemExit("\n".join(failures))
          print(f"EXACT_BLOB_IDENTITY_PASS {len(expected)}/{len(expected)}")
          PY
      - name: Run exact residual ceiling tests
        env:
          PYTHONPATH: capsules/tool_discovery_ceiling_residual_v1
        run: |
          python -m unittest -v canonical.tests.test_terminal_ceiling_witness_residual_v1
      - name: Recompute tool-learning atomic closure
        env:
          PYTHONPATH: capsules/tool_discovery_ceiling_residual_v1
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from canonical.runtime.opus55_acceptance_residual_compiler_v2 import evaluate
          root=Path("capsules/tool_discovery_ceiling_residual_v1")
          def load(p): return json.loads((root/p).read_text())
          out=evaluate(
            load("canonical/governance/OPUS55_ACCEPTANCE_PREDICATE_REGISTRY_V2.json"),
            load("canonical/governance/OPUS55_ACCEPTANCE_PREDICATE_EVIDENCE_BINDINGS_V2.json"),
            load("canonical/reasoning/2026-10-02_EXACT_OPUS55_ZERO_COST_COMPARATOR_ROUTE_RECONCILIATION_V1.json"),
            load("canonical/governance/OPUS55_PUBLIC_BAR_SCORE_READINESS_MATRIX_V1.json"),
          )
          assert out["errors"]==[], out
          row=next(r for r in out["families"] if r["family"]=="TOOL_DISCOVERY_SELECTION_AND_LEARNING")
          assert (row["predicate_count"],row["proved"],row["open"],row["blocked"],row["state"])==(3,3,0,0,"PROVED"), row
          assert out["terminal_promotion_allowed"] is False
          print(json.dumps({"tool_learning":row,"terminal_promotion_allowed":out["terminal_promotion_allowed"]},indent=2))
          PY
      - name: Assert witness provenance and zero new reality
        run: |
          python - <<'PY'
          import json
          base="capsules/tool_discovery_ceiling_residual_v1/canonical"
          e=json.load(open(f"{base}/governance/OPUS55_ACCEPTANCE_PREDICATE_EVIDENCE_BINDINGS_V2.json"))
          w=json.load(open(f"{base}/governance/TOOL_DISCOVERY_ACCEPTANCE_CEILING_WITNESS_V1.json"))
          claim=next(c for c in e["claims"] if c["predicate_id"]=="TOOL_LEARNING_SUCCESS_ROUTE_NONINFERIOR")
          assert claim["state"]=="PROVED"
          assert claim["proof_kind"]=="ABSOLUTE_CEILING"
          assert claim["source_sha"]=="60a7c1139cad315d977bf5ed97e708cc5ec3fcc7"
          assert w["source_case_count"]==180
          assert w["result"]["brain_lower_bound"]==1
          assert w["result"]["theoretical_upper_bound"]==1
          assert w["incremental_spend_usd"]==0
          print("PROVENANCE_AND_ZERO_REALITY_PASS")
          PY
