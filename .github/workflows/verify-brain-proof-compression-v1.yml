name: Verify Brain proof compression v1

on:
  pull_request:
    paths:
      - 'capsules/proof_compression_v1/**'
      - '.github/workflows/verify-brain-proof-compression-v1.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact mirrored Brain blob identities
        env:
          EXPECTED_JSON: '{"capsules/proof_compression_v1/canonical/runtime/acceptance_bound_compiler_v1.py":"4ef569ab0663c0d4a3b2b91c82a8dfec880eefd0","capsules/proof_compression_v1/canonical/runtime/evaluation_information_firewall_v1.py":"11776f87f41c66802a28a417c344cccb394eb2aa","capsules/proof_compression_v1/canonical/runtime/acceptance_proof_first_frontier_v1.py":"1fe8087bd7874b6a02604971649ed959735009a9","capsules/proof_compression_v1/canonical/tests/test_acceptance_bound_compiler_v1.py":"0f12d9836dbe2445768eb3a4d7f1b48b531f6813","capsules/proof_compression_v1/canonical/tests/test_evaluation_information_firewall_v1.py":"710006e95a7107320945461fd5b8eca1f61c5fe7","capsules/proof_compression_v1/canonical/tests/test_acceptance_proof_first_frontier_v1.py":"035c86759622380c3ba439baa7ec8dfc78f04e43","capsules/proof_compression_v1/canonical/governance/ACCEPTANCE_BOUND_COMPILER_V1.json":"84fa0ea9924a74912664ba6c054e4f351d13cf18","capsules/proof_compression_v1/canonical/governance/EVALUATION_INFORMATION_FIREWALL_V1.json":"902c19851629bfb2342eea29e73f4a7ab5d212c5","capsules/proof_compression_v1/canonical/governance/PROOF_FIRST_FRONTIER_V1.json":"9f268e9ffc4c870a8016e7870a177c1cfcc2ba4c","capsules/proof_compression_v1/canonical/governance/ACCEPTANCE_BOUND_SCAN_20261002_V1.json":"25dfbc45fe8bad4a4ff773e095aa9173ecb129f5"}'
        run: |
          python - <<'PY'
          import json, os, subprocess
          expected=json.loads(os.environ["EXPECTED_JSON"])
          failures=[]
          for path,want in expected.items():
              got=subprocess.check_output(["git","hash-object",path],text=True).strip()
              if got!=want:
                  failures.append(f"{path}: {got} != {want}")
          if failures:
              raise SystemExit("\n".join(failures))
          print(f"EXACT_BLOB_IDENTITY_PASS {len(expected)}/{len(expected)}")
          PY
      - name: Run exact 12 proof-compression tests
        env:
          PYTHONPATH: capsules/proof_compression_v1
        run: |
          python -m unittest -v \
            canonical.tests.test_acceptance_bound_compiler_v1 \
            canonical.tests.test_evaluation_information_firewall_v1 \
            canonical.tests.test_acceptance_proof_first_frontier_v1
      - name: Assert zero-credit governance
        run: |
          python - <<'PY'
          import json
          base="capsules/proof_compression_v1/canonical/governance"
          for name in [
              "ACCEPTANCE_BOUND_COMPILER_V1.json",
              "EVALUATION_INFORMATION_FIREWALL_V1.json",
              "PROOF_FIRST_FRONTIER_V1.json",
              "ACCEPTANCE_BOUND_SCAN_20261002_V1.json",
          ]:
              d=json.load(open(f"{base}/{name}",encoding="utf-8"))
              assert d.get("capability_credit_delta")==0, name
              assert d.get("family_credit_delta")==0, name
              assert d.get("incremental_spend_usd")==0, name
          print("ZERO_CREDIT_GOVERNANCE_PASS")
          PY
