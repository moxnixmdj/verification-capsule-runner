name: C3 SkillRouter Batched Spent Screen
on:
  push:
    paths:
      - ".github/workflows/c3-skillrouter-batched-spent.yml"
      - "cognitive_c3_skillrouter_batched_spent/**"
permissions:
  contents: write
jobs:
  screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify frozen bytes
        run: |
          set -euo pipefail
          test "$(git hash-object cognitive_c3_skillrouter_batched_spent/episodes.json)" = "439a13dfd5824117e3d50a7a5673056cbc745dfd"
          test "$(git hash-object cognitive_c3_skillrouter_batched_spent/cognitive_tool_router.py)" = "e947d086225aa165895dc5addd4847fb686b3454"
      - name: Run batched screen
        id: screen
        shell: bash
        run: |
          set +e
          {
            python -m pip install --upgrade pip
            python -m pip install "transformers>=4.51" torch huggingface-hub accelerate
            python cognitive_c3_skillrouter_batched_spent/probe.py
            cat cognitive_c3_skillrouter_batched_spent/result.json
          } > cognitive_c3_skillrouter_batched_spent/run.log 2>&1
          rc=$?
          cat cognitive_c3_skillrouter_batched_spent/run.log
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"
      - name: Persist result
        if: always()
        shell: bash
        env:
          OUTCOME: ${{ steps.screen.outcome }}
          RC: ${{ steps.screen.outputs.rc }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path("cognitive_c3_skillrouter_batched_spent")
          ex=(p/"result.json").exists()
          (p/"status.json").write_text(json.dumps({
            "schema":"PROJECT_BRAIN_VISIBLE_EXECUTION_STATUS_V1",
            "probe":"C3_SKILLROUTER_BATCHED_SPENT_SCREEN",
            "workflow_run_id":os.environ["GITHUB_RUN_ID"],
            "head_sha":os.environ["GITHUB_SHA"],
            "outcome":os.environ.get("OUTCOME"),
            "rc":os.environ.get("RC"),
            "result_exists":ex,
            "terminal_state":"SUCCESS" if os.environ.get("OUTCOME")=="success" and ex else "FAILURE",
            "capability_credit_delta":0
          },indent=2)+"\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cognitive_c3_skillrouter_batched_spent/status.json cognitive_c3_skillrouter_batched_spent/run.log
          test ! -f cognitive_c3_skillrouter_batched_spent/result.json || git add cognitive_c3_skillrouter_batched_spent/result.json
          git commit -m "Record C3 SkillRouter batched spent screen"
          git pull --rebase origin main
          git push
