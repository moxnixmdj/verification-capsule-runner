name: Verify Brain final Root2 compressed frontier

on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/root2_compressed_frontier_final/**"
      - ".github/workflows/verify-brain-root2-compressed-frontier-final.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify final Root2 compressed frontier
        run: python capsules/root2_compressed_frontier_final/verify.py
