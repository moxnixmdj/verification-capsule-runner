name: Verify corrected Root2 19-predicate reactivation V1

on:
  pull_request:
    paths:
      - 'verify_root2_19_post_livebench_revocation_reactivation_v1_20261004.py'
      - 'subject/root2_19_post_livebench_revocation_reactivation_v1_20261004/**'
      - '.github/workflows/verify-root2-19-post-livebench-revocation-reactivation-v1-20261004.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run independent exact-byte projection verifier
        run: python verify_root2_19_post_livebench_revocation_reactivation_v1_20261004.py
