name: Supreme TB4 photonic self-check

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'supreme_tb4_photonic/**'
      - '.github/workflows/supreme-tb4-photonic-selfcheck.yml'

permissions:
  contents: read

jobs:
  selfcheck:
    if: github.head_ref == 'verify/supreme-tb4-photonic-selfcheck-20260930-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Bind allowed Terminal-Bench task surfaces only
        shell: bash
        run: |
          set -euo pipefail
          git init terminal-bench
          git -C terminal-bench remote add origin https://github.com/harbor-framework/terminal-bench.git
          git -C terminal-bench fetch --depth=1 origin 452bf305c6daa62fc59061d22133a7cbc7c1572e
          git -C terminal-bench checkout --detach FETCH_HEAD
          test "$(git -C terminal-bench rev-parse HEAD)" = "452bf305c6daa62fc59061d22133a7cbc7c1572e"
          test "$(git -C terminal-bench hash-object tasks/photonic-waveguide-routing/instruction.md)" = "0176a6c48cd1ce41e0ff90819669ab56954a1395"
          test "$(git -C terminal-bench hash-object tasks/photonic-waveguide-routing/task.toml)" = "30effc9474322047e155854eea2fa7850329ad5a"
          test "$(git -C terminal-bench hash-object tasks/photonic-waveguide-routing/environment/Dockerfile)" = "7e31afdcb0df585966aafc4bd643b77ed50c70f2"
          test "$(git -C terminal-bench hash-object tasks/photonic-waveguide-routing/environment/check_routing.py)" = "9f2fa17a8fce5fd01d1828032d53111ee112dc17"
          test "$(git -C terminal-bench hash-object tasks/photonic-waveguide-routing/environment/layout_spec.json)" = "e9e7697924cea692c88094e9c32c39a89a333027"
          test ! -e supreme_tb4_photonic/solution
          test ! -e supreme_tb4_photonic/tests

      - name: Record candidate identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p supreme_tb4_photonic/evidence
          sha256sum supreme_tb4_photonic/routing_result_1.json | tee supreme_tb4_photonic/evidence/candidate.sha256
          git hash-object supreme_tb4_photonic/routing_result_1.json | tee supreme_tb4_photonic/evidence/candidate.gitblob

      - name: Run public environment checker
        id: public_checker
        shell: bash
        run: |
          set -uo pipefail
          sudo mkdir -p /app
          sudo cp terminal-bench/tasks/photonic-waveguide-routing/environment/layout_spec.json /app/layout_spec.json
          sudo cp supreme_tb4_photonic/routing_result_1.json /app/routing_result_1.json
          set +e
          python3 terminal-bench/tasks/photonic-waveguide-routing/environment/check_routing.py --layout 1 | tee supreme_tb4_photonic/evidence/environment-check.log
          code=${PIPESTATUS[0]}
          python3 supreme_tb4_photonic/diagnose_pairs.py
          exit "$code"

      - name: Run adversarial negative checks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import copy, importlib.util, json, pathlib, sys
          root=pathlib.Path.cwd()
          checker_path=root/'terminal-bench/tasks/photonic-waveguide-routing/environment/check_routing.py'
          spec=importlib.util.spec_from_file_location('tb4_photonic_checker',checker_path)
          mod=importlib.util.module_from_spec(spec); sys.modules[spec.name]=mod; spec.loader.exec_module(mod)
          data=json.loads((root/'supreme_tb4_photonic/routing_result_1.json').read_text())
          bad_endpoint=copy.deepcopy(data)
          bad_endpoint['nets']['net_00']['waypoints'][0]=[13,460]
          p1,_,_=mod.validate(bad_endpoint,verbose=False,layout_cfg=mod.LAYOUTS[1])
          bad_obstacle=copy.deepcopy(data)
          bad_obstacle['nets']['net_04']['waypoints']=[[12,500],[2412,500]]
          p2,_,_=mod.validate(bad_obstacle,verbose=False,layout_cfg=mod.LAYOUTS[1])
          if p1 or p2:
              raise SystemExit('NEGATIVE_MUTATION_NOT_REJECTED')
          out={'endpoint_mutation_rejected':not p1,'obstacle_mutation_rejected':not p2}
          (root/'supreme_tb4_photonic/evidence/negative-checks.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,sort_keys=True))
          PY

      - name: Upload self-check evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: supreme-tb4-photonic-selfcheck
          if-no-files-found: warn
          path: supreme_tb4_photonic/evidence/
