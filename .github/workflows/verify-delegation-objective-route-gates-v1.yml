name: Verify delegation objective route gates
on:
  pull_request:
    paths:
      - 'verification/objective_oracle_dominance_compiler.py'
      - 'verification/objective_oracle_live_input.json'
      - 'verification/verify_delegation_objective_route_gates.py'
      - '.github/workflows/verify-delegation-objective-route-gates-v1.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Bind exact Brain blobs
        run: |
          test "$(git hash-object verification/objective_oracle_dominance_compiler.py)" = "c00d59dd0ab7df6ffb0ba5c26a1cb2a5cd82203c"
          test "$(git hash-object verification/objective_oracle_live_input.json)" = "cdd5e2a3e3b4aee942bd0c5fe7f0423180b50240"
      - run: python verification/verify_delegation_objective_route_gates.py
