name: Harbor transport boundary capsule
on:
  push:
    branches: [main]
    paths:
      - capsules/harbor_transport/**
      - .github/workflows/harbor-transport-boundary-capsule.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: capsules/harbor_transport
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: PYTHONPATH=. python canonical/runtime/harbor_adapter_transport_preflight.py
