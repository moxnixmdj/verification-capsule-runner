name: Verify one-use benchmark atomic claim V1
on:
  push:
    branches:
      - "verify/one-use-benchmark-atomic-claim-v1-20261004"
  pull_request:
    branches: [main]
    paths:
      - "subject/one_use_benchmark_atomic_claim_v1/**"
      - "verify_one_use_benchmark_atomic_claim_v1.py"
      - ".github/workflows/verify-one-use-benchmark-atomic-claim-v1.yml"
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.14"
      - name: Verify exact package and real atomic create semantics
        env:
          GH_TOKEN: ${{ github.token }}
        run: python verify_one_use_benchmark_atomic_claim_v1.py
