name: Verify LiveBench frozen runtime closure V1
on:
  pull_request:
    paths:
      - 'verify_livebench_frozen_runtime_closure_v1.py'
      - 'subject/livebench_frozen_runtime_closure_v1/**'
      - '.github/workflows/verify-livebench-frozen-runtime-closure-v1.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run frozen zero-case closure verifier
        run: python verify_livebench_frozen_runtime_closure_v1.py
