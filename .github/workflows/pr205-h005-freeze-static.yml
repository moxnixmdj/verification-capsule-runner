name: PR205 H005 Freeze Static Check

on:
  push:
    branches: [main]
    paths:
      - ARM_PR205_H005_FREEZE_STATIC

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Static freeze checks only
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile diagnostics/pr205/run_h005.py
          python3 - <<'PY'
          import json, pathlib
          root=pathlib.Path("diagnostics/pr205")
          spec=json.loads((root/"H005.json").read_text())
          runner=(root/"run_h005.py").read_text()
          assert spec["freshness"]=={"state":"UNSPENT","execution_count":0,"same_case_replay_allowed":False,"first_terminal_result_authoritative":True}
          assert spec["validation_id"]=="XAPIAN-APT-E2E-INTEGRATION-HELDOUT-005"
          assert spec["orthogonality_precommit"]["precommitted_material_dimensions"]==["domain","execution_surface"]
          assert spec["runtime_integrity"]["immutable_baseline_blobs"]["canonical/runtime/verify_pending_cli_binding.py"]=="a6b028c25d79d2dff59c87e3b3ad91d9fe934dae"
          assert "HELDOUT_004" not in runner and "HELDOUT-004" not in runner
          assert "REFERENCE_ACQUISITION" not in runner and "reference_supplier" not in runner
          assert "ubuntu-24.04-direct-host" in runner
          assert '["zbarimg","--quiet","--raw",str(output_path)]' in runner
          print("PR205_H005_FREEZE_STATIC_PASS")
          PY
