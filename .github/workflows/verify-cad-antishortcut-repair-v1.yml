name: Verify CAD antishortcut repair v1
on:
  pull_request:
    branches: [main]
    paths:
      - 'capsules/cad_antishortcut_repair_v1/**'
      - '.github/workflows/verify-cad-antishortcut-repair-v1.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact repaired Brain candidate blob
        run: test "$(git hash-object capsules/cad_antishortcut_repair_v1/canonical/runtime/cad_t0_route_specific_candidate_v1.py)" = "aa32750b220a023617938b7be9476f6b3aac6704"
      - name: Run repaired render-equivalence tests
        working-directory: capsules/cad_antishortcut_repair_v1
        run: PYTHONPATH=. python -m unittest -v canonical.tests.test_cad_t0_source_structure_antishortcut_repair_v1
