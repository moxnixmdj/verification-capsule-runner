name: Verify CAD anti-shortcut repair v1
on:
  pull_request:
    branches: [main]
    paths:
      - canonical/runtime/cad_t0_route_specific_candidate_v1.py
      - canonical/tests/test_cad_t0_source_structure_antishortcut_repair_v1.py
      - .github/workflows/verify-cad-antishortcut-repair-v1.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Bind exact repaired Brain bytes
        run: |
          set -euo pipefail
          test "$(git hash-object canonical/runtime/cad_t0_route_specific_candidate_v1.py)" = "9a2838b146427c7ebaa9cb56795e6f2b202477c2"
          test "$(git hash-object canonical/tests/test_cad_t0_source_structure_antishortcut_repair_v1.py)" = "50a3eeed9b4b0c141f7019e3c569d233d4840b95"
      - name: Run exact anti-shortcut regression
        run: python -m unittest -v canonical.tests.test_cad_t0_source_structure_antishortcut_repair_v1
      - name: Re-run all frozen CAD geometry families
        run: python -m unittest -v canonical.tests.test_cad_t0_route_specific_candidate_v1
