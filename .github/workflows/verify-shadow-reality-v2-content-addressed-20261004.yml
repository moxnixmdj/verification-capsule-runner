name: Verify content-addressed shadow reality V2 activation

on:
  pull_request:
    paths:
      - 'verify_shadow_reality_v2_content_addressed_20261004.py'
      - 'subject/shadow_reality_v2_content_addressed_20261004/**'
      - '.github/workflows/verify-shadow-reality-v2-content-addressed-20261004.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python verify_shadow_reality_v2_content_addressed_20261004.py
