name: Execute TB-Science rank8 one-shot

on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/tb_science_rank8_20261007_v1/ACTIVATE_RANK8_PR.json"

permissions:
  contents: read

concurrency:
  group: tb-science-rank8-one-shot
  cancel-in-progress: true

jobs:
  suspended-rank8-cancel-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse suspended rank8 execution
        run: |
          echo "Rank8 execution authority is suspended before exposure in canonical Brain."
          echo "Cancel stale rank8 concurrency only. No benchmark task may be exposed."
          exit 0

# cancel-only main push sentinel: rank8 authority suspended before exposure
