name: Verify V20 fresh frozen-V4 retrieval holdout
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/verify-rank26-exact-surface.yml'
      - 'canonical/runtime/retrieval_fresh_v4_holdout_v20.py'
      - 'canonical/tests/test_retrieval_fresh_v4_holdout_v20.py'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: test "$(git hash-object canonical/runtime/retrieval_fresh_v4_holdout_v20.py)" = "bc16dcb63ed882005cb8e836f4fad4c47e19d3de"
      - run: test "$(git hash-object canonical/tests/test_retrieval_fresh_v4_holdout_v20.py)" = "cbd75bf9142c3a24bb49e389f1d594b1a2e590cc"
      - run: PYTHONPATH=. python canonical/tests/test_retrieval_fresh_v4_holdout_v20.py
      - run: PYTHONPATH=. python canonical/runtime/retrieval_fresh_v4_holdout_v20.py
