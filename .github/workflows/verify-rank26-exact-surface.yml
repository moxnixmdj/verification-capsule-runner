name: Cancel revoked LiveBench V7 replay
on:
  push:
    branches:
      - "execute/livebench-v7-sanitized-replay72-20261004-0937"
permissions:
  actions: write
  contents: read
jobs:
  cancel:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Cancel stale-authority run
        run: |
          code=$(curl -sS -o /tmp/cancel.out -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/moxnixmdj/verification-capsule-runner/actions/runs/37192800271/cancel")
          test "$code" = "202" || test "$code" = "409"
          echo "CANCEL_HTTP=$code"
