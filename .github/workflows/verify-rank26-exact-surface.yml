name: Verify rank26 exact vLLM execution surface
on:
  pull_request:
    branches: [main]
    paths:
      - 'verification/rank26_surface/Dockerfile'
      - '.github/workflows/verify-rank26-exact-surface.yml'
      - 'verification/rank26_surface/trigger.txt'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify exact Dockerfile Git blob
        run: |
          test "$(git hash-object verification/rank26_surface/Dockerfile)" = "aae5ccf4a5fc9f28e375bf98337c6a34b74c963f"
      - name: Build exact frozen task image
        run: docker build --pull -t brain-rank26-surface verification/rank26_surface
      - name: Verify declared surface without task execution
        run: |
          docker run --rm --entrypoint /bin/bash brain-rank26-surface -lc '
            set -euo pipefail
            test -d /app/vllm/vllm/reasoning
            test -d /app/vllm/vllm
            test -L "$(python3 -c "import os, vllm; print(os.path.dirname(vllm.__file__))")" || true
            python3 - <<'"'"'PY'"'"'
          import importlib.metadata, pathlib
          assert importlib.metadata.version("vllm") == "0.21.0"
          assert pathlib.Path("/app/vllm/vllm/reasoning").is_dir()
          print("RANK26_EXACT_SURFACE_PASS")
          PY
          '
