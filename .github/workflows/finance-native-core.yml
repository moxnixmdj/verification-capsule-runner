name: Verify Finance Brain-native core

on:
  pull_request:
    branches: [main]
    paths:
      - "canonical/runtime/finance_agent_v2_brain_native_llm_v1.py"
      - "canonical/runtime/finance_quantitative_dependency_v1.py"
      - "canonical/runtime/finance_quantitative_question_contract_v1.py"
      - "canonical/runtime/finance_metric_xbrl_registry_v1.py"
      - "canonical/runtime/finance_agent_v2_zero_spend_adapter_v1.py"
      - "canonical/runtime/zero_spend_provider_guard_v1.py"
      - "canonical/integrations/brain_fabv2_native_v1/**"
      - "canonical/tests/test_finance_agent_v2_valkyrie_native_bundle_v1.py"
      - ".github/workflows/finance-native-core.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bind exact Brain adapter blobs
        run: |
          test "$(git hash-object canonical/runtime/finance_agent_v2_brain_native_llm_v1.py)" = "9ec61256da933b91edad92620fd3d019ac141eff"
          test "$(git hash-object canonical/runtime/finance_quantitative_dependency_v1.py)" = "57d250414b1f064dd243d1d98e8cde7c85cf6858"
          test "$(git hash-object canonical/runtime/finance_quantitative_question_contract_v1.py)" = "24a17cf65b0db07fedef9d1a99b1662b58c0448c"
          test "$(git hash-object canonical/runtime/finance_metric_xbrl_registry_v1.py)" = "a64271e46811c8c1a440a344045ca1f38c30a519"
          test "$(git hash-object canonical/runtime/finance_agent_v2_zero_spend_adapter_v1.py)" = "c90d2e693621ae0a268e3c4f96bbdbfdcc827ec2"
          test "$(git hash-object canonical/runtime/zero_spend_provider_guard_v1.py)" = "356af559fc74ac3eab5532b2d8fee9ddfb98f962"
          test "$(git hash-object canonical/integrations/brain_fabv2_native_v1/run_agent.py)" = "bc8c5a98e52acf4d5df5922806b1d1f7f3580697"
          test "$(git hash-object canonical/integrations/brain_fabv2_native_v1/setup.sh)" = "fa13ff711cb3d53b189f12b8e867a55ba128ae50"
          test "$(git hash-object canonical/integrations/brain_fabv2_native_v1/contract.yaml)" = "344d5b8726c7c4ada28d7c73df51eb734474e512"
          test "$(git hash-object canonical/tests/test_finance_agent_v2_valkyrie_native_bundle_v1.py)" = "81e616679a4c90b4b3a003f7688fa53de6a10fe7"
      - name: Compile exact adapter subject
        run: |
          python -m py_compile canonical/integrations/brain_fabv2_native_v1/run_agent.py
          python -m py_compile canonical/runtime/finance_agent_v2_brain_native_llm_v1.py
          python -m py_compile canonical/runtime/finance_quantitative_dependency_v1.py
          python -m py_compile canonical/runtime/finance_quantitative_question_contract_v1.py
          python -m py_compile canonical/runtime/finance_metric_xbrl_registry_v1.py
          python -m py_compile canonical/runtime/finance_agent_v2_zero_spend_adapter_v1.py
          python -m py_compile canonical/runtime/zero_spend_provider_guard_v1.py
      - name: Run exact adapter tests
        env:
          PYTHONPATH: .
        run: python -m unittest canonical.tests.test_finance_agent_v2_valkyrie_native_bundle_v1 -v
