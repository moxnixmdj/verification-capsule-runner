name: Verify Finance Brain-native core

on:
  pull_request:
    branches: [main]
    paths:
      - "canonical/runtime/finance_agent_v2_keyless_public_tools_v1.py"
      - "canonical/tests/test_finance_agent_v2_keyless_public_tools_v1.py"
      - ".github/workflows/finance-native-core.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bind exact Brain keyless tool blobs
        run: |
          test "$(git hash-object canonical/runtime/finance_agent_v2_keyless_public_tools_v1.py)" = "e393d2cb6d0a02b8e6976417e4a5e41264c9c263"
          test "$(git hash-object canonical/tests/test_finance_agent_v2_keyless_public_tools_v1.py)" = "910fd28d8ccbc12620d32255b1f9f9be2e02f15d"
      - name: Compile exact subject
        run: |
          python -m py_compile canonical/runtime/finance_agent_v2_keyless_public_tools_v1.py
          python -m py_compile canonical/tests/test_finance_agent_v2_keyless_public_tools_v1.py
      - name: Run exact keyless Finance tool tests
        env:
          PYTHONPATH: .
        run: python -m unittest canonical.tests.test_finance_agent_v2_keyless_public_tools_v1 -v
