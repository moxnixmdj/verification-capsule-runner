name: Verify LiveBench legacy predecessor joint witness V1

on:
  push:
    branches:
      - verify/livebench-legacy-predecessor-joint-v1-20261004-sol
    paths:
      - subject/livebench_legacy_predecessor_joint_v1/canonical/runtime/livebench_legacy_visible_constraint_compiler_v1.py
      - subject/livebench_legacy_predecessor_joint_v1/canonical/runtime/livebench_legacy_visible_constraint_compiler_v4.py
      - subject/livebench_legacy_predecessor_joint_v1/canonical/runtime/livebench_frozen_active_legacy15_v1.py
      - subject/livebench_legacy_predecessor_joint_v1/canonical/runtime/livebench_legacy15_joint_witness_v1.py
      - subject/livebench_legacy_predecessor_joint_v1/verify_joint_predecessor.py
      - .github/workflows/verify-livebench-legacy-predecessor-joint-v1.yml

permissions:
  contents: write

concurrency:
  group: livebench-legacy-predecessor-joint-v1
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install exact replay dependencies
        run: |
          python -m pip install --disable-pip-version-check --quiet \
            pyarrow==21.0.0 nltk==3.9.2 langdetect==1.0.9 immutabledict==4.2.1
          python - <<'PY'
          import nltk
          for name in ("punkt", "punkt_tab"):
              nltk.download(name, quiet=True)
          PY

      - name: Checkout exact frozen legacy scorer
        run: |
          git clone --filter=blob:none https://github.com/LiveBench/LiveBench.git /tmp/livebench
          git -C /tmp/livebench checkout 8f8e5c381a16e3f24257776edd53471fe86f8091
          test "$(git -C /tmp/livebench hash-object livebench/if_runner/instruction_following_eval/instructions_registry.py)" = "903ed738398648c7cfac61d5ffa478c22f1f0891"
          test "$(git -C /tmp/livebench hash-object livebench/if_runner/instruction_following_eval/instructions.py)" = "4997bab885a676d92545fd91a9a20b48d234a2b2"
          test "$(git -C /tmp/livebench hash-object livebench/if_runner/instruction_following_eval/instructions_util.py)" = "1f0dc0eaa05bd0f72f82f8183b90276ea4d2a87b"

      - name: Replay visible-only joint witness on removed predecessor
        id: replay
        continue-on-error: true
        env:
          LIVEBENCH_ROOT: /tmp/livebench
        run: |
          cd subject/livebench_legacy_predecessor_joint_v1
          python verify_joint_predecessor.py

      - name: Commit compact receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          RECEIPT="subject/livebench_legacy_predecessor_joint_v1/livebench_legacy_predecessor_joint_receipt_v1.json"
          test -f "$RECEIPT"
          rm -f "subject/livebench_legacy_predecessor_joint_v1/predecessor.parquet"
          git config user.name "project-brain-verifier"
          git config user.email "actions@users.noreply.github.com"
          git add "$RECEIPT"
          if git diff --cached --quiet; then
            echo "receipt unchanged"
          else
            git commit -m "Record legacy joint predecessor replay receipt"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Enforce replay result
        if: steps.replay.outcome != 'success'
        run: exit 1
