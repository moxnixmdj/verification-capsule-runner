name: Verify dual judgment source gate activation V1
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/dual_judgment_source_gate_activation_v1/**"
      - ".github/workflows/verify-dual-judgment-source-gate-activation-v1.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python capsules/dual_judgment_source_gate_activation_v1/verify.py
