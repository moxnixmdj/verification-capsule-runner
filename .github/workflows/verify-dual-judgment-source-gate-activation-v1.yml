name: Verify dual judgment source gate activation V1

on:
  push:
    branches: ["verify/dual-judgment-source-gate-activation-v1-20261003-sol"]
    paths:
      - ".github/workflows/verify-dual-judgment-source-gate-activation-v1.yml"
      - "capsules/dual_judgment_source_gate_activation_v1/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/verify-dual-judgment-source-gate-activation-v1.yml"
      - "capsules/dual_judgment_source_gate_activation_v1/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact two-requirement activation
        working-directory: capsules/dual_judgment_source_gate_activation_v1
        run: |
          set -euo pipefail
          test "$(git hash-object canonical/governance/DUAL_JUDGMENT_SOURCE_GATE_ACTIVATION_V1.json)" = "4211a0eee07c4758035d788c0be897d700c164cb"
          test "$(git hash-object canonical/runtime/dual_judgment_source_gate_activation_v1.py)" = "259e1bcbb51c0c2ece4fbed94a27423f7a93c0f1"
          PYTHONPATH=. python -m canonical.runtime.dual_judgment_source_gate_activation_v1 > /tmp/verdict.json
          python - <<'PY'
          import json
          x=json.load(open("/tmp/verdict.json"))
          assert x["pass"] is True, x
          assert len(x["discharged_requirements"]) == 2
          assert x["remaining_acceptance_predicate_delta"] == 0
          assert x["new_reality_units_consumed"] == 0
          assert x["global_fresh_reality_authority"] is False
          print("DUAL_JUDGMENT_SOURCE_GATE_ACTIVATION_V1_PASS")
          PY
