name: Verify Brain PR 1080 P1 identifiability reconciliation
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/brain_pr_1080_p1_reconcile/**"
      - ".github/workflows/verify-brain-pr-1080-p1-identifiability-reconcile.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact Brain blob identities
        run: |
          cd capsules/brain_pr_1080_p1_reconcile
          python - <<'PY'
          import hashlib,json,pathlib
          m=json.load(open("EXPECTED_BRAIN_BLOBS.json",encoding="utf-8"))
          for src,expected in m["exact_brain_blobs"].items():
              data=pathlib.Path(src).read_bytes()
              got=hashlib.sha1(f"blob {len(data)}\0".encode()+data).hexdigest()
              assert got==expected,(src,got,expected)
          print("exact Brain PR 1080 blobs: PASS")
          PY
      - name: Verify frontier reconciliation invariants
        run: |
          cd capsules/brain_pr_1080_p1_reconcile
          python - <<'PY'
          import json,pathlib
          OLD_BLOCK="17_OF_19_OPUS55_ACCEPTANCE_FAMILIES_OPEN__31_OF_38_ATOMIC_PREDICATES_UNRESOLVED__P1_V7_DIRECT_SURFACE_SCOPE_TRANSPORT_AND_V4_PRIVATE_CORPUS_FREEZE_PENDING"
          NEW_BLOCK="17_OF_19_OPUS55_ACCEPTANCE_FAMILIES_OPEN__31_OF_38_ATOMIC_PREDICATES_UNRESOLVED__P1_FAILURE_SEMANTICS_UPSTREAM_EVIDENCE_OR_EQUIVALENT_DISCRIMINATOR_SEARCH_AND_V4_PRIVATE_CORPUS_FREEZE_PENDING"
          OLD_ACTION="BUILD_AND_INDEPENDENTLY_VERIFY_P1_V7_DIRECT_SURFACE_SCOPE_TRANSPORT_GATE__IN_PARALLEL_ACTIVATE_VERIFIED_PROOF_ATOM_RECEIPT_INDEX_V4_AND_FREEZE_ONE_CLEAN_CONTENT_ADDRESSED_FULL_BRAIN_CORPUS_SCAN__NO_FRESH_TERMINAL_REPLAY__ZERO_ACCEPTANCE_CREDIT_UNTIL_FIXED_POINT"
          NEW_ACTION="SEARCH_EXISTING_CONTENT_ADDRESSED_UPSTREAM_EVIDENCE_FOR_FAILURE_SEMANTICS_OR_AN_INDEPENDENTLY_PROVED_EQUIVALENT_DISCRIMINATOR_BOUND_TO_THE_THREE_FROZEN_P1_DIRECT_SURFACES__IN_PARALLEL_FREEZE_ONE_CLEAN_CONTENT_ADDRESSED_FULL_BRAIN_CORPUS_SCAN_WITH_VERIFIED_V4_INDEX_USING_AN_ALTERNATE_PRIVATE_SAFE_CARRIER__IF_NO_DISCRIMINATOR_EXISTS_AFTER_ZERO_REALITY_SATURATION_CLASSIFY_P1_AS_INFORMATION_OR_SPECIFICATION_RESIDUAL_AND_RECOMPUTE_MINIMUM_REALITY_CUT__NO_FRESH_TERMINAL_REPLAY__ZERO_ACCEPTANCE_CREDIT_UNTIL_FIXED_POINT"
          OLD_EVENT="V7_P1_SCOPE_TRANSPORT_CLOSES_OR_FALSIFIES_FURTHER__OR_V4_PRIVATE_CORPUS_FREEZE_PRODUCES_A_VERIFIED_ZERO_REALITY_RECEIPT_DELTA__NO_NEW_ACCEPTANCE_CREDIT_WITHOUT_FIXED_POINT"
          NEW_EVENT="P1_UPSTREAM_DISCRIMINATOR_FOUND_AND_SCOPE_TRANSPORT_REOPENED__OR_P1_IRREDUCIBLE_INFORMATION_RESIDUAL_PROVED__OR_V4_PRIVATE_CORPUS_FREEZE_PRODUCES_A_VERIFIED_ZERO_REALITY_RECEIPT_DELTA__NO_NEW_ACCEPTANCE_CREDIT_WITHOUT_FIXED_POINT"
          root=pathlib.Path(".")
          files=[
              "canonical/CANONICAL_POINTER.json",
              "canonical/capabilities/FRONTIER_CAPABILITY_OBSOLESCENCE_QUEUE_V1.json",
              "canonical/capabilities/frontier/OPUS_5_5_USEFUL_CAPABILITY_OWNERSHIP_V1.json",
              "canonical/governance/ACTIVE_GOAL_HIERARCHY_V1.json",
              "canonical/governance/REAL_OUTPUT_SCOREBOARD_V1.json",
          ]
          texts={p:(root/p).read_text(encoding="utf-8") for p in files}
          for p,t in texts.items():
              assert OLD_BLOCK not in t,(p,"stale blocker")
              assert OLD_ACTION not in t,(p,"stale action")
              assert OLD_EVENT not in t,(p,"stale event")
          target=json.loads(texts["canonical/capabilities/frontier/OPUS_5_5_USEFUL_CAPABILITY_OWNERSHIP_V1.json"])
          assert target["residual_gap"]==NEW_BLOCK
          assert target["current_atomic_blocker"]==NEW_BLOCK
          assert target["next_action"]==NEW_ACTION
          assert target["current_atomic_next_action"]==NEW_ACTION
          assert target["next_progress_event_target"]==NEW_EVENT
          truth=target["acceptance_truth"]
          assert truth=={
              "accepted_families":2,
              "total_families":19,
              "proved_atomic_predicates":7,
              "unresolved_atomic_predicates":31,
              "total_atomic_predicates":38,
              "achieved":False,
          },truth
          receipt="canonical/verification/P1_V7_DIRECT_SURFACE_TRANSPORT_AND_IDENTIFIABILITY_PUBLIC_RUNNER_VERIFICATION_20261003_V1.json"
          assert receipt in target["authority"]
          assert any("CURRENT_FROZEN_PROJECTION_NONIDENTIFYING" in x for x in target["constraints"])
          hierarchy=json.loads(texts["canonical/governance/ACTIVE_GOAL_HIERARCHY_V1.json"])
          assert hierarchy["current_parent_blocker"]==NEW_BLOCK
          assert hierarchy["next_required_action_class"]==NEW_ACTION
          assert hierarchy["next_progress_event_target"]==NEW_EVENT
          intent=json.load(open("canonical/action_intents/2026-10-03_RECONCILE_P1_IDENTIFIABILITY_FRONTIER_V1.json",encoding="utf-8"))
          assert intent["canonical_base_commit"]=="88a7c50164da9619d92b7b9071b98d6742a3ad89"
          assert intent["observed_terminal_delta"]["unresolved_atomic_predicates_delta"]==0
          assert intent["observed_terminal_delta"]["accepted_family_delta"]==0
          assert intent["observed_terminal_delta"]["new_reality_units_consumed"]==0
          assert "NO_DETERMINISTIC_ADAPTER" in intent["observed_terminal_delta"]["new_proved_impossibility"]
          assert intent["execution_authority"] is False and intent["promotion_authority"] is False
          print("Brain PR 1080 reconciliation invariants: PASS")
          PY
