name: Verify LiveBench legacy15 universal exact V2

on:
  push:
    branches: [main]
    paths:
      - 'verify_livebench_legacy15_universal_exact_v2_20261004.py'
  pull_request:
    paths:
      - 'verify_livebench_legacy15_universal_exact_v2_20261004.py'
      - 'subject/livebench_legacy15_joint_historical_replay_v1_20261004/**'
      - '.github/workflows/verify-livebench-legacy15-joint-historical-replay-v1-20261004.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact scorer dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir langdetect==1.0.9 nltk==3.9.2 immutabledict==4.2.1
          python - <<'PY'
          import nltk
          for name in ["punkt","punkt_tab"]:
              nltk.download(name, quiet=True)
          PY
      - name: Checkout exact frozen LiveBench checker source
        run: |
          git clone --filter=blob:none https://github.com/LiveBench/LiveBench.git /tmp/livebench
          git -C /tmp/livebench checkout 8f8e5c381a16e3f24257776edd53471fe86f8091
      - name: Run 7424-case zero-terminal universal exact audit
        run: python verify_livebench_legacy15_universal_exact_v2_20261004.py
