name: Verify clean post-delegation authority v11

on:
  pull_request:
    paths:
      - 'capsules/post_delegation_authority_v11_clean/**'
      - '.github/workflows/verify-clean-post-delegation-authority-v11.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify exact Brain blob identities
        env:
          EXPECTED_JSON: '{"capsules/post_delegation_authority_v11_clean/canonical/capabilities/opus55/OPUS_5_5_USEFUL_CAPABILITY_ENVELOPE_V1.json":"661a57f839101fbf54c7e4edc76166c65ce9327d","capsules/post_delegation_authority_v11_clean/canonical/governance/OPUS55_TERMINAL_PROOF_PROTOCOLS_V1.json":"eb4bca0fe6a015d49d2854998fbe046c979c7ea9","capsules/post_delegation_authority_v11_clean/canonical/verification/TERMINAL_V3_POSTWAVE_CONTRACT_AND_FAMILY_REDUCTION_20261002_V1.json":"51e3e7578e9adbeee2168d2223b84481fea16a09","capsules/post_delegation_authority_v11_clean/canonical/governance/OPUS55_ACCEPTANCE_PROOF_TRANSMUTATION_INPUT_V1.json":"96052a6b5178305b37a2526fb25c3f53fa33b9b5","capsules/post_delegation_authority_v11_clean/canonical/runtime/acceptance_proof_transmuter_v1.py":"0580f9819b5465c9617f0a1e8ff9a96902eedfc6","capsules/post_delegation_authority_v11_clean/canonical/runtime/opus55_acceptance_calibration_reducer_v2.py":"73b0b27644e0fa0d89ff8fbdb51005c20eae3632","capsules/post_delegation_authority_v11_clean/canonical/tests/test_opus55_acceptance_calibration_reducer_v2.py":"3910124f80c716e08e5e0863b9501b7d1ac6cf98","capsules/post_delegation_authority_v11_clean/canonical/governance/OPUS55_ACCEPTANCE_PREDICATE_REGISTRY_V2.json":"562536d9ba3f245a6bd24490a1eb3b30f27e0c3a","capsules/post_delegation_authority_v11_clean/canonical/governance/OPUS55_ACCEPTANCE_PREDICATE_EVIDENCE_BINDINGS_V2.json":"f500b56e7349ce8c0f97cfd0bd1db4888ec6887c","capsules/post_delegation_authority_v11_clean/canonical/reasoning/2026-10-02_EXACT_OPUS55_ZERO_COST_COMPARATOR_ROUTE_RECONCILIATION_V1.json":"f67e22cee5e6fce1ebfae92ebf0946f78fafcee1","capsules/post_delegation_authority_v11_clean/canonical/governance/OPUS55_PUBLIC_BAR_SCORE_READINESS_MATRIX_V1.json":"4e59e30461c9ff1bee1a9474627d5fb4074844b2","capsules/post_delegation_authority_v11_clean/canonical/runtime/opus55_acceptance_residual_compiler_v2.py":"cae5bc3bfda9c77d7d7e5151127f55aafddb9522","capsules/post_delegation_authority_v11_clean/canonical/runtime/terminal_action_coverage_guard_v1.py":"554ab5b928a5f6cf050e43969dae549d887b0845","capsules/post_delegation_authority_v11_clean/canonical/governance/OPUS55_ACCEPTANCE_ACTION_HYPERGRAPH_V1.json":"755a3291d8271acb3eb3a9f5db0857235fa0efd9","capsules/post_delegation_authority_v11_clean/canonical/governance/DELEGATION_ACCEPTANCE_CEILING_WITNESS_V1.json":"cb3b7c4b6c4e1f2a0471c6b6be72c4ca9ebddc80","capsules/post_delegation_authority_v11_clean/canonical/verification/DELEGATION_TEMPORAL_PROOF_TRANSPORT_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json":"5278abb7fcaa6b97189b67598c75e4df395e1788","capsules/post_delegation_authority_v11_clean/canonical/verification/DELEGATION_TEMPORAL_CEILING_TRANSMUTATION_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json":"5023cc222a44f99b57785f5954cc95a29b739193"}'
        run: |
          python - <<'PY'
          import json, os, subprocess
          expected=json.loads(os.environ["EXPECTED_JSON"])
          bad=[]
          for path,want in expected.items():
              got=subprocess.check_output(["git","hash-object",path],text=True).strip()
              if got!=want:
                  bad.append(f"{path}: {got} != {want}")
          if bad:
              raise SystemExit("\n".join(bad))
          print("EXACT_BLOB_IDENTITY_PASS",len(expected))
          PY

      - name: Verify evidence ledger internal content addresses
        working-directory: capsules/post_delegation_authority_v11_clean
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          root=Path(".")
          ev=json.loads((root/"canonical/governance/OPUS55_ACCEPTANCE_PREDICATE_EVIDENCE_BINDINGS_V2.json").read_text())
          claims=ev["claims"]
          proved=[c for c in claims if c.get("state")=="PROVED"]
          assert len(proved)==9, len(proved)
          assert ev["saturation"]["proved_predicate_count"]==9
          assert ev["saturation"]["unresolved_predicate_count"]==29
          assert "9_PROVED" in ev["status"], ev["status"]
          d=next(c for c in claims if c["predicate_id"]=="DELEGATION_TERMINAL_SUCCESS_NONINFERIOR")
          assert d["state"]=="PROVED"
          assert d["source_path"]=="canonical/governance/DELEGATION_ACCEPTANCE_CEILING_WITNESS_V1.json"
          assert d["source_sha"]=="cb3b7c4b6c4e1f2a0471c6b6be72c4ca9ebddc80"
          support={x["path"]:x["sha"] for x in d["supporting_sources"]}
          expected_support={
            "canonical/verification/DELEGATION_TEMPORAL_PROOF_TRANSPORT_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json":"5278abb7fcaa6b97189b67598c75e4df395e1788",
            "canonical/verification/DELEGATION_TEMPORAL_CEILING_TRANSMUTATION_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json":"5023cc222a44f99b57785f5954cc95a29b739193",
            "canonical/verification/TERMINAL_V3_ONE_SHOT_WAVE_RESULT_20261002_V1.json":"bd86b4c53992b47a4a60b64a60ba03db9a442cfc",
          }
          assert support==expected_support, (support,expected_support)
          for rel in (
            "canonical/governance/DELEGATION_ACCEPTANCE_CEILING_WITNESS_V1.json",
            "canonical/verification/DELEGATION_TEMPORAL_PROOF_TRANSPORT_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json",
            "canonical/verification/DELEGATION_TEMPORAL_CEILING_TRANSMUTATION_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json",
          ):
              got=subprocess.check_output(["git","hash-object",str(root/rel)],text=True).strip()
              want=d["source_sha"] if rel==d["source_path"] else support[rel]
              assert got==want,(rel,got,want)
          print("DELEGATION_CONTENT_ADDRESS_CHAIN_PASS")
          PY

      - name: Run corrected calibration regression tests
        working-directory: capsules/post_delegation_authority_v11_clean
        env:
          PYTHONPATH: .
        run: |
          python -m unittest -v canonical.tests.test_opus55_acceptance_calibration_reducer_v2

      - name: Recompute exact 4 of 19 calibration
        working-directory: capsules/post_delegation_authority_v11_clean
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from canonical.runtime.opus55_acceptance_calibration_reducer_v2 import evaluate
          load=lambda p: json.loads(Path(p).read_text())
          out=evaluate(
            load("canonical/capabilities/opus55/OPUS_5_5_USEFUL_CAPABILITY_ENVELOPE_V1.json"),
            load("canonical/governance/OPUS55_TERMINAL_PROOF_PROTOCOLS_V1.json"),
            load("canonical/verification/TERMINAL_V3_POSTWAVE_CONTRACT_AND_FAMILY_REDUCTION_20261002_V1.json"),
            load("canonical/governance/OPUS55_ACCEPTANCE_PROOF_TRANSMUTATION_INPUT_V1.json"),
          )
          expected={"EXACT_SYMBOLIC_COMPUTATION","LONG_HORIZON_MEMORY_AND_CONTINUITY","TOOL_DISCOVERY_SELECTION_AND_LEARNING","SUBAGENT_DELEGATION_AND_COORDINATION"}
          assert out["errors"]==[],out
          assert out["behavioral_pass_family_count"]==19,out
          assert out["acceptance_calibrated_family_count"]==4,out
          assert out["acceptance_pending_family_count"]==15,out
          assert set(out["acceptance_calibrated_families"])==expected,out
          assert out["terminal_goal_acceptance_closed"] is False
          print("CALIBRATION_4_OF_19_PASS")
          PY

      - name: Recompute exact 9 of 38 atomic residual
        working-directory: capsules/post_delegation_authority_v11_clean
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from canonical.runtime.opus55_acceptance_residual_compiler_v2 import evaluate
          load=lambda p: json.loads(Path(p).read_text())
          out=evaluate(
            load("canonical/governance/OPUS55_ACCEPTANCE_PREDICATE_REGISTRY_V2.json"),
            load("canonical/governance/OPUS55_ACCEPTANCE_PREDICATE_EVIDENCE_BINDINGS_V2.json"),
            load("canonical/reasoning/2026-10-02_EXACT_OPUS55_ZERO_COST_COMPARATOR_ROUTE_RECONCILIATION_V1.json"),
            load("canonical/governance/OPUS55_PUBLIC_BAR_SCORE_READINESS_MATRIX_V1.json"),
          )
          assert out["errors"]==[],out
          assert out["predicate_count"]==38,out
          assert out["family_count"]==17,out
          assert out["proved_predicate_count"]==9,out
          assert out["open_predicate_count"]==0,out
          assert out["blocked_predicate_count"]==29,out
          assert out["refuted_predicate_count"]==0,out
          assert out["authorized_actions"]==[],out
          assert out["terminal_promotion_allowed"] is False
          d=next(r for r in out["predicates"] if r["predicate_id"]=="DELEGATION_TERMINAL_SUCCESS_NONINFERIOR")
          assert d["state"]=="PROVED",d
          fam=next(r for r in out["families"] if r["family"]=="SUBAGENT_DELEGATION_AND_COORDINATION")
          assert fam["state"]=="PROVED" and fam["proved"]==3 and fam["predicate_count"]==3,fam
          print("ATOMIC_RESIDUAL_9_OF_38_PASS")
          PY

      - name: Verify all 29 unproved predicates have actions and proved predicates are deleted from live targets
        working-directory: capsules/post_delegation_authority_v11_clean
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from canonical.runtime.terminal_action_coverage_guard_v1 import evaluate
          load=lambda p: json.loads(Path(p).read_text())
          reg=load("canonical/governance/OPUS55_ACCEPTANCE_PREDICATE_REGISTRY_V2.json")
          ev=load("canonical/governance/OPUS55_ACCEPTANCE_PREDICATE_EVIDENCE_BINDINGS_V2.json")
          hg=load("canonical/governance/OPUS55_ACCEPTANCE_ACTION_HYPERGRAPH_V1.json")
          out=evaluate(reg,ev,hg)
          assert out["pass"] is True,out
          assert out["predicate_count"]==38,out
          assert out["proved_predicate_count"]==9,out
          assert out["unresolved_predicate_count"]==29,out
          assert out["represented_unresolved_predicate_count"]==29,out
          assert out["uncovered_unresolved_predicates"]==[],out
          live={p for a in hg["actions"] for p in a.get("target_predicates",[])}
          proved={c["predicate_id"] for c in ev["claims"] if c.get("state")=="PROVED"}
          assert not (live & proved),(live & proved)
          assert "DELEGATION_TERMINAL_SUCCESS_NONINFERIOR" not in live
          print("ACTION_COVERAGE_29_OF_29_PASS")
          PY

      - name: Verify zero replay and zero direct promotion
        working-directory: capsules/post_delegation_authority_v11_clean
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          load=lambda p: json.loads(Path(p).read_text())
          w=load("canonical/governance/DELEGATION_ACCEPTANCE_CEILING_WITNESS_V1.json")
          t=load("canonical/verification/DELEGATION_TEMPORAL_PROOF_TRANSPORT_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json")
          x=load("canonical/verification/DELEGATION_TEMPORAL_CEILING_TRANSMUTATION_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json")
          assert w["promotion_authority"] is False
          assert t["terminal_results_replayed"]==0
          assert x["terminal_results_replayed"]==0
          assert t["incremental_spend_usd"]==0
          assert x["incremental_spend_usd"]==0
          assert t["family_credit_delta"]==0
          assert x["family_credit_delta"]==0
          print("ZERO_REPLAY_ZERO_CREDIT_PASS")
          PY
