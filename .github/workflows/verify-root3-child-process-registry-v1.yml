name: Verify Root3 child-process registry V1
on:
  pull_request:
    branches: [main]
    paths:
      - capsules/root3_child_process_registry_v1/**
      - verifiers/verify_root3_child_process_registry_v1.py
      - .github/workflows/verify-root3-child-process-registry-v1.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
      - name: Independent AST and exact-byte recomputation
        run: python verifiers/verify_root3_child_process_registry_v1.py
