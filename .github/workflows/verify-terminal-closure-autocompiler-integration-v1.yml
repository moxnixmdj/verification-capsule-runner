name: Verify terminal closure autocompiler integration v1
on:
  pull_request:
    branches: [main]
    paths:
      - 'capsules/terminal_closure_autocompiler_integration/**'
      - '.github/workflows/verify-terminal-closure-autocompiler-integration-v1.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact Brain integration identities
        working-directory: capsules/terminal_closure_autocompiler_integration
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object canonical/governance/TERMINAL_CLOSURE_COMPILER_STACK_V1.json)" = "23c6576092b006100b54a0f49b3c89d0ad058c7b"
          test "$(git hash-object canonical/runtime/terminal_proof_route_autocompiler.py)" = "2eea4d81bc5444f8f7e055cbbbd0cd8edf5a5dcf"
          test "$(git hash-object canonical/tests/test_terminal_proof_route_autocompiler.py)" = "d7e664a1e01177874c8014250938cf33434e0ae7"
          test "$(git hash-object canonical/verification/TERMINAL_PROOF_ROUTE_AUTOCOMPILER_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json)" = "04dba0321cab3401bd6da294bd011e1d01e840d4"
          test "$(git hash-object canonical/governance/OBJECTIVE_ORACLE_DOMINANCE_LIVE_INPUT_V1.json)" = "c1dad2dcb63be8d9dd50ba5212a5b099966f1f07"
      - name: Validate closure-stack binding and authority boundary
        working-directory: capsules/terminal_closure_autocompiler_integration
        shell: bash
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          from pathlib import Path
          p=Path("canonical/governance/TERMINAL_CLOSURE_COMPILER_STACK_V1.json")
          d=json.loads(p.read_text())
          c=d["components"]["proof_route_autocompiler"]
          assert c["runtime"]=="canonical/runtime/terminal_proof_route_autocompiler.py"
          assert c["integration_independent_verification"]=="canonical/verification/TERMINAL_CLOSURE_AUTOCOMPILER_INTEGRATION_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json"
          step="AUTOCOMPILE_COMPLETE_OBJECTIVE_ROUTES_INTO_ZERO_REALITY_MATERIALIZATION_ACTIONS__FAIL_CLOSED_ON_SEMANTIC_OR_EVALUATOR_GAPS"
          trans="TRANSMUTE_EACH_OBLIGATION_TO_STRONGEST_ADMISSIBLE_PROOF_MODE"
          part="PARTITION_GLOBAL_FRONTIER_INTO_EXACT_INTERNAL_CUT_AND_EXTERNAL_OR_UNPROVEN_RESIDUALS"
          assert d["sequencing"].index(trans) < d["sequencing"].index(step) < d["sequencing"].index(part)
          assert d["execution_authority"] is False
          assert d["promotion_authority"] is False
          assert d["capability_credit_delta"]==0 and d["family_credit_delta"]==0
          req=d["integration_requirements"]["proof_route_autocompiler"]
          assert req["exact_stack_integration_receipt_required"] is True
          assert req["fail_closed_if_receipt_missing_or_blob_mismatch"] is True
          assert req["terminal_case_execution_from_integration"] is False
          assert req["fresh_terminal_evidence_from_integration"]==0
          print("STACK_BINDING_PASS")
          PY
      - name: Run autocompiler fail-closed tests
        working-directory: capsules/terminal_closure_autocompiler_integration
        run: PYTHONPATH=. python -m unittest -v canonical.tests.test_terminal_proof_route_autocompiler
      - name: Compile current bound objective frontier
        working-directory: capsules/terminal_closure_autocompiler_integration
        run: PYTHONPATH=. python canonical/runtime/terminal_proof_route_autocompiler.py canonical/governance/OBJECTIVE_ORACLE_DOMINANCE_LIVE_INPUT_V1.json
