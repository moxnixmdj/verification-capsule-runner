name: PR207 H006 Freeze Static Check
on:
  push:
    branches: [main]
    paths: [ARM_PR207_H006_FREEZE_STATIC]
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Static freeze checks only
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile diagnostics/pr207/run_h006.py
          python3 - <<'PY'
          import json, pathlib
          root=pathlib.Path("diagnostics/pr207")
          spec=json.loads((root/"H006.json").read_text())
          runner=(root/"run_h006.py").read_text()
          assert spec["validation_id"]=="XAPIAN-APT-E2E-INTEGRATION-HELDOUT-006"
          assert spec["freshness"]["state"]=="UNSPENT" and spec["freshness"]["execution_count"]==0
          assert spec["orthogonality_precommit"]["precommitted_material_dimensions"]==["domain","verification_mechanism"]
          assert spec["runtime_integrity"]["immutable_baseline_blobs"]["canonical/runtime/verify_pending_cli_binding.py"]=="a6b028c25d79d2dff59c87e3b3ad91d9fe934dae"
          assert "REFERENCE_ACQUISITION" not in runner and "reference_supplier" not in runner
          assert '["ZXingReader",str(output_path)]' in runner
          assert "ZBAR_ZBARIMG_EXTERNAL_DECODER" in runner and "ZXING_CPP_ZXINGREADER_EXTERNAL_DECODER" in runner
          assert "HELDOUT_004" not in runner and "HELDOUT_005" not in runner
          print("PR207_H006_FREEZE_STATIC_PASS")
          PY
