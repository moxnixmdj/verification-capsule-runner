name: Verify terminal route closure controller
on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/runtime/terminal_route_closure_controller.py'
      - 'canonical/tests/test_terminal_route_closure_controller.py'
      - '.github/workflows/verify-terminal-route-closure-controller.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact Brain blobs
        run: |
          set -euo pipefail
          test "$(git hash-object canonical/runtime/terminal_route_closure_controller.py)" = "1f905cb57bd50abfc91059599f0a9a8f0c0c0c1a"
          test "$(git hash-object canonical/tests/test_terminal_route_closure_controller.py)" = "ccfd6336e58dc7656f5e95e87fbe521f6ecf30be"
      - name: Run fail-closed scheduler tests
        run: PYTHONPATH=. python -m unittest canonical.tests.test_terminal_route_closure_controller -v
