name: Verify LiveBench frozen schema19 envelope

on:
  push:
    branches: [main]
    paths:
      - "subject/livebench_schema19_20261005/**"
      - "verify_livebench_schema19_envelope_v1.py"
      - ".github/workflows/verify-livebench-schema19-envelope-v1.yml"
  pull_request:
    paths:
      - "subject/livebench_schema19_20261005/**"
      - "verify_livebench_schema19_envelope_v1.py"
      - ".github/workflows/verify-livebench-schema19-envelope-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install schema reader
        run: python -m pip install --disable-pip-version-check pyarrow
      - name: Independently verify frozen schema19 envelope
        run: python verify_livebench_schema19_envelope_v1.py
      - name: Print receipt
        if: always()
        run: |
          if test -f livebench_schema19_independent_receipt.json; then
            cat livebench_schema19_independent_receipt.json
          fi
      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livebench-schema19-independent-receipt
          path: livebench_schema19_independent_receipt.json
          if-no-files-found: error
