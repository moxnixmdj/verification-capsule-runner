name: Verify proof atom corpus completeness v3
on:
  pull_request:
    paths:
      - "capsules/proof_atom_corpus_completeness_v3/**"
      - ".github/workflows/verify-proof-atom-corpus-completeness-v3.yml"
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact Brain candidate and adversarial completeness
        run: python capsules/proof_atom_corpus_completeness_v3/verify.py
