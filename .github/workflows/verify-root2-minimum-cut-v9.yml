name: Verify Root2 minimum cut V9
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/root2_minimum_cut_v9/**"
      - ".github/workflows/verify-root2-minimum-cut-v9.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python capsules/root2_minimum_cut_v9/verify.py
