name: Verify LiveBench language exception carrier

on:
  pull_request:
    branches: [main]
    paths:
      - "subject/livebench_union25_language_exception_carrier_v1.py"
      - "subject/livebench_legacy25_single_contract_witness_v1.py"
      - "verify_livebench_language_exception_carrier_v1.py"
      - ".github/workflows/verify-livebench-language-exception-carrier-v1.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
      - name: Install exact scorer dependencies
        run: python -m pip install --disable-pip-version-check langdetect==1.0.9 nltk==3.10.3 immutabledict==4.2.2
      - name: Checkout exact frozen LiveBench
        run: |
          set -euo pipefail
          rm -rf /tmp/LiveBench
          git init /tmp/LiveBench
          git -C /tmp/LiveBench remote add origin https://github.com/LiveBench/LiveBench.git
          git -C /tmp/LiveBench fetch --depth 1 origin 8f8e5c381a16e3f24257776edd53471fe86f8091
          git -C /tmp/LiveBench checkout --detach FETCH_HEAD
      - name: Verify exact exception carrier
        run: python verify_livebench_language_exception_carrier_v1.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livebench-language-exception-carrier-v1
          path: livebench_language_exception_carrier_v1.json
          if-no-files-found: error
