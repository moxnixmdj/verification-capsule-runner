name: Verify Brain policy V5
on:
  pull_request:
    paths:
      - "subject/brain/**"
      - "verify.py"
      - ".github/workflows/verify-brain-policy-v5.yml"
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run independent verifier
        run: python verify.py
      - uses: actions/upload-artifact@v4
        with:
          name: brain-policy-v5-independent-verification
          path: receipt.json
          if-no-files-found: error
