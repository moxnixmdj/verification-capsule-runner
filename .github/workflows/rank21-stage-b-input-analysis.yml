name: Rank21 Stage-B allowlisted input analysis
on:
  pull_request:
    branches: [main]
    paths:
      - 'verification/rank21_stage_b/**'
      - '.github/workflows/rank21-stage-b-input-analysis.yml'
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check xlrd==2.0.2 pypdf==5.9.0
      - run: python verification/rank21_stage_b/extract_allowlisted_inputs.py | tee rank21_stage_b_evidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: rank21-stage-b-evidence
          path: rank21_stage_b_evidence.json
