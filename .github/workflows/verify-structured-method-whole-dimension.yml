name: Verify structured method whole-dimension preflight
on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/runtime/structured_method_graph_candidate_v1.py'
      - 'canonical/runtime/structured_method_graph_proof_v1.py'
      - 'canonical/tests/test_structured_method_graph_preflight_v1.py'
      - '.github/workflows/verify-structured-method-whole-dimension.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact Brain blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object 'canonical/runtime/structured_method_graph_candidate_v1.py')" = 'def5eb4aad6232d6c240827c1ff24d433612e9a5'
          test "$(git hash-object 'canonical/runtime/structured_method_graph_proof_v1.py')" = 'd0b0e6619a1066a7bc8b70f1226f4ab0f95a5e4c'
          test "$(git hash-object 'canonical/tests/test_structured_method_graph_preflight_v1.py')" = '8c917d9808e4d70011806e45700af8b481f0ad4b'
      - name: Execute structured-method whole-dimension tests
        run: python -m unittest -v canonical.tests.test_structured_method_graph_preflight_v1
