name: Verify terminal counterexample envelope compiler
on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/runtime/terminal_counterexample_envelope_compiler.py'
      - '.github/workflows/verify-terminal-counterexample-envelope-compiler.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Bind exact Brain compiler blob
        run: test "$(git hash-object canonical/runtime/terminal_counterexample_envelope_compiler.py)" = "86344162be260f294e5af87c56141e7e41fd0f5a"
      - name: Execute fail-closed self-test
        run: python canonical/runtime/terminal_counterexample_envelope_compiler.py --self-test
