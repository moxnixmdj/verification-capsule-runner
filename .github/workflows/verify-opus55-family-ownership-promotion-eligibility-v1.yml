name: Verify Brain Opus55 family ownership promotion eligibility v1

on:
  pull_request:
    branches: [main]
    paths:
      - 'capsules/opus55_family_ownership_promotion_eligibility_v1/**'
      - '.github/workflows/verify-opus55-family-ownership-promotion-eligibility-v1.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact mirrored Brain blob identities
        env:
          EXPECTED_JSON: >-
            {"canonical/governance/OPUS55_FAMILY_OWNERSHIP_PROMOTION_ELIGIBILITY_V1.json":"bde8087941a548228f603ba7cd0ef81a05fadcb9","canonical/runtime/opus55_family_ownership_promotion_eligibility_v1.py":"e893fecb72ae0473ddcac905db4fde135998b861","canonical/tests/test_opus55_family_ownership_promotion_eligibility_v1.py":"4cd9c70fff086a2f1f8e30c7f207e86a64595593","canonical/capabilities/opus55/OPUS_5_5_CAPABILITY_OWNERSHIP_MATRIX_V1.json":"7fe34915c98a416c85ac8a62aa0ae6802b2ae39c","canonical/verification/GLOBAL_OWNERSHIP_POSTCONDITIONS_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json":"e0dbd996c18bdb818693ab0d217d751594a03d0f","canonical/verification/OPUS55_ACCEPTANCE_CALIBRATION_AUDIT_20261002_V3.json":"c50034c670f797d91fa443d244853071f09bd37a","canonical/governance/TOOL_DISCOVERY_ACCEPTANCE_CEILING_WITNESS_V1.json":"60a7c1139cad315d977bf5ed97e708cc5ec3fcc7","canonical/governance/DELEGATION_ACCEPTANCE_CEILING_WITNESS_V1.json":"cb3b7c4b6c4e1f2a0471c6b6be72c4ca9ebddc80","canonical/runtime/tool_discovery_information_safe_candidate.py":"64c02edd568d95ec5ed54b7b8122183ce5b82e17","canonical/runtime/delegation_whole_scope_candidate_v2.py":"f1a93ee66d90093de61dc17c6ebf2e24073df522","canonical/capabilities/opus55/OPUS55_SCOPED_SUBAGENT_DELEGATION_COORDINATION_V1.json":"92446c0ea1eb6801db58bd757ab62a24710d3b6b","canonical/verification/DELEGATION_TEMPORAL_CEILING_TRANSMUTATION_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json":"5023cc222a44f99b57785f5954cc95a29b739193"}
        run: |
          python - <<'PY'
          import json, os, subprocess
          root="capsules/opus55_family_ownership_promotion_eligibility_v1"
          expected=json.loads(os.environ["EXPECTED_JSON"])
          bad=[]
          for rel,want in expected.items():
              got=subprocess.check_output(["git","hash-object",f"{root}/{rel}"],text=True).strip()
              if got!=want:
                  bad.append(f"{rel}: {got} != {want}")
          if bad:
              raise SystemExit("\n".join(bad))
          print(f"EXACT_BLOB_IDENTITY_PASS {len(expected)}/{len(expected)}")
          PY
      - name: Run fail-closed eligibility counterfactuals
        env:
          PYTHONPATH: capsules/opus55_family_ownership_promotion_eligibility_v1
        run: python -m unittest -v canonical.tests.test_opus55_family_ownership_promotion_eligibility_v1
      - name: Compile eligibility result
        run: python capsules/opus55_family_ownership_promotion_eligibility_v1/canonical/runtime/opus55_family_ownership_promotion_eligibility_v1.py
