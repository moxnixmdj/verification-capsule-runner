name: Verify Brain Universal Learning V9

on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/universal_learning_v9/**"
      - ".github/workflows/verify-brain-universal-learning-v9.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact Brain V9 blob identities
        run: |
          cd capsules/universal_learning_v9
          python - <<'PY'
          import hashlib,json,pathlib
          m=json.load(open("EXPECTED_BRAIN_BLOBS.json",encoding="utf-8"))
          for rel,expected in m["exact_brain_blobs"].items():
              data=pathlib.Path(rel).read_bytes()
              got=hashlib.sha1(f"blob {len(data)}\0".encode()+data).hexdigest()
              assert got==expected,(rel,got,expected)
          assert m["verified_v8_base"]["governance_blob_sha"]==m["exact_brain_blobs"]["canonical/governance/UNIVERSAL_LEARNING_EQUIVALENCE_BASIS_V8.json"]
          print("exact V9/V8 blobs: PASS")
          PY
      - name: Compile V9 incremental modules
        run: |
          cd capsules/universal_learning_v9
          python -m py_compile             canonical/runtime/meta_learning_policy_v9.py             canonical/runtime/meta_strategy_abstraction_v9.py             canonical/runtime/universal_learning_meta_policy_router_v9.py
      - name: Run independent adversarial V9 theorem
        run: |
          cd capsules/universal_learning_v9
          export PYTHONPATH=.
          python - <<'PY'
          import sys,types
          from canonical.runtime import meta_learning_policy_v9 as mp
          from canonical.runtime import meta_strategy_abstraction_v9 as ma

          ctx=["interactive","source-rich"]
          csha=mp.context_digest(features=ctx)
          def ep(eid,sid,success=True,b0=10,b1=5,t=1,risk=0,spend=0):
              dig=mp.episode_digest(
                  episode_id=eid,context_sha256=csha,strategy_id=sid,success=success,
                  burden_before=b0,burden_after=b1,wall_clock=t,risk=risk,incremental_spend_usd=spend)
              return {
                  "episode_id":eid,"context_sha256":csha,"strategy_id":sid,"success":success,
                  "burden_before":b0,"burden_after":b1,"wall_clock":t,"risk":risk,"incremental_spend_usd":spend,
                  "verification_receipt":{"receipt_id":"r-"+eid,"independent_verified":True,"exact_byte_bound":True,
                      "conclusion":"success","episode_id":eid,"episode_sha256":dig}}
          out=mp.recommend(context_features=ctx,episodes=[
              ep("a","inspect-first",b1=1,t=3),
              ep("b","probe-first",b1=4,t=1)])
          assert out["recommended_strategy_id"]=="inspect-first",out
          assert out["planning_only"] is True and out["execution_authority"] is False,out

          try:
              other=mp.context_digest(features=["other"])
              bad=ep("c","leak")
              bad["context_sha256"]=other
              mp.recommend(context_features=ctx,episodes=[bad])
              raise AssertionError("cross-context leakage admitted")
          except mp.MetaLearningError:
              pass

          fail=mp.recommend(context_features=ctx,episodes=[
              ep("good","safe",True,10,5,1),
              ep("bad","fast",False,10,1,1)])
          assert fail["recommended_strategy_id"]=="safe",fail

          reg=mp.recommend(context_features=ctx,episodes=[ep("r","regress",True,5,6,1)])
          assert reg["recommended_strategy_id"] is None and reg["status"]=="NO_NO_REGRESSION_STRATEGY",reg

          try:
              mp.recommend(context_features=ctx,episodes=[ep("p","paid",True,10,1,1,0,"0.01")])
              raise AssertionError("positive spend admitted")
          except mp.MetaLearningError:
              pass

          def strat(sid,steps,verified=True):
              return {"strategy_id":sid,"steps":steps,
                  "verification_receipt":{"receipt_id":"s-"+sid,"independent_verified":verified,"exact_byte_bound":True,
                      "conclusion":"success","strategy_id":sid,"skeleton_sha256":ma.skeleton_digest(steps)}}
          cand=ma.induce_candidate([
              strat("a",["decompose","verify","compile"]),
              strat("b",["decompose","experiment","verify","compile"])])
          assert cand["common_steps"]==["decompose","verify","compile"],cand
          assert cand["verified_abstraction"] is False and cand["reuse_authorized"] is False,cand
          try:
              ma.induce_candidate([strat("a",["x"]),strat("b",["x"],False)])
              raise AssertionError("unverified strategy admitted")
          except ma.MetaStrategyError:
              pass

          # Stub only the independently verified V8 boundary. V9 must preserve it.
          stub=types.ModuleType("canonical.runtime.universal_learning_equivalence_basis_router_v8")
          def v8route(**kwargs):
              return {"route":"BASE_ROUTE","next_action":{"type":"BASE_NEXT"},
                      "trusted_execution_authorized":False,
                      "empirical_information_action_authorized":True}
          def v8inv():
              return {"pass":True}
          stub.route=v8route; stub.prove_v8_invariants=v8inv
          sys.modules["canonical.runtime.universal_learning_equivalence_basis_router_v8"]=stub
          import importlib
          r9=importlib.import_module("canonical.runtime.universal_learning_meta_policy_router_v9")
          routed=r9.route(v8_args={},context_features=ctx,strategy_episodes=[ep("z","inspect-first",True,10,2,2)])
          assert routed["route"]=="BASE_ROUTE",routed
          assert routed["next_action"]=={"type":"BASE_NEXT"},routed
          assert routed["empirical_information_action_authorized"] is True,routed
          assert routed["execution_authority"] is False and routed["promotion_authority"] is False,routed
          inv=r9.prove_v9_invariants()
          assert inv["pass"] is True,inv
          assert inv["v8_base_preserved"] is True,inv
          assert inv["unknown_domain_acceptance_proved"] is False,inv

          print("independent adversarial V9 theorem: PASS")
          PY
