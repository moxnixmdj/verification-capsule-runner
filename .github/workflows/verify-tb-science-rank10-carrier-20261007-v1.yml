name: Verify TB-Science rank10 carrier v1

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/verify-tb-science-rank10-carrier-20261007-v1.yml"
      - ".github/workflows/execute-tb-science-rank10-20261007-v1.yml"
      - "capsules/tb_science_rank10_20261007_v1/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify exact inert rank10 carrier
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          C=capsules/tb_science_rank10_20261007_v1
          A="$C/TB_SCIENCE_RANK10_ONE_SLOT_EXECUTION_AUTHORITY_20261007_V1.json"
          I="$C/ACTION_INTENT_TB_SCIENCE_RANK10_ONE_SHOT_20261007_V1.json"
          L="$C/TB_SCIENCE_CURRENT_SLOT_LEDGER_RECONCILIATION_20261007_V8.json"
          M="$C/TB_SCIENCE_TRANSITIVE_RUNTIME_CLOSURE_MANIFEST_20261007_V2.json"
          E="$C/RANK10_EPOCH_V1.json"
          AV="$C/TB_SCIENCE_RANK10_AUTHORITY_PUBLIC_VERIFICATION_20261007_V1.json"
          X=.github/workflows/execute-tb-science-rank10-20261007-v1.yml

          test "$GITHUB_REPOSITORY" = "moxnixmdj/verification-capsule-runner"
          test "$GITHUB_EVENT_NAME" = "pull_request"
          test "$GITHUB_BASE_REF" = "main"
          test "$GITHUB_HEAD_REF" = "chatgpt/install-tb-science-rank10-carrier-20261007-v2"
          test ! -e "$C/ACTIVATE_RANK10_PR.json"

          test "$(git hash-object "$A")" = "7b4d8c2555d102b30e02673c95675403ae947629"
          test "$(git hash-object "$I")" = "e65720a36d7c09a3be5a33246f3ab54e20612915"
          test "$(git hash-object "$L")" = "eb869db71db99a77912c0051ff12f162d616b1a1"
          test "$(git hash-object "$M")" = "31656d35034338dfcb699672bcd4788b283b83c9"
          test "$(git hash-object "$E")" = "8d0bc7999769a32147eab08acb31436e7abe743c"
          test "$(git hash-object "$AV")" = "81bc75163be8376f407d3efac716d34cb30720c0"
          test "$(git hash-object "$X")" = "bf93b66a2c9d5c3db17e5cd5dfc590f2cfbf8691"
          test "$(git hash-object capsules/tb_science_canary_v3_execution/canonical/governance/TB_SCIENCE_TERMINAL_EXECUTION_MANIFEST_V1.json)" = "6dfa880b1f68881531afbba6ca211681801fd19b"

          export EXECUTION_WORKFLOW_BLOB="$(git hash-object "$X")"
          python - <<'PY'
          import json, os, pathlib, subprocess, sys, urllib.request
          C=pathlib.Path("capsules/tb_science_rank10_20261007_v1")
          a=json.loads((C/"TB_SCIENCE_RANK10_ONE_SLOT_EXECUTION_AUTHORITY_20261007_V1.json").read_text())
          i=json.loads((C/"ACTION_INTENT_TB_SCIENCE_RANK10_ONE_SHOT_20261007_V1.json").read_text())
          l=json.loads((C/"TB_SCIENCE_CURRENT_SLOT_LEDGER_RECONCILIATION_20261007_V8.json").read_text())
          m=json.loads((C/"TB_SCIENCE_TRANSITIVE_RUNTIME_CLOSURE_MANIFEST_20261007_V2.json").read_text())
          e=json.loads((C/"RANK10_EPOCH_V1.json").read_text())
          av=json.loads((C/"TB_SCIENCE_RANK10_AUTHORITY_PUBLIC_VERIFICATION_20261007_V1.json").read_text())
          slot="terminal-bench-science/rdkit-ic-constraints::trial-0"
          digest="sha256:17e356ab255088712c7dfa9765bf077b33a3da221f4a03d4770576857f9c0b6f"

          assert a["status"].startswith("ACTIVE__LIVE_EPOCH_RECHECK_REQUIRED")
          assert a["slot"]=={"id":slot,"rank":10,"digest":digest}
          assert i["slot"]=={"id":slot,"digest":digest,"rank":10}
          assert l["current_counts"]["next_untouched_slot"]=={"schedule_rank":10,"slot_id":slot,"task_digest":digest}
          assert l["current_counts"]["consumed_slots"]==9
          assert l["rank10_preexposure"]["one_use_authority"]["git_blob_sha"]=="7b4d8c2555d102b30e02673c95675403ae947629"
          assert e["status"]=="CURRENT__ONE_USE_PREEXPOSURE_GATE"
          assert e["run_attempts_authorized_by_epoch"]==0
          assert av["status"].startswith("INDEPENDENT_PUBLIC_RUNNER_PASS")
          assert av["independent_runner"]["workflow_run_id"]==37628333729
          assert av["independent_runner"]["conclusion"]=="success"
          assert av["verified"]["benchmark_task_exposure"]==0
          assert len(m["closure"])==14

          def blob(p):
              return subprocess.check_output(["git","hash-object",str(p)],text=True).strip()
          seen=set()
          for row in m["closure"]:
              p=C/row["path"]
              assert p.is_file(), row["path"]
              assert blob(p)==row["git_blob_sha"], (row["path"],blob(p),row["git_blob_sha"])
              seen.add(row["path"])
          assert len(seen)==14

          sys.path.insert(0,str(C))
          from canonical.runtime.harbor_science_agent_v1 import HarborScienceAgent
          import canonical.runtime.harbor_science_planner_v1 as planner
          assert HarborScienceAgent.name()=="project-brain-science"
          assert planner.MODEL=="brain-qwen3.5-9b"

          token=os.environ.get("GH_TOKEN","")
          headers={"Accept":"application/vnd.github+json","User-Agent":"brain-rank10-carrier-verifier"}
          if token: headers["Authorization"]="Bearer "+token
          req=urllib.request.Request(
              "https://api.github.com/repos/moxnixmdj/verification-capsule-runner/actions/runs/37628333729",
              headers=headers,
          )
          with urllib.request.urlopen(req,timeout=30) as resp: auth_run=json.load(resp)
          assert auth_run["status"]=="completed" and auth_run["conclusion"]=="success"
          assert auth_run["head_sha"]=="5ae36890449b929bb28d3b05134d771b15cb50a0"
          assert auth_run["run_attempt"]==1

          receipt={
            "schema":"PROJECT_BRAIN_TB_SCIENCE_RANK10_CARRIER_PUBLIC_VERIFICATION_V1",
            "status":"PASS__EXACT_INERT_REPAIRED_CARRIER__NO_TASK_EXPOSURE",
            "authority_git_blob_sha":"7b4d8c2555d102b30e02673c95675403ae947629",
            "intent_git_blob_sha":"e65720a36d7c09a3be5a33246f3ab54e20612915",
            "ledger_v8_git_blob_sha":"eb869db71db99a77912c0051ff12f162d616b1a1",
            "closure_manifest_git_blob_sha":"31656d35034338dfcb699672bcd4788b283b83c9",
            "authority_verification_git_blob_sha":"81bc75163be8376f407d3efac716d34cb30720c0",
            "epoch_git_blob_sha":"8d0bc7999769a32147eab08acb31436e7abe743c",
            "execution_workflow_git_blob_sha":os.environ["EXECUTION_WORKFLOW_BLOB"],
            "runtime_closure_file_count":14,
            "agent_import_pass":True,
            "planner_import_pass":True,
            "slot_id":slot,
            "schedule_rank":10,
            "task_digest":digest,
            "pull_request_head_sha":os.environ["PR_HEAD_SHA"],
            "github_run_id":os.environ["GITHUB_RUN_ID"],
            "github_run_attempt":os.environ["GITHUB_RUN_ATTEMPT"],
            "benchmark_task_exposure":0,
            "fresh_target_reality_units_consumed":0,
            "incremental_spend_usd":0,
            "terminal_credit":False,
          }
          pathlib.Path("rank10_carrier_verification.json").write_text(
              json.dumps(receipt,indent=2,sort_keys=True)+"\n",encoding="utf-8"
          )
          print(json.dumps(receipt,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: tb-science-rank10-carrier-verification-v1
          path: rank10_carrier_verification.json
          if-no-files-found: error
          retention-days: 90
