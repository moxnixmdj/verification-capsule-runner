name: Verify explicit causal path provenance
on:
  push:
    branches:
      - verify/explicit-causal-path-provenance-20260930
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run causal provenance regressions
        run: |
          set -euo pipefail
          python -m unittest -v \
            canonical.tests.test_grounded_executable_composition \
            canonical.tests.test_grounding_proposal_binding_contract
