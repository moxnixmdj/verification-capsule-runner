name: Verify LiveBench V6 sanitized diagnostic
on:
  push:
    branches: ['verify/livebench-v6-sanitized-diagnostic-20261004']
  pull_request:
    paths:
      - 'verify_livebench_v6_sanitized_diagnostic_20261004.py'
      - 'subject/livebench_v6_sanitized_diagnostic_20261004/**'
      - '.github/workflows/verify-livebench-v6-sanitized-diagnostic-20261004.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python verify_livebench_v6_sanitized_diagnostic_20261004.py
