    branches:
      - verify/terminal-scheduling-v10-retrieval-v3-20261003
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python verify_terminal_scheduling_v10_retrieval_v3.py
