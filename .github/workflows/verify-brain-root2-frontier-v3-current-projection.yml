name: Verify Brain Root2 Frontier V3 current projection

on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/root2_frontier_v3_current_projection/**"
      - ".github/workflows/verify-brain-root2-frontier-v3-current-projection.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify current Root2 V3 projection
        run: python capsules/root2_frontier_v3_current_projection/verify_projection.py
