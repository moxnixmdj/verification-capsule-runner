name: Verify canonical SA-CCR scope Gate V2
on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/runtime/scope_equivalent_proof_gate_v2.py'
      - 'canonical/governance/SA_CCR_SCOPE_EQUIVALENT_PROOF_GATE_V2_INPUT.json'
      - 'canonical/governance/SA_CCR_SCOPE_EQUIVALENCE_RELATION_V1.json'
      - 'canonical/governance/SA_CCR_INFORMATION_SAFE_TERMINAL_ROUTE_V1.json'
      - 'canonical/governance/SA_CCR_ACTIVE_CONTRACT_SCOPE_CLOSURE_V1.json'
      - 'canonical/verification/SA_CCR_INFORMATION_SAFE_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json'
      - '.github/workflows/verify-canonical-saccr-scope-gate-v2.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Bind exact canonical Brain blobs
        run: |
          test "$(git hash-object canonical/runtime/scope_equivalent_proof_gate_v2.py)" = "2d05172becfc559de3ff1e4e5623c5180028be1b"
          test "$(git hash-object canonical/governance/SA_CCR_SCOPE_EQUIVALENT_PROOF_GATE_V2_INPUT.json)" = "e1334040617340b232d74c187116aedc09236398"
          test "$(git hash-object canonical/governance/SA_CCR_SCOPE_EQUIVALENCE_RELATION_V1.json)" = "2a330aaae7ed626c13bdd0bbeff7ec5564d977b5"
          test "$(git hash-object canonical/governance/SA_CCR_INFORMATION_SAFE_TERMINAL_ROUTE_V1.json)" = "04b030ef0bf13cf9e39f4c6a31077ca2ff0a5394"
          test "$(git hash-object canonical/governance/SA_CCR_ACTIVE_CONTRACT_SCOPE_CLOSURE_V1.json)" = "93c74c5d9d4e49c4f9524d3724a552665da6a702"
          test "$(git hash-object canonical/verification/SA_CCR_INFORMATION_SAFE_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json)" = "e95a7e4bababb44f21c218535c362b03fd75e912"
      - name: Run Gate V2 self-test
        run: PYTHONPATH=. python3 canonical/runtime/scope_equivalent_proof_gate_v2.py --self-test
      - name: Cross-check canonical relation receipts
        run: |
          PYTHONPATH=. python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path(".")
          gate=json.loads((root/"canonical/governance/SA_CCR_SCOPE_EQUIVALENT_PROOF_GATE_V2_INPUT.json").read_text())
          rel=json.loads((root/"canonical/governance/SA_CCR_SCOPE_EQUIVALENCE_RELATION_V1.json").read_text())
          route=json.loads((root/"canonical/governance/SA_CCR_INFORMATION_SAFE_TERMINAL_ROUTE_V1.json").read_text())
          scope=json.loads((root/"canonical/governance/SA_CCR_ACTIVE_CONTRACT_SCOPE_CLOSURE_V1.json").read_text())
          receipt=json.loads((root/"canonical/verification/SA_CCR_INFORMATION_SAFE_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json").read_text())
          assert gate["population_relation"] == rel["candidate_population_relation"]["relation"]
          assert gate["oracle_relation"] == rel["oracle_relation"]["relation"]
          assert set(gate["required_interaction_ids"]) == set(rel["required_interactions"])
          assert gate["relation_receipts"]["population"] == "canonical/governance/SA_CCR_SCOPE_EQUIVALENCE_RELATION_V1.json"
          assert gate["relation_receipts"]["oracle"] == "canonical/verification/SA_CCR_INFORMATION_SAFE_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json"
          assert route["behavior_id"] == "SA_CCR_CREDIT_EFFECTIVE_NOTIONAL_AND_ADDON_001"
          assert scope["behavior_id"] == route["behavior_id"]
          assert receipt["workflow_conclusion"] == "success"
          assert receipt["status"].startswith("INDEPENDENT_PREWAVE_PASS")
          assert scope["terminal_proof_route"]["route_manifest"] == "canonical/governance/SA_CCR_INFORMATION_SAFE_TERMINAL_ROUTE_V1.json"
          print({"status":"RELATION_BINDINGS_PASS","required_interactions":len(gate["required_interaction_ids"])})
          PY
      - name: Evaluate canonical Gate V2 input
        run: PYTHONPATH=. python3 canonical/runtime/scope_equivalent_proof_gate_v2.py canonical/governance/SA_CCR_SCOPE_EQUIVALENT_PROOF_GATE_V2_INPUT.json
