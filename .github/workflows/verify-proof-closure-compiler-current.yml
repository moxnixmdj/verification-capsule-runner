name: Verify proof closure compiler current frontier
on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/runtime/terminal_proof_closure_compiler_v1.py'
      - 'canonical/tests/test_terminal_proof_closure_compiler_v1.py'
      - 'canonical/governance/TERMINAL_PROOF_EVIDENCE_INDEX_V1.json'
      - 'canonical/governance/ACTIVE_TERMINAL_PROOF_BASIS_V1.json'
      - '.github/workflows/verify-proof-closure-compiler-current.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Verify compiler against exact current Brain basis
        run: |
          set -euo pipefail
          test "$(git hash-object canonical/governance/ACTIVE_TERMINAL_PROOF_BASIS_V1.json)" = "34111681f29dbac1477b8be9f106efadebc46b46"
          python3 canonical/runtime/terminal_proof_closure_compiler_v1.py --self-test
          PYTHONPATH=. python3 -m unittest -v canonical.tests.test_terminal_proof_closure_compiler_v1
          python3 canonical/runtime/terminal_proof_closure_compiler_v1.py --basis canonical/governance/ACTIVE_TERMINAL_PROOF_BASIS_V1.json --index canonical/governance/TERMINAL_PROOF_EVIDENCE_INDEX_V1.json > /tmp/frontier.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/frontier.json'))
          assert x['errors']==[]
          assert x['terminal_ready']==['SA_CCR_CREDIT_EFFECTIVE_NOTIONAL_AND_ADDON_001','TASK_TO_DELEGATION_GRAPH_001']
          assert x['mechanical_closure_candidates']==[]
          by={r['behavior_id']:r for r in x['contracts']}
          assert by['TOOL_ROUTE_DISCOVERY_AND_SELECTION_001']['compile_state']=='SEMANTIC_RESIDUAL'
          print(json.dumps({'status':'CURRENT_FRONTIER_PASS','terminal_ready':x['terminal_ready'],'mechanical_closure_candidates':x['mechanical_closure_candidates'],'semantic_frontier':x['semantic_frontier']},sort_keys=True))
          PY
