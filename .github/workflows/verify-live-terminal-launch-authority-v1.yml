name: Verify live terminal launch authority V1
on:
  pull_request:
    branches: [main]
    paths:
      - canonical/**
      - .github/workflows/verify-live-terminal-launch-authority-v1.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Derive launch authority from exact current Brain state
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python canonical/runtime/terminal_wave_launch_authority_reducer_v1.py . | tee /tmp/authority.json
          python - <<'PY'
          import json
          p="/tmp/authority.json"
          data=json.load(open(p))
          assert data["pass"] is True, data
          assert data["launch_authority"] is True, data
          assert data["execution_authority"] is True, data
          assert data["failed_predicates"] == [], data
          assert data["route_count"] == 12, data
          assert data["terminal_results_observed"] == 0, data
          assert data["fresh_terminal_evidence_consumed"] == 0, data
          print(json.dumps(data, sort_keys=True))
          PY
