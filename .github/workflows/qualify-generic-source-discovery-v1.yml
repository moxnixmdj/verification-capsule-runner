name: Qualify generic source discovery and URL binding V1

on:
  push:
    branches: [main]
    paths:
      - 'qualification/generic_source_discovery_v1.py'
      - 'qualification/qualify_generic_source_discovery.py'
      - '.github/workflows/qualify-generic-source-discovery-v1.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout exact push head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install zero-key search route from Ubuntu Noble
        run: |
          sudo apt-get update
          sudo apt-get install -y ddgr
          ddgr --version
      - name: Qualify cross-domain discovery and fresh oracle
        run: python qualification/qualify_generic_source_discovery.py
      - name: Upload qualification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generic-source-discovery-qualification
          path: generic-source-discovery-qualification.json
          if-no-files-found: error
