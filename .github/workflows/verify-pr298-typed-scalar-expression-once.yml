name: Verify PR298 Typed Scalar Expression Once

on:
  pull_request:
    branches:
      - main
    paths:
      - ARM_PR298_TYPED_SCALAR_EXPRESSION_QUALIFICATION_20260930_V1

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run compiler provenance and rejection regressions
        run: python canonical/tests/test_numeric_expression_sympy_binding.py
      - name: Run fresh non-astronomy qualification
        id: qualification
        continue-on-error: true
        run: python verify_pr298_typed_scalar_expression.py
      - name: Upload terminal qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr298-typed-scalar-expression-report
          path: pr298-typed-scalar-expression-report.json
          if-no-files-found: error
      - name: Preserve qualification failure
        if: steps.qualification.outcome != 'success'
        run: exit 1
