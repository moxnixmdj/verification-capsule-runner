name: Verify LiveBench scorer objective
on:
  pull_request:
    branches: [main]
    paths:
      - 'verify_livebench_scorer_objective.py'
      - '.github/workflows/verify-livebench-scorer-objective.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify pinned scorer objective
        run: python verify_livebench_scorer_objective.py
      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livebench-scorer-objective-receipt
          path: livebench_scorer_objective_receipt.json
          if-no-files-found: error
