name: Verify terminal proof supercompiler

on:
  pull_request:
    branches: [main]
    paths:
      - 'independent/terminal_proof_supercompiler.py'
      - 'test_terminal_proof_supercompiler.py'
      - '.github/workflows/verify-terminal-proof-supercompiler.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Bind exact Brain runtime blob
        run: |
          set -euo pipefail
          test "$(git hash-object independent/terminal_proof_supercompiler.py)" = "d92f37853437e1626d45e79b1da3638d8f943cd4"
      - name: Compile
        run: python -m py_compile independent/terminal_proof_supercompiler.py
      - name: Verify fail-closed and minimum-unblock semantics
        run: PYTHONPATH=independent python -m unittest -v test_terminal_proof_supercompiler.py
