name: Verify TB4 proof atom falsification
on:
  pull_request:
    paths:
      - "capsules/tb4_proof_atom_falsification_v1/**"
      - ".github/workflows/verify-tb4-proof-atom-falsification-v1.yml"
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact Brain TB4 sources and atom falsification
        run: python capsules/tb4_proof_atom_falsification_v1/verify.py
