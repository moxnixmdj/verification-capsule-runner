name: Verify multiplex terminal executor stack v1
on:
  pull_request:
    branches: [main]
    paths:
      - 'capsules/multiplex_terminal_executor_stack_v1/**'
      - '.github/workflows/verify-multiplex-terminal-executor-stack-v1.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Verify exact Brain blob identities
        working-directory: capsules/multiplex_terminal_executor_stack_v1
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object canonical/runtime/portfolio_multiplex_terminal_instrumentation_v1.py)" = "efb581966170d2ab1edf267d287bb9c909f2b8d5"
          test "$(git hash-object canonical/tests/test_portfolio_multiplex_terminal_instrumentation_v1.py)" = "4f8690c5d3d8136f8659e34555282ac93845bb4c"
          test "$(git hash-object canonical/runtime/multiplex_terminal_instrumentation_reducer_v1.py)" = "9633949c5a0602ebd740f9fb15aaaf598e17f46f"
          test "$(git hash-object canonical/tests/test_multiplex_terminal_instrumentation_reducer_v1.py)" = "724387459a21d4c9cb3ae4174080d069083ef06d"
      - name: Run multiplex executor stack verification
        working-directory: capsules/multiplex_terminal_executor_stack_v1
        run: |
          PYTHONPATH=. python -m unittest -v canonical.tests.test_portfolio_multiplex_terminal_instrumentation_v1
          PYTHONPATH=. python -m unittest -v canonical.tests.test_multiplex_terminal_instrumentation_reducer_v1
