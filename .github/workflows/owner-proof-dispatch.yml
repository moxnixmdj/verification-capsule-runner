name: Owner proof dispatch

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  lower-bound:
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.body == '/verify-tool-discovery-lower-bound-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e7d80f67fa1263add07c1c4c875a429555b7f42c
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact lower-bound capsule
        working-directory: capsules/brain_pr_1151_tool_observability_lower_bound
        run: |
          set -euo pipefail
          test "$(git hash-object canonical/runtime/tool_discovery_observability_lower_bound_v1.py)" = "45ae01ff1e6cae3d881cc3a99fa8455ff625e48d"
          test "$(git hash-object canonical/tests/test_tool_discovery_observability_lower_bound_v1.py)" = "00371717aaee5909ab61c636af1cc6f0dcaff56c"
          test "$(git hash-object canonical/governance/TOOL_DISCOVERY_OBSERVABILITY_LOWER_BOUND_V1.json)" = "67cab6e9d234496bc6b90ecb3e44f82e5d2b4614"
          test "$(git hash-object canonical/action_intents/2026-10-03_TOOL_DISCOVERY_OBSERVABILITY_LOWER_BOUND_V1.json)" = "332ba69db52128195659ac9d1106de99ec9eb54a"
          export PYTHONPATH=.
          python -m unittest canonical.tests.test_tool_discovery_observability_lower_bound_v1 -v
          python -m canonical.runtime.tool_discovery_observability_lower_bound_v1 > verdict.json
          python - <<'PY'
          import json
          v=json.load(open("verdict.json"))
          assert v["lower_bound_proved"] is True,v
          assert v["identity_completeness_alone_sufficient"] is False,v
          assert v["randomization_restores_probability_1_guarantee"] is False,v
          assert v["new_reality_units_consumed"]==0 and v["terminal_results_replayed"]==0,v
          assert v["capability_credit_delta"]==0 and v["family_credit_delta"]==0,v
          assert v["execution_authority"] is False and v["promotion_authority"] is False,v
          print("LOWER_BOUND_PASS")
          PY

  observability-partition:
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.body == '/verify-tool-discovery-observability-partition-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f7d966a982caaf00df151d2e640fd2b83f704447
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact observability-partition capsule
        working-directory: capsules/brain_pr_1169_tool_observability_partition
        run: |
          set -euo pipefail
          test "$(git hash-object canonical/runtime/tool_discovery_observability_partition_v1.py)" = "4c2e6ef72abbd6777cf4a2e3c9dcd616190ae1ac"
          test "$(git hash-object canonical/tests/test_tool_discovery_observability_partition_v1.py)" = "f6866731b1c2119f8cb84e6df4ad53db02faa559"
          test "$(git hash-object canonical/governance/TOOL_DISCOVERY_OBSERVABILITY_PARTITION_V1.json)" = "b93aeba7e7804f013e8acaba3b111b22aab2d9b2"
          test "$(git hash-object canonical/action_intents/TOOL_DISCOVERY_OBSERVABILITY_PARTITION_V1.json)" = "6aec834de339205c44ee241ead2d3b2b3fd98ea6"
          export PYTHONPATH=.
          python -m unittest canonical.tests.test_tool_discovery_observability_partition_v1 -v
          python -m canonical.runtime.tool_discovery_observability_partition_v1 > verdict.json
          python - <<'PY'
          import json
          v=json.load(open("verdict.json"))
          assert v["matched_comparator_required"] is True,v
          assert v["universal_proof_eligible"] is False,v
          assert v["new_reality_units_consumed"]==0 and v["terminal_results_replayed"]==0,v
          assert v["capability_credit_delta"]==0 and v["family_credit_delta"]==0,v
          print("OBSERVABILITY_PARTITION_PASS")
          PY

  interface-v2-hardening:
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.body == '/verify-tool-discovery-interface-v2-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bd53c44260026799891772d50f9e668299871ba6
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact V2 hardening capsule
        working-directory: capsules/tool_discovery_interface_v2_hardening
        run: |
          set -euo pipefail
          test "$(git hash-object canonical/runtime/tool_discovery_dynamic_candidate_v4.py)" = "e614d0bed8e291e31f57189cd6f0f75aa39b0f74"
          test "$(git hash-object canonical/governance/TOOL_DISCOVERY_COMPLETE_INTERFACE_CONTRACT_V1.json)" = "49cc878eccc0fbc8fdd83d35e5fbd614c973ffa7"
          test "$(git hash-object canonical/governance/TOOL_DISCOVERY_COMPLETE_INTERFACE_CONTRACT_V2.json)" = "f03f01a531d0a023173629a7a7f4bc0bb65a3b39"
          test "$(git hash-object canonical/runtime/tool_discovery_interface_contract_v2_hardening_proof.py)" = "f235b283f87048e62cbb5d22b938f99be5189e39"
          test "$(git hash-object canonical/tests/test_tool_discovery_interface_contract_v2_hardening.py)" = "6872cff1c14623c497a9971eaf0e10335bc7136f"
          export PYTHONPATH=.
          python -m unittest canonical.tests.test_tool_discovery_interface_contract_v2_hardening -v
          python -m canonical.runtime.tool_discovery_interface_contract_v2_hardening_proof > verdict.json
          python - <<'PY'
          import json
          v=json.load(open("verdict.json"))
          assert v["status"].startswith("PASS__V2_EXPLICIT_PRECONDITION_HARDENING_LOAD_BEARING"),v
          assert v["scope_preserved_without_brain_only_narrowing"] is True,v
          assert v["v1_machine_complete_for_all_v4_preconditions"] is False,v
          assert v["v2_required_property_set_exact"] is True,v
          assert v["countermodels_expose_missing_explicit_preconditions"] is True,v
          assert v["universal_target_proved"] is False,v
          assert v["complete_interface_instance_verified"] is False,v
          assert len(v["remaining_irreducible_facts"])==3,v
          assert v["new_reality_units_consumed"]==0 and v["terminal_results_replayed"]==0,v
          assert v["capability_credit_delta"]==0 and v["family_credit_delta"]==0,v
          print("INTERFACE_V2_HARDENING_PASS")
          PY


  tool-discovery-v6:
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.body == '/verify-tool-discovery-v6-version-restart-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6f14fd56b1b518058ea13fa3c2b9735b8b542c64
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact V6 capsule and repair
        working-directory: capsules/tool_discovery_v6_version_restart_20261003
        run: |
          set -euo pipefail
          test "$(git hash-object canonical/runtime/tool_discovery_dynamic_candidate_v5.py)" = "42d096ef93e8ad06c4d1d5dfe730881bf45a2a72"
          test "$(git hash-object canonical/runtime/tool_discovery_dynamic_candidate_v6.py)" = "2020b7c2dc750009a9cc363d0703184b9115cfa6"
          test "$(git hash-object canonical/tests/test_tool_discovery_dynamic_candidate_v6.py)" = "c68a084c5a985c5b54a4f94f488a781b13feac97"
          test "$(git hash-object canonical/governance/TOOL_DISCOVERY_DYNAMIC_V6_VERSION_RESTART_V1.json)" = "f276f7d5f9192af5857ebd3d211eb0dbfe2d35cd"
          export PYTHONPATH=.
          python -m unittest canonical.tests.test_tool_discovery_dynamic_candidate_v6 -v
          python - <<'PY'
          import json
          from pathlib import Path
          g=json.loads(Path("canonical/governance/TOOL_DISCOVERY_DYNAMIC_V6_VERSION_RESTART_V1.json").read_text())
          assert g["capability_credit_delta"]==0 and g["family_credit_delta"]==0,g
          assert g["execution_authority"] is False and g["promotion_authority"] is False,g
          assert g["new_reality_units_consumed"]==0 and g["terminal_results_replayed"]==0,g
          print("TOOL_DISCOVERY_V6_PASS")
          PY

  observability-v2:
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.body == '/verify-tool-discovery-observability-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9aa1d4797ea48fa883fadcec3e98a5662a502769
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact V2 partition capsule
        working-directory: capsules/brain_pr_1178_tool_observability_v2
        run: |
          set -euo pipefail
          test "$(git hash-object canonical/runtime/tool_discovery_observability_partition_v2.py)" = "69a732c069ad2528fd1fcf3ddc46ba0e820d9760"
          test "$(git hash-object canonical/tests/test_tool_discovery_observability_partition_v2.py)" = "26cfad1271c806331a08b10128779fbe27bea9b7"
          test "$(git hash-object canonical/governance/TOOL_DISCOVERY_OBSERVABILITY_PARTITION_V2.json)" = "628d2018a3b5f7d7d8b48708ff7fb5689ad88d08"
          test "$(git hash-object canonical/action_intents/2026-10-03_TOOL_DISCOVERY_OBSERVABILITY_PARTITION_V2.json)" = "1f0fd5d4b111e6574d021aa651258d3cd0873918"
          test "$(git hash-object independent_verifier.py)" = "18875446c43e0d9581ee36c81f3104054ec94cc9"
          export PYTHONPATH=.
          python -m unittest canonical.tests.test_tool_discovery_observability_partition_v2 -v
          python independent_verifier.py


  tool-discovery-v8:
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.body == '/verify-tool-discovery-v8-current'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 60637ff01147da0f4e0f332ff9585004e04aa953
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact V8 capsule
        working-directory: capsules/brain_pr_1182_tool_discovery_v8
        run: |
          set -euo pipefail
          test "$(git hash-object canonical/runtime/tool_discovery_dynamic_candidate_v5.py)" = "42d096ef93e8ad06c4d1d5dfe730881bf45a2a72"
          test "$(git hash-object canonical/runtime/tool_discovery_dynamic_candidate_v7.py)" = "e29328dfe5aff5650c1b938472ccf5ecf826831a"
          test "$(git hash-object canonical/runtime/tool_discovery_dynamic_candidate_v8.py)" = "b43443ef8b0387ed88bb5a852de01323276ad2aa"
          test "$(git hash-object canonical/tests/test_tool_discovery_dynamic_candidate_v8.py)" = "1beef6c6054b744f666294cb58a3a466a8c27ed1"
          test "$(git hash-object canonical/governance/TOOL_DISCOVERY_V8_AUTHORITY_SOUNDNESS_REPAIR_V1.json)" = "6191a3414cea3c9a6888102c76db1248f92f6850"
          export PYTHONPATH=.
          python -m unittest canonical.tests.test_tool_discovery_dynamic_candidate_v8 -v
          python - <<'PY'
          import itertools,json
          from canonical.runtime import tool_discovery_dynamic_candidate_v5 as v5
          from canonical.runtime import tool_discovery_dynamic_candidate_v8 as v8
          CAPS=("A","B")
          tools=[
            {"tool_id":f"T{i}","epoch":0,"cost":float(i+1),"available":True,"authorized":True,
             "safe_probe_capabilities":list(CAPS)}
            for i in range(3)
          ]
          source={"source_id":"S0","cost":0.0,"available":True,"authorized":True,"authoritative":True,
                  "source_epoch":0,"source_digest":v5._tools_digest(tools),
                  "catalog_query":"__FULL_AUTHORITY_CATALOG__"}
          authority_epoch=7
          source_set=v8._source_set_digest([source],authority_epoch=authority_epoch)
          checked=0
          for bits in itertools.product((False,True),repeat=6):
            truth={};k=0
            for t in tools:
              for cap in CAPS:
                truth[(t["tool_id"],cap)]=bits[k];k+=1
            state={"required_capabilities":list(CAPS),"decision_epoch":99,"authority_epoch":authority_epoch,
                   "constraint":None,"visible_tools":[],"discovery_sources":[source],
                   "discovery_receipts":[{"kind":"DISCOVERY_RESULT","source_id":"S0","complete":True,
                    "authority_epoch":authority_epoch,"source_epoch":0,"source_digest":source["source_digest"],
                    "source_set_digest":source_set,"query":source["catalog_query"],"tools":tools}],
                   "prior_probe_receipts":[],"version_events":[]}
            terminal=None
            for _ in range(20):
              a=v8.next_action(state)
              if a["action"]=="PROBE":
                tid,cap=a["tool_id"],a["capability"]
                state["prior_probe_receipts"].append({"kind":"SAFE_CAPABILITY_PROBE","tool_id":tid,
                 "capability":cap,"epoch":0,"authority_epoch":authority_epoch,
                 "supported":truth[(tid,cap)]})
                continue
              terminal=a;break
            assert terminal is not None,(bits,state)
            feasible=[t for t in tools if all(truth[(t["tool_id"],cap)] for cap in CAPS)]
            if feasible:
              expected=min(feasible,key=lambda t:(t["cost"],t["tool_id"]))["tool_id"]
              assert terminal=={"action":"SELECT","tool_id":expected},(bits,expected,terminal)
            else:
              assert terminal=={"action":"ESCALATE","reason":"NO_VERIFIED_ADMISSIBLE_TOOL_AFTER_COMPLETE_DISCOVERY"},(bits,terminal)
            checked+=1
          assert checked==64
          g=json.load(open("canonical/governance/TOOL_DISCOVERY_V8_AUTHORITY_SOUNDNESS_REPAIR_V1.json"))
          assert g["universal_target_proved"] is False and g["common_authority_scope_proved"] is False,g
          assert g["acceptance_credit_delta"]==0 and g["capability_credit_delta"]==0 and g["family_credit_delta"]==0,g
          assert g["new_reality_units_consumed"]==0 and g["terminal_results_replayed"]==0,g
          print("TOOL_DISCOVERY_V8_CURRENT_PASS",checked)
          PY
