name: Verify professional artifact uncovered scope f3253a
on:
  pull_request:
    branches: [main]
    paths:
      - capsules/professional_artifact_scope_f3253a/**
      - .github/workflows/verify-professional-artifact-scope-f3253a.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cd capsules/professional_artifact_scope_f3253a && PYTHONPATH=. python -m unittest -v canonical.tests.test_professional_artifact_internal_prewave_v1
