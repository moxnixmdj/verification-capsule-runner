name: Verify exact-current terminal authority V1
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/terminal_authority_exact_current_v1/**"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify frozen Brain authority closure
        run: python verifiers/verify_exact_current_terminal_authority_v1.py
