name: Direct verify P3 condition overlay minimum cut V1
on:
  push:
    branches:
      - "direct-verify/p3-condition-overlay-20261005-sol"
    paths:
      - "capsules/direct_p3_condition_overlay_minimum_cut_v1/**"
      - ".github/workflows/direct-verify-p3-condition-overlay-v1.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact blobs, frozen-envelope absence, and live first-party evidence
        run: python capsules/direct_p3_condition_overlay_minimum_cut_v1/verify.py
