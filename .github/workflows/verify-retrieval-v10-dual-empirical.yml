name: Verify Retrieval V10 dual empirical routing
on:
  push:
    branches:
      - verify/retrieval-v10-dual-empirical-20261003
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact V10 blobs
        run: |
          test "$(git hash-object canonical/governance/RETRIEVAL_LIVE_PROVIDER_EVENTS_20261003_V1.json)" = "a5d73e154f865865f1f2186c16e36921e834357a"
          test "$(git hash-object canonical/runtime/retrieval_live_provider_calibration_v1.py)" = "e023c17d46dc6841b6a5df5506f9c21533407d1c"
          test "$(git hash-object canonical/runtime/global_retrieval_controller_v3.py)" = "51acba67af90306be25fcfb055292a4233f97316"
          test "$(git hash-object canonical/runtime/global_retrieval_entrypoint_v3.py)" = "f913c25bef03a500c7c8a5d2b44a27c39b3ef34d"
          test "$(git hash-object canonical/tests/test_retrieval_live_provider_calibration_v1.py)" = "3aa5d8e2dfaa541be0e15e684ad14055dec90984"
          test "$(git hash-object canonical/tests/test_global_retrieval_controller_v3.py)" = "4b57230778e790ea709a98c60f182d6129d4154d"
      - run: PYTHONPATH=. python canonical/tests/test_retrieval_live_provider_calibration_v1.py
      - run: PYTHONPATH=. python canonical/tests/test_global_retrieval_controller_v3.py
      - run: PYTHONPATH=. python canonical/runtime/global_retrieval_entrypoint_v3.py
