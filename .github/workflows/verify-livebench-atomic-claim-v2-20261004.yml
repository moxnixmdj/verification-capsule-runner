name: Verify LiveBench atomic claim V2

on:
  pull_request:
    paths:
      - 'verify_livebench_atomic_claim_v2_20261004.py'
      - 'verify_livebench_atomic_git_ref_20261004.sh'
      - 'subject/livebench_atomic_claim_v2_20261004/**'
      - '.github/workflows/verify-livebench-atomic-claim-v2-20261004.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact atomic-claim semantics
        run: python verify_livebench_atomic_claim_v2_20261004.py
      - name: Verify real create-once Git ref linearization point
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash verify_livebench_atomic_git_ref_20261004.sh
