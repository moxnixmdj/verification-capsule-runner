name: Verify Brain delegation V4 universal scope
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/delegation_v4_universal_scope/**"
      - ".github/workflows/verify-brain-delegation-v4-universal-scope.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact Brain blob identities
        run: |
          cd capsules/delegation_v4_universal_scope
          python - <<'PY'
          import hashlib,json,pathlib
          m=json.load(open("EXPECTED_BRAIN_BLOBS.json",encoding="utf-8"))
          for src,expected in m["exact_brain_blobs"].items():
              data=pathlib.Path(src).read_bytes()
              got=hashlib.sha1(f"blob {len(data)}\0".encode()+data).hexdigest()
              assert got==expected,(src,got,expected)
          print("exact delegation Brain blobs: PASS")
          PY
      - name: Compile repaired carrier and theorem
        run: |
          cd capsules/delegation_v4_universal_scope
          python -m py_compile canonical/runtime/delegation_receipt_history_candidate_v4.py canonical/runtime/delegation_universal_scope_certificate_v2.py
      - name: Run cumulative-history adversarial tests
        run: |
          cd capsules/delegation_v4_universal_scope
          export PYTHONPATH=.
          python -m unittest canonical.tests.test_delegation_receipt_history_candidate_v4 -v
      - name: Run universal-scope theorem tests
        run: |
          cd capsules/delegation_v4_universal_scope
          export PYTHONPATH=.
          python -m unittest canonical.tests.test_delegation_universal_scope_certificate_v2 -v
      - name: Execute and enforce universal theorem
        run: |
          cd capsules/delegation_v4_universal_scope
          export PYTHONPATH=.
          python - <<'PY'
          from canonical.runtime.delegation_universal_scope_certificate_v2 import verify
          out=verify()
          assert out["universal_scope_proved"] is True,out
          assert out["scope_atom_satisfied_candidate"] is True,out
          assert out["basis_kind"]=="UNIVERSAL_FORMAL_SCOPE_PROOF",out
          assert out["target_predicate"]=="DELEGATION_TERMINAL_SUCCESS_NONINFERIOR",out
          assert out["uses_empirical_generalization"] is False,out
          assert out["new_reality_units_consumed"]==0,out
          assert out["capability_credit_delta"]==0 and out["family_credit_delta"]==0,out
          assert out["promotion_authority"] is False,out
          print("delegation universal scope: PASS")
          PY
