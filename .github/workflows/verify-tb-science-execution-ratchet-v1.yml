name: Verify TB-Science execution ratchet v1

on:
  pull_request:
    branches: [terminal-execution-v1]
    paths:
      - "execution_guard/**"
      - ".github/workflows/execute-tb-science-rank*.yml"
      - ".github/workflows/verify-tb-science-execution-ratchet-v1.yml"
      - "capsules/tb_science_rank*/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify staged proof-carrying surface and invariant ratchet
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, py_compile, subprocess, sys
          from pathlib import Path

          root=Path(".").resolve()
          surface_path=root/"execution_guard/CURRENT_TERMINAL_EXECUTION_SURFACE_V1.json"
          s=json.loads(surface_path.read_text(encoding="utf-8"))

          def blob(rel):
              raw=(root/rel).read_bytes()
              return hashlib.sha1(b"blob "+str(len(raw)).encode()+b"\0"+raw).hexdigest()

          def bound(row,label):
              assert isinstance(row,dict), (label,row)
              rel=row.get("path"); sha=row.get("git_blob_sha")
              assert isinstance(rel,str) and isinstance(sha,str), (label,row)
              assert (root/rel).is_file(), (label,rel)
              assert blob(rel)==sha, (label,rel,blob(rel),sha)
              return rel

          assert s["family"]=="TB_SCIENCE"
          assert s["active"] is True
          staged = s["execution_authority"] is False and s["task_read_authority"] is False
          promoted = s["execution_authority"] is True and s["task_read_authority"] is True
          assert staged or promoted, (s["execution_authority"], s["task_read_authority"])
          assert s["task_read_history"] is False
          assert s["task_started"] is False
          assert s["benchmark_trials_consumed"]==0
          assert s["terminal_credit_delta"]==0
          assert blob(s["workflow_path"])==s["workflow_git_blob_sha"]
          activation=root/s["activation_path"]
          assert not activation.exists(), "ACTIVATION_MUST_REMAIN_ABSENT_DURING_RESEAL"

          for key in ("behavior","authority","ledger","invariant_registry","admission_guard","epoch","execution_claim","preflight","finalizer"):
              bound(s[key],"surface."+key)
          if "logical_attempt_claim_binding" in s:
              bound(s["logical_attempt_claim_binding"],"surface.logical_attempt_claim_binding")
          refinement_verifier=None
          if "behavior_refinement_verification" in s:
              refinement_verifier=bound(s["behavior_refinement_verification"],"surface.behavior_refinement_verification")

          b=json.loads((root/s["behavior"]["path"]).read_text(encoding="utf-8"))
          assert b["slot_id"]==s["slot_id"] and b["task_digest"]==s["task_digest"]
          assert b["workflow_path"]==s["workflow_path"]
          facts=b["behavior"]
          for key in (
              "build_llama_server_on_current_runner",
              "zero_terminal_completion_required",
              "seeded_request_identity",
              "seed_identity_excludes_carrier_identity",
              "slot_bound_logical_attempt_identity",
              "execution_claim_bound_logical_attempt_identity",
              "execution_claim_binding_digest_required",
              "execution_claim_epoch_reauthorization_changes_logical_attempt_identity",
              "agent_ready_precedes_start_cas",
              "child_github_credentials_stripped",
              "durable_action_intent_ack_before_effect",
              "durable_state_commit_ack_before_next_action",
              "uncertain_effect_replay_forbidden",
          ):
              assert facts.get(key) is True, key

          inv=json.loads((root/s["invariant_registry"]["path"]).read_text(encoding="utf-8"))
          ids={x["id"] for x in inv["invariants"]}
          for needed in (
              "TB_SCIENCE_LLAMA_CPU_PORTABILITY_V1",
              "TB_SCIENCE_PLANNER_EXECUTION_ENVELOPE_V2",
              "TB_SCIENCE_DURABLE_CAUSAL_EXECUTION_V1",
              "TB_SCIENCE_CLAIM_BOUND_LOGICAL_ATTEMPT_IDENTITY_V1",
          ):
              assert needed in ids, needed

          runtime=b["runtime_bindings"]
          for key,row in runtime.items():
              rel=bound(row,"runtime."+key)
              if rel.endswith(".py"):
                  py_compile.compile(str(root/rel),doraise=True)

          z=runtime.get("zero_exposure_tests")
          assert isinstance(z,dict)
          if refinement_verifier is not None:
              py_compile.compile(str(root/refinement_verifier),doraise=True)
              subprocess.check_call([sys.executable,str(root/refinement_verifier)], env={**os.environ, "PYTHONPATH": str(root) + (os.pathsep + os.environ["PYTHONPATH"] if os.environ.get("PYTHONPATH") else "")})
          if staged:
              subprocess.check_call([sys.executable,str(root/z["path"])], env={**os.environ, "PYTHONPATH": str(root) + (os.pathsep + os.environ["PYTHONPATH"] if os.environ.get("PYTHONPATH") else "")})
          else:
              promotion=s.get("promotion_verification")
              rel=bound(promotion,"surface.promotion_verification")
              py_compile.compile(str(root/rel),doraise=True)
              subprocess.check_call([sys.executable,str(root/rel)])
          assert json.loads(surface_path.read_text(encoding="utf-8"))==s
          assert not activation.exists()
          print("PASS__CURRENT_PROOF_CARRYING_TB_SCIENCE_SURFACE__RATCHETED__ZERO_EXPOSURE")
          PY

      - name: Prove staged admission passes and activation gate remains closed
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/current_surface.env
          import json
          s=json.load(open("execution_guard/CURRENT_TERMINAL_EXECUTION_SURFACE_V1.json",encoding="utf-8"))
          print("ADMISSION="+s["admission_guard"]["path"])
          print("WORKFLOW="+s["workflow_path"])
          print("SLOT="+s["slot_id"])
          print("DIGEST="+s["task_digest"])
          print("PREFLIGHT="+s["preflight"]["path"])
          PY
          source /tmp/current_surface.env
          python "$ADMISSION" --workflow "$WORKFLOW" --slot "$SLOT" --task-digest "$DIGEST"
          if python - <<'PY'
          import json
          s=json.load(open("execution_guard/CURRENT_TERMINAL_EXECUTION_SURFACE_V1.json",encoding="utf-8"))
          raise SystemExit(0 if s["execution_authority"] is False else 1)
          PY
          then
            python "$PREFLIGHT" --allow-staged
          else
            python "$PREFLIGHT"
          fi
          if python "$ADMISSION" --workflow "$WORKFLOW" --slot "$SLOT" --task-digest "$DIGEST" --require-activation; then
            echo "current surface bypassed activation gate"
            exit 1
          fi
          python - <<'PY'
          import glob,json
          docs=[]
          for p in glob.glob("TERMINAL_EXECUTION_ADMISSION_*.json"):
              try: docs.append(json.load(open(p,encoding="utf-8")))
              except Exception: pass
          assert any("ACTIVATION_FILE_MISSING" in (d.get("errors") or []) for d in docs), docs
          print("PASS__ACTIVATION_GATE_CLOSED")
          PY

      - name: Emit zero-exposure receipt
        run: |
          python - <<'PY'
          import json
          s=json.load(open("execution_guard/CURRENT_TERMINAL_EXECUTION_SURFACE_V1.json",encoding="utf-8"))
          out={
            "schema":"PROJECT_BRAIN_TB_SCIENCE_EXECUTION_RATCHET_VERIFICATION_V4",
            "status":"PASS__CURRENT_PROOF_CARRYING_SURFACE__CLAIM_BOUND_IDENTITY_RATCHETED__ACTIVATION_GATE_CLOSED__ZERO_EXPOSURE",
            "slot_id":s["slot_id"],
            "task_digest":s["task_digest"],
            "task_read":False,
            "task_started":False,
            "benchmark_trials_consumed":0,
            "incremental_spend_usd":0,
            "terminal_credit_delta":0,
          }
          open("EXECUTION_RATCHET_VERIFICATION.json","w").write(json.dumps(out,indent=2,sort_keys=True)+"\n")
          print(json.dumps(out,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: tb-science-execution-ratchet-v4
          path: |
            EXECUTION_RATCHET_VERIFICATION.json
            TERMINAL_EXECUTION_ADMISSION_*.json
          retention-days: 7
