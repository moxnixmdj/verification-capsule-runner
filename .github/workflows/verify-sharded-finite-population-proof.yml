name: Verify sharded finite population proof
on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/runtime/finite_population_proof.py'
      - 'canonical/runtime/sharded_finite_population_proof.py'
      - 'verification/test_sharded_finite_population_proof_independent.py'
      - '.github/workflows/verify-sharded-finite-population-proof.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Bind exact Brain blobs
        run: |
          test "$(git hash-object canonical/runtime/finite_population_proof.py)" = "20980ac7ddb4cab713c847ac03e5a6fa40748154"
          test "$(git hash-object canonical/runtime/sharded_finite_population_proof.py)" = "67e2ed81e17d24618094d8e32a1ffa968a3ef449"
      - name: Run independent failure-policy and sample-binding tests
        run: python -m unittest -v verification.test_sharded_finite_population_proof_independent
