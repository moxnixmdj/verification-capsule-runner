name: Verify rank22 lossless source map
on:
  pull_request:
    branches: [main]
    paths:
      - 'verification/rank22_stage_b/FREECAD_SPRING_CLIP_RANK22_SOURCE_CONTRACT_COMPILATION_V1.json'
      - 'verification/rank22_source_map/**'
      - '.github/workflows/verify-rank22-source-map.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Checkout exact benchmark source
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/harbor-framework/terminal-bench.git /tmp/tb
          git -C /tmp/tb checkout --detach 452bf305c6daa62fc59061d22133a7cbc7c1572e
      - name: Verify exact Brain source compiler blob
        run: |
          test "$(git hash-object independent/brain_core_hardening/source_contract_compiler.py)" = "8f68e0e8aba6585626b414e3cb49c20d0470ea0c"
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run lossless source-map verification
        env:
          TB_ROOT: /tmp/tb
        run: python -m pytest -q verification/rank22_source_map/test_source_map.py
