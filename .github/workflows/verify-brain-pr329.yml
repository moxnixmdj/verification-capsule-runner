name: Verify Brain PR329 Firewall
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify exact Brain PR329 fail-closed invariants
        run: python verify_pr329.py
      - uses: actions/upload-artifact@v4
        with:
          name: brain-pr329-firewall-verification
          path: verify-pr329-report.json
          if-no-files-found: error
