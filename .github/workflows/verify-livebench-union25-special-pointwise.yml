name: Verify LiveBench union25 special pointwise

on:
  pull_request:
    branches: [main]
    paths:
      - "subject/livebench_union25_special_20261005/**"
      - "verify_livebench_union25_special_pointwise.py"
      - ".github/workflows/verify-livebench-union25-special-pointwise.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned evaluator dependencies
        run: |
          python -m pip install --disable-pip-version-check --quiet             nltk==3.10.3 langdetect==1.0.9 immutabledict==4.3.1
          python - <<'PY'
          import nltk
          assert nltk.download("punkt", quiet=True)
          try:
              nltk.download("punkt_tab", quiet=True)
          except Exception:
              pass
          PY

      - name: Verify all 17 special delta structures
        run: python verify_livebench_union25_special_pointwise.py

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livebench-union25-special-pointwise-verification
          path: livebench_union25_special_pointwise_verification.json
          if-no-files-found: error
