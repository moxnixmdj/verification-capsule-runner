name: Verify LiveBench Legacy Parameter Compiler
on:
  pull_request:
    branches: [main]
    paths:
      - verify_livebench_legacy_parameter_compiler.py
      - .github/workflows/verify-livebench-legacy-parameter-compiler.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact public checker dependencies
        run: python -m pip install --disable-pip-version-check langdetect==1.0.9 nltk==3.9.1
      - name: Verify visible parameter reconstruction on synthetic public grammar
        run: python verify_livebench_legacy_parameter_compiler.py
      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livebench-legacy-parameter-compiler-receipt
          path: livebench_legacy_parameter_compiler_receipt.json
          if-no-files-found: error
