name: Verify exact live 12-of-12 prequalification push
on:
  push:
    branches: [verify-prequalification-12of12-20261002]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Bind exact Brain blobs
        run: |
          test "$(git hash-object canonical/runtime/terminal_prequalification_reducer.py)" = "da929015fafabed2b5a134a2e95b6bff2f47349c"
          test "$(git hash-object canonical/governance/EXACT_FOUR_PORTFOLIO_PREQUALIFICATION_V1.json)" = "d85f90df76db4b6b1650fe40279f33d6a7d9e7b5"
          test "$(git hash-object canonical/governance/BEHAVIORAL_CONTRACT_REGISTRY_V1.json)" = "afa00109031d638fef32cc3fe10be18786605c39"
          test "$(git hash-object canonical/governance/ACTIVE_TERMINAL_PROOF_BASIS_V1.json)" = "2ba39428f0065f0d8739c43935f7026ba6eedcfb"
          test "$(git hash-object canonical/governance/GLOBAL_TERMINAL_REPLACEMENT_POPULATION_PROTOCOL_V2.json)" = "432f1f9122a0a136f71a89eae5c8fb81692e4071"
      - name: Run reducer unit and bound-state integration tests
        run: PYTHONPATH=. python -m unittest -v canonical.tests.test_terminal_prequalification_reducer
