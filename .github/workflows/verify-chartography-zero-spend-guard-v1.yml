name: Verify Chartography zero-spend guard v1
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/chartography_zero_spend_guard_v1/**"
      - ".github/workflows/verify-chartography-zero-spend-guard-v1.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          cd capsules/chartography_zero_spend_guard_v1
          export PYTHONPATH=.
          python -m unittest canonical.tests.test_chartography_zero_spend_guard_v1 -v
          python verify.py
