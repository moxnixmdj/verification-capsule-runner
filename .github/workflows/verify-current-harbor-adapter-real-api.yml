name: Verify current Harbor adapter against real API
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Harbor
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir 'harbor==0.23.0'
          python - <<'PY'
          import importlib.metadata
          assert importlib.metadata.version("harbor")=="0.23.0"
          PY
      - name: Assert exact current Brain runtime blobs
        run: |
          set -euo pipefail
          test "$(git hash-object canonical/runtime/coding_control_kernel_v1.py)" = "2b5cd4bebc28b8e7096f87aa63ffbb329a819057"
          test "$(git hash-object canonical/runtime/harbor_brain_agent.py)" = "3d7d803bdd25df0379d81b360af3ea40da254771"
          test "$(git hash-object canonical/tests/test_harbor_brain_agent.py)" = "68b3d219ca8cec70fcaa07821397b0ecfad6d6a5"
      - name: Assert adapter bound to real Harbor classes
        run: |
          set -euo pipefail
          python - <<'PY'
          from canonical.runtime import harbor_brain_agent as h
          print({
            "BaseAgent_module": getattr(h.BaseAgent,"__module__",None),
            "AgentCapabilities_module": getattr(h.AgentCapabilities,"__module__",None),
            "HarborBrainAgent_mro": [f"{x.__module__}.{x.__name__}" for x in h.HarborBrainAgent.__mro__],
          })
          assert getattr(h.BaseAgent,"__module__","").startswith("harbor."), "FALLBACK_BASE_AGENT_ACTIVE"
          assert getattr(h.AgentCapabilities,"__module__","").startswith("harbor."), "FALLBACK_AGENT_CAPABILITIES_ACTIVE"
          assert issubclass(h.HarborBrainAgent,h.BaseAgent)
          PY
      - name: Run exact adapter regressions under real Harbor
        run: python -m unittest -v canonical.tests.test_harbor_brain_agent
