name: Mirror Qwen3.8-27B capability bytes

on:
  push:
    paths:
      - ".github/workflows/mirror_qwen38_27b_release.yml"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "mirror-qwen38-27b-trigger/**"

permissions:
  contents: write

concurrency:
  group: qwen38-27b-capability-mirror-v1
  cancel-in-progress: false

env:
  HF_REPO: Qwen/Qwen3.8-27B
  HF_REV: 1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0
  RELEASE_TAG: brain-capability-qwen38-27b-bf16-v1

jobs:
  prepare:
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'mirror-qwen38-27b-run-20261004')
    runs-on: ubuntu-latest
    steps:
      - name: Create immutable versioned release if absent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; resume is safe."
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Brain capability mirror: Qwen3.8-27B BF16 v1" \
              --notes "Content-addressed zero-dollar Brain-controlled mirror of public Apache-2.0 Qwen/Qwen3.8-27B revision $HF_REV. Assets are split below GitHub's 2 GiB release-asset limit. Original shard and part SHA-256 manifests are uploaded beside every shard."
          fi

  mirror_weights:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - { file: model-00001-of-00018.safetensors, sha256: ba0ce20aae489ad196733da5064bcdf159a1fe84f53336648196e1ebb7751b1c, bytes: 3966730552 }
          - { file: model-00002-of-00018.safetensors, sha256: 06a148c01bfbe3faa14a5f184a7ff29a706f7ae1c8b2705d2058e26d17a001fb, bytes: 3043080328 }
          - { file: model-00003-of-00018.safetensors, sha256: 2e1bf62cbcd406eaa64b60d10353e1f0ef4039d0976e56f05cabe953454f9968, bytes: 2542796952 }
          - { file: model-00004-of-00018.safetensors, sha256: 511e34063187882659753c4d93f3859f93c019fd438d8813071921c81d9a3f1a, bytes: 3988973152 }
          - { file: model-00005-of-00018.safetensors, sha256: 635cb53446dc74f219740fc59e18b774f877b803b9722e289ca62575a6efa701, bytes: 2099339864 }
          - { file: model-00006-of-00018.safetensors, sha256: 0bc5214fac607f0e6cc92eec3789d4b8559410ef9fce66621ba8158e8410dae0, bytes: 3979553696 }
          - { file: model-00007-of-00018.safetensors, sha256: 80b0c49033e9a0d5762562aa12f4acdb7f54da586f3d0110f28c48d91cf07892, bytes: 2108759344 }
          - { file: model-00008-of-00018.safetensors, sha256: 7192c5b66185d3592927daabee1cc19e6f6e0ce75988ee20e824b624765fda79, bytes: 3979553696 }
          - { file: model-00009-of-00018.safetensors, sha256: af3c48cc37af44f3db6ae0579baf019180d48d9c527caa0a1f03ff85813a56d8, bytes: 2108759344 }
          - { file: model-00010-of-00018.safetensors, sha256: 163490a76f3bea3a40855b7efc04ce6d27afaf1a34f0bbde495b9491f76457c9, bytes: 3979553696 }
          - { file: model-00011-of-00018.safetensors, sha256: 5f3ae1b948aeee39da77aec558e8236cd65fe4d7cb7686a76bb007acc563c6d8, bytes: 2108759344 }
          - { file: model-00012-of-00018.safetensors, sha256: a3de1c7114677a8f5ac5c4892c90e8238ea5c1e2038c80e757dfc87c3902ca55, bytes: 3979553696 }
          - { file: model-00013-of-00018.safetensors, sha256: 06ab79a41f74c9c5cb734816feb0c7fc364104b227165ee7391231e1155aa02a, bytes: 2108759344 }
          - { file: model-00014-of-00018.safetensors, sha256: 4138ed94603065ba884bbcadedb04d7718bb40117e85e6f5c6fc5b9c05b7a85b, bytes: 3979553696 }
          - { file: model-00015-of-00018.safetensors, sha256: 69224e27b9de4e7dbf6fc936c6eaae08447bda3b80a6c31a871ab451173afd22, bytes: 2108759344 }
          - { file: model-00016-of-00018.safetensors, sha256: 73cb9a1089fb6155cb648609478d6633be8a5c7d9ca5a05bc8925ce8a553cefe, bytes: 3979564040 }
          - { file: model-00017-of-00018.safetensors, sha256: beb51f01056142ac4984bd800507b0dd0fd18de57f8e9ef6ea41d1a3598983a8, bytes: 2108759344 }
          - { file: model-00018-of-00018.safetensors, sha256: 1d3479509e21494658f9b64d317f5ea8e55c4025d28c702d6c4d0b356ce8ea06, bytes: 3392197344 }
    steps:
      - name: Fetch, verify, split and mirror ${{ matrix.file }}
        env:
          GH_TOKEN: ${{ github.token }}
          FILE: ${{ matrix.file }}
          EXPECTED_SHA: ${{ matrix.sha256 }}
          EXPECTED_BYTES: ${{ matrix.bytes }}
        run: |
          set -euo pipefail
          url="https://huggingface.co/$HF_REPO/resolve/$HF_REV/$FILE?download=true"
          curl -L --fail --retry 8 --retry-all-errors --connect-timeout 30 -o "$FILE" "$url"
          actual_bytes="$(stat -c '%s' "$FILE")"
          test "$actual_bytes" = "$EXPECTED_BYTES"
          echo "$EXPECTED_SHA  $FILE" | sha256sum -c -
          split -b 1900m -d -a 2 --additional-suffix=.bin "$FILE" "$FILE.part-"
          sha256sum "$FILE".part-*.bin > "$FILE.parts.sha256"
          printf '%s  %s\n' "$EXPECTED_SHA" "$FILE" > "$FILE.original.sha256"
          printf '%s\n' "$EXPECTED_BYTES" > "$FILE.original.bytes"
          gh release upload "$RELEASE_TAG" \
            "$FILE".part-*.bin \
            "$FILE.parts.sha256" \
            "$FILE.original.sha256" \
            "$FILE.original.bytes" \
            --repo "$GITHUB_REPOSITORY" --clobber
          rm -f "$FILE" "$FILE".part-*.bin

  mirror_metadata:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Fetch exact non-weight repository files and package deterministically
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir snapshot
          files=(
            .gitattributes LICENSE README.md chat_template.jinja config.json crc32.txt
            generation_config.json merges.txt model.safetensors.index.json
            preprocessor_config.json tokenizer.json tokenizer_config.json
            video_preprocessor_config.json vocab.json
          )
          for f in "${files[@]}"; do
            curl -L --fail --retry 8 --retry-all-errors \
              -o "snapshot/$f" \
              "https://huggingface.co/$HF_REPO/resolve/$HF_REV/$f?download=true"
          done
          (cd snapshot && sha256sum "${files[@]}") > metadata-files.sha256
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -cf qwen38-27b-metadata.tar -C snapshot .
          sha256sum qwen38-27b-metadata.tar > qwen38-27b-metadata.tar.sha256
          gh release upload "$RELEASE_TAG" \
            qwen38-27b-metadata.tar qwen38-27b-metadata.tar.sha256 metadata-files.sha256 \
            --repo "$GITHUB_REPOSITORY" --clobber

  finalize:
    needs: [mirror_weights, mirror_metadata]
    runs-on: ubuntu-latest
    steps:
      - name: Freeze release-asset inventory
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            --jq '{
              tag_name: .tag_name,
              target_commitish: .target_commitish,
              immutable: .immutable,
              assets: [.assets[] | {name: .name, size: .size, digest: .digest, url: .browser_download_url}]
            }' > release-asset-manifest.json
          count="$(jq '.assets | length' release-asset-manifest.json)"
          test "$count" -ge 93
          jq -e '[.assets[].size | select(. >= 2147483648)] | length == 0' release-asset-manifest.json >/dev/null
          sha256sum release-asset-manifest.json > release-asset-manifest.json.sha256
          gh release upload "$RELEASE_TAG" \
            release-asset-manifest.json release-asset-manifest.json.sha256 \
            --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --notes "Brain-controlled content-addressed mirror of Qwen/Qwen3.8-27B revision $HF_REV. Every original weight shard was size-checked and SHA-256 verified before splitting. Every split part has a SHA-256 manifest. Metadata files are preserved in a deterministic tar with per-file hashes. Reconstruct original shards, verify original SHA-256, then load with the pinned metadata. No benchmark or capability credit is implied merely by storage."
