name: Verify terminal typed basis activation v1
on:
  pull_request:
    paths:
      - 'verify_terminal_typed_basis_activation_v1_20261004.py'
      - 'subject/terminal_typed_basis_activation_v1_20261004/**'
      - '.github/workflows/verify-terminal-typed-basis-activation-v1-20261004.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python verify_terminal_typed_basis_activation_v1_20261004.py
