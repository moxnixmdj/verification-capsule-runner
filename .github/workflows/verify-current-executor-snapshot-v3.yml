name: Verify current Brain executor snapshot v3
on:
  pull_request:
    branches: [main]
    paths:
      - canonical/runtime/portfolio_multiplex_terminal_instrumentation_v1.py
      - canonical/tests/test_portfolio_multiplex_terminal_instrumentation_v1.py
      - canonical/runtime/multiplex_terminal_instrumentation_reducer_v1.py
      - canonical/tests/test_multiplex_terminal_instrumentation_reducer_v1.py
      - canonical/runtime/cad_t0_route_specific_candidate_v1.py
      - canonical/tests/test_cad_t0_route_specific_candidate_v1.py
      - canonical/tests/test_cad_t0_source_structure_antishortcut_repair_v1.py
      - .github/workflows/verify-current-executor-snapshot-v3.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify exact current Brain blobs
        run: |
          set -euo pipefail
          test "$(git hash-object canonical/runtime/portfolio_multiplex_terminal_instrumentation_v1.py)" = "dd8fba0f27691002babbc7ad1fc6b65d7bb57282"
          test "$(git hash-object canonical/tests/test_portfolio_multiplex_terminal_instrumentation_v1.py)" = "4f8690c5d3d8136f8659e34555282ac93845bb4c"
          test "$(git hash-object canonical/runtime/multiplex_terminal_instrumentation_reducer_v1.py)" = "9633949c5a0602ebd740f9fb15aaaf598e17f46f"
          test "$(git hash-object canonical/tests/test_multiplex_terminal_instrumentation_reducer_v1.py)" = "724387459a21d4c9cb3ae4174080d069083ef06d"
          test "$(git hash-object canonical/runtime/cad_t0_route_specific_candidate_v1.py)" = "aa32750b220a023617938b7be9476f6b3aac6704"
          test "$(git hash-object canonical/tests/test_cad_t0_source_structure_antishortcut_repair_v1.py)" = "8222cf83a7476cd453e06865b8e3aaff8a70b5db"
      - run: python -m pip install --disable-pip-version-check --no-input "pydantic>=2,<3" "cadquery==2.6.1"
      - name: Verify multiplex and repaired CAD candidate
        run: |
          PYTHONPATH=.:canonical/runtime python -m unittest -v \
            canonical.tests.test_portfolio_multiplex_terminal_instrumentation_v1 \
            canonical.tests.test_multiplex_terminal_instrumentation_reducer_v1 \
            canonical.tests.test_cad_t0_route_specific_candidate_v1 \
            canonical.tests.test_cad_t0_source_structure_antishortcut_repair_v1
