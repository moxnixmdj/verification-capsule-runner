name: Verify structured-method universal correctness V1
on:
  pull_request:
    branches: [main]
    paths:
      - "verify_structured_method_universal_v1.py"
      - "subject/structured_method_universal_v1/**"
      - ".github/workflows/verify-structured-method-universal-v1.yml"
  push:
    branches: [main]
    paths:
      - "verify_structured_method_universal_v1.py"
      - "subject/structured_method_universal_v1/**"
      - ".github/workflows/verify-structured-method-universal-v1.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
      - name: Independently verify universal certificate
        run: python verify_structured_method_universal_v1.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: structured-method-universal-v1
          path: structured_method_universal_v1_receipt.json
          if-no-files-found: error
