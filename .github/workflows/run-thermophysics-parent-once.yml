name: Run Faithful Thermophysics Parent Once

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - ARM_THERMOPHYSICS_PARENT_OPENENDED_20260930_002

permissions:
  contents: read

concurrency:
  group: thermophysics-parent-openended-20260930-002
  cancel-in-progress: false

jobs:
  execute-once:
    if: github.head_ref == 'verify/thermophysics-parent-install-20260930-v1' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    env:
      ASTRA_DISABLE_MODEL_PLANNER: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout exact PR head, never merge ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Refresh Ubuntu package metadata
        run: sudo apt-get update
      - name: Execute faithful fresh parent task exactly once
        id: parent
        continue-on-error: true
        run: python run_thermophysics_parent_once.py
      - name: Upload terminal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thermophysics-parent-terminal
          path: thermophysics-parent-terminal.json
          if-no-files-found: error
      - name: Preserve terminal semantic failure
        if: steps.parent.outcome != 'success'
        run: exit 1
