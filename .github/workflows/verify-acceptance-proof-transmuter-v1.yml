name: Verify acceptance proof transmuter V1
on:
  pull_request:
    branches: [main]
    paths:
      - 'verification/acceptance_proof_transmuter_v1/**'
      - '.github/workflows/verify-acceptance-proof-transmuter-v1.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: cd verification/acceptance_proof_transmuter_v1 && python -m unittest -v test_acceptance_proof_transmuter_v1.py
