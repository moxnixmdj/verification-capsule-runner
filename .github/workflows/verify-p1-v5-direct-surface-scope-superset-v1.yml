name: Verify P1 V5 direct-surface scope superset
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/p1_v5_direct_surface_scope_superset_v1/**"
      - ".github/workflows/verify-p1-v5-direct-surface-scope-superset-v1.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact Brain bytes and P1 surface transport semantics
        run: python capsules/p1_v5_direct_surface_scope_superset_v1/verify.py
