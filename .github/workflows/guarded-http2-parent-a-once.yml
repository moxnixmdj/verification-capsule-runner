name: Guarded HTTP2 Parent A Once

on:
  push:
    branches:
      - execute/guarded-http2-parent-a-20260930-v1

permissions:
  contents: write

jobs:
  execute-once:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ASTRA_DISABLE_MODEL_PLANNER: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Exact-byte fail-closed prestart
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _terminal
          test "$(git hash-object canonical/tasks/PARENT-OPENENDED-HTTP2-FLOW-CONTROL-LIMITS-REAL-TASK-20260930-003.json)" = "539cadd30e7e8ac548638157b7f36a1814b97dcd"
          test "$(git hash-object canonical/astra_runtime/missions/PARENT-OPENENDED-HTTP2-FLOW-CONTROL-LIMITS-REAL-TASK-20260930-003.json)" = "fac316bc6d273bf84e06843a6850d358fd3a2e56"
          test "$(git hash-object canonical/runtime/astra_runtime.py)" = "e60345e3814deacc5b79ffd7fcf713febfee0425"
          test "$(git hash-object canonical/runtime/goal_compiler.py)" = "4b61fe911471854ec15c7900816f61e9e55f602e"
          test "$(git hash-object canonical/action_intents/2026-09-30_EXECUTE_GUARDED_HTTP2_PARENT_TASK_A_V1.json)" = "0fd94d0b522053161a99da66265d375da5a3aa6c"
          test "$(git hash-object execution_guard/github_actions_guarded_run_live.py)" = "30ea2fd2cc548444477c7b234a59129ff8386235"
          test "$(git hash-object execution_guard/actions_admission.py)" = "6c46abef66c036f5382d5792b11a82a289b4dd94"
          test "$(git hash-object execution_guard/github_ref_store_live.py)" = "a8b0cf3facd91f4d4248bd4d2ed53f72f7d480c3"
          grep -Fq '"no_same_task_replay": true' canonical/astra_runtime/missions/PARENT-OPENENDED-HTTP2-FLOW-CONTROL-LIMITS-REAL-TASK-20260930-003.json
          grep -Fq '"model_planner_disabled": true' canonical/astra_runtime/missions/PARENT-OPENENDED-HTTP2-FLOW-CONTROL-LIMITS-REAL-TASK-20260930-003.json
          grep -Fq '"canonical_base": "f0f87c981d77b552caa21844e6bcc7b83116f339"' guarded_http2_parent_a_plan.json
          python -m py_compile             canonical/runtime/astra_runtime.py             canonical/runtime/goal_compiler.py             canonical/runtime/capability_proposal_generators.py             canonical/runtime/bound_capabilities/plain_goal_bound_grounding.py             canonical/runtime/bound_capabilities/broad_objective_decompose.py             canonical/runtime/bound_capabilities/open_research_source_frontend.py             canonical/runtime/bound_capabilities/objective_claim_operand_binding.py             canonical/runtime/bound_capabilities/generic_evidence_claim_relation.py
          echo HTTP2_PARENT_A_PRESTART_EXACT_BYTES_OK

      - name: Atomic guard admission and exactly-one parent execution
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ASTRA_DISABLE_MODEL_PLANNER: "1"
        run: |
          set -euo pipefail
          python execution_guard/github_actions_guarded_run_live.py             --plan guarded_http2_parent_a_plan.json             --receipt _terminal/guarded-http2-parent-a-admission.json             2>&1 | tee _terminal/guarded-http2-parent-a-run.log

      - name: Preserve terminal evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: guarded-http2-parent-a-terminal
          path: |
            _terminal/
            guarded_http2_parent_a_plan.json
            canonical/tasks/PARENT-OPENENDED-HTTP2-FLOW-CONTROL-LIMITS-REAL-TASK-20260930-003.json
            canonical/astra_runtime/missions/PARENT-OPENENDED-HTTP2-FLOW-CONTROL-LIMITS-REAL-TASK-20260930-003.json
            canonical/astra_runtime/evidence/
            canonical/astra_runtime/state/
          if-no-files-found: warn
