name: Verify Brain prewave controller composition

on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/runtime/astra_runtime.py'
      - 'canonical/runtime/m4_research_control.py'
      - 'canonical/runtime/shared_decision_primitives.py'
      - 'canonical/runtime/bound_capabilities/research_query_focus.py'
      - 'canonical/runtime/bound_capabilities/open_web_source_candidate_discovery.py'
      - 'canonical/runtime/bound_capabilities/objective_relevance_bm25.py'
      - 'canonical/tests/test_astra_runtime_model_independence.py'
      - 'canonical/tests/test_astra_runtime_verification.py'
      - 'canonical/tests/test_m4_research_control.py'
      - 'canonical/tests/test_open_research_query_focus_relevance.py'
      - 'canonical/laws/MODEL_NON_DEPENDENCE_LAW_V1.md'
      - '.github/workflows/verify-brain-prewave-controller.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Bind exact Brain blobs
        run: |
          test "$(git hash-object canonical/runtime/astra_runtime.py)" = "0ce14dc593c29745b20d83c5f2868cac97e2e80f"
          test "$(git hash-object canonical/runtime/m4_research_control.py)" = "3efb04cde34c344d4c95204b73215249383c46bc"
          test "$(git hash-object canonical/runtime/shared_decision_primitives.py)" = "794e8d1ca9525564b592ffc3af899037183ef655"
          test "$(git hash-object canonical/runtime/bound_capabilities/research_query_focus.py)" = "5403e1dc05716fcfc4f9a91b4534f55dc547eb7f"
          test "$(git hash-object canonical/runtime/bound_capabilities/open_web_source_candidate_discovery.py)" = "81f73bca882d35603e5be43e8c40dd57e73ffce0"
          test "$(git hash-object canonical/runtime/bound_capabilities/objective_relevance_bm25.py)" = "51abc98fd78a895e86600bc4fd7125722013b90d"
          test "$(git hash-object canonical/tests/test_astra_runtime_model_independence.py)" = "41e5992b5d30eaeab4c9561fd162b5f070a8f3eb"
          test "$(git hash-object canonical/tests/test_astra_runtime_verification.py)" = "5570ff5a7c8363fdf017d77660279f91906871a9"
          test "$(git hash-object canonical/tests/test_m4_research_control.py)" = "d5f6c2feea528e27ee5066db3a4ba6bf866dda37"
          test "$(git hash-object canonical/tests/test_open_research_query_focus_relevance.py)" = "27324ce32d299bbbf7420ee4963158bb9a1ef714"
          test "$(git hash-object canonical/laws/MODEL_NON_DEPENDENCE_LAW_V1.md)" = "ed28d48cb5412520ef2968b06bf7f451a8da01d0"
      - name: Run exact Brain prewave controller regression suite
        run: |
          PYTHONPATH=. python -m unittest -v \
            canonical.tests.test_astra_runtime_model_independence \
            canonical.tests.test_astra_runtime_verification \
            canonical.tests.test_m4_research_control \
            canonical.tests.test_open_research_query_focus_relevance
