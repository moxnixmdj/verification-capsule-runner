name: Verify Brain four-route direct-proof mutation preflight
on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/runtime/prewave_direct_proof_preflight.py'
      - 'canonical/tests/test_prewave_direct_proof_preflight.py'
      - '.github/workflows/verify-direct-proof-preflight.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: PYTHONPATH=. python -m unittest -v canonical.tests.test_prewave_direct_proof_preflight
      - run: PYTHONPATH=. python canonical/runtime/prewave_direct_proof_preflight.py
