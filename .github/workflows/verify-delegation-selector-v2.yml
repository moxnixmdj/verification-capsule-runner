name: Verify delegation terminal selector v2

on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/runtime/direct_route_terminal_executors_v1.py'
      - 'canonical/tests/test_direct_route_terminal_executors_v1.py'
      - 'canonical/runtime/browser_state_information_safe_proof.py'
      - 'canonical/runtime/browser_state_information_safe_candidate.py'
      - 'verification/delegation_selector_v2/**'
      - '.github/workflows/verify-delegation-selector-v2.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Bind exact Brain blobs
        run: |
          set -euo pipefail
          test "$(git hash-object canonical/runtime/direct_route_terminal_executors_v1.py)" = "28ef55db77ac81e78bd5c67e4d2b39fef131b505"
          test "$(git hash-object canonical/tests/test_direct_route_terminal_executors_v1.py)" = "17c5c2c6828c89fd5a2cfdd5c3eda6110ab0fb03"
          test "$(git hash-object verification/delegation_selector_v2/DELEGATION_T2_OBJECTIVE_TERMINAL_BINDING_V1.json)" = "a1e441567b132d71713ed55dfc51f01d8de112d1"
          test "$(git hash-object verification/delegation_selector_v2/GLOBAL_TERMINAL_SELECTION_KERNEL_V1.json)" = "669afcde50302e76c1b0a1f6b186aaafa8730515"
      - name: Verify policy-to-code selector binding
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          binding=json.loads(Path("verification/delegation_selector_v2/DELEGATION_T2_OBJECTIVE_TERMINAL_BINDING_V1.json").read_text())
          kernel=json.loads(Path("verification/delegation_selector_v2/GLOBAL_TERMINAL_SELECTION_KERNEL_V1.json").read_text())
          assert binding["behavior_id"] == "TASK_TO_DELEGATION_GRAPH_001"
          assert binding["selector"]["protocol"] == "GLOBAL_TERMINAL_REPLACEMENT_POPULATION_PROTOCOL_V2"
          assert "case_id_rule" not in binding["selector"]
          assert kernel["seed_policy"]["case_id_rule"] == "<behavior_id>::<route_population_version>::slot::<index>"
          assert binding["source_pool"]["version"] == "DELEGATION_T2_OBJECTIVE_POOL_V1"
          assert binding["source_pool"]["terminal_sample_count"] == 132
          assert binding["selector"]["case_replacement"] is False
          assert binding["selector"]["tuning_replay"] is False
          PY
      - name: Run corrected direct-route regressions
        run: python -m unittest -v canonical.tests.test_direct_route_terminal_executors_v1
