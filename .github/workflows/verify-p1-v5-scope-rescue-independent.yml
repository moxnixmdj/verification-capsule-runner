name: Verify P1 V5 scope rescue independent capsule
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/p1_typed_ir_v5/**"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Execute content-addressed P1 V5 independent verifier
        run: python capsules/p1_typed_ir_v5/verify.py
