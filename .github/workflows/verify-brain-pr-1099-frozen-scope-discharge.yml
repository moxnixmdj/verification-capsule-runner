name: Verify Brain PR 1099 frozen tool-discovery scope discharge
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/brain_pr_1099_frozen_scope_discharge/**"
      - ".github/workflows/verify-brain-pr-1099-frozen-scope-discharge.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run adversarial frozen-scope tests
        run: |
          cd capsules/brain_pr_1099_frozen_scope_discharge
          export PYTHONPATH=.
          python -m unittest canonical.tests.test_tool_discovery_frozen_scope_completeness_discharge_v1 -v
      - name: Execute frozen-scope discharge
        run: |
          cd capsules/brain_pr_1099_frozen_scope_discharge
          export PYTHONPATH=.
          python -m canonical.runtime.tool_discovery_frozen_scope_completeness_discharge_v1 > verdict.json
      - name: Enforce exact zero-reality verdict
        run: |
          cd capsules/brain_pr_1099_frozen_scope_discharge
          python - <<'PY'
          import json
          v=json.load(open("verdict.json"))
          assert v["scope_semantics_discharged"] is True,v
          assert v["basis_kind"]=="EXACT_COMPLETE_TARGET_CASE_UNIVERSE",v
          assert v["target_bindings_ok"] is True,v
          assert v["missing_source_facts"]==[],v
          assert v["terminal_cases_replayed"]==0,v
          assert v["new_reality_units_consumed"]==0,v
          assert v["incremental_spend_usd"]==0,v
          assert v["capability_credit_delta"]==0 and v["family_credit_delta"]==0,v
          assert v["execution_authority"] is False and v["promotion_authority"] is False,v
          assert "NO_CLAIM_OF_EXHAUSTIVE_ALL_OPEN_DOMAIN_TOOL_ECOSYSTEMS" in v["hard_nonclaims"],v
          print("Brain PR 1099 frozen tool-discovery scope discharge: PASS")
          PY
