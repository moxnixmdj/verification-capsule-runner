name: Verify terminal delta admission gate v1
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/terminal_delta_admission_gate_v1/**"
      - ".github/workflows/verify-terminal-delta-admission-gate-v1.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact Brain blob identities
        run: |
          cd capsules/terminal_delta_admission_gate_v1
          python - <<'PY'
          import hashlib, json, pathlib
          m=json.load(open("EXPECTED_BRAIN_BLOBS.json",encoding="utf-8"))
          for src,expected in m["exact_brain_blobs"].items():
              data=pathlib.Path(src).read_bytes()
              actual=hashlib.sha1(f"blob {len(data)}\0".encode()+data).hexdigest()
              assert actual==expected,(src,actual,expected)
          print("exact Brain blob identities: PASS")
          PY
      - name: Verify fail-closed semantics
        run: |
          cd capsules/terminal_delta_admission_gate_v1
          export PYTHONPATH=.
          python -m py_compile canonical/runtime/terminal_delta_admission_gate_v1.py
          python -m unittest canonical.tests.test_terminal_delta_admission_gate_v1 -v
      - name: Verify zero-credit governance
        run: |
          cd capsules/terminal_delta_admission_gate_v1
          python - <<'PY'
          import json
          g=json.load(open("canonical/governance/TERMINAL_DELTA_ADMISSION_GATE_V1.json",encoding="utf-8"))
          assert g["capability_credit_delta"]==0
          assert g["family_credit_delta"]==0
          assert g["execution_authority"] is False
          assert g["promotion_authority"] is False
          print("zero-credit governance: PASS")
          PY
