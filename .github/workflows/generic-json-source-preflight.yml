name: Generic JSON Source Preflight

on:
  pull_request:
    branches: [main]
    paths:
      - 'ARM_GENERIC_JSON_SOURCE_PREFLIGHT_20260930_V1'
      - 'generic-json-source-preflight-manifest.json'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check exact frozen JSON sources without recording values
        id: preflight
        continue-on-error: true
        run: python generic_json_source_preflight.py
      - name: Upload source-only preflight report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generic-json-source-preflight-report
          path: generic-json-source-preflight-report.json
          if-no-files-found: error
      - name: Preserve preflight failure
        if: steps.preflight.outcome != 'success'
        run: exit 1
