name: Verify Root2 stable frontier delta
on:
  pull_request:
    paths:
      - "capsules/root2_stable_frontier_delta_20261004/**"
      - "verify_root2_stable_frontier_delta.py"
      - ".github/workflows/verify-root2-stable-frontier-delta.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python verify_root2_stable_frontier_delta.py
