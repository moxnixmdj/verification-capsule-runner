name: Verify structured method T0 T1 multiplex binding
on:
  pull_request:
    branches: [main]
    paths:
      - capsules/structured_multiplex_v1/**
      - .github/workflows/verify-structured-multiplex-v1.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cd capsules/structured_multiplex_v1 && PYTHONPATH=. python -m unittest -v canonical.tests.test_structured_method_portfolio_multiplex_preflight
