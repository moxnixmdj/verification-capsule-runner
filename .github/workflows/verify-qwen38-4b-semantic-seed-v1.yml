name: Verify Qwen3.8-4B Root1 Semantic Seed V1

on:
  push:
    branches: [main]
    paths:
      - verify_qwen38_4b_semantic_seed_v1.py
      - .github/workflows/verify-qwen38-4b-semantic-seed-v1.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qwen38-4b-root1-semantic-seed-v1
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      MODEL_FILE: Qwen3.8-4B-Q4_K_M.gguf
      MODEL_BYTES: "2783446304"
      MODEL_SHA256: dec96e8cf2e11b613bb46513dec485377f9ca5a351e71712ee0e244f287c6790
      MODEL_REV: 391fc7d103e3942a408def3e4f51c2f85d464417
      LLAMA_CPP_REV: 0504396140d1c882f5f6ee34466a42db7ae90114
    steps:
      - uses: actions/checkout@v4

      - name: Hard zero-spend/public-runner gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq '.private')" = "false"
          echo "incremental_spend_usd=0"

      - name: Acquire and hash-verify exact Qwen3.8-4B subject
        run: |
          set -euo pipefail
          curl -fL --retry 8 --retry-all-errors --connect-timeout 30             "https://huggingface.co/empero-ai/Qwen3.8-4B-Distill-GGUF/resolve/$MODEL_REV/$MODEL_FILE?download=true"             -o "$MODEL_FILE"
          test "$(stat -c%s "$MODEL_FILE")" = "$MODEL_BYTES"
          echo "$MODEL_SHA256  $MODEL_FILE" | sha256sum -c -

      - name: Build pinned llama.cpp CPU runtime
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/ggml-org/llama.cpp.git llama.cpp
          git -C llama.cpp checkout "$LLAMA_CPP_REV"
          cmake -S llama.cpp -B llama.cpp/build -DGGML_NATIVE=ON -DGGML_BLAS=OFF -DLLAMA_CURL=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build llama.cpp/build --config Release -j 4 --target llama-server

      - name: Start frozen local inference subject
        run: |
          set -euo pipefail
          nohup ./llama.cpp/build/bin/llama-server             -m "$MODEL_FILE"             --host 127.0.0.1 --port 8080             -c 4096 -t 4 -np 1             > llama-server.log 2>&1 &
          echo $! > llama-server.pid
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null; then
              exit 0
            fi
            if ! kill -0 "$(cat llama-server.pid)" 2>/dev/null; then
              cat llama-server.log
              exit 1
            fi
            sleep 2
          done
          cat llama-server.log
          exit 1

      - name: Execute one-shot frozen semantic seed suite
        run: |
          set -euo pipefail
          python verify_qwen38_4b_semantic_seed_v1.py

      - name: Upload exact execution receipt and server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen38-4b-semantic-seed-v1
          path: |
            qwen38_4b_semantic_seed_receipt_v1.json
            llama-server.log
          if-no-files-found: warn
