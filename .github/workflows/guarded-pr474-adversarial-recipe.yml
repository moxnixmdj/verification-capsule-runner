name: Guarded PR474 Adversarial Recipe Qualification

on:
  pull_request:
    branches: [main]
    paths:
      - independent_pr474_broad_routing_verifier.py
      - guarded_pr474_adversarial_recipe_plan.json
      - .github/workflows/guarded-pr474-adversarial-recipe.yml

permissions:
  contents: write

jobs:
  qualify:
    if: github.head_ref == 'verify/guarded-pr474-broad-routing-20260930-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Guard and adversarially qualify exact PR474 bytes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python execution_guard/github_actions_guarded_run_live.py --plan guarded_pr474_adversarial_recipe_plan.json --receipt guarded-pr474-adversarial-recipe-admission.json
      - name: Upload adversarial evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: guarded-pr474-adversarial-recipe
          path: |
            guarded-pr474-adversarial-recipe-admission.json
            guarded_pr474_adversarial_recipe_plan.json
            pr474_broad_routing_qualification.json
          if-no-files-found: warn
