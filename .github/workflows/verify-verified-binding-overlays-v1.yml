name: Verify verified binding overlays v1
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/verified_binding_overlays_v1/**"
      - ".github/workflows/verify-verified-binding-overlays-v1.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact Brain overlay transaction
        run: |
          cd capsules/verified_binding_overlays_v1
          export PYTHONPATH=.
          python -m py_compile canonical/runtime/protocol_implication_overlay_batch_reducer_v1.py
          python canonical/tests/test_protocol_implication_overlay_batch_reducer_v1.py
          python independent_verify.py
