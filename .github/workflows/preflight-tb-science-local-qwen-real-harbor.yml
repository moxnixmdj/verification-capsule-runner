name: Preflight repaired TB-Science agent on real Harbor
on:
  push:
    branches: ["preflight/tb-science-local-qwen-real-harbor-20261003-sol"]
    paths:
      - ".github/workflows/preflight-tb-science-local-qwen-real-harbor.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/preflight-tb-science-local-qwen-real-harbor.yml"

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bind exact independently live-verified repair bytes
        run: |
          set -euo pipefail
          C=capsules/tb_science_local_qwen_planner_repair_v1
          test "$(git hash-object "$C/canonical/runtime/harbor_science_planner_v1.py")" = "879887984e2ca8abacac486d687f519f5d0d78a5"
          test "$(git hash-object "$C/canonical/runtime/harbor_science_agent_v1.py")" = "5557efd21f1a433ad16766def3775a79c459784b"
          test "$(git hash-object "$C/canonical/runtime/harbor_command_policy.py")" = "a525773417291c7a4841bf35e1baff5370350d0d"
          test "$(git hash-object "$C/canonical/runtime/harbor_environment_transport.py")" = "ec46f648214a37bb16025d5ef2593efdf59f0d79"
          test "$(git hash-object "$C/canonical/governance/TB_SCIENCE_LOCAL_QWEN_PLANNER_REPAIR_V1.json")" = "3d804b56b38f6d2d335e9cf4e471ad86026ce7f3"
          git merge-base --is-ancestor a45dd9cc1d1b6fd8d066cff115e8a471ebf197d4 HEAD

      - name: Install exact Harbor release
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir -q 'harbor==0.23.0'
          python - <<'PY'
          import importlib.metadata
          assert importlib.metadata.version("harbor")=="0.23.0"
          PY

      - name: Instantiate exact repaired Brain agent through real Harbor API
        run: |
          set -euo pipefail
          C="$GITHUB_WORKSPACE/capsules/tb_science_local_qwen_planner_repair_v1"
          PYTHONPATH="$C" python - <<'PY' | tee REAL_HARBOR_REPAIRED_AGENT_PREFLIGHT.json
          import asyncio, json
          from pathlib import Path
          from canonical.runtime import harbor_science_agent_v1 as s
          from canonical.runtime import harbor_science_planner_v1 as p

          assert getattr(s.BaseAgent,"__module__","").startswith("harbor."), s.BaseAgent
          assert getattr(s.AgentCapabilities,"__module__","").startswith("harbor."), s.AgentCapabilities
          assert issubclass(s.HarborScienceAgent,s.BaseAgent)
          agent=s.HarborScienceAgent(Path("/tmp/brain-science-zero-case-logs"))
          assert agent.version()=="1.2.0", agent.version()
          assert s.HarborScienceAgent.name()=="project-brain-science"
          assert p.ENDPOINT=="http://127.0.0.1:8080/v1/chat/completions"
          assert p.MODEL=="brain-qwen3.5-9b"
          assert p.TOOL_NAME=="submit_science_proposal"
          assert not p.ENDPOINT.startswith("https://")
          asyncio.run(agent.setup(None))
          print(json.dumps({
            "schema":"PROJECT_BRAIN_TB_SCIENCE_REPAIRED_AGENT_REAL_HARBOR_ZERO_CASE_PREFLIGHT_V1",
            "status":"PASS",
            "harbor_version":"0.23.0",
            "agent_version":agent.version(),
            "agent_class":f"{s.HarborScienceAgent.__module__}:{s.HarborScienceAgent.__name__}",
            "base_agent_module":s.BaseAgent.__module__,
            "planner_endpoint":p.ENDPOINT,
            "planner_model":p.MODEL,
            "prior_live_local_qwen_verification_merge":"a45dd9cc1d1b6fd8d066cff115e8a471ebf197d4",
            "terminal_case_content_read":0,
            "terminal_results_observed":0,
            "incremental_spend_usd":0
          },sort_keys=True))
          PY

      - name: Resolve frozen TB-Science dataset identity without reading task content
        run: |
          set -euo pipefail
          if harbor version show terminal-bench-science/terminal-bench-science@0.1.0 --json > TB_SCIENCE_METADATA.json 2>TB_SCIENCE_METADATA.err; then
            :
          elif harbor version show terminal-bench-science/terminal-bench-science@v0.1.0 --json > TB_SCIENCE_METADATA.json 2>TB_SCIENCE_METADATA.err; then
            :
          else
            cat TB_SCIENCE_METADATA.err
            exit 1
          fi
          python - <<'PY'
          import json
          p=json.load(open("TB_SCIENCE_METADATA.json"))
          assert p["package"]=="terminal-bench-science/terminal-bench-science", p
          assert p["type"]=="dataset", p
          assert p["visibility"]=="public", p
          assert p["content_hash"]=="sha256:91531bf50016a7c64f6cc60794a17c64c6b2c14858a8ae0de39ca16f2abd611a", p
          assert "files" not in p and "tasks" not in p, p
          PY

      - name: Verify zero-cost carrier execution surface
        run: |
          set -euo pipefail
          docker version >/dev/null
          docker info >/dev/null
          harbor run --help > HARBOR_RUN_HELP.txt
          grep -qi 'agent' HARBOR_RUN_HELP.txt
          grep -qi 'dataset' HARBOR_RUN_HELP.txt

      - name: Preserve zero-case evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tb-science-repaired-agent-real-harbor-zero-case-preflight
          path: |
            REAL_HARBOR_REPAIRED_AGENT_PREFLIGHT.json
            TB_SCIENCE_METADATA.json
            TB_SCIENCE_METADATA.err
            HARBOR_RUN_HELP.txt
          if-no-files-found: warn
