name: Verify Brain PR 1079 final P1 frontier reconciliation
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/brain_pr_1079_final_p1_frontier/**"
      - ".github/workflows/verify-brain-pr-1079-final-p1-frontier.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact Brain blobs
        run: |
          cd capsules/brain_pr_1079_final_p1_frontier
          python - <<'PY'
          import hashlib,pathlib
          expected={
            "canonical/governance/CURRENT_TERMINAL_AUTHORITY_V1.json":"a47c251da8f7658f1dbe5174a149742dfaf45fc2",
            "canonical/verification/P1_V7_DIRECT_SURFACE_TRANSPORT_AND_IDENTIFIABILITY_PUBLIC_RUNNER_VERIFICATION_20261003_V1.json":"e9d0632bd85e2deb43247d6bc78e641cb6440db4",
            "canonical/governance/P1_V7_FAILURE_SEMANTICS_ZERO_REALITY_SOURCE_AUDIT_V1.json":"1bfe22efbb4ca6cca7ec43e092497cf94afab15e",
            "canonical/verification/P1_V7_FAILURE_SEMANTICS_ZERO_REALITY_SOURCE_AUDIT_PUBLIC_RUNNER_VERIFICATION_20261003_V1.json":"44962dc709cdcf7f3a05ca9ac864abf9fe2aaa67",
          }
          for p,e in expected.items():
            b=pathlib.Path(p).read_bytes()
            got=hashlib.sha1(f"blob {len(b)}\0".encode()+b).hexdigest()
            assert got==e,(p,got,e)
          print("exact final Brain P1 frontier blobs: PASS")
          PY
      - name: Verify authority remains fail-closed and zero-credit
        run: |
          cd capsules/brain_pr_1079_final_p1_frontier
          python - <<'PY'
          import json
          a=json.load(open("canonical/governance/CURRENT_TERMINAL_AUTHORITY_V1.json"))
          assert a["status"]=="ACTIVE_FAIL_CLOSED__TERMINAL_GOAL_NOT_ACHIEVED",a["status"]
          assert a["truth"]["opus55_acceptance"].startswith("2/19_PASS__17/19_OPEN"),a["truth"]
          assert a["truth"]["achieved"] is False
          assert "P1_QUARANTINE_REMAINS" in a["next"],a["next"]
          assert "DO_NOT_REPLAY_TERMINAL_V3" in a["next"],a["next"]
          assert "DO_NOT_RETRIGGER_QUARANTINED_ZERO_STEP_PRIVATE_ACTIONS" in a["next"],a["next"]
          assert "FULL_BRAIN_CORPUS_SCAN" in a["next"],a["next"]
          assert "NO_ACCEPTANCE_CREDIT" in a["next"],a["next"]
          src=a["sources"]
          assert src["p1_v7_direct_surface_transport_and_identifiability_verification"]["status"].startswith("INDEPENDENT_PUBLIC_RUNNER_PASS__")
          assert src["p1_v7_failure_semantics_zero_reality_source_audit_verification"]["status"].startswith("INDEPENDENT_PUBLIC_RUNNER_PASS__")
          for key in ("p1_v7_direct_surface_transport_and_identifiability_verification","p1_v7_failure_semantics_zero_reality_source_audit_verification"):
            assert src[key]["capability_credit_delta"]==0 and src[key]["family_credit_delta"]==0
          print("fail-closed authority reconciliation: PASS")
          PY
      - name: Verify receipt consistency
        run: |
          cd capsules/brain_pr_1079_final_p1_frontier
          python - <<'PY'
          import json
          r1=json.load(open("canonical/verification/P1_V7_DIRECT_SURFACE_TRANSPORT_AND_IDENTIFIABILITY_PUBLIC_RUNNER_VERIFICATION_20261003_V1.json"))
          r2=json.load(open("canonical/verification/P1_V7_FAILURE_SEMANTICS_ZERO_REALITY_SOURCE_AUDIT_PUBLIC_RUNNER_VERIFICATION_20261003_V1.json"))
          assert r1["status"].startswith("INDEPENDENT_PUBLIC_RUNNER_PASS__")
          assert "NO_DETERMINISTIC_ADAPTER_USING_ONLY_CURRENT_PROJECTED_FIELDS_CAN_BE_UNIVERSALLY_SOUND" in r1["verified_consequences"]
          assert r2["status"].startswith("INDEPENDENT_PUBLIC_RUNNER_PASS__")
          assert "NO_CURRENTLY_PRESERVED_ADMISSIBLE_ZERO_REALITY_SOURCE_DISCHARGES_V7_FAILURE_SEMANTICS_TRANSPORT" in r2["verified"]
          assert r2["minimum_missing_fact"]=="CANDIDATE_VISIBLE_FAILURE_SEMANTICS_OR_AN_INDEPENDENTLY_PROVED_EQUIVALENT_DISCRIMINATOR_BOUND_AT_NORMALIZATION_OR_INSTRUMENTATION_TIME"
          for r in (r1,r2):
            assert r["terminal_results_replayed"]==0
            assert r["new_reality_units_consumed"]==0
            assert r["capability_credit_delta"]==0
            assert r["family_credit_delta"]==0
            assert r["execution_authority"] is False
            assert r["promotion_authority"] is False
          print("P1 verification receipt consistency: PASS")
          PY
