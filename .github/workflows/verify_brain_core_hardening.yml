name: Verify Brain core hardening

on:
  pull_request:
    paths:
      - "independent/brain_core_hardening/**"
      - "test_brain_core_hardening.py"
      - ".github/workflows/verify_brain_core_hardening.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Compile kernels
        run: |
          python -m py_compile independent/brain_core_hardening/source_contract_compiler.py
          python -m py_compile independent/brain_core_hardening/execution_authority_reducer.py
      - name: Run adversarial regressions
        run: python -m unittest -v test_brain_core_hardening.py
