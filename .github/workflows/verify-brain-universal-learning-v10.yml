name: Verify Brain Universal Learning V10

on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/universal_learning_v10/**"
      - ".github/workflows/verify-brain-universal-learning-v10.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact Brain V10 blob identities
        run: |
          cd capsules/universal_learning_v10
          python - <<'PY'
          import hashlib,json,pathlib
          m=json.load(open("EXPECTED_BRAIN_BLOBS.json",encoding="utf-8"))
          for rel,expected in m["exact_brain_blobs"].items():
              data=pathlib.Path(rel).read_bytes()
              got=hashlib.sha1(f"blob {len(data)}\0".encode()+data).hexdigest()
              assert got==expected,(rel,got,expected)
          print("exact V10/V9 blobs: PASS")
          PY
      - name: Compile V10 incremental modules
        run: |
          cd capsules/universal_learning_v10
          python -m py_compile             canonical/runtime/meta_learning_policy_v9.py             canonical/runtime/context_morphism_v10.py             canonical/runtime/cross_context_meta_policy_v10.py             canonical/runtime/universal_learning_cross_context_router_v10.py
      - name: Run independent adversarial V10 theorem
        run: |
          cd capsules/universal_learning_v10
          export PYTHONPATH=.
          python - <<'PY'
          import importlib,json,sys,types
          from canonical.runtime import meta_learning_policy_v9 as mp
          from canonical.runtime import context_morphism_v10 as cm
          from canonical.runtime import cross_context_meta_policy_v10 as cc

          src=["source-code-rich","interactive"]
          dst=["new-sdk","interactive"]
          ssha=mp.context_digest(features=src)
          dsha=mp.context_digest(features=dst)
          semantics={
              "ordered_steps":["inspect","model","verify"],
              "preconditions":["source-inspectable"],
              "invalidators":["source-unavailable"],
          }

          def ep(eid,sid="inspect-first",success=True,b0=10,b1=3,t=2,risk=0,spend=0,ctx=None):
              csha=ctx or ssha
              dig=mp.episode_digest(
                  episode_id=eid,context_sha256=csha,strategy_id=sid,success=success,
                  burden_before=b0,burden_after=b1,wall_clock=t,risk=risk,incremental_spend_usd=spend)
              return {
                  "episode_id":eid,"context_sha256":csha,"strategy_id":sid,"success":success,
                  "burden_before":b0,"burden_after":b1,"wall_clock":t,"risk":risk,
                  "incremental_spend_usd":spend,
                  "verification_receipt":{
                      "receipt_id":"r-"+eid,"independent_verified":True,"exact_byte_bound":True,
                      "conclusion":"success","episode_id":eid,"episode_sha256":dig}}

          def bindings(episodes):
              return [{"episode_id":x["episode_id"],
                       "episode_sha256":x["verification_receipt"]["episode_sha256"]}
                      for x in episodes]

          def make_morph(episodes,sem=semantics,valid=True):
              strategy_sha=cm.strategy_semantics_digest(
                  strategy_id="inspect-first",strategy_semantics=sem)
              episode_set_sha=cm.source_episode_set_digest(
                  strategy_sha256=strategy_sha,episode_bindings=bindings(episodes))
              pre=["source-inspectable"]
              metrics=["BURDEN_REDUCTION","WALL_CLOCK","RISK"]
              inv=["source-unavailable"]
              md=cm.morphism_digest(
                  source_context_sha256=ssha,target_context_sha256=dsha,
                  strategy_id="inspect-first",strategy_sha256=strategy_sha,
                  source_episode_set_sha256=episode_set_sha,
                  preserved_preconditions=pre,preserved_metric_semantics=metrics,
                  invalidators_checked=inv)
              return {
                  "source_context_sha256":ssha,"target_context_sha256":dsha,
                  "strategy_id":"inspect-first","strategy_sha256":strategy_sha,
                  "source_episode_set_sha256":episode_set_sha,
                  "preserved_preconditions":pre,"preserved_metric_semantics":metrics,
                  "invalidators_checked":inv,
                  "verification_receipt":{
                      "receipt_id":"m1","independent_verified":True,"exact_byte_bound":True,
                      "conclusion":"success","strategy_applicability_preserved":True,
                      "performance_metric_semantics_preserved":True,
                      "no_new_strategy_invalidators":valid,
                      "conservative_performance_transport_valid":True,
                      "source_episodes_executed_bound_strategy":True,
                      "source_context_sha256":ssha,"target_context_sha256":dsha,
                      "strategy_id":"inspect-first","strategy_sha256":strategy_sha,
                      "source_episode_set_sha256":episode_set_sha,
                      "morphism_sha256":md}}

          episodes=[ep("e1",b1=2),ep("e2",b1=3)]
          morph=make_morph(episodes)
          candidate={"source_context_features":src,"strategy_id":"inspect-first",
                     "strategy_semantics":semantics,"source_episodes":episodes,
                     "context_morphism":morph}

          out=cc.recommend(target_context_features=dst,transfer_candidates=[candidate])
          assert out["recommended_strategy_id"]=="inspect-first",out
          assert out["evidence_mode"]=="PROOF_GATED_ONE_WAY_CONTEXT_MORPHISM",out
          assert out["planning_only"] is True and out["execution_authority"] is False,out

          tampered_sem={**candidate,"strategy_semantics":{
              **semantics,"ordered_steps":["inspect","execute"]}}
          assert cc.recommend(
              target_context_features=dst,
              transfer_candidates=[tampered_sem])["recommended_strategy_id"] is None

          changed=ep("e1",b1=1)
          tampered_evidence={**candidate,"source_episodes":[changed,episodes[1]]}
          assert cc.recommend(
              target_context_features=dst,
              transfer_candidates=[tampered_evidence])["recommended_strategy_id"] is None

          duplicate={**candidate,"source_episodes":[episodes[0],episodes[0]],"context_morphism":{}}
          assert cc.recommend(
              target_context_features=dst,
              transfer_candidates=[duplicate])["recommended_strategy_id"] is None

          bad_morph=make_morph(episodes,valid=False)
          assert cc.recommend(
              target_context_features=dst,
              transfer_candidates=[{**candidate,"context_morphism":bad_morph}]
          )["recommended_strategy_id"] is None

          one=[ep("single")]
          one_candidate={"source_context_features":src,"strategy_id":"inspect-first",
                         "strategy_semantics":semantics,"source_episodes":one,
                         "context_morphism":make_morph(one)}
          assert cc.recommend(
              target_context_features=dst,
              transfer_candidates=[one_candidate])["recommended_strategy_id"] is None

          failed=[ep("ok"),ep("fail",success=False)]
          failed_candidate={"source_context_features":src,"strategy_id":"inspect-first",
                            "strategy_semantics":semantics,"source_episodes":failed,
                            "context_morphism":make_morph(failed)}
          assert cc.recommend(
              target_context_features=dst,
              transfer_candidates=[failed_candidate])["recommended_strategy_id"] is None

          paid=[ep("ok2"),ep("paid",spend="0.01")]
          paid_candidate={"source_context_features":src,"strategy_id":"inspect-first",
                          "strategy_semantics":semantics,"source_episodes":paid,
                          "context_morphism":make_morph(paid)}
          assert cc.recommend(
              target_context_features=dst,
              transfer_candidates=[paid_candidate])["recommended_strategy_id"] is None

          exact=[ep("t1",sid="native",ctx=dsha,b1=1),ep("t2",sid="native",ctx=dsha,b1=2)]
          exact_out=cc.recommend(
              target_context_features=dst,exact_target_episodes=exact,
              transfer_candidates=[candidate])
          assert exact_out["recommended_strategy_id"]=="native",exact_out
          assert exact_out["evidence_mode"]=="EXACT_TARGET_CONTEXT",exact_out

          reg=[ep("r1",sid="bad",ctx=dsha,b0=5,b1=6),ep("r2",sid="bad",ctx=dsha,b0=5,b1=7)]
          reg_out=cc.recommend(
              target_context_features=dst,exact_target_episodes=reg,
              transfer_candidates=[candidate])
          assert reg_out["recommended_strategy_id"] is None,reg_out
          assert reg_out["status"]=="EXACT_TARGET_EVIDENCE_BLOCKS_CROSS_CONTEXT_FALLBACK",reg_out

          stub=types.ModuleType("canonical.runtime.universal_learning_meta_policy_router_v9")
          stub.route=lambda **kwargs:{
              "route":"BASE_ROUTE","next_action":{"type":"BASE_NEXT"},
              "trusted_execution_authorized":False,
              "empirical_information_action_authorized":True}
          stub.prove_v9_invariants=lambda:{"pass":True}
          sys.modules["canonical.runtime.universal_learning_meta_policy_router_v9"]=stub
          r10=importlib.import_module("canonical.runtime.universal_learning_cross_context_router_v10")
          routed=r10.route(v9_args={},target_context_features=dst,transfer_candidates=[candidate])
          assert routed["route"]=="BASE_ROUTE",routed
          assert routed["next_action"]=={"type":"BASE_NEXT"},routed
          assert routed["execution_authority"] is False and routed["promotion_authority"] is False,routed
          invs=r10.prove_v10_invariants()
          assert invs["pass"] is True,invs
          assert invs["v9_base_preserved"] is True,invs
          assert invs["exact_strategy_semantics_binding_preserved"] is True,invs
          assert invs["exact_source_episode_evidence_binding_preserved"] is True,invs
          assert invs["duplicate_source_evidence_blocked"] is True,invs
          assert invs["unknown_domain_acceptance_proved"] is False,invs

          gov=json.load(open(
              "canonical/governance/UNIVERSAL_LEARNING_CROSS_CONTEXT_TRANSFER_V10.json",
              encoding="utf-8"))
          assert gov["acceptance_credit_delta"]==0 and gov["ownership_credit_delta"]==0,gov
          assert gov["fresh_reality_authority"] is False and gov["promotion_authority"] is False,gov
          assert "NO_STRATEGY_NAME_OR_IDENTIFIER_ONLY_TRANSPORT" in gov["hard_nonclaims"],gov
          assert "NO_EPISODE_ID_ONLY_EVIDENCE_TRANSPORT" in gov["hard_nonclaims"],gov

          print("independent adversarial V10 theorem: PASS")
          PY
