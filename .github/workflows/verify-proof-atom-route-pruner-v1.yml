name: Verify proof atom route pruner v1
on:
  pull_request:
    paths:
      - "capsules/proof_atom_route_pruner_v1/**"
      - ".github/workflows/verify-proof-atom-route-pruner-v1.yml"
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python capsules/proof_atom_route_pruner_v1/verify.py
