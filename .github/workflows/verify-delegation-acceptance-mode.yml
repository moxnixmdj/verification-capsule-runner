name: Verify delegation terminal acceptance mode
on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/governance/DELEGATION_TERMINAL_ACCEPTANCE_MODE_V1.json'
      - 'canonical/verification/DELEGATION_TERMINAL_POPULATION_BINDING_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json'
      - 'canonical/governance/BEHAVIORAL_CONTRACT_REGISTRY_V1.json'
      - 'canonical/governance/DELEGATION_TERMINAL_POPULATION_BINDING_V1.json'
      - 'canonical/verification/DELEGATION_SCOPE_GATE_V2_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json'
      - '.github/workflows/verify-delegation-acceptance-mode.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Bind exact acceptance bytes
        run: |
          set -euo pipefail
          test "$(git hash-object canonical/governance/DELEGATION_TERMINAL_ACCEPTANCE_MODE_V1.json)" = "4e709a3f1167b9d67abe4a56758123497f2e970f"
          test "$(git hash-object canonical/verification/DELEGATION_TERMINAL_POPULATION_BINDING_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json)" = "3965db684d7104c5829ce1fcfa8ee08d2cd42cfc"
          test "$(git hash-object canonical/governance/BEHAVIORAL_CONTRACT_REGISTRY_V1.json)" = "771a50d2b12f36c953903e0ec4cbe4a95cd24f84"
          test "$(git hash-object canonical/governance/DELEGATION_TERMINAL_POPULATION_BINDING_V1.json)" = "bb69379f0c73ac28f0491c74deec25347eaf551c"
          test "$(git hash-object canonical/verification/DELEGATION_SCOPE_GATE_V2_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json)" = "ab1d8d19217fe683b62682c8f7f2ce7800fcfe57"
      - name: Verify registry acceptance binding
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path("canonical/governance/DELEGATION_TERMINAL_ACCEPTANCE_MODE_V1.json").read_text())
          r=json.loads(Path("canonical/governance/BEHAVIORAL_CONTRACT_REGISTRY_V1.json").read_text())
          p=json.loads(Path("canonical/governance/DELEGATION_TERMINAL_POPULATION_BINDING_V1.json").read_text())
          v=json.loads(Path("canonical/verification/DELEGATION_TERMINAL_POPULATION_BINDING_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json").read_text())
          g=json.loads(Path("canonical/verification/DELEGATION_SCOPE_GATE_V2_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json").read_text())
          mode=a["terminal_acceptance_proof_mode"]
          assert mode in r["terminal_acceptance_proof_modes"]
          assert a["proof_mode_basis"]=="THEORETICAL_CEILING"
          assert a["post_freeze_beacon"] is None
          assert p["population"]["sample_count"]==512
          assert p["acceptance"]["allowed_failed_cases"]==0
          assert p["population"]["adaptive_case_selection"] is False
          assert p["population"]["case_replacement"] is False
          assert p["population"]["replay_for_tuning"] is False
          assert v["workflow_conclusion"]=="success"
          assert g["verdict"]["admissible"] is True and g["verdict"]["errors"]==[]
          assert a["terminal_results_observed"]==0
          assert a["fresh_terminal_evidence_consumed"]==0
          assert a["execution_authority"] is False
          print("DELEGATION_TERMINAL_ACCEPTANCE_MODE_PASS")
          PY
