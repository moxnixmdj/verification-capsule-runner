name: Verify browser transition objective audit

on:
  pull_request:
    branches: [main]
    paths:
      - 'capsules/browser_transition_objective_audit_v1/**'
      - '.github/workflows/verify-browser-transition-objective-audit-v1.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact Brain blobs and objective audit tests
        run: |
          set -euo pipefail
          cd capsules/browser_transition_objective_audit_v1
          PYTHONPATH=. python -m unittest -v canonical.tests.test_browser_transition_objective_audit_v1 test_brain_blob_binding
