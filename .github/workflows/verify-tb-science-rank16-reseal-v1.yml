name: Verify TB-Science Rank16 V1 zero-exposure reseal
on:
  pull_request:
    branches: [terminal-execution-v1]
    paths:
      - "capsules/tb_science_rank16_20261009_v1/**"
      - "execution_guard/TB_SCIENCE_RANK16_EXECUTION_BEHAVIOR_V1.json"
      - "execution_guard/CURRENT_TERMINAL_EXECUTION_SURFACE_V1.json"
      - ".github/workflows/execute-tb-science-rank16-20261009-v1.yml"
      - ".github/workflows/verify-tb-science-rank16-reseal-v1.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      C: capsules/tb_science_rank16_20261009_v1
      RUNTIME_C: capsules/tb_science_rank15_20261009_v1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile fresh control surface
        run: |
          set -euo pipefail
          python -m py_compile "$C/rank16_execution_preflight_v6.py" "$C/rank16_start_cas_v6.py" "$C/rank16_prestart_token_guard_v4.py" "$C/rank16_v6_status_journal_runner.py" "$C/rank16_finalize_receipt_v6.py"
      - name: Verify zero-exposure reseal graph
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/capsules/tb_science_rank15_20261009_v1:${{ github.workspace }}/capsules/tb_science_rank16_20261009_v1
        run: |
          set -euo pipefail
          test ! -e "$C/ACTIVATE_RANK16_V1_PR.json"
          python "$C/rank16_v1_zero_exposure_reseal_tests.py"
          python execution_guard/terminal_execution_admission_v3.py --workflow ".github/workflows/execute-tb-science-rank16-20261009-v1.yml" --slot "terminal-bench-science/sparse-network-assimilation::trial-0" --task-digest "sha256:52ba7089dc32952df08c478af76b732fa82468c125431388adbf9798d869826f" --require-execution-authority
          python "$C/rank16_execution_preflight_v6.py"
          test ! -e rank16_task_read
          echo "PASS__RANK16_RESEAL__ZERO_TASK_EXPOSURE"
