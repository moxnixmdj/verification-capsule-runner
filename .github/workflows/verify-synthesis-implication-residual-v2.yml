name: Verify synthesis implication residual v2

on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/synthesis_implication_residual_v2/**"
      - ".github/workflows/verify-synthesis-implication-residual-v2.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify scope-safe synthesis residual
        run: |
          cd capsules/synthesis_implication_residual_v2
          export PYTHONPATH=.
          python -m py_compile canonical/runtime/protocol_implication_scope_algebra_v2.py
          python -m py_compile canonical/runtime/synthesis_implication_residual_verifier_v2.py
          python -m unittest canonical.tests.test_synthesis_implication_residual_verifier_v2 -v
          python canonical/runtime/synthesis_implication_residual_verifier_v2.py
