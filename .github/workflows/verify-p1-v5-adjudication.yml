name: Verify P1 V5 scope and falsify pseudo-rescue
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/p1_v5_adjudication/**"
      - ".github/workflows/verify-p1-v5-adjudication.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run exact-byte P1 V5 adversarial adjudication
        run: python capsules/p1_v5_adjudication/verify.py
