name: Verify rank21 Stage-B source extraction
on:
  pull_request:
    branches: [main]
    paths:
      - 'verification/rank21_stage_b_source_extract/**'
      - '.github/workflows/verify-rank21-stageb-source-extract.yml'
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Checkout exact allowlisted official data only
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/harbor-framework/terminal-bench.git /tmp/terminal-bench
          cd /tmp/terminal-bench
          git sparse-checkout init --no-cone
          printf '%s\n' \
            'tasks/foodstuff-beta-activity/environment/data/measurement data.xls' \
            'tasks/foodstuff-beta-activity/environment/data/sample.xls' \
            'tasks/foodstuff-beta-activity/environment/data/Sr-90_tables.pdf' > .git/info/sparse-checkout
          git checkout --detach 452bf305c6daa62fc59061d22133a7cbc7c1572e
      - name: Install parsers
        run: python -m pip install --disable-pip-version-check xlrd pypdf
      - name: Dump allowlisted workbook cells and PDF text only
        run: python verification/rank21_stage_b_source_extract/dump_sources.py
