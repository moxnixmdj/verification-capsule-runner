name: Verify seed-preserving instruction postprocessor V1
on:
  pull_request:
    branches: [main]
    paths:
      - "subject/seed_preserving_instruction_postprocessor_v1/**"
      - "verify_seed_preserving_instruction_postprocessor_v1.py"
      - ".github/workflows/verify-seed-preserving-instruction-postprocessor-v1.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact subject and fail-closed contract
        run: python verify_seed_preserving_instruction_postprocessor_v1.py
      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seed-preserving-instruction-postprocessor-v1-receipt
          path: seed_preserving_instruction_postprocessor_verification_receipt.json
          if-no-files-found: error
