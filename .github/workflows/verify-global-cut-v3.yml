name: Verify global minimum reality cut v3
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-global-cut-v3.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/verify-global-cut-v3.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Checkout exact Brain state
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/moxnixmdj/brain.git /tmp/brain
          git -C /tmp/brain checkout --detach d19164b1bbafb4f00d41755a002778a51a5af892
          test "$(git -C /tmp/brain rev-parse HEAD)" = "d19164b1bbafb4f00d41755a002778a51a5af892"
      - name: Run exact solver and assert cut
        run: |
          python /tmp/brain/canonical/runtime/minimum_reality_cut.py /tmp/brain/canonical/governance/GLOBAL_MINIMUM_REALITY_CUT_CHALLENGER_V3.json > /tmp/verdict.json
          cat /tmp/verdict.json
          python - <<'PY'
          import json
          from pathlib import Path
          v=json.loads(Path('/tmp/verdict.json').read_text())
          c=json.loads(Path('/tmp/brain/canonical/governance/GLOBAL_MINIMUM_REALITY_CUT_CHALLENGER_V3.json').read_text())
          assert v['status']=='EXACT_MINIMUM', v
          assert v['exact_minimum'] is True, v
          assert v['observation_count']==15, v
          assert v['total_cost']==16.0, v
          assert set(v['selected_observations'])=={x['id'] for x in c['observations']}, v
          assert sum(x['cost'] for x in c['observations'])==16, c
          assert c['expected_exact_minimum']['observation_count']==15, c
          assert c['expected_exact_minimum']['total_cost']==16, c
          print('GLOBAL_CUT_V3_EXACT_PASS')
          PY
