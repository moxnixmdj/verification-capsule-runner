name: Verify Unknown-Domain production preflight
on:
  pull_request:
    branches: [main]
    paths:
      - 'verify_unknown_domain_production_preflight.py'
      - 'canonical/governance/UNKNOWN_DOMAIN_DIRECT_PRODUCTION_PREFLIGHT_INPUT_V1.json'
      - '.github/workflows/verify-unknown-domain-production-preflight.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python verify_unknown_domain_production_preflight.py
