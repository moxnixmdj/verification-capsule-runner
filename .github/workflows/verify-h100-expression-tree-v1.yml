name: Verify H100 expression-tree V1

on:
  pull_request:
    paths:
      - 'subject/h100_expression_tree_v1/**'
      - 'verify_h100_expression_tree_v1.py'
      - '.github/workflows/verify-h100-expression-tree-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact copied subject tests
        env:
          PYTHONPATH: subject/h100_expression_tree_v1
        run: python -m unittest canonical.tests.test_h100_expression_tree_symbolic_regression_v1 -v
      - name: Run independent adversarial verifier
        run: python verify_h100_expression_tree_v1.py
