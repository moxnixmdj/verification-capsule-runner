name: Verify LiveBench active15 clean composition grid

on:
  pull_request:
    branches: [main]
    paths:
      - "subject/livebench_active15_clean_composition_20261005/**"
      - "verify_livebench_active15_clean_composition.py"
      - ".github/workflows/verify-livebench-active15-clean-composition.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned legacy evaluator dependencies
        run: |
          python -m pip install --disable-pip-version-check --quiet \
            nltk==3.10.3 langdetect==1.0.9 immutabledict==4.3.1 numpy
          python - <<'PY'
          import nltk
          assert nltk.download("punkt", quiet=True)
          try:
              nltk.download("punkt_tab", quiet=True)
          except Exception:
              pass
          PY
      - name: Verify all 928 shapes over three source-only parameter seeds
        run: python verify_livebench_active15_clean_composition.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livebench-active15-clean-composition-public-grid
          path: livebench_active15_clean_composition_public_grid_verification.json
          if-no-files-found: error
