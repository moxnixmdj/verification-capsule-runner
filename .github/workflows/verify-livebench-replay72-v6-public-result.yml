name: Verify LiveBench replay72 V6 public result
on:
  push:
    branches:
      - "verify/livebench-replay72-v6-public-result-20261004-0924"
    paths:
      - "VERIFY_LIVEBENCH_REPLAY72_V6_PUBLIC_RESULT"
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.14"
      - run: python verify_livebench_replay72_v6_public_result.py
