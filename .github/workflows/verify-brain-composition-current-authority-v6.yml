name: Verify Brain Composition current authority V6
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/composition_slice_v6/canonical/governance/COMPOSITION_COMPONENT_PROOF_CURRENT_AUTHORITY_V6.json"
      - "capsules/composition_slice_v6/canonical/tests/test_composition_component_proof_current_authority_v6.py"
      - ".github/workflows/verify-brain-composition-current-authority-v6.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact new Brain bytes
        run: |
          cd capsules/composition_slice_v6
          python - <<'PY'
          import hashlib,pathlib
          exp={
            "canonical/governance/COMPOSITION_COMPONENT_PROOF_CURRENT_AUTHORITY_V6.json":"5bb089582a5bc2ee4a44143c8d3a11e919fecdff",
            "canonical/tests/test_composition_component_proof_current_authority_v6.py":"dac79f710674521f240ce6164539c2ec41d47900",
          }
          for p,e in exp.items():
              raw=pathlib.Path(p).read_bytes()
              got=hashlib.sha1(f"blob {len(raw)}\0".encode()+raw).hexdigest()
              assert got==e,(p,got,e)
          print("authority V6 exact new bytes PASS")
          PY
      - name: Verify authority source closure
        run: |
          cd capsules/composition_slice_v6
          export PYTHONPATH=.
          python canonical/tests/test_composition_component_proof_current_authority_v6.py
      - name: Assert zero-credit current state only
        run: |
          cd capsules/composition_slice_v6
          python - <<'PY'
          import json
          a=json.load(open("canonical/governance/COMPOSITION_COMPONENT_PROOF_CURRENT_AUTHORITY_V6.json"))
          assert a["truth"]["current_admissible_scoped_proved"]==4,a
          assert a["truth"]["current_open"]==8,a
          assert a["truth"]["parent_composition_predicate_closed"] is False,a
          assert a["truth"]["strict_opus55_acceptance_delta"]==0,a
          assert len(a["current_admissible_receipts"])==4,a
          assert a["family_credit_delta"]==0 and a["ownership_credit_delta"]==0,a
          assert a["execution_authority"] is False and a["promotion_authority"] is False,a
          print("authority V6 zero-credit current-state assertions PASS")
          PY
