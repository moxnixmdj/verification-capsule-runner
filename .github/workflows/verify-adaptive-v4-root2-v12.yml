name: Verify adaptive V4 Root2 V12 rebind
on:
  pull_request:
    paths:
      - 'subject/adaptive_v4_root2_v12_20261004_sol/**'
      - 'verify_adaptive_v4_root2_v12.py'
      - '.github/workflows/verify-adaptive-v4-root2-v12.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python verify_adaptive_v4_root2_v12.py
