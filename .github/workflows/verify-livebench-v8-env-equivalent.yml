name: Verify LiveBench V8 environment-equivalent diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - "diagnose_livebench_replay72_v8_env_equivalent.py"
      - "verify_livebench_v8_env_equivalent.py"
      - ".github/workflows/verify-livebench-v8-env-equivalent.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.14"
      - run: python verify_livebench_v8_env_equivalent.py
