name: Verify Root2 V8 pointer coherence
on:
  push:
    branches:
      - verify/root2-v8-pointer-coherence-20261004
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact subject blobs
        run: |
          test "$(git hash-object verification_inputs/v8_root_state.json)" = "c1ea0c4368d387b9002cc23b0a3af68b5fee2f76"
          test "$(git hash-object verification_inputs/v8_measurement_bridge.json)" = "1dece79e340ebbbdf817c312285986bc8ac66cde"
          test "$(git hash-object verification_inputs/v8_terminal_authority.json)" = "fe3812b1b76d379b0a97fd59f80674716045f2c6"
          test "$(git hash-object verification_inputs/v8_frontier.json)" = "1f86fe713ed22d46d8ed339857e77de339567df8"
          test "$(git hash-object verification_inputs/v8_activation.json)" = "26f6a170d530d50458c82a12f055d42931fbcd18"
          test "$(git hash-object verification_inputs/v8_verification.json)" = "0bb01e2b316fac9d52a9436bf3582fe3c3684dc1"
      - name: Verify pointer coherence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          load=lambda p: json.loads(Path(p).read_text())
          root=load("verification_inputs/v8_root_state.json")
          bridge=load("verification_inputs/v8_measurement_bridge.json")
          terminal=load("verification_inputs/v8_terminal_authority.json")
          v8=load("verification_inputs/v8_frontier.json")
          act=load("verification_inputs/v8_activation.json")
          ver=load("verification_inputs/v8_verification.json")
          F="canonical/governance/ROOT2_CLOSURE_V2_CURRENT_FRONTIER_V8.json"
          FS="1f86fe713ed22d46d8ed339857e77de339567df8"
          V="canonical/verification/ROOT2_V8_OMC_COMPOSITION_PUBLIC_RUNNER_VERIFICATION_20261004_V1.json"
          VS="0bb01e2b316fac9d52a9436bf3582fe3c3684dc1"
          A="canonical/governance/ROOT2_FRONTIER_V8_ACTIVATION_V1.json"
          AS="26f6a170d530d50458c82a12f055d42931fbcd18"
          rc=root["roots"]["root_2_measurement_or_comparator"]["active_closure_controller"]
          assert rc["current_frontier_path"]==F and rc["current_frontier_git_blob_sha"]==FS
          assert rc["current_frontier_verification_path"]==V and rc["current_frontier_verification_git_blob_sha"]==VS
          assert rc["current_frontier_activation_path"]==A and rc["current_frontier_activation_git_blob_sha"]==AS
          bc=bridge["root2_closure_controller_v2"]
          assert bc["frontier_path"]==F and bc["frontier_git_blob_sha"]==FS
          assert bc["frontier_verification_path"]==V and bc["frontier_verification_git_blob_sha"]==VS
          assert bc["frontier_activation_path"]==A and bc["frontier_activation_git_blob_sha"]==AS
          tc=terminal["sources"]["root2_closure_v2_current_frontier"]
          assert tc["path"]==F and tc["git_blob_sha"]==FS
          assert tc["verification"]==V and tc["verification_git_blob_sha"]==VS
          assert tc["activation"]==A and tc["activation_git_blob_sha"]==AS
          assert act["frontier"]["git_blob_sha"]==FS
          assert act["verification"]["git_blob_sha"]==VS
          assert ver["subject"]["git_blob_sha"]==FS
          assert v8["exact_state"]=={"accepted_families":5,"open_families":14,"proved_atomic":12,"unresolved_atomic":26,"root1_positive_gap_count":0,"root2_only_count":16,"root3_only_count":7,"root2_and_root3_count":3,"root2_touching_predicates":19}
          for obj in (root,bridge,terminal,v8,act,ver):
              if "fresh_reality_authority" in obj: assert obj["fresh_reality_authority"] is False
          print("ROOT2_V8_POINTER_COHERENCE: PASS")
          PY
