name: Verify PR298 Typed Scalar SymPy

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ASTRA_DISABLE_MODEL_PLANNER: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact PR298 bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object canonical/runtime/astra_runtime.py)" = "85642a89a0d99c5e6cafa2e116ffdc24f04de32c"
          test "$(git hash-object canonical/runtime/BOUND_CAPABILITY_REGISTRY_V1.json)" = "23f7b79fca15593eb563bdcdba17c8b972f006db"
          test "$(git hash-object canonical/runtime/goal_compiler.py)" = "4d7f94219893400344a258552e1d808b2dc963dd"
          test "$(git hash-object canonical/runtime/bound_capabilities/numeric_expression_sympy.py)" = "443e3386f11156e55635556b6e8f8ad7d7733592"
          test "$(git hash-object canonical/tests/test_numeric_expression_sympy_binding.py)" = "82af4e1b2a68a63e415c756f121269d89689d7af"
      - name: Run deterministic compiler and safety regressions
        run: python canonical/tests/test_numeric_expression_sympy_binding.py
      - name: Run fresh demography typed-expression task and independent oracle
        run: python verify_pr298_typed_scalar_sympy.py
      - name: Upload exact report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr298-typed-scalar-sympy-fresh-report
          path: pr298-typed-scalar-sympy-fresh-report.json
          if-no-files-found: error
