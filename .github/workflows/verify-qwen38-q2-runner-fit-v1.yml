name: Verify Qwen3.8 Q2 runner resource preflight

on:
  push:
    branches:
      - verify/qwen38-q2-runner-fit-20261004-sol
    paths:
      - verify_qwen38_q2_runner_fit_v1.py
      - .github/workflows/verify-qwen38-q2-runner-fit-v1.yml
  pull_request:
    branches:
      - main
    paths:
      - verify_qwen38_q2_runner_fit_v1.py
      - .github/workflows/verify-qwen38-q2-runner-fit-v1.yml

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Measure actual runner resources without model download
        run: python verify_qwen38_q2_runner_fit_v1.py
      - name: Upload measurement receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen38-q2-runner-fit-receipt
          path: qwen38_q2_runner_fit_receipt.json
          if-no-files-found: error
