name: Verify Brain PR 1100 Tool Discovery V2
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/brain_pr_1100_tool_discovery_refinement_v2/**"
      - ".github/workflows/verify-brain-pr-1100-tool-discovery-v2.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact Brain candidate blob identities
        shell: bash
        run: |
          set -euo pipefail
          cd capsules/brain_pr_1100_tool_discovery_refinement_v2
          test "$(git hash-object canonical/runtime/tool_discovery_dynamic_candidate_v3.py)" = "bbbee4d6baf8df937543644397abba38a67dce62"
          test "$(git hash-object canonical/runtime/tool_discovery_dynamic_candidate_v4.py)" = "b8cd817a07c0b93ff740120f869e7fbb5650f801"
          test "$(git hash-object canonical/tests/test_tool_discovery_dynamic_candidate_v4.py)" = "57a5758becdf3314e1c8dad66af47233c4a443c7"
          test "$(git hash-object canonical/runtime/tool_discovery_dynamic_refinement_v2.py)" = "716f7d96ac3f347d49accc382f07f4c768a1004e"
          test "$(git hash-object canonical/tests/test_tool_discovery_dynamic_refinement_v2.py)" = "83b3e949b4c1018b7409e0c2c558d0bb2b9ff357"
          test "$(git hash-object canonical/governance/TOOL_DISCOVERY_COMPLETE_INTERFACE_CONTRACT_V2.json)" = "d342962d6d90f4fdb78446d7f7711c05938a3a25"
          test "$(git hash-object canonical/governance/TOOL_DISCOVERY_DYNAMIC_V3_LEAST_COST_COUNTEREXAMPLE_V1.json)" = "062a8b11f75d702ab8fc0e6369091aeb4f7bb6a9"
          test "$(git hash-object canonical/governance/OPUS55_TERMINAL_PROOF_PROTOCOLS_V1.json)" = "62394e5b7d221ec9f69c3458f669e40e253a9d09"
          test "$(git hash-object canonical/governance/BEHAVIORAL_CONTRACT_REGISTRY_V1.json)" = "ee187f611a0e82b2de495ee377682f39bc31dd31"
          test "$(git hash-object canonical/governance/TOOL_DISCOVERY_SCOPE_FORMALISM_CUT_ACTIVATION_V1.json)" = "48ba33998e73b8eec2731be51a7ec78077ed0d4a"
          test "$(git hash-object canonical/governance/TOOL_DISCOVERY_DYNAMIC_REFINEMENT_V2.json)" = "daeffa099bc5934760a662d189b15aa877b50ed7"
          test "$(git hash-object canonical/action_intents/2026-10-03_TOOL_DISCOVERY_DYNAMIC_REFINEMENT_V2.json)" = "95fe30812a4da4300dc422d76b0d5d76c8b95620"
      - name: Reproduce V3 falsification and V4 regression suite
        shell: bash
        run: |
          set -euo pipefail
          cd capsules/brain_pr_1100_tool_discovery_refinement_v2
          export PYTHONPATH=.
          python -m unittest canonical.tests.test_tool_discovery_dynamic_candidate_v4 -v
      - name: Run V2 fail-closed refinement tests
        shell: bash
        run: |
          set -euo pipefail
          cd capsules/brain_pr_1100_tool_discovery_refinement_v2
          export PYTHONPATH=.
          python -m unittest canonical.tests.test_tool_discovery_dynamic_refinement_v2 -v
      - name: Execute V2 refinement compiler
        shell: bash
        run: |
          set -euo pipefail
          cd capsules/brain_pr_1100_tool_discovery_refinement_v2
          export PYTHONPATH=.
          python -m canonical.runtime.tool_discovery_dynamic_refinement_v2 > verdict.json
      - name: Enforce truth-preserving V2 verdict
        shell: bash
        run: |
          set -euo pipefail
          cd capsules/brain_pr_1100_tool_discovery_refinement_v2
          python - <<'PY'
          import json
          v=json.load(open("verdict.json",encoding="utf-8"))
          assert v["status"].startswith("PASS__V3_LEAST_COST_COUNTEREXAMPLE_COMPILED"),v
          assert v["source_blob_drift"]==[],v
          assert v["frozen_target_preserved"] is True,v
          assert v["v1_conditional_implication_valid"] is False,v
          assert v["v3_least_cost_counterexample_confirmed"] is True,v
          assert v["v4_discovery_first_invariant_pass"] is True,v
          assert v["v4_source_ordering_invariant_pass"] is True,v
          assert v["universal_target_proved"] is False,v
          assert v["minimum_missing_facts"]==[
            "INDEPENDENT_VERIFIED_COMPLETE_DISCOVERY_INTERFACE_INSTANCE_SATISFYING_TOOL_DISCOVERY_COMPLETE_INTERFACE_CONTRACT_V2",
            "INDEPENDENT_SCOPE_COMPLETE_FORMAL_OR_EXHAUSTIVE_ACCEPTANCE_PROOF_FOR_DISCOVERY_EXHAUSTIVE_V4_OVER_THE_FROZEN_TOOL_DISCOVERY_TARGET",
          ],v
          assert v["new_reality_units_consumed"]==0,v
          assert v["terminal_results_replayed"]==0,v
          assert v["capability_credit_delta"]==0 and v["family_credit_delta"]==0,v
          assert v["execution_authority"] is False and v["promotion_authority"] is False,v
          print("Tool Discovery V2 truth repair: PASS")
          PY
