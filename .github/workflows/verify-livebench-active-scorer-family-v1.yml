name: Verify LiveBench active scorer family V1

on:
  push:
    branches: ["verify/livebench-active-scorer-family-v1-20261004-m"]
    paths:
      - ".github/workflows/verify-livebench-active-scorer-family-v1.yml"
      - "capsules/livebench_active_scorer_family_v1/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/verify-livebench-active-scorer-family-v1.yml"
      - "capsules/livebench_active_scorer_family_v1/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Bind exact zero-credit candidate
        run: |
          set -euo pipefail
          test "$(git hash-object capsules/livebench_active_scorer_family_v1/CANDIDATE.json)" = "416a15134aa3b8b6a8d7b78aa312e57f6526dcb0"
          python - <<'PY'
          import json
          c=json.load(open("capsules/livebench_active_scorer_family_v1/CANDIDATE.json"))
          assert c["target_predicate"]=="LIVEBENCH_IF_GE_65_7"
          assert c["execution_authority"] is False
          assert c["promotion_authority"] is False
          assert c["fresh_reality_authority"] is False
          assert c["accounting"]["terminal_case_content_read"]==0
          assert c["accounting"]["terminal_cases_executed"]==0
          PY

      - name: Fetch exact public dispatch source
        run: |
          set -euo pipefail
          git init /tmp/LiveBench
          git -C /tmp/LiveBench remote add origin https://github.com/LiveBench/LiveBench.git
          git -C /tmp/LiveBench fetch --depth 1 origin 8f8e5c381a16e3f24257776edd53471fe86f8091
          git -C /tmp/LiveBench checkout --detach FETCH_HEAD
          test "$(git -C /tmp/LiveBench rev-parse HEAD)" = "8f8e5c381a16e3f24257776edd53471fe86f8091"
          test "$(git -C /tmp/LiveBench hash-object livebench/gen_ground_truth_judgment.py)" = "b36561da5b54380c724c507462d0ee65feefeac8"
          python - <<'PY'
          from pathlib import Path
          text=Path("/tmp/LiveBench/livebench/gen_ground_truth_judgment.py").read_text()
          needle='old_instruction_following_matches = [m for m in matches if m.question.get(\'category\') == \'instruction_following\' and m.question.get("livebench_release_date", "") < "2025-11-25"]'
          assert needle in text
          assert "instruction_following_process_results(if_questions, if_answers, task_name, model_id, debug)" in text
          print("DISPATCH_BINDING_PASS")
          PY

      - name: Download exact frozen parquet
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error \
            "https://huggingface.co/datasets/livebench/instruction_following/resolve/0868379c4b5cf62aeacaf8be4f08fced815c81bb/data/test-00000-of-00001.parquet" \
            -o /tmp/instruction_following.parquet
          test "$(stat -c %s /tmp/instruction_following.parquet)" = "537024"
          echo "a9bb97bbaf8788142c310bcb33d50e2f6f5df8cbd8b8c3db677816b06f0f4f25  /tmp/instruction_following.parquet" | sha256sum -c -

      - name: Prove active population scorer-family binding from metadata only
        run: |
          set -euo pipefail
          python -m pip install --quiet "pyarrow==21.0.0"
          python - <<'PY'
          import json
          from collections import Counter
          import pyarrow.parquet as pq

          allowed_columns=["question_id","task","livebench_release_date","livebench_removal_date"]
          table=pq.read_table("/tmp/instruction_following.parquet",columns=allowed_columns)
          assert table.column_names==allowed_columns
          rows=table.to_pylist()
          assert len(rows)==400

          selected_release="2026-06-25"
          valid_release_dates={
            "2024-06-24","2024-07-26","2024-08-31","2024-11-25",
            "2025-04-02","2025-04-25","2025-05-30","2025-11-25",
            "2025-12-23","2026-01-08","2026-06-25"
          }

          active=[]
          for row in rows:
              rd=row["livebench_release_date"]
              rd=rd.strftime("%Y-%m-%d") if hasattr(rd,"strftime") else str(rd)
              rem=row["livebench_removal_date"] or ""
              if rd in valid_release_dates and (rem=="" or rem>selected_release):
                  active.append({**row,"_rd":rd})

          counts=Counter(r["task"] for r in active)
          expected={"paraphrase":50,"simplify":50,"story_generation":50,"summarize":50}
          assert len(active)==200, len(active)
          assert counts==expected, (counts,expected)
          ids=[r["question_id"] for r in active]
          assert len(ids)==len(set(ids))

          release_hist=Counter(r["_rd"] for r in active)
          boundary="2025-11-25"
          legacy=[r for r in active if r["_rd"] < boundary]
          modern=[r for r in active if r["_rd"] >= boundary]

          assert len(legacy)==200, len(legacy)
          assert len(modern)==0, len(modern)
          assert max(release_hist) < boundary

          result={
            "schema":"PROJECT_BRAIN_LIVEBENCH_ACTIVE_SCORER_FAMILY_PUBLIC_RUNNER_RESULT_V1",
            "status":"PASS",
            "candidate_git_blob_sha":"416a15134aa3b8b6a8d7b78aa312e57f6526dcb0",
            "frozen_parquet_sha256":"a9bb97bbaf8788142c310bcb33d50e2f6f5df8cbd8b8c3db677816b06f0f4f25",
            "active_population_count":len(active),
            "active_task_counts":dict(sorted(counts.items())),
            "active_release_date_histogram":dict(sorted(release_hist.items())),
            "dispatch_boundary":boundary,
            "legacy_ifeval_active_rows":len(legacy),
            "modern_ifbench_active_rows":len(modern),
            "active_scorer_family":"LEGACY_IFEVAL_ONLY",
            "columns_read":allowed_columns,
            "prompt_or_turn_text_read":False,
            "terminal_responses_generated":0,
            "acceptance_credit_delta":0,
            "incremental_spend_usd":0
          }
          open("/tmp/livebench_active_scorer_family_v1_result.json","w").write(json.dumps(result,sort_keys=True,indent=2)+"\n")
          print("LIVEBENCH_ACTIVE_SCORER_FAMILY="+json.dumps(result,sort_keys=True))
          PY

      - name: Upload verification receipt
        uses: actions/upload-artifact@v4
        with:
          name: livebench-active-scorer-family-v1
          path: /tmp/livebench_active_scorer_family_v1_result.json
          if-no-files-found: error
          retention-days: 30
