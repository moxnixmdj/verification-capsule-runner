name: Cognitive Basis Jevos Probe

on:
  push:
    paths:
      - ".github/workflows/cognitive-basis-jevos-probe.yml"
      - "cognitive_basis_probe/**"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout execution capsule
        uses: actions/checkout@v4

      - name: Record capsule provenance
        run: |
          set -euo pipefail
          cat cognitive_basis_probe/MANIFEST.json
          git rev-parse HEAD

      - name: Download pinned jevos-v2 runtime and model
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o jev-linux-x64.tar.gz \
            https://github.com/feder-cr/jev/releases/download/jevos-v2/jev-linux-x64.tar.gz
          curl -fL --retry 3 -o jevos-v2-openvino-int8.zip \
            https://github.com/feder-cr/jev/releases/download/jevos-v2/jevos-v2-openvino-int8.zip
          echo "e1b1f2c629ef53c8abafe9bff158cb92e08a6478ec3382c66c6de9d2efac7004  jev-linux-x64.tar.gz" | sha256sum -c -
          echo "adb0057720a00b5c49aaeee68e4552a7a2cd52dc5fd33919e9787b0a97ed1570  jevos-v2-openvino-int8.zip" | sha256sum -c -

      - name: Start local jevos-v2
        run: |
          set -euo pipefail
          mkdir jev-dist
          tar -xzf jev-linux-x64.tar.gz -C jev-dist --strip-components=1
          unzip -q jevos-v2-openvino-int8.zip -d jev-dist
          cd jev-dist
          chmod +x ./jev
          ./jev serve --host 127.0.0.1 --port 8017 > ../jev.log 2>&1 &
          echo $! > ../jev.pid
          cd ..
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8017/health > health.json; then
              cat health.json
              exit 0
            fi
            sleep 1
          done
          cat jev.log || true
          exit 1

      - name: Run Brain pointwise probe
        run: |
          set -euo pipefail
          python3 cognitive_basis_probe/pointwise_jev_probe.py \
            --cases cognitive_basis_probe/cases.jsonl \
            --endpoint http://127.0.0.1:8017/v1/systemone \
            --model jev-latest \
            --output cognitive_basis_jevos_result.json \
            --confidence-gate 0.80
          cat cognitive_basis_jevos_result.json

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cognitive-basis-jevos-probe
          path: |
            cognitive_basis_jevos_result.json
            jev.log
            health.json
            cognitive_basis_probe/MANIFEST.json
          if-no-files-found: warn
