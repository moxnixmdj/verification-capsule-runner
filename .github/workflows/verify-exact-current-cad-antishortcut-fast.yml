name: Verify exact-current CAD anti-shortcut fast

on:
  push:
    branches:
      - verify/cad-svg-antishortcut-fast-v1-20261002

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Bind exact current Brain blobs
        run: |
          test "$(git hash-object canonical/runtime/cad_t0_route_specific_candidate_v1.py)" = "aa32750b220a023617938b7be9476f6b3aac6704"
          test "$(git hash-object canonical/tests/test_cad_t0_source_structure_antishortcut_repair_v1.py)" = "8222cf83a7476cd453e06865b8e3aaff8a70b5db"
      - name: Run exact repaired anti-shortcut regression
        run: PYTHONPATH=. python canonical/tests/test_cad_t0_source_structure_antishortcut_repair_v1.py
