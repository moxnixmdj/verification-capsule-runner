name: Verify TB-Science public carrier v1

on:
  pull_request:
    paths:
      - "verify_tb_science_public_carrier_v1.py"
      - "test_verify_tb_science_public_carrier_v1.py"
      - ".github/workflows/verify-tb-science-public-carrier-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest -v test_verify_tb_science_public_carrier_v1.py
      - name: Live zero-reality carrier proof
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python verify_tb_science_public_carrier_v1.py
