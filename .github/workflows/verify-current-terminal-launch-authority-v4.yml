name: Verify current terminal launch authority V4
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/current_terminal_launch_authority_v4/**"
      - ".github/workflows/verify-current-terminal-launch-authority-v4.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify exact frozen Brain snapshot
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path("capsules/current_terminal_launch_authority_v4")
          m=json.loads((root/"snapshot_manifest.json").read_text())
          assert len(m["brain_snapshot_blobs"]) == 29, len(m["brain_snapshot_blobs"])
          for rel,expected in sorted(m["brain_snapshot_blobs"].items()):
              data=(root/rel).read_bytes()
              actual=hashlib.sha1(b"blob "+str(len(data)).encode()+bytes([0])+data).hexdigest()
              assert actual == expected,(rel,expected,actual)
          print("AUTHORITY_V4_EXACT_SNAPSHOT=PASS")
          PY
      - name: Recompute exact current authority
        working-directory: capsules/current_terminal_launch_authority_v4
        run: |
          set -euo pipefail
          touch canonical/__init__.py canonical/runtime/__init__.py canonical/tests/__init__.py
          PYTHONPATH=. python -m unittest -v \
            canonical.tests.test_terminal_prequalification_reducer \
            canonical.tests.test_terminal_wave_launch_authority_reducer_v1
          PYTHONPATH=. python canonical/runtime/terminal_prequalification_reducer.py . > /tmp/prequal-v4.json
          PYTHONPATH=. python canonical/runtime/terminal_wave_launch_authority_reducer_v1.py . > /tmp/authority-v4.json
          cat /tmp/authority-v4.json
          python - <<'PY'
          import json
          m=json.load(open("snapshot_manifest.json"))
          p=json.load(open("/tmp/prequal-v4.json"))
          a=json.load(open("/tmp/authority-v4.json"))
          e=m["expected_verdict"]
          assert p["pass"] is e["prequalification_pass"],p
          assert a["launch_authority"] is e["launch_authority"],a
          assert a["execution_authority"] is e["execution_authority"],a
          assert a["route_count"] == e["route_count"],a
          assert a["failed_predicates"] == e["failed_predicates"],a
          assert a["terminal_results_observed"] == 0,a
          assert a["fresh_terminal_evidence_consumed"] == 0,a
          print("CURRENT_TERMINAL_LAUNCH_AUTHORITY_V4=PASS")
          PY
