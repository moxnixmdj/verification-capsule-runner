name: Verify Brain differential dominance activation v1
on:
  pull_request:
    branches: [main]
    paths:
      - 'capsules/differential_dominance_activation_v1/**'
      - '.github/workflows/verify-brain-differential-dominance-activation-v1.yml'
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verify exact Brain blobs
        env:
          EXPECTED_JSON: >-
            {"canonical/governance/EXECUTION_FIRST_SELF_PROVING_OPTIMIZER_V1.json":"c14ed857f59eec3811aa9102ee8540bf447b27cf","canonical/governance/OPUS55_ACCEPTANCE_ACTION_HYPERGRAPH_V1.json":"c1abdd4c0534f4b1beafdde8d1d8e1478709ea46","canonical/verification/DIFFERENTIAL_DOMINANCE_COMPILER_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json":"540085d7e982d540b54f71eba1762a97638ef0bf","canonical/governance/DIFFERENTIAL_DOMINANCE_COMPILER_ACTIVATION_V1.json":"1bcddb66a650ebd7851104b030d57078b422c3c4","canonical/tests/test_differential_dominance_activation_v1.py":"c8848ec177f3d1a1af7b5e306571285434b9fc63",".github/workflows/verify-differential-dominance-activation-v1.yml":"d4c6b58e09a8ab14eab0d07ed0779ecc8b14c538"}
        run: |
          python - <<'PY'
          import json,os,subprocess
          root="capsules/differential_dominance_activation_v1"
          expected=json.loads(os.environ["EXPECTED_JSON"])
          for rel,want in sorted(expected.items()):
              got=subprocess.check_output(["git","hash-object",f"{root}/{rel}"],text=True).strip()
              assert got==want,(rel,got,want)
          print("EXACT_6_BRAIN_BLOBS_PASS")
          PY
      - name: Run activation tests
        working-directory: capsules/differential_dominance_activation_v1
        run: python -m unittest canonical.tests.test_differential_dominance_activation_v1 -v
      - name: Assert zero-credit activation
        run: |
          python - <<'PY'
          import json
          root="capsules/differential_dominance_activation_v1"
          a=json.load(open(f"{root}/canonical/governance/DIFFERENTIAL_DOMINANCE_COMPILER_ACTIVATION_V1.json",encoding="utf-8"))
          assert a["new_reality_units_consumed"]==0
          assert a["capability_credit_delta"]==0
          assert a["family_credit_delta"]==0
          assert a["execution_authority"] is False
          assert a["promotion_authority"] is False
          print("ZERO_CREDIT_ACTIVATION_PASS")
          PY
