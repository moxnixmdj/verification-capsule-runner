name: Verify residual retrieval authority reconciliation V2

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify truth-preserving live-authority reconciliation
        run: python capsules/residual_retrieval_authority_reconcile_v2/verify.py
