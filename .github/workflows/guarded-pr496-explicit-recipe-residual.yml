name: Guarded PR496 Explicit Recipe Residual Qualification
on:
  pull_request:
    branches: [main]
    paths:
      - canonical/runtime/bound_capabilities/broad_objective_decompose.py
      - canonical/tests/test_broad_objective_semantic_decomposition.py
      - verify_pr496_explicit_recipe_residual.py
      - pr496_explicit_recipe_qualification_authorization.json
      - build_guarded_pr496_explicit_recipe_plan.py
      - .github/workflows/guarded-pr496-explicit-recipe-residual.yml
permissions:
  contents: write
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Build frozen qualification plan
        run: python build_guarded_pr496_explicit_recipe_plan.py
      - name: Admit once then qualify exact PR496 bytes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python execution_guard/github_actions_guarded_run_live.py --plan guarded_pr496_explicit_recipe_residual_plan.json --receipt guarded-pr496-explicit-recipe-admission.json
      - name: Upload guarded qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: guarded-pr496-explicit-recipe-residual
          path: |
            guarded-pr496-explicit-recipe-admission.json
            guarded_pr496_explicit_recipe_residual_plan.json
            pr496_explicit_recipe_qualification_authorization.json
          if-no-files-found: warn
