name: Qualify Source Candidate Provenance Verification

on:
  pull_request:
    branches: [main]
    paths:
      - ARM_SOURCE_CANDIDATE_PROVENANCE_VERIFY_20260930_V1

permissions:
  contents: read
  issues: write

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Run qualification suite
        run: python -m unittest -v canonical.tests.test_source_candidate_provenance_verify
      - name: Independent fresh provenance oracle
        run: |
          python - <<'PY'
          import importlib.util,pathlib
          p=pathlib.Path("canonical/runtime/bound_capabilities/source_candidate_provenance_verify.py")
          s=importlib.util.spec_from_file_location("pv",p); m=importlib.util.module_from_spec(s); s.loader.exec_module(m)
          cases=[
            {"url":"https://doi.org/10.1038/s41586-020-2649-2","doi":"10.1038/s41586-020-2649-2"},
            {"url":"https://www.rfc-editor.org/rfc/rfc9110.html"},
          ]
          for c in cases:
            x=m.verify(c,timeout=20)
            assert x["status"] in {"BIBLIOGRAPHIC_PROVENANCE_VERIFIED","RETRIEVAL_PROVENANCE_VERIFIED"},x
            assert x["model_dependency_count"]==0
            assert x["incremental_spend_usd"]==0
            assert "UNVERIFIED" in x["authority_status"]
            assert x["primary_source_status"]=="UNVERIFIED"
          PY
      - name: Emit durable PASS receipt
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh api "repos/$REPO/issues"             -f title="QUALIFICATION_PASS_SOURCE_CANDIDATE_PROVENANCE_VERIFY_20260930_V1"             -f body="PASS. Head SHA: $SHA. Workflow run: $RUN_ID. DOI bibliographic identity + live retrieval identity qualified. Authority/primary-source/relevance claims remain explicitly UNVERIFIED. model_dependency_count=0; incremental_spend_usd=0."
