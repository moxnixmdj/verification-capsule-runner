name: Verify Opus55 calibration 4 of 19
on:
  pull_request:
    branches: [main]
    paths:
      - 'capsules/opus55_calibration_4of19_v1/**'
      - '.github/workflows/verify-opus55-calibration-4of19-v1.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact blobs and recompute calibration
        env:
          EXPECTED_JSON: '{"canonical/capabilities/opus55/OPUS_5_5_USEFUL_CAPABILITY_ENVELOPE_V1.json":"661a57f839101fbf54c7e4edc76166c65ce9327d","canonical/governance/OPUS55_TERMINAL_PROOF_PROTOCOLS_V1.json":"eb4bca0fe6a015d49d2854998fbe046c979c7ea9","canonical/verification/TERMINAL_V3_POSTWAVE_CONTRACT_AND_FAMILY_REDUCTION_20261002_V1.json":"51e3e7578e9adbeee2168d2223b84481fea16a09","canonical/governance/OPUS55_ACCEPTANCE_PROOF_TRANSMUTATION_INPUT_V1.json":"e684a4040ef55b9410a0a86e55192f2f04896b9e","canonical/runtime/acceptance_proof_transmuter_v1.py":"0580f9819b5465c9617f0a1e8ff9a96902eedfc6","canonical/runtime/opus55_acceptance_calibration_reducer_v2.py":"73b0b27644e0fa0d89ff8fbdb51005c20eae3632","canonical/tests/test_opus55_acceptance_calibration_reducer_v2.py":"af9ce50d19d8b8cc2652fc28de6f8feb10307752","canonical/governance/OPUS55_ACCEPTANCE_CALIBRATION_V2.json":"60b1431bfe4e26bbb3f5ec23fa47a63be6d46c61","canonical/governance/DELEGATION_ACCEPTANCE_CEILING_WITNESS_V1.json":"344a501c22b898a2a1aaba8847892b442a5a2aa3","canonical/verification/DELEGATION_CEILING_ACCEPTANCE_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json":"6c960b842bdb5d0eba435545d41acd209c1a995e"}'
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path('capsules/opus55_calibration_4of19_v1')
          expected=json.loads(os.environ['EXPECTED_JSON'])
          for rel,want in sorted(expected.items()):
              data=(root/rel).read_bytes()
              got=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              assert got==want,(rel,got,want)
          print('OPUS55_CALIBRATION_4OF19_EXACT_10_OF_10_BLOBS_PASS')
          PY
          cd capsules/opus55_calibration_4of19_v1
          PYTHONPATH=. python -m unittest -v canonical.tests.test_opus55_acceptance_calibration_reducer_v2
          PYTHONPATH=. python - <<'PY'
          import json
          from pathlib import Path
          from canonical.runtime.opus55_acceptance_calibration_reducer_v2 import evaluate
          root=Path('.')
          def load(p): return json.loads((root/p).read_text())
          out=evaluate(
            load('canonical/capabilities/opus55/OPUS_5_5_USEFUL_CAPABILITY_ENVELOPE_V1.json'),
            load('canonical/governance/OPUS55_TERMINAL_PROOF_PROTOCOLS_V1.json'),
            load('canonical/verification/TERMINAL_V3_POSTWAVE_CONTRACT_AND_FAMILY_REDUCTION_20261002_V1.json'),
            load('canonical/governance/OPUS55_ACCEPTANCE_PROOF_TRANSMUTATION_INPUT_V1.json'),
          )
          assert out['errors']==[],out
          assert out['behavioral_pass_family_count']==19
          assert out['acceptance_calibrated_family_count']==4
          assert out['acceptance_pending_family_count']==15
          assert out['terminal_goal_acceptance_closed'] is False
          assert set(out['acceptance_calibrated_families'])=={
            'EXACT_SYMBOLIC_COMPUTATION',
            'LONG_HORIZON_MEMORY_AND_CONTINUITY',
            'TOOL_DISCOVERY_SELECTION_AND_LEARNING',
            'SUBAGENT_DELEGATION_AND_COORDINATION',
          }
          print('OPUS55_ACCEPTANCE_CALIBRATION_4_OF_19_PASS')
          PY
