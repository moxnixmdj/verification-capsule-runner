name: Verify Brain PR1217 TB-Science repair
on:
  push:
    branches: ["verify-brain-pr-1217-tb-science-repair-v1"]
    paths:
      - "capsules/brain_pr_1217_tb_science_repair/**"
      - ".github/workflows/verify-brain-pr-1217-tb-science-repair-v1.yml"
  pull_request:
    branches: [main]
    paths:
      - "capsules/brain_pr_1217_tb_science_repair/**"
      - ".github/workflows/verify-brain-pr-1217-tb-science-repair-v1.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact Harbor runtime
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir -q 'harbor==0.23.0'
          python - <<'PY'
          import importlib.metadata
          assert importlib.metadata.version("harbor")=="0.23.0"
          PY
      - name: Verify exact Brain PR1217 bytes
        run: |
          set -euo pipefail
          C=capsules/brain_pr_1217_tb_science_repair
          test "$(git hash-object "$C/canonical/runtime/harbor_science_planner_v1.py")" = "17472fd2b01b164fbb180aecfc04385b55b11499"
          test "$(git hash-object "$C/canonical/runtime/harbor_science_agent_v1.py")" = "8967f84a8f8537dad17b677329ed17e7b4ff0fad"
          test "$(git hash-object "$C/canonical/runtime/harbor_command_policy.py")" = "a525773417291c7a4841bf35e1baff5370350d0d"
          test "$(git hash-object "$C/canonical/runtime/harbor_environment_transport.py")" = "ec46f648214a37bb16025d5ef2593efdf59f0d79"
          test "$(git hash-object "$C/canonical/runtime/acceptance_capability_source_gate_v2.py")" = "b168b131f6383e158bdc0d931439d14e61f2a5de"
          test "$(git hash-object "$C/canonical/tests/test_harbor_science_agent_v1.py")" = "b6c5ea794398ace7a08b43f434a56da51e5323fd"
          test "$(git hash-object "$C/canonical/tests/test_harbor_science_planner_v1.py")" = "6f32250bce81ee66fdddbd29b72061089674c5b3"
          test "$(git hash-object "$C/canonical/tests/test_tb_science_general_substrate_materiality_v1.py")" = "bda78c83d5783c385b4c88fecd33c81305274c5e"
          test "$(git hash-object "$C/canonical/governance/TB_SCIENCE_GENERAL_SUBSTRATE_MATERIALITY_V1.json")" = "526244f3ef2d9cda2468a7b8cdbd6564af1c2d65"
          test "$(git hash-object "$C/canonical/governance/TERMINAL_BENCH_SCIENCE_BRAIN_ROUTE_CANDIDATE_V1.json")" = "5dfbf335a2c5d875f830b4efc782b682457dc7ad"
          test "$(git hash-object "$C/canonical/governance/TERMINAL_BENCH_SCIENCE_ROUTE_ACTIVATION_V1.json")" = "73fc1caf602ed50de3df5f7ecdd6e8f1d5fc9793"
          test "$(git hash-object "$C/verify_live_proposal_boundary.py")" = "15a6a6310947f418508ec5d987197c8afd1b1d56"
      - name: Compile exact mirrored Python before tests
        run: |
          set -euo pipefail
          C=capsules/brain_pr_1217_tb_science_repair
          python -m py_compile \
            "$C/canonical/runtime/harbor_science_planner_v1.py" \
            "$C/canonical/runtime/harbor_science_agent_v1.py" \
            "$C/canonical/runtime/harbor_command_policy.py" \
            "$C/canonical/runtime/harbor_environment_transport.py" \
            "$C/canonical/runtime/acceptance_capability_source_gate_v2.py" \
            "$C/canonical/tests/test_harbor_science_planner_v1.py" \
            "$C/canonical/tests/test_harbor_science_agent_v1.py" \
            "$C/canonical/tests/test_tb_science_general_substrate_materiality_v1.py"
      - name: Run repaired controller planner and materiality tests
        run: |
          set -euo pipefail
          C=capsules/brain_pr_1217_tb_science_repair
          cd "$C"
          export PYTHONPATH=.
          python -m unittest \
            canonical.tests.test_harbor_science_planner_v1 \
            canonical.tests.test_harbor_science_agent_v1 \
            canonical.tests.test_tb_science_general_substrate_materiality_v1 -v
      - name: Exercise repaired live proposal parser boundary
        run: |
          set -euo pipefail
          C=capsules/brain_pr_1217_tb_science_repair
          cd "$C"
          export PYTHONPATH=.
          python verify_live_proposal_boundary.py
      - name: Enforce fail-closed preterminal status
        run: |
          set -euo pipefail
          C=capsules/brain_pr_1217_tb_science_repair
          python - <<'PY'
          import json, pathlib
          c=pathlib.Path("capsules/brain_pr_1217_tb_science_repair")
          a=json.load(open(c/"canonical/governance/TERMINAL_BENCH_SCIENCE_ROUTE_ACTIVATION_V1.json"))
          assert a["execution_authority"] is False
          assert a["promotion_authority"] is False
          assert a["source_gate_reduction"]["general_substrate_test_pass"] is False
          assert "REVERIFICATION_REQUIRED" in a["status"]
          r=json.load(open(c/"TB_SCIENCE_REPAIRED_LIVE_PROPOSAL_BOUNDARY_V1.json"))
          assert r["status"]=="PASS"
          assert r["terminal_task_content_read"]==0
          assert r["terminal_trials_executed"]==0
          assert r["terminal_results_observed"]==0
          assert r["incremental_spend_usd"]==0
          print("Brain PR1217 repaired TB-Science path: INDEPENDENT PASS")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brain-pr1217-tb-science-repair-v1
          path: capsules/brain_pr_1217_tb_science_repair/TB_SCIENCE_REPAIRED_LIVE_PROPOSAL_BOUNDARY_V1.json
