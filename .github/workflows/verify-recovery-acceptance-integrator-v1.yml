name: Verify Recovery acceptance integrator V1
on:
  push:
    branches: [verify/recovery-acceptance-integrator-v1-20261003-sol]
    paths:
      - "capsules/recovery_acceptance_integrator_v1/**"
      - ".github/workflows/verify-recovery-acceptance-integrator-v1.yml"
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact mirrored blobs
        run: |
          set -euo pipefail
          cd capsules/recovery_acceptance_integrator_v1
          python - <<'PY'
          import json, subprocess
          m=json.load(open("manifest.json"))
          for p,sha in m["source_files"].items():
              got=subprocess.check_output(["git","hash-object",p],text=True).strip()
              assert got==sha,(p,sha,got)
          print("EXACT_BLOBS_PASS",len(m["source_files"]))
          PY
      - name: Run isolated integrator tests
        run: |
          set -euo pipefail
          cd capsules/recovery_acceptance_integrator_v1
          export PYTHONPATH=.
          python -m unittest -v canonical.tests.test_recovery_acceptance_integrator_v1
      - name: Enforce exact acceptance delta
        run: |
          set -euo pipefail
          cd capsules/recovery_acceptance_integrator_v1
          export PYTHONPATH=.
          python - <<'PY'
          from canonical.runtime import recovery_acceptance_integrator_v1 as r
          o=r.evaluate()
          assert o["pass"] is True,o
          assert o["before"]=={"proved_atomic":8,"unresolved_atomic":30,"accepted_families":3,"open_families":16},o
          assert o["after"]=={"proved_atomic":11,"unresolved_atomic":27,"accepted_families":4,"open_families":15},o
          assert set(o["newly_proved_predicates"])==r.RECOVERY,o
          assert o["newly_closed_families"]==[r.FAMILY],o
          assert len(o["proposed_claims"])==3,o
          assert o["new_reality_units_consumed"]==0,o
          assert o["terminal_results_replayed"]==0,o
          assert o["promotion_authority"] is False,o
          print("RECOVERY_ACCEPTANCE_DELTA_PASS")
          PY
      - name: Falsify historical-bound reuse
        run: |
          set -euo pipefail
          cd capsules/recovery_acceptance_integrator_v1
          export PYTHONPATH=.
          python - <<'PY'
          import json
          from pathlib import Path
          from canonical.runtime import recovery_acceptance_integrator_v1 as r
          p=Path(r.RECEIPT)
          original=p.read_text()
          try:
              x=json.loads(original)
              x["verified"]["historical_relation_observed_bound_used_as_proof"]=True
              p.write_text(json.dumps(x))
              o=r.evaluate()
              assert o["pass"] is False,o
              print("HISTORICAL_BOUND_REUSE_REJECTED")
          finally:
              p.write_text(original)
          PY
