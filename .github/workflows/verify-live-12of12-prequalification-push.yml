name: Verify live 12-of-12 terminal prequalification
on:
  push:
    branches: [verify-prequalification-push-20261002]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact live Brain snapshot and reducer authorization
        run: |
          python - <<'PY'
          from __future__ import annotations
          import base64, hashlib, importlib.util, json, tempfile
          from pathlib import Path
          payloads = {}
          expected = {}
          payloads["canonical/runtime/terminal_prequalification_reducer.py"] = ""
          expected["canonical/runtime/terminal_prequalification_reducer.py"] = "da929015fafabed2b5a134a2e95b6bff2f47349c"
          payloads["canonical/governance/EXACT_FOUR_PORTFOLIO_PREQUALIFICATION_V1.json"] = ""
          expected["canonical/governance/EXACT_FOUR_PORTFOLIO_PREQUALIFICATION_V1.json"] = "d85f90df76db4b6b1650fe40279f33d6a7d9e7b5"
          payloads["canonical/governance/BEHAVIORAL_CONTRACT_REGISTRY_V1.json"] = ""
          expected["canonical/governance/BEHAVIORAL_CONTRACT_REGISTRY_V1.json"] = "afa00109031d638fef32cc3fe10be18786605c39"
          payloads["canonical/governance/ACTIVE_TERMINAL_PROOF_BASIS_V1.json"] = ""
          expected["canonical/governance/ACTIVE_TERMINAL_PROOF_BASIS_V1.json"] = "2ba39428f0065f0d8739c43935f7026ba6eedcfb"
          payloads["canonical/governance/GLOBAL_TERMINAL_REPLACEMENT_POPULATION_PROTOCOL_V2.json"] = ""
          expected["canonical/governance/GLOBAL_TERMINAL_REPLACEMENT_POPULATION_PROTOCOL_V2.json"] = "432f1f9122a0a136f71a89eae5c8fb81692e4071"
          def blob_sha(data: bytes) -> str:
              return hashlib.sha1(b'blob ' + str(len(data)).encode('ascii') + b'\\0' + data).hexdigest()
          root = Path(tempfile.mkdtemp(prefix='brain-prequal-12of12-'))
          for rel, encoded in payloads.items():
              data = base64.b64decode(encoded)
              actual = blob_sha(data)
              assert actual == expected[rel], (rel, expected[rel], actual)
              p = root / rel
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_bytes(data)
          mod_path = root / 'canonical/runtime/terminal_prequalification_reducer.py'
          spec = importlib.util.spec_from_file_location('terminal_prequalification_reducer_live', mod_path)
          assert spec and spec.loader
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          out = mod.evaluate(root)
          assert out.get('pass') is True, out
          assert out.get('execution_authority') is True, out
          assert out.get('failed_predicates') == [], out
          assert out.get('authorization') == 'T0_T1_T2_T3_PARALLEL_TERMINAL_WAVE', out
          assert out.get('active_contract_count') == 12, out
          assert out.get('admissible_frozen_terminal_route_count') == 12, out
          print(json.dumps(out, sort_keys=True))
          PY
