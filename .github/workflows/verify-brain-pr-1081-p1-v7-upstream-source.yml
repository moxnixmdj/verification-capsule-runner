name: Verify Brain PR 1081 P1 V7 upstream source audit
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/brain_pr_1081_p1_v7_upstream_source/**"
      - ".github/workflows/verify-brain-pr-1081-p1-v7-upstream-source.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact Brain blob identities
        run: |
          cd capsules/brain_pr_1081_p1_v7_upstream_source
          python - <<'PY'
          import hashlib,json,pathlib
          m=json.load(open("EXPECTED_BRAIN_BLOBS.json",encoding="utf-8"))
          for src,expected in m["exact_brain_blobs"].items():
              data=pathlib.Path(src).read_bytes()
              got=hashlib.sha1(f"blob {len(data)}\0".encode()+data).hexdigest()
              assert got==expected,(src,got,expected)
          print("exact Brain PR 1081 blobs: PASS")
          PY
      - name: Run adversarial audit tests
        run: |
          cd capsules/brain_pr_1081_p1_v7_upstream_source
          export PYTHONPATH=.
          python -m unittest canonical.tests.test_p1_v7_upstream_failure_semantics_source_audit_v1 -v
      - name: Execute zero-reality source audit
        run: |
          cd capsules/brain_pr_1081_p1_v7_upstream_source
          export PYTHONPATH=.
          python -m canonical.runtime.p1_v7_upstream_failure_semantics_source_audit_v1 > verdict.json
      - name: Enforce classified current verdict and zero credit
        run: |
          cd capsules/brain_pr_1081_p1_v7_upstream_source
          python - <<'PY'
          import json
          p=json.load(open("verdict.json"))
          assert p["classification"]=="INFORMATION_OR_SPECIFICATION_RESIDUAL",p
          assert p["status"]=="FAIL_CLOSED__NO_EXPLICIT_BOUND_UPSTREAM_FAILURE_SEMANTICS_SOURCE_IN_FROZEN_P1_EVIDENCE_SET__ZERO_CREDIT",p
          assert p["surface_count"]==3,p
          assert p["aggregate_p1_receipt_count"]==2,p
          assert p["complete_explicit_source_documents"]==[],p
          assert p["event_level_transport_declared_in_aggregate_receipts"] is False,p
          assert p["terminal_results_replayed"]==0,p
          assert p["new_reality_units_consumed"]==0,p
          assert p["capability_credit_delta"]==0 and p["family_credit_delta"]==0,p
          assert p["execution_authority"] is False and p["promotion_authority"] is False,p
          print("P1 V7 upstream source audit: PASS")
          PY
