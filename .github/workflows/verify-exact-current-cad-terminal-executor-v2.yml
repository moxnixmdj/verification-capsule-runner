name: Verify exact-current CAD terminal executor v2
on:
  pull_request:
    branches: [main]
    paths:
      - 'capsules/current_cad_executor_v2/**'
      - '.github/workflows/verify-exact-current-cad-terminal-executor-v2.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Bind exact current Brain executor snapshot
        run: |
          set -euo pipefail
          test "$(git hash-object capsules/current_cad_executor_v2/cad_t0_route_specific_terminal_executor_v1.py)" = "4a90d2e6838a6b5fd4a8411de3a3dd654e84ec1c"
          test "$(git hash-object capsules/current_cad_executor_v2/test_cad_t0_route_specific_terminal_executor_v1.py)" = "49e911745bca7c3b36a7af5e726910d942d538ab"
          test "$(git hash-object capsules/current_cad_executor_v2/CAD_T0_POST_REFREEZE_BINDING_V4.json)" = "a636d1292e6f92d240fab420a9ee75ced7a05104"
          test "$(git hash-object capsules/current_cad_executor_v2/TERMINAL_WAVE_EXECUTION_AUTHORITY_V1.json)" = "a939de247bc253fb86dfe113f18eeb0a638db910"
          test "$(git hash-object capsules/current_cad_executor_v2/TERMINAL_ROUTE_SPECIFIC_EXECUTOR_MANIFEST_V1.json)" = "7c6b3f8de9148bbb1bf8a6fc14dff6c1c96bb399"
          test "$(git hash-object canonical/runtime/cad_t0_route_specific_candidate_v1.py)" = "aa32750b220a023617938b7be9476f6b3aac6704"
          test "$(git hash-object canonical/runtime/cad_t0_geometry_population.py)" = "64ca276410e2c1dbcd55cfad057e3eec0709790a"
          test "$(git hash-object canonical/runtime/cad_t0_oracle_adapter.py)" = "a6e76e1865b9bd9829dbbcf38886486636f76e8a"
          test "$(git hash-object canonical/runtime/cad_t0_multiplex_scorer.py)" = "89833581dc4ac67498753feb94e2ff69bad3b7f1"
          test "$(git hash-object canonical/runtime/m1b_continuous_geometry_compiler.py)" = "0c7c6355cde87c961319d6f9948839cb56add092"
          test "$(git hash-object canonical/runtime/m1b_smooth_surface_compiler.py)" = "bd3824847f400e8088dc25a83674579f99345a30"
          test "$(git hash-object canonical/runtime/cad_partspec_generator.py)" = "89b4250fa85df8d02d51bcb513f035d102625056"
      - name: Install exact-current executor snapshot into ephemeral checkout
        run: |
          cp capsules/current_cad_executor_v2/cad_t0_route_specific_terminal_executor_v1.py canonical/runtime/cad_t0_route_specific_terminal_executor_v1.py
          cp capsules/current_cad_executor_v2/test_cad_t0_route_specific_terminal_executor_v1.py canonical/tests/test_cad_t0_route_specific_terminal_executor_v1.py
          cp capsules/current_cad_executor_v2/CAD_T0_POST_REFREEZE_BINDING_V4.json canonical/governance/CAD_T0_POST_REFREEZE_BINDING_V4.json
          cp capsules/current_cad_executor_v2/TERMINAL_WAVE_EXECUTION_AUTHORITY_V1.json canonical/governance/TERMINAL_WAVE_EXECUTION_AUTHORITY_V1.json
          cp capsules/current_cad_executor_v2/TERMINAL_ROUTE_SPECIFIC_EXECUTOR_MANIFEST_V1.json canonical/governance/TERMINAL_ROUTE_SPECIFIC_EXECUTOR_MANIFEST_V1.json
          test "$(git hash-object canonical/runtime/cad_t0_route_specific_terminal_executor_v1.py)" = "4a90d2e6838a6b5fd4a8411de3a3dd654e84ec1c"
          test "$(git hash-object canonical/tests/test_cad_t0_route_specific_terminal_executor_v1.py)" = "49e911745bca7c3b36a7af5e726910d942d538ab"
          test "$(git hash-object canonical/governance/CAD_T0_POST_REFREEZE_BINDING_V4.json)" = "a636d1292e6f92d240fab420a9ee75ced7a05104"
      - name: Install CAD verification dependencies
        run: python -m pip install --disable-pip-version-check --no-input "pydantic>=2,<3" "cadquery==2.6.1"
      - name: Run exact-current preterminal executor suite
        run: PYTHONPATH=.:canonical/runtime python -m unittest -v canonical.tests.test_cad_t0_route_specific_terminal_executor_v1
