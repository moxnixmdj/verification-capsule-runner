name: Brain PR337 Open-Ended Climate Task A Once

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  execute-once:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      ASTRA_DISABLE_MODEL_PLANNER: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          # pull_request defaults to a synthetic merge ref; that raced carrier main and
          # produced observed stale runtime blob 4df4bf... in two UNSPENT prestarts.
          # Execute the exact PR head instead so the pinned closure is the checked-out closure.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Execute frozen Brain PR337 open-ended Task A exactly once
        id: parent_task
        continue-on-error: true
        run: python run_brain_pr337_openended_climate_task_a_once.py
      - name: Upload terminal producer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brain-pr337-openended-climate-task-a-terminal
          path: brain-pr337-open-ended-climate-task-a-terminal.json
          if-no-files-found: error
      - name: Preserve semantic failure
        if: steps.parent_task.outcome != 'success'
        run: exit 1
