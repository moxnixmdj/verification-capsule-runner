name: Verify Brain Root1 V3 final activation
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/root1_v3_final_activation/**"
      - ".github/workflows/verify-brain-root1-v3-final-activation.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          cd capsules/root1_v3_final_activation
          python verify_final_activation.py
