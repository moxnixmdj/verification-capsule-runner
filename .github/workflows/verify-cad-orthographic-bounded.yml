name: Verify bounded orthographic CAD information-safe route
on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/runtime/cad_orthographic_information_safe_proof.py'
      - 'canonical/runtime/cad_orthographic_information_safe_candidate.py'
      - 'canonical/runtime/orthographic_visual_hull.py'
      - '.github/workflows/verify-cad-orthographic-bounded.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install exact numeric verifier dependencies
        run: python -m pip install --disable-pip-version-check 'numpy==2.3.3' 'scipy==1.16.2'
      - name: Bind exact Brain blobs
        run: |
          set -euo pipefail
          test "$(git hash-object canonical/runtime/cad_orthographic_information_safe_proof.py)" = "b6c8edd4fff837d4a5c8237f53d7613fe0e00276"
          test "$(git hash-object canonical/runtime/cad_orthographic_information_safe_candidate.py)" = "4c73574cf1fcd75f154d6d267f11be486a265883"
          test "$(git hash-object canonical/runtime/orthographic_visual_hull.py)" = "d102226cfde581cf3d7de97ec2e55862edf1c31b"
      - name: Verify information boundary and anti-shortcuts
        run: |
          PYTHONPATH=. python - <<'PY'
          import inspect,json
          from canonical.runtime import cad_orthographic_information_safe_proof as proof
          from canonical.runtime import cad_orthographic_information_safe_candidate as candidate
          src=inspect.getsource(candidate)
          assert "cad_orthographic_information_safe_proof" not in src
          assert "_oracle" not in src
          seen=set()
          for ordinal in range(25):
              case=proof.generate_case(20261002,ordinal)
              public=proof.public_task(case)
              txt=json.dumps(public,sort_keys=True)
              assert "_oracle" not in public
              assert "source_voxels" not in txt
              assert '"metrics"' not in txt
              assert '"identifiable"' not in txt
              seen.add(case["case_class"])
              out=candidate.solve(public)
              verdict=proof.score_case(case,out)
              assert verdict["pass"],(case["case_class"],out,verdict)
              if case["case_class"]=="AMBIGUOUS_BLOCK":
                  assert out["status"]=="NONIDENTIFIABLE"
                  forced=dict(out)
                  forced["status"]="SOLID"
                  forced["voxels"]=out["alternative_voxels"]
                  assert not proof.score_case(case,forced)["pass"]
              else:
                  assert out["status"]=="SOLID"
          assert seen==set(proof.CLASSES),seen
          print({"classes":sorted(seen),"information_boundary":"PASS","forced_ambiguity":"REJECTED"})
          PY
      - name: Run fresh 1024-case bounded CAD grid
        env:
          PROJECT_BRAIN_PREFLIGHT_SEED: ${{ github.run_id }}
        run: |
          PYTHONPATH=. python - <<'PY'
          import os,collections
          from canonical.runtime import cad_orthographic_information_safe_proof as proof
          from canonical.runtime import cad_orthographic_information_safe_candidate as candidate
          seed=int(os.environ["PROJECT_BRAIN_PREFLIGHT_SEED"])
          out=proof.run_batch(seed,1024,candidate.solve)
          counts=collections.Counter()
          for i in range(1024):
              counts[proof.generate_case(seed,i)["case_class"]]+=1
          print({"seed":seed,"passed":out["passed"],"failed":out["failed"],"classes":dict(sorted(counts.items()))})
          assert out["all_pass"],out["failures"][:20]
          assert set(counts)==set(proof.CLASSES)
          PY
