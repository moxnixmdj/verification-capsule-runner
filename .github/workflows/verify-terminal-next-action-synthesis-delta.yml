name: Verify terminal next action synthesis delta

on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/terminal_next_action_synthesis_delta/**"
      - ".github/workflows/verify-terminal-next-action-synthesis-delta.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact blobs and live next-action frontier
        run: |
          cd capsules/terminal_next_action_synthesis_delta
          export PYTHONPATH=.
          python -m py_compile canonical/runtime/acceptance_ir_compiler_v1.py canonical/runtime/terminal_next_action_compiler_v1.py
          python -m unittest canonical.tests.test_terminal_next_action_compiler_v1 -v
          python -m unittest test_brain_blob_binding -v
          python canonical/runtime/terminal_next_action_compiler_v1.py
