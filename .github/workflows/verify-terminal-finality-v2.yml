name: Verify terminal finality V2
on:
  pull_request:
    branches: [main]
    paths:
      - 'verification/finality_v2/**'
      - '.github/workflows/verify-terminal-finality-v2.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run hardened closure reducer unit tests
        run: cd verification/finality_v2 && python -m unittest -v test_terminal_closure_reducer.py
      - name: Verify exact terminal finality V2 candidate
        run: python verification/finality_v2/verify_finality_v2.py
