name: Verify terminal adaptive minimum-action policy

on:
  pull_request:
    paths:
      - 'terminal_adaptive_minimum_action_policy_v1_candidate.py'
      - 'TERMINAL_ADAPTIVE_MINIMUM_ACTION_POLICY_V1.json'
      - 'verify_terminal_adaptive_minimum_action_policy_v1.py'
      - '.github/workflows/verify-terminal-adaptive-minimum-action-policy-v1.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact Brain candidate blob identities
        shell: bash
        run: |
          test "$(git hash-object terminal_adaptive_minimum_action_policy_v1_candidate.py)" = "bfffe6dff32f5445a0c52657f7d9ec8d544b1f79"
          test "$(git hash-object TERMINAL_ADAPTIVE_MINIMUM_ACTION_POLICY_V1.json)" = "95668b28dd6b544b275944bc6ecae7a876b58ac7"
      - name: Verify semantics
        run: python verify_terminal_adaptive_minimum_action_policy_v1.py
