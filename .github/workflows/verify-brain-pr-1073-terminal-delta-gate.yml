name: Verify Brain PR 1073 terminal delta admission gate
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/brain_pr_1073_terminal_delta_gate/**"
      - ".github/workflows/verify-brain-pr-1073-terminal-delta-gate.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact Brain blob identities
        run: |
          cd capsules/brain_pr_1073_terminal_delta_gate
          python - <<'PY'
          import hashlib,json,pathlib
          m=json.load(open("EXPECTED_BRAIN_BLOBS.json",encoding="utf-8"))
          for src,expected in m["exact_brain_blobs"].items():
              data=pathlib.Path(src).read_bytes()
              got=hashlib.sha1(f"blob {len(data)}\0".encode()+data).hexdigest()
              assert got==expected,(src,got,expected)
          print("exact Brain PR 1073 blobs: PASS")
          PY
      - name: Run terminal delta gate tests
        run: |
          cd capsules/brain_pr_1073_terminal_delta_gate
          export PYTHONPATH=.
          python -m py_compile canonical/runtime/terminal_delta_admission_gate_v1.py
          python -m unittest canonical.tests.test_terminal_delta_admission_gate_v1 -v
      - name: Verify governance invariants
        run: |
          cd capsules/brain_pr_1073_terminal_delta_gate
          python - <<'PY'
          import json
          g=json.load(open("canonical/governance/TERMINAL_DELTA_ADMISSION_GATE_V1.json",encoding="utf-8"))
          assert g["status"].startswith("CANDIDATE__FAIL_CLOSED_ARCHITECTURE_ADMISSION_GATE")
          assert set(g["admissible_delta_classes"])=={
            "UNRESOLVED_ATOMIC_PREDICATE_COUNT_STRICTLY_DECREASES",
            "ACCEPTED_FAMILY_COUNT_STRICTLY_INCREASES",
            "PROVEN_MINIMUM_REMAINING_WORK_LOWER_BOUND_STRICTLY_DECREASES",
            "FORMALLY_OWNED_DOMAIN_STRICTLY_EXPANDS",
            "NEW_TERMINAL_RELEVANT_IMPOSSIBILITY_IS_PROVED",
          }
          assert g["capability_credit_delta"]==0 and g["family_credit_delta"]==0
          assert g["execution_authority"] is False and g["promotion_authority"] is False
          print("governance invariants: PASS")
          PY
