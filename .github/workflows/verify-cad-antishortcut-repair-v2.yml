name: Verify repaired CAD anti-shortcut candidate v2
on:
  pull_request:
    branches: [main]
    paths:
      - canonical/runtime/cad_t0_route_specific_candidate_v1.py
      - canonical/tests/test_cad_t0_route_specific_candidate_v1.py
      - canonical/tests/test_cad_t0_source_structure_antishortcut_repair_v1.py
      - .github/workflows/verify-cad-antishortcut-repair-v2.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify repaired Brain candidate blob
        run: |
          set -euo pipefail
          test "$(git hash-object canonical/runtime/cad_t0_route_specific_candidate_v1.py)" = "aa32750b220a023617938b7be9476f6b3aac6704"
      - run: python -m pip install --disable-pip-version-check --no-input "pydantic>=2,<3" "cadquery==2.6.1"
      - name: Run full family and render-equivalence regressions
        run: |
          PYTHONPATH=.:canonical/runtime python -m unittest -v \
            canonical.tests.test_cad_t0_route_specific_candidate_v1 \
            canonical.tests.test_cad_t0_source_structure_antishortcut_repair_v1
