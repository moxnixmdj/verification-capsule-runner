name: Verify protocol implication scope algebra v2
on:
  pull_request:
    branches: [main]
    paths:
      - 'capsules/protocol_implication_scope_algebra_v2/**'
      - '.github/workflows/verify-protocol-implication-scope-algebra-v2.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact Brain blobs and adversarial scope firewall
        env:
          EXPECTED_JSON: '{"canonical/runtime/protocol_implication_scope_algebra_v2.py":"bb5bfbdccc64df159f824e1b6862dc0cf54e7d8d","canonical/tests/test_protocol_implication_scope_algebra_v2.py":"c334d50b0678ec51bee424f4d4757c71ac483b26","canonical/governance/PROTOCOL_IMPLICATION_SCOPE_ALGEBRA_V2_CANDIDATE.json":"d23770341bb9491a90daede4e4fddbf5a052962e"}'
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path('capsules/protocol_implication_scope_algebra_v2')
          expected=json.loads(os.environ['EXPECTED_JSON'])
          for rel,want in sorted(expected.items()):
              data=(root/rel).read_bytes()
              got=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              assert got==want,(rel,got,want)
          print('SCOPE_ALGEBRA_V2_EXACT_3_OF_3_BLOBS_PASS')
          PY
          cd capsules/protocol_implication_scope_algebra_v2
          PYTHONPATH=. python canonical/tests/test_protocol_implication_scope_algebra_v2.py
          python - <<'PY'
          import json
          from pathlib import Path
          g=json.loads(Path('canonical/governance/PROTOCOL_IMPLICATION_SCOPE_ALGEBRA_V2_CANDIDATE.json').read_text())
          assert g['status'].startswith('IMPLEMENTED_CANDIDATE')
          assert g['discovered_failure_mode']['risk']=='FALSE_ZERO_REALITY_ACCEPTANCE_CLOSURE'
          a=g['literal_evidence_join_audit']
          assert a['proved_witness_count']==9
          assert a['normalized_target_count']==11
          assert a['target_atom_and_metric_source_literal_count']==57
          assert a['exact_target_literal_matches_in_proved_witness_sources']==0
          assert g['capability_credit_delta']==0
          assert g['family_credit_delta']==0
          assert g['new_reality_units_consumed']==0
          print('SCOPE_ALGEBRA_V2_GOVERNANCE_AND_AUDIT_PASS')
          PY
