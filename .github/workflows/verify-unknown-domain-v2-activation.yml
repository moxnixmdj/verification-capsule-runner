name: Verify Unknown-Domain V2 predicate-local activation
on:
  pull_request:
    branches: [main]
    paths:
      - 'verify_unknown_domain_v2_activation.py'
      - 'canonical/**'
      - '.github/workflows/verify-unknown-domain-v2-activation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact-byte activation firewall verification
        run: python verify_unknown_domain_v2_activation.py
