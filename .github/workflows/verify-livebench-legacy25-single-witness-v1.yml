name: Verify LiveBench legacy25 single witnesses V1

on:
  push:
    branches:
      - main
      - verify/livebench-legacy25-single-witness-20261004
    paths:
      - verify_livebench_legacy25_single_witness_v1.py
      - .github/workflows/verify-livebench-legacy25-single-witness-v1.yml
  pull_request:
    paths:
      - verify_livebench_legacy25_single_witness_v1.py
      - .github/workflows/verify-livebench-legacy25-single-witness-v1.yml
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact legacy scorer dependencies
        run: |
          python -m pip install --disable-pip-version-check langdetect==1.0.9 nltk==3.9.1
          python - <<'PY'
          import nltk
          for name in ["punkt", "punkt_tab"]:
              nltk.download(name, quiet=True)
          PY
      - name: Checkout frozen LiveBench source
        run: |
          git clone --filter=blob:none https://github.com/LiveBench/LiveBench.git /tmp/livebench
          git -C /tmp/livebench checkout 8f8e5c381a16e3f24257776edd53471fe86f8091
      - name: Verify witnesses against frozen checkers
        run: python verify_livebench_legacy25_single_witness_v1.py
