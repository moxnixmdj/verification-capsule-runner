name: Verify structured-method scope Gate V2
on:
  pull_request:
    branches: [main]
    paths:
      - 'capsules/structured_method_scope_gate_v2.trigger'
      - 'canonical/runtime/scope_equivalent_proof_gate_v2.py'
      - 'canonical/governance/STRUCTURED_METHOD_SCOPE_EQUIVALENT_PROOF_GATE_V2_INPUT.json'
      - 'canonical/tests/test_structured_method_scope_gate_v2.py'
      - '.github/workflows/verify-structured-method-scope-gate-v2.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Bind exact Brain blobs
        run: |
          test "$(git hash-object canonical/runtime/scope_equivalent_proof_gate_v2.py)" = "2d05172becfc559de3ff1e4e5623c5180028be1b"
          test "$(git hash-object canonical/governance/STRUCTURED_METHOD_SCOPE_EQUIVALENT_PROOF_GATE_V2_INPUT.json)" = "fc2e739789825bba5f30da56c6896de11678b6e8"
          test "$(git hash-object canonical/tests/test_structured_method_scope_gate_v2.py)" = "f568b4ff4fd719ad43e1c348696ab76feba90f44"
      - name: Run Gate V2 suite
        run: python -m unittest -v canonical.tests.test_structured_method_scope_gate_v2
