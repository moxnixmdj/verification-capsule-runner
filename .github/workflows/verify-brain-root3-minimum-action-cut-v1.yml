name: Verify Brain Root3 minimum action cut V1
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/root3_minimum_action_cut_v1/**"
      - ".github/workflows/verify-brain-root3-minimum-action-cut-v1.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Independently verify Root3 cut
        run: |
          cd capsules/root3_minimum_action_cut_v1
          python independent_verify.py | tee verdict.json
      - uses: actions/upload-artifact@v4
        with:
          name: root3-minimum-action-cut-v1-verdict
          path: capsules/root3_minimum_action_cut_v1/verdict.json
          if-no-files-found: error
