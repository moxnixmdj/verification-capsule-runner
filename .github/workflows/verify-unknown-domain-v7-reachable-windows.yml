name: Verify Unknown-Domain V7 reachable domain Windows isolated

on:
  push:
    branches:
      - "verify/unknown-domain-v7-reachable-windows-20261005"
    paths:
      - ".github/workflows/verify-unknown-domain-v7-reachable-windows.yml"
      - "VERIFY_UNKNOWN_DOMAIN_V7_REACHABLE_WINDOWS"
      - "verification/unknown_domain_v7_reachable_domain_independent.py"
      - "canonical/runtime/unknown_domain_direct_hidden_generator_v5.py"
      - "canonical/tests/test_unknown_domain_direct_v5.py"
      - "canonical/runtime/unknown_domain_direct_v6_universal_proof_v1.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Python 3.12.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
      - name: Verify on Python 3.12.10
        shell: pwsh
        run: |
          $env:PYTHONPATH="."
          python --version
          python verification/unknown_domain_v7_reachable_domain_independent.py
          python -m pytest -q canonical/tests/test_unknown_domain_direct_v5.py
          Copy-Item unknown_domain_v7_reachable_domain_receipt.json unknown_domain_v7_reachable_domain_receipt_py312.json

      - name: Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Verify on Python 3.13
        shell: pwsh
        run: |
          $env:PYTHONPATH="."
          python --version
          python verification/unknown_domain_v7_reachable_domain_independent.py
          python -m pytest -q canonical/tests/test_unknown_domain_direct_v5.py
          Copy-Item unknown_domain_v7_reachable_domain_receipt.json unknown_domain_v7_reachable_domain_receipt_py313.json

      - name: Upload both receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unknown-domain-v7-reachable-windows-both-pythons
          path: |
            unknown_domain_v7_reachable_domain_receipt_py312.json
            unknown_domain_v7_reachable_domain_receipt_py313.json
          if-no-files-found: error
          retention-days: 7
