name: Verify TB-Science local Qwen planner repair
on:
  push:
    branches: ["verify/tb-science-local-qwen-planner-20261003-sol"]
    paths:
      - "capsules/tb_science_local_qwen_planner_repair_v1/**"
      - ".github/workflows/verify-tb-science-local-qwen-planner-repair.yml"
  pull_request:
    branches: [main]
    paths:
      - "capsules/tb_science_local_qwen_planner_repair_v1/**"
      - ".github/workflows/verify-tb-science-local-qwen-planner-repair.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact Brain repair bytes and no remote generation dependency
        run: |
          set -euo pipefail
          C=capsules/tb_science_local_qwen_planner_repair_v1
          test "$(git hash-object "$C/canonical/runtime/harbor_science_planner_v1.py")" = "879887984e2ca8abacac486d687f519f5d0d78a5"
          test "$(git hash-object "$C/canonical/runtime/harbor_science_agent_v1.py")" = "5557efd21f1a433ad16766def3775a79c459784b"
          test "$(git hash-object "$C/canonical/tests/test_harbor_science_planner_v1.py")" = "e1d68119258093d08801646c73c7220cd8f9018a"
          test "$(git hash-object "$C/canonical/tests/test_harbor_science_agent_v1.py")" = "292f8c4447122569e6168deb22847e2570db155e"
          test "$(git hash-object "$C/canonical/runtime/harbor_command_policy.py")" = "a525773417291c7a4841bf35e1baff5370350d0d"
          test "$(git hash-object "$C/canonical/runtime/harbor_environment_transport.py")" = "ec46f648214a37bb16025d5ef2593efdf59f0d79"
          test "$(git hash-object "$C/canonical/governance/TB_SCIENCE_LOCAL_QWEN_PLANNER_REPAIR_V1.json")" = "3d804b56b38f6d2d335e9cf4e471ad86026ce7f3"
          ! grep -R -E 'pollinations|https://text\.|https://gen\.|api_key|Authorization: Bearer' "$C/canonical/runtime/harbor_science_planner_v1.py"
          grep -F 'http://127.0.0.1:8080/v1/chat/completions' "$C/canonical/runtime/harbor_science_planner_v1.py"
      - name: Run exact repair unit tests
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir -q 'harbor==0.23.0'
          C="$GITHUB_WORKSPACE/capsules/tb_science_local_qwen_planner_repair_v1"
          PYTHONPATH="$C" python -m unittest -v             canonical.tests.test_harbor_science_planner_v1             canonical.tests.test_harbor_science_agent_v1
      - name: Build exact pinned llama.cpp server
        run: |
          set -euo pipefail
          git init llama.cpp
          git -C llama.cpp remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C llama.cpp fetch --depth 1 origin bec4772f6a2527d371557b5d2032641e5ff7619c
          git -C llama.cpp checkout --detach FETCH_HEAD
          test "$(git -C llama.cpp rev-parse HEAD)" = "bec4772f6a2527d371557b5d2032641e5ff7619c"
          cmake -S llama.cpp -B llama.cpp/build -DGGML_CUDA=OFF -DLLAMA_CURL=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build llama.cpp/build -j 2 --target llama-server
      - name: Download and verify exact pinned Qwen bytes
        run: |
          set -euo pipefail
          mkdir -p models
          curl -L --fail --retry 3 --retry-delay 3 --silent --show-error             -o models/Qwen3.5-9B-M-TS-Q4_K_M.gguf             'https://huggingface.co/TheStageAI/Qwen3.5-9B-GGUF/resolve/main/Qwen3.5-9B-M-TS-Q4_K_M.gguf?download=true'
          echo 'f41c0a0c0e43bf721fb2da29374cd1a97271bac0bab08a9dc42964525e82350c  models/Qwen3.5-9B-M-TS-Q4_K_M.gguf' | sha256sum -c -
          test "$(stat -c '%s' models/Qwen3.5-9B-M-TS-Q4_K_M.gguf)" = "5060174144"
      - name: Start exact local endpoint
        run: |
          set -euo pipefail
          EXTRA=()
          if llama.cpp/build/bin/llama-server --help 2>&1 | grep -q -- '--reasoning'; then EXTRA+=(--reasoning off); fi
          nohup llama.cpp/build/bin/llama-server             -m models/Qwen3.5-9B-M-TS-Q4_K_M.gguf             --alias brain-qwen3.5-9b             --host 127.0.0.1 --port 8080 -c 8192 -t 4 --parallel 1             --jinja --no-webui "${EXTRA[@]}"             > LOCAL_QWEN_SERVER.log 2>&1 &
          echo $! > LOCAL_QWEN_SERVER.pid
          ok=0
          for i in $(seq 1 240); do
            if curl -fsS http://127.0.0.1:8080/health > LOCAL_QWEN_HEALTH.json 2>/dev/null; then ok=1; break; fi
            sleep 1
          done
          test "$ok" = 1
      - name: Prove six live structured Science proposals through repaired planner
        run: |
          set -euo pipefail
          C="$GITHUB_WORKSPACE/capsules/tb_science_local_qwen_planner_repair_v1"
          PYTHONPATH="$C" python - <<'PY' | tee LOCAL_QWEN_SCIENCE_PROPOSAL_RESULT.json
          import json
          from canonical.runtime import harbor_science_planner_v1 as p
          from canonical.runtime.harbor_science_agent_v1 import _extract_contract

          prompts=[]
          for i in range(6):
              path=f"/tmp/brain_science_probe_{i}"
              prompts.append(
                  "You are an OPTIONAL semantic proposal source inside Project Brain, not execution authority. "
                  "Submit material_requirements exactly [\"R1\"]. Submit exactly one candidate with action_id A1, "
                  "covers [\"R1\"], command \"printf ok > "+path+"\", and verify_command \"test -s "+path+"\". "
                  "Do not use network, packages, git, secrets, or host escape. Do not submit finish_summary."
              )

          results=[]
          for i,prompt in enumerate(prompts):
              out=p.plan(prompt,timeout_s=180)
              raw=p.normalize_proposal_object(p.extract_json_object(out["text"]))
              req,cands,summary=_extract_contract(raw,None)
              assert req==["R1"],(i,raw)
              assert summary is None,(i,raw)
              assert len(cands)==1,(i,raw)
              row=cands[0]
              assert row["action_id"]=="A1",(i,row)
              assert row["covers"]==["R1"],(i,row)
              assert row["command"]==f"printf ok > /tmp/brain_science_probe_{i}",(i,row)
              assert row["verify_command"]==f"test -s /tmp/brain_science_probe_{i}",(i,row)
              assert out["transport"]=="PINNED_LOCAL_QWEN_LLAMA_CPP_TOOL_CALL"
              results.append({
                  "i":i,
                  "model":out["model"],
                  "duration_s":out["duration_s"],
                  "transport":out["transport"],
              })
          print(json.dumps({
              "schema":"PROJECT_BRAIN_TB_SCIENCE_LOCAL_QWEN_LIVE_PROPOSAL_VERIFICATION_V1",
              "status":"PASS",
              "passes":len(results),
              "required_passes":6,
              "results":results,
              "terminal_task_exposure":0,
              "incremental_spend_usd":0,
          },sort_keys=True))
          PY
      - name: Preserve verifier evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tb-science-local-qwen-planner-repair-v1
          path: |
            LOCAL_QWEN_HEALTH.json
            LOCAL_QWEN_SERVER.log
            LOCAL_QWEN_SCIENCE_PROPOSAL_RESULT.json
          if-no-files-found: warn
