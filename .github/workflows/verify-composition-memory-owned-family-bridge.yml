name: Verify composition memory owned-family bridge
on:
  pull_request:
    paths:
      - "capsules/composition_memory_owned_family_bridge_v1/**"
      - ".github/workflows/verify-composition-memory-owned-family-bridge.yml"
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python capsules/composition_memory_owned_family_bridge_v1/verify.py
