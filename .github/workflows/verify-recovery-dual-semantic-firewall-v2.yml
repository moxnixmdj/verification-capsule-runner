name: Verify recovery dual semantic firewall v2

on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/recovery_dual_semantic_firewall_v2/**"
      - ".github/workflows/verify-recovery-dual-semantic-firewall-v2.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify current quarantine and strict-earliest guard
        run: |
          cd capsules/recovery_dual_semantic_firewall_v2
          export PYTHONPATH=.
          python -m py_compile canonical/runtime/recovery_t0_t2_acceptance_ceiling_lifter_v1.py
          python -m unittest canonical.tests.test_recovery_t0_t2_acceptance_ceiling_lifter_v1 -v
          python verify_independent.py
