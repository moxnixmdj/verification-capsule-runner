name: Verify TB-Science Agent V11 typed schema grounding

on:
  pull_request:
    branches: [terminal-execution-v1]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile V11 control plane
        shell: bash
        run: |
          set -euo pipefail
          C="$GITHUB_WORKSPACE/capsules/tb_science_rank15_20261009_v1"
          python -m py_compile             "$C/canonical/runtime/science_typed_action_protocol_v1.py"             "$C/canonical/runtime/harbor_science_planner_v6.py"             "$C/canonical/runtime/harbor_science_agent_v11.py"             "$C/canonical/runtime/lossless_raw_task_contract_v1.py"             "$C/canonical/runtime/explicit_requirement_index_v2.py"
      - name: Run typed protocol and V11 adversarial tests
        shell: bash
        run: |
          set -euo pipefail
          C="$GITHUB_WORKSPACE/capsules/tb_science_rank15_20261009_v1"
          export PYTHONPATH="$GITHUB_WORKSPACE:$C"
          python "$C/canonical/tests/test_science_typed_action_protocol_v1.py"
          python "$C/canonical/tests/test_harbor_science_agent_v11_typed_schema_grounding.py"
          python "$C/canonical/tests/test_lossless_raw_task_punctuation_coverage_v1.py"
      - name: Preserve candidate-local rejection regression
        shell: bash
        run: |
          set -euo pipefail
          C="$GITHUB_WORKSPACE/capsules/tb_science_rank15_20261009_v1"
          export PYTHONPATH="$GITHUB_WORKSPACE:$C"
          python "$C/canonical/tests/test_harbor_science_agent_v9_candidate_local_rejection.py"
      - name: Verify Planner V6 retains lossless evidence requests and typed candidates
        shell: bash
        run: |
          set -euo pipefail
          C="$GITHUB_WORKSPACE/capsules/tb_science_rank15_20261009_v1"
          export PYTHONPATH="$GITHUB_WORKSPACE:$C"
          python - <<'PY'
          from canonical.runtime import harbor_science_planner_v6 as p
          props=p.TOOL["function"]["parameters"]["properties"]
          assert "evidence_requests" in props
          item=props["candidates"]["items"]
          req=set(item["required"])
          assert {"action_id","covers","executor","command","verify_executor","verify_command"} <= req
          cprops=item["properties"]
          assert cprops["executor"]["enum"] == ["shell","python"]
          assert cprops["verify_executor"]["enum"] == ["shell","python"]
          assert "schema_requirements" in cprops
          assert "deliverables" in cprops
          print("PASS__PLANNER_V6_TYPED_EVIDENCE_SCHEMA")
          PY
