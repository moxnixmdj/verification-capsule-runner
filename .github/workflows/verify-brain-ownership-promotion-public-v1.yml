name: Verify Brain ownership promotion public failover V1
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/ownership_promotion_public_v1/**"
      - ".github/workflows/verify-brain-ownership-promotion-public-v1.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile exact verifier sources
        run: |
          cd capsules/ownership_promotion_public_v1
          python -m py_compile canonical/runtime/ownership_promotion_compiler_v1.py
          python -m py_compile canonical/runtime/ownership_promotion_independent_verifier_v1.py
      - name: Run exact Brain regression suite
        run: |
          cd capsules/ownership_promotion_public_v1
          export PYTHONPATH=.
          python -m unittest canonical.tests.test_ownership_promotion_compiler_v1 -v
      - name: Run independent dual-implementation verifier
        run: |
          cd capsules/ownership_promotion_public_v1
          export PYTHONPATH=.
          python verify_public_failover.py
