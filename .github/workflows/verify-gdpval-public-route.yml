name: Verify GDPval public gold route
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/verify-gdpval-public-route.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Clone exact public GDPval revision without LFS payloads
        run: |
          GIT_LFS_SKIP_SMUDGE=1 git clone -q https://huggingface.co/datasets/openai/gdpval.git /tmp/gdpval
          git -C /tmp/gdpval checkout -q 11e7900
          echo "GDPVAL_FULL_SHA=$(git -C /tmp/gdpval rev-parse HEAD)"
          test "$(git -C /tmp/gdpval rev-parse --short=7 HEAD)" = "11e7900"
          git -C /tmp/gdpval lfs version
      - name: Fetch only public task table
        run: |
          git -C /tmp/gdpval lfs pull --include="data/train-00000-of-00001.parquet" --exclude=""
          test -s /tmp/gdpval/data/train-00000-of-00001.parquet
      - name: Install pinned parquet reader
        run: python -m pip install --disable-pip-version-check -q 'pyarrow==21.0.0'
      - name: Verify aggregate scope without exposing task content
        run: |
          python - <<'PY'
          import pyarrow.parquet as pq
          p="/tmp/gdpval/data/train-00000-of-00001.parquet"
          t=pq.read_table(p)
          required={
              "task_id","sector","occupation","prompt",
              "reference_file_hf_uris","deliverable_file_hf_uris",
              "rubric_json","rubric_pretty"
          }
          assert required.issubset(set(t.column_names)), t.column_names
          task_ids=t["task_id"].to_pylist()
          sectors=t["sector"].to_pylist()
          occupations=t["occupation"].to_pylist()
          rubrics=t["rubric_json"].to_pylist()
          assert t.num_rows == 220, t.num_rows
          assert len(set(task_ids)) == 220
          assert len(set(occupations)) == 44
          assert len(set(sectors)) == 9
          assert all(isinstance(x,str) and x.strip() for x in rubrics)
          print("GDPVAL_PUBLIC_ROUTE_PASS rows=220 occupations=44 sectors=9 unique_task_ids=220")
          PY
