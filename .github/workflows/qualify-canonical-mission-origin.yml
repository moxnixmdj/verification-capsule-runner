name: Qualify Canonical Mission Origin

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  qualify:
    if: github.head_ref == 'qualify/canonical-mission-origin-entrypoint-20260930-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      ASTRA_DISABLE_MODEL_PLANNER: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run canonical mission-origin qualification
        run: python verify_canonical_mission_origin.py
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-mission-origin-qualification
          path: canonical-mission-origin-qualification-report.json
          if-no-files-found: error
