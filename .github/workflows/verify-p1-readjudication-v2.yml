name: Verify P1 readjudication v2

on:
  push:
    paths:
      - "verify_p1_readjudication_v2.py"
      - "canonical/runtime/p1_composite_proof_readjudicator_v2.py"
      - "canonical/tests/test_p1_composite_proof_readjudicator_v2.py"
      - "canonical/governance/P1_COMPOSITE_PROOF_READJUDICATION_CANDIDATE_V2.json"
      - "canonical/governance/P1_COMPOSITE_PROOF_ROLE_RECONCILIATION_V1.json"
      - ".github/workflows/verify-p1-readjudication-v2.yml"
  pull_request:
    paths:
      - "verify_p1_readjudication_v2.py"
      - "canonical/runtime/p1_composite_proof_readjudicator_v2.py"
      - "canonical/tests/test_p1_composite_proof_readjudicator_v2.py"
      - "canonical/governance/P1_COMPOSITE_PROOF_READJUDICATION_CANDIDATE_V2.json"
      - "canonical/governance/P1_COMPOSITE_PROOF_ROLE_RECONCILIATION_V1.json"
      - ".github/workflows/verify-p1-readjudication-v2.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run independent exact-blob verifier
        run: python verify_p1_readjudication_v2.py
