name: Verify synthesis witness target binding v1

on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/synthesis_witness_target_binding_v1/**"
      - ".github/workflows/verify-synthesis-witness-target-binding-v1.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact synthesis operational atom binding
        run: |
          cd capsules/synthesis_witness_target_binding_v1
          export PYTHONPATH=.
          python -m py_compile canonical/runtime/synthesis_witness_target_binding_verifier_v1.py
          python canonical/tests/test_synthesis_witness_target_binding_v1.py
          python canonical/runtime/synthesis_witness_target_binding_verifier_v1.py
