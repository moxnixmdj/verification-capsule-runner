name: Verify Brain direct proof mutation preflight
on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/runtime/prewave_direct_proof_preflight.py'
      - 'canonical/tests/test_prewave_direct_proof_preflight.py'
      - '.github/workflows/verify-brain-direct-proof-mutation-preflight.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Bind exact Brain blobs
        run: |
          test "$(git hash-object canonical/runtime/prewave_direct_proof_preflight.py)" = "9c61e61e12cf2c773a980a8f31110ebf6d21be80"
          test "$(git hash-object canonical/tests/test_prewave_direct_proof_preflight.py)" = "e0af38fb07f3727dc49e00ff99fa7c543a4260b6"
      - name: Run mutation preflight
        run: |
          PYTHONPATH=. python canonical/runtime/prewave_direct_proof_preflight.py
          PYTHONPATH=. python -m unittest -v canonical.tests.test_prewave_direct_proof_preflight
