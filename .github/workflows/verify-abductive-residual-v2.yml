name: Verify abductive residual theorem v2
on:
  pull_request:
    paths:
      - "capsules/abductive_residual_v2/**"
      - ".github/workflows/verify-abductive-residual-v2.yml"
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact Brain blobs and adversarial behavior
        run: python capsules/abductive_residual_v2/verify.py
