name: Verify LiveBench union25 archetypes V1

on:
  pull_request:
    branches: [main]
    paths:
      - "subject/livebench_union25_archetypes_v1_20261005/**"
      - "verify_livebench_union25_archetypes_v1.py"
      - ".github/workflows/verify-livebench-union25-archetypes-v1.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
      - name: Install frozen import dependencies
        run: |
          python -m pip install --disable-pip-version-check --quiet \
            nltk==3.10.3 langdetect==1.0.9 immutabledict==4.3.1
      - name: Checkout pinned LiveBench
        run: |
          set -euo pipefail
          rm -rf /tmp/LiveBench
          git init /tmp/LiveBench
          git -C /tmp/LiveBench remote add origin https://github.com/LiveBench/LiveBench.git
          git -C /tmp/LiveBench fetch --depth 1 origin 8f8e5c381a16e3f24257776edd53471fe86f8091
          git -C /tmp/LiveBench checkout --detach FETCH_HEAD
      - name: Verify exact registry structural equality
        run: python verify_livebench_union25_archetypes_v1.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livebench-union25-archetypes-v1
          path: livebench_union25_archetypes_verification.json
          if-no-files-found: error
