name: Verify Chartography Brain adapter boundary
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/chartography_brain_adapter_boundary_v1/**"
      - ".github/workflows/verify-chartography-brain-adapter-boundary-v1.yml"
permissions:
  contents: read
# sync: complete upstream dataset/task/scorer provenance
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          cd capsules/chartography_brain_adapter_boundary_v1
          python verify.py
