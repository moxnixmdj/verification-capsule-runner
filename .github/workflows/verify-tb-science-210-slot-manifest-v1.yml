name: Verify TB-Science 210-slot manifest V1
on:
  push:
    branches: ["verify/tb-science-210-slot-manifest-v1-20261003"]
    paths:
      - "capsules/tb_science_210_slot_manifest_v1/**"
      - ".github/workflows/verify-tb-science-210-slot-manifest-v1.yml"
  pull_request:
    branches: [main]
    paths:
      - "capsules/tb_science_210_slot_manifest_v1/**"
      - ".github/workflows/verify-tb-science-210-slot-manifest-v1.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact Brain manifest blob
        run: |
          set -euo pipefail
          M=capsules/tb_science_210_slot_manifest_v1/TB_SCIENCE_TERMINAL_EXECUTION_MANIFEST_V1.json
          test "$(git hash-object "$M")" = "e0318f4fcde040498077dcdd872e398e32240791"
      - name: Verify manifest against frozen upstream metadata only
        run: |
          set -euo pipefail
          git clone -q https://github.com/harbor-framework/terminal-bench-science.git /tmp/tbs
          cd /tmp/tbs
          git checkout -q f81afac4f11048e77a15dfc8fb1dbfb897fea0ce
          test "$(git hash-object tasks/dataset.toml)" = "b506a7777d2dd5ae3e70c590366ceac4ee59ae28"
          cd "$GITHUB_WORKSPACE"
          python - <<'PY'
          import json, pathlib, re, tomllib, math
          manifest=json.load(open("capsules/tb_science_210_slot_manifest_v1/TB_SCIENCE_TERMINAL_EXECUTION_MANIFEST_V1.json"))
          raw=pathlib.Path("/tmp/tbs/tasks/dataset.toml").read_text()
          entries=re.findall(r'\[\[tasks\]\]\s*\nname = "([^"]+)"\s*\ndigest = "([^"]+)"',raw)
          assert len(entries)==70
          ds=dict(entries)
          assert manifest["frozen_dataset"]["task_count"]==70
          assert manifest["frozen_dataset"]["slot_count"]==210
          assert manifest["frozen_dataset"]["trials_per_task"]==3
          assert manifest["acceptance"]["required_successes"]==math.ceil(.587*210)==124
          assert manifest["acceptance"]["irreversible_failure_count"]==210-124+1==87
          tasks=manifest["task_metadata"]
          assert len(tasks)==70
          assert {t["name"] for t in tasks}==set(ds)
          for t in tasks:
              assert t["digest"]==ds[t["name"]]
              # Metadata only: task.toml is used solely for declared resource fields.
              name=t["name"].split("/",1)[1]
              matches=list(pathlib.Path("/tmp/tbs/tasks").glob(f"*/*/{name}/task.toml"))
              assert len(matches)==1,(name,matches)
              d=tomllib.loads(matches[0].read_text())
              env=d.get("environment",{})
              assert float(env.get("cpus",1))==float(t["cpus"])
              assert int(env.get("memory_mb",2048))==int(t["memory_mb"])
              assert int(env.get("storage_mb",10240))==int(t["storage_mb"])
              assert int(env.get("gpus",0))==int(t["gpus"])
              assert float(d.get("agent",{}).get("timeout_sec",1800))==float(t["agent_timeout_sec"])
              assert float(d.get("verifier",{}).get("timeout_sec",120))==float(t["verifier_timeout_sec"])
              assert float(env.get("build_timeout_sec",600))==float(t["build_timeout_sec"])
          expected=sorted(tasks,key=lambda t:(
              not bool(t["standard_public_storage_feasible"]),
              int(t["storage_mb"]),
              float(t["build_timeout_sec"])+float(t["verifier_timeout_sec"]),
              t["name"]
          ))
          assert [t["name"] for t in tasks]==[t["name"] for t in expected]
          assert sum(bool(t["standard_public_storage_feasible"]) for t in tasks)==57
          slots=manifest["slots"]
          assert len(slots)==210
          ids=[s["slot_id"] for s in slots]
          assert len(set(ids))==210
          expected_slots=[]
          for attempt in range(3):
              for rank,t in enumerate(tasks):
                  expected_slots.append((f'{t["name"]}::trial-{attempt}',attempt,rank,t["digest"]))
          observed=[(s["slot_id"],s["attempt_index"],s["task_rank"],s["task_digest"]) for s in slots]
          assert observed==expected_slots
          assert manifest["execution_rules"]["retries_per_slot"]==0
          assert manifest["execution_rules"]["slot_replacement"] is False
          assert manifest["execution_rules"]["denominator_shrink"] is False
          assert manifest["execution_authority"] is False
          assert manifest["promotion_authority"] is False
          assert manifest["terminal_task_content_read"]==0
          assert manifest["terminal_trials_executed"]==0
          print(json.dumps({
              "schema":"PROJECT_BRAIN_TB_SCIENCE_210_SLOT_MANIFEST_VERIFICATION_V1",
              "status":"PASS","tasks":70,"slots":210,"storage_feasible_tasks":57,
              "storage_feasible_slots":171,"required_successes":124,
              "required_feasible_success_rate":124/171,
              "task_instruction_files_read":0,"solution_files_read":0,
              "terminal_trials_executed":0,"incremental_spend_usd":0
          },sort_keys=True))
          PY
