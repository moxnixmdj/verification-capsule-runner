name: Verify Brain Root1 acquisition closure controller V3

on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/root1_acquisition_closure_controller_v3/**"
      - ".github/workflows/verify-brain-root1-acquisition-closure-controller-v3.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile copied Brain V3
        run: |
          cd capsules/root1_acquisition_closure_controller_v3
          python -m py_compile canonical/runtime/structural_transfer_v3.py canonical/runtime/root1_acquisition_closure_controller_v2.py canonical/runtime/root1_acquisition_closure_controller_v3.py
      - name: Run copied Brain V3 tests
        run: |
          cd capsules/root1_acquisition_closure_controller_v3
          export PYTHONPATH=.
          python -m unittest canonical.tests.test_root1_acquisition_closure_controller_v3 -v
      - name: Run independent adversarial verifier
        run: |
          cd capsules/root1_acquisition_closure_controller_v3
          export PYTHONPATH=.
          python verify_root1_v3.py
