name: Verify PR303 Promotion Firewall
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify exact PR303 provenance and authority invariants
        run: python verify_pr303.py
      - uses: actions/upload-artifact@v4
        with:
          name: pr303-promotion-firewall-verification
          path: verify-pr303-report.json
          if-no-files-found: error
