name: Verify Terminal-Bench 4.0 route preflight
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/verify-tbench4-route.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify source and Harbor pin
        run: |
          git clone -q https://github.com/harbor-framework/terminal-bench.git /tmp/tb
          git -C /tmp/tb checkout -q 1dcda8716784493721921c23e4bc7f7d988b4494
          test "$(git -C /tmp/tb hash-object CITATION.cff)" = "7c749d7b678bda405228617858f63ba6aef4fe2e"
          test "$(tr -d '\r\n' < /tmp/tb/.github/harbor-version)" = "0.23.1.dev202609170426"
          grep -q '^version: v4.0.0$' /tmp/tb/CITATION.cff
      - name: Verify runner and CLI
        run: |
          python -m pip install --disable-pip-version-check -q 'harbor==0.23.1.dev202609170426'
          harbor --version
          harbor run --help >/dev/null
          harbor version show --help >/dev/null
          docker version >/dev/null
