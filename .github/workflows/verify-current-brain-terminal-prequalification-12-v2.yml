name: Verify current Brain terminal prequalification 12 V2

on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/runtime/terminal_prequalification_reducer.py'
      - 'verification/current_brain/**'
      - 'verification/verify_current_terminal_prequalification_12_v2.py'
      - '.github/workflows/verify-current-brain-terminal-prequalification-12-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Bind exact Brain state
        run: |
          test "$(git hash-object canonical/runtime/terminal_prequalification_reducer.py)" = "da929015fafabed2b5a134a2e95b6bff2f47349c"
          test "$(git hash-object verification/current_brain/canonical/governance/ACTIVE_TERMINAL_PROOF_BASIS_V1.json)" = "2ba39428f0065f0d8739c43935f7026ba6eedcfb"
          test "$(git hash-object verification/current_brain/canonical/governance/BEHAVIORAL_CONTRACT_REGISTRY_V1.json)" = "afa00109031d638fef32cc3fe10be18786605c39"
          test "$(git hash-object verification/current_brain/canonical/governance/GLOBAL_TERMINAL_REPLACEMENT_POPULATION_PROTOCOL_V2.json)" = "432f1f9122a0a136f71a89eae5c8fb81692e4071"
          test "$(git hash-object verification/current_brain/canonical/governance/EXACT_FOUR_PORTFOLIO_PREQUALIFICATION_V1.json)" = "d85f90df76db4b6b1650fe40279f33d6a7d9e7b5"
          test "$(git hash-object verification/verify_current_terminal_prequalification_12_v2.py)" = "00bc17bac6234a5a71c41ae5a0a1f9b2e6dacc3d"
      - name: Run exact current prequalification
        run: PYTHONPATH=. python verification/verify_current_terminal_prequalification_12_v2.py
