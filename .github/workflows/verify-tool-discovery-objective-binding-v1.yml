name: Verify tool discovery objective binding v1
on:
  pull_request:
    branches: [main]
    paths:
      - 'capsules/tool_discovery_objective_binding_v1/**'
      - '.github/workflows/verify-tool-discovery-objective-binding-v1.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          set -euo pipefail
          cd capsules/tool_discovery_objective_binding_v1
          python -m unittest -v test_public_verification
