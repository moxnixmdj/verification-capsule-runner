name: Verify Retrieval V8 current pointer final
on:
  push:
    branches:
      - verify/retrieval-v8-current-pointer-final-20261003
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python verify_retrieval_v8_current_pointer_final.py
      - run: PYTHONPATH=. python canonical/runtime/global_retrieval_authority_guard_v1.py
      - run: PYTHONPATH=. python canonical/tests/test_global_retrieval_empirical_v2.py
      - run: PYTHONPATH=. python canonical/runtime/global_retrieval_entrypoint_v2.py
