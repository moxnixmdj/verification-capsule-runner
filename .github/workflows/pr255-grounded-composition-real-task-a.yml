name: PR255 Grounded Composition Real Task A - Requests API Consistency
on:
  push:
    branches:
      - verify/pr255-grounded-composition-real-task-a-requests-20260930
permissions:
  contents: read
jobs:
  task-a:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact surviving PR255 composition bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object canonical/runtime/astra_runtime.py)" = "fad69b9cea170a090428c471aaf7107bdbae377b"
          test "$(git hash-object canonical/runtime/bound_capabilities/grounded_executable_composition.py)" = "77749a5a191ef79d2f552f0983b5d2ed604a4440"
          test "$(git hash-object canonical/runtime/bound_capabilities/grounded_executable_composition_verify.py)" = "a1db73b07b264d2b6aa650765661b688b57bb3d1"
          test "$(git hash-object canonical/runtime/capability_planner.py)" = "64ff65cb184f50d3336326f33cccfcc0a53301a8"
          test "$(git hash-object canonical/runtime/bound_capabilities/plain_goal_bound_grounding.py)" = "00f5d0c1c742f444ad876103f251bb4476017dc1"
      - name: Execute fresh real multi-step task
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util,json,pathlib,sys
          root=pathlib.Path(".").resolve()
          path=root/"canonical/runtime/astra_runtime.py"
          spec=importlib.util.spec_from_file_location("pr255_task_a_runtime",path)
          runtime=importlib.util.module_from_spec(spec)
          sys.modules[spec.name]=runtime
          spec.loader.exec_module(runtime)

          goal=(
            "Fetch JSON from https://api.github.com/repos/psf/requests. "
            "Fetch JSON from https://api.github.com/repositories/1362490. "
            "Assess knowledge consistency."
          )
          mission={
            "mission_id":"PR255-GROUNDED-COMPOSITION-REAL-TASK-A-REQUESTS-20260930",
            "goal":goal,
          }
          step={
            "adapter":"goal",
            "goal_ref":"goal",
            "verified_initial_facts":["network.http.available"],
            "max_controller_actions":12,
          }
          result=runtime.run_goal(step,mission)
          assert result.get("controller_mode")=="MODEL_INDEPENDENT_ACTION_PLAN",result
          assert result.get("planner_model_last") is None,result
          assert result.get("composition_mode")=="MODEL_INDEPENDENT_GROUNDED_CAPABILITY_GRAPH",result
          assert result.get("model_dependency_count")==0,result

          grounding_path=pathlib.Path(result["grounding_evidence_path"])
          composition_path=pathlib.Path(result["composition_evidence_path"])
          grounding=json.loads(grounding_path.read_text(encoding="utf-8"))
          composition=json.loads(composition_path.read_text(encoding="utf-8"))
          assert grounding["grounded_clause_count"]>=3,grounding
          assert grounding["unresolved_clause_indexes"]==[],grounding
          assert composition["composition_ready"] is True,composition
          assert composition["model_dependency_count"]==0,composition
          assert len(composition["clauses"])>=3,composition

          trace=result.get("trace") or []
          fetches=[
            x["result"] for x in trace
            if isinstance(x,dict) and isinstance(x.get("result"),dict)
            and x["result"].get("type")=="fetch_json_knowledge"
          ]
          assessments=[
            x["result"] for x in trace
            if isinstance(x,dict) and isinstance(x.get("result"),dict)
            and x["result"].get("type")=="assess_knowledge_consistency"
          ]
          assert len(fetches)==2,fetches
          assert len(assessments)==1,assessments
          assessment_path=assessments[0]["output_path"]

          evidence={
            "schema":"PROJECT_BRAIN_GROUNDED_EXECUTABLE_COMPOSITION_REAL_TASK_A_V1",
            "goal":goal,
            "result":result,
            "grounding":grounding,
            "composition":composition,
            "assessment_path":assessment_path,
            "model_dependency_count":0,
            "incremental_spend_usd":0,
          }
          pathlib.Path("PR255_GROUNDED_COMPOSITION_REAL_TASK_A.json").write_text(
            json.dumps(evidence,indent=2,sort_keys=True)+"\n",encoding="utf-8"
          )
          PY
      - name: Independently re-fetch and verify real effect
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,pathlib,urllib.request
          urls=[
            "https://api.github.com/repos/psf/requests",
            "https://api.github.com/repositories/1362490",
          ]
          vals=[]
          for url in urls:
              req=urllib.request.Request(url,headers={
                  "User-Agent":"ProjectBrain-Independent-Composition-Verifier/1",
                  "Accept":"application/vnd.github+json",
              })
              with urllib.request.urlopen(req,timeout=30) as r:
                  assert 200 <= int(r.status) < 300
                  vals.append(json.loads(r.read().decode("utf-8")))
          assert vals[0]["id"]==1362490==vals[1]["id"]
          assert vals[0]["full_name"]=="psf/requests"==vals[1]["full_name"]
          assert vals[0]["default_branch"]==vals[1]["default_branch"]

          ep=pathlib.Path("PR255_GROUNDED_COMPOSITION_REAL_TASK_A.json")
          ev=json.loads(ep.read_text(encoding="utf-8"))
          ap=pathlib.Path(ev["assessment_path"])
          assessment=json.loads(ap.read_text(encoding="utf-8"))
          assert assessment["status"]=="SUPPORTED",assessment
          assert assessment["evidence_count"]==2,assessment
          assert assessment["fresh_evidence_count"]==2,assessment
          assert assessment["invalid"]==[],assessment

          ev["independent_verification"]={
            "verified":True,
            "producer_independent":True,
            "source_identity_match":True,
            "repo_id":1362490,
            "full_name":"psf/requests",
            "observed_status":assessment["status"],
            "assessment_sha256":hashlib.sha256(ap.read_bytes()).hexdigest(),
          }
          ep.write_text(json.dumps(ev,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          print("REAL_TASK_A_VERIFIED")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr255-grounded-composition-real-task-a
          path: |
            PR255_GROUNDED_COMPOSITION_REAL_TASK_A.json
            canonical/astra_runtime/evidence/PR255-GROUNDED-COMPOSITION-REAL-TASK-A-REQUESTS-20260930__BOUND_CAPABILITY_GROUNDING.json
            canonical/astra_runtime/evidence/PR255-GROUNDED-COMPOSITION-REAL-TASK-A-REQUESTS-20260930__GROUNDED_EXECUTABLE_COMPOSITION.json
            canonical/astra_runtime/tmp/*.json
