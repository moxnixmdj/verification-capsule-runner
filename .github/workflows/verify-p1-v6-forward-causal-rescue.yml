name: Verify Brain P1 V6 forward causal rescue
on:
  pull_request:
    paths:
      - "capsules/p1_typed_ir_v6_forward_causal_rescue/**"
      - ".github/workflows/verify-p1-v6-forward-causal-rescue.yml"
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact Brain V6 forward causal behavior
        run: python capsules/p1_typed_ir_v6_forward_causal_rescue/verify.py
