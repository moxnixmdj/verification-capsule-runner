name: Inspect Stanza coref task delta
on:
  pull_request:
    branches: [main]
    paths:
      - 'verification/s0e_stanza_coref_delta_inspect.py'
      - '.github/workflows/inspect-s0e-stanza-coref-delta.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PIP_NO_CACHE_DIR: "1"
      STANZA_RESOURCES_DIR: /tmp/stanza_s0e
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch
      - run: python -m pip install --no-cache-dir 'stanza==1.14.0'
      - run: python verification/s0e_stanza_coref_delta_inspect.py
