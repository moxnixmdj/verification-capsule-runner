name: Verify Brain frontier reconciliation 1075
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/brain_frontier_reconciliation_1075/**"
      - ".github/workflows/verify-brain-frontier-reconciliation-1075.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact Brain blob identities
        run: |
          cd capsules/brain_frontier_reconciliation_1075
          python - <<'PY'
          import hashlib,json,pathlib
          m=json.load(open("EXPECTED_BLOBS.json",encoding="utf-8"))
          for src,expected in m["exact_blobs"].items():
              data=pathlib.Path(src).read_bytes()
              got=hashlib.sha1(f"blob {len(data)}\0".encode()+data).hexdigest()
              assert got==expected,(src,got,expected)
          print("exact reconciliation blobs: PASS")
          PY
      - name: Reproduce Brain frontier-state consistency assertions
        run: |
          cd capsules/brain_frontier_reconciliation_1075
          python - <<'PY'
          import json
          from pathlib import Path
          L=lambda p: json.loads(Path(p).read_text())
          h=L("canonical/governance/ACTIVE_GOAL_HIERARCHY_V1.json")
          u=L("canonical/governance/RESIDUAL_ACTION_UNIVERSE_V2.json")
          p=L("canonical/CANONICAL_POINTER.json")
          s=L("canonical/governance/REAL_OUTPUT_SCOREBOARD_V1.json")
          q=L("canonical/capabilities/FRONTIER_CAPABILITY_OBSOLESCENCE_QUEUE_V1.json")
          t=L("canonical/capabilities/frontier/OPUS_5_5_USEFUL_CAPABILITY_OWNERSHIP_V1.json")
          i=L("canonical/action_intents/2026-10-02_RECONCILE_TERMINAL_PROOF_FRONTIER_V1.json")
          v=L("canonical/governance/RESIDUAL_MINIMUM_REALITY_CUT_VERDICT_V6.json")
          b=h["current_parent_blocker"]; n=h["next_required_action_class"]; prog=h["next_progress_event_target"]
          af=s["active_frontier_accounting"]; m=h["residual_action_universe_v2"]
          target=h["active_capability_target"]; program=h["active_program"]
          assert p["current_frontier"]["active_capability_target"]==target
          assert p["current_frontier"]["critical_blocker"]==b
          assert p["current_frontier"]["highest_leverage_capability_gap"]==b
          assert p["current_frontier"]["next_step"]==n
          assert p["current_frontier"]["program"]==program
          assert af["parent_frontier_capability"]==target
          assert af["residual_gap"]==b and af["current_parent_blocker"]==b and af["next_required_action"]==n
          assert s["next_required_action"]==n and s["next_progress_event_target"]==prog
          assert q["immediate_frontier"]["selected_capability"]==target
          assert q["immediate_frontier"]["exact_blocker"]==b
          assert q["immediate_frontier"]["next_action"]==n
          assert t["capability_id"]==target and t["residual_gap"]==b and t["next_action"]==n
          assert t["acceptance_truth"]=={
            "accepted_families":2,"total_families":19,
            "proved_atomic_predicates":7,"unresolved_atomic_predicates":31,
            "total_atomic_predicates":38,"achieved":False
          }
          assert m["status"]==u["status"] and m["exact_cut_ready"]==u["exact_cut_ready"] and m["blocking_obligations"]==u["blocking_obligations"]
          assert m["blocking_obligations"]==[] and m["exact_cut_ready"] is True
          assert u["blocking_obligations"]==[] and u["exact_cut_ready"] is True
          assert h["execution_latency_control"]["status"]=="ACTIVE"
          assert p["boot_requirements"]["atomic_frontier_transaction_required"] is True
          assert v["status"].startswith("VERIFIED_EXACT_MINIMUM") and v["observation_count"]==2 and v["total_cost"]==2
          assert i["canonical_base_commit"]=="a1fb91ba41e6a2cd4142b0d253f9eb8dc4541cf5"
          assert i["action_kind"]=="RECONCILE_FRONTIER"
          assert i["highest_leverage_now"] is True
          assert i["weakens_existing_guard"] is False
          assert i["capability_target"]==target
          assert i["terminal_objective"]==h["terminal_objective"]
          assert i["active_program"]==program
          assert i["recursive_obs"]["route_frontier"]["discovery_required"] is False
          print("FRONTIER_RECONCILIATION_1075_EXACT_PASS")
          PY
