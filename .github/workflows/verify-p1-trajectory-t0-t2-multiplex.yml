name: Verify P1 trajectory T0 T2 multiplex binding
on:
  pull_request:
    branches: [main]
    paths:
      - 'capsules/p1_trajectory_t0_t2/**'
      - '.github/workflows/verify-p1-trajectory-t0-t2-multiplex.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Bind exact Brain blobs
        run: |
          set -euo pipefail
          test "$(git hash-object capsules/p1_trajectory_t0_t2/canonical/runtime/p1_trajectory_t0_t2_multiplex_preflight.py)" = "d2f8135b62cb6593f3fb1b1ee9d8f0b92ad31f46"
          test "$(git hash-object capsules/p1_trajectory_t0_t2/canonical/tests/test_p1_trajectory_t0_t2_multiplex_preflight.py)" = "5742ec1f6ee3ff3a0edee7d511c9523f0d2a68e3"
          test "$(git hash-object capsules/p1_trajectory_t0_t2/canonical/governance/P1_TRAJECTORY_T0_T2_MULTIPLEX_TERMINAL_BINDING_V1.json)" = "8703c6aa08227467a619a7ae90d0d61f8e54da39"
          test "$(git hash-object capsules/p1_trajectory_t0_t2/canonical/governance/TERMINAL_PORTFOLIO_BINDING_MANIFESTS_V1.json)" = "8b439403a05b4a912f06a8866db25f6e53b52473"
          test "$(git hash-object capsules/p1_trajectory_t0_t2/canonical/runtime/trajectory_failure_information_safe_candidate_v2.py)" = "1d589df945ca35e65705ce7f44517cef707ca3a9"
          test "$(git hash-object capsules/p1_trajectory_t0_t2/canonical/runtime/trajectory_failure_information_safe_proof_v2.py)" = "53e1c196b7e6f62a0897aae2327f68af4a2c3bf6"
          test "$(git hash-object capsules/p1_trajectory_t0_t2/canonical/verification/TRAJECTORY_INFORMATION_SAFE_V2_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json)" = "c571023e8b126c558f3995b2b0d348a7fbd084a0"
          test "$(git hash-object capsules/p1_trajectory_t0_t2/canonical/governance/TERMINAL_PORTFOLIO_PREWAVE_PROTOCOL_V1.json)" = "46cce2be4e277485b7c83233630d0e2fe57d06d1"
          test "$(git hash-object capsules/p1_trajectory_t0_t2/canonical/governance/FOUR_UNCOVERED_BEHAVIORAL_PROOF_CONTRACTS_V1.json)" = "8c7ffe3d9ff789eddd286496f6de3ce84472c909"
          test "$(git hash-object capsules/p1_trajectory_t0_t2/canonical/governance/CONTRACT_NATIVE_ABSOLUTE_PROOF_SUITES_V1.json)" = "d8cf10dfbe041f63a43ccf43bd5dcdc8fe6f9e2b"
      - name: Compile exact verifier
        run: python -m py_compile capsules/p1_trajectory_t0_t2/canonical/runtime/p1_trajectory_t0_t2_multiplex_preflight.py
      - name: Verify live binding and fail-closed mutations
        run: |\n          cd capsules/p1_trajectory_t0_t2/\n          PYTHONPATH=. python -m unittest -v canonical.tests.test_p1_trajectory_t0_t2_multiplex_preflight\n          PYTHONPATH=. python -m unittest -v canonical.tests.test_trajectory_failure_typed_ir_v4
