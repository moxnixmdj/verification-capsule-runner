name: Verify current zero reality cut V8

on:
  push:
    branches: ["verify/current-zero-reality-cut-v8-20261003-sol"]
    paths:
      - ".github/workflows/verify-current-zero-reality-cut-v8.yml"
      - "capsules/current_zero_reality_cut_v8/brain/**"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify V7 base plus TB-Science delta
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          R=Path("capsules/current_zero_reality_cut_v8/brain")
          expected={
            "canonical/governance/CURRENT_ZERO_REALITY_MINIMUM_CUT_V8.json":"fe3203145c7cd1784309d0f98b3ed898e81a5890",
            "canonical/governance/ROOT2_FIXED_BAR_ROUTE_INVENTORY_V1.json":"2737cb5d1c6241f9805f1e7f00e44f7a90a45fda",
            "canonical/governance/ROOT2_ROOT3_MINIMUM_EXECUTION_FRONTIER_V1.json":"0af95d94b2de464f1590911394596a63dcff30f8",
            "canonical/governance/TB_SCIENCE_V01_PUBLIC_GITHUB_CARRIER_ATTAINABILITY_V1.json":"d1c5277cbd85f7f10d2ddf13eaf258f67c04e03b",
            "canonical/verification/TB_SCIENCE_V01_PUBLIC_GITHUB_CARRIER_ATTAINABILITY_PUBLIC_RUNNER_VERIFICATION_20261003_V1.json":"aacdd4431ec4a0c889d1bb4249c8eba9ee476390",
            "canonical/verification/CURRENT_ZERO_REALITY_MINIMUM_CUT_V7_PUBLIC_RUNNER_VERIFICATION_20261003_V1.json":"0394af2f912c9b0f9c6de1d40c630a4f156f9836",
          }
          def blob(rel):
            b=(R/rel).read_bytes()
            return hashlib.sha1(b"blob "+str(len(b)).encode()+b"\0"+b).hexdigest()
          for p,h in expected.items():
            got=blob(p)
            assert got==h,(p,h,got)
          def L(rel): return json.loads((R/rel).read_text())
          cut=L("canonical/governance/CURRENT_ZERO_REALITY_MINIMUM_CUT_V8.json")
          route=L("canonical/governance/ROOT2_FIXED_BAR_ROUTE_INVENTORY_V1.json")
          frontier=L("canonical/governance/ROOT2_ROOT3_MINIMUM_EXECUTION_FRONTIER_V1.json")
          carrier=L("canonical/governance/TB_SCIENCE_V01_PUBLIC_GITHUB_CARRIER_ATTAINABILITY_V1.json")
          receipt=L("canonical/verification/TB_SCIENCE_V01_PUBLIC_GITHUB_CARRIER_ATTAINABILITY_PUBLIC_RUNNER_VERIFICATION_20261003_V1.json")
          v7=L("canonical/verification/CURRENT_ZERO_REALITY_MINIMUM_CUT_V7_PUBLIC_RUNNER_VERIFICATION_20261003_V1.json")

          assert v7["independent_runner"]["conclusion"]=="success"
          assert v7["verified"]["accepted_families"]==5
          assert v7["verified"]["proved_atomic"]==12
          assert v7["verified"]["unresolved_atomic"]==26

          assert receipt["independent_runner"]["conclusion"]=="success"
          assert receipt["verified"]["exact_task_count"]==70
          assert receipt["verified"]["metadata_only_read"] is True
          assert receipt["verified"]["live_public_github_runner"] is True
          assert receipt["verified"]["docker_required_and_verified"] is True
          assert receipt["verified"]["docker_compose_required_and_verified"] is True
          assert receipt["verified"]["threshold_58_7_mathematically_attainable"] is True
          assert receipt["verified"]["benchmark_task_execution_count"]==0
          assert receipt["verified"]["brain_score_proved"] is False
          assert receipt["verified"]["acceptance_proved"] is False

          assert carrier["read_only_resource_census"]["task_count"]==70
          assert carrier["read_only_resource_census"]["compatible_tasks_observed_in_metadata_audit"]==57
          assert carrier["read_only_resource_census"]["max_full_score_if_compatible_tasks_score_1_and_incompatible_score_0"] > 0.587
          assert carrier["read_only_resource_census"]["required_mean_on_57_compatible_tasks_to_reach_0_587_if_13_incompatible_score_0"] < 1

          science=next(x for x in route["routes"] if x["surface"]=="Terminal-Bench-Science 0.1")
          assert "BRAIN_SCORE_ONLY_OPEN" in science["state"]
          assert science["carrier_attainability"]["git_blob_sha"]=="aacdd4431ec4a0c889d1bb4249c8eba9ee476390"
          assert "TB_SCIENCE_GE_58_7" in route["route_classes"]["brain_score_only_open"]
          assert "TB_SCIENCE_GE_58_7" not in route["route_classes"]["public_inputs_or_harness_but_execution_or_grading_route_open"]

          assert frontier["authority"]["root2_fixed_bar_route_inventory"]["git_blob_sha"]=="2737cb5d1c6241f9805f1e7f00e44f7a90a45fda"
          assert frontier["authority"]["tb_science_public_carrier"]["git_blob_sha"]=="aacdd4431ec4a0c889d1bb4249c8eba9ee476390"

          assert cut["schema"]=="PROJECT_BRAIN_CURRENT_ZERO_REALITY_MINIMUM_CUT_V8"
          assert cut["exact_state"]["accepted_families"]==5
          assert cut["exact_state"]["proved_atomic"]==12
          assert cut["exact_state"]["unresolved_atomic"]==26
          assert cut["authority"]["root2_routes"]["git_blob_sha"]=="2737cb5d1c6241f9805f1e7f00e44f7a90a45fda"
          assert cut["authority"]["minimum_frontier"]["git_blob_sha"]=="0af95d94b2de464f1590911394596a63dcff30f8"
          assert cut["authority"]["tb_science_public_carrier"]["git_blob_sha"]=="aacdd4431ec4a0c889d1bb4249c8eba9ee476390"
          delta=next(x for x in cut["completed_zero_reality_deltas"] if x["target"]=="TB_SCIENCE_GE_58_7")
          assert delta["delta"]=="ZERO_COST_PUBLIC_GITHUB_CARRIER_ATTAINABILITY_INDEPENDENT_PASS"
          science_work=next(x for x in cut["active_zero_reality_work"] if x["surface"]=="Terminal-Bench-Science 0.1")
          assert "BRAIN_SCORE_ONLY" in science_work["work"]
          assert cut["fresh_reality_authority"] is False
          assert cut["execution_authority"] is False
          assert cut["acceptance_credit_delta"]==0
          print("CURRENT_ZERO_REALITY_CUT_V8_PASS")
          PY
