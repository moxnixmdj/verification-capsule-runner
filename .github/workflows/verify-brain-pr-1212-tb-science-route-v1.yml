name: Verify Brain PR 1212 TB-Science route V1
on:
  push:
    branches: ["verify-brain-pr-1212-tb-science-route-v1"]
    paths:
      - "capsules/brain_pr_1212_tb_science_route/**"
      - ".github/workflows/verify-brain-pr-1212-tb-science-route-v1.yml"
  pull_request:
    branches: [main]
    paths:
      - "capsules/brain_pr_1212_tb_science_route/**"
      - ".github/workflows/verify-brain-pr-1212-tb-science-route-v1.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact Brain blobs
        run: |
          set -euo pipefail
          cd capsules/brain_pr_1212_tb_science_route
          test "$(git hash-object canonical/runtime/harbor_science_agent_v1.py)" = "5d6685d66ca04cec5e332993329e997f6e9fe272"
          test "$(git hash-object canonical/tests/test_harbor_science_agent_v1.py)" = "f788372fbc1a7963a0f0f58673f1c80be2c858f9"
          test "$(git hash-object canonical/governance/TERMINAL_BENCH_SCIENCE_BRAIN_ROUTE_CANDIDATE_V1.json)" = "379bf08cc270b3780a7df5a8b94cf0d2f44a2db2"
          test "$(git hash-object canonical/runtime/harbor_command_policy.py)" = "a525773417291c7a4841bf35e1baff5370350d0d"
          test "$(git hash-object canonical/runtime/harbor_environment_transport.py)" = "ec46f648214a37bb16025d5ef2593efdf59f0d79"
          test "$(git hash-object canonical/runtime/shared_decision_primitives.py)" = "794e8d1ca9525564b592ffc3af899037183ef655"
          test "$(git hash-object canonical/runtime/acceptance_capability_source_gate_v2.py)" = "b168b131f6383e158bdc0d931439d14e61f2a5de"
      - name: Run controller adversarial tests
        run: |
          set -euo pipefail
          cd capsules/brain_pr_1212_tb_science_route
          export PYTHONPATH=.
          python -m unittest canonical.tests.test_harbor_science_agent_v1 -v
      - name: Enforce zero-case source-gate scope
        run: |
          set -euo pipefail
          cd capsules/brain_pr_1212_tb_science_route
          python - <<'PY'
          import json
          g=json.load(open("canonical/governance/TERMINAL_BENCH_SCIENCE_BRAIN_ROUTE_CANDIDATE_V1.json"))
          assert g["frozen_surface"]["terminal_cases_exposed"] == 0
          assert g["target_predicate"] == "TB_SCIENCE_GE_58_7"
          assert g["source_gate_projection_if_independently_verified"]["general_substrate_test_pass"] is True
          assert g["source_gate_projection_if_independently_verified"]["configuration_materially_constrains_execution"] is True
          assert g["source_gate_projection_if_independently_verified"]["external_hidden_target_capability_provider"] is False
          assert g["incremental_spend_usd"] == 0
          assert g["terminal_results_observed"] == 0
          assert g["family_credit_delta"] == 0
          assert g["capability_credit_delta"] == 0
          assert g["execution_authority"] is False
          assert g["promotion_authority"] is False
          print("Brain PR1212 TB-Science route zero-case verification: PASS")
          PY
