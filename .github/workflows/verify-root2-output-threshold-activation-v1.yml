name: Verify Root2 output threshold activation V1

on:
  pull_request:
    paths:
      - 'subject/root2_output_threshold_activation_v1/**'
      - 'verify_root2_output_threshold_activation_v1.py'
      - '.github/workflows/verify-root2-output-threshold-activation-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact control-plane projection
        run: python verify_root2_output_threshold_activation_v1.py
