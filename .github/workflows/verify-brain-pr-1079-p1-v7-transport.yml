name: Verify Brain PR 1079 P1 V7 transport and identifiability
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/brain_pr_1079_p1_v7_transport/**"
      - ".github/workflows/verify-brain-pr-1079-p1-v7-transport.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact Brain blob identities
        run: |
          cd capsules/brain_pr_1079_p1_v7_transport
          python - <<'PY'
          import hashlib,json,pathlib
          m=json.load(open("EXPECTED_BRAIN_BLOBS.json",encoding="utf-8"))
          for src,expected in m["exact_brain_blobs"].items():
              data=pathlib.Path(src).read_bytes()
              got=hashlib.sha1(f"blob {len(data)}\0".encode()+data).hexdigest()
              assert got==expected,(src,got,expected)
          print("exact Brain PR 1079 blobs: PASS")
          PY
      - name: Run transport and identifiability tests
        run: |
          cd capsules/brain_pr_1079_p1_v7_transport
          export PYTHONPATH=.
          python -m unittest canonical.tests.test_p1_v7_direct_surface_scope_transport_v1 canonical.tests.test_p1_v7_failure_semantics_identifiability_v1 -v
      - name: Execute zero-reality gates
        run: |
          cd capsules/brain_pr_1079_p1_v7_transport
          export PYTHONPATH=.
          python -m canonical.runtime.p1_v7_direct_surface_scope_transport_v1 > transport.json
          python -m canonical.runtime.p1_v7_failure_semantics_identifiability_v1 > identifiability.json
      - name: Enforce expected classified verdicts and zero credit
        run: |
          cd capsules/brain_pr_1079_p1_v7_transport
          python - <<'PY'
          import json
          t=json.load(open("transport.json"))
          i=json.load(open("identifiability.json"))
          assert t["status"]=="FAIL_CLOSED__V7_DIRECT_SURFACE_FAILURE_SEMANTICS_TRANSPORT_NOT_PROVED__ZERO_CREDIT",t
          assert t["classification"]=="FORMAL_INPUT_BINDING_RESIDUAL",t
          assert t["failure_semantics_transport_explicit"] is False,t
          assert t["new_reality_units_consumed"]==0 and t["capability_credit_delta"]==0 and t["family_credit_delta"]==0,t
          assert i["theorem_established"] is True,i
          assert i["status"].startswith("PASS__CURRENT_FROZEN_TRANSPORT_PROJECTION_UNDERDETERMINES"),i
          assert i["classification"]=="INFORMATION_OR_SPECIFICATION_RESIDUAL",i
          assert i["projection_equal_after_removing_failure_semantics"] is True,i
          assert i["required_behavior_differs"] is True,i
          assert i["new_reality_units_consumed"]==0 and i["capability_credit_delta"]==0 and i["family_credit_delta"]==0,i
          print("classified zero-reality verdicts: PASS")
          PY
