name: Verify Unknown-Domain V3 projection

on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/unknown_domain_v3_projection/**"
      - ".github/workflows/verify-unknown-domain-v3-projection.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact Root3 V3 pointer chain
        run: |
          cd capsules/unknown_domain_v3_projection
          python verify_projection.py
