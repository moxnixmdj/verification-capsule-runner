name: Verify browser T2 objective binding
on:
  pull_request:
    branches: [main]
    paths:
      - 'capsules/browser_t2_objective/**'
      - '.github/workflows/verify-browser-t2-objective-binding.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Bind exact Brain blobs
        run: |
          set -euo pipefail
          test "$(git hash-object capsules/browser_t2_objective/canonical/governance/BROWSER_T2_OBJECTIVE_TERMINAL_BINDING_V1.json)" = "36e96b9dc90301fe89f7a8f963c24920f6c6595e"
          test "$(git hash-object capsules/browser_t2_objective/canonical/runtime/browser_t2_objective_binding_validator.py)" = "0d8fc6d67c840033bd0412630e7199161b291165"
          test "$(git hash-object capsules/browser_t2_objective/canonical/tests/test_browser_t2_objective_binding_validator.py)" = "d16727f95d48cd5a7288dc7416e88b9b1d5b1c46"
          test "$(git hash-object capsules/browser_t2_objective/canonical/runtime/browser_state_information_safe_candidate.py)" = "8acf61f21a15a0d3b3e0e5735ebb80e20393e405"
          test "$(git hash-object capsules/browser_t2_objective/canonical/runtime/browser_state_information_safe_proof.py)" = "3723d3233d6058f0a43491e4654a21490f992d1e"
          test "$(git hash-object capsules/browser_t2_objective/canonical/runtime/browser_transition_objective_audit_v1.py)" = "e37548030083627d711f12b85f7c3785aed41081"
          test "$(git hash-object capsules/browser_t2_objective/canonical/governance/AUTOMATIONBENCH_PUBLIC_SCOPE_BINDING_V1.json)" = "1cb9b4ca93699e4db965dd2a682017eebd6649be"
          test "$(git hash-object capsules/browser_t2_objective/canonical/governance/GLOBAL_TERMINAL_SELECTION_KERNEL_V1.json)" = "669afcde50302e76c1b0a1f6b186aaafa8730515"
          test "$(git hash-object capsules/browser_t2_objective/canonical/governance/OUTER_TERMINAL_MULTIPLEX_PORTFOLIOS_V1.json)" = "7c49e3a44dc9a827e84a12b572ea6b8e9b2fa1f5"
          test "$(git hash-object capsules/browser_t2_objective/canonical/governance/BEHAVIORAL_CONTRACT_REGISTRY_V1.json)" = "afa00109031d638fef32cc3fe10be18786605c39"
          test "$(git hash-object capsules/browser_t2_objective/canonical/runtime/consensus_dom_grounding.py)" = "2849a9eea74c6c595709f77eba23fd40a3be8c9a"
      - name: Compile exact validator
        run: python -m py_compile capsules/browser_t2_objective/canonical/runtime/browser_t2_objective_binding_validator.py
      - name: Verify frozen browser objective route
        run: cd capsules/browser_t2_objective/ && PYTHONPATH=. python -m unittest -v canonical.tests.test_browser_t2_objective_binding_validator
