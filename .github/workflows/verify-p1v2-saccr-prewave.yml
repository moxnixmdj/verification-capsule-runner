name: Verify P1 V2 and SA-CCR prewave routes

on:
  push:
    branches: ['verify/p1v2-saccr-prewave-20261002']
    paths:
      - 'canonical/runtime/trajectory_failure_information_safe_proof_v2.py'
      - 'canonical/runtime/trajectory_failure_information_safe_candidate_v2.py'
      - 'canonical/tests/test_trajectory_failure_information_safe_v2.py'
      - 'canonical/runtime/saccr_active_contract_proof_v1.py'
      - 'canonical/runtime/saccr_active_contract_candidate_v1.py'
      - 'canonical/runtime/saccr_credit_kernel.py'
      - 'canonical/tests/test_saccr_active_contract_proof_v1.py'
      - '.github/workflows/verify-p1v2-saccr-prewave.yml'

permissions:
  contents: read

jobs:
  trajectory-v2:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Bind exact Brain P1 V2 bytes
        run: |
          test "$(git hash-object canonical/runtime/trajectory_failure_information_safe_proof_v2.py)" = "53e1c196b7e6f62a0897aae2327f68af4a2c3bf6"
          test "$(git hash-object canonical/runtime/trajectory_failure_information_safe_candidate_v2.py)" = "1d589df945ca35e65705ce7f44517cef707ca3a9"
          test "$(git hash-object canonical/tests/test_trajectory_failure_information_safe_v2.py)" = "1b5742f49d0457857e6c02ccedb1bac2174a802b"
      - run: PYTHONPATH=. python -m unittest -v canonical.tests.test_trajectory_failure_information_safe_v2

  saccr-active-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Bind exact Brain SA-CCR bytes
        run: |
          test "$(git hash-object canonical/runtime/saccr_active_contract_proof_v1.py)" = "21938f83d3841af51837a22b7568a7f9ee2600f4"
          test "$(git hash-object canonical/runtime/saccr_active_contract_candidate_v1.py)" = "904fa7b8a9d45719305db9dace395770841807bd"
          test "$(git hash-object canonical/runtime/saccr_credit_kernel.py)" = "4a9536a391e21ec9895c1abdf45a673c0451ba3a"
          test "$(git hash-object canonical/tests/test_saccr_active_contract_proof_v1.py)" = "59607d07c57e747863086d00b51e142594c5112c"
      - run: PYTHONPATH=. python -m unittest -v canonical.tests.test_saccr_active_contract_proof_v1
