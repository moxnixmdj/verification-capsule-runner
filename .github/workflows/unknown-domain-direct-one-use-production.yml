name: Unknown-Domain direct one-use production
on:
  create:

permissions:
  contents: write

jobs:
  production:
    if: github.ref_type == 'branch' && startsWith(github.ref_name, 'unknown-domain-direct-launch/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # Freeze the worktree to the branch-create event commit. A mutable
          # branch ref can advance while a queued job waits for a runner.
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.15'
          architecture: 'x64'
      - name: Runtime fingerprint before claim
        run: |
          python -VV
          python -c "import platform,sys; print('PYTHON_EXECUTABLE='+sys.executable); print('PYTHON_VERSION='+platform.python_version()); print('PLATFORM='+platform.platform()); print('MACHINE='+platform.machine())"
          printf 'RUNNER_OS=%s\nRUNNER_ARCH=%s\nRUNNER_NAME=%s\nIMAGE_OS=%s\nIMAGE_VERSION=%s\n' "$RUNNER_OS" "$RUNNER_ARCH" "$RUNNER_NAME" "$ImageOS" "$ImageVersion"
      - name: Atomic claim then exactly one production population
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m canonical.runtime.unknown_domain_direct_production_once_v1
