name: Verify target superset coverage dominance V1
on:
  pull_request:
    branches: [main]
    paths:
      - 'verification/target_superset_coverage_dominance_v1/**'
      - '.github/workflows/verify-target-superset-coverage-dominance-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact candidate bytes and theorem
        run: python verification/target_superset_coverage_dominance_v1/verify.py
