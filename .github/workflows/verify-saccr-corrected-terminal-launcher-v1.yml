name: Verify SA-CCR corrected terminal launcher V1
on:
  pull_request:
    branches: [main]
    paths:
      - canonical/**
      - .github/workflows/verify-saccr-corrected-terminal-launcher-v1.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify exact current launcher bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object canonical/runtime/terminal_parent_portfolio_launcher_v1.py)" = "d7f20a66f1f534b06ea11782cb350a582c07d985"
          test "$(git hash-object canonical/tests/test_terminal_parent_portfolio_launcher_v1.py)" = "01996bc0cca7246c0dcfea5b1602c4740fa3e45d"
          test "$(git hash-object canonical/runtime/saccr_route_specific_terminal_executor_v1.py)" = "9810e3f9a2dd94dc372b6b9a865510795d0262fd"
          test "$(git hash-object canonical/tests/test_saccr_route_specific_terminal_executor_v1.py)" = "59e01148f9cc0cff741e81b3238e023358a2a88a"
      - name: Run corrected launcher and SA-CCR regressions
        run: |
          PYTHONPATH=. python -m unittest -v             canonical.tests.test_terminal_parent_portfolio_launcher_v1             canonical.tests.test_saccr_route_specific_terminal_executor_v1
      - name: Prove no terminal evidence was consumed
        run: |
          python - <<'PY'
          import json
          p=json.load(open("canonical/governance/TERMINAL_PARENT_LAUNCHER_BINDING_V1.json"))
          assert p["terminal_results_observed"] == 0, p
          assert p["fresh_terminal_evidence_consumed"] == 0, p
          assert p["launch_ready"] is False, p
          assert p["independent_verification"] is None, p
          print("prewave-only verification")
          PY
