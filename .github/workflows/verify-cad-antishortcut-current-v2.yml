name: Verify CAD anti-shortcut current v2
on:
  push:
    branches: [main]
    paths:
      - canonical/runtime/cad_t0_route_specific_candidate_v1.py
      - canonical/tests/test_cad_t0_source_structure_antishortcut_current_v2.py
      - canonical/tests/test_cad_t0_route_specific_candidate_v1.py
      - .github/workflows/verify-cad-antishortcut-current-v2.yml
  pull_request:
    branches: [main]
    paths:
      - canonical/runtime/cad_t0_route_specific_candidate_v1.py
      - canonical/tests/test_cad_t0_source_structure_antishortcut_current_v2.py
      - canonical/tests/test_cad_t0_route_specific_candidate_v1.py
      - .github/workflows/verify-cad-antishortcut-current-v2.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Bind exact current Brain bytes
        run: |
          set -euo pipefail
          test "$(git hash-object canonical/runtime/cad_t0_route_specific_candidate_v1.py)" = "aa32750b220a023617938b7be9476f6b3aac6704"
          test "$(git hash-object canonical/tests/test_cad_t0_source_structure_antishortcut_current_v2.py)" = "7d5c5fae0012b12caba6668b4d491121fd3ef5f7"
          test "$(git hash-object canonical/tests/test_cad_t0_route_specific_candidate_v1.py)" = "6fa98b0fd04f86097cbd77f8657ba472e5d6b6dd"
      - name: Run expanded render-equivalence anti-shortcut suite
        run: python -m unittest -v canonical.tests.test_cad_t0_source_structure_antishortcut_current_v2
      - name: Re-run all frozen CAD geometry families
        run: python -m unittest -v canonical.tests.test_cad_t0_route_specific_candidate_v1
