name: Verify Grounding Bound Registry Integration
on:
  push:
    branches:
      - verify/plain-goal-grounding-bound-integration-20260930
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact PR250 integration blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object canonical/runtime/BOUND_CAPABILITY_REGISTRY_V1.json)" = "da9bb564e22b7e584054119008494078d52e4085"
          test "$(git hash-object canonical/runtime/astra_runtime.py)" = "801d226ab589595f376da54833de6b925ff96f15"
          test "$(git hash-object canonical/runtime/bound_capabilities/plain_goal_bound_grounding.py)" = "00f5d0c1c742f444ad876103f251bb4476017dc1"
          test "$(git hash-object canonical/runtime/bound_capabilities/plain_goal_bound_grounding_verify.py)" = "d4aa64dc995845fcf8045f14f476f84b7f1d9cb8"
          test "$(git hash-object canonical/tests/test_plain_goal_grounding_bound_registry_integration.py)" = "aea3208c802df2744be82765f214c08d1af4d350"
      - name: Compile and invoke through ASTRA registry
        run: |
          python -m py_compile             canonical/runtime/astra_runtime.py             canonical/runtime/bound_capabilities/plain_goal_bound_grounding.py             canonical/runtime/bound_capabilities/plain_goal_bound_grounding_verify.py             canonical/tests/test_plain_goal_grounding_bound_registry_integration.py
          python canonical/tests/test_plain_goal_grounding_bound_registry_integration.py
