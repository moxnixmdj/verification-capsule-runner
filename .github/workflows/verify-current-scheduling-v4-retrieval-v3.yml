name: Verify current scheduling V4 retrieval V3
on:
  push:
    branches:
      - verify/current-scheduling-v4-retrieval-v3-20261003
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python verify_current_scheduling_v4_retrieval_v3.py
