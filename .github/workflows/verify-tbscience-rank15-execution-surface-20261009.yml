name: Verify TB-Science rank15 execution surface
on:
  push:
    branches:
      - stage/tb-science-rank15-portable-v2-20261009
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify inert execution surface
        env:
          C: capsules/tb_science_rank15_20261009_v1
        run: |
          set -euo pipefail
          test ! -e "$C/ACTIVATE_RANK15_PORTABLE_V2_PR.json"
          test "$(git hash-object "$C/rank15_execution_preflight_v2.py")" = "250f550b653561baf5d7c98726a6e9562abb56cf"
          test "$(git hash-object "$C/rank15_finalize_receipt_v2.py")" = "4bd9d1a25cb92c25d15753b352ffd644ed9c6b8e"
          test "$(git hash-object ".github/workflows/execute-tb-science-rank15-20261009-v1.yml")" = "4c9bc5a50ee998e5f0aa65fa54a5f5d53ab28d2d"
          python -m py_compile "$C/rank15_execution_preflight_v2.py" "$C/rank15_finalize_receipt_v2.py"
          python "$C/rank15_execution_preflight_v2.py"
          CARRIER_READY=false HARBOR_OUTCOME=skipped SAFE_ID=protein-active-learning-trial-0 python "$C/rank15_finalize_receipt_v2.py"
          python - <<'PY'
          import json
          p=json.load(open("RANK15_EXECUTION_PREFLIGHT_V2.json"))
          r=json.load(open("protein-active-learning-trial-0__SLOT_RECEIPT_V2.json"))
          assert p["pass"] is True and p["activation_present"] is False
          assert p["task_read"] is False and p["benchmark_trials_consumed"]==0
          assert r["status"]=="PREEXPOSURE_ABORT_NONCONSUMING"
          assert r["task_read"] is False and r["task_started"] is False
          assert r["execution_authority_consumed"] is False
          assert r["benchmark_trials_consumed"]==0
          assert r["rerun_credit"] is False
          PY
          grep -F 'paths:' .github/workflows/execute-tb-science-rank15-20261009-v1.yml >/dev/null
          test "$(git hash-object \"$C/RANK15_EPOCH_V2.json\")" = "3ead70cc5c625b5523292de6f43446a836944a87"\n          test "$(git hash-object \"$C/RANK15_EXECUTION_CLAIM_V2.json\")" = "f377aba4612ed86330c2de05d5adbec3aeb922c6"
          ! grep -F 'workflow_dispatch' .github/workflows/execute-tb-science-rank15-20261009-v1.yml
          ! grep -F 'schedule:' .github/workflows/execute-tb-science-rank15-20261009-v1.yml
          ! grep -F 'Restore exact llama.cpp cache' .github/workflows/execute-tb-science-rank15-20261009-v1.yml
          grep -F 'Clean-build exact llama.cpp on live runner' .github/workflows/execute-tb-science-rank15-20261009-v1.yml >/dev/null
          rm -rf llama.cpp
          git init llama.cpp
          git -C llama.cpp remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C llama.cpp fetch --depth 1 origin bec4772f6a2527d371557b5d2032641e5ff7619c
          git -C llama.cpp checkout --detach FETCH_HEAD
          test "$(git -C llama.cpp rev-parse HEAD)" = "bec4772f6a2527d371557b5d2032641e5ff7619c"
          cmake -S llama.cpp -B llama.cpp/build -DGGML_CUDA=OFF -DLLAMA_CURL=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build llama.cpp/build -j 2 --target llama-server
          llama.cpp/build/bin/llama-server --version >/dev/null
# rank15-portable-v2-staging-trigger
