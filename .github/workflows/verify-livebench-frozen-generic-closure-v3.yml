name: Verify LiveBench frozen generic-goal closure V3
on:
  pull_request:
    branches: [main]
    paths:
      - "diagnose_livebench_template_runtime_postrun_v2.py"
      - "subject/livebench_frozen_generic_closure_v1/**"
      - ".github/workflows/verify-livebench-frozen-generic-closure-v3.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.14"
      - name: Verify exact frozen generic-goal closure without terminal cases
        shell: bash
        run: python diagnose_livebench_template_runtime_postrun_v2.py
