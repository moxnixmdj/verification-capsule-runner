name: Verify LiveBench fixed-bar evidence orthogonality V1
on:
  pull_request:
    branches: [main]
    paths:
      - "subject/livebench_fixedbar_evidence_orthogonality_v1/**"
      - "verify_livebench_fixedbar_evidence_orthogonality_v1.py"
      - ".github/workflows/verify-livebench-fixedbar-evidence-orthogonality-v1.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python verify_livebench_fixedbar_evidence_orthogonality_v1.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livebench-fixedbar-evidence-orthogonality-v1-receipt
          path: livebench_fixedbar_evidence_orthogonality_v1_receipt.json
          if-no-files-found: error
