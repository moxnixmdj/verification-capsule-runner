name: Verify count-generic terminal projection V2
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/count_generic_terminal_projection_v2/**"
      - ".github/workflows/verify-count-generic-terminal-projection-v2.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python capsules/count_generic_terminal_projection_v2/verify.py
