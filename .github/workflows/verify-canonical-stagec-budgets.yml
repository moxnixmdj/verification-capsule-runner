name: Verify canonical Stage-C budgets
on:
  pull_request:
    branches: [main]
    paths:
      - 'session_bridge/controller_fast.py'
      - 'session_bridge/acceptance_contract.py'
      - 'tests/test_canonical_stagec_budget_enforcement.py'
      - '.github/workflows/verify-canonical-stagec-budgets.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m unittest -v tests.test_canonical_stagec_budget_enforcement
