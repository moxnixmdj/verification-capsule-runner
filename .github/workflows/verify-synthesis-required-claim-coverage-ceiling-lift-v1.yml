name: Verify synthesis required-claim coverage ceiling lift v1

on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/synthesis_required_claim_coverage_ceiling_v1/**"
      - ".github/workflows/verify-synthesis-required-claim-coverage-ceiling-lift-v1.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify synthesis required-claim coverage ceiling lift
        run: |
          cd capsules/synthesis_required_claim_coverage_ceiling_v1
          export PYTHONPATH=.
          python -m py_compile canonical/runtime/synthesis_required_claim_coverage_ceiling_lift_verifier_v1.py
          python -m unittest canonical.tests.test_synthesis_required_claim_coverage_ceiling_lift_v1 -v
          python canonical/runtime/synthesis_required_claim_coverage_ceiling_lift_verifier_v1.py
