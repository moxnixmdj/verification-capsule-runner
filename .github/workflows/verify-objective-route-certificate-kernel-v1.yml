name: Verify objective route certificate kernel v1
on:
  pull_request:
    branches: [main]
    paths:
      - 'capsules/final_three_objective_bindings/**'
      - '.github/workflows/verify-objective-route-certificate-kernel-v1.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Bind exact current Brain certificate bytes
        working-directory: capsules/final_three_objective_bindings
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object canonical/governance/BROWSER_T2_OBJECTIVE_TERMINAL_BINDING_V1.json)" = "28e955d5d593d1de9cfab0f9cdcdae732fd315f1"
          test "$(git hash-object canonical/governance/TOOL_DISCOVERY_T2_T3_OBJECTIVE_TERMINAL_BINDING_V1.json)" = "6bcabc0a7d0525532ce7b80e132278f7c99caa43"
          test "$(git hash-object canonical/governance/RESEARCH_T3_OBJECTIVE_TERMINAL_BINDING_V1.json)" = "a7015b12f55fc971233f9fdddf59d50cfc43892b"
          test "$(git hash-object canonical/governance/GLOBAL_TERMINAL_SELECTION_KERNEL_V1.json)" = "669afcde50302e76c1b0a1f6b186aaafa8730515"
          test "$(git hash-object canonical/governance/OBJECTIVE_ROUTE_CERTIFICATE_BASIS_V1.json)" = "f9d6485006cf76354c0b1c5aeed5cb5faf82d0f2"
          test "$(git hash-object canonical/runtime/objective_route_certificate_verifier.py)" = "9815faca089de126c7ef1c23f3c728f8907364c5"
          test "$(git hash-object canonical/tests/test_objective_route_certificate_verifier.py)" = "39c6b4ab43939975ad3edf86719b9d962d8f3aae"
          test "$(git hash-object canonical/runtime/objective_route_promotion_transition.py)" = "fdfbdaa993a37d0d0742e4c93c0fca8063cb7463"
          test "$(git hash-object canonical/tests/test_objective_route_promotion_transition.py)" = "84802c235dc4b4578940c84e4b64cd23628a6a0c"
          test "$(git hash-object canonical/runtime/browser_t2_objective_binding_validator.py)" = "102995b1645e858e35678ad1a55578ffebc14f06"
          test "$(git hash-object canonical/runtime/tool_discovery_t2_t3_objective_binding_validator.py)" = "bc25cb98eb2f8ec3b8450b0387c718bbe1c6034a"
          test "$(git hash-object canonical/runtime/research_t3_objective_binding_validator.py)" = "c4a373260e8698350ee82a648389ce2104addb4d"
          test "$(git hash-object canonical/tests/test_research_t3_objective_binding_validator.py)" = "e13ca4163d5d5b8803778ae561aed5024c4c0a39"
          test "$(git hash-object canonical/verification/FINAL_THREE_OBJECTIVE_BINDINGS_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json)" = "1e88faddacc5d7e31dc136386260856cba09c848"
          test "$(git hash-object canonical/verification/RESEARCH_T3_OBJECTIVE_BINDING_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json)" = "9b5f008ff2fd6f77fcce5131072efca548ceb590"
      - name: Verify shared structural quotient and promotion proofs
        working-directory: capsules/final_three_objective_bindings
        run: |
          PYTHONPATH=. python -m unittest -v \
            canonical.tests.test_objective_route_certificate_verifier \
            canonical.tests.test_objective_route_promotion_transition
          PYTHONPATH=. python canonical/runtime/objective_route_certificate_verifier.py .
      - name: Verify three residual semantics
        working-directory: capsules/final_three_objective_bindings
        run: |
          PYTHONPATH=. python -m unittest -v \
            canonical.tests.test_browser_t2_objective_binding_validator \
            canonical.tests.test_tool_discovery_t2_t3_objective_binding_validator \
            canonical.tests.test_research_t3_objective_binding_validator
          PYTHONPATH=. python canonical/runtime/browser_t2_objective_binding_validator.py .
          PYTHONPATH=. python canonical/runtime/tool_discovery_t2_t3_objective_binding_validator.py .
          PYTHONPATH=. python canonical/runtime/research_t3_objective_binding_validator.py .
