name: Run SQLite Open-Ended Task A Once

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: read

jobs:
  execute-once:
    if: github.head_ref == 'execute/sqlite-openended-taska-once-20260930-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ASTRA_DISABLE_MODEL_PLANNER: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout exact PR head, never merge ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require explicit one-shot arm marker
        run: test -f ARM_SQLITE_OPENENDED_TASKA_20260930_V1
      - name: Execute frozen SQLite parent Task A exactly once
        id: parent_task
        continue-on-error: true
        run: python run_sqlite_openended_taska_once.py
      - name: Upload terminal producer/oracle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sqlite-openended-taska-terminal
          path: sqlite-openended-taska-terminal.json
          if-no-files-found: error
      - name: Preserve semantic failure
        if: steps.parent_task.outcome != 'success'
        run: exit 1
