name: Verify LiveBench IF 58 checker boundaries

on:
  pull_request:
    branches: [main]
    paths:
      - 'verification/livebench_if_58_boundary_preflight.py'
      - '.github/workflows/verify-livebench-if-58-boundaries.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}

      - name: Install pinned verifier dependencies
        run: |
          python -m pip install --disable-pip-version-check -q \
            'setuptools==80.9.0' 'absl-py==2.3.1' \
            'nltk==3.10.3' 'emoji==2.16.0' 'syllapy==0.7.2'

      - name: Fetch exact pinned LiveBench verifier source
        run: |
          git clone -q https://github.com/LiveBench/LiveBench.git /tmp/livebench
          git -C /tmp/livebench checkout -q 8f8e5c381a16e3f24257776edd53471fe86f8091
          test "$(git -C /tmp/livebench hash-object livebench/if_runner/ifbench/evaluation_lib.py)" = "2c7bd1290031dbe4ae0f016c53255f4af0ec645b"
          test "$(git -C /tmp/livebench hash-object livebench/if_runner/ifbench/instructions.py)" = "02b2dfeb50f036b89bec3df34522c73f756d8f44"
          test "$(git -C /tmp/livebench hash-object livebench/if_runner/ifbench/instructions_registry.py)" = "adfed4832877566e62970257b50c6fa32c302fb2"
          test "$(git -C /tmp/livebench hash-object livebench/if_runner/ifbench/instructions_util.py)" = "21b13c7fcfc2c2de01e80c9e7dd222b9bca81342"

      - name: Fetch exact author boundary fixtures
        run: |
          git clone -q https://github.com/allenai/IFBench.git /tmp/ifbench
          git -C /tmp/ifbench checkout -q 1c40f0c10d9b5c5c2f10a175a28007ebb64f7f4d
          test "$(git -C /tmp/ifbench hash-object instructions_test.py)" = "c6370ee53ba9138a67809cc73642ab98cd4cd99f"
          cp /tmp/ifbench/instructions_test.py /tmp/ifbench/instructions_test_reuse.py
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/ifbench/instructions_test_reuse.py')
          s=p.read_text()
          old='from ifbench import classic_instructions, instructions\n'
          assert old in s
          s=s.replace(old,'from livebench.if_runner.ifbench import instructions\n')
          p.write_text(s)
          PY

      - name: Stage exact NLTK data
        run: |
          git clone -q https://github.com/nltk/nltk_data.git /tmp/nltk_data_repo
          git -C /tmp/nltk_data_repo checkout -q 550b6625bcef1f2abff2ff770a5a0d272c9c6b2a
          mkdir -p /tmp/nltk_data/tokenizers /tmp/nltk_data/corpora /tmp/nltk_data/taggers
          unzip -q /tmp/nltk_data_repo/packages/tokenizers/punkt.zip -d /tmp/nltk_data/tokenizers
          unzip -q /tmp/nltk_data_repo/packages/tokenizers/punkt_tab.zip -d /tmp/nltk_data/tokenizers
          unzip -q /tmp/nltk_data_repo/packages/corpora/stopwords.zip -d /tmp/nltk_data/corpora
          unzip -q /tmp/nltk_data_repo/packages/taggers/averaged_perceptron_tagger.zip -d /tmp/nltk_data/taggers
          unzip -q /tmp/nltk_data_repo/packages/taggers/averaged_perceptron_tagger_eng.zip -d /tmp/nltk_data/taggers

      - name: Remove only proven dead runtime download bootstraps
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/livebench/livebench/if_runner/ifbench/instructions.py')
          s=p.read_text()
          s=s.replace('from spacy.cli import download\n','')
          s=s.replace('import spacy\n','')
          s=s.replace('if not spacy.util.is_package("en_core_web_sm"):\n\tdownload(\'en_core_web_sm\')\n','')
          p.write_text(s)
          assert 'spacy' not in s.lower()

          u=Path('/tmp/livebench/livebench/if_runner/ifbench/instructions_util.py')
          us=u.read_text()
          assert "    nltk.download('stopwords')\n" in us
          us=us.replace("    nltk.download('stopwords')\n","")
          u.write_text(us)
          PY

      - name: Run 58 checker positive-negative boundary preflight
        env:
          PYTHONPATH: /tmp/livebench
          NLTK_DATA: /tmp/nltk_data
        run: |
          python verification/livebench_if_58_boundary_preflight.py
