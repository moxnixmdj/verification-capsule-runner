name: Verify Brain witness normalization
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run adversarial tests
        run: python -m unittest -v canonical.tests.test_brain_witness_normalization_v1
      - name: Run fail-closed verifier
        run: python canonical/runtime/brain_witness_normalization_verifier_v1.py
