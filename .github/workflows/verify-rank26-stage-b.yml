name: Verify rank26 Stage-B contract
on:
  pull_request:
    branches: [main]
    paths:
      - 'verification/rank26_stage_b/**'
      - '.github/workflows/verify-rank26-stage-b.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Verify exact Brain blobs and Stage-B fail-closed tests
        working-directory: verification/rank26_stage_b
        run: |
          python - <<'PY'
          import hashlib, pathlib
          expected = {
            "canonical/runtime/vllm_deepseek_streaming_stage_b_verifier_v1.py":"9dc2773654cb32a7cd95fb135ec0324897abfed3",
            "canonical/tests/test_vllm_deepseek_streaming_stage_b_verifier_v1.py":"38d4ba7db3c5163da34a31f73faa9bf3848f6438",
            "canonical/capabilities/opus55/VLLM_DEEPSEEK_STREAMING_RANK26_STAGE_B_SOURCE_ACCOUNTING_V1.json":"9693b49d9a2877e344540c36814b58139543dd77",
            "canonical/capabilities/opus55/VLLM_DEEPSEEK_STREAMING_RANK26_STAGE_B_CONTRACT_V1.json":"707bc8810676dba5464f7ad506e833da4a8aa4a2",
            "canonical/capabilities/opus55/VLLM_DEEPSEEK_STREAMING_RANK26_CONTAMINATION_LEDGER_V1.json":"5371d16895bbb3f1cff0896ce0c1f7eee67d4802",
            "canonical/capabilities/opus55/VLLM_DEEPSEEK_STREAMING_RANK26_STAGE_A_ADMISSION_V1.json":"c86f6fbc752f3334cfbb373a72e68c4caf4aef91",
          }
          for p,want in expected.items():
              data=pathlib.Path(p).read_bytes()
              got=hashlib.sha1(b"blob "+str(len(data)).encode()+b"\0"+data).hexdigest()
              assert got==want,(p,got,want)
          PY
          python -m pytest -q canonical/tests/test_vllm_deepseek_streaming_stage_b_verifier_v1.py
