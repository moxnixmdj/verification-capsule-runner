name: Verify LiveBench atomic claim control V1
on:
  pull_request:
    paths:
      - 'subject/livebench_atomic_claim_control_v1_sol/**'
      - 'verify_livebench_atomic_claim_control_v1_sol.py'
      - '.github/workflows/verify-livebench-atomic-claim-control-v1-sol.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python verify_livebench_atomic_claim_control_v1_sol.py
