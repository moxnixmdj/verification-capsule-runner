name: Verify rank21 source-consumer challenge
on:
  pull_request:
    branches: [main]
    paths:
      - 'verification/rank21_source_consumer/**'
      - '.github/workflows/verify-rank21-source-consumer.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m unittest -v verification.rank21_source_consumer.test_challenge
