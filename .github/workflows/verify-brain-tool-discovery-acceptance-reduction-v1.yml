name: Verify Brain Tool Discovery acceptance reduction V1
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/tool_discovery_acceptance_reduction_v1/**"
      - ".github/workflows/verify-brain-tool-discovery-acceptance-reduction-v1.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact Brain blob identities
        run: |
          cd capsules/tool_discovery_acceptance_reduction_v1
          python - <<'PY'
          import hashlib,json,pathlib
          m=json.load(open("EXPECTED_BRAIN_BLOBS.json",encoding="utf-8"))
          for src,want in m["exact_brain_blobs"].items():
              raw=pathlib.Path(src).read_bytes()
              got=hashlib.sha1(f"blob {len(raw)}\0".encode()+raw).hexdigest()
              assert got==want,(src,got,want)
          print("exact Brain blobs: PASS")
          PY
      - name: Compile reducer
        run: |
          cd capsules/tool_discovery_acceptance_reduction_v1
          python -m py_compile canonical/runtime/tool_discovery_acceptance_reduction_v1.py
      - name: Run fail-closed reduction tests
        run: |
          cd capsules/tool_discovery_acceptance_reduction_v1
          export PYTHONPATH=.
          python -m unittest canonical.tests.test_tool_discovery_acceptance_reduction_v1 -v
      - name: Execute reduction
        run: |
          cd capsules/tool_discovery_acceptance_reduction_v1
          export PYTHONPATH=.
          python - <<'PY'
          from canonical.runtime.tool_discovery_acceptance_reduction_v1 import verify
          out=verify()
          assert out["pass"] is True,out
          assert out["candidate_claim"]["state"]=="PROVED",out
          assert out["candidate_claim"]["scope_complete"] is True,out
          assert out["candidate_claim"]["objective_ceiling"] is True,out
          assert out["family_candidate_state"]=="PASS_3_OF_3",out
          assert out["uses_empirical_generalization"] is False,out
          assert out["source_180_of_180_load_bearing"] is False,out
          assert out["acceptance_credit_delta"]==0,out
          assert out["promotion_authority"] is False,out
          print("Tool Discovery acceptance reduction candidate: PASS")
          PY
