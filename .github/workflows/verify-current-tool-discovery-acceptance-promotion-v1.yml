name: Verify current Tool Discovery acceptance promotion V1
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/tool_discovery_current_acceptance_promotion_v1/**"
      - ".github/workflows/verify-current-tool-discovery-acceptance-promotion-v1.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact inputs
        run: |
          cd capsules/tool_discovery_current_acceptance_promotion_v1
          python - <<'PY'
          import hashlib,json,pathlib
          m=json.load(open("EXPECTED_BRAIN_BLOBS.json"))
          for p,w in m["exact_brain_blobs"].items():
              b=pathlib.Path(p).read_bytes()
              g=hashlib.sha1(f"blob {len(b)}\0".encode()+b).hexdigest()
              assert g==w,(p,g,w)
          PY
      - name: Verify promotion
        run: |
          cd capsules/tool_discovery_current_acceptance_promotion_v1
          export PYTHONPATH=.
          python -m unittest canonical.tests.test_tool_discovery_current_acceptance_promotion_v1 -v
          python - <<'PY'
          from canonical.runtime.tool_discovery_current_acceptance_promotion_v1 import verify
          o=verify()
          assert o["pass"] is True,o
          assert (o["proved_predicates"],o["unresolved_predicates"])==(12,26),o
          assert o["candidate_acceptance"]=="5/19_PASS__14/19_OPEN",o
          assert o["tool_discovery_family_pass"] is True,o
          assert o["verified_owned_family_count_unchanged"]==2,o
          assert o["new_reality_units_consumed"]==0,o
          PY
