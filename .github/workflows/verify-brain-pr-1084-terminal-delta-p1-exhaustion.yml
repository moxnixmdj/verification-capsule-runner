name: Verify Brain PR 1084 terminal delta + P1 exhaustion reconciliation
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/brain_pr_1084_terminal_delta_p1_exhaustion/**"
      - ".github/workflows/verify-brain-pr-1084-terminal-delta-p1-exhaustion.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact Brain blob identities
        run: |
          cd capsules/brain_pr_1084_terminal_delta_p1_exhaustion
          python - <<'PY'
          import hashlib,json,pathlib
          m=json.load(open("EXPECTED_BRAIN_BLOBS.json",encoding="utf-8"))
          for src,expected in m["exact_brain_blobs"].items():
              data=pathlib.Path(src).read_bytes()
              got=hashlib.sha1(f"blob {len(data)}\0".encode()+data).hexdigest()
              assert got==expected,(src,got,expected)
          print("exact Brain PR 1084 blobs: PASS")
          PY
      - name: Run terminal delta gate tests
        run: |
          cd capsules/brain_pr_1084_terminal_delta_p1_exhaustion
          export PYTHONPATH=.
          python -m py_compile canonical/runtime/terminal_delta_admission_gate_v1.py
          python -m unittest canonical.tests.test_terminal_delta_admission_gate_v1 -v
      - name: Verify P1 exhaustion scheduling and acceptance invariants
        run: |
          cd capsules/brain_pr_1084_terminal_delta_p1_exhaustion
          python - <<'PY'
          import json,pathlib
          NEW_BLOCK="17_OF_19_OPUS55_ACCEPTANCE_FAMILIES_OPEN__31_OF_38_ATOMIC_PREDICATES_UNRESOLVED__P1_ZERO_REALITY_SOURCE_EXHAUSTED_SPECIFICATION_OR_INFORMATION_RESIDUAL__V4_PRIVATE_CORPUS_FREEZE_PENDING"
          NEW_ACTION="FREEZE_ONE_CLEAN_CONTENT_ADDRESSED_FULL_BRAIN_CORPUS_SCAN_WITH_VERIFIED_PROOF_ATOM_RECEIPT_INDEX_V4_USING_AN_ALTERNATE_PRIVATE_SAFE_CARRIER__IF_NO_PRIVATE_SAFE_CARRIER_IS_AVAILABLE_DO_NOT_EXPOSE_PRIVATE_CORPUS_TO_PUBLIC_VERIFIER__CONTINUE_ONLY_OTHER_NON_CARRIER_BLOCKED_TERMINAL_PROOF_ACTIONS__P1_REOPENS_ONLY_IF_NEW_ADMISSIBLE_INFORMATION_APPEARS__NO_FRESH_TERMINAL_REPLAY__NO_ACCEPTANCE_CREDIT_UNTIL_FIXED_POINT"
          NEW_EVENT="V4_PRIVATE_CORPUS_FREEZE_PRODUCES_A_VERIFIED_ZERO_REALITY_RECEIPT_DELTA__OR_ANOTHER_NON_CARRIER_BLOCKED_TERMINAL_PROOF_ACTION_CLOSES_OR_FALSIFIES__P1_REOPENS_ONLY_ON_NEW_ADMISSIBLE_INFORMATION__NO_NEW_ACCEPTANCE_CREDIT_WITHOUT_FIXED_POINT"
          root=pathlib.Path(".")
          target=json.load(open(root/"canonical/capabilities/frontier/OPUS_5_5_USEFUL_CAPABILITY_OWNERSHIP_V1.json",encoding="utf-8"))
          assert target["residual_gap"]==NEW_BLOCK
          assert target["current_atomic_blocker"]==NEW_BLOCK
          assert target["next_action"]==NEW_ACTION
          assert target["current_atomic_next_action"]==NEW_ACTION
          assert target["next_progress_event_target"]==NEW_EVENT
          assert target["acceptance_truth"]=={
            "accepted_families":2,"total_families":19,
            "proved_atomic_predicates":7,"unresolved_atomic_predicates":31,
            "total_atomic_predicates":38,"achieved":False
          }
          assert any("P1_V7_ZERO_REALITY_SOURCE_EXHAUSTION_INDEPENDENT_PASS" in x for x in target["constraints"])
          hierarchy=json.load(open(root/"canonical/governance/ACTIVE_GOAL_HIERARCHY_V1.json",encoding="utf-8"))
          assert hierarchy["current_parent_blocker"]==NEW_BLOCK
          assert hierarchy["next_required_action_class"]==NEW_ACTION
          assert hierarchy["next_progress_event_target"]==NEW_EVENT
          auth=json.load(open(root/"canonical/governance/CURRENT_TERMINAL_AUTHORITY_V1.json",encoding="utf-8"))
          assert auth["integrator_reconciliation_20261002_current"]["family_acceptance"]=="2_OF_19_CLOSED__17_OPEN"
          assert auth["integrator_reconciliation_20261002_current"]["atomic_acceptance"]=="7_OF_38_PROVED__31_UNRESOLVED"
          assert auth["integrator_reconciliation_20261002_current"]["terminal_goal_achieved"] is False
          assert "P1_V7_ZERO_REALITY_SOURCE_EXHAUSTION_INDEPENDENT_PASS" in auth["rule"]
          gate=auth["authorities"]["terminal_delta_admission_gate"]
          assert gate["status"].startswith("ACTIVE_INDEPENDENT_PUBLIC_RUNNER_PASS")
          active=json.load(open(root/"canonical/governance/TERMINAL_DELTA_ADMISSION_GATE_ACTIVE_AUTHORITY_V1.json",encoding="utf-8"))
          assert active["status"].startswith("ACTIVE_INDEPENDENT_PUBLIC_RUNNER_PASS")
          assert active["capability_credit_delta"]==0 and active["family_credit_delta"]==0
          assert active["execution_authority"] is False and active["promotion_authority"] is False
          intent=json.load(open(root/"canonical/action_intents/2026-10-03_ACTIVATE_TERMINAL_DELTA_GATE_AND_RECONCILE_P1_SOURCE_EXHAUSTION_V1.json",encoding="utf-8"))
          assert intent["canonical_base_commit"]=="26e79b55321a9d0def3f8d1151cd3add25739e04"
          assert intent["capability_credit_delta"]==0 and intent["family_credit_delta"]==0
          print("Brain PR 1084 invariants: PASS")
          PY
