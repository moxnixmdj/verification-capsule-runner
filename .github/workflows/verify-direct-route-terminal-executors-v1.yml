name: Verify direct route terminal executors v1

on:
  pull_request:
    branches: [main]
    paths:
      - 'capsules/direct_route_terminal_executors_v1/**'
      - '.github/workflows/verify-direct-route-terminal-executors-v1.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact Brain blob identities
        working-directory: capsules/direct_route_terminal_executors_v1
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object canonical/runtime/direct_route_terminal_executors_v1.py)" = "531a3d565dcedd8e76a6d178cef9ebfcf468f654"
          test "$(git hash-object canonical/tests/test_direct_route_terminal_executors_v1.py)" = "5bb84aa247001faf727bd64c1ab00e265b8a8d9e"
          test "$(git hash-object canonical/runtime/saccr_credit_information_safe_proof.py)" = "8eb94b8e8b00e3ace662e7fac2e8b6a8f7bb2200"
          test "$(git hash-object canonical/runtime/saccr_credit_information_safe_candidate.py)" = "ff2fa256738ffbe5b15bb813a11c82046692b5e8"
          test "$(git hash-object canonical/runtime/saccr_credit_kernel.py)" = "4a9536a391e21ec9895c1abdf45a673c0451ba3a"
          test "$(git hash-object canonical/runtime/browser_state_information_safe_proof.py)" = "3723d3233d6058f0a43491e4654a21490f992d1e"
          test "$(git hash-object canonical/runtime/browser_state_information_safe_candidate.py)" = "8acf61f21a15a0d3b3e0e5735ebb80e20393e405"
          test "$(git hash-object canonical/runtime/consensus_dom_grounding.py)" = "2849a9eea74c6c595709f77eba23fd40a3be8c9a"
          test "$(git hash-object canonical/runtime/delegation_whole_scope_proof_v2.py)" = "928466401b36e4f3b09c517950cc050432a0616f"
          test "$(git hash-object canonical/runtime/delegation_structural_variety_proof_v3.py)" = "f5e1f45519278ed2cafa27d23b8602b0a362a492"
          test "$(git hash-object canonical/runtime/delegation_whole_scope_candidate_v2.py)" = "f1a93ee66d90093de61dc17c6ebf2e24073df522"
          test "$(git hash-object canonical/runtime/tool_discovery_information_safe_proof_v2.py)" = "5e8a953864e13ec76768c3e8920644107c65a644"
          test "$(git hash-object canonical/runtime/tool_discovery_information_safe_proof.py)" = "2450a9644119c9fdf9c43307a1d115098d6ba592"
          test "$(git hash-object canonical/runtime/tool_discovery_information_safe_candidate.py)" = "64c02edd568d95ec5ed54b7b8122183ce5b82e17"
          test "$(git hash-object canonical/runtime/research_control_information_safe_proof.py)" = "16c47efee0e0e38f479163d1285d7079798efdaf"
          test "$(git hash-object canonical/runtime/research_control_information_safe_candidate.py)" = "cd6bf6e4163bbba64878b856766b1af4372d68bc"
      - name: Run route-specific executor verification
        working-directory: capsules/direct_route_terminal_executors_v1
        run: |
          PYTHONPATH=. python -m unittest -v canonical.tests.test_direct_route_terminal_executors_v1
