name: Guarded PR537 Provenance Preservation Qualification

on:
  pull_request:
    branches: [main]
    paths:
      - canonical/runtime/bound_capabilities/open_research_source_frontend.py
      - canonical/tests/test_scholarly_provenance_admission_materialization.py
      - canonical/action_intents/2026-09-30_REPAIR_METADATA_REFINED_PROVENANCE_PRESERVATION_V1.json
      - verify_pr537_provenance_preservation.py
      - generate_guarded_pr537_plan.py
      - .github/workflows/guarded-pr537-provenance-preservation.yml

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Generate exact frozen guard plan
        run: python generate_guarded_pr537_plan.py
      - name: Atomically admit exact non-parent qualification
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python execution_guard/github_actions_guarded_run_live.py --plan guarded_pr537_provenance_preservation_plan.json --receipt guarded-pr537-admission.json
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: guarded-pr537-provenance-preservation
          path: |
            guarded-pr537-admission.json
            guarded_pr537_provenance_preservation_plan.json
            pr537-independent-report.json
          if-no-files-found: warn
