name: Verify external benchmark dominance v1

on:
  push:
    branches: ["verify/external-benchmark-dominance-v1-20261003-sol"]
    paths:
      - ".github/workflows/verify-external-benchmark-dominance-v1.yml"
      - "capsules/external_benchmark_dominance_v1/brain/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/verify-external-benchmark-dominance-v1.yml"
      - "capsules/external_benchmark_dominance_v1/brain/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Bind exact Brain capsule
        run: |
          set -euo pipefail
          ROOT=capsules/external_benchmark_dominance_v1/brain
          test "$(git hash-object "$ROOT/canonical/governance/EXTERNAL_BENCHMARK_DOMINANCE_CANDIDATE_V1.json")" = "338fb50828825afd6c12eecebe192532543c616b"
          test "$(git hash-object "$ROOT/canonical/runtime/external_benchmark_dominance_compiler_v1.py")" = "f12f49f50358e8795b88aec1ada99f697d65a25e"
          test "$(git hash-object "$ROOT/canonical/tests/test_external_benchmark_dominance_compiler_v1.py")" = "89cac2b2130860e474195db9d626b0281a165351"
          test "$(git hash-object "$ROOT/canonical/governance/OPUS55_ACCEPTANCE_PREDICATE_REGISTRY_V2.json")" = "562536d9ba3f245a6bd24490a1eb3b30f27e0c3a"
          test "$(git hash-object "$ROOT/canonical/governance/OPUS55_ACCEPTANCE_PREDICATE_EVIDENCE_BINDINGS_V2.json")" = "bc420c6d1a6caaab7a6d5c257640d3f5797170f5"
          test "$(git hash-object "$ROOT/canonical/governance/OPUS55_MATCHED_TARGET_NORMALIZATION_CANDIDATE_V3.json")" = "9b400e6eb1a95bacbd9c0cdb93b155ced0f72558"
          test "$(git hash-object "$ROOT/canonical/governance/CURRENT_26_ZERO_REALITY_FRONTIER_V2.json")" = "352fe17467a8335a348949ce2f2b6fdb6235e9ac"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify compiler and fail-closed policy
        run: |
          python -m pip install --quiet pytest
          cd capsules/external_benchmark_dominance_v1/brain
          python -m pytest -q canonical/tests/test_external_benchmark_dominance_compiler_v1.py
          python canonical/runtime/external_benchmark_dominance_compiler_v1.py > /tmp/result.json
          python - <<'PY'
          import json
          x=json.load(open("/tmp/result.json"))
          assert x["pass"] is True,x
          assert x["current"]["public_fixed_bars"]==15,x
          assert x["current"]["matched_targets"]==8,x
          assert x["policy"]["custom_benchmark_creation_authorized"] is False,x
          assert x["policy"]["immediate_full_substitutions"]==0,x
          assert x["fresh_reality_authority"] is False,x
          print("COMPILER_PASS")
          PY

      - name: Verify public harness existence
        run: |
          set -euo pipefail
          git ls-remote https://github.com/surge-ai/gdp-pdf.git HEAD | grep -Eq '^[0-9a-f]{40}'
          git ls-remote https://github.com/surge-ai/complex-constraints.git HEAD | grep -Eq '^[0-9a-f]{40}'
          git clone --depth 1 https://github.com/surge-ai/gdp-pdf.git /tmp/gdp-pdf
          git clone --depth 1 https://github.com/surge-ai/complex-constraints.git /tmp/complex-constraints
          grep -Fq "The full dataset is published" /tmp/gdp-pdf/README.md
          grep -Fq "75 expert-crafted prompts" /tmp/complex-constraints/README.md
          grep -Fq "1,559 total" /tmp/complex-constraints/README.md

      - name: Verify current benchmark-owner Opus 5.5 facts
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -A "Mozilla/5.0" -sS https://surgehq.ai/benchmarks/gdp-pdf -o /tmp/gdp.html
          curl -L --fail --retry 3 -A "Mozilla/5.0" -sS https://surgehq.ai/benchmarks/complex-constraints -o /tmp/cc.html
          curl -L --fail --retry 3 -A "Mozilla/5.0" -sS https://surgehq.ai/benchmarks/enterprisebench-corecraft -o /tmp/eb.html
          curl -L --fail --retry 3 -A "Mozilla/5.0" -sS https://arxiv.org/abs/2610.01306 -o /tmp/dayjob.html
          python - <<'PY'
          from pathlib import Path
          def norm(p):
              return " ".join(Path(p).read_text(errors="ignore").split()).lower()
          g=norm("/tmp/gdp.html"); c=norm("/tmp/cc.html"); e=norm("/tmp/eb.html"); d=norm("/tmp/dayjob.html")
          assert "opus 5.5" in g and "30.6" in g
          assert "opus 5.5" in c and "49.9" in c
          assert "opus 5.5" in e and "74.4" in e
          assert "23.9" in d and "24.7" in d
          assert "50 of the 80 finance tasks" in d
          print("EXTERNAL_OWNER_FACTS_PASS")
          PY

      - name: Verify candidate remains zero-credit
        run: |
          python - <<'PY'
          import json
          p="capsules/external_benchmark_dominance_v1/brain/canonical/governance/EXTERNAL_BENCHMARK_DOMINANCE_CANDIDATE_V1.json"
          c=json.load(open(p))
          assert c["acceptance_credit_delta"]==0
          assert c["family_credit_delta"]==0
          assert c["capability_credit_delta"]==0
          assert c["ownership_credit_delta"]==0
          assert c["execution_authority"] is False
          assert c["promotion_authority"] is False
          assert c["fresh_reality_authority"] is False
          assert all(x["replacement_authorized"] is False for x in c["matched_target_adjudication"])
          print("ZERO_CREDIT_FAIL_CLOSED_PASS")
          PY
