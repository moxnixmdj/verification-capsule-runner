name: verify-livebench-dual-scorer-dispatch-v2
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen scorer dependencies
        run: |
          python -m pip install --disable-pip-version-check --quiet \
            nltk==3.10.3 emoji==2.16.0 syllapy==0.7.2 setuptools==80.9.0 \
            spacy==3.8.16 langdetect==1.0.9 immutabledict==4.3.1 pandas==2.3.3
          python -m pip install --disable-pip-version-check --quiet \
            https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl
      - name: Verify exact dispatch semantics
        run: python verify_livebench_dual_scorer_dispatch_v2.py
