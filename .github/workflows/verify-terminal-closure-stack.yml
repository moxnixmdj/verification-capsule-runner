name: Verify terminal closure compiler stack
on:
  pull_request:
    branches: [main]
    paths:
      - 'capsules/terminal_closure_stack/**'
      - '.github/workflows/verify-terminal-closure-stack.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Verify exact Brain blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object capsules/terminal_closure_stack/canonical/runtime/terminal_proof_supercompiler.py)" = "c7a4b8bc29d041fcc04fbcfa8a79db44fa9fe370"
          test "$(git hash-object capsules/terminal_closure_stack/canonical/tests/test_terminal_proof_supercompiler.py)" = "e91e2c2dc3f7978d115fdd45efdfe4b66e9af33a"
          test "$(git hash-object capsules/terminal_closure_stack/canonical/runtime/prewave_anti_circularity_compiler.py)" = "e610b392fdb8bce337b748f2924b1134ccdfbbd9"
          test "$(git hash-object capsules/terminal_closure_stack/canonical/tests/test_prewave_anti_circularity_compiler.py)" = "6c69bfb96d5c28916774b4d0e044d981b2e48f60"
          test "$(git hash-object capsules/terminal_closure_stack/canonical/runtime/generated_terminal_state_compiler.py)" = "5c0177050e5691fd7d3a577f5f54fc9fc11a4707"
          test "$(git hash-object capsules/terminal_closure_stack/canonical/tests/test_generated_terminal_state_compiler.py)" = "19de5232a53d779fe7e8f1cf1f1164878b8c2eda"
      - name: Run compiler tests
        working-directory: capsules/terminal_closure_stack
        run: |
          python -m unittest -v \
            canonical.tests.test_terminal_proof_supercompiler \
            canonical.tests.test_prewave_anti_circularity_compiler \
            canonical.tests.test_generated_terminal_state_compiler
