name: Localize M0A OLMo causal signal
on:
  pull_request:
    branches: [main]
    paths:
      - 'verification/m0a_olmo_layer_causal_localization.py'
      - '.github/workflows/localize-m0a-olmo-layer-causal-signal.yml'
permissions:
  contents: read
jobs:
  localize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      HF_HOME: /tmp/hf
      PIP_NO_CACHE_DIR: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch
      - run: python -m pip install --no-cache-dir 'transformers>=4.56,<5' huggingface_hub accelerate safetensors
      - run: python verification/m0a_olmo_layer_causal_localization.py
