name: Verify Brain SA-CCR credit kernel
on:
  pull_request:
    branches: [main]
    paths:
      - 'verification/saccr_credit_kernel.py'
      - 'verification/baselkit_sa_ccr_pinned.py'
      - 'verification/test_saccr_credit_kernel.py'
      - '.github/workflows/verify-saccr-credit-kernel.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --quiet numpy
      - run: PYTHONPATH=. python -m unittest -v verification.test_saccr_credit_kernel
