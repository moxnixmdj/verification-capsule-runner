name: C3 Filtered Ettin Fresh Transfer

on:
  push:
    paths:
      - ".github/workflows/c3-filtered-ettin-fresh.yml"
      - "cognitive_c3_filtered_fresh/**"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify router provenance
        run: |
          set -euo pipefail
          test "$(git hash-object cognitive_c3_filtered_fresh/cognitive_tool_router.py)" = "e947d086225aa165895dc5addd4847fb686b3454"
          sha256sum cognitive_c3_filtered_fresh/cases.json cognitive_c3_filtered_fresh/probe.py
      - name: Install and run
        id: probe
        shell: bash
        run: |
          set +e
          {
            python -m pip install --upgrade pip
            python -m pip install sentence-transformers
            python cognitive_c3_filtered_fresh/probe.py
            cat cognitive_c3_filtered_fresh/result.json
          } > cognitive_c3_filtered_fresh/run.log 2>&1
          rc=$?
          cat cognitive_c3_filtered_fresh/run.log
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c3-filtered-ettin-fresh
          path: |
            cognitive_c3_filtered_fresh/cases.json
            cognitive_c3_filtered_fresh/probe.py
            cognitive_c3_filtered_fresh/cognitive_tool_router.py
            cognitive_c3_filtered_fresh/result.json
            cognitive_c3_filtered_fresh/run.log
          if-no-files-found: warn
      - name: Persist terminal result
        if: always()
        shell: bash
        env:
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
          PROBE_RC: ${{ steps.probe.outputs.rc }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path("cognitive_c3_filtered_fresh")
          result_exists=(p/"result.json").exists()
          status={
            "schema":"PROJECT_BRAIN_VISIBLE_EXECUTION_STATUS_V1",
            "probe":"C3_FILTERED_ETTIN_FRESH_TRANSFER",
            "workflow_run_id":os.environ["GITHUB_RUN_ID"],
            "head_sha":os.environ["GITHUB_SHA"],
            "probe_outcome":os.environ.get("PROBE_OUTCOME"),
            "probe_rc":os.environ.get("PROBE_RC"),
            "result_exists":result_exists,
            "terminal_state":"SUCCESS" if os.environ.get("PROBE_OUTCOME")=="success" and result_exists else "FAILURE",
            "capability_credit_delta":0
          }
          (p/"status.json").write_text(json.dumps(status,indent=2)+"\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cognitive_c3_filtered_fresh/status.json cognitive_c3_filtered_fresh/run.log
          test ! -f cognitive_c3_filtered_fresh/result.json || git add cognitive_c3_filtered_fresh/result.json
          git commit -m "Record fresh filtered C3 transfer result"
          git pull --rebase origin main
          git push
