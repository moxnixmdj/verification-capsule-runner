name: Experiment sub100MB typed microquery v2

on:
  pull_request:
    paths:
      - 'sub100mb_typed_microquery_smoke_v2.py'
      - 'subject/sub100mb_typed_microquery_v2/**'
      - '.github/workflows/experiment-sub100mb-typed-microquery-v2.yml'
  workflow_dispatch:

jobs:
  experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Build pinned llama.cpp CPU server
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/llama.cpp
          git -C /tmp/llama.cpp init
          git -C /tmp/llama.cpp remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C /tmp/llama.cpp fetch --depth 1 origin 11fe02151f79c41d0d4af7da708755d73b9c0da6
          git -C /tmp/llama.cpp checkout --detach FETCH_HEAD
          test "$(git -C /tmp/llama.cpp rev-parse HEAD)" = "11fe02151f79c41d0d4af7da708755d73b9c0da6"
          cmake -S /tmp/llama.cpp -B /tmp/llama.cpp/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_NATIVE=OFF \
            -DLLAMA_CURL=OFF
          cmake --build /tmp/llama.cpp/build --config Release -j2 --target llama-server
          test -x /tmp/llama.cpp/build/bin/llama-server

      - name: Fetch and verify exact learned state
        shell: bash
        run: |
          set -euo pipefail
          MODEL="$RUNNER_TEMP/SmolLM2-135M-Instruct-Q3_K_M.gguf"
          curl -L --fail --retry 3 \
            'https://huggingface.co/tensorblock/SmolLM2-135M-Instruct-GGUF/resolve/main/SmolLM2-135M-Instruct-Q3_K_M.gguf' \
            -o "$MODEL"
          test "$(stat -c%s "$MODEL")" = "93511232"
          test "$(sha256sum "$MODEL" | awk '{print $1}')" = "61c69fc5ce91982e26c625d43be5c3c7f0f774da22f4fa4e45c37a80a22ddad4"
          echo "MODEL=$MODEL" >> "$GITHUB_ENV"

      - name: Start controller
        shell: bash
        run: |
          set -euo pipefail
          /tmp/llama.cpp/build/bin/llama-server \
            --model "$MODEL" \
            --host 127.0.0.1 \
            --port 8080 \
            --ctx-size 2048 \
            --threads 2 \
            --parallel 1 \
            > "$RUNNER_TEMP/llama-v2.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/llama-v2.pid"
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1; then exit 0; fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/llama-v2.pid")" 2>/dev/null; then
              cat "$RUNNER_TEMP/llama-v2.log"
              exit 1
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/llama-v2.log"
          exit 1

      - name: Run typed microquery experiment
        shell: bash
        run: |
          set -euo pipefail
          python sub100mb_typed_microquery_smoke_v2.py \
            --endpoint http://127.0.0.1:8080 \
            --out sub100mb_typed_microquery_result_v2.json
          python - <<'PY'
          import json
          x=json.load(open('sub100mb_typed_microquery_result_v2.json'))
          assert x['model']['learned_bytes'] == 93511232
          assert x['model']['learned_bytes'] < 100000000
          assert x['population']['task_count'] == 8
          print(json.dumps(x['summary'], indent=2))
          PY

      - name: Upload empirical result
        uses: actions/upload-artifact@v4
        with:
          name: sub100mb-typed-microquery-v2
          path: sub100mb_typed_microquery_result_v2.json
          if-no-files-found: error
          retention-days: 30

      - name: Show server tail
        if: always()
        shell: bash
        run: tail -100 "$RUNNER_TEMP/llama-v2.log" 2>/dev/null || true
