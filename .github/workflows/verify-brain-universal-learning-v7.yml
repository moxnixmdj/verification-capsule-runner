name: Verify Brain Universal Learning V7

on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/universal_learning_v7/**"
      - ".github/workflows/verify-brain-universal-learning-v7.yml"
  push:
    branches: ["verify/universal-learning-v7-proof-program-20261004"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify exact V7 Brain blob identities
        run: |
          cd capsules/universal_learning_v7
          python - <<'PY'
          import hashlib,json,pathlib
          m=json.load(open("EXPECTED_BRAIN_BLOBS.json",encoding="utf-8"))
          for rel,expected in m["exact_v7_brain_blobs"].items():
              data=pathlib.Path(rel).read_bytes()
              got=hashlib.sha1(f"blob {len(data)}\0".encode()+data).hexdigest()
              assert got==expected,(rel,got,expected)
          print("exact V7 Brain blobs: PASS",len(m["exact_v7_brain_blobs"]))
          PY

      - name: Reverify inherited V6 capsule bytes
        run: |
          cd capsules/universal_learning_v6
          python - <<'PY'
          import hashlib,json,pathlib
          m=json.load(open("EXPECTED_BRAIN_BLOBS.json",encoding="utf-8"))
          for rel,expected in m["exact_brain_blobs"].items():
              data=pathlib.Path(rel).read_bytes()
              got=hashlib.sha1(f"blob {len(data)}\0".encode()+data).hexdigest()
              assert got==expected,(rel,got,expected)
          print("inherited V6 exact blobs: PASS",len(m["exact_brain_blobs"]))
          PY

      - name: Assemble verified V1 through V7 stack
        run: |
          rm -rf /tmp/brain-v7
          mkdir -p /tmp/brain-v7
          cp -R capsules/universal_learning_v6/canonical /tmp/brain-v7/canonical
          cp -R capsules/universal_learning_v7/canonical/* /tmp/brain-v7/canonical/
          python -m py_compile \
            /tmp/brain-v7/canonical/runtime/deductive_closure_v7.py \
            /tmp/brain-v7/canonical/runtime/executable_skill_program_v7.py \
            /tmp/brain-v7/canonical/runtime/universal_learning_proof_program_router_v7.py

      - name: Run V7 unit and binding tests
        run: |
          cd /tmp/brain-v7
          export PYTHONPATH=.
          python -m unittest \
            canonical.tests.test_universal_learning_proof_program_v7 \
            canonical.tests.test_universal_learning_proof_program_binding_v7 -v

      - name: Execute V7 invariant theorem
        run: |
          cd /tmp/brain-v7
          export PYTHONPATH=.
          python - <<'PY'
          from canonical.runtime.universal_learning_proof_program_router_v7 import prove_v7_invariants
          out=prove_v7_invariants()
          assert out["pass"] is True,out
          assert out["deduction_before_observation_preserved"] is True,out
          assert out["executable_program_candidate_no_self_verification_preserved"] is True,out
          assert out["v6_base_preserved"] is True,out
          assert out["semantic_success_rate_proved"] is False,out
          assert out["unknown_domain_acceptance_proved"] is False,out
          assert out["acceptance_credit_delta"]==0,out
          assert out["ownership_credit_delta"]==0,out
          assert out["promotion_authority"] is False,out
          print("V7 invariant theorem: PASS")
          PY

      - name: Run independent adversarial V7 boundaries
        run: |
          cd /tmp/brain-v7
          export PYTHONPATH=.
          python - <<'PY'
          from canonical.runtime import deductive_closure_v7 as d
          from canonical.runtime import executable_skill_program_v7 as p

          scope="scope"
          fsha=d.fact_digest(scope_id=scope,fact="a")
          vf={"fact":"a","verification_receipt":{
              "receipt_id":"f","independent_verified":True,"exact_byte_bound":True,
              "conclusion":"success","scope_id":scope,"fact":"a","fact_sha256":fsha}}
          rsha=d.rule_digest(scope_id=scope,rule_id="r",premises=["a"],conclusion="b")
          vr={"id":"r","premises":["a"],"conclusion":"b","verification_receipt":{
              "receipt_id":"r-proof","independent_verified":True,"exact_byte_bound":True,
              "conclusion":"success","sound_on_claimed_scope":True,
              "scope_id":scope,"rule_id":"r","rule_sha256":rsha}}
          out=d.derive(scope_id=scope,verified_facts=[vf],verified_rules=[vr],required_facts=["b"])
          assert out["empirical_action_required"] is False,out

          bad=dict(vr);bad["verification_receipt"]=dict(vr["verification_receipt"])
          bad["verification_receipt"]["independent_verified"]=False
          try:
              d.derive(scope_id=scope,verified_facts=[vf],verified_rules=[bad],required_facts=["b"])
              raise AssertionError("unverified deductive rule admitted")
          except d.DeductiveClosureError:
              pass

          steps=[{"op":"inspect","inputs":["x"],"outputs":["m"]},{"op":"verify","inputs":["m"],"outputs":["proof"]}]
          dg=p.program_digest(steps=steps,preconditions=["ready"],postconditions=["proof"],invalidators=["changed"])
          def ep(i):
              return {"episode_id":i,"scope_id":i,"steps":steps,
                      "preconditions":["ready"],"postconditions":["proof"],"invalidators":["changed"],
                      "verification_receipt":{"receipt_id":"e-"+i,"independent_verified":True,"exact_byte_bound":True,
                      "conclusion":"success","behavior_verified":True,"episode_id":i,"scope_id":i,"program_sha256":dg}}
          cand=p.induce_candidate([ep("a"),ep("b")])
          assert cand["candidate_only"] is True and cand["verified_skill"] is False,cand

          self_receipt={"receipt_id":"self","independent_verified":False,"exact_byte_bound":True,
                        "conclusion":"success","candidate_sha256":cand["candidate_sha256"],
                        "source_episode_ids":cand["source_episode_ids"],
                        "behavior_preserving_on_claimed_scope":True,"scope_relation":"EXACT"}
          try:
              p.verify_candidate(candidate=cand,verification_receipt=self_receipt)
              raise AssertionError("self-certified executable program admitted")
          except p.ExecutableSkillProgramError:
              pass

          different=[{"op":"guess","inputs":["x"],"outputs":["proof"]}]
          dd=p.program_digest(steps=different,preconditions=["ready"],postconditions=["proof"],invalidators=["changed"])
          e2={"episode_id":"c","scope_id":"c","steps":different,
              "preconditions":["ready"],"postconditions":["proof"],"invalidators":["changed"],
              "verification_receipt":{"receipt_id":"e-c","independent_verified":True,"exact_byte_bound":True,
              "conclusion":"success","behavior_verified":True,"episode_id":"c","scope_id":"c","program_sha256":dd}}
          try:
              p.induce_candidate([ep("a"),e2])
              raise AssertionError("different program skeletons merged")
          except p.ExecutableSkillProgramError:
              pass
          print("independent adversarial V7 boundaries: PASS")
          PY
