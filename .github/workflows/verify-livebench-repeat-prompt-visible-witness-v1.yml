name: Verify LiveBench legacy repeat-prompt visible witness

on:
  push:
    branches:
      - verify/livebench-repeat-prompt-visible-witness-20261004-sol
    paths:
      - verify_livebench_repeat_prompt_visible_witness_v1.py
      - .github/workflows/verify-livebench-repeat-prompt-visible-witness-v1.yml
  pull_request:
    paths:
      - verify_livebench_repeat_prompt_visible_witness_v1.py
      - .github/workflows/verify-livebench-repeat-prompt-visible-witness-v1.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pyarrow==19.0.1
      - run: python verify_livebench_repeat_prompt_visible_witness_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: livebench-repeat-prompt-visible-witness-receipt
          path: livebench_repeat_prompt_visible_witness_receipt.json
          if-no-files-found: error
