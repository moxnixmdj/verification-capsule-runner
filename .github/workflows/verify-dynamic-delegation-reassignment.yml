name: Verify dynamic delegation reassignment
on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/runtime/delegation_dynamic_reassignment_proof.py'
      - 'canonical/runtime/delegation_dynamic_reassignment_candidate.py'
      - 'canonical/runtime/m3_contract_task_decomposition.py'
      - 'canonical/runtime/shared_decision_primitives.py'
      - 'canonical/tests/test_delegation_dynamic_reassignment_proof.py'
      - '.github/workflows/verify-dynamic-delegation-reassignment.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact Brain blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object 'canonical/runtime/delegation_dynamic_reassignment_proof.py')" = '22c895badc21dc7a3a226117ff45a8418c58dd53'
          test "$(git hash-object 'canonical/runtime/delegation_dynamic_reassignment_candidate.py')" = '41329226d68fe195df9f189781734d5a3208066f'
          test "$(git hash-object 'canonical/tests/test_delegation_dynamic_reassignment_proof.py')" = '5be41bfffe1611a7ddbb57e57e54a663b373a3e0'
          test "$(git hash-object 'canonical/runtime/m3_contract_task_decomposition.py')" = '90702f9b4c5b53ba2b29eff4faa7741474bd4529'
          test "$(git hash-object 'canonical/runtime/shared_decision_primitives.py')" = '794e8d1ca9525564b592ffc3af899037183ef655'
      - name: Execute dynamic delegation proof tests
        run: python -m unittest -v canonical.tests.test_delegation_dynamic_reassignment_proof
