name: Verify LiveBench Active15 clean closure

on:
  push:
    branches: [main]
    paths:
      - "subject/livebench_active15_clean_closure_20261005/**"
      - "verify_livebench_active15_clean_closure_v1.py"
      - ".github/workflows/verify-livebench-active15-clean-closure-v1.yml"
  pull_request:
    paths:
      - "subject/livebench_active15_clean_closure_20261005/**"
      - "verify_livebench_active15_clean_closure_v1.py"
      - ".github/workflows/verify-livebench-active15-clean-closure-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify clean Active15 pointwise closure
        run: python verify_livebench_active15_clean_closure_v1.py
      - name: Print receipt
        if: always()
        run: |
          if test -f livebench_active15_clean_closure_receipt.json; then
            cat livebench_active15_clean_closure_receipt.json
          fi
      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livebench-active15-clean-closure-receipt
          path: livebench_active15_clean_closure_receipt.json
          if-no-files-found: error
