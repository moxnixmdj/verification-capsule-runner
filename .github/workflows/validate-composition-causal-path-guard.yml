name: Validate Composition Causal Path Guard

on:
  push:
    branches: [verify/composition-causal-path-guard-20260930]
    paths:
      - 'ARM_VALIDATE_COMPOSITION_CAUSAL_PATH_GUARD_20260930'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact candidate stack
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object canonical/runtime/bound_capabilities/grounded_executable_composition.py)" = "8328e12804f64cab1c0d9509966cb1d2d8fb1f82"
          test "$(git hash-object canonical/tests/test_grounded_executable_composition.py)" = "2492bf47e557b9c2bc90c7cd6345473e734b3cc3"
          test "$(git hash-object canonical/runtime/BOUND_CAPABILITY_REGISTRY_V1.json)" = "36dcf586ab9f234d6ed1276c4a32f5a997e9e88e"
          test "$(git hash-object canonical/runtime/bound_capabilities/evidence_decision_synthesis.py)" = "d7c73c24d2038c40bfb38ea6f10749a15a2d5415"
          test "$(git hash-object canonical/runtime/capability_proposal_generators.py)" = "71f2bbfda66a65d8d75e035b9ae073671ebd56e2"
          test "$(git hash-object canonical/runtime/goal_compiler.py)" = "195d5dd5f4fabb8a897fb6407433e691a8fdaf26"
          echo EXACT_CAUSAL_PATH_GUARD_STACK_PASS
      - name: Run full grounded composition regression file
        shell: bash
        run: |
          set -euo pipefail
          python canonical/tests/test_grounded_executable_composition.py
      - name: Emit validation receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib
          receipt={
            "schema":"PROJECT_BRAIN_COMPOSITION_CAUSAL_PATH_GUARD_VALIDATION_V1",
            "candidate_brain_pr":273,
            "composer_blob":"8328e12804f64cab1c0d9509966cb1d2d8fb1f82",
            "test_blob":"2492bf47e557b9c2bc90c7cd6345473e734b3cc3",
            "explicit_effect_result_path_regression":"PASS",
            "undeclared_provider_backed_path_regression":"PASS",
            "model_dependency_count":0,
            "incremental_spend_usd":0,
            "verdict":"PASS"
          }
          pathlib.Path("COMPOSITION_CAUSAL_PATH_GUARD_VALIDATION.json").write_text(json.dumps(receipt,indent=2,sort_keys=True)+"\n")
          print("COMPOSITION_CAUSAL_PATH_GUARD_PASS")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: composition-causal-path-guard-validation
          path: COMPOSITION_CAUSAL_PATH_GUARD_VALIDATION.json
