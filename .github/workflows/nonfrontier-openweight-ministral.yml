name: Local Open-Weight Planner Qualification

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/nonfrontier-openweight-ministral.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install llama.cpp
        shell: bash
        run: |
          set -euo pipefail
          curl -LsSf https://llama.app/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run exact open-weight planner
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          MODEL='mistralai/Ministral-3-8B-Instruct-2512-GGUF:Q4_K_M'
          PROMPT='You are a bounded planner. Goal: determine the mass of a local file named evidence.json. Allowed actions are read_file, list_tree, search_text, finish. Return exactly one JSON object with keys type,args,why. You have not observed evidence.json yet. Choose the next action.'
          /usr/bin/time -v llama cli -hf "$MODEL" -p "$PROMPT" -n 160 --temp 0 --no-display-prompt > planner.txt 2> planner.stderr
          python - <<'PY'
          import json,re,hashlib,pathlib
          out=pathlib.Path('planner.txt').read_text(errors='replace')
          err=pathlib.Path('planner.stderr').read_text(errors='replace')
          objs=re.findall(r'\{.*?\}',out,re.S)
          parsed=None
          for raw in objs:
              try:
                  x=json.loads(raw)
                  if isinstance(x,dict) and x.get('type') in {'read_file','list_tree','search_text','finish'}:
                      parsed=x; break
              except Exception: pass
          result={
            "schema":"PROJECT_BRAIN_LOCAL_OPENWEIGHT_PLANNER_QUALIFICATION_V1",
            "model":"mistralai/Ministral-3-8B-Instruct-2512-GGUF:Q4_K_M",
            "model_publisher":"Mistral AI",
            "license":"Apache-2.0",
            "frontier_target_supplier":False,
            "incremental_spend_usd":0,
            "output_sha256":hashlib.sha256(out.encode()).hexdigest(),
            "output_excerpt":out[-4000:],
            "stderr_excerpt":err[-5000:],
            "valid_allowed_action":parsed is not None,
            "parsed_action":parsed
          }
          pathlib.Path('LOCAL_OPENWEIGHT_PLANNER_QUALIFICATION.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          print(json.dumps(result,indent=2,sort_keys=True))
          if parsed is None:
              raise SystemExit(2)
          PY
      - name: Upload exact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-openweight-planner-qualification
          path: |
            LOCAL_OPENWEIGHT_PLANNER_QUALIFICATION.json
            planner.stderr
