name: Verify residual frontier authority guard
on:
  pull_request:
    branches: [main]
    paths:
      - 'capsules/residual_frontier_authority_guard/**'
      - '.github/workflows/verify-residual-frontier-authority-guard.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Verify exact Brain blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object capsules/residual_frontier_authority_guard/canonical/runtime/residual_frontier_authority_guard.py)" = "e80a6187fa98a7c79c63dcf2194c0f503f3ce0d7"
          test "$(git hash-object capsules/residual_frontier_authority_guard/canonical/tests/test_residual_frontier_authority_guard.py)" = "e87e19ef99601900d253310956fe95414f726e6c"
          test "$(git hash-object capsules/residual_frontier_authority_guard/canonical/governance/ACTIVE_TERMINAL_PROOF_BASIS_V1.json)" = "9e89fe83077fd0397534f100071343063846edb1"
          test "$(git hash-object capsules/residual_frontier_authority_guard/canonical/governance/GLOBAL_RESIDUAL_PROOF_COMPILER_LIVE_INPUT_V1.json)" = "f2f6f937b86915267480809a410a4d76ec3a2fff"
      - name: Run mutation regression tests
        working-directory: capsules/residual_frontier_authority_guard
        run: python -m unittest -v canonical.tests.test_residual_frontier_authority_guard
      - name: Verify live frontier exactly matches current blocked contracts
        working-directory: capsules/residual_frontier_authority_guard
        shell: bash
        run: |
          set -euo pipefail
          python canonical/runtime/residual_frontier_authority_guard.py             canonical/governance/ACTIVE_TERMINAL_PROOF_BASIS_V1.json             canonical/governance/GLOBAL_RESIDUAL_PROOF_COMPILER_LIVE_INPUT_V1.json             > verdict.json
          python - <<'PY'
          import json
          v=json.load(open("verdict.json", encoding="utf-8"))
          assert v["pass"] is True, v
          assert v["status"] == "PASS__LIVE_RESIDUAL_FRONTIER_EXACTLY_MATCHES_ACTIVE_BLOCKED_CONTRACTS", v
          assert v["blocked_obligation_count"] == 6, v
          assert v["execution_authority"] is False, v
          assert v["capability_credit_delta"] == 0, v
          print(json.dumps(v, indent=2, sort_keys=True))
          PY
