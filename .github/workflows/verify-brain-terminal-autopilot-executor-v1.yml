name: Verify Brain terminal autopilot executor v1

on:
  pull_request:
    branches: [terminal-execution-v1]
    paths:
      - "capsules/terminal_autopilot_executor_v1/**"

permissions:
  contents: read

concurrency:
  group: verify-terminal-autopilot-executor-v1-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify exact mirrored Brain bytes
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, pathlib
          base=pathlib.Path("capsules/terminal_autopilot_executor_v1")
          m=json.loads((base/"MANIFEST.json").read_text())
          assert m["incremental_spend_usd_max"] == 0
          assert m["irreversible_benchmark_autoexecution"] is False
          for rel, meta in m["files"].items():
              raw=(base/"vendor"/rel).read_bytes()
              got=hashlib.sha1(b"blob "+str(len(raw)).encode()+b"\0"+raw).hexdigest()
              assert got == meta["git_blob_sha"], (rel, got, meta["git_blob_sha"])
          print("EXACT_BRAIN_BYTES_PASS")
          PY
      - name: Run planner and executor tests
        env:
          PYTHONPATH: ${{ github.workspace }}/capsules/terminal_autopilot_executor_v1/vendor
        run: |
          set -euo pipefail
          python -m unittest -v \
            canonical.tests.test_terminal_autopilot_v1 \
            canonical.tests.test_terminal_autopilot_executor_v1
