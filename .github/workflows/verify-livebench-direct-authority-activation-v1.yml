name: Verify LiveBench direct activation V1
on:
  pull_request:
    paths:
      - 'subject/livebench_direct_authority_activation_v1/**'
      - 'verify_livebench_direct_authority_activation_v1.py'
      - '.github/workflows/verify-livebench-direct-authority-activation-v1.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python verify_livebench_direct_authority_activation_v1.py
