name: Probe M0A Stanza coreference dev proposal source
on:
  pull_request:
    branches: [main]
    paths:
      - 'verification/m0a_stanza_coref_dev.py'
      - 'verification/m0a_stanza_coref_dev.json'
      - 'verification/m0a_olmo_contrastive_dev.json'
      - '.github/workflows/probe-m0a-stanza-coref-dev.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      HF_HOME: /tmp/hf
      PIP_NO_CACHE_DIR: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch
      - run: python -m pip install --no-cache-dir 'stanza==1.14.0' 'transformers>=4.56,<5' 'peft>=0.17,<1'
      - run: python verification/m0a_stanza_coref_dev.py
