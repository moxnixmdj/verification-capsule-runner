name: Verify batch implication scope firewall v2
on:
  pull_request:
    branches: [main]
    paths:
      - 'capsules/batch_implication_scope_v2/**'
      - '.github/workflows/verify-batch-implication-scope-v2.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact patched Brain blobs and scope firewall
        env:
          EXPECTED_JSON: '{"canonical/runtime/protocol_implication_batch_reducer_v1.py":"2c4fff73dc18fd85b1f7759ff1b8e3c55906af32","canonical/tests/test_protocol_implication_batch_reducer_scope_v2.py":"209a440e6851d9eb655d55a91b36cd91b84f5158","canonical/runtime/protocol_implication_scope_algebra_v2.py":"6aba64c26433b4a8646d5d96bb07e5ba5b46ca1b","canonical/runtime/witness_target_binding_totalizer_v1.py":"9f13232826612b2248274f3e13147767b7c7c8f5"}'
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path('capsules/batch_implication_scope_v2')
          expected=json.loads(os.environ['EXPECTED_JSON'])
          for rel,want in sorted(expected.items()):
              data=(root/rel).read_bytes()
              got=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              assert got==want,(rel,got,want)
          print('BATCH_SCOPE_V2_EXACT_BLOBS_PASS',len(expected))
          PY
          cd capsules/batch_implication_scope_v2
          PYTHONPATH=. python -m py_compile canonical/runtime/protocol_implication_batch_reducer_v1.py
          PYTHONPATH=. python canonical/tests/test_protocol_implication_batch_reducer_scope_v2.py
