name: Verify tool-discovery ceiling transmutation v1

on:
  pull_request:
    paths:
      - 'capsules/tool_discovery_ceiling_transmutation_v1/**'
      - '.github/workflows/verify-tool-discovery-ceiling-transmutation-v1.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact mirrored Brain blob identities
        env:
          EXPECTED_JSON: '{"capsules/tool_discovery_ceiling_transmutation_v1/canonical/runtime/acceptance_proof_transmuter_v1.py":"0580f9819b5465c9617f0a1e8ff9a96902eedfc6","capsules/tool_discovery_ceiling_transmutation_v1/canonical/governance/OPUS55_TERMINAL_PROOF_PROTOCOLS_V1.json":"eb4bca0fe6a015d49d2854998fbe046c979c7ea9","capsules/tool_discovery_ceiling_transmutation_v1/canonical/governance/OPUS55_ACCEPTANCE_PROOF_TRANSMUTATION_INPUT_V1.json":"4e6225fb182e10b0ed8d72d03abcba5ad70461d4","capsules/tool_discovery_ceiling_transmutation_v1/canonical/governance/TOOL_DISCOVERY_ACCEPTANCE_CEILING_WITNESS_V1.json":"60a7c1139cad315d977bf5ed97e708cc5ec3fcc7","capsules/tool_discovery_ceiling_transmutation_v1/canonical/tests/test_terminal_ceiling_witness_transmutation_v1.py":"62e6ac8a6b701cce35614324f2da31345c214cd2","capsules/tool_discovery_ceiling_transmutation_v1/canonical/runtime/terminal_ceiling_witness_lifter_v1.py":"ec98010166db350db81ed01ffc70590805c536a8","capsules/tool_discovery_ceiling_transmutation_v1/canonical/tests/test_terminal_ceiling_witness_lifter_v1.py":"fb73b07792a19ada2ab899cbd96a15420e315e86","capsules/tool_discovery_ceiling_transmutation_v1/canonical/verification/TERMINAL_CEILING_WITNESS_LIFTER_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json":"a1c702c79d2b29bfc9c4d5a238f9c260bc204770"}'
        run: |
          python - <<'PY'
          import json, os, subprocess
          expected=json.loads(os.environ["EXPECTED_JSON"])
          failures=[]
          for path,want in expected.items():
              got=subprocess.check_output(["git","hash-object",path],text=True).strip()
              if got!=want:
                  failures.append(f"{path}: {got} != {want}")
          if failures:
              raise SystemExit("\n".join(failures))
          print(f"EXACT_BLOB_IDENTITY_PASS {len(expected)}/{len(expected)}")
          PY
      - name: Run exact ceiling-transmutation integration tests
        env:
          PYTHONPATH: capsules/tool_discovery_ceiling_transmutation_v1
        run: |
          python -m unittest -v canonical.tests.test_terminal_ceiling_witness_transmutation_v1
      - name: Recompute and assert exact closed family set
        env:
          PYTHONPATH: capsules/tool_discovery_ceiling_transmutation_v1
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from canonical.runtime.acceptance_proof_transmuter_v1 import evaluate
          root=Path("capsules/tool_discovery_ceiling_transmutation_v1")
          protocols=json.loads((root/"canonical/governance/OPUS55_TERMINAL_PROOF_PROTOCOLS_V1.json").read_text())
          inp=json.loads((root/"canonical/governance/OPUS55_ACCEPTANCE_PROOF_TRANSMUTATION_INPUT_V1.json").read_text())
          out=evaluate(protocols,inp)
          assert out["status"]=="PASS", out
          assert out["family_count"]==19, out
          assert out["closed_family_count"]==3, out
          assert out["open_family_count"]==16, out
          closed={r["family"] for r in out["families"] if r["result_status"]=="PASS"}
          expected={"EXACT_SYMBOLIC_COMPUTATION","LONG_HORIZON_MEMORY_AND_CONTINUITY","TOOL_DISCOVERY_SELECTION_AND_LEARNING"}
          assert closed==expected, (closed,expected)
          print(json.dumps({"closed_family_count":3,"open_family_count":16,"closed":sorted(closed)},indent=2))
          PY
      - name: Assert zero new reality
        run: |
          python - <<'PY'
          import json
          p="capsules/tool_discovery_ceiling_transmutation_v1/canonical/verification/TERMINAL_CEILING_WITNESS_LIFTER_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json"
          d=json.load(open(p,encoding="utf-8"))
          assert d["fresh_acceptance_cases_consumed"]==0
          assert d["terminal_results_replayed"]==0
          assert d["incremental_spend_usd"]==0
          print("ZERO_NEW_REALITY_PASS")
          PY
