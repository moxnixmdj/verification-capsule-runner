name: Verify specification consensus segmentation
on:
  pull_request:
    branches: [main]
    paths:
      - 'verification/spec_consensus/**'
      - '.github/workflows/verify-spec-consensus-segmentation.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: |
          cd verification/spec_consensus
          python - <<'PY'
          import test_specification_consensus_gate as t
          for name in sorted(n for n in dir(t) if n.startswith("test_")):
              getattr(t,name)()
              print(name, "PASS")
          PY
