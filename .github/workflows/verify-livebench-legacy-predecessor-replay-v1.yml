name: Verify LiveBench legacy predecessor replay V1

on:
  push:
    branches:
      - verify/livebench-legacy-predecessor-replay-v1-20261004-sol
    paths:
      - subject/livebench_legacy_predecessor_replay_v1/**
      - .github/workflows/verify-livebench-legacy-predecessor-replay-v1.yml

permissions:
  contents: write

concurrency:
  group: livebench-legacy-predecessor-replay-v1
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Verify exact compiler blobs
        shell: bash
        run: |
          set -euo pipefail
          cd subject/livebench_legacy_predecessor_replay_v1
          test "$(git hash-object canonical/runtime/livebench_legacy_visible_constraint_compiler_v1.py)" = "e986035ff68b53c0dc7a7eb478f6e3d8882214aa"
          test "$(git hash-object canonical/runtime/livebench_legacy_visible_constraint_compiler_v2.py)" = "0e7519f4f2b7d40084effc83a5bef814ee7fd487"

      - name: Install parquet reader
        run: python -m pip install --disable-pip-version-check --quiet pyarrow==21.0.0

      - name: Replay exact historical predecessor
        id: replay
        continue-on-error: true
        run: python subject/livebench_legacy_predecessor_replay_v1/verify_predecessor.py

      - name: Commit compact replay receipt to isolated branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          RECEIPT="subject/livebench_legacy_predecessor_replay_v1/livebench_legacy_predecessor_replay_receipt_v1.json"
          test -f "$RECEIPT"
          rm -f subject/livebench_legacy_predecessor_replay_v1/predecessor.parquet
          git config user.name "project-brain-verifier"
          git config user.email "actions@users.noreply.github.com"
          git add "$RECEIPT"
          if git diff --cached --quiet; then
            echo "receipt unchanged"
          else
            git commit -m "Record LiveBench legacy predecessor replay receipt"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Enforce replay result
        if: steps.replay.outcome != 'success'
        run: exit 1
