name: Verify Tool Discovery APT complete interface instance
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Refresh authoritative APT indexes
        run: sudo apt-get update -qq
      - name: Run static adversarial tests
        run: python -m unittest -v canonical.tests.test_tool_discovery_apt_complete_interface_instance_v1
      - name: Qualify one live external interface epoch
        run: |
          python -m canonical.runtime.tool_discovery_apt_complete_interface_instance_v1 > tool-discovery-apt-interface-instance.json
          python - <<'PY'
          import json
          p=json.load(open("tool-discovery-apt-interface-instance.json"))
          assert p["pass"] is True,p
          assert p["status"].startswith("PASS__LIVE_CONTENT_ADDRESSED_APT_DISCOVERY_INTERFACE_INSTANCE"),p
          assert len(p["property_results"])==7,p
          assert all(p["property_results"].values()),p
          assert p["source_count"]>0,p
          assert p["union_unique_tool_identity_count"]>1000,p
          assert p["safe_probe_receipt"]["pass"] is True,p
          assert p["epoch_stable"] is True,p
          assert p["new_reality_units_consumed"]==1,p
          assert p["incremental_spend_usd"]==0,p
          assert p["capability_credit_delta"]==0 and p["family_credit_delta"]==0,p
          PY
      - name: Upload content-addressable interface receipt
        uses: actions/upload-artifact@v4
        with:
          name: tool-discovery-apt-interface-instance-v1
          path: tool-discovery-apt-interface-instance.json
          if-no-files-found: error
