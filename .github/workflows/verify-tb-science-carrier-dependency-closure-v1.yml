name: Verify TB-Science transitive carrier closure v1

on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/tb_science_rank8_20261007_v1/VERIFY_TRANSITIVE_CLOSURE.json"

permissions:
  contents: read

jobs:
  verify-carrier-closure:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact Harbor only
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir -q 'harbor==0.23.0'
          python - <<'PY'
          import importlib.metadata
          assert importlib.metadata.version("harbor")=="0.23.0"
          PY
      - name: Verify exact closed Brain runtime set and import from clean package
        run: |
          set -euo pipefail
          C=capsules/tb_science_rank8_20261007_v1
          declare -A H
          H[harbor_science_agent_v1.py]=5bc8ebac26bb7c809d4698f535eff43b667b30df
          H[harbor_science_planner_v1.py]=c3e36eba57c450f325c8a9476ee048c841bbdbc8
          H[lossless_raw_task_contract_v1.py]=d54d5a2f7efa76b653d288f4f53da4883644baa6
          H[raw_task_acceptance_residual_localizer_v1.py]=f29616cf7726959aa28db4ed6541a9fc0bc2ac76
          H[harbor_environment_transport.py]=ec46f648214a37bb16025d5ef2593efdf59f0d79
          H[harbor_command_policy.py]=a525773417291c7a4841bf35e1baff5370350d0d
          H[explicit_requirement_index_v2.py]=30629b10fdbf3c337eb3252c043ec13123ca66a1
          H[bounded_predicate_argument_semantics.py]=8303231779d6fe8c7fb740e3bbaa492914d4eba9
          H[source_aligned_acceptance_program_v1.py]=742c183cccc2ec4bb5f94e88048590e2991dacd4
          H[source_contract_compiler.py]=ba53b1f1a3c1d8e63c906eb4952c7e9b6aef1231
          rm -rf /tmp/brain-closure
          mkdir -p /tmp/brain-closure/canonical/runtime
          touch /tmp/brain-closure/canonical/__init__.py /tmp/brain-closure/canonical/runtime/__init__.py
          for f in "${!H[@]}"; do
            src="$C/canonical/runtime/$f"
            test "$(git hash-object "$src")" = "${H[$f]}"
            cp "$src" "/tmp/brain-closure/canonical/runtime/$f"
          done
          PYTHONPATH=/tmp/brain-closure python - <<'PY'
          import ast, importlib, json, pathlib, sys
          root=pathlib.Path("/tmp/brain-closure")
          runtime=root/"canonical"/"runtime"
          files=sorted(runtime.glob("*.py"))
          missing=[]
          for path in files:
              if path.name=="__init__.py": continue
              tree=ast.parse(path.read_text(), filename=str(path))
              for node in ast.walk(tree):
                  if isinstance(node,ast.ImportFrom) and node.module and node.module.startswith("canonical.runtime"):
                      if node.module=="canonical.runtime":
                          for alias in node.names:
                              candidate=runtime/(alias.name+".py")
                              if not candidate.exists():
                                  missing.append(f"{path.name}:canonical.runtime.{alias.name}")
                      else:
                          suffix=node.module.removeprefix("canonical.runtime.").replace(".","/")+".py"
                          if not (runtime/suffix).exists():
                              missing.append(f"{path.name}:{node.module}")
                  elif isinstance(node,ast.Import):
                      for alias in node.names:
                          if alias.name.startswith("canonical.runtime."):
                              suffix=alias.name.removeprefix("canonical.runtime.").replace(".","/")+".py"
                              if not (runtime/suffix).exists():
                                  missing.append(f"{path.name}:{alias.name}")
          assert not missing, missing
          mod=importlib.import_module("canonical.runtime.harbor_science_agent_v1")
          assert hasattr(mod,"HarborScienceAgent")
          contract=importlib.import_module("canonical.runtime.lossless_raw_task_contract_v1")
          localizer=importlib.import_module("canonical.runtime.raw_task_acceptance_residual_localizer_v1")
          result={
            "schema":"PROJECT_BRAIN_TB_SCIENCE_CARRIER_DEPENDENCY_CLOSURE_PUBLIC_REPLAY_V1",
            "status":"PASS__EXACT_TRANSITIVE_CANONICAL_RUNTIME_IMPORT_CLOSURE__ZERO_TASK_EXPOSURE",
            "harbor_version":"0.23.0",
            "exact_runtime_file_count":10,
            "missing_canonical_runtime_imports":missing,
            "agent_importable":hasattr(mod,"HarborScienceAgent"),
            "contract_importable":hasattr(contract,"compile_contract"),
            "localizer_importable":hasattr(localizer,"localize"),
            "benchmark_task_exposure":0,
            "verifier_invocations":0,
            "incremental_spend_usd":0,
            "terminal_credit":False
          }
          pathlib.Path("TB_SCIENCE_CARRIER_DEPENDENCY_CLOSURE_VERIFICATION.json").write_text(json.dumps(result,indent=2,sort_keys=True)+"\n")
          print(json.dumps(result,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tb-science-carrier-dependency-closure-v1
          path: TB_SCIENCE_CARRIER_DEPENDENCY_CLOSURE_VERIFICATION.json
          retention-days: 1
