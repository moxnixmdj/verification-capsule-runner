name: Verify P1 universal scope restoration V9

on:
  push:
    branches: ["verify/p1-universal-scope-restoration-v9-20261003-sol"]
    paths:
      - ".github/workflows/verify-p1-universal-scope-restoration-v9.yml"
      - "capsules/p1_universal_scope_restoration_v9/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/verify-p1-universal-scope-restoration-v9.yml"
      - "capsules/p1_universal_scope_restoration_v9/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bind exact candidate and source receipts
        run: |
          set -euo pipefail
          C=capsules/p1_universal_scope_restoration_v9
          test "$(git hash-object "$C/canonical/runtime/p1_universal_scope_restoration_v9.py")" = "cfb2336291112eff247ae74b7a5e381fc9009317"
          test "$(git hash-object "$C/canonical/tests/test_p1_universal_scope_restoration_v9.py")" = "192fa292d38feefb1eeefe52e8104cd39502a502"
          test "$(git hash-object "$C/canonical/governance/P1_UNIVERSAL_SCOPE_RESTORATION_V9_CANDIDATE.json")" = "6ebaed1262bed76f003c2a337e3a80b3b099e9e0"
          test "$(git hash-object "$C/canonical/governance/P1_TRAJECTORY_T0_T2_MULTIPLEX_TERMINAL_BINDING_V1.json")" = "8703c6aa08227467a619a7ae90d0d61f8e54da39"
          test "$(git hash-object "$C/canonical/governance/BEHAVIORAL_CONTRACT_REGISTRY_V1.json")" = "ee187f611a0e82b2de495ee377682f39bc31dd31"
          test "$(git hash-object "$C/canonical/verification/P1_V7_CURRENT_MAIN_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json")" = "4e8cf594503a216302a1d61c2009945131d86041"
          test "$(git hash-object "$C/canonical/verification/P1_V7_PROVENANCE_AND_MINIMUM_REALITY_PUBLIC_RUNNER_VERIFICATION_20261003_V1.json")" = "01ca625add4db7035224f0d4cb9efb406d17362d"
          test "$(git hash-object "$C/canonical/verification/P1_TYPED_CAUSAL_INTERVENTION_V6_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json")" = "1e722621db8f0f1cb3b9689e48d4bfe356dcb36e"
          test "$(git hash-object "$C/canonical/verification/P1_TERMINAL_EXECUTION_SCOPE_AUDIT_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json")" = "89836565c384ac95ac426fe88ffb6200f818496f"
          test "$(git hash-object "$C/canonical/verification/TERMINAL_V3_POSTWAVE_CONTRACT_AND_FAMILY_REDUCTION_20261002_V1.json")" = "51e3e7578e9adbeee2168d2223b84481fea16a09"
          test "$(git hash-object "$C/canonical/verification/TERMINAL_SCOPE_QUARANTINE_PROPAGATION_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json")" = "8c1a4db776e419ebb263da9f781245dd6491ea2f"
          test "$(git hash-object "$C/canonical/verification/P1_UNIVERSAL_GENERATOR_TRANSPORT_SCOPE_REDUCTION_PUBLIC_RUNNER_VERIFICATION_20261003_V1.json")" = "f327bfdb5d52bb9551b52f67da14a4cd425533a3"

      - name: Prove contaminated recovery receipt is not a dependency
        run: |
          set -euo pipefail
          C=capsules/p1_universal_scope_restoration_v9
          ! grep -R -F 'P1_PUBLIC_RECOVERY_RESULT_INDEPENDENT_ADJUDICATION' "$C/canonical/runtime/p1_universal_scope_restoration_v9.py"
          ! grep -R -F '37108111537' "$C/canonical/runtime/p1_universal_scope_restoration_v9.py"

      - name: Run fail-closed reducer tests and live reduction
        run: |
          set -euo pipefail
          C="$GITHUB_WORKSPACE/capsules/p1_universal_scope_restoration_v9"
          PYTHONPATH="$C" python -m unittest -v canonical.tests.test_p1_universal_scope_restoration_v9
          PYTHONPATH="$C" python -m canonical.runtime.p1_universal_scope_restoration_v9 > P1_V9_RESULT.json

      - name: Independently adjudicate exact reduction output
        run: |
          set -euo pipefail
          python - <<'PY' | tee P1_V9_INDEPENDENT_VERDICT.json
          import json
          x=json.load(open("P1_V9_RESULT.json"))
          assert x["pass"] is True,x
          assert x["status"].startswith("PASS__P1_WHOLE_FROZEN_SCOPE_RESTORED"),x
          assert x["transport_requirements_discharged"]==sorted([
            "P1_FAILURE_SEMANTICS_TRANSPORT_CURSORBENCH",
            "P1_FAILURE_SEMANTICS_TRANSPORT_FRONTIERCODE",
            "P1_FAILURE_SEMANTICS_TRANSPORT_RECOVERY_SCOPE_COMPOSITION",
          ]),x
          assert x["whole_p1_contract_restored"] is True
          assert x["p1_scope_quarantine_clearable"] is True
          assert x["contract_accounting"]=={"whole_scope_pass_count":12,"whole_scope_quarantined_count":0}
          assert x["behavioral_family_accounting"]["provisional_behavioral_pass_count"]==19
          assert x["behavioral_family_accounting"]["quarantined_family_count"]==0
          assert len(x["behavioral_family_accounting"]["reactivated_families"])==8
          assert x["quarantined_execution_used_as_proof"] is False
          assert x["source_fresh_reality_units_consumed"]==0
          assert x["restoration_new_reality_units_consumed"]==0
          assert x["terminal_results_replayed"]==0
          assert x["incremental_spend_usd"]==0
          assert x["opus55_acceptance_credit_delta"]==0
          assert x["capability_credit_delta"]==0
          assert x["family_credit_delta"]==0
          assert x["execution_authority"] is False and x["promotion_authority"] is False
          out={
            "schema":"PROJECT_BRAIN_P1_UNIVERSAL_SCOPE_RESTORATION_V9_PUBLIC_RUNNER_VERIFICATION",
            "status":"INDEPENDENT_PASS__P1_WHOLE_SCOPE_RESTORABLE__12_OF_12_CONTRACTS__19_OF_19_PROVISIONAL_BEHAVIORAL_ROWS__ZERO_REALITY__ZERO_OPUS55_CREDIT",
            "reducer_blob":"cfb2336291112eff247ae74b7a5e381fc9009317",
            "universal_scope_receipt_blob":"f327bfdb5d52bb9551b52f67da14a4cd425533a3",
            "whole_scope_contract_pass_count":12,
            "provisional_behavioral_family_pass_count":19,
            "reactivated_family_count":8,
            "quarantined_execution_used_as_proof":False,
            "new_reality_units_consumed":0,
            "terminal_results_replayed":0,
            "incremental_spend_usd":0,
            "opus55_acceptance_credit_delta":0,
            "promotion_authority":False
          }
          print(json.dumps(out,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: p1-universal-scope-restoration-v9
          path: |
            P1_V9_RESULT.json
            P1_V9_INDEPENDENT_VERDICT.json
          if-no-files-found: error
