name: Verify Exact PR261 Grounding Proposal Binding
on:
  push:
    branches:
      - verify/pr261-grounding-proposal-binding-contract-20260930
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact PR261 blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object canonical/runtime/bound_capabilities/plain_goal_bound_grounding.py)" = "6385b469f1287c971217dcac58af2ffebd81f9fd"
          test "$(git hash-object canonical/runtime/bound_capabilities/grounded_executable_composition.py)" = "3b35cf65100a51276b528f542a066b078dc7116f"
          test "$(git hash-object canonical/runtime/bound_capabilities/grounded_executable_composition_verify.py)" = "dd18074197d28abd267859dfe709baa28b4a8dfe"
          test "$(git hash-object canonical/tests/test_grounding_proposal_binding_contract.py)" = "e0844d07a11bed7f9a353199db80cd095605814f"
          test "$(git hash-object canonical/tests/test_grounded_executable_composition.py)" = "1b8efc0073179dae16ef22185475f7a065ac3cea"
          test "$(git hash-object canonical/tests/test_plain_goal_bound_grounding.py)" = "03fe93ded7207f584266e420192eef2a3a8a166c"
          test "$(git hash-object canonical/runtime/capability_proposal_generators.py)" = "71f2bbfda66a65d8d75e035b9ae073671ebd56e2"
          test "$(git hash-object canonical/runtime/goal_compiler.py)" = "195d5dd5f4fabb8a897fb6407433e691a8fdaf26"
          test "$(git hash-object canonical/runtime/capability_planner.py)" = "64ff65cb184f50d3336326f33cccfcc0a53301a8"
          test "$(git hash-object canonical/runtime/BOUND_CAPABILITY_REGISTRY_V1.json)" = "82514d06b45c72f04cdaea316d872609559a53a4"
      - name: Compile exact candidate
        run: |
          python -m py_compile             canonical/runtime/bound_capabilities/plain_goal_bound_grounding.py             canonical/runtime/bound_capabilities/grounded_executable_composition.py             canonical/runtime/bound_capabilities/grounded_executable_composition_verify.py
      - name: Run generic proposal-binding regression
        run: python -m unittest canonical.tests.test_grounding_proposal_binding_contract -v
      - name: Run prior composition regressions
        run: |
          python -m unittest             canonical.tests.test_grounded_executable_composition             canonical.tests.test_plain_goal_bound_grounding -v
