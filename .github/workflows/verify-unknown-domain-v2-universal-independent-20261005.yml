name: Verify Unknown-Domain V2 universal theorem independently
on:
  pull_request:
    branches: [main]
    paths:
      - 'verify_unknown_domain_direct_v2_universal_independent_20261005.py'
      - 'subject/unknown_domain_direct_v2_universal_independent_20261005/**'
      - '.github/workflows/verify-unknown-domain-v2-universal-independent-20261005.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run independent algebraic and end-to-end verification
        run: python verify_unknown_domain_direct_v2_universal_independent_20261005.py
      - name: Upload independent receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unknown-domain-v2-independent-universal-verification-v1
          path: unknown_domain_direct_v2_independent_universal_verification_v1.json
          if-no-files-found: error
