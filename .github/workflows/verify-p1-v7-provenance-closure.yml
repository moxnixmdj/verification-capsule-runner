name: Verify P1 V7 provenance mutation closure
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run tests
        run: python -m unittest -v canonical.tests.test_p1_v7_provenance_mutation_closure_v1
      - name: Run audit
        run: python canonical/runtime/p1_v7_provenance_mutation_closure_v1.py
