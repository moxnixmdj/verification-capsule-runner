name: Verify P1 V7 provenance closure and minimum reality cut
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify V7 provenance mutation closure
        run: |
          python -m unittest -v canonical.tests.test_p1_v7_provenance_mutation_closure_v1
          python -m canonical.runtime.p1_v7_provenance_mutation_closure_v1
      - name: Verify exact minimum reality cut
        run: |
          python -m unittest -v canonical.tests.test_p1_minimum_reality_cut_verifier_v1
          python -m canonical.runtime.p1_minimum_reality_cut_verifier_v1
