name: Verify TB-Science population and scorer
on:
  push:
    branches: ["verify-tb-science-population-score-v1-20261003"]
    paths:
      - "verify_tb_science_population_scorer_v1.py"
      - ".github/workflows/verify-tb-science-population-scorer-v1.yml"
  pull_request:
    branches: [main]
    paths:
      - "verify_tb_science_population_scorer_v1.py"
      - ".github/workflows/verify-tb-science-population-scorer-v1.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch frozen TB-Science metadata only
        run: |
          set -euo pipefail
          git init /tmp/tbs
          git -C /tmp/tbs remote add origin https://github.com/harbor-framework/terminal-bench-science.git
          git -C /tmp/tbs fetch --depth 1 origin f81afac4f11048e77a15dfc8fb1dbfb897fea0ce
          git -C /tmp/tbs checkout --detach FETCH_HEAD
          test "$(git -C /tmp/tbs rev-parse HEAD)" = "f81afac4f11048e77a15dfc8fb1dbfb897fea0ce"
          test "$(git -C /tmp/tbs hash-object tasks/dataset.toml)" = "b506a7777d2dd5ae3e70c590366ceac4ee59ae28"
          test "$(git -C /tmp/tbs hash-object README.md)" = "7411791c338ede3e125bc207358bbcda804b24cf"
          test "$(git -C /tmp/tbs hash-object .github/workflows/run-trials.yml)" = "84d3c4ec560c0d87f3687819d1d07e9c92c982ed"
      - name: Fetch first-party Opus 5.5 benchmark reference
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --silent --show-error -A 'Mozilla/5.0 ProjectBrainVerifier/1.0'             https://www.anthropic.com/claude-opus-5-5 -o /tmp/opus55.html
          test -s /tmp/opus55.html
      - name: Verify population scorer and exact integer locks
        run: |
          set -euo pipefail
          python verify_tb_science_population_scorer_v1.py /tmp/tbs /tmp/opus55.html
      - name: Enforce zero-case boundary
        run: |
          python - <<'PY'
          import json
          j=json.load(open("TB_SCIENCE_POPULATION_SCORER_BINDING_V1.json"))
          assert j["terminal_task_instruction_files_read"]==0
          assert j["terminal_trials_executed"]==0
          assert j["terminal_results_observed"]==0
          assert j["population"]["trial_slots"]==210
          assert j["scoring"]["required_successes"]==124
          assert j["scoring"]["fail_lock"]=="FAILURE_COUNT_GTE_87"
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tb-science-population-scorer-binding-v1
          path: TB_SCIENCE_POPULATION_SCORER_BINDING_V1.json
