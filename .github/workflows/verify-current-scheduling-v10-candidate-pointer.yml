name: Verify current scheduling V10 candidate pointer
on:
  push:
    branches:
      - verify/current-scheduling-pointer-v10-candidate-20261003
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python verify_current_scheduling_pointer_v10_candidate.py
