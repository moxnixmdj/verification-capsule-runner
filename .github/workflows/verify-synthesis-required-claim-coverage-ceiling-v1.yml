name: Verify synthesis required-claim-coverage ceiling v1
on:
  pull_request:
    branches: [main]
    paths:
      - 'capsules/synthesis_required_claim_coverage_ceiling_v1/**'
      - '.github/workflows/verify-synthesis-required-claim-coverage-ceiling-v1.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact Brain snapshot, ceiling proof, and scope firewall
        env:
          EXPECTED_JSON: '{"canonical/governance/OPUS55_SYNTHESIS_REQUIRED_CLAIM_COVERAGE_CEILING_LIFT_V1.json":"559e1548790af4fccf19150a81419f1d39fa5b8d","canonical/governance/CONTRACT_NATIVE_ABSOLUTE_PROOF_SUITES_V1.json":"d8cf10dfbe041f63a43ccf43bd5dcdc8fe6f9e2b","canonical/verification/TERMINAL_V3_ONE_SHOT_WAVE_RESULT_20261002_V1.json":"bd86b4c53992b47a4a60b64a60ba03db9a442cfc","canonical/verification/TERMINAL_V3_POSTWAVE_CONTRACT_AND_FAMILY_REDUCTION_20261002_V1.json":"51e3e7578e9adbeee2168d2223b84481fea16a09","canonical/governance/OPUS55_MATCHED_TARGET_NORMALIZATION_CANDIDATE_V1.json":"515f24f3000218d324be4a7c774b42f790a6ebaa","canonical/verification/OPUS55_SYNTHESIS_WITNESS_TARGET_BINDING_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json":"64ad40c1c10bd01e4c0f4418fac29efafea838fc","canonical/verification/OPUS55_SYNTHESIS_IMPLICATION_RESIDUAL_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json":"ea0abdebe8e492033aad818660709b074d870dd9","canonical/verification/OPUS55_SYNTHESIS_IMPLICATION_RESIDUAL_PUBLIC_RUNNER_VERIFICATION_20261002_V2.json":"c9a3046dd5a409379d675051861600919c3017fb","canonical/runtime/synthesis_required_claim_coverage_ceiling_lift_verifier_v1.py":"5e4800b36beb3a25fa1d18bbb78d8549c9346c5f","canonical/tests/test_synthesis_required_claim_coverage_ceiling_lift_v1.py":"f74d40b2a7e7eca365849c74b02540c634cfa0cf"}'
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path('capsules/synthesis_required_claim_coverage_ceiling_v1')
          expected=json.loads(os.environ['EXPECTED_JSON'])
          for rel,want in sorted(expected.items()):
              data=(root/rel).read_bytes()
              got=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              assert got==want,(rel,got,want)
          print('SYNTHESIS_COVERAGE_CEILING_EXACT_10_OF_10_BLOBS_PASS')
          v2=json.loads((root/'canonical/verification/OPUS55_SYNTHESIS_IMPLICATION_RESIDUAL_PUBLIC_RUNNER_VERIFICATION_20261002_V2.json').read_text())
          assert v2['result']['missing_scope_relation'] is True
          assert v2['result']['implies_target'] is False
          print('SYNTHESIS_SCOPE_FIREWALL_REMAINS_OPEN')
          PY
          cd capsules/synthesis_required_claim_coverage_ceiling_v1
          PYTHONPATH=. python canonical/runtime/synthesis_required_claim_coverage_ceiling_lift_verifier_v1.py
          PYTHONPATH=. python -m unittest canonical.tests.test_synthesis_required_claim_coverage_ceiling_lift_v1 -v
