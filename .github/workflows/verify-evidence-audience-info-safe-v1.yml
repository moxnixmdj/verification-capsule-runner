name: Verify bounded evidence-to-audience route
on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/runtime/evidence_audience_information_safe_proof_v1.py'
      - 'canonical/runtime/evidence_audience_information_safe_candidate_v1.py'
      - 'canonical/runtime/bounded_claim_support.py'
      - 'canonical/tests/test_evidence_audience_information_safe_v1.py'
      - '.github/workflows/verify-evidence-audience-info-safe-v1.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run exact boundary tests
        run: PYTHONPATH=. python -m unittest -v canonical.tests.test_evidence_audience_information_safe_v1
      - name: Run fresh 1024-case raw-evidence grid
        env:
          PROJECT_BRAIN_POST_FREEZE_SEED: ${{ github.run_id }}
        run: |
          PYTHONPATH=. python - <<'PY'
          import os, random
          from canonical.runtime.evidence_audience_information_safe_proof_v1 import generate_case, public_task, score_case
          from canonical.runtime.evidence_audience_information_safe_candidate_v1 import solve
          root=int(os.environ["PROJECT_BRAIN_POST_FREEZE_SEED"])
          rng=random.Random(root)
          failures=[]
          for i in range(1024):
              seed=rng.randrange(1,2**31)
              unsupported=(i%5==0)
              case=generate_case(seed,unsupported=unsupported)
              public=public_task(case)
              if "_oracle" in public:
                  failures.append((i,seed,"ORACLE_LEAK")); continue
              if any(set(row)!={"evidence_id","text"} for row in public["task"]["evidence"]):
                  failures.append((i,seed,"RELATION_LABEL_LEAK")); continue
              out=solve(public)
              verdict=score_case(case,out)
              if not verdict.get("pass"):
                  failures.append((i,seed,verdict,out))
          print({"root_seed":root,"cases":1024,"failure_count":len(failures),"failures":failures[:20]})
          if failures: raise SystemExit(1)
          PY
