name: Guarded PR468 Multiclause Routing Qualification

on:
  push:
    branches:
      - qualify/brain-pr468-multiclause-routing-v1
    paths:
      - .github/workflows/guarded-pr468-multiclause-routing-qualification.yml

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact pushed head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'

      - name: Generate exact guarded qualification plan
        run: python qualification/pr468/generate_guarded_plan.py

      - name: Admit once and independently qualify exact PR468 bytes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python execution_guard/github_actions_guarded_run_live.py --plan guarded_pr468_multiclause_routing_plan.json --receipt guarded-pr468-admission.json

      - name: Upload exact qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: guarded-pr468-multiclause-routing-evidence
          path: |
            guarded-pr468-admission.json
            guarded_pr468_multiclause_routing_plan.json
            qualification/pr468/authority.json
            qualification/pr468/pr468-independent-report.json
          if-no-files-found: warn
