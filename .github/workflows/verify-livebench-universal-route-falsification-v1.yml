name: Verify LiveBench universal-route falsification V1

on:
  pull_request:
    branches: [main]
    paths:
      - 'verify_livebench_universal_route_falsification_v1.py'
      - '.github/workflows/verify-livebench-universal-route-falsification-v1.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact checker dependencies
        run: |
          python -m pip install --disable-pip-version-check nltk==3.10.3 langdetect==1.0.9 immutabledict==4.2.2
      - name: Checkout pinned LiveBench sources
        run: |
          set -euo pipefail
          rm -rf /tmp/LiveBench /tmp/LiveBenchGen /tmp/nltk_data_repo /tmp/nltk_data
          git init /tmp/LiveBench
          git -C /tmp/LiveBench remote add origin https://github.com/LiveBench/LiveBench.git
          git -C /tmp/LiveBench fetch --depth 1 origin 8f8e5c381a16e3f24257776edd53471fe86f8091
          git -C /tmp/LiveBench checkout --detach FETCH_HEAD
          git init /tmp/LiveBenchGen
          git -C /tmp/LiveBenchGen remote add origin https://github.com/LiveBench/LiveBench.git
          git -C /tmp/LiveBenchGen fetch --depth 1 origin 686be1e78a0ba8036d7e355bc406e1a265da5292
          git -C /tmp/LiveBenchGen checkout --detach FETCH_HEAD
          git clone --filter=blob:none --no-checkout https://github.com/nltk/nltk_data.git /tmp/nltk_data_repo
          git -C /tmp/nltk_data_repo checkout 550b6625bcef1f2abff2ff770a5a0d272c9c6b2a -- packages/tokenizers/punkt.zip packages/tokenizers/punkt_tab.zip
          mkdir -p /tmp/nltk_data/tokenizers
          unzip -q /tmp/nltk_data_repo/packages/tokenizers/punkt.zip -d /tmp/nltk_data/tokenizers
          unzip -q /tmp/nltk_data_repo/packages/tokenizers/punkt_tab.zip -d /tmp/nltk_data/tokenizers
      - name: Verify falsification
        env:
          NLTK_DATA: /tmp/nltk_data
        run: python verify_livebench_universal_route_falsification_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: livebench-universal-route-falsification-v1
          path: livebench_universal_route_falsification_receipt.json
