name: Diagnose Retrieval V14 Maven misses
on:
  push:
    branches:
      - verify/retrieval-v14-maven-diagnostic-20261004
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: PYTHONPATH=. python diagnose_retrieval_v14_maven.py
