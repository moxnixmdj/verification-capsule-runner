name: Verify Unknown-Domain role-signature V3

on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/runtime/unknown_domain_direct_candidate_v3.py'
      - 'canonical/tests/test_unknown_domain_direct_candidate_v3.py'
      - 'canonical/governance/UNKNOWN_DOMAIN_DIRECT_ROLE_SIGNATURE_V3_CANDIDATE_20261005_V1.json'
      - 'verify_unknown_domain_role_signature_v3.py'
      - '.github/workflows/verify-unknown-domain-role-signature-v3.yml'
      - 'canonical/runtime/unknown_domain_direct_candidate_v1.py'
      - 'canonical/runtime/unknown_domain_direct_candidate_v2.py'
      - 'canonical/runtime/unknown_domain_direct_hidden_generator_v1.py'
      - 'canonical/runtime/unknown_domain_direct_hidden_generator_v2.py'
      - 'canonical/runtime/unknown_domain_direct_hidden_scorer_v1.py'
      - 'canonical/runtime/unknown_domain_direct_execution_harness_v1.py'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run independent V3 verifier
        run: python verify_unknown_domain_role_signature_v3.py
      - name: Run V3 regression tests
        run: python -m unittest canonical.tests.test_unknown_domain_direct_candidate_v3 -v
