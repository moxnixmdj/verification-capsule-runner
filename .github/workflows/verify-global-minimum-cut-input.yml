name: Verify global minimum reality cut input
on:
  pull_request:
    branches: [main]
    paths:
      - 'verification/minimum_reality_cut.py'
      - 'verification/global_minimum_cut_input.json'
      - 'verification/test_global_minimum_cut_input.py'
      - '.github/workflows/verify-global-minimum-cut-input.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: cd verification && python3 -m unittest -v test_global_minimum_cut_input.py
