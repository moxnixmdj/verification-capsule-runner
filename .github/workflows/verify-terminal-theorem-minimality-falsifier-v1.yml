name: Independently verify terminal theorem minimality falsifier V1

on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/terminal_theorem_minimality_falsifier_v1/**"
      - ".github/workflows/verify-terminal-theorem-minimality-falsifier-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
      - run: python -m py_compile capsules/terminal_theorem_minimality_falsifier_v1/subject.py capsules/terminal_theorem_minimality_falsifier_v1/tests.py capsules/terminal_theorem_minimality_falsifier_v1/verify.py
      - run: python capsules/terminal_theorem_minimality_falsifier_v1/verify.py
