name: Run ca16 World Bank Open-Ended Task A Once

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  execute-once:
    if: github.head_ref == 'execute/ca16-worldbank-openended-taska-once-20260930-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      ASTRA_DISABLE_MODEL_PLANNER: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout exact PR head, never merge ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Refresh Ubuntu package metadata
        run: sudo apt-get update
      - name: Execute canonical runtime mission exactly once
        id: parent_task
        continue-on-error: true
        run: python run_ca16_worldbank_openended_taska_once.py
      - name: Upload terminal producer and oracle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ca16-worldbank-openended-taska-terminal
          path: ca16-worldbank-openended-taska-terminal.json
          if-no-files-found: error
      - name: Preserve semantic failure
        if: steps.parent_task.outcome != 'success'
        run: exit 1
