name: Verify PR329 Provenance and Target Mirror
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run exact PR329 runtime provenance regressions
        run: PYTHONPATH=. python canonical/tests/test_runtime_cognition_provenance.py
      - name: Run exact PR329 target mirror regressions
        run: PYTHONPATH=. python canonical/tests/test_frontier_target_mirror.py
      - name: Run exact PR329 target mirror firewall regressions
        run: PYTHONPATH=. python canonical/tests/test_frontier_target_mirror_firewall.py
