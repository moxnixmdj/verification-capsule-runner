name: Qualify PR444 Claim Spec Operand Binding
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Verify exact candidate blobs
        run: |
          set -euo pipefail
          test "$(git hash-object canonical/runtime/bound_capabilities/objective_claim_operand_binding.py)" = "0039d1faff31391b1f0ee87d79f2626119fd9d23"
          test "$(git hash-object canonical/tests/test_objective_claim_operand_binding.py)" = "a5a3b6623e1a87a5ff75699b44ebe3c0fd8a392a"
          test "$(git hash-object canonical/runtime/bound_capabilities/generic_evidence_claim_relation.py)" = "d66a7eb30774f66160b698d8082947776888293d"
      - name: Run authored fail-closed regressions
        run: python canonical/tests/test_objective_claim_operand_binding.py
      - name: Run independent fresh live cross-domain qualification
        run: python qualify_pr444_claim_spec_operand_binding.py
