name: Verify structured method scope gate v2
on:
  pull_request:
    branches: [main]
    paths:
      - capsules/structured_scope_gate_v2/**
      - .github/workflows/verify-structured-scope-gate-v2.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cd capsules/structured_scope_gate_v2 && PYTHONPATH=. python -m unittest -v canonical.tests.test_structured_method_scope_gate_v2
