name: Verify synthesis proof obligation delta v1

on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/synthesis_proof_obligation_delta_v1/**"
      - ".github/workflows/verify-synthesis-proof-obligation-delta-v1.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact open synthesis residual
        run: |
          cd capsules/synthesis_proof_obligation_delta_v1
          export PYTHONPATH=.
          python -m py_compile canonical/runtime/proof_obligation_delta_compiler_v1.py
          python -m py_compile canonical/runtime/synthesis_proof_obligation_delta_verifier_v1.py
          python -m unittest canonical.tests.test_synthesis_proof_obligation_delta_verifier_v1 -v
          python canonical/runtime/synthesis_proof_obligation_delta_verifier_v1.py
