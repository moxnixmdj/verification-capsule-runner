name: Parent Demography Task B Source Preflight
on:
  push:
    branches:
      - preflight/parent-demography-cagr-20260930-v1
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify frozen task blob and exact source schemas
        run: |
          set -euo pipefail
          test "$(git hash-object canonical/tasks/PARENT_DEMOGRAPHY_FRANCE_GROWTH_CROSSCHECK_REAL_TASK_20260930_001.json)" = "dd101ea930f1405e3a9424a03a11808053f99e6d"
          python - <<'PY'
          import json,pathlib,urllib.request
          p=pathlib.Path("canonical/tasks/PARENT_DEMOGRAPHY_FRANCE_GROWTH_CROSSCHECK_REAL_TASK_20260930_001.json")
          task=json.loads(p.read_text())
          report={"schema":"PROJECT_BRAIN_PARENT_DEMOGRAPHY_SOURCE_PREFLIGHT_V1","task_id":task["task_id"],"sources":[],"answer_computed":False}
          for name,spec in task["sources"].items():
              req=urllib.request.Request(spec["url"],headers={"User-Agent":"ProjectBrain-Demography-Preflight/1"})
              with urllib.request.urlopen(req,timeout=30) as r:
                  raw=r.read(2_000_000)
                  status=r.status
              data=json.loads(raw.decode("utf-8"))
              cur=data
              for key in spec["json_path"]:
                  cur=cur[key]
              ok=isinstance(cur,(int,float)) and not isinstance(cur,bool)
              report["sources"].append({"name":name,"http_status":status,"json_path":spec["json_path"],"numeric_value_present":ok})
              if status!=200 or not ok:
                  raise SystemExit(1)
          pathlib.Path("PARENT_DEMOGRAPHY_SOURCE_PREFLIGHT.json").write_text(json.dumps(report,indent=2,sort_keys=True)+"\n")
          print(json.dumps(report,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: parent-demography-source-preflight
          path: PARENT_DEMOGRAPHY_SOURCE_PREFLIGHT.json
          if-no-files-found: error
