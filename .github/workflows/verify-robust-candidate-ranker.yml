name: Verify Brain robust candidate ranker
on:
  pull_request:
    branches: [main]
    paths:
      - 'verification/robust_anomaly_candidate_ranker.py'
      - 'verification/test_robust_anomaly_candidate_ranker.py'
      - '.github/workflows/verify-robust-candidate-ranker.yml'
permissions:
  contents: read
jobs:
  differential:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --quiet numpy scikit-learn
      - run: PYTHONPATH=. python -m unittest -v verification.test_robust_anomaly_candidate_ranker
