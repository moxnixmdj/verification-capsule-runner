name: verify-arena-public-semantics-truth-repair-active-v1
on:
  push:
    branches:
      - verify/arena-public-semantics-truth-repair-active-v1
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python verify_arena_public_semantics_truth_repair_active_v1.py
