name: Execute TB-Science rank14 v2 post-repair one-shot isolated

on:
  pull_request:
    branches: [terminal-execution-v1]
    paths:
      - "capsules/tb_science_rank14_20261009_v1/ACTIVATE_RANK14_V2_PR.json"

permissions:
  contents: read

concurrency:
  group: tb-science-rank14-v2-postrepair-one-shot
  cancel-in-progress: false

jobs:
  terminal-slot:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      C: capsules/tb_science_rank14_20261009_v1
      MODEL_FILE: Qwen3.5-9B-M-TS-Q4_K_M.gguf
      MODEL_SHA256: f41c0a0c0e43bf721fb2da29374cd1a97271bac0bab08a9dc42964525e82350c
      LLAMA_CPP_REV: bec4772f6a2527d371557b5d2032641e5ff7619c
      RELEASE_TAG: brain-capability-qwen35-9b-m-exact-v1
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pre-exposure exact authority V2, fresh lease, repair, and V10 closure
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$GITHUB_EVENT_NAME" = "pull_request"
          test "$GITHUB_BASE_REF" = "terminal-execution-v1"
          test "$GITHUB_HEAD_REF" = "execute/tb-science-rank14-v2-postrepair-20261009"

          test "$(git hash-object "$C/TB_SCIENCE_RANK14_ONE_SLOT_EXECUTION_AUTHORITY_20261009_V2.json")" = "7a4899ce37c97a806c081bd660aaa644e3f64ecb"
          test "$(git hash-object "$C/ACTION_INTENT_TB_SCIENCE_RANK14_POSTREPAIR_REAUTHORIZE_20261009_V1.json")" = "ae89489197b51a0abaf5b7943861f1d6e9cd3675"
          test "$(git hash-object "$C/TB_SCIENCE_RANK14_AUTHORITY_V2_POSTREPAIR_PUBLIC_VERIFICATION_20261009_V1.json")" = "bfb02e03b34974a9efdece47699235b28af5b36f"
          test "$(git hash-object "$C/TB_SCIENCE_RANK14_ONE_SLOT_EXECUTION_AUTHORITY_CANDIDATE_20261009_V2.json")" = "614eeefce5987e1574dbdfa2eb0c749251fe51af"
          test "$(git hash-object "$C/TB_SCIENCE_CURRENT_SLOT_LEDGER_RECONCILIATION_20261009_V17.json")" = "b57989db7874cad9fa13306a0a1e0f9f2dcc42fe"
          test "$(git hash-object "$C/TB_SCIENCE_TERMINAL_EXECUTION_MANIFEST_V1.json")" = "6dfa880b1f68881531afbba6ca211681801fd19b"
          test "$(git hash-object "$C/TB_SCIENCE_TRANSITIVE_RUNTIME_CLOSURE_MANIFEST_20261009_V10.json")" = "ae37559320105277e017ff17af7c3dbeae2f9c27"
          test "$(git hash-object "$C/TB_SCIENCE_TRANSITIVE_RUNTIME_CLOSURE_V10_PUBLIC_VERIFICATION_20261009_V1.json")" = "d0000dd7cb3c866a42a4eb08632613ed53940fca"
          test "$(git hash-object "$C/TB_SCIENCE_RANK14_LOSSLESS_OBLIGATION_CAP_REPAIR_VERIFY_20261009_V1.json")" = "6e8e3938b00e3fe39e38ac4a1b38a21eeb25c96f"
          test "$(git hash-object "$C/TB_SCIENCE_CONTEXT16K_SCOPED_TIMEOUT_REPAIR_FINAL_VERIFICATION_20261009_V2.json")" = "8b8cdc3fc112bd0a253af795fb79c0f641b8b3b4"
          test "$(git hash-object "$C/FROZEN_19_ACCEPTANCE_PROOF_SHAPE_QUOTIENT_20261007_V1.json")" = "b20c5cd6965f7ea7e5ca019d1e828ac6eced042c"
          test "$(git hash-object "$C/RANK14_EPOCH_V2.json")" = "b4c52a6c79e865951604cb62fe9e3ceefacbde3e"
          test "$(git hash-object "$C/RANK14_EXECUTION_CLAIM_V2.json")" = "0e0d71e8f23f26a3a59550446ad9c7df0413f1e2"
          test "$(git hash-object "$C/rank14_prestart_token_guard_v1.py")" = "0dd94bc8bb44f9ef7e002e1c8bc67307fff9102b"
          test "$(git hash-object "$C/canonical/runtime/harbor_science_agent_v1.py")" = "16e8ab7918c4f8d052698282dddf674b54a23016"
          test "$(git hash-object "$C/canonical/runtime/harbor_science_planner_v1.py")" = "58964dc8d6b5eed5c202081cd800035c791eeb1d"
          test "$(git hash-object "$C/canonical/runtime/harbor_command_policy.py")" = "a525773417291c7a4841bf35e1baff5370350d0d"

          python - <<'PY'
          import json, pathlib, subprocess, os
          C=pathlib.Path(os.environ["C"])
          a=json.loads((C/"TB_SCIENCE_RANK14_ONE_SLOT_EXECUTION_AUTHORITY_20261009_V2.json").read_text())
          i=json.loads((C/"ACTION_INTENT_TB_SCIENCE_RANK14_POSTREPAIR_REAUTHORIZE_20261009_V1.json").read_text())
          av=json.loads((C/"TB_SCIENCE_RANK14_AUTHORITY_V2_POSTREPAIR_PUBLIC_VERIFICATION_20261009_V1.json").read_text())
          cand=json.loads((C/"TB_SCIENCE_RANK14_ONE_SLOT_EXECUTION_AUTHORITY_CANDIDATE_20261009_V2.json").read_text())
          l=json.loads((C/"TB_SCIENCE_CURRENT_SLOT_LEDGER_RECONCILIATION_20261009_V17.json").read_text())
          tm=json.loads((C/"TB_SCIENCE_TERMINAL_EXECUTION_MANIFEST_V1.json").read_text())
          cm=json.loads((C/"TB_SCIENCE_TRANSITIVE_RUNTIME_CLOSURE_MANIFEST_20261009_V10.json").read_text())
          cv=json.loads((C/"TB_SCIENCE_TRANSITIVE_RUNTIME_CLOSURE_V10_PUBLIC_VERIFICATION_20261009_V1.json").read_text())
          repair=json.loads((C/"TB_SCIENCE_RANK14_LOSSLESS_OBLIGATION_CAP_REPAIR_VERIFY_20261009_V1.json").read_text())
          context=json.loads((C/"TB_SCIENCE_CONTEXT16K_SCOPED_TIMEOUT_REPAIR_FINAL_VERIFICATION_20261009_V2.json").read_text())
          e=json.loads((C/"RANK14_EPOCH_V2.json").read_text())
          claim=json.loads((C/"RANK14_EXECUTION_CLAIM_V2.json").read_text())
          slot="terminal-bench-science/inverse-lithography::trial-0"
          task="terminal-bench-science/inverse-lithography"
          digest="sha256:8c4da4b5b3a00283335e83dda92584aaf9293ff773bc43f2bf95eb0e2c0f8530"

          assert a["execution_authority"] is True
          assert a["slot"]=={"id":slot,"schedule_rank":14,"digest":digest}
          assert a["exact_route"]["agent_blob"]=="16e8ab7918c4f8d052698282dddf674b54a23016"
          assert a["exact_route"]["planner_blob"]=="58964dc8d6b5eed5c202081cd800035c791eeb1d"
          assert a["exact_route"]["carrier_closure_blob"]=="ae37559320105277e017ff17af7c3dbeae2f9c27"
          assert a["exact_route"]["carrier_closure_verification_blob"]=="d0000dd7cb3c866a42a4eb08632613ed53940fca"
          assert a["state"]["historical_task_read"] is True
          assert a["state"]["task_started"] is False
          assert a["state"]["authority_consumed"] is False
          assert a["controls"]["attempts_authorized"]==1 and a["controls"]["retries_authorized"]==0
          assert a["controls"]["replacement_allowed"] is False
          assert a["controls"]["fresh_public_execution_claim_required"] is True
          assert a["controls"]["fresh_epoch_required"] is True
          assert a["controls"]["precheck_failure_consumes_slot"] is False

          assert i["target_obligation"]=="TB_SCIENCE_GE_58_7"
          assert i["evidence"]["historical_task_read"] is True
          assert i["evidence"]["task_started"] is False
          assert av["status"].startswith("PASS__POSTREPAIR_NONEXECUTABLE_AUTHORITY_CANDIDATE")
          assert cand["execution_authority"] is False

          assert l["current_counts"]["consumed_slots"]==13
          assert l["rank14"]["authority_active"] is True
          assert l["rank14"]["task_started"] is False
          assert l["rank14"]["execution_authority_consumed"] is False
          nxt=l["current_counts"]["next_untouched_slot"]
          assert nxt["ledger_schedule_rank"]==14 and nxt["slot_id"]==slot and nxt["task_digest"]==digest

          assert repair["status"].startswith("PASS__FALSE_64_OBLIGATION_CEILING_REMOVED")
          assert repair["causal_input"]["task_started"] is False
          assert repair["causal_input"]["execution_authority_consumed"] is False
          assert cv["status"]=="PASS__V10_15_FILE_TRANSITIVE_CLOSURE_EXACT__ZERO_EXPOSURE"
          assert context["status"].startswith("PASS__EXACT_SCOPED_PLANNER")

          rows=[x for x in tm["task_metadata"] if x.get("name")==task]
          assert len(rows)==1 and rows[0]["digest"]==digest
          assert tm["execution_rules"]["retries_per_slot"]==0
          assert tm["execution_rules"]["duplicate_slot_credit"] is False

          assert cm["closure_file_count"]==15 and len(cm["closure"])==15
          for row in cm["closure"]:
              p=C/row["path"]
              assert p.is_file(),row["path"]
              actual=subprocess.check_output(["git","hash-object",str(p)],text=True).strip()
              assert actual==row["git_blob_sha"],(row["path"],actual,row["git_blob_sha"])

          assert e["slot_id"]==slot and e["task_name"]==task and e["task_digest"]==digest
          assert e["authority_blob"]=="7a4899ce37c97a806c081bd660aaa644e3f64ecb"
          assert e["historical_state"]["historical_task_read"] is True
          assert e["historical_state"]["historical_task_started"] is False
          assert e["run_attempts_authorized_by_epoch"]==0
          assert e["task_read_under_this_epoch"] is False and e["task_started"] is False

          assert claim["slot_id"]==slot and claim["task_name"]==task and claim["task_digest"]==digest
          assert claim["execution_branch"]=="execute/tb-science-rank14-v2-postrepair-20261009"
          assert claim["authority_git_blob_sha"]=="7a4899ce37c97a806c081bd660aaa644e3f64ecb"
          assert claim["epoch_git_blob_sha"]=="b4c52a6c79e865951604cb62fe9e3ceefacbde3e"
          assert claim["agent_git_blob_sha"]=="16e8ab7918c4f8d052698282dddf674b54a23016"
          assert claim["attempts_authorized"]==1 and claim["retries_authorized"]==0
          assert claim["historical_state"]["prior_v1_claim_reuse_forbidden"] is True
          assert claim["consumed"] is False and claim["task_read_under_this_claim"] is False and claim["task_started"] is False
          PY

          python "$C/canonical/runtime/python_transitive_runtime_closure_v1.py" --repo-root "$C" --carrier-root "$C"             --root canonical/runtime/harbor_science_agent_v1.py             --root canonical/runtime/harbor_science_planner_v1.py             --root canonical/runtime/lossless_raw_task_contract_v1.py             --root canonical/runtime/raw_task_acceptance_residual_localizer_v1.py > RANK14_V2_CARRIER_CLOSURE.json

          PYTHONPATH="$C" python - <<'PY'
          from canonical.runtime.harbor_science_agent_v1 import HarborScienceAgent,PLANNER_TIMEOUT_S,MAX_ACTION_TIMEOUT_S,MAX_VERIFY_TIMEOUT_S
          import canonical.runtime.harbor_science_planner_v1 as planner
          assert HarborScienceAgent.name()=="project-brain-science"
          assert PLANNER_TIMEOUT_S==300
          assert MAX_ACTION_TIMEOUT_S==7200
          assert MAX_VERIFY_TIMEOUT_S==3600
          assert planner.MODEL=="brain-qwen3.5-9b"
          assert planner.MAX_TOOL_COMPLETION_TOKENS==4096
          assert planner.LONG_CONTEXT_THRESHOLD_TOKENS==8192
          assert planner.LONG_CONTEXT_PREFILL_TOKENS_PER_SECOND_FLOOR==8
          assert planner.LONG_CONTEXT_GENERATION_AND_TRANSPORT_MARGIN_S==240
          assert planner.LONG_CONTEXT_MAX_TIMEOUT_S==1800
          PY

          test "$(nproc)" -ge 4
          awk '/MemTotal/{exit !($2 >= 12000000)}' /proc/meminfo
          docker version >/dev/null
          docker info >/dev/null

      - name: Install exact Harbor
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir -q 'harbor==0.23.0'
          python - <<'PY'
          import importlib.metadata
          assert importlib.metadata.version("harbor")=="0.23.0"
          PY

      - name: Clean-build exact llama.cpp
        run: |
          set -euo pipefail
          rm -rf llama.cpp
          git init llama.cpp
          git -C llama.cpp remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C llama.cpp fetch --depth 1 origin "$LLAMA_CPP_REV"
          git -C llama.cpp checkout --detach FETCH_HEAD
          test "$(git -C llama.cpp rev-parse HEAD)" = "$LLAMA_CPP_REV"
          cmake -S llama.cpp -B llama.cpp/build -DGGML_CUDA=OFF -DLLAMA_CURL=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build llama.cpp/build -j 2 --target llama-server

      - name: Restore exact Qwen model cache
        uses: actions/cache@v4
        with:
          path: models/Qwen3.5-9B-M-TS-Q4_K_M.gguf
          key: brain-qwen35-9b-f41c0a0c0e43bf721fb2da29374cd1a97271bac0bab08a9dc42964525e82350c

      - name: Reassemble exact model if cache misses
        run: |
          set -euo pipefail
          mkdir -p models model-parts
          if [ ! -f "models/$MODEL_FILE" ]; then
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir model-parts --pattern "$MODEL_FILE.part*of03"
            cat "model-parts/$MODEL_FILE.part01of03" "model-parts/$MODEL_FILE.part02of03" "model-parts/$MODEL_FILE.part03of03" > "models/$MODEL_FILE"
          fi
          echo "$MODEL_SHA256  models/$MODEL_FILE" | sha256sum -c -

      - name: Start exact local cognition endpoint with 16K context
        run: |
          set -euo pipefail
          EXTRA=()
          if llama.cpp/build/bin/llama-server --help 2>&1 | grep -q -- '--reasoning'; then EXTRA+=(--reasoning off); fi
          nohup llama.cpp/build/bin/llama-server             -m "models/$MODEL_FILE" --alias brain-qwen3.5-9b             --host 127.0.0.1 --port 8080 -c 16384 -t 4 --parallel 1 --jinja --no-webui             "${EXTRA[@]}" > LOCAL_QWEN_SERVER.log 2>&1 &
          ok=0
          for i in $(seq 1 240); do
            if curl -fsS http://127.0.0.1:8080/health > LOCAL_QWEN_HEALTH.json 2>/dev/null; then ok=1; break; fi
            sleep 1
          done
          test "$ok" = 1
          grep -Eq "n_ctx_slot = 16384|n_ctx_slot = 16[0-9]{3}" LOCAL_QWEN_SERVER.log

      - name: Post-model storage and immediate live V2 epoch/lease/runtime gate
        run: |
          set -euo pipefail
          free_bytes="$(df -B1 "$GITHUB_WORKSPACE" | awk 'NR==2{print $4}')"
          test "$free_bytes" -ge 12884901888

          epoch_sha="$(curl -fsSL -H 'Accept: application/vnd.github+json'             "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/$C/RANK14_EPOCH_V2.json?ref=terminal-execution-v1"             | python -c 'import json,sys; print(json.load(sys.stdin)["sha"])')"
          test "$epoch_sha" = "b4c52a6c79e865951604cb62fe9e3ceefacbde3e"
          claim_sha="$(curl -fsSL -H 'Accept: application/vnd.github+json'             "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/$C/RANK14_EXECUTION_CLAIM_V2.json?ref=terminal-execution-v1"             | python -c 'import json,sys; print(json.load(sys.stdin)["sha"])')"
          test "$claim_sha" = "0e0d71e8f23f26a3a59550446ad9c7df0413f1e2"

          test "$(git hash-object "$C/TB_SCIENCE_RANK14_ONE_SLOT_EXECUTION_AUTHORITY_20261009_V2.json")" = "7a4899ce37c97a806c081bd660aaa644e3f64ecb"
          test "$(git hash-object "$C/canonical/runtime/harbor_science_agent_v1.py")" = "16e8ab7918c4f8d052698282dddf674b54a23016"
          test "$(git hash-object "$C/canonical/runtime/harbor_science_planner_v1.py")" = "58964dc8d6b5eed5c202081cd800035c791eeb1d"

      - name: Read exact rank14 task and enforce prestart token budget
        id: prestart
        run: |
          set -euo pipefail
          export PYTHONPATH="$C"
          python "$C/rank14_prestart_token_guard_v1.py"
          cat RANK14_PRESTART_GUARD.json
          python - <<'PY'
          import json
          x=json.load(open("RANK14_PRESTART_GUARD.json"))
          assert x.get("task_started") is False
          if x.get("task_read"):
              assert x.get("instruction_sha256")=="0a5b758ec1933d8fb2cb2d736dcb6a365c239a16aa2c1158fd0f0487231eade1"
          PY

      - name: Execute exactly frozen rank14 slot
        id: execute
        if: steps.prestart.outputs.guard_pass == 'true'
        continue-on-error: true
        env:
          TASK_PATH: ${{ steps.prestart.outputs.task_path }}
          SAFE_ID: inverse-lithography-trial-0
        run: |
          set -uo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/$C"
          mkdir -p "$GITHUB_WORKSPACE/jobs/$SAFE_ID"
          harbor run             -p "$TASK_PATH"             -a canonical.runtime.harbor_science_agent_v1:HarborScienceAgent             -k 1 -n 1 -r 0             --agent-timeout-multiplier 0.48             --environment-build-timeout-multiplier 1.0             --verifier-timeout-multiplier 1.0             --job-name "$SAFE_ID"             --jobs-dir "$GITHUB_WORKSPACE/jobs/$SAFE_ID"
          echo "harbor_exit=$?" >> "$GITHUB_OUTPUT"

      - name: Finalize irreversible conservative rank14 V2 receipt
        if: always()
        env:
          SLOT_ID: terminal-bench-science/inverse-lithography::trial-0
          TASK_NAME: terminal-bench-science/inverse-lithography
          SAFE_ID: inverse-lithography-trial-0
          HARBOR_OUTCOME: ${{ steps.execute.outcome }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          base=root/"jobs"/os.environ["SAFE_ID"]
          guard_path=root/"RANK14_PRESTART_GUARD.json"
          try: guard=json.loads(guard_path.read_text())
          except Exception: guard={}
          results=[]
          for p in base.rglob("result.json") if base.exists() else []:
              try: obj=json.loads(p.read_text())
              except Exception: continue
              results.append((p,obj))
          scored=[]; exception_info=[]
          for p,obj in results:
              vr=obj.get("verifier_result")
              if isinstance(vr,dict) and isinstance(vr.get("rewards"),dict):
                  scored.append((p,obj))
              ex=obj.get("exception_info")
              if isinstance(ex,dict):
                  exception_info.append({
                      "path":str(p.relative_to(root)),
                      "exception_type":ex.get("exception_type"),
                      "exception_message":ex.get("exception_message"),
                  })
          reward=None; errors=[]
          if len(scored)==1:
              raw=scored[0][1]["verifier_result"]["rewards"].get("reward")
              if isinstance(raw,(int,float)) and not isinstance(raw,bool):
                  reward=float(raw)
              else: errors.append("REWARD_MISSING_OR_NONNUMERIC")
          elif not scored: errors.append("NO_TRIAL_RESULT_WITH_VERIFIER_REWARD")
          else: errors.append("MULTIPLE_TRIAL_RESULTS_WITH_VERIFIER_REWARD")
          harbor_outcome=os.environ.get("HARBOR_OUTCOME")
          task_started=harbor_outcome in {"success","failure"}
          success=(task_started and reward is not None and reward>=1.0 and not errors)
          if not task_started: errors=["TASK_NOT_STARTED__PREEXPOSURE_ABORT"]
          hashes={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p,_ in results}
          receipt={
            "schema":"PROJECT_BRAIN_TB_SCIENCE_TERMINAL_SLOT_RECEIPT_RANK14_V2",
            "slot_id":os.environ["SLOT_ID"],
            "task_name":os.environ["TASK_NAME"],
            "task_digest":"sha256:8c4da4b5b3a00283335e83dda92584aaf9293ff773bc43f2bf95eb0e2c0f8530",
            "status":("PREEXPOSURE_ABORT_NONCONSUMING" if not task_started else ("SUCCESS" if success else "FINAL_ZERO")),
            "reward":(None if not task_started else (reward if reward is not None else 0.0)),
            "historical_task_read_before_v2":True,
            "task_read_under_v2":bool(guard.get("task_read")),
            "task_started":task_started,
            "prestart_guard_status":guard.get("status"),
            "prestart_guard_pass":guard.get("pass"),
            "prestart_input_tokens":guard.get("input_tokens"),
            "prestart_context_headroom_tokens":guard.get("context_headroom_tokens"),
            "prestart_instruction_sha256":guard.get("instruction_sha256"),
            "prestart_first_cycle_prompt_sha256":guard.get("first_cycle_prompt_sha256"),
            "raw_task_obligation_count":guard.get("raw_task_obligation_count"),
            "errors":errors,
            "exception_info":exception_info,
            "harbor_step_outcome":harbor_outcome,
            "authority_blob":"7a4899ce37c97a806c081bd660aaa644e3f64ecb",
            "intent_blob":"ae89489197b51a0abaf5b7943861f1d6e9cd3675",
            "authority_verification_blob":"bfb02e03b34974a9efdece47699235b28af5b36f",
            "ledger_v17_blob":"b57989db7874cad9fa13306a0a1e0f9f2dcc42fe",
            "epoch_blob":"b4c52a6c79e865951604cb62fe9e3ceefacbde3e",
            "execution_claim_blob":"0e0d71e8f23f26a3a59550446ad9c7df0413f1e2",
            "closure_manifest_blob":"ae37559320105277e017ff17af7c3dbeae2f9c27",
            "closure_verification_blob":"d0000dd7cb3c866a42a4eb08632613ed53940fca",
            "obligation_ceiling_repair_verification_blob":"6e8e3938b00e3fe39e38ac4a1b38a21eeb25c96f",
            "context_repair_verification_blob":"8b8cdc3fc112bd0a253af795fb79c0f641b8b3b4",
            "prestart_guard_blob":"0dd94bc8bb44f9ef7e002e1c8bc67307fff9102b",
            "agent_blob":"16e8ab7918c4f8d052698282dddf674b54a23016",
            "planner_blob":"58964dc8d6b5eed5c202081cd800035c791eeb1d",
            "command_policy_blob":"a525773417291c7a4841bf35e1baff5370350d0d",
            "qwen_model_sha256":"f41c0a0c0e43bf721fb2da29374cd1a97271bac0bab08a9dc42964525e82350c",
            "llama_cpp_commit":"bec4772f6a2527d371557b5d2032641e5ff7619c",
            "server_context_tokens":16384,
            "reserved_completion_tokens":4096,
            "strict_timeout_semantics":"SUCCESS_IS_EXACT_POSITIVE_EVIDENCE__ANY_FINAL_NON_SUCCESS_AFTER_TASK_START_COUNTS_ZERO",
            "github_run_id":os.environ["GITHUB_RUN_ID"],
            "github_run_attempt":os.environ["GITHUB_RUN_ATTEMPT"],
            "github_sha":os.environ["GITHUB_SHA"],
            "result_hashes":hashes,
            "execution_authority_consumed":task_started,
            "rerun_credit":False,
            "incremental_spend_usd":0,
