name: Nonparent Carrier Verifier Closure Canary

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: read

jobs:
  closure-canary:
    if: github.head_ref == 'canary/carrier-verifier-closure-20260930-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      ASTRA_DISABLE_MODEL_PLANNER: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Execute canonical CLI closure canary
        run: python canonical/runtime/astra_runtime.py canonical/astra_runtime/missions/NONPARENT_CARRIER_VERIFIER_CLOSURE_CANARY_20260930_001.json
      - name: Upload canonical receipt and state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nonparent-carrier-verifier-closure-canary
          path: |
            canonical/astra_runtime/evidence/NONPARENT-CARRIER-VERIFIER-CLOSURE-CANARY-20260930-001__RECEIPT.json
            canonical/astra_runtime/state/NONPARENT-CARRIER-VERIFIER-CLOSURE-CANARY-20260930-001.json
          if-no-files-found: error
