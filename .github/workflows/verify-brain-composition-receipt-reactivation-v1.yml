name: Verify Brain composition receipt reactivation
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/composition_receipt_reactivation_v1/**"
      - ".github/workflows/verify-brain-composition-receipt-reactivation-v1.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact Brain blobs
        run: |
          cd capsules/composition_receipt_reactivation_v1
          python - <<'PY'
          import hashlib,json,pathlib
          m=json.load(open("EXPECTED_BRAIN_BLOBS.json",encoding="utf-8"))
          for src,want in m["exact_brain_blobs"].items():
              b=pathlib.Path(src).read_bytes()
              got=hashlib.sha1(f"blob {len(b)}\0".encode()+b).hexdigest()
              assert got==want,(src,got,want)
          print("exact blobs: PASS")
          PY
      - name: Run fail-closed tests
        run: |
          cd capsules/composition_receipt_reactivation_v1
          export PYTHONPATH=.
          python canonical/tests/test_composition_receipt_reactivation_v1.py
      - name: Compute current composition receipt projection
        run: |
          cd capsules/composition_receipt_reactivation_v1
          export PYTHONPATH=.
          python canonical/runtime/composition_receipt_reactivation_v1.py \
            --manifest canonical/governance/FROZEN_COMPOSITION_COMPONENT_INTERFACE_MANIFEST_V1.json \
            --protocols canonical/governance/OPUS55_TERMINAL_PROOF_PROTOCOLS_V1.json \
            --bridge canonical/governance/COMPOSITION_BEHAVIORAL_BRIDGE_V1.json \
            --bridge-verification canonical/verification/COMPOSITION_BEHAVIORAL_BRIDGE_ACTIVATION_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json \
            --memory-bridge canonical/governance/COMPOSITION_MEMORY_OWNED_FAMILY_BRIDGE_V1.json \
            --memory-package canonical/capabilities/opus55/OPUS55_LONG_HORIZON_MEMORY_AND_CONTINUITY_V1.json \
            > composition-receipt-reactivation-verdict.json
      - name: Enforce exact 2-of-12 truth
        run: |
          cd capsules/composition_receipt_reactivation_v1
          python - <<'PY'
          import json
          v=json.load(open("composition-receipt-reactivation-verdict.json",encoding="utf-8"))
          assert v["status"]=="PASS",v
          assert v["scoped_proved_interface_count"]==2,v
          assert v["open_interface_count"]==10,v
          assert {x["component_id"] for x in v["admitted_receipts"]}=={"delegation","memory"},v
          assert "tool discovery" in {x.get("component_id") for x in v["quarantined_bindings"]},v
          assert v["parent_composition_predicate_closed"] is False,v
          assert v["atomic_acceptance_credit_delta"]==0,v
          assert v["family_credit_delta"]==0 and v["capability_credit_delta"]==0,v
          p=json.load(open("canonical/governance/OPUS55_TERMINAL_PROOF_PROTOCOLS_V1.json",encoding="utf-8"))
          rows={x["family"]:x for x in p["protocols"]}
          d=rows["SUBAGENT_DELEGATION_AND_COORDINATION"]
          assert d["status"]=="PASS",d
          assert d["closure_receipt"]=="canonical/verification/DELEGATION_ACCEPTANCE_REDUCTION_PUBLIC_RUNNER_VERIFICATION_20261003_V1.json",d
          dv=json.load(open(d["closure_receipt"],encoding="utf-8"))
          assert dv["status"].startswith("INDEPENDENT_PUBLIC_RUNNER_PASS"),dv
          assert dv["verified_result"]["newly_closed_families"]==["SUBAGENT_DELEGATION_AND_COORDINATION"],dv
          print("composition receipt reactivation 0/12 -> 2/12: PASS")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: composition-receipt-reactivation-verdict
          path: capsules/composition_receipt_reactivation_v1/composition-receipt-reactivation-verdict.json
