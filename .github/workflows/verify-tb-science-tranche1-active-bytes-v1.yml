name: Verify TB-Science tranche1 active bytes V1
on:
  push:
    branches: ["verify/tb-science-tranche1-active-bytes-v1-20261003-sol"]
    paths:
      - "capsules/tb_science_tranche1_active_bytes_v1/**"
      - ".github/workflows/verify-tb-science-tranche1-active-bytes-v1.yml"
  pull_request:
    branches: [main]
    paths:
      - "capsules/tb_science_tranche1_active_bytes_v1/**"
      - ".github/workflows/verify-tb-science-tranche1-active-bytes-v1.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact active Brain bytes and frozen carrier
        run: |
          set -euo pipefail
          N=capsules/tb_science_tranche1_active_bytes_v1/canonical/governance
          P=capsules/tb_science_tranche1_authority_v1/canonical/governance
          test "$(git hash-object "$N/TB_SCIENCE_TRANCHE1_EXECUTION_AUTHORITY_V1.json")" = "89406ed4c8d214dfa81eddbb1f8caeebc33e82b2"
          test "$(git hash-object "$N/TERMINAL_BENCH_SCIENCE_ROUTE_ACTIVATION_V1.json")" = "63af5d3d3e45ce523c7dbb188180fe7fff6ef639"
          test "$(git hash-object "$P/TB_SCIENCE_TRANCHE1_EXECUTION_AUTHORITY_V1.json")" = "14227eba31de060cab3b7906dd15466486e4842c"
          test "$(git hash-object "$P/TERMINAL_BENCH_SCIENCE_ROUTE_ACTIVATION_V1.json")" = "49be2c7d91a2ed444acf2b9a2c178403f5f8005c"
          test "$(git hash-object .github/workflows/execute-tb-science-tranche1-v1.yml)" = "bf79ac405b0d88d6926383db2e67e513a95f77d3"
          test "$(git hash-object capsules/tb_science_execution_v1/canonical/governance/TB_SCIENCE_TERMINAL_EXECUTION_MANIFEST_V1.json)" = "6dfa880b1f68881531afbba6ca211681801fd19b"
          test "$(git hash-object capsules/tb_science_execution_v1/canonical/runtime/harbor_science_agent_v1.py)" = "8ab8287fdb6a9b63b9fe2d2addde731486c89d1e"
          test "$(git hash-object capsules/tb_science_execution_v1/canonical/runtime/harbor_science_planner_v1.py)" = "17472fd2b01b164fbb180aecfc04385b55b11499"
          test ! -e capsules/tb_science_execution_v1/ARM_TRANCHE1.json
      - name: Verify activation delta is the only authority semantic change
        run: |
          set -euo pipefail
          python - <<'PY'
          import copy,json,pathlib
          root=pathlib.Path(".")
          new=json.load(open("capsules/tb_science_tranche1_active_bytes_v1/canonical/governance/TB_SCIENCE_TRANCHE1_EXECUTION_AUTHORITY_V1.json"))
          old=json.load(open("capsules/tb_science_tranche1_authority_v1/canonical/governance/TB_SCIENCE_TRANCHE1_EXECUTION_AUTHORITY_V1.json"))
          assert old["execution_authority"] is False
          assert new["execution_authority"] is True
          assert old["promotion_authority"] is False and new["promotion_authority"] is False
          assert new["status"]=="ACTIVE_INDEPENDENT_PUBLIC_RUNNER_PASS__THREE_FROZEN_SLOTS_ONLY"
          assert new["independent_verification"]=="canonical/verification/TB_SCIENCE_TRANCHE1_AUTHORITY_PUBLIC_RUNNER_VERIFICATION_20261003_V1.json"
          assert new["activation_rule"]=="ONLY_AUTHORIZED_SLOT_IDS_MAY_RUN__AUTHORITY_AUTO_REVOKES_AFTER_ALL_THREE_FINALIZE"
          allowed={"status","execution_authority","independent_verification","activation_rule"}
          a=copy.deepcopy(old); b=copy.deepcopy(new)
          for k in allowed:
              a.pop(k,None); b.pop(k,None)
          assert a==b,("UNEXPECTED_AUTHORITY_DELTA",a,b)
          manifest=json.load(open("capsules/tb_science_execution_v1/canonical/governance/TB_SCIENCE_TERMINAL_EXECUTION_MANIFEST_V1.json"))
          expected=[x["slot_id"] for x in manifest["slots"][:3]]
          assert new["authorized_slot_ids"]==expected
          assert len(expected)==3 and len(set(expected))==3
          assert new["exact_inputs"]["manifest_blob"]=="6dfa880b1f68881531afbba6ca211681801fd19b"
          assert new["exact_inputs"]["controller_blob"]=="8ab8287fdb6a9b63b9fe2d2addde731486c89d1e"
          assert new["exact_inputs"]["planner_blob"]=="17472fd2b01b164fbb180aecfc04385b55b11499"
          assert new["exact_inputs"]["execution_workflow_blob"]=="bf79ac405b0d88d6926383db2e67e513a95f77d3"
          assert new["exact_inputs"]["execution_capsule_merge_sha"]=="32248ceb1e6965abb3ec56b61210590ef6da0a8d"
          assert new["carrier"]["harbor_max_retries"]==0
          assert new["carrier"]["incremental_spend_usd"]==0
          assert new["result_semantics"]["every_other_final_state"]=="ZERO"
          assert new["result_semantics"]["denominator"]=="FIXED_210"
          assert new["auto_revoke_after_all_authorized_slots_finalized"] is True
          assert new["terminal_results_observed"]==0
          PY
      - name: Verify active route is coherent and fail-closed until exact-byte receipt
        run: |
          set -euo pipefail
          python - <<'PY'
          import copy,json
          new=json.load(open("capsules/tb_science_tranche1_active_bytes_v1/canonical/governance/TERMINAL_BENCH_SCIENCE_ROUTE_ACTIVATION_V1.json"))
          old=json.load(open("capsules/tb_science_tranche1_authority_v1/canonical/governance/TERMINAL_BENCH_SCIENCE_ROUTE_ACTIVATION_V1.json"))
          assert old["execution_authority"] is False
          assert new["execution_authority"] is True
          assert new["promotion_authority"] is False
          assert new["status"]=="ACTIVE_TRANCHE1_EXECUTION_AUTHORITY__THREE_FROZEN_SLOTS_ONLY__PROMOTION_FALSE"
          assert new["remaining_before_terminal_case_exposure"]==[]
          assert new["active_authority_blob_sha"]=="89406ed4c8d214dfa81eddbb1f8caeebc33e82b2"
          assert new["prior_verified_candidate_authority_blob_sha"]=="14227eba31de060cab3b7906dd15466486e4842c"
          assert new["active_byte_verification"]=="REQUIRED_BEFORE_MERGE__SATISFIED_ONLY_BY_SEPARATE_INDEPENDENT_RECEIPT_BOUND_TO_THIS_EXACT_ROUTE_AND_AUTHORITY_BLOB"
          assert new["tranche1_authority_verification"]=="canonical/verification/TB_SCIENCE_TRANCHE1_AUTHORITY_PUBLIC_RUNNER_VERIFICATION_20261003_V1.json"
          pre=new["activation_preconditions_outside_canonical_state"]
          assert len(pre)==4
          assert any("32248CEB1E6965ABB3EC56B61210590EF6DA0A8D" in x for x in pre)
          assert any("BF79AC405B0D88D6926383DB2E67E513A95F77D3" in x for x in pre)
          allowed={
            "status","remaining_before_terminal_case_exposure","execution_authority","next",
            "tranche1_authority_verification","activation_preconditions_outside_canonical_state",
            "active_authority_blob_sha","prior_verified_candidate_authority_blob_sha","active_byte_verification"
          }
          a=copy.deepcopy(old); b=copy.deepcopy(new)
          for k in allowed:
              a.pop(k,None); b.pop(k,None)
          assert a==b,("UNEXPECTED_ROUTE_DELTA",a,b)
          print(json.dumps({
            "schema":"PROJECT_BRAIN_TB_SCIENCE_TRANCHE1_ACTIVE_BYTES_VERIFICATION_V1",
            "status":"PASS",
            "active_authority_blob":"89406ed4c8d214dfa81eddbb1f8caeebc33e82b2",
            "active_route_blob":"63af5d3d3e45ce523c7dbb188180fe7fff6ef639",
            "authorized_slots":3,
            "terminal_trials_executed":0,
            "incremental_spend_usd":0,
            "execution_authority":True,
            "promotion_authority":False
          },sort_keys=True))
          PY
