name: Verify Root2 V4 CircleCI reduction
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/root2_v4_circleci/**"
      - ".github/workflows/verify-root2-v4-circleci.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python capsules/root2_v4_circleci/v.py
