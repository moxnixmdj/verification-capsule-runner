name: Verify M1B end-to-end continuous geometry
on:
  pull_request:
    branches: [main]
    paths:
      - 'verification/m1b_end_to_end/**'
      - '.github/workflows/verify-m1b-end-to-end.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Bind exact Brain mechanisms
        run: |
          test "$(git hash-object verification/m1b_end_to_end/m1b_continuous_geometry_compiler.py)" = "0c7c6355cde87c961319d6f9948839cb56add092"
          test "$(git hash-object verification/m1b_end_to_end/cad_partspec.py)" = "e5b68367cbaaeedb97c6eb8f2d080f19e3a2cdbb"
          test "$(git hash-object verification/m1b_end_to_end/cadquery_partspec_generator.py)" = "1ee7d8101b14b6ce037eccb56c2cc554891e0da1"
          test "$(git hash-object verification/m1b_end_to_end/cadquery_partspec_validator.py)" = "b7f558f8be5b548f201bc610e6f37419b0336d02"
      - run: python -m pip install --disable-pip-version-check 'pydantic>=2,<3' cadquery
      - run: cd verification/m1b_end_to_end && python -m unittest -v test_m1b_end_to_end
