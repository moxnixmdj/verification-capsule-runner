name: Verify LiveBench NTH dual-loss exact

on:
  pull_request:
    branches: [main]
    paths:
      - "subject/livebench_nth_dual_loss_20261005/**"
      - "verify_livebench_nth_dual_loss_v1.py"
      - ".github/workflows/verify-livebench-nth-dual-loss-v1.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"

      - name: Install exact runtime dependencies
        run: |
          python -m pip install --disable-pip-version-check --quiet \
            nltk==3.10.3 langdetect==1.0.9 immutabledict==4.3.1

      - name: Checkout exact frozen LiveBench
        run: |
          git clone --quiet --filter=blob:none --no-checkout \
            https://github.com/LiveBench/LiveBench.git /tmp/livebench
          git -C /tmp/livebench fetch --quiet --depth=1 origin \
            8f8e5c381a16e3f24257776edd53471fe86f8091
          git -C /tmp/livebench checkout --quiet --detach \
            8f8e5c381a16e3f24257776edd53471fe86f8091
          test "$(git -C /tmp/livebench rev-parse HEAD)" = \
            "8f8e5c381a16e3f24257776edd53471fe86f8091"

      - name: Independently verify frozen NTH dual-loss subject
        run: python verify_livebench_nth_dual_loss_v1.py

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livebench-nth-dual-loss-independent-verification
          path: livebench_nth_dual_loss_independent_verification.json
          if-no-files-found: error
