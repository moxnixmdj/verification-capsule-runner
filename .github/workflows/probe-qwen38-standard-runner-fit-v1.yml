name: Probe Qwen3.8 standard runner fit V1

on:
  pull_request:
    paths:
      - 'probe_qwen38_standard_runner_fit_v1.py'
      - '.github/workflows/probe-qwen38-standard-runner-fit-v1.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Measure exact runner resource envelope without model download
        run: python probe_qwen38_standard_runner_fit_v1.py
