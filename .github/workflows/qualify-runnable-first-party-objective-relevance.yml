name: Qualify Runnable First-Party Objective Relevance

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Authored fail-closed regressions
        run: python canonical/tests/test_first_party_objective_relevance_verify.py
      - name: Independent runnable live qualification
        run: python canonical/tests/test_first_party_objective_relevance_runnable_qualification.py
