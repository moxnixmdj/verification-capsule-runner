name: Verify current terminal launch authority V2
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/current_terminal_launch_authority_v2/**"
      - ".github/workflows/verify-current-terminal-launch-authority-v2.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify exact Brain snapshot blobs
        working-directory: capsules/current_terminal_launch_authority_v2
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          m=json.load(open("snapshot_manifest.json",encoding="utf-8"))
          for rel, expected in sorted(m["brain_snapshot_blobs"].items()):
              data=Path(rel).read_bytes()
              actual=hashlib.sha1(b"blob "+str(len(data)).encode()+bytes([0])+data).hexdigest()
              assert actual == expected, (rel, expected, actual)
          print("exact Brain snapshot blobs verified:", len(m["brain_snapshot_blobs"]))
          PY
      - name: Run prequalification and launch-authority regressions
        working-directory: capsules/current_terminal_launch_authority_v2
        run: |
          set -euo pipefail
          touch canonical/__init__.py canonical/runtime/__init__.py canonical/tests/__init__.py
          PYTHONPATH=. python -m unittest -v \
            canonical.tests.test_terminal_prequalification_reducer \
            canonical.tests.test_terminal_wave_launch_authority_reducer_v1
      - name: Recompute exact current prequalification
        working-directory: capsules/current_terminal_launch_authority_v2
        run: |
          set -euo pipefail
          PYTHONPATH=. python canonical/runtime/terminal_prequalification_reducer.py . | tee prequalification.json
          python - <<'PY'
          import json
          x=json.load(open("prequalification.json"))
          assert x["pass"] is True, x
          assert x["execution_authority"] is True, x
          assert x["failed_predicates"] == [], x
          PY
      - name: Derive exact current terminal launch authority
        working-directory: capsules/current_terminal_launch_authority_v2
        run: |
          set -euo pipefail
          PYTHONPATH=. python canonical/runtime/terminal_wave_launch_authority_reducer_v1.py . | tee authority.json
          python - <<'PY'
          import json
          m=json.load(open("snapshot_manifest.json"))
          x=json.load(open("authority.json"))
          e=m["expected_verdict"]
          assert x["pass"] is e["prequalification_pass"], x
          assert x["launch_authority"] is e["launch_authority"], x
          assert x["execution_authority"] is e["execution_authority"], x
          assert x["route_count"] == e["route_count"], x
          assert x["failed_predicates"] == e["failed_predicates"], x
          assert x["terminal_results_observed"] == 0, x
          assert x["fresh_terminal_evidence_consumed"] == 0, x
          print("terminal launch authority:", x["authorization"])
          PY
