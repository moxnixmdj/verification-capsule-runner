name: Verify legacy repeat-prompt visible recovery V1
on:
  pull_request:
    branches: [main]
    paths:
      - "subject/legacy_repeat_prompt_visible_recovery_v1.py"
      - "verify_legacy_repeat_prompt_visible_recovery_v1.py"
      - ".github/workflows/verify-legacy-repeat-prompt-visible-recovery-v1.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python verify_legacy_repeat_prompt_visible_recovery_v1.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-repeat-prompt-visible-recovery-v1-receipt
          path: legacy_repeat_prompt_visible_recovery_v1_receipt.json
          if-no-files-found: error
