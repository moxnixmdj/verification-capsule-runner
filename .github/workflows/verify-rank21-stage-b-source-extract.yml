name: Rank21 Stage-B allowlisted source extraction
on:
  pull_request:
    branches: [main]
    paths:
      - 'verification/rank21_stage_b/**'
      - '.github/workflows/verify-rank21-stage-b-source-extract.yml'
permissions:
  contents: read
jobs:
  extract-allowlisted-sources:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install generic readers
        run: python -m pip install --disable-pip-version-check xlrd==2.0.1 pypdf==5.0.1
      - name: Fetch exact allowlisted rank21 environment data
        run: |
          set -euo pipefail
          mkdir -p /tmp/rank21
          base='https://raw.githubusercontent.com/harbor-framework/terminal-bench/452bf305c6daa62fc59061d22133a7cbc7c1572e/tasks/foodstuff-beta-activity/environment/data'
          curl --fail --location --silent --show-error "$base/measurement%20data.xls" -o '/tmp/rank21/measurement data.xls'
          curl --fail --location --silent --show-error "$base/sample.xls" -o '/tmp/rank21/sample.xls'
          curl --fail --location --silent --show-error "$base/Sr-90_tables.pdf" -o '/tmp/rank21/Sr-90_tables.pdf'
          test "$(git hash-object '/tmp/rank21/measurement data.xls')" = '77ebde66abfe83423f89586de9e2b5a499228154'
          test "$(git hash-object '/tmp/rank21/sample.xls')" = '4c62b8be6b1a96c390012f775f596476ebe017bd'
          test "$(git hash-object '/tmp/rank21/Sr-90_tables.pdf')" = '2d1705dc43d36628ce98884b7531a023a839ecad'
      - name: Extract source facts only
        run: python verification/rank21_stage_b/extract_allowlisted_sources.py /tmp/rank21
