name: Guarded PR496 Explicit Recipe Failclosed V2
on:
  pull_request:
    branches: [main]
    paths:
      - canonical/runtime/bound_capabilities/broad_objective_decompose.py
      - canonical/runtime/bound_capabilities/plain_goal_bound_grounding.py
      - canonical/tests/test_broad_objective_semantic_decomposition.py
      - verify_pr496_explicit_recipe_failclosed_v2.py
      - guarded_pr496_explicit_recipe_failclosed_authorization.json
      - guarded_pr496_explicit_recipe_failclosed_plan.json
      - .github/workflows/guarded-pr496-explicit-recipe-failclosed.yml
permissions:
  contents: write
jobs:
  qualify:
    if: github.head_ref == 'qualify/brain-pr496-explicit-recipe-failclosed-v2-20260930-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Atomically admit and qualify exact PR496 bytes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python execution_guard/github_actions_guarded_run_live.py --plan guarded_pr496_explicit_recipe_failclosed_plan.json --receipt guarded-pr496-admission.json
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: guarded-pr496-explicit-recipe-failclosed-evidence
          path: |
            guarded-pr496-admission.json
            guarded_pr496_explicit_recipe_failclosed_plan.json
          if-no-files-found: warn
