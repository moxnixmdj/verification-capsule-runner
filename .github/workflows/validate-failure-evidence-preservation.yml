name: Validate Failure Evidence Preservation

on:
  push:
    branches: [verify/failure-evidence-preservation-20260930]
    paths:
      - 'ARM_VALIDATE_FAILURE_EVIDENCE_20260930'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact candidate blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object canonical/runtime/astra_runtime.py)" = "85642a89a0d99c5e6cafa2e116ffdc24f04de32c"
          test "$(git hash-object canonical/tests/test_failure_evidence_preservation.py)" = "4adaf57f347597e896d5f8986e4076d5c6ecc9ac"
      - name: Run failure evidence preservation regression
        shell: bash
        run: |
          set -euo pipefail
          python canonical/tests/test_failure_evidence_preservation.py
