name: Verify LiveBench Overlap Whitespace Invariant
on:
  pull_request:
    branches:
      - main
    paths:
      - verify_livebench_overlap_whitespace_invariant.py
      - .github/workflows/verify-livebench-overlap-whitespace-invariant.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recompute prompt-only overlap witnesses from pinned public bytes
        run: python verify_livebench_overlap_whitespace_invariant.py
      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livebench-overlap-whitespace-invariant-receipt
          path: livebench_overlap_whitespace_invariant_receipt.json
          if-no-files-found: error
