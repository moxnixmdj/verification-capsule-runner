name: Verify requirement acceptance compiler
on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/runtime/requirement_acceptance_compiler.py'
      - 'canonical/runtime/independent_acceptance_model.py'
      - 'verification/test_requirement_acceptance_compiler_independent.py'
      - 'verification/REQUIREMENT_ACCEPTANCE_COMPILER_SOURCE_V1.json'
      - '.github/workflows/verify-requirement-acceptance-compiler.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact Brain blobs
        run: |
          test "$(git hash-object canonical/runtime/requirement_acceptance_compiler.py)" = "c306ac6191e2d6f6d84445d7a698eeec8676a0ef"
          test "$(git hash-object canonical/runtime/independent_acceptance_model.py)" = "710298c5d7154b5a3c2a4a1700420c40cb2fa55a"
      - name: Run independent fail-closed suite
        run: python -m unittest -v verification.test_requirement_acceptance_compiler_independent
