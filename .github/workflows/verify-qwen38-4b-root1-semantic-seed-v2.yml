name: Verify Qwen3.8-4B Root1 semantic seed V2 exact

on:
  push:
    branches: [main]
    paths:
      - 'verify_qwen38_4b_root1_semantic_seed_v2.py'
      - '.github/workflows/verify-qwen38-4b-root1-semantic-seed-v2.yml'
  workflow_dispatch:

concurrency:
  group: verify-qwen38-4b-root1-semantic-seed-v2
  cancel-in-progress: true

permissions:
  contents: read

env:
  MODEL_REPO: empero-ai/Qwen3.8-4B-Distill-GGUF
  MODEL_REV: 391fc7d103e3942a408def3e4f51c2f85d464417
  MODEL_FILE: Qwen3.8-4B-Q4_K_M.gguf
  MODEL_BYTES: '2783446304'
  MODEL_SHA256: dec96e8cf2e11b613bb46513dec485377f9ca5a351e71712ee0e244f287c6790
  MODEL_URL: https://huggingface.co/empero-ai/Qwen3.8-4B-Distill-GGUF/resolve/391fc7d103e3942a408def3e4f51c2f85d464417/Qwen3.8-4B-Q4_K_M.gguf
  LLAMA_COMMIT: 0504396140d1c882f5f6ee34466a42db7ae90114

jobs:
  qualify-exact-v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Verify public-runner resource geometry
        shell: bash
        run: |
          set -euo pipefail
          echo "cpu_count=$(nproc)"
          awk '/MemTotal/ {print "mem_total_kb="$2}' /proc/meminfo
          df -B1 .
          test "$(awk '/MemTotal/ {print $2}' /proc/meminfo)" -ge 12000000
          test "$(df --output=avail -B1 . | tail -1 | tr -d ' ')" -ge 6500000000

      - name: Download and verify exact frozen subject
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 6 --retry-delay 2 --retry-all-errors --connect-timeout 30             -o "$MODEL_FILE" "$MODEL_URL"
          test "$(stat -c '%s' "$MODEL_FILE")" = "$MODEL_BYTES"
          printf '%s  %s\n' "$MODEL_SHA256" "$MODEL_FILE" | sha256sum -c -
          sha256sum "$MODEL_FILE" > model.sha256

      - name: Build exact frozen llama.cpp
        shell: bash
        run: |
          set -euo pipefail
          git init llama.cpp
          git -C llama.cpp remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C llama.cpp fetch --depth 1 origin "$LLAMA_COMMIT"
          git -C llama.cpp checkout --detach FETCH_HEAD
          test "$(git -C llama.cpp rev-parse HEAD)" = "$LLAMA_COMMIT"
          cmake -S llama.cpp -B llama.cpp/build             -DCMAKE_BUILD_TYPE=Release             -DGGML_NATIVE=OFF             -DLLAMA_CURL=OFF
          cmake --build llama.cpp/build --config Release -j 4 --target llama-server
          ./llama.cpp/build/bin/llama-server --version | tee llama_server_version.txt

      - name: Start exact local inference subject
        shell: bash
        run: |
          set -euo pipefail
          ./llama.cpp/build/bin/llama-server             -m "$MODEL_FILE"             -c 4096             -t 4             -np 1             --host 127.0.0.1             --port 8080             > llama_server.log 2>&1 &
          echo "$!" > llama_server.pid

          ready=0
          for _ in $(seq 1 180); do
            if curl -fsS http://127.0.0.1:8080/health > health.json 2>/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$(cat llama_server.pid)" 2>/dev/null; then
              break
            fi
            sleep 2
          done
          if test "$ready" != "1"; then
            cat llama_server.log
            exit 1
          fi
          grep -E 'VmPeak|VmHWM|VmRSS' "/proc/$(cat llama_server.pid)/status" > server_memory_before.txt || true

      - name: Execute exact V2 nonterminal semantic qualification
        shell: bash
        run: |
          set -euo pipefail
          python3 verify_qwen38_4b_root1_semantic_seed_v2.py

      - name: Capture runtime evidence
        if: always()
        shell: bash
        run: |
          set -u
          if test -f llama_server.pid && kill -0 "$(cat llama_server.pid)" 2>/dev/null; then
            grep -E 'VmPeak|VmHWM|VmRSS' "/proc/$(cat llama_server.pid)/status" > server_memory_after.txt || true
            kill "$(cat llama_server.pid)" || true
          fi
          tail -n 160 llama_server.log > llama_server_tail.txt 2>/dev/null || true
          if test -f qwen38_4b_root1_semantic_seed_receipt_v2.json; then
            cat qwen38_4b_root1_semantic_seed_receipt_v2.json
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qwen38-4b-root1-semantic-seed-v2-exact
          path: |
            qwen38_4b_root1_semantic_seed_receipt_v2.json
            model.sha256
            health.json
            llama_server_version.txt
            server_memory_before.txt
            server_memory_after.txt
            llama_server_tail.txt
          if-no-files-found: warn
          retention-days: 7
