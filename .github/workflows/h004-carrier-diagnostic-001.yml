name: H004 Carrier Diagnostic 001

on:
  push:
    branches: [main]
    paths:
      - ARM_H004_CARRIER_DIAGNOSTIC_001

permissions:
  contents: read

concurrency:
  group: h004-carrier-diagnostic-001
  cancel-in-progress: false

jobs:
  diagnostic:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    timeout-minutes: 12

    steps:
      - name: Bootstrap checkout tools
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git

      - name: Checkout diagnostic commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce one-shot diagnostic identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test -f ARM_H004_CARRIER_DIAGNOSTIC_001
          created="$(git log --diff-filter=A --format=%H -- ARM_H004_CARRIER_DIAGNOSTIC_001 | head -n1)"
          test -n "$created"
          test "$created" = "$GITHUB_SHA"

      - name: Prepare complete carrier surface
        shell: bash
        run: |
          set -euo pipefail
          printf 'Acquire::Languages "en";\n' > /etc/apt/apt.conf.d/zzzz-project-brain-languages
          apt-get update
          apt-get install -y --no-install-recommends \
            python3 python3-xapian zbar-tools apt-file sudo qrencode
          apt-file update
          mkdir -p canonical/astra_runtime/evidence canonical/astra_runtime/pending_bindings canonical/astra_runtime/tmp
          python3 -c 'import xapian'
          sudo -n true
          command -v apt-cache
          command -v zbarimg
          command -v qrencode

      - name: Verify complete carrier surface without H004 execution
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib, re, subprocess, sys

          root=pathlib.Path(".").resolve()
          manifest=json.loads((root/"canonical/astra_runtime/verification_capsules/H004_PUBLIC_GITHUB_ACTIONS_ONESHOT_001.json").read_text())

          def git_blob_sha(path):
              raw=path.read_bytes()
              return hashlib.sha1(b"blob "+str(len(raw)).encode()+b"\0"+raw).hexdigest()

          bad=[]
          for rel,expected in manifest["sealed_files"].items():
              p=root/rel
              if not p.is_file():
                  bad.append([rel,"MISSING"])
              else:
                  actual=git_blob_sha(p)
                  if actual!=expected:
                      bad.append([rel,actual,expected])
          if bad:
              raise SystemExit("SEALED_BLOB_MISMATCH:"+json.dumps(bad,sort_keys=True))

          start=root/"canonical/astra_runtime/evidence/XAPIAN-APT-E2E-INTEGRATION-HELDOUT-004__EXECUTION_START.json"
          result=root/"canonical/astra_runtime/evidence/XAPIAN-APT-E2E-INTEGRATION-HELDOUT-004__RESULT.json"
          if start.exists() or result.exists():
              raise SystemExit("H004_ALREADY_STARTED_OR_TERMINAL")

          proc=subprocess.run(
              ["apt-get","indextargets","--format","$(IDENTIFIER)\t$(FILENAME)"],
              text=True,capture_output=True,check=True
          )
          rows=[]
          for line in proc.stdout.splitlines():
              if "\t" in line:
                  ident,filename=line.split("\t",1)
                  rows.append((ident.strip(),filename.strip()))

          arch=subprocess.check_output(["dpkg","--print-architecture"],text=True).strip()
          packages=any(i.startswith("Packages") for i,_ in rows)
          translation_en=any("Translation-en" in f or ("Translation" in i and "en" in f) for i,f in rows)
          contents=[(i,f) for i,f in rows if i.startswith("Contents")]
          contents_all=any(("Contents-all" in f) or re.search(r"Contents[-_](?:deb[-_])?all(?:\.|_|$)",f) for _,f in contents)
          contents_arch=any(("Contents-"+arch in f) or re.search(r"Contents[-_](?:deb[-_])?"+re.escape(arch)+r"(?:\.|_|$)",f) for _,f in contents)
          if not packages: raise SystemExit("NORMAL_PACKAGES_METADATA_MISSING")
          if not translation_en: raise SystemExit("TRANSLATION_EN_METADATA_MISSING")
          if not contents: raise SystemExit("CONTENTS_METADATA_MISSING")
          if not contents_all: raise SystemExit("CONTENTS_ALL_METADATA_MISSING")
          if not contents_arch: raise SystemExit("CONTENTS_ARCH_METADATA_MISSING:"+arch)

          tags=subprocess.run(["bash","-lc","apt-cache dumpavail | grep -m1 '^Tag:'"],text=True,capture_output=True)
          if tags.returncode!=0:
              raise SystemExit("DEBIAN_PACKAGE_TAG_METADATA_MISSING")

          runtime=root/"canonical/runtime"
          sys.path.insert(0,str(runtime))
          import auto_apt_cli_acquisition, executor_broker, verify_pending_cli_binding
          from bound_capabilities import cli_command, python_library_codec, node_library_codec, python_source_tree_codec
          import capability_discovery

          discovery=capability_discovery.search_apt_packages(
              "synchronize directory trees while preserving permissions and timestamps",
              limit=12
          )
          if discovery.get("source")!="APT_FULL_METADATA_XAPIAN":
              raise SystemExit("FULL_METADATA_XAPIAN_ROUTE_NOT_ACTIVE:"+json.dumps(discovery,sort_keys=True)[:2000])
          mr=discovery.get("metadata_route") or {}
          required={"translation_en":True,"debian_tags":True,"xapian_bm25":True,"contents_direct_stream":True}
          for k,v in required.items():
              if mr.get(k) is not v:
                  raise SystemExit("METADATA_ROUTE_FLAG_FAILED:"+k+":"+json.dumps(mr,sort_keys=True))
          candidates=discovery.get("candidates") or []
          if not any(c.get("evidence_tier")=="SEMANTIC_PACKAGE_EXECUTABLE_OWNERSHIP" for c in candidates):
              raise SystemExit("NO_EXECUTABLE_OWNERSHIP_CANDIDATE")

          print(json.dumps({
              "sealed_files":len(manifest["sealed_files"]),
              "packages_metadata":packages,
              "translation_en":translation_en,
              "contents_targets":len(contents),
              "contents_all":contents_all,
              "contents_arch":contents_arch,
              "architecture":arch,
              "package_tags":True,
              "xapian_import":True,
              "full_metadata_xapian_route":True,
              "contents_direct_stream":True,
              "verifier_import_closure":True,
              "candidate_count":len(candidates)
          },sort_keys=True))
          PY

          qrencode -o /tmp/project-brain-carrier-diagnostic.png 'PROJECT-BRAIN-CARRIER-DIAGNOSTIC-001'
          decoded="$(zbarimg --quiet --raw /tmp/project-brain-carrier-diagnostic.png)"
          test "$decoded" = "PROJECT-BRAIN-CARRIER-DIAGNOSTIC-001"
          echo H004_CARRIER_DIAGNOSTIC_PASS=1
