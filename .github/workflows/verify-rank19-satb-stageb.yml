name: Verify rank19 SATB Stage-B
on:
  pull_request:
    branches: [main]
    paths:
      - 'verification/rank19/**'
      - '.github/workflows/verify-rank19-satb-stageb.yml'
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m unittest -v verification.rank19.test_stage_b_static
  cpu-feasibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Install pinned ONNX-only AMT and notation stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps 'git+https://github.com/spotify/basic-pitch@fa5997af0a8210982619003269994a1be25eddf3'
          python -m pip install 'numpy<2.3' scipy librosa pretty_midi mir_eval 'resampy<0.4.3' scikit-learn typing_extensions onnxruntime soundfile music21
      - name: Run synthetic non-task CPU smoke
        run: python verification/rank19/generic_cpu_feasibility.py
