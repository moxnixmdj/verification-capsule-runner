name: Verify Qwen3.8 Q2 resource fit
on:
  push:
    branches:
      - verify/qwen38-q2-resource-fit-20261004
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.14"
      - run: python verify_qwen38_q2_resource_fit.py
