name: Fresh Real Grounding Task A - Python Test Audit
on:
  push:
    branches:
      - verify/plain-goal-bound-grounding-v1-20260930
permissions:
  contents: read
jobs:
  task-a:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact candidate and bound capability blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object canonical/runtime/bound_capabilities/plain_goal_bound_grounding.py)" = "00f5d0c1c742f444ad876103f251bb4476017dc1"
          test "$(git hash-object canonical/runtime/bound_capabilities/plain_goal_bound_grounding_verify.py)" = "d4aa64dc995845fcf8045f14f476f84b7f1d9cb8"
          test "$(git hash-object canonical/runtime/bound_capabilities/python_test_audit.py)" = "b6fe40131583587e21f9c1e369679de140349e81"
          test "$(git hash-object canonical/runtime/BOUND_CAPABILITY_REGISTRY_V1.json)" = "1b4a05c1b24070a7d2125713af11231214021a97"
      - name: Ground and execute fresh real software-quality task
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util,json,pathlib,sys
          root=pathlib.Path(".").resolve()
          def load(name,path):
              spec=importlib.util.spec_from_file_location(name,path)
              mod=importlib.util.module_from_spec(spec); sys.modules[name]=mod; spec.loader.exec_module(mod); return mod
          g=load("task_a_grounder",root/"canonical/runtime/bound_capabilities/plain_goal_bound_grounding.py")
          v=load("task_a_grounding_verifier",root/"canonical/runtime/bound_capabilities/plain_goal_bound_grounding_verify.py")
          audit=load("task_a_audit",root/"canonical/runtime/bound_capabilities/python_test_audit.py")
          registry=json.loads((root/"canonical/runtime/BOUND_CAPABILITY_REGISTRY_V1.json").read_text())["capabilities"]
          goal="Audit the Python tests with unittest and report passed failed and skipped counts."
          grounding=g.ground(goal,registry)
          ok,reason=v.verify(goal,grounding,registry)
          assert ok,reason
          assert grounding["model_dependency_count"]==0
          assert "python.tests.audit.unittest" in grounding["candidate_capability_ids"],grounding["candidate_capability_ids"]
          assert grounding["grounded_clause_count"]>=1
          assert grounding["whole_goal_external_discovery_forbidden_if_any_bound_grounding"] is True
          result=audit.run({
              "source_root":"canonical/tests",
              "pattern":"test_plain_goal*.py",
              "timeout_s":180,
              "output_path":"canonical/astra_runtime/tmp/PLAIN_GOAL_GROUNDING_TASK_A_TEST_AUDIT.json",
          },root)
          assert result["output_verified"] is True,result
          evidence={
            "schema":"PROJECT_BRAIN_PLAIN_GOAL_GROUNDING_REAL_TASK_A_V1",
            "goal":goal,
            "grounding":grounding,
            "selected_bound_capability":"python.tests.audit.unittest",
            "external_supplier_discovery_attempted":False,
            "model_dependency_count":0,
            "execution_result":result,
          }
          pathlib.Path("GROUNDING_TASK_A_RESULT.json").write_text(json.dumps(evidence,indent=2,sort_keys=True)+"\n")
          PY
      - name: Independently verify audit effect
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,pathlib,subprocess,sys
          root=pathlib.Path(".").resolve()
          report_path=root/"canonical/astra_runtime/tmp/PLAIN_GOAL_GROUNDING_TASK_A_TEST_AUDIT.json"
          report=json.loads(report_path.read_text())
          assert report["schema"]=="PROJECT_BRAIN_PYTHON_TEST_AUDIT_V1"
          records=report["records"]; totals=report["totals"]
          assert records
          assert totals["files"]==len(records)
          assert totals["tests"]==sum(x["tests"] for x in records)
          assert totals["passed"]==sum(x["passed"] for x in records)
          assert totals["failed"]==sum(x["failed"] for x in records)==0
          assert totals["errors"]==sum(x["errors"] for x in records)==0
          assert totals["skipped"]==sum(x["skipped"] for x in records)
          for rec in records:
              p=root/rec["path"]
              assert p.is_file()
              assert hashlib.sha256(p.read_bytes()).hexdigest()==rec["sha256"]
              assert rec["exit_code"]==0
          proc=subprocess.run(
              [sys.executable,"-m","unittest","discover","-s","canonical/tests","-p","test_plain_goal*.py"],
              text=True,capture_output=True
          )
          assert proc.returncode==0,proc.stdout+"\n"+proc.stderr
          evidence=json.loads(pathlib.Path("GROUNDING_TASK_A_RESULT.json").read_text())
          evidence["independent_verification"]={
              "producer_independent":True,
              "fresh_unittest_discovery_returncode":proc.returncode,
              "report_totals":totals,
              "verified":True,
          }
          pathlib.Path("GROUNDING_TASK_A_RESULT.json").write_text(json.dumps(evidence,indent=2,sort_keys=True)+"\n")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: grounding-real-task-a-python-test-audit
          path: |
            GROUNDING_TASK_A_RESULT.json
            canonical/astra_runtime/tmp/PLAIN_GOAL_GROUNDING_TASK_A_TEST_AUDIT.json
