name: Verify Tool Discovery six-class residual
on:
  push:
    branches: [verify/tool-discovery-six-class-residual-v1-20261003-sol]
    paths:
      - "capsules/tool_discovery_six_class_residual_v1/**"
      - ".github/workflows/verify-tool-discovery-six-class-residual-v1.yml"
  pull_request:
    branches: [main]
    paths:
      - "capsules/tool_discovery_six_class_residual_v1/**"
      - ".github/workflows/verify-tool-discovery-six-class-residual-v1.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact mirrored blobs
        shell: bash
        run: |
          set -euo pipefail
          cd capsules/tool_discovery_six_class_residual_v1
          python - <<'PY'
          import json, subprocess
          m=json.load(open("manifest.json"))
          for path,row in m["source_files"].items():
              got=subprocess.check_output(["git","hash-object",path],text=True).strip()
              assert got==row["blob_sha"], (path,row["blob_sha"],got)
          print("EXACT_BLOBS_PASS",len(m["source_files"]))
          PY
      - name: Run isolated theorem tests
        shell: bash
        run: |
          set -euo pipefail
          cd capsules/tool_discovery_six_class_residual_v1
          export PYTHONPATH=.
          python -m unittest -v canonical.tests.test_tool_discovery_six_class_residual_compression_v1
      - name: Enforce zero-credit scope firewall
        shell: bash
        run: |
          set -euo pipefail
          cd capsules/tool_discovery_six_class_residual_v1
          export PYTHONPATH=.
          python - <<'PY'
          from canonical.runtime import tool_discovery_six_class_residual_compression_v1 as p
          out=p.evaluate()
          assert out["pass"] is True, out
          assert out["status"].startswith("PASS__FROZEN_GENERATOR_UNIVERSAL_SIX_CLASS_QUOTIENT"), out
          assert out["six_class_score"]["classes_passed"]==6, out
          assert out["scope_relation"]["strict_acceptance_closed"] is False, out
          assert out["acceptance_credit_delta"]==0, out
          assert out["family_credit_delta"]==0, out
          assert out["capability_credit_delta"]==0, out
          assert out["execution_authority"] is False, out
          assert out["promotion_authority"] is False, out
          print("SCOPE_FIREWALL_PASS")
          PY
