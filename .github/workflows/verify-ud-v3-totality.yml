name: Verify Unknown-Domain V3 namespace-total theorem

on:
  create:
  pull_request:
    branches:
      - main
    paths:
      - 'subject/ud_v3_totality/**'
      - '.github/workflows/verify-ud-v3-totality.yml'

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name != 'create' || (github.ref_type == 'branch' && startsWith(github.ref_name, 'ud-v3-totality-fastlane/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bind immutable event SHA on create fastlane
        if: github.event_name == 'create'
        run: |
          python - <<'PY'
          import os, subprocess
          head=subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()
          assert head==os.environ["GITHUB_SHA"],(head,os.environ["GITHUB_SHA"])
          assert os.environ["GITHUB_REF_NAME"].startswith("ud-v3-totality-fastlane/")
          print("immutable V3 totality fastlane subject PASS",head)
          PY
      - name: Run independent content-bound theorem verifier
        working-directory: subject/ud_v3_totality
        run: |
          PYTHONPATH=. python verify_ud_v3_namespace_totality.py
