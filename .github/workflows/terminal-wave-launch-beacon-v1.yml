name: Terminal wave launch beacon V1
on:
  pull_request:
    branches: [main]
    paths:
      - 'beacons/terminal_wave_v1/**'
permissions:
  contents: read
jobs:
  beacon:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Emit predeclared unpredictable beacon only
        env:
          EXPECTED_SNAPSHOT: '821712c059b139f3494723dca6e8d0fc82ee59a4'
          EXPECTED_COMMITMENT: '5a347e796d124373b557424a51659e8bb69b854d09da0b407a5b30f109d9467a'
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          d=json.load(open('beacons/terminal_wave_v1/request.json'))
          assert d['schema']=='PROJECT_BRAIN_TERMINAL_WAVE_BEACON_REQUEST_V1'
          assert d['execution_snapshot_commit']==os.environ['EXPECTED_SNAPSHOT']
          assert d['package_commitment']==os.environ['EXPECTED_COMMITMENT']
          assert d['terminal_cases_requested'] is False
          print('BEACON_RUN_ID='+os.environ['GITHUB_RUN_ID'])
          print('ZERO_TERMINAL_CASES_CONSUMED')
          PY
