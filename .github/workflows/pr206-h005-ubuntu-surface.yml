name: PR206 H005 Ubuntu Direct Surface Qualification

on:
  push:
    branches: [main]
    paths:
      - ARM_PR206_H005_UBUNTU_SURFACE

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Configure faithful metadata and dependencies
        shell: bash
        run: |
          set -euo pipefail
          printf 'Acquire::Languages "en";\n' | sudo tee /etc/apt/apt.conf.d/zzzz-project-brain-languages >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apt-file python3-xapian zbar-tools
          sudo apt-file update
      - name: Qualify metadata, Xapian, ownership, repaired imports, and Code39 oracle support
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util, json, pathlib, re, subprocess, sys
          root=pathlib.Path(".").resolve()
          runtime=root/"canonical"/"runtime"
          sys.path.insert(0,str(runtime))

          rows=[]
          p=subprocess.run(["apt-get","indextargets","--format","$(IDENTIFIER)\t$(FILENAME)"],text=True,capture_output=True,check=True)
          for line in p.stdout.splitlines():
              if "\t" in line:
                  ident,filename=line.split("\t",1)
                  rows.append((ident.strip(),filename.strip()))
          arch=subprocess.check_output(["dpkg","--print-architecture"],text=True).strip()
          packages=any(i.startswith("Packages") for i,_ in rows)
          translation_en=any("Translation-en" in f or ("Translation" in i and "en" in f) for i,f in rows)
          contents=[(i,f) for i,f in rows if i.startswith("Contents")]
          contents_all=any(re.search(r"Contents[-_](?:deb[-_])?all(?:\.|_|$)",f) or "Contents-all" in f for _,f in contents)
          contents_arch=any(re.search(r"Contents[-_](?:deb[-_])?"+re.escape(arch)+r"(?:\.|_|$)",f) or ("Contents-"+arch) in f for _,f in contents)
          if not packages: raise SystemExit("NORMAL_PACKAGES_METADATA_MISSING")
          if not translation_en: raise SystemExit("TRANSLATION_EN_METADATA_MISSING")
          if not contents_all: raise SystemExit("CONTENTS_ALL_METADATA_MISSING")
          if not contents_arch: raise SystemExit("CONTENTS_ARCH_METADATA_MISSING:"+arch)

          tags=subprocess.run(["bash","-lc","apt-cache dumpavail | grep -m1 '^Tag:'"],text=True,capture_output=True)
          if tags.returncode!=0: raise SystemExit("PACKAGE_TAG_METADATA_MISSING")

          import xapian
          import capability_discovery
          result=capability_discovery.search_apt_packages("decode barcode image",limit=12)
          if result.get("source")!="APT_FULL_METADATA_XAPIAN":
              raise SystemExit("FULL_METADATA_XAPIAN_NOT_ACTIVE:"+str(result.get("source")))
          if not result.get("candidates"):
              raise SystemExit("GENERIC_DISCOVERY_EMPTY")
          if not any((c.get("evidence_tier")=="SEMANTIC_PACKAGE_EXECUTABLE_OWNERSHIP" and (c.get("executable_semantic_evidence") or {}).get("command_paths")) for c in result["candidates"]):
              raise SystemExit("EXECUTABLE_OWNERSHIP_EVIDENCE_MISSING")

          spec=importlib.util.spec_from_file_location("repaired_verifier",root/"diagnostics/pr206/verify_pending_cli_binding.py")
          mod=importlib.util.module_from_spec(spec); sys.modules[spec.name]=mod; spec.loader.exec_module(mod)
          strong=next(c for c in result["candidates"] if c.get("evidence_tier")=="SEMANTIC_PACKAGE_EXECUTABLE_OWNERSHIP")
          if not mod._semantic_verifier_candidate_has_sufficient_evidence(strong):
              raise SystemExit("REPAIRED_VERIFIER_REJECTS_STRONG_EVIDENCE")

          z=subprocess.run(["zbarimg","--set","code39.enable=1","--version"],text=True,capture_output=True)
          if z.returncode!=0:
              raise SystemExit("ZBAR_CODE39_CONFIGURATION_UNSUPPORTED:"+z.stderr[-500:])

          print(json.dumps({
            "schema":"PROJECT_BRAIN_H005_UBUNTU_DIRECT_SURFACE_QUALIFICATION_V1",
            "qualified":True,
            "os":"ubuntu-24.04-direct-host",
            "architecture":arch,
            "packages_metadata":packages,
            "translation_en":translation_en,
            "package_tags":True,
            "contents_all":contents_all,
            "contents_arch":contents_arch,
            "contents_targets":len(contents),
            "python3_xapian":True,
            "full_metadata_source":result.get("source"),
            "candidate_count":len(result.get("candidates") or []),
            "executable_ownership":True,
            "repaired_verifier_strong_evidence_admission":True,
            "zbar_code39_config":True,
            "heldout_executed":False
          },sort_keys=True))
          PY
