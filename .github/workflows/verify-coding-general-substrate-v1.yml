name: Verify coding general-substrate differential V1
on:
  pull_request:
    branches: [main]
    paths:
      - 'verification/coding_general_substrate_v1/**'
      - '.github/workflows/verify-coding-general-substrate-v1.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run synthetic configured-vs-bare substrate differential
        run: python verification/coding_general_substrate_v1/run.py
      - name: Upload differential receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coding-general-substrate-v1
          path: substrate_result.json
          if-no-files-found: error
