name: Verify objective-oracle dominance compiler

on:
  pull_request:
    branches: [main]
    paths:
      - 'capsules/objective_oracle_dominance_v1/**'
      - '.github/workflows/verify-objective-oracle-dominance-v1.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact Brain blobs and fail-closed compiler tests
        run: |
          set -euo pipefail
          cd capsules/objective_oracle_dominance_v1
          PYTHONPATH=. python -m unittest -v canonical.tests.test_objective_oracle_dominance_compiler test_brain_blob_binding
      - name: Compile live four-contract objective route state
        run: |
          set -euo pipefail
          cd capsules/objective_oracle_dominance_v1
          PYTHONPATH=. python canonical/runtime/objective_oracle_dominance_compiler.py canonical/governance/OBJECTIVE_ORACLE_DOMINANCE_LIVE_INPUT_V1.json > /tmp/objective-oracle.json
          python - <<'PY'
          import json
          p=json.load(open("/tmp/objective-oracle.json"))
          assert p["status"] == "OBJECTIVE_ROUTES_STRUCTURALLY_COMPILED__PREWAVE_GATES_OPEN", p
          assert p["all_objective_specs_complete"] is True, p
          assert p["all_prewave_routes_ready_for_promotion_law"] is False, p
          assert len(p["contracts"]) == 4, p
          for row in p["contracts"]:
              assert row["stronger_direct_behavioral_route_structurally_available"] is True, row
              assert row["weaker_comparator_structurally_unnecessary_if_route_verified"] is True, row
              assert row["weaker_comparator_deletion_authorized_now"] is False, row
              assert row["open_route_gates"], row
          assert p["execution_authority"] is False, p
          assert p["promotion_authority"] is False, p
          assert p["capability_credit_delta"] == 0, p
          PY
