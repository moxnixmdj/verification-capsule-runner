name: Isolated Unknown-Domain V2 universal proof

on:
  pull_request:
    branches:
      - verify-sink/unknown-domain-v2-universal-20261005
    paths:
      - verification/unknown_domain_v2_universal_proof_isolated_v1.py
      - .github/workflows/isolated-unknown-domain-v2-universal-proof.yml
  push:
    branches:
      - exec/unknown-domain-v2-universal-proof-isolated-20261005
    paths:
      - verification/unknown_domain_v2_universal_proof_isolated_v1.py
      - .github/workflows/isolated-unknown-domain-v2-universal-proof.yml

permissions:
  contents: write

concurrency:
  group: isolated-unknown-domain-v2-universal-proof-20261005
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exec/unknown-domain-v2-universal-proof-isolated-20261005
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact content-bound verifier
        id: exact_verify
        continue-on-error: true
        run: python3 verification/unknown_domain_v2_universal_proof_isolated_v1.py
      - name: Seal independent outcome receipt
        if: always()
        env:
          VERIFY_OUTCOME: ${{ steps.exact_verify.outcome }}
          VERIFY_CONCLUSION: ${{ steps.exact_verify.conclusion }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          JOB_ID: ${{ github.job }}
        run: |
          mkdir -p receipts
          python3 - <<'PY'
          import json, os, pathlib
          src=pathlib.Path("unknown_domain_v2_universal_proof_receipt.json")
          if src.exists():
              d=json.loads(src.read_text())
          else:
              d={
                "schema":"PROJECT_BRAIN_UNKNOWN_DOMAIN_V2_UNIVERSAL_PROOF_ISOLATED_EXECUTION_V1",
                "status":"VERIFIER_DID_NOT_EMIT_SUCCESS_RECEIPT"
              }
          d["isolated_runner_branch"]="exec/unknown-domain-v2-universal-proof-isolated-20261005"
          d["isolated_runner_workflow"]="isolated-unknown-domain-v2-universal-proof.yml"
          d["isolated_runner_source_sha"]=os.environ["SOURCE_SHA"]
          d["isolated_runner_run_id"]=os.environ["RUN_ID"]
          d["isolated_runner_job_id"]=os.environ["JOB_ID"]
          d["verifier_step_outcome"]=os.environ["VERIFY_OUTCOME"]
          d["verifier_step_conclusion"]=os.environ["VERIFY_CONCLUSION"]
          d["isolated_runner_commit_receipt"]=True
          p=pathlib.Path("receipts/UNKNOWN_DOMAIN_V2_UNIVERSAL_PROOF_ISOLATED_20261005.json")
          p.write_text(json.dumps(d,indent=2,sort_keys=True)+"\n")
          PY
          git config user.name "project-brain-verifier"
          git config user.email "project-brain-verifier@users.noreply.github.com"
          git add receipts/UNKNOWN_DOMAIN_V2_UNIVERSAL_PROOF_ISOLATED_20261005.json
          git commit -m "Seal isolated Unknown-Domain universal proof outcome" || true
          git push origin HEAD:exec/unknown-domain-v2-universal-proof-isolated-20261005
      - name: Enforce verifier pass
        if: steps.exact_verify.outcome != 'success'
        run: exit 1
