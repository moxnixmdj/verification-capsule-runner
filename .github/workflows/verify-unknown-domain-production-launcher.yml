name: Verify Unknown-Domain production launcher
on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/runtime/unknown_domain_direct_production_once_v1.py'
      - 'canonical/tests/test_unknown_domain_direct_production_once_v1.py'
      - 'canonical/governance/UNKNOWN_DOMAIN_DIRECT_EXECUTION_LEASE_V1.json'
      - '.github/workflows/unknown-domain-direct-one-use-production.yml'
      - '.github/workflows/verify-unknown-domain-production-launcher.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest canonical.tests.test_unknown_domain_direct_production_once_v1 -v
      - name: Static workflow firewall
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          workflow_path=Path('.github/workflows/unknown-domain-direct-one-use-production.yml')
          p=workflow_path.read_text()
          assert 'create:' in p
          assert 'workflow_dispatch' not in p
          assert "unknown-domain-direct-launch/" in p
          assert "contents: write" in p
          assert "run: python -m canonical.runtime.unknown_domain_direct_production_once_v1" in p
          raw=workflow_path.read_bytes()
          blob=hashlib.sha1(b"blob "+str(len(raw)).encode()+b"\0"+raw).hexdigest()
          lease=json.loads(Path('canonical/governance/UNKNOWN_DOMAIN_DIRECT_EXECUTION_LEASE_V1.json').read_text())
          assert lease["exact_components"][".github/workflows/unknown-domain-direct-one-use-production.yml"]==blob
          assert lease["exact_components"]["canonical/runtime/unknown_domain_direct_hidden_generator_v1.py"]=="f974a4594c78e74693c7ba5a19f131dfa481b937"
          print("launcher workflow firewall PASS",blob)
          PY
