name: Chartography Brain-native line diagnostic V1

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/chartography-brain-native-line-diagnostic-v1.yml"
      - "subject/chartography_brain_native/**"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install deterministic stack
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr
          python -m pip install --disable-pip-version-check --no-input pillow numpy opencv-python-headless matplotlib
      - name: Ownership guard
        run: "! grep -RniE 'llama-server|Qwen|MiniCPM|ChartVerse|anthropic|openai|gemini|transformers|vllm' subject/chartography_brain_native"
      - name: Run compact diagnostic
        run: python subject/chartography_brain_native/synthetic_generalization_v1.py --out out/diag --seed 20261011 --line-cases 6 --phase-cases 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chartography-brain-native-line-diagnostic-v1
          path: out/diag/synthetic_result.json
          if-no-files-found: error
