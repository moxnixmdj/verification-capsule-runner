name: Verify Root2 V10 effective scheduling

on:
  pull_request:
    paths:
      - 'ROOT2_FRONTIER_V10_ACTIVATION_V1.json'
      - 'TERMINAL_ROOT_CAUSE_STATE_V1.json'
      - 'ROOT2_MEASUREMENT_BRIDGE_CURRENT_V1.json'
      - 'CURRENT_TERMINAL_AUTHORITY_V1.json'
      - 'verify_root2_v10_effective_scheduling.py'
      - '.github/workflows/verify-root2-v10-effective-scheduling.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact Brain candidate blobs
        shell: bash
        run: |
          test "$(git hash-object ROOT2_FRONTIER_V10_ACTIVATION_V1.json)" = "d0c551edcce3ca5037c72380e94f498ae8b42660"
          test "$(git hash-object TERMINAL_ROOT_CAUSE_STATE_V1.json)" = "6ded4aedf1f9b19cdf724ea70974c30ab5b9e9de"
          test "$(git hash-object ROOT2_MEASUREMENT_BRIDGE_CURRENT_V1.json)" = "492d1bad6be971cc732abc2768095a4d8f0aa087"
          test "$(git hash-object CURRENT_TERMINAL_AUTHORITY_V1.json)" = "efa669186aa0789a2836db22911dc5c402b6c327"
      - name: Verify cross-surface scheduling coherence
        run: python verify_root2_v10_effective_scheduling.py
