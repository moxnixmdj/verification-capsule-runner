name: Verify contract-native information-boundary falsification
on:
  pull_request:
    branches: [main]
    paths:
      - 'capsules/contract_native_info_boundary_v1/**'
      - '.github/workflows/verify-contract-native-info-boundary-v1.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cd capsules/contract_native_info_boundary_v1 && PYTHONPATH=. python -m unittest -v canonical.tests.test_contract_native_proof_information_boundary_audit
      - run: cd capsules/contract_native_info_boundary_v1 && PYTHONPATH=. python canonical/runtime/audit_contract_native_proof_information_boundary.py
