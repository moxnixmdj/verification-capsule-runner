name: Verify LiveBench Root1 forced-fail truth repair
on:
  push:
    branches:
      - "verify/livebench-root1-forced-fail-truth-repair-20261004-sol"
    paths:
      - "capsules/livebench_root1_truth_repair/**"
      - "verify_livebench_root1_forced_fail_truth_repair.py"
      - ".github/workflows/verify-livebench-root1-forced-fail-truth-repair.yml"
  pull_request:
    branches: [main]
    paths:
      - "capsules/livebench_root1_truth_repair/**"
      - "verify_livebench_root1_forced_fail_truth_repair.py"
      - ".github/workflows/verify-livebench-root1-forced-fail-truth-repair.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python verify_livebench_root1_forced_fail_truth_repair.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livebench-root1-forced-fail-truth-repair-receipt
          path: livebench_root1_forced_fail_truth_repair_verification_receipt.json
          if-no-files-found: error
