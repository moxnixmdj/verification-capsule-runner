name: Verify P1 typed trajectory causal route V3
on:
  pull_request:
    branches: [main]
    paths:
      - 'verification/trajectory_failure_typed_ir_candidate_v3.py'
      - 'verification/trajectory_failure_typed_ir_proof_v3.py'
      - 'verification/test_trajectory_failure_typed_ir_v3.py'
      - '.github/workflows/verify-p1-typed-trajectory-v3.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -q pytest
      - run: pytest -q verification/test_trajectory_failure_typed_ir_v3.py
