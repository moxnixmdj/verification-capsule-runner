name: Verify IFBench58 visible-state static cut

on:
  push:
    branches:
      - verify/livebench-ifbench58-visible-state-cut-20261005-sol
  pull_request:
    paths:
      - verify_livebench_ifbench58_visible_state_cut.py
      - .github/workflows/verify-livebench-ifbench58-visible-state-cut.yml
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verifier
        uses: actions/checkout@v4
        with:
          path: verifier
      - name: Checkout pinned LiveBench subject
        uses: actions/checkout@v4
        with:
          repository: LiveBench/LiveBench
          ref: 8f8e5c381a16e3f24257776edd53471fe86f8091
          path: subject
      - name: Verify source-derived cut
        run: python verifier/verify_livebench_ifbench58_visible_state_cut.py subject
      - name: Upload receipt
        uses: actions/upload-artifact@v4
        with:
          name: livebench-ifbench58-visible-state-cut-receipt
          path: livebench_ifbench58_visible_state_cut_receipt.json
          if-no-files-found: error
