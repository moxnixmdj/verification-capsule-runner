name: Verify Finance Agent custom-function alternative route
on:
  pull_request:
    paths:
      - "subject/finance_agent_custom_route_20261004_sol/**"
      - "verify_finance_agent_custom_function_route.py"
      - ".github/workflows/verify-finance-agent-custom-function-route.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python verify_finance_agent_custom_function_route.py
