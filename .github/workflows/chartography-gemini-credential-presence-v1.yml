name: Chartography Gemini credential presence V1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/chartography-gemini-credential-presence-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GOOGLE_GENAI_API_KEY: ${{ secrets.GOOGLE_GENAI_API_KEY }}
    steps:
      - name: Report presence only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          names=["GOOGLE_API_KEY","GEMINI_API_KEY","GOOGLE_GENAI_API_KEY"]
          present={name: bool(os.environ.get(name,"").strip()) for name in names}
          out={
            "schema":"PROJECT_BRAIN_CHARTOGRAPHY_GEMINI_CREDENTIAL_PRESENCE_V1",
            "present":present,
            "any_present":any(present.values()),
            "values_exposed":False,
            "api_call_made":False,
            "incremental_spend_usd":0,
          }
          print(json.dumps(out,sort_keys=True))
          PY
