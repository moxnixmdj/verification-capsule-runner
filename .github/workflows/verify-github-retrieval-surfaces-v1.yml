name: Verify GitHub residual retrieval surfaces V1
on:
  pull_request:
    branches: [main]
    paths:
      - subjects/github_public_retrieval_provider_v1.py
      - subjects/residual_witness_backend_router_v1.py.txt
      - verify_github_retrieval_surfaces_v1.py
      - .github/workflows/verify-github-retrieval-surfaces-v1.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python verify_github_retrieval_surfaces_v1.py
