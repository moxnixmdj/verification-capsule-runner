name: Probe Smaug remote range delta spectrum V1
on:
  pull_request:
    branches: [main]
    paths:
      - verify_smaug_remote_range_delta_spectrum_v1.py
      - .github/workflows/probe-smaug-remote-range-delta-spectrum-v1.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bounded probe dependencies
        run: python -m pip install --disable-pip-version-check "numpy==2.3.3" "requests==2.32.5"
      - name: Measure merged-delta spectra by HTTP range only
        run: python verify_smaug_remote_range_delta_spectrum_v1.py
      - name: Preserve receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smaug-remote-range-delta-spectrum-v1
          path: smaug_remote_range_delta_spectrum_v1.json
          if-no-files-found: error
