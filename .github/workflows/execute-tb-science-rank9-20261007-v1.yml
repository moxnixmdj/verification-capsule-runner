name: Execute TB-Science rank9 v1 one-shot

on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/tb_science_rank9_20261007_v1/ACTIVATE_RANK9_PR.json"

permissions:
  contents: read

concurrency:
  group: tb-science-rank9-v1-one-shot
  cancel-in-progress: false

jobs:
  terminal-slot:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pre-exposure authority, exact-byte and transitive-closure gate
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$GITHUB_EVENT_NAME" = "pull_request"
          test "$GITHUB_BASE_REF" = "main"
          test "$GITHUB_HEAD_REF" = "execute/tb-science-rank9-20261007-v1"
          C=capsules/tb_science_rank9_20261007_v1
          test "$(git hash-object "$C/TB_SCIENCE_RANK9_ONE_SLOT_EXECUTION_AUTHORITY_20261007_V1.json")" = "af464670453e432367531edb17e8590959ae5c41"
          test "$(git hash-object "$C/ACTION_INTENT_TB_SCIENCE_RANK9_ONE_SHOT_20261007_V1.json")" = "54dfd6dbdf858b386b8a6fa303b55e6ea5803f04"
          test "$(git hash-object "$C/TB_SCIENCE_CURRENT_SLOT_LEDGER_RECONCILIATION_20261007_V6.json")" = "b82cffd09260c6792f473c952d2f0644bb2ca1fa"
          test "$(git hash-object "$C/TB_SCIENCE_TRANSITIVE_RUNTIME_CLOSURE_MANIFEST_20261007_V1.json")" = "4b2a4fb3bd85b066e642a0253d4c325dbb431237"
          test "$(git hash-object "$C/TB_SCIENCE_TRANSITIVE_CARRIER_CLOSURE_PUBLIC_VERIFICATION_20261007_V1.json")" = "cb8c4e36ee47dc2542b120a4a631de6ebdd4e8c5"
          test "$(git hash-object "$C/python_transitive_runtime_closure_v1.py")" = "43d502c621c219632fa0f9a19632dfc0228e4847"
          test "$(git hash-object "$C/RANK9_EPOCH_V1.json")" = "a172896454ef0faf405dc371ac06a01acc866c76"
          python - <<'PY'
          import json, pathlib, subprocess
          C=pathlib.Path("capsules/tb_science_rank9_20261007_v1")
          auth=json.load(open(C/"TB_SCIENCE_RANK9_ONE_SLOT_EXECUTION_AUTHORITY_20261007_V1.json"))
          intent=json.load(open(C/"ACTION_INTENT_TB_SCIENCE_RANK9_ONE_SHOT_20261007_V1.json"))
          ledger=json.load(open(C/"TB_SCIENCE_CURRENT_SLOT_LEDGER_RECONCILIATION_20261007_V6.json"))
          manifest=json.load(open(C/"TB_SCIENCE_TRANSITIVE_RUNTIME_CLOSURE_MANIFEST_20261007_V1.json"))
          verify=json.load(open(C/"TB_SCIENCE_TRANSITIVE_CARRIER_CLOSURE_PUBLIC_VERIFICATION_20261007_V1.json"))
          epoch=json.load(open(C/"RANK9_EPOCH_V1.json"))
          slot="terminal-bench-science/neo-orbit-determination::trial-0"
          digest="sha256:b0038fd39395b57f2036b2c0271f37b508e1250fc97d12c899590b61e997cada"
          assert auth["status"].startswith("ACTIVE__TRANSITIVE_CARRIER_PREFLIGHT_REQUIRED")
          assert auth["slot"]=={"id":slot,"rank":9,"digest":digest}
          assert intent["slot"]=={"id":slot,"digest":digest,"rank":9}
          assert ledger["truth_repair"]["next_untouched_slot"]["slot_id"]==slot
          assert ledger["truth_repair"]["next_untouched_slot"]["task_digest"]==digest
          assert len(ledger["truth_repair"]["consumed_slots"])==8
          assert verify["status"].startswith("INDEPENDENT_PUBLIC_RUNNER_PASS")
          assert verify["verified"]["exact_science_runtime_closure_file_count"]==14
          assert verify["verified"]["complete_exact_carrier_closure_gate_pass"] is True
          assert epoch["status"]=="CURRENT__ONE_USE_PREEXPOSURE_GATE"
          assert epoch["slot_id"]==slot and epoch["task_digest"]==digest
          assert len(manifest["closure"])==14
          for row in manifest["closure"]:
              p=C/row["path"]
              assert p.is_file(), row["path"]
              actual=subprocess.check_output(["git","hash-object",str(p)],text=True).strip()
              assert actual==row["git_blob_sha"], (row["path"],actual,row["git_blob_sha"])
          PY
          python "$C/python_transitive_runtime_closure_v1.py" --repo-root "$C" --carrier-root "$C"             --root canonical/runtime/harbor_science_agent_v1.py             --root canonical/runtime/harbor_science_planner_v1.py             --root canonical/runtime/lossless_raw_task_contract_v1.py             --root canonical/runtime/raw_task_acceptance_residual_localizer_v1.py > RANK9_CARRIER_CLOSURE.json
          PYTHONPATH="$C" python - <<'PY'
          from canonical.runtime.harbor_science_agent_v1 import HarborScienceAgent
          import canonical.runtime.harbor_science_planner_v1 as planner
          assert HarborScienceAgent.name()=="project-brain-science"
          assert planner.MODEL=="brain-qwen3.5-9b"
          PY
          epoch_sha="$(curl -fsSL -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/$C/RANK9_EPOCH_V1.json?ref=main" | python -c 'import json,sys; print(json.load(sys.stdin)["sha"])')"
          test "$epoch_sha" = "a172896454ef0faf405dc371ac06a01acc866c76"
          test "$(nproc)" -ge 4
          awk '/MemTotal/{exit !($2 >= 12000000)}' /proc/meminfo
          df -Pk "$GITHUB_WORKSPACE" | awk 'NR==2{exit !($4 >= 12000000)}'
          docker version >/dev/null
          docker info >/dev/null

      - name: Install exact Harbor
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir -q 'harbor==0.23.0'
          python - <<'PY'
          import importlib.metadata
          assert importlib.metadata.version("harbor")=="0.23.0"
          PY

      - name: Clean-build exact llama.cpp
        run: |
          set -euo pipefail
          rm -rf llama.cpp
          git init llama.cpp
          git -C llama.cpp remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C llama.cpp fetch --depth 1 origin bec4772f6a2527d371557b5d2032641e5ff7619c
          git -C llama.cpp checkout --detach FETCH_HEAD
          test "$(git -C llama.cpp rev-parse HEAD)" = "bec4772f6a2527d371557b5d2032641e5ff7619c"
          cmake -S llama.cpp -B llama.cpp/build -DGGML_CUDA=OFF -DLLAMA_CURL=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build llama.cpp/build -j 2 --target llama-server

      - name: Restore exact Qwen model cache
        uses: actions/cache@v4
        with:
          path: models/Qwen3.5-9B-M-TS-Q4_K_M.gguf
          key: brain-qwen35-9b-f41c0a0c0e43bf721fb2da29374cd1a97271bac0bab08a9dc42964525e82350c

      - name: Acquire and verify exact Qwen model if cache misses
        run: |
          set -euo pipefail
          mkdir -p models
          if [ ! -f models/Qwen3.5-9B-M-TS-Q4_K_M.gguf ]; then
            curl -L --fail --retry 3 --retry-delay 3 --silent --show-error -o models/Qwen3.5-9B-M-TS-Q4_K_M.gguf 'https://huggingface.co/TheStageAI/Qwen3.5-9B-GGUF/resolve/main/Qwen3.5-9B-M-TS-Q4_K_M.gguf?download=true'
          fi
          echo 'f41c0a0c0e43bf721fb2da29374cd1a97271bac0bab08a9dc42964525e82350c  models/Qwen3.5-9B-M-TS-Q4_K_M.gguf' | sha256sum -c -

      - name: Start exact local cognition endpoint
        run: |
          set -euo pipefail
          EXTRA=()
          if llama.cpp/build/bin/llama-server --help 2>&1 | grep -q -- '--reasoning'; then EXTRA+=(--reasoning off); fi
          nohup llama.cpp/build/bin/llama-server -m models/Qwen3.5-9B-M-TS-Q4_K_M.gguf --alias brain-qwen3.5-9b --host 127.0.0.1 --port 8080 -c 8192 -t 4 --parallel 1 --jinja --no-webui "${EXTRA[@]}" > LOCAL_QWEN_SERVER.log 2>&1 &
          ok=0
          for i in $(seq 1 240); do
            if curl -fsS http://127.0.0.1:8080/health > LOCAL_QWEN_HEALTH.json 2>/dev/null; then ok=1; break; fi
            sleep 1
          done
          test "$ok" = 1

      - name: Immediate live-epoch gate before irreversible task exposure
        run: |
          set -euo pipefail
          C=capsules/tb_science_rank9_20261007_v1
          epoch_sha="$(curl -fsSL -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/$C/RANK9_EPOCH_V1.json?ref=main" | python -c 'import json,sys; print(json.load(sys.stdin)["sha"])')"
          test "$epoch_sha" = "a172896454ef0faf405dc371ac06a01acc866c76"
          PYTHONPATH="$C" python - <<'PY'
          from canonical.runtime.harbor_science_agent_v1 import HarborScienceAgent
          assert HarborScienceAgent.name()=="project-brain-science"
          PY

      - name: Execute exactly frozen rank9 slot
        id: execute
        continue-on-error: true
        env:
          TASK_NAME: terminal-bench-science/neo-orbit-determination
          SAFE_ID: neo-orbit-determination-trial-0
        run: |
          set -uo pipefail
          C="$GITHUB_WORKSPACE/capsules/tb_science_rank9_20261007_v1"
          export PYTHONPATH="$C"
          mkdir -p "$GITHUB_WORKSPACE/jobs/$SAFE_ID"
          harbor run -d terminal-bench-science/terminal-bench-science@0.1.0 -i "$TASK_NAME" -a canonical.runtime.harbor_science_agent_v1:HarborScienceAgent -k 1 -n 1 -r 0 --agent-timeout-multiplier 0.60 --environment-build-timeout-multiplier 1.0 --verifier-timeout-multiplier 1.0 --job-name "$SAFE_ID" --jobs-dir "$GITHUB_WORKSPACE/jobs/$SAFE_ID"
          echo "harbor_exit=$?" >> "$GITHUB_OUTPUT"

      - name: Finalize irreversible conservative rank9 receipt
        if: always()
        env:
          SLOT_ID: terminal-bench-science/neo-orbit-determination::trial-0
          TASK_NAME: terminal-bench-science/neo-orbit-determination
          SAFE_ID: neo-orbit-determination-trial-0
          HARBOR_OUTCOME: ${{ steps.execute.outcome }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          base=root/"jobs"/os.environ["SAFE_ID"]
          results=[]
          for p in base.rglob("result.json") if base.exists() else []:
              try: obj=json.loads(p.read_text())
              except Exception: continue
              results.append((p,obj))
          scored=[]
          exception_info=[]
          for p,obj in results:
              vr=obj.get("verifier_result")
              if isinstance(vr,dict) and isinstance(vr.get("rewards"),dict):
                  scored.append((p,obj))
              ex=obj.get("exception_info")
              if isinstance(ex,dict):
                  exception_info.append({"path":str(p.relative_to(root)),"exception_type":ex.get("exception_type"),"exception_message":ex.get("exception_message")})
          reward=None; errors=[]
          if len(scored)==1:
              raw=scored[0][1]["verifier_result"]["rewards"].get("reward")
              if isinstance(raw,(int,float)) and not isinstance(raw,bool): reward=float(raw)
              else: errors.append("REWARD_MISSING_OR_NONNUMERIC")
          elif not scored: errors.append("NO_TRIAL_RESULT_WITH_VERIFIER_REWARD")
          else: errors.append("MULTIPLE_TRIAL_RESULTS_WITH_VERIFIER_REWARD")
          success=(reward is not None and reward>=1.0 and not errors)
          hashes={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p,_ in results}
          receipt={
            "schema":"PROJECT_BRAIN_TB_SCIENCE_TERMINAL_SLOT_RECEIPT_RANK9_V1",
            "slot_id":os.environ["SLOT_ID"],"task_name":os.environ["TASK_NAME"],
            "status":"SUCCESS" if success else "FINAL_ZERO","reward":reward if reward is not None else 0.0,
            "errors":errors,"exception_info":exception_info,"harbor_step_outcome":os.environ.get("HARBOR_OUTCOME"),
            "authority_blob":"af464670453e432367531edb17e8590959ae5c41",
            "intent_blob":"54dfd6dbdf858b386b8a6fa303b55e6ea5803f04",
            "ledger_blob":"b82cffd09260c6792f473c952d2f0644bb2ca1fa",
            "closure_manifest_blob":"4b2a4fb3bd85b066e642a0253d4c325dbb431237",
            "closure_verification_blob":"cb8c4e36ee47dc2542b120a4a631de6ebdd4e8c5",
            "epoch_blob":"a172896454ef0faf405dc371ac06a01acc866c76",
            "github_run_id":os.environ["GITHUB_RUN_ID"],"github_run_attempt":os.environ["GITHUB_RUN_ATTEMPT"],"github_sha":os.environ["GITHUB_SHA"],
            "result_hashes":hashes,"execution_authority_consumed":True,"rerun_credit":False,"incremental_spend_usd":0,"promotion_authority":False
          }
          pathlib.Path("neo-orbit-determination-trial-0__SLOT_RECEIPT.json").write_text(json.dumps(receipt,indent=2,sort_keys=True)+"\n")
          print(json.dumps(receipt,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tb-science-neo-orbit-determination-trial-0-rank9-v1
          path: |
            neo-orbit-determination-trial-0__SLOT_RECEIPT.json
            RANK9_CARRIER_CLOSURE.json
            jobs/neo-orbit-determination-trial-0/
            LOCAL_QWEN_HEALTH.json
            LOCAL_QWEN_SERVER.log
          if-no-files-found: warn
          retention-days: 1
