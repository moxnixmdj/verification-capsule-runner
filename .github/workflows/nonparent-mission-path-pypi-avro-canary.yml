name: Nonparent Mission Path PyPI Avro Canary

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: read

jobs:
  mission-path-canary:
    if: github.head_ref == 'canary/mission-path-pypi-avro-20260930-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ASTRA_DISABLE_MODEL_PLANNER: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Refresh Ubuntu package metadata
        run: sudo apt-get update
      - name: Execute fresh non-parent canonical CLI canary
        id: canary
        continue-on-error: true
        run: python run_nonparent_mission_path_pypi_avro_canary.py
      - name: Upload terminal canary receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nonparent-mission-path-pypi-avro-canary-terminal
          path: nonparent-mission-path-pypi-avro-canary-terminal.json
          if-no-files-found: error
      - name: Preserve canary failure
        if: steps.canary.outcome != 'success'
        run: exit 1
