name: Verify terminal falsification pruner v1
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/terminal_certificate_falsification_pruner_v1/**"
      - ".github/workflows/verify-terminal-falsification-pruner-v1.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact Brain falsification-aware scheduling bytes
        run: python capsules/terminal_certificate_falsification_pruner_v1/verify.py
