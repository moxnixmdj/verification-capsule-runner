name: Verify Root2 V18 decision root projection
on:
  pull_request:
    branches: [main]
    paths:
      - "subject/root2_v18_decision_root_projection/**"
      - "verify_root2_v18_decision_root_projection_v1.py"
      - ".github/workflows/verify-root2-v18-decision-root-projection-v1.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.14"
      - run: python verify_root2_v18_decision_root_projection_v1.py
