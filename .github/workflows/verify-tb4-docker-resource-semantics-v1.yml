name: Verify TB4 Docker resource semantics v1

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/verify-tb4-docker-resource-semantics-v1.yml"
      - "capsules/tb4_docker_resource_semantics_v1/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Host facts
        run: |
          set -euo pipefail
          echo "host_cpus=$(nproc)"
          awk '/MemTotal/ {print "host_mem_kb="$2}' /proc/meminfo
          docker version
          docker compose version

      - name: Verify exact frozen Harbor semantics
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-deps "harbor==0.23.1.dev202609170426"
          python - <<'PY'
          import inspect, json
          import harbor
          from harbor.environments.docker.docker import DockerEnvironment
          from harbor.models.trial.config import ResourceMode

          caps = DockerEnvironment.resource_capabilities()
          src = inspect.getsource(DockerEnvironment._write_resources_compose_file)
          result = {
              "harbor_version": getattr(harbor, "__version__", None),
              "cpu_limit": bool(caps.cpu_limit),
              "cpu_request": bool(caps.cpu_request),
              "memory_limit": bool(caps.memory_limit),
              "memory_request": bool(caps.memory_request),
              "docker_auto_cpu_is_limit": '"cpu", auto_mode=ResourceMode.LIMIT' in src,
              "docker_auto_memory_is_limit": '"memory", auto_mode=ResourceMode.LIMIT' in src,
          }
          print(json.dumps(result, sort_keys=True))
          assert result["cpu_limit"] is True
          assert result["cpu_request"] is False
          assert result["memory_limit"] is True
          assert result["memory_request"] is False
          assert result["docker_auto_cpu_is_limit"] is True
          assert result["docker_auto_memory_is_limit"] is True
          PY

      - name: Prove over-host Docker limits are creation-admissible
        run: |
          set -euo pipefail
          image="alpine:3.23.4"
          docker pull "$image"
          host_cpus="$(nproc)"
          host_mem_bytes="$(awk '/MemTotal/ {print $2*1024}' /proc/meminfo)"
          echo "host_cpus=$host_cpus"
          echo "host_mem_bytes=$host_mem_bytes"

          c1="$(docker create --cpus 8 --memory 16384m "$image" true)"
          c2="$(docker create --cpus 16 --memory 32768m "$image" true)"
          docker inspect "$c1" --format 'c1_nano_cpus={{.HostConfig.NanoCpus}} c1_memory={{.HostConfig.Memory}}'
          docker inspect "$c2" --format 'c2_nano_cpus={{.HostConfig.NanoCpus}} c2_memory={{.HostConfig.Memory}}'
          docker rm "$c1" "$c2"

          test "$host_cpus" -lt 8
          test "$host_mem_bytes" -lt $((16384*1024*1024))
          echo "PASS: limits above host capacity were accepted as Docker limits without benchmark execution."
