name: Fast verify LiveBench V6 replay truth
on:
  push:
    branches:
      - "verify-fast/livebench-v6-result-truth-20261004"
    paths:
      - "VERIFY_LIVEBENCH_V6_REPLAY_TRUTH"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.14"
      - run: python verify_livebench_v6_replay_truth.py
