name: Verify LiveBench 2026 Terminal Scorer Scope

on:
  pull_request:
    branches:
      - main
    paths:
      - verify_livebench_terminal_scorer_scope.py
      - .github/workflows/verify-livebench-terminal-scorer-scope.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned parquet reader
        run: python -m pip install --disable-pip-version-check pyarrow==17.0.0
      - name: Recompute active population and official scorer dispatch
        run: python verify_livebench_terminal_scorer_scope.py
      - name: Upload aggregate-only receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livebench-terminal-scorer-scope-receipt
          path: livebench_terminal_scorer_scope_receipt.json
          if-no-files-found: error
