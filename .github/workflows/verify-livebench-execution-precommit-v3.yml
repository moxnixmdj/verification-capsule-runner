name: verify-livebench-execution-precommit-v3
on:
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact V3 execution epoch
        run: python verify_livebench_execution_precommit_v3.py
