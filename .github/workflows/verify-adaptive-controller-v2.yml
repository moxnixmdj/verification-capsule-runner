name: Verify adaptive controller V2

on:
  push:
    branches:
      - verify/adaptive-controller-v2-20261003

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Execute exact V2 controller
        working-directory: capsules/adaptive_v2
        run: |
          python -m canonical.runtime.adaptive_terminal_closure_controller_v2 > result.json
          python - <<'PY'
          import json
          x=json.load(open("result.json"))
          assert x["pass"] is True,x
          assert x["live_world"]["nondominated_certificates"]==14,x
          assert x["live_world"]["verified_zero_reality_requirements"]==17,x
          assert x["action_refinement"]["primitive_acceptance_work_units"]==31,x
          assert len(x["first_resource_priority_work_unit_ids"])==16,x
          assert len(x["ownership_reconciliation_work_units"])==2,x
          assert x["execution_policy"]["tool_discovery_v5_gate_mandatory"] is True,x
          ids={r["work_unit_id"] for r in x["acceptance_work_units"]}
          assert "BRAIN_OWNED_OR_PERMISSIVELY_INTERNALIZED_FINANCE_JUDGMENT_SOURCE_GATE_PASS" not in ids,x
          assert "BRAIN_OWNED_OR_PERMISSIVELY_INTERNALIZED_UNKNOWN_DOMAIN_JUDGMENT_SOURCE_GATE_PASS" not in ids,x
          assert set(x["post_dual_transition"]["direct_reality_blocked_predicates"])=={
            "FINANCE_UNCOVERED_SCOPE_AUDIT",
            "UNKNOWN_DOMAIN_UNCOVERED_TRANSFER_AUDIT",
          },x
          assert x["execution_authority"] is False,x
          assert x["promotion_authority"] is False,x
          assert x["fresh_reality_authority"] is False,x
          print("ADAPTIVE_CONTROLLER_V2_INDEPENDENT_PASS")
          PY
