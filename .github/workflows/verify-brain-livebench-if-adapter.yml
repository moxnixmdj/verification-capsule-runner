name: Verify Brain LiveBench IF adapter
on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/runtime/livebench_if_response_adapter.py'
      - 'canonical/tests/test_livebench_if_response_adapter.py'
      - '.github/workflows/verify-brain-livebench-if-adapter.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Bind exact mirrored Brain blobs
        run: |
          test "$(git hash-object canonical/runtime/livebench_if_response_adapter.py)" = "eb497ae5585f4f22b06b8088609b6d17714ebc53"
          test "$(git hash-object canonical/tests/test_livebench_if_response_adapter.py)" = "ac012754816cd007d893980247d55670f70b21ec"
      - run: PYTHONPATH=. python -m unittest -v canonical.tests.test_livebench_if_response_adapter

  verify_legacy_semantic_seed_composer_v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Install pinned verifier dependencies
        run: python -m pip install --disable-pip-version-check langdetect==1.0.9 nltk==3.9.1 immutabledict==4.2.1
      - name: Checkout pinned LiveBench source
        run: |
          git clone --quiet https://github.com/LiveBench/LiveBench.git /tmp/LiveBench
          git -C /tmp/LiveBench checkout --quiet 8f8e5c381a16e3f24257776edd53471fe86f8091
          test "$(git -C /tmp/LiveBench rev-parse HEAD)" = "8f8e5c381a16e3f24257776edd53471fe86f8091"
      - name: Verify V2 against exact upstream legacy checkers
        run: python verification/verify_livebench_legacy_semantic_seed_composer_v2.py
      - name: Upload V2 receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livebench-legacy-semantic-seed-composer-v2-receipt
          path: livebench_legacy_semantic_seed_composer_v2_receipt.json
          if-no-files-found: error
