name: Verify Brain PR 1203 Toolathlon general-substrate materiality
on:
  push:
    branches: ["verify-brain-pr-1203-toolathlon-general-substrate-materiality"]
    paths:
      - "capsules/brain_pr_1203_toolathlon_general_substrate_materiality/**"
      - ".github/workflows/verify-brain-pr-1203-toolathlon-general-substrate-materiality.yml"
  pull_request:
    branches: [main]
    paths:
      - "capsules/brain_pr_1203_toolathlon_general_substrate_materiality/**"
      - ".github/workflows/verify-brain-pr-1203-toolathlon-general-substrate-materiality.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact Brain blobs
        run: |
          set -euo pipefail
          cd capsules/brain_pr_1203_toolathlon_general_substrate_materiality
          test "$(git hash-object canonical/governance/TOOLATHLON_GENERAL_SUBSTRATE_MATERIALITY_V1.json)" = "4f5aae2a11acc33f9c3a7aca0c4171345a20b08f"
          test "$(git hash-object canonical/tests/test_toolathlon_general_substrate_materiality_v1.py)" = "729ed9954f1af391224ed6ae9379e2bf71b9754a"
          test "$(git hash-object canonical/runtime/toolathlon_brain_owned_selection_adapter_v1.py)" = "64c66a56a681b2919fbfcaf09c325c5db55f5f81"
          test "$(git hash-object canonical/runtime/acceptance_capability_source_gate_v2.py)" = "b168b131f6383e158bdc0d931439d14e61f2a5de"
      - name: Run materiality counterfactual
        run: |
          set -euo pipefail
          cd capsules/brain_pr_1203_toolathlon_general_substrate_materiality
          export PYTHONPATH=.
          python -m unittest canonical.tests.test_toolathlon_general_substrate_materiality_v1 -v
      - name: Enforce zero-credit materiality scope
        run: |
          set -euo pipefail
          cd capsules/brain_pr_1203_toolathlon_general_substrate_materiality
          python - <<'PY'
          import json
          g=json.load(open("canonical/governance/TOOLATHLON_GENERAL_SUBSTRATE_MATERIALITY_V1.json",encoding="utf-8"))
          assert g["source_gate_projection_if_independently_verified"]["general_substrate_test_pass"] is True
          assert g["source_gate_projection_if_independently_verified"]["configuration_materially_constrains_execution"] is True
          assert g["source_gate_projection_if_independently_verified"]["external_hidden_target_capability_provider"] is False
          assert g["terminal_results_observed"]==0
          assert g["new_reality_units_consumed"]==0
          assert g["capability_credit_delta"]==0 and g["family_credit_delta"]==0
          assert g["execution_authority"] is False
          print("Brain PR1203 Toolathlon general-substrate materiality: PASS")
          PY
