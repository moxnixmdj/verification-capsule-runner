name: Verify terminal frontier compiler v1 current
on:
  pull_request:
    paths:
      - 'capsules/terminal_frontier_compiler_v1_current/**'
      - '.github/workflows/verify-terminal-frontier-compiler-v1-current.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python capsules/terminal_frontier_compiler_v1_current/verify.py
