name: C3 SkillRouter Spent Screen

on:
  push:
    paths:
      - ".github/workflows/c3-skillrouter-spent-screen.yml"
      - "cognitive_c3_skillrouter_spent/**"

permissions:
  contents: write

jobs:
  screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify frozen spent evidence and router identity
        run: |
          set -euo pipefail
          test "$(git hash-object cognitive_c3_skillrouter_spent/episodes.json)" = "439a13dfd5824117e3d50a7a5673056cbc745dfd"
          test "$(git hash-object cognitive_c3_skillrouter_spent/cognitive_tool_router.py)" = "e947d086225aa165895dc5addd4847fb686b3454"
          sha256sum cognitive_c3_skillrouter_spent/episodes.json cognitive_c3_skillrouter_spent/probe.py cognitive_c3_skillrouter_spent/cognitive_tool_router.py
      - name: Install and execute spent screen
        id: screen
        shell: bash
        run: |
          set +e
          {
            python -m pip install --upgrade pip
            python -m pip install "transformers>=4.51" torch huggingface-hub accelerate
            python cognitive_c3_skillrouter_spent/probe.py
            cat cognitive_c3_skillrouter_spent/result.json
          } > cognitive_c3_skillrouter_spent/run.log 2>&1
          rc=$?
          cat cognitive_c3_skillrouter_spent/run.log
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c3-skillrouter-spent-screen
          path: |
            cognitive_c3_skillrouter_spent/episodes.json
            cognitive_c3_skillrouter_spent/probe.py
            cognitive_c3_skillrouter_spent/cognitive_tool_router.py
            cognitive_c3_skillrouter_spent/result.json
            cognitive_c3_skillrouter_spent/run.log
          if-no-files-found: warn
      - name: Persist terminal status and result
        if: always()
        shell: bash
        env:
          SCREEN_OUTCOME: ${{ steps.screen.outcome }}
          SCREEN_RC: ${{ steps.screen.outputs.rc }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path("cognitive_c3_skillrouter_spent")
          result_exists=(p/"result.json").exists()
          status={
            "schema":"PROJECT_BRAIN_VISIBLE_EXECUTION_STATUS_V1",
            "probe":"C3_SKILLROUTER_SPENT_SCREEN",
            "workflow_run_id":os.environ["GITHUB_RUN_ID"],
            "head_sha":os.environ["GITHUB_SHA"],
            "screen_outcome":os.environ.get("SCREEN_OUTCOME"),
            "screen_rc":os.environ.get("SCREEN_RC"),
            "result_exists":result_exists,
            "terminal_state":"SUCCESS" if os.environ.get("SCREEN_OUTCOME")=="success" and result_exists else "FAILURE",
            "capability_credit_delta":0
          }
          (p/"status.json").write_text(json.dumps(status,indent=2)+"\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cognitive_c3_skillrouter_spent/status.json cognitive_c3_skillrouter_spent/run.log
          test ! -f cognitive_c3_skillrouter_spent/result.json || git add cognitive_c3_skillrouter_spent/result.json
          git commit -m "Record C3 SkillRouter spent screen"
          git pull --rebase origin main
          git push
