name: Fastlane Unknown-Domain V3 totality on macOS
on:
  push:
    branches:
      - 'verify/ud-v3-totality-macos-fast-20261005'
    paths:
      - 'fastlane/ud-v3-totality-macos/trigger.json'
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2417bfa0851a52c07f17f8f5faf8147015ff2976
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bind exact independent verifier merge
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "2417bfa0851a52c07f17f8f5faf8147015ff2976"
          echo "exact verifier merge PASS"
      - name: Run independent V3 namespace-total verifier
        working-directory: subject/ud_v3_totality
        run: PYTHONPATH=. python verify_ud_v3_namespace_totality.py
