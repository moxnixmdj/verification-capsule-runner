name: Verify generic precommit isolation theorem
on:
  pull_request:
    paths:
      - 'subject/generic_precommit_isolation_20261004_sol/**'
      - 'verify_generic_precommit_isolation.py'
      - '.github/workflows/verify-generic-precommit-isolation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python verify_generic_precommit_isolation.py
