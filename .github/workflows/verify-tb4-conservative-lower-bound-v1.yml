name: Verify TB4 conservative lower-bound route
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/verify-tb4-conservative-lower-bound-v1.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Freeze authoritative sources
        run: |
          git clone -q https://github.com/harbor-framework/terminal-bench.git /tmp/tb4
          git -C /tmp/tb4 checkout -q 1dcda8716784493721921c23e4bc7f7d988b4494
          test "$(git -C /tmp/tb4 rev-parse HEAD)" = "1dcda8716784493721921c23e4bc7f7d988b4494"
          git clone -q https://github.com/harbor-framework/harbor.git /tmp/harbor
          git -C /tmp/harbor checkout -q bf991e490394ef9c3250a6db2bc5cbda903cb4c3
          test "$(git -C /tmp/harbor rev-parse HEAD)" = "bf991e490394ef9c3250a6db2bc5cbda903cb4c3"
      - name: Prove conservative completion and error-record semantics
        run: |
          python - <<'PY'
          import json, math, os, pathlib, shutil, sys, tomllib

          tb=pathlib.Path('/tmp/tb4')
          sys.path.insert(0,str(tb/'leaderboard'/'src'))
          from leaderboard.core.metrics import compute_metrics, is_success
          from leaderboard.ci.static_analysis import EXPECTED_TASK_COUNT, MIN_TRIALS_PER_TASK

          assert EXPECTED_TASK_COUNT == 66
          assert MIN_TRIALS_PER_TASK == 5
          assert is_success(None) is False
          assert is_success(0) is False
          assert is_success(1) is True

          submit=(tb/'leaderboard'/'SUBMIT.md').read_text()
          assert 'Errored trials count as\n  `reward 0` — they are not excluded from the metric.' in submit

          host_cpus=os.cpu_count() or 0
          mem_kib=0
          for line in pathlib.Path('/proc/meminfo').read_text().splitlines():
              if line.startswith('MemTotal:'):
                  mem_kib=int(line.split()[1]); break
          host_memory_mb=mem_kib//1024
          host_storage_mb=shutil.disk_usage('/').free//(1024*1024)

          task_rows=[]
          for p in sorted((tb/'tasks').glob('*/task.toml')):
              d=tomllib.loads(p.read_text())
              env=d.get('environment') or {}
              name=(d.get('task') or {}).get('name') or p.parent.name
              cpus=float(env.get('cpus') or 0)
              mem=int(env.get('memory_mb') or 0)
              storage=int(env.get('storage_mb') or 0)
              gpus=int(env.get('gpus') or 0)
              unsupported=(gpus>0 or cpus>host_cpus or mem>host_memory_mb or storage>host_storage_mb)
              task_rows.append((name,unsupported,cpus,mem,storage,gpus))
          assert len(task_rows)==66
          unsupported={x[0] for x in task_rows if x[1]}
          supported=[x[0] for x in task_rows if not x[1]]

          # Exact frozen metric has 66*5 slots. A missing/incompatible slot is
          # conservatively completed with reward 0. Because success is reward>0,
          # this cannot overstate any completion of those slots.
          total=EXPECTED_TASK_COUNT*MIN_TRIALS_PER_TASK
          threshold=66.4
          min_successes=math.ceil((threshold/100)*total)
          assert min_successes==220
          supported_slots=len(supported)*MIN_TRIALS_PER_TASK
          assert supported_slots>=min_successes, (len(supported),len(unsupported))

          by_task={name:[None]*MIN_TRIALS_PER_TASK for name, *_ in task_rows}
          remaining=min_successes
          for name in supported:
              for i in range(MIN_TRIALS_PER_TASK):
                  if remaining:
                      by_task[name][i]=1
                      remaining-=1
                  else:
                      by_task[name][i]=0
          assert remaining==0
          lower,_=compute_metrics(by_task)
          assert lower>=threshold, lower

          by_task_below={k:list(v) for k,v in by_task.items()}
          removed=False
          for name in supported:
              for i,v in enumerate(by_task_below[name]):
                  if v==1:
                      by_task_below[name][i]=0
                      removed=True
                      break
              if removed: break
          below,_=compute_metrics(by_task_below)
          assert below<threshold, below

          # Any replacement of conservative zero/None slots by a successful
          # reward can only increase the official success-count metric.
          best={k:list(v) for k,v in by_task.items()}
          for name in unsupported:
              best[name]=[1]*MIN_TRIALS_PER_TASK
          upper,_=compute_metrics(best)
          assert upper>=lower

          trial_src=pathlib.Path('/tmp/harbor/src/harbor/trial/trial.py').read_text()
          upload_src=pathlib.Path('/tmp/harbor/src/harbor/upload/uploader.py').read_text()
          for token in ('except Exception as exc:', 'self._record_exception(exc)', 'await self._recover_outputs()', 'return self.result'):
              assert token in trial_src
          for token in ('rewards=(', 'else None', 'exception_type=(', 'insert_trial('):
              assert token in upload_src

          out={
            'schema':'PROJECT_BRAIN_TB4_CONSERVATIVE_LOWER_BOUND_ROUTE_VERIFICATION_V1',
            'status':'PASS__EXACT_FROZEN_METRIC_MONOTONE__CONSERVATIVE_ZERO_COMPLETION_SOUND__ERROR_RECORD_PATH_PRESENT',
            'terminal_bench_commit':'1dcda8716784493721921c23e4bc7f7d988b4494',
            'harbor_commit':'bf991e490394ef9c3250a6db2bc5cbda903cb4c3',
            'task_count':66,
            'trials_per_task':5,
            'total_slots':total,
            'threshold_percent':threshold,
            'minimum_successes':min_successes,
            'observed_runner':{'cpus':host_cpus,'memory_mb':host_memory_mb,'free_storage_mb':host_storage_mb},
            'unsupported_task_count_by_declared_resource_gate':len(unsupported),
            'supported_task_count_by_declared_resource_gate':len(supported),
            'supported_trial_slots':supported_slots,
            'required_supported_success_fraction':min_successes/supported_slots,
            'score_at_minimum_successes_percent':lower,
            'score_one_success_below_percent':below,
            'mathematical_route_feasible':supported_slots>=min_successes,
            'task_instruction_files_read':0,
            'solution_files_read':0,
            'hidden_verifier_files_read':0,
            'fresh_acceptance_cases_executed':0,
            'incremental_spend_usd':0,
            'capability_credit_delta':0,
            'family_credit_delta':0,
            'claim':'A score computed over the exact 330 frozen slots with every unobserved/incompatible slot fixed to failure is a lower bound on every completion of those slots under the frozen reward>0 success metric.'
          }
          pathlib.Path('/tmp/tb4-conservative-lower-bound-verdict.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tb4-conservative-lower-bound-verdict
          path: /tmp/tb4-conservative-lower-bound-verdict.json
