name: Verify current zero reality cut V10
on:
  pull_request:
    branches: [main]
    paths:
      - "fixtures/current_zero_reality_cut_v10.json"
      - "fixtures/root2_route_inventory_v10.json"
      - "verify_current_zero_reality_cut_v10.py"
      - ".github/workflows/verify-current-zero-reality-cut-v10.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact V10 compression
        run: python verify_current_zero_reality_cut_v10.py
