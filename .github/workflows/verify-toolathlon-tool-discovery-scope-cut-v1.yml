name: Verify Toolathlon Tool Discovery scope cut

on:
  pull_request:
    paths:
      - 'capsules/tool_discovery_matched_route_20261003/**'
      - '.github/workflows/verify-toolathlon-tool-discovery-scope-cut-v1.yml'
  push:
    branches: [main]
    paths:
      - 'capsules/tool_discovery_matched_route_20261003/**'
      - '.github/workflows/verify-toolathlon-tool-discovery-scope-cut-v1.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact Brain candidate blobs
        working-directory: capsules/tool_discovery_matched_route_20261003
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          expected = {
            "canonical/governance/TOOLATHLON_TOOL_DISCOVERY_SCOPE_CUT_V1.json": "d598d89c96390729abeee8e91ff3088821930e97",
            "canonical/runtime/toolathlon_tool_discovery_scope_cut_v1.py": "028f4813cdffe3467dfd8417df6f58916c023368",
            "canonical/tests/test_toolathlon_tool_discovery_scope_cut_v1.py": "11ef04dbd65067963384212049a186eefa31ae5d",
          }
          for path, want in expected.items():
              data=Path(path).read_bytes()
              got=hashlib.sha1(f"blob {len(data)}\0".encode()+data).hexdigest()
              assert got == want, (path, got, want)
              print(path, got)
          PY
      - name: Run synthetic mutation tests
        working-directory: capsules/tool_discovery_matched_route_20261003
        run: python -m unittest canonical.tests.test_toolathlon_tool_discovery_scope_cut_v1 -v
      - name: Fetch frozen Toolathlon public harness only
        run: |
          git clone --filter=blob:none https://github.com/hkust-nlp/Toolathlon.git /tmp/toolathlon
          git -C /tmp/toolathlon checkout --detach 9be8d8fe07a497b18ee61e3f2ae694e9797f39eb
          test "$(git -C /tmp/toolathlon rev-parse HEAD)" = "9be8d8fe07a497b18ee61e3f2ae694e9797f39eb"
          test "$(git -C /tmp/toolathlon rev-parse HEAD:tasks/finalpool)" = "0e6db218108c4666f3cdaa8d1ab976ab4807617c"
      - name: Verify real frozen harness scope observations
        working-directory: capsules/tool_discovery_matched_route_20261003
        run: |
          python canonical/runtime/toolathlon_tool_discovery_scope_cut_v1.py /tmp/toolathlon > TOOLATHLON_TOOL_DISCOVERY_SCOPE_CUT_VERDICT.json
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path("TOOLATHLON_TOOL_DISCOVERY_SCOPE_CUT_VERDICT.json").read_text())
          assert j["public_harness_observation_pass"] is True
          assert j["benchmark_task_count"] == 108
          assert j["configs_with_needed_mcp_servers_list"] == 108
          assert j["all_configs_predeclare_server_set"] is True
          assert j["exact_server_set_connected"] is True
          assert j["tool_surface_enumerated_before_agent_execution"] is True
          assert j["connected_servers_bound_into_agent"] is True
          assert j["scope_relation"] == "PARTIAL_STRICT_SUBSET__SUPPLEMENT_REQUIRED"
          assert j["toolathlon_standalone_whole_family_closure_admissible"] is False
          assert j["terminal_results_observed"] == 0
          assert j["family_credit_delta"] == 0
          print(json.dumps(j, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: toolathlon-tool-discovery-scope-cut-verdict
          path: capsules/tool_discovery_matched_route_20261003/TOOLATHLON_TOOL_DISCOVERY_SCOPE_CUT_VERDICT.json
