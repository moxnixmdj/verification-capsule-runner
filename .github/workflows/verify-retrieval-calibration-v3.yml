name: Verify retrieval calibration V3
on:
  push:
    branches:
      - verify/retrieval-calibration-v3-20261004
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Exact blobs
        run: |
          test "$(git hash-object canonical/runtime/retrieval_route_strategy_calibration_v3.py)" = "3e4914007d9ffc1878a2a8e0da0b1c4fb5182e0d"
          test "$(git hash-object canonical/runtime/retrieval_recovery_mechanism_calibration_v1.py)" = "1cf529d2a5f853a7bc511189358bb2eb4bc41a56"
          test "$(git hash-object canonical/tests/test_retrieval_calibration_v3.py)" = "21e9fda5fb7378593b48cc29db35dd42bb54e9e2"
      - run: PYTHONPATH=. python canonical/tests/test_retrieval_calibration_v3.py
      - run: PYTHONPATH=. python canonical/runtime/retrieval_route_strategy_calibration_v3.py > calibration-v3.json
      - run: PYTHONPATH=. python canonical/runtime/retrieval_recovery_mechanism_calibration_v1.py > recovery-mechanisms.json
