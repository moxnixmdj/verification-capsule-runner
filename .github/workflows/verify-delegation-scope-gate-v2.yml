name: Verify delegation scope Gate V2
on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/runtime/scope_equivalent_proof_gate_v2.py'
      - 'canonical/governance/DELEGATION_SCOPE_EQUIVALENCE_RELATION_V1.json'
      - 'canonical/governance/DELEGATION_SCOPE_EQUIVALENT_PROOF_GATE_V2_INPUT.json'
      - '.github/workflows/verify-delegation-scope-gate-v2.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Bind exact Gate and input blobs
        run: |
          test "$(git hash-object canonical/runtime/scope_equivalent_proof_gate_v2.py)" = "2d05172becfc559de3ff1e4e5623c5180028be1b"
          test "$(git hash-object canonical/governance/DELEGATION_SCOPE_EQUIVALENCE_RELATION_V1.json)" = "52392515cd4de672f82f8afac82a41d3ce442656"
          test "$(git hash-object canonical/governance/DELEGATION_SCOPE_EQUIVALENT_PROOF_GATE_V2_INPUT.json)" = "b434c2ad13154f5d4f43a76cfb27d6b492e93e01"
      - name: Execute delegation Gate V2
        run: PYTHONPATH=. python canonical/runtime/scope_equivalent_proof_gate_v2.py canonical/governance/DELEGATION_SCOPE_EQUIVALENT_PROOF_GATE_V2_INPUT.json
