name: Probe pinned fastcoref M0A donor
on:
  pull_request:
    branches: [main]
    paths:
      - 'verification/probe_fastcoref_m0a.py'
      - '.github/workflows/probe-fastcoref-m0a.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check 'git+https://github.com/shon-otmazgin/fastcoref.git@ae224139196d122b225af5a7e73b5fc0b6e1076d'
      - run: python verification/probe_fastcoref_m0a.py
