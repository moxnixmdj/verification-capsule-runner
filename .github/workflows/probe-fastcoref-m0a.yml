name: Probe pinned fastcoref M0A donor
on:
  pull_request:
    branches: [main]
    paths:
      - 'verification/probe_fastcoref_m0a.py'
      - '.github/workflows/probe-fastcoref-m0a.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - name: Install inference-only CPU dependencies
        run: |
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu 'torch>=2.1,<2.6'
          python -m pip install --disable-pip-version-check 'transformers>=4.35,<4.46' 'datasets>=2.5,<3' 'spacy>=3.7,<3.9' 'numpy<2' 'scipy<2' tqdm
      - name: Install pinned MIT fastcoref without transitive training/package extras
        run: |
          python -m pip install --disable-pip-version-check --no-deps 'git+https://github.com/shon-otmazgin/fastcoref.git@8888e51d97d4818a25dd5f5d8b541d397fad9362'
          python - <<'PY'
          import site, pathlib
          roots=[pathlib.Path(x) for x in site.getsitepackages()]
          hits=[p/"fastcoref"/"__init__.py" for p in roots if (p/"fastcoref"/"__init__.py").exists()]
          assert len(hits)==1,hits
          hits[0].write_text("from .modeling import FCoref, LingMessCoref, CorefResult\n")
          print("PATCHED_INFERENCE_ONLY_INIT",hits[0])
          PY
      - run: python verification/probe_fastcoref_m0a.py
