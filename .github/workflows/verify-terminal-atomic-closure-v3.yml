name: Verify terminal atomic closure capsule V3
on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/governance/TERMINAL_ATOMIC_CLOSURE_CAPSULE_V3.json'
      - 'canonical/governance/**'
      - 'canonical/verification/**'
      - '.github/workflows/verify-terminal-atomic-closure-v3.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Recompute V3 closure commitment and exact snapshot roots
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('canonical/governance/TERMINAL_ATOMIC_CLOSURE_CAPSULE_V3.json')
          c=json.loads(p.read_text())
          assert c['schema']=='PROJECT_BRAIN_TERMINAL_ATOMIC_CLOSURE_CAPSULE_V3'
          assert c['execution_snapshot']['commit_sha']=='821712c059b139f3494723dca6e8d0fc82ee59a4'
          assert c['prebeacon_invariants']['post_freeze_beacon'] is None
          assert c['prebeacon_invariants']['terminal_results_observed']==0
          assert c['prebeacon_invariants']['fresh_terminal_evidence_consumed']==0
          assert c['prebeacon_invariants']['execution_authority_at_snapshot'] is True
          def git_blob(path):
              b=Path(path).read_bytes()
              return hashlib.sha1(b'blob '+str(len(b)).encode()+bytes([0])+b).hexdigest()
          for rel,expected in sorted(c['snapshot_blob_assertions'].items()):
              actual=git_blob(rel)
              assert actual==expected,(rel,expected,actual)
          def canon(x):
              return json.dumps(x,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()
          order=c['commitment_encoding']['ordered_components']
          chunks=[]
          for name in order:
              raw=canon(c[name])
              h=hashlib.sha256(raw).hexdigest()
              assert h==c['component_sha256'][name],(name,h,c['component_sha256'][name])
              chunks.append(raw)
          package=hashlib.sha256(b''.join(chunks)).hexdigest()
          assert package==c['package_commitment'],(package,c['package_commitment'])
          auth=json.loads(Path('canonical/governance/TERMINAL_WAVE_EXECUTION_AUTHORITY_V1.json').read_text())
          receipt=json.loads(Path('canonical/verification/TERMINAL_WAVE_LAUNCH_AUTHORITY_HARDENED_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json').read_text())
          assert auth['execution_authority'] is True
          assert receipt['verdict']['launch_authority'] is True
          assert receipt['verdict']['execution_authority'] is True
          assert receipt['verdict']['failed_predicates']==[]
          assert receipt['terminal_results_observed']==0
          assert receipt['fresh_terminal_evidence_consumed']==0
          print('TERMINAL_ATOMIC_CLOSURE_V3_PASS',package)
          PY
