name: Verify proof optimizers independently
on:
  pull_request:
    branches: [main]
    paths:
      - 'verification/finite_population_proof.py'
      - 'verification/proof_route_dominance.py'
      - 'verification/test_proof_optimizers_independent.py'
      - '.github/workflows/verify-proof-optimizers-independent.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Bind exact Brain source blobs
        run: |
          test "$(git hash-object verification/finite_population_proof.py)" = "20980ac7ddb4cab713c847ac03e5a6fa40748154"
          test "$(git hash-object verification/proof_route_dominance.py)" = "64efeaad5d4295d5bd1a3bd53feae5170c22a8a4"
      - name: Run independent exhaustive tests
        run: cd verification && python -m unittest -v test_proof_optimizers_independent
