name: Verify WDM Stage-B V3
on:
  pull_request:
    branches: [main]
    paths:
      - 'verification/wdm_stage_b_v3.json'
      - 'verification/wdm_instruction.md'
      - 'verification/requirement_graph_kernel_v3.py'
      - 'verification/independent_acceptance_model_v3.py'
      - 'verification/test_wdm_stage_b_v3.py'
      - '.github/workflows/verify-wdm-stage-b-v3.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: cd verification && python -m unittest -v test_wdm_stage_b_v3.py
