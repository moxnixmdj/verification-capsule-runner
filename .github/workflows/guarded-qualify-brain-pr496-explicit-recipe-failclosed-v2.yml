name: Guarded Qualify Brain PR496 Explicit Recipe Failclosed V2

on:
  push:
    branches:
      - verify/brain-pr496-explicit-recipe-failclosed-v2-20260930-v1
    paths:
      - .github/workflows/guarded-qualify-brain-pr496-explicit-recipe-failclosed-v2.yml

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      ASTRA_DISABLE_MODEL_PLANNER: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'

      - name: Fail-closed exact-byte prestart
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object canonical/runtime/bound_capabilities/broad_objective_decompose.py)" = "3ded762075ed222228a14877af631f1e2e6d9e4c"
          test "$(git hash-object canonical/runtime/bound_capabilities/plain_goal_bound_grounding.py)" = "46e8e7466479ea298c34e5fa682d49c374510ce9"
          test "$(git hash-object canonical/tests/test_broad_objective_semantic_decomposition.py)" = "4717bd5ebf4b4e6521abf331e93e9675c1b8a785"
          test "$(git hash-object qualification/pr496/generate_plan.py)" = "313cabf58d1619b823a1ad0e510f6955fcd82a4c"
          test "$(git hash-object qualification/pr496/authorization.json)" = "ac576727df17db3a14e4edbffa6097e9d50b357f"
          test "$(git hash-object qualification/pr496/independent_oracle.py)" = "9ed0d1126f66af108a9e7a46ca871f0edd5e322d"
          test "$(git hash-object execution_guard/github_actions_guarded_run_live.py)" = "30ea2fd2cc548444477c7b234a59129ff8386235"
          test "$(git hash-object execution_guard/actions_admission.py)" = "6c46abef66c036f5382d5792b11a82a289b4dd94"
          test "$(git hash-object execution_guard/github_ref_store_live.py)" = "a8b0cf3facd91f4d4248bd4d2ed53f72f7d480c3"
          python -m py_compile canonical/runtime/bound_capabilities/broad_objective_decompose.py canonical/runtime/bound_capabilities/plain_goal_bound_grounding.py canonical/tests/test_broad_objective_semantic_decomposition.py qualification/pr496/independent_oracle.py qualification/pr496/generate_plan.py
          echo PR496_EXACT_BYTES_PRESTART_OK

      - name: Generate exact guarded plan
        run: python qualification/pr496/generate_plan.py

      - name: Guarded exact-byte adversarial qualification
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ASTRA_DISABLE_MODEL_PLANNER: "1"
        run: python execution_guard/github_actions_guarded_run_live.py --plan qualification/pr496/guarded_plan.json --receipt qualification/pr496/admission.json

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: brain-pr496-explicit-recipe-failclosed-v2-qualification
          path: qualification/pr496/
          if-no-files-found: error
