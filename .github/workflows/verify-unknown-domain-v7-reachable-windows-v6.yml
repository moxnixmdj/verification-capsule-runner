name: Verify Unknown-Domain V7 reachable domain Windows V6

on:
  push:
    branches:
      - "verify/unknown-domain-v7-reachable-windows-v6-20261005"
    paths:
      - "TRIGGER_UNKNOWN_DOMAIN_V7_WINDOWS_V6"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Rematerialize and verify exact Git blob bytes
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git config core.autocrlf false
          if ($LASTEXITCODE -ne 0) { throw "GIT_CONFIG_FAILED:$LASTEXITCODE" }
          git reset --hard HEAD
          if ($LASTEXITCODE -ne 0) { throw "GIT_RESET_FAILED:$LASTEXITCODE" }
          $expected = @{
            "canonical/runtime/unknown_domain_direct_candidate_v1.py" = "a2a77269a8175ce315b466035049da0f761b8734"
            "canonical/runtime/unknown_domain_direct_candidate_v2.py" = "4470716f95a559a700e461262df909ae19a41651"
            "canonical/runtime/unknown_domain_direct_candidate_v3.py" = "8df7f13455b710623806a8219174b397a2c3c442"
            "canonical/runtime/unknown_domain_direct_hidden_generator_v1.py" = "f974a4594c78e74693c7ba5a19f131dfa481b937"
            "canonical/runtime/unknown_domain_direct_hidden_generator_v2.py" = "d077028c9bde534dc4bc6eb0d1f776341f9d59f8"
            "canonical/runtime/unknown_domain_direct_hidden_generator_v4.py" = "e52858b9fef2d795f72b45cd3ae82ad04344aa91"
            "canonical/runtime/unknown_domain_direct_hidden_generator_v5.py" = "0faa62fce4bc2f2a99c173b0a10a32d5e1c6a244"
            "canonical/runtime/unknown_domain_direct_hidden_scorer_v1.py" = "e8cf5d1b5d311644725a751c15e6235958fb587d"
            "canonical/runtime/unknown_domain_direct_execution_harness_v1.py" = "04fe06f4eed081c4cb6197b12f2d92bd396aeafd"
            "canonical/tests/test_unknown_domain_direct_v5.py" = "1961cff0013ff9f17feca981409d89d01ecf6769"
          }
          foreach ($path in $expected.Keys) {
            $got = (git hash-object --no-filters $path).Trim()
            if ($LASTEXITCODE -ne 0) { throw "GIT_HASH_FAILED:$path:$LASTEXITCODE" }
            if ($got -ne $expected[$path]) {
              throw "WORKTREE_BLOB_MISMATCH_AFTER_NORMALIZATION:$path:$got"
            }
          }

      - name: Python 3.12.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"

      - name: Verify Python 3.12.10 fail-closed
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Stop"
          $env:PYTHONPATH="."
          python --version
          if ($LASTEXITCODE -ne 0) { throw "PY312_VERSION_FAILED:$LASTEXITCODE" }
          python -m pip install --disable-pip-version-check pytest==8.4.2
          if ($LASTEXITCODE -ne 0) { throw "PY312_PYTEST_INSTALL_FAILED:$LASTEXITCODE" }
          python verification/unknown_domain_v7_reachable_domain_independent_v3.py
          if ($LASTEXITCODE -ne 0) { throw "PY312_VERIFIER_FAILED:$LASTEXITCODE" }
          python -m pytest -q canonical/tests/test_unknown_domain_direct_v5.py
          if ($LASTEXITCODE -ne 0) { throw "PY312_PYTEST_FAILED:$LASTEXITCODE" }
          Copy-Item -ErrorAction Stop unknown_domain_v7_reachable_domain_receipt.json unknown_domain_v7_reachable_domain_receipt_py312.json
          New-Item -ItemType File PY312_V7_PASS -ErrorAction Stop | Out-Null

      - name: Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Verify Python 3.13 fail-closed
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Stop"
          $env:PYTHONPATH="."
          python --version
          if ($LASTEXITCODE -ne 0) { throw "PY313_VERSION_FAILED:$LASTEXITCODE" }
          python -m pip install --disable-pip-version-check pytest==8.4.2
          if ($LASTEXITCODE -ne 0) { throw "PY313_PYTEST_INSTALL_FAILED:$LASTEXITCODE" }
          python verification/unknown_domain_v7_reachable_domain_independent_v3.py
          if ($LASTEXITCODE -ne 0) { throw "PY313_VERIFIER_FAILED:$LASTEXITCODE" }
          python -m pytest -q canonical/tests/test_unknown_domain_direct_v5.py
          if ($LASTEXITCODE -ne 0) { throw "PY313_PYTEST_FAILED:$LASTEXITCODE" }
          Copy-Item -ErrorAction Stop unknown_domain_v7_reachable_domain_receipt.json unknown_domain_v7_reachable_domain_receipt_py313.json
          New-Item -ItemType File PY313_V7_PASS -ErrorAction Stop | Out-Null

      - name: Upload both receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unknown-domain-v7-reachable-windows-v6-both-pythons
          path: |
            unknown_domain_v7_reachable_domain_receipt_py312.json
            unknown_domain_v7_reachable_domain_receipt_py313.json
          if-no-files-found: error
          retention-days: 7

      - name: Require both runtimes green
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (!(Test-Path PY312_V7_PASS)) { throw "PY312_V7_NOT_GREEN" }
          if (!(Test-Path PY313_V7_PASS)) { throw "PY313_V7_NOT_GREEN" }
