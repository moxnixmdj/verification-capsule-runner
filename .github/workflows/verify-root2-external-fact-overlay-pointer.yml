name: Verify Root2 external fact overlay pointer
on:
  pull_request:
    paths:
      - "subject/root2_external_fact_overlay_pointer_20261004_sol/**"
      - "verify_root2_external_fact_overlay_pointer.py"
      - ".github/workflows/verify-root2-external-fact-overlay-pointer.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python verify_root2_external_fact_overlay_pointer.py
