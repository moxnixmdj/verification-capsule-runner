name: Verify Brain PR 1085 tool-discovery universal scope cut
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/brain_pr_1085_tool_discovery_scope_cut/**"
      - ".github/workflows/verify-brain-pr-1085-tool-discovery-scope-cut.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run exact formalism-cut tests
        run: |
          cd capsules/brain_pr_1085_tool_discovery_scope_cut
          export PYTHONPATH=.
          python -m unittest canonical.tests.test_tool_discovery_universal_scope_formalism_cut_v1 -v
      - name: Execute scope formalism cut
        run: |
          cd capsules/brain_pr_1085_tool_discovery_scope_cut
          export PYTHONPATH=.
          python -m canonical.runtime.tool_discovery_universal_scope_formalism_cut_v1 > verdict.json
      - name: Enforce fail-closed zero-credit verdict
        run: |
          cd capsules/brain_pr_1085_tool_discovery_scope_cut
          python - <<'PY'
          import json
          v=json.load(open("verdict.json"))
          assert v["source_blob_drift"]==[],v
          assert v["classification"]=="SPECIFICATION_OR_FORMALISM_RESIDUAL",v
          assert v["formalism_gap_established"] is True,v
          assert v["terminal_candidate_has_discover_action"] is False,v
          assert v["broader_dynamic_candidate_has_discover_action"] is True,v
          assert v["universal_scope_certificate_currently_admissible"] is False,v
          assert v["new_reality_units_consumed"]==0,v
          assert v["terminal_results_replayed"]==0,v
          assert v["capability_credit_delta"]==0 and v["family_credit_delta"]==0,v
          assert v["execution_authority"] is False and v["promotion_authority"] is False,v
          print("tool-discovery universal scope formalism cut: PASS")
          PY
