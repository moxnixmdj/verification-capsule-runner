name: Bootstrap verify LiveBench reference-free trigram V1
on:
  push:
    branches:
      - verify-livebench-ngram-reference-free-v1
    paths:
      - "subject/livebench_ngram_reference_free_v1/**"
      - "verify_livebench_ngram_reference_free_v1.py"
      - "verification_trigger_livebench_ngram_reference_free_v1.txt"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify theorem, pinned scorer, and 12-row public audit
        run: python verify_livebench_ngram_reference_free_v1.py
      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livebench-ngram-reference-free-v1-receipt
          path: livebench_ngram_reference_free_public_verification_receipt.json
          if-no-files-found: error
