name: Verify LiveBench zero-case resource fit

on:
  pull_request:
    paths:
      - 'verify_livebench_zero_case_resource_fit_20261004.py'
      - 'subject/livebench_zero_case_resource_fit_20261004/**'
      - '.github/workflows/verify-livebench-zero-case-resource-fit-20261004.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exactly the frozen declared LiveBench environment packages
        run: |
          python -m pip install --disable-pip-version-check \
            nltk==3.10.3 \
            emoji==2.16.0 \
            syllapy==0.7.2 \
            setuptools==80.9.0
      - name: Run zero-case resource-fit verification
        run: python verify_livebench_zero_case_resource_fit_20261004.py
