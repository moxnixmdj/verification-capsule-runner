name: Cancel Duplicate Task C Runs

on:
  push:
    branches: [frontier-task-c-bugsinpy-youtubedl1-qwen9b-20260929]
    paths:
      - 'CANCEL_DUPLICATE_TASK_C_RUNS_*'

permissions:
  actions: write
  contents: read

jobs:
  cancel_duplicates:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel only post-spend duplicate Task C runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for run_id in 36638209412 36638246526; do
            code=$(curl -sS -o "cancel_${run_id}.txt" -w '%{http_code}'               -X POST               -H "Authorization: Bearer $GH_TOKEN"               -H "Accept: application/vnd.github+json"               -H "X-GitHub-Api-Version: 2022-11-28"               "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel")
            cat "cancel_${run_id}.txt" || true
            test "$code" = "202" -o "$code" = "409"
            echo "CANCEL_DUPLICATE_TASK_C_${run_id}_HTTP_${code}"
          done
