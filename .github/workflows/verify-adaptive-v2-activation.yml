name: Verify adaptive V2 activation

on:
  pull_request:
    paths:
      - 'ADAPTIVE_ACTIVATION_V1.json'
      - 'ADAPTIVE_ACTIVATION_ROOT_STATE_V1.json'
      - 'ADAPTIVE_ACTIVATION_TERMINAL_AUTHORITY_V1.json'
      - 'verify_adaptive_v2_activation.py'
      - '.github/workflows/verify-adaptive-v2-activation.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact Brain candidate blobs
        shell: bash
        run: |
          test "$(git hash-object ADAPTIVE_ACTIVATION_V1.json)" = "0a70eb7ff3cfbe07e4765f2e490351fbaa505030"
          test "$(git hash-object ADAPTIVE_ACTIVATION_ROOT_STATE_V1.json)" = "2c64185e39d7f5e8fe5773e420e0c1b9f56458e5"
          test "$(git hash-object ADAPTIVE_ACTIVATION_TERMINAL_AUTHORITY_V1.json)" = "e761d1e1f4ee4b0212e86871b1147f86521ab68a"
      - name: Verify activation semantics
        run: python verify_adaptive_v2_activation.py
