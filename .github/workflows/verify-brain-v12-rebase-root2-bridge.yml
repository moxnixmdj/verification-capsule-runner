name: Verify Brain V12 rebase with Root2 bridge
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/brain_v12_rebase_root2_bridge/**"
      - ".github/workflows/verify-brain-v12-rebase-root2-bridge.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          cd capsules/brain_v12_rebase_root2_bridge
          python verify_rebase.py
