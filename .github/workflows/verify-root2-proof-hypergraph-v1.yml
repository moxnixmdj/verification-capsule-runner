name: Verify Root2 proof hypergraph v1
on:
  push:
    branches: [main]
    paths:
      - "capsules/root2_proof_hypergraph_v1/**"
      - ".github/workflows/verify-root2-proof-hypergraph-v1.yml"
  pull_request:
    branches: [main]
    paths:
      - "capsules/root2_proof_hypergraph_v1/**"
      - ".github/workflows/verify-root2-proof-hypergraph-v1.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          cd capsules/root2_proof_hypergraph_v1
          export PYTHONPATH=.
          python -m unittest canonical.tests.test_root2_proof_hypergraph_v1 -v
          python verify_root2.py
