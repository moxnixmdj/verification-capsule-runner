name: Verify Retrieval V10 route strategy current
on:
  push:
    branches:
      - verify/retrieval-v10-route-strategy-current-20261004
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact V10 subjects
        run: |
          test "$(git hash-object canonical/runtime/global_retrieval_controller_v3.py)" = "44cb29b284f7ff069a68bf21e221f15d17ee94fa"
          test "$(git hash-object canonical/runtime/global_retrieval_entrypoint_v3.py)" = "f4af9c9c11b84371fd9fde751e7f0ddd56a9148d"
          test "$(git hash-object canonical/runtime/retrieval_route_strategy_calibration_v2.py)" = "018f859959d4a15540e8ee1428f6d3e60fe32d11"
          test "$(git hash-object canonical/governance/RETRIEVAL_V10_LIVE_PROVIDER_EVENTS_20261004_V1.json)" = "2a09390e314d151e6fafcec920dc8697e42727cb"
          test "$(git hash-object canonical/governance/RETRIEVAL_V10_OPTIMIZED_LIVE_PROVIDER_EVENTS_20261004_V1.json)" = "8d7ee9741e0a6109cc7c36d0ee3bbfa162de91a8"
          test "$(git hash-object canonical/governance/RETRIEVAL_V10_MULTI_QUERY_LIVE_PROVIDER_EVENTS_20261004_V1.json)" = "2e2648179f477024327e23a69e091c760d441c37"
          test "$(git hash-object canonical/governance/RETRIEVAL_V10_DEEP_WINDOW_LIVE_PROVIDER_EVENTS_20261004_V1.json)" = "9838c20539cdb636aae19dcf4aed7dd2d6cbf800"
          test "$(git hash-object canonical/governance/RETRIEVAL_V10_VERIFIED_BRIDGED_LIVE_EVENTS_20261004_V1.json)" = "a95aaef95f7e1224e33ddb6b29e1d230b9633ad2"
          test "$(git hash-object canonical/tests/test_retrieval_route_strategy_calibration_v2.py)" = "853e2aff84ff12f1241d69258af52f6fd01e342c"
          test "$(git hash-object canonical/tests/test_global_retrieval_controller_v3.py)" = "8c5c55fc077e0223383724d64f6538b7d4cb46e5"
      - run: PYTHONPATH=. python canonical/tests/test_retrieval_route_strategy_calibration_v2.py
      - run: PYTHONPATH=. python canonical/tests/test_global_retrieval_controller_v3.py
      - run: PYTHONPATH=. python canonical/runtime/retrieval_route_strategy_calibration_v2.py
      - run: PYTHONPATH=. python canonical/runtime/global_retrieval_entrypoint_v3.py
