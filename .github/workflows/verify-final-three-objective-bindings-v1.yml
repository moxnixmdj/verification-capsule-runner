name: Verify final three objective bindings v1
on:
  pull_request:
    branches: [main]
    paths:
      - 'capsules/final_three_objective_bindings/**'
      - '.github/workflows/verify-final-three-objective-bindings-v1.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Verify exact browser binding identities
        working-directory: capsules/final_three_objective_bindings
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object canonical/governance/BROWSER_T2_OBJECTIVE_TERMINAL_BINDING_V1.json)" = "36e96b9dc90301fe89f7a8f963c24920f6c6595e"
          test "$(git hash-object canonical/runtime/browser_t2_objective_binding_validator.py)" = "0d8fc6d67c840033bd0412630e7199161b291165"
          test "$(git hash-object canonical/tests/test_browser_t2_objective_binding_validator.py)" = "d16727f95d48cd5a7288dc7416e88b9b1d5b1c46"
      - name: Run browser binding verification
        working-directory: capsules/final_three_objective_bindings
        run: |
          PYTHONPATH=. python -m unittest -v canonical.tests.test_browser_t2_objective_binding_validator
          PYTHONPATH=. python canonical/runtime/browser_t2_objective_binding_validator.py .
  tool-discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Verify exact tool binding identities
        working-directory: capsules/final_three_objective_bindings
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object canonical/governance/TOOL_DISCOVERY_T2_T3_OBJECTIVE_TERMINAL_BINDING_V1.json)" = "c68ab0f9480dacc758171df74e891e1ac817c7d3"
          test "$(git hash-object canonical/runtime/tool_discovery_t2_t3_objective_binding_validator.py)" = "c042cbc05e753f8d1454f134eca58a27a4d65051"
          test "$(git hash-object canonical/tests/test_tool_discovery_t2_t3_objective_binding_validator.py)" = "4f5cf6472e8f33c1a032fbe84b4fafce80dab278"
      - name: Run tool-discovery binding verification
        working-directory: capsules/final_three_objective_bindings
        run: |
          PYTHONPATH=. python -m unittest -v canonical.tests.test_tool_discovery_t2_t3_objective_binding_validator
          PYTHONPATH=. python canonical/runtime/tool_discovery_t2_t3_objective_binding_validator.py .
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Verify exact research binding identities
        working-directory: capsules/final_three_objective_bindings
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object canonical/governance/RESEARCH_T3_OBJECTIVE_TERMINAL_BINDING_V1.json)" = "9f5da1452a15a67ed6fd06ae5b5ff9534e783a5d"
          test "$(git hash-object canonical/runtime/research_t3_objective_binding_validator.py)" = "3dbbb1851615265dceadc3a3213c6d37c33d7822"
          test "$(git hash-object canonical/tests/test_research_t3_objective_binding_validator.py)" = "c418c49559f30f1037f91f942d25ea2dbbe6c6ee"
          test "$(git hash-object canonical/governance/OBJECTIVE_ORACLE_DOMINANCE_LIVE_INPUT_V1.json)" = "c1dad2dcb63be8d9dd50ba5212a5b099966f1f07"
      - name: Run research binding verification
        working-directory: capsules/final_three_objective_bindings
        run: |
          PYTHONPATH=. python -m unittest -v canonical.tests.test_research_t3_objective_binding_validator
          PYTHONPATH=. python canonical/runtime/research_t3_objective_binding_validator.py .
