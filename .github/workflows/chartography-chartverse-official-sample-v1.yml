name: Chartography ChartVerse official-sample container-tools V1

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/chartography-chartverse-official-sample-v1.yml"
      - "subject/chartography_tool_runtime/official_sample_container_tools_v1.py"
  workflow_dispatch:

permissions:
  contents: read

env:
  OFFICIAL_HARNESS_COMMIT: 3f1bf837232d3918c2cc35c6e2418c9e70d2a57b
  MODEL_REPO: mradermacher/ChartVerse-8B-GGUF
  MODEL_REVISION: 02926a8255ad68f66cad965e3faf4fd6f6515259
  MODEL_FILE: ChartVerse-8B.Q4_K_M.gguf
  MODEL_SHA256: 97eebc1d3d8a2f8482205a986305bdbcd5553b8c2131073dc47c553badaa9d15
  MMPROJ_FILE: ChartVerse-8B.mmproj-Q8_0.gguf
  MMPROJ_SHA256: 0df4b5c847587984c93e6712f0851abb2227ecabfe94b8d60ccac90a12b654f0
  LLAMA_CPP_COMMIT: a7fb71fab83b474a0892b9a05aaa3a8ddca2729b

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install host prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build curl ca-certificates
          python -m pip install --disable-pip-version-check --no-input "pillow>=10,<13" "pyyaml>=6,<7"
          mkdir -p model out

      - name: Build isolated chart code tool image
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/Dockerfile.chartography <<'EOF'
          FROM python:3.12-slim
          RUN pip install --no-cache-dir pillow numpy scipy matplotlib opencv-python-headless
          WORKDIR /work
          EOF
          docker build -f /tmp/Dockerfile.chartography -t brain-chartography-tool-v1 /tmp
          docker inspect brain-chartography-tool-v1 --format '{{.Id}}' | tee out/tool_image_id.txt

      - name: Bind official non-heldout sample pack
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/surge-ai/chartography.git official
          cd official
          git checkout --detach "$OFFICIAL_HARNESS_COMMIT"
          test "$(git rev-parse HEAD)" = "$OFFICIAL_HARNESS_COMMIT"
          test -f task_packs/sample_charts/charts/sample_chart_1.png
          test -f task_packs/sample_charts/charts/sample_chart_2.jpg

      - name: Download exact frozen subject
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://huggingface.co/${MODEL_REPO}/resolve/${MODEL_REVISION}"
          curl -fL --retry 5 --retry-all-errors "$BASE/${MODEL_FILE}?download=true" -o model/model.gguf
          curl -fL --retry 5 --retry-all-errors "$BASE/${MMPROJ_FILE}?download=true" -o model/mmproj.gguf
          echo "${MODEL_SHA256}  model/model.gguf" | sha256sum -c -
          echo "${MMPROJ_SHA256}  model/mmproj.gguf" | sha256sum -c -

      - name: Build exact visual CLI
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/ggml-org/llama.cpp.git llama.cpp
          cd llama.cpp
          git checkout --detach "$LLAMA_CPP_COMMIT"
          test "$(git rev-parse HEAD)" = "$LLAMA_CPP_COMMIT"
          cmake -S . -B build -G Ninja -DGGML_NATIVE=OFF -DGGML_CUDA=OFF -DGGML_BLAS=OFF -DLLAMA_CURL=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target llama-mtmd-cli -j 2

      - name: Run official non-heldout sample tasks
        shell: bash
        run: |
          set -euo pipefail
          python subject/chartography_tool_runtime/official_sample_container_tools_v1.py             --official-root official             --cli llama.cpp/build/bin/llama-mtmd-cli             --model model/model.gguf             --mmproj model/mmproj.gguf             --out out/sample

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chartography-chartverse-official-sample-container-tools-v1
          path: out/
          if-no-files-found: error
