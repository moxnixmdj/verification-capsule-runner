name: Verify Brain PR 1200 Tool Discovery deductive bound
on:
  push:
    branches: ["verify-brain-pr-1200-tool-discovery-deductive-bound"]
    paths:
      - "capsules/brain_pr_1200_tool_discovery_deductive_bound/**"
      - ".github/workflows/verify-brain-pr-1200-tool-discovery-deductive-bound.yml"
  pull_request:
    branches: [main]
    paths:
      - "capsules/brain_pr_1200_tool_discovery_deductive_bound/**"
      - ".github/workflows/verify-brain-pr-1200-tool-discovery-deductive-bound.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact transported Brain bytes and deductive bound
        run: python capsules/brain_pr_1200_tool_discovery_deductive_bound/verify.py
