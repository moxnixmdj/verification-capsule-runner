name: Verify TB-Science rank6 authority and carrier

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/verify-tb-science-rank6-20261007-v1.yml"
      - "capsules/tb_science_rank6_20261007_v1/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Verify public zero-cost carrier and resources
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$REPO" = "moxnixmdj/verification-capsule-runner"
          vis="$(curl -fsSL -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$REPO" | python -c 'import json,sys; print(json.load(sys.stdin)["visibility"])')"
          test "$vis" = "public"
          test "$(nproc)" -ge 4
          awk '/MemTotal/{exit !($2 >= 12000000)}' /proc/meminfo
          df -Pk "$GITHUB_WORKSPACE" | awk 'NR==2{exit !($4 >= 12000000)}'
          docker version >/dev/null
          docker info >/dev/null
          python -m pip install --disable-pip-version-check --no-cache-dir -q 'harbor==0.23.0'
          python - <<'PY'
          import importlib.metadata
          assert importlib.metadata.version("harbor")=="0.23.0"
          PY

      - name: Verify exact authority and current public route bytes
        run: |
          set -euo pipefail
          A=capsules/tb_science_rank6_20261007_v1/TB_SCIENCE_RANK6_ONE_SLOT_EXECUTION_AUTHORITY_20261007_V1.json
          R=capsules/tb_science_canary_v3_execution/canonical/runtime
          M=capsules/tb_science_canary_v3_execution/canonical/governance/TB_SCIENCE_TERMINAL_EXECUTION_MANIFEST_V1.json
          test "$(git hash-object "$A")" = "3c0193eb50c55d72eaf19dcc0b6f084e84b12ff2"
          test "$(git hash-object "$R/harbor_science_planner_v1.py")" = "fe7c0ce885197217774638df382aeb6f68ff38dd"
          test "$(git hash-object "$R/harbor_science_agent_v1.py")" = "5557efd21f1a433ad16766def3775a79c459784b"
          test "$(git hash-object "$R/harbor_command_policy.py")" = "a525773417291c7a4841bf35e1baff5370350d0d"
          test "$(git hash-object "$R/harbor_environment_transport.py")" = "ec46f648214a37bb16025d5ef2593efdf59f0d79"
          test "$(git hash-object "$R/acceptance_capability_source_gate_v2.py")" = "b168b131f6383e158bdc0d931439d14e61f2a5de"
          test "$(git hash-object "$R/tb_science_conservative_censoring_reducer_v1.py")" = "3b48ea534d606cf47a8321b56427353066393577"
          test "$(git hash-object "$M")" = "6dfa880b1f68881531afbba6ca211681801fd19b"

      - name: Verify one-use semantic boundary without task exposure
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          p="capsules/tb_science_rank6_20261007_v1/TB_SCIENCE_RANK6_ONE_SLOT_EXECUTION_AUTHORITY_20261007_V1.json"
          x=json.load(open(p))
          slot="terminal-bench-science/koopman-mfg-id::trial-0"
          assert x["target_predicate"]=="TB_SCIENCE_GE_58_7"
          assert x["frozen_target"]["threshold_percent"]==58.7
          assert x["frozen_target"]["required_successes"]==124
          assert x["frozen_target"]["fail_lock_failures"]==87
          assert x["authorized_slot"]["slot_id"]==slot
          assert x["authorized_slot"]["schedule_rank"]==6
          assert x["authorized_slot"]["task_digest"]=="sha256:ba37bd6173cc7d21aff84b2124524ef2ec60cb85f5f9cef2c42e6111ad9ed18f"
          assert slot not in x["permanently_consumed_slots"]
          assert len(x["permanently_consumed_slots"])==5
          e=x["execution_semantics"]
          assert e["slots_authorized"]==1 and e["retries_per_slot"]==0
          assert e["slot_replacement"] is False and e["denominator_shrink"] is False
          assert x["fresh_reality_authority"]["authorized"] is True
          assert x["fresh_reality_authority"]["units"]==1
          assert x["fresh_reality_authority"]["zero_incremental_spend_hard_stop"] is True
          assert x["execution_authority"] is True
          assert x["promotion_authority"] is False
          assert x["exact_route"]["compiled_llama_cpp_cache_allowed"] is False
          print("TB_SCIENCE_RANK6_AUTHORITY_AND_CARRIER_PREFLIGHT_PASS")
          PY
