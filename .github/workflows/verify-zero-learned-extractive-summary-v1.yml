name: Verify zero-learned extractive summary V1

on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/runtime/zero_learned_extractive_summary_v1.py'
      - 'canonical/tests/test_zero_learned_extractive_summary_v1.py'
      - 'canonical/governance/LIVEBENCH_ZERO_LEARNED_EXTRACTIVE_SUMMARY_CANDIDATE_V1.json'
      - 'verify_zero_learned_extractive_summary_v1.py'
      - '.github/workflows/verify-zero-learned-extractive-summary-v1.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run copied subject tests
        run: python -m unittest canonical.tests.test_zero_learned_extractive_summary_v1 -v
      - name: Run independent invariant verifier
        run: python verify_zero_learned_extractive_summary_v1.py
      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zero-learned-extractive-summary-receipt
          path: zero_learned_extractive_summary_receipt.json
          if-no-files-found: error
