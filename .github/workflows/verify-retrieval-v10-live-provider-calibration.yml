name: Verify Retrieval V10 live provider calibration
on:
  push:
    branches:
      - verify/retrieval-v10-live-provider-calibration-20261003
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact V3 lattice blobs
        run: |
          test "$(git hash-object canonical/runtime/retrieval_live_provider_arena_v3.py)" = "b6f8d479b5028761bf993d1db23a58e5a4e25196"
          test "$(git hash-object canonical/tests/test_retrieval_live_provider_arena_v3.py)" = "147438e3c3ef91262c2bfbcd6e2712620315285f"
      - name: Deterministic V3 tests
        run: PYTHONPATH=. python canonical/tests/test_retrieval_live_provider_arena_v3.py
      - name: Execute residual multi-query live arena
        run: |
          PYTHONPATH=. python canonical/runtime/retrieval_live_provider_arena_v3.py | tee live_provider_v3_output.json
          python - <<'PY'
          import json
          d=json.load(open("live_provider_v3_output.json"))
          assert d["usable_case_count"] >= 4, d
          assert d["open_world_completeness_claim"] is False
          print("LIVE_PROVIDER_V3_SUMMARY", json.dumps(d,sort_keys=True))
          PY
