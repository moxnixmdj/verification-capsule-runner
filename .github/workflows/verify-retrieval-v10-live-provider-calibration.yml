name: Verify Retrieval V10 live provider calibration
on:
  push:
    branches:
      - verify/retrieval-v10-live-provider-calibration-20261003
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact optimized strategy blobs
        run: |
          test "$(git hash-object canonical/runtime/retrieval_live_provider_arena_v2.py)" = "8fb64595ba6c8872f6086d2c226758afb4b7e493"
          test "$(git hash-object canonical/tests/test_retrieval_live_provider_arena_v2.py)" = "a27c9c8586031ef2a71a65e67bafa479b441afb5"
      - name: Deterministic optimized strategy tests
        run: PYTHONPATH=. python canonical/tests/test_retrieval_live_provider_arena_v2.py
      - name: Execute optimized live provider arena
        run: |
          PYTHONPATH=. python canonical/runtime/retrieval_live_provider_arena_v2.py | tee live_provider_v2_output.json
          python - <<'PY'
          import json
          d=json.load(open("live_provider_v2_output.json"))
          assert d["successful_task_count"] >= 10, d
          assert len(d["route_metrics"]) >= 5, d
          assert d["open_world_completeness_claim"] is False
          print("LIVE_PROVIDER_V2_SUMMARY", json.dumps(d,sort_keys=True))
          PY
