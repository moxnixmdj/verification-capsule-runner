name: Verify Retrieval V10 live provider calibration
on:
  push:
    branches:
      - verify/retrieval-v10-live-provider-calibration-20261003
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact V6 ESLint residual blobs
        run: |
          test "$(git hash-object canonical/runtime/retrieval_live_provider_arena_v6.py)" = "a68d50052941bf587502b6ab6e620a21fb66f14f"
          test "$(git hash-object canonical/tests/test_retrieval_live_provider_arena_v6.py)" = "fe9869fe4aa0de2785d6f824ab250a01c497dd83"
      - name: Deterministic V6 tests
        run: PYTHONPATH=. python canonical/tests/test_retrieval_live_provider_arena_v6.py
      - name: Execute final ESLint residual live arena
        run: |
          PYTHONPATH=. python canonical/runtime/retrieval_live_provider_arena_v6.py | tee live_provider_v6_output.json
          python - <<'PY'
          import json
          d=json.load(open("live_provider_v6_output.json"))
          assert d["usable_case_count"] == 1, d
          assert d["open_world_completeness_claim"] is False
          print("LIVE_PROVIDER_V6_SUMMARY", json.dumps(d,sort_keys=True))
          PY
