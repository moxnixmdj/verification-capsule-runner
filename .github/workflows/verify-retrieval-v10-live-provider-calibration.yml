name: Verify Retrieval V10 live provider calibration
on:
  push:
    branches:
      - verify/retrieval-v10-live-provider-calibration-20261003
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact package bridge blobs
        run: |
          test "$(git hash-object canonical/runtime/retrieval_registry_repository_bridge_v1.py)" = "1bd144d253c23616de751f4707f355505ca2c41f"
          test "$(git hash-object canonical/tests/test_retrieval_registry_repository_bridge_v1.py)" = "e3fdf7ba44cf13e46cca59bbb92e010ea3c6abd3"
      - name: Deterministic bridge tests
        run: PYTHONPATH=. python canonical/tests/test_retrieval_registry_repository_bridge_v1.py
      - name: Execute live registry repository bridge
        run: |
          PYTHONPATH=. python canonical/runtime/retrieval_registry_repository_bridge_v1.py | tee registry_bridge_output.json
          python - <<'PY'
          import json
          d=json.load(open("registry_bridge_output.json"))
          assert d["successful_case_count"] >= 4, d
          assert d["reverse_index_construction_supported"] is True
          assert d["open_world_completeness_claim"] is False
          print("REGISTRY_REPOSITORY_BRIDGE_SUMMARY", json.dumps(d,sort_keys=True))
          PY
