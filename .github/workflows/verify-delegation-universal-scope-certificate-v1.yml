name: Verify Brain delegation universal scope certificate v1

on:
  push:
    branches:
      - 'verify/delegation-universal-scope-v1-fast-20261002-1917'
    paths:
      - 'capsules/delegation_universal_scope_certificate_v1/**'
      - '.github/workflows/verify-delegation-universal-scope-certificate-v1.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact mirrored Brain and historical blob identities
        env:
          EXPECTED_JSON: '{"canonical/governance/DELEGATION_UNIVERSAL_SCOPE_CERTIFICATE_V1.json":"6b34d5508f5ea924863b1d09d16f575b987f6a26","canonical/runtime/delegation_universal_scope_certificate_v1.py":"7f3a766795298bc3249b70de38729950609b368f","canonical/tests/test_delegation_universal_scope_certificate_v1.py":"6b94d78dfa0fc199ba92c6f5c90a87b799650c31","canonical/runtime/delegation_whole_scope_candidate_v2.py":"f1a93ee66d90093de61dc17c6ebf2e24073df522","canonical/runtime/delegation_whole_scope_proof_v2.py":"928466401b36e4f3b09c517950cc050432a0616f","canonical/governance/OPUS55_TERMINAL_PROOF_PROTOCOLS_V1.json":"eb4bca0fe6a015d49d2854998fbe046c979c7ea9","canonical/governance/ABSOLUTE_DOMINANCE_SCOPE_COMPLETENESS_RECONCILIATION_V1.json":"ec2d931860e7cd7d9f73a658706f8c33fca3a10d","canonical/governance/OPUS55_ACCEPTANCE_PREDICATE_EVIDENCE_BINDINGS_V2.json":"af83f4899169e81017767c3316ddcf6b61da5ef6","canonical/governance/DELEGATION_SCOPE_EQUIVALENCE_RELATION_V1.json":"52392515cd4de672f82f8afac82a41d3ce442656","canonical/governance/DELEGATION_TEMPORAL_PROOF_TRANSPORT_V1.json":"b6d03ac87d8cd9d308f127e4e525e48be0d0a971","canonical/verification/DELEGATION_TEMPORAL_PROOF_TRANSPORT_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json":"5278abb7fcaa6b97189b67598c75e4df395e1788","canonical/verification/DELEGATION_SCOPE_GATE_V2_V3_REPAIR_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json":"eddfe01c81ae9d6e9453c4bc30737f9ddd273a83","canonical/governance/BEHAVIORAL_CONTRACT_REGISTRY_V1.json":"ee187f611a0e82b2de495ee377682f39bc31dd31","historical/BEHAVIORAL_CONTRACT_REGISTRY_V1__afa00109031d638fef32cc3fe10be18786605c39.json":"afa00109031d638fef32cc3fe10be18786605c39"}'
        run: |
          python - <<'PY'
          import json, os, subprocess
          root="capsules/delegation_universal_scope_certificate_v1"
          expected=json.loads(os.environ["EXPECTED_JSON"])
          bad=[]
          for rel,want in expected.items():
              got=subprocess.check_output(["git","hash-object",f"{root}/{rel}"],text=True).strip()
              if got != want:
                  bad.append(f"{rel}: {got} != {want}")
          if bad:
              raise SystemExit("\n".join(bad))
          print(f"EXACT_BLOB_IDENTITY_PASS {len(expected)}/{len(expected)}")
          PY
      - name: Prove current delegation contract slice equals transport-verified historical slice
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("capsules/delegation_universal_scope_certificate_v1")
          def delegation_row(path):
              d=json.loads(path.read_text(encoding="utf-8"))
              rows=d.get("contracts") or d.get("behaviors") or d.get("rows") or d.get("behavioral_contracts") or []
              return next(x for x in rows if x.get("behavior_id")=="TASK_TO_DELEGATION_GRAPH_001")
          current=delegation_row(root/"canonical/governance/BEHAVIORAL_CONTRACT_REGISTRY_V1.json")
          historical=delegation_row(root/"historical/BEHAVIORAL_CONTRACT_REGISTRY_V1__afa00109031d638fef32cc3fe10be18786605c39.json")
          if current != historical:
              raise SystemExit("DELEGATION_CONTRACT_SEMANTIC_DRIFT")
          print("DELEGATION_CONTRACT_SEMANTIC_SLICE_UNCHANGED")
          PY
      - name: Run fail-closed universal-scope and transport tests
        env:
          PYTHONPATH: capsules/delegation_universal_scope_certificate_v1
        run: python -m unittest -v canonical.tests.test_delegation_universal_scope_certificate_v1
      - name: Compile universal-scope certificate
        run: python capsules/delegation_universal_scope_certificate_v1/canonical/runtime/delegation_universal_scope_certificate_v1.py
