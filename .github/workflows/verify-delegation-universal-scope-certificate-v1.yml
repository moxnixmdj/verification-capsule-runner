name: Verify Brain delegation universal scope certificate v1

on:
  pull_request:
    branches: [main]
    paths:
      - 'capsules/delegation_universal_scope_certificate_v1/**'
      - '.github/workflows/verify-delegation-universal-scope-certificate-v1.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact mirrored Brain blob identities
        env:
          EXPECTED_JSON: '{"canonical/governance/DELEGATION_UNIVERSAL_SCOPE_CERTIFICATE_V1.json":"e3f6f3675faff54a6a789daeedb3ebb660f5dec3","canonical/runtime/delegation_universal_scope_certificate_v1.py":"2447ab22a2f1c4647485c31a3ad84c2e6c67f5a4","canonical/tests/test_delegation_universal_scope_certificate_v1.py":"771bcadbc47195365825f69ad33539ef86eef880","canonical/runtime/delegation_whole_scope_candidate_v2.py":"f1a93ee66d90093de61dc17c6ebf2e24073df522","canonical/runtime/delegation_whole_scope_proof_v2.py":"928466401b36e4f3b09c517950cc050432a0616f","canonical/governance/OPUS55_TERMINAL_PROOF_PROTOCOLS_V1.json":"eb4bca0fe6a015d49d2854998fbe046c979c7ea9","canonical/governance/ABSOLUTE_DOMINANCE_SCOPE_COMPLETENESS_RECONCILIATION_V1.json":"ec2d931860e7cd7d9f73a658706f8c33fca3a10d","canonical/governance/OPUS55_ACCEPTANCE_PREDICATE_EVIDENCE_BINDINGS_V2.json":"af83f4899169e81017767c3316ddcf6b61da5ef6"}'
        run: |
          python - <<'PY'
          import json, os, subprocess
          root="capsules/delegation_universal_scope_certificate_v1"
          expected=json.loads(os.environ["EXPECTED_JSON"])
          bad=[]
          for rel,want in expected.items():
              got=subprocess.check_output(["git","hash-object",f"{root}/{rel}"],text=True).strip()
              if got != want:
                  bad.append(f"{rel}: {got} != {want}")
          if bad:
              raise SystemExit("\n".join(bad))
          print(f"EXACT_BLOB_IDENTITY_PASS {len(expected)}/{len(expected)}")
          PY
      - name: Run fail-closed universal-scope tests
        env:
          PYTHONPATH: capsules/delegation_universal_scope_certificate_v1
        run: python -m unittest -v canonical.tests.test_delegation_universal_scope_certificate_v1
      - name: Compile universal-scope certificate
        run: python capsules/delegation_universal_scope_certificate_v1/canonical/runtime/delegation_universal_scope_certificate_v1.py
