name: Verify terminal parent portfolio runner V1
on:
  pull_request:
    branches: [main]
    paths:
      - canonical/runtime/terminal_parent_portfolio_runner_v1.py
      - canonical/tests/test_terminal_parent_portfolio_runner_v1.py
      - canonical/governance/TERMINAL_PARENT_PORTFOLIO_RUNNER_BINDING_V1.json
      - canonical/governance/TERMINAL_WAVE_EXECUTION_AUTHORITY_V1.json
      - canonical/governance/TERMINAL_ROUTE_SPECIFIC_EXECUTOR_MANIFEST_V1.json
      - .github/workflows/verify-terminal-parent-portfolio-runner-v1.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify exact Brain dependency closure
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object 'canonical/runtime/terminal_parent_portfolio_runner_v1.py')" = "431b62e503a6a179f19339ae5e0ab6948424a650"
          test "$(git hash-object 'canonical/tests/test_terminal_parent_portfolio_runner_v1.py')" = "6ab2a7921a0bfa7f573cfd75a307c6fa4b2481d3"
          test "$(git hash-object 'canonical/governance/TERMINAL_PARENT_PORTFOLIO_RUNNER_BINDING_V1.json')" = "4e33f458b7e04e31f372f69cabc1cfbe5ee6507f"
          test "$(git hash-object 'canonical/runtime/m0a_raw_source_terminal_suite_v2.py')" = "63b5daacfa5623c38228d41f6a84e548890d252d"
          test "$(git hash-object 'canonical/runtime/m0a_raw_source_brain_candidate_v2.py')" = "0aac96d27068bdad379703c1b0b8a7a32cacb2e2"
          test "$(git hash-object 'canonical/runtime/bounded_predicate_argument_semantics.py')" = "8303231779d6fe8c7fb740e3bbaa492914d4eba9"
          test "$(git hash-object 'canonical/runtime/explicit_compound_requirement_decomposer.py')" = "06da82ccd7cf5ba37b78d1d664b5638caa4e1956"
          test "$(git hash-object 'canonical/runtime/source_grounded_coreference.py')" = "3734d79c4d4db5fa78798d8421130090d15fe358"
          test "$(git hash-object 'canonical/runtime/requirement_acceptance_compiler.py')" = "c306ac6191e2d6f6d84445d7a698eeec8676a0ef"
          test "$(git hash-object 'canonical/runtime/independent_acceptance_model.py')" = "710298c5d7154b5a3c2a4a1700420c40cb2fa55a"
          test "$(git hash-object 'canonical/runtime/native_artifact_cross_format_proof_v1.py')" = "904eb61171f5ee775ff7824c1be7778d7acc4a23"
          test "$(git hash-object 'canonical/runtime/native_artifact_cross_format_candidate_v1.py')" = "f3e5090647dd9029ab9f46efd06dc0c0d0addbc3"
          test "$(git hash-object 'canonical/runtime/ooxml_package_transaction.py')" = "970be62854c918b306ae3f62989009bfbd0e8fc7"
          test "$(git hash-object 'canonical/runtime/pdf_native_edit_transaction.py')" = "b9f673ffe0474d00a598089077ad93db40c00dd8"
          test "$(git hash-object 'canonical/runtime/contract_native_proof_suites.py')" = "0210790c7dd705ef328e1b55d529a30c5c6c3337"
          test "$(git hash-object 'canonical/runtime/contract_native_brain_candidate.py')" = "afc18af1d1da6f25166c6cc57dcbc0cd3070bb85"
          test "$(git hash-object 'canonical/runtime/portfolio_multiplex_terminal_instrumentation_v1.py')" = "dd8fba0f27691002babbc7ad1fc6b65d7bb57282"

      - name: Install native artifact verifier dependencies
        run: python -m pip install --disable-pip-version-check --no-input python-docx openpyxl python-pptx pypdf
      - name: Run exact parent runner regression and full sentinel rehearsal
        run: PYTHONPATH=. python -m unittest -v canonical.tests.test_terminal_parent_portfolio_runner_v1
      - name: Verify no-abort terminal failure semantics
        run: |
          python - <<'PY'
          from pathlib import Path
          src=Path("canonical/runtime/terminal_parent_portfolio_runner_v1.py").read_text()
          assert 'raise RuntimeError("PARENT_PORTFOLIO_FAIL_CLOSED:"' not in src
          assert "return list(out[\"receipts\"])" in src
          print("PARENT_FAILURE_RETURNS_RECEIPTS_WITHOUT_ABORT=PASS")
          PY
      - name: Emit rehearsal result
        run: PYTHONPATH=. python canonical/runtime/terminal_parent_portfolio_runner_v1.py
