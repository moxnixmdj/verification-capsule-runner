name: Qualify ROR Source Authority Binding

on:
  pull_request:
    branches: [main]
    paths:
      - canonical/runtime/bound_capabilities/source_authority_binding_ror.py
      - canonical/tests/test_source_authority_binding_ror_qualification.py
      - .github/workflows/qualify-source-authority-ror.yml

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Exact-byte and independent live ROR qualification
        run: python canonical/tests/test_source_authority_binding_ror_qualification.py
