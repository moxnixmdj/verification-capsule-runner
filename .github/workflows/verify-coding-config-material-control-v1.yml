name: Verify coding config material control V1
on:
  pull_request:
    branches: [main]
    paths:
      - 'verification/coding_config_material_control_v1/**'
      - '.github/workflows/verify-coding-config-material-control-v1.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run exact fast-controller counterfactual material-control tests
        run: python -m unittest -v verification/coding_config_material_control_v1/test_material_control.py
