name: Verify Root2 exact-18 content-address repair

on:
  pull_request:
    branches: [main]
    paths:
      - "verify_root2_18_content_address_repair_v1.py"
      - "subject/root2_18_content_address_repair/**"
      - ".github/workflows/verify-root2-18-content-address-repair-v1.yml"
  push:
    branches: [main]
    paths:
      - "verify_root2_18_content_address_repair_v1.py"
      - "subject/root2_18_content_address_repair/**"
      - ".github/workflows/verify-root2-18-content-address-repair-v1.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15-intel
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact content-address binding
        run: python verify_root2_18_content_address_repair_v1.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: root2-18-content-address-repair-v1
          path: root2_18_content_address_repair_receipt.json
          if-no-files-found: error
