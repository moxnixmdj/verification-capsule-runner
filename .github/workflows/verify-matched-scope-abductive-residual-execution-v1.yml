name: Verify matched scope abductive residual execution v1
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/matched_scope_abductive_residual_execution_v1/**"
      - ".github/workflows/verify-matched-scope-abductive-residual-execution-v1.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact Brain blobs
        run: |
          cd capsules/matched_scope_abductive_residual_execution_v1
          python - <<'PY'
          import hashlib,json,pathlib
          m=json.load(open("EXPECTED_BRAIN_BLOBS.json",encoding="utf-8"))
          for src,expected in m["exact_brain_blobs"].items():
              data=pathlib.Path(src).read_bytes()
              actual=hashlib.sha1(f"blob {len(data)}\0".encode()+data).hexdigest()
              assert actual==expected,(src,actual,expected)
          print("exact Brain blobs: PASS")
          PY
      - name: Execute exact abductive cut
        run: |
          cd capsules/matched_scope_abductive_residual_execution_v1
          export PYTHONPATH=.
          python canonical/tests/test_matched_scope_abductive_residual_execution_v1.py
          python canonical/runtime/matched_scope_abductive_residual_execution_v1.py > /tmp/result.json
          python - <<'PY'
          import json
          d=json.load(open("/tmp/result.json"))
          assert d["status"]=="EXACT_WEAKEST_SUFFICIENT_RESIDUALS_COMPUTED"
          assert d["target_count"]==11
          assert d["verified_rule_count"]==11
          assert len(d["primitive_residual_facts"])==22
          assert d["minimum_joint_residual_size"]==22
          assert d["shared_residual_groups"]==[]
          assert d["all_targets_reachable"] is True
          assert d["capability_credit_delta"]==0 and d["family_credit_delta"]==0
          assert d["execution_authority"] is False and d["promotion_authority"] is False
          print("matched abductive residual: PASS")
          PY
