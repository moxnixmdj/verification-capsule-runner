name: Verify Root2 current compressed v3
on:
  pull_request:
    branches: [main]
    paths:
      - "capsules/root2_current_compressed_v3/**"
      - ".github/workflows/verify-root2-current-compressed-v3.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact candidate blobs
        run: |
          test "$(git hash-object capsules/root2_current_compressed_v3/ROOT2_FIXED_BAR_ROUTE_INVENTORY_V1.json)" = "b273b4313d329e962ac749151d086e2b1e93c5ca"
          test "$(git hash-object capsules/root2_current_compressed_v3/CURRENT_ZERO_REALITY_MINIMUM_CUT_V8.json)" = "8aba43f58cbf9b14aacc1aa259b2a63c32044fbb"
          test "$(git hash-object capsules/root2_current_compressed_v3/ROOT2_ROOT3_MINIMUM_EXECUTION_FRONTIER_V1.json)" = "4adb0e9642e26566e4e413e8a1951603b9013168"
          test "$(git hash-object capsules/root2_current_compressed_v3/CURRENT_TERMINAL_AUTHORITY_V1.json)" = "7ecfb9a6aad5ea57ce552e5eb3f9ee0e25f29ac7"
      - name: Verify Root2 current compressed v3 semantics
        run: python capsules/root2_current_compressed_v3/verify.py
