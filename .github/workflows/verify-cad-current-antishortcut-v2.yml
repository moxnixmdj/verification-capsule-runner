name: Verify current CAD anti-shortcut v2
on:
  pull_request:
    branches: [main]
    paths:
      - canonical/runtime/cad_t0_route_specific_candidate_v1.py
      - canonical/tests/test_cad_current_render_equivalent_mutations_v2.py
      - .github/workflows/verify-cad-current-antishortcut-v2.yml
permissions:
  contents: read
jobs:
  exact-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exact current Brain candidate blob
        run: test "$(git hash-object canonical/runtime/cad_t0_route_specific_candidate_v1.py)" = "aa32750b220a023617938b7be9476f6b3aac6704"

  mutation:
    name: mutation-${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: same-y-split
            method: test_same_y_split
          - name: word-split
            method: test_word_split
          - name: numeric-token-split
            method: test_numeric_token_split
          - name: same-line-source-reversal
            method: test_same_line_source_reversal
          - name: nested-tspan-wrapper
            method: test_nested_tspan_wrapper
          - name: attributes-comments-whitespace-entities
            method: test_attributes_comments_whitespace_entities
          - name: line-dom-order
            method: test_line_dom_order
          - name: coordinate-spellings
            method: test_coordinate_spellings
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: PYTHONPATH=.:canonical/runtime python -m unittest -v canonical.tests.test_cad_current_render_equivalent_mutations_v2.CadCurrentRenderEquivalentMutationTests.${{ matrix.method }}

  full-eight-family:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check --no-input "pydantic>=2,<3" "cadquery==2.6.1"
      - run: PYTHONPATH=.:canonical/runtime python -m unittest -v canonical.tests.test_cad_t0_route_specific_candidate_v1
