name: Verify concrete terminal parent launcher V2
on:
  pull_request:
    branches: [main]
    paths:
      - canonical/runtime/terminal_parent_portfolio_launcher_v1.py
      - canonical/tests/test_terminal_parent_portfolio_launcher_v1.py
      - canonical/runtime/terminal_parent_portfolio_runner_v1.py
      - canonical/tests/test_terminal_parent_portfolio_runner_v1.py
      - canonical/governance/TERMINAL_PARENT_PORTFOLIO_RUNNER_BINDING_V1.json
      - canonical/governance/TERMINAL_PARENT_CASE_PRODUCER_MANIFEST_V1.json
      - canonical/runtime/terminal_wave_launch_authority_reducer_v1.py
      - .github/workflows/verify-concrete-terminal-parent-launcher-v2.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify exact Brain launcher closure
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object 'canonical/runtime/terminal_parent_portfolio_launcher_v1.py')" = "f5a94b07ac48d05ec90aa062ab567e4aa608f2fc"
          test "$(git hash-object 'canonical/tests/test_terminal_parent_portfolio_launcher_v1.py')" = "fccb3f99e3577d332ffd4ade9e6677daeefd4a47"
          test "$(git hash-object 'canonical/runtime/terminal_parent_portfolio_runner_v1.py')" = "05c9adf60b76a8b2e0ccd139a90c4c7fd9d34449"
          test "$(git hash-object 'canonical/tests/test_terminal_parent_portfolio_runner_v1.py')" = "7735a0851c87463b1a19bd9ffcfbee44812296f0"
          test "$(git hash-object 'canonical/governance/TERMINAL_PARENT_PORTFOLIO_RUNNER_BINDING_V1.json')" = "5212f5996dbc83e87a308b8c9d9d1d9ed3da5aab"
          test "$(git hash-object 'canonical/governance/TERMINAL_PARENT_CASE_PRODUCER_MANIFEST_V1.json')" = "5ff24e390056ba8e980ad3b88116149869ee85ce"
          test "$(git hash-object 'canonical/runtime/terminal_wave_launch_authority_reducer_v1.py')" = "48ceab4c3e97b80f25d1ae648348b5c86ad0ba54"
          test "$(git hash-object 'canonical/runtime/terminal_prequalification_reducer.py')" = "da929015fafabed2b5a134a2e95b6bff2f47349c"
          test "$(git hash-object 'canonical/governance/ACTIVE_TERMINAL_PROOF_BASIS_V1.json')" = "9c60356ab509a16df5104777f360b9fb18255842"
          test "$(git hash-object 'canonical/governance/EXACT_FOUR_PORTFOLIO_PREQUALIFICATION_V1.json')" = "5d20073180fdcfd6e36145f4c820271eb1ee275f"
          test "$(git hash-object 'canonical/governance/GLOBAL_TERMINAL_REPLACEMENT_POPULATION_PROTOCOL_V2.json')" = "d1dc7f28738ba24a3ca5919755e03190fbf30939"
          test "$(git hash-object 'canonical/governance/TERMINAL_ROUTE_SPECIFIC_EXECUTOR_MANIFEST_V1.json')" = "e90ad37c122899fc2de567bcfda054803ffc9c36"
      - name: Run launcher authority and concrete-runner wiring regressions
        run: PYTHONPATH=. python -m unittest -v canonical.tests.test_terminal_parent_portfolio_launcher_v1
      - name: Derive full live terminal launch authority
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python canonical/runtime/terminal_wave_launch_authority_reducer_v1.py . | tee terminal_launch_authority_verdict.json
          python - <<'PY'
          import json
          v=json.load(open('terminal_launch_authority_verdict.json'))
          assert v.get('pass') is True, v
          assert v.get('launch_authority') is True, v
          assert v.get('execution_authority') is True, v
          assert v.get('failed_predicates') == [], v
          assert v.get('route_count') == 12, v
          assert v.get('terminal_results_observed') == 0, v
          assert v.get('fresh_terminal_evidence_consumed') == 0, v
          PY
