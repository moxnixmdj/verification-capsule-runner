name: Verify robust candidate retrieval on RE2-SS
on:
  pull_request:
    branches: [main]
    paths:
      - 'verification/brain_robust_candidate_ranker.py'
      - 'verification/test_robust_candidate_re2ss_transfer.py'
      - '.github/workflows/verify-robust-candidate-re2ss.yml'
permissions:
  contents: read
jobs:
  transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --quiet numpy pandas pyarrow huggingface_hub fsspec
      - run: PYTHONPATH=. python verification/test_robust_candidate_re2ss_transfer.py
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: robust-candidate-re2ss
          path: verification/re2ss_candidate_transfer_result.json
          if-no-files-found: warn
