name: Verify generic atomic execution claim V1
on:
  push:
    branches: ['verify/generic-atomic-execution-claim-v1-current-20261004']
  pull_request:
    paths:
      - 'generic_atomic_execution_claim_v1.py'
      - 'verify_generic_atomic_execution_claim_v1.py'
      - '.github/workflows/verify-generic-atomic-execution-claim-v1.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python verify_generic_atomic_execution_claim_v1.py
