name: Verify professional R12 V7 binding
on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/**'
      - '.github/workflows/verify-professional-r12-v7.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
