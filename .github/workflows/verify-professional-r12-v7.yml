      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Bind exact Brain blobs
        run: |
          set -euo pipefail
          test "$(git hash-object 'canonical/governance/PROFESSIONAL_QUALITY_R12_ROOT_SUBJECT_BINDING_20261010_V1.json')" = "6eb32264e98bf0b36d48ad3519f9c7c88757d0d7"
          test "$(git hash-object 'canonical/runtime/professional_quality_r12_root_subject_binding_verify_v1.py')" = "4b775d22ca65e38391b115101bf4aa08ccad2142"
          test "$(git hash-object 'canonical/tests/test_professional_quality_r12_root_subject_binding_verify_v1.py')" = "d69e8988412effea782545c4da860e71c4e51218"
          test "$(git hash-object 'canonical/governance/PROFESSIONAL_QUALITY_P1_V7_DECLARED_SYSTEM_SUBJECT_20261010_V6.json')" = "1d598bc8757017ceb34928d0df9f5fce859ef868"
