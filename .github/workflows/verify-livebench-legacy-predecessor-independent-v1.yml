name: Independent LiveBench Legacy Predecessor Replay
# trigger-v2: subject blobs unchanged
on:
  push:
    branches:
      - verify/livebench-legacy-predecessor-20261004-v1
    paths:
      - canonical/runtime/livebench_legacy_visible_constraint_compiler_v1.py
      - canonical/runtime/livebench_legacy_visible_constraint_compiler_v2.py
      - canonical/runtime/livebench_legacy_predecessor_compiler_audit_v1.py
      - .github/workflows/verify-livebench-legacy-predecessor-independent-v1.yml

permissions:
  contents: read

concurrency:
  group: livebench-legacy-predecessor-independent-v1
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact replay dependencies
        run: python -m pip install --disable-pip-version-check pyarrow huggingface_hub
      - name: Fetch exact removed predecessor only
        run: |
          python - <<'PY'
          from huggingface_hub import hf_hub_download
          p = hf_hub_download(
              repo_id="livebench/instruction_following",
              repo_type="dataset",
              revision="4f7ab12f0d47848da31de92bd7cc3d7d4acfe695",
              filename="data/test-00000-of-00001.parquet",
              local_dir="/tmp/livebench-predecessor",
          )
          print(p)
          PY
      - name: Replay visible compiler against all 200 removed rows
        run: |
          mkdir -p /tmp/receipt
          python canonical/runtime/livebench_legacy_predecessor_compiler_audit_v1.py             --parquet /tmp/livebench-predecessor/data/test-00000-of-00001.parquet             --output /tmp/receipt/livebench-legacy-predecessor-independent-v1.json
      - name: Upload independent receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livebench-legacy-predecessor-independent-v1
          path: /tmp/receipt/livebench-legacy-predecessor-independent-v1.json
          if-no-files-found: error
