name: Verify CAD T0 multiplex scorer
on:
  pull_request:
    branches: [main]
    paths:
      - 'independent/cad_t0_multiplex_scorer.py'
      - 'test_cad_t0_multiplex_scorer.py'
      - '.github/workflows/verify-cad-t0-multiplex-scorer.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Bind exact Brain scorer blob
        run: |
          set -euo pipefail
          test "$(git hash-object independent/cad_t0_multiplex_scorer.py)" = "89833581dc4ac67498753feb94e2ff69bad3b7f1"
      - name: Compile
        run: python -m py_compile independent/cad_t0_multiplex_scorer.py
      - name: Run fail-closed scorer tests
        run: PYTHONPATH=independent python -m unittest -v test_cad_t0_multiplex_scorer.py
