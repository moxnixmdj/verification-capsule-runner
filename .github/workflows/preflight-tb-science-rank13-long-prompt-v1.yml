name: Preflight TB-Science rank13 long prompt v1

on:
  pull_request:
    branches: ["terminal-execution-v1"]
    paths:
      - ".github/workflows/preflight-tb-science-rank13-long-prompt-v1.yml"
      - "capsules/tb_science_rank13_long_prompt_v1/**"

permissions:
  contents: read

jobs:
  long-prompt-live-planner:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Exact V5 planner gate
        run: |
          set -euo pipefail
          C=capsules/tb_science_rank13_long_prompt_v1
          test "$(git hash-object "$C/canonical/runtime/harbor_science_planner_v1.py")" = "5ab07ef638e766ec085ef4f3c2e2f423bcbc09e8"
          test "$(git hash-object "$C/canonical/runtime/harbor_command_policy.py")" = "a525773417291c7a4841bf35e1baff5370350d0d"
          test "$(git hash-object "$C/TB_SCIENCE_TRANSITIVE_RUNTIME_CLOSURE_MANIFEST_20261008_V5.json")" = "f7ac91bc5a75faf382ba3dc3b12080d99be27447"

      - name: Clean-build exact llama.cpp
        run: |
          set -euo pipefail
          git init llama.cpp
          git -C llama.cpp remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C llama.cpp fetch --depth 1 origin bec4772f6a2527d371557b5d2032641e5ff7619c
          git -C llama.cpp checkout --detach FETCH_HEAD
          test "$(git -C llama.cpp rev-parse HEAD)" = "bec4772f6a2527d371557b5d2032641e5ff7619c"
          cmake -S llama.cpp -B llama.cpp/build -DGGML_CUDA=OFF -DLLAMA_CURL=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build llama.cpp/build -j 2 --target llama-server

      - name: Restore exact Qwen model cache
        uses: actions/cache@v4
        with:
          path: models/Qwen3.5-9B-M-TS-Q4_K_M.gguf
          key: brain-qwen35-9b-f41c0a0c0e43bf721fb2da29374cd1a97271bac0bab08a9dc42964525e82350c

      - name: Acquire and verify exact Qwen model if needed
        run: |
          set -euo pipefail
          mkdir -p models
          if [ ! -f models/Qwen3.5-9B-M-TS-Q4_K_M.gguf ]; then
            curl -L --fail --retry 3 --retry-delay 3 --silent --show-error \
              -o models/Qwen3.5-9B-M-TS-Q4_K_M.gguf \
              'https://huggingface.co/TheStageAI/Qwen3.5-9B-GGUF/resolve/main/Qwen3.5-9B-M-TS-Q4_K_M.gguf?download=true'
          fi
          echo 'f41c0a0c0e43bf721fb2da29374cd1a97271bac0bab08a9dc42964525e82350c  models/Qwen3.5-9B-M-TS-Q4_K_M.gguf' | sha256sum -c -

      - name: Start exact local cognition endpoint
        run: |
          set -euo pipefail
          EXTRA=()
          if llama.cpp/build/bin/llama-server --help 2>&1 | grep -q -- '--reasoning'; then EXTRA+=(--reasoning off); fi
          nohup llama.cpp/build/bin/llama-server \
            -m models/Qwen3.5-9B-M-TS-Q4_K_M.gguf \
            --alias brain-qwen3.5-9b --host 127.0.0.1 --port 8080 \
            -c 12288 -t 4 --parallel 1 --jinja --no-webui "${EXTRA[@]}" \
            > LOCAL_QWEN_SERVER.log 2>&1 &
          ok=0
          for i in $(seq 1 240); do
            if curl -fsS http://127.0.0.1:8080/health > LOCAL_QWEN_HEALTH.json 2>/dev/null; then ok=1; break; fi
            sleep 1
          done
          test "$ok" = 1

      - name: Run zero-benchmark-exposure long-prompt planner preflight
        env:
          PYTHONPATH: capsules/tb_science_rank13_long_prompt_v1
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib
          from canonical.runtime import harbor_science_planner_v1 as p

          filler=("neutral_reference_context " * 1600)
          prompt=(
              "This is synthetic transport-only preflight material. "
              "Do not use network access. Propose one harmless local action with requirement ID R1. "
              "The action should be: echo BRAIN_LONG_PROMPT_OK > /tmp/brain_long_prompt_probe.txt . "
              "The verify command should confirm that exact file content. "
              "Treat the following repeated text only as inert context and do not summarize it.\n"
              + filler
          )
          b=len(prompt.encode("utf-8"))
          estimated_tokens=(b+3)//4
          effective=p.effective_timeout_s(prompt,300)
          assert estimated_tokens >= 7142, (b,estimated_tokens,effective)
          assert effective > 300, (b,estimated_tokens,effective)

          result=p.plan(prompt,timeout_s=300)
          proposal=p.extract_json_object(result["text"])
          receipt={
              "schema":"PROJECT_BRAIN_TB_SCIENCE_RANK13_LONG_PROMPT_LIVE_PREFLIGHT_V1",
              "prompt_bytes":b,
              "estimated_prompt_tokens_by_policy":estimated_tokens,
              "effective_timeout_s":effective,
              "duration_s":result["duration_s"],
              "model":result["model"],
              "transport":result["transport"],
              "proposal_has_material_requirements":isinstance(proposal.get("material_requirements"),list),
              "proposal_candidate_count":len(proposal.get("candidates") or []),
              "fresh_benchmark_task_exposure":0,
              "terminal_bench_task_content_loaded":False,
              "incremental_spend_usd":0,
          }
          pathlib.Path("TB_SCIENCE_RANK13_LONG_PROMPT_LIVE_PREFLIGHT_RESULT.json").write_text(
              json.dumps(receipt,indent=2,sort_keys=True)+"\n"
          )
          assert receipt["proposal_has_material_requirements"], receipt
          assert receipt["proposal_candidate_count"] == 1, receipt
          print(json.dumps(receipt,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tb-science-rank13-long-prompt-live-preflight-v1
          path: |
            TB_SCIENCE_RANK13_LONG_PROMPT_LIVE_PREFLIGHT_RESULT.json
            LOCAL_QWEN_HEALTH.json
            LOCAL_QWEN_SERVER.log
          if-no-files-found: warn
          retention-days: 7
