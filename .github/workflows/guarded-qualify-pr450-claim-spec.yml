name: Guarded Qualify PR450 Claim Spec Operand Binding

on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/runtime/bound_capabilities/objective_claim_operand_binding.py'
      - 'canonical/runtime/bound_capabilities/generic_evidence_claim_relation.py'
      - 'canonical/tests/test_objective_claim_operand_binding.py'
      - 'qualification/pr450/**'
      - '.github/workflows/guarded-qualify-pr450-claim-spec.yml'

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Guarded one-shot qualification
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python execution_guard/github_actions_guarded_run_live.py \
            --plan qualification/pr450/guarded_launch_plan.json \
            --receipt qualification/pr450/execution_guard_receipt.json
      - name: Upload exact qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: guarded-pr450-claim-spec-qualification
          if-no-files-found: error
          path: |
            qualification/pr450/execution_guard_receipt.json
            guarded-pr450-claim-spec-qualification-report.json
