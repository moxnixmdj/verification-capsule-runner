name: Verify native artifact cross-format v1
on:
  pull_request:
    branches: [main]
    paths:
      - capsules/native_artifact_cross_format_v1/**
      - .github/workflows/verify-native-artifact-cross-format-v1.yml
  push:
    branches: [verify-native-artifact-cross-format-v1-20261002]
    paths:
      - capsules/native_artifact_cross_format_v1/**
      - .github/workflows/verify-native-artifact-cross-format-v1.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check --no-input pypdf==6.19.0 Pillow==12.3.0
      - run: cd capsules/native_artifact_cross_format_v1 && PYTHONPATH=. python -m unittest -v canonical.tests.test_native_artifact_cross_format
